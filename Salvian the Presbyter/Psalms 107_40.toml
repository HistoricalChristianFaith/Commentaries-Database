[[commentary]]
quote='''
This the general of our forces learned when he entered as a captive the same city of the enemy that he had boasted he would enter that same day as victor. He proved indeed the words of the prophet: "For a man's way is not his own, nor is it in his own power to walk and direct his steps.'' Since he thought his actions were under his own control, he could neither direct his steps nor find the way of safety. So we read: "He poureth contempt upon the prince and causeth him to wander in the wilderness where there is no way. . . . He has been brought to nothing, even as the waters which run continually." In him, indeed, in addition to his actual misfortune, the present judgment of God was clearly shown. He has endured all the sufferings that he had boasted he would inflict on others. Because he trusted that the enemy could be taken without God's aid and consent, he has himself been captured; he claimed foreknowledge and wisdom and has met with disgrace for his presumption; he himself has worn the chains he prepared for others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 10"
