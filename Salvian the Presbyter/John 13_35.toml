[[commentary]]
quote='''
But as for the way of life among the Goths and Vandals, in what single respect can we consider ourselves superior to them, or even worthy of comparison? Let me speak first of their affection and charity, which the Lord teaches us are the chief of virtues, and which he commends not only through the Sacred Scriptures but also in his own words, when he says: "By this shall all men know that ye are my disciples, if ye love one another." Now almost all barbarians, at least those who belong to one tribe, under one king's rule, love one another, whereas almost all the Romans are at strife with one another. What citizen is there who does not envy his fellows? Who shows complete charity to his neighbors? All are indeed far from their neighbors in affection, however near in place; though living side by side, they are far apart in spirit. While this is a most grievous wrong, I wish it were true only of citizens and neighbors. But the situation is still more serious, for not even relations preserve the bonds of kinship. Who renders a brotherly service for his next of kin? Who pays to family affection the debt he knows is due to the name he bears? Who is as closely related by his affections as by blood? Who is not fired with a dark passion of ill will? Whose emotions are not the prey of envy? Who does not look on another's good fortune as his own punishment? Who does not reckon another's good as his own evil? Who finds his own good fortune so ample that he is willing that another should be fortunate also? Most men are now suffering a strange and incalculable evil, in that it is not enough for any man to be happy himself unless another is thereby made wretched.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapter 4"
