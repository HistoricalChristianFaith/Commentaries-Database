[[commentary]]
quote='''
They could have stayed there, then, and were not afraid, but surely the heavenly hand that had dragged them thither to punish the vices of the Spanish compelled them also to cross the straits to devastate Africa. In fact, they themselves confessed that they did not act of their own volition, for they were driven and urged on by a divine command. From this we may learn how great are our misdoings, since to destroy and punish us the barbarians are compelled to move against their will, following the words of the devastator of the land of Israel, the king of the Assyrians, when he said: '' And now without the will of the Lord am I come up against this land? The Lord said unto me, 'Go up against this land, to destroy it.' " And elsewhere the Sacred Word says: "Therefore thus saith the Lord of Hosts, the God of Israel: 'Behold, I will send and take Nabuchodonosor the king of Babylon, my servant, and when he cometh, he shall smite the land of Egypt.' "

From this we may know that all things which are afflicted are indeed smitten by the judgment of God; their overthrow, however, as I have often remarked, is due to sin. So whatever is done on account of sin is not to be ascribed to God, since a deed is rightly ascribed to that cause which has made it unavoidable. For example, a murderer sentenced to death by the judge is actually punished by his own crime; a thief or a man who has committed sacrilege is consumed not by the flames that burn his body, but by his own sin. Whence we see that the Vandals did not cross to Africa because of God's severity but because of the sins of the Romans in that country. By their grave and long continued iniquity these people were forcing the Vandals to come before they actually left their native land. Therefore we must understand that only God's mercy postponed the punishment so long due, and their misdeeds and crimes at length brought upon these sinful people the chastisement they deserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 13"
