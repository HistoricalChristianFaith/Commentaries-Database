[[commentary]]
quote='''
Therefore the apostle, to indicate as far as he might the boundless mercy of God, said: " For when we were yet without strength, in due time Christ died for the ungodly. For scarcely for a righteous man will one die." Certainly in this one sentence he showed us the love of God. For if scarcely any one undertakes to die for the greatest righteousness, Christ dying for our iniquity proved what love he bore us. Why God should have done this, the apostle tells us at once in the words that follow, saying: "God commendeth his love toward us, in that, while we were yet sinners, Christ died for us. Much more then, being now justified by his blood, we shall be saved from wrath through him." He commends his love to us, in that he died for sinners; for a benefit is of greater worth that is given to men unworthy of it.

So he says: "God commends his love toward us." How does he commend it? Surely in that he bestows it on the undeserving. If he had given it to holy men who deserved well of him, he would not seem to have given what was not due, but what he owed them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 10"
