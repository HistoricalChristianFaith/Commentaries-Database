[[commentary]]
quote='''
I might mention countless further examples, but I am afraid that in my effort to give adequate proof I may seem to have composed a whole history. Moses pasturing his sheep in the desert saw a bush burning, heard God from the midst of the bush and received his commands. He was exalted in power and was sent to Pharaoh; he spoke with him, was scorned, but conquered. The Egyptian was struck down, Pharaoh's disobedience was smitten, and not in one way alone, but many, to the end that he should be tortured by a diversity of punishments in consideration of the greatness of his sacrilege. What was the outcome? Ten times he rebelled; ten times he was smitten. What is our conclusion? I think you must recognize that in all these cases God shows equally his care for human affairs and his judgment of them.

In Egypt, indeed, the judgment of God at that time was evidently not single but manifold. For as often as he smote the rebellious Egyptians, so often he judged them. But after the events already told, what happened? Israel was dismissed; after celebrating the Passover they despoiled the Egyptians and departed in wealth. Pharaoh repented, gathered his army, overtook the fugitives, encamped beside them, was separated from them by the darkness; the sea was dried up, Israel crossed over and by the friendly withdrawal of the waves was set free. Pharaoh followed, the sea rolled over him, and he was drowned by the engulfing waves.

I think that the judgment of God has been made clear in these events, and indeed not merely his judgment but also his moderation and patience. For it was due to his patience that the Egyptians in their rebellion were often smitten, to his judgment that for their persistent stubbornness they were condemned to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 9"
