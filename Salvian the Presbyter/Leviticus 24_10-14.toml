[[commentary]]
quote='''
But toward certain individuals and families, as we read, the censure of God was inexorable. Such an instance is that of the man who, when the people rested on the Sabbath day, presumed to gather wood and was killed. For although his action seemed harmless in itself, yet the observance of the day made it sinful. Or the time when two men were contesting with each other, and one, since he had blasphemed, was punished by death. For it is written: "Lo the son of an Israelitish woman, whose father was an Egyptian, went out among the children of Israel; and this son of an Israelitish woman and a man of Israel strove together in the camp; and the Israelitish woman's son blasphemed the name of the Lord, and cursed. And they brought him to Moses." And a little later: "And they put him in ward, that the mind of the Lord might be showed them. And the Lord spake unto Moses, saying, 'Bring forth him that hath cursed without the camp ; and let all that heard him lay their hands upon his head, and let all the congregation stone him.' "

Was not God's judgment immediate and manifest and his sentence pronounced as if the heavenly decision followed the forms of our legal procedure? First the man who had sinned was arrested, then he was led, so to speak, before the judge's seat, thirdly accused and then put into prison, lastly punished by the authority of the divine judgment; furthermore he was not only punished but punished in accordance with evidence given, so that God's justice and not merely his power was seen to condemn his guilt. This truly was meant as an example working toward the correction of all men, so that none should commit thereafter the deed which all the people had punished in one person. For this reason and by this judgment the Lord does all things now and has always done them, that whatever penalties individuals have to bear should work toward the correction of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 11"
