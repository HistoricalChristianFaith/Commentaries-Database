[[commentary]]
quote='''
All other evils pollute those who perform them, not those who merely see or hear them. You may, for instance, hear a man blaspheme, but since your mind disapproves of his sacrilege you are not polluted by it. Or if you happen to be present during a robbery, you are not defiled by the act, inasmuch as it is abhorrent to your principles. The indecencies of the spectacles alone involve actors and audience in substantially the same guilt. For all those who approve such performances and take pleasure in seeing them perform them through the medium of their sight and approval. To such men the words of the apostle apply with a peculiar force, since not only "they which commit such things are worthy of death" but also "those who have pleasure in them that do them."

Therefore in these pictures of vice the whole people commits fornication mentally, and any who happen to come to the spectacle chaste go home from it adulterers. They are guilty of this fornication not only when they go home, but also when they come to the theater, for the very desire of the obscene makes a man unchaste who is hurrying toward an impure spectacle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 3"
