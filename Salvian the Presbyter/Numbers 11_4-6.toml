[[commentary]]
quote='''
Perhaps at this juncture you may answer that God did once exercise such care for men, but now does not at all. Why should we believe this? Because we do not now eat manna daily as the Israelites did? But we reap fields full of grain at the harvest. Because we do not catch quails that fly into our hands? But we devour all kinds of birds, cattle and beasts. Because we are not granted waters gushing from clefts opened in the rocks? But we pour the fruits of our vines into our wine cellars. I have more to add: we ourselves, who say that the children of Israel at that time were cared for by God but that we are neglected by him, would absolutely reject the choice of their condition if we could receive their past favors in exchange for our present benefits. For we should not be willing to lose what we now have in order to gain what they then enjoyed, not that we are better off than the Israelites were, but that they too, who were then daily fed by the ministry of the stars and of God, preferred the old accustomed fodder for their bellies to the favors they enjoyed. They were actually sad at their vile recollections of carnal foods, pining away with a vulgar yearning for onions and garlic, not because their former diet was more wholesome, but because they acted just as we do now. They loathed what they had and longed for what they lacked. We would rather praise bygone days than the present, not that we should prefer to revive the past if the choice were given us, but because it is a well-known failing of the human mind always to desire what it lacks, and, as the proverb says, "Another's goods please us, and ours please others more."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 10"
