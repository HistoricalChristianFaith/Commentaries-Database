[[commentary]]
quote='''
God bade his servants keep all scandal from their sight altogether, and so he said: "Whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart," From this we can fully understand how chaste our Savior wished us to be, who even shut out licentiousness from our eyes. Knowing that our eyes are in a way the windows of our souls, and that all evil desires make their way into the heart through the eyes as their natural passageways, he wished us to destroy such desires utterly while they were still outside that they might not spring up within us and put forth their deadly shoots within the soul, if they once germinated in our eyesight. Therefore the Lord said that the wanton glances of lustful men are adulterous, meaning that a man who truly wishes to shun adultery must keep a watch on his eyes. The Savior, indeed, wishing to cultivate a most genuine and perfect sanctity in his worshippers, ordered them to avoid scrupulously even the least offences, on the ground that according to the cleanness of his eyesight, so also is the purity of a Christian's life. Just as a man's eye could not receive a mote of dust without impairing his sight, so our life should not permit any stain of dishonor to find a place in it. Whence come the following words of the Lord: "If thine eye offend thee, pluck it out, and if thy hand offend thee, cut it off; it is better for thee, that one of thy members perish, than that thy whole body be cast into hell." If, therefore, according to the word of God, we are dragged down into hell by scandalous actions, surely it is right to sacrifice our eyes and hands in order to escape this punishment. No man should deprive himself of his members, but in the case of certain domestic relationships so necessary to us that we have come to consider them as eyes or hands, it is right to deprive ourselves of their present service in order to escape the torture of eternal fire. When the choice lies between comfort and life, it is certainly better for the Christian to forfeit his convenience and gain life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 8"
