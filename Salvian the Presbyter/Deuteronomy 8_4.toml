[[commentary]]
quote='''
Add that the men experienced in no part of their bodies the growth or losses natural to human beings, their nails did not grow, nor their teeth decay, their hair stayed always of one length, their feet were not worn by the march, their clothing was not tattered, their shoes not broken, and thus the honor granted to the men themselves was even sufficient to dignify their mean garments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 9"
