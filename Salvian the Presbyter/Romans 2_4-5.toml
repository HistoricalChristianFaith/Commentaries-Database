[[commentary]]
quote='''
How great is the deceptive blindness of sinful minds! We are suffering from the condemnation of God's judgment and still do not acknowledge that we are being judged. Some of the saints wonder that the others who have thus far not endured any such fate are not reformed by our example! Not even those of us who are already smitten by God are being corrected by the torments justly due to our wickedness. What intolerable pride is ours! However many are enduring the punishment that their sins require, no one deigns to acknowledge the cause of his trouble. The reasons for our pride are perfectly obvious: even though we are at last suffering a little, we do not yet suffer as we deserve. So great is the mercy of God that he does not wish us to endure the full penalties for our misdeeds, but only a part of what is due; he chastens the wicked, but not to the full measure of their sin. He wishes us to acknowledge our misdoings rather than to endure their penalties, to the end that by his loving and salutary correction he may show us what we deserve to suffer, but not inflict on us the stripes we deserve. In this he follows the words of the blessed apostle, who said: "Dost thou not know that the goodness of God leadeth thee to repentance? But after thy hardness and impenitent heart thou treasurest up unto thyself wrath against the day of wrath."

In truth our actions suit the words of the apostle, for God calls us to repentance, but we treasure up wrath; he invites us to receive pardon, but we daily heap up our offences. We bring force to bear on him by our iniquities; we ourselves arm the divine wrath against us. We compel God against his will to take vengeance on our monstrous crimes; we give him scarcely any opportunity to spare us. For although no token of injustice can ever light on him or appear in him, our actions are such that if he did not take vengeance on our sins he would seem to be unjust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapter 9"
