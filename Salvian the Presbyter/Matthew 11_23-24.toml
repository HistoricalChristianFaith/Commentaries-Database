[[commentary]]
quote='''
But, you say, none now deserve the end of those men, for none are to be compared with them, in evil doing. Perhaps that is true, still what do we make of the fact that the Savior himself said that all who have spurned his Gospel are worse than they? And at Capernaum he said: "If the mighty works which have been done in thee had been done in Sodom, it would have remained until this day. But I say unto you, that it shall be more tolerable for the land of Sodom in the day of judgment than for thee." If he said the people of Sodom are less to be condemned than all who neglect the Gospels, then we who in most of our actions show our neglect of the Gospel teachings are in graver danger, especially since we are not willing to be content with crimes long familiar, that seem a part of our daily life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 9"
