[[commentary]]
quote='''
Perhaps I am doing an injustice in reckoning the actions of the rich as sins, for when they kill their poor slaves they consider it an act of justice, not a crime. Nor is this all; they also abuse their privilege in their vile breaches of chastity. What rich man keeps his marriage vows, who among them does not plunge headlong into passionate lust, who does not use his household slaves as harlots and pursue his madness against any one on whom the heat of his evil desires may light? They illustrate well the words of the Holy Scriptures about such men as they: "They are become as horses rushing madly on the mares." Is it not a proof of what I just said, that the average man wishes to make his own by physical union whatever his eyes have beheld with desire?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 5"

[[commentary]]
quote='''
When the master of the house acts as husband of the maidservants, the mistress is not far removed from the mean position of the slave. Who among the rich men of Aquitania did not so act? Who among them has not been considered by his shameless maids, and with good, reason, as either adulterer or husband? For, as the prophet said: ''They were as fed horses in the morning; everyone neighed after his neighbor's wife." Those of whom he spoke sinned perhaps less grievously, and, I think, with less intention of wrong than did our men. The Aquitanians more truly resembled the post horses: they whinnied not after a few women merely, but after all their household maids — that is, after their own herds — and, like those; beasts called the stallions of the herd, they waxed wanton with the heat of their intoxicating passion, and attacked whatever woman was first exposed to the onslaught of their shameless lust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 4"
