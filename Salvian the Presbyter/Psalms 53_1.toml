[[commentary]]
quote='''
Finally, however inhuman the atrocities involved, all the crimes involving injury to their fellow men are not enough for them, but they must needs turn the blasphemous violence of their mad minds against the Lord also. For it is written of the wicked: "They set their mouth against the heavens, and their tongue walketh through the earth. . . . And they say, 'How doth God know, and is there knowledge in the Most High?' " And again: "The Lord shall not see, neither shall the God of Jacob regard it."

To such men this prophetic saying may well be applied: "The fool hath said in his heart, 'There is no God.' " For they who declare that nothing is seen by God are very near to denying his actual substance, as they deny his sight, and when they say that he sees nothing they deny his very existence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 9"
