[[commentary]]
quote='''
When the blessed David had suffered the insulting scorn of Nabal the Carmelite, since he himself postponed vengeance, he received his revenge at once at the hand of God. So when, shortly after, his enemy had been overwhelmed and killed by the hand of the Lord, he spoke thus: "Blessed be the Lord, that hath pleaded the cause of my reproach from the hand of Nabal."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 3"
