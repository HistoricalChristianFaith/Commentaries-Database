[[commentary]]
quote='''
I have told the fate of the most famous cities. What of the many others in various parts of Gaul? Have they not fallen, too, because of like vices on the part of their citizens? All were so completely possessed by their crimes that they did not fear any danger they had foreknowledge of captivity and did not dread it. Fear indeed was taken away from these sinful men to prevent them from the exercise of caution. Therefore, though the barbarians were settled almost within their sight, men felt no fear, the cities remained unguarded. Such was the blindness of their hearts, or rather of their sins, that although doubtless no one wished to die, no one did anything to ward off death. Everything was in the grip of carelessness and sloth, negligence and gluttony, drunkenness and sleep, as has been written of such men: "Because a deep sleep from the Lord was fallen upon them." A deep sleep indeed fell upon them that destruction might follow closely. For when, as it is written, a sinner's iniquity is full and he is due to perish, foreknowledge is taken from him, that he may not escape his doom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 14"
