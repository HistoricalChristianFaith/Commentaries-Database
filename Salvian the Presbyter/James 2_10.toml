[[commentary]]
quote='''
Let us, however, come to an agreement with those who do not wish us to tell of the greater commands of the Lord, for the reason perhaps that they think they are fulfilling his lesser precepts, though it is not sufficient for salvation to perform the lesser commandments while scorning the greater. It is written: "For whosoever shall keep the whole law, and yet offend in one point, he is guilty of all." Although for this reason it is not sufficient for us to obey all God's small and least commands, yet I agree to speak only of these, in order to show that most Christians have not performed even the least and slightest of their duties.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 8"
