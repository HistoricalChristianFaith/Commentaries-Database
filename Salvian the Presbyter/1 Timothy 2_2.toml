[[commentary]]
quote='''
In adversity there is double need to appease God, and in prosperity to avoid grieving him. Surely he must be appeased when he is angry, and must not be alienated when he is propitious; for our adversities come to us through his wrath, our prosperity through his favor. But we do everything by contraries.

How, do you ask? Listen. First, if won over by his own mercy ----for we never so live that we deserve his favor ---- if, as I say, at any time won over by his own mercy God gives us peaceful seasons, plentiful crops, tranquillity rich in all good things and abundance increasing beyond our hopes, we let ourselves be so corrupted by great prosperity and fortune, we let ourselves be so depraved by insolent manners that we altogether forget God and ourselves. Although the apostle says that every benefit of the peace given by God depends on this: "That we lead a quiet and peaceable life in all godliness and honesty," the only use we make of the quiet he gives is to live in drunkenness and luxury, in wantonness and rapine, in all manner of crime and wickedness. We look on his goodly gift of peace as an opportunity for licentiousness, and take the quiet given by his truce as a chance to sin more freely and safely.

Therefore we are unworthy of heavenly gifts, who make no good use of God's kindness, and see in the means of good works only material for vice. Hence it comes that the peace which we so abuse itself works against us, and is actually harmful to us, since we use it to our detriment. Is this worthy of belief? We change nature itself by our wickedness, and the good things that God has made as his loving gift to us are turned to evil by our wanton lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 11"
