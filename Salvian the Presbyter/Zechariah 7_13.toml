[[commentary]]
quote='''
Since this is the case and since we keep none of the Lord's commands, why do we complain of God, who has far more right to complain of us? Why should we grieve that he does not hear us, when we ourselves do not hear him? What right have we to whisper that God does not look upon the earth, when we ourselves do not look up to the heavens? What reason have we to be vexed that our prayers are despised by the Lord, whose commands we despise?

Suppose that we were equal to our Lord; what chance is there for just complaint when each side receives the same treatment it gives? And this entirely overlooks a point easily proved, that we are very far from receiving what we give, since God really treats us much more kindly than we do him. For the moment, however, let us act on the assumption that I proposed. The Lord himself spoke thus: "I cried unto you and ye did not hear me: you too shall cry unto me and I shall not hear you." What is more fair and just than this? We have not hearkened, therefore he does not hear us. We have not been mindful of him, therefore he does not consider us. What mortal master, I ask, is content to treat his underlings according to this rule, that he will scorn them only in proportion to their contempt of him? And yet we do not stop with such injurious scorn of God as mortal masters receive from their slaves, since the greatest contempt a slave can show is in not doing what he has been ordered. We, however, bend all our efforts and energy not only to neglecting our orders, but even to acting directly contrary to them. For God commands us all to love one another, but we rend each other in mutual hatred. God enjoins us all to give our goods to the poor, but we plunder other men's goods instead. God orders every Christian to keep his eyes pure; how many men are there who do not wallow in the filth of fornication?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 9"
