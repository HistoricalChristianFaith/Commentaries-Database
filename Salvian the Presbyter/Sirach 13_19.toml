[[commentary]]
quote='''
Why do I dwell on these petty details and speak in a sort of allegorical fashion, when absolutely unconcealed crimes make it clear that the wealthy commit not mere thefts but highway robbery on a grand scale? How often do you find a rich man's neighbor who is not himself poor, who is really secure in his acts and position? Indeed by the encroachments of overpowerful men, weaklings lose their property or even their freedom along with their goods, so that it was not without reason that the Sacred Word alluded to them both, saying: "Wild asses are the prey of lions in the wilderness; so poor men are a pasture for the rich." And yet not only the poor but almost the whole human race is suffering this tyranny.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 4"
