[[commentary]]
quote='''
But why do I speak of single individuals? The children of Israel in their journey through the desert, because they longed for their accustomed meat, lost a part of their number. The desire for meat had not yet been forbidden them, but God, I think, wished to further the observance of the law by the suppression of rebellious desires. He intended the whole people to learn the more easily how earnestly one should avoid what God forbade in his divine writings, since even those acts injured him which he had not yet forbidden by law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 10"
