[[commentary]]
quote='''
"Love your enemies," said the Savior, "do good to them that hate you, and pray for them which despitefully use you and persecute you." Who could keep all these commandments'? Who would deign to follow God's commands in respect to his enemies, I do not say in wishes, but even in words? Even if a man compels himself to do so, still it is his lips alone that act, and not his mind; he lends the service of his voice to the action without changing the feeling of his heart. Therefore, even if he forces himself to say a prayer for his adversary, his lips move, but he does not really pray.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 2"
