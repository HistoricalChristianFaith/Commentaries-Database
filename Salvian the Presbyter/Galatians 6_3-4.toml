[[commentary]]
quote='''
I know it seems to most men intolerable that we should be called worse than barbarians. What possible good does it do us to have this seem intolerable? Our condition is made so much the more serious if we are worse than they and yet insist on believing ourselves better. "For if a man think himself to be something," the apostle said, "when he is nothing, he deceiveth himself. But let every man prove his own work." We ought to put our trust in our works, not in our opinion; in reason, not lust; in truth, not in our will alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 13"
