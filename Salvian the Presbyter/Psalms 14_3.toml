[[commentary]]
quote='''
But certainly, you object, even though there are so many who persecute good men, there must be some who come to the rescue of those in distress, and, as it is written, "deliver the poor and needy out of the hand of the wicked." "There is none that doeth good, no, not one:" as the prophet showed by these words, good men are so rare that scarcely one seems to remain among us. Who offers help to those who are distressed and suffering, when even the priests of the Lord make no resistance to the violence of the unscrupulous? The majority of the clergy either say nothing, or, if they do speak, their words are no more effective than silence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapter 5"
