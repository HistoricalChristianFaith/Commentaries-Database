[[commentary]]
quote='''
Since this is the case, what logical reason have we for deluding ourselves by a false notion into the belief that the good name of Christian can be of any possible help to us in the evils we commit? The Holy Spirit says that not even faith, without good works, can benefit Christian men. Yet surely to have faith requires much more than the name alone, for the name is the mere instrument by which a man is addressed, whereas faith is the fruit of the spirit. That this same fruit of faith is profitless without good works, the apostle testifies when he says: "Faith without good works is dead." And again he says: "For as the body without the spirit is dead, so faith without works is dead also." He adds also certain harder sayings for the confusion of those who delude themselves by their false claims to the Christian faith.

"Yea, a man may say: 'Thou hast faith and I have works; show me thy faith without thy works, and I will show thee my faith by my works.' " By this, indeed, he shows that good acts serve also as witnesses of the Christian faith, because unless a Christian has performed good works, he cannot prove his faith at all, and since he cannot prove that it exists, it must be considered as altogether non-existent. For he shows at once that it must be considered as nothing, in his additional words to the Christian: "Thou belie vest that there is one God; thou doest well: the devils also believe, and tremble." Consider what the apostle meant by this. Let us not be angry at the divine testimony but assent to it; let us not speak against it but profit by it. "Thou believest," says the Divine Word to the Christian, "that there is one God; thou doest well: the devils also believe, and tremble." Was not the apostle in error when he compared the faith of a Christian to that of a devil? Surely not, but wishing to demonstrate what was said above, that without good works a man should claim no merit through pride in his faith, for this reason he says that the devils also believe in God. The intent is, of course, that as the devils, though they believe in God, still persist in their wickedness, the sort of faith that they hold is like that of certain men who, while they assert their belief in God, still do not cease to do evil. Moreover, the apostle adds, for the confusion and condemnation of sinful men, that the devils not only believe in the name of God, but fear and tremble before it. Which is as much as to say: " Why do you flatter yourself, O man, whoever you are, for your belief, which without fear and obedience to God is as nothing? The devils have some advantage over you in this. For you have but one thing alone, and they have two: you have your belief, but not fear; they have belief and fear alike."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapters 1-2"
