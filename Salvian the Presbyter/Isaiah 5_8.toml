[[commentary]]
quote='''
You evict your neighbors from their little farms, those nearest you from their houses and property. Would you "be placed alone in the midst of the earth," as it is written? This is the one end you cannot gain. Seize all that you can, occupy by force all that you can, still you shall always find a neighbor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapter 11"
