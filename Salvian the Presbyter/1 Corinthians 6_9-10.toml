[[commentary]]
quote='''
Nor do I know which of them are worse in the sight of God, since in the Sacred Scriptures they are condemned by one and the same decree. "Neither effeminate, nor abusers of themselves with mankind, shall inherit the kingdom of God," said the apostle. This makes it the more lamentable and deplorable that such a sin should appear to be the wrongdoing of the whole city, and that the honor of the Roman name should be branded with the infamy of prodigious wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 19"
