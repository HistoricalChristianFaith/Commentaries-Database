[[commentary]]
quote='''
Lastly, to say nothing of our other sins, who is there among laymen, except a very few, that does not constantly have the name of Christ on his lips to swear by it? Hence this is the oath most commonly used by nobles and baseborn men alike: "By Christ I do this ... ; by Christ I act thus ... ; by Christ I am not going to say anything else ... ; by Christ I am not going to do anything else." And what results? The abuse has been carried so far that, as we said before about heathen barbarians, Christ's name seems now to be not a binding oath but a mere expletive. For among the great majority this name is held to be so trivial that men never have less intention of doing a thing than when they swear by Christ to do it. Although it is written: "Thou shalt not take the name of the Lord thy God in vain," reverence for Christ has fallen so low that among all the vain words of this age scarcely any seems more vainly used than the name of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 15"
