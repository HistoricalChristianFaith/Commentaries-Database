[[commentary]]
quote='''
Christ orders us not to quarrel. Who obeys this order? He not only gives the command, but insists on it so far that he bids us renounce those things about which a dispute has arisen, provided we may thus end the suit. "For," he says, "if any man will sue thee at the law, and take away thy coat, let him have thy cloak also." I ask who there are who yield to the attempts of their adversaries to despoil them; further, who there are who do not try to rob their opponents in turn? For we are so far from leaving them other property in addition to our coats, that if we can find any way to do it we take away coats and cloaks as well from our enemies. Indeed, so eagerly do we obey the Lord's commands that it does not satisfy us to refuse our adversaries even the least part of our garments, unless we rob them of everything we possibly can, as far as the circumstances permit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 6"
