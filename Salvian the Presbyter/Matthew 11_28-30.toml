[[commentary]]
quote='''
What is more right and fitting than that those whom their Lord seemed especially to have favored by his gifts should themselves make an earnest effort to please him by their religious worship, particularly since God lays no heavy or burdensome demands on us? For he does not call on us to plow or hoe, to spade up the earth or prepare the ground for vines, nor, to sum up, does he exact from his slaves what we require of ours. What does he himself say? "Come unto me, all ye that labor and are heavy laden, and I will give you rest; take my yoke upon you and learn of me, for I am meek and lowly of heart, and ye shall find rest unto your souls; for my yoke is easy, and my burden is light."

So we see that the Lord calls us not to labor but to rest. What does he exact of us, what does he order us to offer him, save only faith, chastity, humility, sobriety, mercy and sanctity? All these assuredly do not burden but adorn us. Nor is this all; they adorn our present life to the end that they may adorn even more the life to come. O good and loving master, of inestimable mercy! He has given us the gifts of religion at the present time that he may later reward us for the gifts he now gives!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 2"
