[[commentary]]
quote='''
"Whosoever hateth his brother," says the apostle, "is a murderer." We may know from this that there are many murderers who think themselves innocent, because, as we see, murder is committed not only by the hand of him that kills, but also by the heart of him that hates. For this reason the Savior added to this precept a still harsher decree, saying: "Whosoever is angry with his brother without a cause shall be in danger of the judgment." Anger is the mother of hatred. Hence the Savior wished to shut out wrath, that hatred might not spring from it. If then not only hatred but even wrath makes us guilty in God's judgment, we clearly see that as no one in the world is free from anger, so no one can be free from conviction of sin. Moreover, God seems to trace every fiber of that precept to its end, and cut off all its fruits and branches, when he says: "But whosoever shall say, 'Thou fool,' shall be in danger of hell fire; whosoever shall say to his brother, 'Racha,' shall be in danger of the council." Many do not know what kind of danger is involved in racha, but they know very well with what slanderous intent men are charged with folly. So, using their knowledge rather than their ignorance, they prefer to expiate in the divine fires the guilt incurred by a form of abuse they understand, rather than to atone before human councils for one that they do not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 2"
