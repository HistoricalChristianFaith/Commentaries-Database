[[commentary]]
quote='''
Indeed, aside from a very few servants of God, what was the whole territory of Africa but one house of vice, like that bronze vessel of which the prophet said: "Woe to the bloody city! to the bronze vessel whose scum is therein, and whose scum hath not gone out from it, because the blood shall not go out from it!" He compared the city, as we see, to a bronze vessel and its iniquity to blood, that we might know that the iniquity of the people in a city is like blood seething in a brazen pot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 14"
