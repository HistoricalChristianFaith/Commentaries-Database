[[commentary]]
quote='''
So you keep airing the question why we Christians who believe in God are more wretched than all other men. The words of the apostle to the churches might have furnished me with a sufficient answer to this: "That no man should be moved by these afflictions; for you yourself know that we are appointed thereunto." Since the apostle says we are meant to endure hardships, miseries and sorrows, why is it strange that we suffer every evil, who are fighting for the sake of enduring all adversities?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 2"
