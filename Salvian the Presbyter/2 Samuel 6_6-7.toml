[[commentary]]
quote='''
But before I continue, let me remind you that a fault of any sort which dishonors God should in no sense seem a trivial matter to anyone. It is never permissible to dishonor an illustrious and powerful man, and anyone who dishonors such a one is held guilty in the eyes of the law and is condemned in due course as responsible for the injurious action. How much more difficult of atonement is the accusation of injury to God! The fault of the wrongdoer always increases in proportion to the position of the person injured, since necesssarily the greater the person of the man who suffers abusive action, the greater is the guilt of the man who commits such action. Wherefore we read in the law that even those who seem to have committed only slight offence against the sacred ordinances have nevertheless been most severely punished; to the end that we might know that nothing pertaining to God should be considered unimportant. Even what seemed to be a petty fault became a grave one, inasmuch as it was an injury to the divine power.

What did Oza, the Levite of God, do against the divine commandment, when he tried to steady the ark of the Lord? There was no law laid down regarding this. Yet immediately he took hold of it, he was struck down, apparently not because he did anything in an impudent fashion or with an undutiful intention, but his very service was undutiful because he exceeded his orders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 10"
