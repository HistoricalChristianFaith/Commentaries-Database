[[commentary]]
quote='''
The same people also murmured at the hardships they underwent, and for this reason were punished by the Lord's rods, not because it is forbidden a man to groan at hardships, but because their murmurs were displeasing to God, inasmuch as they seemed to accuse him of causing them too much labor. From this we should learn how much a man enjoying the blessings of good fortune ought to seek to please God, since it is not even permitted to complain of those ills that seem painful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 10"
