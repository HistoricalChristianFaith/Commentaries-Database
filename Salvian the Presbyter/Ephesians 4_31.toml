[[commentary]]
quote='''
I suppose I seem to be out of my mind in repeating these words, and I can easily bear the appearance of madness in such a case. For the Lord was not speaking senselessly when he enjoined us through his apostle: "Let all clamor be put away from you, with all malice." Both of these evils indeed are ever present with us, but malice more than clamor. Clamor indeed is not always on our lips, but malice is always in our hearts. So I think that if clamor should cease among us, yet malice would remain to the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 8"
