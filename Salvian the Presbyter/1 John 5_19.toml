[[commentary]]
quote='''
Then what a state of things it is, what a holy condition of affairs, that, if a noble begins to be converted to God, he at once loses his noble rank! What honor is paid to Christ among a Christian people in whose eyes religion makes a man ignoble? For as soon as a man has made an attempt to improve himself, he meets the abusive scorn of worse men, and thus all are compelled to some degree of evil living that they may not be considered contemptible. Not without cause did the apostle cry out: "The whole world lieth in wickedness." He spoke truly, for it is right to say that the whole world is lying in wickedness when the good cannot hold their place in it. Indeed, everything is so full of iniquity that either all who live are evil, or the few who are good are tortured by the persecution of the many. Therefore, as I said, if any man of honorable rank devotes himself to religion, he at once ceases to be honored. For when a man has changed his garments, forthwith he changes his rank; if he has been of high degree, he becomes contemptible; if he has been most glorious, he becomes the vilest of the vile; if he has been altogether full of honor, he becomes altogether wretched in aspect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 7"
