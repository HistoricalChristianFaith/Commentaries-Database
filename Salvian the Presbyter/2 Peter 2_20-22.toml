[[commentary]]
quote='''
The blessed apostle Peter also made this plain when he said of the lukewarm and vicious Christians, that is, those who live wicked lives: "For it had been better for them not to have known the truth, than after they had known it, to turn from the holy commandment delivered unto them. But it is happened unto them according to the true proverb, 'The dog is turned to his own vomit again, and the sow that was washed to her wallowing in the mire.' "

To make clear that this was said of those who live under the name of Christian in the vileness and filth of the world, hear what he says of such men in the same passage: "For if, after they had escaped the pollutions of the world through the knowledge of the Lord and Savior Jesus Christ, they are again entangled therein, and overcome, the latter end is worse with them than the beginning."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 19"
