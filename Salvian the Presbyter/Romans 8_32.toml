[[commentary]]
quote='''
Yet why do I say fatherly? for his love is far more than a father's. This is proved by the words of the Savior in the Gospel, when he said: "For God so loved the world, that he gave his only begotten Son for the life of the world." But the apostle also says: "God spared not his own Son, but delivered him up for us all. How hath he not with him also freely given us all things?"

This confirms my former statement, that God loves us more than a father loves his son. It is clear that his love surpasses a man's love for his sons, since for our sake he did not spare his own child. Nay, I add more, he did not spare his righteous Son, his only begotten Son, his Son who is himself God. What more can be said? And this was done for us, that is for wicked, unjust and most irreverent men. Who can justify this love of God toward us, save that his justice is so great that no shadow of injustice can fall on him? As far as human reason is concerned, any man would have acted most unjustly if he had had his good son put to death for his worst slaves. But for this very reason the love of God is the more surpassing and his goodness the more marvellous, that, as far as human weakness is concerned, the greatness of his justice almost bears the appearance of injustice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapters 9-10"
