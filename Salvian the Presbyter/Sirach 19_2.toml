[[commentary]]
quote='''
I myself saw lamentable sights there, with no distinction between boys and old men. The scurrility and levity of all were alike; all vices reigned at once ---- extravagance, drinking bouts, wantonness ---- all the people revelled together. They drank, gamed, committed adultery. Old and honored men waxed wanton at their feasts; men already almost too feeble to live proved mighty in their cups; men too weak to walk were strong in drinking; those whose steps tottered were nimble dancers. What more can be said? Through all that I have recounted they became so degraded that the words of the Sacred Scripture were fulfilled in them: "Wine and women make men of understanding to fall away from God." For while they drink, dice, rape and play the madman, men begin to deny Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 13"
