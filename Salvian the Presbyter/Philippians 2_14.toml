[[commentary]]
quote='''
Our God orders us also to live without murmuring and without complaints. When in the history of the human race have these been unknown? In hot weather we complain of drought, in rainy weather of floods; if it is a bad season for the crops we complain of scarcity, in a good season, of low prices. We long for plenty, and when we get it we object to it. What could be more wicked or more disgraceful than this? We complain of God's mercy even in this, that he gives us what we ask.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 8"
