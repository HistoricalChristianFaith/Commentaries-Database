[[commentary]]
quote='''
Since this is true, and since these commands of the Lord not only fail of being carried out by us, but are practically all reversed, when shall we come to obey his greater precepts'? The Savior said: "Whosoever forsaketh not all that he hath, he cannot be my disciple. . . . And he that taketh not his cross and followeth after me, is not worthy of me." He who calls himself a Christian ought to walk as Christ walked. Certainly not only those who follow the delights and pomps of the world, but even those who abandon worldly interests fail to meet these requirements. Those who make a show of renouncing their wealth do not appear to make their renunciation complete, and those who are thought to be carrying their cross so carry it that they gain more honor in the name of the cross than suffering in its passion. Even though all those men should in good faith accomplish these precepts in some measure, still it is certain that none of them could succeed in walking along the paths of this life as the Savior walked. For the apostle says: "He that saith he abideth in him ought himself also so to walk, even as he walked."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 3"
