[[commentary]]
quote='''
"Christ," the Scripture says, "suffered for us, leaving us an example, that we should follow his steps." So we follow the Savior's steps in the circuses; we follow the Savior's steps in the theaters. Is this the example Christ left for us? We read that he wept, not that he laughed. In both he gave us an example, for weeping is the remorse of the heart, laughter the corruption of uprightness. For this reason he said: "Woe unto you that laugh now; for ye shall weep;" and again: "Blessed are ye that weep now, for ye shall laugh." But we do not think it enough to laugh and rejoice, unless we rejoice in sin and madness, unless our laughter is mixed with impure and disgraceful actions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 5"
