[[commentary]]
quote='''
Even so we read that the Lord spoke also of the king of Tyre through his prophet: ''Son of man, take up a lamentation upon the king of Tyrus, and say unto him, 'Thus saith the Lord God: thou hast been the seal of likeness, and a crown of beauty in the delights of paradise; every precious stone was thy covering, the sardius and topaz and emerald.' " Again he says: ''With silver and with gold hast thou filled thy treasuries, from the multitude of commerce hast thou filled thy storehouses." Do not all these things seem to have been said expressly of the people of Africa? Where are greater treasuries, where is greater commerce, where are fuller storehouses? "With gold," he says, "hast thou filled thy treasuries from the multitude of thy commerce." I add more: Africa was once so rich that the abundance of her commerce seems to have filled not only her own treasuries but those of the whole world as well.

What did the prophet say next? '' Thine heart was lifted up because of thy beauty, because of the multitude of thine iniquities have I cast thee to the ground." How does this apply to the power of Africa, and how does that land seem to have been laid prostrate on the ground? How except that when she lost the height of her former power, she also lost her almost celestial honor? "And I shall bring forth," said the prophet, "a fire from the midst of thee, it shall devour thee." ' What could be truer than this? The fire of sin went forth from the midst of their iniquity, and devoured the happiness of former times. "And all they that know thee among the people shall be sore afflicted over thee." We might think that this phrase did not apply to them, were it not that the destruction of Africa is the sorrow of the human race. "Thou art become destruction," said the prophet, "and never shalt thou be any more." It is only too well known that everything in that province has been completely destroyed; all that we can do is to prevent those evils which are now being punished from being continued forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 14"
