[[commentary]]
quote='''
I know that there are men, utterly lacking in faith and void of the divine truth, who think they have an easy answer to my arguments. They say that if the guilt of unfaithful Christians is so great that they sin more in disregarding the commands of the Lord which they know, than do the heathen tribes in their ignorance, then ignorance has proved of more benefit to the pagans than knowledge, and knowledge of the truth is only an obstacle to the Christians.

My answer must be this: it is not the truth that stands in our way, but our own vices; not the law that does us injury, but our evil ways. In brief, give us good ways of living and the decrees of the law are in our favor; take away our vices and the law helps us. "For we know," the apostle said, "that the law is good, if a man use it lawfully; knowing this, that the law is not made for a righteous man." Therefore, begin to be just, and you shall be free from the law, because the law cannot act against the holy life, in which it consists. "For we know," he said, "that the law is good, if a man use it lawfully; knowing this, that the law is not made for a righteous man, but for the lawless and disobedient, for the unholy, for the ungodly and for sinners, and if there be any other thing that is contrary to sound doctrine." So the law is not so much fighting against you, my friend, as you against the law, nor does it by its good precepts take action against you, but you against it by your evil life. In fact, it is on your side, but you are against it. It gives you good counsel with holy words, while you fight against it with evil deeds, and yet not so much against it as against yourself. To oppose it is to oppose yourself, since in it lie your life and safety. When you desert the divine law, you abandon your own salvation. Thus our complaints of the Lord's law are like those of an impatient invalid against an excellent doctor. When his own fault has increased his illness, he accuses his physician of incompetence. As if, indeed, prescriptions could cure any illness if the patient did not obey them, or the regimen ordered by the physician work a cure if the patient did not follow it. What good can bitter draughts do the stomach if sweet ones are taken immediately after? What good can the silence of those about him do the delirious patient whose own ravings are killing him? Of what avail will the antidote be if the poison is poured over it?

Now in our case the law is the antidote, the poison our wickedness. The antidote of the law cannot cure us who are being killed by the poison of our own vice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapter 1"
