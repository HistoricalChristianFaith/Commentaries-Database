[[commentary]]
quote='''
Therefore all his saints in their sacred books, amid the imminent fear of martyrdom and the swords of the persecutors, demand that the immediate judgment of God be established. For thus said the just man in a psalm: "Judge me, O God, and plead my cause against an ungodly nation." And that this might not be construed as a reference to some future judgment of God, he added at once: "Deliver me from the deceitful and unjust man." Certainly it is the immediate judgment of God that he demands who begs to be freed from the hands of the persecutor. In his consciousness of a just cause the psalmist did well to pray for God's justice rather than for his favor, for the best verdict is always given to the righteous cause if the case is conducted with justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 6"
