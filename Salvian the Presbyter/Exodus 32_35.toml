[[commentary]]
quote='''
Freed from Pharaoh's yoke the people of the Hebrews transgressed near Mount Sinai, and were at once smitten by the Lord for their transgression. For it is written: "And the Lord plagued the people for their delusion concerning the calf which Aaron made." What greater and clearer judgment could God give concerning sinners than that punishment should overtake them forthwith in the midst of their sin? Yet since all the people were guilty, why was not destruction visited on all alike? Surely because the Lord, loving them, smote some with the sword of his sentence, in order to correct the others by their example, and to prove to all at one time his censure in chastising their sin and his affection in pardoning them. For his censure was shown in the punishment, his mercy in the pardon, though disproportionately, for on that occasion he yielded more to mercy than to severity.

Surely then, since our most indulgent Lord shows himself always more prone to mercy than to punishment, even though in punishing a part of the Jewish host by his divine censure he gave some scope to judgment and severity, yet his love claimed the greater portion of the people — a special and peculiar act of mercy to countless men that the punishment might not destroy all who were implicated in the guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 11"
