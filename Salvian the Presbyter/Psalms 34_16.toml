[[commentary]]
quote='''
But perhaps you say that the proof of God's guardianship of the just is useless to our argument, since this is not a general watchfulness of the divine power but merely a special favor granted to the righteous. Note, however, that the Sacred Word testified above that the eyes of the Lord watch over both good and evil. If you still wish to argue the point, consider this, for it follows in the text: "Moreover the face of the Lord is against them that do evil, to cut off the remembrance of them from the earth."

You see that you have no ground for complaint that God does not look upon the unjust also, since you know that he watches all men, but with different effect because of the inequality of their merits. The good indeed are watched by him that they may be preserved, the evil that they may be destroyed. You yourself, who deny that God watches men, have your place with these last; know then that you are not only clearly seen by God, but are without doubt in imminent peril. For since the face of the Lord is upon them that do evil, to cut off remembrance of them from the earth, you, who wickedly say that the eyes of the Lord do not see you, must learn by your destruction the wrath of an all-seeing God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 1"
