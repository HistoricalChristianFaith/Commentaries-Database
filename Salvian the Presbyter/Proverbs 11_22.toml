[[commentary]]
quote='''
A certain man says in his writings: "What else is high office without lofty merits but an honorable title without the man honored, or what is lofty rank without worth but an ornament in the midst of filth,?"

So, to use the same phrase ourselves, what else is a sacred name without merit but an ornament in the midst of filth? The sacred word bore witness to this in the divine writings, saying: "As a jewel of gold in a swine's snout, so is a fair woman which is without discretion." Thus among us also the name of Christian is like a golden ornament; if we use it unworthily, we make ourselves seem like swine wearing jewels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 1"
