[[commentary]]
quote='''
We read that the apostle Timothy was most weak in the flesh. Was this a sign of God's neglect, or did Timothy through his weakness fail to please Christ, willing as he was to be weak in order to please him? Even so the apostle Paul, though Timothy was suffering from serious infirmities, yet permitted him to take and sip only a very little wine; that is, he wished him to have regard for his weakness but not so far as to attain full vigor. And why was this? What other reason could there be but that which he himself has given? "For the flesh lusteth against the spirit, and the spirit against the flesh; and these are contrary," he says, "the one to the other, so that ye cannot do the things that ye would."

It was not without insight that a certain author said in this connection that if the strength of the body prevents us from doing what we wish, the flesh must be weakened in order that we may achieve our desires. For he says: "The weakness of our flesh sharpens the vigor of the mind, and when our limbs are weakened bodily strength is transformed into spiritual virtue. Then our inmost parts no longer seethe with disgraceful passions, and secret desires no longer kindle a diseased mind; our senses do not roam wantonly over various enticements, but the soul alone exults, rejoicing in the weakness of the body as over a defeated adversary."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 3"
