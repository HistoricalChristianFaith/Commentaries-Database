[[commentary]]
quote='''
Against the Midianites also, who, as the Book of Judges relates, had filled all the land like locusts, Gideon was ordered to fight with a few men, not because he had not more in his army, but he was forbidden to lead many men to battle for fear that a multitude might claim some share in the victory as their own. When Gideon had gathered together thirty thousand armed men, the Lord spoke thus to him: "The people that are with thee are too many for me to give Midian into their hands." What followed? He left Gideon, to fight against countless thousands of barbarians, only three hundred men. Indeed, he commanded the force of soldiers to be reduced to such a scanty number in order that their lack of men might prevent any claim of credit for a victory divinely won. Why he did this, the Lord himself declared most plainly: "Lest Israel vaunt themselves against me, saying: 'Mine own hand hath saved me.' ''

Let all the wicked hearken, I say, let all the presumptuous hearken, and all who excel in power; let all men hear what the Lord says: "Lest Israel vaunt themselves against me, saying, 'Mine own hand hath saved me.' "

Let all men hear, I repeat, who utter blasphemies against the Lord, let all hear who put their trust in man. God declares that all men speak against him who presume to think that they can be freed by their own might. Who is there among the Romans who does not hold this opinion? Who is there in our number who does not blaspheme in this respect almost constantly? It is common knowledge that the state has no longer any strength, yet not even now do we acknowledge to whose favor we owe it that we still live. Whenever God gives us a degree of prosperity beyond our hopes and deserts, one man ascribes it to fate, another to chance, another to the strategy of our leaders, another to their foresight, another to the administration, another to his patron, but none to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapters 8-9"
