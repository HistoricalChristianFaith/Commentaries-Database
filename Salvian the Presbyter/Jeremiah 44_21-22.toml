[[commentary]]
quote='''
We cannot therefore console ourselves at all on these grounds, that is, by saying that the former extravagances are not now being committed in all our cities. For the only reason for their abandonment is that cities where they were carried on in the past are no longer in existence, or that in the places where such things used to be done, [means are lacking] to perform them. Thus the spectacles are no longer possible in the cities where they were formerly performed; as God himself said to sinners through his prophet: "The Lord remembered these things and it came into his mind, and the Lord could no longer bear, because of the evil of your doings and because of the abominations which ye have committed; therefore is your land a desolation, and an astonishment and a curse." So it has come to pass that the greater part of the Roman world is become a desolation and an astonishment and a curse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 8"
