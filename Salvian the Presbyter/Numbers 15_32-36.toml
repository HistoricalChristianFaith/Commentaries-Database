[[commentary]]
quote='''
But toward certain individuals and families, as we read, the censure of God was inexorable. Such an instance is that of the man who, when the people rested on the Sabbath day, presumed to gather wood and was killed. For although his action seemed harmless in itself, yet the observance of the day made it sinful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 11"

[[commentary]]
quote='''
When a man of the Israelites had gathered wood on the Sabbath, he was struck down and killed by the judgment and command of God, who is truly a most gentle and merciful judge, who would doubtless have preferred to spare rather than to kill, if the consideration of severity had not outweighed consideration of mercy. For one incautious man perished to save many from perishing thereafter through lack of caution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 10"
