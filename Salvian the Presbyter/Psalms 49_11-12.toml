[[commentary]]
quote='''
Surely, you say, a man who has once been a sinner may have ceased to do wrong. Is there any end to wrongdoing? Do not men give up life sooner than iniquity? What man does not die in his evil pursuits, to be buried with his sins and crimes? Truly, one might apply to such men the words of the prophet: "Their graves are their homes forever, and they are compared to foolish cattle, and are become like them." If only they were like cattle! It would at least have been something gained, to have gone astray through mere brute folly. To have sinned, not through ignorance, but in despite of God, is worse and deserves a heavier penalty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapter 10"
