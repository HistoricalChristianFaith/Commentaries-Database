[[commentary]]
quote='''
I do not mean to deny that all should hasten thither to pray to God, but he who enters to win God's favor should not go out to arouse his anger. The same action should not demand his indulgence and provoke his wrath. It is a monstrous thing for men to keep committing the same sins which they lament having committed, and for those who enter the church to weep for their old misdeeds to go out [to commit new ones].

Go out, did I say? They are usually planning fresh crimes in the very midst of their prayers and supplications. While men's voices do one thing, their hearts do another; while their words lament their past misdeeds their minds plan further wrongs, and thus their prayers increase their guilt instead of winning pardon for it. So the scriptural curse is truly fulfilled upon them, that from their very prayers they go out condemned and their petition is turned into sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 9"
