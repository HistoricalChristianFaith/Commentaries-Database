[[commentary]]
quote='''
Hence we see that the power of the Lord's religion was indeed great in a place where his servants were only permitted to escape death at the hands of Christians because they were defended by pagan law. Yet we wonder that such Christians are now suffering at the hands of the barbarians, when they themselves inflicted barbarous treatment on the saints.

So God is just and his judgments are righteous, for, as the Scripture says: "What men have sowed, that shall they also reap." God seems to have referred to the wickedness of the people of Africa, when he said: "Recompense her according to her work; according to all that she hath done do unto her; for she hath been proud against the Lord." Let us then be surprised and angry that they now endure some few trials at the hands of men! Their conduct toward God has been far worse than any treatment they have received, especially if one compares their sufferings and their misdeeds with due consideration of the distinction between the persons concerned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 5"
