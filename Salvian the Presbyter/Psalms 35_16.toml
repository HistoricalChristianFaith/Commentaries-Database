[[commentary]]
quote='''
But perhaps the question will be asked: "In what ways was their hatred manifested?'' In the same manner, of course, in which also the Jews' hatred of Christ was declared when they said to him: ''Thou art a Samaritan and hast a devil,'' when they mocked and cursed him, when they breathed into his face and gnashed their teeth over his head. Whence also the Savior himself says in the Psalms: "All they that saw me laughed me to scorn; they shot out their lips and shook their heads.'' And elsewhere he says: "They have tempted me and laughed me to scorn, they gnashed upon me with their teeth." So is the hatred of the Africans for the monks ---- that is, for the servants of God ---- proved, because they mocked at and cursed them, because they attacked and execrated them, because they did practically everything against them that the wickedness of the Jews contrived against our Savior before they actually shed his divine blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 4"
