[[commentary]]
quote='''
Then what value can our claim to a religious title have for us, what use is it to say we are catholic, to boast that we possess the true faith, to despise the Goths and Vandals, reviling them as heretics, when we are living in a truly heretical depravity? The words of the Divine Scripture addressed to the Jews who trusted in the law are most fittingly applied to us: "How do you say, 'We are wise and the law of the Lord is with us?' . . . Trust ye not in lying words, saying, 'The temple of the Lord, the temple of the Lord, the temple of the Lord, are these.' For if ye thoroughly amend your ways and your doings; if ye oppress not the stranger and the fatherless and the widow and shed not innocent blood in this place, then will I cause you to dwell in this place, in the land that I gave to your fathers for ever and ever.'' By this surely it is shown that if we do not amend our ways, it is useless for us to vaunt our claims to Catholicism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 11"
