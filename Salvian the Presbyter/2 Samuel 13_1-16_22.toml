[[commentary]]
quote='''
This is the first instance of the divine punishment; the first, to be sure, but not the only one, for a long series of great griefs followed and an almost unending succession of misfortunes haunted his household. Thamar was seduced by the mad act of Amnon, and Amnon slain by Absalom. A great crime indeed was committed by the first brother, but its retribution by the other was worse. In these actions David the father was punished alike by both sons' crimes. Two children sinned, but three were ruined by the sin of two; for Thamar suffered the loss of her virginity, while in Amnon also the destruction of Absalom was mourned. And verily you cannot tell for which of the two sons so loving a father mourned the more grievously, the one slain in this world by his brother's hand, or the other who by his own hand was doomed forever. From this time indeed ills were piled up beyond reckoning, according to the word of God. The father long endured the treachery of his son, was driven from his kingdom, and sought in exile an escape from murder. Which was worse, the vice or the bloodthirstiness of his son? By incest he disgraced his father when his attempted parricide failed, and by his diligent heaping up of crime achieved an incest passing the bounds of incest, committing in public, to his father's greater shame, a crime abominable even in secret. It was a mortal sin that he performed against his exiled father, but worse still was the injury wrought by his public incest before the eyes of the whole world.

Must we add to this the spectacle of David's actual flight? Picture this mighty king, so greatly renowned, higher in honor than all others, greater than the world itself, fleeing his whole people with a tiny band of slaves. In comparison with his former state he was needy indeed; in comparison with his wonted train he went alone. He fled in fear, disgrace and sorrow ---- "walking," the Scripture says, "with covered head, and barefoot." He had outlived his former state, exiled from himself, almost, one might say, surviving his own death. He sank so low as to merit the scorn of his own servants, or ---- which is harder yet to bear ---- their pity. So Ziba was fain to feed him, and Shimei did not fear to curse him publicly. God's judgment so changed him from his former self that he endured the open insults of a single enemy ---- he who had made the world to tremble!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 5"
