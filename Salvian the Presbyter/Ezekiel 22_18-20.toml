[[commentary]]
quote='''
Indeed, aside from a very few servants of God, what was the whole territory of Africa but one house of vice, like that bronze vessel of which the prophet said: "Woe to the bloody city! to the bronze vessel whose scum is therein, and whose scum hath not gone out from it, because the blood shall not go out from it!" He compared the city, as we see, to a bronze vessel and its iniquity to blood, that we might know that the iniquity of the people in a city is like blood seething in a brazen pot. And again, not unlike this is another saying of the Sacred Word: "The houses of Israel have all been made a mixture before me of brass and iron and tin and lead, in the midst is silver mixed with the mass. Therefore say this; thus saith the Lord God: 'Inasmuch as ye are all made one mass I shall blow upon you and melt you in the fires of my wrath.' "

How are the very dissimilar metals that the Scriptures have named melted together in one furnace? Surely in the diversity of metals the unlike qualities of men are figured. Thus even silver, that is, metal of the nobler sort, is cast in the same fires as the rest because men have debased the gifts of their nobler natures by their degenerate lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 14"
