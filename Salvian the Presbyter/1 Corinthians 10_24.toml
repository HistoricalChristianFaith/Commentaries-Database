[[commentary]]
quote='''
The Savior said: "What you wish that men should do unto you, do ye even so to them." A part of this saying we know so well that we never overlook it ---- a part we omit so constantly that we do not know it at all. For we know very well what we wish others to do for us, but we do not know what we ourselves ought to do for them. Would that we really did not know! For our guilt would be less if due to ignorance, according to the saying: "He who does not know his lord's will shall be beaten with few stripes; but he who knows and does not do according to his lord's will, shall be beaten with many stripes." But now our offence is the greater because we cherish a part of this sacred command on account of its usefulness to our convenience, and pass over a part of it in injury to God. Paul the apostle also adds to this word of the Lord in his preaching, saying: "Let no man seek his own, but every man another's wealth." And again: "Look not every man on his own things, but every man also on the things of others."

You see then how faithfully he performed the precepts of Christ when, as the Savior bade us take thought for others just as we do for ourselves, he ordered us to consult the welfare of others more than our own, proving himself, to be sure, a good servant of a good master, and a glorious disciple of an exemplary teacher. He so followed in the steps of the Lord, that his own footprints somehow made those of his Master more evident and more clearly formed.

Which of these do we Christians obey, the command of Christ or that of his apostle? I think we obey neither one. For we are so far from doing anything that inconveniences ourselves, that we choose instead to provide first of all for our own convenience, whatever discomfort this involves for others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 6"
