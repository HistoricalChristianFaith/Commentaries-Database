[[commentary]]
quote='''
The blessed Paul said: "For the grace of our Lord Jesus Christ hath appeared, teaching us that, denying ungodliness and worldly lusts, we should live soberly, righteously, and godly in this present world; looking for that blessed hope and glorious appearing of the great God and our Savior Jesus Christ; who gave himself for us, that he might redeem us from all iniquity and purify unto himself a people worthy of acceptance, zealous of good works.

Where are men who do those things for which the apostle says Christ came? Where are those who flee from worldly lusts? Where are those who live righteous and godly lives, who show in their good works that they hold the blessed hope, and by living immaculate lives prove that they await the kingdom of God, since they deserve to receive it? "The Lord Jesus Christ," Paul said, "came to purify unto himself a people worthy of acceptance, zealous of good works." Where is that pure people, that acceptable people, that people of good works, that people of righteousness?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 5"
