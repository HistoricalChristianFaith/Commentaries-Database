[[commentary]]
quote='''
Suppose for the sake of the argument that what we said was true only of all the most powerful and noble. Were the vices that were common to noble and ignoble alike less serious? I mean the hatred and abuse of all holy men, for surely it is a sort of sacrilege to hate those who worship God. Just as the man who injures our slaves thereby harms us, and the man who flogs another's sons tortures the father's affection by his children's suffering, so anyone who injures a servant of God violates the divine majesty, as the Lord said to his apostle: "He that receiveth you, receiveth me, and he that despiseth you, despiseth me.'' Our most gracious and loving Lord shared his honor and disgrace alike with his servants, to the end that no one who injured a servant of God should think that the man alone was hurt by his action, since injury to God would undoubtedly be mingled with the harm inflicted on his followers. Of this God gave us proof, according to his most indulgent love, in these words: "For he that toucheth you toucheth the pupil of my eye.'' To express the tenderness of his love he used the most tender part of the body, that we might clearly understand that God is injured by a contempt of his saints as slight as the touch required to injure the eyesight. So the people of Africa injured and hated the servants of God and God himself in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 3"
