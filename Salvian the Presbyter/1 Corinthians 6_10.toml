[[commentary]]
quote='''
He commanded that no one should curse. Whose speech is not cursing? For curses are always the first instrument of wrath; whatever in our weakness we cannot perform we ardently desire in our anger, and thus in every impulse of our wrathful hearts we use evil wishes as our weapons. Hence every man shows plainly that whatever he wishes may happen to his adversaries he would do to them if he could. Since we all put our tongues to this wicked use on the slightest provocation, our disregard of the Lord's will shows that we think it will be held of small account by God, who gave these commands. But the Holy Scripture says: "Revilers shall not inherit the kingdom of God." From this we may judge how serious and deadly a crime evil-speaking is, which by itself shuts a man out of heaven, even though the rest of his life may have been good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 8"
