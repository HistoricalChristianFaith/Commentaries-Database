[[commentary]]
quote='''
Elsewhere also we read in the words of the prophet: "Do I not fill heaven and earth!" And he himself tells us why he fills all things: "Because I am with you to save you." Obviously then God shows us not merely his rule and the fulness of his power but also the might and benefits that result from its plenitude. For the fulness of divinity bears within it this fruit, that it saves all things that it fills.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 2"
