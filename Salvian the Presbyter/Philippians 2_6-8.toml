[[commentary]]
quote='''
To Christ then — O monstrous folly ! — we offer circuses and mimes, to Christ in return for his benefits, we offer the obscenities of the theaters, to Christ we dedicate the vilest shows as sacrificial offerings. Was this the teaching given us by the Savior, incarnate for our sake? Was this his preaching, or that of his apostles? For this did he endure the humiliation of human nativity and take upon himself a shameful origin in his mortal birth? For this he lay in a manger, whom angels served as he lay there. For this he willed to be wrapped in swaddling clothes, and wearing them ruled heaven; for this he hung upon the cross, whom the world feared as he hung there. "Who though he was rich," the apostle said, "yet for your sakes became poor, that ye through his poverty might become rich." "And being in the form of God," I quote further, "he humbled himself unto death, even the death of the cross." These then are the precepts that Christ gave us at the time of his passion. A glorious return we are making for his suffering, who, having received redemption by his death, offer him in return most disgraceful lives!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 5"
