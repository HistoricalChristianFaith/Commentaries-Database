[[commentary]]
quote='''
To our misfortune this is particularly characteristic of us, the Christians, since, as I have already said, we think wickedness is wisdom. Of these God spoke particularly: "I will destroy the wisdom of the wise and will bring to nothing the understanding of the prudent." When the apostle cried, "if any man seemeth to be wise, let him become a fool, that he may be wise," he meant that if a man wishes to be wise, he should be good, for no one is truly wise unless he is truly good. We, on the contrary, through the viciousness of our perverse spirits and our "reprobate minds" ---- to use the scriptural phrase ----reject goodness in favor of folly. Loving corruption more than wisdom, we think we become daily wiser in proportion as our depravity increases.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 1"
