[[commentary]]
quote='''
Paganism is certainly more tolerable and less evil in men avowedly pagan; the more deadly peril lies in the fact that many who have made their vows to Christ continue to give their real devotion to idols. For did not those who were called Christians turn from the worship of Christ to that of the "Celestial deity," or ---- which is far worse ---- worship her even before they paid their devotions to him? Who among them did not cross the Lord's threshold redolent of the odor of demoniacal sacrifices and go up to the altar of Christ reeking with the foulness of very demons, so that it would be less monstrous not to come at all to the Lord's temple than to come in such a fashion? For a Christian who does not come to church is guilty of neglect, but one who comes in such a way is guilty of sacrilege. It is less difficult to atone for failure to honor God than for direct insult to him. So we see that any who have acted thus have not given honor to God, but have taken it away from him. They have even in a way given the attention due to the church of God to an idol, because that to which priority is accorded gains in honor from that which is relegated to second place. See then the faith of the Africans, and especially of the noblest among them! See what their religion and their Christianity have been! It was in scorn of Christ that men called them Christians. Though the apostle cries: "Ye cannot drink the cup of the Lord and the cup of devils; ye cannot be partakers of the Lord's table and of the table of devils," it was not enough for them to drink the cup of the Lord with the cup of devils, but they must take the latter first. It was not enough for them to match the table of devils with the Lord's table, unless they came to the temple of God fresh from the worship of infamous superstitions and breathed on the holy altars of Christ the foul miasma of the diabolical spirit itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 2"
