[[commentary]]
quote='''
Perhaps you think that it was as a special favor granted by God to a holy man, that he wrought judgment forthwith on David's enemies. The day will not suffice if I would tell of his immediate sentences and judgments in this world. Yet, that you may clearly understand that it is not so much in consideration of the persons concerned as of their actions that he exercises his sacred censure, hear how God our judge, who constantly gave his unmistakable verdict on behalf of his servant David, many times passed judgment on David himself. And indeed this occurred not in a matter affecting many men, nor ---- which would perhaps naturally have aroused God the more ---- affecting holy men, but in the case of a single individual, a barbarian, a case in which it was not the person concerned that demanded vengeance, but the action. For when David had killed Uriah the Hittite, a man belonging to an impious people and a hostile nation, he was at once charged thus by the divine voice: "Thou hast killed Uriah the Hittite with the sword and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon. Now therefore the sword shall never depart from thine house. Therefore thus saith the Lord, 'Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes and give them unto thy neighbor. For thou didst it secretly; but I will do this thing before all Israel and before the sun.' "

What answer have you to this, you who believe that God not only fails to judge our every action but does not regard us at all? Do you see that the eyes of the Lord were in no wise withdrawn from the single secret sin which David once committed? Wherefore do you also, who ---- as a consolation I suppose for your sins ---- think that our acts are not observed by God, learn from this same instance that you are always seen by Christ, and know that you must receive punishment, perhaps very shortly. For you see that even the blessed David was unable to hide his own misdeed in the secret places of his innermost chambers, and to claim exemption from instant punishment by the undoubted merit of his great deeds. For what did the Lord say to him? "I will take thy wives before thine eyes, and the sword shall never depart from thine house." You see what immediate judgment so great a man suffered at once for one sin. Condemnation followed close on the heels of the fault, a condemnation punishing immediately without reservations and arresting the wrongdoer on the spot, not putting off the charge to a later time.

Therefore he did not say: "Because you have done this, know that the judgment of the Lord shall come and you shall be tortured hereafter by the flames of Gehenna." No; he said: "You shall suffer torture at once, and shall feel the sword of divine justice already at your throat."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 4"
