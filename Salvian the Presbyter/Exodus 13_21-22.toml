[[commentary]]
quote='''
Therefore, after this series of adventures the race of the Hebrews, victorious without warfare, entered the desert. They followed an uncharted course, pathless wanderers, with God to lead the way, honored by his divine comradeship, powerful through their heavenly leader, following a moving column of cloud by day, of fire by night, which took on shifting changes of color to suit the changing skies, that its dull obscurity might stand out in contrast to the strong light of day and its flaming splendor illumine by its clear glow the mists of night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 9"
