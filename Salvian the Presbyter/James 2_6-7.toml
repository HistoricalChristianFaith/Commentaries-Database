[[commentary]]
quote='''
Do you say that the nobles are free from these crimes? At best that is but a small gain, for all the nobles in the world would seem no more than one man in a great crowd of people. Is even this small group free from guilt? First let us consider what the Divine Word says of men of this sort. You remember that the apostle, addressing the people of God, spoke thus: "Hearken, my beloved brethren. Hath God not chosen the poor of this world rich in faith, and heirs of the kingdom which he hath promised to them that love him? But ye have despised the poor. Do not rich men oppress you by their power? Do they not blaspheme that worthy name by the which ye are called?"

The testimony of the apostle is potent, unless perhaps the nobles think that they are exempt from his accusation because he named only the rich. The nobles, however, are either identical with the rich, or, if there are rich men who are not counted in their number, they are practically in the same category, for so great is the misery of our times that no one is considered of higher rank than he who has the greatest riches. It makes little difference which of these the apostle meant, or if he was talking of both; since his words certainly apply to both the rich and the noble, it does not signify which of the two he had in mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 10"
