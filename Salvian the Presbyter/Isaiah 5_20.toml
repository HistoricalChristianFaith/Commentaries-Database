[[commentary]]
quote='''
Since this is true, what are we to do? Must we accede to the will of wicked men? Or if they wish even empty praise conferred on them, is it fitting to proffer silly and meaningless eulogies? Surely we must consider that, as men of honor should not mock even those who wish to make themselves ridiculous, so they should not laud in lying phrases those who yearn to be adorned by praise, however false. We must not take into account the preferences of individuals, but rather what is fitting for us to say, especially since the prophet said: "Woe unto them that put bitter for sweet and sweet for bitter."

We must by every means hold fast to the truth, so that what a thing is in fact, it may also be in words, and those that contain sweetness be called sweet, and those that contain bitterness, bitter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 1"
