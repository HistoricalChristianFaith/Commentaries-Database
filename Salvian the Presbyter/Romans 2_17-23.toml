[[commentary]]
quote='''
Moreover, as I have said, this evil is peculiar to us Christians, because God is blasphemed only through the agency of those who know the good and do evil; who, as it is written: " Profess that they know God, but in works deny him"; who, as the same apostle says: "Rest in the law and know his will, and approve the things that are more excellent; who have the form of knowledge and of truth in the law; who preach a man should not steal, and themselves steal; who say a man should not commit adultery and themselves commit it; who make their boast in the law and through breaking the law dishonor God."

The Christians are worse than other men for the very reason that they ought to be better. They do not justify their profession of faith, but fight against it by their evil lives. For evil doing is the more damnable in contrast with an honorable title; and a holy name becomes a crime in an impious man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 19"
