[[commentary]]
quote='''
One of those of whom we complain said to a certain holy man who followed the true doctrine, that is, that God rules all things and tempers his governance and guidance according to his knowledge of human necessities: "Why then, I ask, are you yourself infirm?" His line of reasoning, I suppose, was as follows: "if God, as you think, rules everything in this present life, if he dispenses all fortunes, then how is it that a man whom I know to be a sinner is strong and healthy, whereas you, whose sanctity I do not question, are infirm?"

Who does not marvel at the depth of feeling of one who considers the merits and virtues of a godly man worthy of such great recompense that he thinks they should be rewarded in this present life by the fleshly strength of the body? I answer, therefore, not in the name of any one saint but of them all: "Do you ask, then, whoever you are, how it is that holy men come to be weak? My answer is brief: they make themselves infirm for the express reason that if they are strong, they can hardly be holy." I think that men gain strength entirely through their food and drink, and are weak through abstinence, thirst and fasting. Therefore it is not strange that those are weak who scorn the use of the means by which others are made strong. And there is good reason for such scorn, according to the words of the apostle Paul, when he said: "I keep under my body and bring it into subjection; lest that by any means, when I have preached to others, I myself should be a castaway." If the apostle himself considered the weakness of the body an end to be sought, who acts wisely in avoiding it? If the apostle feared the strength of the flesh, who rightly presumes to be strong? This, then, is the reason why men who have given themselves over to Christ both are and wish to be weak. Far be it from us to think that holy men are neglected by God for the very reason for which, we trust, they are the more loved by him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 3"
