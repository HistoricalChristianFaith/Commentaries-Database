[[commentary]]
quote='''
I have been dealing with personalities for a long time now, and seem to have exceeded the rules of argument. For undoubtedly the reader (if anyone for Christ's sake does read these words written from love of Christ) is thinking or saying of me: "Since the subject he is pursuing is a general one, of what use is it to heap up so many accusations against a single person? Suppose ---- for it is credible ---- that the man of whom he speaks is as he describes him; still how can one man's goodness be blocked by another's guilt, or ---- a point of much greater importance ---- how is the general cause injured by one individual's crime?"

The injury indeed I can prove by clear examples. For instance, Achar once stole a part of an accursed thing, and the trespass of one man was the ruin of all. David ordered the children of Israel to be numbered, and the Lord punished his fault by the destruction of the whole people. Rapsaces spoke scornfully of God, and God smote a hundred and eighty-five thousand men because the froward tongue of one profane man spoke evil of him. Hence it was not without justice that the blessed apostle Paul ordered a noxious sinner cast out of the church and showed why he gave this order, saying: "A little leaven leaveneth the whole lump." From this we clearly see that even one evil man very often works the destruction of many. Nor is this without justice. The reader should recognize that what I said above concerning one wicked man is not beside the point, since we read in the Scriptures that the wrath of the Divine Majesty has very frequently been kindled on account of one man's guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 1"
[[commentary]]
quote='''
You may argue that this disgrace was that of a few men only, and what was not perpetrated by the majority could not injure all. Indeed, I have said before that very often among the people of God the crime even of one man has been the ruin of many, as the people were betrayed by the theft of Achar, a pestilence arose from the jealousy of Saul, and a plague came from the numbering of the people by the blessed David. For the church of God is like an eye. If even a little mote fall into the eye, it blinds the whole sight; so, if even a few men in the body of the church act indecently, it darkens the whole light of the church. Therefore the Savior called the chief part of the church its eye, saying: ''The light of the body is the eye: if therefore thine eye be single, thy whole body shall be full of light. But if thine eye be evil, thy whole body shall be full of darkness," Whence the apostle asked: ''Know ye not that a little leaven leaveneth the whole lump?" I should not say, however, that there was in Africa a little of this evil, but overmuch, not that most of the people there were effeminate, but that the effeminacy of the few was the corruption of the many. Even if there are few who live disgracefully there are many who are stained by the filth of the few. As one harlot makes many commit fornication, so the abominable unions of the effeminate few infect the vast majority of the people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 19"
