[[commentary]]
quote='''
"Whosoever hateth his brother," says the apostle, "is a murderer." We may know from this that there are many murderers who think themselves innocent, because, as we see, murder is committed not only by the hand of him that kills, but also by the heart of him that hates. For this reason the Savior added to this precept a still harsher decree, saying: "Whosoever is angry with his brother without a cause shall be in danger of the judgment." Anger is the mother of hatred. Hence the Savior wished to shut out wrath, that hatred might not spring from it. If then not only hatred but even wrath makes us guilty in God's judgment, we clearly see that as no one in the world is free from anger, so no one can be free from conviction of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 2"

[[commentary]]
quote='''
But they, you say, did not kill the saints, while we read that the Jews did.

Whether they killed or not, I do not know; I make no claims of that, but yet how great a defence is it that the only element of pagan persecution lacking was the very end of persecution? Let us assume that the saints were not killed there; what then shall we make of the fact that they are not far from killing who hate with the desire to kill, especially as the Lord himself says: ''Whosoever hateth his brother without a cause is a murderer?"

Yet it was not without cause that they persecuted the servants of God. For who can say that it was without a cause, seeing that these men differed from them in all the characteristics of their life and habits, that in them they saw nothing that was theirs, since all was God's? The greatest cause of discord is diversity of interests, because it is nearly or quite impossible that a man should love in another that with which he himself is at variance. So it was not without cause, as I said, that they hated those in whom they saw everything hostile and inimical to them. For they lived in constant wickedness, but the saints in constant innocence; they lived in lust, these in chastity; they in evil dens, these in monasteries; they almost constantly with the devil, and these incessantly with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 4"
