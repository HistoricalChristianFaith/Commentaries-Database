[[commentary]]
quote='''
Moreover, the experience of the Vandals was not dissimilar: when our people went against them in Spain and had as much confidence in a complete victory as they had recently against the Goths, the same overweening pride engulfed them in the same disastrous ruin. Then the words of the prophet were fulfilled for our army: "The Lord shall reject thy confidence and thou shalt not prosper in it."

For we trusted in our own wisdom and strength against the command of the Lord, who said: "Let not the wise man glory in his wisdom, neither the mighty man in his might, but let him that glorieth glory in this, that he understandeth and knoweth me, that I am the Lord."

So we have not been conquered undeservedly, for the enemy sought better aid than we did. While we prided ourselves on arms and auxiliaries, on the side of the enemy the Book of the Divine Law opposed us. To its help most of all the fear and terror of the Vandals then resorted, to oppose to us the Divine Word and to open up to those who came against them in rivalry the writings of the Sacred Book which may be called the very voice of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 11"
