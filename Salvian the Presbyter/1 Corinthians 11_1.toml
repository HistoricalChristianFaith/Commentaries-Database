[[commentary]]
quote='''
Perhaps certain men think the commands of the apostle are hard. Clearly they must be considered difficult, if the apostles exacted from others the performance of duties they did not lay upon themselves. But if, on the other hand, they enjoined upon others much lighter duties than on themselves, instead of being considered harsh teachers, they must be thought most indulgent parents, who, through their religious zeal, themselves in loving indulgence take the burdens their sons should bear.

What was it that one of them said to the people of the church? "My little children, of whom I travail in birth again until Christ be formed in you." And again: "Be ye followers of me, even as I also am of Christ." This is his command, that we imitate him who gave himself over to the imitation of Christ. Indeed, none can doubt that he himself imitated Christ. As Christ for our sake subjected himself to the world, so did Paul for Christ's sake. As Christ for us endured the heaviest pains and labors, so did Paul for Christ. As Christ for us suffered scorn and mockery, so did Paul for Christ. As Christ for us endured his passion and death, so did Paul for Christ. Therefore not without cause, conscious of his own merits, he said: "I have fought a good fight, I have kept the faith; henceforth there is laid up for me a crown of righteousness."

Since he so followed Christ, let us consider which of us seems to be a true follower of the apostle. He writes of himself first of all that he never gave offence to any, but in all things showed himself the minister of God, in much patience, in affliction, in necessities, in blows, in imprisonments, in stripes. Elsewhere, comparing himself with others, he says: "Howbeit, whereinsoever any is bold (I speak foolishly) I am bold also: I speak as a fool, I am more; in labors more abundant, in prisons more frequent, in stripes above measure, in deaths oft. Of the Jews five times received I forty stripes save one. Thrice was I beaten with rods, once was I stoned, thrice I suffered shipwreck."

Surely, even if we leave out of account the other apostolic virtues that he lists, when the apostle says that he has suffered shipwreck three times, in this at least we can outdo him. We have not merely been wrecked three times, but our whole life is one continuous shipwreck; indeed all men are living such vicious lives that there seems to be no Christian who is not wrecked constantly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 4"
