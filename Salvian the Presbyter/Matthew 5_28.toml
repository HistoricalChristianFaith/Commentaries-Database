[[commentary]]
quote='''
Note this also: as far as men's wishes are concerned, even if the games are no longer actually being given in many places, yet they still exist as of old, for the Roman people everywhere wish them given. When nothing but sheer necessity hinders a man from an evil deed, the mere desire for a base act is as much to be condemned as the action. For if, as I said, according to the words of our Lord: "Whosoever looketh on a woman to lust after her is guilty of the adultery conceived in his heart," we can understand that while of necessity we do not commit disgraceful acts worthy of condemnation, we are nevertheless guilty if we only desire forbidden things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 9"
