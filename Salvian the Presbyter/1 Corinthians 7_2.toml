[[commentary]]
quote='''
I said that the cities of Africa were full of monstrous vices, and especially the queen and mistress of them all, but that the Vandals were not polluted. How unlike the Romans: did these barbarians prove themselves, in cleansing the stains of our disgrace! For they have removed from every part of Africa the vice of effeminacy, they have even abhorred intercourse with harlots, and have not only shunned or done away with it for the time being, but have made it absolutely cease to exist. O kindly Master, O good Savior! How much the desire of discipline accomplishes with your help, through which the vices of nature can be changed, as they have been by the Vandals! Let us see how they have been changed, since it is important to show not only the results of this action, but also the method by which it was made effective. It is difficult to have lewdness removed by a word or order, unless it has been done away in fact, and to have decency required by a command unless it has been enjoined before. Knowing this to be true, they removed unchastity while preserving the unchaste; they did not kill the unfortunate women, lest they should stain their prevention of vice with cruelty, and sin themselves in the very act of destroying the sins they desired to abolish. But they corrected the erring in such a way that the change should be a medicine, not a penalty. They ordered and compelled all prostitutes to marry; they transformed harlots into wives, fulfilling the word and command of the apostle that every woman should have her husband and every man his wife, that since incontinence cannot be restrained without some permissible indulgence of the flesh, sexual desire might have this legitimate outlet without sinful lust. In this, indeed, provision was made not only that women who could not live without husbands should have them, but also that through their domestic guardians those who did not know how to protect themselves should be safe. While the marriage bond constantly bound them, even if the customary unchastity of their former lives enticed them to sin, their husbands' guardianship should keep them from going astray.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 22"
