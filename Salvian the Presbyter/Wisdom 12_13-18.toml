[[commentary]]
quote='''
But if, as we suggested earlier, you are more interested in the case of men in general, than of Christians alone, see how clearly the Holy Book says that all things are daily ruled by the divine will and the whole world incessantly guided by God, for it says: "He himself loves counsel and discipline." "For neither is there any other God beside thee that careth for all, but being righteous thou rulest all things righteously and with great reverence dost dispose us."

Here you have God constantly arranging, constantly governing; yet in the passage cited not only his divine governance but also the high honor of man is declared. For the words, "thou dost dispose us," show the power of his divine government, but the words, "with great reverence," show the culmination of human honor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 2"
