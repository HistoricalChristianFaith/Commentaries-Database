[[commentary]]
quote='''
The Savior said: "What you wish that men should do unto you, do ye even so to them." A part of this saying we know so well that we never overlook it ---- a part we omit so constantly that we do not know it at all. For we know very well what we wish others to do for us, but we do not know what we ourselves ought to do for them. Would that we really did not know! For our guilt would be less if due to ignorance, according to the saying: "He who does not know his lord's will shall be beaten with few stripes; but he who knows and does not do according to his lord's will, shall be beaten with many stripes." But now our offence is the greater because we cherish a part of this sacred command on account of its usefulness to our convenience, and pass over a part of it in injury to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 6"

[[commentary]]
quote='''
The barbarians, indeed, lacking the Roman training or any other sort of civilized education, knowing nothing whatever unless they have heard it from their teachers, follow blindly what they hear. Such men, completely ignorant of literature and wisdom, are sure to learn the mysteries of the divine law through instruction rather than reading, and to retain their masters' doctrines rather than the law itself. Thus the interpretation and doctrine of their teachers have usurped the authority of the law among them, since they know only what they are taught. So they are heretics, but unwittingly. Indeed it is only among us that they are heretics, and not among themselves, for they are so sure of their own orthodoxy that they libel us in turn by the accusation of heresy. As they are to us, so are we to them. We are convinced that they injure the holy incarnation in calling the Son inferior to the Father: they think that we do injury to the Father in believing the two equal. The truth is on our side, but they claim it for theirs. We truly honor God but they think their belief honors his divinity the more. They fall short in their Christian duty, but through what they think its fullest performance; their lack of reverence seems to them true piety. So they err, but with the best intentions, not through hatred, but through love of God, believing that they honor and love him. Although they have not the true faith, yet they think they possess the perfect love of God. How they shall be punished for the error of their false opinion on the day of judgment, none can know but the Judge. In the meantime, God bears with them patiently, I think, for he sees that though they have not the true faith, yet their error is due to the love of what appears to be the truth, especially since he knows that their wrongdoing is due to ignorance, while among us men neglect what they believe. So their sin is the fault of their teachers, while ours is our own; theirs is committed in ignorance, ours in full knowledge; they do what they think right, but we what we know to be perverse. Therefore with just judgment the patience of God bears with them but punishes us, because ignorance may be pardoned for a time, but contempt deserves no lenience. For it is written: ''The servant who knows not his lord's will and does it not, shall be beaten with few stripes, but he who knows it and does it not, shall be beaten with many.''

Let us not wonder that we are beaten with many stripes, since we err not through ignorance but through rebellion. For knowing the good we do not perform it, and knowing the distinction between right and wrong we pursue the wrong. We read the law and trample underfoot what is lawful; we learn the decrees of the sacred ordinances only to increase the gravity of our sins after their prohibition; we say that we worship God, but give our service to the devil. After all this, we wish to receive good gifts from God, while we heap wrong upon wrong continually; we wish to have God do our will, though we are unwilling to do his. We treat with him as his superiors; we wish him to accede to our wishes constantly, though we constantly fight against his.

But he is just, however unjust we may be; for he punishes those he thinks deserve punishment, and bears with those he thinks deserve his patience. In each case his end is the same, that his chastisement of the orthodox may restrain their lust for sinning, and his forbearance at length bring the heretics to recognize the full truth of the faith, especially since he knows that those men are not apt to be unworthy of the catholic faith whom he sees superior to the orthodox in their way of living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25205.html'
source_title="On the Government of God, Book 5, Chapters 2-3"
