[[commentary]]
quote='''
Speaking through the Sacred Books, the Divine Word says.: "The eyes of the Lord are in every place, beholding the evil and the good." Here you find God present, looking upon us, his eyes watching us wherever we may be. If the Divine Word assures us that God observes the good and the wicked, it is expressly to prove that nothing escapes his watchful scrutiny.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 1"
