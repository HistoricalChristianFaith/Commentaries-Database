[[commentary]]
quote='''
After the Flood God blessed the generation of men, and when this blessing had brought forth an immeasurable host of men, God spoke to Abraham from heaven, ordering him to leave his own land and go to a strange country. He was called, he followed; he was guided and established; from a poor man he became rich; from an obscure man, powerful. Though reduced by his journeyings to the lowest estate, he came to be most high in honor. Yet in order that the previous gifts of God to him should not seem undeserved generosity, he who rejoiced in prosperity was tested in adversity. Then came toil, danger and fear; he was vexed by travelling, worn out by exile, visited with shame, and deprived of his wife. God ordered him to sacrifice his son; the father offered his child, and so far as the resolution of his heart was concerned, performed the sacrifice. Again came periods of exile, again fear, the hatred of the Philistines, the rapine of Abimelech — many evils, yet compensated by equal consolations, for though he was afflicted in many things, yet was he rewarded for them all.

What conclusion are we to draw? In all the events which we have recounted, is not God seen examining Abraham, inviting and leading him, anxious for him, his sponsor, protector, benefactor, testing and exalting him, at once his avenger and his judge? Surely he examined him, for he chose him as the one best man of them all; he invited him, for he called him; he was his guide, leading him through in safety to unknown lands; anxious for him, for he visited him by the oak tree; his sponsor, in promises of things to come; his protector, guarding him among barbarous races; his benefactor, in that he enriched him; his examiner, in that he wished to test him by harsh trials; his exalter, for he made him powerful beyond all men; his avenger, for he avenged him on his adversaries; his judge, for in avenging him he exercised judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 8"
