[[commentary]]
quote='''
Is this the case in Aquitania alone? Let us pass under review other parts of the world also, and not speak exclusively of the Gauls. Have not the same crimes or greater ones destroyed the provinces of Spain? Even if the divine wrath had handed these lands over to any other barbarians you might name, the enemies of chastity in them would have suffered tortures worthy of their vices. But as an added evidence of the condemnation of their shamelessness they were delivered into the hands of the Vandals, the most shamefast of barbarians. In the captivity of Spain God wished to give a twofold evidence of his hatred of carnal lust and love of chastity, when he put the Vandals in command solely on account of their preeminent chastity and subjected the Spaniards to them solely on account of their surpassing lewdness. What do I mean by this? Were there not anywhere in the world stronger barbarians to whom the Spanish lands might be surrendered? Many, without doubt, nay, all of them were stronger, if I am not mistaken. But he handed the people of Spain over to the weakest of the enemy expressly to show that it was not the strength but the merit of the Vandals that conquered, and that we were not being overwhelmed by the power of our foes, who then seemed most unheroic, but only by the wickedness of our vices, that the saying of the Lord to the Jews might be fulfilled in us: ''According to their uncleanness and according to their transgressions have I done unto them, and hid my face from them.'' Elsewhere speaking to the same people, he said: ''The Lord shall bring a nation against them from far . . . with the hoofs of his horses shall they tread down all thy streets; they shall slay thy people by the sword."

So all that the Lord said has been fulfilled in us, and our punishment has vindicated the force of his divine words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25207.html'
source_title="On the Government of God, Book 7, Chapter 7"
