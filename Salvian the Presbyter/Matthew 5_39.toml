[[commentary]]
quote='''
Moreover, there is a second similar commandment joined with this one, in which the Lord says: "Whosoever shall smite thee on thy right cheek, turn to him the other also." How many men do we think there are who would listen politely to such words, or agree to them in their hearts, even if they pretended to listen? How often do you find a man who does not return many blows for the one that he has received? He is so far from turning his other cheek to the man who strikes him that he thinks that he is winning when he has outdone his adversary, not in being struck, but in striking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25203.html'
source_title="On the Government of God, Book 3, Chapter 6"
