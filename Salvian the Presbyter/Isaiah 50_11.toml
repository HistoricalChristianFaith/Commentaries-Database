[[commentary]]
quote='''
It is impious to blame God's severity for our misfortunes: we should instead accuse ourselves. For when we commit the sins that cause our torture, we are ourselves the authors of our torments. Why then do we complain of the bitterness of our punishments? Each one of us punishes himself.

This is why the prophet said to us: "Behold, all ye that kindle a fire, that have added fuel to the flame; walk in the light of your fire and in the sparks that ye have kindled." For the whole human race is rushing headlong into eternal punishment by the very course that the Scriptures describe. First we kindle the fire, then add fuel to the flames, and lastly enter the flames that we have prepared. When does man first kindle eternal fire for himself? Surely when he first begins to sin. But when does he add fuel to the flames? When he heaps up sins upon sins. When shall he enter the everlasting fire? When he has already completed the irrevocable account of wickedness by the increase of his sins, as our Savior said to the leaders of the Jews: "Fill ye up then the measure of your fathers, ye serpents, ye generation of vipers," The men whom the Lord himself told to fill up the measure were not far from completing the full number of their sins. Because they were no longer worthy of salvation, they filled up the number of iniquities by which they were to perish. Whence also, when the ancient Law recalled that the sins of the Amorreans were fulfilled, it is said that the angels spoke to the blessed Lot, saying: "Whomsoever thou hast in the city, bring them out of this place, because the cry of them is waxen great before the face of the Lord, and the Lord hath sent us to destroy them." For a long time, truly, that most sinful people had been kindling the fires by which they perished, and so when the tale of their iniquities was completed they burned in the flames of their own crimes. For they deserved so ill of God that they suffered in this world the Gehenna that is to come in the later judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 8"

[[commentary]]
quote='''
As all things, are subject to sacred authority and the will of God rules everything, whatever evils and whatever punishments we bear daily are the censure of his divine hand, which censure, indeed, we constantly arouse and kindle by our sins. We kindle the fire of the celestial wrath and arouse the flames by which we are burned, so that the words of the prophet may rightly be used against us as often as we endure such ills: "Make your way into the flames of the fire that you have kindled.'' From this we see that according to the sacred sentence each sinner is preparing for himself the suffering that he endures. None of our misfortunes can be imputed to God; we are the authors of our own misery. For God is gracious and merciful and, as the Scripture says, he wishes no one to perish or be injured. So whatever is done against us is done by our own actions; there is nothing more cruel to us than ourselves; we, I say, are torturing ourselves even against God's will.

But, forsooth, I seem to be contradicting myself; whereas I said before that we are punished by God on account of our sins, now I say that we are punishing ourselves. Both are true; we are indeed punished by God, but we ourselves force him to punish us. Inasmuch as we cause our own punishment, who can doubt that we are chastising ourselves by our crimes? For whoever gives cause for his punishment chastises himself, according to the saying: "Every one is bound by the chains of his sins." If wicked men are bound by the chains of their sins, every sinner doubtless binds himself when he sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25208.html'
source_title="On the Government of God, Book 8, Chapter 1"
