[[commentary]]
quote='''
Thus in the Acts of the Apostles the most blessed Paul said: "In him we live and move and have our being." Doubtless he is more than the controller of our lives, in whom is the very source of life. For Paul did not say that we are moved by God but in him, teaching us, to be sure, that our real substance is rooted within his sacred attributes, since we truly live in him from whom we receive our being.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 2"

[[commentary]]
quote='''
Has God then instilled this love of their own functions into even the least of living things, and deprived himself alone of the love of his works? Have you considered that all our love of good things has come down to us from his good love? He himself is the fount and source of all our benefits, and since, as it is written: "In him we live and move and have our being," from him surely we have received all the affection we give our offspring; for the whole world and the whole human race are the offspring of their creator.

Therefore by that very love he has caused us to feel for our sons he wished us to know how greatly he loved his own. For we read, just as "the invisible things of him are clearly seen, being understood by the things that are made," even so he wished his love for us to be known by the love that he gave us toward our own kindred. As it is written that he wished all fatherhood in heaven and in earth to be named after him, so he wished us to recognize his fatherly love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25204.html'
source_title="On the Government of God, Book 4, Chapter 9"
