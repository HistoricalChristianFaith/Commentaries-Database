[[commentary]]
quote='''
For your fuller comprehension, hear the testimony of the Holy Spirit in another part of the Scriptures, when it says: "Behold, the eye of the Lord is upon them that fear him, to deliver their soul from death, and to keep them alive in famine." This is why God is said to watch over the just, that he may preserve and protect them. For the propitious oversight of his divinity is the safeguard, of our mortal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25202.html'
source_title="On the Government of God, Book 2, Chapter 1"
