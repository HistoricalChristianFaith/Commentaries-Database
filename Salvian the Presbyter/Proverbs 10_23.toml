[[commentary]]
quote='''
For we were talking of the public games, which are truly mockeries of our hopes, mockeries of our life. While we sport in the theaters and circuses, we perish, according to the Sacred Word which says: "It is as sport to a fool to do mischief." So we too, when we laugh amidst disgraceful and shameful sights, are committing crimes, and crimes of no slight extent. Our wrongdoing is the more worthy of punishment for this very reason, that though it seems to be of a most trivial nature, it is really pestilential and deadly in its outcome.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25206.html'
source_title="On the Government of God, Book 6, Chapter 11"
