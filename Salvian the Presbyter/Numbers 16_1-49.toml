[[commentary]]
quote='''
Korah taunted him: he was overwhelmed. Dathan and Abiram murmured against him: they were swallowed up. "For the earth opened and swallowed Dathan, and covered the company of Abiram." Two hundred and fifty leaders of the people also, as the sacred narrative testifies, who were called upon by name to speak at the time of the council, rose against Moses. "And they gathered themselves together against Moses and against Aaron, and said to them: 'Ye take too much upon you, seeing all the congregation are holy, every one of them, and the Lord is among them; wherefore then lift ye up yourselves above the congregation of the Lord?' " And what happened after this? "There came out a fire from the Lord, and consumed the two hundred and fifty men that offered incense."

When such deeds were committed, heavenly mercy was of no avail. Correction was administered again and again, yet improvement did not follow. For just as we are chastised again and again, and do not improve, so they too, though constantly struck down, did not mend their ways. For what is written? "But on the morrow all the congregation of the children of Israel murmured against Moses and Aaron, saying, 'Ye have killed the people of the Lord.' "

What happened then? Fourteen thousand seven hundred men were struck down at once and consumed by divine fire. Since all the multitude of the people sinned, why did not the punishment fall on all alike? Especially since, as I said before, no one escaped from Korah's sedition. Why did God on the former occasion wish all the assemblage of sinners to be killed, but at this time a portion only? Surely because the Lord is full of justice and mercy and therefore his indulgence causes many concessions to his love, and his discipline to his severity. And so on the one occasion he gave first place to discipline that the punishment of all the guilty might redound to the general betterment; on the other he yielded precedence to mercy, that the whole people might not perish. Although he acted with such mercy, yet because the punishment so often repeated for a part of the people did not profit them, finally he condemned them all to death. This example should contribute to our fear and our correction alike, that we, failing to be improved by their example, may not come to be punished by a destruction like theirs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 12"
