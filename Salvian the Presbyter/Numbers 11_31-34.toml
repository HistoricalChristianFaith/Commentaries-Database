[[commentary]]
quote='''
The people of the Hebrews repented having gone out of Egypt; they were struck down: then they grieved at the weariness and toil of the journey, and were afflicted: they desired flesh-meat, and were smitten. And because, eating manna daily, they desired to satiate the cravings of their bellies with illicit foods, they were sated indeed in their passionate greed, but tortured in that very satiety. "For while their food was still in their mouths," says the Scripture, "the wrath of God came upon them, and slew very many of them and smote down the chosen men of Israel."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Salvian%2520the%2520Presbyter%2FOn%2520the%2520Government%2520of%2520God%2FBook%25201.html'
source_title="On the Government of God, Book 1, Chapter 12"
