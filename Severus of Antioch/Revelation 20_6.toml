[[commentary]]
quote='''
Blessed and holy who takes part in that first resurrection—It is not a first and second resurrection according to time; for there is one resurrection, and God has assigned one day for judgment, but he calls the resurrection the first, because the orders prior and more excellent pertain to it, according to that: Many are the mansions of my father's house; for if there are many mansions, also equally many orders, thus that this be first, another second, that third; and the first order is of those who were bound.
'''
append_to_author_name=' (as quoted by Dionysius bar Salibi, AD 1171)'
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 20:6"
