[[commentary]]
quote='''
And in Deuteronomy Moses commanded the sons of Israel, saying: If you pass through a field and find a bird sitting on its young; do not keep the bird with its young, but let the bird fly away into the open field, and keep the young you have taken; so that you may live a long time in the land which the Lord your God has given you (Deut. 22:6). Could the releasing of a little bird increase anyone’s lifespan? No, but it is to be understood spiritually. By the bird, each holy soul is signified; by its young, good works are understood. For just as a bird gathers its young under its wings, so that by warming them it may nourish them, so each holy soul stores its works within the secret places of the heart, and by always increasing them multiplies and nourishes them, so that from them it may receive a most full reward. We find the bird with its young when we lovingly embrace a just person on account of his good works. We allow the bird to fly away into the field when we rejoice that the one we loved has, through death, ascended to the heavenly realms. But we keep his young captured if we retain his good works in our mind and advance by imitating them. And in this we acquire length of life for ourselves, which is given only to those who are established in heavenly blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
