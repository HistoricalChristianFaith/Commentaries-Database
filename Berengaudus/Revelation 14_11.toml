[[commentary]]
quote='''
And they will have no rest day or night, those who have worshiped the beast and its image, and whoever receives the mark of its name.

Why does he say that the wicked will have no rest either by day or by night, since the elect are to possess an eternal day, and the wicked an everlasting night? But he spoke in a human manner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
