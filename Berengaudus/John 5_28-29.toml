[[commentary]]
quote='''
And in the Gospel of this John, the Lord says: “The hour is coming when all who are in the tombs will hear the voice of the Son of God, and those who have done good will come out to the resurrection of life, while those who have done evil will come out to the resurrection of judgment” (Jn. 5:28–29). At the Lord’s command, therefore, the dead will come out of their tombs, because the bodies of all the dead, brought to life through the reception of their souls, will emerge from their graves. Those who have done evil will come out to the resurrection of judgment, because they will rise for this purpose: to be judged in the very bodies in which their souls sinned, so that those who were partners in their wickedness may share in their torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
