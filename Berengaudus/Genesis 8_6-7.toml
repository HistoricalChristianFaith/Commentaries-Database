[[commentary]]
quote='''
In the following it is also written: When Noah opened the window of the ark that he had made, he sent out a raven, which went out and did not return, until the waters were dried up from upon the earth (Gen. 8:6). By the raven, a very black bird, the Jews, darkened by unbelief, are indicated. Therefore Noah sent the raven from the ark, because our Lord Jesus Christ separated the Jewish people from the fellowship of the holy Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
