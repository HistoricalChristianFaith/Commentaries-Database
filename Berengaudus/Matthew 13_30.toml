[[commentary]]
quote='''
It seems therefore to me that by the harvest of the earth the elect are signified: but by the clusters, from which wine arises, which alienates the minds of men, the wicked are signified. This is the harvest, concerning which the Lord says in the Gospel: In the time of harvest I will say to the reapers: Gather first the tares, and bind them in bundles to burn: but gather the wheat into my barns (Matt. 13:30). For those who are there signified by wheat, are signified in this place by the harvest. And those who are there by tares, are figured in this place by the clusters of the vine of the earth:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
