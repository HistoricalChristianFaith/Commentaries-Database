[[commentary]]
quote='''
In the second Psalm it is written that the Father said to the Son: Ask of me, and I will give you the nations as your inheritance, and your possession the ends of the earth. You shall rule them with a rod of iron; you shall break them like a potter's vessel (Ps. 2:8). The Father gave the Son power, that he might rule the nations with a rod of iron; the Son also gave power to the apostles and the other preachers, that they also might rule the nations with a rod of iron and break them like a potter's vessel. Therefore by the iron rod the Gospel is signified, as also by the wooden rod the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
