[[commentary]]
quote='''
That the angel wrestled with Jacob in the figure of the Lord, and he with the angel, signifies what the Lord says in the Gospel: The kingdom of heaven suffers violence, and the violent seize it (Matt. 11:12). But who are the violent, if not sinners and penitents? When they see that, on account of their crimes, they are guilty of everlasting death, they knock at the gate of paradise with their prayers so long until the entrance to the heavenly kingdom is opened to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
