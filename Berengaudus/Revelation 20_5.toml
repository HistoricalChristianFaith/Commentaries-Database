[[commentary]]
quote='''
But the rest did not come to life until the thousand years were completed.

The rest, that is, the wicked, did not come to life, because after death they are not brought to the life allowed in heaven to the souls of the saints; instead, they are plunged into hell [infernum], which in this book is called the first death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
