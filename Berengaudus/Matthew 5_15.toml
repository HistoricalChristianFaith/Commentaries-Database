[[commentary]]
quote='''
Of this lampstand the Lord says in the Gospel: “Neither do they light a lamp and put it under a bushel, but on a lampstand, so that it may give light to all who are in the house” (Matt. 5:15). For a lamp is set upon a lampstand when the ministry of preaching is entrusted to a holy man, who illuminates the good he preaches with the flames of good works; but a lamp is put under a bushel when the ministry of preaching is entrusted to someone depraved, who obscures the good he preaches by wicked deeds, so that it does not give light to those who are in the house, as Saint Gregory (Homily 12 on Gospels) says, because when a man’s life is despised, it follows that his preaching is also scorned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
