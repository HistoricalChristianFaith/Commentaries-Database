[[commentary]]
quote='''
And when the thousand years are completed, Satan will be released from his prison, and he will go out and deceive the nations that are in the four corners of the earth, Gog and Magog.

This prison is called the abyss above. But meanwhile a question arises: for earlier, following the opinion of some, I said that the hearts of the wicked could be signified by the abyss, in which the Devil, expelled from the hearts of the faithful, is held bound. If, then, the hearts of the wicked are signified by the abyss, how is he said to come out of the abyss, that is, from the hearts of the wicked, whom he will never abandon? Is he perhaps going to abandon the wicked and enter the elect? By no means. I therefore think that the Devil’s binding should be understood literally, so that he is held bound by divine power in some place of the abyss, or certainly in hell [inferno], until the day of his release.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
