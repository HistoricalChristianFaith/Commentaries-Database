[[commentary]]
quote='''
In Genesis it is written that God said to Noah: Make yourself an ark of smoothed woods; you shall make little dwellings in the ark, and you shall coat it with pitch inside and outside, and thus you shall make it. The length of the ark shall be three hundred cubits, its breadth fifty cubits, and its height thirty cubits (Gen. 6:14–15). The ark signifies the Church; and Noah, the builder of the ark, prefigured Christ, the builder of the Church. This ark is described as having been made from smoothed woods: by the smoothed woods, which both kept out the waters and preserved the life of all the animals placed within it, are signified the teachers of the Church, who by their teaching and their writings prevent the waters of various errors from entering the Church, and by their teaching and examples preserve the life of those who are within the Church. They are said to be smoothed, that is, cleansed from every roughness of vices. By the little dwellings, moreover, which were commanded to be made in the ark, the different orders in the Church are signified; for one person, as it were, dwells in one dwelling, another in another: one in the married state, another in the life of chastity, another in the monastic life, another in the priestly office, while they strive to serve God. By the pitch, however, with which it is said to have been coated, Holy Scripture is signified. Therefore the planks from which the ark was made, which we have said signify the teachers of the Church, were coated with pitch inside and outside; because the teachers of the Church are coated inside by the wisdom and teaching of Holy Scripture, and outside by works of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
