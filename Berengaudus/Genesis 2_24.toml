[[commentary]]
quote='''
Scripture shows that she is also called a wife, saying: “Therefore a man shall leave his father and his mother and cleave to his wife, and the two shall become one flesh” (Gen. 2:24). Therefore the Son of God, as it were, left his Father when, descending from that heavenly blessedness to earth, he assumed human nature, which he would give for his bride, who is the Church. He left his mother because, setting aside a mother’s affection, he surrendered for his Church the body he had taken from her. He united the Church to himself in such a way that he is the head and she is the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
