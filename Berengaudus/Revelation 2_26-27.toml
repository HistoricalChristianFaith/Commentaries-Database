[[commentary]]
quote='''
And he who overcomes and keeps my works until the end, I will give him power over the nations, and he will rule them with a rod of iron, and they will be broken like a potter's vessel, just as I also received from my Father.

By "end" in this place death is understood: therefore he who overcomes the world and its desires, and perseveres until the end, will be given power over the nations, and he will rule them with a rod of iron. But even if by "end" death is understood, how are the elect said to rule the nations after death, since in that blessed life there is no one who is ruled with a rod of iron, where nothing distorted and nothing crooked is found? Unless perhaps we understand it in that sense, as that: Who made the things that are to be. For all things which are to be done according to God's disposition already exist in his predestination as if made, because it cannot happen that anything is changed from all those things which God has decreed to be done. Similarly also to the saints, whom God foreknew would be righteous and would persevere in good works, before their birth he granted this, that they have power over the nations and rule them with a rod of iron, as he speaks to Jeremiah saying: Before I formed you in the womb, I knew you, and before you came out of the womb, I sanctified you, and I made you a prophet to the nations (Jer. 1:5).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
