[[commentary]]
quote='''
There is another kind of lie that might seem blameless, were it not that Scripture says every lie comes from evil; and some such lies are found in the Holy Scriptures (1 Jn. 2:21). For in Genesis it is written that Pharaoh commanded the Hebrew midwives to kill the boys and spare the girls (Exod. 1:16). But they feared God and kept the boys alive. When Pharaoh rebuked them for this, they said that all Hebrew women knew how to act as midwives and gave birth before the midwives could reach them. Was it not better to save the children by lying than to commit so many murders by telling the truth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
