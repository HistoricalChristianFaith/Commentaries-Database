[[commentary]]
quote='''
After this I saw a great multitude that no one could count, from every nation and tribe and people and language, standing before the throne and in the presence of the Lamb . . . And they cried out with a loud voice, saying: Salvation belongs to our God who sits upon the throne, and to the Lamb.

By the multitude above, which is included in the number, the elect who labor in the Church of God at every period are signified, as we have already said. And because many are called, but few are chosen (Matt. 20:16), and in comparison with the wicked the multitude of the elect is small, not without reason are the elect who in every age labor in the Church of God represented by the number one hundred and forty‑four thousand; but in heavenly blessedness, where at every period people are gathered from all nations, tribes, and languages, such a multitude of them comes to be that it cannot be comprehended by number. By the white robes the purity of souls is signified; the palms, however, are set as a sign of victory. Therefore not only do the holy martyrs, to whom victory is especially ascribed, possess palms, but all the elect who, placed in this present world, have fought bravely against visible and invisible enemies, possess them in heavenly blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
