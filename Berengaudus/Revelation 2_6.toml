[[commentary]]
quote='''
But you have this (namely, that the lampstand is not moved), because you have hated the deeds of the Nicolaitans, which I also hate.

And the meaning is: Because you have hated the deeds of the Nicolaitans, which I also hate, the reward that was owed to you for your pastoral care still remains with you. Now the Nicolaitans were heretics, whom he said above that he could not endure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
