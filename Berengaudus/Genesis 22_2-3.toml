[[commentary]]
quote='''
It is written in Genesis that God tested Abraham and said to him: Take your son Isaac, whom you love, and go to the land of vision, and there you will offer him as a burnt offering on one of the mountains that I will tell you of (Gen. 22:2). Abraham, rising up during the night, saddled his donkey and took with him two youths and Isaac his son. Abraham signifies Christ according to his divinity; Isaac signifies the man whom Christ assumed; and by the donkey the apostles are signified. Abraham therefore rose up by night, because the Son of God, when the world lay in the darkness of ignorance, consented to be born of the Virgin Mary. He saddled his donkey when he handed down to his apostles the commands of the Gospel. By the two youths are signified the two commandments of love. He took the two youths with him, because he impressed upon his disciples the two commandments of love more strictly and more frequently. He also took his Son, because the man whom he assumed he handed over to die for humanity, just as he himself said in the Gospel to his disciples: Behold, we are going up to Jerusalem, and all things that have been written by the prophets about the Son of Man will be fulfilled. For he will be handed over to the nations, and will be mocked and scourged and spat upon; and after they have scourged him, they will kill him, and on the third day he will rise again (Luke 18:31-33).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
