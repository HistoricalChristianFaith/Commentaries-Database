[[commentary]]
quote='''
And when they have finished their testimony, the beast that rises up from the abyss will wage war against them, and will conquer them, and will kill them.

This beast signifies the Antichrist. It will wage war against them when it persecutes them; and it will conquer them not by overcoming them with words, but by putting them to death. And so it follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
