[[commentary]]
quote='''
And the beast was seized, and the false prophet, who performed signs in its presence, by which he deceived those who had received the mark of the beast and who had worshiped its image: the two of them were cast alive into the lake of fire burning with sulfur, and the rest were killed by the sword of the one sitting on the horse, which went forth from his mouth, and all the birds were filled with their flesh.

The beast and its false prophet will be seized when that is fulfilled which the Apostle Paul says: “Whom the Lord Jesus will kill with the breath of his mouth and will destroy with the brightness of his coming” (2 Thess. 2:8). If Antichrist is to be killed by the breath of the Lord’s mouth, how are he and his false prophet to be cast alive into the lake of fire? There is a life of the righteous, and there is a life of the wicked. Of the life of the righteous the prophet says that “the righteous will live by his faith” (Hab. 2:4); but of the wicked widow Paul says that “though she lives, she is dead” (1 Tim. 5:6). Indeed, the righteous do not inappropriately call the life of the wicked “death”; likewise the wicked regard the life of the righteous as “death,” as they will say in the judgment: “These are the ones we once held in ridicule and as a pattern of reproach; we foolish men thought their life was madness, and their end without honor” (Wisdom 5:4). Therefore Antichrist and his false prophet are cast alive into the lake of fire, that is, alive in their wickedness, persevering in it, namely, until the end of their life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
