[[commentary]]
quote='''
By the wine of the wrath of God is signified the final damnation that will be inflicted on the wicked on the day of judgment; and we call “unmixed” what is pure. By “unmixed,” therefore, the justice of God is signified, and by “cup” we can understand the judgment of God. Therefore the wine is mixed with what is unmixed in the cup of God, because the final damnation by which the wicked will be condemned will be mingled with justice in the cup of God, that is, in the judgment of God; for it will be brought to completion by the most just judgment of God. The wicked will therefore drink the wine of the wrath of God, when it is said to them: Depart from me, you cursed, into everlasting fire, which has been prepared for the Devil and his angels (Matt. 25:41).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And he will be tormented with fire and sulfur in the sight of the holy angels and in the sight of the Lamb; and the smoke of their torments will rise forever and ever.

Fire burns, but sulfur gives off a most terrible stench. With fire they will be physically tormented, those who were unwilling to extinguish within themselves the fire of vices; they will be tortured by the stench of sulfur, for whom the stench of lust was sweet. They will be tormented in the sight of the holy angels and in the sight of the Lamb, that is, so that they may be tormented before the eyes of those in whose sight they did not fear to commit many evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
