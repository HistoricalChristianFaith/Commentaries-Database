[[commentary]]
quote='''
And to the angel of the Church in Thyatira write: These things says the Son of God, who has eyes like a flame of fire, and whose feet are like fine brass.

What these things mean has been said above. (see Rev. 1:13b-16)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
