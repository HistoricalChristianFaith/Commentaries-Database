[[commentary]]
quote='''
And they worshiped the dragon, because he gave power to the beast; and they worshiped the beast, saying: Who is like the beast, and who will be able to fight with it?

How will they worship the dragon, that is, the Devil, whom they will not see? But those who are signified by the earth will worship the Antichrist, and in the Antichrist they will worship the Devil, saying that no one is like the Antichrist, nor is there anyone who can be matched to his strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
