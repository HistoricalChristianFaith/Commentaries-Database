[[commentary]]
quote='''
Another angel who came out of the temple cried with a loud voice to him who was sitting upon the cloud, saying: “Put in your sickle, and reap”; he points out the elect who labor on this earth, but by the temple from which he was seen to have come out, the Church is indicated. So he cried to him who was sitting upon the cloud, that he should put his sickle into the earth and reap; for holy men, seeing that the world lies in evil and trembling at its miseries, pray every day that the kingdom of God may come, in which, freed from all distress, they will receive their own bodies and will rejoice with the Lord forever. The dryness of the harvest, moreover, shows its ripeness; for just as the harvest grows until it is ripe, when it becomes dry, so too the number of the elect will grow until the end of the world, and their ripeness will then be brought to perfection when their number has been fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
