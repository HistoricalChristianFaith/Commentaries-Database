[[commentary]]
quote='''
And they had over them as king the angel of the abyss, whose name in Hebrew is Abaddon, in Greek Apollyon, and in Latin has the name Destroyer.

It is certain that the prince of all heretics is the Devil, just as the Lord says to Job: “For he is indeed king over all the sons of pride” (Job 41:25); and therefore he is called the Destroyer, because he is the destroyer of all goodness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
