[[commentary]]
quote='''
The Apostle Paul speaks of the evil of fornication, saying: “Whoever commits fornication sins against his own body” (1 Cor. 6:18). He sins against his own body because he violates and corrupts its integrity, forcibly extracting and spilling its harmless fluids.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
