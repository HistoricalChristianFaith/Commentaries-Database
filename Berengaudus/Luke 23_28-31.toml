[[commentary]]
quote='''
For the Lord also, when He was being led to His Passion, foretold to the women who were lamenting Him that they would suffer these things, saying: Daughters of Jerusalem, do not weep for me, but weep for yourselves and for your children; for behold, days will come when they will say: Blessed are the barren, those who have not borne, and the breasts that have not nursed! Then they will begin to say to the mountains: Fall upon us; and to the hills: Cover us. For if they do these things in the green wood, what will happen in the dry? (Luke 23:28-31). He calls Himself the green wood, but them the dry wood, as if He had said: If they do these things to me, who am wood according to my humanity, but green according to my divinity, that is, who am God and man; what will happen to those who are dry wood, that is, who do not have the greenness of faith? It is understood: they will perish in the worst way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
