[[commentary]]
quote='''
In the Gospel it is written that a certain householder, setting out on a journey, gave to one of his servants five talents, to another two, and to another one. But the first and the second, by trading with the talents which they had received from the lord, doubled them; the third dug in the ground and hid his lord’s money (Matt. 25:15). Whatever temporal goods therefore, or whatever skills we have received from the Lord, will be reckoned to us as the reception of talents: the righteous, therefore, who are signified by the first and second servant, double their talents, since they spend the temporal goods which they receive from the Lord in good works, and also urge whomever they can toward doing good; but the wicked, who are signified by the third servant, hide their talents in the earth, because from the temporal goods which they have received from the Lord they nourish vices rather than virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
