[[commentary]]
quote='''
The Lord says in the Gospel about the wicked Jews: “If I had not come and spoken to them, they would not have sin” (Jn. 15:22). Did the Jews not have sin before the coming of Christ? They were certainly sinners before, but they did not have the sin of unbelief, the sin of blasphemy by which they called him Beelzebul, the sin of murder by which they crucified him, and many other crimes which they drew from his coming. In the bowl, however, of Christ, in which the life of the world was contained, the Jews, through the demands of their own faults, found death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
