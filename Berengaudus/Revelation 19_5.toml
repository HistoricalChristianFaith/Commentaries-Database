[[commentary]]
quote='''
By the throne, however, the prophets are signified, in that they were the seat of God, and through them he arranged his judgments. A voice went out from the throne, because from the prophets holy preaching proceeded. They sang praise to God, because they strove to serve him with all their strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
