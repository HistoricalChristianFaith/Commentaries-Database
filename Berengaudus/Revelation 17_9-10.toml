[[commentary]]
quote='''
The seven heads are seven mountains upon which the woman sits; and they are seven kings. Five have fallen, one is, the other has not yet come; and when he comes, he must remain for a short time.

We said above that by the seven heads of the dragon those wicked ones are indicated through whom the Devil deceived humanity, (Rev. 12:3-4) whom we also divided into seven parts, just like the rest of the multitude of the wicked. And because this beast of which we speak has the same meaning as we said the dragon has; namely, they signify the Devil: the seven heads of the beast have the same meaning as the seven heads of the dragon which we said it has. These are also called mountains, because those who deceived others were higher in crimes than those who were deceived by them, just as it says in what follows about Babylon: Because her sins have reached as far as heaven (Rev. 18:5). They are likewise called seven kings, because they provided leadership to the others as they went to destruction. Upon these mountains therefore the harlot is said to sit, because from them the city of the Devil has been shaped in all errors and crimes. For just as the apostles are called the foundations of the Church, so equally the inventors of errors are the foundations of the city of the Devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
