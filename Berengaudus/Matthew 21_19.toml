[[commentary]]
quote='''
And the fig tree which the Lord, before His Passion, by cursing made dry because He found no fruit on it (Matt. 21:19), signified those same Jews, whom He condemned with a perpetual curse, because He found no fruit of faith in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
