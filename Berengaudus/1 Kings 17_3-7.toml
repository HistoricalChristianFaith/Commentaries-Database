[[commentary]]
quote='''
In the book of Kings it is written that when Ahab, king of Israel, began to persecute Elijah, at the Lord’s command he went into the desert and sat beside the brook Cherith; and ravens brought him bread and meat in the morning, and bread and meat in the evening, and he drank from the brook (1 Kings 17:1-7). Elijah prefigured Christ; by the brook Cherith, however, we must understand the Law. Cherith is interpreted “falsehood,” not that the Law is a falsehood; for wise teachers are accustomed to present parables to their hearers, so that the things they wish to say may be understood more clearly, and they introduce beasts and birds speaking. If you look only at the words of the parables, you will see that they are falsehood; but if you look at the meaning, you will recognize the truth. Likewise certain legal instructions, if you attend only to the letter, will seem useless to you; if to the spiritual understanding, a great truth will shine forth for you in the letter. Certain legal instructions, therefore, are “falsehood” to the Jews, because they understand them in a carnal way; but to us they are truth, because we strive to understand them spiritually. By the ravens, in fact, are signified the priests of the Jews, darkened by the veil of their hearts; by the meats, the continual sacrifice which was offered morning and evening. The breads, moreover, signify the loaves of the presence, which were constantly set before the Lord; and he drank from the brook, because Christ took delight in the observances of the Law. But after many days the brook dried up, because when Christ came in the flesh and preached the Gospel, the legal observance ceased, and from that time on it was of no profit, as the Lord says: “The Law and the Prophets were until John,” etc. (Matt. 11:13). And again he says to Israel through the prophet: “Do not offer sacrifice any more in vain. Incense is an abomination to me; I will not endure your new moons and your sabbaths; your assemblies are wicked” (Isa. 1:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
