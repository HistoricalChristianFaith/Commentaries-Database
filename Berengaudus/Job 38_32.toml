[[commentary]]
quote='''
He also calls himself the morning star. The morning star, which we call the day star, is rightly said to be Christ: just as it rises at dawn and spreads its brightness throughout the world, so Christ, coming into the world, illuminated the whole face of the earth. He is rightly called the day star because, when he came into the world, he brought light with him, by which he extinguished the darkness of this world. Job speaks of this day star, saying: “Who brings forth the day star in its appointed time” (Job 38:32). God the Father brought forth the day star at its appointed time when he sent his Son, at the time he had ordained, to redeem humankind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
