[[commentary]]
quote='''
But at what price it is bought, the blessed Job himself makes clear when he says: “The fear of the Lord, that is wisdom, and to turn away from evil is understanding” (Job 28:28). Not that the one who fears is perfect in wisdom, since the apostle says: “The one who fears is not perfected in love” (1 Jn. 4:18); but that he already begins to possess wisdom who begins to pay the price for it. Now its price is the fear of the Lord, renunciation of vices, repentance, tears, works of mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
