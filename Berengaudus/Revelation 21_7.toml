[[commentary]]
quote='''
The one who conquers will inherit these things, and I will be his God, and he will be my son.

The one who conquers the Devil, overcomes every vice, and perseveres in good works will inherit these things, that is, what was said above: namely, that he himself will drink from the fountain of eternal life, which is everlasting glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
