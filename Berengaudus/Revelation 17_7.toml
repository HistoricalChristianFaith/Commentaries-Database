[[commentary]]
quote='''
And the angel said to me: Why do you marvel? I will tell you the mystery of the woman, and of the beast that carries her, which has seven heads and ten horns.

The beast in this place has the same meaning as we said above that the dragon had: for it signifies the Devil. What the seven heads and the ten horns are, he himself, as we said, explains in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
