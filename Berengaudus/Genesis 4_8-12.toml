[[commentary]]
quote='''
Cain, led by envy because the Lord had regard for Abel and for his gifts, killed him; likewise the Jews, seeing the signs that Christ worked by his own power and that of the Father, killed him, who was their brother according to the flesh. God cursed Cain because he had killed his brother Abel, and told him that he would be a wanderer and a fugitive upon the earth. Similarly the Jews are cursed not only by God, but by themselves, when they said of Christ: “His blood be upon us and upon our children” (Matt. 27:25). And they are wanderers and fugitives upon the earth, because, having no settled homeland of their own, they roam among all nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
