[[commentary]]
quote='''
And after the dragon saw that he was cast down to the earth, he persecuted the woman who had given birth to the male child.

Seeing that he, the Devil, had lost a very great multitude of the elect, and had been shut up within the straits of the hearts of the wicked, he persecuted the woman, that is, the Church; for he stirred up the emperors of the Romans and the whole multitude of the wicked to persecute the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
