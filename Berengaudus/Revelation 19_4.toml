[[commentary]]
quote='''
But in truth, by the twenty‑four elders, the fathers who lived under the Law are signified. To them are joined the four living creatures, through which the New Testament is prefigured; because in the Old Testament, if it is understood spiritually, the New is contained. They chanted “Alleluia,” because, observing the legal commandments, they strove by good works to please God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
