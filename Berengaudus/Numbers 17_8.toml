[[commentary]]
quote='''
Also that rod flourished in the tabernacle and produced nuts (Num. 17:8), because in the tabernacle of the Church afterwards the Old Testament brought forth flowers of spiritual senses, and those flowers themselves produced fruits of good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
