[[commentary]]
quote='''
And the serpent sent water out of his mouth after the woman, like a river, so that he might cause her to be swept away by the river.

The river of water is fleshly desires; for the Devil, seeing that the Church cannot be cast down by persecutions, but rather grows and is strengthened, wanted to send against her a multitude of fleshly desires, by which, once deceived, she would be drawn back to commit evil deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
