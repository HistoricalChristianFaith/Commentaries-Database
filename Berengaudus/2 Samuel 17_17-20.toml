[[commentary]]
quote='''
It is also written in the Book of Kings that David, fleeing from his son Absalom, sent two spies to Jerusalem to learn what his son was doing (2 Sam. 15:32-36). When Absalom heard of it, he sent men to capture them. But they fled and entered the house of a man whose wife hid them in a well in the courtyard, covering it over. When their pursuers came and asked for them, she replied: “They went on after taking a little water” (2 Sam. 17:20). Therefore, by telling the truth, she could have betrayed those whom she saved by lying. The stain of such lies, then, is wiped away by the love from which they spring, because “love covers a multitude of sins” (1 Peter 4:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
