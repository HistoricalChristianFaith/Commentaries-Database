[[commentary]]
quote='''
But if everyone who enters through the door into the sheepfold, that is, into the holy Church, will be saved, by what entrance have the depraved, whose countless numbers are contained within the holy Church, come in? Let us ask the Lord about this; for he says: He who does not enter through the door into the sheepfold, but climbs up another way, he is a thief and a robber (Jn. 10:1). Whoever therefore does not wish to observe what they promised in baptism has not entered through the door into the sheepfold, but has climbed up another way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
