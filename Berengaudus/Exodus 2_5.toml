[[commentary]]
quote='''
The daughter of Pharaoh, that is, of the Devil, prefigured the people from among the nations. The daughter of Pharaoh therefore took Moses up from the papyrus (Exod. 2:5); because the Church from the nations, receiving faith in Christ, took that same Christ away from the Jews who were unwilling to believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
