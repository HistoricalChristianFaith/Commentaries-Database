[[commentary]]
quote='''
In Genesis it is written that God said to Abraham: “The crying of Sodom and Gomorrah has come to me” (Gen. 18:20). The prophet Isaiah explains what the crying of Sodom is when he speaks of Israel: “They proclaimed their sin like Sodom and did not hide it” (Isa. 3:9). Therefore the proclamation of sin is called crying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
