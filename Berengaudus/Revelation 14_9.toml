[[commentary]]
quote='''
And the third angel followed them, saying with a loud voice: If anyone worships the beast and its image, and receives its mark on his forehead or on his hand, he too will drink of the wine of the wrath of God, which is mixed with the unmixed in the cup of Him.

The third angel are the preachers who are to come in the times of Antichrist; for they will preach that no one should worship Antichrist, nor bend the ears of the heart to his worst teaching, nor imitate his works; and they will bear witness that if anyone does this, he is to be condemned to everlasting punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
