[[commentary]]
quote='''
And men were scorched with great heat. Whoever wishes to know how great that heat was with which the Romans afflicted the Jews, let him read Josephus, and he will find that no nation in all the kingdoms of the earth perished more cruelly (Josephus, The Jewish War, 1.4). And they blasphemed the name of God who has power over these plagues. So wicked was the nation of the Jews that, although they knew they were suffering unheard‑of evils for their crimes, not only did they not cease from their blasphemies against Christ, but in their afflictions they spewed forth even far worse blasphemies against God. Where it also follows: And they did not repent so as to give Him glory; for they would have given glory to God if, repenting of their sins, they had believed in Christ and kept His commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
