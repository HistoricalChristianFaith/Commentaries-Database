[[commentary]]
quote='''
Nor does what the Apostle says discourage us from our understanding: “For no one can lay any foundation other than the one already laid, which is Jesus Christ” (1 Cor. 3:11). For Peter is not one foundation and Jesus Christ another; Peter is a member of Jesus Christ, as Christ himself said to his disciples: “You in me, and I in you” (Jn. 14:20). For Christ is the foundation of all his apostles, and they likewise are foundations for those who believed through them. There is therefore one foundation, namely Christ, by whom all the foundations are held together, and upon whom the whole structure of the Church has been built.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
