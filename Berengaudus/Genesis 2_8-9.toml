[[commentary]]
quote='''
In Genesis it is written that God planted a paradise of delight, in which he placed the man whom he had formed, which is described as being planted with various trees (Gen. 2:8). By the paradise, therefore, the Church is indicated; by the trees of paradise, on the other hand, the teachers of the Church are signified. And just as the trees of paradise supplied the first humans with the nourishment of their fruits, so the teachers of the Church do not cease to provide the nourishment of divine words to the souls of the faithful established in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
