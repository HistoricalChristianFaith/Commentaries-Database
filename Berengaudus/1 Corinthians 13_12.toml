[[commentary]]
quote='''
Therefore the temple of the heavenly homeland is now full of smoke, because the elect, placed in this life, when they lift the eyes of their mind to contemplate heavenly things, are darkened by a certain gloom which they cannot pass beyond; this darkening he calls “smoke.” Paul endured this gloom when he said: “Now we see through a mirror, in a mystery; but then face to face.” And again: “Now I know in part, but then I shall know even as I am known” (1 Cor. 13:12). And it must be noted that the elect suffer this dullness as long as they are placed in this life; but when they have passed to that heavenly blessedness, it will be taken away from the eyes of their mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
