[[commentary]]
quote='''
If, then, the glory of the preachers is the nations, what is the nations’ glory? Perhaps we should understand this according to Solomon, who says: “The glory of the aged is their children’s children, and the glory of children is their fathers” (Prov. 17:6). For the glory of the aged, that is, the apostles, is their children’s children: the nations who believed through them and through their children, that is, their disciples. The fathers of those children will be their glory, because the nations will rejoice to have fathers of such value and excellence, since they have been deemed worthy to share in their glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
