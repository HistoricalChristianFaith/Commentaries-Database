[[commentary]]
quote='''
For the wooden rod which Moses used represented the law which was given by him; for that rod, as we read in Exodus (Num. 20:11; cf. Exod. 17:6), struck the rock twice, and very abundant waters came forth, so that the people and the beasts drank. Therefore the rod is the Old Testament: the double striking the Law and the prophets; but the rock prefigured Christ. Therefore the rod struck the rock twice, when the Old Testament through the law and the prophets foretold that Christ would come for the redemption of humanity. And because it was impossible that those things which were foretold through the Law and the prophets should not be fulfilled, as the Lord says in the Gospel: It is easier for heaven and earth to pass away than for one iota or one tittle of the Law to pass away without being fulfilled (Luke 16:17). The rod struck the rock twice, when the prophecies of the prophets and the Law in a certain way compelled God to consent to become man. Therefore the rock was struck, and very abundant waters came forth, because Christ, according to what was said, coming, produced from himself the streams of heavenly doctrine, that is, the Gospel. The people and the beasts drank, that is, the Jews and the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
