[[commentary]]
quote='''
Four beasts were shown to Daniel in a vision (Dan. 7:3), through which four kingdoms were represented: moreover the fourth beast, which was strong and terrible, through which the Romans are indicated, is described as having had ten horns, through which the kingdoms that destroyed the Roman Empire are signified, as the holy Jerome explains, following the claim of certain authorities. Therefore the ten horns in this passage have the same meaning that those are said to have had; indeed, they signify the kingdoms by which the Roman Empire was destroyed. For they first took away a part of Asia by themselves: later the Saracens subdued the whole of it: the Vandals claimed Africa for themselves, the Goths Spain, the Lombards Italy, the Burgundians Gaul, the Franks Germany, the Huns Pannonia; moreover the Alans and the Suebi laid waste many places that were subject to their rule.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
