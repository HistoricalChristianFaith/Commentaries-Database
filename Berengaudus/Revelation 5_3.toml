[[commentary]]
quote='''
And no one was found worthy, neither in heaven nor on earth nor under the earth, to open the book and to break its seals.

For no Angel dwelling in heaven, no righteous person living on earth, and none even of those who had paid the debt of death, ever appeared in the world who could redeem humanity from the power of the Devil; and this redemption is the opening of the Old Testament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
