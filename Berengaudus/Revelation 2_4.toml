[[commentary]]
quote='''
But I have against you that you have abandoned your first love.

There are many who, at the beginning of their conversion, are fervent in the service of God, but in the course of time grow lukewarm; and it is clear that this happened to this bishop of the Church of Ephesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
