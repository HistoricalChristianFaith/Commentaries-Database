[[commentary]]
quote='''
And there were given to them each a white robe.

The white robes are the glory of holy souls; the saints of God now possess individual white robes, because while their bodies rest in the earth, they enjoy the eternal blessedness of the soul alone. They will then receive double robes when, after the resurrection, souls together with bodies will possess without end the glory of the heavenly homeland.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And it was said to them that they should rest yet for a little time, until their fellow servants and their brothers should be fulfilled, who are to be killed as they were.

A little time is the time until the day of judgment; it is called little because, in comparison with the future time, it is very small. Therefore the saints who desire this, that the day of judgment should come, on which they will receive both their bodies and the full reward for their labors, are ordered to wait for a little time, until the number of their brothers is fulfilled; because the day of judgment will not come until the whole number of the elect is complete. But we must inquire why only the souls of those slain for the name of Christ are said to have rested beneath the altar of God and to have received individual robes, when the souls of all the elect rest beneath this altar and likewise possess these same robes. Therefore, by the souls of those slain we must understand not only martyrs, but also all the souls of the righteous; because they too are dead to the world, so that they might live to God, as the Apostle says: “For you have died, and your life is hidden with Christ in God” (Col. 3:3). And he says of himself: “The world has been crucified to me, and I to the world” (Gal. 6:14); and: “All who want to live devoutly in Christ Jesus suffer persecution” (2 Tim. 3:12); and: “Through many tribulations we must enter the kingdom of God” (Acts 14:21). And John, the author of this book, is described as having drunk the cup of the Lord, although he rested without being killed by the sword.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
