[[commentary]]
quote='''
And it was given to her that she should clothe herself in shining, white linen. What linen signifies, he himself explains: For linen is the justifications of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
