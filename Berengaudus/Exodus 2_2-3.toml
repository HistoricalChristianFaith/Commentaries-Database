[[commentary]]
quote='''
In Exodus it is written that when Moses was born, he was hidden for three months by his parents; afterward his mother made for him a little basket of reeds, coated it with tar and pitch, and after placing the infant inside, set him among the reeds at the riverbank (Exod. 2:2-3). Moses prefigured Christ; and by the three months during which Moses was hidden, three periods of time are indicated: one before the flood; the second from after the flood up to Moses; the third from Moses up to the coming of the Lord. In these three periods the coming of Christ according to the flesh was hidden from men; yet it was foretold by the perfect. By the little basket of reeds the blessed Virgin Mary is signified: the mother therefore prepared the little basket of reeds in which Moses was to be placed, because the wisdom of God, which is the Son of God, chose the blessed and glorious Mary, ever virgin, in whose unaltered womb he would form the man to whom he would be joined by unity of person. By the tar, which cannot be dissolved by water, we can understand the virginity of blessed Mary, which could not be violated by any carnal heat; and by the pitch, which is the guardian of wine, humility, the guardian of the other virtues. Of this same humility she speaks, saying: “Because he has regarded the humility of his handmaid; for behold, from now on all generations will call me blessed” (Luke 1:48). By the river the world is signified; by the reeds in which Moses was placed, the Jews are signified; for later it is read that he was found in a papyrus basket by the daughter of Pharaoh. The reeds in this passage have the same meaning as the papyrus; for reeds are accustomed to wound the hands that touch them, while from papyrus in ancient times books used to be made. By the reeds, therefore, the Jews are signified, who killed the prophets, namely, spiritual physicians who wished to heal their wounds. The same people are also signified by the papyrus, because they boasted in the Scriptures handed down to them by God, which they read but did not keep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
