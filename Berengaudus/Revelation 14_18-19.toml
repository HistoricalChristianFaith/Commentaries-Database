[[commentary]]
quote='''
Similarly, the fourth angel who came out from the altar, who had power over the fire, has the same meaning as the second, who was seen to have come out of the temple; for he signifies the elect who labor in this life. The altar, however, signifies the Church, just as the temple does; and by the fire we can understand love, which the Holy Spirit, through spiritual kindling, nourishes in the hearts of the saints. The saints are therefore said to have power over this fire because they both possess love and are possessed by it. This angel then cried to the third angel who bore the second sickle, whom we have said signifies Christ, that he should harvest the clusters of the vineyard of the earth, by which the wicked are signified; for holy men, seeing every day humanity being deceived by demons, seeing also the wicked prosper, and the world always sliding into worse things, pray that the day of judgment may come, in which both the wickedness of the demons will perish together with its authors, and all transgression will reach its end together with the transgressors themselves, and everlasting justice will be brought in, which will be limited by no end. For the vineyard signifies the world, which has given birth to and nourished the whole multitude of the wicked; but the winepress, which we call hell [infernum], is therefore called the winepress of the wrath of God, because the vengeance of the wrath of God will be completed in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
