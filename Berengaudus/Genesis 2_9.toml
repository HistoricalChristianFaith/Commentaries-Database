[[commentary]]
quote='''
There were two trees in the middle of paradise, of which one was called the tree of life, and the other the tree of the knowledge of good and evil. Their power was such that if anyone ate from the tree of life, he would not die eternally; but if anyone ate from the tree of the knowledge of good and evil (Gen. 2:17), although he was immortal, he would immediately become mortal. Paradise therefore signifies the Church; but the tree of life in the middle of paradise is Christ in the midst of his Church. The tree of the knowledge of good and evil, which is also said to have been in the middle of paradise, signifies the Devil, who does not cease to move about among the faithful, so that he may deceive whomsoever he can. The tree of life therefore belongs to the elect, but the tree of the knowledge of good and evil to the wicked. The elect eat the fruit of the tree of life, so that they may live forever, because they keep the teachings of the Gospel, so that they may live forever with the Lord; but the wicked eat the fruit of the tree of the knowledge of good and evil, and they die, because they feed on the suggestions of the Devil and on all vices and pleasures; from this they draw down eternal damnation upon themselves. And just as the fruits of the tree of the knowledge of good and evil were more delightful to the woman than the fruits of the tree of life, so also the glory of this present age, which they see with the eyes of the body, is more delightful to the wicked than the glory of the heavenly homeland, which is seen only with spiritual eyes. But a question arises as to why it is called the tree of the knowledge of good and evil, since it brought to the first man the knowledge of evil, not the knowledge of good. It seems to me that this is to be solved in the following way: for the first angel, when he was created, had knowledge of good, not knowledge of evil; but he discovered the knowledge of evil through himself, on account of which he was cast down from that heavenly glory. The first man therefore ate from the tree of the knowledge of good and evil when he followed the suggestions of him who possessed the knowledge of good and evil; for the tree itself could not teach the knowledge of evil, but the Devil, who persuaded the man to transgress the command of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
