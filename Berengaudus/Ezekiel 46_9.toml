[[commentary]]
quote='''
The southern gate represents the Old Testament, while the northern gate represents the New. Those said to come from the south represent the Jews; those from the north represent the Gentiles. The Jews, then, who knew God and to whom the Law had been given from the direction of the sun, that is, from the south, where the sun burns more fiercely, are rightly said to come to the Church. They entered through the southern gate because, recognizing that Christ had been prophesied in many ways and prefigured in various forms in the Old Testament, they were drawn by their own Scriptures to embrace faith in Christ. The Gentiles, however, abandoning idolatry and renouncing the one who said, “I will sit on the mountain of the covenant, on the sides of the north; I will ascend above the heights of the clouds; I will be like the Most High” (Isa. 14:13), are fittingly said to come from the north. They entered through the northern gate because, hearing the teaching of the Gospel and marveling at the miracles performed through Christ and his ministers, they rushed to embrace faith in Christ. It was also commanded that no one return by the way he had entered, but that he leave by the gate opposite: whoever entered through the southern gate was to leave through the northern, and whoever entered through the northern was to leave through the southern. The Jews, whom understanding the Old Testament led to embrace faith in Christ, were not to return by the way they had come, that is, to observe the legal ordinances in a bodily manner. Rather, they were to leave through the northern gate, turning to ponder and examine the teaching of the Gospel, so that they might learn to fulfill spiritually what they had previously attempted to do in a bodily manner. The Gentiles, who entered through the northern gate, that is, who became children of the Church through the teaching of the Gospel, were not to return by the way they had come, namely, by going back to investigate the errors of the philosophers. Instead, after embracing the faith and teaching of the Gospel, they were to turn to the southern gate, that is, to examine the teaching of the Old Testament. When they found Christ foretold there in many ways, their faith in Christ would be strengthened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
