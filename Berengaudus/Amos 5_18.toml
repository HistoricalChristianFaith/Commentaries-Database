[[commentary]]
quote='''
Yet here a question arises: why do the saints desire the day of the Lord, when the prophet says, “Woe to those who desire the day of the Lord” (Amos 5:18)? For we know that the day of the Lord is the condemnation of the wicked, as we have already said. And what need was there for the prophet to say, “Woe to those who desire the day of the Lord,” when no wicked person is found who either desires his own death or the day of the Lord, since he fears being condemned in it? And because what the prophet said is true, we must investigate what it signifies. Indeed, the condemnation of the wicked is their sins: whoever therefore desires to go to bed with a prostitute, desires his own condemnation; whoever desires to get drunk, desires his own condemnation; whoever desires to steal a horse or an ox or anything like that, desires his own condemnation; whoever desires to inflict some harm on his neighbor, desires his own condemnation. Therefore, since the condemnation of the wicked will be the day of judgment, whoever desires to commit those crimes for which he will be condemned on the day of judgment, desires the day of the Lord, that is, he desires his own condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
