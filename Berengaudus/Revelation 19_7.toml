[[commentary]]
quote='''
Let us rejoice and exult, and give glory to him; for the marriage of the Lamb has come, and his wife has prepared herself. Therefore let us rejoice, therefore let us exult, because by the mercy of our Creator he has consented so to join to himself his Church, which is we ourselves, as a bride is joined to her bridegroom; so that we may be with him one flesh, as Scripture says: The two shall be in one flesh (Gen. 2:24; Eph. 5:32); which the Apostle taught must be understood of Christ and the Church. His wife has prepared herself, that is, the Church, which is called the wife of the Lamb, has adorned herself with various virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
