[[commentary]]
quote='''
Likewise Jacob also, after the struggle that he had with the Angel, is said to have limped with one foot: but the one who limps leans his whole weight on the good foot, while the other touches the ground only for a short while. Therefore the two feet signify two kinds of nourishment; for there is nourishment of the body, and there is nourishment of the soul. The nourishment of the body is food, drink, clothing; but the nourishment of the soul is the word of God and good works. Therefore each believer, if with one foot he touches the earth for a short time, leans entirely on the other; because he uses the things of the world only to relieve the needs of the body, as the Apostle says: “But having food and clothing, let us be content with these” (1 Tim. 6:8). But in those things that refer to the salvation of the soul, he throws himself wholly; lest he should ever turn aside from the way of God, which is the salvation of the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
