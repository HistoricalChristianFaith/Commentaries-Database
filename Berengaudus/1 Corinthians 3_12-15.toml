[[commentary]]
quote='''
Paul speaks of this foundation, saying: “If anyone builds upon this foundation with gold, silver, precious stones, wood, hay, or straw, each one’s work will be tested by fire to show what it is” (1 Cor. 3:12). Here he named six kinds: three valuable and three worthless. Gold often signifies wisdom. A person builds gold upon Christ the foundation when he stores in his heart the wisdom that crushes vices and nurtures virtues, following the Psalmist, who said: “I have hidden your words in my heart, that I might not sin against you” (Ps. 118:11). Silver signifies the word of preaching, of which the same Psalmist says: “The words of the Lord are pure words, silver refined by fire” (Ps. 11:7). A person builds silver upon Christ the foundation when he teaches others the good he has learned, so as to lead them to do good works. Precious stones signify good works. A person builds precious stones upon Christ the foundation when he fulfills in deeds the good he teaches. Some do not have words of encouragement with which to instruct others fully, but by exercising themselves in good works, they build precious stones upon Christ the foundation. Likewise, those who know little but teach it to others build silver upon Christ, provided they fulfill in their deeds what they teach. Many build upon Christ by teaching others the understanding they have received, but through evil deeds they destroy within themselves what they have built. Wood, hay, and straw signify minor sins. But there is another interpretation that prevents us from understanding them in this way, for sins are not built upon Christ; rather, works of virtue are. When we sin, we withdraw from the building constructed upon Christ, and the more grievously we sin, the farther we are separated from it. But when through repentance we return to doing good works, we return to the building constructed upon Christ. We can therefore understand wood as earthly labor: a person devotes himself to such work to earn a living, lest he be driven by need to steal. For the Apostle commands that each person work quietly and eat his own bread; and again: “Whoever is unwilling to work,” he says, “shall not eat” (2 Thess. 3:10, 12). By hay we can understand earthly affection, as when someone loves his wife, children, and brothers out of bodily attachment. The Apostle also commands that husbands love their wives, wives their husbands, and children and parents one another (Eph. 5:25, 28). By straw we can understand those who take wives because they are troubled by lust and unable to restrain themselves. The Apostle also commands this, saying: “Because of sexual immorality, each man should have his own wife, and each woman her own husband” (1 Cor. 7:2). And because such ways of life cannot be free from frequent failings, he says that such people will be saved through fire, that is, through purgatorial fire. This will happen if they abstain from grave sins and, by giving generously in alms, merit the possibility of being saved after death through purgatorial fire. For just as gold made impure by admixtures is purified by fire, so these people are cleansed by fire of the impurities they contracted through worldly deeds, so that they may become worthy of being joined to the company of the elect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
