[[commentary]]
quote='''
Do not fear any of these things that you are about to suffer.

Troubles are foretold to him so that he may be able to endure what comes more easily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Behold, the Devil is about to cast some of you into prison so that you may be tested:

That is, some of you the Devil, that is, the servants of the Devil, will send into prison, so that you may be tested whether, through fear of punishments, you will withdraw from the faith, or decide to die for love of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And you will have tribulation for ten days.

He has shown the time during which this persecution would rage more cruelly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Be faithful unto death, and I will give you the crown of life.

The crown of life signifies eternal glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
