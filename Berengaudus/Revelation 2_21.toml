[[commentary]]
quote='''
And I gave her time to repent, and she does not want to repent of her acts of fornication.

Just as blessed Job says of the wicked man: God gave him a place for repentance, and he abused it in pride (Job 24:23).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
