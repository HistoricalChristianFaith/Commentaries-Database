[[commentary]]
quote='''
We can also adapt to this our exposition what the same Solomon sets forth in another place, saying: “Give a portion to seven, and also to eight” (Eccles. 11:2). First, then, we must ask what that is of which we are commanded to make portions. For there is a certain good, and this is the highest good, namely love, which, unless it is divided into parts, will not be a perfect good; for it is divided into love of God and love of neighbor. Though it is one, it nonetheless has two arms, which it stretches around everywhere, joining God to humans and humans to God. There are also two lives, one called active, the other called contemplative. Love of neighbor belongs to the active life, but love of God properly belongs to the contemplative life. Therefore we can understand by “seven” the whole multitude of the elect, and by “eight” our Lord Jesus Christ, because He rose on the eighth day. So the holy ones of God give a portion of their love to seven when they are engaged in the exercises of the active life, that is, when they bestow care upon their neighbor, not only bodily but also spiritual care. They also give a portion to eight when the love of God again calls them back to contemplation of Him. Another interpretation: We give a portion to seven when we show due veneration to the saints of God; we give a portion to eight when we offer due worship to God, our Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
