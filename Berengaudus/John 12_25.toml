[[commentary]]
quote='''
The Lord also says in the Gospel: Whoever loves his soul will lose it, and whoever hates his soul in this world will keep it unto eternal life (Jn. 12:25). For when he says in this world, he shows how we ought to understand this. Therefore, whoever loves his soul in this world will lose it, that is, he will lose it according to this age; and whoever hates his soul in this world, that is, according to this age, will keep it unto eternal life. The lovers of the world love their souls according to this age, because they would never want to leave this present life, so that they might always live in luxury. That rich man loved his soul according to this age, who said: Soul, you have many good things laid up for many years; eat, drink, rejoice, and be satisfied (Luke 12:19). But the saints, who do not wish to be conformed to this age, as the Apostle says (Rom. 12:2), but to be transformed in the renewal of spiritual understanding; who do not love the world nor the things that are in the world; who do not wish to be friends of this age, lest they be made enemies of God; they hate their souls in this world (1 Jn. 2:15), that is, they do not love them according to this age (James 4:4), but according to God, for whose love they despise all things that are temporary, so that they may keep their souls unto eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
