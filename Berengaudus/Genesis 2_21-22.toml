[[commentary]]
quote='''
For Adam also prefigured Christ, and Eve the Church: and just as Eve was made from the side of the man while he slept, so also the Church was fashioned from the side of Christ as he hung upon the cross; because by his blood she was redeemed and cleansed from defilements.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
