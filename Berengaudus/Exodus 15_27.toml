[[commentary]]
quote='''
That event also, in which at Elim they found twelve springs and pitched their camp beside the waters (Exod. 15:27), has the same meaning; for by the waters of the twelve springs the teaching of the New Testament is signified, which flowed forth into the whole world from the twelve springs, that is, from the twelve apostles; and by the seventy palm trees the Old Testament is signified, because through the translation of the Septuagint translators it came to the knowledge of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
