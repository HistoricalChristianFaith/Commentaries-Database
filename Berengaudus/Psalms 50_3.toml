[[commentary]]
quote='''
David also says in the forty-ninth psalm: “Fire blazes before him, and a mighty tempest surrounds him” (Ps. 49:3). Some interpret this verse to mean that after the elements have been kindled, rain will fall to wash away the ashes of the conflagration. But this interpretation seems to me utterly absurd. For we know that rain rises from the sea and the earth, either through mist or through the sun’s evaporation. Just as water lifts lighter things from the bottom to the surface, so air lifts water, whether turned into mist or, through the sun’s heat, reduced to the thinnest, almost invisible vapor, to the place where it reaches its limit. There it gathers and first becomes a dense mist, which we call a cloud; then, driven by the wind, its tiniest drops mingle together and grow heavy through their union, fall to the earth, and make rain. Behold: the earth, the air, the sea, and the other elements will be consumed by fire. (2 Peter 3:10) From where, then, will rain arise, especially since, according to the Apostle (Rom. 8:21), creation will then be freed from its bondage to decay and brought into the glorious freedom of the children of God? Can God, who created all things from nothing, not cleanse his creation without the aid of rain, especially when the world itself will be restored after the fire to a better and far more beautiful state? And what are ashes but clean earth? For whatever impurities fire consumes, it turns into clean ashes. Can God not restore clean ashes to a better state alongside another earth, so that rain for washing will not be necessary?

Let us put it another way: The washings of all filth are either absorbed by the earth or flow into rivers, and with the rivers into the sea. How will the earth, after being tested by fire, absorb its own filth and become filthy again? Or how will it flow into rivers and, with the rivers, into the sea, when the sea will no longer exist, as the following passages of this book seem to admit? But if the sea is restored to a better state, like the heavens and the earth, how will it be polluted by the earth’s filth? And if someone says that it will suffer pollution before this renewal, and that these things will be reduced to nothing when it is transformed, can God not reduce the same filth to nothing on land just as in water, so that it need not flow into the sea? We may therefore understand the mighty storm as the final destruction of the wicked, which Wisdom, through Solomon, declares will befall the wicked at the final judgment, saying: “I too will laugh at your destruction and mock you when what you fear comes upon you; when sudden calamity strikes and destruction comes upon you like a storm” (Prov. 1:26-27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
