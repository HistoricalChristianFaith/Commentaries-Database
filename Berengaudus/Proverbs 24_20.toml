[[commentary]]
quote='''
By the light of the lamp, the glory of this age is indicated: of this lamp Scripture says, “The lamp of the wicked will be extinguished” (Prov. 24:20). Indeed, the lamp of the wicked is extinguished when, taken away from this life, they lose their temporal joy and suffer eternal sorrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
