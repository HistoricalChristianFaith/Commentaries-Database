[[commentary]]
quote='''
I was rebuked by someone for saying that Peter was the foundation of the Church, in the passage where the Lord says: “You are Peter, and upon this rock I will build my Church” (Matt. 16:18). If Peter is the foundation of the Church, as are the other apostles, as the present passage plainly shows, then the Church was built upon him, just as it was upon the others. But if the Church was not built upon Peter, then neither was it built upon the others. Therefore this present assertion of John is false, since he says that the twelve apostles are the twelve foundations of the Church. Nor does what the Apostle says discourage us from our understanding: “For no one can lay any foundation other than the one already laid, which is Jesus Christ” (1 Cor. 3:11). For Peter is not one foundation and Jesus Christ another; Peter is a member of Jesus Christ, as Christ himself said to his disciples: “You in me, and I in you” (Jn. 14:20). For Christ is the foundation of all his apostles, and they likewise are foundations for those who believed through them. There is therefore one foundation, namely Christ, by whom all the foundations are held together, and upon whom the whole structure of the Church has been built.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
