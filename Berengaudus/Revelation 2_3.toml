[[commentary]]
quote='''
And you have patience, and you have endured for my name’s sake, and you have not failed:

That is, in this your patience has appeared, because in the labors that you endured for my name, you did not fail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
