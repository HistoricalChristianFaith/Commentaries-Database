[[commentary]]
quote='''
By the tail, which is the end of the body, the Antichrist is signified. Therefore, the tail of the dragon was seen to drag a third part of the stars of heaven; because the Antichrist will deceive many of those who were thought by men to be elect, and who in the Church shine, like stars in heaven, with knowledge and understanding, and he will plunge them into the pit of destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And the dragon stood before the woman who was about to give birth, so that when she had brought forth, he might devour her child.

In this place we can also understand the blessed Mary by the woman, because she is the mother of the Church, since she gave birth to him who is the head of the Church; and she is the daughter of the Church, because she is the greatest member of the Church. Therefore the dragon stood before the woman, so that when she had given birth, he might devour her child; because at the very beginning of Christ’s birth he wished to kill him through Herod, his servant (Matt. 2:13). He also stands before the woman, that is, the Church, so that those whom she brings forth for God through baptism he may destroy by evil persuasion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
