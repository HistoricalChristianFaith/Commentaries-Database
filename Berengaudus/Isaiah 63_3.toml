[[commentary]]
quote='''
Isaiah, when he was speaking of the passion of the Lord, introduced the Lord saying: I have trodden the winepress alone, and of the nations there is no man with me (Isa. 63:3). But there, by the winepress the cross of the Lord is understood; here, however, not the cross, but the place of punishments into which the wicked are to be thrust is signified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
