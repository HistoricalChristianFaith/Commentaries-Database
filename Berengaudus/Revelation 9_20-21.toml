[[commentary]]
quote='''
And the rest of the men who were not killed by those plagues did not do penance for the works of their hands, so as not to adore demons and idols of gold and silver and bronze and stone and wood, which can neither see nor hear nor walk; and they did not do penance for their murders, nor for their sorceries, nor for their fornication, nor for their thefts;

It is understood that they perished. Therefore, the third part, which was killed, was made safe, that is, the elect, among whom many were killed for the name of Christ; the rest would most gladly have died, if necessity had demanded it. But the others, that is, the pagans, who were unwilling to believe in Christ so that they might do penance for their iniquities, perished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
