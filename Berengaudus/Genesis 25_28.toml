[[commentary]]
quote='''
Isaac loved Esau because he ate the food of his hunting; but Rebecca loved Jacob. Isaac, as we have said, in this passage holds the type of the Lord; through Rebecca, however, we can understand the foreknowledge of God. Isaac therefore loved Esau because he ate the food of his hunting, since God loved the Jewish people because he was pleased by their continual offerings; but the mother loved Jacob, because God, knowing through the grace of his foreknowledge that the people of the nations would be far better than the Jewish people, loved him much more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
