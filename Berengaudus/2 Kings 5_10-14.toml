[[commentary]]
quote='''
Similarly, Elisha also prefigured Christ, and Naaman represented the people of the nations. There were many lepers in Israel, and none of them was cleansed except Naaman the Syrian, because when Christ came in the flesh, both the Jews and the Gentiles were surrounded by the leprosy of their sins; but as the Jews remained in their wickedness, the nations were cleansed from the leprosy of their sins. Therefore Elisha ordered Naaman, saying: Go and wash seven times in the Jordan, and your flesh will receive health, and you will be made clean (2 Kings 5:10). He went and washed seven times in the Jordan, and his flesh was restored like the flesh of a little child, and he was cleansed from the leprosy. The water of the Jordan prefigured baptism, because in it Christ was baptized. Naaman was washed in the waters of the Jordan and cleansed from leprosy; for the people of the nations have been purified from the leprosy of their sins by the water of holy baptism. And his sevenfold washing prefigured the sevenfold Holy Spirit, through whose working the remission of sins is given in baptism; for just as the body is visibly washed by the waters of baptism, so the soul is invisibly cleansed from all sins through the working of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
