[[commentary]]
quote='''
And people and tribes and tongues and nations will see their bodies for three and a half days, and they will not allow their bodies to be placed in tombs; and the inhabitants of the earth will rejoice over them and be glad, and will send gifts to one another, because those two prophets tormented those who dwelt on the earth. And after three and a half days, the spirit of life from God entered into them, and they stood upon their feet, and great fear fell upon all who saw them. And they heard a great voice from heaven saying to them: Come up here. And they went up into heaven in a cloud, and their enemies saw them.

If this is fulfilled according to history, it is indeed unknown to men, but all things are known to God. Yet we also can add a spiritual understanding to this history; but it seems rash to wish to adorn with spiritual meanings that history which we understand. For when we are outside a house, we are in no way able to decorate its interior; but so that we may not appear to have kept entirely silent, let us say a few things. We can understand the three and a half days as three and a half years, during which those two prophets are to preach; and by the tombs we can understand the minds of the wicked. Concerning these tombs the Lord speaks, saying: Woe to you, scribes and Pharisees, because you are like whitewashed tombs, which indeed appear outwardly beautiful, but within are full of all uncleanness and the bones of the dead (Matt. 23:27). So you also outwardly appear righteous to men, but within you are full of plunder and iniquity. Therefore in the tombs the depraved will not allow the bodies of the saints to be placed, because they will cast the teaching of those saints out of their minds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
