[[commentary]]
quote='''
And every shipmaster and all who sail on the lake, and the sailors who work on the sea, stood far off and cried out when they saw the place of her burning, saying: “What city is like this great city?” And they cast dust on their heads, weeping and mourning, and saying: “Alas, alas, that great city, in which all who have ships on the sea became rich by her prices; for in a single hour she has been laid waste!”

By the sea we can understand this present age; by the shipmasters, in fact, we can understand wicked rulers; and by those who sail from place to place, and by the sailors who work on the sea, we can understand those who carry out various tasks in the world for the plundering of the poor and for the daily increase of their sins. These, then, will weep and mourn when they see the place of Babylon’s burning; for they themselves will be Babylon, and they themselves will mourn and weep. Moreover, they will see the burnings of Babylon because, by enduring their own burnings, they will see what, as people set in the world, they neglected to perceive with the mind so that they might correct themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
