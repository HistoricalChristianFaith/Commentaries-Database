[[commentary]]
quote='''
And the Devil who was deceiving them was cast into the lake of fire and sulfur, where the beast and the false prophet are.

This will be fulfilled when the Lord says: “Depart from me, you cursed, into the eternal fire prepared for the Devil and his angels” (Matt. 25:41).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And they were tormented day and night for ever and ever.

May our Redeemer, in his mercy, agree to free us from this torment, he who lives and reigns with the Father and the Holy Spirit for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
