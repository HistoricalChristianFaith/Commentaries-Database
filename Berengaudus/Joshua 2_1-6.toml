[[commentary]]
quote='''
It is also written in Joshua that he sent two spies to explore Jericho (Josh. 2:4-6). They entered the house of a prostitute named Rahab, who hid them in the inner part of her house. When their pursuers came, she said that they had escaped in the dark as the gate was closing. By this lie she freed them from their pursuers, and she herself, together with all her family, was saved from the danger of death. For this deed she is praised by the blessed Apostle Paul in his Epistle to the Hebrews. He says: “By faith Rahab the prostitute did not perish with the unbelievers, because she had received the spies in peace” (Heb. 11:31).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
