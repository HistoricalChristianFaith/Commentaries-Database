[[commentary]]
quote='''
In Ezekiel (Ezek. 46:1 and so on) it is written that the temple shown to him had three gates: the eastern, the southern, and the northern. God commands that the eastern gate always remain shut, with only the Prince entering and leaving through it. The eastern gate represents the blessed and glorious Virgin Mary, who remained shut before the Prince, that is, Christ, entered, and remained shut forever after he left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
