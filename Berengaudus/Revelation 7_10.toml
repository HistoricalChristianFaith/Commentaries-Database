[[commentary]]
quote='''
The palms are the rewards of the saints’ victory; and they are said to cry out with a loud voice: Salvation belongs to our God who sits upon the throne, and to the Lamb. The holy ones of God never cease from the praises of God, nor is there any toil in praising God; for just as the vision of God is sweet to the saints, so too is the praise of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
