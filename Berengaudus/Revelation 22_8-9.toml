[[commentary]]
quote='''
And I, John, who heard and saw these things, after hearing and seeing them, fell down to worship at the feet of the angel who showed them to me. But he said to me, “See that you do not do this! I am your fellow servant, and the fellow servant of your brothers the prophets, and of those who keep the words of this book. Worship God.”

Blessed Gregory sufficiently explained why the angel did not wish to be worshiped by John. But we must ask why John repeated what he had previously been forbidden to do. If we carefully examine the text of this book, we will see that it did not happen without reason. For when the angel showed him Christ seated upon his throne, the four living creatures, and the twenty-four elders, (chapters 4 and 5) John is not said to have wished to worship the angel. Likewise, when the angel showed him how the Lamb opened the seven seals, (Rev. 6:1-17) and the things that took place at the sounding of the seven angels’ trumpets, (Rev. 8–11) as well as those said to have taken place when the seven angels poured out their bowls, (chapter 16) John is not said to have wished to worship the angel. But when the vision reached the passage in which the angel showed him how Christ’s bride, that is, the Church, was joined to Christ, namely, where it is written, “Let us rejoice and be glad, and give glory to him, for the marriage of the Lamb has come, and his wife has made herself ready; and it was granted to her to clothe herself in bright, pure linen.” (Rev. 19:7–8) For, it says, “the fine linen is the righteous deeds of the saints” (Rev. 19:8) then John immediately wished to worship the angel. Likewise, in what follows, when the angel showed him the downfall of the Antichrist, the binding of the Devil in the abyss, and the glory of the resurrection, (Rev. 19-20) John in no way wished to worship the angel. But when, at the end of this vision, he was shown how the Church, after the glory of the resurrection, would be joined to Christ and reign with him forever, he immediately wished to worship the angel. For the Church is joined to Christ every day through faith and the other good works that are represented by the fine linen. After the resurrection, however, she will be joined to him far more fully and gloriously: no longer in part, as now, but all together, to dwell with him forever and reign without end. Therefore John wished to worship the angel twice because the angel showed him the Church’s two unions with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
