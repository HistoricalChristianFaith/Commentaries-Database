[[commentary]]
quote='''
And he deceived the inhabitants of the earth because of the signs that were given to him to perform in the sight of the beast.

There is nothing that so deceives simple people as the display of signs. And therefore the ministers of Antichrist, by reason of the working of signs, will easily deceive the multitude of fools.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Saying to the inhabitants of the earth that they should make an image of the beast which has the wound of the sword and lived.

That is, that in images Antichrist may be worshiped. But when he said that the beast had the wound of the sword and lived, it may come to pass that by demonic art Antichrist pretends to die and to rise again, so that by this deed he may more easily deceive men; which Simon Magus is said to have done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
