[[commentary]]
quote='''
And I heard the fourth angel saying: You are just, who are, and who were, holy, because you have judged these things; for they poured out the blood of the saints and of the prophets, and you have given them blood to drink, which they are worthy of.

By the fourth angel we can understand the angel of that people, who, seeing by the just judgment of God that the wicked people have been condemned, praises the most just sentence of almighty God. And because they poured the blood of the saints and of the prophets, they drank blood; because for the temporal death which they inflicted upon the righteous, they received eternal death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
