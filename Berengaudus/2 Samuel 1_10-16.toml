[[commentary]]
quote='''
You say you killed a man, and have laid upon yourself the guilt of murder. Your lying tongue did what your hand could not accomplish. And do you want me to prove that by lying you made yourself guilty of murder? Saul, as we read in the Book of Kings (1 Sam. 31:4), killed himself with his own hand out of fear of the Philistines. A certain man came to holy David and said that he himself had killed Saul, who was pursuing him. But David, understanding through the spirit of prophecy that the man was lying, ordered him to be punished as a murderer. Laying the guilt of murder upon him, he said: “Your blood be upon your own head, for your mouth has spoken against you, saying, ‘I killed the Lord’s anointed’” (2 Sam. 1:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
