[[commentary]]
quote='''
And to the angel of the Church in Smyrna write: These things says the First and the Last, who was dead and lives: I know your tribulation and your poverty.

It can be that the Church of the Smyrnaeans endured the same persecution from their own countrymen in the plundering of their goods as that which was in Jerusalem. And therefore its tribulation and poverty, which it endured for him, are praised by the Lord. Through this voluntary poverty can also be understood, of which the Lord says in the Gospel: Blessed are the poor in spirit, for theirs is the kingdom of heaven (Matt. 5:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
But you are rich:

poor in goods, namely, rich in virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And you are blasphemed by those who say that they are Jews and are not, but are a synagogue of Satan.

Jews is interpreted as confessors: Jews who deny Christ by blaspheming him are not Jews, that is, confessors; but they are fittingly called a synagogue of Satan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
