[[commentary]]
quote='''
You shall not plow with an ox and a donkey together (Deut. 22:10). By the ox we can understand the apostles and the other preachers; by the donkey we can understand the people of the Jews. We truly plow when, according to the tradition of the saints, we exercise ourselves in good works. Therefore, whoever tries to keep at the same time the teaching of the apostles and the traditions of the Jews, plows with an ox and a donkey together. From this teaching the Apostle Paul tried to call the Galatians back when he said: O foolish Galatians! Who has bewitched you, that you should not obey the truth? For I tell you that if you are circumcised, Christ will be of no benefit to you (Gal. 3:1; 5:2). We can also understand by the ox any wise preacher, and by the donkey a foolish one. Therefore it is commanded that one shall not plow with an ox and a donkey together, that is, that a fool must not be joined to a wise man in the office of preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
