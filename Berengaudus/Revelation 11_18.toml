[[commentary]]
quote='''
The nations were enraged because wicked men persecuted the Church of God, so that they might extinguish the name of Christ from the world. But the wrath of God will come when the day of judgment arrives; the time will come for the dead to be judged, that is to say, for the dead to be judged. Those dead, namely, who, placed in this life, did not fear to destroy their souls by living wickedly. And to give the reward to your servants the prophets and the saints, and to those who fear your name, small and great. This will then be fulfilled when, on the day of judgment, he will say: Come, blessed of my Father, receive the kingdom that has been prepared for you from the foundation of the world (Matt. 25:34). He calls those “small” who are of lesser merit; “great,” those who obtain greater favor with God. And to destroy those who corrupted the earth. He calls the wicked the corrupters of the earth; this will then be fulfilled when he will say: Depart, accursed, into the eternal fire which has been prepared for the devil and his angels (Matt. 25:41). But we must ask which earth the wicked have corrupted. Surely they have corrupted themselves by living wickedly, when in luxuries and in other vices they have pampered their bodies. They have also corrupted the earth of others, namely, of those whom they have drawn, by words and by example, to commit evil deeds. Now he returns to those things which he had passed over, that is, to recount the evils of Antichrist. And so that he may arrive more fittingly at expressing them, he begins from the coming of Christ, and, by recalling the evils which the Church has suffered from the Devil, he adds how that same Devil will try to overthrow this same Church through Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
