[[commentary]]
quote='''
But the fountain that went out from the midst of paradise signified the Gospel, which springs up in the midst of the holy Church. This was then divided into four heads, because the teaching of the Gospel is divided into four books and goes around all the boundaries of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
