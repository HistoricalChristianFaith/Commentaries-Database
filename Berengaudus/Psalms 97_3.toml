[[commentary]]
quote='''
Fire will come down from heaven, for when the Lord comes to judge, fire will go before him. It will consume not only the whole host of the wicked, but the world itself, as David says in the ninety-sixth psalm: “Fire goes before him and sets his enemies ablaze all around” (Ps. 96:3). For although the wicked live among the elect, they are all around them; just as enemies surround a city to capture it, so the Church is surrounded by the wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
