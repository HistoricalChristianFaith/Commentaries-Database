[[commentary]]
quote='''
And I went to the angel and told him to give me the book.

The apostles went to Christ so that they might be instructed by him in the teaching of the divine Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
