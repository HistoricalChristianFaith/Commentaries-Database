[[commentary]]
quote='''
Similarly, Elisha also prefigured Christ, and Naaman represented the people of the nations. There were many lepers in Israel, and none of them was cleansed except Naaman the Syrian, because when Christ came in the flesh, both the Jews and the Gentiles were surrounded by the leprosy of their sins; but as the Jews remained in their wickedness, the nations were cleansed from the leprosy of their sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
