[[commentary]]
quote='''
And it was commanded to them that they should not kill them.

When he says, “it was commanded to them,” it seems to me to refer to the demons; for such is the wickedness of demons that, if God had allowed it, as soon as a man had committed a mortal crime, they would immediately kill him. But God waits for wicked people, so that at some time they may return to him through repentance and be saved, or so that the righteous may be tested by them. For the Psalmist also, when he was speaking about the wicked, prayed, saying: “Do not kill them, lest my people forget” (Ps. 58:12). And in the book of Judges it is written that God left the Canaanites and the Philistines, so that in them Israel might be tested, and might gain knowledge of how to fight against enemies (Judg. 3:1–2). Therefore God commanded, that is, did not permit, that all heretics or all wicked people be wiped out, so that the righteous might have those by whom they would be tested, like gold which is tested by fire. And so it follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
But that they should be tormented for five months.

By the five months we can understand the whole span of the present life, which consists of five ages. For the first age is infancy, the second childhood, the third adolescence, the fourth youth, the fifth old age; although blessed Gregory, in order to make the ages of human beings correspond to the six ages of the world, divided old age into two parts. Therefore in the five months, that is, in all the time of the present life, not only heretics but all the wicked are tormented. For, whether they wish it or not, when they call to mind death and the punishment that follows death, and although they seem to exult in worldly prosperity, nevertheless they are inwardly tormented, because they know that for their crimes they are to be tormented eternally. By contrast, the righteous, although outwardly afflicted in various ways, yet inwardly exult in the hope of heavenly glory, which they believe they will attain. We can also understand by the five months all the time of this world: for the first month is from the origin of the world up to the Flood; the second from the Flood up to Moses; the third from Moses up to David; the fourth from David up to Christ; the fifth from Christ up to the end of the age. In these five months, therefore, all the makers of errors are tormented, either in the way we have said above, or because they see their false inventions overcome by the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And their torment is like the torment of a scorpion when it strikes a man.

We said above that by “scorpions” demons are indicated; for just as the scorpion wounds the body with its sting, so that through the wound it may inject its venom by which it kills a man, so too the Devil wounds the mind by anger, or pride, or lust, or some carnal delight, so that through this he pours in the venom of his malice and kills the soul. Therefore the torment of the locusts is said to be like the torment of a scorpion, because heretics, imitating their father the Devil, with smooth and well‑crafted words wounded the minds of unlearned people, and by injecting in the venom of their error killed their souls. Indeed, by the torment of souls we can understand their destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
