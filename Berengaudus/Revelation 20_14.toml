[[commentary]]
quote='''
And death and hell were thrown into the lake of fire . . . and anyone not found written in the book of life was thrown into the fiery furnace.

Death and hell were thrown into the lake of fire, that is, souls together with their bodies. By “death” we may also understand the demons, since they were the authors of death. Death and hell will be thrown into the lake, because the demons, along with the other wicked, will be plunged into hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
