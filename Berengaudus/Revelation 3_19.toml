[[commentary]]
quote='''
I reprove and chastise those whom I love.

As Scripture says: For the Lord corrects the one he loves; he scourges every son whom he receives (Heb. 12:6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Therefore be zealous, and do penance:

That is, imitate the good, and do penance, because up to now you have been sluggish in good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
