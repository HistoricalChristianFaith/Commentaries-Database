[[commentary]]
quote='''
And he carried me to a great and lofty mountain.

This mountain is Christ. The Prophet speaks of this mountain, saying: “In the last days, the mountain of the house of the Lord shall be established above the tops of the mountains” (Isa. 2:2). The mountains above whose tops the mountain of the house of the Lord is said to be established signify the Fathers of the Old Testament. Therefore the mountain of the house of the Lord is said to be established above their tops because they themselves foretold him, and when he came in the flesh, he surpassed them by a wondrous height. Therefore the house of the Lord, that is, the Church, was built upon this mountain, because it was founded upon Christ, as the Apostle Paul says: “For no one can lay any foundation other than the one already laid, which is Jesus Christ” (1 Cor. 3:11).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And he showed me the holy city, Jerusalem, coming down out of heaven from God, having the glory of God.

It should be noted that Ezekiel’s final vision agrees in some places with this vision of John; therefore, it pleased us to insert a few things from that vision into this work. For he says (Ezek. 40:2) that a mountain was shown to him, on which stood a city, and within it a temple. Although he mentions only the city, he speaks at length about the structure of the temple. The temple there therefore has the same meaning as the city here, for both signify the Church. The temple signifies the Church of the present age, while the city of Jerusalem signifies the Church as it will be after the end of the world. But someone may ask: How does this description of Jerusalem, that is, of the Church, refer to a future time, when this vision seems to describe its form in the present age? We answer that the Church cannot be fully known as long as it remains in this life, but is kept hidden, as it were, beneath a veil, since it is unknown who is rejected or chosen, or to what end each person will bring his deeds. In that life, however, its form will be revealed to all. For then it will clearly appear to everyone who was a wall, who were the gates, who were the foundations, who were the stones of the structure, and who were the precious stones. But we must ask how it is said to descend from heaven, since it ascends daily to its heavenly dwelling, where it is believed to remain forever. As long as we reflect upon the deeds and merits of the saints, they continually grow in our hearts; and the more we consider them, the more their magnificence is exalted in our eyes. But when we raise the eyes of our minds to contemplate the greatness of almighty God, the greatness of the saints, compared with God’s greatness, is greatly diminished in our estimation. The saints therefore ascend in our eyes when we consider their deeds and merits; but they descend when we raise the eyes of our minds to contemplate God’s almighty power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
