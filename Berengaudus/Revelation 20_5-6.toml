[[commentary]]
quote='''
This is the first resurrection. Blessed is the one who has a share in the first resurrection; over such people the second death has no power.

We must ask what the first resurrection is, for he would not speak of a first resurrection unless there were also a second, nor of a second death unless there were also a first. Therefore we first rise from the death of the soul through baptism. But since he says that those who share in the first resurrection are blessed, this does not seem to me to refer to baptism, because not all who appear to rise from the death of the soul through baptism are blessed: some, after baptism, bring death upon themselves by sinning, by lying about what they promised in it, and by continuing in their evil ways. There are also some who, after committing crimes by which they brought death upon themselves, return to life through repentance and tears, as well as other good works. The Apostle speaks of them, saying: “Awake, you who sleep, and rise from the dead, and Christ will shine upon you” (Eph. 5:14). Yet we cannot call this the first resurrection either, since our souls are recalled to life first through baptism, and then through repentance and tears. We must therefore investigate what he calls the first resurrection.

There are four stages in the lives of the faithful: the first is evil, the second both good and evil, while no evil can cling to the third or the fourth. The first is before baptism, and is wholly evil. The second is after baptism, and may be called both good and evil, for no believer can pass through the span of this present life without some sins, as John says: “If we say that we have no sin, we deceive ourselves, and the truth is not in us” (1 Jn. 1:8). The third is wholly good, and the order of this passage concerns it. It extends from Christ’s Passion to the end of the world, during which the saints, apart from their bodies, enjoy eternal life with the Lord. He also calls it the first resurrection, saying: “This is the first resurrection.” Therefore, the period from Christ’s Passion to the end of the world is called the first resurrection. The fourth life of the saints will begin after they receive their bodies, and will have no end. Since, then, the present life may rightly be called death in comparison with heavenly life, the saints rise in the first resurrection when, withdrawn from this wretched life, they are placed with the Lord in heavenly blessedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
