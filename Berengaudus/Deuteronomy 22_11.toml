[[commentary]]
quote='''
But this which he says: You shall not wear a garment woven of wool and linen together (Deut. 22:11), we can understand according to the previous meaning. For by wool, which is the clothing of sheep, we can understand the teaching of the apostles; by linen, which comes forth from the earth, we can understand the teaching of the Jews. We put on a garment when we surround ourselves with good works; but a person uses a garment woven of wool and linen who wants to observe the traditions of the Jews together with the traditions of the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
