[[commentary]]
quote='''
And because true wisdom increases from the divine Scriptures, the Psalmist makes this clear when he says: “The words of the Lord are pure words, silver tested by fire, proved in the earth, purified sevenfold” (Ps. 11:7). “The words of the Lord are pure words,” because they make minds chaste, free from vices. But since nothing can be purified except what is defiled, we must ask how the words of the Lord can be said to be purified, in which nothing defiled can exist. Therefore, the words of the Lord are said to be like silver tested by fire, because they test the minds of the faithful, sometimes by the fire of repentance, sometimes by the fire of love, cleansing them from all the stains of vices. But when he says “proved in the earth,” in Hebrew it has: “Separated from the earth.” And it is also said to be “purified sevenfold” because of the seven purifications which divine Scripture contains in itself, namely the seven virtues, by which all vices are purified: just as the vice of gluttony is purified by abstinence, pride by humility, lust by chastity; hatred, greed, envy, and many others by love. Likewise, the other vices also have their enemies, by whom they are either conquered or they conquer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
