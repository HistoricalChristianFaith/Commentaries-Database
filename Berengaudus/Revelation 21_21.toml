[[commentary]]
quote='''
And the twelve gates were twelve pearls, each gate made from a single pearl.

This cannot hold literally. If each gate was made from a single pearl, how can it be said that there were twelve pearls at each of the twelve gates? But it must be understood spiritually: there are twelve pearls, from which the individual gates are said to be made, that is, one hundred and forty-four. These signify the Church’s teachers, successors to the apostles, who followed the apostles’ faith and teaching and imitated their deeds. Because of the purity and exceptional holiness of their lives, they are represented by the whiteness of pearls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And the street of the city was pure gold, like see-through glass.

Earlier, we said that perfect men and holy angels were signified by pure gold and clear glass. But here, the street of the city signifies the minds of the faithful, while pure gold and see-through glass represent the purity of human and angelic minds. For just as no vain thought could ever enter the minds of angels and stain them, so after the resurrection no useless thought will ever come to the saints and defile their minds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
