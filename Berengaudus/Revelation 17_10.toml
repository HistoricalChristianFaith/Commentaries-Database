[[commentary]]
quote='''
From these heads, or mountains, or kings, five have fallen, one was, the other had not yet come. The first head of the Devil had fallen, because those who lived before the flood, through whom those who were called sons of God were deceived, had gone down into the sewer of hell [inferni] (Gen. 6:2). Likewise, the second, who lived after the flood up to the Law, had sunk and were held in that same pit of destruction. The third also had fallen, those who persuaded the people of God, to whom the Law was given, to worship idols. Likewise, the false prophets, who are placed in the fourth place, had already fallen into the ruin of their destruction, because they had been deceivers of the people of God. But the wicked Jews, who killed the Lord and persecuted his apostles, who are placed in the fifth place, at the time when this vision was shown to John, had already been devastated by the Romans. Five heads of the beast had therefore already fallen, which are called mountains and kings, because all who came before, and the wicked Jews who are placed in the fifth place, were already paying the penalties of their destruction. One was, because the pagans, that is, those who persecuted the Church of God, and who are placed in the sixth place, at that time were persecuting the Church of God; for which reason this John was being held in exile on the island of Patmos. The other had not yet come, because Antichrist, who is placed in the seventh place, had not yet come; and when he comes, he must remain for a short time, because the Lord Jesus will kill him with the breath of his mouth and will destroy him by the brightness of his coming, as he himself says in the Gospel: And unless the Lord had shortened those days, that is, the days of the persecution of Antichrist, no flesh would be saved (Mark 13:20); by “all flesh” indicating only the elect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
