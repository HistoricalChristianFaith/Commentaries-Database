[[commentary]]
quote='''
And the first living creature was like a lion, and the second living creature like a calf, and the third living creature having a face like a man, and the fourth living creature like a flying eagle.

Not all authors have explained the forms of the four living creatures in the same way; but it has been handed down to us by the more ancient writers that we should understand Mark through the lion, Luke through the calf, Matthew through the man, and John through the flying eagle; because Mark begins from the wilderness, Luke from the priesthood of the Jews, Matthew from the man, that is, from the genealogy of Christ, but John from the divinity of Christ. Yet some, following another order, think that Matthew was indicated by the lion, Mark by the calf, Luke by the man, and John by the eagle. For they say that Matthew was therefore signified by the lion, which is the king of beasts, because he himself relates that Christ according to His human nature descended from a royal lineage (Matt. 2:2); he also says that at the time of His birth a star appeared, which showed Him to be King of heaven and earth, of angels and of men; he tells how the Magi, as if to a King of the world, were led from the East to worship Him; and he also says that the earthly king, that is, Herod, was troubled at the time of His birth together with all his ministers; for just as any king who has little power trembles and is disturbed if he learns that another king of great power is coming against him to invade his kingdom (Matt. 2:3), so when Christ came in the flesh, who was to be the King of the world, Herod was troubled, and all Jerusalem with him; for the gifts which the Magi are said to have offered to Christ show that He is King, God, and Lord of all creatures. They say that Mark was signified by the calf because of the simplicity of his style; Luke by the man, because he has set forth the human genealogy of Christ more fully than the others. For from him we have learned how He was announced by the angel, how He was born, how He was laid in the manger, how He was circumcised, how He was presented in the temple, and how, by growing, He reached mature age. There is no one who denies that John was signified by the eagle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
