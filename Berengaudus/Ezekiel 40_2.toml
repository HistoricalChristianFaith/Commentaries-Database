[[commentary]]
quote='''
It should be noted that Ezekiel’s final vision agrees in some places with this vision of John; therefore, it pleased us to insert a few things from that vision into this work. For he says (Ezek. 40:2) that a mountain was shown to him, on which stood a city, and within it a temple. Although he mentions only the city, he speaks at length about the structure of the temple. The temple there therefore has the same meaning as the city here, for both signify the Church. The temple signifies the Church of the present age, while the city of Jerusalem signifies the Church as it will be after the end of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
