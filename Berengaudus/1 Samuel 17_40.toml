[[commentary]]
quote='''
Likewise, when David went to war against the Philistine, he took with him his staff, which he always had in his hands, and he chose for himself five very clear stones from the stream and put them into the bag that he had with him, and he took the sling in his hand and advanced against the Philistine. By the staff with which a man is supported, the apostles are signified, who, as it were, supported Christ when they completed the work for which he had come into the world, as the apostle Paul says: “For we are God’s co-workers” (1 Cor. 3:9). By his bag, however, his humanity is signified; by the five stones, the five books of Moses, which he put into the bag, because he gave to the man whom he had assumed the knowledge of the five books. By his sling, moreover, we can understand his tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
