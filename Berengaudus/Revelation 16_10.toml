[[commentary]]
quote='''
And the fifth poured out his bowl upon the throne of the beast, and his kingdom was made dark; and they chewed their tongues for pain, and they blasphemed the God of heaven because of their pains and their wounds, and they did not do penance for their deeds.

The fifth angel signifies the orthodox fathers who fought against the heretics, just as we said that the one who, in the earlier vision, sounded the fifth trumpet signified them. (Rev. 9:1-12) And as there the heretics were represented by the locusts, so here the heretics are represented by the throne of the beast; and the beast signifies the Devil. Therefore, with good reason the heretics are called the throne of the beast, because the Devil dwells in their hearts. So the fifth angel poured out his bowl upon the throne of the beast, because holy men, by uncovering the errors of the heretics, strove to make clear what punishment was awaiting for them. And his kingdom was made dark, because to those to whom the teaching of the heretics had seemed bright, it was shown through the teaching of the holy Fathers to be worthless and dark. They chewed their tongues for pain, because each condemned the errors of the others; for neither did Arius follow Eunomius or Sabellius or any of the others, nor did they follow him; but each, wishing to establish his own heresy, condemned the errors of the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
