[[commentary]]
quote='''
He who has ears, let him hear what the Spirit says to the Churches. He who overcomes will not be harmed by the second death.

What the second death is, we will explain in the following.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
