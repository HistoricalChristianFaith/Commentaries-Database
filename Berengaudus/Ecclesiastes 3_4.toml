[[commentary]]
quote='''
God also appointed two periods for them: the present life, which ends quickly, and the life to come, which cannot end. He assigned one to weeping and sorrow, the other to joy and gladness. For example, if anyone wished in this brief present life to weep and mourn for their sins, and by afflicting themselves to extinguish bodily desires, in the other life that follows, which is endless, they would rejoice and glory forever. But if anyone chooses to rejoice in the present life and fulfill the desires of the flesh, in the life to come they will mourn and grieve forever. It seems to me that Solomon spoke of these two periods when he said: “A time to weep, and a time to laugh” (Eccles. 3:2). The time for the chosen to weep is now; the time to laugh will be then, when what the Lord says in the Gospel is fulfilled: “Blessed are those who mourn now, for they will be comforted” (Matt. 5:5). But to sinners he says: “Woe to you who laugh now, for you will weep and mourn!” (Luke 6:25).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
