[[commentary]]
quote='''
And the four living creatures were saying: Amen.

Amen is the confirmation of a statement; therefore the four living creatures say Amen when the holy preachers constantly desire that their hearers may advance more and more in good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And the twenty-four elders fell down and worshipped.

In this place the twenty-four elders have the same meaning as the four living creatures; therefore the elders fall down and worship when the holy preachers, the more they see their hearers have advanced in good works, the more they humble themselves in the sight of God, as Scripture says: The greater you are, humble yourself in all things, and you will find favor before God (Sirach 3:20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
