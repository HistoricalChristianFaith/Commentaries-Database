[[commentary]]
quote='''
They will have one plan; they have handed over their strength and their power to the beast.

They had one plan, that is, one will in evil. They handed over their strength and their power to the beast, because their strength and power were demonic.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
