[[commentary]]
quote='''
He will deceive the nations that are in the four corners of the earth, because his most wicked teaching through Antichrist will spread among all the nations contained within the four regions of the world. He will deceive no other nations than those spiritually called Gog and Magog. For Gog means “roof,” and Magog means “from the roof.” Therefore, Gog, which means “roof,” signifies those who hide their malice in their hearts and will appear just to other people, though they will be wicked in mind. Magog, which means “from the roof,” signifies those who burst forth from the roof of their hearts into open wickedness and reveal to everyone that they are wicked. The Devil will therefore easily deceive such people through Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And he will gather them for battle, whose number is like the sand of the sea.

He will gather them for battle, because he will arm them to persecute the Church of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
