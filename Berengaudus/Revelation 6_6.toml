[[commentary]]
quote='''
And I heard a voice in the midst of the four living creatures saying.

The voice which was made in the midst of the four living creatures can be understood as the voice of the Church imploring the Lord's mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Two pounds of wheat for a denarius, and three double-pounds of barley for a denarius, and do not harm the wine and the oil.

Great are the things he brought forth, and very obscure. Through the wheat from which the best bread is made, we can understand the divine Scripture, which is the bread of souls: but the two pounds of wheat signify the two Testaments, by which the divine Scripture is divided. From these two pounds of wheat the holy fathers have prepared for us a great abundance of food, who have expounded it in many ways: but the denarius signifies the Lord. Therefore the two pounds of wheat are joined to the denarius; because what the holy Scripture speaks refers to the omnipotence, greatness, goodness, and severity of one God; for whatever good we do towards our neighbors, it is from him, not from us. But through the harshness of the barley the works of the saints are signified: which indeed seem harsh through their operation, but hope makes them sweet, as the Lord says: For my yoke is easy, and my burden is light (Matt. 11:30). But there are three double-pounds of barley: therefore not inconveniently through the number six, which is perfect, the works of the saints are signified, because the perfection of the saints increases from good works. Therefore the three double-pounds of barley are joined to the denarius; because whatever good the elect do in this world, whatever difficulties they suffer, they do and suffer for the love of one omnipotent God.

Alternatively: by the horse those who have been made safe through the Law are indicated; by its rider, the very giver of the Law; and by the balance, the equity of his judgment. It follows that by the two measures of wheat and the three double-measures of barley we are to understand the Old Testament. Therefore by the two measures of wheat are signified the two commandments of love, which are especially celebrated in the Law and the Prophets, as the Lord says in the Gospel: “On these two commandments the whole Law and the Prophets depend” (Matt. 22:40). And by the three double-measures of barley we can take the Old Testament, because it is divided by the Hebrews into three parts: the Prophets, the Law, and the Writings. Nor is it unsuitable that the Old Testament is signified by barley, which has a rough husk, on account of the harshness, namely, of the legal guidelines. For just as barley, beneath the roughness of its husk, contains the kernel from which bread is made, so also beneath the letter of the Old Testament there is contained the spiritual understanding, from which the bread of spiritual teaching is prepared by the teachers of the Church, promoting the nourishment of the faithful. For the apostle Paul writes that the Law brought no one to perfection, that is, none of those who understand and practice it in a carnal way; but those who understand and practice it in a spiritual way it undoubtedly raises to the summit of perfection (Heb. 7:19). Therefore the three measures of barley are doubled so that they reach six, which is a perfect number, since the Old Testament is first understood historically and afterwards spiritually by the doctors of the Church, and its spiritual understanding is fulfilled in works. By the denarius, however, eternal life is signified, as the Lord teaches in the Gospel (Matt. 20:2). The Church therefore prays to the Lord and says: “Two measures of wheat for a denarius, and three double-measures of barley for a denarius,” that is, for those who keep the two commandments of love according to the teaching of the Law and the Prophets, namely, the fathers of the Old Testament; and likewise for those who understand and practice the Old Testament spiritually, that is, the faithful of the Church, consent to grant the denarius of eternal life. By the strictness of wine we may understand the active life, and by the richness of oil the contemplative life. Therefore what he says, “Do not harm the wine and the oil,” is as if he said: Do not harm those who have endeavored to serve you through the works of the active life or the contemplative life, when you come to judgment. It continues:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
