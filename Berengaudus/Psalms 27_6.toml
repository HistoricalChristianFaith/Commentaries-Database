[[commentary]]
quote='''
Of this going around the Psalmist seems to me to have spoken: I have gone around and sacrificed in his tabernacle a sacrifice of jubilation (Ps. 26:6). For he went around, and afterward he sacrificed; because he first despised the deeds of the wicked, so that his sacrifice of jubilation might become acceptable to God. For there are many who continually praise God; but because they are unwilling to drive vices away from themselves, the sacrifice of their praise is not acceptable to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
