[[commentary]]
quote='''
And another sign was seen in heaven: and behold, a great red dragon, having seven heads and ten horns, and on his heads seven crowns; and his tail was dragging a third part of the stars of heaven, and he cast them to the earth.

This dragon signifies the Devil; now such is the red color, as if you were to mix a blood-red tone with a saffron color. Indeed, the pale color, that is, the saffron color, agrees with the blood-red; because when blood is poured out, it brings about death, and paleness covers the whole body of the dying person. Rightly, therefore, the Devil is said to have the color of death; because through his envy death entered into the world. (Wisdom 2:24) By his seven heads are signified the wicked persons whom the Devil has used to deceive humanity. The crowns signify his royal power; for he is king, as Scripture says (Job 41:25), over all the children of pride. For just as by the seven horns of the Lamb all the elect are signified, whom we divided into seven groups, so also by the seven heads of the dragon are signified the wicked who opposed them on the way of God. For the first head of the dragon were the wicked who were before the Flood, whom Scripture calls the sons of men, because they were a snare to those who were called the sons of God. The second head of the Devil were those who lived after the Flood up to the time of the Law, namely the inventors of idols and of various errors, by whom humanity was deceived. The third head of the Devil were those who, after the Law was given to the people of God, urged the worship of idols. The fourth head of the Devil were the false prophets and wicked kings, by whom the people of God were so greatly deceived that, on account of their iniquities, they were led into captivity. The fifth head were the wicked Jews, who both killed the Lord and persecuted his apostles. The sixth head were the persecutors of the Church. But the seventh head of the Devil will be the Antichrist. What the ten horns signify, we shall say later, in that passage where the harlot woman is seen sitting upon a scarlet beast (Rev. 17:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
