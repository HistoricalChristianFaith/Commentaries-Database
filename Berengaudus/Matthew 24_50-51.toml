[[commentary]]
quote='''
“Quickly,” that is, unexpectedly, just as the Lord speaks in the Gospel about the negligent servant: “But the Lord of that servant will come on a day he does not know, and at an hour he is unaware of; and he will cut him in two, and will place his portion with the hypocrites” (Matt. 24:51). For a human being is composed of soul and body: the Lord “cuts” a person in two when he separates the soul from the body; he places his portion with the hypocrites when he hands over the soul, which is the second part in a human being, to be tormented with the wicked for its iniquities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
