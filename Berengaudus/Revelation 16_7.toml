[[commentary]]
quote='''
And I also heard the altar saying: Lord God almighty, true and just are your judgments.

By “the altar” we can understand the holy men who lived at that time, who praised the just judgment of God because He brought most just condemnation upon the wicked people, just as we read that Daniel and the three youths did. (Dan. 3)
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
