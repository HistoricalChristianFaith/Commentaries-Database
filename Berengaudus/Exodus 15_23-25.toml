[[commentary]]
quote='''
After crossing the Red Sea they came to Marah, where they found bitter waters which they could not drink. And the Lord showed Moses a piece of wood which, when he had thrown it into the waters, they were turned into sweetness (Exod. 15:23). By the bitter waters the Law of Moses is signified; by the wood, however, the passion of Christ, since it was fulfilled upon the wood of the cross, as we should understand. The people therefore who came out of Egypt found bitter waters, because they received the Law, which they could not fulfill; but when the nations came to faith in Christ, the bitterness of the Law was turned into sweetness through the passion and resurrection of Christ, because it was understood by them spiritually, not carnally.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
