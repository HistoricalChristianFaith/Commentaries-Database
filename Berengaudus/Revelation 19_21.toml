[[commentary]]
quote='''
But when it says that the rest were killed by the sword of the one sitting on the horse, it has put this killing for their shame; for the saints, whose teaching is represented by the sword of the Lord’s mouth, after Antichrist has been slain, will mock the unbelievers because they had considered Antichrist, a most wicked man and worse than all other men, to be immortal and a god, whereas it will be clear that he has been destroyed by a most wretched death; and they will be confused and waste away in their iniquities. Therefore all the birds were filled with their flesh, because when Antichrist is overthrown, all the elect will rejoice and exult beyond telling, because by divine mercy they will have been freed from such an evil enemy, and all those who persecuted them will have vanished like smoke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
