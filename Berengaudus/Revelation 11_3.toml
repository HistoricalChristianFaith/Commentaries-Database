[[commentary]]
quote='''
And I will grant to my two witnesses, and they will prophesy for one thousand two hundred and sixty days, clothed in sackcloth.

The Lord calls Elijah and Enoch his two witnesses, who will go before his second coming, just as John went before the first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Yet we can also understand by the two witnesses the preachers of the two peoples, namely of the Jews and of the Gentiles. They are said to be about to prophesy for one thousand two hundred and sixty days, (Rev. 11:3) because during all the time in which the persecution and deception of Antichrist will rage throughout the whole world, they will strive to bring back to the way of truth as many as they can.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
