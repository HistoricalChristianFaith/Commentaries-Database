[[commentary]]
quote='''
The censer is said to have been held in his hand, because the hearts of the apostles were in the hand of God, as Solomon says: “The king’s heart is in the hand of the Lord; he will bend it wherever he wishes” (Prov. 21:1). Was the heart of that Solomon in the hand of God when he was worshipping idols? Was the heart of Antiochus or Herod in the hand of God? Were the hearts of the kings who persecuted the saints of God in the hand of God? They were in the hand of the Devil, who bent them toward whatever crimes he wished; but the hearts of spiritual kings, that is, of the saints, are in the hand of God, and therefore he will bend them wherever he wishes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
