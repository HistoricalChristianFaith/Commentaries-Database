[[commentary]]
quote='''
But Gehazi, who received the payment for the healing from Naaman and inherited his leprosy, signifies those who sell to men the teaching of their preaching: these the Lord in the Gospel calls not shepherds but hirelings (Jn. 10:12). Therefore Elisha bestowed healing, and Gehazi received payment; because from those whom the divine mercy saves, perverse teachers exact the price of their healing. And therefore they become heirs of their leprosy, because by remaining in the evils which these others have despised through the grace of God, they draw upon themselves everlasting condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
