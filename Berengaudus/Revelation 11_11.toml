[[commentary]]
quote='''
But that it is said that after three and a half days the spirit of life from God will enter into them and they will stand upon their feet, we can take as the time of the resurrection, which, after three and a half periods, although not immediately, will nevertheless take place shortly afterward. For they will stand upon their feet when, after the time of the resurrection, their power and magnificence will be revealed to all the wicked. And great fear will fall upon their enemies when they see them; because on the day of judgment, when they see them and their glory, they will be disturbed with terrible fear, saying: These are the ones whom we once held up to ridicule and as a likeness for reproach. We, foolish as we were, considered their life to be madness and their end without honor. How have they been counted among the sons of God, and how is their lot among the holy ones? (Wisdom 5:3). And because the prophet Malachi speaks in the person of the Lord, saying: Behold, I will send you the prophet Elijah, who will turn the hearts of the fathers to the children (Mal. 4:5), and the other things that follow: we believe that the Jews, through the preaching of Elijah, as we have shown above as best as we could, are to be converted to faith in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
