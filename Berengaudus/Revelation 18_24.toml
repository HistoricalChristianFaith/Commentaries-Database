[[commentary]]
quote='''
And in it was found the blood of the prophets and of the saints, and of all who were slain upon the earth.

The blood of the saints was found in it, that is, the crime of the killing of the saints, just as the Lord says to the wicked Jews, with the understanding of all the wicked: “All the righteous blood that has been shed upon the earth shall come upon you” (Matt. 23:35).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
