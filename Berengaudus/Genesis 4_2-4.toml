[[commentary]]
quote='''
Two sons were born to Adam, Cain and Abel: Cain signified the people of the Jews; Abel, however, signified Christ. Cain offered to the Lord gifts from the fruits of the earth; for the people of the Jews, who were earthly, offered earthly gifts, that is, first-fruits, tithes, sacrifices, and the other things commanded in the Law; but Abel offered from the firstborn of his flock and from their fat. The firstborn of the flock are the apostles, whom the Church first brought forth, and from whom the Church was born; the fat, however, is the faith of the apostles. Abel therefore offered from the firstborn of his flock and from their fat, because Christ offered to God the Father the apostles whom he had chosen from the world, and their faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
