[[commentary]]
quote='''
The Lord makes this clear in the Gospel, saying to his disciples: “At the renewal of all things, when the Son of Man sits on his glorious throne, you also will sit on twelve thrones, judging the twelve tribes of Israel” (Matt. 19:28). He first mentioned the renewal of all things, that is, the resurrection; then he said that they would sit to judge the peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
