[[commentary]]
quote='''
We read in the Old Testament (Exod. 16:14) that the Lord fed the people of the Jews, as they walked through the deserts, with manna until they came to the land of promise. By manna, therefore, wisdom can be understood, which is Christ: for he is the living bread who came down from heaven (Jn. 6:41). All the elect are fed with this bread, placed in the desert and on the journey of this world, until they come to the land of promise, that is, to the heavenly blessedness which God has promised to those who love him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
