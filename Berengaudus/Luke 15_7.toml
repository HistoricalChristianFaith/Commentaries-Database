[[commentary]]
quote='''
These young goats are said to have been excellent, because the repentance of a sinner together with renunciation of vices is very pleasing to God, just as our Lord himself says in the Gospel: There is joy in heaven over one sinner who repents, more than over ninety-nine righteous persons who do not need repentance (Luke 15:7); meaning by the one sinner the people of the nations, and by the ninety-nine righteous, the Jews. They are called righteous for this reason, because on account of their observance of the Law they falsely thought themselves righteous; for the Lord speaks to these same righteous, saying: Woe to you who justify yourselves before men, but God knows your hearts (Luke 16:15). They are set in an imperfect number, because the Law brought no one to perfection (Heb. 7:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
The loud voice from heaven is the voice of the angels, rejoicing for the salvation of humanity and praising God, just as the Lord says in the Gospel: There is greater joy in heaven over one sinner who does penance than over ninety-nine righteous persons who do not need penance (Luke 15:7). We can understand by the one sinner the Gentile people, and by the ninety-nine righteous persons the Jews: who do not reach the number one hundred, because the Law brought no one to perfection (Heb. 7:19); for a much greater joy arose in heaven from the conversion of the nations than from the observances of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
