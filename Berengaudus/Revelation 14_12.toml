[[commentary]]
quote='''
This is the patience of the saints, who keep the commandments of God and the faith of Jesus.

That is, such is the patience of the saints, and it brings forth such fruit as is shown in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
