[[commentary]]
quote='''
Behold, I am coming quickly: hold fast what you have, so that no one may take your crown.

Hold fast what you have, that is, the good that you have, hold it until the end of your life. So that no one may take your crown, that is, so that the glory which is owed to you may not be possessed by anyone without you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
