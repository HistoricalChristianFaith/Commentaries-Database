[[commentary]]
quote='''
For the Lord, before his passion, promised that he would give the Holy Spirit to his disciples; and the same John, when he had set down the words of Caiaphas saying, “It is useful for you that one man should die for the people, and that the whole nation should not perish,” added, saying: “But he did not say this of himself; rather, since he was high priest that year, he prophesied that Jesus was going to die for the nation; and not only for the nation, but also that he might gather into one the children of God who were scattered abroad” (Jn. 11:50–52). Were those who would come to believe in Christ, who, scattered among all nations, were serving idols, children of God? They were already children of God by predestination, because they had already been predestined to eternal life. They were truly gathered into one later, when, through the faith which they received in baptism, they were joined to the body of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
