[[commentary]]
quote='''
And I heard a loud voice from the throne saying: “Behold, God’s dwelling is with humanity, and he will dwell with them; they will be his people, and the Lord himself will be with them as their God.”

We know that Jerusalem and the Lord’s dwelling are often used to signify the Church. Therefore, in this passage, the city and the dwelling are called the Church, because God dwells in it, as he says through the prophet: “I will dwell among them and walk among them; I will be their God, and they will be my people” (Lev. 26:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
