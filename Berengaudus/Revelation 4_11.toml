[[commentary]]
quote='''
You are worthy, Lord our God, to receive glory and honor and power.

Above, he said that the four living creatures gave glory and honor and blessing to God; but here the twenty‑four elders say that God has received glory and honor and power, exchanging “power” for “blessing.” Yet what indeed can anyone give to God, or what can God receive from anyone, since he himself created all things, and without him nothing can exist, and he says in the Gospel: Without me you can do nothing (Jn. 15:5)? For if the saints can do nothing without God, what can they give him? Therefore, since the nature of human beings is such that they can have no good from themselves unless they receive it from him who is supremely good, God gives to his saints what they may use to repay him. For God has promised the kingdom of heaven to his saints, yet on the condition that they give the price of good works for it; and because the elect do not have this price unless they receive it from him, he himself gives the price with which they may purchase from him eternal life. Therefore the saints give glory to God when, whatever good they do, they do it with this intention: that God may be glorified through them, as he himself says in the Gospel: Let them see your good works and glorify your Father who is in heaven (Matt. 5:16). For John also says that Peter by his death glorified God (Jn. 21:19). They give honor when in all that they do, they seek the honor of God, not their own. Above, “blessing” is placed in the third place, but here “power”; and because the saints, while they accomplish great deeds, are blessed (praised) by human beings, “power” fits well together with “blessing.” But how greatly the saints detest the praises of people for the great works they do, the book of the Acts of the Apostles shows us. For when Peter and John had healed the lame man and all eyes were fixed on them, as though they had done this by their own power, Peter, avoiding the “blessings” (admiring looks) of their eyes, said to them: Men, brothers, why do you look at us, as though by our own power or virtue we had made this man walk? The God of Abraham and the God of Isaac and the God of Jacob has raised up his Son Jesus (Acts 3:12). And a little later: In his name this man stands before you sound. Likewise Paul and Barnabas, when they had healed a sick man in Lystra and the crowds wanted to offer sacrifice to them, tore their garments, saying: Men, why are you doing this? We too are human beings, with the same nature as you (Acts 14:14). We can also understand this of Christ, for it is clear that, according to his humanity, he has received both glory and honor and power. It follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
For you created all things, and because of your will they existed and were created.

If this is to be understood in the same sense as that other saying: “He who made the things that are to be”; then all creatures were in the power and will of God before they were created, but were in fact created at the time which God appointed. Therefore, may he himself, who created all things out of nothing, consent to create in us a pure heart, he who lives and reigns for ever and ever, amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
