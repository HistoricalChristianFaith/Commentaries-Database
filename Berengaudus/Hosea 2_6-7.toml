[[commentary]]
quote='''
Concerning such people the Lord speaks to the prophet under the figure of Jerusalem, saying: Behold, I will hedge your way with thorns, and I will fence it with a wall, and she will not find her paths. And she will follow her lovers and will not overtake them; she will seek them and will not find them (Hosea 2:6). Our lovers are carnal desires; we follow our lovers when we labor in this, that we may become possessors of riches, so that we may have the means to satisfy carnal desires. We follow our lovers and do not overtake them when, with the mercy of God preventing us, we are not able to reach that which we uselessly desire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
