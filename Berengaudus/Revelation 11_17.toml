[[commentary]]
quote='''
We give thanks to you, Lord God Almighty, who are, and who were holy, and who have taken your great power and have reigned. And the nations were enraged, and your wrath has come, and the time for the dead to be judged; and to give the reward to your servants the prophets, and to the saints, and to those who fear your name, small and great; and to destroy those who corrupted the earth.

Christ now, after he assumed man, is of the same holiness as the Father, of the same eternity, of the same power; and he was, even before he assumed man, in all things equal to the Father. He took his great power when, through his passion, he conquered the Devil; he reigned indeed when he subjected humanity to himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
