[[commentary]]
quote='''
And he made the earth and those who dwell in it worship the first beast, whose mortal wound was healed. And he performed great signs, so that he even made fire come down from heaven to earth in the sight of men.

We read in the book of Job that the Devil, with God’s permission, made fire come down from heaven and consumed the sheep and children of Job (Job 1:16). What he did there by himself, this he will do in the final time through the Antichrist and his followers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
