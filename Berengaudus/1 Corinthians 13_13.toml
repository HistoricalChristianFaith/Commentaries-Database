[[commentary]]
quote='''
Therefore, by these three things mentioned here, we may understand faith, hope, and love: by length, faith; by width, love; and by height, hope. But how can they be equal, when the Apostle says, “Now these three remain: faith, hope, and love; but the greatest of these is love” (1 Cor. 13:13)? For although love is greater than all the virtues because it endures forever, equality may nevertheless be attributed to these three virtues in a certain respect. The Apostle says that faith works through love, and that faith without works is dead (Gal. 5:6; James 2:26). If it is dead, the one for whom it is dead is nothing; and if faith works through love, it is dead for the one who has no works of love. Therefore, faith is as great as the works of love. Likewise, hope is as great as faith and love, because the glory for which we hope is as great as the works of faith, which is love. For the more each believer succeeds in expanding himself through works of love, the more surely he may expect the glory of the heavenly homeland to increase for him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
