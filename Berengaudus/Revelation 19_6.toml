[[commentary]]
quote='''
The great trumpet signifies Christ: the voice of the trumpet is the preaching of the Gospel; and by the voice of many waters is signified the multitude of nations confessing Christ; by the voice of great thunder are understood the elect who are to be born at the end of the world, and rightly by thunder, because they will announce the terror of the day of judgment. Therefore three voices once chanted “Alleluia,” because they have preserved, and will preserve until the end, the faith of the Holy Trinity and the doctrine of the Gospel, which proceeded from the great trumpet, that is, from Christ. Two parts, that is, the first and the second, belong to the law which we have said is natural; the two which follow, that is, the third and the fourth, to the law which was given through Moses; but the three which remain, that is, the fifth and the sixth and the seventh, to the law of the Gospel, so that they show that those men ought to remain in the faith of the Holy Trinity until the end of the world.

But let us hear what these three parts sing: Alleluia, for the Lord our God the Almighty has reigned; that is, let us praise the Lord; because, with the kingdom of the Devil, our destroyer, having been overthrown, he consents to reign in us, he who is our Lord and Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
