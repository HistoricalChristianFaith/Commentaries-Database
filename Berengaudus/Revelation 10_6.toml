[[commentary]]
quote='''
And the angel whom I saw standing upon the sea and upon the land, when he had lifted up his hand and had sworn by the One who lives forever, who created heaven and the things that are in it, and the earth and the things that are in it, the sea and the things that are in it, that time shall be no more; but in the days of the seventh angel, when he begins to sound the trumpet, the mystery of God will be completed, which he proclaimed through his servants the prophets.

When we swear, we want what we say to be firm. For the Lord, therefore, to have spoken is to have “sworn,” because it cannot come to pass that what God speaks should become void, just as he himself says in the Gospel: “Heaven and earth will pass away, but my words will not pass away” (Luke 21:33). Since Christ therefore swore by the One who lives forever and by him who made all creatures, he swore by himself, because all things were made through him, and without him nothing was made (Jn. 1:3). He swore, moreover, not by binding himself with certain words, but by speaking the things that were to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
