[[commentary]]
quote='''
Behold, I will give some from the synagogue of Satan, who say that they are Jews and are not, but lie.

Behold, I will give some from the synagogue of Satan, understood to mean certain people, that is, from among the Jews, who are the synagogue of Satan, who were opposing you, and whose harassment you constantly endured, so that they may believe in me through your words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Behold, I will make them come and worship at your feet, and they will know that I have loved you; because you have kept the word of my patience:

That is, when they have believed in me through your words, they will worship at your feet, begging that through you they may obtain eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
