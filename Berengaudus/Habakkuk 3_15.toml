[[commentary]]
quote='''
By horses the holy preachers are often signified, as the prophet Habakkuk speaks in his song, saying: You made a way in the sea for your horses, in the mud of many waters (Hab. 3:15). God made a way in the sea for his horses, in the mud of many waters, when at the beginning of the faith he granted peace to the world, so that his apostles could run throughout all the nations, which are signified by the sea and the mud, and scatter the seeds of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
