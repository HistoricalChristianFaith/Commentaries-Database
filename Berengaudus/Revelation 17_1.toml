[[commentary]]
quote='''
And one of the seven angels, who had the seven bowls, came and spoke with me, saying:

Just as above, under the sounding of the trumpet of the seventh angel, briefly grasping the day of judgment, he returned to the things he had omitted; and, describing the holy Church under the appearance of a woman who was clothed with the sun and had the moon under her feet, (Rev. 12) he adds the sufferings which she has endured from the Devil, and which she is going to endure from Antichrist at the end of the world. So also here, under the pouring out of the bowl of the seventh angel, briefly touching on the day of judgment, he returns to what he left out, and, describing under the appearance of a harlot woman the city of the Devil, he makes clear in what follows what punishments she is going to suffer for her crimes. But the angel who has the bowl signifies the holy preachers; and John holds the figure of all the faithful; therefore it is added:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
Come, I will show you the condemnation of the great harlot who sits upon many waters, with whom the kings of the earth have committed fornication, and all who dwell on the earth have been made drunk with the wine of her prostitution.

This harlot in some places specifically represents Rome, which at that time was persecuting the Church of God; but in some passages she more generally signifies the city of the Devil, that is, the whole body of the wicked. Therefore the angel shows John the condemnation of the great harlot, because holy preachers, both by words and by writings, show the faithful what punishments the wicked suffer for their crimes, so that, terrified by their punishments, people may abstain from sins. She is said to sit upon many waters, because the city of the Devil is built from the multitude of nations, which are signified by the waters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
