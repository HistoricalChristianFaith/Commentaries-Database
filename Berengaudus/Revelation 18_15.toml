[[commentary]]
quote='''
Those who have become rich will stand far away from her because of fear of her torments, weeping and mourning, and saying: “Alas, alas, that great city, that was clothed in fine linen and purple and scarlet, and adorned with gold and precious stone and pearls; for in one hour such great riches have been brought to nothing!”

That the rich of Babylon are said to stand far away is to be understood according to the sense given above, which we explained about the kings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
