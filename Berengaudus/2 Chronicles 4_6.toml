[[commentary]]
quote='''
In the temple of Solomon we read that there was a bronze sea, in which the priests washed before they approached the altar to offer sacrifices (2 Chron. 4:6); but the brightness of bronze is quickly clouded by a certain blackness. By the bronze sea, therefore, the Law of Moses is signified, which obscures the brightness of spiritual understanding with the blackness of the letter. And just as, if bronze is rubbed with a file, its brightness is brought out, so too the spiritual understanding, which is obscured by the surface of the letter in the Law, if it is carefully examined by faithful men, is revealed through the grace of God. In this sea, then, the priests were washed, because through sacrifices and certain legal observances some sins of the ancient people were wiped away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
