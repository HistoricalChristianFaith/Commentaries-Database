[[commentary]]
quote='''
The waters that you saw, where the prostitute sits, are peoples and tribes and languages.

By the waters are signified all the nations that the Romans had subjected to themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
