[[commentary]]
quote='''
And here is the meaning, for the one who has wisdom.

That is, in what follows there is great obscurity, and the understanding must be sharpened greatly to grasp it. And let us ask the Lord to open this unclear matter to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
