[[commentary]]
quote='''
What you see, write in a book, and send to the seven Churches: to Ephesus and Smyrna, Pergamum and Thyatira, Sardis and Philadelphia and Laodicea.

By these seven Churches one catholic Church, as the interpretation of the names teaches, is signified. For Ephesus is interpreted as “will” or “counsel”; Smyrna, “their song”; Pergamum, “division of the horns”; Thyatira, “enlightened”; Sardis, “beginning of beauty”; Philadelphia, “saving the inheritance of God”; Laodicea, “a tribe beloved by the Lord.” Ephesus, therefore, which is set first, shows the beginning of the conversion of each person; for it is interpreted “will” or “counsel.” For what better counsel is there than good will, which urges a person to renounce the Devil and follow Christ, to abandon vices and to lay hold of virtues? And because those who wish to be converted to God must necessarily implore the mercy of the Lord, so that they can accomplish what they desire, Smyrna is placed next to this, which is interpreted “their song.” For that person sings well who, with a repentant heart and a humbled spirit, begs for the mercy of his Maker; of which song the Apostle speaks, saying: “Singing and making melody in your hearts to the Lord” (Eph. 5:19). And because whoever wishes to be heard by God must of necessity abandon vices, and, so far as strength allows, turn himself to doing good works, Pergamum follows in order, which is interpreted “division of the horns.” The two horns in this place signify evil and good. We divide the horns when, distinguishing between good and evil, we drive evil away from ourselves and embrace the good. And because, as long as we lie in sins, we are in darkness; but when we cast away evil from ourselves and begin to do good, we proceed, as it were, from darkness to light, it is not unfitting that after Pergamum there follows Thyatira, which is interpreted “enlightened.” And because from the doing of the commandments of God the beauty of the soul increases, and the more someone grows in the doing of the commandments of God, the greater beauty he imparts to his soul, it is not inappropriate that after Thyatira there follows Sardis, which is interpreted “beginning of beauty.” It is called the beginning of beauty because the beauty of the saints is begun in this life and is perfected in eternal blessedness. Philadelphia follows, which is said to mean “saving the inheritance of God.” But what is the inheritance of God, if not the whole multitude of the elect, as the Lord says to the prophet: “But Israel, my inheritance” (Isa. 19:25)? And in what does the salvation of the elect consist, if not in the keeping of the commandments of God (Luke 19:10)? For he who came to seek and to save what was lost grants the salvation of souls to those who, each according to his own strength, keep his commandments. Laodicea is placed seventh, because it is interpreted “a tribe beloved by the Lord.” But a tribe beloved by the Lord is the whole multitude of the elect, which is the Church, which through renunciation of vices and the practice of virtues comes to this point, that it is called a tribe beloved by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
