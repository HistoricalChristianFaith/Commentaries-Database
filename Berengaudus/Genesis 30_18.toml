[[commentary]]
quote='''
Issachar follows, whose name is interpreted as “wages” or “reward.” But we shall see the meaning of this name more clearly if we set forth what his mother Leah said at his birth; for she said: “God has given me my reward, because I gave my maidservant to my husband” (Gen. 30:18). And therefore she called his name Issachar, that is, “reward.” Our flesh ought to be our maidservant; our husband is our God. We give our maidservant to our husband if we bind our flesh to the service of God, if we compel it to keep watch, to fast, and to abstain, and if we subdue its pleasures. Issachar, therefore, was given to Leah as a reward by God; because to those who tame the flesh, who extinguish vices, that reward is given by God, that they may be enriched with virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
