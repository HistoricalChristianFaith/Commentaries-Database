[[commentary]]
quote='''
And he who sat on the throne said, “Behold, I make all things new.”

We have said something above about the renewal of creatures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"

[[commentary]]
quote='''
And he said to me, “Write, for these words are most faithful and true.”

But this, too, was said above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
