[[commentary]]
quote='''
For her sins have reached all the way to heaven, and God has remembered her iniquities.

The Almighty God always beholds the iniquities of Babylon; but when He does not exact vengeance, He appears not to see what He sees. By this, therefore, what he says points to that time in which all the wicked will be punished with eternal torment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
