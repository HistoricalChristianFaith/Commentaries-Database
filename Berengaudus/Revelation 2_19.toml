[[commentary]]
quote='''
I know your works, and love, and faith, and ministry, and your patience, and your last works, more than the first.

Here he is praised in every respect, but, as the following words show, only the fault of silence is rebuked in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
