[[commentary]]
quote='''
And the dragon was enraged with the woman, and went off to make war with the rest of her offspring, who keep the commandments of God and hold the testimony of Jesus.

The rest of the offspring of the Church are the elect who are to be born at the end of the world. Moreover, how the Devil carries out this battle is made clear in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
