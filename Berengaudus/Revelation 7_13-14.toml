[[commentary]]
quote='''
And one of the elders answered and said to me: “These who are clothed in white robes, who are they and from where have they come?” And I said to him: “My lord, you know.”

He asks in order to teach; for by “elder” the teachers of the Church are understood, and by “John” the listeners. For holy preachers reveal, in whatever ways they can, the glory of holy souls to their hearers, so that their minds may be kindled with love for the heavenly homeland.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
