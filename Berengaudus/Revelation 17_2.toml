[[commentary]]
quote='''
The kings of the earth are said to have committed fornication with her, because they have increased rather than destroyed the crimes of Babylon. And all who dwell on the earth have been made drunk with the wine of her prostitution. The wine of prostitution is the various errors, the various crimes, of the wicked city; for just as a harlot prostitutes herself to all who wish to commit fornication with her, so that she is defiled by their impurity, so also all the wicked are subjected to demons, when, obeying their perverse suggestions, they cast themselves into every kind of crime, just as the prophet speaks to Jerusalem, saying: “You have made your body like the ground, and like a road for those who pass by” (Isa. 51:23). By “inhabitants of the earth” he calls all the wicked; and the drunkenness is the nastiness of Babylon, because just as a drunkard is filled with wine until he becomes alienated from his own mind, so too the wicked so fill themselves with all wickedness that, being alienated from their own mind, they cast away from themselves the fear of God and all goodness, as blessed Job says, that they “drink iniquity like water” (Job 15:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
