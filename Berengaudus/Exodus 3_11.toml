[[commentary]]
quote='''
And the Lord spoke to Moses from the midst of the flame of the bush: Do not come near here; take the shoes from your feet, for the place where you stand is holy ground. I have surely seen the affliction of my people who are in Egypt, and I have heard their groaning, and I have come down to deliver them. But come, I will send you to Pharaoh, that you may lead the sons of Israel out of the land of Egypt (Exod. 3:5-10). And a little later: And Moses said to the Lord: Who am I, that I should go to Pharaoh, and lead the sons of Israel out of Egypt (Exod. 3:11)? And in what follows he speaks to the Lord about the sons of Israel, saying: They will not listen to my voice, but they will say: The Lord has not appeared to you (Exod. 4:1); and again: I beg you, Lord, send whom you will send (Exod. 4:13). These words show that Moses obeyed the commands of the Lord reluctantly, to lead the sons of Israel out of the land of Egypt; but we must inquire why so great a man carried out the command of the Lord unwillingly. Indeed, we must understand this stubbornness of his in a spiritual sense; for the Apostle says: Now all these things happened to them as a figure; and they were written for our correction, upon whom the ends of the ages have come (1 Cor. 10:11). By Moses, therefore, in this passage the apostles are signified; for at the beginning of the preaching of the Gospel the apostles, knowing that the election of the Gentiles was the rejection of the Jews, did not wish to impart to the Gentiles the teaching of the Gospel, so that they might be rescued from the power of the Devil. Therefore also the Lord, in a vision of four-footed animals and creeping things, rebuked Peter for despising the Gentiles, saying: What God has cleansed, do not call common (Acts 10:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
