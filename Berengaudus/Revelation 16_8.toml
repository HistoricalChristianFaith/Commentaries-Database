[[commentary]]
quote='''
And the fourth poured out his bowl upon the sun, and it was granted to it to scorch men with heat and with fire. And men were scorched with great heat, and they blasphemed the name of God who has power over these plagues; and they did not repent so as to give Him glory.

The fourth angel signifies Christ and His apostles, and the other preachers as well, just as we said that the fourth angel in the earlier vision had signified them; (Rev. 8:12) but there the people of the Jews are represented by the sun, and by the third part of the sun and the moon and the stars the believers who from that people came to faith in Christ are indicated. Therefore the fourth angel poured out his bowl upon the sun, because Christ and His apostles openly foretold that the wicked Jews would be destroyed by the Romans. (Luke 19:41–44, 21:20–24) For just as any servant receives a sword from his master, not that he himself might be slain by it, but that he might slay the guilty, so also the Romans received the outpouring of the bowl in which the wrath of God was contained, not in order that they themselves should perish in it, but that they should pour it out upon the Jews to avenge the blood of Christ; where it also follows: Because it was granted to it to afflict men with heat and with fire. We can understand by “heat” the siege, and by “fire” famine and the sword, by which almost all the Jews were destroyed. It was therefore granted to the sun to afflict men with heat and with fire, because it was granted by God to the Romans that, after tormenting the wicked Jews with various calamities, they should kill some of them and tear others up from their own land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
