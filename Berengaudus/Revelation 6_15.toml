[[commentary]]
quote='''
And the kings of the earth, and the princes, and the tribunes, and the rich, and the strong, and every slave and free person hid themselves in caves and in the rocks of the mountains, and they say to the mountains: Fall upon us, and hide us from the face of the One who sits upon the throne, and from the wrath of the Lamb; for the great day of their wrath has come, and who will be able to stand?

By the kings of the earth, the princes and the tribunes, those who seemed to rule this people, we can understand: by the rich and the strong, the slaves and the free, the rest of the multitude. How they hid themselves in caves and in the rocks of the mountains, Josephus clearly relates, who describes the destruction of Jerusalem (Josephus, The Jewish War 6.11). For such was the affliction that, being consumed by long-lasting famine, and oppressed by enemies from without and, much worse, by bandits from within, they hid themselves in wells and sewers and in certain hidden places in the earth, desiring to die, so that they might end their long misery by the short cut of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Berengaudus%2FCommentary%2520on%2520Revelation%2FEnglish.html'
source_title="Commentary on Revelation"
