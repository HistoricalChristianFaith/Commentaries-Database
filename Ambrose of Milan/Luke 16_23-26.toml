[[commentary]]
quote='''
Between this rich man and this poor man, then, there is a great chasm, because after death merits cannot be changed; and so the rich man is brought before us in hell, longing to draw from the poor man something of a refreshing spirit; for water is the refreshment of a soul set in pains, of which Isaiah says: And water will leap with delight from the fountains of salvation. But why is he tormented before the judgment? Because for the luxurious man to lack delights is punishment. For the Lord too says: There will be weeping and gnashing of teeth, when you see Abraham, Isaac and Jacob and all the prophets in the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
