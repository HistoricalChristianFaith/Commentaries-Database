[[commentary]]
quote='''
This is the Church, which is founded upon the seas and is prepared upon the rivers. For the Church is made strong and is prepared above you, who flow down as rivers do from that pure source into the fountain of the world, of whom it has been said: ‘The floods have lifted up, O Lord: the floods have lifted up their voices with the voice of many waters.’ And the Psalmist added: ‘Wonderful are the surges of the sea; wonderful is the Lord on high.’ Beneficent are the woods; you have drunk from that perennial and full spring, whither you are flowing, which says to you: ‘He who believes in me’ (as the Scripture says), ‘from within him shall flow rivers of living water.’ He said this, however, of the Spirit, whom they who believed in him were to receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
