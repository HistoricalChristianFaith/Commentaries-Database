[[commentary]]
quote='''
Then in what follows he himself sets out what he felt, saying: But my feet were almost moved, my steps had well-nigh been poured out, because I was jealous of sinners, seeing the peace of sinners. He certainly does not mean the feet and steps of the body, but the direction of the mind and its step, of which he says elsewhere: Let not the foot of pride come to me, and let not the hand of sinners move me. Therefore we must always ask that the Lord direct the footsteps of our minds, lest they slip and, poured out on a kind of slipperiness of error, be unable to keep their steadiness. And the cause of his slipping is this, that he emulated the peace of sinners. But we ought to emulate the things that are good, not those that are full of disgrace, as the apostle Paul too expressed it, saying: But it is good to emulate in what is good always.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 3"
