[[commentary]]
quote='''
Seventy-five souls, then, go down into Egypt, as it is written, and this, mystically, in the number of remission, because after such hardness, after so many sins, they would be held unworthy unless remission of sins were granted them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
