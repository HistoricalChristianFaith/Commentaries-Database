[[commentary]]
quote='''
Last of all the mother was brought to death. Who would deny that she was blessed, who stood among the bodies of her sons as if walled about by seven walls, feeling no onset of death? Who, I say, would doubt her blessedness, who, surrounded by seven towers, raised her head into the seat of paradise, who, girded with seven sons, brought to the heavenly altars a most sacred choir for God, tuneful not only with voices but also with sufferings, to sing together the praises of the Lord? How good a childbearing of faith, how safe this harbour of devotion, how splendid a lamp of the Church, shining with sevenfold light and, with her womb as the eighth, supplying oil to all the lights! Of them it is beautifully said: give a portion to those seven, and indeed to those eight, because in both numbers they attain the fellowship of grace, nourished in the Law, crowned through grace, seven as in the sabbath, eight as in the Gospel, the devout mother having been joined as the completion of the passion, she who in such sons both travailed with and brought forth the perfect form of devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
