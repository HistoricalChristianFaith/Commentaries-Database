[[commentary]]
quote='''
For the abomination of desolation is the accursed coming of Antichrist, because with ill-omened sacrileges he defiles the inner parts of minds, sitting in the temple according to the historical sense, to claim for himself the throne of divine power. But according to the spiritual interpretation he is fittingly brought in as standing, because he desires to fix the footprint of his unbelief in the affections of each one, arguing from the Scriptures that he is the Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
