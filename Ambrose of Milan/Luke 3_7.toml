[[commentary]]
quote='''
We see these men through the compassion of God, inspired with prudence to seek repentance of their crimes, dreading with wise devotion the terror of the judgment to come. Or perhaps, according to the precept, Be ye wise as serpents, (Matt. 10:16.) they are shown to have a natural prudence, who perceive what is coming, and earnestly desire help, though they still forsake not what is hurtful.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Generation of vipers, who showed you to flee from the wrath to come? Bear, therefore, fruits worthy of repentance, and do not begin to say: Our father is Abraham. But I say to you that God is able from these stones to raise up children to Abraham;

the malice of the Jews seems indeed to be rebuked, in that, variegated with the venom of a harmful mind, they practise serpentine slidings and earthly lairs, and not any mystery of divine knowledge; but yet, when it is said: Who showed you to flee from the wrath to come? it is shown that prudence was poured into them by the compassion of God, so that they should repent of their sins, fearing with provident devotion the terror of the judgment to come. The comparison with vipers, then, must be referred to their begetting, not to their lineage. Or perhaps, according to what is written: Be prudent as serpents, they are shown to have a natural prudence, as those who see what will profit them and ask for it of their own accord, but do not yet abandon what is harmful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
