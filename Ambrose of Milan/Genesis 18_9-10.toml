[[commentary]]
quote='''
And he said to him: Where is Sarah your wife? He answered and said: Behold, in the tent. Did the Lord, who in what follows announces the coming destruction of Sodom, not know where Sarah was? He knew, but he wished to teach us how great the modesty of women ought to be, so that they may not turn the eyes of guests upon themselves by forwardly going out to meet them, but may perform their ministry with their modesty safe. Abraham too impresses on your ears that Sarah stays in the tent, so that you may learn what to require of a wife. Sarah, now of advanced age, guards a youthful modesty: therefore the Lord promised her a son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
