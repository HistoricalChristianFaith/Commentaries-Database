[[commentary]]
quote='''
They have set their mouth against heaven, and their tongue has passed over the earth. What it is to set one's mouth in heaven, that younger one of the brothers teaches us, who returned to his father and said: Father, I have sinned against heaven and before you. And they set their mouth against heaven who think that the authorship of their crimes is assigned to them by a certain necessity of their nativity. These are wont to spare neither heaven nor earth, so that they judge that the life of man is governed by a certain course of the stars. They leave nothing to providence, nothing to good morals.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 5"
