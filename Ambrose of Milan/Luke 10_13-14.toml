[[commentary]]
quote='''
Our Lord warns us that they will meet with a heavier punishment who have refused to follow the Gospel than those who have chosen to break the law; saying, Woe unto thee, Chorazin! woe unto thee, Bethsaida!
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He teaches also that those who have judged that the Gospel is not to be followed will be liable to a heavier punishment than those who have judged that the Law is to be broken, because Tyre and Sidon, had they seen such great wonders of heavenly works, would not have despised the remedy of repentance. And that this worldly affluence or insolence is neither to be compared with the heavenly gift nor, again, abandoned without remedy, since each has the help of repenting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
