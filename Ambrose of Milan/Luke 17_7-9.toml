[[commentary]]
quote='''
It follows that no one should glory in his works, because by right we owe obedience to the Lord. For if you do not say to a servant who is plowing or feeding sheep: Pass over, recline — where it is understood that no one reclines unless he has first passed over; thus Moses too first passed over, so that he might see a great sight — if, then, you not only do not say to your servant: Recline, but require another service of him and do not thank him, so neither does the Lord allow in you the practice of one work or labor only, because, while we live, we must always work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
