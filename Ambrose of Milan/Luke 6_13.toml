[[commentary]]
quote='''
But what does it become thee to do when thou wouldest commence any work of piety, when Christ, about to send out His disciples, first prayed? for it follows, And when it was day, he called his disciples, &c. whom truly He destined to be the means of spreading the salvation of man through the world. Turn thy eyes also to the heavenly council. Not the wise men, not the rich, not the noble, but He chose to send out fishermen and publicans, that they might not seem to turn men to their grace by riches or by the influence of power and rank, and that the force of truth, not the graces of oratory, might prevail.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He called he says his disciples and chose twelve of them, whom he would appoint as sowers of faith throughout the world, to spread the help of human salvation. At the same time note the heavenly counsel: not some wise men, not rich men, not nobles, but fishermen and tax collectors he chose to send, lest he should seem to have led some over to his grace by prudence, to have redeemed them by riches, to have drawn them by the authority of power and nobility; so that the reason of truth, not the charm of disputation, might prevail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
