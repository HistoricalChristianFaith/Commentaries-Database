[[commentary]]
quote='''
Seeing, then, in the spirit that sweetness of the heavenly sacraments, that table which repels the plots of those who wear him down, as he himself said earlier: You have prepared a table in my sight against those who crush me, he says: And I will go in to the altar of my God, to God who gives joy to my youth. Beautifully did he say, as if he were Adam: And I will go in. For we had been cast out of the paradise of the Lord, from the time when Adam, conscious of his sin, turned aside from the face of the Lord. Fittingly also he added: And I will go in to the altar of God, as though he were returning into the sight of God. For God had turned away from our gifts when he did not approve the gifts of that parricide Cain. Cain lay hidden, estranged from the sight of the Lord: the savage force of his raging mind, because the Lord had looked upon his brother's gifts, left his own heirs under offence. Abel had perished not to himself, he whose blood also cried out to the Lord, but he had perished to all of us. Almost no one's sacrifice was any longer approved, because there was none who did good, there was not even one, since neither faith toward God nor devotion toward a brother's kinship was preserved. The Lord Jesus came to raise up Adam; Abel too was raised up, whose gifts pleased God. The Lord Jesus offered himself, that is, the first-fruits of his body, in the sprinkling of blood that speaks better than the blood of Abel spoke on the earth. God looked upon his gifts, and from that time he himself left the grace of divine reconciliation to good heirs. Rightly, therefore, does holy David say, as if in the person of man reconciled: And I will go in to the altar of my God, to God who gives joy to my youth.

Let us support this passage, if we can, by the example of another prophet as well, showing how the Lord first turned away from man's sacrifices and was afterwards reconciled to him. We have it written in the book of Isaiah, where God says: What to me is the multitude of your sacrifices? says the Lord. I am full, that is: I abound in what is mine, I do not seek what is yours; I do not want holocausts of rams and the fat of lambs and the blood of bulls and of goats, and do not come thus into my sight. And yet Abel had offered a sacrifice from the young of the flock, by which he had pleased God; but he who was waiting for the truth of the sacrifice did not require the type; for the saving passion of the Lord was awaited. For who he says has required these things from your hands? You shall not go on treading my palace. And below: When you stretch out your hands to me, I will turn away my face from you. But wash yourselves, be clean, take away malice from your souls. Judge for the orphan and justify the widow, and come, let us reason together, says the Lord. It is clear, therefore, that the Lord both turned away from man's sacrifices before and was reconciled afterwards, so that he deigned to look upon our sacrifices.

Therefore he goes in without fear who enters into the mercy of the Lord. Indeed, it is said to the good servant: Go in into the joy of your lord, but of the wicked servant it is said: Take him into the outer darkness. Therefore Adam too, cast out of the heavenly homeland and of that seat of paradise, was banished to the island of sin. Rightly, then, does Scripture say: Be renewed, O islands, because we are surrounded by the waves of sins like islands in the strait of this world. These islands, then, have been renewed through the coming of the Lord by the remission of sins; that is, men, set in the washing in the midst of the waters as if they were islands, were being pounded by masses of waves, like islands by the resounding, dashing billows of sins, like islands on which before, as on reefs of fraud, the simple suffered frequent shipwrecks, because there was guile in the heart and flatteries in the mouth. But after the Lord Jesus, in whom there is no guile, coming into this world, calmed the depths of human minds by setting forth heavenly teaching, and poured tranquillity back into the affections of each, taking away the hedge of discord, there began to be, as it were, harbours of refuge for those who approached, so that each may moor the ship of his own repose in the affection of his neighbour or his brother, and hold fast in a kind of shoreline retreat of a devout mind.

Not without reason, then, does David cry out as one renewed: And I will go in to the altar of my God, to God who gives joy to my youth. So it is that he who had said above that he had grown old among his enemies, as we read in the sixth psalm, here says that his youth has been renewed out of the old age, grown old indeed, of man's fall. For we are renewed through the washing of regeneration, we are renewed through the outpouring of the Holy Spirit, and we shall be renewed also through the resurrection, as he says later: Your youth will be renewed like the eagle's. Hear how we are renewed: You will sprinkle me with hyssop and I shall be cleansed; you will wash me and I shall be made white above snow. And in Isaiah he says: If your sins are like scarlet, I will make them white as snow. Rightly is he renewed who is changed from the darkness of sins into the light of virtues and into grace, so that he who before was filthy with foul defilement may shine above snow with an exceedingly white brightness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 9"

[[commentary]]
quote='''
I will praise you on the lyre, my God. Our soul has its own lyre; for Paul would not say: I will pray with the spirit, I will pray also with the mind; I will sing psalms with the spirit, I will sing psalms also with the mind, unless he had a lyre that would resound under the plectrum of the Holy Spirit. Our flesh is a lyre when it dies to sin, that it may live to God; it is a lyre when it receives the sevenfold Spirit in the sacrament of baptism. For the tortoise, while it lives, is sunk in mud; once it has died, its shell is fitted for the use of singing and for the grace of a holy discipline, so that it may sound forth the distinctions of seven notes in modulating measures. Likewise our flesh, if it lives for bodily allurements, lives in a kind of mire and whirlpool of pleasures; if it dies to luxury and incontinence, then it takes up the true life again, then it begins to give forth the sweet melody of good works. Sweet is the sound of chastity, sweet the sound of those who fear God. And so their sound has gone out into all the earth. Sweet is the sound of faith, which is proclaimed, as it is written, in the whole world. Let this sound go out from us to God, as it went out also from the Thessalonians, so that even when we are not singing we may sing, and proclaim the Lord by the harmony of good works, to whom is honour, glory, everlastingness from the ages, and now and always and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 10"
