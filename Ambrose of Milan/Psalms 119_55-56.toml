[[commentary]]
quote='''
Let us, then, be mindful of the heavenly justifications; so that while we sing them with the secret voice of the mind, we may be mindful in the night of the name of the Lord, and may say, as it is written: This has come to me, because I have sought out your justifications (Ps. 118 (119):56); that is, this remembrance has come to me, that I should be mindful even in the night of your name, not lulled by drunkenness, not loosened into sleep by feasting, not occupied with worldly cares, lest forgetfulness of your worship should creep upon me: but chastising my limbs by daily meditation, and exercising the intent of my mind; so that by constancy this course may become customary for us, so that we may venerate the Lord Jesus even in the nights with all our affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
