[[commentary]]
quote='''
But wisdom is above gold, not in gold. Therefore he who desired to have wisdom: Silver he says and gold I have not, but what I have I give you. In the name of Jesus Christ the Nazarene, rise and walk. Because he did not have gold, he had in the name of Christ the grace of devout working. Therefore to you too it is said: Draw wisdom into the inner places. It has lain hidden he says from every man, and was concealed from the birds of heaven. Neither men nor angels knew where it was, for they are the birds of heaven, of whom it is said: And I saw an angel flying through heaven.

No one could know wisdom, because no one knows the Son except the Father, and no one knows the Father except the Son and he to whom the Son wills to reveal him. He himself, then, revealed it to John, with whom wisdom was, and therefore John spoke not what was his own, but what wisdom poured into him: In the beginning was the Word, and the Word was with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
