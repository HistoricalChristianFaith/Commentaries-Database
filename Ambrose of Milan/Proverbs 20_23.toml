[[commentary]]
quote='''
Hence Solomon says: A double weight is abominable to the Lord, and a deceitful balance is not good. By this he signifies those who plan plunder with an insatiable heart and put forward sobriety on their brow. Such are the scribes of the Jews, who lay on others heavy burdens of a harsher observance, not having the yoke of their own soul straight but bent by a leaning toward iniquity, while they themselves are runaways from their own precepts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
