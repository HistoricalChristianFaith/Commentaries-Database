[[commentary]]
quote='''
The nations were troubled, the kingdoms were bowed down; the Most High gave his voice, and the earth was moved. At the coming of the Lord the Savior the adverse powers with their legion were troubled, when they were ordered to go out of human bodies and begged to be sent into the swine. When the most wicked powers had been troubled, the worshippers of idols had to be troubled, and the kingdoms of sin had to be bowed down as well. For it was a heavy kingdom, which had subjugated to itself in heavy servitude the minds of all sinners; for he who commits sin is the slave of sin. And the kingdom of sin is the kingdom of death, which long prevailed over the whole world. Hence the Apostle also says: But death reigned from Adam to Moses even over those who did not sin after the likeness of the transgression of Adam, who is the form of the one to come. Truth came, the figure ceased; life came, the kingdom of death vanished; the remission of sins came, and the chains of sin were loosed. Before, even lighter offences were bound by the bonds of death; but after the coming of the saving Lord even graver crimes were remitted. The kingdoms of the spiritual wickednesses which are in the heavenly places were bowed down, then, because the worship of idols and the allurement of sin began to be diminished by the preaching of the Gospel teaching. Unbelief was bowed down after faith began to reign in the hearts of the nations. The kingdoms of sin are bowed down when it is read: Let not sin reign in your mortal body. The Lord bowed down all the kingdoms of unbelief with his voice, saying: Come to me, all you who labour and are burdened, and I will refresh you.

This voice the Most High gave, and all the peoples of the nations followed, fleeing the harsh kingdoms of sin, the cruelty of perpetual death and the intolerable servitude of all crimes, since he promised rest to the weary, release to captives, freedom to those in servitude, and, having shaken off the iron yoke of the Babylonian king, put his own sweet yoke in its place upon the necks of the faithful, lest the enemy should again bind the empty necks of the Gentiles with the chains of his iniquity. For those whom Christ binds he sets free, and those whom he ties he releases. In fact, he who has been called by the Lord as a slave is the Lord's freedman, and he who has been called free is the slave of Christ. And therefore Paul glories in his chains, saying: Paul, a prisoner of Jesus. What under others is an insult, under Christ is glory. The Lord gave his voice in the Passion, and all the elements trembled, the whole earth was moved, so that the rites of the Gentiles might be dissolved, and there might be the earth of the Lord and its fullness, as it is written; that the auguries of the unbelieving might cease, and the knowledge of faith and the zeal of devotion might abolish the sacrifice of ungodliness. The Lord gives his voice daily, and it resounds in the hearts of each, so that everything earthly may fall away from the affection of him who believes well, and every sense of the inner minds may be moved by devout confession from error, from the corruption and dissolution of luxury, to the knowledge of the heavenly sacraments and zeal for chastity, from wickedness to virtue.

He says, then, that those who are on the earth were moved; or else because all men in whom there was earthly corruption were earth, since they did not know how to raise and lift the eyes of their minds to the height of heavenly grace, nor could they say: the God of powers is with us, for there was none with them but the instigator of the fall and the author of error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
