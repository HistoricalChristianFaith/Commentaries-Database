[[commentary]]
quote='''
For if duty is to be shown to parents, how much more to the author of parents, to whom you owe thanks even for your parents! Or if they do not acknowledge the Parent at all, how are you to acknowledge them? He does not say, then, that we must renounce our dear ones, but that God must be preferred to all. Indeed you have in another book: he who loves father or mother more than me is not worthy of me. You are forbidden not to love your parents, but to prefer them to God; for the dear ones of nature are benefits of the Lord, and no one ought to love the benefit he has received more than God, by whom the benefit received is preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
