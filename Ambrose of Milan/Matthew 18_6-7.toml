[[commentary]]
quote='''
Where he bids the infants come to him, so that he might bless them either by preaching or by the laying on of hands, he calls them children; where he commands that the little ones are not to be scandalized, he calls them little ones; for those who are touched by Christ are not scandalized, those who draw near to Christ do not slip; but those slip whom not smallness of age but littleness of virtue has made little ones. At the same time he also teaches that the weak are not to be tempted, lest their offenses be turned back upon us, since their prayers to the Lord, though they themselves be weak in the merits of virtue, are yet raised up by the patronage of the angels. Let no one, then, mock the poor man, because he provokes him who made him; let no one tempt the feeble, lest he injure the angels; let no one cast down the weak, lest he undo the benefit of the Redeemer.

And therefore he said: Woe to this world because of scandals, because many have judged the cross of the Lord a scandal, while the humility of the Lord's Passion is the sacrament of our salvation, so that we may take up the duty of virtue and take the example of humility. Woe, then, to him who has not believed in the cross of the Lord, by which the weak are scandalized: It is better for him that an ass's millstone be hung about his neck and that he be sunk into the depth of the sea.

In the divine scriptures, indeed, we ought to weigh not the sequence of words but the weight of things; for a kind of monstrous display of a punishment of unheard-of and hideous kind does more to repress sins. Yet lest from this too a scandal should arise for anyone who is weak, we think that the ass's millstone, the man's neck and the depth of the sea are not idly set together. For since the Gentile people has received the type of the ass, does it not seem to you to turn, as it were, an ass's millstone, so long as it is engaged in the error of its ignorance: bound indeed by the chains of nature, so as to grind out the word, to seek God, but overspread with the blindness of a covered mind, so that it does not know how to raise the face of the soul to God, to open the eyes of the heart? And therefore, with no briskness in its course, its footsteps often returning upon themselves, it labors unwillingly for another's use. Yet he who turns the millstone has at some time an end of finishing his work, and bears the hope of putting off his blindness; but on whom is the millstone hung at the neck? He carries a stone who refused to carry the yoke of the Lord. So the ass is to the millstone, the blind man to the stone, the Gentile to the rock, worshiping him whom he neither sees nor recognizes; for God does not dwell in things made by hands, nor is he recognized in a rock, but in spirit.

Both peoples, then, the Gentile and the Jew, are set forth by a kind of display in this saying, but a more vehement punishment is decreed against the Jews. For the memory of the Gentiles will be overwhelmed by the waves of this age and abolished in the mire of this world, since they wished to be among the things that are not, and, estranged from the knowledge of God, they have been sunk as it were into the depth of the sea; but the Jews, taken up through the patriarchs, marked by circumcision, instructed through the law, will not perish as unknown, but will be punished as sacrilegious. For the God unknown to the Athenians was known in Judea, but not received. And therefore he who does not know will be unknown, he who transgresses will be condemned; and neither is the one freed from guilt who did not know his own author, and the other is shut out from pardon who did not receive the Lord. Yet it is more tolerable not to have brought faith to Christ than to have laid hands on him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
