[[commentary]]
quote='''
We have taken up our present pen to write an apology for the prophet David, not because he stands in need of this service, he who shone with such great merits and flowered with virtues, but because many, having read the record of his deeds without looking into the force of the Scriptures or the hidden things of the mysteries, wonder how so great a prophet did not avoid the contagion first of adultery and then of homicide.

Therefore it has been our concern to review the story itself, which seems to have lain open to sin. For in the second book of Kingdoms we read that David, walking about in his royal house, looked out and saw a woman bathing — her name was Bathsheba — of outstanding beauty, with comeliness of countenance and a face exceedingly fair; and, softened by these allurements, he had conceived the desire of possessing her. Now the woman was married to a husband; Uriah was the husband's name, and for him, by royal commands, the scene of his death was contrived. For although his life was reckoned no hindrance at all to desire, it was yet reckoned a very great obstacle where the adultery's shame was concerned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 1"
