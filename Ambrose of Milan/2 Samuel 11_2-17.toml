[[commentary]]
quote='''
We have taken up our present pen to write an apology for the prophet David, not because he stands in need of this service, he who shone with such great merits and flowered with virtues, but because many, having read the record of his deeds without looking into the force of the Scriptures or the hidden things of the mysteries, wonder how so great a prophet did not avoid the contagion first of adultery and then of homicide.

Therefore it has been our concern to review the story itself, which seems to have lain open to sin. For in the second book of Kingdoms we read that David, walking about in his royal house, looked out and saw a woman bathing — her name was Bathsheba — of outstanding beauty, with comeliness of countenance and a face exceedingly fair; and, softened by these allurements, he had conceived the desire of possessing her. Now the woman was married to a husband; Uriah was the husband's name, and for him, by royal commands, the scene of his death was contrived. For although his life was reckoned no hindrance at all to desire, it was yet reckoned a very great obstacle where the adultery's shame was concerned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 1"

[[commentary]]
quote='''
The history that has been set before us contains adultery and murder. For thus we find it written in the book of Kingdoms: that King David, while he was walking about in his house, saw the wife of Uriah washing herself, loved her at once and ordered her to be summoned. Then he ordered her husband, an innocent man, as Scripture presents him, to be thrown against the fiercest warriors, so that he might be overwhelmed by the force of the enemy. These things were done, and they are not denied. How, then, will they be defended? The Gospel reading well admonishes us that, even when the sin is evident, the judgment of the judge ought nevertheless to be sober, and that each one ought to be mindful of his own condition and desert. For often, even in judging, the sin of the judgment is greater than the sin of the very one on whom judgment has been passed. For if it has been prescribed by certain wise men of the world that in judging one should take care that the penalty be not greater than the guilt, and this is observed, how much more does it seem that this ought to be observed: that each one who is about to judge another should first judge himself, and should not condemn lesser errors in another when he himself has committed graver ones. Who, then, are you who judge David, a holy man? I say it to the Gentile, I say it to the Jew, I say it to the Christian.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 2"

[[commentary]]
quote='''
But now let us review the mysteries of the history itself and draw from the very fountains of the Scriptures, and, so that we may be able to look into the whole sequence of the mysteries, let us go back over the text of the history itself. For thus, we remember, it is set down in the book of Kingdoms: that David, when he had seen Bathsheba, the wife of Uriah, washing, fell in love with her, and then ordered her to come to his house while the woman's husband was away. Not long after, her husband returned as a messenger of the war, a man truly religious and devout, who did not think that he ought to enter his house in time of war, when he saw his comrades intent on the war and keeping watch not in the tents of home but in the tents of battle. Afterwards, by David's order, he was sent back to the war under the instruction that he be thrown against the enemy fighters, so that by the husband's death the king might have free opportunity of possessing the woman. And here there is some shamefacedness about the sin and some shame for the guilt, in that he sought a hiding-place for his error and did not assume to himself authority for an unjust killing by right of royal power, but avoided odium. I confess the guilt; but the guilt that is held down by shamefacedness is more tolerable than that which is proclaimed with insolence. So Uriah died, thrown against the fighters; but afterwards those same men who had slain him were put to death by David's order when the city was stormed. This is the sequence of the history, in which one may behold profound mysteries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 6"
