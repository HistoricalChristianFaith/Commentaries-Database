[[commentary]]
quote='''
Drunkenness is the kindling wood of passion, drunkenness is the incentive of madness, drunkenness is the poison of folly. This vice changes the senses and forms of men, through this vice from men they become neighing horses; since indeed, being warm with the natural heat of the body and inflamed beyond the measure of nature by the heat of wine, they cannot restrain themselves, and are excited to bestial passions, so that they have no time prescribed in which it would be fitting for them to indulge in coition. They lose their voice, they change color, their eyes burn with passion, they pant with open mouth, they snort with distended nostrils, they are enkindled into rage, they go out of their senses. From this comes dangerous delirium, from this comes the heavy affliction of gall stones, from this comes fatal indigestion, from this comes frequent vomiting on the part of those who belch forth half eaten dainties together with the blood of their inner vitals. I speak falsely if the Lord has not said the same things through Jeremias in these words: Drink ye, and be drunken, and vomit: and ye will fall and will rise no more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 16"
