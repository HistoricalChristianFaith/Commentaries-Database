[[commentary]]
quote='''
In short, not long after a revelation of this kind, when Dinah, Jacob's daughter, had been violated by the son of a foreigner, the modesty of her virginity deflowered, her brothers, who did not understand the mystery, out of zeal for vengeance killed the foreigners, who were offering a fellowship of faith through the union of their families; but Jacob, who in moral gentleness loved clemency, or in the mystical spirit foresaw the mystery of the Church to be gathered from the Gentiles, received that scene of exacted revenge unwillingly and with grief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 7"
