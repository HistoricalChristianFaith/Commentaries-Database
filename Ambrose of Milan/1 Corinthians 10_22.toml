[[commentary]]
quote='''
Thus the Latin interpreter, wishing to make a distinction between the emulation of virtue and the emulation of offence, says: Do we emulate the Lord? that is: do we bring upon the Lord the offence of emulation, by eating of the things that have been offered to idols, as the Jews exasperated him by sacrificing to idols? But if among men the intention of rousing emulation gives offence, and frequently the person of the one exasperated is found to be the stronger, which has been accustomed to turn to the harm of the one who incited the emulation, what folly is it to provoke the divine majesty and to assail it with the stumbling-block of emulation, where there is no difficulty in vengeance!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
