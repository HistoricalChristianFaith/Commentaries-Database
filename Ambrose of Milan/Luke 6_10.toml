[[commentary]]
quote='''
You have heard then the words of Him who says, Stretch forth thy hand. That is a frequent and common cure, and thou that thinkest thy hand is whole, beware lest it be contracted by avarice or sacrilege. Stretch it forth oftener to help thy neighbour, to protect the widow, to save from injury him whom you see the victim of unjust attack; stretch it forth to the poor man who beseeches thee; stretch it forth to the Lord, to ask pardon of thy sins; as the hand is stretched forth so is it healed. (1 Kings 13:5, 6.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You have heard, then, the words of the Lord saying: Stretch out your hand. That is a common and general medicine. And you who think you have a sound hand, beware lest it be contracted by avarice, beware lest by sacrilege. Stretch it out often, stretch it out to that poor man who beseeches you, stretch it out to help your neighbour, to bring protection to a widow, to snatch from wrong the man you see subjected to unjust insult; stretch it out to God for your sins. Thus the hand is stretched out, thus it is healed. Thus Jeroboam contracted his hand when he sacrificed with idols, and stretched it out when he besought God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
