[[commentary]]
quote='''
And therefore, since both the Savior has set down two kinds of resurrection and so has John in the Apocalypse, saying: blessed is he who has a part in the first resurrection — for these come to grace without judgement, while those who do not come to the first resurrection but are reserved for the second will be burned until they fulfil the times between the first and the second resurrection, or, if they have not fulfilled them, will remain longer in punishment —, therefore, then, let us pray that we may be found worthy to have a part in the first resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
