[[commentary]]
quote='''
Many, then, of those sleeping in the mound of the earth will rise, those who have done well to the resurrection of life, those who have done evil to the resurrection of judgement. What Daniel says: to eternal life, this the Savior called to the resurrection of life; likewise what Daniel says: to reproach and confusion, the Savior said: to the resurrection of judgement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
