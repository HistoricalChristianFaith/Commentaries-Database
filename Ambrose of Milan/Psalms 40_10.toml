[[commentary]]
quote='''
To the Father he says: My righteousness I have not hidden in my heart; your truth and your salvation I have spoken. This whole psalm is spoken in the person of Christ. Therefore he says "my righteousness", although a man too may speak, without arrogance, of his own righteousness, if he believes God and confesses that his faith is reckoned to him for righteousness. He loves truth and mercy who preaches the true faith and forgives sins. For this is why Christ came: to establish faith, to grant the remission of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
