[[commentary]]
quote='''
This the Greeks call οἰκουμένην, because it is inhabited by Christ, as he himself said: For I will dwell in them; for he dwells in it to fill what seemed empty. What, then, is the οἰκουμένη but the holy Church, the temple of God and the dwelling-place of Christ? Nor was it unfitting that the Latins, with a word of different sound indeed but of equal sense, named it the circle of the earth, because the life of the saints, who are inhabited by the Spirit, rolls round in a circle like a wheel, without any stumbling in its course.

In tribulations, then, the Church is founded, in tempests and storms, in anxieties and grief; in adversities and in rivers it is prepared. In what rivers? Hear him who says: The rivers have lifted up their voice. Hear also in the Gospel: He who believes in me, as Scripture has said, rivers of living water shall flow from his belly. But this he said of the Spirit, which those who believed in him were receiving. In these rivers, therefore, the Church is prepared, in which the grace of God flows forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
