[[commentary]]
quote='''
And looking up he says with his eyes he saw, and behold, three men were standing over him. And when he had seen them, he ran to meet them. See first the mystery of faith. God appeared to him, and he beheld three. He on whom God shines sees the Trinity. He does not receive the Father without the Son, nor does he confess the Son without the Holy Spirit. These things elsewhere more fully; now the purpose is to pursue the moral sense of the passage. He does not sit idle who looks far off. Nor was he content to have seen them: he ran to meet them. He hastened to meet them, because it is not enough to do rightly unless you also hasten what you do. The Law commands that the Passover be eaten in haste; for a quickened devotion has richer fruits. Learn, then, how unwearied you ought to be, so that you can be beforehand with a guest, lest someone else be beforehand and defraud you of the abundance of a good service.

Hospitality is a good thing; it has its reward, first of human gratitude, then, what is greater, of divine recompense. We are all guests in this sojourning; for we have a lodging to dwell in for a time: we move on quickly. Let us beware lest, if we have been harsh or negligent in receiving guests, the lodgings of the saints also be denied to us after the course of this life. Hence in the Gospel the Saviour says: Make for yourselves friends of the unrighteous mammon, that they may receive you into their eternal dwellings. Then too, while you are in this body, the necessity of travelling often arises. What you deny to others, then, you will decree against yourself, and by what you have bestowed on others you will make yourself seem worthy of it. If all were to follow that opinion of not receiving guests, where will there be rest for travellers? Leaving human habitations, then, we shall seek out the retreats of wild beasts, the lairs of animals.

But do you plead poverty? A guest asks of you not wealth but favour, not an adorned banquet but whatever food is at hand. Better is he says hospitality with herbs for friendship and favour than if you slay calves at the stalls with enmity. These things are pleasing to men, acceptable to God. Hence the Lord Jesus in the Gospel declares that whoever gives a guest a drink of cold water will not be without a share in heavenly rewards. Indeed, Jacob watered Rachel's sheep and found favour; he gained a wife. Then, how do you know whether you are receiving God when you think it is a guest? Abraham, while he offers hospitality to travellers, received God and his angels as guests. And indeed, when you receive a guest, you receive God, as it is written in the Gospel, as you read, where the Lord Jesus says: I was a stranger, and you took me in. For what you did to one of these least, you did to me. By the hospitality of a single hour that widow who received Elijah and fed him with a little food found perpetual nourishment for the whole time of the famine, and she received a wonderful reward, that the meal did not fail from the jar. Elisha too paid the rent of his lodging by granting the raising of her dead child.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
