[[commentary]]
quote='''
You have learned in the Gospel that to wash the feet is a mystery of faith, a mark of humility, according to what is written: If I, the Lord and master, have washed your feet, how much more ought you to wash one another's feet (John 13:14)! But this pertains to humility. As regards the mystery, however, he who wishes to have a part with Christ ought to wash his feet: For if I do not wash, he says, your feet, you will have no part with me (ibid. 8). When this is said to Peter, what is judged of us? He, then, who has washed his feet has no need to wash them again; and therefore let him take care not to soil them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
