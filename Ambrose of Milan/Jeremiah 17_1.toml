[[commentary]]
quote='''
There are surely certain sores of offences deeply impressed on our conscience, and certain weals on our minds and souls, which are overlaid with the sores of our errors. Guilt, then, has its own characters and letters, by which it is betrayed. This we do not invent by our own ingenuity, but we seal it with prophetic authority. It is written, then; and see where it is written. On the breast he says of your heart, that is: the record of guilt is written there, where the form of virtue is also, not on tablets of stone, but on fleshly tablets of the heart. But the things that are good are not written in with ink, but with the Spirit of the living God, while the things that are vicious with an iron stylus and an adamantine nail. The writing is almost such as the penalty of sin is. The one is written with an iron stylus, the other is restrained with an iron rod, as it is written: You shall rule them with a rod of iron. Different is that other one, the straight rod, the rod of your kingdom. The one restrains the guilty with punishment, the other governs the innocent with command. Guilt, then, is written; let us see where. Not outside, but within, in your heart and in your breast. For as the word is near, in your mouth and in your heart, so in unbelievers the figure of sin and the image of error are impressed in the heart itself. Within, then, is guilt; within is virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
