[[commentary]]
quote='''
As for Ahab, it is clear enough, whose wife was Jezebel, and as for Jeconiah, Jeremiah is an amply sufficient witness that he was guilty of the greatest offence, and he even took from him the name that he had. And therefore he who in the books of Kings is called Joachim was named Jeconiah by Jeremiah, when he said: Jeconiah has been cast away like a vessel, there is no use in it, wherefore he has been cast out, he and his seed. Earth, earth, hear the word of the Lord: write this man down as disowned, for there will not arise of his seed one sitting on the throne of David, a prince still in Judah. For while he was reigning the Babylonians laid Judaea waste, and never afterwards could anyone of his seed obtain the kingdom in Judaea; for afterwards the people, released from captivity, was under priests and tetrarchs. Hence tetrarchs remained right up to the generation of Christ, and not even they, as far as history teaches, kept the dignity of a royal line.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
We are all earthen vessels: even if someone is a king, he is an earthen vessel; even if an apostle, he is a vessel. Hence Paul too: We have, he says, this treasure in earthen vessels; and the prophet says of the king: Jeconiah has been made worthless like a vessel for which there is no need. And he added: Earth, hear the word of the Lord: write this man down as disowned. As if by a father's right, our God is wont to disown degenerate sons; therefore the earth too writes down those who are sons of the earth. Hence, when the Jews were accusing the adulteress, the Lord Jesus was writing with his finger on the earth. But the just are not written on the earth, as we read. To them it is said: Rejoice, because your names are written in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 5"
