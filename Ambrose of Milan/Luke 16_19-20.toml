[[commentary]]
quote='''
Now set before your eyes the Arians, intent on worldly pursuits, who court alliance with royal power so as to attack the truth of the Church with military arms: do they not seem to you to be lying in a kind of purple and fine linen on piled-up couches, they who defend the counterfeit in place of the true? And to abound in rich words, when they boast that the earth trembled under the Lord's body, that the sky was overcast with darkness, that the seas were stirred up or calmed by a word, while yet they deny the true Son of God? Set beside them also that poor man who, knowing that the kingdom of God is not in word but in power, expressed in few words what he believed, saying: You are the Son of the living God: do not those riches seem to you to be in want, and this poverty to overflow? Rich heresy has composed many gospels; poor faith has held this one Gospel only, which it received. Rich philosophy has made itself many gods; the poor Church has known one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
