[[commentary]]
quote='''
We have a likeness of this interrogation also in what comes later, where the same prophet says: Why, O God, have you cast us off to the end? And there he openly and tearfully lamented that he had forgotten his congregation and cast away the rod of his inheritance, and that his enemies had risen up against the people of God, of whom he says: And those who hate you have boasted in the midst of your feast. Perhaps this little verse would seem to point to the Assyrians, who triumphed over the people of the Jews, were it not followed by: They set up their signs as signs, and I did not know them. There are always signs, that is, standards, in war, which are wont to go before those about to fight and to lead the army's column. Every company or legion follows its own signs. And if they have been scattered by the turmoil of battle, they return to where they have seen their own signs to be, however far away they are. Every commander sets up these signs and prescribes that they be followed. But there are also other signs, which the victorious enemy imposes and decrees are to be observed as by captives; but he who is a faithful soldier follows his own signs and does not know foreign ones.

Let us consider more attentively and more earnestly what the foreign signs are. Christ has set his sign on the foreheads of each one; there too the Antichrist sets his signs, so that he may recognize his own. But to him who is a Jew in secret the true confessor says: They set up their signs as signs, and I did not know them. The devil and his ministers set them up, but I did not know them, because I did not consent to his arts, I did not yield to his commands. The Assyrian Nebuchadnezzar set signs upon the youths of the Hebrews and changed their names, and ordered that they should worship his image and withdraw from the solemn rites of their fathers and, setting the law of God aside, follow the rites of the Chaldeans. The king decreed this, but Daniel resolved in his heart to shun the contagion of the royal table. Rightly, then, it befits him to say that he did not know the foreign signs. It had been ordered that the Hebrew youths should worship the king's image; they answered him: We do not worship your image. Fittingly, then, each of them said: They set up their signs as signs, and I did not know them, that is, I did not experience them, I did not receive them by any consent, I did not take them over into myself by any fellowship. Hence also we read of the Son of God that he did not know sin. And elsewhere you have: For he who keeps the commandment does not know a wicked word, since it is perfectly clear that what is meant is not the knowledge of wickedness but a criminal fellowship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 7"
