[[commentary]]
quote='''
For the powers in heaven shall be moved, and then they shall see the Son of Man coming in the clouds. Perhaps, just as the advent of the Lord is awaited, so that his presence may come to be in the whole world, whether of men or of the universe — a presence which surely comes about in each one when you have received Christ with all your affections — so also the powers of heaven, at the advent and return of the Lord Savior — for he is the Lord of powers — must obtain an increase of grace and be moved by the fullness of divinity pouring itself more closely into them.

There are also powers of the heavens, which declare the glory of God, and which may be moved by a fuller infusion of Christ, spiritual powers, which see Christ. David has taught us how these powers are moved, saying: Come to me and be enlightened. Paul too has taught how you may see Christ: When, indeed, you have turned to the Lord, the veil is taken away, and you see Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
