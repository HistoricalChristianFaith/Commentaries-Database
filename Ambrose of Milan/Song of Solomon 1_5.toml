[[commentary]]
quote='''
It is written, "Ethiopia shall stretch out her hand unto God." In this is signified the appearance of holy church, who says in the Song of Solomon, "I am black and comely, O daughters of Jerusalem": black through sin, comely through grace; black by natural condition, comely through redemption, or certainly, black with the dust of her labors. So it is black while fighting but comely when it is crowned with the ornaments of victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25202.html'
source_title="On the Holy Spirit 2.10.112"


[[commentary]]
quote='''
The church, having put on these garments through the laver of regeneration, says in the Song of Songs, "I am black and comely, O daughters of Jerusalem." Black through the frailty of its human condition, comely through the sacrament of faith. And the daughters of Jerusalem beholding these garments say in amazement, "Who is this that comes up made white?" She was black; how is she now suddenly made white?
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 7:35"

[[commentary]]
quote='''
And so it is said of the soul herself: Who is this who comes up whitened? Before she was baptized, she is the one who said: I am black and beautiful, O daughter of Jerusalem. For she was black, disfigured by the dark horror of sins; but after she had been washed through baptism and had obtained the remission of transgressions, she comes up whitened to Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 12"

[[commentary]]
quote='''
Like the tents of Kedar, like the skins of Solomon; for tents are made from the hides of dead animals. She, therefore, who said this was dead to sin and alive to God: let us also, then, die to sin, that we may live to God. Filled with spirit, with the delight and sweetness of gladness, we shall be spiritual hides, free of bodily infirmity, and keeping in the whole bosom of the mind the grace of the divine mysteries poured into us. That this body is called the tents of Kedar or the skins of Solomon is clear from many passages: yet understand it also from this, that Adam and Eve, when they laid aside the image of the heavenly one which they bore before, and put on the image of the earthly man, are said to have been clothed in tunics of skin; for the sin committed had made them bodily instead of spiritual.

Nor is it absurd to understand that the bride says she has become like skins scorched by the heat of the sun; in that, although placed in the harshness of tribulations, she has yet mortified her body, so that she cannot feel that harshness: for as the skin of a tent does not feel the heat of the sun, because it is the skin of a dead animal, so she, dead to sin, could not feel the heat of sin: either because she was not broken by necessities, or because we are a body of affliction, and ought always to carry about the death of the Lord Jesus in our body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
