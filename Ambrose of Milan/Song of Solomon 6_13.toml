[[commentary]]
quote='''
Turn to us, O peaceful soul, that you may show your glory to your sisters and that they may begin to console themselves with the security of your repose and happiness. Turn to us once only, that we may see you, and turn again and hasten with all speed to that great Jerusalem, the city of the saints. Or indeed, since Christ says this to the pious soul, he commands it to turn for a little while, that its glory and its future repose with the saints may be manifest to us, and then he commands it to hasten to the company of the saints on high.
'''
source_url=''
source_title="CONSOLATION ON THE DEATH OF EMPEROR VALENTINIAN 65"

[[commentary]]
quote='''
This charioteer, then, says: Turn, O Shulammite, turn. Well does he say, as a charioteer to his chariot: Turn, O Shulammite, that is, the peaceful one. For the soul that is peaceful quickly turns and corrects herself, even if she has sinned before, and Christ all the more mounts her and deigns to drive her, he to whom it is said: Mount your horses, and your riding is salvation, and elsewhere: I sent your horses † Tharsis. These are the horses of Christ. So Christ mounts his horses; the Word of God mounts devout souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
This charioteer, then, says:

Turn, O Shulammite, turn. Well does he speak both as a charioteer and as to a chariot: Turn, O Shulammite, that is, the peaceful one; for the soul that is peaceful quickly turns herself back and corrects herself, even if she sinned before: and Christ mounts her the more, and deigns to drive her, he to whom it is said: Mount your horses, and your riding is salvation. And elsewhere: You sent your horses to Tarshish (Hab. 3:8). These are the horses of Christ. Christ, then, mounts his horses: the Word of God mounts pious souls. When our soul is peaceful, so that it may be said to her: Turn; turn, O Shulammite, which means the peaceful one: then she will receive Christ into herself as a seal, that is, the image of God, that she may be after the image; since As is the heavenly, such also are the heavenly, and we must bear the image of the heavenly (1 Cor. 15:48), that is, peace. And that we may know this is true, you have it in the same Song of Songs, said at the very end to the soul now perfect, which the Lord Jesus may say to me too: Set me as a seal on your heart, as a seal on your arm (Song 8:6); that peace may shine in my heart, and Christ in my works, that wisdom may be formed in me, and justice, and redemption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
