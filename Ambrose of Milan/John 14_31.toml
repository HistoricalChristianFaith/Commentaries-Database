[[commentary]]
quote='''
Hence let us too, while we are in the body, imitating the practice of death, lift up our soul from the couch of this flesh and rise, as it were, from this tomb. Let us withdraw ourselves from the tie of the body, let us leave all things whatever that are earthly, so that when the adversary comes he may find nothing of his own in us. Let us strive toward that eternal thing, let us fly up to that divine thing on the wings of love and with the oars of charity. Let us rise from here, that is, from worldly and earthly things. For the Lord said: rise, let us go from here, commanding that each one should rise from the earth, lift up his soul lying on the ground, raise it to the things above, rouse his eagle, that eagle of which it was said: your youth shall be renewed like the eagle's. This was said to the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"

[[commentary]]
quote='''
Beautifully, then, does David, who had learned by experience that even a man's very glances are perilous, call him blessed whose whole hope is in the name of God. For thus he does not look upon vanities and madnesses, if he always strains toward Christ, always beholds Christ with the inner eyes. Hence, turning again to him, he says: Turn away my eyes, that they may not see vanity. The circus is vanity, because it profits nothing; vain is the swiftness of horses, because it is a liar as to safety; the theatre is vanity, every game is vanity. All things, he says, are vanity, said Ecclesiastes, all that are in this world. Accordingly, let him who wishes to be saved ascend above the world, seek the Word with God, flee this world, leave the earth; for he cannot perceive that which is and always is unless he has first fled from here. Hence the Lord too, wishing to draw near to God the Father, said to the apostles: Arise, let us go from here.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 1"
