[[commentary]]
quote='''
Why, then, do we so greatly desire this life, in which the longer one has been, the heavier the load he is burdened with? The Lord himself says: sufficient for the day is its own evil, and Jacob said: the days of the years of my life which I have are a hundred and thirty, few and evil, not because the days are evil, but because with the coming on of days the increases of evil are heaped up for us;

for no day passes without sin of ours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
