[[commentary]]
quote='''
[Repay] thy neighbor, he says, on occasion, restrict thy word and deal faithfully with him and thou shalt at all times find what is necessary for thee. Innocence does not like to defend itself with many words. Susanna did not need verbal defense. She restricted her word to the Lord and immediately she earned a right to obtain testimony of her own chastity. The elders, who were attempting to obscure truth under the false guise of words, said much, but not the daughter of Juda. She kept silent before men, but spake to God, for a woman's defense of herself before the people was shameful, and while her modesty was being defended, her shamelessness was shown. She restricted her word, saying to the Lord: Thou knowest that they have borne false witness against me. And the Lord moved as the avenger of her chastity the spirit of the boy Daniel.

Therefore restrict your word, that your action of giving back, not your tongue, may reply to the creditor; or mystically, restrict your word, that is, finish it, for the Lord shall finish His word and cut it short upon the earth; that is, from many reckonings let the shortened sum be agreeable to you. Take out what has been paid for diverse expenses that you may have safe what remains; just as the Lord, in the case of the many expenditures on the Jews, from that lengthy reckoning of sins, made an end finally and cut short, so the remnants might be saved through the election of grace and be preserved for seed, and through these he might revive the lifeless hope of the synagogue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 20"
