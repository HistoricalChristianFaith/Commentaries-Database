[[commentary]]
quote='''
The weakness of man's condition is exposed when our bodies arc compared to the skins of dead animals.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And no one puts new wine into old wineskins. The frailty of the human condition is laid open, when our bodies are compared to the cast-off skins of dead animals. And would that we could fulfil the use of good wineskins, so as to preserve the sacrament we have received! Diligence relieves the injury, if new wines are entrusted to renewed skins. And therefore we ought always to keep these skins full; for when empty moth and rust soon consume them, while grace preserves them filled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
