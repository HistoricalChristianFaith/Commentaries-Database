[[commentary]]
quote='''
Whence you have in the book of Kingdoms that saying of King Ahab to Elijah, when the prophet rebuked him vehemently and announced death to him: Have you found, he says, me? And Elijah answered: I have found you, because you have done evil in the sight of the Lord. You see, then, that kings must not rashly be wronged, either by the prophets of God or by priests, if there are no graver sins for which they ought to be rebuked. But where the sins are graver, there it seems the priest should not spare, so that they may be corrected by just rebukes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
He flees from the whole world, who, looking to his conscience, fears to be caught. And therefore Achab says to Elias, according to history—but according to allegory, the rich man to the poor man—: Thou hast found me, mine enemy. How miserable the conscience that was grieved at its being discovered!

And Elias said to him: I have found thee because thou hast done evil in the sight of God. He was a king, even Achab, king of Samaria; Elias was poor and in want of bread, and would have lacked the substance of life had not the ravens ministered food unto him. So was the conscience of the sinner cast down that he was not sustained even by the haughtiness of royal power. Therefore, like a common lowborn fellow, he cries: "Thou hast found me, mine enemy, and thou hast detected in me what I thought was hidden. No secrets of my mind escape thee; thou hast found me; to thee my wounds lie open; captivity is at hand." The sinner is found when his iniquity is disclosed, but the just man says: Thou hast tried me by fire: and iniquity hath not been found in me. When Adam hid, he was found, but the burial place of Moses has never been discovered. Achab was found, but not so Elias, and the Wisdom of God has said: The wicked shall seek me and shall not find me. Wherefore in the Gospel also, Jesus was sought and was not found. Hence guilt betrays its author. Wherefore, too, the Thesbite says: I have found thee because thou hast done evil in the sight of the Lord; for the Lord delivers up the guilty, but the innocent He does not betray into the power of their enemies. Hence, Saul sought holy David and could not find him, but holy David found king Saul whom he sought not, because the Lord delivered him into his power. Wealth, therefore, is captive: poverty is free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 12"
