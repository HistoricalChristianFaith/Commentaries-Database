[[commentary]]
quote='''
Nor would you think in the compacting together of our limbs any division of power to be made, for there can be no division in an undivided thing. And therefore the appellation of finger must be referred to the form of unity, not to the distinction of power.

At the same time He shows that it is a regal power which the Holy Spirit possesses, in whom is the kingdom of God, and that we in whom the Spirit dwells are a royal house.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
How great is the madness of sacrilegious fury here, that, when the Son of God took flesh to crush unclean spirits and to carry off the spoils of the prince of the world, and gave to men too the power of destroying spiritual wickedness, dividing his spoils, which is the mark of one who triumphs, some should take to themselves the aid and protection of diabolical power, when demons are driven out by the finger of God, or certainly, according to Matthew, by the Spirit of God! From this it is understood that the kingdom of the divinity is as it were a kind of undivided body, since Christ is the right hand of God, while the Spirit, under the likeness of a finger, seems to express the joining of what is, as it were, one body according to the divinity. Does not the kingdom seem to be undivided, since it is as it were an undivided body? For there dwells, as you have read, bodily in Christ the fullness of the divinity. And this you certainly cannot deny of the Father, nor ought you to deny it of the Spirit. Nor let it seem to you that, by comparison with our members, some apportioning of power is to be made; for there can be no division of an undivided thing, and therefore the naming of the finger is to be referred to the form of unity, not to a distinction of power, since the right hand of God says: I and the Father are one; but although the divinity is undivided, the person is distinct.

Yet when the Spirit is called a finger, a working power is signified, because the Holy Spirit, just like the Father and the Son, is the worker of the divine works. For David says: for I shall see the heavens, the works of your fingers; and in Psalm 32 (33): and by the Spirit of his mouth all their power. And Paul says: but all these things one and the same Spirit works, dividing to each as he wills. And when he says this:

but if I cast out demons by the Spirit of God, surely the kingdom of God has come upon you, he shows at the same time that the power of the Holy Spirit, in whom is the kingdom of God, is a kind of imperial power, and that we too, in whom the Spirit dwells, are a royal house. Hence he also said later on: the kingdom of God is within you. And therefore we ought to regard the Holy Spirit as sharing in the divinity and dominion and imperial majesty, because the Lord is the Spirit, and where the Spirit of the Lord is, there is liberty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
There is also this, that it is written: But if I cast out demons by the finger of God. What the finger is, Scripture itself interprets, which says in another book of the Gospel: But if I cast out demons by the Spirit of God. The finger of God, then, is the Spirit of God; for God is spirit and has nothing bodily in his substance, but is wholly spirit. He, then, casts out the demon by the Spirit of God who casts it out by the finger of God. Hence holy David too says: For I will see your heavens, the works of your fingers, that is: the heavens are the works of your Spirit, as it is also written: By the word of the Lord the heavens were established, and all their power by the spirit of his mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For when heaven and earth were being made, the Spirit was borne above, of whom he says elsewhere through the prophet David: Send forth your spirit, and they shall be created. Of whom he also said elsewhere: For I shall see the heavens, the works of your fingers. For God did not make heaven and earth with bodily fingers, but by the sevenfold grace of the Spirit, namely by that finger of which you have it in the Gospel: But if I cast out demons by the finger of God. For this finger he elsewhere called the Spirit, as you have it: But if I cast out demons by the Spirit of God. If, then, the Spirit is the finger of God, since the Son is the arm of God, surely the Spirit, working together with the Father and the Son through the unity of operation, made heaven and earth. For the Son called him the finger for this reason, that he might express the unity of the divinity as of one body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
