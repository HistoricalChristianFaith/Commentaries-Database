[[commentary]]
quote='''
But the good father wished to save this one too, saying: you have always been with me, either as the Jew in the Law or as the righteous man in communion; but also, if you cease to envy: and all that is mine is yours,

either as the Jew possessing the sacraments of the old testament, or, as one baptized, those of the new as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
