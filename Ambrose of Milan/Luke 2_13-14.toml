[[commentary]]
quote='''
And there was with the angel a multitude of the heavenly host, praising God and saying: Glory to God in the highest, and on earth peace to men of good will.

Rightly is it called an army of angels, for they followed the leader of the host. To whom, then, should the angels speak praise but to their Lord, according to what is written: Praise the Lord from the heavens, praise him in the heights. Praise him, all his angels? So the prophecy was fulfilled. The Lord is praised from the heavens and seen on earth, of whom Saint Mark says that he was with the beasts and the angels ministered to him, so that in the one you may recognize the emblem of mercy, in the other the token of divine power. It is for your sake that he suffers the beasts, it is his own that he is proclaimed by angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
