[[commentary]]
quote='''
Therefore, since you have the means for conferring benefits, do not put it off, saying: Tomorrow I will give, lest you lose the opportunity of bestowing them. Delay in the case of another's safety is dangerous; it can happen that, while you are delaying, he may die. Rather hasten on before death, lest perchance avarice hinder you tomorrow also and your promises be violated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 8"

[[commentary]]
quote='''
Therefore it is of profit to you whatever you bestow upon the needy; and whatever you diminish increases to your interest. It is yourself you feed with the food that you give a poor man, since he who has mercy on the poor is himself fed, and fruit is already in these things. Mercy is sown on earth, germinates in heaven, is transplanted in the poor man, and grows with God. Say not, God says, tomorrow I will give. How does He allow you to say, "I will not give," Who does not allow you to say, tomorrow I will give? Not from your own do you bestow upon the poor man, but you make return from what is his. For what has been given as common for the use of all, you appropriate to yourself alone. The earth belongs to all, not to the rich; but fewer are they who do not use what belongs to all than those who do. Therefore you are paying a debt, you are not bestowing what is not due. Hence Scripture says to you: Bow down thy heart to the poor, and pay what thou owest, and answer him peaceable words with mildness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 12"
