[[commentary]]
quote='''
You grieve, then, Lord, not for your own wounds but for mine, not for your own death but for our weakness: and we reckoned you to be in sorrows, when you grieved not for yourself but for me; for you were made weak, but because of our sins, not because that weakness was yours, taken from the Father, but because it was taken on for me, since it profited me that the instruction of our peace should be in you and that by your bruise you should heal our wounds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
