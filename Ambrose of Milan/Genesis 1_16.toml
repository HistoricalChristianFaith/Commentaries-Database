[[commentary]]
quote='''
The Prophet has beautifully expounded the meaning of those words of his: ‘God made the sun to rule the day and the moon to rule the night.’ For in the same Psalm 103 mentioned above he wrote: ‘You made the moon to mark the season; the sun knows the hour of its setting.’ When the day begins to complete its hours, the sun recognizes that its setting is due. The sun is, therefore, in the power of the day and the moon is in the power of the night, which must accommodate itself to the changes of time; now it is filled with light, and again is devoid of it.

Most authors seem, indeed, to interpret this passage mystically of Christ and the Church, maintaining that Christ had knowledge of His passion in the body when He said: ‘Father, the hour has come! Glorify thy Son,’ so that by this His setting He might grant eternal life to all men who were threatened with eternal death, and that the Church may have her seasons, namely, of persecution and of peace. The Church, like the moon, seems to lose light, but she does not. She can be cast in shadow, but she cannot lose her light. For example, the Church is weakened by the desertion of some in time of persecution, but is replenished by the witness of her martyrs. Wherefore, glorified by the victories of blood shed for Christ, she may pour forth all the more abundantly over the entire world the light of her devotedness and her faith.

In fact, the moon undergoes a diminution of its light, not, however, of its mass, at the time when it seems to give up its light in the course of the month, so that it may borrow from the sun. This phenomenon can be easily observed when the atmosphere is pure and transparent and no cloud passes before the moon, rendering it obscure. The orb of the moon remains intact, although the whole of it does not shine as does a part of it. Its size is the same as it usually appears when it is filled with light. A certain shadow makes it appear that the moon is bereft of light. Hence, it is only the horns that shine. The moon’s form is circular: this fact reveals itself, even if its light is partly diminished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
God made, therefore, these two great luminaries. We may assume that by their own right they are great and not merely by comparison with other objects such as the broad heavens and the mighty sea. We must admit the mightiness of that sun which fills with its heat the entire earth as the moon, too, fills not only the earth with its light, but also this atmosphere of ours, the sea, and the firmament. In whatever part of the heavens these lights may be, they illuminate everything and are observed equally by all. So much is this true that people of every race believe that these luminaries delight in lingering in their respective native countries. They believe that they are present there only, furnishing light to them alone, whereas these lights shine on all without distinction. Everyone is convinced, moreover, that he is nearer these luminaries than any other individual.

As a proof of its great size one may note that the orb of the moon seems to all men to be of the same dimensions. Although at times its light may increase or diminish, its appearance on any one night is the same for me as it is for all men. If it were to appear smaller to distant people and if to people living nearer it would seem to shine more brilliantly, we would then have clear indications of the narrow compass of its range and its extent. The reason is that all objects are considered by us to be smaller when we are some distance away from them, while other objects are regarded as larger if seen closer at hand. The size of an object increases in proportion as the beholder comes nearer. The sun’s rays are neither nearer to any one individual nor more remote. In like manner, the sphere of the moon has for all men the same size. The sun when it rises appears at the same instant alike to the people of India and of Britain. When it sets, the sun does not appear to be smaller to the inhabitants of the east than it does to those of the west. When the sun rises it does not seem to the people of the west to be smaller than it does to the people of the east. As Scripture says: ‘As far as the east is from the west.’ These points are distant one from the other but that is not true in regard to the sun. It does not lie nearer any other object nor more remote from it.

Do not be disturbed by the fact that the sun on rising seems to be about a cubit in extent. Rather, consider that between the sun and the earth there lies a space which our vision, because of its weakness, cannot penetrate without a loss of effectiveness. Our vision is clouded. Are we to conclude that the sun or moon is clouded, also? Our vision is limited. Does that make more limited the things that we see? The apparent size of an object is diminished, not the real. We ought not to ascribe to the luminaries a weakness which is due merely to our senses.

Our sight deceives us. Therefore, do not put trust in its testimony. The heavenly bodies present the appearance of smallness, but their form is actually not so. If from the top of a mountain you wish to view a plain before your eyes with cattle feeding therein, will they not take on the appearance of ants? If you should look far out to sea from some point on shore, will not the largest ships with their sails flashing amid the blue of the sea appear to you in the distance like doves in flight? More than that, even the islands with their extensive areas which deck the sea seem circumscribed in a narrow space, taking on a smooth appearance instead of a rough one, a look of density instead of its contrary! Take account, therefore, of the weakness of your eyesight and like a just judge rely on yourself, putting trust as the same time in those things which we affirm to be true.

Do you want to estimate the huge size of the sun with your bodily eyes as well as with the eyes of your mind? Consider the extent in which the spheres of the stars seem to cover and illuminate with lights innumerable the firmament of the heavens. Yet, for all that, they do not succeed in dispersing the clouds of the sky and the darkness of nighttime. As soon as the sunrise has sent forth its standards, all the glowing stars vanish beneath the flashing rays of one luminary, the surroundings are unveiled, and the sky is flooded with a purple flush of light. The dawn at its inception is still breathing. In a flash the splendor of the sun’s fiery rays emerge and the breeze’s sweet breath is a forerunner of the rising sun. Tell me, if you please, how could the sun illuminate the great orb of the earth unless it, too, was mighty?

What shall I say of the Creator’s great moderation and control? He conferred such measure on the sun’s operation that its fiery flame to all appearances has not by its pervading heat burned up the veins of the earth and the entire structure of matter? Again, in such an extensive world the sun has not by becoming cool ceased from the act of infusing the ‘seed of heat’ into the earth. Rather, thrusting aside infecundity and want, it has effectively bestowed on the earth the blessing of warmth with its accompanying fertility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
What we have stated in regard to her consort and brother applies in similar fashion to the moon, since the latter assumes the same offices as her brother, namely that of illuminating the darkness, cherishing the seeds, and increasing the produce of the soil. She has functions, also, which are different from her brother’s. The moisture which throughout the day the heat has absorbed from the earth is replaced in the short space of night in the form of dew, of which the moon is said to be a generous dispenser. Hence, when the night is clear and the moon shines the whole night long, a larger amount of dew is then said to fall. Many reclining in the open air have experienced the phenomenon of collecting more dew on their heads, the longer they rested in the moonlight. Wherefore, in the Canticles, Christ speaks to the Church: ‘For my head is full of dew and my locks of the drops of the night.’

Then, again, the moon goes through a process of waxing and waning. It becomes smaller when as a new moon it rises, at which point it gradually approaches a fuller form. In this we can see a great mystery. The elements are affected by the waning of the moon. After a period of exhaustion, strength is regained at the time of the moon’s waxing. We may note this process in two instances: in the brains of living things and in the amount of water in shellfish. In fact, oysters and many other kinds of shellfish are said to be more developed at the time when the moon is becoming fuller. The same phenomenon is related by those who have made special investigation into the internal structure of trees. We see, therefore, that the waxing and waning of the moon is not the result of weakness, but of plan and purpose. If it were not that the Creator had thought fit to bestow unusual excellence and beauty on such significant changes, these changes would not have been allotted to matter.

Some learned men, including some who are Christians, have claimed that the air usually changes at the rising of the moon. Yet, if these lunar changes should result in some unusual upheaval, then clouds would conceal the sky and rain would fall at every rising of the moon. So, when there was talk the previous day of a much desired rainfall, some person remarked, ‘See, the new moon will bring it.’ Although we were all eager for rain, I had no desire to believe that such assertions are true. Hence, I was delighted when no rain fell, until it was granted as a consequence of the Church’s prayers. Wherefore, it was made manifest that one should not expect rain to follow the new moon, but that is should be granted by a provident and beneficent Creator.

In fact, although channels of water during other phases of the moon rise and afterwards sink to their former level or even rush along violently without any external force, these same bodies of water remain calm at the time of the new moon before its light is observable. When in the course of time the moon comes into view, then the waters return to their accustomed ebb and flow. Again, during those days when the new moon is not in evidence the ebb tide, which is reputed to exist in the ocean, is said to follow its usual course. On the occasion of the moon’s rise, according to report, clear indications of change make their appearance. To be more precise, the western sea, towards which the ebb tide directs itself, rises and falls with greater force, as if it were driven backward and forward by the same lunar exhalations, until it ultimately falls back into its normal and accustomed channel.

Hence, if you wonder at the fact that the moon can suffer a loss of light while it has in itself the power to produce change, consider that we are here in the presence of a great mystery. From this let men deduce the lesson that nothing can exist in the universe, be it human or any other created thing, which shall not at some time pass away. Even the moon, to which the Lord has granted -the important office of illuminating the whole world, goes through the process of waxing and waning. All things, which spring from nothing, reach their perfection and again diminish in perfection, being subject to decline. Hence we are told: ‘Heaven and earth shall pass away.’ Why, then, do we not moderate our emotions and face adversities with courage? For He who has created all things from nothing has the power to bear you aloft to the summit of perfection. In a similar manner, we should control our feelings of joy in prosperity and not take pride in our positions of wealth and power. Likewise, we should not boast of our physical strength or beauty which is liable both to corruption and to constant change. Rather, we should strive for that beauty of soul which endures into future time.

If you are afflicted with sadness at the sight of the waning of the moon ‘which repairs its losses’ and renews itself, all the more ought you to be saddened if your soul, which has been filled with the fruit of virtue, should frequently afterward change its intent and purpose by an attitude of inconstancy and heedlessness. This is the height of stupidity and ignorance, for, as Scripture says: ‘A fool is changed as the moon.’ Hence, a wise man does not change with the moon: ‘He shall continue with the sun.’

Wherefore the moon does not partake of folly, because the moon does not change like the fool, but the fool like the moon. The seed of the just remains ‘as the moon, perfect for ever and a faithful witness in heaven.’ To perform one’s function is one thing; to have no fixed beliefs and to be carried away by unstable whims and emotions presents a situation that is quite different. The moon toils for you and by reason of the will of God is made subject: ‘For creation is made subject to vanity, not by its own will but by reason of him who made it subject in hope.’ It is you who undergoes changes of your own volition, not the moon. The moon ‘groans and travails in pain’ in its changes. You, without understanding, often find joy in this. The moon frequently awaits your release from sin, that it may be released from the servitude in which all creation shares. But you place obstacles to your release from sin and to the moon’s freedom. The fact that you yourself still await that conversion which fails to come, whereas the moon suffers change, is, then, the result, not of the moon’s folly, but of your’s.

Your opinion of the moon should be based, not on the observation of your eyes, but on the insight of your mind. The moon diminishes in size so as to make an addition to the sum of physical phenomenon. This, therefore, is a great mystery. He who has allotted His gifts to all things has allotted this to the moon. He has emptied it so as to replenish it. He has even ‘emptied Himself’ that He might replenish all, for He emptied Himself that He might come down for us. He came down for us that He might ascend for all. It is written, in fact: ‘He who ascended above the heavens that he might fill all things.’ Hence, one of the Apostles says: ‘For of his fullness we have all received.’ The moon, therefore, has made known the mysteries of Christ. It is no slight thing in which He has placed His sign. No slight thing is that which contains the type of His beloved Church, as the Prophet points out when he says: ‘In his days shall justice spring up and abundance of peace till the moon be taken away.’ And in the Canticles the Lord says of His spouse: ‘Who is she that looks forth as the morning rising, fair as the moon, excellent as the sun?’

Deservedly is the moon compared to the Church, who has shone over the entire world and says as she illuminates the darkness of this world: ‘The night is far advanced, the day is at hand.’ Fittingly does she say: ‘She that looks forth,’ as if looking from a higher position on one’s own, in accordance with the statement: ‘The Lord hath looked down from heaven upon the children of men.’ Looking down, then, the Church has, like the moon, her frequent risings and settings. She has grown, however, by her settings and has by their means merited expansion at a time when she is undergoing diminution through persecution and while she is being crowned by the martyrdom of her faithful. This is the real moon which from the perpetual light of her own brother has acquired the light of immortality and grace. Not from her own light does the Church gleam, but from the light of Christ. From the Sun of Justice has her brilliance been obtained, so that it is said: ‘It is now no longer I that live, but Christ lives in me.’

Happy, in truth, is that which merited such an honor! Wherefore I would not call you happy by reason of your renewals, but by the fact that you are a type of the Church. In the former case you are but a servant; in the latter, our beloved!

How ridiculous is the current belief that you can be brought to earth by magical charms! These are old wives’ tales, the gossip of the common crowd. Who would believe that a work of God assigned to such important service could be affected by the superstitions of the Chaldeans? He who was brought down not by magical charms but by his own will, who ‘disguises himself as an angel of light,’ may very well have fallen from heaven. To be sure, there are those who believe that the Church, too, can be moved from her place and position. There are many men who provoke the Church, but the charms of the magician can not harm her. Magical chants are of no avail there where the canticles of Christ are chanted daily. Her own chanter is Jesus, our Lord, through whom magical charms and serpents’ poison were made void. She is like a serpent which placed on high devoured the snakes, and, although a deadly Egyptian chant be murmured, its force is lost at the utterance of the name of Christ. So, too, Paul blinded Elymas, thus depriving him of his eyesight and of his futile magic powers at one and the same time. In like manner, Peter cast down to the ground Simon, who by the evil power of his charms sought to soar aloft by magic to the heights of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
