[[commentary]]
quote='''
David, it is true, had killed a man who was by no means guilty, but he had killed him not driven by any zeal for cruelty, but to overshadow his shame, to cover the disgrace of his desire. I do not dare to say that he was overwhelmed by the force of crime — for he was not overwhelmed who knew how to raise himself from that ruin of sin — but I do say that he was bent by the force of temptation. For he had said before: Prove me, O Lord, and try me; burn my reins and my heart, and elsewhere: But I said in my abundance: I shall not be moved for ever, and: You have examined me by fire, and iniquity has not been found in me. The Lord willed that he should be subject to temptation, lest he arrogate to himself anything beyond what is man's; for power is made perfect in weakness. Nor did he do it out of a bloodthirsty disposition: nothing can less be ascribed to the holy prophet, who even when departing this life charged his son Solomon with his last words to take away from him the innocent blood which Joab, the commander of his army, had shed, when Abner, though commander of the enemy's force, was attacked by treachery and fell while he was negotiating to enter into alliance. David wept for him and, walking behind his bier with the insignia of his power laid aside, saw to the due rites of his funeral. By this deed he taught that faith promised must be kept even with adversaries, and that valour must be honoured even in an enemy. Did he not, by the legacy of so gentle a devotion of his, wipe away the blemish of this error too?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
