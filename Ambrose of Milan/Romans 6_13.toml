[[commentary]]
quote='''
Why do we accuse the flesh as weak? Our members are weapons of injustice and weapons of justice. You saw a poor man suffering injury, you protected him: your members are weapons of devotion, with which you defended the poor man from injury. You saw a needy man, you presented him with gifts: with your right hand you drove death from your own breast. You saw one who was being led to death, you rescued him, because it is written: Rescue him who is led to death: your members are weapons of justice, if you did not allow a man to perish unjustly. You saw a woman, you chastised your body, you mortified your lusts, you turned away from the wanton eyes of a harlot and forsook them: your members are weapons of chastity. But on the contrary, if your eye has seen a woman so as to desire her, you have opened a wound, you have driven a dart into your body: your members are weapons of sin. You saw the possession of orphans and drove them from their fathers' homes, you moved the boundaries which your fathers set: your members are weapons of iniquity. The disposition, then, not the flesh, is the author of guilt, while the flesh is the handmaid of the will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 3"
