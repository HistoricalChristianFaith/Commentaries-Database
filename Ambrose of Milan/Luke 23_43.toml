[[commentary]]
quote='''
A most remarkable example is here given of seeking after conversion, seeing that pardon is so speedily granted to the thief. The Lord quickly pardons, because the thief is quickly converted. And grace is more abundant than prayer; for the Lord ever gives more than He is asked for. The thief asked that He should remember him, but our Lord answers, Verily I say unto thee, This day shalt thou be with me in Paradise. To be with Christ is life, and where Christ is, there is His kingdom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
For this reason he who was incorruptible took on this flesh, that he might make it incorruptible, and he who was immortal, that he might make it immortal. If anyone, then, follows him, he shall put on immortality; if anyone does his will, he shall not die for ever, but Christ will say to him: Today you shall be with me in paradise. What is "today"? That is: you have passed over from the night, you shall be with me in the light; do not fear the darkness, you whom eternal light has taken up. Beautifully, too, he added: you shall be with me in paradise, that is: do not doubt about the flesh; you have seen me too in the flesh. Do not fear lest you also fall from paradise as Adam fell, but hear that you shall be with me, where, with me present, you cannot fall. The flesh had fallen in paradise before it was taken up by Christ. You shall be taken up there where he also is who took it up, who did not lie when he said: I will that where I am they also may be with me. The shepherd will not withdraw from his flocks, although in paradise you, to whom it was said: I saw Satan like lightning falling from heaven, can no longer fear the wolf. Therefore, before the consummation, the adversary is cast down into the fire and is bound with everlasting chains as well, so that you may now fear no snares.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
