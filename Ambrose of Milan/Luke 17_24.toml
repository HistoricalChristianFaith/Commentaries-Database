[[commentary]]
quote='''
For what is there that he does not know who is like the flashing lightning, in that he, the light, the Son of God, illuminates the inner depths of the heavenly mystery? In that, he says, hour. So he knows the hour too, but he knows it for himself; for me he does not know it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
