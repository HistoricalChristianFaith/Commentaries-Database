[[commentary]]
quote='''
These men, then, set in error, said: How did God know? And is there all knowledge in the Most High? For they think that there is no knowledge in God, because sinners abound in worldly prosperity. And he still brings them in speaking: Behold, these are sinners, and abounding for ever they have obtained riches. You have this expressed more plainly in the Gospel, where Simon the Pharisee, seeing that that sinful woman had come into his house and poured out ointment upon the feet of Christ, said within himself: This man, if he were a prophet, would surely know who and what sort of woman this is who touches him, that she is a sinner. But the patience of God does not prejudge the truth, and his foreknowledge and providence are proved all the more by this very fact, that one who is set in sin abounds in the success of worldly prosperity. The stronger man, seeing this, laughs; the unwary man is led astray and shaken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 5"
