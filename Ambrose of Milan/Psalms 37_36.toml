[[commentary]]
quote='''
What is: and behold, he was not? In the beginning, surely, was the Word, and he who sees the Word, who is a partaker of the Word, he too surely is, because the Word of God always is, and the speech which is from him is not "is" and "not", but "is", and it abides in him who follows God. But he who does not know the Word is not, because he does not cleave to him who said: I am who I am. But he who cleaves to him is one spirit; and where the Spirit is, there also is life. Therefore Scripture says to you of God: Who gives life to the dead and calls the things that are not as the things that are, that is: he calls the Gentiles, who were not, as his people, who was; for our fathers were, who were the chosen of God. And elsewhere, where it is said: The Lord has known who are his, he does not know those who are not; and Esther says: Do not give the sceptre of your kingdom to those who are not. Rightly, then, does the righteous man say: And I passed by, and behold, he was not, that is: I saw him exalted above measure in the world, before I considered that the world is nothing; but when I passed in mind above the world, I saw that he who before was exalted above measure in this world was no longer.

And you, if you are righteous, pass from present things to those that are to come, and present things will pass away for you. Heaven and earth shall pass away, but my words shall not pass away. For the righteous man, then, all things pass away. The ungodly man passes away, he is like vanity, and his days pass away like a shadow. And not only do present things pass away for the righteous man, but also, when he has turned his attention to the things that are to come, these things already pass away. See how present things passed away for the righteous man. Certainly in the times of the prophet David there was the synagogue; the Church from the Gentiles was not; and yet he speaks of things to come as if present: Bless our God, O nations; then above he says: God has gone up with jubilation. He passed beyond the times of unbelief that were to come, not by age but by mind, and with the devout devotion of faith he celebrated the resurrection of the Lord, which was to come many ages later, saying: Sing psalms to our God, sing psalms; sing psalms to our King, sing psalms. As if he were present at the very sacraments of the nuptial union of Christ and the Church, so he dances and rejoices. He expressed also the cause of the celebration, saying: The Lord has reigned over all the earth. So if we pass by, those things too which are to come seem to us to have passed by, just as, if in sailing you pass by the land, you see it too passing by and as it were departing from you. Often sailors, especially in a storm, flee the land, and yet, while they flee it as they sail, the land itself rather seems to flee from the sailors. You too, if you flee this world, it also will flee you; if you pass by this land, it too passes you by. You too sail on this sea and are tossed in this world: flee the land; it has rocks, it has stones, as it is written: Cast the stones out of the way. If you hasten through this airy deep to the harbour of divine pleasure, you will see that all these things have passed by for you. For what difference is there whether they have passed by, or you judge that they have passed by for you?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
