[[commentary]]
quote='''
And Lot went out with him. This is what is celebrated among the sayings of the seven wise men, ἕπου θεῷ, that is, 'follow God'. Abraham anticipated the sayings of the wise men by his deed, and, following the Lord, he went out from his land. But since earlier his land had been another, that is, the region of the Chaldaeans, from which Terah the father of Abraham went out and moved to Haran, and since he to whom it had been said: go out from your kindred brought out with him his nephew, let us consider whether perhaps this is going out from one's land: to go forth from this earth, that is, from a certain sojourn of our body, from which Paul went out, who said: but our way of life is in heaven; and from the allurements and bodily delights, which he called as it were the kindred of our soul, since the soul must suffer with the body as long as it clings to it, bound by its bond. Therefore we ought to go out from earthly conduct and worldly enjoyments and from the habits and acts of our former life, so that we change not only places but also ourselves. If we desire to cling to Christ, let us forsake corruptible things. Now the corruptible things in us are the flesh, delight, the voice, subject to bodily passions; and by the voice we understand the passions. Hence, since our soul is διμερής, that is, in two parts, having both the rational and the irrational, which is divided through the flesh and the allurements of bodily delight and the other passions of the body, the man who is just ought to separate and set apart the rational part of his soul from the irrational. For this is to go out from Haran, as it were to go forth from certain caverns and burrows and hiding places; for to hide belongs to a guilty conscience. And so let us also, following Abraham, go out from our hiding places. For if we are sons of Abraham, let us do the works of Abraham, so that our works may shine before God and before men. The just man tells his works to the King; the sinner hides himself, as Adam desired to hide himself. But he could not hide. So Abraham obeyed the command, and no delay is read to have come between.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"
