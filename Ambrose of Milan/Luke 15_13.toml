[[commentary]]
quote='''
But after he set out abroad, — rightly, then, did he squander his patrimony, he who withdrew from the Church — after, he says, leaving his father's house, he set out abroad into a far country.

For what is farther than to withdraw from oneself and to be separated not by regions but by morals, to be set apart by pursuits, not by lands, and, as though the tide of worldly luxury flowed between, to be divorced in one's deeds? For he who separates himself from Christ is an exile from his fatherland, a citizen of the world. But we are not strangers and sojourners, but we are fellow citizens of the saints and members of the household of God; for we who were far off have been made near in the blood of Christ. Let us not begrudge those who return from a far country, because we too were in a far country, as Isaiah teaches. Thus you have: those who sat in the region of the shadow of death, light has risen for them. The far country, then, is that of the shadow of death; but we, for whom Christ the Lord is spirit before our face, live in the shadow of Christ. And therefore the Church says: in his shadow I desired and sat down. So he, by living luxuriously, consumed all the adornments of nature. Hence you, who have received the image of God, who have his likeness, do not consume it by irrational foulness. You are God's work: do not say to wood: you are my father, lest you receive the likeness of wood, for it is written: let those who make them become like them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
