[[commentary]]
quote='''
You have an example of that in the Gospel. At the moment when Satan entered into the heart of Judas, Christ departed from him. At the very instant that Judas received one, he lost the other: And after the morsel Satan entered into him. Jesus therefore said to him, "What thou dost, do quickly." Why is this? Because, once Satan found entrance into Judas, at that moment there came about his departure from Christ. He is ejected, then, and banished, since the person who trafficked with the Devil could have no fellowship with Christ. There is no harmony between Christ and Belial. Wherefore, on receiving the command to leave, Judas immediately departed, as we read in the words of the Evangelist: When he had received the morsel, he went out quickly. Now it was night. It was not merely a question of departure, but it was one which was immediate and at night. The fact that one who deserted Christ should be connected with the darkness of night should excite no wonder.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"
