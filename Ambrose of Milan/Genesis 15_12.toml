[[commentary]]
quote='''
Then what follows shows with what spiritual and prophetic affection Abraham did this. For at sunset an ecstasy fell upon Abraham, and behold, a great dark fear lay upon him. Ecstasy is wont to come upon prophets, as you have it that the prophet said: I said in my ecstasy: every man is a liar. For the mind of the prophet goes beyond, as it were, certain bounds of human prudence when it is filled with God; and first it empties itself of the thoughts and disputes of this world, so as to offer itself pure and emptied to the spiritual grace that comes to it, and so that the Holy Spirit may come upon it, pouring himself in with great force, so that the mind of man is suddenly troubled. Thus the angel came to Mary — and he had come with care and with grace; and yet Mary was moved at his coming in. Hence the angel says to her: Fear not, Mary; for you have found grace with God. And behold, you shall conceive in your womb and bear a son. We know, then, that when the grace of God comes upon the prophetic mind it rushes in suddenly, and hence we read that the Holy Spirit lay upon the prophet and fell down upon him, because he undergoes ecstasy and is troubled and fears and is overspread with certain darknesses of ignorance and want of prudence, as we also read in the Acts of the Apostles that a light from heaven shone round about Saul, and he fell, and was troubled with horror of spirit, and heard a voice from heaven saying: Saul, Saul, why do you persecute me? For he who begins to hear divine things ceases to see worldly things. Hence you ought not to wonder at Abraham's fear and darkness, as though they had befallen him contrary to his virtue or merit, since you observe that such things, when they are joined to them, accord with the custom of the prophets, so that they may know things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
