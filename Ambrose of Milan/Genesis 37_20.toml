[[commentary]]
quote='''
And they added, in Genesis: And we shall see what his dreams will be. This was written of Joseph; it was fulfilled in Christ, when the Jews said at his passion: If he is the King of Israel, let him come down now from the cross, and we believe him. He trusts in God: let him deliver him now, if he wills him. Were the brothers themselves, then, so impious as to kill their brother? And whence the great merits of the patriarchs, that the Law should designate the tribes of the whole people by their names? How do the names of devotion and the marks of crime agree? So these too were labouring under the type of the people, not under a fault of their own mind. Hence all the envy, hence the plotting of fratricide: envy by figure, love by affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
