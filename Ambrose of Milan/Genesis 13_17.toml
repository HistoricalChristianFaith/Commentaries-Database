[[commentary]]
quote='''
Finally, as long as Lot, that is, the deviation of character, clung to Abraham, he had not received the allotment of these things. But when, set free from a certain ambiguity and winding of deviation, he began to pursue the straight paths of the virtues with the continuous steps of his soul, he is sent as possessor into all the land, and it is said to him: arise and walk through the land in length and breadth, for I will give it to you and to your seed for ever. Therefore he who has merited wisdom and has not been the son of the handmaid, not the slave of sin nor subject to the succession of the flesh, but the son of the free woman, that is, of that Sarah who does not serve but rules, of good stock, of good nature, will acquire by the title of perfect virtue the inheritance of the universe. So it is said to Abraham: arise. He does not mean a bodily rising but a spiritual one, that is: arise, you who sleep, arise from earthly things, arise from bodily things, leave earthly things behind, look upon heaven and rise up from the dead, that is, from vain opinions and the disputations of the Chaldaeans. Gaze upon the world, gaze also upon him who is able to give the whole world. Into your possession, he says, I will give you the world, which you formerly believed to be God.

Walk through the land in its length and breadth. Certainly he could not, within a moment, walk through this land, enclosed by the empires of the Persians, from the shores of India too as far as the Pillars of Hercules, as they say, or the farthest borders of Britain. And he could have seemed lacking in devotion, as it were, as one who had not obeyed the heavenly oracle, if he had received a command to go round this land; but since his devotion is proved, because he had moved his tent only as far as the oak of Mamre, we can certainly understand the land, that is, perfect virtue, which would yield good fruits and fruitful discoveries and the first-fruits of thoughts, the vintage of merits, and would fill the inner house with grain, wine and oil: the land of the resurrection, which he promised to our fathers flowing with milk and honey, the sweetness of life, the grace of gladness, the splendour of glory, of which the firstborn from the dead, the Son of God, the Lord Jesus, was made the first heir. And therefore he did not say 'to your seeds' but 'to your seed,' in order to make known him who would be the first to acquire this inheritance for the human race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 7"
