[[commentary]]
quote='''
Tobias says to you, Riotous living is the mother of starvation, whereby he teaches moderation. He says likewise: To every man that hath done any work for thee pay his hire on the same day and let not the wages of the hired servant stay with thee, and thy reward shall not be lessened. He says to you: Do not drink wine to intoxication. He says to you: Give of your bread to those who are hungry—you see what he wishes you to lend—and with thy garments cover the naked. Of all that thou hast in abundance do charity. Bless God at all times. In these things, therefore, is everlasting gain and perpetual usury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 24"
