[[commentary]]
quote='''
Bring me word he says so that I may come and adore him. Herod indeed lays a snare, but he does not deny God, whom he declares must be adored.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
