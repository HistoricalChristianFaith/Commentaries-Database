[[commentary]]
quote='''
Uninvited he invites Himself to his house; as it follows, Zacchæus, make haste, and come down, & c. for He knew how richly He would reward his hospitality. And though He had not yet heard the word of invitation, He had already seen the will.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And behold, a man named Zacchaeus. Zacchaeus in the sycamore, the blind man by the way. The one the Lord waits for, meaning to have mercy on him; the other he ennobles with the splendor of his lodging: the one he questions, meaning to heal him; at the house of the other he invites himself uninvited; for he knew that the reward of his host would be rich; and yet, though he had not yet heard the voice of one inviting him, he had heard the affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
