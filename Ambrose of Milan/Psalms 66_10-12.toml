
[[commentary]]
quote='''
You have tried us with fire, says David. All, then, will be tried by fire. And Ezekiel says: Behold, the Lord almighty comes. And who will endure the day of his entrance? Or who will endure when he appears to us? For he himself will enter as the fire of a smelting furnace and as the trough of those who wash. And he will sit smelting and purifying as gold and silver, and he will purify the sons of Levi and will pour them out as gold and as silver, and they will be offering sacrifice to the Lord in equity. By fire, then, the sons of Levi will be purified, by fire Ezekiel, by fire Daniel. But these, although they will be tried through fire, will yet say: We have passed through fire and water. Others will remain in the fire. For the former the fire will fall like dew, as for the Hebrew children, who were thrown into the blaze of the burning furnace; but the avenging fire will burn up the ministers of ungodliness. Woe to me, if my work is burned and I suffer the loss of this labour! Although the Lord will save his servants, we shall be saved through faith, yet so saved as through fire; though we shall not be burned up, yet we shall be burned. How, however, some remain in the fire while others pass through, let divine Scripture teach us in another place. Surely, the people of the Egyptians was drowned in the Red Sea, but the people of the Hebrews passed over; Moses passed through, Pharaoh was cast headlong, since his grievous sins sank him. In that way will the sacrilegious be cast headlong into the lake of burning fire, who have hurled proud insults against God. Let us, then, while placed here, follow the pillar of fire, which may enlighten us while we are placed in this body and show us the way, so that in the future the cloud of night may cool us, whereby we may be able to relieve the fierce burnings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
When the fifth was set before him, he ordered that, after he had first been beaten, fires should be brought to him and flames set beneath him. Gore flowed from his wounds, and the blood pouring from his gashed sores was putting out the very balls of flame; but amid the crackling of the fires he was heard saying: 'Thanks to you, Lord, that you have granted us to say: we have passed through fire, as elsewhere your same prophet says: you have tried us with fire, as silver is tried with fire. I shall stand before you like gold purged by burning, and if there was any guilt, the fire has burned it out'. And so he too, transfigured from corruption to incorruption, breathed out his life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
