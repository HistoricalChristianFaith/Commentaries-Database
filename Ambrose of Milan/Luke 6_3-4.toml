[[commentary]]
quote='''
Well too does the Lord show in this place also a type of the future in the Law, and he convicts the defenders of the Law of not knowing what belongs to the Law, adducing the example that David, when he was hungry, he and his companions, entered into the house of God and took the loaves of proposition and ate and gave to those who were with him. A great and truly prophetic example, by which, first, not the empty things of the Law but the solid things of usefulness are set forth for us to follow; next, because in David fleeing with his companions from the face of King Saul, Christ was here prefigured in the Law, who with the apostles was hiding from the prince of the world.

But how did that observer and defender of the Law both eat the loaves himself and give them to those who were with him, loaves which it was not lawful to eat except for the priests only, unless to show by that figure that the priestly food would pass to the use of the peoples, either because we all ought to imitate the priestly life or because all the sons of the Church are priests? For we are anointed into a holy priesthood, offering ourselves to God as spiritual victims.

So the teaching of Christ now overflows the Law, and he does not destroy the Law but fulfils it, because he did not destroy the sabbath either. For if the sabbath was made for man, and the advantage of man required that hungry man, who had long been disinherited of the fruits of the earth, should escape the fasts of the old famine, surely the Law is not destroyed but fulfilled. How then is that charged as a crime against the Lord which in the servant is not held to be a crime?

But what is clearer than this figure, which runs through the whole history? David entered the house of Abimelech the priest; but even with the danger of death set before him, the mind of the holy priest does not refuse the guest, does not turn away the exile. So great is the grace of hospitality, that we willingly transfer to ourselves the dangers of others.

But this is moral in the history and prophetic in the mystery: that not even when the destruction of future death was foreseen did the devout priests exclude that true David from the hospitality of their mind. And Christ is taught not only to be about to find hospitality in the house of each prophet, but also, by a figure, to be about to take the spoils and weapons of spiritual wickedness; for he who receives Christ in hospitality despoils that intelligible Goliath of his own weapons.

But what is clearer than that in the house of Abimelech David asked for five loaves and received one, the type showing that now not by the five books but by the body of Christ food would be prepared for the faithful, so that Christ would take up a body, lest any of the faithful should hunger? Nor is the figure of Doeg empty, who was keeper of the mules, because no one else but the keeper of an unfruitful herd would fulfil the type of Judas the traitor.

Now the fact that, because of the reception of David, Saul persecuted the whole house of Abimelech except Abiathar, at that time chief of the priests, shows us by prophecy that no one can harm the true chief of the priests, who alone is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
