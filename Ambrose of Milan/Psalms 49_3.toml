[[commentary]]
quote='''
And he went on: My mouth shall speak wisdom, and the meditation of my heart prudence. Rightly are all called, since the fount of wisdom abounds for all; nor is she compared to a treasure of money, who is declared more precious than all treasures. And therefore neither is the rich man turned away nor the poor man shut out, since wisdom discriminates not between means but between wills; he is the fitter who is foremost in affection and nearest in discipline. But if the meditation of the heart speaks prudence, how much more does perfect teaching! Next we are admonished not to utter hasty speech, but to weigh what is to be said by a certain exercise of meditation and on the balance of the inner mind, since it is written elsewhere: A deceitful balance is not good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
