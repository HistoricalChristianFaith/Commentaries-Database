[[commentary]]
quote='''
There follows: Man, when he was in honour, did not understand; he has been compared to the beasts which are without sense and has become like them. This their way is a stumbling-block to them, and afterwards they shall take pleasure in their mouth. Because man did not understand when he was in honour — and it is an honour that he was made in the image of God, was made capable of reason — he has been compared to the beasts which have no sense; but he who has understood is compared to the angels. And therefore the latter is magnificent in the brightness of good works, while the former is reckoned like a neighing horse for the filth of his living, which brings a stumbling-block on the way to those who live in baseness and obscenity; the folly, indeed, of a man defiles his ways. Men of this kind live according to their appetite, which creates a stumbling-block, and after the stumbling-block they will take pleasure in their mouth, but not in their heart; for they are not good, of whom it is said: With their mouth they blessed, and with their heart they cursed. By this an answer is also given to those who have it so written in their codices: And afterwards they will bless with their mouth. For let your word be near, both in your mouth and in your heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
