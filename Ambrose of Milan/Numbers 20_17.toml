[[commentary]]
quote='''
A good dwelling is that of wisdom, and whether at her left hand or at her right, a good dwelling; because it is the royal road. And so the wise messengers say: We will go by the royal road, we will not turn aside to the right or to the left, until we pass your borders (Num. 20:17). This the messengers sent by Moses said to the king of Edom, that is, the earthly one; because all earthly things, whether on the right or on the left, are evil. Folly is an evil dwelling, intemperance an evil dwelling; and therefore the Hebrew passes through these dwellings: he does not turn aside to them, but passes through, that he may come to the left hand of wisdom and the right, and abide in them, where are the riches of simplicity, where glory, where length of life. Length indeed of life is in her right hand, as Solomon says: But in her left hand riches and glory (Prov. 3:16): in the right hand is life, in the left rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
