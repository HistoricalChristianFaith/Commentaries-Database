[[commentary]]
quote='''
Indeed, in Exodus scarlet is placed for fire (Exod. 25:4). For the world does not consist of scarlet, but of four elements. But in scarlet a figure of fire is expressed, without whose heat penetrating heaven and air, seas and lands, all things would dissolve, as if their strength were exhausted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
