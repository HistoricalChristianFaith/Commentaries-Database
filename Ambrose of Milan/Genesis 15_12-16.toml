[[commentary]]
quote='''
I, however, think that what is rather signified is the middle time between the first coming of the Lord and the second, which will be the day of judgement. For this reason too a great dread came upon such a man at sunset, because, as the world was now setting, a future sacrifice was being declared, by which the world would be redeemed, and faith would be the victim, which would not be divided from the sons of Abraham — for those who divide it are not sons of Abraham. Faith is compared to the kingdom of heaven; for like is the kingdom of heaven to a grain of mustard seed, and the kingdom of heaven is like a merchant, who bought a field and found in it a precious pearl. The kingdom of heaven is undivided, because the kingdom of the Trinity is one. It is therefore perpetual and eternal, because it is undivided; for every kingdom divided will easily be destroyed — chastity dedicated to the Trinity would also be a victim, after that sacrifice: of the heifer, for labours, because it is a priestly victim; of the she-goat, because it is a victim for sins; of the ram, because it is for the whole world and for the very beings of the air or of heaven, not only for men nor only for lambs, but also for kids, which it strips of the stench of a sinful generation; the oracle testifies that the sons of Abraham would still be in the land of affliction, so that in this contest of many and grievous struggles they might prove themselves, and so go out with much furniture of gold and silver vessels, with rich spoils, and that their souls might return and go out possessing precious bodies of various virtues, filled above all with the treasure of purity from the passions, and about to take, at the judgement of Christ, vengeance on the devil and his ministers and the others who wished to harm them. Then there will be a great dread even for the just; for no one is without sin. All will have something to fear, because sins will have been filled up, so that when sin has superabounded, grace may superabound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
