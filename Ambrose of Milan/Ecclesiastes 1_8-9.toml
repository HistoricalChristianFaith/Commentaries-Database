[[commentary]]
quote='''
Therefore turn your attention to him of whom the prophet says: who has not received his soul in vain. He has received his soul in vain (to speak now of the troubles of this life) who builds up worldly things and constructs bodily things. Every day we rise to eat and drink, and no one is filled so as not to hunger and thirst a moment later. Every day we seek gain, and no limit is set to greed. The eye he says shall not be satisfied with seeing, nor the ear with hearing. He who loves silver shall not be satisfied with silver. There is no end of labour and there is no fruit of abundance. Every day we long to know new things, and what is knowledge itself but an addition of daily pain? All things that are have already been, and there is nothing new under the sun, but all is vanity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 7"
