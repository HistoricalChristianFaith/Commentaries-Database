[[commentary]]
quote='''
(De Officiis i. 16.) In the eye of Heaven blessedness begins there where misery begins in human estimation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But now let us seek the mystery. There were two men, he says, in one city, one rich and the other poor. Who is this rich man or poor man, unless perhaps the one is the people of the Jews, the other the Christian people? That one is rich in the Law, rich in the words of God entrusted to him, rich in prophecies, rich in oracles; but this one is poor. But do not flee from this poverty, which the kingdom of heaven follows; for it is written: Blessed are the poor in spirit, for theirs is the kingdom of heaven. A good poverty, which does not lose what it has had! A good poverty, which, if it has no treasures of money, yet has treasures of knowledge and wisdom!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 11"
