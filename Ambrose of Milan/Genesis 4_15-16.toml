[[commentary]]
quote='''
Once the crime is admitted at the very inception of this sinful act of parricide, then the divine Law of God's mercy should be immediately extended. If punishment is forthwith inflicted on the accused, then men in the exercise of justice would in no way observe patience and moderation, but would straightway condemn the defendant to punishment. God in His providence gives this sort of verdict so that magistrates might learn the virtues of magnanimity and patience, that they may not be unduly hasty in their eagerness to punish or, because of immature deliberation, condemn a man in his innocence. This would serve as a precedent not to impose a harsh penalty on some troublesome defendant and at the same time not permit a person to go unpunished who has shown no indications that he is sorry for his crime. God drove Cain out of His presence and sent him into exile far away from his native land, so that he passed from a life of human kindness to one which was more akin to the rude existence of a wild beast. God, who preferred the correction rather than the death of a sinner, did not desire that a homicide be punished by the exaction of another act of homicide. Wherefore, punishment is meted out seventy times sevenfold on Lamech, because a person who does not reform even after a conviction has taken place commits a more serious fault. Cain had sinned at a time previous to Lamech's crime. Lamech surely should have taken precautions to avoid what he notes as reprehensible in another person. Lamech's statement was in accordance with the decree of his Judge that no one should on any occasion consider it right to strike a guilty man. From the point of view of our faith, no one ought to slay a person who in the course of nature still would have time for repentance up to the very moment of his death. A guilty man—provided a premature punishment had not deprived him of life—could well procure forgiveness by redeeming himself by an act of repentance, however belated.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 9"
