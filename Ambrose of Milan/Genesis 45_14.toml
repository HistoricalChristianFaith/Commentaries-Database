[[commentary]]
quote='''
How evident, too, is that mystery: that, as though every command had been fulfilled, Joseph embraces his brother Benjamin and fell upon his neck, just as, when the Gospel was fulfilled, Christ embraces Paul with what we might call the arms of his mercy, so as to raise him, who was bent down by an inward opinion, up to heaven, as it were by the neck. Hence he too, raised up by Christ, says: But our manner of life is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 12"
