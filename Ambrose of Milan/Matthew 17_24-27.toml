[[commentary]]
quote='''
There is also another apostolic kind of fishing, the kind with which the Lord bids Peter alone to fish, saying: cast a hook and take the fish that comes up first. Great indeed and spiritual is the lesson by which Christian men are taught that they ought to be subject to the higher powers, lest anyone think that the ordinance of an earthly king may be dissolved. For if the Son of God paid the tax, who are you, so great, that you think it ought not to be paid? And he paid the tax who possessed nothing; but you, who follow the gain of the world, why do you not acknowledge your duty to the world? Why do you carry yourself above the world with a certain arrogance of mind, when you are subject to the world by a wretched greed?

So the didrachma is paid, which was the price of our redemption and of our body, set forth beforehand in the Law, paid in full in the Gospel, found not idly in the mouth of a fish; out of your mouth indeed you will be justified. For our confession is to us the price of immortality, because, as it is written, with the mouth confession is made unto salvation.

And perhaps this first fish is the first martyr, having in his mouth the didrachma, that is, the price of the tax. Our didrachma is Christ. That first martyr, then, namely Stephen, had a treasure in his mouth when he spoke Christ in his passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
[[commentary]]
quote='''
Then, when the Jews demanded the didrachma, which was given for sin according to the Law, he said to Peter: Simon, from whom do the kings of the earth receive tribute or census? From their own sons or from strangers? Peter answered: From strangers. The Lord said to him: Then the sons are free. But so that we may not give them offence, cast a hook and take the fish that comes up first, and when its mouth is opened you will find a stater; take that and give it for me and for you. He shows that he does not owe a propitiation for sins for himself, since he was not the slave of sin, but was free from every error, the Son of God. For the Son sets free; the slave is in guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
