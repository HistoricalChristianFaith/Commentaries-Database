[[commentary]]
quote='''
This charioteer, then, says: Turn, O Shulammite, turn. Well does he say, as a charioteer to his chariot: Turn, O Shulammite, that is, the peaceful one. For the soul that is peaceful quickly turns and corrects herself, even if she has sinned before, and Christ all the more mounts her and deigns to drive her, he to whom it is said: Mount your horses, and your riding is salvation, and elsewhere: I sent your horses † Tharsis. These are the horses of Christ. So Christ mounts his horses; the Word of God mounts devout souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
For Christ has his horses, of which the prophet says: You sent your horses into the sea, troubling many waters (Hab. 3); because the apostles, by preaching the Gospel, stirred up the peoples of the Gentiles, who are moved like many waters and are roused into waves of waters, so that, rising up from the earthly ceremonies of idols, they might believe in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
