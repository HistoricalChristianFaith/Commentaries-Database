[[commentary]]
quote='''
And behold, there came a man whose name was Jairus, and he was a ruler of the synagogue, and he fell at the feet of Jesus, begging him to enter his house, because he had an only daughter about twelve years old, and she was dying. Christ had left the synagogue among the Gerasenes, as we have said, and we welcomed him whom his own had not received, him whom we were awaiting. Neither, then, was he long absent from us, by whom he was awaited, nor does he disdain to return to them, if he is asked. For this man, the ruler of the synagogue, who had an only daughter, was praying for the healing of the perishing synagogue, which was being pressed on toward death because it was being deserted by Christ. Whom do we take the ruler of the synagogue to be but the Law, out of regard for which the Lord did not utterly abandon the synagogue, but kept in store the medicine of salvation for those who believe? So while the Word of God was hastening to this daughter of the ruler, to save the children of Israel, the holy Church gathered from the Gentiles, which was perishing through the fall into baser crimes, snatched by faith the healing prepared for others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
