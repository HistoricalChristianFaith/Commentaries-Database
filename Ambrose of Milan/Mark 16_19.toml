[[commentary]]
quote='''
In this let Arius too fall silent, who presses on in the tracks of an error contrary to Sabellius. Let him hear the Lord saying to the Lord, let him hear that the Son sits at the right hand of the Father, and let him cease to raise a question against the divinity from the speech and order of men. Nor let him argue here that the Father says sit; for we read elsewhere too that the Son sits even without the Father's word, as it is written: and he sits at the right hand of God, and elsewhere: Henceforth you will see the Son of Man sitting at the right hand of God. For he to whom sit is said is the one who is named the Son of Man. He hears as man, he sits as the Son of God. What can be called more pre-eminent than this power, which set even the flesh of man at the right hand of God, and joined that weak thing of the human condition, once the Word had indeed been made flesh, to the eternal divinity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
