[[commentary]]
quote='''
Thus hear him say: I saw the ungodly man exalted above measure and lifted up above the cedars of Lebanon, and I passed by, and behold, he was not. I saw him in this world, I saw him with the eyes of the body, I saw him also boasting and exalting himself above measure with his words, thinking himself to be something when he is nothing. How does he exalt himself above measure? I will set, he says, my throne above the clouds, and I will be like the Most High. He exalts himself, so that you see him like the cedars of Lebanon exalted above measure. These are themselves lofty and stand on a very high mountain; rightly, then, are they exalted above measure; and exalted above measure seems the ungodly man who has set himself upon that mountain of which it is written: If you have faith like a grain of mustard seed, you would say to this mountain: Be taken up and be cast into the sea. "To this demon", he says, "by which this man whom you marvel to see healed had been invaded and oppressed. Therefore you have charity in Christ rather than power over the devil." You see the cedar exalted above measure on a very high mountain; but it is broken by the wind, it is burned up by fire, it is dissolved by age. So is the rich man in the world; he shines indeed with a certain splendour of worldly favour, like Lebanon, he leans on the power of the world, he exults in wealth and riches. He seems to you to be something, before you say: Passing over, I will see. For just as Moses in mind and spirit passed over material things and saw God, so you too, if you pass over from here, raising the footstep of your mind to the grace of God, will see that he is nothing who seemed to himself most powerful in this land. Therefore God the Word says to your soul, says to your mind: Come hither from Lebanon, O bride, come hither from Lebanon: you shall pass over and pass through. If you pass over worldly things, you will pass through to paradise. Hear one passing over: Remember me, O Lord, when you come into your kingdom; hear again one passing through: Amen, amen, I say to you, today you shall be with me in paradise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
There is also another ungodly man who seems exalted and lifted up above the cedars of Lebanon, and if you pass by, he will not be, nor will you find his place. See for me a Jewish scribe reciting the sequence of the old Scriptures, but not following it; you hear that he recites it with his lips, you admire him as learned. You ask what he understands; he answers according to the letter, he runs through the history. He seems to you exalted above measure and lifted up, if you consider the letter. Pass over to the spiritual understanding, because the law is spiritual; you see that he is nothing, and then you say: I saw the ungodly man exalted above measure, and I passed by, and behold, he was not; and I sought him, and his place was not found. I sought him where he ought to have been, where life is; I did not find him; he was not there where life was, because he was dead, and therefore neither was his place found. For what place has a dead man, who was not and never has been? For he who was in the letter was not; for the letter kills, but the spirit gives life. I sought him, then, so that I might find him; he did not offer himself to be found, that is: I wished to convert him, he would not offer himself to me to be converted. I did what belonged to one who seeks; he shrank from what ought to have belonged to one who returns. Thus the soul that wishes to be converted seeks the Word, and when it has found him it says: I held him and will not let him go, that is, the Son of God, the Word of God. But the unrighteous man, who would not be healed, I sought him and did not find him; and therefore do not imitate him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For when has the ungodly man ever been wont to last, of whom you have it written elsewhere too: I saw the ungodly man exalted above measure and lifted up above the cedars of Lebanon, and I passed by, and behold, he was not; and I sought him, and his place was not found? Incredible is the swiftness of his extinction. You see the ungodly man suddenly powerful in this world: while you pass by, he already is not. For how great is a shadow on the earth, how short-lived! Move your footstep, and the shadow has passed. Or if anything here moves you, lift up the footstep of your mind to the things that are to come, and you will find that there the ungodly man will not be, whom here you believed to be; for he who is nothing is not. In short, the Lord has known those who are his; but those who are not, he does not acknowledge, because they themselves have not acknowledged him who is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 7"

[[commentary]]
quote='''
Let us flee, then, from here, where there is nothing, where everything that is thought magnificent is empty, where even he who thinks himself to be something is nothing and does not exist at all. I saw, he says, the ungodly man exalted on high and lifted up beyond the cedars of Lebanon; and I passed by, and behold, he was not. You too, pass by like David; pass on like the good servant, so that it may be said to you: Pass on, recline. Pass over like Moses, so that you may see the God of Abraham, Isaac and Jacob, and see the great sight. This is the great sight. But if you wish to see, loose the shoe from your feet: loose every bond of iniquity, loose the bonds of the world, leave behind the shoe, which is earthly. For this reason Jesus sent out the apostles without shoes, gold and silver, or money, so that they might not carry earthly things with them. For he who seeks the good is praised not for his shoe but for the swiftness and comeliness of his feet, as Scripture says: How beautiful are the feet of those who bring good news of peace, who bring good news of good things! Loose, then, the shoe from your feet, so that they may be beautiful for bringing the good news. Loose, he said, not bind. Loose it, so that you may pass over and find that the ungodly man whom you used to admire on earth is nothing and can do nothing. Pass over, then, that is, flee from the earth, where wickedness is, where avarice is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
