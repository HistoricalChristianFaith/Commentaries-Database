[[commentary]]
quote='''
Pharaoh himself also, though king of the Egyptians, whom both the insolence of royal power might have made careless and the wantonness and luxury of Egypt might have drawn away from zeal for chastity, called Abraham and rebuked him, saying: What is this you have done to me? Why did you not say that she is your wife, but said to me that she is my sister? And I had taken her to myself as a wife. And now behold, your wife is before you. Though he was by nature wild and barbarous, yet he shows that even amid foreign and barbarous errors there is a care for modesty, and that even by them the crime of adultery must be shunned. He who pleads ignorance condemns intemperance. Nor is it a wonder if a barbarian knows the law of nature: among the dumb animals, which are bound by no laws, there are yet some which not only keep faith in union with their mates, but also guard the chastity of a single coupling. Thus the law of nature is greater than the prescription of laws. It is no wonder, then, if this Egyptian king too feared God, though he did not fear man, and paid the penalty of adultery, though he was held guilty by no laws; and immediately, when he recognized that she was another man's wife, he not only gave her back to her husband but also gave him escorts to conduct him, lest anyone of the barbarous people should do violence either to the man's property or to the wife's modesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"

[[commentary]]
quote='''
Then this king of Egypt too says to Abraham: What is this you have done to me? Why did you not tell me that she is your wife, but said that she is your sister? And I had taken her to myself as wife. And now behold, your woman is before you; take her and hurry back from here. Let us bring before our mind some intemperate man who, having beheld the grace of chastity and being captivated by a certain beauty of hers, thinks she should be pursued; then, not knowing her handmaids, with whom she walks attended and arrives surrounded, namely sobriety and moderation and modesty, sparingness in food, flight from wantonness, impudence and petulance, earnest caution, anxious watchfulness, suddenly, inflamed either by the heat of drunkenness or by the fever of the flesh itself or by the encounter with a comelier form, he does not at all restrain himself nor fight against the law of the flesh. Does he not say: 'I thought it an easier thing to pursue purity: it is above my shoulders, above my strength. Rare is the man to whom these things are joined. Farewell, chastity; withdraw, withdraw from the borders of my senses. Hurry back quickly whence you came. I cannot bear your presence; I am afflicted by grievous questionings, while I judge that you must be held, whom I cannot hold.'

Then, turning to someone who admonished him, who had been eager to bring into his mind the habit of purity, alleging that it would not be hard or impossible, but the companion of many, neighbour to the zealous, suited to the willing, 'What is this,' he says, 'you have done to me? Why did you not tell me that she is your wife?' — that is, one who is held not in a perfunctory way but in lawful wedlock, who carries with her a very great dowry, who brings in the heavy burdens of matrimony and the interest due on a hard union — 'but you said a sister, bound by no laws and a companion by nature, not proud and powerful by any right of a dowry estate. And so, unaware of her burdens, I had thought she should be joined to me and kept. But I have understood what weight and load there is in her. Behold your woman, that is, behold your persuasion before you; take her and hurry back. I do not want her before me, I do not want her in my thoughts. Take yourself off from here with your counsels, with your admonition; take yourself off quickly, hurry back quickly: I do not bear your delays, they are afflictions to me: it is enough that I was deceived before.' And he sent his nurslings, by which an over-intemperate mind mostly wanders, turning over in the spirit thoughts of luxury, ambition and avarice, and stumbling upon various allurements, to cast purity out and drive her far away, so that she might not make a return into those borders from which she had been expelled, whereby, now secure and free of any sterner judgement, it might not fear to be convicted in its sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 4"
