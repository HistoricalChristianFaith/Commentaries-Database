[[commentary]]
quote='''
Wide extends the kindness of God; he rains upon the ungrateful, the fruitful earth does not deny its produce to the wicked, the same sun of the world lights the sacrilegious and the religious alike. Or, to weigh these things in the mystical sense, the Lord watered the people of the Jews with prophetic rains and shone upon them with the rays of the eternal sun, even though they did not deserve it; but since they were soaked with worldly dew, the Church of God is taken up to the heavenly light, yet in such a way that for them too, if they believe, the prerogative of mercy is kept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
