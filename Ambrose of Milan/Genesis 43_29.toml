[[commentary]]
quote='''
And lifting up his eyes, he saw Benjamin his brother from the same mother. It is a moral point that we see those we love before others, and that those whom the attention of the mind holds are the first to meet the gaze of the eyes, since for the most part, when we are distracted by the mind's occupation with other things, we do not see those whom we have before our eyes. So our sight is directed with the mind as its guide. Holy Joseph, then, saw Benjamin his brother, whom he held in his mind, whom he was looking for with his eyes, in whose absence he had scarcely seen his brothers, because seeing them availed nothing. And not content merely to have seen him, he asked as though he did not know: Is this your younger brother? It is the custom and the grace of love that we hold those dear to us not only with our eyes but also with our speech. Joseph had recognized his beloved, but he asked for this reason, that the voice might sound forth the one whom the mind held.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"

[[commentary]]
quote='''
So much for the moral sense; mystically, however, the Lord Jesus saw Paul — the eyes in fact of the Lord are upon the just — and said: Is this your younger brother? He is still called the younger, since he did not yet bear the mature age of grey-haired faith, had not yet grown to the perfect man, to that, as he himself says, measure of the age of the fullness of Christ. Indeed, he is read of as a young man only there, where he was keeping the garments of those who stoned Stephen. And therefore he desired Philemon to be like not his youth but his old age, as he wrote: I beseech you the more, since you are such as Paul, an old man. Therefore he teaches that the younger widows are to be avoided, not on account of their age, but on account of a certain wantonness of the offences of youth and an immaturity of virtue. For the rest, the praise of chastity is greater in a young man than in an old one. And I think it is not foreign to the truth if we understand this: that, although Paul had this, and shuddered when he was rebuked, because blindness had befallen him, he nevertheless began to draw near by saying: Lord, what do you want me to do? Therefore he was called the younger by Christ, so that he who was being called to grace might be excused from guilt, because it belonged to a slippery age. Indeed, Christ saw him when the light shone around him, and because young men are called back from vice by fear more than by reason, he applied the goad and in pity warned him not to kick against the goad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"
