[[commentary]]
quote='''
Arise, he says, come, my nearest one, my fair one, my dove, my perfect one: nearest surely by the desire of faith, fair by the beauty of virtue, dove by spiritual grace; for the wings of the dove covered with silver signify that eternal power, and the flight of the dove declared the presence of the Holy Spirit. Christ therefore calls her to himself, that she may come, since she was coming already endowed with spiritual treasures. For behold, he says, the winter has passed, the rain has gone, it has gone its way, the flowers have appeared on the earth. See how the holy Church is invited. The winter, he says, has gone its way, that she may not, being bare, dread the winter: the winter not of the season, but of weakness, which strips the fertile field of the soul of every flower. For there is a winter not of the earthly sun; there is a winter of the mind, when cold slips into the soul, when the warmth of the soul vanishes, when the vigour of the senses is loosened, when excessive moisture overflows and weighs down the mind, when the inner sight grows dim. And therefore the Lord says: See that your flight be not in winter or on the sabbath (Matt. 24:20); for it is good that the day of judgment or of death should come then, when the gentle mildness of the soul is vigorous, when the heavenly mystery shines with serene light, when our heart burns within us. For then Christ is present, as Ammaon and Cleopas testify in the Gospel, saying: Was not our heart burning within us on the way, when he opened the Scriptures to us? (Luke 24:32). And the soul is vigorous when the flower too is seen on the earth. Who is this flower of good fragrance, if not he who said: I am the flower of the field and the lily of the valleys (above, verse 1): of whom it is also written in Isaiah: A rod shall come forth from the root of Jesse, and a rod shall ascend from the root, and a flower shall come forth from the rod (Isa. 11:1). The root surely is the family of the Jews, the rod Mary, the flower of Mary Christ: when he shines in our land, and is fragrant in the field of the soul, or blooms in his Church, we can neither fear the cold nor dread the rain, but can await the day of judgment. And therefore the Church, that she might see this flower, was hastening with all zeal, as she herself testifies in later passages, saying: On my bed by night I sought him whom my soul loves (Song 3:1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
