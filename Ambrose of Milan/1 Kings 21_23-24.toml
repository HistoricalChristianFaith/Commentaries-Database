[[commentary]]
quote='''
A fitting penalty destroyed the miser, a fitting penalty for his avarice. Finally, also, the dogs and the birds of heaven devoured Jezabel herself, so that it should be made manifest that the spoil of spiritual wickedness becomes the grave of the rich. Flee, therefore, a death of this kind, O rich man. But you will only flee a death of this kind, if you flee this kind of crime. Do not be an Achab, and covet a neighbor's possession. Let not Jezabel dwell with you, that deadly avarice that persuades you to bloody deeds; that restrains not your desires, but urges you on; that makes you more sad even when you gain possession of what you desire, and that makes you destitute when you are rich.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 11"
