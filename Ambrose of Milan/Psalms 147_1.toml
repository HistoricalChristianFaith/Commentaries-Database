[[commentary]]
quote='''
What, then, is more pleasing than a psalm? Hence David himself says beautifully: praise, he says, the Lord, for a psalm is good; to our God let there be pleasant and seemly praise. And truly; for a psalm is the blessing of the people, the praise of God, the commendation of the congregation, the applause of all, the speech of everyone, the voice of the Church, the melodious confession of faith, a devotion full of authority, the gladness of liberty, the cry of joyfulness, the echo of gladness. It softens from anger, it releases from anxiety, it lifts up from grief; it is armour by night, instruction by day, a shield in fear, a feast in holiness, an image of tranquillity, a pledge of peace and concord, bringing forth, after the manner of a lyre, one song out of diverse and unequal voices. The rising of the day re-echoes a psalm, its setting resounds with a psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
