[[commentary]]
quote='''
But tell me: if I suffer this because of my sin, as you charge, why do the ungodly live, and not only live, but are also filled with riches and multiply their fruits, and moreover enjoy sons, and their houses abound? These things are evidently good in appearance, but by a deeper mystery you will find that the things thought good are not good, and the things thought evil are esteemed better than they.

They have grown old, he says, in riches. He said πεπαλαίωνται, so that what is signified seems to be not so much a long possession of riches as the grown-old trouble of plenty, just as Ecclesiastes saw that riches are kept to the harm of the one who possesses them, riches which perish amid the utmost strain and anxiety. For the things that are left here perish, and they cannot profit the dead man. So the deceased had anxiety from them; he could not find rest, he who left behind what he would blush at and did not take with him what he might hold, far unlike the one of whom it is written: Blessed is the man who has filled his desire from these; he will not be put to shame when he speaks to his enemies in the gate. He whose inheritance is the Lord, and whose reward is from the childbearing of the Virgin Mary, is proclaimed at his departure with the praises of wisdom, since he had nothing to blush at, he who coveted nothing of the things that belong to the world, but, having put off the cast-off skin of the old man, wounded the adversary with the dart of continence, so that at the end of this life the adversary could not clamour against him, lamed by the wound and confounded by admiration of his virtues. You have it, then, that he is not praiseworthy who has grown old in the desire for money and has not been made new in the receiving of grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
