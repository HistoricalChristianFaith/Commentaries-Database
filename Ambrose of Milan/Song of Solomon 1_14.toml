[[commentary]]
quote='''
A nard of henna is my kinsman in the vineyards of En-gedi. If we seek the place, that of a certain region which is in Judea, the place in which opobalsam is produced is so called: if the interpretation, it signifies in Latin "temptation". In those vineyards there is a tree which, if one pierces it, gives out ointment; this is the fruit of the tree. If the tree is not cut, it is not so fragrant and does not so give off its scent; but when it has been pierced by the hand of the craftsman, then it distils a tear. So too Christ, crucified on that tree of temptation, wept over the people, that he might wash away our sins, and from the bowels of his mercy poured out ointment, saying: Father, forgive them, for they do not know what they do (Luke 23:34). Then, therefore, when he was pierced on the tree by the lance, there came out from him blood and water, sweeter than every ointment, a victim acceptable to God, pouring out the fragrance of sanctification through the whole world. And like balsam from a tree, so power went out from his body; whence he says: I perceive that power has gone out from me (Luke 8:46). Hence it is more expressively called opobalsam, because by the piercing of the tree the balsam bursts forth through the hollow of the puncture.

Jesus, then, when pierced, poured out the fragrance of the remission of sins and of redemption. For he was also compressed, when, being the Word, he was made man: and he became poor, though he was rich, that we might be enriched by his poverty: he was powerful, and he offered himself to be despised, so that Herod scorned him and mocked him: he moved the earth, and he hung on the tree: he covered heaven with darkness, and crucified the world, and was crucified: he bowed his head, and the Word went forth: he was emptied out, and he filled all things: God descended, man ascended: the Word was made flesh, that the flesh might claim for itself the throne of the Word at the right hand of God: he was a wound, and ointment flowed: the beetle was heard, and God was recognized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
