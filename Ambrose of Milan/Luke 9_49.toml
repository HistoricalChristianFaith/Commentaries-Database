[[commentary]]
quote='''
For John loving much, and therefore much beloved, thinks that they should be excluded from the privilege who did not practise obedience.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But as for John, who, more inclined through zeal of charity, loving very much and therefore very much loved in return, thinks that he who does not follow in obedience should be shut out from the benefit, he is rightly not rebuked, but taught; he is not rebuked, because he acted out of love; he is taught, so that he may know that there is a difference between the weak and the strong. And therefore the Lord, even though he rewards the stronger, yet does not shut out the weak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
