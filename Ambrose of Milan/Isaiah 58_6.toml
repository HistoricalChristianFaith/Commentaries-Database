[[commentary]]
quote='''
He, then, imitates death who withdraws himself from the communion of this flesh and looses himself from those bonds of which the Lord says to you through Isaiah: but loose every binding of injustice, dissolve the obligations of violent exchanges, let the broken go free in remission, and burst asunder every unjust fraud.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
