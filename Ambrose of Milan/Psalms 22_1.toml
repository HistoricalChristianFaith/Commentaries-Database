[[commentary]]
quote='''
Seeing, then, that he took on himself a soul he also took the affections of a soul, for God could not have been distressed or have died in respect of his being God.… As being man, therefore, he speaks, bearing with him my terrors, for when we are in the midst of dangers we think ourself abandoned by God. As man, therefore, he is distressed, as man he weeps, as man he is crucified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25202.html'
source_title="Exposition of the Christian Faith 2.7.56"


[[commentary]]
quote='''
Or how, earlier, through the mouth of David himself, does he say: God, my God, why have you forsaken me? How is the Son forsaken by the Father, he who says: And I am not alone, because the Father is with me, and elsewhere: I was delivered up and I did not go forth, and elsewhere: I have risen and am still with you, unless so that you may observe that he expresses the feeling of men, who think themselves forsaken by their Lord when they are in dangers? Finally, hear what follows: Far, he says, from my salvation are the words of my offences, that is: the words of offences are one thing, the sacraments of eternal salvation another. Words do not prejudice power; the divine substance is upheld by its own strength: man is seen, man is heard, God is recognized in his works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
But sometimes the Lord, as it were, abandons for a time even those whom he wishes to be crowned in the contest, so that they may conquer by faith, and their devotion may not grow slack through favourable and prosperous circumstances. Indeed, those who have fallen through a course of prosperity and the enjoyment of success are often corrected by adversity. Therefore we frequently find the Jews fallen after victory and corrected after servitude, because by prayers and lamentations they made God return to them.

Hence that saying too, which was spoken according to man and the affection of man, does not conflict with this view, when the Lord said: O God, my God, look upon me; why have you forsaken me? Not that the Lord was forsaken, who says elsewhere: For I am not alone, because the Father is with me; but because, according to the flesh and affection of a man who is set in a heavy contest, he seems forsaken by the Lord. Indeed not idly does Scripture say that after the first temptation the devil departed from him until a time, that is, until the contest; for when the great contest of the sacred Passion arrived, the adversary came forward again to his temptations. But man, when he is set, as it were, in uncertainty, thinks that he has been deserted by his God. But just as we take this according to the affection of the flesh, that the man whose advance Christ wrought in his own body seemed to himself forsaken, so too by his divinity he knew that he was never forsaken by the Father, for he himself said: I am in the Father and the Father in me, and indicated that he was not alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
When the Patripassians had emerged, even the Catholics thought that at this point "invisible, impassible" should be added, as though the Son of God was visible and passible. If he was visible in the flesh, it was that flesh that was visible, not the divinity; it was passible, not the divinity. In fact, hear what he says: O God, my God, look upon me: why have you forsaken me? Our Lord Jesus Christ says this in his passion; he spoke this as man, he spoke according to the flesh, as though the flesh were saying to the divinity: Why have you forsaken me?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExplanation%2520of%2520the%2520Creed.html'
source_title="Explanation of the Creed"
