[[commentary]]
quote='''
There follows: The sinner will watch the righteous man and will gnash upon him with his teeth. But the Lord will laugh at him, since he foresees that his day will come. It is indeed the habit of one who is indignant and seething with anger to gnash with the teeth; but the heart of the malignant man also has its own teeth, which are accustomed not to resound but to tear. Snares, the devices of wickedness, are the teeth of the sinner. The sinner, then, lies in wait for the righteous man because he envies him; for the life of the righteous man reproves the sinner, whom, though silent, it condemns with greater authority than if it spoke with a loud voice. But the righteous man ought not to fear the gnashing of the sinner, because wickedness cannot be everlasting. Snares are for a time, but the defences of virtue are eternal. The death of the sinner dissolves all his power and fraud.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
