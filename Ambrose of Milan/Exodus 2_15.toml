[[commentary]]
quote='''
Let us not, then, be ashamed to flee; for this is a glorious flight, to flee from the face of sin. So Jacob fled at his mother's urging; for Rebekah said: Arise and flee into Mesopotamia. So Moses too fled from the face of King Pharaoh, lest the royal court should defile him, lest power should ensnare him. Indeed, he esteemed the reproach of Christ more precious than the riches of Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
