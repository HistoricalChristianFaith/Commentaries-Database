[[commentary]]
quote='''
And he said: This will I do: I will pull down my barns. You could even imagine him saying: "I will open my barns, let them come in who cannot endure their hunger, let the needy come, let the poor enter, let them fill their bosoms. I will pull down the walls that shut out the famishing. Why should I store away, I, whom God makes abound with what I may give? Why, with bolts on my doors, should I enclose the grain with which God has filled the whole round of fields, and which grows and abounds without one to watch it?"

The hope of the miser is surpassed, the barns are filled to overflowing with the new harvests. "I had too little and to no purpose did I hoard it; more is grown. For whom do I gather it? While I was watching for an increase in prices, I lost the enjoyment of its benefits. How many poor men's lives could I have saved with last year's grain! Rather might those prices have delighted me, which are reckoned not in money but in favor. I will imitate holy Joseph in the preaching of kindness. I will cry out with a loud voice: Come, ye poor, eat my loaves, open your bosoms, take my grain. The plenty of the rich man, the abundance of the whole earth, ought to be a fruitfulness for all." Yet you do not speak thus, but say: I will pull down my barns. Rightly do you pull them down, from which no poor man returns burdened. Barns are storehouses of iniquity, not helps to piety. Rightly he pulls down because he knows not how to build wisely. The rich man pulls down his barns, who knows not those that are eternal; he pulls down his barns, who does not know how to distribute his grain, but to hoard it.

And I will build greater; he says. Unhappy man, distribute even to the poor what you are spending on the cost of your building. While you shun the reward of generosity, you incur losses through your constructions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapters 6-7"

[[commentary]]
quote='''
You say: I will pull down my barns; the Lord says: "Suffer rather whatever is in your barn to be distributed to the poor, suffer those cellars of yours to benefit the needy." You say: I will build greater, and into them will I gather all things that are grown to me; the Lord says: Deal thy bread to the hungry. You say: "I will take his house from the poor man", but the Lord says: Bring the needy and harborless into thy house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 10"
