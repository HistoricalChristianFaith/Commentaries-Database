[[commentary]]
quote='''
As the lily in the midst of thorns: does not the flower of good fragrance rise up amid the harshness of labours and the contritions of souls? for God is appeased by a contrite heart. This is the desert, daughters, that leads to the kingdom; this too is the desert that blossoms like the lily, according to what is written: Rejoice, barren one, and exult, desert, and let it blossom like the lily (Isa. 35:1). In this desert, daughters, that good, fruitful tree which bears good fruits begins to spread out the arms of its deeds and to lift up the summit of its divinity, beside which the trees of our wood may sprout; because as the apple tree among the trees of the wood, so is my brother in the midst of the sons; so that the Church, seeing this and now glad at the success of our faith, may say: In his shadow I desired and sat down, and his fruit is sweet in my throat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
