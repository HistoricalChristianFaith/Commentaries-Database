[[commentary]]
quote='''
Mary the mother of our Lord stood before the cross of her Son. None of the Evangelists hath told me this except John. The others have related how that at our Lord's Passion the earth quaked, the heaven was overspread with darkness, the sun fled, the thief was taken into paradise after confession. John hath told us, what the others have not, how that from the cross whereon He hung, He called to His mother. He thought it a greater thing to show Him victorious over punishment, fulfilling the offices of piety to His mother, than giving the kingdom of heaven and eternal life to the thief. For if it was religious to give life to the thief, a much richer work of piety it is for a son to honour his mother with such affection. Behold, He saith, thy son; behold thy mother. Christ made His Testament from the cross, and divided the offices of piety between the Mother and the disciples. Our Lord made not only a public, but also a domestic Testamnet. And this His Testament John sealed, a witness worthy of such a Testator. A good testament it was, not of money, but of eternal life, which was not written with ink, but with the spirit of the living God: My tongue is the pen of a ready writer. (Ps. 45:1) Mary, as became the mother of our Lord, stood before the cross, when the Apostles fled, and with pitiful eyes beheld the wounds of her Son. For she looked not on the death of the Hostage, but on the salvation of the world; and perhaps knowing that her Son's death would bring this salvation, she who had been the habitation of the King, thought that by her death she might add to that universal gift.
But Jesus did not need any help for saving the world, as we read in the Psalm, I have been even as a man with no help, free among the dead. (Ps. 87) He received indeed the affection of a parent, but He did not seek another's help. Imitate her, ye holy matrons, who, as towards her only most beloved Son, hath set you an example of such virtue: for ye have not sweeter sons, nor did the Virgin seek consolation in again becoming a mother.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
John, therefore, who penetrated the divine mysteries more fully, not without reason labored to declare that she who had borne God remained a virgin. He alone, then, teaches me what the others did not teach: how, placed on the cross, he addressed his mother, thinking it of more account that, as victor over torments and punishments, victor over the devil, he was distributing the duties of dutiful love than that he was granting the heavenly kingdom. For if it is a religious thing that pardon is granted to the thief by the Lord, it is much more religious that a mother is honored by her son.

Nor let it be judged out of order that I have written of the thief's absolution before the address to his mother; for if he who had come to save sinners fulfilled first in my writings the task he had undertaken of redeeming the salvation of a sinner, it is not absurd. Indeed he himself says: Who is my mother, and who are my brothers? Because he had not come to call the righteous, but sinners. But there he spoke as the place required; here, even on the cross, not unmindful of his mother, he addresses her, saying: Behold your son, and to John: Behold your mother. Christ was making his testament from the cross, and John was sealing his testament, a witness worthy of so great a testator. A good testament, not of money but of life, which is written not with ink but with the Spirit of the living God. My tongue is the pen of a scribe writing swiftly.

But neither was Mary less than befitted the mother of Christ: while the apostles fled, she stood before the cross and with dutiful eyes looked upon the wounds of her son, because she was awaiting not the death of her child but the salvation of the world. Or perhaps, because she had learned that the redemption of the world would come through the death of her son, she, the royal hall, thought that by her own death too she would add something to the public gift. But Jesus needed no helper for the redemption of all, he who said: I have become like a man without help, free among the dead. He accepted indeed the affection of his mother, but he did not seek the aid of man. We have, therefore, a teacher of dutiful love. The reading teaches what a mother's affection should imitate, what the reverence of children should follow: that mothers should offer themselves in the dangers of their children, and that to children their mother's desolation should be a greater grief than the sorrow of their own death.

In this place a most abundant testimony to Mary's virginity is brought forward. For a wife is not taken away from her husband, since it is written: What God has joined, let man not separate; but she who for the sake of the mystery had put forward a marriage as a covering, now that the mysteries were completed, no longer needed marriage. Or, if we follow the moral sense, chastity is enjoined in mourning.

Yet it is mystical that she is commended to John, the youngest among the others, and this we ought not to receive with idle ears. For union with a young man and the beauty of youth is dangerous for women, lest perhaps some woman, curious about the example, careless of the mystery, desiring to wanton in Christ, should hold up Mary as a pretext in appearance but not imitate her in affection, as the common sort of women now has a bad name for leaving an older husband to follow a younger one. Let her learn, then, that here is the mystery of the Church, which, joined before to the older people in appearance, not in use, after she had brought forth the Word and sown it in the bodies and minds of men through faith in the cross and the burial of the Lord's body, by God's command chose fellowship with the younger people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
