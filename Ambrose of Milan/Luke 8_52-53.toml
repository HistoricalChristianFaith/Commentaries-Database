[[commentary]]
quote='''
Indeed, when the Lord said: the girl is not dead but sleeps, they laughed he says at him. For whoever does not believe mocks. Let them weep for their dead, then, who think them dead; where there is faith in the resurrection, there is the appearance not of death but of rest. Nor is that statement of Matthew out of keeping, where he says that there were trumpeters in the ruler's house and a crowd making a tumult, either because by ancient custom trumpeters were said to be employed to kindle and stir up mourning, or because, through the chanting of the Law and the letter, the synagogue could not grasp spiritual exultation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
