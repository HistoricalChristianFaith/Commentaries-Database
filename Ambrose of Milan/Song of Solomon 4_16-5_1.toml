[[commentary]]
quote='''
So, secure in such great praise, she asks that the north wind, a heavy wind, be still, lest it shake down the flowers, and that the south wind blow; that is, she wants winter to pass and the mildness of a softer breeze to bring the spring. She invites the bridegroom into her garden. The bridegroom comes down and, delighted by the variety of her fruit, rejoices that he has found stronger food and found sweeter food too. For there is, as it were, a kind of bread of the word, and a honey: one discourse is more forceful, another persuasive. There is also one faith more fervent, like wine, another clearer, as is the juice of milk. On this food Christ feasts in us, this cup he drinks, and by the inebriation of his drink he summons us to make our going out from lower things to the better and the best.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
And so, secure in so great a commendation, she asks the north wind, a heavy wind, to be still, lest it shake off the flowers; and the south wind to blow, that is, that winter, as it were, may pass and the mildness of a softer breeze bring spring. She invites the Bridegroom into her garden; the bridegroom comes down and, delighted by the variety of its fruits, rejoices that he has found stronger food and has found sweeter food too. For there is, as it were, a kind of bread of the Word, and a honey: one speech more forceful, another persuasive. There is also one faith more fervent, like wine; another more clear, as is the juice of milk. This food Christ feasts on in us, this cup he drinks, and by the inebriation of his drink he summons us to make our going forth from lower things to better and best.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
