[[commentary]]
quote='''
He also adds this verse: You have turned us back before our enemies. It is not well with him who is turned back, because no one who puts his hand to the plough and looks back is fit for the kingdom of God. Indeed Lot's wife, because she looked back, could not reach the top of the mountain, that is, the higher things, but was turned into salt, a substance which quickly dissolves and cannot last long in use. So are those who follow temporal things and do not follow eternal ones: both here they are made foolish by their own folly, and they cannot have the grace of things to come. Yet there are those who, though placed behind, forget the former things and stretch themselves out to those that are before, so as to be able to reach the prize. And to Peter it is said: Get behind me, Satan, so that he may be called forth to better things; and in the reckoning he is first who is after Christ. Therefore, then, 'before our enemies': because they afflict us and they pursue us, you willed that we should be behind, so that we may stretch ourselves out to higher things, so that we may always attend to what is before us, pursuing our enemies and longing to pass beyond their place.

Indeed Theodotion has it as the Seventy have it, that is, as this verse has been explained. Aquila has: You turned us back from the one who afflicts; Symmachus: You have ranked us last from every adversary. What are the things contrary to us but the pleasures of this world, full of delights and wantonness, and the things which are incitements to luxury? Lot's wife was deceived because she had behind her the luxury of the Sodomites and the enticements of that region. Whence was she deceived? Because she looked back behind her. And so, that you too may not look back to your enemies, God has set you last in the world; or else: he who makes himself last by humility does not turn back, but always looks before him. And so that you may know who your enemies are, hear him saying: Hear, O Israel; why is it that you are in the land of enemies? You are defiled among the dead. Yet who is so much your enemy and foe as the prince of this world and his allies, who persecuted the Lord Jesus even to the cross, not knowing his power? For if they had known, they would never have crucified the Lord of majesty. You, then, though you are last, do not follow your enemies, but follow the Lord Jesus, lift up his cross and press on in his footsteps. For he who follows Christ does not look back behind him, that is, to the luxuries and enticements of sins, and therefore he can say with the saints: Our heart has not turned back. Hence it is understood that he too who is ahead of his enemies becomes last and hindmost in heart, if he looks back to them and attends with the affection of his mind to carnal rather than spiritual things. He too who is last can be first in heart, if he considers the things which are in heaven and not those which are on earth. Hear that he who is last in the world is among the first with Christ: I think that God has shown us apostles as last, as men appointed to death, that we may be a spectacle to this world, both to angels and to men. He called himself last, and yet the same man showed that he was first, when he says: But our way of life is in heaven.

There follows: And those who hated us plundered for themselves; you have given us like sheep for food, and among the nations you have scattered us. Perhaps you wonder that, since in what follows, as we have said, those who speak have the highest constancy of faith, here they say that they were plundered by those who hated them; but do not let these things alarm you; for many are plundered here, and yet their merits cannot be separated from Christ. The apostles were dragged away, beaten with rods, thrust into prison, separated from one another, and yet they remained with Christ; nay, by the very fact that they were dragged away by the unbelieving, their merits grew and their grace in heaven was increased; for he who is plundered by men is not at once also conquered. See the apostle Paul rejoicing in his dangers, see him glorying that he was let down through a window in a basket. See how holy Jeremiah, holy Ezekiel, holy Daniel, though led into captivity and plundered by the Assyrians, yet suffered no captivity of their own faith, nor transgressed against the covenant of the Lord; for even in captivity they kept the precepts of the divine Law, and did not think that they should take any of the forbidden foods against the institution of their forefathers.

Hence Theodotion said well: And those who hated us exulted over us; for the insult of enemies does no prejudice to good minds, nor does the plundering of enemies. And therefore the saint, who is sure that plundering cannot harm him, says: Who shall separate us from the charity of Christ? Tribulation or distress? and the rest. But in all these things we overcome and more than conquer through him who loved us, knowing that neither death nor life nor angel nor powers nor things present nor things to come can separate us from the charity of God which is in Christ Jesus our Lord. He, then, who is such is not separated from Christ. Hence, even if he is plundered bodily, yet spiritually he is free, and not only is he not liable to plunder, but he even seeks for himself a praiseworthy plunder, like those of whom it is written: From the days of John the Baptist the kingdom of heaven is taken by force, and those who use force plunder it. He, then, is the victor who, though set among earthly things, knows not how to be the captive of unbelief; and not only is what is glorious in him not plundered, but rather he himself plunders what is eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
