[[commentary]]
quote='''
By the death of the martyrs, religion has been defended, the faith spread and the church strengthened. The dead have been victorious, and the persecutors have been vanquished. Accordingly, we celebrate the deaths of those of whose lives we know nothing. So, too, David in prophecy rejoiced at the departure of his own soul, saying, "Precious in the sight of the Lord is the death of the saints." He held death in more esteem than life. The death itself of the martyrs is the prize of life. Furthermore, even the hatreds of enemies are dissolved by death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Death of Satyrus 2.45"

[[commentary]]
quote='''
For death, as we said above, is the release and separation of soul and body; and loosing is not evil, for to be dissolved and to be with Christ is far better. Death, then, is not evil. Indeed, the death of sinners is very evil: not, certainly, death in general, but specifically that of sinners is very evil. And then: precious is that of the just. From this it is clear that the harshness belongs not to death but to guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 8"
