[[commentary]]
quote='''
Luke rightly thought, seeing that he could not embrace more of the sons of Jacob, lest he should seem to be wandering from the line of descent in a superfluous course, that the ancient names of the Patriarchs though occurring in others far later, Joseph, Judah, Simeon, and Levi, should not be omitted. For we recognise in these four kinds of virtue; in Judah, the mystery of our Lord's Passion prophesied by figure; in Joseph, an example of chastity going before; in Simeon, the punishment of injured modesty; in Levi, the priestly office. Hence it follows, Who was the son of Melchi, i. e. "my King." Who was the son of Janna, i. e. "a right hand." Who was the son ofJoseph, i. e. "growing up;" but this was a different Joseph. Who was the son of Mattathias, i. e. "the gift of God," or "sometimes." Who was the son of Amos, i. e. "loading, or he loaded." Who was the son of Naum, i. e. "help me." Who was the son of Matthat, i. e. "desire." Who was the son of Mattathias, as above. Who was the son of Simei, i. e. "obedient." Who was the son ofJoseph, i. e. "increase." Who was the son of Judah, i. e. "confessing." Joanna, "the Lord, his grace," or "the gracious Lord." Resa, "merciful." Zorobabel, "chief or master of Babylon." Salathiel, "God my petition." Neri, "my lanthern." Melchi, "my kingdom." Addi, "strong or violent." Cosam, "divining." Her, "watching, or watch, or of skins." Who was the son of Jesus, i. e. "Saviour." Eliezer, i. e. "God my helper." Joarim, i. e. "God exalting, or, is exalting." Matthat, as above. Levi, as above. Simeon, i. e. "He has heard the sadness, or the sign." Juda, as above. Joseph, as above. Jonah, a dove, or wailing. Eliachim, i. e. "the resurrection of God." Melchi, i. e. "his king." Menan, i. e. "my bowels." Mattathias, i. e. "gift." Nathan, i. e. "He gave, or, of giving."

But by Nathan we perceive expressed the dignity of Prophecy, that as Christ Jesus alone fulfilled all things, in each of His ancestors different kinds of virtue might precede Him. It follows, Who was the son of David.

The mention of just Noah ought not to be omitted among our Lord's generations, that as our Lord was born the builder of His Church, He might seem to have sent Noah beforehand, the author of His race, who had before founded the Church under the type of an ark. Who was the son of Lamech.

His years are numbered beyond the deluge, that since Christ is the only one whose life experiences no age, in His ancestors also He might seem to have felt not the deluge. Who was the son of Enoch. And here is a manifest declaration of our Lord's piety and divinity, since our Lord neither experienced death, and returned to heaven, the founder of whose race was taken up into heaven. Whence it is plain that Christ could not die, but was willing that His death should profit us. And Enoch indeed was taken, that his heart might not change by wickedness, but the Lord, whom the wickedness of the world could not change, returned to that place whence He had come by the greatness of His own nature.

Nor do the Evangelists seem so to differ who have followed the old order, nor can you wonder if from Abraham down to Christ there are more successions according to Luke, fewer according to Matthew, since you must admit the line to have been traced through different persons. But it might be that some men have passed a very long life, but the men of the next generation have died at an early age, since we see how many old men live to see their grandchildren, while others depart as soon as they have sons born to them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Here too some are wont to raise questions: that Matthew enumerated forty-two generations from Abraham down to Christ, but Luke fifty, and that Matthew described the generation as flowing through some persons, Luke through others. In which you can already prove what we said: that although Matthew wove into the order of generation some ancestors of the Lord's line and Luke others, yet each marked the remaining founders of the line from Abraham and David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Nor should you wonder if according to Luke there are more successions from Abraham down to Christ, fewer according to Matthew, since you admit that the generation has run through different persons; for it can happen that some lived a long life, while the men of the other generation died at an untimely age, since we see a good many old men living with their grandsons, while other men die as soon as they have had sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Nor does it seem absurd that Saint Matthew thought the generations should be divided into fourteens, the mystical number being doubled: from Abraham to David, from David to the deportation to Babylon, from the deportation to Babylon to Christ; in which he likewise marked the turns of the changes. For in the times from Abraham to David the people of the Jews was without kings — for rightful kingship began from David — then the whole nation of the Jews was governed by kings, and their kingdoms remained inviolate until their deportation; but after the deportation the nobility of the degenerating people, cut short, sank toward its setting. As for the fifty successions which Luke thought should be woven together from Abraham, it is clear enough that the grace of a mystical number has been kept; for both the tenth and the seventh number are mystical, and each, repeated three times, signifies a mystery; and the Pentecost, whose grace Luke followed, and the Tesseracoste, whose grace Matthew followed, have revealed the mystical number more than enough.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
This too we think must not be passed over, that from the times of David down to Jeconiah, that is, down to the captivity, though there were seventeen kings of Judaea, Saint Matthew set down fourteen generations, and again from Jeconiah down to Joseph, though twelve generations are counted man by man, he afterwards recorded that fourteen generations had been described. For so you have it: All the generations from Abraham to David are fourteen generations, and from David to the deportation to Babylon fourteen generations, and from the deportation to Babylon to Christ fourteen generations. And first we must recognize what we have already said before, that there can be more successions and fewer generations; for some can live longer and beget later, or indeed be wholly without share in generation. So the times of kings are not the same as the times of generations. Hence Matthew too passed over those whom he did not think belonged to the generation. For if his purpose had been to describe the successions, we would reasonably be troubled why, though the books of Kings and Chronicles agree that after Joram there reigned Ahaziah and Iodam and Amaziah, and that Uzziah succeeded Amaziah, Saint Matthew passed over those three kings, Ahaziah, Iodam and Amaziah, and set Jehoshaphat next after Joram. But he set him next not in the succession of kings but in the generation; indeed he declared that he was a recorder of generations. And it could have happened that Joram both begot late and Jehoshaphat received the kingdom later, and so he succeeded Joram his father in generation, though he did not succeed him in power.

As for the evangelist seeming to have enumerated twelve generations after Jeconiah, if you attend carefully, here too you will be able to find the reckoning of fourteen generations; for twelve are counted up to Joseph, not up to Christ; Christ, born of Joseph, is the thirteenth. But it makes no difference whether there is a falsehood in two generations or in one; yet not even here will you find some rock of Caphareus and a shipwreck of the truth. For history indicates that there were two Joachims, that is, two Jeconiahs, one born before the deportation, the other in the deportation itself, that is, father and son. So the father, who succeeded Josiah, was counted among the earlier generations; the son, who succeeded his father, that is, Josiah's grandson, among the later. And that there were two, the books of Kings indicate. For so it is written: And Pharaoh set Joachim, son of Josiah, over Israel, reigning in Judaea in place of Josiah his father, and changed the name of Joachim in his reigning, and he reigned eleven years in Jerusalem. To which he added: And the rest of the words of Joachim and all that he did, are they not written in the book of words and in the days of those who reigned in Judaea? And Joachim slept with his fathers, and Joachim his son reigned in his place. Joachim was eighteen years old, and when he reigned, he reigned three months in Jerusalem; his mother's name was Mesola. And all that his father did under the eyes of the Lord, he too did. And in his days Nebuchadnezzar, king of Babylon, came up to Jerusalem. You see, then, that the son of Josiah was one, his grandson another: the son was the one to whom Jeremiah gave a name, the grandson the one who was called by his father's name. And well did Saint Matthew not wish to differ from the prophet, so that he named not Joachim but Jeconiah. At the same time, as we said above, he established a greater fruit of the Lord's devotion, if the Lord did not require nobility of line in all, but willed fittingly to be born of captives and sinners, he who was coming to preach release to captives. So the evangelist did not suppress either one, but marked both, because each was called Jeconiah. So, with the younger Jeconiah added, fourteen generations are counted. So much, then, for Matthew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
