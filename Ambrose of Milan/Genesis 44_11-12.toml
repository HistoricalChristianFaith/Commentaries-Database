[[commentary]]
quote='''
First the sacks of each are examined in order. Divine Scripture teaches you good conduct. In order they had earlier reclined at the banquet facing him, the firstborn according to his age. You see that the place of honour is to be yielded to the elder. In order again the sacks of each are searched, that you may know that Paul was chosen by heavenly judgment. He sifted the rest, he preferred this one. In no one else's sack was the silver cup found but in his. What does it mean that it was put into the sack? Joseph indeed made them drunk in order to deceive them, he sent the cup in order to call back by a loving deceit the brother whom he loved; but divine mysteries shine forth.

Christ found in us this silver, which he himself had given. We have the silver of nature, we have also that of grace. Nature is the work of the Creator, grace is the gift of the Redeemer. Although we cannot see the gifts of Christ, yet he gives and works in secret, and he gives to all; but to keep them and not lose them belongs to few. Yet he does not give all things to all. Wheat is given to many, the cup to one, who is presented with the prophetic and priestly gift. For it is not everyone, but the prophet who says: I will take the cup of salvation and call upon the name of the Lord.

In the body of Paul, therefore, the voice of heavenly doctrine was already shining, since he was learned in the Law. But because he was not yet subject to the righteousness of God, the cup was within the sack, doctrine within the Law, the lamp within the bushel. Yet Ananias was sent, to give the blessing, to lay on his hand, to loose the sack. When the sack was loosed the silver shone out, and as the scales fell, like bonds of the sack, at once he saw. His bond was unbelief; his release became faith. And so, as though the sack were loosed, that is, when the veil of the Law was laid aside, which is laid over the heart of the Jews, converted to the Lord, free from the bond, having obtained the grace of freedom, he says: And so all of us, beholding the glory of God with unveiled face, are re-formed into the same image. For with the sandal of the Law loosed, he preached the Gospel with the bare foot of free speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 11"
