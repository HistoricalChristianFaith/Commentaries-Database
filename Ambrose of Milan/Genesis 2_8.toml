[[commentary]]
quote='''
In approaching this subject I seem to be possessed by an unusual eagerness in my quest to clarify the facts about Paradise, its place, and its nature to those who are desirous of this knowledge. This is all the more remarkable since the Apostle did not know whether he was in the body or out of the body, yet he says that he was caught up to the third heaven. And again he says: I know such a man—whether in the body or out of the body I do not know, God knows—that he was caught up into paradise and heard secret words that man may not repeat. Of such a man I will boast; but of myself I will glory in nothing save in my infirmities. For if I do wish to boast, I shall not be foolish; for I am speaking the truth. If Paradise, then, is of such a nature that Paul alone, or one like Paul, could scarcely see it while alive, and still was unable to remember whether he saw it in the body or out of the body, and, moreover, heard words that he was forbidden to reveal—if this be true, how will it be possible for us to declare the position of Paradise which we have not been able to see and, even if we had succeeded in seeing it, we would be forbidden to share this information with others? And, again, since Paul shrank from exalting himself by reason of the sublimity of the revelation, how much more ought we to strive not to be too anxious to disclose that which leads to danger by its very revelation! The subject of Paradise should not, therefore, be treated lightly. With these words let us set aside the question of what was hidden to Paul.

Nevertheless, we can find out who was the Creator of this Paradise. We read in Genesis that God planted a garden to the east and he put there the man he had formed. Who had the power to create Paradise, if not almighty God, who spoke and they were made and who was never in want of the thing which He wished to bring into being? He planted, therefore, that Paradise of which He says in His wisdom: Every plant which my Father has not planted will be rooted up. This is a goodly plantation for angels and saints. The saints are said to lie beneath the fig tree and the vine. In this respect they are the type of the angels in that time of peace which is to come.

Hence, Paradise has many trees that are fruit-bearing, with plenty of sap, and vigor. Of these it is said: All the trees of the woods shall rejoice. The woods flourish ever with the green shoots of merit, just like that tree which is planted near the running waters, whose leaf shall not fall off, because its fruit is plenteous. Here, then, is Paradise.

The place where it is planted is called delight; wherefore holy David says: Thou shalt not make them drink of the torrent of thy pleasure, for you have read that a river rose in Eden watering the garden. These woods, therefore, which were planted in Paradise are watered by the outpouring of the waters of that spirit concerning which He says elsewhere: The stream of the river maketh the city of God joyful. Here is that city of Jerusalem which above is free, in which the different merits of the saints come to fruition.

In this garden, therefore, God put the man He had formed. Take note that He placed man there not in respect to the image of God, but in respect to the body of man. The incorporeal does not exist in a place. He placed man in Paradise, just as He placed the sun in heaven, awaiting lordship over the heavens, just as the creature expects the revelation of the sons of God.

Hence, if Paradise is a place where shrubs have opportunity to blossom, then Paradise has a certain vital force which receives and multiplies seeds in which each and every virtue is planted, and where flourishes the tree of life which is called Wisdom. Of this, Solomon says that Wisdom arose not of the earth but of the Father: For she is the brightness of eternal light and the emanation of the glory of the almighty God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 1"

[[commentary]]
quote='''
Paradise, a land watered by many rivers, is then appropriately situated in the East and not in the regions facing it. This reference to the East is significant, for the rising sun may be compared to Christ who flashed forth a gleam of eternal light which exists in Eden, that is, in a land of delight.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"
