[[commentary]]
quote='''
In the course of time Cain brought to the Lord an offering of the fruit of the ground—a twofold error: first, that his offering came after a period of time, and second, that it was composed of fruits of the ground. Again, the offering was not of the first fruits. This would have been commendable from the point of view of speed and of desirability. Wherefore we have the precept: When thou hast made a vow, thou shalt not delay to pay it, and It is much better not to make a vow than after a vow not to perform the things promised, for, although you make a vow, you do not carry it out. A vow is a request for a benefit from God with a promise to give something in return. Hence, when you have obtained what you sought, it would be an ungrateful act to delay what you have promised. But, at times, men are apt to be heedless and forgetful of the blessings they have obtained or to become proud and haughty and claim the resulting favors as their own. They tend to refer the results to their own peculiar virtues and to consider that they, and not the Author of the favors, are responsible for their success. There is a third category of error which is of lesser import, but comparable because of its arrogance. We have reference to those who actually do not deny that God is the giver of good things, yet are of the opinion that they have obtained them as a result of their adherence to prudence and to the other virtues. Wherefore they believe that they are deserving of divine grace, inasmuch as it appear that they are by no means unworthy of such merits from God's beneficence.

To avoid the eventuality of causing your whole approach to prayer to be imperfect, there is a law laid down by God, the Lawgiver, for your instruction and guidance: Take heed and beware lest you forget the Lord thy God and neglect his commandments and judgments and justice which I command thee this day, lest after thou hast eaten and art filled, hast built houses and dwelt in them, and when your sheep and oxen are filled, and you have plenty of bronze, of gold and of silver and of all things, and when thy granaries are full, thy heart be lifted up and thou remember not the Lord thy God. When you are forgetful of yourself, then, also, will you forget the Lord. If you realize how weak you are, then you will discover that God is supreme over all things and you will not be unmindful of the fact that you owe a debt of reverence to Him.

Now learn how each and every one of us may be warned against thinking of himself as the originator of his own good: Lest thou shouldst say, we are told, in thy heart: my own might and the strength of my own hand achieved this virtue for me. But remember the Lord thy God that hath given thee strength that thou mightest attain virtue. Wherefore that Apostle is to be commended who, in not boasting of his own virtue, followed the Law and said that he was the last of the Apostles and that we owe what we have, not to our own merits, but to divine grace. He said: What hast thou that thou hast not received? If thou hast received it, why dost thou boast as if thou hadst not received it? Here is the lesson of humility rather than of arrogance. You should strive, therefore, to be industrious rather than be powerful. Here is advice that is salutary. Do not, then, make light of the experience of a surgeon who makes a deep incision so as to rid a wound of all infection.

The man who justifies himself, lest he be puffed up with the swelling of his heart, has hearkened also to the salutary mandate of the oracle: Say not in thy heart, when the Lord thy God shall bring to destruction those nations in thy sight: Because of my justice hath the Lord brought me in to possess this land, whereas the Lord will destroy these nations before thy face for their wickedness. It is not for thy justices nor the uprightness of thy heart that thou hast gone in to possess that land, but because of the wickedness of the nations, the Lord will destroy them from thy sight and will accomplish his testament which he promised by oath to thy fathers. The testament referred to is the perfect grace of God. God gives nothing that is imperfect. Perfect is virtue and perfect, too, the works of virtue. This testament is one which brings with it a legacy of what is good. Rightly, too, is this testament called divine, because what is really and truly good is bestowed on us and granted to us by celestial mandate. And the testament referred to is one that is old in type but new in truth, because it is sealed in blood. By this testament we hold the pledge of divine grace: For God so loved this world that he delivered his only Son for us all. Wherefore the words of the Apostle points to the perfection of grace: How can he fail to grant us also all things with him?

Swiftness of fulfillment is the primary characteristic of a vow. Hence Abraham, when he was commanded to offer his own son as a sacrifice, did not, like Cain, fulfill the command after a period of time, but, arising early in the morning he harnessed his ass, took with him two of his servants and his son Isaac and cut wood for a holocaust. Then he set out on his journey and on the third day came to a place which God had indicated to him. Take note first of the speed, haste, and eagerness of the expectant sacrificer. He was delayed only by the time it took to listen to the oracle, to harness his ass, so as to comply with God's commands and make the necessary preparations for the sacrifice. He was able, also, to lead away his victim to the accompaniment of the two virtues of faith, namely, certainty in the power of God and confidence in His goodness.

Something can be said in reference to the time element, that is, the third day. Abraham's purpose needed the quality of continuity and perpetuity, for time is tripartite, taking in, as it does, the past, the present, and the future. By this we are admonished that there should not be any trace of forgetfulness of the beneficence of God whether in the past, present, or future. We should, rather, be steadfast in the recollection of His grace and in our compliance with His command. Another reason for this reference to time lies in the fact that the person who performs a sacrifice ought to put his trust in the brilliant light of the Trinity. For him whose sacrifice is grounded in faith has ever around him the light of day. For him there is no night. So in Exodus Moses says: We will go three days' journey to sacrifice unto the Lord our God. Elsewhere, too, when God appeared to Abraham by the oak of Mamre, we are told that Abraham raised his eyes and saw three men standing at a distance from him. As soon as he saw them he ran to the entrance of the tent door to meet them and bowed down to the earth and said: My Lord, if I have found favor with you. He beholds three and one he adores. He offers three measures of fine flour. Although God is immeasurable, He nevertheless holds the measure of all things, as it is written: Who hath measured the waters in his hand and weighed the heavens with his palm and the bulk of the earth in the hollow of his hand? The holy patriarch, therefore, offered sacrifice in the secret recesses of his heart to the Trinity made perfect in each of the Persons. This is the spiritual meaning of the measures of fine flour. This is the measure of fine flour mentioned in the Gospel which was ground by the woman who will be taken. One will be taken; the other will be left. The Church will be taken; the Synagogue will be left, or the man of good conscience will be taken and the man of bad conscience, left. That you may know that Abraham believed in Christ, we read: Abraham saw my day and was glad. He who believes in Christ believes, too, in the Father, and who believes in the Father believes, too, in the Son and Holy Spirit. There were three measures, therefore, and one substance of fine flour. This means that there was one sacrifice which was offered to the Blessed Trinity with an equal measure of devotion and a corresponding plenitude of piety.

There is still another example of speedy and zealous devotion. We read: He ran and picked out a good tender bullock and gave it to the servant who hastened to prepare it. Everywhere we find devotion that is ready and eager and, hence, an acceptable gift to God. In another passage we are recommended to anticipate the sunrise with a prayer: Run to meet the rising of the sun. There is the incident in the Gospel of the Lord Jesus, saying: Zacchaeus, make haste and come down. And he who attained his wish to see Christ and who further succeeded in being seen and addressed by Christ made haste to descend and welcomed Him with joy. And so the Lord approved of this display of his emotions and was quick to reward him in return, saying: Today salvation has come to this house. The Lord hastened to perform His act of kindness. He did not wait and promise to fulfill it later, but first acted and then spoke of it, for He said: Salvation has come, which was, of course, the act of one who anticipates, not of one who promises. The just man gives an added force to his vow by acting quickly. Accordingly, our fathers ate the paschal lamb in haste, girding up their reins, and with shoes in their feet, and standing ready equipped for departure. The Pasch is the passage of the Lord from passion to the exercise of virtue. It is called the Pasch of the Lord because the truth of the Passion of the Lord was then indicated in the type of the lamb, and its benefits are now being observed.

Go quickly, then, my soul, in search of this, in order that you may quickly hearken unto it as did Jacob: How did you find it so quickly, my son? To which Jacob, following instructions, replied: The Lord your God let me come upon it. God gives quickly: For he spoke and they were made; he commanded and they were created. The Word of God is not, as a certain writer maintains, something achieved, but rather being achieved, as it is written: My father works even until now and I work. The Word of God came before all things. It exists before all things like the Father and is in every respect like the Father, penetrating all things. It is strong, and keen, keener than any sword, extending even to the division of the soul and spirit, of joints, also, and of marrow, a discerner of the thoughts of all. Apropos of this, God the Father says: Thou shalt presently see whether my word shall come to pass or not. Wherever God is, there is the Word, as He said: We will come to him and make our abode with him. You may read elsewhere concerning God: I stood here before thee. And so the Word said: Before thou wast under the fig tree I saw thee. It was said of the Word, that is, of the Son of God, that in the midst of you there stands one whom you do not know. Wherever there are holy men, there stands the Word of God in their midst, penetrating their inmost hearts and filling the sea and the land. When the Word is here, it is elsewhere, also, without a change of place. Every place is surcharged with the presence of the Word. That which penetrates everything and is in everything leaving no place vacant—that exists everywhere. Where now the Word is present had before been possessed by the Word, and contrariwise. Hence, when a man is aware of the celerity of the Word of God, he is quick to make a petition and as quickly attains his wish.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapters 7-8"

[[commentary]]
quote='''
Take the example of Pharao, a man given to vain empty thoughts. His land of Egypt was afflicted with a plague of frogs. They gave forth a surfeit of sound, meaningless and senseless. Moses said to Pharao: Set me a time when I shall pray for thee and for thy servants and for thy people that the Lord may exterminate the frogs. Pharao, who because of his plight should have besought him to offer prayer, replied: Tomorrow, thus showing himself indifferent to the punishment that the delay would bring, although he was still intent on saving Egypt from the plague. And so, when his prayer was finally granted, he was unmindful of gratitude. Being puffed up in his heart, he forgot God.

Prayer is made effective by humility. We have the parable of the Pharisee, who in his prayer enumerated his fasts as acts of commendation and who seemed to reproach God as he boasted of his virtuous life. The publican, on the other hand, standing far off, would not so much as lift his eyes to heaven but kept striking his breast, saying: O God, be merciful to me the sinner! Hence, in the words of holy Scripture, he was preferred before the other: This man went back justified rather than the Pharisee. He is justified who confesses his own sin, as the Lord Himself has said: Tell if thou hast anything to justify thyself. And David said: A sacrifice to God is an afflicted spirit. Again: A contrite and humble heart God does not despise. Jeremias also says: The soul in anguish and the troubled spirit cries to thee. The Assyrian, like Pharao, said: Who are they among the gods of the nations that have delivered the country out of my hand, that your God will deliver Jerusalem out of my hand? They were cast down from their exaltation. The just man, like Jacob, acknowledges that all good things of whatever sort which he has obtained come from God the Creator, saying that all he saw was for his benefit: The Lord thy God has given these into my hands. This is an example of how one should accept the fulfillment of a prayer. David says: Offer to God the sacrifice of praise and pay thy vows to the most high. To praise God is to offer Him a prayer and to give thanks for its fulfillment. Wherefore preference above all the other lepers is to be given to the Samaritan, who alone of the ten cured of leprosy returned, according to the Lord's injunction, to give thanks and glorify Christ. Of him did Jesus say: Has no one been found to return and give thanks to God except this foreigner? And He said to him: Arise and go thy way, for thy faith has saved thee.

Furthermore, a vow or a prayer is commendable to the extent that its substance is not divulged. We should keep intact the hidden mysteries just as Abraham did when he caused loaves to be baked under the ashes. This our fathers did, too, when they made into loaves, like those which in Greek are called "covered," the dough that was brought out of Egypt. They covered this dough with ashes, an act like that which the woman in the Gospel performed when she buried leaven in three measures of wheat until the whole was leavened. Therein is a profound lesson. Our Lord's teaching on prayer is revealed to us more clearly in the Gospel: But when thou prayest, go into thy room and closing the door, pray to the Lord in secret and thy Father, who sees in secret, will reward thee. But in praying do not multiply words. And He adds: For your Father knows what you need before you ask him. Your room is the secret place of your heart and soul. Enter into this room, that is, enter into the depths of your soul, remove yourself entirely from the exterior vestibule, and close your door.

What is meant by the phrase "your door"? Set a watch, O Lord, before my mouth and a door around my lips. Paul makes a prayer for himself when he says: That God may open the door of his Word for me to announce the mystery of Christ. Appropriate for the occasion was the substance of his prayer. In preaching the Gospel he was clearly chosen to be the one who opened the door of the Word, from which issued the salvation of the Gentiles and life itself for all people. We should, however, close this door lest sin enter in and that from our tongue should issue no unseemly word. Sin enters in when we open our mouths to utter what is unrighteous. How does sin find entrance? We read: In the multitude of words you shall not escape sin. When a multiplicity of words has come forth, sin has found an entrance, for in this very multiplicity of words what we utter is not in the slightest degree subject to measure. Because of lack of prudence we fall into error. In fact, to give expression to our thoughts without duly weighing our words is in itself a grave sin.

For that reason be not imprudent in your speech. The lips of the imprudent man furnish an occasion for evil. Do not be given to self-praise: The prayer of him that humbleth himself has pierced the clouds. Do not be incautious and reveal the mysterious import of the Lord's prayer. Do you not know how serious it is to commit sin in the act of saying a prayer at the very moment when you are looking for a favor? The Lord has assured us that we are subject to sins of speech when He says: And may his prayer be turned to sin, unless you regard this to be of slight concern to you. To believe that your prayer is not heard unless you cry out aloud is to distrust the power of God. Your deeds, your loyalty, your affections, your passions, all cry out. Your blood, too, cries out as in the case of Abel, a man gives to goodness, concerning whom God spoke these words to Cain: The voice of your brother's blood cries to me. He who cleanses you from your secret sins hears you in secret. We cannot hear a person unless he speaks. Our thoughts, not our words, reach God. To realize this you have only to read what the Lord Jesus said to the Jews: Why do you harbor evil thoughts in your hearts? These are the words, not of one who raises a question, but of one who knows. The Evangelist makes this clearer when he says: Jesus knew their thoughts. What the Son knows, therefore, is known also by the Father. In this case you are aware that the Son knew. We have testimony elsewhere of the Son's participation in the Father's counsel: For your Father knows what you need before you ask him. Let the Holy Spirit furnish heat to cook the loaves under the ashes. Do in like manner to the passions of your soul, using the heat of the Word. Although your passions, because you have come lately, perhaps, from the land of Egypt, are somewhat intemperate, cover them up and cook them, as it were, under slow heat, lest they be unable to endure a greater heat and thus be half-burned rather than cooked. There are many examples which illustrate the point that what is ill-cooked is displeasing and that what is well-cooked is pleasing. Cherish in your hearts the profound mysteries, lest you entrust to weak and unreliable ears sentiments which are rudely conceived or not well matured. In this way your hearers are likely to take warning and to recoil with horror. But, if they find that these sentiments have a certain maturity, they can derive an element of sweetness from this food of the spirit.

The Lord Jesus has shown you the goodness of a father who knows how to bestow good gifts, in order that you may find it opportune to ask what is good of Him who is good. He has urged us to pray frequently, not in a series of outbursts, but by praying persistently and frequently. It often happens that a long petition is packed with empty phrases and that one which is intermittent is fraught with infelicities. Hence He warns us that, when we plead for leniency for ourselves, we should be conscious that this is the moment especially when we should be generous to others, thus commending our prayer by actual deeds. The Apostle also teaches us that men should pray without wrath or contention, so that our petition may not be characterized by emotional disturbance. He teaches us that we should pray everywhere, although the Saviour says: Go into thy room. But we must understand that the reference here is not to a room surrounded by walls for the shelter of our person. We are, rather, to understand a room within us in which to house our thoughts and our perceptions. This habitation for our prayers is everywhere with us—a secret place known only to God.

You are instructed above all to pray for the people, that is, for all men, for all members of your family, which is a conspicuous sign of mutual love. If you make a petition for yourself, then you pray merely for your own satisfaction. If everyone were thus to make a petition just for himself, he would become, not a petitioner, but an intercessor for favors. We conclude, therefore, that a petition for oneself is restricted to the person petitioning, whereas a petition for all men includes oneself, as you are a part of that number. Hence, great is the recompense wherein all men are accorded the benefits acquired by the prayers of each individual of the group. In this there is no question of presumption. Rather, it is much more the reflection of a humble heart, bestowing benefits more abundantly.

But it is now time to turn our attention to another point which we have made concerning Cain. We have noted that his delay in carrying out his vow was an indication of his negligence and presumption. The petition, in fact should be made early, lest we appear to rely on human arts, that is to say, on the skill of the art of medicine, thus hoping to obtain a remedy from the juices of plants rather than request God's assistance. We should, first of all, flee to Him who has the power to heal the passions of our souls. Men, on the contrary, invert the order of their request for aid by appealing first to men and afterward, when human assistance fails them, their next step is to make to God an appeal for favors.

Having thus disposed of that charge against Cain, let as now discuss another fault in the performance of his sacrifice. He made an offering of the fruit of the ground, whereas he owed to God the first fruit of his crop. In this way he claimed the first fruit for himself and the remainder he left to God. Hence, inasmuch as the soul should be preferred to the body, just as the master should be placed over the servant, the soul's first fruits should take precedence over what the body offers. The first fruit of the soul are the primary emotions which are associated with all good thoughts and acts. Although these emotions come later in time than the first fruits of the body, which include nutrition, growth, sight, hearing, touch, smell, voice—both soul and body have a share in mind and sense—still, as senses, they exist prior to man's acts. To make an offering of thanksgiving to God with pure heart and tongue is in itself an expression of a primary act.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapters 9-10"
