[[commentary]]
quote='''
From the Pharisees themselves therefore the Son of God receives testimony. For it is both more powerful evidence when men confess unwillingly, and a more fatal error when they who deny are left to the consequence of their own assertions. Hence it follows, Who can forgive sins, but God only? Great is the madness of an unbelieving people, who though they have confessed that it is of God alone to forgive sins, believe not God when He forgives sins.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And although we ought not to neglect faith in the history, so as to believe that the body of this paralytic was truly healed, yet recognize the health of the inner man, to whom sins are forgiven. And when the Jews assert that these can be granted by the Lord alone, they surely confess him to be God and by their own judgment betray their unbelief, so that they affirm the work and deny the person. So the Son of God both received from them the testimony of his own work and does not require the support of their voice; for unbelief can confess, it cannot believe. So testimony is not lacking to his divinity; faith is lacking to their salvation. For what the unwilling confess is the stronger for faith, and what is denied by those who are refuted by their own assertions is the more ruinous for guilt. Great therefore is the madness of the faithless people, that when it has confessed that to forgive sins belongs to God alone, it does not believe God when he forgives sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
