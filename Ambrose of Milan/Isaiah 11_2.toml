
[[commentary]]
quote='''
Read Isaiah: see after how many things he placed fear, so as to make fear blameless and good: The spirit, he says, of wisdom and understanding, the spirit of counsel and of power, the spirit of knowledge and of piety, the spirit of the fear of the Lord (Isa. 11:2). After how many things he has placed fear, so that it might have something it can follow! It is formed through wisdom, instructed through understanding, directed by counsel, strengthened by power, governed by knowledge, adorned by piety. Take these things away from the fear of the Lord, and fear is irrational and foolish, one of those: Fightings without, fears within (2 Cor. 7:5); by which Paul too would have been afflicted, had he not had the Lord to console him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
