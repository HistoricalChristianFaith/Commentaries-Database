[[commentary]]
quote='''
And these strong men hold swords in their hands, which they would not refuse for the name of Christ, or with which they distinguish bodily things from spiritual, the shadow from the truth. For the word of God is living and effective, and more piercing than any two-edged sword, and reaching even to the division of soul and spirit, of joints also and marrow, and a discerner of the thoughts and intentions of the heart: and there is no creature invisible in his sight, but all things are naked and open to his eyes (Heb. 4:12 and 13). For the word of God is a twice-sharpened sword. There are also two other swords in the Church, of which it is said: Lord, behold, here are two swords, namely of the ecclesiastical power and of the worldly, to which a false mercy is opposed.

There is a just mercy: but there is also an unjust mercy. Then, in the Law it is written of a certain man: You shall not have pity on him (Deut. 19:13). And in the books of Kingdoms you read that Saul incurred offence for this reason, that he had pity on Agag, the king of the enemies, whom the divine sentence had forbidden to be spared (1 Sam. 15:9). As if someone, moved by the pleading of a robber's children and swayed by the tears of his wife, should think that he ought to be released, in whom the passion for robbery still breathes: will he not hand innocent men over to destruction, who sets free one who is plotting the destruction of many? Certainly, if he holds back the sword, loosens the chains, eases the exile, why does he who could not wrest away the will not snatch away, by whatever milder way he can, the opportunity for robbery? Then, between two, that is, accuser and accused, contending at equal peril of their life, the one if he should not prove his charge, the other if he should not be convicted by the accuser, suppose the judge does not follow what belongs to justice, but, while he pities the accused, condemns the one who proves his case, or, while he favours the accuser who cannot prove his, condemns the innocent: this, then, cannot be called just mercy.

In the Church itself, where it is most fitting to show mercy, the form of justice ought to be kept most of all, lest anyone who has been kept away from the fellowship of communion should extort by the easiness of the priest, with a brief little tear, ready for the occasion, or even with more abundant weeping, the communion which he ought to ask for over a very long time. Does not the priest, when he indulges one unworthy man, provoke very many to the contagion of falling? For easiness of pardon gives an incentive to sin. This has been said so that we may know that mercy must be dispensed to debtors according to the word of God, according to reason: otherwise, let the sword carry out what is its own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
