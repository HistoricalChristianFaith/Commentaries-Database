[[commentary]]
quote='''
But each one ought to guard his gates and doors, so that, when Christ has come and knocked, the ministering powers which go before and run ahead may say: Lift up your gates, you princes, and be lifted up, you eternal gates. Truly princes are those who have ruled themselves well, so that Christ may have entrance into their souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
