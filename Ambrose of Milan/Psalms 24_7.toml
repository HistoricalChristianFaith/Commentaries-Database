[[commentary]]
quote='''
But each one ought to guard his gates and doors, so that, when Christ has come and knocked, the ministering powers which go before and run ahead may say: Lift up your gates, you princes, and be lifted up, you eternal gates. Truly princes are those who have ruled themselves well, so that Christ may have entrance into their souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
We have, then, a door of our soul; we have gates too, of which it is said: Lift up your gates, O princes, and be lifted up, eternal gates, and the King of glory shall enter (Ps. 23 (24):7). There is, then, a heaven too in those in whom there are eternal gates. If you will lift up these gates of your faith, the King of glory will enter in to you, bearing the triumph of his own passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
