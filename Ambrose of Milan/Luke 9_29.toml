[[commentary]]
quote='''
Let us, then, unveil our face, so that, beholding the glory of God with unveiled face, we may be re-formed into the same image. Let us go up the mountain, let us beseech the Word of God to appear to us in his form and beauty, and to be strengthened and to proceed prosperously and to reign. For these too are mysteries and are referred to a higher sense; for according to your capacity the Word is either lessened for you or grows, and unless you climb the summit of a loftier wisdom, wisdom does not appear to you, the knowledge of the mysteries does not appear to you, it does not appear to you how great is the glory, how great the beauty in the Word of God; but the Word of God appears as it were in a kind of body, not having his form nor comeliness, and he appears as a man under a stroke, who could bear our infirmities; he appears to you as a sort of speech born of man, covered with the wrappings of letters, not shining with the power of the Spirit. But if, while you consider the man, you believe him to have been begotten of a virgin, and little by little faith breathes on you that he was born of the Spirit of God, you begin to go up the mountain. If you see him set on the cross triumphing over death, not destroyed; if you see that the earth trembled, the sun fled back, darkness was poured over the eyes of the unbelieving, the tombs were opened, the dead rose again, so that it might be a sign that the Gentile people, which had been dead to God, as though the tombs of its body had been unsealed, rose again when the light of the cross was poured in; if you see this mystery, you have gone up the lofty mountain, you behold the other glory of the Word.

His garments are some below, others above. And perhaps the garments of the Word are the sayings of the Scriptures and, as it were, certain clothings of the divine understanding; for just as he appeared to Peter and John and James in another form and his clothing shone white, so too to the eyes of your mind the sense of the divine readings now grows white. The divine words, therefore, become like snow, the garments of the Word exceedingly white, such as no fuller on earth can make.

Let us seek this fuller, let us seek this snow. We read that Isaiah went up to the fuller's field. Who is this fuller, unless perhaps he who is wont to wash away our sins? Indeed he himself said: if your sins be as scarlet, I will make them white as snow. Who is this fuller, unless he who is wont to offer to the divine Sun the garments of our understanding, the garments of the virtues, with their bodily stains washed away?

I have heard too — that we may take an example from contraries to refute them — that ⟨...⟩ compared the eloquence of two wise men to snow and to bees. I have found too that David said: how sweet are your words to my throat, above honey and the honeycomb to my mouth! And below: your word is a lamp to my feet, O Lord, and a light to my paths. The Word of God is light, the Word of God is snow. The Word of God is also above honey and the honeycomb, because from the divine mouth speech flowed sweeter than honey, and clear words fall after the manner of snow with gentler meanings. Truly this speech alone is to be compared to the snows, which, sent from heaven to the earth, has made fruitful the barren fields of our hearts. That this is not presumed by usurpation but derived from the sequence of the reading, God himself testifies, saying: let my speech be awaited as the rain, and let my words come down as the dew, as the shower upon the grass and as the snow upon the hay.

O that my mind, Lord Jesus, might grow green with the moisture of your rain; O that you would sprinkle my earth with the whiteness of that snow, lest the fields of the body run riot with the over-hasty heat of springtime, but rather that the seeds of the heavenly Word, pressed down by the snowy warmth, may make them fruitful! When snow falls, the birds of the air have nowhere to dwell, and the harvest of wheat abounds more richly than usual.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
