[[commentary]]
quote='''
Flight is not easy for all; difficult too is the course of human life for living creatures in discord upon the earth. But if the order of our action is in accord for you, the prophet will see in us too that one wheel upon the earth, joined to the four living creatures. Ezekiel will see it again, then, for he still sees and flourishes and will flourish (Ezek. 1:15 and 16): he will see, I say, a wheel in the middle of a wheel, gliding upon the earth without stumbling. For the wheel upon the earth is the life of the body fitted to the virtue of the soul and formed, in a coherent course, to the precept of the Gospel. And the wheel in the middle of the wheel is as it were life within life, in that the life of the saints is not out of tune with itself; but such as it was in the earlier age, such let it be also in the following one: or that in this life of the body the practice of eternal life may revolve.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
