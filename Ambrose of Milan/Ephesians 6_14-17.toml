
[[commentary]]
quote='''
What is the sinner's sword but the contrary of the sword of the Holy Spirit? Scripture has taught me of this sword, the Apostle has taught me, saying that we have the breastplate of righteousness and the shield of faith and the helmet of salvation and the sword of the Spirit, which is the word of God. The word of God, then, is the sword of the Holy Spirit; on the contrary, surely, the sword of the most wicked one is an evil word. With this the apostle Peter struck Ananias and Sapphira, as with a sort of blade of his speech; with this sword Paul snatched away the light of his eyes from Elymas, who opposed his discourses, and poured over him the night of blindness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
