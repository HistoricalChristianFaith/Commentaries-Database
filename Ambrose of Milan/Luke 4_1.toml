[[commentary]]
quote='''
Then Jesus was led into the desert by the Spirit, to be tempted by the devil. It is fitting to remember how the first Adam was cast out of paradise into the desert, that you may notice how the second Adam returned from the desert to paradise. For see how the old sentences are untied by their own knots, and the divine benefits restored in their own footsteps. Adam from virgin earth, Christ from a virgin; the one made to the image of God, this one the image of God; the one set above all irrational animals, this one above all living things — through a woman folly, through a virgin wisdom, death through a tree, life through the cross — the one, naked of spiritual things, covered himself with the coverings of a tree; this one, naked of worldly things, did not desire the coverings of a body. Adam in the desert, Christ in the desert; for he knew where he could find the condemned man, whom he would call back to paradise once his error was undone. But since, clothed in worldly coverings, he could not return, and no one can be a dweller in paradise unless he is naked of guilt, he put off the old man and put on the new, so that, since the divine decrees cannot be undone, the person rather than the sentence might be changed.

But since in paradise, without a guide, he lost the road he had received, how could he, without a guide, find again from the desert the road he had lost, where temptations are very many, the striving toward virtue difficult, the slip into error easy? For the nature of virtue is the same as that of the trees of the woods: if they are still small as they lift themselves from earthly things toward things above, while their youth is growing with tender leaves, they are exposed to the venom of a cruel tooth and can easily be either cut down or burned; but if the tree has grounded itself with a deep root and raised itself with the height of its branches, then in vain is the sturdy tree assailed, whether by the bites of wild beasts, or the arms of countrymen, or the storms of the various winds.

Whom, then, was he to appoint as guide against so many enticements of the world, against so many wiles of the devil, when he knew that the wrestling of us is first against flesh and blood, then against powers, against the rulers of the world of this darkness, against the spiritual forces of wickedness which are in the heavenly places? Was he to appoint an angel? He too fell; legions of angels have scarcely profited individuals. Was he to send a seraph? It too came down on earth into the midst of a people with unclean lips, and cleansed the lips of one prophet only, by applying a coal. Another guide had to be sought, whom we might all follow. Who could be so great a guide as to profit all, but he who is above all? Who could set me above the world but he who is greater than the world? Who could be so great a guide as to be able to lead male and female, Jew and Greek, barbarian and Scythian, slave and free with a single leading, but Christ alone, who is all things and in all?

For there are many snares wherever we go: snares in the body, snares in the law; snares are laid by the devil on the pinnacles of temples, on the ledges of walls; snares in philosophers, snares in desires — for the eye of a harlot is the sinner's snare —, a snare in money, a snare in religion, a snare in the pursuit of chastity. For the human mind is tipped by the slightest weights, and is often driven hither and thither by the cunning of the one who persuades. The devil sees some religious man, reverently deferring to God and esteeming what is sacrosanct as capable of no injury: in that very religion he trips him up, making him not believe that the Son of God truly took this flesh of ours, this body of ours, this frailty of our members, though in fact the suffering was the body's, while the divinity remained exempt from injury. Thus from religion comes guilt; every one indeed who denies that Jesus Christ has come in the flesh is not of God. He sees a man whole and untouched in chastity: he persuades him to condemn marriage, so that he may be cast out of the Church and, by the pursuit of chastity, be separated from the chaste body. Another has heard that one God, from whom are all things, and he adores and venerates: the devil lies in wait for him, closes his ears so that he does not hear that one Lord, through whom are all things; so by excessive devotion he drives him to be impious, so that, while he separates the Father from the Son, he confounds the Father and the Son, and thinks that the person is one, not the power. And so, while he does not know the measure of faith, he falls into the misery of unbelief.

How then shall we avoid these snares, so that we too may be able to say: our soul has been rescued like a sparrow from the snare of the hunters; the snare is broken, and we are set free? He does not say: 'I broke the snare'; David did not dare to say this; but rather: our help is in the name of the Lord, to show from where the snare would be loosed, to prophesy that there would come into this life one who would break the snare prepared by the devil's fraud.

But the snare could not better be broken than if he showed the devil some prey, so that, while he hastened to the prey, he might be bound in his own snares, so that I might be able to say: they prepared snares for my feet, and they themselves fell into them. What could the prey be but a body? This fraud, then, had to be practiced on the devil, that the Lord Jesus should take a body, and this body corruptible, a weak body, that he might be crucified out of weakness. For if it had been a spiritual body, he would not have said: the spirit is ready, but the flesh is weak. Hear, then, both voices, of the weak flesh and of the ready spirit: Father, if it is possible, let this cup pass from me: this is the voice of the flesh. But not what I will, but what you will: you have the devotion and the vigor of the spirit. Why do you reject the condescension of the Lord? It is of condescension that he took my body, of condescension that he took my injuries, took my infirmities, which the nature of God certainly could not feel, since even the nature of man has learned to despise them, or to sustain and endure them. And so let us follow Christ according to what is written: you shall walk after the Lord your God and cleave to him. To whom shall I cleave but to Christ, as Paul said: he who cleaves to the Lord is one spirit? So let us follow his footsteps, that we may be able to return from the desert to paradise.

See by what roads we are led back. Now Christ is in the desert; he leads man, instructs, forms, exercises him, anoints him with spiritual oil; when he saw him stronger, he leads him across through sown and fruitful fields, when the Jews complained that his disciples were plucking ears of grain from the crop on the sabbath — for he had already placed his apostles in a cultivated field and in fruitful work — afterwards he set him in paradise at the time of the Passion; for so you have it: when Jesus had said these things, he went across with his disciples over the brook of the cedar, where there was a garden, into which he himself entered with his disciples. For that a garden is better than a fertile field the prophet teaches in the Song of Songs, saying: a garden enclosed is my sister, my bride, a garden enclosed, a fountain sealed; your shoots are a paradise. For that is the pure and spotless virginity of the soul, which is drawn away from faith by no terror of punishments, by no enticements of worldly pleasure, by no love of life. Finally, that man has been called back by the power of the Lord, this Evangelist testifies above the rest, who alone brings in the Lord saying to the thief: amen I say to you, today you shall be with me in paradise.

Jesus, then, full of the Holy Spirit, is driven into the desert: by design, to challenge the devil — for had the one not fought, this one would not have conquered for me —; by mystery, to free that Adam from exile; by example, to show us that the devil envies those who strive toward better things, and that then one must be more on guard, lest weakness of mind desert the grace of the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
