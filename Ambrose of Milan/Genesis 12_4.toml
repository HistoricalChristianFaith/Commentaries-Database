[[commentary]]
quote='''
And Abraham went out, as the Lord had spoken to him. From here the Gentiles bring forth the maxim of the seven wise men, follow God, as their own discovery, though not Abraham only, I say, but even Moses was far earlier, through whom the Law was given, saying: You shall walk after the Lord your God. Abraham went out, then, in whom it was not so much his perfection as the devotion of his soul and the freedom of his mind that went out from the bonds of the body, from the allurements of delight. Indeed you have it thus: Abraham went out, as God had spoken to him. Above you have the Lord saying Go out, in which the open command of one who orders is expressed; here you have: as God had spoken to him. A certain affection, as of conversation, is conveyed; for he did all that had been appointed. Before the deed, then, God tells him, as one bound to obey; after the deed he speaks with him, as with a friend; for he is a friend of God who does what has been commanded. Hence the Lord Jesus too says in his Gospel: You are my friends if you do what I command you. I no longer call you servants. But, as I have said, the progress of the wise man set before us to imitate has been written as a proving, not as perfection. For the mind which fell in the first man is still reforming itself in Abraham, and therefore it gathers itself up by steps and increases.

Hence he also added: and Lot went off with him, that is, turning aside. For this is what the interpretation of the name signifies, because, just as travellers taking an unknown road are often misled by certain paths, so that they turn aside from the straight track, and yet, if they are prudent, they do not go astray, but, though hesitating, gather up their way by looking at the region itself, so too Abraham, though wavering, nevertheless followed the track of truth. He was often led on by a false appearance of goods, but he was not wholly turned aside; for it belongs to the perfect not to bend aside, to the prudent not to turn aside wholly. But he alone never bent aside of whom it is written: Behold, a virgin shall conceive in the womb and bear a son, and you shall call his name Emmanuel: he shall eat butter and honey before he knows or brings forth evil, he shall choose the good, for before the child knows good or evil, he does not trust malice, so as to choose what is good. This Abraham could not do, to choose the good before he knew evil, but he clung to the heavenly precepts so as not to turn aside from the truth. Therefore too he is described as having gone out from Haran at seventy-five years of age, because, with the seventieth number of remission completed, the sense is such that it can be bent. For the delights of these senses bring it about that our mind is not always upright, but sometimes bends itself, so that it hides itself not within the bodily caverns but within the hiding-places of pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 2"
