[[commentary]]
quote='''
Solomon too, under the figure of that woman, sets forth the corruption of this world and teaches that the arts of the harlot must be turned aside from. This is the strange woman, the fornicator, against whom he exhorts you to guard yourself, and not to turn your heart aside to the ways of the world, but to place it in the hand of the Lord, in which is the heart of the king. For he who rules himself, which is worth more than commanding others, has his heart in the hand of God, and God turns it wherever he wills. It is no wonder if he turns it to good, he who is of perfect goodness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
