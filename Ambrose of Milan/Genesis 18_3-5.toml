[[commentary]]
quote='''
Yet it is not only readiness in receiving that is sought, but also the diligence and affection of the one who receives. Let Abraham teach you both. He ran to meet them, he asked first, saying: Lord, if I have found favour before you, do not pass by your servant. Let water be taken and let your feet be washed, and refresh yourselves under the tree. And I will take bread, and eat, and afterwards you shall pass on, since for this you have turned aside to your servant. He saw three and called one Lord; he confesses himself the servant of him alone. Then, turning to the two whom he thought ministers, he longs to offer his service to them too, bound now not by the due right of servitude, but by the kindly name of diligence and by the practice of attendance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
