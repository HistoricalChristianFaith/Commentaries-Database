[[commentary]]
quote='''
That is truly the devil's language, which seeks to cast down the soul of man from the high ground of its good deeds, while he shows at the same time both his weakness and malice, for he can injure no one that does not first cast himself down. For he who forsaking heavenly things pursues earthly, rushes as it were wilfully down the self-sought precipice of a falling life. As soon then as the devil perceived his dart blunted, he who had subdued all men to his own power, began to think he had to deal with more than man. But Satan transforms himself into an angel of light, and often from the Holy Scriptures weaves his mesh for the faithful: hence it follows, It is written, He shall give, &c.

Let not the heretic entrap thee by bringing examples from the Scriptures. The devil makes use of the testimony of the Scriptures not to teach but to deceive.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
At the same time, since the devil saw his weapon blunted, he who had subjected all men to his own power began to judge him more than a man. But the Lord again did not think that even the things which had been prophesied of him were to be done at the devil's pleasure, but, keeping the authority of his own divinity, he met his cunning, so that, since he had held out the example of the Scriptures, he might be conquered by the examples of the Scriptures; for God has power to conquer; for me, Scripture conquers.

Learn here also that Satan transforms himself as if into an angel of light, and often lays a snare for the faithful out of the divine Scriptures themselves. So he makes heretics, so he disembowels faith, so he assails the rights of devotion. Therefore let not the heretic capture you because he can bring forth some examples from the Scriptures, nor let him claim anything for himself because he seems learned. The devil too uses the testimonies of the Scriptures, but not to teach; rather, to ensnare and deceive. He has come to know someone devoted to religion, famous for virtues, very powerful in signs and works: he lays the snare of boasting, to puff up such a man with swelling, so that he does not entrust himself to devotion but trusts to boasting, and does not ascribe it to God but claims it for himself. And therefore the apostles commanded demons not in their own name but in the name of Christ, lest they seem to claim anything for themselves. So Peter heals the paralytic, saying: in the name of Jesus the Nazarene, rise and walk. Learn also from Paul to flee boasting. I know he says a man, whether in the body or out of the body I do not know, God knows, that he was caught up into paradise and heard ineffable words, which it is not lawful for a man to speak. Of such a one I will glory, but of myself I will not glory, except in my infirmities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
