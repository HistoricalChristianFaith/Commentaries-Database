[[commentary]]
quote='''
When, then, they begin to be raised up to everlasting confusion, the saint of the Lord will say: In God we shall be praised all the day, and in your name we shall confess for ever. The rich man is praised in his riches, the voluptuary in his banquets, the fornicator in the night, the powerful man in this life, which has nights; but the saint will be praised not in this life but in God, he who has longed to please the Lord in all things, who can say: The Lord is my strength and my praise. He will be praised all the day, because he acted honourably and did not hide his works and his crimes, but laid them open to the eternal King, walking in the day, not in darkness and hidden places. Hence the Apostle too says: Let us walk honourably as in the day, that is, not in taverns and hovels, not in chambering and impurities, in which the shameless man thinks he is covered by walls so as to be able to escape the knowledge of God, whereas the crimes of all are unveiled before God, and the sins of men cannot be hidden from the divine knowledge. The saint, then, will be praised in the time to come, because he sought not the praise of present things, but the grace of things to come.

See, however, the difference. While he is here, he glories in the Lord; there he will be praised in the Lord; in return for a short time he will receive the reward of eternity. Aquila, however, put: In the Lord we shall glory all the day; Symmachus says: To God we shall sing a hymn through every day; the sense of all agrees, that we should not cease from the praises of God, whether by singing a hymn or by singing together the divine glory at every moment. For he who sings a hymn sings with a pure heart and spiritually, and shuts out every kind of human passion, so that his office may be hindered by no grief, by the bitterness of no pain, nor his disposition be exasperated, but that, singing a hymn to God, he may persevere unmoved and unshaken, like David himself, who says: I will bless the Lord at all times; his praise is always in my mouth, like Job, who, when his sons were lost, all his household slain and his means plundered, said: The Lord gave, the Lord has taken away; blessed be the name of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
