[[commentary]]
quote='''
(in Luc. c. iii.) He therefore names specially two authors of His birth—one who received the promise concerning the kindreds of the people, the other who obtained the oracle concerning the generation of Christ; and though he is later in order of succession is yet first named, inasmuch as it is greater to have received the promise concerning Christ than concerning the Church, which is through Christ; for greater is He who saves than that which is saved.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But why Saint Matthew began to enumerate the generation of Christ from Abraham, while Saint Luke carried it from Christ up to God, seems to need explaining. But first I think we must by no means pass over why Saint Matthew, though he began the order of the generation from Abraham, did not put it thus: 'The book of the generation of Abraham', but: The book of the generation of Jesus Christ, son of David, son of Abraham, and why he named these two above all. For not idly are the most faithful founders of the line chosen, that we may understand that in the very generation of the flesh a spiritual succession is the more sought; for these are the two men to whom the divine promises flowed down.

First Abraham, who before the law of Moses and before the people of the Jews, leaving what was his own and knowing God, earned the testimony of faith, because he believed God and it was reckoned to him for righteousness; who also received an oracle from God, who said to him: Go out from your land and from your kindred and from the house of your father into the land which I will show you, and I will make you into a great nation, and I will bless you and magnify your name, and you will be blessed, and I will bless those who bless you and curse those who curse you, and in you all the tribes of the earth will be blessed. You see, then, that the gatherings of the Gentiles and the assembly of the most holy Church were promised by divine oracle to him first. And therefore he had to be designated founder of the line who first earned the pledge of the Church that was to be established.

David too is rightly himself declared founder of the line, because he received with an oath the answer that Christ would come from him according to the flesh; for so it is written: The Lord swore truth to David, and it will not repent him: Of the fruit of your womb I will set upon my throne; and elsewhere: Once have I sworn by my holiness, if I lie to David; his seed will remain for ever, and his throne as the sun in my sight; and in Chronicles: And it will be, when your days are fulfilled and you sleep with your fathers, I will raise up your seed after you, who will be from your womb, and I will prepare his kingdom. He will build me a house, and I will set up his throne for ever. I will be to him a father, and he will be to me a son, and I will not scatter my mercy from him, as I scattered it from those who were before you. Through Isaiah too the same Lord God revealed the generation of the Lord, saying: A rod will come forth from the root of Jesse and a flower will rise up from the root, and the Spirit of God will rest upon him, the spirit of wisdom and understanding; and below: And there will be the root of Jesse, and he who will rise up to rule the Gentiles; in him the Gentiles will hope; and elsewhere: A child is born to us, a son is given to us, whose rule is upon his shoulders, and his name will be called the angel of great counsel; for I will bring peace upon the princes and salvation to him. Great is his power, and of his peace there is no end, on the throne of David and in his kingdom. In which, in Aquila's translation too, we see that the promise was made not as of a man but of him who was beyond man. For he translated: A child is born to us, a son is given to us, and his measure was made upon his shoulder, and his name will be called wonderful counsellor, my counsellor, strong, mighty, father of the age, prince of peace. His discipline has been fulfilled, and of his peace there is no end upon the throne of David and upon his kingdom.

That all these things fit Christ is marked by evident oracles. Nor could the fruit of the divine power be diverted to the favour of Solomon, who was David's son, whose end is known beyond doubt; for there was an end of Solomon's kingdom and of his peace, as is shown by the readings of Kings. Christ is the one whose kingdom has no end. Then, Solomon ruled over no nations, but Christ gathered the Church from the nations. Lastly, while David was living Solomon was both born and attained the kingdom, but he who is promised is shown to be going to arise after David's death, as you have it: When your days are fulfilled and you sleep with your fathers, I will raise up of your seed one who will be from your womb, and I will prepare his kingdom. He will build me a house, and I will set up his throne for ever. Did Solomon reign for ever, who reigned only forty years? I will be he says to him a father, and he will be to me a son — who is that proper Son of God, but he to whom it was said: You are my Son, today I have begotten you? — And I will not scatter my mercy from him, and I will keep him faithful in my house and in his kingdom for ever? But that Solomon erred so gravely, perhaps for this reason, lest men should err and it be believed that the promise had flowed down to him, we have learned from the series of the divine readings; for he built a temple to the idol Astarte for love of a woman, and the Lord was angry with Solomon. If, then, he both began to reign while David was alive — for so you have it that, when it was announced to David that Solomon was reigning, the king worshipped on his bed and said: Blessed be the Lord God of Israel. Who has given me today of my seed one sitting on my throne, and my eyes see it — if he erred, if he offended, you see that the series of the promise pledged Christ.

And therefore the evangelist chose these two founders of the line: the one who received the promise of the gathering of the peoples, the other who obtained the oracle of the generation of Christ. And therefore, though he is later in the order of succession, he is nevertheless described before Abraham in the Lord's generation, because it is more to have received a promise concerning Christ than concerning the Church, since the Church itself exists through Christ. So the one is prince of the line according to the flesh, the other prince of the line according to the spirit; the one according to the grace of seed, the other according to the faith of the peoples; for he who saves is greater than he who is saved. And therefore he is called son of David: The book of the generation of Jesus Christ, son of David; for he had to be called in the first place the son of him to whom a son was promised, although the Apostle says that Christ was promised to Abraham as well; to Abraham, indeed, were the promises spoken, and to his seed. He does not say: and to seeds, as in many, but as in one: and to your seed, which is Christ, so that to the one the property of generation, to the other the princedom may be assigned. To the one it was granted that Jesus should be called his son; to the other, as to the prince of the family and of the Gentiles, the prerogative is kept that the beginning of the Lord's generation should flow from Abraham; for he who is the author of faith, Scripture too had to declare the author of the divine generation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
