[[commentary]]
quote='''
It is certain that athletes themselves are crowned when they have conquered, not before they conquer. Our wrestling is with the world; conquer the world first before you seek the crown. No one is crowned beforehand unless he has completed the contest. Do those who run the race receive the prize before they have run through the course? How many who were ahead fall at the finish and are cheated of the swiftness of their running! Are you more acceptable to God than Paul? He, the vessel of election, he, the teacher of the Gentiles, never dared to claim a crown for himself in this world. Thus hear him say: I have fought the good contest, I have finished the course, I have kept the faith; as for the rest, there is laid up for me the crown of righteousness, which the Lord will render to me on that day. That Paul who was caught up into the third heaven — who heard the things which it is not lawful for a man to speak, and does not know whether he was caught up in the body or without the body, as he himself has testified —, Paul, then, says that the crown is to be rendered to him on that day: do you insist that it be rendered to you here? Fulfil, then, the time of your contest. Not once only does the athlete wrestle, nor once only does the soldier fight, so as to be able to complete his service; and you too have a wrestling not with one passion only.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
