[[commentary]]
quote='''
But Matthew did not keep silent that these eleven alone met in Galilee. Indeed so you have: But the eleven disciples went into Galilee, to the mountain where Jesus had appointed them, and seeing him they worshiped, but some doubted. To them he gave the power of teaching and baptizing. Mark too writes at the end that he appeared to the eleven disciples as they sat at table, when likewise he commands them the office of preaching throughout the whole world.

Hence I think this more fitting: that the Lord did indeed command the disciples to see him in Galilee, but that he offered himself first to them while they stayed within the closed room through fear, and that afterwards, their minds having been strengthened, those eleven made for Galilee. Or certainly — I find that this too has pleased careful writers — nothing prevents us from saying that there were fewer within the closed room, and very many on the mountain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
