[[commentary]]
quote='''
Yet this is not enough, that someone who is called should come, unless he has the wedding garment, that is, unless he has faith and charity. And therefore he who has not brought peace and charity to the altars of Christ will be taken up by feet and hands and sent into the outer darkness. There will be weeping, and gnashing of teeth. What is the outer darkness? Is there some prison there too, and quarries to be endured? By no means. But whoever are outside the promises of the heavenly commandments are in the outer darkness, because the commandments of God are light, and whoever is without Christ is in darkness, because Christ is the inner light.

So there is neither any gnashing of bodily teeth, nor any perpetual fire of bodily flames, nor is the worm bodily. But these things are said because, just as from much indigestion both fevers and worms are born, so if anyone does not digest his sins by interposing, as it were, a certain sobriety of abstinence, but, mixing sins with sins, contracts as it were a kind of indigestion of old and recent offenses, he will be scorched by his own fire and consumed by his own worms. Hence Isaiah also says: walk in the light of your fire and in the flame which you have kindled. The fire is that which sorrow for sins begets; the worm is so called because the irrational sins of the soul prick the mind and the sense of the guilty man and eat away certain inward parts of the conscience, sins which are born like worms out of each one, as out of the body of the sinner. Indeed the Lord declared this through Isaiah, saying: and they will see the limbs of the men who have transgressed against me; and their worm will not die and their fire will not be quenched.

The gnashing of teeth also betrays the disposition of one who is indignant, because each one repents too late, groans too late, is angry with himself too late, that he has sinned with so obstinate a wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
