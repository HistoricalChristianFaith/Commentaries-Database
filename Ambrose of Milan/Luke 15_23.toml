[[commentary]]
quote='''
The fatted calf too is killed, so that, restored to the fellowship of the mysteries through the grace of the sacrament, he may feast on the flesh of the Lord, rich with spiritual power. For no one ought to take part in the heavenly sacraments unless he has feared God — which is the beginning of wisdom — unless he has either kept or received the spiritual seal, unless he has preached the Lord. And he who has the ring has both the Father and the Son and the Holy Spirit, because God has sealed. Whose image is Christ; and he gave the Spirit as a pledge in our hearts, so that we may know that this is the seal of that ring which is given on the hand, by which the inner places of the heart and the ministries of our deeds are sealed. So we have been sealed, as we also read: believing he says you have been sealed with the Holy Spirit. And well is it the flesh of the calf, because that is a priestly victim, which used to be offered for sins,

that the Son brings in the father as feasting on, to show that our salvation is the Father's food and the redemption of our sins is the Father's joy. And here indeed, if you refer it to the Father, it is because the Son is the victim for sins. The Father delights in the return of the sinner; above, the Son delights in the sheep found, that you may know that the delight of the Father and of the Son is one, one the operation in the foundation of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
