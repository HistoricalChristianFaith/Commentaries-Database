[[commentary]]
quote='''
Indeed no corruption of death, as from other men, but a fountain of eternal life sprang from his wound, as Scripture teaches us, saying: And water shall leap with delight from the fountains of salvation. Water, then, leapt from the wound, that we might drink salvation; all the sinners of the earth shall drink, that they may lay down their sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
