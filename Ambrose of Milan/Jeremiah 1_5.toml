[[commentary]]
quote='''
To show them, however, the weakness and transparency of their objection, though it has no real relation to any truth, divine or human, I will prove to them that people have existed before they were born. Let them show that Jacob had not been appointed and ordained, even before he was born. While yet hidden in the secret chamber of his mother's womb, he supplanted his brother. Let them show that Jeremiah had not likewise been so, before his birth, "Before I formed you in your mother's womb, I knew you; and before you came forth from the belly, I sanctified you, and appointed you for a prophet amongst the nations." … What do you [Arians] mean by your principle that "before he was begotten he did not exist"? Was the Father engaged for some time in conception, so that certain epochs passed away before the Son was begotten?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25204.html'
source_title="Exposition of the Christian Faith 4.9.113, 116"

[[commentary]]
quote='''
But as we understand that generation from the Father, so also, for the completeness of faith, let us understand the generation from Mary, when the womb of the mother is blessed, that virginal womb of Mary, surely, which brought forth for us the Lord Jesus. Of it the Father says through Jeremiah the prophet: before I formed you in the womb I knew you, and before you came forth from your mother's womb I sanctified you. The prophet, therefore, declared a twofold substance in Christ, of divinity and of flesh, the one from the Father, the other from the Virgin, yet in such a way that he was not without his share in his divinity when he was born of the Virgin and was in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"

[[commentary]]
quote='''
Therefore to him in whom the Lord willed that there should be no contagions of an origin of this kind, the Lord says: Before I formed you in your mother's womb, I knew you, and before you came forth from the womb, I sanctified you, and I set you as a prophet among the nations. Who is so great that such great things were conferred on him? Is it Jeremiah? But he certainly was not set as a prophet among the nations, but in Judaea at that time; now, however, he is a prophet among the peoples too, who have believed in the Lord Jesus. See, however, whether it is not said to him who, before he was born of the Virgin, already was, and was always, and was at work even when placed in the womb of Mary, and was so holy that he sanctified his prophets. In him alone both the virginal conception and the birth were without any defilement of mortal origin. For it was fitting that he who was not to have the sin of a bodily fall should feel no natural contagion of generation. Rightly, then, did David tearfully lament in himself the very defilements of nature, that in man the stain should begin before life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 11"
