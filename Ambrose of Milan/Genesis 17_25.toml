[[commentary]]
quote='''
That Ishmael also is circumcised in his thirteenth year has an evident reason: because he who is about to begin to use the knowledge of a woman ought first to cut back in himself the heat of lust, so that he may abstain from superfluous unions and reserve himself only for lawful union.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
