[[commentary]]
quote='''
Therefore it is said to you: Let your presses overflow with wine; therefore it is said: In tribulation you called upon me and I delivered you, and I heard you in the hidden place of the tempest; I proved you at the water of contradiction. For there is in tribulations a certain savage tempest within the breast, when there are fightings without, fears within. There is a water of contradiction, when our thoughts toss as with a kind of surge of the salt sea, and are calmed by no stability of resolve in the depths of our minds. Then there is a tempest in a hidden place, then a water of contradiction, which can be stilled only by the word of Christ, by which he forgives us our sins, according to what he himself deigned to say: Now you are clean because of the word which I have spoken to you. Speak, Lord Jesus: your word is medicine, your word is light, your word is the washing away of our filth, your word is a fountain; you speak, and guilt is washed away.

And since our discourse has been led to the hidden place of the tempest and to the water of contradiction, the Word of God has become all things for us. It became flesh, to save the flesh; it became water, to temper by its grace the water of contradiction and to take away the bitterness of ungodliness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
