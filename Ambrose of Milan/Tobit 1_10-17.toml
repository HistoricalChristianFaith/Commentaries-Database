[[commentary]]
quote='''
After reading the prophetical book which is entitled Tobias, although the Scripture has fully made known to us the virtues of the holy prophet, nevertheless I think I should present to you an epitomized account containing an enumeration of his merits and works, in order that what the Scripture has treated more extensively in a historical way we may describe more concisely, collecting the classes of his virtues as in a sort of summary.

He was a just, merciful, hospitable man; and endowed with this troop of virtues he underwent the misery of captivity, which he bore humbly and patiently, sorrowing for the common injustice rather than for his own, and not complaining that the approbation of his virtues had been of no avail to him, but rather judging that this outrage committed against him was less than the price of his sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 1"
