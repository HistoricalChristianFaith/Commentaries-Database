[[commentary]]
quote='''
I feel sure that the fourth day has come to a close in a wonderful way. How does it happen, then, that many people generally avoid the fourth day and think that it is useless to begin anything in association with a number with which the entire world blazoned forth in a new light? Do they believe that the sun came into being under inauspicious circumstances? And how is it possible for a person to predict good fortune for another, if he himself is unable to choose for himself the day of his own birth? How can they make known the horoscope of a person without knowing anything of his birth? What do we say of the moon which rises on the fourth day? Does not the fourteenth day indicate for us the day of salvation? Is the date on which is celebrated the mystery of the Redemption an occasion for our displeasure? Hence, the demons are responsible for attempts to avoid the number four, for in it their wickedness was destroyed. And so the Gentiles maintain that nothing should be initiated with it, because they know that then for the first time their schemes began to be of no avail. Moreover, the Gentile race had already come into the fold of the Church.

If the moon is at its fourth rising be ‘clear and with undimmed horns,’ it is thought that this is an indication that the remaining days of the month will be serene up to the very end. To think that people are unwilling to start anything on those days which are destined to be followed by calm weather!

But we must in the midst of this discourse of ours be on our guard lest the fourth day should suddenly come to an end. ‘Longer shadows are falling from the mountain-heights,’ as the light becomes dim and the shades of evening grow more dense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
