[[commentary]]
quote='''
In the book of the prophet it is written: "Take to thyself the rod of an almond tree." We ought to consider why the Lord said this to the prophet, for it was not written without a purpose, since in the Pentateuch too we read that the almond rod of Aaron the priest, after being long laid up, blossomed. For the Lord seems to signify by the rod that the prophetic or priestly authority ought to be straightforward, and to advise not so much what is pleasant as what is expedient.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252041.html'
source_title="Letter 41"

[[commentary]]
quote='''
And so He Himself also chose Aaron as priest, that not the will of man but the grace of God should have the chief part in the election of the priest; not the voluntary offering of himself, nor the taking it upon himself, but the vocation from heaven, that he should offer gifts for sins who could be touched for those who sinned, for He Himself, it is said, bears our weakness. No one ought to take this honour upon himself but they are called of God, as was Aaron, and so Christ did not demand but received the priesthood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FEpistle%252063.html'
source_title="Epistle 63"

[[commentary]]
quote='''
There still remains a fourth mystery, which I beg you to receive with calm ears, weighing our mind, not our words; for the kingdom of God is not in word but in power. Adultery was committed, murder was committed. This is what was said to the prophet: Take for yourself a staff of nut-wood. And elsewhere we read of a rod of nut-wood, by which we understand a certain law and the sum of prophecy, which, after the manner of a nut, is bitter outside in the rind, hard in the middle in the shell, and tender and fruitful within. Even if, then, in the history you hear things rather bitter, and in the type you recognize things hard, yet hope for things fruitful in the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 10"
