[[commentary]]
quote='''
And I judged, and seemed to myself to know, that this was true, that this agreed with and befitted divine providence, and that I had been troubled in vain over things on which I ought not to have dwelt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 6"
