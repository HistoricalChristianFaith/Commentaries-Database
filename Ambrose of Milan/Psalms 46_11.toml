[[commentary]]
quote='''
And he repeats, saying: The God of powers is with us, our upholder, the God of Jacob. Repetition is confirmation. Or else it is because God was made with us not only when he was born of the virgin, but also after the resurrection he himself said: Behold, I am with you even to the consummation of the world, to whom be honour and glory, perpetuity, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
