[[commentary]]
quote='''
And they heard the voice of the Lord walking in the garden towards evening. What does "walking" mean in reference to God, who is everywhere? In my opinion God may be said to walk wherever throughout Scripture the presence of God is implied, when we hear that He sees all things and the eyes of the Lord are upon the just. We read, too, that Jesus knew their thoughts and we read: Why do you harbor evil thoughts in your hearts? When we reflect, therefore, on these statements, we have a knowledge of God in the act of walking. The sinner, in fact, had tried to hide away from the sight of God. He wished to conceal himself in his thoughts and was unwilling that his works appear in the light of day.' The just man saw Him face to face, because the mind of the just man is in the presence of God and even converses with Him, as it is written: Judge for the fatherless and defend the widow, said the Lord. When a sinner, therefore, reads these passages from Scripture, he hears the voice of God walking towards evening, so to speak. What does the phrase towards evening mean? Does it not mean that the sinner realizes his sin too late and that the shame which should have forstalled the fault before it occurred was itself too late? While the sinner is physically overcome by passions that affect the soul, he in his errant fashion does not heed, that is to say, does not hear, God, as He in holy Scripture walks in the hearts and minds of each and every one of us. God says: For I will dwell in their midst and I will walk among them and will be their God. Therefore, the dread of divine power returns to the soul when we are eager to hide ourselves. Then, placed as we are by the thought of our sins in the midst of the trees of Paradise where we committed sin, we are discovered to be desirous of concealing ourselves and to be thinking of hidden things which God does not demand of us. But He who is the discerner of our thoughts and intentions of our hearts, extending to the division of soul and spirit, says: Adam, where are you?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 14"
