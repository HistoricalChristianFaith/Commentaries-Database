[[commentary]]
quote='''
And he does well to add, to prove that he was attacked unjustly: because I followed close after righteousness. How great the force of the word in the addition of this syllable, that he said he had "subsecutum" [followed close after] righteousness, not "secutum" [followed]! For he who follows close after is nearer than he who follows, as subpar [nearly equal] is nearer than inpar [unequal], and an heir's coming is named successio [succession] rather than accessio [accession].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
