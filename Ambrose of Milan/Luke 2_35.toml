[[commentary]]
quote='''
Or it shows the wisdom of Mary, that she was not ignorant of the heavenly Majesty. For the word of God is living and strong, and sharper than the sharpest sword. (Heb. 4:12.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And your own soul he says a sword shall pierce: neither the letter nor history teaches that Mary departed from this life by suffering a bodily death; for not the soul but the body is pierced through by a material sword. And so it shows the prudence of Mary, not ignorant of the heavenly mystery. Living indeed is the word of God, and strong, and sharper than any sharpest sword, piercing even to the division of soul and spirit, of joints and marrow; and it searches the thoughts of the heart and the secrets of minds, because all things of minds are naked and open to the Son, whom the secrets of conscience do not escape.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Temptation, then, penetrates the inner parts of man like an arrow, and like the sword of God which searches the inner things. And the sword is the word of God, strong and sharper than every sharpest sword. Of this sword hear one saying to Mary: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed. For by the word of God all things are revealed, in whose sight all things are naked and open. The soul itself is divided, the inner marrows and the thoughts are made manifest, nor, lastly, is there any creature, as Scripture says, that hides itself from his knowledge. Let us sell everything, then, so as to buy the Word, and let us store him up in our inmost parts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Hence Simeon also said to Mary: And a sword shall pierce through your own soul too. For the sword of God is the Word, which, sharper than any sword, pierces even to the divisions of the soul and its thoughts, so that no hidden things escape its knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
While she says this, the Word sent his working as through an opening, not yet face to face; he sent it as a hand. And my womb she says was troubled over him. And I rose to open to my brother. My hands dripped myrrh, my fingers are full of myrrh upon the hands of the bolt. Let us consider what this signifies. First, as I said, God the Word is seen in his works as through an opening, not fully and perfectly. Then love increases and what has been conceived grows, and from his seeds, which the soul has received in a kind of intelligible womb, she desires to see the whole fullness of his divinity dwelling in him bodily, as we read. She rose to see that Word of God more closely. And in this very thing her advance is signified, that she rose through vigour and virtue. For by the presence of the Word the soul drew in virtue, just as the presence of Mary, when she was heavy with child, so instructed John, placed in the womb, that he leapt in the womb and exulted, recognizing the presence of the Lord. She rose to open, and her works and deeds were mortified to the world. For such ought the soul to be which is to receive the Word, that it die to the world and be buried together in Christ; for so is Christ found, and such a lodging he seeks for himself. Then the very ministers of her workings, that is, the hands and fingers by which Christ is grasped, are mortified; these fingers we can take to be the works, the prominent parts as it were, of our deeds. And so, as if from her embrace, when she was already spreading out her intelligible hands and fingers to grasp the Word, the devout soul says that it had passed by her, but not yet passed through her. And this marks an advance, when the Word of God passes by and passes through the soul, because it is written: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed. Here she is still passed by, not passed through; like Mary, she is perhaps passed through in the later verses, where the Lord Jesus is set like a seal in her midst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"
