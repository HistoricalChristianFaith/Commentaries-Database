[[commentary]]
quote='''
Or it shows the wisdom of Mary, that she was not ignorant of the heavenly Majesty. For the word of God is living and strong, and sharper than the sharpest sword. (Heb. 4:12.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And your own soul he says a sword shall pierce: neither the letter nor history teaches that Mary departed from this life by suffering a bodily death; for not the soul but the body is pierced through by a material sword. And so it shows the prudence of Mary, not ignorant of the heavenly mystery. Living indeed is the word of God, and strong, and sharper than any sharpest sword, piercing even to the division of soul and spirit, of joints and marrow; and it searches the thoughts of the heart and the secrets of minds, because all things of minds are naked and open to the Son, whom the secrets of conscience do not escape.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
