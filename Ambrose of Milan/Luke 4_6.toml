[[commentary]]
quote='''
But how is it that here the devil gives power, and elsewhere you read that all power is from God? Can anyone serve two masters or receive power from two? Is it then a contradiction? Not at all. But see that all things are from God. For the world is not without God, because the world too was made through him; but though it was made by God, yet its works are evil, because the world is set in the evil one; and the ordering of the world is from God, the works of the world from evil. So too the ordering of powers is from God, the ambition for power from evil. Finally there is no power he says except from God, and those that are, are ordained by God: not given, but ordained; and he who resists the power of God he says resists the ordinance. Here too, though the devil says that he gives power, yet he does not deny that all those things have been permitted him for a time. And so he who permitted it ordained it, and it is not the power that is evil, but the one who uses the power evilly. Finally: Do you wish not to fear the power? Do good, and you will have praise from it. So it is not power that is evil, but ambition. Finally, so far is the ordering of power from God, that he who uses power well is God's minister. Of God he says he is the minister to you for good. So the fault is not in the office at all, but in the minister; nor can the ordinance of God displease, but the conduct of the one who administers it. For, to draw an example from heavenly things down to earthly ones, the emperor gives an honor and has praise. But if anyone uses the honor badly, the fault is not the emperor's but the judge's. Crimes have their own culprit, since it is not the power but his own service that entangles each one.

What then? Is it good to use power, to be eager for honor? Good, if it is conferred, not if it is seized. Yet distinguish this very good. For one practice is good in the world, another belongs to perfect virtue; for it is good that the pursuit of knowing the divinity be hindered by no occupations. For even if there are many goods, yet eternal life is one. But this is eternal life, that they may know you, the only true God, and him whom you have sent, Jesus Christ. And therefore the greatest fruit is that of eternal life, and God alone is the rewarder of eternal life: let us adore only our God and Lord and serve him alone, that he alone may reward us with the most ample fruit; let us flee all things that lie subject to the devil's power, lest, like an evil tyrant, he use the cruelty of the power he has received against those whom he finds within his kingdom.

So power is not from the devil, but it is nevertheless exposed to the snares of the devil. Nor yet is the ordering of powers evil on that account, because the powers are exposed to evil; for it is good to seek God, but a certain winding and error creeps into the very search. For if the inquirer is turned into sacrilege by a perverse interpretation, the offense of the seeker turns out worse than if he had not sought. Yet the fault is not the inquiry's but the inquirer's, nor is it the inquiry that is exposed to evil, but the disposition of the seeker. But if he who seeks God is often tempted because of the frailty of the flesh and the narrowness of the mind, how much more exposed is he who seeks the world! And ambition is all the more pernicious for this very reason, that it is a kind of flattering little matchmaker of dignities; and often those whom no vices delight, whom no luxury could move, no avarice undermine, ambition makes criminal. For it has a public grace and a private crime, and, in order to lord it over others, it first serves. It bows in compliance in order to be presented with honor, and, while it wishes to be loftier, it becomes more abject, since in the power itself that which excels is another's; for it commands the laws, but is a slave to itself.

Someone will perhaps say that only he who has done evil fears; yet he who sails the sea fears more, and on the other hand one who stands on the immovable station of the land is not wont to fear shipwreck; but if he embarks on the mobile element, he becomes exposed to more frequent dangers. Flee, then, the sea of the world: you will not fear shipwreck. Even if the blasts of blowing winds often beat the tops of trees, yet when the roots are firm there is no fall; but at sea, when the winds rage, even if there is not shipwreck for all, yet there is danger for all. So too, against the adverse blasts of spiritual wickedness no one is safe, whether on the sand or on the open sea, and the ships of Tarshish are often shattered by a violent wind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
