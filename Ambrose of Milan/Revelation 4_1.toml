[[commentary]]
quote='''
Shake off your sleep, then, that you may knock at the door of Christ, which Paul too begs to have opened to him, beseeching that he may be helped not only by his own prayers but also by those of the people, so that a door may be opened to him to speak the mystery of Christ. And perhaps that is the door which John saw opened; for he saw and said: after these things I saw, and behold, a door opened in heaven, and the first voice which I heard, as of a trumpet speaking with me and saying: come up hither, and I will show you the things that must come to pass. The door, then, was opened to John, the door was opened to Paul, so that he might receive for us loaves to eat. For he persevered, knocking at the door in season, out of season, so that he might refresh with the abundance of heavenly nourishment the nations, wearied by the toil of the world's road.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
