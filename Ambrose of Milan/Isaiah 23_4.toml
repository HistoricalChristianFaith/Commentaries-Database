[[commentary]]
quote='''
Therefore, after being so often ploughed by returning merchants, "Be ashamed, O Sidon, has said the sea." This is the voice of the fatigued element, as it were, saying, "Be ashamed, Sidon"; that is: Merchant, you accuse my waves although you yourself are more restless than they. Blush indeed for shame since you are not disturbed by peril. More modest are the winds than your desires. They have their rests; never do your cravings for gain take holiday. Even when the weather is quiet, never are your ships quiet. The water is churned under the oar when it is at rest from the blast. "I have not been in labor," it says, "nor have I reared, nor have I nourished up young men." Why do they disquiet me whom I do not know, whom I do not acknowledge?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting 19.71"

[[commentary]]
quote='''
But this is far from the accepted opinion. As a matter of fact, the farmer cleaves the earth ‘with deep-driven plough’; ‘stripped he ploughs, stripped he sows’; stripped in the glowing ‘heat he thrashes on the floor the parched ears.’ The merchant, impatient when the east winds are blowing, ploughs the sea often when the course is unsafe. Insolent and rash men such as these are condemned by the Prophet, who says: ‘Be thou ashamed, O Sidon, the sea speaketh,’ that is to say, if dangers do not move you, then shame can check and modesty confound you. ‘Be thou ashamed, O Sidon,’ in which there is no place for virtue, no care for safety, no young men exercised in arms and ready to fight in defense of their country. They are anxiously and entirely preoccupied with gain and the benefits derived from commerce. ‘What the merchant sows, so does he reap.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
