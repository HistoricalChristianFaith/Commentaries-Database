[[commentary]]
quote='''
A certain man had two sons, and the younger said to him: give me the portion of the substance.

You see that the divine patrimony is given to those who ask, and do not think it the father's fault that he gave to the younger. No age is weak for the kingdom of God, nor is faith weighed down by years. He certainly judged himself fit, he who asked. And would that he had not withdrawn from his father: he would not have known the hindrance of age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
