[[commentary]]
quote='''
Things new and old, my brother, I have kept for you. Who will give you as a brother, sucking the breasts of my mother? Finding you outside, I will kiss you, and indeed they will not despise me. I will take you up and bring you into the house of my mother, and into the secret place of her who conceived me; there you will teach me. Having, then, instruction in the new and the old Scriptures, and feeling that she is not to be despised, she holds the Word not only by prayers in the secret of the heart, but also by the voices of the psalm-singing choir, as if she kisses him with certain kisses of grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
