[[commentary]]
quote='''
And he worshipped seven times on the ground. What does this mean? The Law says: You shall worship the Lord your God and serve him alone, and here he worships an intemperate man, an angry man, one threatening the fratricidal outrage. Or did he worship that earth, clotted with human blood, steeped in the poisons of serpents, or wretched with starved gravel, or bristling with hard and rough rocks? What, too, does it mean that he worshipped seven times? The answer would stick fast, were it not that this comes to mind: that when Peter asked in the Gospel: If my brother sins against me, how often shall I forgive him? Up to seven times? the Lord Jesus answered: Not only seven times, but even seventy times seven. This, then, is what the holy patriarch signifies in the prophetic spirit, looking toward him who was to come, who would command that pardon be granted to a brother not only up to seven times but even up to seventy times seven, so that Esau, approached out of regard for him, might remit to his brother the injury which he thought he had received, and, though wronged, might return to friendship, because the Lord Jesus was to take on flesh and come to earth for this very reason, that he might give us a manifold pardon of our offences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 6"
