[[commentary]]
quote='''
So he gave not money, but he gave health. How much better it is to have health without money, than money without health! The lame man rose; he had not hoped for that: he received no money; though he had hoped for that. But riches are hardly to be found among the saints of the Lord, so as to become objects of contempt to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FON%2520THE%2520DUTIES%2520OF%2520THE%2520CLERGY%2FBook%25202.html'
source_title="On the Duties of the Clergy, Book 2"

[[commentary]]
quote='''
Not so the apostle Peter, who, the first to carry out the Lord's sentence, in order to show that the Lord's commands had not been poured out in vain, when he was asked by a poor man to bestow some money on him, said: silver and gold I have none. He glories that he has no silver and gold; is it a shame to you to have as yet less than you desire? There is, then, a glorious poverty too, because there is also a blessed poverty, as it is written: blessed are the poor in spirit; yet Peter glories not so much in this, that he has no silver and gold, as in this, that he keeps the command of the Lord, who enjoined: do not possess gold; that is to say: you see that I am a disciple of Christ, and do you ask gold of me? He has given us something else far more precious than gold, that we should work in his name. So I do not have what he did not give, but what he gave I have: in the name of the Lord Jesus rise and walk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
What then he should lend, tell me, Holy David! I have brought witness against myself unless you help me. Peter said, Silver and gold I have none. Was he then not just? Explain to me then, what he should lend. For you have said: Blessed is the man that showeth mercy and lendeth: he shall order his words with judgment. I have found what the just man lends. But let Peter, moreover, teach me himself also what he may lend, who said to the helpless man looking earnestly at him and John: Silver and gold I have none. Will you then give nothing to the poor man, apostle? But you do give, and you give more than others, you give to the helpless man what others cannot give, you give to the helpless man that after receiving which he cannot lack, you give to the helpless man what even the rich long to receive, you give to the helpless man what those who have that silver and gold cannot bestow, because greed hinders them. You give to the helpless man, you who make him richer than the rich. You have moved my heart, I long for this gift of thine. Tell, I beseech, what you give. Do not keep me long in suspense; I desire to seek if you pay quickly. But you did pay quickly; you did not put off the needy, you did not despise the prayer of the poor, you did not make him despair longer, you did not go empty up to the temple, saying: Silver and gold I have none. Not they alone go up with full hands who have gold and silver; the poor man also does not go up empty, nor did Peter go up empty because he had not gold and silver. Let us hear what the poor man gives. But what I have, he said, I give thee. In the name of Jesus of Nazareth, arise and walk. O poverty greatly to be desired, O richer want! He was lame to whom the rich gave; one poor man gave, and straightway he who was lame was made whole.

The just man therefore has what he may lend, he has even silver which he may lend: he lends his words. This is the just man's silver, for the words of the Lord are pure words, silver tried by the fire, purged of earth, refined seven times.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 18"
