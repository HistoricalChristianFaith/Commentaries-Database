[[commentary]]
quote='''
I came to send fire upon the earth, and what do I will but that it be already kindled? I have a baptism to be baptized with, and how I am straitened until it is perfected?

In what precedes he willed that we keep watch, awaiting at every moment the coming of the Lord Savior, lest while someone grows slack and neglects, putting off his works from day to day, he be overtaken by the day of the coming judgment or by his own death and lose the merit of his commendation. And that indeed is a general form of precept for all, but the course of the following example seems to be set forth for the stewards, that is, for the priests, that they may know that a heavy penalty must be undergone by them in the future, if, intent on worldly delights, they have neglected to govern the Lord's household and the people entrusted to them.

But since the progress is slight and the grace of merits small in being called back from error by fear of punishment, and greater is the prerogative of charity and love, for this reason the Lord sharpens our zeal to win his favor and inflames us with the desire of acquiring divinity, saying: I came to send fire upon the earth, surely not that fire which consumes good things, but the author of good will, which improves the golden vessels of the Lord's house, but consumes hay and stubble. And that divine fire burns up all worldly things, grown hard through the pleasure of the world, and the work of perishing flesh, the fire which blazed in the bones of the prophets, as holy Jeremiah says: for it became like a burning fire blazing in my bones. For there is the fire of the Lord, of which it has been said: a fire will burn before him. And the Lord himself also is fire, as he himself said: I am a fire burning and not consuming; for the fire of the Lord is eternal light, with which fire those lamps are lit of which he spoke above: let your loins be girded and your lamps burning. And therefore, since the day of this life is night, a lamp is necessary. Ammaus and Cleopas also testify that this fire was sent into them by the Lord, saying: was not our heart burning on the way, when he opened the Scriptures to us? Clearly therefore they taught what is the working of this fire, which illuminates the secrets of the heart. Perhaps for this reason the Lord will come in fire, that at the time of the resurrection he may consume all vices, and by his sight fulfil the desires of each, and kindle the light of merits and of mysteries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Good, then, is love, having wings of burning fire, which flies through the breasts and hearts of the saints and burns up whatever is material and earthly, but proves whatever is pure, and makes better by its fire whatever it has touched. This fire the Lord Jesus sent upon the earth, and faith shone forth, devotion was kindled, love was lit up, justice shone out. With this fire he set the heart of his apostles aflame, as Cleopas testifies, saying: Was not our heart burning within us, while he opened the Scriptures? The wings of fire, then, are the flames of divine Scripture. In fact he opened the Scriptures, and fire went out and pierced the hearts of the hearers. And truly they are wings of fire, because the words of the Lord are pure words, silver tried by fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
