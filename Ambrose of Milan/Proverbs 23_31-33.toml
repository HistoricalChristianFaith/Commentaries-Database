[[commentary]]
quote='''
Give ear, men! He who desires association with such a serpent may be likened to one who seeks occasion to have adulterous relations with another man’s wife. It can be said that he has the very traits of a serpent. He hastens to the viper who embraces him in the devious ways of lubricity, not in the righteous ways of love. He hastens to one who takes up again his poison like the viper and who is said to consume again the poison, once the act of copulation has been completed. The adulterer is like a viper. Hence Solomon says that when a man is intoxicated his passions are aroused. His body is swollen as if bitten by a snake and his poison is spread abroad like a basilisk’s. That you may realize that he has spoken of an adulterer, he added these words: ‘Thy eyes shall behold strange women and thy mouth shall utter perverse things.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
