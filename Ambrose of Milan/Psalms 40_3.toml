[[commentary]]
quote='''
To me, then, as I waited, you came at last, Lord Jesus; you directed my steps in the Gospel; you put into my mouth a new song, which is the New Testament. Rejoicing, we now sing a hymn to our God, because we have come to know the precepts of new virtues: that we should leave all that is ours to follow Christ, and love our enemies. We have also drunk in new ways of life, so that we offer prayer to the Lord for those who persecute us; see, we bless those who curse us; we do not know how to boast of our works or to hide our sins; after the manner of the angels we even refuse marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
