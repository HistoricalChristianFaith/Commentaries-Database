[[commentary]]
quote='''
The Lord wishing to save sinners shows Himself to be God, by His knowledge of the secret thoughts; as it follows, But that ye may know.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But to those making false charges he says: Why do you think evil things in your hearts? Who says this? The great priest. He saw leprosy in the hearts of the Jews; he shows them to be worse than the leper. The one, cleansed, was bidden to offer himself to the priest; these the priest rejects, lest their leprosy should defile others too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
