[[commentary]]
quote='''
Nor did his faith deceive holy David, but even in the offence itself he earned the grace of the divine compassion. For he who had proposed to exercise death in the land for three days did not let even one day pass, but at the hour of the midday meal he gladly granted pardon, and, to use the word of Scripture, he repented over the evil. See how Scripture exhorts you not to shun penitence either, if you follow God, whom you ought to follow. He did well to add "over the evil", because every vengeance seems harsh. Therefore the day of judgement too is called an evil day, from which he is blessed who is delivered by God, as it is written: In the evil day the Lord will deliver him. And the Lord, it says, told the angel to spare. But see that, when the Lord wishes to pardon, he gives the grace and the confidence to entreat. And David saw the angel striking and said: Behold, it is I. I have sinned, and I the shepherd have done evil; and these in this flock, what have they done? Let your hand be upon me and upon my father's house. If the Lord had commanded the angel to spare, how was the angel still striking, unless because the Lord, even though he wishes to pardon, wishes to be asked, and works so that he is asked? Nor would the man have seen the angel striking, had the Lord not revealed the angel to his eyes. Whence Elisha too says: Lord, open now the eyes of this boy, that he may see; and the eyes of his boy were opened, and he saw the mountain filled with horses and chariots round about the prophet. Nor let it trouble you that the person of a little servant is meaner than that of a prophet or a king, because the sight of horses and chariots too is meaner than the holiness of angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
