[[commentary]]
quote='''
He invites the poor, the weak, and the blind, to show that weakness of body shuts out no one from the kingdom of heaven, and that he is guilty of fewer sins who lacks the incitement to sin; or that the infirmities of sin are forgiven through the mercy of God. Therefore he sends to the streets, that from the broader ways they may come to the narrow way.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so, after the supine disdain of the rich, he betook himself to the Gentiles; he bids the good and the bad come in, to increase the good, to change the disposition of the bad for the better, that what was read today might be fulfilled: then wolves and lambs will feed together. He invites the poor, the weak, the blind, by which we are shown either that no weakness of body shuts anyone out of the kingdom, and that he sins more rarely who lacks the enticement to sin, or that the infirmity of sins is remitted through the mercy of the Lord, so that he who has been redeemed from crime, not by works but by faith, if he glories, may glory in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
