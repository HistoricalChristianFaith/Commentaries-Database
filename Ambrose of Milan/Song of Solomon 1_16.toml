[[commentary]]
quote='''
Behold, she says, my kinsman is fair, and indeed beautiful. Our reclining-place is shaded, the beams of our houses are cedars, our panelled ceilings are cypresses. The Church praises the beauty of the bridegroom, whom each one praises more with silent affection, and the faithful interpreter of the mysteries proclaims him more by keeping silent. For he who divulges secrets diminishes the beauty of Christ; therefore let no one cast his pearls before swine, lest he cause the precious ornaments to be trampled. Not, then, in the tabernacle of the talkative and the chatterer, since in much speaking sin is committed, but in that of a serious man, who is sparing of speech and not intemperate in talk, and who by sobriety of words avoids the drunkenness of loquacity, does Christ recline his head.

And rightly she indicates a shaded reclining-place; because the power of the Most High overshadows those placed in the Church. With this shade David asked to be protected, that the sun might not burn him by day, nor the moon by night (Ps. 120 (121):6). This shade spiritual grace provides for those who flee the scorching heats of this world and the summer heat of the world. Shaded, then, is the reclining-place of Christ and the Church, on whom that eternal rest of God the Father breathes. In this shade, then, let us rest, wearied by the heats of our sins; if lust has scorched any, let the cross of the Lord cool them, on which he reclined himself that he might take up our debts. If guilt has wearied any, let Jesus receive them into his lap and cherish them with a soft embrace; whence I dare to say that the flesh of Christ is the reclining-place of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
