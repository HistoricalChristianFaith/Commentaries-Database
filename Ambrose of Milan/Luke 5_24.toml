[[commentary]]
quote='''
This bed which he is ordered to take up, what is it other than that the human body is ordered to be lifted up? It is the bed which is washed by David every night, the bed of pain, on which our soul lay sick with the heavy torment of conscience. But if anyone conducts himself according to the precepts of Christ, it is no longer a bed of pain but of rest. For by the compassion of the Lord what was death has begun to be rest, since he turned for us the sleep of death into the grace of delight. And he is bidden not only to lift his bed but also to return to his own house, that is, to go back to paradise; for that is the true house, which first received man, lost not by right but by fraud. Rightly then is the house restored, since he had come who should abolish the bond of fraud and restore the right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
