[[commentary]]
quote='''
And so at once the Lord gave testimony to his faith, saying: I am your God, who brought you out of the region of the Chaldaeans, to give you this land, that you might be its heir. And because he had laid aside the pursuits of the Chaldaeans, Abraham asks: How he says shall I understand that I shall be its heir? That is: I have already rejected the divinations of the magi; teach me how I may know that I shall be heir of that land. He who asks how he may know does not doubt that he can know when God makes it manifest, but wishes to perceive the manner of acquiring the knowledge. For in the Gospel too, when Mary had heard from the angel that as a virgin she would bear a son, she answered: How shall this be, since I have not known a man? And rightly she answered, that is: since what belongs to nature is not at hand, because she who has not been joined to a man does not usually give birth, I ask how, beyond the ordinances of nature, I can bring forth as a virgin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
