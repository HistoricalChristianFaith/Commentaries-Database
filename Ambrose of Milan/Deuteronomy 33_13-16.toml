[[commentary]]
quote='''
Indeed Moses too, when he was about to complete the course of this life, in blessing the tribe of Joseph was surely blessing not that Joseph, already dead, but Christ, as you have it written of Joseph: from the blessing of the Lord is his land, from the bounds of heaven and from the dew and from the deeps of the springs below, and according to the season, the yield of the sun's course, and from the months as they meet, and from the top of the mountains from the beginning, and from the top of the everlasting hills, and at the season of the fullness of the earth; and from him who was seen in the bush may it come upon the head of Joseph and upon his crown. Honoured among his brothers. The firstborn of a bull is his beauty, the horns of a unicorn. With them he will toss the nations together, to the end of the earth. These are the myriads of Ephraim and these the thousands of Manasseh.

The blessing is the same, which holds all the fullness of heavenly and earthly things and the special grace of Christ, who, seen in the bush, said to Moses himself: loose the sandal from your feet; who is God over all, because he is the head of the body, the Church, he who is the beginning, the firstborn from the dead, that in all things he himself may hold the primacy, since in him it pleased all fullness to dwell. And therefore to him alone the prerogative of this blessing is granted, from the summit of heaven to the end of the earth. For he is before all, in whom all things hold together, who also through the blood of his cross brought all things to peace, whether those on earth or those in heaven. Bearing his type, holy Joseph is beautifully blessed, that he may be honoured among his brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"
