[[commentary]]
quote='''
He ordered the eldest to be chosen. But he, laughing: 'Rightly you keep the order of nature. But why do you think that the law of God must be profaned? For devotion, indeed, we are all the eldest; yet I rejoice that it has begun with me. What do you seek, tyrant? I confess that we serve the most high God. And you teach us what we ought to do. If with such pertinacity you wish to wring the truth from us, why should we not think that we must hold it with all our strength?' Why say more? Kinds of various punishments are applied. But devotion conquered the fury of savagery: the soul was driven out, not religion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
