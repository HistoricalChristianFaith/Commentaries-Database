[[commentary]]
quote='''
David entered the house of Abimelech the priest; but even with the danger of death set before him, the mind of the holy priest does not refuse the guest, does not turn away the exile. So great is the grace of hospitality, that we willingly transfer to ourselves the dangers of others.

But this is moral in the history and prophetic in the mystery: that not even when the destruction of future death was foreseen did the devout priests exclude that true David from the hospitality of their mind. And Christ is taught not only to be about to find hospitality in the house of each prophet, but also, by a figure, to be about to take the spoils and weapons of spiritual wickedness; for he who receives Christ in hospitality despoils that intelligible Goliath of his own weapons.

But what is clearer than that in the house of Abimelech David asked for five loaves and received one, the type showing that now not by the five books but by the body of Christ food would be prepared for the faithful, so that Christ would take up a body, lest any of the faithful should hunger? Nor is the figure of Doeg empty, who was keeper of the mules, because no one else but the keeper of an unfruitful herd would fulfil the type of Judas the traitor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
