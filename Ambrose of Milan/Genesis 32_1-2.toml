[[commentary]]
quote='''
For when Jacob was fleeing his brother and wandering unaccompanied through the deserts, he fell asleep, and rising he saw there a multitude of the heavenly host, and said: This place is called the camps of the angels. It was not enough to call it a camp, but camps, such as would suit so great a multitude. You see, then, that he thought himself alone, and the camps of the heavenly army were following him, just as the rock, as it is written, followed our fathers in Moses' time, lest they should thirst in the desert.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
These things were approved to such a degree that the angels of God came to meet holy Jacob as he set out. In short, he saw the camp of God drawing near and said: This is the camp of God; for divine protection is wont to be at hand for the perfect and the faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 6"
