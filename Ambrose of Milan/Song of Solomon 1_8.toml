[[commentary]]
quote='''
Now, since you behold both lions and elephants subject to you, recall to mind, man, that the saying ‘know thyself’ is not something emanating from Pythian Apollo, but from Solomon, who says: ‘If thou know not thyself, fairest among women.’ Furthermore, long before this time Moses wrote in Deuteronomy: ‘Keep thyself.’ The Law says: ‘Man, keep thyself.’ And the Prophet says: ‘If you know not thyself.’ To whom does he say these words? He adds: ‘Fairest among women.’

What constitutes the beautiful among women if not the soul, an outstanding attribute in both sexes? Not without reason is the soul comely, since it longs, not for the things of earth, but for those of heaven; not for the corruptible, but for the incorruptible, the beauty of which is not liable to perish. All corporeal things, on the other hand, suffer decay either in the march of time or because of the inroads of disease. ‘Keep thyself,’ says Moses, in that in which you form a totality—that in which the better part of you consists. Hence, the Lord explained your nature when He said: ‘Beware of false prophets,’ for they cause your soul to weaken and your mind to totter. Thus, you are not flesh alone. What is flesh without the guidance of the soul and the vigor of the mind? We put on the garment of flesh today and tomorrow it is laid aside. The flesh is temporal, whereas the soul is lasting. Like a garment for the body, such is flesh for the soul. You are not, therefore, a garment, but one who puts on a garment for use. And so you are told to ‘strip off the old man with his deeds and put on the new’—you who are renewed not in the quality of the body, but in the spirit and affirmation of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
To her the Word of God replied: unless you know yourself, comely one among women. You who complain that you have been left: unless you know yourself, unless you repent of your fall, unless you give proof of the earnestness of your devotion, unless your faith and sincerity increase, your complaint will profit nothing. Or thus: unless you know yourself, that you are comely, unless you preserve the beauty of your nature, and the allurements of the body do not sink you nor its hindrances hold you back, the nobility of a better creation will avail you nothing.

Know yourself, then, and the beauty of your nature, and go out as one whose feet are freed from bonds and laid bare to a naked footstep, so that you do not feel the coverings of the flesh, so that bodily bonds do not entangle the footstep of your mind, so that your foot may appear beautiful. For such are those who are chosen by the Lord to proclaim the kingdom of heaven, of whom it was said: how beautiful are the feet of those who bring good tidings of peace! Such was Moses, to whom it is said: loose the shoes from your feet, so that, as he was about to call the people to the kingdom of God, he might first lay aside the cast-off garments of the flesh and walk with bare spirit and with the footstep of the mind. This, then, is what he says: go out in the heels of the flocks and pasture your kids in the tents of the shepherds, because by the flocks we understand a kingdom, since it belongs to power to preside over flocks. And each one presides over himself with a certain royal power, if he restrains in himself the luxuries of the body and brings his flesh into subjection. And therefore it was said: the kingdom of God is within you. Hence he fittingly says to the soul: go out, that is, go out from slavery, go out from the rule and dominion of the flesh, and go out not in the flesh but in the spirit, go out to the governing of power. And therefore he added: pasture your kids, rule those things that are on your left; for if they are not ruled, they easily slip. Restrain the wantonness, the lasciviousness of your body and its irrational luxury, tame its fickle motions, pasture them not in bodily tents but in the tents of the shepherds, who know how to rule a flock. For lovely are the tents of Israel, like shady groves above a river, in which the soul, placed as though in readiness for battle, wages a good warfare, spies out hostile incursions, and seeks victory by the toil of virtue, so that she can be compared to that mare which is Solomon's, swift for running, apt for bearing, since fruitfulness of soul is desired and sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Unless you know yourself, O beautiful among women. "Know yourself, O man" is said to your soul, unless you have known yourself fair among women. Know yourself, O soul, that you are not of earth, not of clay, because God breathed into you and made you a living soul. You are a magnificent work, formed by the breath of God: Attend to yourself, as the Law says, that is, to your soul: let not worldly and earthly things hold you, nor earthly things delay you. Hasten with all your intention to him by whose breath you subsist: A great thing, he says, is man, and precious is a merciful man: but a faithful man it is a task to find (Prov. 20:6). Learn, O man, where you are great and precious. The earth shows you to be vile, but virtue makes you glorious, faith rare, the image precious. For where is anything so precious as the image of God? which ought first to pour faith into you, so that a certain likeness of the author may shine in your heart, lest he who questions your mind should fail to recognize the author. Or is anything so precious as humility, so that, looking closely at the nature of body and soul, you subject yourself in the one and recognize yourself in the other? The allurement of the flesh, prone to vice, urges mercy; because what you bestow on another you pay to yourself: whatever proceeds from you runs back into you, and whatever you do, you pay to yourself: and whatever good you do profits you. The vigour of a living soul, the sense of reason, capable of understanding and judgment, so that it may seem a worthy house for so great an inhabitant, should not lose the prerogative of its nature. Unless you know yourself, O beautiful among women. You who complain that you have been forsaken: unless you know yourself, unless you repent of your fall, unless you prove the intention of devotion, unless your faith and sincerity increase, your complaint will profit nothing. Or thus: unless you know yourself, that you are beautiful, unless you keep the beauty of your nature, and the allurements of the body do not sink you, nor hindrances hold you back, the nobility of a better creation will avail you nothing.

Know yourself, therefore, and the beauty of your nature, and go out as one freed from the bonds of the feet, and stretched forth with bare footstep, so that you do not feel the coverings of the flesh: let not bodily bonds entangle the footstep of your mind, so that your foot may appear beautiful. For such are those who are chosen by the Lord to announce the kingdom of heaven, of whom it is said: How beautiful are the feet of those who bring the good news of peace (Isa. 52:7). Such was Moses, to whom it is said: Loose the shoe from your feet (Exod. 3:5); so that he who was to go forth to call the people to the kingdom of God might first cast away the hides of the flesh and walk with bare spirit and with the footstep of the mind; this, then, is what he says: Go out in the shoes of the flocks, and feed your kids in the tents of the shepherds.

By the flocks we understand a kingdom, because it belongs to power to preside over flocks. Each one presides over himself with a certain royal power, if he restrains in himself the luxuries of the body and brings his flesh into servitude; and therefore it is said: The kingdom of God is within you. Whence he beautifully says to the soul: Go out, that is, go out from servitude, go out from the rule and dominion of the flesh, and go out not in the flesh but in the spirit, go out to the governance of power. And therefore he added: Feed your kids, that is, rule those things that are on your left; for if they are not ruled, they easily slip. Restrain the wantonness, the lasciviousness of your body and its irrational luxury, tame its fickle movements: feed them not in bodily tents, but in the tents of the shepherds who know how to rule the flock; for lovely are the tents of Israel, like groves casting shade over a river, in which the soul, placed as though in battle array, wages a good warfare and spies out the enemy's attacks.

Unless you know yourself, O beautiful among women. What is it to know oneself, but that each should know that he is a man made in the image and likeness of God, capable of reason, who ought to cultivate his land like a good farmer with a certain plough and pruning-hook of wisdom, so that what is hard may be split, or what is overgrown cut back; who ought to govern the inner portion of himself by the command of the mind? Whence also in the Law it is written: Attend to yourself, lest a hidden word arise in your heart (Deut. 15:9): attend, he says, to yourself; he certainly does not say to your money, not to your possessions, not to the strength of your body, but to your soul and your mind, from which all counsels, deeds and thoughts flow. Attend to yourself, then, there, where you know that you are of greater worth. "Know yourself": this the Gentile men assign to Pythian Apollo, as though he were the author of this saying; whereas they transfer to their own what was taken from ours, and Moses, who wrote the book of Deuteronomy, was far earlier than the philosophers who fashioned these things.

Whence Solomon too, following the divine oracle, wrote in the Song of Songs: Unless you know yourself, O beautiful among women; that is, unless you know yourself as a rational mortal, and quickly confess your sins, quickly tell your iniquities that you may be justified, unless you are converted and first accuse your own offences, the day of death comes and there is no longer any remedy of conversion; you are overtaken while you are thinking. Light your torch before the bridegroom's door is shut on you; he is not accustomed to wait long for the negligent. Unless you know yourself, he says, O beautiful among women, and say: I am dark and comely: I am dark, because I have sinned, comely, because I am loved, because I am of the race of Abraham, a chosen race, beloved of God, the grace of the fathers will profit you nothing: For God is able from these stones to raise up children to Abraham (Matt. 3:9). And elsewhere in the Gospel you have read that the devil bound a daughter of Abraham with the bonds of his wickedness, and the Lord loosed her on the sabbath day. Unless, then, you know yourself, it will profit you nothing. Even if you say, I am a daughter of Abraham, you who do not believe, you who do not correct your error: Abraham indeed is saved, but the nobility of your race will not help you, unless faith has saved you. Let not the promise given to the fathers deceive you: I do not accept the person of a man, I do not accept the prerogative of race, unless I see a nobility of character fitting the race, so that the choice of a just race may be made.

But if you know yourself, and recognize that you are liable to sin, you must go out in the heels of the flocks. Go out, then, barefoot, and feed your kids in the tents of the shepherds. He who is without sin feeds lambs, feeds sheep: but let her who is liable to sin feed the kids, which are on the left; for she cannot be on the right hand of the good shepherd. Let her rather follow him who says to Peter: Come behind me, Satan (Mark 8:33). By following, Peter deserved to be placed on the right hand; and therefore it is said to him: Feed my little lambs (John 21:16). But hear where she is to go out: To the tents, he says, of the shepherds, that is, to the Gentiles, to the dispersion. And therefore he said: I will strike the shepherd, and the sheep of the flock will be scattered (Zech. 13:7), that the whole world might be filled with the flock of Christ, signifying that the Synagogue will be saved then, when she too has joined herself to this dispersion which has filled this world; for the tents of the shepherds are the kingdoms of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
