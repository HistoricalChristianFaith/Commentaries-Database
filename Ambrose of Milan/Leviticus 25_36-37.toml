[[commentary]]
quote='''
Finally also in Leviticus the Law prescribes that usury must not be demanded from a brother. For thus you have: and thy brother shall live with thee. Thou shalt not give him thy money upon usury nor exact of him any increase of fruits. This decision of God has excluded in general all increase of capital.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 15"
