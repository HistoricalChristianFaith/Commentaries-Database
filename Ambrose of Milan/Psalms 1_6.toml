[[commentary]]
quote='''
There follows: for the Lord knows the way of the righteous, and the road of the ungodly shall perish. Notice the sense: the ungodly do not rise again in the judgement, for the Lord knows the way of the righteous. He certainly knows the ways of those whose steps he directs; for there are steps of men which are directed by the Lord. The ways of a man too are directed by the Lord. The Lord knows these ways which are straight, which tend to that life of him who says: I am the way and the truth and the life. This is the good way, but the way of the world is crooked; he does not deign to know that way. For he recognizes those who are his own, who do his works; but to those who work iniquity the Lord says: depart from me, all you workers of iniquity; I do not know you. Not through ignorance, but because they are unworthy of the knowledge of God, they are not known.

Beautifully he says: and the road of the ungodly shall perish. The Latin made a separation, so as to say "iter" [road], and as it were distinguished road from way; but the Greek said "uiam" [way] in both places. Yet the Latin did not do so idly, since the Lord too said I am the way; he did not say "I am the road". And he said that the road of the ungodly perishes, not the ungodly; he preserves their substance, so that if they are converted they will lose only the road of ungodliness, which neither was from the beginning nor will be. What is accidental, then, perishes; what is substantial remains. And the ungodly perish in the way in which it is said: the soul that sins, it shall die, so that they die by the sting of sin, not by the dissolution of their whole substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
