[[commentary]]
quote='''
Hence the Apostle too says: I charge he says not I, but the Lord, that a wife should not depart from her husband, and below: To the rest he says I say, not the Lord: if any brother has an unbelieving wife and he leaves her. So where the marriage is unequal, he added: But if the unbeliever departs, let him depart. At the same time the same Apostle denied that it belongs to the divine law that a marriage of whatever kind should be dissolved; he neither commanded it himself nor gave authority to the one who deserts, but took away the blame from the one deserted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
