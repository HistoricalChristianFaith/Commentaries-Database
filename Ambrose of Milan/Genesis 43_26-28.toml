[[commentary]]
quote='''
And they brought in, he says, the gifts to him. We bring in the gifts; he lays on the banquet. He says: Set on the bread, which only the Hebrews eat; the Egyptians cannot eat it. But before the banquet, what condescension! What moral instruction in his conduct, his attentiveness and his graciousness! The brothers were still apprehensive about the false charge that they thought Joseph was bringing against them. He was inviting them to dinner: their feeling wavered, his graciousness persists. He is the first to address them, the first to ask: How are you?

And again he says: Is your father, the elder, well? It belongs to the superior to draw the inferior into conversation, to give him confidence to speak, to ask not only about the men themselves but also about their parents.

They answer: Your boy, our father, is well. He said 'elder' to honour him; they named him 'boy' to show the deference of humility, because old age is of honoured dignity, whereas boyhood seems subject, and nearer to modesty than to pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"
