[[commentary]]
quote='''
What do the usurers do? They deceive those who are indebted. They bind the sureties. But Tobias did not seek a pledge or demand surety. But you must run about to seek a surety that you may bind him with your obligations. Behold another enemy is being prepared. For when you have nothing whence to pay your debt, he will be held in your place. You will be found a circumventor in this case and a deceiver, who have deceived your friend. He will be stripped, he will be cast into chains in your place. You will find him a harsher collector than the creditor, who will say, "Goad your fellow citizen for whom you have become surety." So it will be done, so that you yourself also may begin to be ungrateful and transgress what is written: Be not forgetful of the favor of thy bondsman, for He gave His dear life for thee. You must needs say, "Who asked you to promise surety? If you had not given surety I would not have received the money. I received counterfeit money; he gave me brass mixed with gold. O that you had not offered yourself! Perhaps my creditor suborned you, or you him."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 23"
