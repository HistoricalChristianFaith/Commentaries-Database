[[commentary]]
quote='''
So that you may know, then, that Peter, John and James did not taste death, they were found worthy to see the glory of the resurrection; for he took these three alone after these words, within about eight days, and led them up a mountain. What is it that he says: within eight days after these words? Can it be because he who hears and believes the words of Christ will see the glory of Christ at the time of the resurrection? For the resurrection took place on the eighth day, whence many psalms too are inscribed for the eighth. Or perhaps it was to show us that he had said that he who loses his life for the word of God shall save it, since he restores his promises in the resurrection.

But Matthew and Mark recorded that these were taken after six days. Of this we could say: after six thousand years — for a thousand years in the sight of God are as one day —, but more than six thousand years are counted, and we prefer to understand the six days as a symbol, because the works of the world were created in six days, so that through the time we understand the works, and through the works the world. And therefore it is shown that the resurrection will come when the times of the world are fulfilled; or else because he who has ascended above the world and passed beyond the moments of this age, set as it were on high, will await the eternal fruit of the future resurrection.

Let us pass beyond the works of the world, then, so that we may see God face to face. Go up into the mountain, you who bring good tidings to Zion. If he who brings good tidings to Zion goes up into the mountain, how much more he who brings the good tidings of Christ, and of Christ rising in glory? For perhaps many may see him in the body; for many of us have known Christ according to the flesh, but now we know him no longer.

Many of us have known him, because many of us have seen him — we saw him, and he had no form nor comeliness —, but three alone, and three chosen, are led to the mountain. I would think that in the three the human race is comprehended in the mystical sense, since the whole human race flowed down from the three sons of Noah, did I not see that they were chosen. Or perhaps because only those who have confessed Christ will be worthy to come to the grace of the resurrection, since the ungodly do not rise again in judgment, but are punished as though the judgment had already been held. Three, therefore, are chosen to go up the mountain, since two also are chosen to be seen with the Lord. On both sides a sacred number. And this perhaps for this reason, that no one can see the glory of the resurrection except one who has kept the mystery of the Trinity whole with the incorrupt sincerity of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
