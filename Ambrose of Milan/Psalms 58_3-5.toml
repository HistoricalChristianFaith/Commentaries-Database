[[commentary]]
quote='''
By these words the nature of the serpent seems indeed to be described, but rather every vessel of wickedness is described, every serpent of depravity, who casts himself down upon his belly and shuts his poison up within himself and rolls it about inside in his breast, slippery in his thoughts and walking upon his frauds, entangling himself in his own wiles, always stirring and agitating his poisons when he thinks, trampling also his belly, that is, the seedbed of his heart. Hence David says beautifully: Sinners have been estranged from the womb, they have gone astray from the belly, they have spoken falsehoods. Their fury is after the likeness of the serpent, like the deaf asp that stops its ears, which will not hear the voice of the charmers and of the sorcerer, who are charmed by the wise man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
