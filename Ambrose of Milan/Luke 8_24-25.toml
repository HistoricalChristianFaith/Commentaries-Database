[[commentary]]
quote='''
You must remember that no one can pass from the course of this life without temptations, for temptation is the trial of faith. We are therefore subject to the storms of spiritual wickedness, but as watchful sailors we must awake the Pilot, who does not obey but commands the winds, who although He now no longer sleeps in the sleep of His own body, yet let us beware, lest through the sleep of our bodies He is to us asleep and at rest. But they are rightly reproved who feared, when Christ was present; since he surely who clings to Him can in no wise perish.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We are subject, then, to the storms of spiritual wickedness; but like watchful sailors let us awaken the helmsman. Yet even they are wont to be in danger. What helmsman, then, shall I seek? Surely him who does not serve the winds but commands them, of whom it is written:

but he, rising, rebuked the wind. What is rising? He was at rest, but he was resting in the sleep of the body, while he was intent on the mystery of his divinity; for where there is wisdom, where there is the Word, nothing is done without the Word, nothing without prudence.

You have it above that he spent the night in prayer: how would he sleep here in the storm? But the security of his power is expressed, in that while all were afraid he alone rested unafraid. So he who is not a sharer in the danger is not a sharer in the nature. Even if the body sleeps, the divinity works, faith works. Indeed he says: you of little faith, why did you doubt? And rightly are they reproved who were afraid when Christ was present, since surely he who clings to him cannot perish.

So he strengthened their faith, poured back the calm, commanded the wind to cease — not the north wind, not the south-west wind, but surely that wind to which it was said by the angel Michael in the epistle of Jude: may the Lord command you. Hence Saint Matthew also: he commanded he says the wind and the sea. And would that he may deign to restrain its harsh blasts in us, so that calm poured back upon our tossing life may take away the fear of shipwreck! Even if he no longer sleeps with the sleep of his own body, let us nevertheless beware lest, through the sleep of our body, he sleep and rest for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
