[[commentary]]
quote='''
Now the refuges of the six cities are so ordered that the first city is the knowledge of the Word and, after his image, a pattern of living. For whoever has entered into that knowledge is safe from punishment, according to what the Lord also says: Now you are clean because of the word which I have spoken to you. And elsewhere: Now this is eternal life, that they may know you, the only true God, and Jesus Christ whom you have sent. This city, then, is as it were the metropolis, next to which lie the other five cities of the Levites. The second city is the consideration of the divine operation by which the world was created. The third city is the contemplation of the kingly power and of the eternal majesty. The fourth city is the beholding of the divine propitiation. The fifth city is the contemplation of the divine Law, which commands what is to be done. The sixth city, too, is the portion of the Law which prescribes what is not to be done. How great the abundance of the divine mercy, how great the riches of his loving-kindness, that, considering the pursuits of each one and the frailties of the human condition, by which we are led into fault even unwilling and reluctant, and, overcome by enticements, frequently commit offences that are not voluntary, he should set before us various refuges, namely of six cities, so that by the same number by which the world was formed a remedy might be provided against worldly vices and the shipwrecks of this world!

The first remedy, then, is this: if a fault has crept upon any man of good purpose, he should, if he wishes to have perfect security, hasten without any delay to the very citadel of all things, where the Word of God is, in that bosom of the Father, that is, in the secret and inner recess of God, where the fountain of wisdom is, from which, instead of death, he may draw the immortal drink of eternal life. The second remedy is this: he who cannot have a foretaste of the knowledge of that good, and is slower either in natural talent or in the comprehension of faith, since it is by swift vigour of mind and sharpness of talent that one strives toward the heights of knowledge, should at least consider the works of the Lord and, from the things that have been made, contemplate the author of so great a work; since from these good things which are in the establishment of this creation — for they are very good, as the Lord said — that supreme and eternal good is comprehended. What order of things, what discipline, what grace? Is not even a slow talent provoked by these to love its author? For if we love our parents because they begot us, how much more ought we to love the creator of our parents and our own author! Therefore the operative power of God: even if it is not seen, it is nevertheless judged from its works, and his works betray the worker, so that he who is not comprehended is understood. Hence the Lord also says: If you do not believe me, at least believe the works. Good, therefore, as a refuge is this city too, which testifies to the grace of its builder and stirs up our affection, so that we may be the more desirous of him who is seen to have bestowed on us such great beauty in this fabric. The third order is the contemplation of the kingly power, so that we may be subject to the King, if we do not defer to him as to a parent. For through fear of one who presides, he who is ungrateful for salvation often becomes obedient to power, so that he who would not and could not acknowledge the grace of devotion may acknowledge the necessity of sobriety. Necessity, therefore, corrects the one whom devotion ought to have called forth.

These are the three cities beyond the Jordan, given as a refuge to the more perfect prudence, so that we may first flee fault by the bent of our mind, conformed to the image of God. For so we were created, God saying: Let us make man after our image and likeness. This, then, is the law of that first city. Next, if through the frailty of the flesh and the enticements of the world we cannot so form our mind, let us lighten sin by reverence for the Father who begot us and by the dutifulness of offspring; for love, indeed, covers a multitude of sins. Whoever, then, could not be after the image of God, let him be unto the fullness of love. That city shuts out fault; this one looses it. This, indeed, is the law of the second city: You shall love the Lord your God from your whole heart and from your whole soul and from your whole strength. But if, again, there are some of narrow and petty spirit who cannot receive the abundance and the grace of love, you have the third city, so that fear of the divine power may make you sober and dread may bend you. And this is the third law: You shall worship the Lord your God, and him alone shall you serve. These, then, are the chief virtues, and therefore of the few, not of the many, placed beyond the Jordan, so that you may express the archetype as an image does, love him as a son loves his father, worship him as a subject worships his king.

But those who have crossed the Jordan — now the Jordan is called their descent —, those, then, who have gone down from those higher virtues to these lower things, that is, those in whom integrity, love and humility have wavered, have refuges nearer to man which they may seek, so that those who are liable to offences and bent by vices that are not voluntary may hope that the Lord can be reconciled to them if they ask forgiveness, may hope that they can be corrected if they follow the precepts of the heavenly testaments, by which we are either formed to innocence or called back from fault. These, then, are the following cities on this side of the Jordan: that we may propitiate God to ourselves, follow what he commands, and avoid what he forbids. Let there be, then, an eagerness to propitiate the Godhead, obedience in following his precepts, caution against forbidden transgression, by which we may revere the propitiatory mercy of God and his nomothetic (law-giving) providence, either by compliance with what he has ordained or by turning away from what he has forbidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 2"
