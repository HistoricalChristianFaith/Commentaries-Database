[[commentary]]
quote='''
If, then, we have learned that Tamar was recorded among the Lord's generations because of a mystery, we ought to judge that Ruth too was without doubt not passed over, for a like reason; of whom the holy Apostle seems to have been thinking when, foreseeing in the spirit that the calling of the foreign nations was to be celebrated through the Gospel, he said that the Law is not laid down for the righteous, but for the unrighteous. For how did Ruth, though she was a foreigner, marry a Jew? And for what reason did the evangelist think that mention of her marriage should be made in the generation of Christ, when it was forbidden by the course of the Law? Did the Savior not, then, descend from a lawful generation? It seems unseemly, unless you return to the apostolic saying that the Law is not laid down for the righteous but for the unrighteous. For since she was a foreigner and a Moabitess, especially since the law of Moses forbade these marriages and excluded the Moabites from the Church — for so it is written: The Moabites shall not enter into the Church of the Lord to the third and fourth generation and for ever — how did she enter into the Church, unless because, holy and spotless in her morals, she was raised above the Law? For if the Law is laid down for the impious and for sinners, surely Ruth, who went beyond the bounds of the Law and entered into the Church and became an Israelite and merited to be counted among the forebears of the Lord's line, chosen for kinship of mind, not of body, is a great example to us, because in her went before the figure of all of us who have been gathered from the Gentiles to enter the Church of the Lord. Let us then emulate her, so that, as she by her morals merited this prerogative of being admitted into fellowship, as the history teaches, we too, for the choice of our morals, may be enrolled in the Church of the Lord with our merits to support us.

For when, in the earlier times in the days of the judges, famine pressed upon the Israelites, a man went from Bethlehem, a city of Judah, in which Christ was born, to dwell in the land of Moab with his wife and two sons; the man's name was Elimelech, the woman's Naomi. His sons took Moabite wives for themselves — the name of the one Orpah, the name of the second Ruth — and they lived there about ten years and died. But the woman, left by her two sons and bereft of her own husband, learning that God was visiting Israel and preparing to return home, began to urge her sons' wives to go back to their own homes. One gave way, but Ruth stayed with her mother-in-law. When her mother-in-law said to her: Behold, your sister-in-law has now gone back to her people and to her gods; you too return together with your sister-in-law, Ruth answered: May it not befall me to leave you and return to my god, for wherever you go I will go with you, and where you dwell I will dwell. Your people is my people, and your God my God. And where you die I will die, and where you are buried I will be buried. And so the two came to Bethlehem. When Boaz, David's great-grandfather, learned of these morals and this holiness toward her mother-in-law, this devotion toward the dead, this religion toward God, he chose her as his wife according to the law of Moses, to raise up the seed of his dead kinsman.

And it is worth noticing that, found in a field full of harvest, she was gathering sheaves, as it is written, and keeping the produce for her mother-in-law, and that she did not go after a young man but followed a mature man; whence she also merited to hear: For you are a woman of virtue, or: For you have done your last mercy better than the first; for the last mercy, that of the Church gathered together, excels the earlier. This we say more briefly here, because we have set it out more fully in the books which I wrote on the faith. He drew near who was far off, because he who was nearest withdrew far off, and, having received the woman, he acquired the shoe of the nearest kinsman. For it was the custom that he who was nearest, if he did not wish to take his kinswoman in marriage, should loose his shoe and give way to another. In this there is no small mystery, in that he who took the foreign woman in type received the power of preaching the Gospel.

Finally, that this marriage was in type is attested by the blessing of the elders, who said: May the Lord grant the woman who enters your house to be like Rachel and like Leah, who built the house of Israel, and to work power in Ephrathah, and may there be a name in Bethlehem. And may your house be like the house of Perez, whom Tamar bore to Judah; of your seed may the Lord give you from this girl. And Boaz took Ruth and she became his wife, and she bore Obed, the father of Jesse, the grandfather of David. Rightly, then, Saint Matthew, being about to call the Gentiles to the Church through the Gospel, recorded that the Lord himself, the author of the gathering of the Gentiles, took on according to the flesh a generation from foreigners, so that there should be a sign even then that that generation would bring forth the caller of the Gentiles, whom we all, gathered from foreigners, should follow, leaving our ancestral ways and saying to him who called us to the worship of the Lord, for example to Paul or to any bishop: Your people is my people, your God my God. So Ruth, like Leah and Rachel, forgetting her people and her father's house, loosing the bond of the Law, entered into the Church.

He looses his shoe who does not take the Church. And to Moses it is said: Loose the shoe of your feet, lest he himself should be believed to be the bridegroom of the Church. He alone did not loose it who is the true bridegroom. And therefore John says: The strap of whose shoe I am not worthy to loose. So here too there is a type, and he built the house of Israel.

And how fitting it was that mention of her should be inserted into the Lord's lineage is declared by the expression of a higher mystery, by which it was prophesied that Christ would be born of her line in Ephrathah, when it is said: May the Lord grant you to work power in Ephrathah, and may there be a name in Bethlehem. For what is the power, unless that which gathered the peoples of the Gentiles through Christ? And what is the name, unless that by which Bethlehem became the homeland of the Lord, born according to the flesh? Hence it was said by prophecy: And you, Bethlehem of Judah, are not least among the princes of Judah; for from you will come out a prince who will rule my people Israel. We see, then, that history, morals and mystery agree in the mention of the women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
