[[commentary]]
quote='''
The girl is consulted not about the betrothal — for she awaits the judgement of her parents; it is not for a virgin's modesty to choose a husband —, but, already betrothed to a husband, she is consulted about the day of departure. And not undeservedly she made no delay; for rightly she had to hasten to her husband. Hence it is plain from where that line of Euripides was taken, which many admire. For he says in the person of a woman, who nevertheless wished to leave her husband and was being sought for another marriage: νυμφευμάτων μὲν τῶν ἐμῶν πατὴρ ἐμὸς μέριμναν ἕξει· τοῦτο γὰρ οὐκ ἔστʼ ἐμόν, that is: my father will take up the care of my betrothal; for this is not mine. Therefore, virgins, keep what even the philosophers themselves admired. But also, women, if any young woman who has quickly lost her husband fears to fall into the snare of her own weakness and wishes to marry, let her marry only in the Lord, so that she leaves the choice of a husband to her parents, lest she be thought of too forward a desire if she claims for herself the choice concerning her own marriage. She ought to seem sought by a man rather than to have sought a man herself. Let her put modesty first, before she marries, because modesty commends marriage itself all the more. But they imitate the words; the deeds they cannot imitate.

It is clear, too, that there is in this a glorious mystery of the Church, in that no one dared to call her before Christ; for to Christ alone was this prerogative of calling the nations reserved. Once called, however, she made no delay, and was therefore the more acceptable to the Lord, because the people of the Jews, which had been called to the supper, was not worthy to come, whereas the congregation of the Gentiles ran to meet him as soon as it saw itself summoned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
