[[commentary]]
quote='''
Then will be the day of the Lord, which the Apostle too has plainly set forth, saying that we must take heed, as though the day of the Lord were at hand, lest anyone deceive us in any way; for unless the falling away comes first and the man of sin is revealed, the son of perdition, who opposes and exalts himself above all that is called God or that is worshipped, so that he sits in the temple of God, showing himself as though he were God, and the rest.

So he will sit in the temple, and in the inner temple of the Jews, who will deny Christ, in a temple not inviolable but subject to corruption, which either the ruin of unbelief entangles, or the force of anger overthrows, or the fire of desires burns up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
