[[commentary]]
quote='''
Now the fact that, because of the reception of David, Saul persecuted the whole house of Abimelech except Abiathar, at that time chief of the priests, shows us by prophecy that no one can harm the true chief of the priests, who alone is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
