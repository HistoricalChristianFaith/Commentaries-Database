[[commentary]]
quote='''
Mystically, our Lord came to Mount Olivet, that he might plant new olive trees on the heights of virtue. And perhaps the mountain itself is Christ, for who else could bear such fruit of olives abounding in the fulness of the Spirit?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Nor is it for nothing that two disciples are directed thither; Peter to Cornelius, Paul to the rest. And therefore He did not mark out the persons, but determined the number. Still should any one require the persons, he may believe it to be spoken of Philip, whom the Holy Spirit sent to Gaza, when he baptized the eunuch of Queen Candace. (Acts 8:38.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And it came to pass, when he had drawn near to Bethphage and Bethany, to the mount which is called of Olives, he sent two disciples, saying: Go into the village which is opposite, in which, as you enter, you will find the colt of an ass tied, on which no one has sat.

Beautifully, having left the Jews, the Lord, who was to dwell in the affections of the Gentiles, goes up to the temple; for this is the true temple, in which the Lord is worshipped not in the letter but in the spirit; this is the temple of God, which the order of faith, not a structure of stones, has founded. So those who hated are forsaken; those who were going to love are chosen.

And therefore he comes to the mount of Olives, to plant young olive trees on the height of virtue, whose mother is that Jerusalem which is above. On this mount is that heavenly husbandman, so that all those planted in the house of God may say, each one of them: But I am like a fruitful olive tree in the house of the Lord. And perhaps the mount itself is Christ. For who else would bear such fruits, not of olive trees bowed down by an abundance of berries, but of nations made fruitful by the fullness of the Spirit? He it is through whom we ascend and to whom we ascend. He is the door, he is the way, who is opened and who opens, who is knocked at by those who enter and is adored by those who have finished their service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Nor is it idle that two disciples are sent, Peter to Cornelius, Paul to the rest. And therefore he did not designate persons, but defined a number; yet if there is anyone who demands persons, he can reckon it of Philip, whom the Spirit sent to Gaza, when he baptized the eunuch of Queen Candace and from Azotus to Caesarea sowed the word of the Lord through all the cities. Nor should it be passed over that he declares they are soon to be sent back, because those had to be sent forth who would preach the Lord Jesus in the lands of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
