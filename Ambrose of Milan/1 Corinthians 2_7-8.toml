[[commentary]]
quote='''
Not a slight reason, too, is that the virginity of Mary might deceive the prince of the world, who, when he saw her betrothed to a man, could not hold her childbearing in suspicion. That it was the counsel of the Lord himself to deceive the prince of the world, his own words declare, when the apostles are bidden to be silent about Christ, when the healed are forbidden to boast of their cure, when the demons are commanded to be silent about the Son of God. That it was the counsel, as I have said, to deceive the prince of the world, the Apostle too declared, saying: But we speak the wisdom of God hidden in a mystery, which none of the princes of this world knew. For had they known it, they would never have crucified the Lord of majesty; that is: they would never have brought it about that I should be redeemed by the death of the Lord. So he deceived for our sake, he deceived in order to conquer, he deceived the devil, when he was tempted, when he was questioned, when he was called the Son of God, so as nowhere to confess his own divinity. But yet he deceived the prince of the world still more; for the devil, though at one time he doubted, when he said: If you are the Son of God, cast yourself down, yet came to know him, late though it was, and departed from him. The demons too knew him, who said: We know who you are, Jesus, Son of God. Why have you come before the time to torment us? And they knew that he had come because they had foreknowledge that he would come. But that the princes of the world did not know him, by what greater proof can we show than by the Apostle's sentence: For had they known it, they would never have crucified the Lord of majesty? For the malice of demons easily detects even hidden things, but those who are taken up with the vanities of the world cannot know divine things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
