[[commentary]]
quote='''
And therefore Remember says the Lord Lot's wife, who, because she looked back, lost the gift of her nature; for behind is Satan, behind is Sodom. Therefore flee intemperance, shun luxury. And that you may know that not all can flee to the mountain, recall that he who did not turn back to his former pursuits — for he had earlier chosen Sodom — escaped for this reason, that he reached the mountain; while she who was weaker, because she looked back to what was behind, could not reach the mountain even with the help of her husband's support, but remained behind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
