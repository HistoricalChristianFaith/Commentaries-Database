[[commentary]]
quote='''
At the same time, what the evangelist says ought not to trouble us: he did not know her until she bore a son; for that is either an idiom of Scripture — as you have elsewhere: even until you grow old, I am. Did God cease to be after their old age? And in the psalm: The Lord said to my Lord: Sit at my right hand, until I make your enemies the footstool of your feet. Will he not sit afterwards? — or else because one who pleads a case thinks it enough to say what belongs to the case, and does not look for what is superfluous; for it is enough for him to establish the case he has taken up and to put off what is incidental. And so he who had undertaken to prove the incorrupt mystery of the Incarnation did not think that the testimony to Mary's virginity needed to be pursued more fully, lest he be thought a defender of the virgin rather than an asserter of the mystery. Certainly, when he showed Joseph to be just, he declared clearly enough that Joseph could not violate the temple of the Holy Spirit, the mother of the Lord, the womb of the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
