[[commentary]]
quote='''
Would indeed that the athlete of Christ might be unable to be wrestled down and unconquerable, and glorious at every age and in every kind of virtue, as he says: But in all things we overcome because of him who loved us! What is "in all things"? There are athletes who are called boys, youths, men, that is, παῖδες, ἀγένειοι, ἄνδρες.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
