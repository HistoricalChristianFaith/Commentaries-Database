[[commentary]]
quote='''
Let us not pass by progress in any discipline, as Joseph too, as a youth, did not pass it by, because he was seeking his brothers and hastening to the place where they were pasturing the sheep; and when he learned that they were in Dothaim, he went on there. By that word Dothaim is signified a fitting failing, that is, a failing of vain opinions, not moderate but perfect and full, in which lies the progress of the soul. For the wise man, when he diminishes, adds; for worldly opinions fail, and they are compared to weak women. Hence it is beautifully said, to show that Sarah had come to progress, so as to bring forth laughter and gladness: There had failed, it says, in Sarah the ways of women. Good, then, is the failing of desires, the failing of vanity, because it is the addition of truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
