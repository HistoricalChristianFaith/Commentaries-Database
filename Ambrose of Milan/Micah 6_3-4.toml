[[commentary]]
quote='''
For what complaint is of heavier weight than that divine one which you have in the book of the prophet Micah: O my people, what have I done to you, or in what have I grieved you, or how have I been troublesome to you? Answer me. Did I not lead you out of the land of Egypt and free you from the house of bondage? See how the ungodly are cast down while they are lifted up: their complaint is shut out, their punishment is heaped up. For, invited by heavenly benefits, they ought not to have deserted the giver of security and prosperity of life, whom they ought rather to have obeyed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 7"
