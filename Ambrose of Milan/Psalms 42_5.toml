[[commentary]]
quote='''
Yet in the very afflictions of the world the hope of things to come was a great consolation for things present. For who would not lift up his mind, who could hope that those blessed fellowships are reserved for him in the heavenly tabernacle? But because to our weak condition things to come are often a weariness, and things present a vexation, therefore the soul of the holy prophet too was troubled when the waves of the body rose up.

For I would not have you wonder if the prophet says that his soul was shaken, since the Lord Jesus himself said: Now my soul is troubled. For he who took on our weaknesses took on our feeling also, in which he was also sorrowful even unto death, not on account of death; for a voluntary death could not have held sadness, a death in which there was to be the joy of all, the refreshment of all. Of it he also said elsewhere: And I rose and saw, and sleep became sweet to me. Good is the sleep that made the hungry not hunger and the thirsty not thirst, for whom it prepared the sweetness of the sacraments. How then was his soul troubled with fear, who made the souls of others not fear? He was sorrowful, therefore, even unto death, until grace should be consummated. This is proved by his own testimony, when he says of his death: I have a baptism to be baptized with, and how I am distressed until it is accomplished?

Troubled therefore by the slippery windings of this world, David says: Why are you sad, O soul, why do you trouble me? Hope in God, for I will praise him: the salvation of my countenance and my God. Therefore, when we are anxious and full of care, let hope strengthen us by the expectation of things to come. Look at each point. Hope, for I will praise, he says, not 'I praise,' but 'I will praise'; that is: I will praise better then, when, having beheld the glory of God with unveiled face, I shall be refashioned into the same image.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 3"
