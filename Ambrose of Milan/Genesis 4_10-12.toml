[[commentary]]
quote='''
It was well said: The voice of your brother's blood cries from the ground. He did not say "cries from your brother's body," but cries from the earth. Although his brother refrains, the earth does not. If his brother is silent, the earth condemns. The earth acts as both witness and judge against you. The earth, still wet with the blood of your slain brother, is a hostile witness. As a judge, the earth, befouled by such a crime, is even more antagonistic, inasmuch as she opened her mouth and received your brother's blood shed by your own hand. When she opened her mouth, she expected indeed to receive words of. brotherly love. She had no fears when she saw the two brothers. She was aware that the relation of consanguinity was an incentive to love, not to hate. How could the earth have a suspicion of parricide, when she had not yet seen a homicide? But you shed blood for which the earth in retaliation will not give her fruit to you. How guileless was that act of revenge! She who was so seriously outraged limited herself to the act of withholding. She refrained from inflicting injury.

No mean doctrine is expressed in the words, The voice of your brother's blood cries out to me. God gives ear to the just even in death, since they live unto God. And rightly are they considered to be alive, because, even if they have tasted the death of the body, they still enjoy a bodiless life and are illuminated with the splendor of their merits and are basking in light eternal. God beholds, therefore, the blood of the just. He turns aside from the prayers of the impious, since, even if they appear to be alive, they are more miserable than all of the dead. They surround themselves with flesh as with a sepulcher in which they have entombed their unhappy souls. What other comparison can be made? The soul is shrouded in earth and is bound by the inordinate desires of avarice and of other vices, so that it cannot breathe the air of heavenly grace. A sinner of this sort has been cursed by earth, which is the lowest and meanest constituent in this world of ours. The higher parts are, of course, the heavens and what exists in heaven, the sun, the moon, the stars, Thrones, Dominations, Principalities and Powers, Cherubim and Seraphim. There is no doubt, therefore, that the person condemned by the inferior parts of the world is condemned, too, by the superior. How can Cain, when he is not absolved by the earth, be absolved by the righteous decisions made there above? Hence he is commanded to be a fugitive on the earth, groaning and trembling.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 9"
