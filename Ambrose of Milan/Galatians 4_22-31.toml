[[commentary]]
quote='''
Learn what a parable is: Abraham, then, had two sons, one by the bondmaid and one by the free woman. The Jew did not understand this except according to the letter; he did not know which of the two sons received the father's inheritance, because he leaned towards carnal things. The parable needed a solution. The teacher of the Gentiles came, the faith of the nations, and understood that those two women are the two testaments: one from Mount Sinai, which bore the people of the Jews into servitude, which is Hagar; and therefore Sinai, which by interpretation signifies 'its measure'; for measure belongs to the Law, but grace is superabundant. Sinai is also called 'wage', and it suits the people of the Jews, who preferred to be justified by the wage of works rather than by the grace of faith. The Jerusalem, then, which was under the Law was in servitude with her children, but the Jerusalem which is above is free. And therefore Sarah, who is called 'princely', has freedom, because he who is righteous and upright is master of himself. From the two testaments, then, come two peoples, one of the Jews, the other of the nations, which believed in Christ. That people of the Jews which did not believe is in servitude; it is born according to the flesh, because it interpreted divine Scripture according to the flesh and according to the letter, not according to the spirit. But he who is of the free woman is born through the promise, that is, he to whom the promise comes from faith. He is the son of the Church, holding the freedom of grace, on whose account the Church says: Cast out the bondmaid and her son; for the son of the bondmaid shall not be heir with my son Isaac, and the Apostle says: So then, brothers, we are not children of the bondmaid, but of the free woman. This, then, is the solution: what the Jew did not know, the faith of the Gentiles has solved, poured into the minds of the nations by Paul the teacher. Therefore, then, their deeds are for us in a parable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
