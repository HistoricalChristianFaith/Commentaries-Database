[[commentary]]
quote='''
My tears have been to me he says bread day and night, while it is said to me daily: Where is your God? There tears are rightly bread where there is hunger for justice. For blessed are those who hunger and thirst for justice, for they shall be filled. There are, therefore, tears which are bread and strengthen the heart of man. With this discussion that saying of Ecclesiastes also agrees: Send your bread before the face of the water, because there is heavenly bread where there is the water of grace, since those rightly receive the substance of the word and the nourishment of the mystical meaning from whose belly flow rivers of living water. Likewise also, this living bread is there where there is the water of tears and the weeping of penitence. For thus it is written: In weeping they went out, and in consolation I will call them back. Blessed, therefore, are those whose tears are bread, who have deserved to laugh, because blessed are you who weep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 2"
