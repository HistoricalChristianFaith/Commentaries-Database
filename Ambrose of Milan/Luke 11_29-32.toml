[[commentary]]
quote='''
Lastly, that you may know that the people of the Synagogue is disfigured where the blessedness of the Church is praised, he added:

this generation is a wicked generation; it seeks a sign, and no sign shall be given it but the sign of Jonah. For as Jonah was a sign to the Ninevites, so will the Son of Man be also. In this too, when the people of the Jews is condemned, the mystery of the Church is plainly expressed, which, in the Ninevites through repentance and in the queen of the south through zeal for acquiring wisdom, is gathered from the ends of the whole world, so that it may come to know the words of the peaceable Solomon. A queen indeed, whose kingdom is undivided, rising up into one body out of diverse and distant peoples. So that sacrament is great concerning Christ and the Church, but yet this is greater, because that went before in figure, while now the mystery is full in truth; for there was the type of Solomon, but here is Christ in his own body. The Church, then, consists of two things, that you should either not know how to sin or cease to sin; for repentance blots out sin, wisdom guards against it. So much in the mystical sense.

For the rest, the sign of Jonah, as it is a type of the Lord's Passion, so also is a testimony to the grievous sins which the Jews committed. At the same time one may observe both an oracle of majesty and a token of loving-kindness; for by the example of the Ninevites both punishment is announced and a remedy is shown. Hence the Jews too ought not to despair of pardon, if they are willing to do penance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
