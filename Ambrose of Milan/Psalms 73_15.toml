[[commentary]]
quote='''
And so I conferred with my heart and said to myself: If I shall tell it thus, that In vain have I justified my heart, the voice of God met me, saying: Behold, the generation of your sons, for which I have ordained, that is: behold, you find in the Scriptures that I have ordained, O you, Adam, for the generation of your sons, that riches come to the ungodly by chance, not by any merit. Nor are the gains of treasure the rewards of virtue, just as, conversely, poverty is not the punishment of sin; but these things come indiscriminately, which are rolled along like a river by a certain flood of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 6"
