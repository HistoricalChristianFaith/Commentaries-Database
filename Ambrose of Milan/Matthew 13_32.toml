[[commentary]]
quote='''
Do not despise this grain of mustard; it is indeed the least of all seeds, but when it has grown it becomes greater than all herbs. If Christ is the grain of mustard, how is Christ either least, or how does he grow? Truly not by nature, but by appearance he grows out again. Do you wish to know him as least? We saw him, and he had no form nor comeliness. Learn him as greatest: fair in form above the sons of men. For he who had no form nor comeliness was made more excellent than the angels, beyond all the glory of the prophets, whom weak Israel had eaten like herbs; for of the bread by which hearts are strengthened, it had refused the one and had not received the other.

And Christ is a seed, because he is the seed of Abraham; for the promises were spoken to Abraham and to his seed. He does not say: 'and to seeds', as of many, but as of one: 'and to your seed', which is Christ. And not only is Christ a seed, but even the least of all seeds, because he came not in kingship, not in riches, not in the wisdom of this world. But suddenly, like a tree, he spread out the lofty crown of his power, so that we say: under his shadow I desired and sat down. And often at the same time. I think, he seemed both a tree and a grain. He is a grain when it is said: is not this the son of Joseph the carpenter? But amid these words he suddenly grew, as the Jews themselves testify, since they could not, as it were, reach the branches of a spreading tree, saying: whence has this man this wisdom?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
