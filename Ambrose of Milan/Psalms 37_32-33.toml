[[commentary]]
quote='''
The more righteous anyone is, the more the enemy lies in wait for him, and therefore Scripture says: The sinner observes the righteous man and seeks to destroy him; but the Lord will not leave him in his hands, nor condemn him when he is judged. The sinner, then, seeing that the righteous man speaks wisdom with his mouth and meditates it in his heart, that he speaks judgement with his tongue, that he keeps the law of the Lord in his heart, tries to bring upon him the death of sin, but the Lord protects him. And therefore let us not fear the snares of the sinner, since God is for us. If, then, God is for us, who is against us? Therefore God will not forsake his righteous man nor condemn him when he holds judgement concerning him; for he is a true judge, and therefore righteousness cannot be endangered. Hence also Aquila said: Nor will he condemn him in judging him, Symmachus: Nor will he condemn him when the righteous man is judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
