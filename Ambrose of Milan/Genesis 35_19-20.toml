[[commentary]]
quote='''
Fittingly too holy Rachel was buried there, because all who are baptized in Christ are buried together with him. For so we are taught, as the Apostle says: For we have been buried together with him through baptism into death, so that, as he rose from death, raised by his own power, so we too may rise again by his grace. Then, therefore, is every error of the Gentiles truly hidden, when someone has been washed clean of vices, because our old man, nailed to the cross, no longer knows how to serve the old sin. Suitably too a pillar is set up upon Rachel's tomb, because the Church is the pillar and foundation of truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 7"
