[[commentary]]
quote='''
Nor indeed, though most people hold it to be the most grievous thing, will he think himself wretched if either he himself or his children come into captivity; for he will not bear as intolerable what belongs to nature or what seems good to the Lord. Indeed, the just man said: good is the word which the Lord has spoken, and he said: let there be peace and faith in my days. Certainly this just man Hezekiah was not glad that the hardship of captivity had been turned aside onto his sons, but he could not oppose the will of the Lord, and therefore he accepted his commands with equanimity, like a humble slave. Add to this that he could reckon that the merit of virtue can stand out even in captivity. For Jeremiah was not less blessed in captivity, nor Daniel, nor Ezra, nor were Hananiah, Azariah, Mishael less blessed than if they had not fallen into captivity, since they were led into captivity for this purpose, that they might bring to the people both comforts present in captivity and the hope of escaping captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 8"
