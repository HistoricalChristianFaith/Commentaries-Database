[[commentary]]
quote='''
Destruction does not know wisdom, wickedness does not know it. For destruction could not hold her who said: Where, O death, is your victory? Where, O death, is your sting? Wickedness does not know her, because she said: The wicked will seek me and will not find me. They can say: we have heard its glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
