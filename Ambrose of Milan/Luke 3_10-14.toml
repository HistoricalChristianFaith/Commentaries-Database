[[commentary]]
quote='''
The holy Baptist also gave a fitting answer to each class of men, one to all: thus to the tax collectors, that they should not exact more than was prescribed; to the soldiers, that they should not make false accusations or seek plunder, teaching that pay was established for military service for this reason, lest, while provisions are sought, the plunderer should run riot. But these and the other precepts of duties are proper to each; mercy is of common use, therefore a common precept, necessary for all offices, all ages, and to be shown by all. Not the tax collector, not the soldier is excepted, not the farmer or the townsman, rich and poor: all in common are admonished to give to him who has not — for mercy is the fullness of the virtues, and therefore it is set before all as the form of perfect virtue — and not to spare their clothing and their food. Yet of mercy itself a measure is kept according to the possibility of the human condition, so that each one should not strip himself of everything, but share what he has with the poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
