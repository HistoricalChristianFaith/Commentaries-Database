[[commentary]]
quote='''
Who is a harsher oppressor? And this is a bitter word. Therefore the Lord says: My people, your oppressors strip you; and in the Gospel you have: When thou goest with thy adversary to the prince, endeavor to be delivered from him: Lest perhaps he draw thee to the judge, and the judge deliver thee to the exacter, and the exacter cast thee into prison. Know then who that exacter is who exacts the last farthing and still calls himself a creditor, and even with this name commits fraud, as one who smears a cup of poison with honey, that death may be hidden beneath a pleasant fragrance and the sweetened rim of the cup may conceal the onslaught of deceit. The creditor is depicted as a trustworthy person (fidelis) but, as it were, not trusting (incredulus) to whom a trustworthy person binds himself by a pledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 9"
