[[commentary]]
quote='''
Indeed, so that you may know that the Lord Jesus enlarged Paul, hear the Apostle himself saying: Our mouth is open to you, O Corinthians, our heart is enlarged. Open, then, your mouth, confess Christ, because he is fullness; where there is fullness, there is breadth also. And like a good master, who wished to have disciples equal to himself, he exhorted us too to be enlarged, saying: Be enlarged, you also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
