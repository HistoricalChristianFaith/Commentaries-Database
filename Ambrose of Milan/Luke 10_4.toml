[[commentary]]
quote='''
Our Lord did not then forbid these things because the exercise of benevolence was displeasing to Him, but because the motive of following after devotedness was more pleasing.

Our Lord also would have nothing human in us. For Moses is bid to loose off the human and earthly shoe when he was sent to deliver the people. (Exod. 3:5) But if any one is perplexed why in Egypt we are ordered to eat the lamb with shoes on, (Exod. 12:11.) but the Apostles are appointed to preach the Gospel without shoes: he must consider, that one in Egypt ought still to beware of the serpent's bite, for there were many poisonous creatures in Egypt. And he who celebrates the Passover in figure may be exposed to the wound, but the minister of truth fears no poison.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And therefore, so that we may escape these wolves, the Lord teaches what we are to follow, saying:

carry no purse nor bag nor shoes. What it means that a purse is not to be carried he has expressed plainly elsewhere; for Matthew wrote that the Lord said to the disciples: do not possess gold nor silver. If we are forbidden to possess gold, what of snatching it, what of carrying it off? If you are commanded to give away what you have, how do you heap up what you did not have? You who preach that one must not steal, do you steal? You who say that one must not commit adultery, do you commit adultery? You who abhor idols, do you commit sacrilege? You who glory in the Law, do you dishonor God by transgression of the Law? For the name of God is blasphemed through you.

Not so the apostle Peter, who, the first to carry out the Lord's sentence, in order to show that the Lord's commands had not been poured out in vain, when he was asked by a poor man to bestow some money on him, said: silver and gold I have none. He glories that he has no silver and gold; is it a shame to you to have as yet less than you desire? There is, then, a glorious poverty too, because there is also a blessed poverty, as it is written: blessed are the poor in spirit; yet Peter glories not so much in this, that he has no silver and gold, as in this, that he keeps the command of the Lord, who enjoined: do not possess gold; that is to say: you see that I am a disciple of Christ, and do you ask gold of me? He has given us something else far more precious than gold, that we should work in his name. So I do not have what he did not give, but what he gave I have: in the name of the Lord Jesus rise and walk.

Just as, then, he who wishes to build barns for storing up grain is reproved by the authority of the Lord's sentence, so he who wishes to provide a purse for hoarding gold incurs the blemish of reproof.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
No bag nor shoes. Both are usually made of the hide of a dead animal; but the Lord Jesus wishes nothing mortal to be in us. Indeed he says to Moses: loose the shoe from your feet; for the place on which you stand is holy ground. He is bidden, then, to loose the mortal and earthly shoe when he was being sent to free the people; for the minister of this task ought to fear nothing nor be held back from the duty he has undertaken by the danger of death. For he himself, when he had willingly taken up the defense of his brethren, that is, of the Jews, was called back from what he had begun by the terror of a false charge and fled from Egypt. And therefore, since the Lord had approved his affection but had seen that his condition was weak, he judged that the footstep of his soul and mind should be stripped of mortal bonds.

But if it troubles anyone for what reason in Egypt they are bidden to eat the lamb with shoes on, whereas the apostles are sent without shoes to preach the Gospel, he ought to consider that one who is set in Egypt must still beware of the bites of the serpent — for there are many poisons in Egypt —, and he who celebrates the Pasch in a type can lie open to a wound, but he who is a minister of the truth blunts poisons and does not tremble. Indeed a viper bit Paul on the island of Melita, and the inhabitants of that place, seeing the viper hanging from his hand, thought that he was going to die; but when they saw him standing unharmed, they said that he was a god, whom the poison could not hurt. And that you may know that this is true, the Lord himself says: behold, I have given you power to tread upon serpents and scorpions and upon all the power of the enemy, and they shall do you no harm.

The apostles are bidden not to take staffs in their hand; for so Matthew thought it should be written. What is a staff but the badge of power displayed and the instrument for avenging pain? So the disciples of the humble Lord — for in humility his judgment was taken away —, of the humble Lord, I say, carry out his precept by the duties of humility; for he sent them to sow the faith, men who would not compel but teach, nor put forth the force of power, but exalt the doctrine of humility. In this place he thought that patience too should be joined to humility, because he himself also, according to the testimony of Peter, when he was reviled, did not revile in return; when he was struck, did not strike back. This, then, is to say: be imitators of me; lay aside the pursuit of revenge; beat back the insolence of those who strike you not by returning the injury, but by the magnanimity of patience. No one ought himself to imitate what he blames in another; gentleness returns heavier wounds upon the insolent. With this fist the Lord struck back at the one who strikes, by saying: to him who strikes you on the cheek, offer the other also. For it comes about that he who notices that kindness has been returned to him in exchange for the injury he did condemns himself by his own judgment and is pricked in his feelings by a kind of goad.

Yet he has apostles whom he sent even with a rod, as Paul testifies, saying: what do you wish? Shall I come to you with a rod, or in charity and the spirit of gentleness? This rod the Apostle also gave to Timothy, saying: reprove, entreat, rebuke. Or perhaps before the Lord's Passion, which made firm the hearts of wavering peoples, gentleness alone was needful, and after the Passion correction. Certainly let the Lord soothe, let Paul rebuke; let him persuade who can soften even hard hearts, let him reprove who cannot carry all things by persuasion. Paul, then, had taken up the rod from the teaching of the Law. For he had read: he who spares the rod hates his son. He had read too that those who ate the lamb were bidden by a prophetic command to have a staff in their hands. And therefore the Lord says in the Old Testament: I will visit their iniquities with the rod; but in the New he offered himself, so that he might pardon all, saying: if you seek me, let these go. And elsewhere you have it that, when the apostles wished to ask for fire from heaven to consume the Samaritans, who would not receive the Lord Jesus within their city, he turned and rebuked them and said: you do not know of what spirit you are; for the Son of Man came not to destroy men's souls but to save them.

The more perfect, then, are sent without a rod; the weaker eat with a staff. But Paul too threatens a rod indeed, yet visits offenders in the spirit of gentleness. Indeed, that you may know that he is a mild teacher, he consults the will of the very people whom he reproves. What do you wish? He says shall I come to you with a rod, or in charity and the spirit of gentleness? Once he spoke of the rod; twice he added milder things, joining gentleness to charity. Yet at first he threatened, but he showed gentleness; for writing in the second epistle to the same Corinthians he says: I call God as witness upon my soul that it was to spare you that I did not come to Corinth. Hear for what reason he thought he should spare them: that I might not he says come to you again in sorrow. He cast away the rod and took up the affection of charity.

And greet no one on the way. Perhaps to some this may seem hard and proud, and not in keeping with the precept of the gentle and humble Lord, that he who commanded that one should yield even the place at table should in this place charge his disciples: greet no one on the way, though this is a common practice of courtesy. In this way inferiors are accustomed to win for themselves the favor of superiors; the Gentiles too have such exchanges of civilities with Christians. How does the Lord tear away this practice of human kindness?

But consider that it is not only this: greet no one, but that not for nothing was on the way added. Indeed Elisha too, when he sent his servant to lay his staff upon the body of the dead boy, charged him not to greet anyone on the way; for he bade him hurry in haste, so that he might carry out the duty of bringing about the resurrection, lest by conversing with someone who met him he be turned back from the task he had been charged with. So here too it is not the courtesy of greeting that is taken away, but the obstacle that would hinder devotion that is removed, so that, when divine things are commanded, human things may be set aside for a little. A greeting is a fair thing, but fairer, the more prompt it is, is the carrying out of divine things, which through delay has often incurred offense. And for this reason even honorable things are forbidden, lest a customary courtesy creep in and hinder the ministry of the duty, whose delay is a fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
