[[commentary]]
quote='''
Hence the Apostle says to you beautifully: But death reigned from Adam to Moses. What is Moses but the Law, since he himself is the interpreter of the Law? But the end of the Law is Christ Jesus. Sin, then, reigned in this world, and in sin death, cruel and intolerable, a kind of punishment of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And the kingdom of sin is the kingdom of death, which long prevailed over the whole world. Hence the Apostle also says: But death reigned from Adam to Moses even over those who did not sin after the likeness of the transgression of Adam, who is the form of the one to come. Truth came, the figure ceased; life came, the kingdom of death vanished; the remission of sins came, and the chains of sin were loosed. Before, even lighter offences were bound by the bonds of death; but after the coming of the saving Lord even graver crimes were remitted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
