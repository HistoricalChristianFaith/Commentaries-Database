[[commentary]]
quote='''
Therefore you are the custodian, not the master of your wealth, who bury gold in the earth; surely you are its servant and not its lord. But: Where thy treasure is, there is thy heart also. Hence in that gold you have buried your heart in the earth. Rather sell gold and buy salvation; sell a stone and buy the kingdom of God; sell your field and redeem for yourself eternal life. I speak the truth, because I confirm it by the words of Truth: If thou wilt be perfect, He says, sell what thou hast and give to the poor, and thou shalt have treasure in heaven. And do not become sad when you hear these words, lest it be said to you also: How hardly shall they that have riches enter into the kingdom of God! Rather, when you read this, consider that death can snatch these things from you, or the power of a stronger take them away; and furthermore, that you are seeking small things for great, perishable for eternal, treasures of money for treasures of grace. The former become corrupted, the latter endure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 14"
