[[commentary]]
quote='''
But what is more full of tribulation than when the very bed, given for common rest, inflicts a grievous wound? For then we are wont to recall what we have done, and the conscience within is pierced by the goads of its own deeds. Hence Scripture too says to such men: What you say in your hearts, be pierced for it also on your beds? It is indeed the remedy of a debt, but still it has wounded the conscience. But granted that sleep sometimes creeps upon the weary, we are terrified by dreams, we are harassed by visions, so that this is no longer rest but punishment. For thus the riches of the world pass away like the dream of one rising up. Someone has risen from the sleep of this body, and he has possessed nothing, and has lost the very thing he believed he had.

Set before me now that rich man who used to amass daily gains and various profits and was harassed by his own desires, suddenly coming to his senses and considering within himself that when he dies he will take nothing at all, nor will the glory of his house go down with him, and that the things he possesses in this life have some pleasure, but not for the future as well, and so opening his eyes to heavenly things. Does he not seem to you, like one who was drinking in dreams, to have drunk, and like one who was feasting in dreams, to have feasted, but then to have opened his eyes and learned that his soul hoped for something empty and is still hungry and still thirsty, because avarice has no limit and is not filled by plundering, but is spurred on, the more needy the more it has acquired? So this man too has risen, and the dream is vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 3"
