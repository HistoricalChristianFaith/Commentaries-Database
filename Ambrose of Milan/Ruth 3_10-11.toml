[[commentary]]
quote='''
And it is worth noticing that, found in a field full of harvest, she was gathering sheaves, as it is written, and keeping the produce for her mother-in-law, and that she did not go after a young man but followed a mature man; whence she also merited to hear: For you are a woman of virtue, or: For you have done your last mercy better than the first; for the last mercy, that of the Church gathered together, excels the earlier.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
