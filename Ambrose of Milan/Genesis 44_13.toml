[[commentary]]
quote='''
The Jews held him and wished to hinder him, but when the silver shone out in his sack, they tore their garments and went back. For Paul's free preaching for Christ stripped bare the people of the Jews and cut away all their grace,

and so they went back, who could not see before them. Those who lose Christ go back. Indeed in the Gospel too, when they were seizing the Lord Jesus for death, going back they fell to the ground. Rightly they were turning back, who were falling back from that heavenly grace into earthly ruin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 11"
