[[commentary]]
quote='''
Yet I do not think that this dream was shown to one or two, but set before all, in that the seven years of this world, fat and rich with worldly plenty, are swallowed up by those ages that are to come, in which there is perpetual rest and the spiritual observance of the Law, such as that tribe Ephraim, fruitful to the God of the fathers, may keep: a good cow, not distended with a bodily udder, but abounding in spiritual milk and grace, on the beauty of whose neck God says that he sits, as it is written: Ephraim is a heifer taught to love victory. But I passed over the beauty of her neck.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
