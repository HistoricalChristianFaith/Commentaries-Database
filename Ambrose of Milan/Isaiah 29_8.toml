[[commentary]]
quote='''
But this is a dream, and all the power of the world is a dream, not the truth. Indeed, it was through a dream that he saw his chief office restored to him. And Isaiah says that men of this kind, who in this world delight in prosperity, are just so. As one who eats and drinks in his sleep seems to himself, while he sleeps, to be filled with food or drink, but when he wakes begins to hunger the more — then he understands how empty was that food and drink of the dreamer — so he who sleeps in this world and does not open his eyes to the divine mysteries, as long as he is weighed down by the sleep of the body, thinks this worldly power to be of some moment — he sees it as though in sleep —; when he wakes, he discovers how empty is the pleasure of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
