[[commentary]]
quote='''
Good is diligence with wisdom, and discovery with natural talent. Indeed, holy Isaac, having union with wisdom close at hand, was walking in the field, or rather was withdrawing himself. Let us too first be united with wisdom, and so go out into the field, desiring to seek and to find. For many seek badly without wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"

[[commentary]]
quote='''
He it is whom even then the bondwoman persecuted; he it is on whose account it was even then said: Cast out the bondwoman; for the son of the bondwoman shall not be heir with my son Isaac; he it is for whom his father acquired a foreign bride; he it is, meek, humble and gentle, who, as Rebecca, that is, patience, was coming, went out into the field to withdraw apart. For it is the mark of a wise man to separate himself from the pleasures of the flesh, to lift up his soul and draw it away from the body; for this is to know oneself as man, who in the speech of the Chaldaeans is called Enos, in Latin man. Now Enos is he who undertook and hoped to call upon God, and so he is believed to have been taken up. So no one seems to be a man except him who hopes in God. And he who hopes in God is shown, by a clear interpretation of the truth, not to dwell on earth but, as one taken up, to cleave to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 1"

[[commentary]]
quote='''
But the perfect soul turns away from matter; it flees and spurns everything immoderate, unstable and malign, and neither looks upon nor draws near to the corruption of that earthly stain: it strains toward divine things, but flees earthly matter. And flight is not to leave the earth, but, while being on earth, to hold fast to justice and sobriety, to renounce vices, not the uses of the elements. Holy David fled from the face of Saul, surely not so as to leave the earth, but to avoid the contagion of a man harsh, heedless and faithless. Yet he fled cleaving to God, as he himself says: my soul has cleaved behind you. He drew himself away and lifted himself up from the vices of this world; he lifted up his soul, as Isaac in the field either withdrew himself or, as others have it, walked about. For this too shows what it is to have a familiar fellowship with the virtues: that each one walk about in the innocence of his heart, be mingled by no practice with earthly vices, pursue a blameless way with an unstumbling step of the mind, and open no place in himself to corruption.

Such was Isaac when he was awaiting Rebecca's coming, preparing himself for a spiritual union.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
