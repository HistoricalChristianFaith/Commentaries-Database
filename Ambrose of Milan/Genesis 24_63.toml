[[commentary]]
quote='''
He withdrew himself and cleansed himself from the vices of this world, elevating his soul like Isaac in the field, or (as others have it) walking freely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul"

[[commentary]]
quote='''
Good is diligence with wisdom, and discovery with natural talent. Indeed, holy Isaac, having union with wisdom close at hand, was walking in the field, or rather was withdrawing himself. Let us too first be united with wisdom, and so go out into the field, desiring to seek and to find. For many seek badly without wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
