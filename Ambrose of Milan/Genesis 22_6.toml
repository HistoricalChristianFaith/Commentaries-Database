[[commentary]]
quote='''
And he took the wood of the whole burnt offering and laid it on Isaac his son, and he himself took the fire in his hand, and the knife. The victim is consecrated by sacred ministries and commended as one to come, the victim of devotion that is first to be the bearer of a devout ministry. Isaac carried the wood for himself; Christ carried for himself the gibbet of the cross. Abraham accompanied his son, the Father accompanied Christ. Neither was Isaac alone nor Jesus alone. Thus, alone, he says: and I am not alone, because the Father is with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
