[[commentary]]
quote='''
The kingdom of God is not of this world, But it is not equality with God, but likeness to Him, unto which man must aspire. For Christ alone is the full image of God, on account of the unity of His Father's glory expressed in Him. But the righteous man is after the image of God, if for the sake of imitating the likeness of the Divine conversation, He through the knowledge of God despises the world. Therefore also we eat the Body and Blood of Christ, that we may be partakers of eternal life. Whence it follows, That ye may eat and drink at my table in my kingdom. For the reward promised to us is not food and drink, but the communication of heavenly grace and life.

But the twelve thrones are not as it were any resting-places for the bodily posture, but because since Christ judges after the Divine likeness by knowledge of the hearts, not by examination of the actions, rewarding virtue, condemning iniquity; so the Apostles are appointed to a spiritual judgment, for the rewarding of faith, the condemnation of unbelief, repelling error with virtue, inflicting vengeance on the sacrilegious.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And I appoint to you, as my Father appointed to me, a kingdom. The kingdom of God is not of this world. So man's emulation toward God is not one of equality, but of likeness; for Christ alone is the full image of God, because of the unity of the Father's brightness expressed in him; but the righteous man is after the image of God if, for the sake of imitating the likeness of the divine way of life, he despises this world through the knowledge of God and scorns earthly pleasures through receiving the Word, by which we are nourished unto life. Hence too we eat the body of Christ, that we may be partakers of eternal life. For it is not food and drink that is promised us by way of reward and honour, but the communion of heavenly grace and life; nor are the twelve thrones some sort of receptacles for bodily sitting; but since Christ, according to the divine likeness, judges by knowledge of hearts, not by questioning about deeds, rewarding virtue and condemning impiety, so the apostles too are formed for a spiritual judgment, by rewarding faith and by execrating unbelief, refuting error by virtue, pursuing the sacrilegious with hatred.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
