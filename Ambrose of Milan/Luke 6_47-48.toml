[[commentary]]
quote='''
And he teaches that the foundation of all the virtues is obedience to the heavenly precepts, through which this house of ours cannot be shaken, neither by the flood of pleasures, nor by the onset of spiritual wickedness, nor by the rain of the world, nor by the cloudy disputations of the heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
