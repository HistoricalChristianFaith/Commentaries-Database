[[commentary]]
quote='''
And so he prophesied that Ephraim was to be preferred to his elder brother by the order of the blessing as well, saying: In you shall Israel be blessed, saying: God make you as Ephraim and Manasseh. And therefore, although they were grandsons, they were adopted into the place of sons, so that they might not be without a share in their grandfather's blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 1"
