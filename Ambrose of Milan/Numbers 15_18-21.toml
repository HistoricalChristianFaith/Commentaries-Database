[[commentary]]
quote='''
On this subject the Lord says: When you are come into the land to which I bring you and shall eat of the bread of that country, you shall separate first-fruits of the Lord of the thing you eat. As you separate first-fruits of your barn-floors, so also shall you give first-fruits of your dough to the Lord. We are a composite of diverse elements mixed together, cold with hot, and moist with dry. This admixture is the source of many pleasures and manifold delights of the flesh. But these are not the first-fruits of this body of ours. Since we are composed of soul and body and spirit, the first place is held by that admixture in which the Apostle desires that we find sanctification: And may the God of peace himself sanctify you completely and may your spirit and soul and body be preserved sound, blameless at the coming of our Lord Jesus Christ. The first-fruit of this admixture are those of the spirit, that is to say, the creative and generating thoughts that emanate from the soul in its vigor. Only those thoughts are first-fruits which are devoid of malice and wickedness and all kinds of wrong-doing. There are, of course, certain bodily pleasures which are necessary. These are the pleasures of eating, sleeping, drinking, walking, and like functional processes. These, however, are not in the category of first-fruits. The Lord has put His stamp of approval, not on these, but on the others which we have mentioned, those thoughts and actions which imply chastity, piety, faith, and devotion. A clear example of this sort of thing is the offering of the patriarch Isaac. Here a father, totally immune to human emotion, proceeded to an act of sacrifice. He offered to God a clean victim and one devoid of fear and of cupidity of the flesh, although one might expect that his eagerness to offer would give way to his very real devotion as a father.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 1"
