[[commentary]]
quote='''
For those whom Christ binds he sets free, and those whom he ties he releases. In fact, he who has been called by the Lord as a slave is the Lord's freedman, and he who has been called free is the slave of Christ. And therefore Paul glories in his chains, saying: Paul, a prisoner of Jesus. What under others is an insult, under Christ is glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
But to serve justice is freedom; for he who was called in the Lord as a slave is a freedman of the Lord; likewise he who was called as a free man is a slave of Christ. Both conditions are excellent, to be under Christ, under whom there is both a precious slavery and a glorious freedom: a precious slavery, as acquired at the price of such great blood, and a glorious freedom, which no slavery of guilt, no chains of sins constrain, which no burdens of shameful deeds, no traffic in crimes, consign to the bond of a degenerate slavery.

Learn humility, O man; recognize the force of the Apostle's teaching. If you call yourself a slave, you are a freedman; if you boast that you are free, you are a slave. For he who was redeemed as a slave has freedom, and as for him who was called as a free man, it is good for him to recognize that he is a slave of Christ, under whom slavery is safe and freedom secure. Who would claim that Paul was ignorant, as it were, even in the law itself? He knew how to distinguish between a freedman and a free man, and therefore he spoke not carelessly but precisely: For he who was called in the Lord as a slave is a freedman of the Lord; likewise he who was called as a free man is a slave of Christ. For in truth we are all Christ's freedmen, none of us a free man; for all were begotten in slavery. Why do you take on the arrogance of freedom in a slave's condition? Why do you usurp titles of nobility, you, the inheritance of a slave? Do you not know that the guilt of Adam and Eve made you over to slavery? Do you not know that Christ redeemed you, he did not buy you? You were redeemed not with gold and silver from your vain way of life of your fathers' tradition, but with the precious blood of the Lamb cries the apostle Peter. Therefore you have been redeemed by the Lord, and you are a slave because you were created, you are a slave because you were redeemed, and you owe slavery both to him as your Lord and to him as your redeemer. Nor should you think the status of a freedman under Christ inferior to freedom. In dignity it is equal, in protection more excellent, in grace on a par, more wary against falling, better sheltered against pride. You have received freedom on such terms that you ought to remember the one who set you free, and that you should know that lawful deference must be paid to your patron, lest freedom be revoked from one who is ungrateful. What is more blessed than you, who reign under the Lord and serve as a soldier under a patron?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 3"
