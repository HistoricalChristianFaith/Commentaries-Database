[[commentary]]
quote='''
And so in conclusion, turning toward you, the prophet says: Pray ye, and pay to the Lord your God, that is: do not dissemble, O rich men,—the day is at hand—, pray for your sins, return gifts for the benefits which you have. From Him have you received whatever you may offer, to Him belongs what you are paying Him. Presents, He says, are mine, gifts are mine, that is, "the presents which you offer to me are my gifts; I have granted and have given them to you." Therefore the prophet says: "Thou hast no need of my goods; hence I offer Thine own to Thee, since I have nothing which Thou hast not given." It is faith that reconciles gifts, it is humility that commends offerings. By faith Abel offered to God a greater sacrifice. Above the gifts of his brother Cain was the gift of Abel pleasing because he surpassed in faith. Whence is it that the poor man's sacrifice pleases more than that of the rich? It is because the poor man is richer in faith, more wealthy in sobriety. And since he is poor, he is of those of whom it is said: Kings shall offer presents to thee. For not in those who bring presents clad in purple does the Lord Jesus delight, but in those who govern their passions and by the power of their minds have dominion over the lust of the body. Pray, therefore, rich men! You have not in your works what is pleasing. Pray for your sins and your heinous offenses, and return gifts to the Lord your God. Return them in the poor man, render them in the needy, lend them in the destitute, whom otherwise you cannot placate because of your crimes. Whom you fear as an Avenger, make your Debtor. I will not take calves out of thy house, He says, nor he-goats out of thy flocks, for all the beasts of the woods are mine. "Whatever you offer," He says, "is mine, because the whole world is mine. I do not demand the things that are mine; but rather the zeal of devotion and faith which you can offer from yourselves. I do not delight in ostentation in sacrifices; only, O man: Offer to God the sacrifice of praise, and pay thy vows to the Most High."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 16"
