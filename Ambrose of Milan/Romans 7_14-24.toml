[[commentary]]
quote='''
Consider, then, O man, who you are, by what you may guard your salvation and your life. What, then, is man? Is he soul, or flesh, or the union of both? For what we are is one thing, what is ours another; he who is clothed is one, the garment another. We read in the Old Testament: all the souls that went down into Egypt, said of men. And elsewhere it is said: my spirit shall not remain in these men, because they are flesh. So it is read of each of the two that it is called man, both of the soul and of the flesh. But there is this distinction: where soul is said for man, the Hebrew is meant, cleaving to God, not to the body, as in that saying: every simple soul is blessed; but where flesh is named for man, the sinner is expressed, as in that saying: but I am carnal, sold under sin. For what I work, I do not know; for I do not do what I will, but what I hate, that I do. This latter saying now concerns both as well; for he who wills is one, he who hates another, he who does yet another. Then he added: if, then, I do what I hate, I consent to the law, that it is good. But now it is no longer I who work it, but the sin that dwells in me. This too, more expressly: I see the law of my flesh fighting against the law of my mind and making me captive in the law of sin. And yet, when he had declared that man is at strife with himself in both, that is, the inner and the outer man, he chose to set himself on the side of the soul rather than on that of the body, because his soul was being dragged captive to sin, the soul in which he would rather be, and in which he affirms that he is, saying: unhappy man that I am! who will free me from the body of this death? He longs to be freed from it as from a foreign enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 2"
