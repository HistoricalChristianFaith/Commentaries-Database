[[commentary]]
quote='''
If you ascribe this to the Devil, what other cause of enmity is there except envy? As Solomon says: By the envy of the devil death came into the world. The cause of envy was the happiness of man placed in Paradise, because the Devil could not brook the favors received by man. His envy was aroused because man, though formed in slime, was chosen to be an inhabitant of Paradise. The Devil began to reflect that man was an inferior creature, yet had hopes of an eternal life, whereas he, a creature of superior nature, had fallen and had become part of this mundane existence. This is the substance of his invidious reflection: "Will this inferior acquire what I was unable to keep? Will he leave the earth and attain heaven, whereas I have fallen to earth thrust down from heaven? I have many ways and means by which to deceive man. He was made of slime, earth is his mother, and he is involved in things corruptible. Although of superior nature, his soul is nevertheless subject to temptation, since it exists in the prison house of the body—witness my own experience in being unable to avoid sin. This, therefore, is my first approach, namely, to deceive him while he is desirous of improving his condition. In this way an attempt will be made to arouse his ambition. The next approach is by way of the flesh, promising fulfillment of all his desires. Finally, how else can I appear to be wiser than all men if not by the exercise of cunning and fraud in my warfare of entrenchment against man?"
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"
