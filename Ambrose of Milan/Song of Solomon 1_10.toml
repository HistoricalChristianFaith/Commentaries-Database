[[commentary]]
quote='''
And therefore she is praised because, with the heavenly precept illuminating her, she is now beautiful, now lovely, she who displays in her face the beauty of chastity, and lifts up the necklaces of her neck, on which are the insignia of patience and humility. And therefore, praising his bride, he said:

How beautiful your cheeks have become, like a turtledove's, your neck like necklaces. The face is freer where there is the consciousness of love; and to bear the yoke of Christ is sweet, if you consider it the ornaments of your neck, not burdens. Lift up your eyes, then, always to your Lord, and seek God, that you may find him. Raise your neck: you wear necklaces, not chains: even dumb animals rejoice in necklaces, and seem to themselves to be adorned with trappings rather than tied. Cheeks like a turtledove's: let them bear the insignia of modesty: The necklaces of the neck: let them lift up the confidence of freedom; for the yoke of Christ is light, and therefore the neck is not pressed down by it, but lifted up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
