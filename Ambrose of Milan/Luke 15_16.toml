[[commentary]]
quote='''
And he longed he says to fill his belly with the husks. For the luxurious have no other care but to fill their belly, whose god is the belly. And what food is fitter for men of this sort than that which, like a husk, is empty within and soft without, by which the body is not refreshed but filled, so that it is more a burden than a use?

There are those who take the swine for the herds of demons, the husks for the slender virtue of empty men and the boastfulness of their discourses, men who can profit nothing, displaying, by a kind of empty seduction of philosophy and a kind of applause for sonorous eloquence, pomp rather than any usefulness; but these delights cannot be lasting, and therefore no one gave to him;

for he was in the region of him who has no one, because he does not have those who are. For all the nations are counted as nothing, but God alone is he who gives life to the dead and calls the things that are not as the things that are.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
