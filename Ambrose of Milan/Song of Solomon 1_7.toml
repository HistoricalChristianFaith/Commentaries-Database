[[commentary]]
quote='''
Since the Synagogue says in the Canticle of Canticles: ‘Show me, O thou whom my soul has loved, where thou feedest, where thou liest at midday, lest perchance I begin to wander after the flocks of thy companions,’ that is: Announce to me, O Christ, whom has my soul loved. Why not rather whom [my soul] loves? The Synagogue loved, but the Church loves and never changes her affection for Christ. ‘Where thou feedest,’ we read, ‘where thou liest at midday.’ I desire to follow you into those places like a foster-child, to whom I once held fast as if in wedlock and I wish to search for your flock because I have lost mine. You feed at midday in the Church’s pasture where Justice shines, where Judgment gleams like the noonday, where no shadow is seen, where the days are longer, because the Sun of Justice dwells therein for a longer time just as in the months of summer. The day of the Lord is, therefore, not brief. It is long because it has been written: ‘Before the great day of the Lord doth come.’ Hence Jacob says: ‘All the days of my life are brief and evil,’ for a dubious light is evil. Brief days are, therefore, of dubious light and are not luminous. The contrary is true of the long days, as many people who live in warm countries realize from experience. Accordingly, the Synagogue in its brief and evil days was in very deep shade. Its type is often expressed in the person of Jacob or of his people. It did not behold the Sun of Justice shining from overhead, but, rather, since winter was at hand, shining from the direction of the south. But this is said to the Church: ‘The winter is now past, is over and gone. The flowers have appeared in our land, the time of the harvest has come.’ Winter existed before the coming of Christ; after His coming, the flowers of the spring and summer’s harvest appear. Since it faces the light shining from the south and from the region of the converted Gentiles, the Synagogue lies in shadow. The Gentiles ‘who sat in darkness’—the Gentiles, the people of the nations, a confused people—‘have seen a great light; to them that sat in the region and shadow of death, a light has arisen.’ This is a great and divine light which is not darkened by any shadow of death. So it shines from above, because through the voice of Zachary it is written: ‘Wherewith the Orient from on high has visited us, to shine on those who sit in darkness and in the shadow of death.’ There is, of course, a shadow of salvation, not of death, as has been said: ‘Thou shalt protect me under the shadow of thy wings’—‘shadow,’ in fact, because it is of the body; ‘shadow,’ too, because it is of the cross. It is the shadow of salvation, because in it was the remission of sins and the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
And when she speaks of the Word, as the splendour of the Word shines upon her, she turns to him and says: where do you pasture? where do you rest at midday? Rightly she says where do you pasture? because the Word of God is royal; where do you rest? because it is moral; at midday, because it is mystical, since it was at midday that Joseph, set at a banquet with his brothers, revealed the mysteries of times to come. But David too says: reveal your way to the Lord and hope in him, and he himself will act, and he will bring forth your justice as the light and your judgement as the midday. And Paul himself declared that a light shone round about him at midday, when he was converted from persecution to grace. She complains, then, that she has been forsaken, that she has been left destitute, poor after being rich; for she abounded in the gift of graces, but she began to be in want when the abundance of the divine presence was denied her, and so she asks to be kept at least as a hired servant, she who before claimed for herself the grace of a more precious union.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
And when she speaks of the Word, with the splendour of the word shining upon her, she turns to him and says:

Where do you pasture, where do you rest at midday? Rightly she says, where do you pasture, because the Word of God is royal: where do you rest, because it is moral: at midday, because it is mystical: since indeed at midday Joseph, set at the banquet with his brothers, revealed the mysteries of times to come. But David also says: Reveal your way to the Lord and hope in him, and he will do it, and he will bring forth your justice as the light, and your judgment as the midday (Ps. 36 (37):5). And Paul himself declared that a light shone round him at midday, when he was turned from persecution to grace.

She complains, then, that she has been forsaken, that she has been left destitute, poor instead of rich; for she abounded in the gift of graces: but she began to be in need when the abundance of the divine presence was denied her. And therefore she asks to be held even as a hired servant, she who before claimed for herself the grace of a more precious union.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Thus that one invites the bridegroom into her garden; this one, asking where he pastures, says to him:

Tell me, you whom my soul has loved. Why do you say whom my soul has loved, and not whom it loves? Why did you let go him whom you held? You loved him by the faith of the fathers, you lost him by unbelief: you held him by the bonds of love, you lost him by the long rope of faithlessness. Therefore you do not know where he pastures, where he rests; for if you knew, you would not ask. For you say: Where do you pasture, where do you rest at midday? You know that the midday is the Church, which holds Christ, and you seek him in the nights. Tell me, she says, O Christ, answer, if only because you were formerly dear and beloved to me; although I have lost the prerogative of so great a love, yet you, as one who is dutiful, answer me: Where do you pasture, where do you rest? You have left me, you have gone away to the Gentiles, you have withdrawn far from me, and have become nearer to those from whom you were far. But you have become near, because they believed by your blood. You withdrew from me, because I did not receive the cross as the redemption of the world, but as the condemnation of a guilty man. But those who received him as the author of salvation are at midday; for them you give light, upon them you shine forth, for them your grace is warm like midday. To me you were the morning, when I still believed, but I did not believe fully, because I was not found at midday, like Joseph with his brothers, who kept midday: you have become midday for those who feed on your riches and hope in you. Therefore, as David said: You will bring forth their justice as the light, and their judgment as the midday (Ps. 36 (37):6).

You seek, then, as a stranger, you who were the nearest; as one poor, you who were rich: you wish to follow, you who used to go before, and would that you might at least follow those whom you ought to have gone before! You desire to be a hired servant, you who before used to gather hired servants; and so this is the voice of a hired servant, saying: Lest perhaps I become as one veiled over the flocks of your companions. You who before used to receive proselytes from the Gentiles now yourself wish to be received among the nations as a proselyte, and to be gathered in as a newcomer. The Word of God answered the longing soul:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
