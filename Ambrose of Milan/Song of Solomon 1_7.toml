[[commentary]]
quote='''
Since the Synagogue says in the Canticle of Canticles: ‘Show me, O thou whom my soul has loved, where thou feedest, where thou liest at midday, lest perchance I begin to wander after the flocks of thy companions,’ that is: Announce to me, O Christ, whom has my soul loved. Why not rather whom [my soul] loves? The Synagogue loved, but the Church loves and never changes her affection for Christ. ‘Where thou feedest,’ we read, ‘where thou liest at midday.’ I desire to follow you into those places like a foster-child, to whom I once held fast as if in wedlock and I wish to search for your flock because I have lost mine. You feed at midday in the Church’s pasture where Justice shines, where Judgment gleams like the noonday, where no shadow is seen, where the days are longer, because the Sun of Justice dwells therein for a longer time just as in the months of summer. The day of the Lord is, therefore, not brief. It is long because it has been written: ‘Before the great day of the Lord doth come.’ Hence Jacob says: ‘All the days of my life are brief and evil,’ for a dubious light is evil. Brief days are, therefore, of dubious light and are not luminous. The contrary is true of the long days, as many people who live in warm countries realize from experience. Accordingly, the Synagogue in its brief and evil days was in very deep shade. Its type is often expressed in the person of Jacob or of his people. It did not behold the Sun of Justice shining from overhead, but, rather, since winter was at hand, shining from the direction of the south. But this is said to the Church: ‘The winter is now past, is over and gone. The flowers have appeared in our land, the time of the harvest has come.’ Winter existed before the coming of Christ; after His coming, the flowers of the spring and summer’s harvest appear. Since it faces the light shining from the south and from the region of the converted Gentiles, the Synagogue lies in shadow. The Gentiles ‘who sat in darkness’—the Gentiles, the people of the nations, a confused people—‘have seen a great light; to them that sat in the region and shadow of death, a light has arisen.’ This is a great and divine light which is not darkened by any shadow of death. So it shines from above, because through the voice of Zachary it is written: ‘Wherewith the Orient from on high has visited us, to shine on those who sit in darkness and in the shadow of death.’ There is, of course, a shadow of salvation, not of death, as has been said: ‘Thou shalt protect me under the shadow of thy wings’—‘shadow,’ in fact, because it is of the body; ‘shadow,’ too, because it is of the cross. It is the shadow of salvation, because in it was the remission of sins and the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
