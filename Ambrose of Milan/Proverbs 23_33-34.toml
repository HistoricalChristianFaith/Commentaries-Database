[[commentary]]
quote='''
You observe, then, children, how often the cause of sinning overturns even a good purpose, and therefore you ought first to flee and avoid the causes themselves. You do not wish to be caught by love: then do not fix your gaze on the beauty of a woman, because when your eyes have seen a strange woman, then your mouth will speak perverse things, and you will lie as in the heart of the sea and like a helmsman in a great whirlwind. For the multitudes of desires make a great storm, which, as in a kind of strait of the body, toss the voyager this way and that, so that the mind cannot be its own helmsman, not knowing day from night in the darkness of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
