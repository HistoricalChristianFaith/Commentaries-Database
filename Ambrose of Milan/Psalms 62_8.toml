[[commentary]]
quote='''
Hence he exhorts to faith the peoples of the Gentiles whom he has called together and won for his Father by his blood, saying: Hope in him, all the assembly of my people, that is, not Israel alone, but "all", he says; nor the remnant alone, but also the fullness of the Gentiles; nor the Gentiles alone, but Israel; for when the fullness of the Gentiles has come in, then all Israel shall be saved. Who can comprehend the divine mysteries? Their multitude is so great that rightly Paul marvels and rightly has said: O the depth of the riches of the wisdom and knowledge of God! The Gentiles were rejected so that Israel might be chosen; afterwards Israel was blinded on account of the calling of the Gentiles, and the remnant of blinded Israel was saved according to the election of grace, after the fullness of the Gentiles had come in. So the fault of Israel profited the Gentiles, and the faith of the Gentiles set the Israelite people free.

Pour out, he says, your hearts before him. He who puts on faith ought first to put off unbelief and empty his heart of every stain of malice, so that his heart may become capable of spiritual grace. And therefore the Apostle says: Be renewed in the spirit of your mind; for when the old malice is poured out, a new grace is taken in, by which each one is renewed. So the Son of God says: Pour out your hearts before him, because he knew that the Father would say: I will pour out of my Spirit upon all flesh. There is also that manner of speaking, that we seem to pour out our heart when we open all the thoughts and wishes of our heart to someone. Let us, then, cast our thoughts upon God and not believe that anything is hidden from him. We pour out our heart before him when we empty out human disputings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
