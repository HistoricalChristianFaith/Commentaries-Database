[[commentary]]
quote='''
And he saw another dream and told it to his father and his brothers, namely that the sun and the moon and eleven stars worshipped him. Hence his father rebuked him, saying: What then will this vision be that you have dreamed? Shall I and your mother and your brothers come and worship you upon the earth? Who is he whom parents and brothers worshipped upon the earth but Christ Jesus, when Joseph and his mother with the disciples worshipped him, confessing the true God in that body, of whom alone it was said: Praise him, sun and moon; praise him, all you stars and light? And what does the father's rebuke signify but the hardness of the people of Israel, from whom is Christ according to the flesh, whom even today they do not believe to be God and are unwilling to worship as Lord, because they know that he was born of them? So they hear his answers, and do not understand: they themselves read that the sun and the moon praise him, but they refuse to believe that it was said of Christ. So Jacob is deceived by a type that belongs to another, but he is not deceived in his own love. His fatherly love does not go astray; it is the feeling of the people that would go astray that is expressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 2"
