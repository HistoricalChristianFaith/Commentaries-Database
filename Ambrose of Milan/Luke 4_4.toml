[[commentary]]
quote='''
You see then what kind of arms He uses to defend man against the assaults of spiritual wickedness, and the allurements of the appetite. He does not exert His power as God, (for how had that profited me,) but as man He summons to Himself a common aid, that while intent upon the food of divine reading He may neglect the hunger of the body, and gain the nourishment of the word. For he who seeks after the word cannot feel the want of earthly bread; for divine things doubtless make up for the loss of human. At the same time by saying, Man lives not by bread alone, He shows that man was tempted, that is, our flesh which He assumed, not His own divinity.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But see the arms of Christ, with which he conquered for you, not for himself. For he who showed that by his majesty stones could be turned into bread through the transfusion of another nature teaches that you must do nothing at the devil's pleasure, nor for the sake of displaying power. At the same time, in the temptation itself learn the crafty cunning of the devil. He tempts so as to probe, he probes so as to tempt. The Lord, on the contrary, deceives so as to conquer, and still conquers so as to deceive. For had he changed the nature, he would have betrayed the Creator. So he answered in a middle way, saying: it is written that not by bread alone does man live, but by every word of God.

You see what kind of arms he uses, with which he defends man against the onset of spiritual wickedness, fenced and fortified against the incitements of gluttony. For he does not use his power as God — for what would that have profited me? — But as man he summons for himself the common help, so that, intent on the food of divine reading, he neglects the hunger of the body and acquires the nourishment of the heavenly word. Intent on this, Moses did not desire bread; intent on this, Elijah did not feel the hunger of a rather long fast. For he who follows the Word cannot desire earthly bread, since he receives the substance of heavenly bread — for there is no doubt that divine things surpass human ones, and spiritual things bodily ones — and so he who desires the true life waits for that bread which, through its imperceptible substance, strengthens human hearts. At the same time, when he says: man does not live by bread alone, he shows that it was man that was tempted, that is, what he took up from us, not his divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
