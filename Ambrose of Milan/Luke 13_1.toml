[[commentary]]
quote='''
In those whose blood Pilate mingled with the sacrifices, there seems to be a certain mystical type, which concerns all who by the compulsion of the Devil offer not a pure sacrifice, whose prayer is for a sin, (Ps. 109:7.) as it was written of Judas, who when he was amongst the sacrifices devised the betrayal of our Lord's blood.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Concerning those Galileans, however, whose blood Pilate mixed with their sacrifices, there seems to be a certain figure touching those who, under the compulsion of the devil, do not offer sacrifice purely. Theirs is prayer unto sin, as was written of Judas the betrayer, who, placed amid the sacrifices, was planning the betrayal of the Lord's blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
