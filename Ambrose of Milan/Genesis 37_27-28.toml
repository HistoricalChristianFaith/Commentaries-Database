[[commentary]]
quote='''
And so that we may recognize that all this is a mystery concerning the people and the Lord Jesus, Come, it says, let us sell Joseph to the Ishmaelites. What does the name Joseph mean by interpretation, if not that it signifies divine grace and the expression of the most high God? Who then is sold but he who, though he was in the form of God, did not judge it plunder to be equal to God, but emptied himself, taking the form of a slave? For we would not have bought him, had his own not sold him. They sold badly; they bought worse. They sold to merchants; they bought a good fragrance from traitors; for Judah sold, and the Ishmaelites bought, who by Latin interpretation are signified as 'hating their God'. Therefore in one place we find Joseph bought for twenty, in another for twenty-five gold pieces, in another for thirty, because Christ is not worth one and the same price to all. To some less, to others more. The faith of the buyer is the increase of the merchandise. To the more devout God is more precious; to the sinner the Redeemer is more precious. He is worth more to him too who has more grace. But he is also worth more to him to whom much has been given, because he to whom more has been forgiven loves more, as the Lord himself declared in the Gospel concerning that woman who poured ointment upon his feet and washed them with tears and wiped them with her hair and dried them with kisses, of whom he said to Simon: Therefore I say to you: her many sins are forgiven her, because she loved much. But he to whom less is forgiven loves less. Sometimes the differences of price carry the expression not only of a quantity but also of a number, as you have in the case of the ointment which the Lord said had been poured out for his burial, as it is written, when Judas says: This could have been sold for three hundred denarii; by this number it is not a quantity but the signification of the cross that seems to be expressed. So here too the difference of twenty or thirty gold or silver pieces carries a sign of twofold or threefold perfection. For the twenty-five gold pieces of the jubilee, which is the number of remission, signify the most precious portion. Here too, so that you may notice the figure of the Lord's passion, Judah the patriarch says: Let us hand Joseph over to the Ishmaelites; but let our hands not be laid upon him. And well had he said above: But do not lay hands on him, which is what the Jews said at the Lord's passion: It is not lawful for us to put anyone to death, so that the word of Jesus might be fulfilled, signifying by what death he was to die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
