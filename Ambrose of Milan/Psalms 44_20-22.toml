[[commentary]]
quote='''
There follows: If we have forgotten the name of our God, and if we have spread out our hands to strange gods, will not God require these things? — Aquila: he will search out these things? Symmachus: he will find these things? — for he knows the hidden things of the heart. For for your sake we are put to death all the day; we are counted as sheep for slaughter. What does he mean by 'God will require'? As if, unless he requires, he does not know; and God will so require your forgetfulness, which has crept in, as to take away every trace of it. Hence Aquila too said: he will search out. For surely he who knows the hidden things of the heart, how does he seek, he to whom even the things within are manifest? For before God the conscience of each betrays itself, and the thought of man before him either condemns or clears itself. Indeed Aquila said the visions of the heart, because he sees our heart, and every thought of our heart is laid open before God, and the image of our thoughts shines back to him. Aquila said that well: in you we are put to death, since it is glorious to die in Christ, and he dies in him who for his name has been crowned by a sacred passion. But why do you wonder that this verse declares that God requires the hidden things of the heart, when elsewhere you have read that God is the searcher of the heart? Why do you wonder too if the majesty of the divine substance cannot be unfolded in our words, when the Apostle says: Do not judge anything before the time, until the Lord comes, who will bring to light the hidden things of darkness and will make manifest the counsels of the hearts; and then each one will have praise from God? We often read of the darkness of the heart in place of crime, indeed almost everywhere. See, then, whether these hidden things of darkness are not the hidden things of the heart, and whether they have not received the name of darkness because they are not detected by others but lie hidden. And therefore the Lord is declared to be about to bring to light on the day of judgement the hidden things of darkness, because the heart of each, which before was hidden, will be made manifest, known indeed to Christ alone, who, knowing the grace of his judgement, says: There is nothing hidden that will not be made manifest.

There are also many things which we suppress out of modesty and, to fulfil the heavenly command, keep to ourselves in silent affection, so that we may not seem to glory in what is ours and, by publishing them, begin to lose their fruit. There are also the hidden things of wisdom which the apostle Paul heard when caught up into paradise; and because it was not lawful for a man to speak them, he kept them covered within himself, not because he begrudged others their use or grace, but because what it was not lawful for a man to speak perhaps also did not profit a man to hear; these the Lord will bring to light when the time for bringing secrets to light has come. See whether you may not find some difference in the Gospel too, where he said: There is nothing hidden that will not be made manifest, nor covered that will not be revealed. Yet this supports the former interpretation, so that we may believe both to be about good things, because it is written: The Lord knows those who are his. He knows his own, then, and he knows those who know God, but he ignores those who ignore God; for he who ignores will be ignored. The Lord, then, recognizes what is good; the things full of divine knowledge, the hidden things of wisdom, the Lord knows; but he turns away from the things full of iniquity and sin.

Indeed, if you consider the person of these men, whom no forgetfulness of divine worship separated so that they spread out their hands to a strange god, and who were unwilling to lay open their souls, you will understand that in their hidden things there were no crimes, but they held the things that belong to innocence, since they were put to death for the worship of God and all the day long were dwelling in death, as Paul dwelt, who says: I die daily, by your glory. And truly Paul died daily according to the flesh, set in fastings, in shipwrecks, in various dangers, in miseries; but he did not die wholly. His outer man died, but the inner was renewed, and therefore he did not fail when he was pressed by so many dangers, because, though his outer man was being corrupted, the inner was renewed from day to day, since the faith and grace of working of each one lights up the day for him. Hence the apostle Paul did not know night either, because he who is renewed is always in the light. Or does he not seem to you to be in the light who holds within himself the charity of Christ? And therefore, secure about being sacrificed, he does not flee hard things, nor can any persecution or famine or sword separate from Christ the Lord him whom the bonds of divine charity bind fast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
