[[commentary]]
quote='''
Fittingly, therefore, does David, assuming the character of Adam, say: My soul is humbled down to the dust, my belly cleaveth to the earth. He used the word "cleaveth" in reference to the serpent who feeds on earthly iniquities.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
