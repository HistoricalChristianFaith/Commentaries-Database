[[commentary]]
quote='''
By this finger, as we read, God wrote on the stone tablets which Moses received. For not with a finger of flesh did God make the forms and elements of those letters which we read; by his Spirit he gave the law. And so the apostle said: "For the law is spiritual, which indeed is written not with ink but with the Spirit of the living God; not in tables of stone but in fleshly tables of the heart." For, if the letter of the apostle is written in the Spirit, what stands in the way of our being obliged to believe that the law of God was written not in ink but in the Spirit of God, which surely does not stain the secrets of our heart and mind but illuminates them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25203.html'
source_title="On the Holy Spirit 3.3.13"

[[commentary]]
quote='''
The book of your conscience will be opened, the book of your heart will be opened, our fault will be read out. There is a book there where there is a tablet; rather, there are books inscribed where there are tablets inscribed, which the apostolic teaching inscribes with the Holy Spirit, as we read where Paul says: you are our letter, inscribed not with ink but with the Spirit of the living God, not on tablets of stone but on fleshly tablets of the heart. There are, then, tablets of the heart inscribed by the Holy Spirit; these will be read out; if you have done well, the writing will remain. See that you do not take away the grace of the Holy Spirit, see that you do not erase it and write your shameful deeds in ink, lest the day of judgement come and the judge say: "let the books be read out, let the tablets of his deeds be read out", and say to you: "I wrote your tablets; why did you erase my letters? I too wrote my gifts; how did you erase my favours and write your disgraces? Did you not read that I write? Did I not say to you through the mouth of my prophet: my tongue is the pen of a scribe writing swiftly? And the judgement belongs to the Word".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
