[[commentary]]
quote='''
The sea is holy Scripture which has within it profound meanings and the mysterious depths of the prophets. Into this sea many rivers have entered. Delightful and clear are these streams. These fountains are cool, springing up into life everlasting. There, too, are "pleasant words, like honeycomb," and courteous conversations which water souls with the sweetness of moral commands. The streams of holy Scripture are diverse; you know that which you should drink from first, second, and last.
'''
source_url=''
source_title="LETTER 15"

[[commentary]]
quote='''
And certain wounds of sins are bathed with the ointments of the divine discourse, and are healed by the stronger food of the Word as by bread and by the sweeter discourse as by honey. That words are foods Solomon teaches elsewhere too, saying: good words are honeycombs. In that garden, then, there are good words: one to restrain guilt, another to rebuke iniquity, another to make arrogance die and, as it were, bury it, when someone who has been rebuked renounces his errors. There is also a stronger word, which strengthens the heart of man with the more solid nourishment of heavenly Scripture. There is also a persuasive word, sweet as honey and yet pricking the conscience of the sinner in its very sweetness. There is also a word of more fervent spirit, which inebriates like wine and gladdens the heart of man; there is also a milky word, pure and white.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
