[[commentary]]
quote='''
He set down first a threefold writing, and added two things, counsel and knowledge. But knowledge is twofold, one of incorporeal things, the other of corporeal; whence you have also in what follows: Your two breasts are like two twin fawns of a roe, which feed among the lilies, until the day breathes and the shadows decline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
