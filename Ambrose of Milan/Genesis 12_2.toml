[[commentary]]
quote='''
I will bless he says you and make you into a great nation. He pledges immortality when he promises a race — for the race seems to be immortal, while the persons of individuals are mortal, as of men, as of horses, as of bees, of which someone says: but the race remains immortal —; yet much better is this, that by a great nation he meant the perpetual posterity of the Church and that heavenly generation, which is truly great, so that . . . . . we die to sin, we are reborn to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 1"
