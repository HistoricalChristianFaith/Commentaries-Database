[[commentary]]
quote='''
For we read in holy Jeremiah: Who are you, O Lord? You made heaven and earth in your great power and with your lofty arm. Great power, then, made heaven. What is this great power, the Father's or the Son's? Certainly the Father's is great power — for he himself made heaven and earth through the Son, as you have it: In the beginning God made heaven and earth — but yet the Son too is great power. For when you read that the Son is the power of the Father, as you have Christ the wisdom and power of God, surely, since the Son is the power of the Father, the Son is great power. How, then, is he denied to be almighty whom we confess to be the great power of God? This great power, then, made heaven, because the Son too made heaven, as you have it: All things were made through him. Therefore if both the Father made it and the Son, surely the unity of the deed indicates the unity of operation. The operation of the Father and of the Son, then, does not differ. But if the operation is one, surely the power of the operation is one, and the majesty of the things made is one. So much concerning the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
