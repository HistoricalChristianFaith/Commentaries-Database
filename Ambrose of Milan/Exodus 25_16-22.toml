[[commentary]]
quote='''
This, then, is the Word, which surpasses all, which says to Moses at the building of that ark of the testimony: And you shall put into the ark the testimonies, whatever I shall give you, and you shall make the placing of the mercy seat; and below: You shall place the mercy seat upon the ark, above, and you shall put in the testimonies which I shall give, and I will make myself known to you from there and will speak to you from above, that is: from there where he is above the heavens, where he is with the Father, from there I will speak to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 3"
