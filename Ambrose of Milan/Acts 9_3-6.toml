[[commentary]]
quote='''
Finally, a light shone round Saul on the way when Christ met him, whence the persecutor was even blinded as the light of God shone forth. Why, then, was he blinded, unless because he had not acknowledged Christ? For if he had known the arbiter of light, he would not have lost the light of his eyes. Finally, when he acknowledged him, he received it back. It is an indication that he did not know Christ that, when he heard the voice: Saul, Saul, why do you persecute me? he answered: Who are you, Lord? He would not have asked who he was if he had known him. Hence the Lord too speaks as to one who does not know: I am Jesus whom you persecute. It is hard for you to kick against the goad. And he said: Lord, what must I do? See the fitting parts each of them plays. The physician threatens so that he may correct, frightens so that he may cure. The sick man first asks about the person of the physician, whether he is fit, one by whom he may presume he can be healed; when he heard the author of the medicine, he asked for the remedy and found health. Finally, from him as he came near he not only drove out the blindness, but he also received a light that he had not had, so that he saw Christ, whom he had not seen before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
