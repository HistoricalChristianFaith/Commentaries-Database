[[commentary]]
quote='''
Again, when the sun was now at its setting, a flame came to be. And behold, a smoking furnace and lamps of fire, which passed through the midst of those divided pieces. Even if anyone doubted about what went before, what follows would confirm it, when we read that a flame came to be at sunset, to light up the evening times of the world, to shine in the darkness, to reveal what was hidden. Then straightway a smoking furnace was seen, by whose likeness human life seems to be expressed, entangled and wrapped up in the iniquities of this world, not having the brightness of true radiance and the splendour of pure fire. Within, like a furnace, it seethes with various desires and pants with certain fires of longings; without, it is covered over, as it were, with a kind of smoke, so that it may not see the face of truth. And so the eyes of the soul are overshadowed and covered with a kind of mist, so that the sight of the mind is confounded by a sort of ball of smoking cloud, so that it cannot behold pure things, until the Lord Jesus directs the heavenly lamps, that is, the radiance of his glory, when they shall not need he says the light of a lamp and the light of the sun, because the Lord himself will be light to all, and he himself will illuminate all the things of this world, whose division was learned above and is now made manifest in the light, so that not through a mirror in an enigma, nor in part, but face to face the solidity of truth and that which is perfect may be seen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
