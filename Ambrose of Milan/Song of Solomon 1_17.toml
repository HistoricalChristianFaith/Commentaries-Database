[[commentary]]
quote='''
But why do I linger in describing just the vine, when all species of trees have their utility? Some are created to provide fruit; others are granted for our use. Those which are not overproductive of fruit are nevertheless more valuable for the uses they serve. The cedar is suitable for constructing the roof of a house, because its material is of such a kind as to furnish both spacious length for the roof and a quality of lightness for the walls. For the construction of rafters and the adornment of the pediments the most adaptable wood is that of the cypress. Hence, the Church, too, tells us in the Canticles: ‘The beams of our houses are of cedar, our rafters of cypress trees.’ These words point to the beautiful adornments of its pedimental structure, which, as beams do, uphold by their excellent qualities the superstructure of the Church and give charm to its façade.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
The beams of our houses are cedars. By the appearance of the cedar the glory of the forefathers who were just is designated. For the just man will flourish like the palm tree, and like the cedar which is in Lebanon he will be multiplied (Ps. 91 (92):13); for as the cedar does not rot, so neither is the glory of the forefathers corrupted by any age.

Our panelled ceilings are cypresses. This kind of tree never loses its greenness; in winter and summer alike it nourishes its foliage, and does not change to a different colour. This tree alone the wind never strips of its honour, it alone is never stripped of its old covering, nor clothed with new flower. So too apostolic grace knows no failing, but flourishes in its old age. The soul, then, knows no corruption, she who is vigorous in flourishing members, and always sustains with patient magnanimity the summits of justice and of the other virtues; and therefore she does not flow away nor fail; because nothing in her is cracked or slack, nothing unsteady, nothing slippery, nothing that could pour out of her through a fault of speech. There follows the Church, or the faithful soul; I say the soul, because nothing is so much man as the soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
