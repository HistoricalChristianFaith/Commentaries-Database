[[commentary]]
quote='''
But why do I linger in describing just the vine, when all species of trees have their utility? Some are created to provide fruit; others are granted for our use. Those which are not overproductive of fruit are nevertheless more valuable for the uses they serve. The cedar is suitable for constructing the roof of a house, because its material is of such a kind as to furnish both spacious length for the roof and a quality of lightness for the walls. For the construction of rafters and the adornment of the pediments the most adaptable wood is that of the cypress. Hence, the Church, too, tells us in the Canticles: ‘The beams of our houses are of cedar, our rafters of cypress trees.’ These words point to the beautiful adornments of its pedimental structure, which, as beams do, uphold by their excellent qualities the superstructure of the Church and give charm to its façade.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
