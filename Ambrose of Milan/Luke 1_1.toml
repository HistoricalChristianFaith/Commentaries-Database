[[commentary]]
quote='''
As we set out to write on the book of the Gospel which Saint Luke arranged with a certain fuller distribution of the Lord's deeds, we think we ought first to explain its very style; for it is historical. For although divine Scripture empties out the discipline of worldly wisdom, because that wisdom is painted over with a greater display of words than it is propped up by the reason of things, yet if anyone seeks in the divine Scriptures even those things which they think marvellous, he will find them.

For there are three things which the philosophers of this world have thought most excellent, namely that wisdom is threefold: that it is either natural or moral or rational. These three we have been able to observe already in the Old Testament as well. For what else do those three wells signify, of which one is the well of vision, another of abundance, the third of the oath, but that this threefold virtue was in the patriarchs? The well of vision is rational, because reason sharpens the sight of the mind and purifies the gaze of the soul; the well of abundance is ethical, because when the foreigners withdrew, under whose likeness the vices of the body are figured, Isaac found the water of a living mind — for good morals flow forth pure, and goodness itself, generous to the people, abounds for others while more sparing toward itself — the third is the well of the oath, that is, of natural wisdom, which comprehends the things that are above nature or belong to nature; for what one affirms and swears to, as it were with God as witness, embraces divine things too, since the Lord of nature is called in as witness to good faith. What too do the three books of Solomon, one of Proverbs, another Ecclesiastes, the third of the Song of Songs, show us but that holy Solomon was skilled in this threefold wisdom? He wrote of rational and ethical things in Proverbs, of natural things in Ecclesiastes, because vanity of vanities, and all is vanity that is set in this world; to vanity, indeed, the creature has been subjected; and of wonderful and rational things in the Song of Songs, because when the love of the heavenly Word is poured into our soul and the mind is joined to reason in a kind of holy fellowship, wondrous mysteries are revealed.

And what wisdom do you think the evangelists too lacked, of whom, though some are filled with various kinds, yet each excels in a different kind? For natural wisdom is truly in the book of the Gospel which is written according to John. For no one, I dare to say, has seen the majesty of God with such sublimity of wisdom and unlocked it to us in his own speech. He passes beyond the clouds, passes beyond the powers of heaven, passes beyond the angels, and found the Word in the beginning and saw the Word with God. And who, following out each thing according to man, has set forth for us precepts of living more morally than Saint Matthew? What is more rational than that wonderful joining which Saint Mark thought should be placed right at the beginning: Behold, I send my angel and the voice of one crying in the desert, so that he might both stir wonder and teach that man must please by humility and abstinence and faith, just as that Saint John the Baptist climbed to immortality by these steps: his clothing, his food, his message?

But Saint Luke kept, as it were, a kind of historical order and revealed to us more of the miracles of the Lord's deeds, yet in such a way that the history of this Gospel embraced the virtues of all wisdom. For what is more excellent for natural wisdom than his disclosing that the Holy Spirit was the creator even of the Lord's Incarnation? So he teaches natural things, if the Spirit creates. Hence David too, teaching natural wisdom, send forth he says your Spirit, and they shall be created. He teaches moral things in the same book, when in those beatitudes he teaches me morals: how I ought to love my enemy, how I ought not to strike back and return the blow of one who strikes me, how to do good, to lend with no hope of recovery and with the recompense of a reward; for the reward follows more readily the one who does not expect it. He taught rational things too, when I read that he who is faithful in the least is faithful also in the greater. What more shall I say of natural things? That he taught that the powers of heaven are moved, that the only-begotten Son of God alone is Lord, at whose Passion darkness came about during the day, the earth was darkened, the sun fled back?

Therefore all the primacy which worldly prudence falsely claims for itself, spiritual wisdom truly possesses, especially since — to venture something rather boldly — our very faith, the very mystery of the Trinity, cannot exist without this threefold wisdom, unless we believe that he is naturally Father who begot the Redeemer for us, and that he is ethical who, obedient to the Father unto death according to man, redeemed us, and that he is the rational Spirit who poured into human hearts the reason for worshipping the Godhead and ruling life. Nor let anyone think that we have made a difference of authority or of power, since with this slander he could assail even Paul. For neither did he make a difference when he said: There are divisions of graces, but the same Spirit; and there are divisions of ministries, but the same Lord; and there are divisions of operations, but the same God, who works all things in all. For the Son works all things and in all, as you have elsewhere that Christ is all and in all. The Holy Spirit works too, because one and the same Spirit works all things, dividing to each as he wills. So there is no difference of operations, no distinction, where, whether in the Father or in the Son or in the Holy Spirit, there is a fullness of power second to none.

Let us therefore consider these things carefully when we read, so that they may shine out more clearly for us in the passages themselves. For he who seeks finds, and to him who knocks it shall be opened. Diligence opens for itself the door of truth; and so let us obey the heavenly precepts. For not idly was it said to man, as to none of the other living creatures: In the sweat of your face you shall eat your bread; for to those animals which are irrational by nature the earth was commanded by God's order to supply fodder, but to man alone, that he may exercise the reason he received, the course of life is prescribed in labor. For he who is not content with the fodder of the other animals, for whom the fruit-bearing tree given to all in common for food is not enough, but who searches out for himself the delicacies of varied banquets, fetches delicacies for himself from lands beyond the sea, sweeps delicacies out of the waves, ought not, since he seeks his living by labor, to refuse to undergo a brief labor for eternal life. So if anyone, coming into these contests of sacred disputations, strips off the anxiety of this life, exposed as it is to error, and, an athlete naked of malice, anointed with the spiritual oil of devotion as on certain limbs of the soul, takes up the contests of truth, he will without doubt earn the everlasting prizes of sacred crowns. For the fruit of good labors is noble, and the more the contests, the more excellent the crown of virtues.

But let us return to our subject. We have said that this book of the Gospel is arranged in historical style. Indeed, we see that more abundant zeal has been spent, in comparison with the others, on describing events than on setting out precepts. And the evangelist himself, in the manner of a historian, took his beginning from a narrative. There was he says in the days of Herod king of Judaea a certain priest named Zechariah, and he pursues that history in full arrangement. Hence too those who have thought that the four forms of living creatures which are revealed in Revelation are to be understood as the four books of the Gospel will have this book figured by the likeness of a calf; for the calf is a priestly victim. And this book of the Gospel fits the calf well, because it began with priests and ended with the calf who, taking on himself the sins of all, was sacrificed for the life of the whole world; for that calf too was priestly. For the same one is both calf and priest: priest, because he is our propitiator — for we have him as advocate with the Father — calf, because he redeemed us with his blood. And it fell out well that, since we said that the book of the Gospel according to Matthew is moral, an opinion of this kind should not be passed over; for morals are properly called human.

Many, however, think that our Lord himself is figured in the four books of the Gospel by the four forms of living creatures, because the same one is man, the same lion, the same calf, the same eagle: man, because he was born of Mary; lion, because he is the stronger; calf, because he is a victim; eagle, because he is resurrection. And so in the individual books the form of the living creatures is figured in such a way that the course of each book seems to fit either the nature or the power or the grace or the miracle of the living creatures set before us. And though all these are in all, yet in each there is a certain fullness of particular virtues. One described more fully the birth of the man, and also instructed the morals of man with more abundant precepts; another began with the expression of divine power, telling how, King from King, Strong from Strong, True from True, he scorned death with living power; the third put first the priestly sacrifice and spread out the very sacrifice of the calf in a certain fuller style; the fourth expressed more copiously than the others the miracles of the divine resurrection. One, then, is all things and one in all, as it is read, not unlike himself in each, but true in all. But now let us take up the very discourse of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"


[[commentary]]
quote='''
Since he says many have attempted to set in order a narrative of the things. Most of our affairs, like those of the ancient Jews, are shaped by like kinds and causes, and agree in the like use and outcome of similar examples, and accord in the beginning and the end of things. For just as many among that people, filled with the divine Spirit, prophesied, while others promised that they would prophesy and betrayed their profession by a lie — for they were false prophets rather than prophets, like Ananias son of Azot; but the people had the grace of discerning spirits, so that it might know whom it ought to reckon in the number of the prophets, and whom, like a good money-changer, it ought to reject, those in whom corrupted matter rather showed foul than the splendor of true light shone back — so now too in the New Testament many have attempted to write gospels, which the good money-changers did not approve; but they judged that one alone, arranged in four books, was to be chosen out of them all.

And indeed another gospel is circulated, which the Twelve are said to have written. Basilides too dared to write a gospel, which is called the gospel according to Basilides. Another gospel too is circulated, which is entitled according to Thomas. I know another written according to Matthias. We read some things so that they may not be read; we read so as not to be ignorant; we read, not to hold them, but to repudiate them, and so that we may know what sort of things they are in which these magnificent men lift up their heart. But the Church, though it has four books of the Gospel, abounds with evangelists throughout the whole world; the heresies, though they have many, do not have one. Many indeed have attempted, but they are bereft of the grace of God. Many too have crammed into one, out of the four books of the Gospel, whatever they thought agreeable to their poisoned assertions. Thus the Church, which has one Gospel, teaches one God; but those who assert one God of the Old Testament and another of the New have made out of many gospels not one God, but many.

Since many he says have attempted. Those surely attempted who were not able to complete it. So Saint Luke too testifies with a richer testimony that many began and did not complete, saying that very many attempted. For he who attempted to set in order attempted it by his own labor, and did not complete it. For the gifts and the grace of God are without effortful attempt: when it has poured itself in, it is wont to water, so that the writer's talent does not lack but overflows. Matthew did not attempt, Mark did not attempt, John did not attempt, Luke did not attempt; but, the divine Spirit supplying abundance of words and of all things, they completed what they had begun without any striving. And so he says well: since many have attempted to set in order a narrative of the things which have been fulfilled in us, or which abound in us.

For what abounds fails no one, and no one doubts what is fulfilled, since the effect builds up faith and the outcome reveals it. And so the Gospel is fulfilled, and abounds for all the faithful throughout the whole world, and waters the minds of all and strengthens the spirit. So he who is founded on the rock and has taken up the whole fullness of faith and the firm support of constancy rightly says: which have been fulfilled in us, since those who describe the saving deeds of the Lord, or who direct their mind to his wonders, distinguish true and false not by signs and prodigies but by the word. For what is so reasonable as that, when you read of those deeds which are above man, you should believe them to belong to a higher nature, but when you read of those which are mortal, you should believe them to be the sufferings of the body he assumed? Thus our faith is founded on word and reason, not on signs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
