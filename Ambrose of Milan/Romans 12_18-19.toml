[[commentary]]
quote='''
Then the Apostle, while he teaches those three, by his precepts does away with the fourth, which philosophy had added. For he says, when he wished to shape the peaceable people of God: If it can be, as far as lies in you, having peace with all men; then, if this cannot be, at least neither discords nor enmities. And therefore he added: Not avenging yourselves, dearly beloved, in which that fourth too is excluded. Let us by no means wish to avenge ourselves; but give he says place to wrath. You have the third also, that you should rather withdraw and commit vengeance to God than exact it for yourself; although he wished this too to seem said rather according to the Law; for according to the Gospel you have above: Bless those who persecute you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
