[[commentary]]
quote='''
And Zechariah his father was filled with the Holy Spirit and prophesied, saying. See how God, good and ready to forgive sins, not only restores what had been taken away, but also grants what was not hoped for. He who was lately mute prophesies; for this is the greatest grace of God, that those who had denied him confess him. Let no one, then, lose confidence; let no one, conscious of old sins, despair of divine rewards. God knows how to change his sentence, if you know how to amend your fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
At the same time, observe in how few words Elizabeth prophesies, in how many Zechariah. Both spoke filled with the Holy Spirit, but the discipline is kept, that a woman should be eager rather to learn divine things than to teach them. Nor do we readily find that any woman prophesied more fully than the mother of the Lord. Miriam the prophetess herself, the sister of Aaron, how quickly she brought the words of her song to a close! And the same woman, when she spoke at greater length with her brother, by no means escaped punishment for her speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
