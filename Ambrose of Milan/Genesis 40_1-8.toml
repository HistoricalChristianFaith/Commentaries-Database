[[commentary]]
quote='''
But what shall I say of those eunuchs? They ought to be an example to the other eunuchs, that their position is fragile and slight, and all their hope lies in the king's will; for them a slight offence is the greatest danger, while their prosperity is but a mean service. The one gloried in being overseer of the wine, the other in being overseer of the bakers. Both gave offence, and they were sent into prison and entrusted to holy Joseph by the keeper of the keys of the prison himself; and when they had been there many days, they saw a dream. And when Joseph visited them again, he found them sad and troubled in mind, because they were troubled by a dream for which they could find no interpreter. Is it not through God, he said, that the interpretation of a dream comes? Tell it to me, then.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
