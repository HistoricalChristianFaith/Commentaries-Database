[[commentary]]
quote='''
David, then, spoke in his heart, asking to be heard by the Lord and that his enemies might not exult over him, asking also that he might remain in the resolve of his conversion, lest, while the steps of his resolve, the feet, as it were, of his soul, are shaken, his adversaries should speak against him things proud and full of boasting, as those do who desire to insult. Yet, even if he is shaken as a man, he says he is ready for the scourges, so as to pay for his error at least by punishment. Even if the scourges of the Lord cease, he says that he is nevertheless scourged by his own grief, so that the fault, which good confession has forestalled, may find nothing to condemn. This, then, is what he says: and while my feet are shaken, they have spoken great things against me, because they are so ready for the mockeries of insult that at the shaking of my feet they had their boasting ready. Or surely thus: while my feet are shaken, thinking that I would fall, they have already spoken proud and boastful things.

But yet, because he himself said later on that his feet were almost moved, lest any scruple arise from this, consider that here we are taught the disposition of penitence, while there the opinion of that error is excluded, that the riches and more prosperous success of the wicked ought to move us. And a habit of expression of this kind is found in the divine Scriptures. For so elsewhere too: When the Lord turned back the captivity of Zion, we became as those consoled, although the saint wishes to be proved not in the display of words but in the power of the Spirit. The sense, then, must always be looked to by us, a sense which frequent translation, from Hebrew into Greek and from Greek into Latin, commonly weakens as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
