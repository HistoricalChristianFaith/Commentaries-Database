[[commentary]]
quote='''
In the blind man we have a type of the Gentile people, who have received by the Sacrament of our Lord the brightness of the light which they had lost. And it matters not whether the cure is conveyed in the case of one or two blind men, inasmuch as deriving their origin from Ham and Japhet, the sons of Noah, in the two blind men they put forward two authors of their race.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And it came to pass, when he drew near to Jericho, a certain blind man was sitting by the way. In the book according to Matthew two are brought in, here one; there as he was going out of Jericho, here as he was drawing near. But there is no discrepancy; for since in this one man there is a type of the Gentile people, which by the Lord's sacrament received back the brightness of its lost light, it makes no difference whether it receives healing in one or in two, since, drawing its origin from Ham and Japheth, the sons of Noah, it put forward in the two blind men the two founders of its race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
