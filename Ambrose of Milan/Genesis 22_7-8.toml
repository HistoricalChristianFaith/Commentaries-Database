[[commentary]]
quote='''
Isaac added, saying: behold the wood; where is the sheep for the whole burnt offering? Here too he prophesies by his speech, not by knowledge; for a sheep was being prepared by God for the sacrifice. Then Abraham answered likewise: God will provide himself a sheep for the whole burnt offering, son. The minister, not to be bent from the zeal of his devotion, is not afraid to call him son again and again. So firmly was he grounded in the solidity of his intention; and he thought himself the better father for this, and judged that his son would remain his forever, if he sacrificed him to God. And he prophesied not only what happened at once, that God provided himself a victim in place of Isaac and gave the son back to his father, but rather this, that this victim was not that of the divine plan: there would be another victim, which God would prepare for himself, to cleanse the whole world; that one would be more acceptable to all, for whose sake many fathers would offer their sons and would not fear to be separated from their sons in this world. Daily fathers offer their sons, that they may die in Christ and be buried with him in the Lord. How many fathers, when their sons were slain in martyrdom, have returned more joyful from their tomb!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
