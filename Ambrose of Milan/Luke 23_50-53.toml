[[commentary]]
quote='''
Now mystically, the just man buries the body of Christ. For the burial of Christ is such as to have no guile or wickedness in it. But rightly did Matthew call the man rich, for by carrying Him that was rich he knew not the poverty of faith. The just man covers the body of Christ with linen. Do thou also clothe the body of Christ with His own glory, that thou mayest be thyself just. And if thou believest it to be dead, still cover it with the fulness of His own divinity. But the Church also is clothed with the grace of innocence.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What is meant too by the fact that not the apostles, but Joseph and Nicodemus bury Christ? The one righteous and steadfast, the other one in whom there was no guile; for such is the burial of Christ, which has no fraud or iniquity. So room for evasion is blocked, and the Jews are refuted by testimony from their own household; for if the apostles had buried him, they would surely say that he had not been buried, whom they said had been stolen away.

The righteous man covers the body of Christ with a linen cloth, the innocent man anoints it with ointment; for we find these things distinguished not without purpose, because righteousness clothes the Church, innocence supplies grace. Do you too, then, clothe the Lord's body with its glory, that you too may be righteous; even if you believe it dead, yet cover it with the fullness of its divinity. Anoint it with myrrh and aloes, that you may be the good odor of Christ. Joseph, that righteous man, sent a good linen cloth, and perhaps it was that which Peter saw let down to him from heaven, in which were kinds of four-footed beasts and wild beasts and birds, figured in the likeness of the Gentiles. With that mystic and genuine ointment, therefore, the Church is buried with him, which has united the diversity of peoples in the communion of her faith.

Of this Joseph I find in John alone that he came secretly to Pilate for fear of the Jews. How did a righteous man seek a hiding place through fear of danger? But I think that he asked secretly in order to obtain the body, not to avoid danger. And yet what wonder if the righteous man hid himself, when the apostles too, the teachers of the righteous, hid themselves? Come you too. Whether late or by night, or at whatever hour you come, you will find Jesus ready for you to look up to him, and paying no smaller wage to those who come later; for he who came at the sixth hour was not cheated of his wage, and he who came at the eleventh received the full wage. But Nicodemus too came by night. It was night, because there was not yet the resurrection. Indeed Christ rose again, and the righteous man says: The night is far gone, the day has drawn near.

This Joseph Luke called righteous, Matthew rich. And rightly is he called rich in this place, where he received the body of Christ; for in receiving the Rich One he knew no poverty of faith. He who is righteous, then, is rich. So he wraps it in a linen cloth; but the Israelite both mingles diverse fragrances of virtues and puts in aloes, about a hundred pounds, that is, the measure of perfect faith. And they bound the body of Jesus according to the custom of the spiritual Jews, not indeed with the knots of unbelief, but with the bindings of faith, and laid it in a garden, to which the Church is often compared, which has the fruits of diverse merits and the flowers of virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
