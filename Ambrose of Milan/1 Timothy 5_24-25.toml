[[commentary]]
quote='''
Now let us consider his works, by which he was able to cover his sin. For since human frailty cannot be without sin, we must take care that our sins be not more than our works of virtue. Holy Paul expressed this with the great force of his wisdom, saying: The sins of some men are manifest, going before to judgment, and some men they also follow after, that is: no one is found untouched by fault; a man has good merits, he has also vices and sins. And so all that is ours is weighed as in a balance. If, then, the sins outweigh the good deeds, they go before to judgment; for sins sink down as into the depths, and those sink down which are manifest either by their weight and bitterness or by their multitude. But some, he says, they also follow after, that is, those who have conducted themselves soberly but through the frailty of their condition have sometimes given place even to error: good deeds go before them, evil deeds follow. These are more honourable, but nevertheless men who have fallen through lighter vices and errors. So sins follow the just, they do not go before them; they go before the unjust. The sins that sink down outweigh, and whatever has been rightly done follows, weighed down as it were by a kind of prejudgment of the sins going before. Likewise also good deeds are manifest. For the works of virtue shine, and the splendour of merits. And those that are otherwise cannot be hidden. So such things are not covered; the charity which conceals a multitude of sins does not overshadow them, the grace of good works does not conceal them, a multitude of virtues does not hide them: they are exposed as though naked and uncovered. For there is none among them who says: Under the shadow of your wings protect me; for the cross of the Lord abolishes and hides all errors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
