[[commentary]]
quote='''
Because then the proud refuse to come, the poor (Greg. Hom. 36.) are chosen, since they are called weak and poor who are weak in their own judgment of themselves, for there are poor, and yet as it were strong, who though lying in poverty are proud; the blind are they who have no brightness of understanding; the lame are they who have walked not uprightly in their works. But since the faults of these are expressed in the weakness of their members, as those were sinners who when bidden refused to come, so also are these who are invited and come; but the proud sinners are rejected, the humble are chosen. God then chooses those whom the world despises, because for the most part the very act of contempt recals a man to himself. And men so much the sooner hear the voice of God, as they have nothing in this world to take pleasure in. When then the Lord calls certain from the streets and lanes to supper, He denotes that people who had learnt to observe in the city the constant practice of the law. But the multitude who believed of the people of Israel did not fill the places of the upper feast room. Hence it follows, And the servant said, Lord, it is done as thou hast commanded, and yet there is room. For already had great numbers of the Jews entered, but yet there was room in the kingdom for the abundance of the Gentiles to be received. Therefore it is added, And the Lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. When He commanded His guests to be collected from the wayside and the hedges, He sought for a rural people, that is, the Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So he sends to the outlets of the ways; prudence indeed is sung in the outlets. He sends to the streets, because he sent to sinners, that from the broader ways they might come to the narrow one which leads to life. He sends to the ways and around the hedges, because those surely are fit for the kingdom of heaven who, occupied with no desires for present things, hasten to things to come, set on a kind of path of good will, and who, after the manner of a hedge, which separates cultivated land from uncultivated and keeps off the incursions of beasts, know how to distinguish good and evil and to hold up the defense of faith against the temptations of spiritual wickedness. Indeed the Lord, to show that his vineyard had been fortified, said: and I put a hedge he says around it and dug around it. And the Apostle says that the middle wall of the hedge has been taken away, which had broken the continuity of the defense. Faith therefore and reason are sought, and sought in the streets, that is, in the passages of the inner affection. Because it is written: let your waters be poured out in your streets.

Yet this is not enough, that someone who is called should come, unless he has the wedding garment, that is, unless he has faith and charity. And therefore he who has not brought peace and charity to the altars of Christ will be taken up by feet and hands and sent into the outer darkness. There will be weeping, and gnashing of teeth. What is the outer darkness? Is there some prison there too, and quarries to be endured? By no means. But whoever are outside the promises of the heavenly commandments are in the outer darkness, because the commandments of God are light, and whoever is without Christ is in darkness, because Christ is the inner light.

So there is neither any gnashing of bodily teeth, nor any perpetual fire of bodily flames, nor is the worm bodily. But these things are said because, just as from much indigestion both fevers and worms are born, so if anyone does not digest his sins by interposing, as it were, a certain sobriety of abstinence, but, mixing sins with sins, contracts as it were a kind of indigestion of old and recent offenses, he will be scorched by his own fire and consumed by his own worms. Hence Isaiah also says: walk in the light of your fire and in the flame which you have kindled. The fire is that which sorrow for sins begets; the worm is so called because the irrational sins of the soul prick the mind and the sense of the guilty man and eat away certain inward parts of the conscience, sins which are born like worms out of each one, as out of the body of the sinner. Indeed the Lord declared this through Isaiah, saying: and they will see the limbs of the men who have transgressed against me; and their worm will not die and their fire will not be quenched.

The gnashing of teeth also betrays the disposition of one who is indignant, because each one repents too late, groans too late, is angry with himself too late, that he has sinned with so obstinate a wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
