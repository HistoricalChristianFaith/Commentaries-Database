[[commentary]]
quote='''
But see that all things are from God. For the world is not without God, because the world too was made through him; but though it was made by God, yet its works are evil, because the world is set in the evil one; and the ordering of the world is from God, the works of the world from evil. So too the ordering of powers is from God, the ambition for power from evil. Finally there is no power he says except from God, and those that are, are ordained by God: not given, but ordained; and he who resists the power of God he says resists the ordinance. Here too, though the devil says that he gives power, yet he does not deny that all those things have been permitted him for a time. And so he who permitted it ordained it, and it is not the power that is evil, but the one who uses the power evilly. Finally: Do you wish not to fear the power? Do good, and you will have praise from it. So it is not power that is evil, but ambition. Finally, so far is the ordering of power from God, that he who uses power well is God's minister. Of God he says he is the minister to you for good. So the fault is not in the office at all, but in the minister; nor can the ordinance of God displease, but the conduct of the one who administers it. For, to draw an example from heavenly things down to earthly ones, the emperor gives an honor and has praise. But if anyone uses the honor badly, the fault is not the emperor's but the judge's. Crimes have their own culprit, since it is not the power but his own service that entangles each one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
