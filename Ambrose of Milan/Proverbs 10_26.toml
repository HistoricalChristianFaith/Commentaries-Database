[[commentary]]
quote='''
But iniquity weighs down the conscience as with a talent of lead, as Scripture testifies, and rightly David says: Like a heavy burden they have weighed heavy upon me, and Solomon: As an unripe grape to the teeth and smoke to the eyes, so is iniquity to all who use it. A heavy punishment, which hinders food, clouds the sight, and, what is more, pours a dark mist over the eyes of the inner mind, so that the unrighteous man cannot see what is true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
