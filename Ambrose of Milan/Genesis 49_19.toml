[[commentary]]
quote='''
Gad, temptation will tempt him, and he will tempt them close at their feet. The temptation is the gathering and the cunning of the scribes and priests, who tempted the Lord Jesus about Caesar's tribute and about John's baptism, as Scripture has taught; and the Lord Jesus, in his justice, turned the temptation back upon them. Close at their feet, that is, answering at once, without any deliberation, so that he himself might the more hem in those who tempted him. For when they said: By what authority do you do these things? he did not answer what was asked, but himself also put a question, saying: I also will ask you one word. If you tell me, I also will tell you by what authority I do these things. Again, when they said: Is it lawful to give tribute to Caesar or not? he said: Why do you tempt me, hypocrites? Show me the coin of the census. And when they offered it, he asked again: Whose is the image and the superscription? They say to him: Caesar's. There, therefore, he bound them by their own words, he constrained them by their own pledge — then he said to them: Render the things that are Caesar's to Caesar, and the things that are God's to God — so that they could not go against their own words. And so they marvelled and went away from him. But it is no wonder if he answered close at their feet, who saw what lay before his feet.

Moses set forth clearly that this prophecy of holy Jacob is about Christ; for thus he says: Blessed is he who increased Gad. Like a lion he rested, breaking arms and princes. And he saw from his beginning that there the land of the princes was divided, of the princes gathered together with the princes of the peoples; the Lord did justice, and the judgment of Israel.

We recognize, therefore, the one who rested like a lion when he had broken the arms of the mighty, because from the beginning he saw the divisions of those who tempted him. There, therefore, is the chasm of the earth that is to swallow up the slanderers, where the temptation of the unbelievers is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 8"
