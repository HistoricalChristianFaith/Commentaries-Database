[[commentary]]
quote='''
If you have escaped the passions above, anger comes next, and therefore Scripture says to you: Cease from anger and leave off indignation. There are many vices that creep upon the unwise. Anger is a grievous passion; very often it kindles a man against his will, and carries off into fury one who wishes to punish more mildly, so that he kills the man whom he had thought ought to be restrained. When roused, he often runs an innocent man through with the sword; very many have killed friends and brothers through indignation. Therefore the wise man says: Anger destroys even the wise. It is the saying of Solomon, that anger destroys not only any men whatever from the common sort but even the wise themselves. And David admonishes the wise man, saying: Cease from anger, lest, when you are kindled by it, it should not cease before its flame consumes you. Leave off, he says, indignation, that is: nature carries you away, feeling moves you, someone's fault or offence rouses you to be indignant; but not without end, so that you know no measure: leave it off, put an end to it, lest it drag you into sin. This is what he said above: Be angry and do not sin. For he does not exhort you to be angry, but for a time he gives way to the feeling, yet he gives a remedy, lest the force of the sore creep on too long. "Be angry", which he says, belongs to your passion. For a physician does not at once apply medicines to a sickness. If the pain is burning, he applies poultices so that the pain may abate; if the fever is raging, he waits for the time of the remedy, and he is accustomed to deny drink itself to the thirsty. He does not say: "Do not have a fever", when the heat of the sick man is burning, but he says: "Wait until the fever ceases, until the disturbance is dispersed". So also the prophet could not say to a man whose flesh is stirred, as by the various passions of diseases, so by those of disturbances: "You shall not be angry", but he says: "Cease from anger and leave off indignation, lest you sin; for anger is a grievous teacher of sin". Another physician too says: Let not the sun go down upon your wrath, lest, while you put it off long, he should come who is accustomed to rouse the heated body from sleep, and goad you, and put thoughts into you, and plunge himself into the secret places of your heart, saying: "Avenge your injury, recognize that you are a man; it belongs to womanly weakness not to take vengeance. So a slave was to despise you, a brother to deceive you, a friend to mock you, and you still do not avenge your insult? You must proscribe him, you must rise against him with the sword and console your pain by the death of your adversary. He was a man who killed his enemy; he is rightly praised, because he avenged himself so that no one else dared to inflict an injury on him". By these goads he is kindled the more, stirred the more, so that what is written is fulfilled: Anger destroys even the wise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
