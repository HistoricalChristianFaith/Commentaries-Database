[[commentary]]
quote='''
In addition she bore his brother Abel. When anything is added, that which comes before it is eliminated. This we can see in an arithmetical calculation or by simple reflection. When one number is added to another, something new arises. The original number disappears and mentally we proceed to exclude the figure with which we started. When, therefore, Abel is born in addition, Cain is eliminated. This can be understood better if we examine the signification of their names. Cain means "getting," because he got everything for himself. Abel, on the other hand, did not, like his brother before him, refer everything to himself. Devotedly and piously, he attributed everything to God, ascribing to his Creator everything that he had received from Him.

There are two schools of thought, therefore, totally in opposition one to the other, implied in the story of the two brothers. One of these schools attributes to the mind itself the original creative source of all our thoughts, sensations, and emotions. In a word, it ascribes all our productions to man's own mind. The other school is that which recognizes God to be the Artificer and Creator of all things and submits everything to His guidance and direction. Cain is a pattern for the first school and Abel of the second. One living being gave birth to these two schools of thought. Hence, they are related as brothers because they come from one and the same womb. At the same time, they are opposites and should be divided and separated, once they have been animated with the life of the spirit. Those who are by nature contraries cannot abide for long in one and the same habitation. Hence, Rebecca, when she gave birth to two individuals of dissimilar nature, the one good and the other evil, and when she felt them leap in her womb (Esau was the type of wickedness, Jacob the pattern of what is good), marveled at the reason for the discord which she perceived within her. She appealed to God to make known the reason for her suffering and to grant a remedy. This was the response given to her prayer: Two nations are in your womb; two peoples shall stem from your body. Interpreted spiritually, this can mean the same generation of good and evil, both of which emanate from the same source in the soul. The former is likely to be the fruit of sound judgment whereby evil is repudiated and goodness is fostered and strengthened. Prior to giving birth to what is good, that is to say, to giving complete reverence and deference owed to God Himself the soul shows preference to its own creation. When, moreover, the soul is generated with faith and trust in God, relief comes at the time of parturition. Thus God, in applying the beneficial lesson of Abel to the soul of man, makes ineffective the impious lesson of Cain.

Following the Scriptures, I am inclined to hold that in this place we have a reference to two classes of peoples. In disposing for the Church's use the faith of His devoted flock, God has made ineffective the perfidy of the people who fell away from Him. The very words of God seem to establish this meaning: Two nations are in your womb; two peoples stem from your body. These two brothers, Cain and Abel, have furnished us with the prototype of the Synagogue and the Church. In Cain we perceive the parricidal people of the Jews, who were stained with the blood of their Lord, their Creator, and, as a result of the childbearing of the Virgin Mary, their Brother, also. By Abel we understand the Christian who cleaves to God, as David says: It is good for me to adhere to my God, that is, to attach oneself to heavenly things and to shun the earthly. Elsewhere he says: My soul hath fainted in thy word, thus indicating his rule of life was directed toward reflections on the Word and not on the pleasures of this world. Wherefore we realize that what we read concerning David in the Book of Kings is not an idle statement, but is said with due weight and reflection: And he was laid with his fathers. We are given to understand that his faith was like that of his father's. It is clear, then, that there is reference here to participation in life and not to the burial of a body.

Hence the words of Scripture here are considered to have more than casual meaning. Leaving the appearance of this weak body which was attached to his soul as an appendage, Isaac was gathered to his kin because he adhered to the customs of his father. Fittingly does he say to his kin—not "to his people," as elsewhere. We read in other places that men were gathered to their people, but these men were not so prominent. A person is more prominent who is matched, not by the many, but by the few—for there are more individuals implied in "people" than in "kin." It is considered, too, that similarity to a few people has more merit than likeness to a large number. Those, therefore, who were born in this world with God's help, who were chosen to offer with devotion approved sacrifices, who were content with one consort, that is, with the sole society of that highest of kinship, wisdom, which is ever one and harmonious—these persons, according to the testimony of holy Scripture, ought not to be put in the category of the average man. In the one case, we have an active life which included study and meditation; in the other, association with the crowd and a mingling with the populace. Those who collectively are called "people" are for the most part swayed by hearsay. Uncorrupted purity and lofty lineage are found, not where men are subject to popular appeal, but wherever an intelligent group is gathered together solely for the task of learning. Wherefore Isaac, we are told, with the help of God was gathered to his kin rather than to his people. Thus you can come to understand that he was a man who paid more attention to what is divine than to what is merely human.

Blessed is the mind of that man who, overstepping the bounds of species and race, deserves to hear what was said to Moses when he stood apart from his people: Stand thou here with me. Just as Isaac, the type of the Incarnation of the Lord, overstepping the custom of human generation, surpassed his predecessors, so that he acquired special distinction and veered from participation in the common and vulgar, in a similar way we learn from Scripture that promises were made to Abraham and to his offspring. He does not say, "and to his offsprings"—as of many, but as of one, "and to thy offspring," who is Christ. In Moses, also, there is a figure of one who was to teach the Law, preach the Gospel, fulfill the Old Testament, found the New, give heavenly nourishment to the people. He so far exceeded the dignity of his human state that he was given the title of "God" as we read in the Scriptures, where the Lord speaks: I have appointed thee the God of Pharao. He was, in fact, victorious over all his passions and was not allured by the enticements of the world. He enveloped this our habitation here in the body with a purity that savored of a citizenship that is in heaven. By directing his mind and by subduing and castigating his flesh with an authority that was almost regal, he was given the name of "God," in whom he had modeled his life by numerous acts of perfect virtue.

Accordingly, we do not read of him, as we do of others, that he fell sick and died. We read that he died by the word of God—for a God does not grow weak or undergo diminution or addition. Hence Scripture added: No man hath known of his sepulture until this present day—by which we are to understand that he was taken up into heaven rather than buried, for death may be called a separation of the soul from the body. He died, therefore, as the Scripture states: by the word of God—not "in accordance with the word"—so as to make known that this was not an announcement of his death, but was more in the nature of a gracious gift to one who was translated rather than left here, and whose sepulture was known to no man. Who could ever find the remains on earth of one who has been shown in the Gospel to be with the Son of God? Hence there appeared with him Elias, who was carried away in a chariot and who did not die nor was buried according to Scripture, for he still lives, being with the Son of God. We read, indeed, that Moses did die, but he died by the Word of God, by which all things are made: By the word of God the heavens were established. By the Word of God, therefore, there is no cessation of work, but, rather, a foundation. We are not to understand that here with the dissolution of the body we have a return to earth. A special favor was bestowed on him by the operation of the Word of God, so that to his body was granted repose rather than a monumental sepulcher.

There is a clear distinction between servant and master. What is a privilege in a master is in a servant a favor. We read that no one knows the sepulcher of Moses and that Christ died and was taken up from earth to heaven. Christ, in accordance with the mystery of the Law, looked forward to the Redemption, so that He would rise again. Moses did not, in accordance with the favors granted in the Gospel, look forward to Redemption; rather, he himself was the bestower of it. Hence his sepulcher is not really known, but the sepulcher which the creature could not any longer endure has been set free, since of himself every creature makes haste to be delivered from its slavery to corruption. No one, therefore, knows the burial place of Moses, because all men have knowledge of his life. We have seen the sepulcher of Christ, but now no longer know it, since we have come to know His Resurrection. His tomb, in fact, ought to be recognized, so that His Resurrection be made manifest. Hence in the Gospel His tomb is described in all detail. There is no account of this in the Law, because, although the Law announced His Resurrection, it was left to the Gospels in their very detailed account to give us confirmation of this fact.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapters 1-2"

[[commentary]]
quote='''
Let us complete now our discussion of the theme: In addition she bore Abel. This means that Eve, who had grievously erred before, had generated designedly something superior, so as to transcend the mistake she had previously made. Unless I am mistaken, this event is made generally evident in our own experiences. When we are born we have the physical sensibility of an infant. Then follows the period of childhood, which is devoted merely to the care of our bodies with no regard for the rites or observance of divine worship. Wherefore, in order to show that Jesus Christ, clearly revolutionizing the law of nature, was born of a virgin, the Prophet states: Behold a virgin shall conceive and bear a son and his name shall be called Emmanuel. He shall eat butter and honey, that he may know to refuse the evil and choose the good. For before the child know to refuse the evil and choose the good, he does not put his trust in wickedness that he may choose what is good. And further on: For before a child know to call his father and his mother, he shall receive the strength of Damascus and the spoils of Samaria against the king of the Assyrians. For He alone was not overcome by the vanity and emptiness of this world as one who humbled himself, becoming obedient even to death—one who was most unlike each and every one of us who trust in vain and are swollen with the pride of the flesh. Hence no one is without sin, not even an infant one day old, although he never committed a sin. And so Cain is first to assert himself when we are born. Abel, in whom there is reverence for divinity, is born after him. Evil, therefore, is the first to make its appearance and next the recognition of what is good. Where there is good, there is justice. Where there is justice, there is holiness, that is to say, Abel who cleaves to God.

And Abel, we are told, became a keeper of flocks and Cain a tiller of the soil. Not without reason, as Scripture teaches us, is Abel mentioned first in this passage, although Cain was the first born. The order of nature differs from the order given to the names themselves. What is the significance of this change of order in first mentioning the younger of the two, when there is reference to employment and vocation? In order to understand the reason for this preference we should take note of the differences in their tasks. Tilling the soil comes first in our experience. This activity is lower in prestige than that of sheep-herding. This is like the case of a teacher or leader who, rightfully as elders do, begins with principles that are older and better established. The younger man, on the other hand, is likely to prefer land which is not so old, which does not bring forth thorns and thistles, and which is generally acceptable. Accordingly, Adam, being guilty of sin, is expelled from the Garden of Delight that he might till the soil. The order of nature is correctly preserved at the time of the coming of these brothers into this world. When it is a question of instruction in the art of living, the younger is preferred to the older because, although junior in age, he is superior in virtue. Innocence is later in time than wickedness. Although nearly equal in age, it is far superior in the high quality of its merits: For venerable old age is not counted by years nor by grey hairs but by morals, and a spotless life is old age. When, therefore, there is question of birth, Cain should take the first place. When there is question of instruction, Abel should stand first. Who can deny, then, that adolescence and the early years of manhood are subject to the temptations of the passions? Who can deny, too, that, when a more mature age is reached, peace returns after the tempestuous yearnings of youth are passed and the wearied soul finds at last a mooring place in some secluded harbor of life?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 3"

[[commentary]]
quote='''
From such examples as these there can be no doubt, therefore, that, although wickedness has precedence in time, yet it has the infirmity which belongs to youthfulness. Wickedness has the contributory advantage of age, whereas virtue has the privilege of that sort of prestige which a man given to unjust judgments often concedes to the just. Holy Scripture is a trusted witness of this fact in the episode where Esau, whose name is linked with those who are stupid, went so far as to surrender his own birthright to his brother Jacob, saying: Of what use to me is my birthright? But the birthright which he disregarded, a man endowed with competence (as his name implies) made an effort to deserve. Does not Esau seem to you to be like one who was defeated in a contest? Does he not appear to you to be like a man who, believing on account of his inherent weakness that he was outclassed, yielded up the crown to the victor who, he perceived, was not affected by any temptations of the senses, which, like the dust of an arena, he himself was unable to endure? Of what use to me, he said, is my birthright? Among the craven there are no evidences of virtue. These indications are first observable among men of wisdom, for mental activity serves as a means toward the attainment of virtue. As a warrior cannot exist without arms, so virtue is not attained without the practice of it. Hence the Lord says in the Gospel: From the days of John the Baptist the kingdom of heaven has been enduring assault and the violent have been seizing it. And elsewhere: Seek the kingdom of God and behold all things are yours. Rewards are promised not to those who sleep or who idle away their time, but to those who strive. Toil has its recompense. Although it may not be pleasant or sweet, labor provides a wealth of compensation.

This is the lesson given in the Law, as we find it recorded: If a man have two wives, one beloved and the other hated, and both the beloved and the hated have had children by him, and the son of the hated be the first born, and he meaneth to divide his substance among his sons. He may not make the son of the beloved the first born and prefer him before the son of the hated. But he shall acknowledge the son of the hated for the first born and shall give him a legacy of all he hath, for this is the first of his children and to him are due the first birthrights. What profound secrets lie in what we read, veiled in the language of mystery! Pay heed, soul, to your two-fold birth and examine the mystery found in the story of the hated wife. You will find the answer within you, if you stop and reflect. Look into your thoughts and into your emotions and you will recognize that to which you owe your birthright. Two women, in fact, cohabit in each one of us: women who live in discord and disagreement and who fill the house of our soul with their bickerings and contentiousness. One of these is called Pleasure. She is so pleasant, ingratiating, and agreeable that we have in mind to make her our associate and consort. The other one is harsh, bitter, and cruel. Her name is Virtue.

Pleasure, then, is an impudent prostitute with mincing, alluring gait. She beckons with her eyes, winking playfully so as to trap in her snares the precious souls of young men. The eyes of a sinful libertine are used as a lure. Whomsoever she sees—a foolish young man who passeth by the corner and goeth nigh the way of her house—she approaches with wheedling words. She endeavors to steal the hearts of young men—a woman restless at home, a wanderer in the public squares, prodigal of kisses, indifferent to shame, gaudy in her dress and countenance. Since she is unable, indeed, to assume a beauty that is true to nature, she affects what is the opposite to truth—an external show of meretricious arts. Accompanied by a crowd of vicious characters and surrounded by a band of wicked men, she acts as a leader in their sinful acts. She attacks the citadels of men's hearts while uttering such words as these as a war-cry: I have vowed victims for peace, this day I have paid my vows. Therefore I am come out to meet thee, desirous to see thee, and I have found thee. I have woven my bed with cords. I have covered it with tapestry from Egypt. I have perfumed my bed with saffron and my home with cinnamon. Come and let us wrestle with desire. Here in the words of Solomon we behold the very picture of a wanton. What other than worldly pleasure is more characteristic of a prostitute who makes her entrance stealthily into the house, first making tentative explorations with her eyes and then entering quickly, while you concentrate the gaze of your soul outward on the public square, that is, on the streets frequented by passersby and not inward on the mysteries of the Law? She has contrived to trap us in a room devoted to the associations of common life by such solid chains that a person, although held in bondage, finds himself at ease there. As she reclines there she covers her body with coverlets of fraud and deceit so as to allure the souls of young men, alleging the absence of a husband, that is to say, her disregard for the Law. The Law does not exist for sinners, for, if it were present, it would not have been ignored. Hence we read: For my husband is not at home, he is gone a very long journey. He took with him a bag of money. What is the meaning of this, if not that the rich believe that there is nothing that money cannot control and that the Law is something that can be sold for profit? Pleasure scatters its fragrance because it has not the fragrance of Christ. Pleasure looks for treasures, it promises kingdoms, it assures lasting loves, it pledges undreamed of intimacies, instruction without a guardian and conversation without hindrance. Pleasure promises a life bereft of anxiety, a sleep devoid of disturbance and wants that cannot be satiated. We read: Entangling him with many words and alluring him with the snares of her lips, she led him even to her home. He was beguiled and followed her. The hall had all the splendor of a royal palace with walls in relief work. The floor reeked of spilled wine and emitted the odor of unguents. It was covered with the remains of fish. The flowers, now faded, made walking hazardous. Everything there was confused and contrary to the order of nature: the uproar of the banqueters, the noise of contenders, the clash of wranglers, the chorus of singers, the hubbub of dancers, the laughter of the merry, and the applause of the revelers. There you find dancing girls with shorn locks and boys with curly hair, mingled with disgusting evidences of repletion and overindulgence, yesterday's intoxication and today's inebriation. Repeated bouts of intemperance, saturated with the odor of stale wine, made a stronger impression on the senses than fresh liquor would. Pleasure, standing in the midst of this disorder, said: Drink ye and be drunken and fall and rise no more. With me the most wicked holds the first place in my estimation. The man who is not himself is mine and, the more evil he is, the more is he acceptable to me. Babylon hath been a golden cup in my hand that made all the earth drunk. All the nations have drunk of my wine. Who, therefore, is devoid of wisdom, let him turn toward me. My advice to those who are foolish is this: Enjoy the bread that is hidden and drink of the stolen waters that are sweeter. Let us eat and drink, for tomorrow we shall die. Our life shall pass away as the trace of a cloud and shall be dispersed as a mist. Come, therefore, and let us enjoy the good things that are present and let us speedily use the creatures as in youth. Let us fill ourselves with costly wine and with ointments and let not the flower of our time pass by us. Let us crown ourselves with roses before they be withered. Let no meadow escape our riot. Let us everywhere leave tokens of joy. All things are left behind here and we bring with us nothing but what bodily pleasures we have experienced. I have set myself up, therefore, as a teacher of this philosophy. Nothing is true unless it brings some good, something sweet, and something pleasant. Put your trust in this philosophy, which is the very wisdom of Solomon.

On hearing these words, the young man is wounded like a stag when the arrow pierces his liver. Virtue, having pity on him and seeing him on the point of falling, rushes to his aid. She is fearful that he, being human, may be intrigued, if there should be any delay, by such sweet allurements. "Although you have not sought my aid," she says, "I have come openly before you lest this intemperate woman, who knows no shame, may outwit you in your ignorance. She sits at the door of her house upon a seat in the public squares calling them that pass by." Now therefore, my son, hear me and attend to the words of my mouth. Let not thy mind be drawn away in her ways. For she has cast down many wounded and countless are those she has slain. Her house is the way to hell, reaching even to the inner chamber of death. Remove from thee a forward mouth and let distracting lips be far from thee. Let thy eyes look straight on. Mind not the deceit of a woman, for the lips of a harlot are like a honeycomb dropping. This for a time you may find intriguing, but soon you will discover that this is more bitter than poison. Time will not permit me to relate in detail her vices. I refer you to the Book of Proverbs where these are described. Do not let her outward appearance dazzle you. It is fraudulent and full of deceit, entirely lacking in genuineness and in truth. Do not be tricked by the artifices of her eyes. Rather, be a follower of him who cometh leaping upon the mountains, skipping over the hills, looking through the windows, beyond the reach of snares. The bonds of Pleasure, which give delight to the eye, charm to the ear, but pollution to the mind, are evil. What Pleasure offers is often spurious. Truth is obscured and instruction ignored by promises of gold to come. However, choose knowledge rather than gold and wisdom above precious gold. It is better than all the most precious things. I will not conceal from you the sum total of the effects of Pleasure. I should not want to conceal her ugliness or dissemble her enticements, for she lifts up and excites the mind by the eloquence of her speech. In effect, she shows all the kingdoms of the world and says: All these things I will give to thee, if thou wilt fall down and worship me. At that point be on your guard lest you be deceived by the impermanent and the passing which tempt us mightily.

The Lord Jesus has pointed out to you how you may resist temptations of this sort. The Devil first tried to snare Him with an appeal to the satisfaction of hunger: If thou art the Son of God, command that this stone become a loaf of bread. But he answered and said, "Not by bread alone does man live, but by every word of God". Thus was the snare broken. Again the Devil laid another snare, this time, one of vainglory, a vice that often leads men to destruction in their hour of prosperity. And he led him to Jerusalem and set him on the pinnacle of a temple and said to him. "If thou art the Son of God, throw thyself down from here, for it is written, he has given his angels charge concerning thee, to preserve thee, because upon their hands they shall bear thee up, lest thou dash thy foot against a stone." And so, although the Lord Jesus might have cast himself down without danger because of His command over the elements, yet, lest He be subject to pride, He gave this reply to the Devil: Thou shalt not tempt the Lord thy God. In this way He taught us how to ward off the temptations of the Devil. If a real opportunity for vainglory should thus be passed by, how much greater occasion do we have to exercise humility when we are presented with a situation that is entirely different! We should not neglect to mention the third time when the Devil attempted to snare the Lord by appealing, on this occasion, to avarice and ambition. He took him to a mountain and showed him all the kingdoms of the world in a moment of time. Since these things cannot endure, the expression in a moment of time is quite appropriate. Wait a little while and these things pass away. Wherefore, those who follow such pursuits seem to themselves to be on a mountain top. But their position is temporary, for it is written: I have seen the wicked highly exalted and lifted up over the cedars of Libanus and I passed by, and lo, he was not. Those who consider temporary things to be of prime importance seem, in fact, to worship the Devil: Their god is the belly, their glory is their shame. Set your glory in God's hands who says to you: The Lord thy God shalt thou worship and him only shalt thou serve, from whom you will attain not what is temporal but what is everlasting.

Those, indeed, who find delight in things that endure should make their petitions in due course to Him who is the true source of all things. Those things which the Devil seems to claim as his property are not really his, as he maintains: To thee will I give all this power and their glory, for to me they have been delivered. Put your hope in Him, therefore, who is the Creator of each and every creature, although the brevity of this life does not call for provision for a long journey. God has ordained that the Devil be given power to tempt man for a while, but not to possess him. The crown of victory cannot be attained without a contest. The unstable must be put to the test, so that they may become just and thus merit the reward.

God, therefore, assigned this office to the Devil because thereby the person involved is subject to punishment if he misuses his opportunity. Where does the man given to pleasure find his treasure if not in luxurious living? But the thrifty man, not the spendthrift, is held in esteem. Hence, follow the example of the frugal man when you sit at table. Do not by overindulgence become an object of hate: Watching and choler are with the intemperate man, and again: If thou hast been forced to eat much, arise, go out and vomit; and it shall refresh thee and thou shalt not bring sickness upon thy body. Many are the victims of gluttony, whereas temperance claims none. Frugality in the use of wine is beneficial, but countless individuals harm themselves by overindulgence. Many are the victims of excess at the banqueting table—an excess which deprives them of the use of speech. These who are harmed by gluttony are the victims of intoxication, which, while in itself a sin, drives some men to commit sin and reduces others to poverty. Take note of the type of person whom Christ would finally exclude from heaven: When the master of the house has entered and shut the door, you will begin to stand outside and knock at the door, saying, "Open for us!" And he shall say to you in answer, "I do not know where you are from." Then you shall begin to say, "We ate and drank in thy presence and thou didst teach in our streets." And he shall say to you, "I do not know where you are from." You have heard what He said about those who in eating were epicures. Now pay heed to what He says about those who fast: Blessed are they who hunger and are thirsty now, for they shall be satisfied. And again: Woe to those who are filled! For you shall hunger.

But do you wish to eat and drink? Enter into the banquet hall of Wisdom, who invites all men, proclaiming with a loud voice: Come, eat my bread and drink my wine which I have mingled for you. Do you find delight in songs which charm the banqueter? Listen to the voice of the Church, who exhorts us not only in canticles, but in the Canticle of Canticles: Eat, O friends, and drink and be inebriated, my brethren. But this inebriation makes men sober. This inebriation is one of grace, not of intoxication. It leads to joy, not to befuddlement. In the banquet hall of the Church there will be pleasant odors, delightful food, and drink in variety. There will be noble guests and attendants who grace the occasion. It will not be otherwise! What is there that is nobler than to have Christ at the Church's banquet, as one who ministers and is ministered unto? Attach yourself closely to Him who reclines as a guest at that banquet. Unite yourself to God. Do not disdain the banquet table which Christ chose, saying: I am come into my garden, O my sister, my spouse. I have gathered myrrh with my aromatic spices. I have eaten my bread with my honey and I have drunk wine with my milk. The garden is the Garden of Paradise, that is to say, the place of the Church's banquet, where Adam was before he committed sin and where Eve sat before she became responsible for a deed of wrong. There you will gather myrrh, that is to say, perform the burial of Christ, so that as you are buried with him by means of baptism into death, and as He has risen from the dead, you, too, may rise. There you will eat bread which strengthens man's heart. You will taste of honey which is a delight to the tongue. You will drink wine along with milk, that is to say, with splendor and purity. This refers to the purity of simplicity or to grace which is untainted and is applied to the remission of sins. Its effects are comforting as milk is to infants at breast, who thereby grow with delight into the plenitude of perfect age. Approach, therefore, this banquet. Are you afraid that the house is too narrow and that the banquet hall may restrict you because of its smallness? O Israel, how great is the house of God and how vast is the place of his possession! It is great and hath no end: it is high and immense. There were the giants, those renowned men that were from the beginning, of great stature, expert in war. The Lord chose not them. They did not deserve to be chosen, for they had knowledge of war, not of peace. Learn, therefore, the ways of peace, that you may be chosen by God. But that you may perhaps be aware that the hugeness of His house is not without adornment and that you may find delight in serried rows of columns, Wisdom hath built herself a house, she hath hewn her out seven pillars. Our Lord Jesus, too, states that in my Father's house there are many mansions. In this house, then, you will enjoy food for the soul and drink for the mind, so that you may never after hunger or thirst, for he who eats here eats to satiety and he who drinks here drinks to the point of inebriation.

But this inebriation serves as a guard over modesty, whereas the inebriation due to wine is a stimulus to lust, by which the fleshly organs within us are heated, our minds are inflamed, and our souls enkindled. Lust serves as an uncontrolled stimulus to wickedness. It never allows our emotions to find rest. Night and day, asleep or awake, we are disturbed by its inroads. Our minds cannot function and unreason displaces reason. Lovers are made uneasy and sinners incline to more sin. Even the chaste feel its effects. The victim is overcome and kept subdued by the application of fire. Sinfulness and wickedness become uncontrollable and the devotee of sin can have his fervor extinguished only by death. Hence the Apostle says: Flee fornication. By a swift flight we can shun the savagery of such a rabid mistress and escape from such vile servitude.

What shall I say concerning avarice, that insatiable longing, that very lust for gold which is ever desirous of more—no matter what accumulated treasure is stored away. An object of envy to all, but to himself despicable, the avaricious man is poor in the midst of riches, slighting the fact that his bank balance is large. His desire for gain is as limitless as are his opportunities for making a profit. He is so consumed with passion that the only difference between him and an adulterer is that one has an inordinate love for physical form, the other, a desire for a farm, a rich estate. The avaricious man does violence to the elements by ploughing the earth and cleaving the sea. He importunes the very heavens with his vows. He ever gives expression to displeasure whether the skies are serene or cloudy, and is censorious no matter what his annual returns are from land or sea. Here is clear evidence of his sickness of soul. Wherefore Ecclesiastes says: There is a grievous illness which I have seen under the sun: riches kept to the hurt of the owner. And again he says: A covetous man shall not be satisfied with money. There is no end to their getting. If you are desirous of treasure, take the invisible and the intangible which is to be found in the heavens on high, not that which is in the deepest veins of the earth. Be poor in spirit and you will be rich, no matter what your worldly goods are. A man's life does not consist in the abundance of his possessions, but in his virtue and in his faith. This richness will enrich you if you are rich in your relations to God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapters 4-5"

[[commentary]]
quote='''
You have heard the secret rites of Pleasure. You have heard, too, what we offer from our store. I considered it proper that these last be not concealed by outward trappings. I wished that they be arrayed in the unadorned words of Scripture in order that they may gleam in their own light and that in due order they may speak out plainly for themselves. The sun and the moon need no interpreter. The brilliance of their light is all-sufficient—a light that fills the entire world. Faith serves as an illumination for the inspired Word. It is, if I may say so, an intestate witness having no need of another's testimony, yet it dazzles the eyes of all mankind. Our works are not announced, therefore, to the world. They speak aloud for themselves. Lest I seem to omit what is required in the way of effort, certain essentials are in this regard quite necessary. We need to have faith and zeal, together with deeds. The three elements requisite for the expression of man's religious duties are defined by our Lord Jesus: Ask and it shall be given you. Seek and you shall find. Knock and it shall be opened to you. And again: Everyone therefore who hears these my words and acts upon them is like a wise man.

The person who zealously pursues these objectives will receive an unusual blessing. He will be like the patriarch Jacob, who eliminates all vestiges of human passion by his faith and continence. He states: God has been good to me and I have all I need. We should merit, therefore, this goodness by the exercise of our faith, our zeal, and our accomplishments. By this means the people of Israel found the grace of God which itself provided them with everything. They rejoiced in the attainment, not of the things of this world, but in their training in virtuous deeds. Let us make as our heirs those virtues which holy Abraham adopted for himself in respect to his son Isaac. He handed over his entire inheritance to one who was wise and just. He did not grant the right of inheritance to his maid-servants or to their children. He presented them merely with a gift. Those who are perfect in virtue receive the entire patrimony of glory, whereas a mere trifle is bestowed on the mediocre and commonplace. Accordingly, Agar, whose name in Latin means "dwelling near" and Chettura, signifying "fragrant," are not heirs of Abraham. Those whose training is mediocre are neighbors of the home of Wisdom, not dwellers therein. That which has a modicum of fragrance has not reached its fulfillment in fruit. Food, not mere fragrance, is conducive to health. Fragrance is just the herald of fruit to come. We conclude, therefore, that those who are leaders in virtue are to be preferred to those who are slackers and that native dwellers have preference over those who are merely neighbors in the land of Virtue.

This is a rational interpretation. But there is another, a mystical one, according to which Abraham, the father of the race, confers the entire legacy of his faith to his lawful seed which is Christ, who, like a stranger on earth, strove to restore the fragrance of this life rather than the fruit. When the mind gives heed to this meaning, it turns away from Pleasure and links itself to Virtue in admiration of what is truly beautiful, what is pure in feeling, what is simple in thought, and what is seemly in external appearance. This means that Virtue is not arrayed in the persuasive words of wisdom but in the demonstration of the Spirit. Such is the nature of the apostolic message, in appearance clothed in all manner of wisdom and piety, shining forth more brilliantly, and more precious, too, than gold of any sort. Moreover, this message inculcates the grace that proceeds from that choral band of virtues: namely, Prudence, Temperance, Fortitude, and Justice. Stirred in such wise, the soul strives after those virtues to which Jacob, a man of wide experience, had applied himself. Wherefore he is depicted as a shepherd herding sheep. This signifies that he was considered to have surpassingly good qualities to be able to lord it over his body and his senses, and to be able to control his tongue, lest it wander like a lost sheep—qualities which are of greater import than the power of dominion over cities and peoples. It is more difficult for a person to rule over himself than over others. To exercise control over one's mind, to restrain one's wrath, and to integrate the conflicting ordinances of soul and body are characteristics of a man who is immortal by nature, a man whom the infernal portals shall not enclose. Hence the lawgiver himself claimed this as his right: to pasture the flocks of Jethro (whose name means "superfluous") and to drive them into the desert. This means that he compelled the irrational loquacity of one whose language was common and superfluous to enter into the mysteries of sound doctrine, for shepherds were repugnant to the Egyptians. All who surrender themselves to the passions of this body of ours and indulge in its pleasures are sworn enemies of those who stand for virtue. And so in a parable Moses has informed us that those virtuous principles and deeds which foolish men avoid are offerings suitable for God. Hence Abel was a shepherd and Cain a tiller of the soil, who in foolish fashion could not brook the bright lineaments of virtue that adorned his own brother.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 6"
