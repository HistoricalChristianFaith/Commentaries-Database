[[commentary]]
quote='''
And rightly is the title placed above the cross, because Christ's kingdom is not of the human body, but of the power of God. I read the title of the King of the Jews, when I read, My kingdom is not of this world. (John 18:36.) I read the cause of Christ written above His head, when I read, And the Word was God. (John 1:1.) For the head of Christ is God. (1 Cor. 11:3.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The title too is written. A procession is wont to go before victors; but before the Lord's triumphal chariot went the goodly procession of the dead rising again. A title too is wont to show the number of subjugated nations. Let there be in those triumphs, set out in a certain order, the pitiable and humiliating captivity of conquered and perishing nations; here the grace of redeemed nations blooms. Worthy of so great a triumph is the team that draws it, so that heaven, earth, seas and the underworld are changed from corruption to grace.

The title is written and placed above the cross, not below the cross, because the beginning is upon his shoulders. And what is the beginning but his everlasting power and divinity? Whence he himself too, when asked: Who are you? answered: The Beginning, who also am speaking to you. Let us read this title. Jesus it says the Nazarene, King of the Jews.

Rightly is the title above the cross, because the kingdom which Christ has is not of a human body but of divine power. Rightly is the title above the cross, because although the Lord Jesus was on the cross, yet above the cross he shone with the majesty of a king. A worm on the cross, a beetle on the cross. And a good worm, which clung to the wood; a good beetle, which cried out from the wood. What did he cry out? Lord, do not lay this sin against them. He cried out to the thief: Today you will be with me in paradise; he cried out like a beetle: God, my God, look upon me! Why have you forsaken me? And a good beetle, which rolled the mud of our body, before shapeless and sluggish, with the footsteps of the virtues; a good beetle, which raises up the poor man from the dung. He raised up Paul, who was counted as dung; he raised up Job too, who sat on the dung.

Not slight, therefore, is the title.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
