[[commentary]]
quote='''
Joseph, then, was sold, led into Egypt, bought by the overseer of the cooks. No idle figure this, one who would cook what was raw among foods, so that minds might feast on the sweetness of faith; for no food is sweeter than knowledge and teaching. Before, there was in Egypt a raw unbelief, which no ardour of divine knowledge and no desire for true knowledge had softened, which the fiery words of the Lord had not cooked through. And Joseph was sold in Egypt because Christ was to come to those to whom it was said: By your sins you have been sold, and therefore he redeemed by his own blood those whom their own sins had sold. But Christ, sold by taking on our condition, not by guilt, is not held by the price of sin, because he himself did no sin. So by the price he took on our debt, not debts of his own; he took away the bond, removed the moneylender, released the debtor: one man paid off what was owed by all. It was not permitted to us to go out from slavery. He took this on for us, to drive back the slavery of the world, to restore the freedom of paradise, to bestow a new grace by the honour of fellowship with himself. So much for the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 4"

[[commentary]]
quote='''
True indeed, true is the divine pronouncement, seeing it is of God, who when he had been angered by the impiety of the people of the Jews because they were going after strange gods, said: To what usurer have I sold you? For he is sold who has been bound to the usurer, not for one price, but for a daily one; he is sold not at a fixed price, but with constant increase. There is a new increase of interest every month, a new sale with daily bidding. He who offers more always prolongs the business; he is declared for sale, he is never adjudged as sold. Great then is the force of the divine pronouncement. The Lord did not consider it enough to say To whom have I sold you? He added to what usurer? Angered, he could find nothing more severe by which he could punish the faithless. Abandoned, he demands why they have thus fled from the author of salvation, just as [the Lord] would have sold them to some usurer as a punishment befitting one who deserts [the Lord]. Slaves have something more to fear than the punishments of prison and chains, free men something to dread from their neglect of their freedom.

At the same time note this, that usury has been judged the basis of transgression, because he easily departs from the Lord who can obligate himself to the usurer. For interest is the root of deceit, the cause of faithlessness. "I have not sold you" He says, "but you are sold for your iniquities." Therefore he who binds himself to the usurer sells himself, and what is worse, sells himself not for money but for sin.

Who is that usurer of sin, if not the devil, by borrowing sin from whom, Eve indebted the whole human race with the usury of a guilty inheritance? Therefore like a wicked usurer he held the bond which afterward the Lord blotted out with His blood. For what had been written in characters of death had to be destroyed by death. Accordingly the devil is a usurer. Therefore he showed his riches to the Savior saying: All these will I give thee if falling down thou wilt adore me. But in truth the Lord, the payer of the debt, owed nothing to him, Who could say: The prince of this world cometh and hath found nothing of his in me. He owed nothing but He paid for all, just as He Himself testifies, saying: Then did I pay that which I took not away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapters 8-9"
