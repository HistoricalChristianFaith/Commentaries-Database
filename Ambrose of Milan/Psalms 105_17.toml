[[commentary]]
quote='''
For although Joseph was sold, yet the prophet did not say: 'Joseph was sold by the Lord', but: Joseph was sold for a servant, he whom his own brothers sold, but whom the Lord, in a figure of his own Passion, redeemed from servitude and renewed to grace. So his brothers sold him and received money, but the Lord not only restored him to freedom, but also heaped him with dignity. And that there was in him a figure of the Lord Jesus, Scripture shows, which says: My son, sought with jealousy, return to me, and elsewhere: The firstborn, the beauty of a bull is his, in that God the Father exalted the horn of his anointed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
