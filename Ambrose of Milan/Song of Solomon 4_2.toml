[[commentary]]
quote='''
[There is a] pleasing comparison to those that are shorn; for we know that goats both feed in high places without risk and securely find their food in rugged places, and then when shorn are freed from what is superfluous. The church is likened to a flock of these, having in itself the many virtues of those souls which through the laver lay aside the superfluity of sins and offer to Christ the mystic faith and the grace of good living, which speak of the cross of the Lord Jesus.
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 7:38"

[[commentary]]
quote='''
These truly are they who bear twins, in whom there is no barrenness of virtues, no sterility of merits. Well do they bear twins, because they double their senses; whence you have it written in Proverbs: And do you write these things for yourself threefold, for counsel and for knowledge (Prov. 22:20). He set down first a threefold writing, and added two things, counsel and knowledge. But knowledge is twofold, one of incorporeal things, the other of corporeal; whence you have also in what follows: Your two breasts are like two twin fawns of a roe, which feed among the lilies, until the day breathes and the shadows decline.

We have spoken of fruitfulness; let us speak of the teeth. For many who sail, and those who hasten on a journey by land, when they see some beautiful place, linger for the sake of delight; they feast their eyes and refresh their mind. Nor is it reckoned any delay to the journey, but a pleasure. So too it is our heart's desire to consider the most beautiful teeth of just souls; for Scripture has taught that the teeth of the just are most beautiful, speaking according to the letter of the patriarch Judah, but spiritually of Christ: His eyes are joyful from wine, and his teeth like milk (Gen. 49:12). In this it proclaimed, surely, not the functions of human flesh but the gifts of divine grace. The example teaches, therefore, that the teeth are not to be passed over where we have discussed the eyes.

Who, then, are the teeth of just souls, if not those which, receiving food that is shapeless and hard, or often cold, or hot beyond measure, now grind it, now warm it, now temper it, according to the quality of the nourishment? They grind what is hard, lest the harshness of the letter in the Old Testament and the rigidity of worldly understanding, unless it has been dissolved by the spiritual tooth, should block the passages of the saving books and choke the very vital organs, and a kind of gullet of the soul, through heedless gluttony. It is fitting, then, that you first divide the food that is taken, if it seems solid to you, and break it up; and, once it is softened, pour it without any harm to the soul into all its members by a natural distribution, so that its whole body may feast on the vital juice. Take nothing corpse-like, nothing dead, into your mouth, lest it be said: Their throat is an open sepulchre (Ps. 13 (14):3). But draw in the living word, so that it may work in the inmost parts of your mind. These teeth are whiter than milk, because they are the teeth of the just.

Finally, although all our fathers were baptized in Moses in the cloud and in the sea, yet it is not idly written: That all ate the same spiritual food, and all drank the same spiritual drink (1 Cor. 10:3 and 4); so that a certain greater brightness might come to these teeth of the saints, which we shall recognize to have been cleansed, after the crossing of the Red Sea, when the bitterness of the fountain of myrrh had been tempered by the grace of the wood (Exod. 15:25); then by the drink of twelve fountains; lastly by the watering of the rock that poured forth a spiritual wave: For the Rock was Christ (1 Cor. 10:3 and 4). Therefore they also ate manna (Num. 20:11), so that, washed so many times, they might eat the bread, as it is written, of angels (Ps. 77 (78):25). Now too, in the mysteries of the Gospel, you recognize that the baptized, although washed in the whole body, are nonetheless afterward cleansed by spiritual food and drink; for that is the true brightness of the teeth, where the melodious confession of a mind of good conscience resounds. That is the clean eye, which no beam of grave sins has weighed down, which no mote of light impurities has disturbed.

Your teeth are like a flock of shorn goats, which have come up from the washing, all of which bear twins, and there is none barren among them. This is no ordinary praise, first through the apt comparison with the shorn ones; for we know that goats both pasture on the heights without danger and take their food securely on steep places, and then, when they are shorn, are unburdened of what is superfluous. To their flock the Church is compared, having in herself many virtues of souls, which through the washing put off superfluous sins, which bring to Christ mystical faith and moral grace, which speak of the cross of the Lord Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
