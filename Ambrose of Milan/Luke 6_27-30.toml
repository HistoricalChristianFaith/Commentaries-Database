[[commentary]]
quote='''
So that saying of the Apostle, that love is patient, is kind, is not envious, is not puffed up, we see brought to completion in these precepts. If it is patient, it owes patience to the striker; if it is kind, it ought not to answer curses; if it does not seek its own, it ought not to resist the plunderer; if it is not envious, it ought not to hate an enemy. And yet the precepts of divine devotion overflow those of the Apostle; for it is more to give than to yield, it is more to love enemies than not to be envious. All of which the Lord both said and did. Who, when he was cursed, did not curse in return; when he was struck, he did not strike back; when he was stripped, he did not resist; when he was crucified, he asked pardon for his very persecutors, saying: Father, forgive them their sin, for they know not what they do. He was excusing his accusers from the charge.

They were preparing the cross; he was repaying salvation and grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
