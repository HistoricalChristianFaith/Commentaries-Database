[[commentary]]
quote='''
Now let us consider what the just man ought to be like if envy has arisen. First, that he avoid it; for it is better to go away without a quarrel than to stay on amid wrangling. Next, that he possess such things as he can carry away with him, so that in nothing can he be held liable by his adversary, but may say: Recognize whether anything of yours is with me. And Laban searched and found nothing of his with Jacob. A great man and truly blessed, who could lose nothing of his own, have nothing of another's, that is, have nothing too little, nothing superfluous. And so he is perfect to whom nothing is lacking, and just, to whom nothing is over; for this is to hold the measure of justice. How great a virtue, whose fellowship brought gain and inflicted no loss! This is to be perfect: to give very much advantage to those who cling to one, and to bring no disadvantage.

In short, he who desired to do him harm could not send him away empty. For the wise man is never empty, always having within himself the cloak of prudence, being one who can say: I put on justice and clothed myself with judgment, as Job said. For these are the inner coverings of the mind, which no one else could take away, except when a man's own guilt strips him. In short, Adam, stripped in this way, was found naked; but Joseph, even when his outer garment was thrown off, was not naked, for he kept the garments of virtue safe. The wise man, therefore, is never empty. For how is he empty who has received of the fullness of Christ and keeps what he received? How is he empty whose soul is filled, the soul that guards the garments of the grace it received? This is what must be feared: that someone lose the covering of innocence, that the impious, overstepping the bounds of justice in the onset of a sacrilegious persecution, snatch away the garment of soul and mind. This does not easily happen, unless the voice of his own iniquity has first stripped a man. Hence David too says: If there is iniquity in my hands, may I deservedly fall empty before my enemies: let the enemy pursue my soul and seize it.

None of your enemies, then, can seize your soul unless it has first been made empty. Do not fear, therefore, those who can plunder treasures of gold and silver. They take nothing from you. For they take away what you did not have, they take away what you could not possess, they take away what did not adorn your soul but burdened it, they take away what did not enrich your heart but rather weighed it down; for where your treasure is, there will your heart be also, as you heard read today. Many shut up their gold behind the bolts of their doors, but these do not trust even their bars and locks; many employ watchmen, but they too are wont to fear the guards themselves more; many brood over buried gold: their gold is under the earth and their heart is under the earth. Beware, then, lest you too bury your heart in the earth while you are alive. It is not, then, the thieves of that gold who are to be feared; it is that money-lender you must beware of, who searches the substance of your soul to see whether you have contracted any debts of graver sin, who shuts your heart up in the ground, who overwhelms your soul with the same turf with which you covered your gold, who bows your mind down with the usury of the hundredth and buries it in a heavy sepulchre, from which no one rises again. Follow holy Jacob, who neither had anything of others' vices nor was empty and void of his own virtues, who was filled with the fruit of justice.

But these things belong to the moral sense; this is the mystical: that Laban, that is, "whitened", came to him, because Satan too transforms himself into an angel of light, and began to seek his own things from him. Jacob answered him: Recognize whether anything is yours with me, that is: I have nothing of yours. Search, if you recognize anything of your vices and crimes. I have taken nothing of your frauds away with me, and I have no partnership at all in deceit; I have fled from everything of yours as from a contagion. And Laban searched and found nothing of his. How blessed the man in whom the enemy found nothing that he could call his own, in whom the devil came upon nothing that he would recognize as his! That seemed impossible in a man, but he bore the type of him who said in the Gospel: The prince of this world will come and will find nothing in me. For whatever is the devil's is nothing, since it can have no permanence and no substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"
