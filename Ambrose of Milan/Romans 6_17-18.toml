[[commentary]]
quote='''
Certainly the fear of God is of the number of the virtues, because the beginning of wisdom is the fear of God, through which the form of devout teaching is acquired, of which Paul says: But thanks be to God, that you were slaves of sin, but you obeyed from the heart that form of teaching into which you were handed over; and, freed from sin, you have become slaves of justice. Teaching, then, brings it about that we can attain to justice. Justice, therefore, can be acquired by learning. Let us therefore apply ourselves with zeal to the form of the Gospel teaching. Very little zeal is often reckoned as very much. For all things lie in zeal, through which obedience is applied, and obedience, whichever way it has leaned, adds either guilt or grace. It was this that drew us to death in the first Adam; it was this that called us to life in the second Adam.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 3"
