[[commentary]]
quote='''
Thus Moses too was learned in all the wisdom of the Egyptians, but he cast it away, preferring to the treasures of Egypt reproach for the name of Christ. For if he had judged that wisdom to be of any moment, he would certainly not have said: I pray, Lord, I am not worthy, before yesterday and the day before, nor since you began to speak to your servant; for I am of slender neck and slower tongue. Thus, as to one unlearned, he is answered that he would be taught by the Lord: I will open your mouth and instruct you in what you ought to speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
