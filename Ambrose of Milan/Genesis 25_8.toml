[[commentary]]
quote='''
This too is excellent, what Scripture says: Before death praise no one. For each one is known in his last days and judged in his children, whether he has trained his sons well and taught them with fitting disciplines, since the dissoluteness of sons is referred to the negligence of the father; and also because each one, as long as he lives, is liable to falling, nor is old age immune from crime. Therefore you read that Abraham died in a good old age, because he remained in the goodness of his purpose. Death, then, is the testimony of life. For if a helmsman cannot be praised before he has brought his ship into harbour, how will you praise a man before he has come into the anchorage of death? He himself is his own helmsman, and he himself is tossed on the deep of this life: as long as he is on this sea, so long is he among shipwrecks. A general himself does not take the laurel unless the battle is finished, nor does a soldier lay down his arms or obtain the wage of his pay unless the enemy is overcome. Death, then, is the fullness of service, the sum of the wage, the grace of discharge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 8"

[[commentary]]
quote='''
So Abraham, having celebrated his son's marriage, completed his days at a great age and in a good old age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
