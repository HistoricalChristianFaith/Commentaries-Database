[[commentary]]
quote='''
What shall I say of Judas the traitor, who sought avarice and found sacrilege, saying: What will you give me, and I will deliver him to you?, and, not sated with the spoils of the poor, by sowing crimes reached the fullness of the most grievous crimes, mingling the holy sacraments of love with outrages, when he said: Whomever I kiss, he it is; hold him, so that truly it cannot be doubted that it was said of him: The words of his mouth are iniquity and deceit? He bore kisses on his lips, he poured venom into hearts; he was plotting bitter punishments, he brought a pledge of grace.

Well did the prophet cause it to be added concerning him: He would not understand, that he might do well; for he did not sin by nature but by will. Indeed, he was an apostle, he heard the divine commandments daily, he learned the heavenly mystery; he could have understood so as to do well, if he had wished. He saw paralytics healed, light poured back into the blind, the dead raised; ought he not to have understood that it was God who could do such things? But he would not understand, because, a covetous man and intent on money, he turned the vigour of his mind away from the knowledge of the divinity. For everyone who has gorged himself on outrages does not wish to understand what belongs to the heavenly commandments, lest he be called back from his vices. See him fleeing from understanding, who says: Darkness covers me and walls surround me; who knows whether the Lord sees? For he does not wish to seek and find that God sees and knows all things, lest he be drawn back from crime by fear. See King Ahab asking Naboth for his vineyard; recognize the man answering him: Far be it from me that I should give up the inheritance of my fathers. Ought he not to have understood that the man was answering justly? But he would not understand, that he might do well, and not seek what was another's. Ought he not to have understood that Elijah served the true God, when he saw the sky shut at the word of Elijah for three years and three months, and rains sent down at his prayers, so that all dry things were watered? But he would not understand, lest he should condemn unbelief and follow faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
