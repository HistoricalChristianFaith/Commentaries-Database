[[commentary]]
quote='''
"The bosom of the Father," then, is to be understood in a spiritual sense, as a kind of innermost dwelling of the Father's love and of his nature in which the Son always dwells. Even so, the Father's womb is the spiritual womb of an inner sanctuary from which the Son has proceeded just as from a generative womb. To be sure, we read in different versions, now that it was the Father's womb, again that it was his heart with which he uttered the Word, and again that it was his mouth from which justice proceeded and from which wisdom came forth, as Wisdom says, "From the mouth of the Most High I came forth." Thus, since the One is not limited and all things declare the One, the blessing refers rather to the spiritual mystery of generation from the Father than to some part of the body. But just as we interpret it to mean that generation from the Father, likewise let us interpret it to mean the generation from Mary unto the completion of faith, when the mother's womb is blessed, that virginal womb of Mary that brought forth for us the Lord Jesus.… Here was a twofold nature in Christ, the divine and the fleshly, the former from the Father, the latter from a virgin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs 11.51"


[[commentary]]
quote='''
The Word of God is in the bosom of his Father, that is, in the hidden and secret places of God. The fountain of wisdom is there, and from it one may drink the everlasting drink of eternal life in place of death.
'''
source_url=''
source_title="FLIGHT FROM THE WORLD 2.10"

[[commentary]]
quote='''
And why do we speak of men, when even of the heavenly virtues and powers themselves we have read that no one has ever seen God? And he added what is beyond the heavenly powers: the only-begotten Son, who is in the bosom of the Father, he himself has declared. Either, then, it must be acknowledged, if no one has ever seen God the Father, that the Son was seen in the Old Testament, and let the heretics cease to give a beginning from the virgin to him who was seen before he was born of the virgin; or certainly it cannot be refuted that either the Father or the Son or certainly the Holy Spirit — if indeed there is a vision of the Holy Spirit — is seen in such a form as the will has chosen, not as nature has formed, since we have learned that the Spirit too was seen in a dove. And so no one has ever seen God, because no one has beheld that fullness of divinity which dwells in God, no one has grasped it with mind or eyes; for has seen is to be referred to both. Indeed when it is added: the only-begotten Son himself has declared, the seeing of minds rather than of eyes is made known; for a form is seen, but power is declared; the one is grasped by the eyes, the other by the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
