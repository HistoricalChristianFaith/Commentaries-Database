[[commentary]]
quote='''
And why do we speak of men, when even of the heavenly virtues and powers themselves we have read that no one has ever seen God? And he added what is beyond the heavenly powers: the only-begotten Son, who is in the bosom of the Father, he himself has declared. Either, then, it must be acknowledged, if no one has ever seen God the Father, that the Son was seen in the Old Testament, and let the heretics cease to give a beginning from the virgin to him who was seen before he was born of the virgin; or certainly it cannot be refuted that either the Father or the Son or certainly the Holy Spirit — if indeed there is a vision of the Holy Spirit — is seen in such a form as the will has chosen, not as nature has formed, since we have learned that the Spirit too was seen in a dove. And so no one has ever seen God, because no one has beheld that fullness of divinity which dwells in God, no one has grasped it with mind or eyes; for has seen is to be referred to both. Indeed when it is added: the only-begotten Son himself has declared, the seeing of minds rather than of eyes is made known; for a form is seen, but power is declared; the one is grasped by the eyes, the other by the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Therefore the true Joseph also, that is, the arbiter and interpreter of the Godhead, runs to meet them, because confession now goes before those whom unbelief possessed before. For Christ is the interpreter of the Godhead, because no one has ever seen God, except the only-begotten Son, who is in the bosom of the Father; he has made him known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"

[[commentary]]
quote='''
But as for his saying: the blessing of the womb of your father and mother, if we choose to understand the womb of Mary alone, the reason why he joined both blessings will remain hidden — for he could have spoken of the mother's womb alone — but I think it finer that, according to the spiritual mystery, we should understand both generations of the Lord Jesus, both according to the divinity and according to the flesh, because before the ages he was begotten of the Father. Hence the Father too says: my heart has poured forth a good word, because he proceeded from that inmost and incomprehensible substance of the Father and is always in him. Hence the evangelist too says: no one has ever seen God, except the only-begotten Son, who is in the bosom of the Father; he has declared him. As, then, the bosom of the Father is understood spiritually as an inmost secret, as it were, of the Father's love and nature, in which the Son ever is, so too the womb of the Father is that of a spiritual, inward hidden place, from which, as from a womb that gives birth, the Son proceeded. Indeed, we read in different places now of the womb of the Father, now of his heart, with which he poured forth the Word, now of his mouth, from which justice proceeded, from which wisdom came forth, as she herself says: I came forth from the mouth of the Most High. Thus, since no single thing is defined and all express one thing, it signifies the spiritual mystery of the Father's generation rather than any bodily member.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"
