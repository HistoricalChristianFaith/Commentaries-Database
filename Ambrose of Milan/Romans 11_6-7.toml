[[commentary]]
quote='''
And where there is grace, it is surely not by the merit of works nor by the justification of virtues, but by the liberality of the giver, by the choice of the redeemer. This Scripture has equally taught you, when the apostle Paul says: But if by grace, it is no longer of works; otherwise grace is no longer grace. What then? What Israel sought, this it has not obtained. Recognize why it did not obtain it: because it desired to justify itself, because it sought to boast of its works, because it did not offer faith nor acknowledge grace. And therefore the election obtained it, which heard him who called and received him who came.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
