[[commentary]]
quote='''
The mind, then, is good, if it is intent on reason, but hardly perfect unless it has the helm of Christ. For the Lord Jesus came to fix our passions to his cross and to forgive sins. In his death we have been justified, so that the whole world might be cleansed by his blood. Indeed, we were baptized in his death.

If, then, our sins are forgiven us in his death, let the passions of sins also die for us in his death, let them be held fastened by the nails of his cross. If we have died in his death, why are we called back again, as though living, to the things of the world? What have we to do with the elements of the world, what with desires, what with luxury and wantonness, to which we have died in Christ? But if we have died in Christ, in Christ we have risen again; let us then dwell with Christ, let us seek with Christ the things that are above, not those that are corruptible and earthly. Christ, rising from the dead, left the old man fastened to the cross and raised up the new. Christ died for this reason, that we too might die to sin and rise again to God. Our flesh is dead: why does it come to life again for sin, why does it obey sin again? Why does sin reign again among the dead, when death is the end of sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 5"
