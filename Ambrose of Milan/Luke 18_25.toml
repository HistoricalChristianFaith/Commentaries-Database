[[commentary]]
quote='''
It is easier for a camel to pass through the eye of a needle than for a rich man to enter the kingdom of God. Great force, great weight in the words. For with what other words could he more vehemently express that a rich man ought not to boast in his riches than with such as these, by which it is defined that a merciful rich man is against nature? Take away from me the allurements and the paint of words, which are wont to enervate thoughts. This man was not to be coaxed but broken, he who rejected mercy. Yet if any are delighted more by the ornaments of words than by a certain manly and natural bearing and form of the meaning, then — as good suitors do in taking a wife, examining her character, not her comeliness, and not being turned back by any offense in her looks when they are drawn by the virtue of her mind — so let these too seek in the words the mystery, which is a kind of mind and soul of the words, and let them not pick over the words in the mystery.

The camel, then, is taken in type as the Gentile people, which that lion, seeking whom he may devour, drives, laden with treasure, into the desert in the prophetic visions: in tribulation, indeed, and anguish are the lion and the lion's whelp; to the asps and the offspring of flying asps they carried their riches on asses and camels. And the camel was rightly figured for the Gentile people, because, degenerating through the deformity of superstition before the people of the nations believed, it displayed the appearance of a beastly foulness, absurd footsteps, a misshapen face. So this sinner entered more easily through the narrow way, which is the way of Christ, who, piercing through the way of death by the passion of his own body, like a needle, mended the torn garments, as it were, of our nature, than did the people of the Jews, rich in the law, needy in faith, headlong in fury, shameful in crime.

You can also understand it in the moral sense of every sinner and of the arrogant rich man. Does not that tax collector, burdened with the consciousness of his own offenses, when he did not dare to lift his eyes to God, seem to you, like a kind of camel, to enter more easily into the eye of the needle by the remedies of his confession than that Pharisee into the kingdom of God, arrogant in prayer, boastful of innocence, presumptuous of glory, reproacher of mercy, preacher of himself, accuser of another, who rather called the Lord to account than entreated him? If anyone, then, shudders at the camel, let him shudder at the man who is fouler in his deeds than a camel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
