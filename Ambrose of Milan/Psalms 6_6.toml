[[commentary]]
quote='''
Hold this in your mind: I will wash my couch every night (Ps. 6:7). For who that is given over to debauchery, wrapped up in shameful deeds, washes his couch every night? He who commits what ought to be wept over does not know how to weep; and though he himself is to be lamented, he has no tears for his own punishment. But he who chastises his body, and is a careful governor of himself, and, groaning and grieving over the offence of his former fall, seeks how he may wash it away with the tears of penitence, he washes his couch every night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
