[[commentary]]
quote='''
But as the Samaritan had not time to stay longer on the earth, he must needs return to the place whence he descended, as it follows, And on the morrow he took out two pence, &c. (Ps. 118:24.) What is that morrow, but perchance the day of our Lord's resurrection? of which it was said, This is the day the Lord hath made. But the two pence are the two covenants, which bear stamped on them the image of the eternal King, by the price of which our wounds are healed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Blessed then is that inn-keeper who is able to cure the wounds of another; blessed is he to whom Jesus says, Whatsoever thou hast spent more, when I come again I will repay thee. But when wilt thou return, O Lord, save on the Judgment day? For though Thou art ever every where, and though standing in the midst of us, art not perceived by us, yet the time will be in which all flesh shall behold Thee coming again. Thou wilt then restore what Thou owest to the blessed, whose debtor Thou art. Would that we were confident debtors, that we could pay what we had received!
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so on the next day — what is this next day, unless perhaps that of the Lord's resurrection, of which it was said: this is the day which the Lord has made? — he thus brought out two denarii and gave them to the innkeeper and said: take care of him.

What are these two denarii, unless perhaps the two Testaments, which bear stamped upon them the image of the eternal King, by whose price our wounds are healed? For we have been redeemed by precious blood, so that we might escape the sores of the final death.

These two denarii, then — although it is not absurd to understand in them also the forms of these four books —, the innkeeper received. Who? Perhaps he who says: and I count them as dung, that I may gain Christ, so that he might take care of the wounded man. The innkeeper, therefore, is he who said: Christ sent me to preach the Gospel. The innkeepers are those to whom it is said: go into the whole world and preach the Gospel to every creature, and he who believes and is baptized shall be saved; saved, that is, from death, saved from the wound inflicted by the robbers.

Blessed is that innkeeper who can heal another's wounds; blessed is he to whom Jesus says: whatever you spend over, I will repay you when I return. A good steward, who even spends over. A good steward is Paul, whose sermons and epistles overflow, as it were, beyond the account he had received. He carried out the Lord's measured command with an almost measureless labor of mind and body, so that by the dispensing of weighty spiritual address he might relieve many from sickness. A good innkeeper, then, of that inn in which the she-ass knew the manger of her master and in which the flocks of lambs are shut in, lest, while the rapacious wolves growl around the folds, there be an easy attack upon the sheepfolds.

He pledges, then, that he will repay the reward. When will you return, Lord, unless on the day of judgment? For although you are always everywhere and, standing in our midst, are not perceived by us, yet there will be a time when all flesh will behold you returning. You will repay, then, what you owe. Blessed are those to whom you are debtor. O that we may be fit debtors, O that we may be able to discharge what we have received, and that neither the office of the priesthood nor that of the ministry may puff us up! How will you repay, Lord Jesus? You have indeed promised that there is a plentiful reward in heaven for the good; yet you will repay also when you say: well done, good servant, since you have been faithful over a few things, I will set you over many things; enter into the joy of your lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
