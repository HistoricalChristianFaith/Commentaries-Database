[[commentary]]
quote='''
Take up the yoke of Christ, do not fear because it is a yoke; hasten because it is light. It does not bruise the neck but adorns it. Why do you hesitate, why do you delay? It does not bind the neck with chains, but it unites the mind by grace; it does not constrain by compulsion, . . .

why do you say that it is not yet time?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 22"
