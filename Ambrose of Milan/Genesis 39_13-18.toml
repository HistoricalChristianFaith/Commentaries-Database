[[commentary]]
quote='''
And so he went outside, and she herself made public the attempts at her adultery, raising her voice because the Hebrew had fled leaving his garments behind. So she herself was betraying what she ought to have concealed, so as to harm the innocent man by a fabricated charge. But the just man does not know how to accuse, and so the unchaste woman did this with impunity. Her, then, I would call truly stripped, even while keeping another's garments, since she had lost all the coverings of chastity; him I would call adorned enough, defended enough, whose voice was not heard while his innocence spoke. So Susanna afterwards, while she kept silent at the trial, spoke better through an oracle, and therefore she merited the defence of a prophet, she who did not seek the help of her own voice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
