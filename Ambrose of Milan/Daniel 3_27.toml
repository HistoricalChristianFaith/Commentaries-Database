[[commentary]]
quote='''
There is a kind of natural substance that men call earth-flax, which is not easily consumed by fire. This substance when placed on the hearth, ignites; but immediately, when removed from the flame, it shines as if clear water had been poured upon it. Like this were the bodies of the Hebrew youths, which having been transformed by fasting into the nature of earth-flax, received the heat of fire, not to their loss but to their gain. Therefore, although the fires of the furnace so raged that the flames spread upward in a circuit for more than forty cubits, consuming many of the Chaldeans whom they reached—who were supplying fuel to the flames with brimstone, pitch, tow, and dry sticks—; when they entered there fasting, the fury of the flames in the middle of the furnace was dissipated; and they immediately began to grow moist from the breath of a cooling dew, so that not a hair of their head was burned because those locks of theirs had also been nourished by fastings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 7"
