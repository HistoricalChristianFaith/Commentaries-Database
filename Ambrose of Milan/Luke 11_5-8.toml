[[commentary]]
quote='''
Who is a greater friend to us, than He who delivered up His body for us? Now we have here another kind of command given us, that at all times, not only in the day, but at night, prayers should be offered up. For it follows, And shall go into him at midnight. (Ps. 119:62.) As David did when he said, At midnight I will rise and give thanks unto thee. For he had no fear of awakening them from sleep, whom he knew to be ever watching. For if David who was occupied also in the necessary affairs of a kingdom was so holy, that seven times in the day he gave praise to God, (Ps. 119:164.) what ought we to do, who ought so much the more to pray, as we more frequently sin, through the weakness of our mind and body? But if thou lovest the Lord thy God, thou wilt be able to gain favour, not only for thyself, but others. For it follows, And say unto him, Friend, lend me three loaves, &c.

This is the door which Paul also requests may be opened to him, beseeching to be assisted not only by his own prayers, but those also of the people, that a door of utterance may be opened to him to speak the mystery of Christ. (Col. 4:3.) And perhaps that is the door which John saw open, and it was said to him, Come up hither, and, I will show thee things which must be hereafter. (Rev. 4:1.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Which of you having a friend, and he will go to him at midnight and says to him: friend, lend me three loaves. This is another passage of precept, that prayer should be offered at every moment, not only by day but also by night; for you see that this man who went at midnight, asking three loaves of his friend and persisting in the very earnestness of asking, is not cheated of what he prayed for. What are these three loaves, if not the nourishment of the heavenly mystery? And if you love the Lord your God, you will be able to earn it not only for yourself but also for others. But who is more a friend to us than he who gave up his body for us? From him David asked loaves at midnight and received them; for he asked when he said: at midnight I rose to confess to you; therefore he earned these loaves which he has set before us to eat. He asked when he says: every night I will wash my bed; for he did not fear to wake as a sleeper one whom he knows to be ever astir and watchful.

And therefore, mindful of what is written, persisting in prayers by night and by day, let us ask pardon for our sins. For if that man, so holy and occupied with the necessities of a kingdom, spoke praise to the Lord seven times a day, always intent on the morning and evening sacrifices, what ought we to do, who ought to ask the more, the more often we fall through frailty of flesh and mind, so that to those weary from the way and heavily fatigued by the course of this age and the windings of this life the bread of refreshment, which strengthens the heart of man, may never be lacking?

And the Lord teaches that we must keep watch not only at midnight, but at almost every moment; for he comes both in the evening watch and in the second and in the third, and is wont to knock. Blessed, therefore, are those servants whom the lord, when he comes, shall find watching. If, then, you desire that the power of God should gird itself and serve you, you must always keep watch; for many are the snares laid for us, and heavy is the sleep of the body; if the mind begins to sleep that sleep, it will lose the vigor of its virtue. Shake off your sleep, then, that you may knock at the door of Christ, which Paul too begs to have opened to him, beseeching that he may be helped not only by his own prayers but also by those of the people, so that a door may be opened to him to speak the mystery of Christ. And perhaps that is the door which John saw opened; for he saw and said: after these things I saw, and behold, a door opened in heaven, and the first voice which I heard, as of a trumpet speaking with me and saying: come up hither, and I will show you the things that must come to pass. The door, then, was opened to John, the door was opened to Paul, so that he might receive for us loaves to eat. For he persevered, knocking at the door in season, out of season, so that he might refresh with the abundance of heavenly nourishment the nations, wearied by the toil of the world's road.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
