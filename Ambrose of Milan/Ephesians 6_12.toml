[[commentary]]
quote='''
All these contests the apostle Paul underwent, as he himself shows. And so elsewhere he says: For we have no πάλη against flesh and blood, but against princes and powers and — to be brief — against the spiritual wickednesses. In most Latin copies "wrestling-together" is found; in all the Greek, πάλη is written; for the πάλη of the Greeks is the wrestling of the Latins. And truly it is πάλη, because flesh and blood and the spiritual wickednesses are overcome by patience and continence of the body and by moderation of the mind. Anger, fury, slaughter are the arms of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
