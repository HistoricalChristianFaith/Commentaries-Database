[[commentary]]
quote='''
But if they think [Christ] is called God because he had an in-dwelling of the Godhead within him, as many holy men were (for the Scripture calls them gods to whom the word of God came)—they do not place him before other men but think he is to be compared with them. They consider him to be the same as he granted other men to be, even as he says to Moses: "I have made you a god unto Pharaoh." Similarly it is also said in the psalms: "I have said, you are gods."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25205.html'
source_title="Exposition of the Christian Faith 5.1.23"

[[commentary]]
quote='''
Blessed is the mind of that man who, overstepping the bounds of species and race, deserves to hear what was said to Moses when he stood apart from his people: Stand thou here with me. Just as Isaac, the type of the Incarnation of the Lord, overstepping the custom of human generation, surpassed his predecessors, so that he acquired special distinction and veered from participation in the common and vulgar, in a similar way we learn from Scripture that promises were made to Abraham and to his offspring. He does not say, "and to his offsprings"—as of many, but as of one, "and to thy offspring," who is Christ. In Moses, also, there is a figure of one who was to teach the Law, preach the Gospel, fulfill the Old Testament, found the New, give heavenly nourishment to the people. He so far exceeded the dignity of his human state that he was given the title of "God" as we read in the Scriptures, where the Lord speaks: I have appointed thee the God of Pharao. He was, in fact, victorious over all his passions and was not allured by the enticements of the world. He enveloped this our habitation here in the body with a purity that savored of a citizenship that is in heaven. By directing his mind and by subduing and castigating his flesh with an authority that was almost regal, he was given the name of "God," in whom he had modeled his life by numerous acts of perfect virtue.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 2"
