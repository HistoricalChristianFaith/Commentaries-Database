[[commentary]]
quote='''
Surround Zion, he says, and embrace her; tell in her towers. Those who understand Zion surround her and embrace her with their minds, so as to hold her and not let her go, lest the watchful discipline of virtue be taken from them. And so she says in the Song of Songs: I held him and I will not let him go, she who was seeking the wisdom of God and embracing the righteousness of God with the arms of charity and, as it were, with the arms of faith and devotion; for this is the embrace of a devout mind. Let us too, then, grasp, as far as we can, the inner mysteries of truth, and write them down and fasten them to our minds, and the power of the heavenly oracle, to attain which that Moses, learned in all the wisdom of the Egyptians, went up the mountain and entered into the cloud, to come to know things covered and hidden, with Jesus as his companion cleaving to him, because no one can grasp the uncertain and hidden things of wisdom without the true Jesus. And therefore, in the figure of Jesus son of Nave [Joshua], the presence of the true Saviour that would breathe upon him was signified to him, through whom all would become taught of God, who would open the Law and reveal the Gospel.

Therefore those who have surrounded Zion with their prudence and embraced her with their understanding go up upon her towers and tell from above to him who has not been able to go up into her towers what must be done or what must be guarded against. For the city of God is walled, and therefore elsewhere the Lord says: Behold, Jerusalem, I have painted your walls; it is set with towers, from which a lurking enemy can be detected if he begins to approach. He has his armies with which he is wont to besiege the souls of God, and to bring up siege engines so that he may storm the fortified towers. But you, he says, proclaim from the towers; for in the towers of Jerusalem there is abundance. Proclaim righteousness, urge watchfulness; for wisdom is sung in the going out and is proclaimed on the highest of the walls, and elsewhere again he says: Upon your walls I have set watchmen day and night; to the end they shall not be silent. Tell, therefore, without intermission, without end. The adversary is awake, he goes about and with a wild beast's rage seeks whom he may find to devour. Therefore the Lord must always be sung, who crushes the teeth of the lions and breaks their mouths, so that they cannot harm us.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
