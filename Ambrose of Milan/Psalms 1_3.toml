[[commentary]]
quote='''
And he shall be like the tree that has been planted beside the courses of waters, which shall give its fruit in its season, and its leaf shall not fall; and all things whatsoever he does shall prosper. What is this blessedness which is compared to the wood of a tree, unless we understand the tree of life in paradise, that place of the blessed, brought forth from the earth in the midst of the other trees? For among many trees which were beautiful to look upon and good for food, the earth brought forth this tree too, and it was in the midst of paradise, so that the other trees might flourish by its greenness. What do we say this tree is but that through which salvation has come to us? And rightly did the earth bring it forth, because a virgin bore him, she who was earth according to the Author's sentence spoken against him: earth you are, and into earth you shall go. Beautifully, too, it is read as standing in the midst of the other trees, he who was in the midst of the apostles as they learned, or because he was in the midst of the mind and heart, as he himself says: there stands in the midst of you one whom you do not know; and elsewhere he says: but I am in the midst of you. In fact, Solomon too said of him: he is a tree of life to all who lay hold of him. He who is blessed, then, will be an imitator of the Lord Jesus, who is the tree of life, the tree of wisdom, planted in the womb of a virgin by the will of the Father, by whom he is planted to remain forever, so that he might give fruit in his season. For this planting could not wither, which had the abundance of spiritual grace abiding in itself. In fact, Jesus, full of the Holy Spirit, returned from the Jordan. These are the courses of waters of which he speaks in the Gospel: rivers of living water shall flow from his belly. Now this he said of the Spirit, which those who were to believe in him were beginning to receive.

There is also another tradition: that there are waters from which Jeremiah forbids us to drink, saying: what have you to do with the way of Egypt, to drink the water of Gihon? There is also the river Tigris, flowing past the Assyrians; there is also the Euphrates, stretching into Babylonia; there is also the Pishon, which in Latin interpretation is called "change of mouth", encircling the land of Havilah, where there is gold, and the gold of that land is good, and the carbuncle stone and the leek-green stone. Rightly is the mouth changed there, so that faith in promises is not kept, but there is deceit in the mouth, where there is good gold; for avarice breaks faith and does not keep simplicity of words, and precious ornaments too change the mind and spirit, so that there is one thing in the breast, another in speech. In those regions of rivers, then, were the Jews, led away captive into Egypt and to the Assyrians and to the Babylonians, where they sat by the rivers of Babylon and wept over the hardship of their calamity, and, as this same prophet testifies, there they hung up their instruments and laid aside all gladness, where they endured graver things. In fact, the remaining ten tribes were led away to the Assyrians, but the two, Judah and Benjamin, as guilty of a graver shameful deed, passed into Babylonia. For a priest's daughter who is an adulteress is punished more severely than other women, because she has discoloured the grace of the priestly race with foul disgrace.

As they, then, were in very grievous temptations, so our Savior exposed himself to many temptations, so as to pass over none of the contests of our temptation. He is rightly said, then, to be planted beside the courses of these rivers, not in the courses themselves, so that you may understand him to be bordering on them, not submerged. His first encounter was with flesh and blood. In fact, he says: Father, take this cup away from me; but not what I will, but what you will. There was the temptation of riches set before him, when the enemy offered him all the kingdoms of the earth if the Lord would fall down and worship him. You have the courses of two rivers, Gihon and Pishon. He had a wrestling against the princes of the world; there was in the Passion itself a contest against the tempters, whom the Hebrew interpretation calls Persians, who brought false testimonies, against those who said: let him come down now from the cross, and we believe him, things which the devil suggested. You have the rivers Tigris and Euphrates.

That our contest is fourfold the Apostle too comprised, saying: for our wrestling is not against flesh and blood, but against principalities and powers, against the rulers of this world and of darkness, against the spiritual forces of wickedness which are in the heavenly places. These are the rivers that go out from paradise. Hence I think that he who longs to return to paradise must cross these courses of waters. This the same holy prophet expressed not idly, showing that he who has undergone all temptations may hope that the rest of paradise is now owed to him. And so he says thus: my eyes have gone down courses of waters. For as there is a fiery sword at the entrance of paradise, so that he who returns may come back through fire, may burn his sins, may prove his gold, so he who returns returns through these courses, and rightly the saints say: we have passed through fire and water. Of these courses Isaiah too says: if you pass through water, the rivers shall not shut you in. What rivers? Hear David saying of those who were hastening to paradise: perhaps our soul would have passed through the unbearable water.

Some take of these four temptations this verse too: you shall walk upon the asp and the basilisk, and you shall trample the lion and the dragon, so that he walked in the Incarnation, trampled in the Passion, or tramples in the handing over of the kingdom, which he will hand over to the Father when he has made void every principality. Beautifully, too, Aquila said τὸ μεταπεφυτευμένον, that is, transplanted, because he was first planted in the virgin, afterwards transplanted into paradise, as he said to the thief: amen I say to you, today you shall be with me in paradise.

This tree, then, will give its fruit in its season. Earthly trees are said not to give fruit but to bear it; but the tree of life and of wisdom gives fruit, that is, bestows and grants it. Again this objection occurs: "if it is the tree of wisdom, why will it give in its season and not always?", lest perhaps it be grievous for us to think this of Christ. But you who have read that the Lord will set a faithful and prudent steward over his household, to give them their measure of wheat in season — in season, mark, not always —, certainly ought not to be troubled. Wisdom can always give fruit, but, because it is wisdom, it must give wisely, dispense prudently, whenever we either deserve or are able to receive the full measure. As here the last season yields fruit, so there too it will give good fruit to the needy, so that we may be able to take and keep a share in its resurrection. Now we cannot; in a vicious world we do not sustain it; for here there is corruption. And care had to be taken lest we corrupt the good fruits which the tree of life would give, because now we are corrupt, but there incorrupt, when the dead too, he says, shall rise incorrupt, and we shall be changed. For this corruptible must put on incorruption, and this mortal must put on immortality. What good, then, was it for one about to die to receive what death had power to take away from him? Wisdom, then, knows to whom and when it ought to give, wisdom which does not lose even the leaf of its tree. And therefore let us consider what the fruit of wisdom is, what the leaf.

The fruit is within; the leaf is that by which the fruit is defended either from the scorching sun or from the cold. The fruit seems to be faith, peace, excellence of teaching, the pursuit of true knowledge, the understanding of the mysteries. These fruits a good life guards; a bad one, even if it has received them, loses them. But to the sinner God has said: why do you recount my righteous acts? In the mystical is the fruit, in the moral the leaf, in view of the contemplation of the heavenly mysteries. For virtues without faith are leaves: they seem to be green, but they cannot profit; they are tossed by the wind, because they have no foundation. How many Gentiles have mercy, have sobriety, but have no fruit, because they do not have faith! The leaves quickly fall when the wind has blown. And some Jews have chastity, much assiduity and diligence in reading, but they are without fruit; they are tossed about like leaves. These perhaps are the leaves which the Savior found on that fig tree, but he did not find fruit.

The mystical things save and free from death, whereas the moral things are ornaments of comeliness, not aids to redemption. That the mystical surpass the moral the Lord himself also teaches in his Gospel, speaking of Mary, who, sitting at the feet of the Lord, was hearing his word, while Martha was busy about serving and complained that her own sister did not help her in the service of the table: Martha, Martha, Mary has chosen for herself the best part, which shall not be taken from her. If she who was serving Christ at table was not compared with her who longed to hear the word, what worker shall we be able to compare with one zealous for eternal knowledge — yet so that neither faith be lacking to the work of the one, nor, as with Mary, work to the knowledge of the other, lest either the leaves be without fruit or the fruit be left uncovered, without its natural protections, and lie open to injury?

We can also understand this: that Adam and Eve covered themselves with leaves when they sought bodily garments, because the resurrection of the Lord's body was being prophesied, since the flesh, which had formerly been wont to perish like leaves, was not going to perish in Christ and in all the righteous who, according to the Gospel, would shape their life and actions in imitation of the tree of wisdom born of a virgin. For the Greek said thus: ὃ τὸν καρπὸν αὐτοῦ δώσει, which can be referred to the blessed man — μακάριος καρπὸν δώσει in Greek —; but in Latin it is said "qui" [who], so that it runs: "who, being blessed, will give fruit" in his resurrection, when he can give it perpetually. It can also be taken thus: ὃ τὸν καρπὸν αὐτοῦ: ὑπὲρ ξύλου, so that it refers to the tree, all of whose deeds will prosper. In this there is clear testimony that it was said of the Savior; for whose deeds but his own can all be praised and have prosperous outcomes? But Aquila says they shall be directed, which seems to be referable also to any man whom the Lord directs with heavenly favour; for by the Lord, indeed, are the steps of a man directed, and David the prophet asked that his prayer be directed in the sight of God. But the Lord himself too directed his works, so that they were bent by no winding of error.
'''
