[[commentary]]
quote='''
But let us consider, lest anyone think that he gloried in his revelations, and let us repeat the words, so that he may defend himself as the teacher of humility: I know, he says, a man in Christ fourteen years ago — whether in the body I do not know, or out of the body I do not know, God knows —, such a one caught up even to the third heaven. He says it was revealed to him fourteen years before, and yet he held back and kept down the revelation for so long, nor would he have told it unless he had judged it useful to us that he should tell it, so that we should not be lifted up by revelations. For if Paul did not glory in so great a grace, neither ought we to glory. He did not glory as a young man: would he glory as an old man? Then, he could not deny that he had been caught up even to the third heaven, and yet he testified that he did not know whether he had been caught up in the body or out of the body. He glories, then, not in knowledge but in ignorance, and proclaims God's grace towards himself. What belongs to knowledge he denies; what belongs to charity he confesses; for knowledge puffs up, but charity builds up. And again he said such a man had been caught up; how he had been caught up, whether in the body or out of the body, he declared to be uncertain to himself. See the balance of wisdom. He set up one man in Christ, and himself as another, who says: "I do not know". What is another's he raises up; what is his own he humbles. And he heard, he says, unspeakable words. He did not say "I heard", but he did not deny that another had heard. And so modestly he preferred to present himself as a witness rather than a seer, and shrank from seeming to be a judge of heavenly secrets. For to bear witness belongs to truth; not to shrink from the merit of a revelation belongs to one who glories. And therefore he says: Of such a one I will glory, but of myself I will not glory.

But what is it that he says the man heard, that man in Christ, which it is not lawful for a man to speak? How does this agree, that it was not lawful for a man to speak what it was lawful for a man to hear? If it is not lawful for the very man who heard to speak, how was it entrusted to him to hear what he was not permitted to speak? What is this distinction? If it was another man, one who was outward, how could a man come to know what it was not lawful for a man to hear? Hence it seems that it was not the grace of speaking that was lacking to that man who was in Christ — it was not lacking to him — but that place, time and merit were lacking to those who would hear. For he heard in heaven, and therefore it was judged not fitting that he should speak on earth what he had heard in heaven, since on the earth itself there is this distinction, that what is sung in one region is not sung in another, according to what is written: How shall we sing the Lord's song in a strange land? Thus the Hebrews did not sing in the land of captivity what they had been accustomed to sing in their own homeland. This is the land of captivity, the other is the land of liberty; this one of sin, that one of eternal rest; this [land] is of the valley, that one of heaven. In heaven, then, Paul now proclaims those things which he could not proclaim before on earth; for the secrets of wisdom are to be spoken among the perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
