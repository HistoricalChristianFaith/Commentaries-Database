[[commentary]]
quote='''
If, then, any one desires to see this Image of God, he must love God, that he may be loved by God; and be no longer a servant but a friend, because he has kept the commandments of God, that he may enter into the cloud where God is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Decease of His Brother Satyrus 2.110"

[[commentary]]
quote='''
Consequently Moses issued a law on fasting, about wine he did not legislate. Moreover the mighty voice, the flashes of lightning and the dark cloud, and smoking Sina, all these did not terrify him while fasting. Nor indeed would he have entered into the cloud and have heard the voice of God speaking from the midst of the fire without danger to his safety, unless he had been fortified by the arms of fasting. For he fasted on the mountain forty days when he received the law from the Lord our God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 6"
