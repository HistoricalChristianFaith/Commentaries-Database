[[commentary]]
quote='''
In fact, you have in Isaias the speech made by the soul of a just man or of the Church: ‘I am a fortified city, I am a city besieged,’ defended by Christ and besieged by the Devil. But he whom Christ aids ought not to be fearful of a siege. He is defended by spiritual grace and is besieged by the perils of this world. Hence, also, it is said in the Canticles: ‘I am a wall and my breasts are as a tower.’ The wall is the Church and the towers are her priests, who have full power to teach both the natural and the moral sciences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
The soul has its walls, from which it looks out and of which it says: I am a fortified city, I am a besieged city. With these walls it is fortified; by these, when besieged, it is defended. And truly the soul is a wall, which stands out in front of the camp. Hence it too says in the Song of Songs: I am a wall, and my breasts are like a tower. A good wall, which the Lord has painted, as he himself says: on my hands I have painted your walls, and you are always in my sight. A good soul, which has God as its watchman and is in his hands, like the prophetic soul, which is commended into the hands of the Lord as a spirit, and which is in the sight of God; for the eyes of the Lord are upon the just, as it says itself: I was in his eyes as one who finds peace. She has good towers who has both the word concerning intelligible things and the discipline concerning moral things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"

[[commentary]]
quote='''
But just as Christ, loving his Bride, was pressing on toward the solemnity of the spiritual union, so too the Church, now captivated by the beauty of the Word, was hastening to the wedding. And therefore, impatient of the delays and the postponement which the daughters of Jerusalem were eager to weave, she says:

I am a wall, and my breasts are towers. That is, do not doubt whether I am a wall; for they had said: If she is a wall; I, she says, am a wall, and I do not have small breasts, but my breasts are like towers. How do you say that I do not have breasts? I have senses like towers of wisdom, in which there is abundance, as it is written: And abundance in your towers (Ps. 121 (122):7). By these breasts, that is, by her senses, she judged herself fit for so great a marriage. But the daughters of Jerusalem could not yet judge so, because they did not see the abundance of her senses. And she added:

I was in his eyes as one finding peace; that is, you deliberate about my senses, when I have found the peace of God, which surpasses every mind, and guards hearts and senses in Christ Jesus. Such, she says, was I in the eyes of the bridegroom, as one who has peace; for it is written: Those who seek peace rightly shall rejoice.

I, she says, am a fortified city, I am a besieged city (Isa. 27:3). With these walls she is fortified; with these, though besieged, she is defended. And truly the soul is a wall, which is set before as a screen in the camp. Whence she herself also says in the Song of Songs: I am a wall, and my breasts are like towers. Good is the wall which the Lord has painted, as he himself says: On my hands I have painted your walls, and you are always in my sight (Isa. 49:16). Good is the soul which has God as her watchman, and is in his hands; like the prophetic soul, which is commended into the hands of God as spirit (Ps. 30 (31):6), and which is in the sight of God: For the eyes of the Lord are upon the righteous; as he too says: I was in his eyes as one finding peace. She has good towers who has both the word concerning things intelligible and discipline concerning things moral.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
