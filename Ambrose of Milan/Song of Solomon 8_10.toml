[[commentary]]
quote='''
In fact, you have in Isaias the speech made by the soul of a just man or of the Church: ‘I am a fortified city, I am a city besieged,’ defended by Christ and besieged by the Devil. But he whom Christ aids ought not to be fearful of a siege. He is defended by spiritual grace and is besieged by the perils of this world. Hence, also, it is said in the Canticles: ‘I am a wall and my breasts are as a tower.’ The wall is the Church and the towers are her priests, who have full power to teach both the natural and the moral sciences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
The soul has its walls, from which it looks out and of which it says: I am a fortified city, I am a besieged city. With these walls it is fortified; by these, when besieged, it is defended. And truly the soul is a wall, which stands out in front of the camp. Hence it too says in the Song of Songs: I am a wall, and my breasts are like a tower. A good wall, which the Lord has painted, as he himself says: on my hands I have painted your walls, and you are always in my sight. A good soul, which has God as its watchman and is in his hands, like the prophetic soul, which is commended into the hands of the Lord as a spirit, and which is in the sight of God; for the eyes of the Lord are upon the just, as it says itself: I was in his eyes as one who finds peace. She has good towers who has both the word concerning intelligible things and the discipline concerning moral things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
