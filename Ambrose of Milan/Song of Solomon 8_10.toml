[[commentary]]
quote='''
In fact, you have in Isaias the speech made by the soul of a just man or of the Church: ‘I am a fortified city, I am a city besieged,’ defended by Christ and besieged by the Devil. But he whom Christ aids ought not to be fearful of a siege. He is defended by spiritual grace and is besieged by the perils of this world. Hence, also, it is said in the Canticles: ‘I am a wall and my breasts are as a tower.’ The wall is the Church and the towers are her priests, who have full power to teach both the natural and the moral sciences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
