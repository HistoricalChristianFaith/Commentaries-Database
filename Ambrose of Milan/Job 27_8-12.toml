[[commentary]]
quote='''
Amid such great outrages, then, what hope is there for the ungodly man? If he trusts in the Lord, will he be saved? I will tell you, he says, what is in the hand of the Lord, and cease to add vain things to vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
