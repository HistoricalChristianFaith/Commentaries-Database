[[commentary]]
quote='''
Nor did he doubt that he had seen it, but said to his servants: sit here with the she-ass, and I and the boy will go on as far as there, and when we have worshipped, we will return to you. Rightly is there a type in the she-ass, because the truth too is in the foal of a she-ass. For by this animal is figured the people of the Gentiles, formerly subjected to a burden, now made subject to Christ. Isaac, then, is the type of Christ who was to suffer. He came on a she-ass, so that the people of the nations who were to believe might be signified. And therefore the Lord, when he came to undergo the passion for us, loosed the foal of a she-ass, on which he himself sat, now gentle and meek, entrusting its back to Christ. But his saying: I and the boy will go on our way shows that the father would not fail in so great a preparation, nor the son give way; or else that they would pass through the harshness of so great a deed by the remedy of fatherly love. He added: we will return to you. He prophesied what he did not know. He himself was planning to return alone, once his son had been sacrificed, but the Lord spoke through his mouth what he was preparing. He spoke guardedly with the young servants, lest, if the business became known, someone might hinder it or make an outcry with groaning or with weeping.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
