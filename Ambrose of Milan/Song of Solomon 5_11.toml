
[[commentary]]
quote='''
His head is gold of Cephas. This signifies a stable and eminent wisdom. The body of Christ is the Church; its head is like gold, because precious is the wisdom of the saints: that is, just and prudent men.

His locks are like fir trees, black as a raven. Of this he said elsewhere: Your hair is like a flock of shorn ewes. Hair, for this reason: because the power of all the senses is in the head: The eyes indeed of the wise man are in his head (Eccles. 2:14). Deep, then, is the prudence of teachers, which can reveal what is obscure and open up the depths of the meanings. And disputants of this kind are the locks of the Church, like the young of ravens to which the Lord gives food: as he gave it to holy Jacob, and fed him from his youth. These, lofty and deep in the richness of their doctrine, the Lord feeds with heavenly sacraments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
