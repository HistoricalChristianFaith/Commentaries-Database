[[commentary]]
quote='''
Yet the nearer our knowledge draws to God, the more surpassing his majesty seems to us. Thus Thomas, who before was saying: Unless I see in his hands the print of the nails and put my hand into his side, I will not believe, when he put in his finger and recognized the evident signs of the resurrection, marvelling within himself at the grace of God: My Lord, he says, and my God. Then, therefore, he most fully confessed his divinity and lordship, when he did not doubt that he had risen from the dead.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
