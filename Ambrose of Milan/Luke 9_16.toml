[[commentary]]
quote='''
Although the multitude is not as yet fed with stronger food. For first, as milk, there are five loaves; secondly, seven; thirdly, the Body of Christ is the stronger food. But if any one fears to seek food, let him leave every thing that belongs to him, and listen to the word of God. But whoever begins to hear the word of God begins to hunger, the Apostles begin to see him hungering. And if they who eat, as yet know not what they eat, Christ knows; He knows that they cat not this world's food, but the food of Christ. For they did not as yet know that the food of a believing people was not to be bought and sold. Christ knew that we are rather to be bought with a ransom, but His banquet to be without price.

But here the bread which Jesus brake is mystically indeed the word of God, and discourse concorning Christ, which when it is divided is increased. For from these few words, He ministered abundant nourishment to the people. He gave us words like loaves, which while they are tasted by our mouth are doubled.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So the Lord Jesus divides the food. And he indeed wishes to give to all, he refuses no one; for he is the steward of all. But when he breaks the loaves and gives them to the disciples, if you do not stretch out your hands to receive food for yourself, you will faint on the way, and you will not be able to lay your fault upon him who has compassion and divides it; but he divides it to those who remain with him even in the desert, who do not withdraw on the first day nor the second nor the third. For so you have it elsewhere: I have compassion on this crowd, because it is now three days that they continue with me. How great a condescension, how great a kindness is breathed upon men in him! He does not wish to send them away fasting, he does not wish them to faint on the way.

Do not, then, fail in the discipline of God, nor grow weary when you are rebuked by him. Do not grow weary now, lest you grow weary hereafter. For what will you answer him, or how will you excuse yourself, if you have lost the strength of the food which he supplies? You cannot say that he did not give food, for he gives to all. You cannot say that he did not wish you to do good, he who set before you good and evil, so that your good might not be of necessity but voluntary. For there is a great difference between him who does something unwillingly by necessity and him who chooses of his own will what is good; for if I do this unwillingly, a stewardship has been entrusted to me; if willingly, I have a reward. Let us consider, then, that we shall stand before the judgment seat of Christ, and if our work has burned, we shall have nothing to plead in excuse. For he will say what he has already spoken through the prophet: my people, what have I done to you, or in what have I been troublesome to you? Answer me. He will say to him who has fainted on the way: for what reason did you faint on the way? Did I not make loaves, did I not bless them, did I not order them to be given? But why were you unwilling to receive?

How many, too, of those present will faint on the way even after these sermons — which, though they are ours, are yet to be reckoned loaves, because no one says Lord Jesus except in the Holy Spirit — how many, I say, will faint and go off into the ways of the Gentiles, committing fornication by crooked paths! And would that it were one and not very many! But Jesus is not the author of the fainting, even if someone has fainted; for he distributes to all who follow, whether they be five thousand or four thousand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
