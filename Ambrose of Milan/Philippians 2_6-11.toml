[[commentary]]
quote='''
And rightly secure, when he was in the form of God, as the Apostle says, he did not think it robbery to be equal to God, but emptied himself, taking the form of a servant, made in the likeness of men; and found in appearance as a man, he humbled himself, becoming obedient unto death, even the death of the cross. This, then, is he who is equal as being the Son of God; this one took the form of a servant in the flesh; this one tasted death, whose greatness has no end, because the end of the Law is Christ, unto righteousness for everyone who believes, that we may all believe in him and adore him with inmost affection. Good is the servitude which made all free; good the servitude which acquired the name above every name; good the humility which brought it about that at his name every knee should bend, of things in heaven and on earth and under the earth, and every tongue confess that the Lord Jesus is in the glory of God the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
