[[commentary]]
quote='''
And, rich men, you serve indeed a miserable servitude, who serve error, who serve covetousness, who serve avarice which cannot be filled. Any insatiable whirlpool is more rapid when it is swallowing what has been thrown into it, and, in the manner of a well when it overflows, it is polluted by mud and eats away at the ground with no profit to itself. Even by this example is it fitting that you be warned. For a well, if you draw nothing from it, easily becomes foul through undisturbed rest and base neglect; but if kept in use, it is sparkling in appearance and sweet to drink. So also a heap of riches, besmudged with dirt when piled up, is resplendent in use; but when left undisturbed, it is considered worthless. Draw something, then, from this well. Water will quench a flaming fire and alms will resist sins, but stagnant water quickly produces worms. Let not your treasure rest, let not your fire abide; for it will abide in you unless you avert it by the works of your mercy. Reflect, O rich man, in what fires you are. Your voice is that of the one crying: Father Abraham, say to Lazarus that he may dip the tip of his finger in water to cool my tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 12"

[[commentary]]
quote='''
So too a heap of riches, sandy as a mere pile, is beautiful in use, but in idleness is held useless. Draw off something, then, from this well: For water quenches a burning fire, and almsgiving resists sins (Sir. 3:33). But standing water soon breeds worms: let not your treasure stand still, lest your fire stand. It will stand in you, unless you turn it aside by the works of your mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
