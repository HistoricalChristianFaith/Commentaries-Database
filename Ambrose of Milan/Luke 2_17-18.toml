[[commentary]]
quote='''
Nor should you think the words of the prophets to be despised as though they were mean. From the shepherds even Mary gathers faith, by the shepherds the people is gathered to reverence for God; they marvelled indeed at the things that were told them by the shepherds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
