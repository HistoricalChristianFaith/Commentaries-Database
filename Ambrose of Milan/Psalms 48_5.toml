[[commentary]]
quote='''
These, then, who before were at discord within themselves, when they came together into one in mind and in zeal, having received the peace which made both one and dissolved the enmities in his flesh by destroying the dividing wall, marvelled either at him who is known in her steps, or that men were so converted that those who before served the devil are now bound over to the Lord Jesus in the devotion of a righteous service. And since, as kings of their own body, they had experienced in themselves no small labour — for it is neither easy nor a small thing to conquer the mind, to cut back the desires, to tame the wantonness of the flesh, to ward off lust, which fought even against Paul, to bind him captive to itself by the law of sin — just as they marvelled at grace in those who had advanced in virtue, so too they were disturbed lest anyone should slip back into vices, cast down from the higher summit of the virtues. For the human condition is prone and changeable either way, so that wherever it is intent, there it inclines and tends, either to the pursuit of the virtues or to the allurement of sins.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
