[[commentary]]
quote='''
Lastly, it is spoken of the fast of the soul, as the context shows, for it follows, But he said, No man putteth a piece of a new garment upon an old. He calleth fasting an old garment, which the Apostle thought should be taken off, saying, Put off the old man with his deeds. (Col. 3:9.) In the same manner we have a series of precepts not to mix up the actions of the old and new man.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He spoke indeed a parable to them: that no one puts a patch from a new garment upon an old garment.

He had said that the sons of the bridegroom, that is, the sons of the Word, who through the regeneration of the washing have been taken up into the right of divine generation, cannot fast as long as the bridegroom is with them. Surely that fasting is not set aside by which the flesh is worn down and bodily wantonness chastised; for this fasting commends us to God. For how would he forbid his disciples to fast, when the Lord himself fasted, when finally he said that the most wicked spirits are not usually overcome except by fastings and prayers? Indeed in this place too he called fasting an old garment, which the Apostle judged must be put off, saying: Strip off the old man with his deeds, that we may put on him who is renewed by the sanctification of baptism. To the same form, therefore, the series of precepts agrees, that we should not mix the acts of the old and of the new man, since the former, bodily and outward, works the works of the flesh, and this inner one, who is reborn, ought not to have a many-coloured appearance of old and new deeds, but, of one colour with Christ, to imitate with zeal of mind him to whom he was reborn in the washing. Away then with the discoloured coverings of the mind, which displease the bridegroom; for one who has not a wedding garment displeases him. But what can please the bridegroom except peace of soul, purity of heart, love of mind?

The Lord Jesus is a good bridegroom; he initiated nature by a new birth; she who is betrothed to him is set free from the corruptions of the flesh. She does not seek mortal sons — she takes no delight in the pains of Eve —, nor a husband liable to guilt, nor the inheritance of a condemned father. For she has seen the sores of the flesh which she formerly desired; she has noticed that that is not true beauty which has the deformity of vices. And therefore what have you to do with such a bridegroom, woman? Search carefully, and in the whole body you will find a scar. Recognize rather another bridegroom, who is surrounded with light, whose beauty cannot perish. Take him up into your mind, consecrate him in your temple, take him up in your body, as it is written: Take up God in your body. Enter his new bridal chambers, behold his foreign beauty, put him on, see him at the right hand of the Father, and rejoice that you have such a bridegroom. He will clothe you with blessing, lest any rent of sin should harm you.

Let us keep, then, the garment with which the Lord clothed us as we came up from the sacred font. Quickly the garment is torn if deeds do not match it; quickly it is worn away by the moths of the flesh and stained by the error of the old man. So here we are forbidden to join new things to old, and in the Apostle even to put old things on over new, but rather to put off the old, to take up the new, that we may be found stripped, not naked. For we are stripped in order to take up better things, but we are made naked when the covering is pulled off us by another's fraud, not laid aside by our own will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
