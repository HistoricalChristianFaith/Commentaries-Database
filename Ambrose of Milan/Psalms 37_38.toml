[[commentary]]
quote='''
But the unrighteous shall utterly perish together; the remnants of the ungodly shall perish. The remnants of the righteous are virtues; the remnants of the ungodly are wickedness and unbelief and sin. These will be blotted out, so that they are not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
