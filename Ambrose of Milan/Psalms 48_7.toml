[[commentary]]
quote='''
And so very many are heavily shattered, as the verse that follows signifies: With a vehement spirit you shall shatter the ships of Tarshish. For while the servants of God desire to reach the perfection of faith, they wear down their body, chastising it more severely and bringing it into the service of slavery, lest those who had already been approved be rejected. And they do this in the Holy Spirit, strong and vehement. For he is the spirit of counsel and of power, so that by great abstinence they dissolve their body, whereby they may empty out all its pleasures, so that it may be said to them: Grow strong, you slackened hands and loosened knees. For when someone has been loosed from this earthly frame, then he rises stronger to eternal life. I lie, unless Scripture bears me out, which says: to be dissolved and to be with Christ is much better — he who is dissolved begins to be with Christ — and elsewhere: the time of my dissolution is at hand. He, then, who has practised dissolving himself through abstinence will not be able to fear the day of his passion.

And well does he say 'a vehement spirit' when he is about to speak of ships. Now he spoke of ships for bodies, which are moved by the wandering surge of diverse passions and quickly sink unless they have a helmsman. Hence he also says elsewhere: Those who go down to the sea in ships. But they sail well who in their ships carry before them the cross of Christ as a mast, and from it search out the blasts of the winds, so as to steer their bodies towards the grace of the Holy Spirit, safe and secure on the wood of the Lord; nor do they let their ships stray over the seas with a wandering surge, but by the direction of their course they press on towards the harbour of salvation and the consummation of grace, that they may gain a faithful anchorage, where, though dissolved, they may restore their courses in the resurrection, where they cannot fear shipwreck.

Let us too, then, look carefully about this grace, let us be its watchmen, let us search it out, so that our bodies may become ships of Tarshish. For then the flesh is brought into servitude, when we are intent upon the grace of God, so that we follow what is bitter for a time, as fasting is, not what is sweet and pleasurable. Tarshish, then, is the watchtower of grace, an intelligible city, like the higher Zion. To it Jonah was hastening. Of it Scripture said that Jehoshaphat allied himself with King Uzziah, and it so pleased him that they should make ships and that the ships should go to him to Tarshish. But because he joined himself to an ungodly man, therefore a prophet was sent to him to say to him: The Lord has destroyed your work, and your ships have been shattered, and they could not go to Tarshish. By this it is signified that the bodies of those who transgress the commandment of God cannot reach the consummation of grace. But to Solomon, as being a wise and peaceable man, ships came from Tarshish with gold and silver and ivory tusks without any mishap, and he himself sent ships there. For he had with King Hiram a spiritual exchange of sacred trade and a disposition of mutual grace vying with each other. These ships, then, those who possess a royal authority within themselves to restrain the fierceness of the body, seeing them become incorruptible from corruptible, shining with the highest light of grace from stained, renewed from dissolved and worn down, living from dead, rising from buried, recount in celebrated discourse.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
