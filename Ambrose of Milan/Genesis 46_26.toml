[[commentary]]
quote='''
Consider, then, O man, who you are, by what you may guard your salvation and your life. What, then, is man? Is he soul, or flesh, or the union of both? For what we are is one thing, what is ours another; he who is clothed is one, the garment another. We read in the Old Testament: all the souls that went down into Egypt, said of men. And elsewhere it is said: my spirit shall not remain in these men, because they are flesh. So it is read of each of the two that it is called man, both of the soul and of the flesh. But there is this distinction: where soul is said for man, the Hebrew is meant, cleaving to God, not to the body, as in that saying: every simple soul is blessed; but where flesh is named for man, the sinner is expressed, as in that saying: but I am carnal, sold under sin. For what I work, I do not know; for I do not do what I will, but what I hate, that I do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 2"
