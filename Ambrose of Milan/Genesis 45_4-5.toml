[[commentary]]
quote='''
Come near to me, because I have drawn near to you, and so far as to make myself a sharer of your nature by taking on flesh. Do not, at least, flee one who shares in your fellowship, if you do not recognize the author of salvation.

And they came near, he says, to him, and he said: I am Joseph your brother, whom you handed over into Egypt. Now therefore do not be sad, nor let it seem hard to you that you sold me here; for God sent me before you for life. How brotherly his love, how sweet his brotherhood, that he even excused the fratricidal deed, saying that it had been the work of divine providence, not of human impiety, since he was not offered up by men to death but sent by the Lord to life! What else does that intercession of our Lord Jesus Christ hold, who surpassed all brothers in love, when, placed on the cross, he says for the people: Father, forgive them; for they do not know what they do? What else does that holy greeting hold, when he says in the midst of the disciples: Peace to you: it is I, do not fear? And when, troubled and terrified, they thought they saw a spirit, he said to them again: Why are you troubled, and why do thoughts rise up in your heart? See, behold my hands and my feet, that it is I myself. Handle and see, for a spirit does not have flesh and bones, as you see that I have. These mysteries, then, which were to come in later times, were already revealed at that time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 12"
