[[commentary]]
quote='''
Yet she too who has sinned has ointment. Bring me, you too, repentance after your sins. Wherever you hear that the Righteous One has come, whether into the house of an unworthy man or into the house of a Pharisee, hasten, snatch the grace before the host, snatch the kingdom of heaven; for from the days of John the Baptist the kingdom of heaven is pressed hard, and those who press tear it away. Wherever you hear the name of Christ, run to him: into whosesoever inner house you learn that Jesus has entered, hasten there yourself too. When you have found Wisdom, when you have found Righteousness reclining in someone's inner chambers, run to the feet, that is, seek at least the last part of wisdom. Do not disdain the feet; she touched the fringe and was healed. Confess your offences with tears, so that that heavenly Righteousness may say of you too:

she has watered my feet with her tears and wiped them with her hair. And perhaps Christ did not wash his own feet for this reason, that we might wash them with tears. Good tears, which can not only wash away our offence but also water the footprint of the heavenly Word, so that his steps may abound in us. Good tears, in which there is not only the redemption of sinners but also the refreshment of the righteous; for it is the voice of the righteous man: my tears have been my bread.

Even if you cannot approach the head of Christ, let Christ touch your head with his feet. Both his fringe heals and his feet heal. Spread out your hair, lay down before him all the dignities of your body. No ordinary hair is that which can wipe the feet of Christ. He bears witness to this who, as long as he had his hair, could not be overcome. And then, it is not fitting for a woman to pray shaven. Let her by all means have hair with which to wrap the footprints of Christ, with which, the little locks of her beauty and of the comeliness of wisdom, she may wipe his feet, so that they may grow moist at least with the outermost dew of divine power; let her fix her kisses on the feet of Righteousness. She is of no ordinary merit, of whom Wisdom can say:

since I entered, she has not ceased to kiss my feet, so that she may know how to speak nothing but wisdom, may know how to love nothing but righteousness, may know how to taste nothing but chastity, may know how to kiss nothing but purity. For a kiss is the token of mutual love, a kiss is the pledge of charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
