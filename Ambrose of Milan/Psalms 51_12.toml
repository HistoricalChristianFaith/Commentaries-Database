[[commentary]]
quote='''
Restore to me the joy of your salvation and strengthen me with a governing spirit. It is restored to the one to whom it is owed: the joy of salvation is restored to a rational nature. Now joy and gladness are the fruit of the Spirit; and our firm foundation, too, is the governing spirit. And rightly, he who is strengthened by the governing spirit is not subject to slavery; he knows not how to serve sin, he knows not how to waver, he knows not how to stray, nor does he totter with uncertain zeal, but, made firm upon the rock, he is established with a solid footing.

What do we think is meant by the governing spirit? Many refer the right spirit to the Lord Jesus, who took away the sin of the world and renewed the whole race of men by the shedding of his blood. And so it was said: And renew a right spirit in my inward parts. But the Holy Spirit, of whom he says: And do not take your Holy Spirit from me, they understand as the Spirit of truth, while the governing spirit they consider to be God the Father. And how true to his character it is that he says: Do not cast me away from your face. Faithfully he fears that the grace he has received may be taken from him. And therefore he says elsewhere: My eyes are ever toward the Lord, and in later psalms: Behold, as the eyes of servants are on the hands of their masters, and as the eyes of a handmaid are on the hands of her mistress, so are our eyes toward the Lord our God, until he have mercy on us. Surely this is the spirit that is guide and prince, which rules the mind, strengthens the affection, draws it where it wills, and directs it into the higher way.

There are also those who take it as the spirit of man, which is in him. Of this the apostle says: For who among men knows the things of a man except the spirit, which is in him? He who can know all things, he whom the hidden things of man do not deceive, can hold governance in man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 15"
