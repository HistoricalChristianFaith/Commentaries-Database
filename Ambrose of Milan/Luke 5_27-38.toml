[[commentary]]
quote='''
Beautifully do such precepts suit this work; for it is the sixth work, in which Levi is figured in a certain new form. And on the sixth day man was made; by the sixth work of Christ, then, is reformed a creature no longer old but new, a certain foreign form. And therefore, as a new creature, he holds a banquet for Christ, because both Christ delighted in him and he deserved to have a share of delight with Christ. To shape him, then, the Lord gives precepts; for he was already following, glad, eager and exulting, saying: Now I no longer play the tax collector, now I no longer bear Levi. I have put off Levi, since I put on Christ. I hate my stock, I flee my life; you alone I follow, Lord Jesus, who heal my wounds. Who indeed separates me from the love of God, which is in you? Tribulation, or distress, or famine? I am bound by faith as by certain nails, and I am tied with the good fetters of love. Every commandment of yours I will hold like a cautery pressed in. Though the cautery of the commandment burns, yet it burns out what is putrid in the flesh, lest the contagion creep to the living flesh. Though the medicine stings, yet it takes away the vice of the sore. Take away then, Lord Jesus, with your mighty sword the putrefaction of my sins. While you hold me bound with the bonds of love, cut whatever is diseased. Come quickly, cutting into the hidden and lurking passions of every kind; open the wound, lest the harmful humour creep on. Cleanse all that is foul with a foreign washing. Hear me, men of earth, who carry thoughts made drunk by your sins. I too, Levi, was wounded by such passions. I have found a physician who dwells in heaven and scatters medicines on earth. He alone can heal my wounds, who knows none of his own; he can take away the pain of the heart, the pallor of the soul, who knows hidden things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
