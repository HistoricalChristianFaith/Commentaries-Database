[[commentary]]
quote='''
Now although the number of those healed by Christ is different in Luke and Matthew, yet the mystery is one and the same. For as he who had a devil is the figure of the Gentile people, the two also in like manner take the figure of the Gentiles. For whereas Noah begat three sons, Shem, Ham, and Japhet; the family of Shem only was called to the possession of God, and from the other two the people of different nations were descended. He (as Luke says) had devils long time, inasmuch as the Gentile people was vexed from the deluge down to our Lord's coming. But he was naked, because the Gentiles lost the garment of their nature and virtue.

Or what are the bodies of the unbelieving but kinds of tombs in which the word of God abides not?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And since it is enough to have touched lightly on what we briefly treated in an earlier place, now, because in the book according to Matthew we have learned that two men possessed by demons met Christ in the region of the Gerasenes, while here Saint Luke brings in one, and him naked — for naked is whoever has lost the covering of his nature and of virtue — I think we must not idly pass over but inquire for what reason the evangelists seem to be at variance about the number. And indeed, though the number disagrees, yet the mystery agrees; for this man who had a demon is a figure of the Gentile people, covered with vices, naked to error, open to crime. Those two likewise also take on the figure of the Gentile people, since, although Noah begot three sons, Shem, Ham, Japheth, the family of Shem alone was taken into the possession of God. From those two sprang the peoples of diverse nations, of whom one was cursed because he had not covered his naked father, the other blessed because, though turned away so as not to take in the shame of his naked parent, he had yet covered his father, with devotion as his guide, and had washed away the curse of his brother's seed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
