[[commentary]]
quote='''
And having clothed him in a white garment he sent him back. It is not without meaning that he is clothed by Herod in a white garment, which gave signs of a spotless Passion, because the Lamb of God without spot would take up the sins of the world with glory. In the type of Herod and Pilate too, who from enemies were made friends through Jesus Christ, a figure of the people of Israel and of the Gentile people is preserved: that through the Lord's Passion there would be concord between both, yet in such a way that the people of the nations first receives the word of God and by the devotion of its faith passes it on to the people of the Jews, so that they too may clothe with the glory of his majesty the body of Christ, whom they had before despised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
