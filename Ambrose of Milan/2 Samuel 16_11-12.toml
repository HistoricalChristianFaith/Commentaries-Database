[[commentary]]
quote='''
Indeed, when David was being cursed and his captain Abishai wished to avenge his injury, David said to him: Let him alone, that he may curse, since the Lord has spoken to him, so that he may see my humiliation, and the Lord repay me good for this cursing. You see, then, that you are helped by those who revile you, so that the Lord may hear you and remit your sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
That reproach too is profitable David himself testified, saying to Abishai: Let the Benjaminite curse me, because the Lord has told him to, that he may see my humility and the Lord may repay me good for this curse. And in truth the Lord saw his reproach, that he went weeping and barefoot with his head covered, and removed his reproach. It is clear, then — since he, given over to reproach, fled and was humbled and made satisfaction to the Lord with bare feet, and did not strike back at the man throwing stones, and did not permit vengeance on the one who cursed him, and after this was restored to his kingdom intact —, that reproach too is from the Lord, and that it is more profitable to bear reproach than to repel it. In the end, victory followed. Reproach, then, is profitable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
