[[commentary]]
quote='''
Arise, he says, come, my nearest one; that is, arise from the delights of the world, arise from earthly things, and come to me, you who still labour and are burdened, who are anxious about the things that are of the world: come above the world, come to me, for I have overcome the world: come near me, now beautiful with the beauty of eternal life, now a dove, that is, gentle and mild, now wholly full of spiritual grace. Rightly, then, she ought no longer to fear the nets, since he calls the soul to himself who could not be caught by the temptations and nets of the world. For since we men walk in the midst of snares, through the appetite for food we are liable at once to nets and snares. He, placed in the body, did not fear the nets, but peered out over the nets, that is, over the temptations of the world and the passions of the body; nay, he made others too rise up over them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
