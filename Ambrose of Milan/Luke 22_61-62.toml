[[commentary]]
quote='''
Lastly, those whom Jesus looks upon weep for their sins. Hence it follows, And Peter remembered the word of the Lord, how he had said to him, Before the cock crow, thou shalt deny me thrice. And he went out, and wept bitterly. Why did he weep? Because he sinned as man. I read of his tears, I do not read of his confession. Tears wash away an offence which it is shame to confess in words. The first and second time he denied and wept not, for as yet our Lord had not looked upon him. He denied the third time, Jesus looked upon him, and he wept bitterly. So then if thou wilt obtain pardon, wash away thy guilt in tears.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The cock’s crow is pleasant at nightfall. It is not only pleasant, but useful, too. As a good domesticated fowl he arouses the sleeper, gives him warning when he is perturbed, and consoles the voyager by asserting in musical tones that night is approaching. When the cock crows, the thief forsakes his schemes and the star of dawn rises to illumine the sky. When the cock crows, the sailor’s gloom and trepidation disappear. Tempests and storms stirred up by gusts of wind at eveningtide subside. At his crowing the devout of heart bestir themselves for prayer and resume their reading. Finally, on this occasion ‘the rock of the Church’ washed away his sin which he had committed before the cock crowed. At cock-crow hope returns to all, the sick find comfort, the wounded find relief, the feverish are calmed, the lapsed return to the faith. Jesus has regard for those who stumble and corrects the errant. Hence He paid heed to Peter and forthwith the sin departed. Peter revoked his denial and his confession was completed. That this was God’s plan and not a mere accident is revealed in the words of the Lord. It is written that Jesus said to Simon: ‘Before the cock crows, thou wilt deny me three times.’

In daytime Peter is quite brave, but is disturbed at nightfall. Before cock-crow he falls three times so that you may realize that his sin was not due to mere thoughtlessness, but to an emotional disturbance. The same man became braver after the cock crowed. He became worthy of Christ’s regard, for ‘the eyes of the Lord are upon the just.’ He realized that remedial action had come, following which he was unable to sin. He turned aside from the ways of error to those of virtue and wept bitterly. He washed away his sins with his tears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
