[[commentary]]
quote='''
Lastly, those whom Jesus looks upon weep for their sins. Hence it follows, And Peter remembered the word of the Lord, how he had said to him, Before the cock crow, thou shalt deny me thrice. And he went out, and wept bitterly. Why did he weep? Because he sinned as man. I read of his tears, I do not read of his confession. Tears wash away an offence which it is shame to confess in words. The first and second time he denied and wept not, for as yet our Lord had not looked upon him. He denied the third time, Jesus looked upon him, and he wept bitterly. So then if thou wilt obtain pardon, wash away thy guilt in tears.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The cock’s crow is pleasant at nightfall. It is not only pleasant, but useful, too. As a good domesticated fowl he arouses the sleeper, gives him warning when he is perturbed, and consoles the voyager by asserting in musical tones that night is approaching. When the cock crows, the thief forsakes his schemes and the star of dawn rises to illumine the sky. When the cock crows, the sailor’s gloom and trepidation disappear. Tempests and storms stirred up by gusts of wind at eveningtide subside. At his crowing the devout of heart bestir themselves for prayer and resume their reading. Finally, on this occasion ‘the rock of the Church’ washed away his sin which he had committed before the cock crowed. At cock-crow hope returns to all, the sick find comfort, the wounded find relief, the feverish are calmed, the lapsed return to the faith. Jesus has regard for those who stumble and corrects the errant. Hence He paid heed to Peter and forthwith the sin departed. Peter revoked his denial and his confession was completed. That this was God’s plan and not a mere accident is revealed in the words of the Lord. It is written that Jesus said to Simon: ‘Before the cock crows, thou wilt deny me three times.’

In daytime Peter is quite brave, but is disturbed at nightfall. Before cock-crow he falls three times so that you may realize that his sin was not due to mere thoughtlessness, but to an emotional disturbance. The same man became braver after the cock crowed. He became worthy of Christ’s regard, for ‘the eyes of the Lord are upon the just.’ He realized that remedial action had come, following which he was unable to sin. He turned aside from the ways of error to those of virtue and wept bitterly. He washed away his sins with his tears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
But we excuse him; he himself did not excuse himself; for what suffices in one who confesses Jesus is not an involved answer, but an open confession. What profit is it to wrap up words, if you want to seem to have denied? And therefore Peter is not represented as having answered thus by design, because afterwards he remembered, and yet he wept. For he preferred himself to accuse his own sin, that he might be justified by confessing rather than burdened by denying — the righteous man, indeed, is in the beginning the accuser of himself — and therefore he wept.

Why did he weep? Because fault crept upon him. I am wont to weep if fault is lacking to me, that is, if I do not avenge myself, if I do not obtain what I wickedly desire; Peter grieved and wept because he erred as a man. I do not find what he said; I find that he wept. I read of his tears; I do not read of his satisfaction; but what cannot be defended can be washed away. Let tears wash away the offence which it is a shame to confess by voice. Weeping provides both for pardon and for modesty. Tears speak the fault without horror; tears confess the crime without offence to modesty; tears do not ask for pardon, and they merit it. I have found why Peter was silent: lest so quick a request for pardon should offend the more. First one must weep, then pray.

Good are the tears which wash away fault. Indeed those upon whom Jesus looks weep. Peter denied the first time and did not weep, because the Lord had not looked at him. He denied a second time: he did not weep, because the Lord had not yet looked at him. He denied a third time too: Jesus looked at him, and he wept most bitterly. Look on us, Lord Jesus, that we may know how to weep for our sin. Hence even the fall of the saints is useful. It did me no harm that Peter denied; it profited me that he amended. I have learned to beware the conversation of unbelievers. Peter denied among the Jews; Solomon, deceived by companionship with Gentiles, went astray.

So Peter wept, and most bitterly; he wept so that he might wash away his offence with tears. You too, if you want to merit pardon, wash away your fault with tears; at the same moment, at the same time, Christ looks upon you. If perhaps you slip in anything, since he stands by as witness of your secrets, he looks upon you that you may remember and confess your error. Imitate Peter, who says elsewhere a third time: Lord, you know that I love you. For since he had denied three times, he confesses three times; but he denied in the night, he confesses in the day.

These things were written for this reason, that we may know that no one ought to boast; for if Peter fell because he said: Even if others are scandalized, I will not be scandalized, who else may rightly presume upon himself? Indeed David too, because he had said: I said in my abundance: I shall not be moved for ever, declares that this boasting harmed him, saying: You turned away your face from me, and I was troubled.

From where shall I call you forth, Peter, to teach me what you thought as you wept? From where, I say, shall I call you forth? From heaven, where you have already been placed in the choir of the angels, or even from the tomb, since you do not think it an injury to be there too, whence the Lord rose again? Teach us what your tears profited you. But you taught us at once; for you who fell before you wept, after you wept were chosen to rule others, you who before had not ruled yourself.

Peter, then, had tears, which he shed with dutiful affection; the traitor had no weeping with which to wash away his fault, but torments of conscience, by which he confessed his sacrilege, so that, while the guilty man is condemned by his own judgment and the crime is expiated by a self-inflicted punishment, there might be proved both the dutiful love of the Lord, who would not avenge himself, and his divinity, who questioned the conscience of the mind by an invisible power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
I have sinned he says, in that I have betrayed righteous blood. Although the repentance of the traitor is vain, because he sinned against the Holy Spirit, yet to acknowledge the fault is some shame in crime. And although he is not absolved, yet the shamelessness of the Jews is refuted. Though the profession of the seller convicts them, the wicked men nevertheless claim for themselves the rights of the contract and believe themselves exempt from guilt, when they say: What is that to us? You see to it. Plainly mad, who think themselves released rather than bound by the crime of its author. In money cases the obligation is dissolved when the price is refunded: these men take back the price and pursue the sacrilege, and with obstinate zeal claim for themselves the deadly sale of blood, though the seller was refunding the wages of sacrilege.

Plainly, therefore, while the price of blood is kept apart from the treasuries of the Jews, and the potter's field is bought with the money for which Christ is sold, while that place is dedicated to burying the remains of strangers, both the oracle of prophecy is fulfilled and the mystery of the rising Church is revealed. For the field, according to the divine precepts, is this whole world, and the potter is he who formed us from the clay, of whom you have in the Old Testament that God fashioned man from the clay of the earth, having power at his own will to form through nature and to re-form through grace. For even if we fall in ruin through our own vices, yet through his mercy, when the spirit of the mind has been taken up again, we are re-formed according to the oracles of Jeremiah.

The price of blood is also the price of the Lord's Passion. So by the price of blood the world is bought by Christ; for he came that the world might be saved through him, the world in which there is alike both the work and the right of the author. He came, then, to keep for the grace of perpetuity those buried together with Christ through baptism and dead together with him. But there is not a place of burial for all indiscriminately; for although the world encloses all, it does not keep all. Although the dwelling is common, yet the lawful burial is that of those, namely, who are now through faith of the household of God, but were strangers in the Law. Who are these, unless those of whom it is said: Remember that once you were Gentiles, who were in the flesh alienated from the way of life of Israel and strangers to the promise of the testaments? But these now are no longer sojourners and strangers, since they have merited by right of faith to be fellow citizens of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
