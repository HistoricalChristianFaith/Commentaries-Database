[[commentary]]
quote='''
Let us not pass by progress in any discipline, as Joseph too, as a youth, did not pass it by, because he was seeking his brothers and hastening to the place where they were pasturing the sheep; and when he learned that they were in Dothaim, he went on there. By that word Dothaim is signified a fitting failing, that is, a failing of vain opinions, not moderate but perfect and full, in which lies the progress of the soul. For the wise man, when he diminishes, adds; for worldly opinions fail, and they are compared to weak women. Hence it is beautifully said, to show that Sarah had come to progress, so as to bring forth laughter and gladness: There had failed, it says, in Sarah the ways of women. Good, then, is the failing of desires, the failing of vanity, because it is the addition of truth. Hence the holy man too says: My soul has failed for your salvation. For she was to bear him whom God had granted and therefore had also promised; she was to bear gladness and that sober inebriation of joyfulness; she was to bear offspring sooner than expected, by the swiftness of natural talent, pregnant with wisdom. Indeed, of other Hebrew women too you have it that the Hebrew women give birth before the midwives come, because the souls of the just do not wait for arts and disciplines for the various kinds of discovery, nor do they require aids to bringing forth, but of their own accord pour forth their offspring and anticipate expectation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
