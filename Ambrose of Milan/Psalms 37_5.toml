[[commentary]]
quote='''
Reveal your way to the Lord and hope in him, and he himself will do it; and he will bring forth your righteousness as the light, and your judgement as the noonday. By this one verse he has declared what kind of man you ought to be; for who reveals his way but he who confesses the inner things of his breast to God, the judge of his hidden things? Well does he say "reveal", that is: lay open your conscience, lest the shadow of this world or of the flesh weigh it down. For seeds that are breaking forth, if they have been overshadowed, grow thin; exposed to the sun, they grow fat. Why do I speak of seeds? The shade of the forest kills the young trees themselves, so that they do not raise themselves on high, and prevents them from spreading out their branching arms. Beautifully, moreover, did he say: Reveal your way to the Lord, because the nature of men, prone to sin, draws as it were a kind of veil over our mind, so that we do not confess our sins to the Lord, who is able to heal our wounds, so that a man blushes to ask for medicine with his own mouth, lest his disgraceful deeds be betrayed before men. The conscience, then, presses itself in within the man, although it cannot lie hidden, and puts off so long, until the wound festers, that it is uncovered no longer by the wholesomeness of faith but by the incurable foulness of the sore. Reveal, he says, your way to the Lord, that is: lay open your way, do not hide it, as Cain hid it, who desired to lie hidden; for everyone who does evil hates the light. David revealed his way, who said: I speak my works to the king. Lay open your mind, so that there may be nothing for which you fear to be reproached; Paul too revealed his, who ventured to say: I am conscious of nothing against myself. Let your conduct, let your life be such that your way may shine before your Father who is in heaven.

But since the whole human condition is subject to frailty, and it is not in our power to direct our course according to our will, therefore he says to you: "hope in the Lord, and he himself will do it", that is: so that he may lay open your way and not permit you to be such that you flee the light, while you fear to be betrayed, and love the darkness, so that you may hide your shameful deeds, saying: Darkness covers me; who knows whether the Most High sees? For how can the man who plots adultery not seek a night suited to his attempts, the man who contrives a falsehood not bring a witness to his fraud, the man who angles to corrupt a judge in order to crush an innocent man not search out the secret place of iniquity? The robber lurks in lonely places, he hides under the darkness of night, so that his crime may succeed. Iniquity, then, is darkness; God is light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
