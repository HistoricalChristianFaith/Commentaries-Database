[[commentary]]
quote='''
And Christ too answered.

Behold, you are good, my nearest one, behold, you are good: your eyes are doves. Because the Church had come to know the mystery, and was preaching the Lord Jesus crucified for the redemption of the whole world, she deserves to hear: Behold, you are good, you who call me good; Behold, you are good, you who have seen the beauty of my glory, and are yourself beautiful and comely. But what is it for Christ to say: You are good, or you are comely, but that word of the Gospel: Be steadfast, daughter, your sins are forgiven you (Matt. 9:22)? So she to whom Christ has forgiven sins rightly says: Reward your servant, that I may live, and keep your commandments (Ps. 118 (119):17). She has nothing in the reward to despair of; because the Lord Jesus came to save the world, not to destroy it. Therefore he is unmindful of injury, mindful of grace, as he himself testifies in the prophetic book, saying: I am, I am he who blots out your iniquities, and I will not remember them: but you, remember, and let us be judged; tell your iniquities first, that you may be justified (Isa. 43:25 and 26). Whoever, then, tells his iniquities to God is justified: and whoever is justified does not fear the reward, but demands it: he who does not fear the reward lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
