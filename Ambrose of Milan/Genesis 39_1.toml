[[commentary]]
quote='''
Joseph, then, was sold, led into Egypt, bought by the overseer of the cooks. No idle figure this, one who would cook what was raw among foods, so that minds might feast on the sweetness of faith; for no food is sweeter than knowledge and teaching. Before, there was in Egypt a raw unbelief, which no ardour of divine knowledge and no desire for true knowledge had softened, which the fiery words of the Lord had not cooked through. And Joseph was sold in Egypt because Christ was to come to those to whom it was said: By your sins you have been sold, and therefore he redeemed by his own blood those whom their own sins had sold. But Christ, sold by taking on our condition, not by guilt, is not held by the price of sin, because he himself did no sin. So by the price he took on our debt, not debts of his own; he took away the bond, removed the moneylender, released the debtor: one man paid off what was owed by all. It was not permitted to us to go out from slavery. He took this on for us, to drive back the slavery of the world, to restore the freedom of paradise, to bestow a new grace by the honour of fellowship with himself. So much for the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 4"
