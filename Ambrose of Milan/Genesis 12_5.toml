[[commentary]]
quote='''
Yet, though placed even in these burrows, he so escaped that he took his wife and his nephew and every soul that he had possessed in Haran. For the prudent and the continent are possessors of virtue and of a soul that chooses the comeliness of gentle character. But those who are lovers of the body are ensnared by its delights, because all the virtue of irrational creatures lies in the condition of the body, but that of rational ones in the virtues and disciplines of the soul. For this reason it is written that he possessed his soul, ruling it as free and subject to no servitude. This, then, is the teacher's intent: that, though placed even in those byways and windings, whether of an age still young, or of a discipline not yet more perfect, or of a place open to vices, he dwelt there not so bent towards sin that he could not move away. Indeed he defended his mind from that slippery possession and carried it over.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 2"
