[[commentary]]
quote='''
But why is the man set free not taken with him, but bidden to return home, unless both that occasion for boasting may be avoided and that he may be an example to unbelievers — although that home is a natural lodging — and therefore, because he had obtained the remedy of health, he is commanded to return from the mounds and sepulchres to that spiritual home, so that a temple of God may come to be where there was a sepulchre of the mind?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
