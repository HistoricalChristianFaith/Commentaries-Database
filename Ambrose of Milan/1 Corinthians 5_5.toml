[[commentary]]
quote='''
There is also this reason, that the Levites are ministers of God. And therefore their cities are assigned by the Law to manslayers in flight, because it is their right to carry out the divine commands concerning those who have committed a mortal crime. The Church does not know how to publish laws of her own: she knows that the priest should obey the Lord's command. Hear a Levite saying: I have delivered such a one to Satan for the destruction of the flesh, so that the spirit may be saved in the day of our Lord Jesus Christ. Struck, then, by the Levitical sword, let the sense of the flesh die in us, so that our soul may live. For unless the sense of the flesh has been slain, there can be no fruit of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 2"
