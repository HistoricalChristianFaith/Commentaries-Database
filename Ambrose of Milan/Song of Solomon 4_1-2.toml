[[commentary]]
quote='''
Your teeth are like a flock of shorn goats, which have come up from the washing, all of which bear twins, and there is none barren among them. What is said outwardly of goats must be understood mystically of the flock of the Church. Do not let these animals seem worthless to you: you see that this flock pastures on the heights, bold on the mountain. And so, where there are precipices for others, there is no danger for goats; where there is danger for others, there is that flock's nourishment, there the food is sweeter, there the fruit more choice. They are watched over by their shepherds as they hang from a thorny rock; where the inroads of wolves cannot come, there fruitful trees supply them untouched fruit. One may see them distended with abundant milk, anxious over their tender offspring with a mother's tenderness. Therefore the Holy Spirit chose them, to compare with them the assembly of the venerable Church.

And that you may hear it mystically: the hair of the Word is the height and a certain eminence of just souls, since the sense of the wise man is in his head. For it is certain that wisdom lies in the height of human thought. And as goats are shorn so that they may put off what is superfluous, so too holy Church has a flock of shorn souls, that is, the virtues of many souls, in which flock you could find nothing senseless, nothing superfluous; since faith has made them wise, and spiritual grace has cleansed them from every stain of superfluous things.

Rightly, then, the souls of the just have been revealed, and revealed from Mount Gilead, that is, from the migration of testimony, because the heavenly testimony migrated from the Synagogue to the Church. On this mountain, therefore, grow incense, resin and the other fragrances which those Ishmaelite merchants, as you have it in the first book of the Old Testament, were carrying (Gen. 37:25). And so, just as goats, refreshed with good food and flourishing in the warmth of the sun, are washed in the river and, leaping for joy, come up clean from the river, so the souls of the just come up from the spiritual washing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
