[[commentary]]
quote='''
There, she says, I will give my breasts; there the mandrakes have given fragrance. Many distinguish a certain sex among mandrakes, so that they think there are both males and females, but the females of a heavy odor. It signifies, then, that the Gentiles, who formerly stank, since they were weaker through a certain emasculated feebleness of unbelief, began to bear fruits of good fragrance after they believed in the coming of the Lord. We read also that holy Rachel received mandrakes from her sister Leah, so that she would grant her to sleep with holy Jacob that night. Reuben the firstborn had brought the mandrakes to his mother Leah, who, with her bleary eyes, took on the figure of the Synagogue; because she could not see the grace of Christ, the gaze of her weak mind being dulled. By this it is declared that the fruits which the Synagogue had formerly received from the firstborn Son of God, she yielded to the Church. But because, through the union of that night which she had asked for, Leah conceived and bore an heir of her posterity, she fulfilled the mystery; since, when the apostles believed, the remnant of the Jews was saved through the election of grace; and so the Church says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Things new and old, my brother, I have kept for you; that is to say: I hold all the commandments of the New and of the Old Testament. The Church alone can say this: no other congregation says it; the Synagogue does not say it, holding neither the new according to the letter, nor the old according to the spirit. The Manichaean heresy does not say, The old I have kept for you, for it does not accept the prophets. Rightly is she called made white, who shines with the grace of both Testaments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
