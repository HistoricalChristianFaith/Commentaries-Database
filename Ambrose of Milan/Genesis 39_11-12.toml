[[commentary]]
quote='''
And so, when he had gone in for the sake of his duty and the charge entrusted to him, with witnesses and household servants out of the way, she seized him, saying: Sleep with me. Joseph is excused by the testimony of Scripture, because he could not abandon the service entrusted to him by his master. For it is not enough that he went into the inner parts of the house secure of himself, as one who could not be captured: a just man ought to have foreseen not to give the raging woman an opportunity, lest she perish by a sin on his account. But he who saw that his master's wife was set against him had to beware also of offending his master by neglecting his duty. At the same time he thought her boldness was still one of speech, not of seizing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
