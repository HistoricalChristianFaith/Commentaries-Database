[[commentary]]
quote='''
And indeed if you read it thus, "In none in Israel have I found so great faith," the meaning is simple and easy. But if according to the Greek, "Not even in Israel have I found so great faith," faith of this kind is preferred even to that of the more elect, and those that see God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And indeed, if you read thus: In no one have I found such faith in Israel, the meaning is simple and easy; but if according to the Greeks: Not even in Israel have I found such faith, this man's faith is preferred even to those more elect and to those who see God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
