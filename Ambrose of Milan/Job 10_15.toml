[[commentary]]
quote='''
And beautifully he says: If I am just, I cannot lift myself up; for I am full of confusion. For the just man notices his own frailty more than in ... ; the wise man acknowledges it, the fool does not. In fact, the wise man is pierced by his own falls, the fool delights in them: the just man is the accuser of himself, the unjust man his defender; the just man wishes to forestall his accuser by confession of sin, the unjust man desires to hide his sin. The former comes forward at the very beginning of his speech to disclose his error; the latter, by the wordiness of his speech, wraps the accusation in sleep, so as not to disclose his error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
