[[commentary]]
quote='''
If, then, you are such that you can despise not only all that is yours, but even your very flesh, for righteousness, than which no possession can be richer — for a clean man is a precious possession —, even if the higher rivers have shut you in, you cross over; even if the Lord has given power to tempt you, he nevertheless commands the devil himself to guard your soul, according to what is written: that you may destroy the enemy and the defender; for he tempts as an adversary, defends as a servant. For it is written: and the unicorn will be willing to serve you. For he serves who does not carry out what he wishes of his own will, but of necessity obeys imperial commands against his will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
