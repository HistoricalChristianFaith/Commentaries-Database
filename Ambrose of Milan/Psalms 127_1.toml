[[commentary]]
quote='''
Both these points of view, the moral and the spiritual, are exacted of you. The prophetic psalm instructs you regarding this: Unless the Lord build the house, they labor in vain that build it. Unless the Lord keep the city, they watch in vain that keepeth it. It is obvious that the laborers are those who engage in the actual operation of building, while the watchers are those to whom the duty of protecting the perfected work is entrusted. Hence the Lord said to the Apostles, as if they were on the point of perfecting their work: Watch and pray that you may not enter into temptation. By this He meant that the function of a nature that was perfected along with the grace of abundant virtue should be preserved and that no one, even one who has attained some perfection, ought to feel really secure of himself unless he remains vigilant.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 4"

[[commentary]]
quote='''
Since, then, God by divine favour granted such great things for the building up of his Church that, after patriarchs, prophets, angels, the only-begotten Son of God should come down and come to the washing, have we not come to know that it was truly and divinely said of the Church: Unless the Lord builds himself a house, they have laboured in vain who build it? Nor is it any wonder if man cannot build, when he cannot guard: Unless the Lord guards the city, they have watched in vain who guard it. So much from a certain psalm. Yet I too dare to say that a man cannot set out on the way unless he has the Lord going before him. Hence it is written: You shall walk after the Lord your God; and: By the Lord are a man's ways directed. Indeed, he was the more perfect who understood that he could not walk without the Lord. Your ways he says teach me. And to come to the history — for we ought not only to drink in the simple sequence of what was done, but also to refer our own acts to the imitation of what is written — the people went out of Egypt. It did not know the way that would lead to the holy land. God sent a pillar of fire, that the people might learn the way by night. He sent also by day a pillar of cloud, that they might turn aside neither to the left nor to the right. But you are not such, O man, as to deserve a pillar of fire too; you do not have Moses, you do not receive a sign; for now, after the coming of the Lord, faith is required, signs are put away. Fear the Lord and take confidence in the Lord; the angel indeed of the Lord will encamp round about those who fear him and will deliver them. You surely see that everywhere the power of the Lord cooperates with human efforts, so that no one can build without the Lord, no one guard without the Lord, no one begin anything without the Lord. And so, according to the Apostle: Whether you eat or drink, do all things in the glory of God, in the name of our Lord Jesus Christ; for in two epistles he bade you act, in one in the name of our Lord Jesus Christ, in the other in the glory of God, so that you may know that the glory of the Father and of the Son is the same and the power the same, and that the Father and the Son, who do not differ in regard to our protection, differ in nothing in regard to their divinity. So David taught me that no one without the Lord builds a house or guards a city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
