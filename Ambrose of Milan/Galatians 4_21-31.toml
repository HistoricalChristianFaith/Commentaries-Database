[[commentary]]
quote='''
For the holy Apostle taught us to seek the secret of truth in the simplicity of history and to carry the sense over into certain discussions not intelligible according to the letter, when he wrote: Tell me, you who have read the Law, have you not heard the Law? For it is written that Abraham had two sons, one from the slave woman and one from the free woman; but he who was from the slave woman was born according to the flesh, and he who was from the free woman according to the promise. Which things he says are spoken by allegory. For these are the two testaments; and below: But the Jerusalem which is above is free.

Let us then strive, with loftiness of mind, toward her whom the middle wall could not cut through and divide. For that wall of the old testament has been loosed according to bodily understanding; the slave woman has been cast out, the free woman is kept. Of the free woman we are free; for the Church is free, the synagogue has been cast out — for the people of the Jews was in slavery — removed is the yoke of slavery, which pressed down, as it were, the necks of our soul, so that we could not look beyond the wall of the former life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
