
[[commentary]]
quote='''
Therefore in the speech of the saints there is power, but in this forensic and philosophical speech there is the vanity of the world. And that there is power in the speech of the saints, let this prophet too teach you, who says: The Lord will give the word to those who preach the Gospel with much power (Ps. 67 (68):12); that is, that they may be able to preach the Gospel with much power. It is proved, then, that there is power in the preaching of the Gospel; and the preaching of the Gospel is the speech of the saints; so no doubt remains that there is power in holy speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
