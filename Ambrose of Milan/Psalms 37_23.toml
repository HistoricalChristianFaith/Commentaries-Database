[[commentary]]
quote='''
By the Lord the steps of a man shall be directed. The Greek said διαβήματα, that is, "crossings", and therefore it is said to you: If you pass through water, the rivers shall not shut you in. Pass on, then, do not halt, as a good traveller, when he comes to some marker of the road, does not stand still but passes on; you too are on the road as long as you are set on this course. If Paul had stood still, he would not have finished his course. See whether he does not say for this reason: And you who stand, see that you do not fall; for he who has passed on cannot fear that he may fall. I saw, he says, the ungodly man exalted above measure and lifted up above the cedars of Lebanon, and I passed by, and behold, he was not. Seeing, then, the ungodly man exalted above measure, he who did not stand still did not stumble; if he had stood still, he would have admired him and followed him, and he would have stumbled and fallen like the ungodly man. Therefore Moses, seeing the bush shining and not burning, says: Passing over, I will see this great sight. He who passes over from this world sees a great sight; he who loosens the chains of this bond by which we are bound to this body sees a great sight. Moses sees many wonders in Exodus; no other who is not in an exodus sees so many. The same Moses passed over; the people of the fathers too passed over, because it was going out of the land of captivity. And so their steps were directed by the Lord, for whom a pillar of fire shone by night, of cloud by day, so that neither the heat of the day should afflict them as they journeyed nor the darkness of night bring hindrance to the travellers.

And you, deserve it by your deeds and beg it by your prayers, that your steps may be directed by the Lord, lest your feet be moved, because it is written: But my feet were almost moved, my steps had well-nigh been poured out. You must beware also lest you abandon the straight path and the byways of crooked roads deceive you. Therefore it is said: Prepare the way for the Lord, make his paths straight. Let us, then, prepare the way for the Lord our God in our minds, let us make his paths straight, let us make straight the paths of our souls, lest we slip. Let not our steps be poured out like those of Lot's wife, who looked back behind her and could not hold her steps, but they were poured out when she was suddenly turned into salt. Let them not be poured out like those of the Egyptians, whose step the wave of the sea poured out. For the very Hebrews who were with Moses, because they sinned in the desert, the footsteps of their feet fell, so that they did not enter the land of the resurrection.

Is it not also beautifully said of these that their advances have been poured out, whose hopes have slipped, whose labour has been poured out in vain, whose vows have been forsaken? For consider that someone for some years had zeal for uprightness, the guarding of chastity, the love of a more careful life, the purpose of devout service, the duty of diligent observance, and that suddenly he was changed, left the monastery, bade farewell to fasts, renounced continence, indulges in delights, gives himself to luxury. Not long ago they went out of the monasteries, and now they are teachers of luxury, sowers of incontinence, inciters of wantonness, detractors of modesty. Would you not beautifully say of these: "their steps have been poured out", who repented of having directed them well? And so they have done penance of a new kind, for their virtues, and they do not do it for their offences. But these went out from us, says John, but they were not of us; for if they had been of us, they would have remained with us. These, then, have condemned their own way, to whom it is fitting to say: O you who have forsaken the straight paths by going away into the ways of darkness, and who rejoice in evils and are glad in evil overthrow, whose paths are crooked and their courses winding, like their slippery and winding author. Why have you begun to hate the straight way and deserted righteous counsel? The Lord did not direct you. But he whom the Lord directs, he will desire his way, as it is written, and will delight in his paths.

Both, however, can be understood — so ambiguous is it —: that he too who is directed by the Lord will desire the way of the Lord, because with him as guide every labour is lightened, all hindrances are removed, incentives are supplied; and that the Lord himself does not spurn, but gladly accepts, the way of the man whom he himself has directed to virtue. Beautifully, moreover, are the steps of a man said to be directed by the Lord, because to keep one's footstep without stumbling is not of him who wills, nor of him who runs, but of God who has mercy. For he who plants and he who waters are nothing, but God who gives the increase: to him alone the glory of virtues is rightly assigned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
