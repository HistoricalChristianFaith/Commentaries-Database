[[commentary]]
quote='''
Not unmeaningly then is the character of John praised there, who preferred the way of righteousness to the love of life, and swerved not through fear of death. For this world seems to be compared to a desert, into which, as yet barren and uncultivated, the Lord says we must not so enter as to regard men puffed up with a fleshly mind, and devoid of inward virtue, and vaunting themselves in the heights of frail worldly glory, as a kind of example and model for our imitation. And such being exposed to the storms of this world, and tossed to and fro by a restless life, are rightly compared to a reed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What did you go out into the desert to see? A reed shaken by the wind? When he had forewarned John's disciples that one must believe in the Lord's cross, as they were going back he turned to the crowds and began to call the poor to virtue, lest, exalted in heart, unstable in mind, weak in counsel, they should prefer the showy to the useful, the perishable to the eternal; but rather that with humble spirit they should take up the cross rather than lift up the trappings of this world, and, as blessed poor who had nothing of the world to lose, should willingly exchange the life of the body for immortal glory. Not idly, then, is the person of Saint John praised here, who, setting aside the love of life, did not change the form of righteousness even for terror of death.

What he says did you go out into the desert to see? This world seems to be compared to a desert, still untilled, still barren, still unfruitful, into which the Lord forbids us to go forth in such a way as to think that men puffed up in the mind of the flesh and empty of inner virtue, boasting themselves of the frail loftiness of worldly glory, are to be imitated by us as a kind of exemplar and image: men whom a fickle life disturbs, exposed to the storms of this world, rightly to be compared to a reed, in whom there is no fruit of solid righteousness, who, tufted with the trappings of the forum, covered with knots, resounding with empty noise, of no use in themselves, giving frequent offence too, pursue what is empty within and showy without. We are reeds, founded on no root of a stronger nature, and if a light breeze of more prosperous success has breathed upon us, with wandering motion we strike our neighbours, helpless to support, ready to harm. Reeds love rivers, and the gliding, perishable things of the world delight us.

Yet if anyone plucks this reed from the plantings of the earth and strips it of superfluities, stripping himself of the old man with his deeds, and tempers it with the hand of a scribe who writes swiftly, it begins to be not a reed but a pen, to imprint the precepts of the heavenly scriptures on the inner chambers of the mind, to write them on the tablets of the heart. Of this pen you have it said: My tongue is the pen of a scribe who writes swiftly, which others wish to refer to Christ. In one place, then, are read the Word, the pen and the scribe: the Word, because he proceeded from the begetting secret of the Father — my heart has brought forth a good word —; the pen, because the flesh of Christ expressed the sequence of the Father's will and fulfilled the commands of the divine tongue by the shedding of the sacred blood; the scribe, because with his pen, by a certain indivisible distinction of the New and the Old Testament, or of divinity and flesh, he revealed to us the mysteries of the Father's disposition.

Imitate this pen by the tempering of your flesh; dip this pen of yours, that is, your flesh, not in ink but in the Spirit of the living God, that what you write may be eternal. With such a pen Paul wrote that letter of which he says: You are our letter, written not with ink but with the Spirit of the living God. Dip your flesh in the blood of Christ, as it is written: that your foot may be dipped in blood. And so do you too dip the footstep of your soul and the gait of your mind in undoubting confession of the Lord's cross. You dip your flesh in the blood of Christ if you wash away vices, wipe away sins, carry about the death of Christ in your flesh, as the Apostle taught, saying: carrying about the mortification of Jesus Christ in our body. Do not bend down to earthly things, lest you break your reed. And therefore it was prophesied of Christ, because he was not to be bent down to earthly things: A bruised reed he will not break, since the flesh which sins had bruised he made solid by the power of the resurrection. A good reed is the flesh of Christ, which fixed the head of the serpent devil and the allurements of worldly desire to the gibbet of the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
