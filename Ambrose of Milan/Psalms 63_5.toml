[[commentary]]
quote='''
Now let us turn our attention to the characteristic of fatness or richness of which David speaks intelligibly when he says: Let my soul be filled as with marrow and fatness. Before that he had said: And may thy whole burnt offering be made fat. By this he means that the requirements for a sacrifice are that it be fat or rich, that it be glistening and that it be weighted with the sustenance inspired by faith and devotion and by the rich nourishment of the Word of God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 5"
