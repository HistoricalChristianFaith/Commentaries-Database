[[commentary]]
quote='''
So he went and clung to one of the citizens; for he who clings is in a snare. And this citizen seems to be the prince of this world. Then he is sent to his farm, the one that he bought who excuses himself from the kingdom; and he feeds swine, those surely into which the devil asks to enter, which he hurls headlong into the sea of this world, as they live in filth and stench.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
