[[commentary]]
quote='''
Turn your eyes away from me, then, because you lift me up. For the more one strains toward the Lord, the more he lifts up the Lord, and is himself lifted up. Hence that man too says: I will exalt you, O Lord, for you have taken me up; for the holy man exalts the Lord, the sinner humbles him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"

[[commentary]]
quote='''
For the more one strives toward the Lord, the more he lifts up the Lord, and is himself lifted up. Hence he too says: I will exalt you, O Lord, for you have upheld me (Ps. 29 (30):1). For the saint exalts the Lord, the sinner humbles him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
