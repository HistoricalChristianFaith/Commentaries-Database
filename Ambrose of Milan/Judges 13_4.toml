[[commentary]]
quote='''
But why should I speak further? Did not abstinence from wine make fertile the barrenness of Samson's mother and cause her to be fruitful instead of barren, since according to the precept of the Lord she did not drink wine? Did not the Lord give heed to Anna when she did not eat, and did not fastings remove her unfruitfulness? And the two sons who were born of them, the one very strong, the other very religious, showed themselves worthy of appearing to have long been nourished in the bosom of fasting, and brought forth, as it were, from the womb of abstinence. And so that same Sampson, who was born through the sobriety of his mother, was avenged through the drunkenness of the gentiles who taunted him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 6"
