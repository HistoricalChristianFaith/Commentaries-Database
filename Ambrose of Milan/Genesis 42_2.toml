[[commentary]]
quote='''
There is, he says, grain in Egypt, that is: where the famine is greater, there the plenty is greater. Great is the grain in Egypt. Indeed, God the Father too says: Out of Egypt I have called my son. From this grain comes that fruitfulness; for there could not have been a harvest unless the Egyptians had first sown the grain. There is, then, grain, which no one before believed existed; in this grain the patriarchs trade.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 8"
