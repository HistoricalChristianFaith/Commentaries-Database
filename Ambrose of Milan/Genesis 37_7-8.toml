[[commentary]]
quote='''
And so divine grace shone forth in him while he was still a boy, since he dreamed that, when he had bound sheaves with his brothers, as it seemed to him in the vision, his sheaf rose up and stood upright, while his brothers' sheaves turned and worshipped his sheaf. In this, surely, the future resurrection of the Lord Jesus was revealed. When the eleven disciples saw him in Jerusalem, they worshipped him, and all the saints, when they have risen, will worship him, bringing forward the fruits of good works, as it is written: But coming they shall come with exultation, carrying their sheaves. Hence his brothers, although out of envy they denied belief in the dream, yet expressing its interpretation in their own words, answered him: Shall you, reigning, reign over us, or, ruling, be ruler over us? For that vision signified the King who was to come, whom all flesh of the human race would worship with bended knee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 2"
