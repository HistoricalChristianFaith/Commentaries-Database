[[commentary]]
quote='''
Inasmuch as we propose to discuss the nature of man, it is fitting that, by way of preface, something be said that reflects credit on him.

There appears to be no creature which has more physical strength or by its size inspires more terror than an elephant. No animals are as fierce as the lion and the tiger. Yet these beasts serve the interests of man and as the result of man’s training lay aside their natural instincts. They forget their innate propensities and assume those which are imposed on them by command. Why need I say more? They are taught as if they were children. They cringe like weaklings and are lashed like timid creatures. They are corrected as are those subject to us and assume our habits since they have lost their own peculiar impulses.

Wonderful, therefore, is the work of nature in both great and little things, for ‘wonderful is the Lord on high.’ Just as we admire the level plains no less than we do the high mountains, so we marvel no more at the height of the cedar than we do at the fruitfulness of the vine or of the modest olive tree. In like manner, I admire the elephant for his hugeness no less than the mouse for the fact that he inspires the same elephant with terror.

Nature, therefore, has the power of causing fear in certain aspects and of being fearful in others. Each and every creature is endowed with certain characteristics which are their special mainstay. The elephant is a formidable object to a bull, but is fearful of a mouse. The lion, king of beasts, is disturbed by the slight sting of a scorpion and dies from the bite of poisonous serpent. The lion has extraordinary beauty as he shakes his mighty mane and raises his head on high. Yet, who does not marvel at the fact that huge bodies are subject to death from a scorpion’s slight sting—so slight as to be without substance?

Let no one impugn the work of the Creator of serpents. He has, in fact, exposed His creatures to all other kinds of poisons, either animal or vegetable. These have come into being for our correction, not for our destruction. As a matter of fact, that which is an object of terror either to the cowardly, the weak, or the godless is a source of usefulness for others. A tutor, for example, seems severe, harsh, and unyielding toward his charges. He is unsparing with the whip, tames their boisterousness, and exacts their obedience. He surrounds them with fear, so that he may curb their boyish spirits. As a result of this severe treatment they turn out to be virtuous, temperate, and restrained, more eager for commendation than for sport. Do you not see how these fear-inspiring whippings are able to serve a good purpose?

Thus, serpents act as scourges for those whose pronounced character is immature and infantile, whereas no harm can come to the robust. The following words were meant for him who trusted in the Lord: ‘You shall tread upon the asp and the viper; you shall trample down the lion and the dragon.’ Paul was bitten by a viper. It was believed that he, being a sinful man scarce rescued from shipwreck, would soon die of poison. Because he shook off the viper from the fire and still suffered no harm, the onlookers regarded him with more veneration. Addressing all men, the Lord says: ‘He who believes and is baptized shall be saved, but he who does not believe shall be condemned.’ And He said these signs shall attend those who believe: they shall fondle serpents, yet cannot suffer harm from these nor from the drinking of any deadly thing. A man’s lack of faith is more to be feared than poisonous serpents. Have fear of these, therefore, so that the occasion of your dread may at least lead you to faith. But, if you have no fear of God, then beware of the avenging poison of perfidy.

Now, since you behold both lions and elephants subject to you, recall to mind, man, that the saying ‘know thyself’ is not something emanating from Pythian Apollo, but from Solomon, who says: ‘If thou know not thyself, fairest among women.’ Furthermore, long before this time Moses wrote in Deuteronomy: ‘Keep thyself.’ The Law says: ‘Man, keep thyself.’ And the Prophet says: ‘If you know not thyself.’ To whom does he say these words? He adds: ‘Fairest among women.’

What constitutes the beautiful among women if not the soul, an outstanding attribute in both sexes? Not without reason is the soul comely, since it longs, not for the things of earth, but for those of heaven; not for the corruptible, but for the incorruptible, the beauty of which is not liable to perish. All corporeal things, on the other hand, suffer decay either in the march of time or because of the inroads of disease. ‘Keep thyself,’ says Moses, in that in which you form a totality—that in which the better part of you consists. Hence, the Lord explained your nature when He said: ‘Beware of false prophets,’ for they cause your soul to weaken and your mind to totter. Thus, you are not flesh alone. What is flesh without the guidance of the soul and the vigor of the mind? We put on the garment of flesh today and tomorrow it is laid aside. The flesh is temporal, whereas the soul is lasting. Like a garment for the body, such is flesh for the soul. You are not, therefore, a garment, but one who puts on a garment for use. And so you are told to ‘strip off the old man with his deeds and put on the new’—you who are renewed not in the quality of the body, but in the spirit and affirmation of the mind.

Flesh you are not, I repeat. It is not said of the flesh: ‘For holy is the temple of God and this temple you are.’ And elsewhere: ‘You are the temple of God and the Spirit of God dwells in you,’ that is to say, in those who have had a new birth and in the faithful in whom the Spirit of God dwells. It does not dwell among the carnal, for it is written: ‘My spirit shall not remain in these men forever, because they are flesh.’

But let us consider the precise order of our creation: ‘Let us make mankind,’ He said, ‘in our image and likeness.’

Who says this? Was it not God who made you? What is God: flesh or spirit? Surely not flesh, but spirit, which has no similarity to flesh. This is material, whereas the spirit is incorporeal and invisible.

To whom does He speak? Surely not to Himself, because He does not say: ‘I shall make,’ but ‘let us make.’ He does not speak to the angels, because they are servers, and servants cannot have a part in a work along with their Master and Creator. He speaks, rather, to the Son, although the Jews are unwilling to accept this and the Arians object to it. But let the Jews preserve silence and let the Arians with their progenitors be mute, who, while they exclude One from sharing in the divine work, introduce more participants and grant to underlings a privilege which they deny to the Son.

But suppose that God appears to you to have need of the assistance of servants in His work. If God operates in conjunction with the angels, have God and the angels a common ‘image’? Would He say to the angels: ‘Let us make mankind in our image and likeness’? Listen to the Apostle who tells us who is the image of God: ‘Who has rescued us from the power of darkness and transferred us into the kingdom of the Son of His majesty in whom we have our redemption and the redemption of our sins, who is the image of the invisible God and the first-born of every creature.’ He is the ‘image’ of His Father who always is and was from the beginning. Hence it is the ‘image’ who says: ‘Philip, he who sees me sees also the Father.’ And again, although you behold the living ‘image’ of the living Father: ‘How canst thou say, show us the Father? Dost thou not believe that I am in the Father and the Father in me?’

The ‘image’ of God is virtue, not infirmity. The ‘image’ of God is wisdom. The ‘image’ of God is He alone who has said: ‘I and the Father are one,’ thus possessing the likeness of the Father so as to have a unity of divinity and of plenitude.

When He says ‘let us make,’ how can there be inequality? When, again, He says ‘to our likeness,’ where is the dissimilitude? So, when He says in the Gospel: ‘I and the Father,’ there is no reference to one sole person. But when He says: ‘We are one,’ there is no distinction either in divinity or in operation. Both, therefore, do not have one person, but one substance. Well did He add: ‘We are,’ because the divine essence is eternal. So, then, He whom you would consider unlike the Father is co-eternal with Him! He is eternal of whom Moses spoke: ‘I am who am.’ Fittingly, too, there preceded the words: ‘I and the Father.’ If He had mentioned the Father first, you would consider the Son to be lesser. But He mentioned the Son first, then—as it is not fitting that the Son be above the Father—He added the Father, so that you may note that between the Father and Son there is no precedence of rank.

‘Attend to thyself alone,’ says Scripture. In fact, we must distinguish between ‘ourselves,’ ‘ours,’ and ‘what surrounds us.’ ‘Ourselves’ refers to body and soul. ‘Ours’ are the members of our bodies and our senses. ‘What surrounds us’ consists of our money, our slaves, and all that belongs to this life. ‘Attend to thyself,’ therefore, ‘know thyself,’ that is to say—not what muscular arms you have, not how strong you are physically, or how many possessions or power you have. Attend, rather, to your soul and mind, whence all our deliberations emanate and to which the profit of your works is referred. Here only is the fullness of wisdom, the plenitude of piety and justice of which God speaks—for all virtue comes from God: ‘Behold, Jerusalem, I have painted thy walls.’ That soul of yours is painted by God, who holds in Himself the flashing beauty of virtue and the splendor of piety. That soul is well painted in which shines the imprint of divine operation. That soul is well painted in which resides the splendor of grace and the reflection of its paternal nature. Precious is that picture which in its brilliance is in accord with that divine reflection.

Adam before he sinned conformed to this image. But after his fall he lost that celestial image and took on one that is terrestrial. Let us flee from this image which cannot enter the city of God, for it is written: ‘In thy city, O Lord, thou shall bring their image to nothing.’ An unworthy image does not enter there; no sooner does it enter than it is excluded, because we read: ‘There shall not enter into it anything common nor he who practices abomination and falsehood.’ He in whose forehead is written the name of the Lamb will find entrance there.

Our soul, therefore, is made to the image of God. In this is man’s entire essence, because without it man is nothing but earth and into earth he shall return. Hence, in order to convince you that without the soul the flesh is nothing, Scripture says: ‘Do not be afraid of those who kill the body but cannot kill the soul.’

Why, then, do you presume in the flesh, you who lose nothing when you lose the flesh? Rather, be fearful lest you be deprived of the aid of your soul. ‘What will a man give in exchange for his own soul?’ In this is no slight part of himself—in fact, it is the substantial part of the entire human race. This is the means by which men lord it over other living things, wild beasts, and birds. Your soul is made to the image of God, whereas your body is related to the beasts. In one there is the holy seal of imitation of the divine. In the other there is found base association with beasts and wild animals.
'''
