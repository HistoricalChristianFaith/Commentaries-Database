[[commentary]]
quote='''
But let us define more accurately the meaning of the phrase, ‘to the image of God.’ Is it true that the flesh is made ‘to the image of God’? In that case, is there earth in God, since flesh is of earth? Is God corporeal, that is to say, weak and subject like the flesh to the passions? Perhaps the head may seem to you to be made in the likeness of God because it stands aloft, or the eyes because they observe, or the ears because they hear? As to the question of height, are we to consider ourselves to be tall just because we tower a little over the earth? Are we not ashamed to be thought of as like to God merely because we are taller than serpents or other creeping creatures or even than deer, sheep, or wolves? In that respect, how much taller are elephants and camels in comparison with us! Sight is important to us in order to enable us to behold the things of the world and to have knowledge of what is not reported by any person, but is grasped by our sense of sight. How significant, in fact, is this power of sight! Because of it we may be said to have the likeness of God, who sees all, observes all, comprehends our hidden emotions, and searches into the secrets of our hearts!’

Am I not ashamed to admit that it is not in my power to see parts of my body? What is in front of me I can see, but I am unable to see what is behind me. I have no view of my neck or of the back of my head and I cannot see my loins. In like manner, what avail is our sense of hearing if we cannot either see or hear what is only a short distance away? If walls should intervene, both sight and hearing are impeded. Furthermore, our bodies are fixed and enclosed in a narrow space, whereas all wild animals have a wider range and are also swifter than men.

The flesh, therefore, cannot be made to the image of God. This is true, however, of our souls, which are free to wander far and wide in acts of reflection and of counsel. Our souls are able to envisage and reflect on all things. We who are now in Italy have in mind what seems to pertain to affairs in the East or in the West. We seem to have dealings with men who dwell in Persia. We envision those who have their homes in Africa, if there happen to be acquaintances of ours who enjoy the hospitality of that land. We accompany these people on their departure and draw near to them in their voyage abroad. We are one with them in their absence. Those who are separated far from us engage us in conversation. We arouse the dead even to mutual interchange of thoughts and embrace them as if they were still living. We even go to the point of conferring on these people the usages and customs of our daily life.

That, therefore, is made to the image of God which is perceived, not by the power of the body, but by that of the mind. It is that power which beholds the absent and embraces in its vision countries beyond the horizon. Its vision crosses boundaries and gazes intently on what is hidden. In one moment the utmost bounds of the world and its remote secret places are under its ken. God is attained and Christ is approached. There is a descent into hell, and aloft in the sky there is an ascent into heaven. Hear, then, what Scripture says: ‘But our citizenship is in heaven.’ Is not that, therefore, in which God is ever-present made to the likeness of God? Listen to what the Apostle says in that regard: ‘We all, therefore, with faces unveiled, reflecting as in a mirror the glory of God, are being transformed into his very image from glory to glory, as through the Spirit of the Lord.’

Now that we are convinced that the soul is made to the likeness of God, let us take up the question as to whether the statement ‘let us make man’ can be said of the soul. Give ear to the words of Scripture, where in Genesis the word ‘soul’ is used for man: ‘And the sons of Joseph that were born to him in the land of Egypt, two souls. All the souls of the house of Jacob that entered into Egypt were seventy.’ Appropriately enough, the soul is called homo in Latin and ἄνθρωπος in Greek, the former being derived from ‘humanity’ and the latter from a word associated with the lively faculty of ‘seeing,’ a faculty which has more kinship with the soul than with the body. This agrees well with what is said in the Lamentations of Jeremias: ‘The Lord is good to them that support him, to the soul that seeketh him.’ He made reference to men and thought it necessary to add ‘soul.’ God preferably seeks after the soul when it is alone, thus dissociating Himself from the slime of the body and from the cupidity of the flesh.

The soul, then, is made to the image of God, in form like the Lord Jesus. Those men are saints who are conformed to the Son of God. So we read in the Apostle Paul: ‘Now we know that for those who love God all things work together unto good, for those who, according to His purpose, are saints through his call. For those whom he has foreknown he has also predestined to become conformed to the image of his Son, that he should be the first-born among many brethren. And those whom he has predestined, them has he also called and those whom he has called, them he has also justified, and those whom he has justified, them he has also glorified.’ I request a reply to the question: Is justification bestowed on you in terms of the body or of the soul? But there can be no doubt about the answer, since justice, from which justification is derived, is naturally a mental, not a physical, quality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
