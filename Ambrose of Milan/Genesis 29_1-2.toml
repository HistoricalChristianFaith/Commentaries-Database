[[commentary]]
quote='''
And he came to the well, so that he might drink from his own vessels and from the fountains of his own wells, and that waters might overflow for him from his own fountain; for the fountain of life is in the hands of the just man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 4"
