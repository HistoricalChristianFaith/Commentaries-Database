[[commentary]]
quote='''
He had offended the Lord, because he had ordered the people to be numbered. By confession he forestalled God's messenger, recalling that he had sinned greatly and had done very foolishly, not as if reminding one who had forgotten, but as if pressing one who delayed, so that he should not put off any longer the stirring of anger at the offence. I have sinned, he says, greatly, because I have done this thing; and now, Lord, blot out the iniquity of your servant. Hear one saying how sins are blotted out: Her sin is loosed, for she has received from the hand of the Lord her sins double. He does not ask, then, that his sin be wholly remitted to him, but that it be blotted out by a moderate payment, that is, that its memory be blotted out for the future. Indeed the Lord, as if addressed by the voice of one pressing him not to prolong the vengeance for the error committed, sent Nathan the prophet to him, and he came to the king and said to him: Choose what you wish to be done: three years of famine upon the land, or that you flee for three months from the face of your enemies, and they pursuing you, or that there be death in the land for three days. And now know and see what I am to answer him who sent me. See God teaching by what moderation his indignation is softened, if we do not wholly refuse the stripes, but ask that the punishment be of a kind that lightens it, not one that escapes it. He proposed three, so that he might choose what he thought more moderate. See also how he provokes us to penitence, so that we offer ourselves to injury, commanding him to choose, so that in the very punishment a certain privilege of choice may be kept, and he may soothe his guilty one with this word. And David said to Nathan: I am in straits in these three; but let me fall rather into the hands of the Lord, since his mercy is great, than into the hands of men. Did he ask that the punishment for his error be forgiven him? Had he done so, he would have been branded with impudence, as one ungrateful for the divine moderation. A modest confession greatly supports the guilty, and the punishment we cannot escape by defence we lighten by shame. He chose not what would be immune from the scourge, but what he judged more moderate, so as to commit himself to the gentleness of God, who knew how to pardon, rather than to the power of men, who often exceed the measure of vengeance. He has mercy, then, who does not know how to err; he does not have mercy who is a partaker of error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
