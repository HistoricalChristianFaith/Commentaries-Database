[[commentary]]
quote='''
Men of this kind, then, have ended their life in the good things of the world, this life, that is, which they were living, not that life whose reward they hoped for; and therefore they have fallen asleep in the rest of the underworld, not in the heavenly rest. But let us pray rather to undergo toil here, that in the kingdom of heaven we may deserve to obtain the consolation of eternal quiet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
