[[commentary]]
quote='''
In the preceding psalms he preached penitence; then he spoke of his own patience and of the disturbance of man. But in Psalm 39 (40) he announces the New Testament. For he who repents of evils waits; but it is not the mark of the perfect to wait, but to have waited; for no one shall be saved except he who has persevered unto the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"


[[commentary]]
quote='''
From these things, then, it is understood that the remedy of salvation has flowed to us, since he who was awaited is present.

Adam, cast out of paradise, awaited him, that he might be freed from a long exile. He awaited him in righteous Noah, who was preserved for the seed of things to come, so that from him the seeds of righteousness might sprout among men. He thought him the author of the common salvation, since he had deserved to survive the flood; him the prince of wisdom, since he had cultivated the vine and had been made drunk with its fruit — for what is the vine but wisdom? as David, the interpreter of the heavenly oracle, has disclosed to us, saying: Your wife is like an abundant vine on the sides of your house — because in him was the fullness of wisdom which was awaited in Christ, who, filled with the new sacrament of wisdom which eye has not seen nor ear heard, hastened to bring us an unwonted mystery, so that he might lie naked and pour forth unheard-of cups of overflowing wisdom, so that, forgetting the former things, we might rise again to new ways and to the new sobriety of eternal life, whereby God might be acknowledged through the foolishness of preaching, whom this world did not know through wisdom. Finally, in that figure of the sleeping and uncovered father, he who laughed at the folly was cursed; those who showed reverence obtained the grace of a blessing. And therefore those who have believed that the death of the only-begotten Son of God, the Father and Creator of all things, is to be cast up as a stumbling-block or a reproach to our faith are held bound by the bonds of their sins to the everlasting misery of the curse; but those who accept it as the absolution of the whole human race are upheld by the protection of eternal power. For the cross of Christ is to the Jews a stumbling-block, to the Greeks folly, as the Apostle said, but to us who believe in our Lord it is the power of God and wisdom.

He was awaited in Moses, when he had divided and passed through the waves of the sea and opened in the floods a path to travel on foot, impossible to human strength, when the rock followed and poured out waters, to satisfy the inmost bowels of the thirsting fathers in the midst of the desert.

He was awaited also in Aaron, the chief of the priests, who stood midway between the living and the dead and halted the creeping plague of death, lest it pass from the corpses of the dead to the destruction of the living. For what is so proper to Christ as to stand before God the Father as the advocate of the peoples, to offer his own death for all, to repel slaughter, to restore life to those about to perish?

He was awaited also in Jesus son of Nave [Joshua], and he certainly came, who received both his power and his name, so that he might both lead the people into the land of promise and truly be called Jesus by name. He dried up the streams, turned the waves back to their own source, made the sun stand still until he should complete the victory in power. But that was still a figure, not the truth. Finally, the true captain of the heavenly host shone forth, and Jesus son of Nave worshipped him, although the true one had not yet stood present in the body, but had come as yet in a figure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
