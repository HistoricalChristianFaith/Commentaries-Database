[[commentary]]
quote='''
This world is an example of the workings of God, because, while we observe the work, the Worker is brought before us. The arts may be considered in various aspects. There are those which are practical. These relate to the movement of the body or to the sound of the voice. When the movement or the sound has passed away, there is nothing that survives or remains for the spectators or the hearers. Other arts are theoretical. These display the vigor of the mind. There are other arts of such a nature that, even when the processes of operation cease, the handiwork remains visible. As an example of this we have buildings or woven material which, even when the craftsman is silent, still exhibit his skill, so that testimony is presented of the craftsman’s own work. In a similar way, this work is a distinctive mark of divine majesty from which the wisdom of God is made manifest. On beholding this, raising the eyes of his mind at the same time to the things invisible, the Psalmist says: ‘How great are thy works, O Lord; Thou hast made all things in wisdom.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
Hence, the Prophet rendered praise worthy of the Lord when he said: ‘How great are thy works, O Lord. Thou hast made all things in wisdom.’ The divine wisdom penetrates and fills all things. Far more conviction is gained form the observation of irrational creatures than from the arguments of rational beings. Of more value is the testimony given by nature than is the proof presented by doctrine. What animal does not know how to look after his own safety—by offering resistance where force is necessary, by flight or by watchfulness where speed or cunning is called for? Who has instructed them on the curative powers of herbs? Human beings are often deceived by the appearance of herbs. Frequently, we discover those to be noxious which we had considered to be salutary. How often has death crept into repasts that were delicious! How frequently has death-dealing food penetrated even past the watchers and servants of the palace halls to bring death to kings! Wild beasts, merely by the sense of smell, are able to discern what is beneficial and what is harmful. They feed on the plant without the intervention of lackeys or food-tasters and receive no harm! Nature is a better guide and teacher of what is actual and true. She inspires into our senses the perception of what is sweet and health-giving and needs no director. She, too, instructs us how to avoid the bitterness of that which brings ultimate pain. The sweetness of life is set against the harshness of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
