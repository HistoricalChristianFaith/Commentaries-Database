[[commentary]]
quote='''
And yet who are these magi but those who, as a certain history teaches, draw their descent from Balaam, by whom it was prophesied: There shall rise a star out of Jacob? These, then, are heirs no less of his faith than of his line. He saw the star in the spirit, they saw it with their eyes and believed. They had seen a new star which had not been seen since the creation of the world, they had seen a new creature, and not only on earth but in heaven too they were seeking the grace of the new man, according to what Moses set down prophetically, that there shall rise a star out of Jacob, and a man shall spring up out of Israel. And they knew this to be the star which signifies man and God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
