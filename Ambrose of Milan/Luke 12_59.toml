[[commentary]]
quote='''
It remains now for us to understand what the figure of the farthing means. And the hidden meaning of a spiritual understanding seems to be expressed by the name of an everyday thing. For just as those who pay out money render a debt, and the name of the loan is not cancelled before the whole amount of the entire principal, down to the last coin, is paid by whatever kind of payment, so by the compensation of charity and of other acts, or by any satisfaction, the penalty of sin is discharged.

It is not idle either that in this place he set down not two mites as elsewhere, not a penny, not a denarius, but a farthing; for exchange in farthings is like a kind of compensation, when one thing is rendered and another is signified as paid. So here too either the injury is redeemed by the price of charity, or the penalty is relaxed by the assessment of the injury.

We remember that a farthing is usually given in the baths, by the offering of which, as there each one receives the means of bathing, so here he receives that of washing clean, because each one's sin is washed away by the kind of condition written above, when the guilty man is exercised by penalties so long that he pays the punishments of the error he committed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
