[[commentary]]
quote='''
Whoever, then, has this substance of his soul says: Deliver me from all my iniquities. He who prays to be released from all iniquities does not confess the fall of one crime. For he knows that, unless the Lord pardons, no one can be saved, whoever is born under sin, whom the very inheritance of a guilty condition has bound to guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
You have given me, he says, as a reproach to the foolish. Who is the foolish man but he who commits sin and chooses evil things instead of good? Therefore he who is the author of sins is himself the foolish one rather than his minister. When we sin, then, we are handed over as a reproach to the adversary, so that he, as an enemy, may accuse and betray us on the day of judgement. Let us take up, then, the reproach of the cross of Christ, which Moses took up and preferred to the royal treasures of Egypt, and therefore he was not handed over as a reproach to the foolish. Other codices have: Do not hand me over as a reproach to the foolish. But David rather has this custom, that he confesses his reproaches and sins instead, and does not blush at his sins and reproaches, for he knows that in confession there is pardon, and in the condemnation of one's own sin righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
