[[commentary]]
quote='''
Every head in pain, every heart in sadness. From the feet even to the head are the ulcers of sinners. Every head is in pain when those who are reckoned wise are tormented by the pain of avarice. For the sense of the wise man is in his head; and this can also be referred to those who hold the first place in the Church. Every heart is in sadness when we savour the things of the flesh and bury the keen sight of our heart in bodily pleasures. Hence the Lord says of such men that he has given them a heart of flesh.

From the feet to the head the dread plague of diseases creeps, when they suffer from contagion, when they suffer along with others, if anyone is cheated of the fulfilment of his lust, has not been able to storm a widow's chastity or to seize a field, and the sick all pass their sicknesses on to one another. How often old men groan that they cannot drink for long! How often they grieve that they have ceased to go whoring, though they still have the will to whore! How often, amid the tales of drunkards, virtues are a reproach, sins a praise, uprightness a mockery, continence a laughing-stock, mercy a folly! These are the diseases that pass their evils on to many; corruption spreads from a few to all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
