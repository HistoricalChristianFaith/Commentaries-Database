[[commentary]]
quote='''
Consider now that true Hebrew, that interpreter not of a dream but of the truth and of a glorious vision, who came from that fullness of divinity and freedom of heavenly grace into this bodily prison; whom the allurement of this world could not change, nor any corruption of worldly pleasure overthrow; who, when tempted, did not fall; when desired, did not desire; who finally, seized by the garment of the body by a kind of adulterous hand of the synagogue, put off the flesh and ascended free of death. The harlot slandered him when she could not hold him, him whom the prison did not terrify, whom the underworld did not hold. Nay more, from the place to which he had descended as though to be punished, from there he set others free: where the bonds of death were being drawn tight upon himself, there he himself loosed the bonds of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
