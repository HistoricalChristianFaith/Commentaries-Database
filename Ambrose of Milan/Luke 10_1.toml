[[commentary]]
quote='''
Behold, I send you as lambs among wolves. He says this to the seventy disciples, whom he appointed and sent two by two before his face. For what reason did he send them two by two? Because the animals were sent into the ark two by two, that is, male with female, unclean by the number but made clean by the sacrament of the Church. This was fulfilled by the oracle which Saint Peter received, when the Holy Spirit said to him: what God has cleansed, do not call common. And he perceived that it was said of the Gentiles, who followed the succession of bodily generation rather than of spiritual grace. These the Lord cleansed and made heirs of his Passion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
