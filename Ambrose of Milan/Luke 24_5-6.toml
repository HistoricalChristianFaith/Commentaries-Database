[[commentary]]
quote='''
Let us seek, then, the living one. But again let us see that we do not seek him among the dead, and it be said to us as to those women: Why do you seek the living one with the dead? He is not here, but he has risen. The Lord himself too showed where he wished to be sought, saying: Go to my brothers and say to them: I ascend to my Father and your Father, to my God and your God. There, then, shall we seek him, where John sought and found him. He sought him in the beginning and found him living with the living one, the Son with the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
