[[commentary]]
quote='''
Then it was said of the Jews: But those passing by blasphemed him, moving their heads, and the Lord himself says in the psalm: All who saw me scorned me, and spoke with their lips and moved their head. Christ is the head of all; it is better, then, that Christ remain in us than that he be moved by any movement of ours. Hence the Jews, moving their heads, said: Away from the earth with such a one; the Gerasenes asked him to depart from their borders; but the Church held him and did not let him go. Therefore she who held him possesses him; those who moved cannot hold him. And finely does the Evangelist say that those passing by moved their heads: passing by, not standing. We stand in the holy courts; we pass by in the streets. The priest passed by, the Levite went past; he stood who tended the wounds that had been inflicted. And therefore those who passed along the way did not say: The blessing of the Lord be upon you; we bless you from the house of the Lord; for the feet of those who bless are standing, not passing by. Then too it is those passing by, not those who stay, who strip the vineyard whose fence has been broken down; those passing by hiss, as we read in the Lamentations of Jeremiah: All who pass by the way have held their hands over you; they have hissed and moved their head over the daughter of Jerusalem. Therefore the priest could not be crowned, nor could the Levite, because they passed by and went past like a shadow; but Stephen was crowned with martyrdom, because he saw the Lord Jesus standing immovable, not passing by. Immovable in faith, then, Stephen saw Christ immovable, and was moved by no fear of death; Stephen did not move himself, nor did Christ move.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Therefore, Cain, departing from the sight of God dwelt in the land of Naid, which interpreted signifies "shaking." Therefore he who is drunk from a golden cup is shaken by sin. Why do you put yourself under the curse of that parricide Cain, that you may tremble and be shaken? And the persecutors of the Lord also, passing by, wagged their heads; for they were being agitated by the Evil Spirit who is accustomed to shake bodies filled with himself. And when he is wanting, the trembling ceases; but drunkenness causes a perpetual trembling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 16"
