[[commentary]]
quote='''
The moth consumes if you believe badly what you have read well. The moth is the heretic, the moth is Photinus, your moth is Arius. He rends the garment who separates the Word from God. Photinus rends the garment when he reads: In the beginning was the Word, and the Word was with God, and God was; for the garment is whole if you read: and God was the Word. He rends the garment who separates Christ from God. He rends the garment who reads: Now this is eternal life, that they may know you, the only true God, unless he knows Christ also. For it is not only knowing the Father as truly God that is eternal life, but also knowing Christ as true God, true from true, God from God, is life everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
