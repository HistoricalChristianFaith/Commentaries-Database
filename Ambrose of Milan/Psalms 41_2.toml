[[commentary]]
quote='''
And therefore there is need of vows and daily prayers and of the advocacy of the prince of priests, of whom John the Evangelist says: we have an advocate with the Father, the Lord Jesus, and he is the intercession for our sins. This one, then, our advocate and the intercession for the sins of the whole world, prays for him who understands and believes in Christ, and says: may the Lord preserve him and give him life and make him blessed. May he preserve him from dangers, give him life as one set in the darkness of death, and deign to make him blessed by the increase of good works.

And may he cleanse, he says, his life on the earth. Rightly he added "on the earth", because, unless one has been cleansed here, he will not be able to be clean there. Or certainly in this way: "may he cleanse on the earth"; for how is anyone clean in the mud, when the earth smears him? Therefore the hand of the Lord is needed, which made the body from the earth, that it may itself deign to cleanse it.

And may he not deliver him into the hands of his enemy. Who is the enemy but that lion who goes about roaring, seeking whom he may devour? Other Greek copies have: and may he not deliver him into the souls of his enemies. He has put souls for hands, because the souls of enemies lie in wait for the good and try to overthrow the righteous man by their thoughts. Souls are also said for men: all the seventy souls who went down into Egypt. Therefore David too preferred to commit himself to the power of God rather than to the snares of enemies, who would not know how to spare of their own will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
