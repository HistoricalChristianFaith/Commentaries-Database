[[commentary]]
quote='''
You who sit in the gardens, friends attending to your voice, make your voice known to me. And therefore this soul, having the grace of her breasts, enters into the gardens, and finding there the Bridegroom sitting and discoursing with his friends, says: You who sit in the gardens, make your voice known to me: to me, she says, not to the friends.

You who sit in the gardens, friends attending to your voice, make your voice known to me. For she was delighted that Christ was sitting in the gardens, and that the friends placed in the gardens were attending to his voice: but because those friends were of the heavenly ones, Archangels or Dominions and Thrones (for men had been expelled from paradise because of disobedience to the heavenly commands, and therefore the Church could not yet hear his voice, which she longed to hear), therefore she says: Make your voice known to me. Whence we too, if we wish him to sit within us, let us be gardens enclosed and fortified, let us bear the flowers of the virtues, the sweetness of grace, so that we may be able to hear the Lord Jesus discoursing with the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Symmachus, however, and Aquila have interpreted it that Christ is saying to the Church: You who sit in the gardens, that is, you now sit in the gardens, you are worthy of the paradise above; and therefore Make your voice known to me, to which the friends attend: I too desire to hear it. The Church began to be in the gardens after Christ was taken in the gardens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
