[[commentary]]
quote='''
This he says was the first registration made. And yet histories tell us that very many parts of the earth had often been enrolled before. This, then, is the first registration, not of lands but of minds, in which all register, because no one is excepted, at the summons not of a herald but of a prophet, who long before foretold: All nations, clap your hands, shout to God with the voice of exultation, for God is most high, terrible, a great king over all the earth. Indeed, that you may know that it is a census of righteousness, Joseph and Mary come to it, that is, a just man and a virgin: he to guard the Word, she to bear it. Where do the just man and the virgin register but where Christ is born? Every indeed spirit that confesses that Jesus Christ has come in the flesh is from God. And where, in a deeper sense, is Christ born but in your heart and in your breast? For the word is near, in your mouth and in your heart.

Beautifully, too, he added the name of the governor, to mark the sequence of time. When Quirinius was governor, he says, this first registration was made, so that the evangelist seems to have written a kind of consul, as it were, on this book for the sake of a mark of date. For if consuls are written on deeds of purchase, how much more ought the time to be written on the redemption of all! You have, then, everything that is customary in contracts: the name of the one who holds supreme power there, the day, the place, the cause. Witnesses too are usually brought in; these too Christ brought in for his nativity and generation according to the flesh, to seal the Gospel, saying: You shall be my witnesses in Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
