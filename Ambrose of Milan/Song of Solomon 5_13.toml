
[[commentary]]
quote='''
His cheeks are like bowls of spice, bringing forth perfumes. We now understand the cheeks and the rest to be the virtues of the soul and the diversities of teachers: who either supply spiritual nourishment to the mind by diligent dispensing, or by the preaching of the Lord's cross bind the hearer as with a kind of line of the Word, or are bashful in their modesty and most pleasing in the flower of youth. Even if they are held back from touch by shame, yet let the fragrance of Christ breathe in them; and as the ointment comes down upon the cheeks as from the priestly head, so in them too let the beauty of doctrine shine forth.

His lips dripping full myrrh. For by myrrh are declared the ointment of the passion and the grace of the resurrection, which pours a revived fragrance of life into the inmost parts of the dead that are raised. Let the doors of your lips, then, be shut, and let the porch of your voice remain barred, to be unbarred perhaps only when you have heard the Word of God. Then myrrh will drip for you, then the grace of baptism will breathe upon you; so that you may die together to the elements of the world, and rise again with Christ.

His lips dripping full myrrh. But we think ourselves idle if we seem to devote ourselves only to the word; and we esteem those who work more highly than those who practice the study of knowing the truth; for many say: Look at the man and his works: as though he who devotes himself to the word does not work, when this is a work more than the rest are. For if justice is a work, if temperance is a work, if fortitude is a work, surely wisdom too is a work; for these are held to be the four principal virtues. For if Christ works inasmuch as he is justice, surely he works inasmuch as he is the Word. And he was working when he was in the beginning with the Father. Indeed, all things were made through him, so that you may know that he is the worker of all things, and that our work is Christ Jesus. For inasmuch as he is the Word, for those who seek the Word, the Word is a great work. Hence, when Martha was hurrying about the serving, while Mary was listening to the Word of the Lord, she who listened deserved to be preferred to her who served; for to Martha, who said: Lord, do you not care that my sister has left me to serve alone? Tell her, then, to help me, the Lord answered and said: Martha, Martha, Mary has chosen the good part, which shall not be taken away from her (Luke 10:40–42). Thus it is defined by the authority of the divine sentence that to know the Word is a greater work than to serve.

But perhaps someone may say that it was said by the Apostle: That the kingdom of God is not in speech, but in power (1 Cor. 4:20). I do not deny that it is written, but I know in what speech: namely, the speech which one who is puffed up has poured out, speech which cannot profit the hearers, which is without the demonstration of the spirit and of power. This speech Paul does not deign to know; for he wishes rather to commend the power of speech. Indeed, the Apostle wished his speech to be such that it came in weakness, so as to make others stronger; in fear and trembling, so that those who feared might fear nothing but the Lord Jesus, and those who trembled might keep his peace and tranquillity. Hear, then, what kind of speech the Apostle had: And my speech, he says, and my preaching were not in the persuasion of the words of human wisdom, but in the demonstration of the spirit and of power (1 Cor. 2:4); because faith is made firm not in the forensic speech of wisdom, but in the demonstration of the spirit, in the power of God.

Therefore in the speech of the saints there is power, but in this forensic and philosophical speech there is the vanity of the world. And that there is power in the speech of the saints, let this prophet too teach you, who says: The Lord will give the word to those who preach the Gospel with much power (Ps. 67 (68):12); that is, that they may be able to preach the Gospel with much power. It is proved, then, that there is power in the preaching of the Gospel; and the preaching of the Gospel is the speech of the saints; so no doubt remains that there is power in holy speech. And this is the myrrh dripping from the lips of the Bridegroom: namely, that by which vices are mortified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
