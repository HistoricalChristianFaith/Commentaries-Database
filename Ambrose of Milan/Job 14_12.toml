[[commentary]]
quote='''
But when he has fallen asleep, he will not rise again until the heaven is sewn up. This seems to declare: until the heaven is renewed; for there will be a new heaven and a new earth, as it is written. For what is sewn on is old; what is old will be changed. Indeed, hear him saying: In the beginning you founded the earth, O Lord, and the heavens are the works of your hands. They will perish, but you remain, and all will grow old like a garment, and like a covering you will change them, and they will be changed. We can also weave in this point: that what is old is sewn on, what is new is forced. But from the days of John the Baptist the kingdom of heaven is taken by force, and those who use force seize it. So the synagogue was sewing it on in a few, the Church takes it by force in thousands; or else it is because the heaven now seems to be sewn together, often woven of a varied and many-coloured appearance from clouds and gloom and the darkness of night and the saffron blush of the rising day — but then there will be night no more, and they will not need the light of a lamp and the light of the sun, because the Lord will shine upon them, as John said — or because woe to those who sew pillows to overturn the souls of the people.

To the prophet lamenting the misery of our frailty, which both had no rest in this life and would lose everything at the sudden onset of death, the Holy Spirit imparted that men would not rise again until he should come who would not sew old things onto new nor join a new garment to an old garment, but would make all things new, as he himself said: Behold, I will make new things. For he himself is the resurrection, the firstborn from the dead, in whom we have all indeed received the prerogative of the future resurrection; yet he alone, as yet, rose with a perpetual resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 7"
