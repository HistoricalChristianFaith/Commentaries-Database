[[commentary]]
quote='''
Hence, then, the discord of our thoughts. When the flesh fights against the spirit, and the spirit against the flesh, it is no slight battle, since the Apostle himself, the vessel of the Lord's election, says: I see the law of my flesh fighting against the law of my mind and making me captive in the law of sin, which is in my members. He himself had been unable to calm this battle, and therefore he fled to Christ, saying: Unhappy man that I am, who will free me from the body of this death? that is, so that I may not cling to the delights of the flesh. Who then is it that may free me from these bonds, and unite me, set free, to God, and turn my senses toward the sobriety of the soul rather than toward the drunkenness of the body? But because among men he could not find such a governor, turning to God, The grace he says of God through Jesus Christ the Lord. If the stronger man did not entrust himself to his own strength in order to escape the body of death, but sought help from Christ, what ought we, the weaker, to do?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
