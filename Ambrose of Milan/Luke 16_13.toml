[[commentary]]
quote='''
Not because the Lord is two, but one. For although there are who serve mammon, yet he knoweth no rights of lordship; but has himself placed upon himself a yoke of servitude. There is one Lord, because there is one God. Hence it is evident, that the power of the Father and the Son is one: and He assigns a reason, thus saying, For either he will hate the one, and love the other; or else he will hold to the one, and despise the other.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
No slave can serve two lords, not because there are two, but because there is one Lord. For even if there are those who serve mammon, yet he knows no rights of lordship, but they themselves lay the yoke of servitude upon themselves; for it is not a just power, but an unjust servitude.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
So let us not serve what is another's, because we ought to know no lord but Christ; for there is one God the Father, from whom are all things and we in him, and one Lord Jesus, through whom are all things. What then? Is the Father not Lord, or the Son not God? But the Father too is Lord, because by the word of the Lord the heavens were made firm, and the Son is God, who is over all, God blessed for ever. How then is it that no one can serve two lords? For the Lord is one, because God is one. Indeed you shall worship the Lord your God and him alone shall you serve. From which it is clear that the lordship of the Father and of the Son is one. And it is one if it is not divided, but is whole in the Father, whole in the Son. And so, because we assert a Trinity of one Godhead and lordship, we confess one God and one Lord. But those who speak of one power of the Father, another of the Son, another of the Spirit bring many gods and many lords into the Church by the fault of Gentile error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
