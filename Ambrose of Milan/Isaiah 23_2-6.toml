[[commentary]]
quote='''
You have heard what has been read to-day. The merchants, he says, of the Phoenicians passing over the sea; in much water is the seed of merchants as the harvest that is brought in. These are neighboring cities, Tyre of Phoenicia, Sidon; neighboring in sites, so also in evils; merchants seeking paltry gains from their business ventures by perilous crossing of the sea. Solicitous is the life of men, restless and always in a whirl, as it were, their way of living, more changeable than the very winds, by which it is turned and often tossed hither and thither. You of course complain of repeated shipwrecks: who compels you to sail? As if you do not make lands unsafe through the envy of riches, and excite many to piracy! God did not make the sea for navigation, but on account of the beauty of the element. He extended the expanses of sea rather widely that He might enclose the lands by water, lest you might stray too far as a wanderer and exile. But the sea is tossed by the tempest: therefore you ought to fear, not turn it to your use. The innocent element has committed no wrong, human temerity is a source of danger unto itself. Accordingly, he who does not sail knows not how to fear shipwreck. The Lord said: Rule over the fishes of the sea; He did not say: 'Sail out on the waves.' Therefore even the prophet Jonas, who was sent to Nineveh to preach penance, because he wished to sail so that he might flee from the face of God, was tossed by a tempest, and was selected by lot, and was cast into the sea, and was rescued by a whale.

The prophet David, also, said, when he was relating the favor of God toward man: Thou hast subjected all things under his feet, all sheep and oxen, moreover the beasts also of the fields. The birds of the air and the fishes of the sea, that pass through the paths of the sea. He has given to fishes, not to men, to pass through the path of the sea. For food was the sea given to you, not for your peril; use the food, but not for gain. Why do you create peril for yourself from enjoyment? Why do you lay open the depths of the more separate element? Why do you disturb the solitudes of the world? Why, at last, do you, as an impatient sailor, so often hasten to plough and dig up the waves? Why do you tempt the blameless seas, provoke the storms? Oh insatiable avarice of merchants! Even the sea yields to you and the main cannot withstand your unrest. Therefore, after being so often ploughed by returning merchants, Be ashamed, O Sidon, hath said the sea. This is the voice of the fatigued element, as it were, saying: Be ashamed Sidon; that is: 'Merchant you accuse my waves although you yourself are more restless than they. Blush indeed for shame since you are not disturbed by peril. More modest are the winds than your desires. They have their rests, never do your cravings for gain take holiday. Even when the weather is quiet never are your ships quiet. The water is churned under the oar when it is at rest from the blast.

I have not been in labor, it says, nor have I brought forth, nor have I nourished up young men. Why do they disquiet me whom I know not, whom I do not acknowledge?' Go to Carthage, howl, ye inhabitants of the islands! Above it said: Howl ye ships of Carthage! For the Tyrians founded Carthage, and so the Carthaginians followed the luxury of their founders, a degenerate succession of iniquity being transferred to them as baser heirs of shocking vices. And well did it call the luxurious, "ships". Just as the latter are tossed about by the wind, so are the former by meat and wine. Bodies filled with drink inhabit islands, resound with shipwrecks, are beaten with the waves of drunkenness, and are not quiet by day or night. Therefore the seed of these merchants is in the water; in the water is the fruit of their harvest. For in the water they sow their labors so that they reap dangers; in the water their crop sprouts for them; in the water their harvest grows abundant; the very fruit is in the water, never safe and sound. Whereupon he says rightly: 'He who sowed in the earth did not enter into traffic; that is, he, of course, who sowed in heaven. But there is also good earth, and whoever shall sow in this, for him there shall come forth heavenly fruits.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 19"
