[[commentary]]
quote='''
Behold, he says, you have made my days old. Another version has: You have made my days palaestas [wrestlers / hand-breadths]. If, following the Seventy, we take the "days" as "ueteres" [old], that is: we understand them as spent according to the old man. But our old man has been fastened to the cross; therefore the old day too has passed away, the new has come. For the day of man is one thing, the day of Christ another, which Abraham saw and was glad, of which David also says: This is the day which the Lord has made; let us exult and be glad in it. The holy man, then, exults in the day of the Lord, in the new day in which God the Lord has shone upon us and given to those who are re-formed a new light, a life innocent and whole. Therefore the righteous man, secure of the new light and of the grace of God, says: There will be for me a new heaven and a new earth and a new light. For there neither the lamp nor the light of the sun or of the moon will shine, but the Lord will give light over his people. Those things, then, I have desired, those I have longed for, and therefore I have not sought the day of man.

But if we take the "days" as "palaestas", we understand from the name that they are full of contest and toil, since wrestlers in the contest who wrestle for the crown are called palaestae. Therefore, since we too have a wrestling not only against flesh and blood but also against the spiritual forces of wickedness in the heavenly places, our days, that is, the days of this life, are in toil and pain. Hence later on too he says: Our years were meditating like a spider. The days of our years in them are seventy years, but if in the strong, eighty years, and most of them toil and pain. Hence too the Apostle Paul toiled more abundantly than the other apostles, so that by contending lawfully he might attain the crown he desired.

But nevertheless, since the measures of architects are also said to be called palaestae, with which buildings are measured, to work out the number of the structure or the extent of the space, and the place in which the buildings are to be set; and since God spoke through Isaiah: Who has measured the water with his hand, and heaven with his palm, and the whole earth with his closed hand? Who has set the mountains in a balance?, let us see whether perhaps this sense is to be gathered from this word: that God has known the days of all, he to whom nothing is immeasurable, who comprehends all things by a certain measure of his knowledge, and to whom nothing is beyond estimation, nothing unexamined and innumerable, who says: But even the hairs of your head are all numbered. This, then, the prophet says: Behold, you have known my days, my daily acts do not escape you, you have set my sins before your eyes, and therefore my substance is as nothing before you. For what is man, but that you are mindful of him? Man has become like vanity; man is in sin, and if he has any uprightness and virtue, he is rightly preferred to the other earthly living creatures and excels in the sight of the animals over which he is set, but in the sight of God his substance is as nothing. Hence elsewhere too he says: For no man living shall be justified in your sight, which Symmachus expressed more plainly, saying: And my life is as nothing before you.

There are some, however, who think the days are called short, because Symmachus put σπιθαμὰς. A σπιθαμὴ is a palm, and since God is said to have measured heaven with his palm — the palm or span is the portion of the hand of one who measures and grasps something —, they therefore reckon that the days were called short, as it were, whereas the knowledge of God can be understood through measure, as we said above, and this knowledge is heavenly: that all things have been made according to measure. The prophet's days, then, can be understood not as short but as great, since God measured them with his palm, with which he measured heaven. For he would not call the days of his life short who afterwards says: Woe is me that my sojourning is prolonged, unless perhaps because, on account of men's sins, he made the days of this life shorter, which formerly extended to nine hundred and seven hundred years, so that now it is enclosed within the course of a hundred years. Thus, then, it is to be understood: Behold, you know my days, subject to sin; for the days of this life, which is subject to sin, are short, but the days of eternal life are without end.

Or at any rate thus — for it is ours to seek the truth by arguments, yours to choose what you will follow —: Lest sin should increase, he says, you have shortened the days of human life which we live on this earth; and yet, although in this short course of this life the end of sins comes sooner through the swiftness of death, my substance is as nothing before you, because, although we have been made after the image and likeness of God, yet a certain earthly contagion weighs us down while we are placed in this body; and it would not weigh us down if, when we put on grace, we preferred to put off the old man rather than to put the new over it; for the old man stripped off would bring us less toil than the old man clothed over. For what we strip off we cast away; what we clothe over we enclose; and therefore we groan and toil until this mortal garment of the old man, made subject to error, is swallowed up by the newness of its spiritual life — just as, if a great deal of honey is poured over poison, the venom of the poison is destroyed with difficulty and very late, and even much water struggles long with the gall of the poison, if one does not spit it out but swallows it. Therefore penitence is toilsome, grace is sweet, because sin is stripped off where grace is, swallowed up where penitence is; there it is remitted, here it is hidden; and therefore it is written: Blessed are they whose iniquities are remitted and whose sins are covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
