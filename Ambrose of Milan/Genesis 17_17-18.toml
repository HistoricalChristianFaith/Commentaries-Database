[[commentary]]
quote='''
But that Abraham laughed when a son from her was promised was a sign not of unbelief but of exultation. Indeed, he fell on his face — he who worshipped believed — and added: If a child shall be born to me at a hundred years, and if Sarah shall bear at ninety years. And he said: Let this Ishmael live in your sight. He is not unbelieving in the promises nor greedy in his prayers. That is: 'I do not doubt that you will do it, so that you both give a son to an old man of a hundred years and, as the author of nature, relax the bounds of nature. Blessed is he to whom these things are given; but yet if this Ishmael too, whom I have from the home-born slave-woman, lives in your sight, grace abounds to me.' Indeed, the Lord both approved his affection and did not refuse his petition, and he confirmed his promises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
