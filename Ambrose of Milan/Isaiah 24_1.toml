[[commentary]]
quote='''
You have heard what has been read to-day: Behold the Lord comes to destroy the world. As if the holy prophet were pointing out with his hand, as if he were seeing with his eyes, the Day of Judgment approaching, so he says: Behold the Lord comes to destroy the world. Indeed since in spirit even the things which are to come are revealed to the prophets as present, what he saw, therefore, he desired to show to us also that he might recall us to conversion from error.

And yet no one should be crushed when he hears that the Lord will destroy the whole earth, lest perchance he say: 'Let it be so, we have committed serious sins: in what has heaven failed, in what the earth, in what the sea, that He destroy these also? Why does such beautiful adornment perish?' A thought of this kind belongs to a small mind. But if you look more deeply you will find that this is for us which you think is against us; you will judge that this is for the world which you think is opposed to the world. Not always is the stadium crowded with spectators, not always restless with contests, not always thick with dust; but when there are contests, then there are people in the amphitheatre, a wrestler in the wrestling place, dust in the stadium. When the contests have been run off, the gathering is dispersed; each one departs either, as victor, to favor, or as vanquished, to disgrace. The crown raises up the victor; shame presses the vanquished, injury causes pain. If afterward, then, any one enter the stadium, and see it without a crowd, and should ask the superintendent of games why the stadium is vacant, why the contests are silent, why the celebration has ceased, the president of the contests will reply, 'The athletes must rest, the spectators must rest.' For what is the fruit of labor, if not rest after labor? In like manner the world also at some time must be destroyed, that there may be rest for the weary.

We are athletes, we strive, as it were, in a spiritual stadium. Hence, a good athlete was wont to say: We are made a spectacle of this world: and elsewhere: I so run, not as at an uncertainty: I so fight, not as one beating the air: But I chastise my body; and elsewhere: forgetting the things that are behind, and stretching forth myself to those that are before, I press towards the mark, to the prize. We are athletes, therefore; we must contend lawfully. There are many contests, and he who has been vanquished to-day, retrieves himself on the morrow. The contest is first for the prize, then for the crown. Does an athlete have any time for rest when once he has given his name for the contest? He exercises daily, he anoints himself daily. Even an athlete's diet is given to him, discipline is demanded, continence is observed. And you have given your name for the contest of Christ, you have signed for the competition for the crown; take thought, exercise yourself, anoint yourself with the oil of gladness, cleanse yourself from ointment. Let your food be the food of sobriety, let it have nothing of intemperance, nothing of luxury; let your drink be rather moderate, lest any drunkenness steal upon you; guard the continence of your body, so that you can be fit for the crown; let not your character offend the feelings of the spectator; let not your supporters behold you neglectful of yourself and desert you. The Archangels behold you, and the Powers, and the Dominations, and those ten thousands of ten thousands of angels. Consider how disgraceful it would be to be shamed before such; having entered the stadium, arouse the strength of your soul, bestir your muscles. When you have come into the wrestling place you must take on dust, you must withstand the blazing heat of the summer sun. The heat is severe, but the victory is sweet; the cloud of dust is disagreeable, but the endurance is splendid. No one enters the stadium covered with dust, but the contests send him back covered with dust; there the dust is collected where the palm is offered. No one unsoiled, moreover, is crowned; victory becomes him who is covered with dust.

Come therefore, Lord Jesus, let Thy crown go forth, dismiss the victors to their rest; the vanquished, to penance. Even if Thou destroyest the world, more numerous are Thy invisible works than those which we have seen. He who is of too narrow mind does not see those things, he grieves because Thou destroyest the world; but he who knows how to perceive those things which are invisible, rejoices that Thou comest and freest all. The athletes rejoice who can say: Thy kingdom come, Thy will be done on earth as it is in heaven. The creature of the world, that now sighs deeply and travailleth, will rejoice that it will be delivered from the vanity of the world, because that creature also is subject to vanity, until the adoption of the sons be multiplied and the redemption of the entire body be completed. For good, therefore, He will destroy the whole world. For there will be a new heaven and Night shall be no more. Finally, He will uncover his face, He says, that we all may behold the glory of the Lord with face uncovered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 21"
