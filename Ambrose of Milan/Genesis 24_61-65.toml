[[commentary]]
quote='''
Know, then, that it is not without mystery that, being carried on a camel, she was coming to the bridegroom, because the people of the nations, rough with a certain beastly deformity of merits, which had no comeliness of its own form, was to receive the faith and the agreement of the Church. Nor is it idle that, when Rebecca was coming, she saw Isaac walking about and, when she had asked who he was and learned that he was the one to whom she was being brought as wife, she got down and began to veil her head, teaching that modesty ought to go before marriage. For from this marriage too has its name, because girls veiled themselves for modesty's sake. Learn then, virgins, how to keep modesty and not to go out bareheaded before strangers, since Rebecca, already betrothed, thought she should see her appointed husband with her head covered.

Who is that servant who provided for this marriage? Surely one of the apostles, and above all he who says: Men, brothers, you know that from days of old God chose among us that the nations should hear by my mouth the word of the Gospel, or he who was called the teacher of the Gentiles; for they, when they are read, gain for Christ a soul that believes what it did not believe before, and to the one who longs to see Christ they show him by their words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
