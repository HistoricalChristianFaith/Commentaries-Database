[[commentary]]
quote='''
Hear the words of Wisdom herself: Ask, and it shall be given to you; seek, and you shall find; knock, and it shall be opened to you. Knock, then, at the gate, for Christ is the gate; knock at the door of the word, that it may be opened to you to speak the mystery of Christ, and that you may be able to find the treasures of wisdom hidden in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
