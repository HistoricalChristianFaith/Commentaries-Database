[[commentary]]
quote='''
You find in the Gospel clear testimony on this subject. For the Lord, when proposing to raise Lazarus to life, first ordered the Jews to remove the stone from the sepulcher, in order that, on seeing him dead, they might believe afterwards that he had risen from the dead. Next, He called Lazarus by name, and he arose and came forth with his hands and feet bound. Could not He who was able to restore the dead to life also remove the stone? And could not He who was able to restore the dead man to life also set him free from his bonds? Could not He who granted Lazarus power to walk with his feet still bound also render it possible for him to come forth with his fetters already broken? Of course, we see that He wished to point out first that the man was dead, so that they might believe with their own eyes. The next step was to raise him from the dead and the third to bid them unbind with their own hands the mortuary bands. By this process faith might be engendered in the hearts of the incredulous and belief come to life gradually, step by step.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
