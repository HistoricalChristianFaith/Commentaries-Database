[[commentary]]
quote='''
Nor let the name or the nature of a torrent offend you, in that it is sometimes drier or thinner, so that its streams are wont to cease. This one of ours ceased too; the torrent of spiritual outpouring once ceased among the people of the Jews. Why do I say "the torrent ceased", when the sea has ceased, as today's reading taught us, the Lord saying: Behold, by my rebuke I will make the sea desolate and make the rivers a desert, and their fish shall dry up, the fish, surely, of the Jews, through the dryness of their unbelief, so that they cannot swim out? The torrent ceased, then, because of the sacrileges of the synagogue, because that people was dry in faith, barren in works, captive to sins. For what should flow for those who did not drink but defiled the sacred channels, since they denied the fountain itself? A good torrent, which ceased for them that it might abound for us and turn away the thirst of human captivity, like a torrent in the south. Hence Scripture also says: Arise, north wind, and come, south wind, which is wont to blow through the young trees of paradise.

We have stated the sense; let us also consider the wording. Why did he say you will make them drink the torrent of pleasure, and not "torrente" [with the torrent], as if "de torrente" [from the torrent], unless because he wished to express the eagerness of the drinkers, as though they wished to drink up the torrent itself, if they could? This is perhaps the torrent of pleasure, the fountain which we read of in Genesis, which waters paradise and is divided into four rivers that go round the whole earth. From this fountain too the spiritual virtues flow forth: prudence, temperance, fortitude, justice. A good fountain of grace, and of the same splendour and nature as that river too, of which it is said further on: The rush of the river gladdens the city of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Most beautifully, then, he added: Let not the foot of pride come to me, and let not the hand of sinners move me. There fell those who work iniquity; they were thrust out and could not stand. Above, some take "the torrent of your pleasure" as fortitude in temptations, such as that of the martyrs, in whom it pleased God to display for himself the pleasure of a sweet and welcome contest. For if winters are taken for temptations — whence the Lord warns that we must pray that our flight be not in winter or on the sabbath, that is: either in temptation or in idleness; and in winter a torrent grows and is filled up and swells — a torrent surely can be taken for a heavier temptation, such as there is in persecutions. And therefore it is well called a torrent of pleasure, because where the sin of persecution superabounded, the grace of confession also superabounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
