[[commentary]]
quote='''
But the words usurers and usury delight you. That also I do not begrudge. I will teach you how you can be good usurers, how you may seek usury. Solomon says: He lendeth to the Lord that hath mercy on the poor, and according to his gift He will repay him. Behold good interest is made from bad, behold a blameless usurer, behold praiseworthy usury! Do not then consider me any longer as grudging you your profits. Do you think that I am taking away from you man, your debtor? I offer God, I substitute Christ, I point out Him who cannot deceive you. Lend your money therefore to the Lord in the hand of the poor man. He is bound and held, He writes down whatever the needy man has received—the Gospel is His bond—He promises for all the poor, He gives His pledge. Why do you hesitate to give? If any rich man of this world presents himself to you and promises with his own pledge for some debtor, immediately you count out the money. The Lord of Heaven and the Creator of this world is as a poor man for you, and do you still deliberate? What richer surety do you seek?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 16"

[[commentary]]
quote='''
You do not know, O man, how to pile up riches. If you wish to be rich, be poor in the world so that you may be rich in God. Who is rich in faith is rich in God, who is rich in mercy is rich in God, who is rich in simplicity is rich in God; who is rich in wisdom, who is rich in knowledge, these are rich in God. There are some who abound in poverty and some who want in riches. The poor abound whose very deep poverty hath abounded in the riches of their simplicity, and, The rich have wanted, and have suffered hunger. And not idly indeed is it written: The poor shall be put over the rich and their own servants shall lend to their masters, because rich men and masters sow vain and evil things from which they do not gather fruit, but reap thorns. And therefore the rich shall be subject to the poor, and servants shall lend spiritual things to their masters; just as the rich man asked poor Lazarus to lend him a drop of water. You also, O rich man, can fulfill this maxim: "Bestow upon the poor, and you have lent to the Lord"; for, He that bestoweth on the poor, lendeth to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 14"
