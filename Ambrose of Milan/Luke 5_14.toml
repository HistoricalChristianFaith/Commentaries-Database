[[commentary]]
quote='''
But lest the leprosy should pass over to the physician, let each one, by the example of the Lord's humility, shun boasting. For why is he commanded to tell no one, except to teach that our benefits are not to be published but suppressed, so that we abstain not only from the reward of money but also from that of favour? Or perhaps this too was the reason for the silence enjoined, that he thought those better who had believed by a spontaneous faith rather than for benefits hoped for.

He is commanded, moreover, according to the Law to offer himself to the priest, not that he should bring another, but that he should offer himself to God as a spiritual sacrifice, so that, the filth of his past conduct having been wiped away, he may be consecrated, through the knowledge of faith and the discipline of wisdom, as a victim to please God; every victim indeed shall be salted with salt. Hence Paul also says: I beseech you therefore, brethren, by the mercy of God, that you present your bodies as a victim acceptable, pleasing to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
And he is ordered to show himself to the priest and to make an offering for his cleansing, so that, as he offers himself to the priest, the priest might understand that he had been healed not by the order of the Law but by the grace of God above the Law; and, as the sacrifice is enjoined according to the precept of Moses, the Lord might show that he was not destroying the Law but fulfilling it, he who, while walking according to the Law, was seen to heal above the Law those whom the remedies of the Law had not healed. And well did he add: as Moses commanded; for the Law is spiritual, and therefore he is seen to have enjoined a spiritual sacrifice.

Indeed he added: that this may be for a testimony to you, that is: if you believe God, if the leprosy of impiety departs, if the priest is a knower of hidden things, if he is a witness of a pure disposition, by what can he be seen to be a priest more than he from whom hidden things are not hid, to whom it is said: You are a priest for ever according to the order of Melchizedek?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
