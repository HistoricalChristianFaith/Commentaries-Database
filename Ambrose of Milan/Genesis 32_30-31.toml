[[commentary]]
quote='''
For what days are better than those in which the vision of God shone upon us, as Jacob said? For thus it is written: I saw God face to face, and my soul was saved. And at once the sun rose upon him. Who is this sun, unless he who made the days of righteousness shine, in which Christ was born on earth of a virgin? Jacob saw in figure and said that he had seen God; the Jews saw in truth and did not believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
