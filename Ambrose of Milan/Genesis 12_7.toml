[[commentary]]
quote='''
Then at once God appeared to him. Nowhere above do you find that God had been seen by him. Hence it is clear that it must be referred to this: that as long as he was a Chaldaean, that is, not only in the region but also in the opinion of the Chaldaeans, he could not see God, whom he was seeking within the world. For the Chaldaeans say that the world is the higher god, as also the s . . . . . ticarum houses, and they assert that the things that are earthly are borne by the course of the stars and held in check by a certain bond. Hence they have also called the stars gods, because they believe that they have a certain dominion from on high, since there is a certain sympathy of the stars with earthly things. But they ought to have reckoned that one who suffers with others cannot also have, as a god, an imperial right or dominion over those things with whose suffering it falls sick, since it is itself also mortal and corruptible. The world too, since it was made, is certainly not itself God, but he is its maker and founder. Therefore, as long as the mind is bent by Chaldaean errors, it does not see God, whom it seeks among the things that are seen, not among the things that are not seen. But the things that are seen are temporal; for the things that are not seen are eternal. But God is not temporal; therefore he is not seen. Therefore that mind does not see God which follows the teaching of the Chaldaeans. Hence Abraham too did not see him at first. And how could he see him above whom he thought there was another? But when he moved over, not to another region, but to the true religion made ready for humility — for this is what Canaan means —, then he began to see God and to know that he is God by whose invisible power he perceived that all things are ruled and governed. This, then, Scripture teaches, that Abraham, moving away from the observation of the stars, saw God.

A confirmation of the testimony is added, in that in that place he built an altar to the Lord who had appeared to him. For this strong type was impressed on his soul, and a plain faith in the truth; for memory is at hand for a grateful man, forgetfulness creeps in on an ungrateful one. In the former, those by whom he is helped cling fast; from the latter, all that is bestowed slips away. He set up an altar, however, but he did not sacrifice. This might disturb you, did you not remember that, in the order of Scripture, progress is kept for this mind. And therefore he was waiting to learn from God the manner of sacrificing. For he perceived that the sacrifice of an irrational animal and a dumb beast did not seem a victim worthy of divine worship. He had not yet recognized in Isaac the type of the passion to come, Melchizedek had not yet given him the grace of blessing, so that he might know these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 3"
