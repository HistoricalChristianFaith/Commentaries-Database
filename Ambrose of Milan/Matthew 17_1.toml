[[commentary]]
quote='''
But Matthew and Mark recorded that these were taken after six days. Of this we could say: after six thousand years — for a thousand years in the sight of God are as one day —, but more than six thousand years are counted, and we prefer to understand the six days as a symbol, because the works of the world were created in six days, so that through the time we understand the works, and through the works the world. And therefore it is shown that the resurrection will come when the times of the world are fulfilled; or else because he who has ascended above the world and passed beyond the moments of this age, set as it were on high, will await the eternal fruit of the future resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
