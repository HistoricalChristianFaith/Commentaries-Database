[[commentary]]
quote='''
Then, asked whether, if the daughter were unwilling to come, he should lead his master's son there, Take heed to yourself he says that you do not take my son back there. The Lord God of heaven and God of earth took me from my father's house and from the land in which I was born, who spoke to me and swore, saying: To you I will give this land and to your seed; he himself will send his angel before you, and you shall take a wife for my son from there. If the woman will not come with you into this land, you shall be clear of this oath. Consider more carefully what this is to profit. It is not lawful for you to take a foreign woman. Certainly, if she makes herself a Christian, you will even have praise from her. But if she refuses to become a Christian, let not the desire of marriage turn you from the faith: so the reading instructs. Abraham advised that she be brought if she followed, that she not be sought if she stayed behind, and that his son not go there. Certainly the mercy of his Lord, who had led him away from his sojourning in the land in which he was living, would not be lacking, so as to go before the zeal of the suitor and incline the girl's mind. He said this as a prophet in the matter of his son, and as a moral teacher he taught us to hope in the Lord, who deigns to help one who seeks the increase of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
