[[commentary]]
quote='''
Yet David says in this place that they seem to have found nothing, and that therefore his enemies spoke vanity, since they found nothing that they could speak for the truth. "Or surely because, even if I have sinned, I was nevertheless cleansing my sins with the grief of penitence; in this they spoke with me in deceit, to confound me with reproach and call me back from conversion." And see whether he did not rather mean this: that they sought out evils of his, but, when they wished to accuse him, were forestalled, because he himself had laid bare his wounds, being his own accuser, and that therefore the force of their accusation was weakened, and they spoke things empty of truth, which could no longer harm one who had confessed his guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
