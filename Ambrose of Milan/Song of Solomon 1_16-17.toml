[[commentary]]
quote='''
In the very book of the Song of Songs, too, Solomon clearly expressed this threefold wisdom, although in Proverbs he said that whoever wished to hear his wisdom should write it down for himself threefold. So in the Song the bride says of the bridegroom: behold, you are handsome, my kinsman, and indeed beautiful: our resting place is shaded, the beams of our houses are cedars, our ceilings are cypresses. We can take this of moral things. For where do Christ and the Church rest but in the works of his people? Indeed, where there was unchastity, where there was pride, where there was iniquity, there the Lord Jesus says: but the Son of Man has nowhere to lay his head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Note that often in this book of the Song of Songs Solomon has plainly expressed that threefold wisdom, namely moral, natural and mystical, as he had said in Proverbs: that whoever wished to hear his wisdom should write it down for himself in threefold manner. So the bride says of the bridegroom in the Song of Songs: Behold, you are beautiful, my kinsman, behold, you are beautiful and comely; our resting place is shady, the beams of our houses are cedars, our panelled ceilings cypresses (Song 1:15 and 16). We can take this of moral things; for where do Christ and the Church rest, if not in the works of his people? In short, where there was unchastity, where pride, where iniquity, there the Lord Jesus says: But the Son of Man has nowhere to lay his head (Matt. 8:20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
