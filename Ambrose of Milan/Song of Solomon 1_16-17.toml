[[commentary]]
quote='''
In the very book of the Song of Songs, too, Solomon clearly expressed this threefold wisdom, although in Proverbs he said that whoever wished to hear his wisdom should write it down for himself threefold. So in the Song the bride says of the bridegroom: behold, you are handsome, my kinsman, and indeed beautiful: our resting place is shaded, the beams of our houses are cedars, our ceilings are cypresses. We can take this of moral things. For where do Christ and the Church rest but in the works of his people? Indeed, where there was unchastity, where there was pride, where there was iniquity, there the Lord Jesus says: but the Son of Man has nowhere to lay his head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
