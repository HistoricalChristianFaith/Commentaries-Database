[[commentary]]
quote='''
Fools then are not free, for it is said to them, Be ye not like to horse and mule, which have no understanding, whose mouths must be held with bit and bridle lest they fall upon thee. Great plagues remain for the ungodly; for they have need of these, in order that their folly may be restrained. It is good discipline which requires this, not severity. Further, he that spareth his rod hateth his son: for a man's own sins scourge him still more severely. For heavy is the weight of crime, heavy the scourges of sin; they are heavy as a sore burthen, they inflict wounds upon the soul, and make the ulcers of the mind to stink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252031-40.html'
source_title="Letter 37, To Simplician, 41"

[[commentary]]
quote='''
Take care not to be bent over like cattle. See that you do not incline—not so much physically as they do, but morally. Have regard for the conformation of your body and assume in accordance with it the appearance of loftiness and strength. Leave to animals the sole privilege of feeding in a prone position. Why, contrary to your nature, do you bend over unduly in the act of eating? Why do you find delight in what is a violation of nature? Why do you feed on the things of the earth like cattle, intent on food both day and night? Why do you dishonor yourself by surrendering to the allurements of the body, a slave to the whims of appetite? Why do you deprive yourself of the intelligence with which the Creator has endowed you? Why do you put yourself on the level of the beasts? To dissociate yourself from these was the will of God, when He said: ‘Do not become like the horse and the mule who have no understanding.’

If the voracity and intemperance of the horse and his whinny of pleasure directed toward the mare give you delight, you should also find pleasure ‘with bit and bridle to bind fast your jaws.’ If you revel in ferocity, the dominant trait of savage beasts for which reason they are slain, see that you, too, may not become a victim of your own atrocious cruelty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
