[[commentary]]
quote='''
The soul dies to the Lord, not through natural infirmity but through the sickness caused by guilt. This type of death is not the release from this life but is the fall resulting from sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Death of Satyrus 2.36"
