[[commentary]]
quote='''
The soul dies to the Lord, not through natural infirmity but through the sickness caused by guilt. This type of death is not the release from this life but is the fall resulting from sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Death of Satyrus 2.36"

[[commentary]]
quote='''
But there are three kinds of death. One is the death of sin, of which it is written: the soul that sins, it shall die. Another is mystical death, when someone dies to sin and lives to God, of which the Apostle likewise says: for we were buried together with him through baptism into death. The third is the death by which we complete the course and the task of this life, that is, the parting of soul and body. We observe, then, that one death is evil, if we die because of sins; another death is good, by which he who has died is justified from sin; the third death is in between, for it both seems good to the just and is to be feared by most, and though it releases all, it delights few.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"

[[commentary]]
quote='''
So the soul which cleaves to that invisible good, God, the immortal, itself also flees these bodily things and abandons earthly and mortal things, and becomes like that which it desires and in which it lives and is fed. And because it is intent on the immortal, it is not itself mortal. For the soul that sins dies, not indeed by any dissolution of itself, but it deservedly dies to God, because it lives to sin. So the soul that does not sin does not die, because it abides in its own substance, abides in virtue and glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"
