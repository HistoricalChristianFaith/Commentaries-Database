[[commentary]]
quote='''
But the joy of the souls of the just is set out through certain orders. First, that they have overcome the flesh and have not been bent by its allurements. Next, that as the price of their diligence and innocence they obtain security, and are not entangled, as the souls of the ungodly are, in certain errors and disturbances, nor tormented by the memory of their vices and driven about by certain surges of cares. Third, that they are upheld by the divine testimony that they have kept the Law, so that at the final judgement they do not fear an uncertain outcome of their deeds. Fourth, that they begin to understand their rest and to foresee their future glory, and, soothing themselves with that consolation, they will rest in their dwellings in great tranquillity, surrounded by the guard of angels. The fifth order, moreover, holds the sweetness of the most abundant exultation, that from this prison of the corruptible body they have come into light and liberty and possess the inheritance promised to them. For there is an order of repose, because there is also one of resurrection. For as in Adam all die, so also in Christ, he says, shall all be made alive, but each in his own order: Christ the firstfruits, then those who are Christ's, who have believed in his coming, then the end. There will therefore be a diverse order of brightness and glory, just as there will be an order of merits. The progression of the orders, too, expresses a progression of brightness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 11"
