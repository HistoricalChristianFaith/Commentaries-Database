[[commentary]]
quote='''
Let some now say that Jacob was not blessed when he was in the very days of his death, he who held almost more converse with God than with men; not blessed when his eyes were heavy with old age and he could not see; for to some blindness seems to be a grievous hardship of misfortune. But even then Jacob was blessed, because he discerned by the spirit those whom he could not discern with his eyes and his sight. He saw things to come, he who was thought not to see things present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
