[[commentary]]
quote='''
And their sepulchres are their houses for ever, their tabernacles in progeny and generation; they have called their names in their own lands. Everywhere Scripture reckons sepulchres among base things, to which the degenerate and those greedy for this life are compared: Their throat is an open sepulchre. For these, then, who live from day to day, sepulchres serve as houses. For the house of the righteous is not on earth but in heaven, as the Apostle taught, saying: But our citizenship is in heaven. That is our house which is the house of Christ, whence Scripture says: And Moses indeed was faithful in all his house as a servant, for a testimony of the things which were to be spoken, but Christ as a son in his own house. For the devout, then, the house is the Church, for the devout the fatherland is heaven, and therefore the righteous man says: I am a newcomer with you on the earth, and a sojourner, like all my fathers. For the luxurious the house is a sepulchre; indeed, they live as in a sepulchre who can say: Let us eat and drink, for tomorrow we shall die, not having the resurrection before their eyes. And therefore, fixed to their tombs and entombed in them, they cling to them, since they did not believe that they could be raised again. Their dwelling-place, then, is in their own grave, and their tabernacle is in an earthly progeny and generation, for they leave worms as heirs of their body, so that their memory may be here only and cannot pass into eternity.

Then their names in their own lands, since their works are corruptible and earthly, and therefore their names are written there where they preferred to live. But to those who have lifted up their works it is said: Do not rejoice that the demons are subject to you, but rejoice that your names are written in heaven. From this, then, let us understand that it was not idly that the Lord rebuked those who built sepulchres for themselves, or the tombs of the prophets, and adorned them. For the Jews are condemned, who offered to the prophets whom they had slain earthly consolations, not eternal rewards. And therefore he forbids his disciple to bury his father, since he must be intent without ceasing upon the eternal Father. And in the book of Isaiah it is written: What, he says, that you have built and hewn out a sepulchre for yourself? And Mary is rebuked, who was seeking Christ in the tomb. Leave the sepulchres, which those left who, on hearing the voice of the Lord in his Passion, rose from the tombs; do not dwell among the dead, you who live. Hear the voice of Jesus raising you up: Rise, you who sleep, and arise from the dead, so that the light of Christ may be poured into you for ever. His light is the Holy Spirit, who shone upon the holy apostles like fire in the dividing of the tongues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
