[[commentary]]
quote='''
Or is this not the region of the dead, where there is the shadow of death, where the gate of death, where the body of death? Then it is granted to Peter that the gates of hell shall not prevail against him. These gates of hell are earthly ones, whence he too says: You who lift me up from the gates of death. For just as there are gates of justice, in which the saints confess to the Lord, so there are gates of crimes, in which the ungodly have denied the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
