[[commentary]]
quote='''
Indeed, all who were suffering famine were sent to Joseph. Who are these, except those of whom it was said: They will return at evening and suffer hunger like dogs? And the famine was not of one place but of the whole earth, because there was none who did good. Therefore the Lord Jesus, taking pity on the fasting of the world, opened his granaries and laid open the hidden treasures of knowledge and wisdom of the heavenly mysteries, so that no one should lack nourishment. For Wisdom said: Come, eat my bread, and therefore The Lord feeds me, and I shall lack nothing is said by him alone who is filled by Christ. Christ, then, opened his granaries and sold, seeking not coin of money but the price of faith and the wage of devotion. And he sold not to a few in Judaea, but he sold to all, so that he might be believed by all the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
