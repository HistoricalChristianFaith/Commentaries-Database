[[commentary]]
quote='''
When the waters receded, it was proper that a special aspect and charm be bestowed on the earth so that it would cease ‘to be invisible and without form.’ For many maintain that a thing is invisible because it has no special aspect. For that reason they hold that the earth was invisible —not because it could not be seen by the most high God or by His angels, but because it was without a special aspect. It could not be seen by men or even beasts because they had not yet been created. What provides this aspect for the earth is the soil’s verdure and vegetation. Hence, in order to bestow visibility and form on the earth, God says: ‘Let the earth bring forth the green herb and such as may seed and the fruit tree yielding fruit after its kind, which may have seed in itself upon the earth.’

Let us pay heed to the words of truth! Their content is the salvation of those who hear! For that first declaration of God is a law of nature which requires that every creature be born. This law has continued in force for all ages, with the intent to prescribe how a continuous succession of plants may experience in time to come modes of generation and fructification. And so, first there is germination, when the seeds seem to burst forth newly born; next, when the sprout has burst forth and becomes a green shoot; when the green shoot has grown a little it becomes the green herb. How serviceable, how effective, is the speech: ‘Let the earth bring forth the green herb,’ that is so say, let the earth bring forth of itself, let it not seek the aid of another, let it not be needful of any other ministrations.

Many, it is true, are accustomed to state that the earth could not have germinated without the warmth of the sun’s temperate heat and in some way by its fostering rays. Hence, the Gentiles bestow divine honors on the sun, because it penetrates the bowels of the earth with the power of its heat and in that way cherishes the scattered seed or frees from the bonds of frost the sap of the trees. Listen, then, to God who utters words like these: Let the foolish speech of men be silent for future time, let their baseless opinions cease to be! Before the light of the sun shall appear, let the green herb be born, let its light be prior to that of the sun. Let the earth germinate before its receives the fostering care of the sun, lest there be an occasion for human error to grow. Let everyone be informed that the sun is not the author of vegetation. The earth is freed through the clemency of God; the fruit of the earth emerges therefrom through His indulgence. How can the sun give the faculty of life to growing plants, when these have already been brought forth by the life-giving creative power of God before the sun entered into such a life as this? The sun in younger than the green shoot, younger than the green plant!

And perhaps some may wonder why sustenance for animals was provided before food for man was created. In this matter we ought to take note of the depths of God’s wisdom, in that He does not neglect the least of things. For, the divine Wisdom utters these words in the Gospel: ‘Look at the birds of the air, they do not sow or reap or gather into barns, yet your heavenly Father feeds them. Are you of much more value than they?’ If these have their food through the kindness of God, then no one ought to pride himself on his own industry and natural ability. And no one ought to give simple and natural food precedence over the rest. The former is the food of the temperate; the rest of foods contribute to delight and luxury. One is common to all living things; the other, to a few. Hence, such a fact furnishes us with an example for frugal living, and is a wise injunction that we ought to be content to live on simple herbs, on cheap vegetables and fruits such as nature has presented to us and the generosity of God has offered to us. This sort of food is wholesome and useful, too, in that it wards off disease and prevents indigestion. No human labor has provided it; it is, rather, the bounteous gift of God. Vegetables are at hand which were not sown; there is fruit that needed no seed—all so sweet and pleasant that they furnish enjoyment even to those who have already sated themselves. In a word, the food that was used for the first course continued to be used for the second.

What more need I add to the theme of the marvels of this creation and to the proof of the existence of a Creative Wisdom? For, in the appearance of a bud on the one hand, and in the provision of a green herb, on the other, there lies an image of the life of man and what may be termed a clear indication and mirror of our nature and of our condition. That green herb and flower of the field are a figure of the flesh of man, as the true interpreter of divinity has expressed in organ tones: ‘Cry! What shall I cry? All flesh is grass and all the glory of man is as the flower of the field. The grass is withered and the flower is fallen, but the word of the Lord endureth forever.’ This is the thought of God though uttered by the voice of man. God says: ‘Cry,’ but He speaks in the person of Isaias, who answered: ‘What shall I cry?’ and, as he had heard what he should say, added: ‘All flesh is grass.’ And with truth, for the glory of man waxes green in his flesh like grass, and what is considered to be sublime is actually a lowly green herb. Blooming early as a flower and briefly as the green herb, it has the outward appearance of vigor, but its fruit has no lasting quality. It displays like a flower the joys of a happy existence, but is destined to pass away in all too brief a moment like the green herb, ‘which withereth before it be plucked up.’ For what strength can there be in flesh, what enduring quality can there be in health?

Today you may behold a youth who is strong and vigorous in the flower of his age, pleasing in aspect and with the fine glow of health. Tomorrow you meet the same youth, but how changed are his form and features! The young man who the previous day appeared to luxuriate in health and beauty is now an object of pity, prostrate and weakened by the inroads of some illness. Toil or want take their toll of health: some suffer from stomach ills; others from abuse of wine. Still others are enfeebled by old age; others are emasculated and disfigured by overindulgence in pleasure. Is it not true that ‘the grass is withered and that the flower has fallen?’

Another man, who claims nobility from his grandfather and great-grandfather and has been made illustrious by the insignia of offices held by his ancestors, a man renowned by the trappings of his noble birth, abounding in friends, surrounded on both sides by a crowd of clients who accompany him like a troop of slaves to and from his house—should this man suddenly find himself faced with some passing peril, he is abandoned by all, he is shunned by his friends and assailed by his relatives. Consider how true it is that the life of man is like the grass of the field, ‘which withereth before it is plucked up.’

There is also the man who for a long time has had abundance of wealth, the fame of whose generosity has flitted over the lips of every man, a man renowned for his honors, outstanding in power, with a lofty seat in the tribunals, enthroned aloft and regarded as happy by the populace while he is being announced by the cries of the heralds. By a sudden change of fortune he is dragged away into the same prison into which he himself had cast others. Among his own victims he bewails in anguish his impending punishment. What crowds of sycophants and what a invidious procession of throngs of people had formerly conducted him from his home! Just one night put an end to the splendor of that triumphal pomp! Human glory of this kind is like a flower of the field which, even when it is taken away, contributes nothing to the labor. From it no fruit is obtained and, when it is allowed to fall, it fades away, depriving man of the protective covering by which he is shaded from above and animated within.

Would that we could imitate the green herb concerning which the Lord speaks: ‘Let the earth bring forth the green herb and such as may seed and the fruit tree yielding fruit after its kind of a like nature.’ Let us sow, therefore, the seed after its kind. What that kind is, hear the Apostle who says that we ought to seek after that divine seed, if we would succeed in any way in finding the divine: ‘Though he is not far from any one of us. For in him we live and move and have our being as some of you,’ he adds, ‘have said: “For we are also his offering.”’

Following this principle, let us sow the seed, not in the flesh, but in the spirit. For we ought not to sow carnal seeds, but spiritual ones, if we desire to attain eternal life. And what that ‘likeness’ is you are not unaware, you who have been made to the ‘image and likeness’ of God. The green herb corresponds to its kind. You do not correspond to your kind. When a grain of wheat is scattered over the soil it returns the gift of its kind; but you degenerate. Grain does not dishonor the true character of its seed; you dishonor the purity of your soul, the vigor of your mind, the chastity of your body.

Do you recognize the fact that you are the work of Christ? With His own hands He formed you, as we read, yet you, Manichaean, you assume for yourself another author. God the Father says to His Son: ‘Let us make man to our image and likeness,’ yet you, adherent of Photinus, say that in the construction of the world there was no Christ. And you, follower of Eunomius, say the Son is unlike the Father. For if He is His image, then He is in no wise dissimilar; rather, He reflects entirely His Father, who impressed on Him the unity of His substance. The Father says: ‘Let us make’; yet you refuse to co-operate. The Son carried out what the Father spoke, yet you deny the equality in Him in whom the Father was well pleased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
But some perhaps may say: How do you account for the fact that deadly poisonous plants grow along with those that are of use, for example, there is found along with wheat the poisonous hemlock, a plant discoverable among those that support life. Unless you are on your guard against it, this plant can injure your health. Found growing among other plants that help to sustain life are hellebore and monk’s hood, which too often delude and deceive the gatherer. But would you find fault with the earth because not all men are good? What is of more consequence, you should realize that not all the angels of heaven were good. The sun itself by its excessive heat parches the ears of wheat and causes the young growing plants to wither, whereas the moon shows voyagers the way and reveals the lurking places of robbers. Is it right, therefore, that we disregard the bounty of the Founder in furnishing us useful things and, just because of certain noxious plants, detract from the forethought of the Creator? Some people act as if everything had to be created for our gourmandizing or as if there was just a trifling amount left by the kindness of God to minister to our appetites. Definite foods have been allotted to us which are known to all, foods which provide us with both pleasure and physical health.

Each and every thing which is produced from the earth has its own reason for existence, which, as far as it can, fulfills the general plan of creation. Some things, therefore, are created for our consumption; other things serve for other uses. There is nothing without a purpose; there is nothing superfluous in what germinates from the earth. What you consider as useless has use for others; as a matter of fact, it often is useful to you in another way. That which does not serve for food has medical qualities, and it often happens that what is harmful to you provides harmless food for birds or wild beasts. Thus, starlings feed on the hemlock without any ill effects, since by their physical nature they are immune to its deadly and poisonous sap. Such sap, in fact, is cold by nature, which, when conducted through fine pores into the region of the heart, by a process of premature digestion is prevented from reaching the vital organs themselves. Those who are expert on the nature of hellebore say that it provides food and sustenance to quails and that through a certain natural composition of their bodies these animals become immune to its harmful effects. The fact is that through medical science this plant frequently serves to preserve the health of the human body, to which it seems to be adverse. As a consequence, what the doctor’s hand converts to the preservation of our health becomes even to a greater degree, through its natural qualities, a means for providing food for others. Slumber is often induced, too, by the use of the mandrake, whenever the sick are troubled by their inability to sleep. Why need I speak of opium which has come to be used almost daily, inasmuch as severe intestinal pains are allayed by its use? And it has not escaped our notice that the ravings of the sensual passions frequently have been stayed by hemlock and that with hellebore the prolonged sufferings of a sick body have found relief.

The Creator, therefore, is not liable to blame in these matters; actually, His bounty is increased thereby, inasmuch as what you believed was created to bring danger to you is designed to bring to you health-giving remedies. That which leads to danger is directed otherwise by Providence and what is conducive to our health is not lost through our own prudence and industry.

Is it true that, following a mysterious urge of nature, sheep and goats have learned to shun what is harmful to them and for this purpose are able to make use of smell alone, since they are devoid of reason? Do they not go so far as to recognize a way of avoiding danger and of protecting their health? Do they not distinguish between what is likely to be noxious and what will be beneficial? So true is this that they are said frequently to look for herbs known to them and to apply these as a remedy to a wound when they sense that they have been hit with poisoned weapons. Food, therefore, becomes for them a medicine. As a result, you may behold arrows in the act of falling from a wound, the poison actually vanishing and not adhering. Furthermore, poison is a food for stags. The snake flees a stag and slays a lion. The dragon winds himself around an elephant, whose downfall brings death to the victor. Thus, they both strive with their utmost strength, one to bind fast the other’s foot so that the fall of the vanquished cannot harm him; the other, so that he may not be surprised in a narrow passageway when trailing the herd and thus be caught by a hind leg. In such a situation the elephant would be unable to turn around and crush the dragon with his heavy foot or have the assistance of another elephant at his rear.

Therefore, if irrational animals know what herbs may serve as medicine or what methods may bring assistance to them, can man, who is born with the faculty of reason, be ignorant of this? Or is he such a stranger to truth that he cannot at all perceive what are the uses especially designed for everything? Or is he so ungrateful for the good things provided by nature that, because a draught of bull’s blood is deadly to man, this laborious animal ought not for that reason be born or ought to be created without blood? Yet, he possesses a quality which is useful in the cultivation of the fields, adaptable for the service of ploughing and for sustenance, a precious possession. By his manifold uses he in a sound prop to farmers, for whom—should they come to know their own blessings—God has created all things with the words: ‘Let the earth bring forth the green herb and such as may seed after its kind.’ For He has included in this statement not only what contributes to the farmers’ support from herbs, roots, trees and other plants which grow without seed, but He also includes such produce as is acquired by the industrious skill of the toiler of the fields.

How fitting is it that He did not command the earth generously to give forth seed and fruits, but ordained that the fields should first germinate and then bring forth plants. Next He bade the seed to grow according to the specific nature of its kind, so that at no time would the landscape be without its charm; first, the verdure of spring for our pleasure, and later the heaped-up piles of harvest for our use.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
And the Lord commanded: ‘Let the earth bring forth the green herb and the fruit tree yielding fruit after its kind, whose seed is in it,’ lest someone may say that neither fruit nor seed appears in many trees and lest a person may think that the divine command is faulty in some respect, by which, in fact, truth may be called into question. Let such a person take note that it can never happen that all things that grow should not eventually spring up out of seeds or possess some qualities which seem to be in keeping with the vital power of seeds. If we pay particular attention to this matter, our understanding of the facts will be aided by the clarity of the evidence. For example, willow trees do not seem to have seeds, but they have in their leaves a kind of kernel which has the efficacy of a seed. When this is committed to the earth, there arises a tree as if it came from a planted sucker. It comes to life as if from a seed. From that kernel a root is truly formed. From the root not only is the willow developed, but there grows a forest of other trees of like kind. The root, too, has the generative quality of a seed; hence, many have propagated their groves by such a process as this.

The power of God is great in everything. Let no one wonder if I have stated that the power of God is great in plants, since He has said that His power was great in the locusts and in the bruchus, for the reason that by the affliction of sterility and famine they punished the offenses to His divine majesty. For great is the power of His patience; great, too, of His providence. Unworthy were they who had injured the Creator of the earth to enjoy earth’s fruitfulness! And He is truly great in avenging such great impiety with misery and famine. Hence, if the earth brought forth the sterile bruchus by the mighty power of God, how much greater is the power which brings into being that which is fertile!

Who on seeing a pine cone would not marvel at the art that is indelibly impressed on nature by the command of God and at the fact that, although extended at unequal lengths, the sheath arises from the center core in homogeneous fashion, whereby it protects its own fruit. Hence it preserves the same appearance and arrangement all around. And in every place there is a surplus of kernels and in the circle of the year there comes the blessing of the fruit. Therefore, in this pine cone nature seems to express an image of itself; it preserves its peculiar properties which it received from that divine and celestial command and it repeats in the succession and order of the years its generation until the end of time is fulfilled.

But as in this fruit nature imprints a pleasing representation of itself, so, too, in the tamarisk, that is, in the humble plants, nature has impressed an image of its unrelenting artfulness. For, just as there are men everywhere who are double-dealers at heart, who, while they show themselves to be gracious and unaffected in the presence of good men, cleave to those who are most vicious—so in a similar way these plants have a contrary tendency to spring up in both well-watered regions and in desert lands. That is why Jeremias compared dubious and insincere characters to tamarisks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
