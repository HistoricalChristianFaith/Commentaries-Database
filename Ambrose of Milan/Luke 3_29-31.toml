[[commentary]]
quote='''
Beautifully, too, did Luke, since he could not include the many sons of Jacob, lest he should seem to wander outside the generations in a superfluous series, nevertheless judge that in others, that is, in much later ones, the names of the patriarchs were by no means to be passed over, but chosen before the rest: Joseph, Judah, Simeon and Levi. For in those whose descendants these are we know there were four kinds of virtues: in Judah, that is, the earlier one, the mystery of the Lord's Passion was prophesied through a figure; in Joseph an example of chastity went before; in Simeon the avenging of wounded modesty; in Levi the office of the priest. Through Nathan too we notice the dignity of prophecy expressed, so that, since Christ Jesus, being one, is all things, in each of his forebears too different kinds of virtue should go before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
