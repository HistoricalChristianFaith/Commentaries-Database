[[commentary]]
quote='''
Why do we seek empty gain at the loss of a precious soul? The whole world is little to you against the loss of one soul; for what does it profit a man if he gain this world, but suffer the loss of his own soul? Or what exchange will you give for your soul? It is not redeemed with gold, not with silver; rather, it is lost by gold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
