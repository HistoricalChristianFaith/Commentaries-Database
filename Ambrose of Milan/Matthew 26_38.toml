[[commentary]]
quote='''
(ill. Luc. 22:43.) He is sorrowful, yet not Himself, but His soul; not His Wisdom, not His divine Substance, but His soul, for He took upon Him my soul, and my body.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Not because of death, but unto death is the Lord sorrowful, because it was the condition of bodily affection, not the dread of death, that struck him. For he who took up a body had to undergo all things that belong to the body, to hunger, to thirst, to be straitened, to be saddened, but the divinity cannot be changed through these affections. At the same time he shows that in the contest of the Passion the death of the body is a release from anxiety, not a heaping up of pain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Yet we cannot deny that it suffers along with its body. For it is also saddened, since Jesus says: My soul is sorrowful even unto death, expressing in himself the feeling of a man, and elsewhere: My soul is troubled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 7"
