[[commentary]]
quote='''
Is not the life of man on earth a trial, and his life like that of a daily hireling, or like a servant fearing his master, who covers himself under a shade, or like a hireling awaiting his wages? So I too have waited for empty months, and nights of pains have been given to me. If I rest, I say: When is it day? If I rise, again: When is it evening? I am full of pains from evening until morning. My body ferments in the rot of worms, and I melt the clods of earth, scraping the matter of my sores. But my life is lighter than a tale; it perishes in empty hope. I shall say: My bed will console me. You terrify me in dreams and strike me down in visions.

How wretched is the condition of man, which, like a hireling, labours for others, is in want for itself, and cannot sustain itself except by another's mercy! Daily under dread, under fear, it endures a heavy servitude, and, so as not to be caught by its master, wandering and fugitive, it thinks it can hide under some shade of this world. Consider that man of whom Sirach says in Ecclesiasticus: Every man who transgresses on his bed, despising and saying in his soul: Who sees me? Darkness surrounds me, and walls. Whom do I fear? Does he not seem to you truly to be a hireling, who ..... has squandered, like that young man in the Gospel who, it is read, ..... the portion of the substance received from his father, and, needy and destitute, to relieve his hunger, began to feed another's flocks, so as to earn his own keep by a wage? But that one was nevertheless at length converted, because he returned to his father and did not suppress his sins but disclosed them; whereas this man, who thinks he is not seen by him who sees all things and supposes that his misdeeds can be hidden by darkness, holds a shade before himself, but in vain believes that he lies hidden, since the eye of the Lord, brighter than the sun, catches out all hidden things, illumines what is dark, penetrates the conscience of the inmost heart and descends into the heights and the depths. Vain, then, is he who thinks he is safe in darkness, since he cannot avoid the light which shines in the darkness, and the darkness does not comprehend it. Like a fugitive, therefore, and a bad hireling, he is caught, and he is recognized before he hides himself, because all things are known to the Lord before he seeks them, not only what has been done but also what is to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapters 2-3"

[[commentary]]
quote='''
For what is this life but full of snares? We walk among snares, we move among very many temptations. Then the same man says above: is not the life of man on earth a temptation? He did well to add on earth, because there is a life of man in heaven too. Like a hireling's wage, he says, is his life, in toil, that is, and in warmth, lighter than tales, wavering and swimming in words, his habitation in houses of clay and his very life in clay. No firmness of judgement, no constancy. In the day night is longed for, in the night day is sought; before food, groaning; at meals, weeping, tears, pains, fears, anxieties; no rest from disturbances, no reclining from toils. The movement of anger and indignation is rather fierce. Many desire death and do not obtain it; but if they obtain it, they rejoice, because death alone is rest for a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
