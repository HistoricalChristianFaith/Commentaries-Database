[[commentary]]
quote='''
But since the Law was able to stop the mouths of all and was not able to convert the mind, therefore the last remedy of that final city was owed, in which there should be a saving refuge, so that the death of the prince of priests might free us from all dread of death and strip us of fear.

Who is he but the one of whom it has been read: Behold the Lamb of God, behold him who takes away the sin of the world? Whom God has set forth as a propitiator through faith in his blood, for the showing of his justice. And understand that he himself is the great prince of priests. The Father swore concerning him, saying: You are a priest for ever. Rightly for ever, because all the others, being temporal, are under sin, but this one has an inviolable priesthood. All are under death, but this one is ever living, since how could he who is able to save others perish himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 3"
