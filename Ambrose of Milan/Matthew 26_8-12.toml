[[commentary]]
quote='''
The disciples, then, were complaining because the woman poured ointment over his head, and they grumbled, saying: why is this wasted so? For it could have been sold for a price and given to the poor. What exactly was displeasing in their words you cannot detect unless you understand the mystery; for to smell of ointment is the mark of a luxurious man, or rather of one who is no man. Certainly even those who smell of it are wont to anoint themselves, not to drench themselves. What is displeasing in its being said: this could have been sold for a price and given to the poor? Certainly he himself had said earlier: whatever you have done to one of these least, you have done to me; but he himself was offering his own death for the poor.

It is not, then, a simple figure; and therefore the Word of God answered them: why do you trouble the woman? The poor you have always with you, but me you do not have always. You always have the poor man with you, then, and therefore do good. You ought not, then, to put off the poor man because he is always with you, since the prophet says to you: do not say to the poor man: tomorrow I will give. But he spoke of mercy alone, while here he has put faith before mercy, for mercy has merit only if it is bestowed with faith going before; for in putting this ointment on my body she did it for my burial. So it was not the ointment that the Lord loved, but charity; he accepted faith, he approved humility.

You too, if you desire grace, increase charity; put upon the body of Jesus faith in the resurrection, the odor of the Church, the ointment of common charity. And so, going further, you will give to the poor. That money will profit you more if you do not hand it out as something overflowing, but bestow it in Christ's name as something that will profit; if you so give it to the poor man that you bring it to Christ. Do not, then, take the ointment poured over the head according to the letter only — for the letter kills — but according to the spirit, because the spirit is life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
What, then, is this woman's ointment? Who can hear this? Who has such ears that, when Jesus speaks the word which he received from the Father, or rather since he himself is the Word, he can grasp so great a depth of mystery? Even the disciples understand in part, although they do not understand the whole. Hence some think that the disciples said that the faith of the Gentiles ought to have been bought with the price of the ointment, faith which was due only to the price of the Lord's blood; and this seems likely. Indeed, John the evangelist brings in the saying of Judas Iscariot, that the ointment was valued at three hundred denarii, as you have it: for it could have been sold for three hundred denarii and given to the poor. Now the coins of three hundred declare the sign of the cross; but the Lord seeks not a perfunctory foreknowledge of the mystery, but rather wishes the faith of believers to be buried together in him.

This, however, we understand of the words of the other apostles; but Judas is condemned for avarice, for he preferred money to the Lord's burial, and even if he had some sense of the Passion, he erred in so costly a sale. Christ wishes to be valued cheaply, that he may be bought by all, so that no poor man may be deterred. Freely he says you have received, freely give. The depth of riches seeks not money, but grace. He himself bought us with precious blood; he did not sell us. Of this we would speak more fully, did we not remember that we have treated it ourselves elsewhere.

So, according to the sayings of the Lord, in whom are hidden the treasures of wisdom and knowledge, which no one could foresee, I must work at his burial, so that his flesh may be believed to have rested and not to have seen corruption, and the death of his body may so fill our house with its odor that we believe that he commended his spirit into the hands of the Father, and that the divinity, set apart from death, did not undergo fellowship in bodily sufferings.

Understand how the body of the Son smells of ointment. That body is one which was put off, not one which was lost. His body is the traditions of the Scriptures, his body is the Church. We are the odor of his body, and therefore it is fitting that we adorn the death of his body, even if that death does not need our adornments; but the poor need them. I will adorn his body if I become a preacher of his words and can open to the Gentiles the mystery of the cross. He adorned it who said: we preach Christ crucified, to the Jews indeed a stumbling block, to the Gentiles foolishness, but to those who are called, Jews and Greeks, Christ the power of God and the wisdom of God. The cross is adorned when that which through ignorance is thought foolish is through the Gospel judged to be wiser, so that we can teach how the adversary power is destroyed through the cross of the Lord. I have put ointment upon the Lord's body: what was thought dead begins to breathe fragrance.

Therefore let each one undertake to buy, by his own labor and the striving of virtues, an alabaster box of ointment, not some cheap and common one, but precious ointment of alabaster and pistic ointment. For if anyone gathers the flowers of faith and preaches Jesus Christ crucified, he pours the ointment of his faith into the whole Church, which is the body of Christ, dead to the world, resting in God. The whole house begins to smell of the Lord's Passion, begins to smell of his death, begins to smell of his resurrection, so that each one of this number of the holy people can say: but far be it from me to glory except in the cross of our Lord Jesus Christ. The odor breathes, the ointment smells in the body, if anyone can — and would that I could! — say with confidence: to me however the world is crucified. Not to one who loves riches, not to one who loves the honors of the world, not to one who loves the things that are his own, but to one who loves the things of Jesus Christ; not to one who loves the things that are seen, but the things that are not seen; not to one desirous of life, but to him who hastens to be dissolved and to be with Christ, is the world crucified. For this is to take up the cross and follow Christ: that we too may die with him and be buried with him, so that we may give off the odor of the ointment which this woman put on him for his burial. No ordinary ointment is this, by which the name of Christ is spread far and wide. Hence it was also said prophetically: your name is ointment poured out; poured out for this reason, that faith might be fragrant with a greater odor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
