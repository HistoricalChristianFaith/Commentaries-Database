source_title="The Six Days of Creation"

[[commentary]]
quote='''
But something must be said on the subject of the human body. Who can deny that it excels all things in grace and beauty? Although it seems in substance to be one and the same with all earthly things, certain wild animals have superiority in strength and size. Yet the form of the human body, by reason of its erectness and stature, is such that it lacks massive hugeness as well as abject lowliness. Moreover, the very appearance of the body is gentle and pleasing without those extremes of size and of insignificance which might lead either to dread or to indifference.

First, let us make note of the fact that the body of man is constructed like the world itself. As the sky is pre-eminent over air, earth, and sea, which serve as members of the world, so we observe that the head has a position above the other members of our body. In the same way, the sky stands supreme among the other elements, just as a citadel amid the other outposts in a city’s defense. In this citadel dwells what might be called regal Wisdom, as stated in the words of the Prophet: ‘The eyes of a wise man are in his head.’ That is to say, this position is better protected than the others and from it strength and prevision are brought to bear on all the rest.

What avail are the strength and vigor of our muscles or the swiftness of our feet without the direction and assistance of the head, its commander-in-chief? From this source comes real support for all the members or their complete abandonment.

To what avail is courage in combat without the aid of the eyes? To what avail is flight, if sight be lacking? The body as a whole may be likened to a dark and filthy prison unless it is illuminated by the visual power of the eye. The eyes in man correspond to the sun and moon in the heavens. The sun and moon are the ‘twin lights of the firmament.’ Our eyes are in our heads like stars which shine aloft and with their bright lights illuminate objects below, thus permitting us to avoid being involved, as it were, in nocturnal darkness. They are our sentries which keep watch day and night. They are aroused from slumber quicker than our other members and on awakening take stock of everything. They are nearer to the brain, the seat of our ability to see.

In answer to those who think that I have made a too hasty descent from the rest of the head in order to praise the eyes, I maintain that it is not unfitting to commend in part that which is most significant in itself. It is clear that the eyes constitute a part of the head. And so with the aid of the eyes the head examines all things. With the ears it lays bare what is secret, obtains knowledge of what is hidden, and hears of events that occur in remote lands.

How gentle and pleasing is the sight of the top of the head, how attractive are its locks of hair, an object of regard for our elders, of reverence for our priests! For warriors, how fear-inspiring, for the young, how pleasing can these locks be, whether arranged becomingly as in the case of women or with the soft sheen of youth! Long hair is unbecoming to one sex; shorn locks do not become the other.

One can learn from trees how charming a human head can be. In the treetop everything stands for fruit, for beauty. The tree’s hair-like foliage shields us from rain storms or protects us from the sun. Take away the tree’s leafy locks and the tree is wholly devoid of beauty. How precious, therefore, is this adornment for the human head! It protects and invests with hair the very center and source of all our senses, the brain, so that it may not be unduly affected by cold or heat! Therein is found the primary source of all our feelings. It is natural that beauty should be the attribute of that which is most sensitive to ill.

What is man without his head, since the totality of man is in his head? When you see a head you recognize a man. If the head is lacking, no recognition is possible. He lies an ignoble trunk, without honor, ‘a nameless corpse.’ Men pay reverence merely to the heads of princes cast in bronze or to their features carved in bronze or marble.

Not without reason, therefore, do the other members pay their respects to the head as to their director. They surround it like servants bearing a litter and carry it aloft as something divine. Hence, it has the power of a censor, whereby directions and orders are given to the servants and special instructions are relayed to each individual. You have there a picture of each man willingly and without pay serving his commander-in-chief. Some serve as porters; others take care of the provisions. Some act as bodyguards; others as orderlies. They obey his orders as chief and minister to him as their master. Before him there seems to precede what may be termed the countersign or standing order, whereby the feet are directed to approach a certain region, enjoining what military service the hands should initiate and complete, and what disciplinary orders should be imposed on the stomach in the way of indulgence or abstention from food.

A forehead free, open and with bare temples, adorns the head. According to its appearance one may judge a person’s state of mind, now joyful or sad, now frowning in moments of seriousness or smooth in moments of relaxation, answering in forensic fashion to one’s inmost wish or will. Here we have a image of a mind giving, as it were, expression to words. Here is a foundation for belief, on which daily the name of the Lord is inscribed and preserved.

A two-fold hedge, the eyebrows, are next in order. These serve as a line of defense for the eyes and have a charm to lighten a beautiful smile and at the same time are attentive to their protective function. If any speck of sand or dirt, drops of misty vapor or of streaming sweat should fall down, the eyebrow serves to check it, so that no obstruction can disturb the delicately formed organs of vision.

Close to these mountain-like eyebrows are arranged the eyes, which are made safer by this bulwark of protection. From their high position they are enabled to perceive all things as if from a loftier stage. A position of less eminence, such as that of the ears, mouth, or cavernous nose, would ill befit the eyes. Watch towers are always placed on high, so that the approach of hostile bands can be detected—bands which are ready to take by surprise a city in the midst of a celebration, together with its people and its proud imperial army.

In this way, too, attacks from robbers may be anticipated, if scouts are placed on walls, towers, or on the brows of a high mountain. From these points the level regions below can be observed where raiding parties can find no hiding place. It happens also at sea that, when the nearness of land is suspected, a lookout eagerly climbs the topmost mast or the high yard arms and announces the sight of a distant land still invisible to the rest of the navigators.

Perhaps you may say that if a watch must necessarily be placed in a high position, why are not the eyes not set in the very top of the head, as in the case of crabs and beetles who have no apparent head, but whose necks and backs are higher than the rest of the body? But these have a tough shell, whereas human beings have a tender covering of skin which can easily be cut and torn by briers and brambles. Moreover, other animals are so constituted that they either can guard their eyes by bending their heads toward their shoulders, as in the case of horses, oxen, and nearly all wild beasts, or turn them, as birds do, toward their wings for complete repose and protection.

It is right that the eyes should be set in the highest part of the body in a sort of citadel, there to defend themselves from all, even from the slightest attacking force. Here we are faced with what appears to be a contradiction. If the eyes were placed in a lower position for reasons of safety, they would be unable to function; if in a higher, they would be exposed to injury. Wherefore, lest anything detract from their usefulness or lest any precaution against injury be not available, God has placed the eyes in a position where the eyebrows above provide no little defense and where the cheeks below contribute their mite of protecting embankment. In addition, the nose offers a covering for the interior position, while the exterior seems to be surrounded by a bulwark of defense in the protuberant masses of forehead and jaw—a structure, notwithstanding its connecting joints, arranged with due evenness and balance.

In the midst of these are found the orbs of the eyes. They are in a secure position for defense. They are free to make observation and, crystal-like, give forth beauty. In their midst are the pupils, which are the organs of sight. To provide for any possible injury, they are encircled with a rampart composed of an orderly arrangement of filaments of hair.

Hence, in requesting help and safety for himself the Prophet says: ‘Keep me, O Lord, as the apple of your eye.’ He asks for the necessary custody and the protection of Him who has deigned to fortify the pupil of the eye with natural palisades. Because innocence and purity may be violated by the intrusion of a slight speck of dust and thus be deprived of the gift of grace, we must for that reason be on our guard lest the dust of error may cloud it or that any speck of sin cause it pain. It is written: ‘First cast out the beam from thy own eye and then wilt thou see clearly to cast out the speck from thy brother’s eye.’

Those skilled in the art of medicine maintain, in fact, that the brain is placed in a man’s head for the sake of the eyes and that the other senses of our bodies are housed close together on account of the brain. The brain is the source of our nervous system and of all the sensations of voluntary movement. From it emanates the cause of all that we have discussed. It is the starting point of the arteries and of that natural heat which gives life and warmth to the vital parts. Many are of the opinion that this starting point is the heart. The nerves serve as organs of each of the senses. These proceed from the brain like cords and musical strings. They fulfill their individual functions throughout the various parts of the body.

Hence, the brain, because it is the gathering point of all the senses, is softer than the other organs. From it emanate the nerves which report everything; for example, what the eye sees and what the ear hears, what odor has been perceived, and what sound the tongue has given forth or what taste the mouth has experienced. That which is softer is more susceptible to impressions. The harder quality of the nervous system, which results in a certain tautness, makes for more efficacy in action.

The sense of hearing has also a highly important function, nearly on a par with that of sight. The ears are rather prominent for this and for several other reasons. They serve a decorative purpose and, secondly, are in the way of anything, moist or otherwise, which may fall from the top of the head. Again, their commodiousness makes it possible for them to receive in their recesses repercussions of sound without the danger of injuring the interior structure. If this were not the case how astonished we would be at the intrusion of any sound or of a voice stronger than usual! Even with our present organs of hearing are we not often benumbed by an unexpected burst of sound? You may note the fact however that they present a bulwark against bitter cold and burning heat. The open passage ways are impenetrable to these same attacks, whether from severity of cold or excess of heat.

The sinuous quality of the interior part of the ear furnishes a basis for training in modulation, since a certain rhythmic movement follows from the natural windings of the ear. The entry of a sound of a voice results, too, in specific tonal modifications. Again, our own experience tells us that such a sinuous character of the ear tends to better receptivity of the spoken word. We see that the voice is rendered gentler and sweeter in situations where we hear an echo in the mountain hollows, in rocky caves, or along winding streams. Not without its usefulness, too, is the wax in the ear. It helps to keep the voice intact, a result which at one and the same time aids the memory and is a source of pleasure.

What shall I say of the form of the nose, which offers for the perception of odors a cave-like structure with its two distended openings? The odor does not pass through in indifferent fashion, but stays long within, so that by this procedure it is able to satisfy fully the brain and the senses. It frequently happens that a transient aroma may continue to stay with you for an entire day. Through the nose, too, flow purgaments issuing from the head in such a way that the body is not adversely affected in the process.

The sense of touch is not without its significance. It represents the keenest sort of pleasure and gives as well an honest report of facts. Frequently, we are able to prove by touch what we cannot do with the aid of the eyes.

Finally, there remain the functions of the mouth and tongue, which furnish strength to all the others. The eyes would not have the power of vision without the substantial basis of physical force provided by food and drink. The ears, nose, and hands would not be capable of hearing, smelling and touching, if the whole body were not sustained by nourishment. Our strength declines unless it is restored by continued absorption of adequate food. For that reason, those exhausted by hunger have no sensation of pleasure in the use of the senses. Not being, as it were, participants, they have no part in the predilections of these senses.

What shall I say of the rampart of teeth built for the mastication of food and for the full expression of the human voice? Without teeth, what pleasure would our daily sustenance give us? Hence we note that in this respect there is often a clear indication that old age has been reached. Because of the loss of teeth, really nourishing food cannot be assimilated.

The tongue, too, fulfills a most important function in eating as well as in speaking. It acts like a plectrum or quill in the production of speech. It might be compared to a hand in the process of bringing to the action of the teeth the food particles that otherwise would tend to fall. Speech has its special function. It is carried through the void on the wings of the air which is affected by this impulsive force, at once stirring and calming the emotions of the hearer, pacifying the angry, lifting up the down-hearted, and consoling the grief-stricken. Granted that man shares his vocal powers with the birds, there is, nevertheless, nothing in the irrational animals which can be equated with the sound of the human voice, provided, as it is, with rational powers.

We share, in fact, with the rest of living beings the ordinary sense channels, but they do not make use of them in the same way we do. The heifer raises her eyes to the sky, but she is unaware of what she sees. This is true, also, of wild animals and birds. All living things have the same liberty to see, but man alone has the will to interpret what he perceives. He gazes at the rising and the setting of the celestial signs. He sees the glory of the sky and marvels at the starry orbs. He is aware of the diverse aspect of each star. He knows when the evening and the morning star arise and why they appear at these times. The movements of Orion, as well as the phases of the moon, are well known to him. He understands how ‘the sun knows the hour of its setting’ and how it preserves its allotted course with due regularity.

Other living beings also have the power of hearing, but who other than man acquires knowledge by the sense of hearing? Man alone of all terrestrial beings is able by listening, reflection, and wisdom to gather the secrets of knowledge. He is able to say: ‘I will hear what the Lord God will speak to me.’ The most important of all things is this: Man becomes the organ of the voice of God and gives utterance with his corporeal lips to the oracular words from heaven, such as: ‘Cry. What shall I cry? All flesh is grass.’ He heard what he ought to say and he cried aloud.

Let those who mark out with a compass the regions of the sky and of the earth keep their wisdom for themselves. Let them have that knowledge of which the Lord speaks: ‘The wisdom of the prudent I will reject.’ Neither the rhythm of a speech nor the tones and notes of musical science will enter into my discussion at this point. I shall confine myself to that wisdom of which the Prophet speaks: ‘The uncertain and hidden things of thy wisdom thou hast made manifest to me.’

What shall I say of the kiss which is a symbol of affection and love? Doves exchange kisses, but what is this compared to the charm of a kiss of a human being in which the note of friendliness and kindliness is conspicuous, and where is expressed the indubitable sense of our sincerest affection?

Hence the Lord, condemning His betrayer as a species of monstrosity, says: ‘Judas, dost thou betray the Son of Man with a kiss?’ That is to say, changing the emblem of love into a sign of betrayal and to a revelation of unfaithfulness, are you employing this pledge of peace for the purpose of cruelty? And thus by the oracular voice of God reproof is given to him who by the bestial conjunction of lips bestows a sentence of death rather than a covenant of love.

It is worthy of note, too, that it is given to men alone to express with their lips what they feel in their hearts. Hence we make evident our tacit mental reflections with the speech that flows from our lips. What is the mouth of man but an avenue for discourse, a fount of disputation, a reception hall for words, a repository of the will?

We have now completed our general discussion of the human body. It can be compared to a royal palace, which, though it has a number of adjoining halls, still preserves the appearance of a unified whole.

To come down to particulars, there is the throat or neck through which vital contacts are made with the whole body and through which, too, the coursing flow of this breath of ours is poured.

Next we have the arms, and the strong fore-arm muscles, together with the hands strong for action and adaptable for holding objects by reason of their prolonged fingers. Hence that greater aptitude for work, that elegance in writing, and that ‘pen of the scrivener that writeth swiftly,’ whereby the oracles of God are set down in writing. It is the hand that serves the mouth with food. Great are the deeds for which the hand is eminent. The hand is placed on the holy altars as conciliator of divine grace. Through it we offer as well as partake in the celestial sacraments. It is the hand which performs and at the same time dispenses the divine mysteries. The Son of God did not disdain to declare by the mouth of David: ‘The right hand of the Lord hath wrought strength: the right hand of the Lord hath exalteth me.’ It is the hand which has created all things, as the omnipotent God has said: ‘Did not my hand make all these things?’ The hand is the outpost of the entire body, as well as the defender of the head. Although it is lower in position, the hand serves to decorate and beautify the top of the head with becoming adornments.

Who can worthily describe the wicker-work of the chest or the tenderness of the stomach? If it were not for these, the more delicate internal organs could not be protected and the folds of the intestines would undoubtedly be injured by the hard structure of bone. What is more conducive to health than that the lungs should hold a position contiguous to the heart? When the heart flares up with anger and indignation, it can soon be moderated by the action of the blood and vapor in the lungs. Again, the lungs are tender because they are ever filled with moisture so as to offset immediately the rigidity induced by indignation.

We have set forth these matters in a fashion so brief and succinct that we seem, in the manner of the unskilled, just to touch on the merely obvious. Our purpose is not to probe deeply like a physician nor is it our design to search into what is hidden far in the haunts of nature.

The close association of the spleen and the liver leads to good results. The spleen absorbs what it feeds on, eliminates whatever refuse is found there. The result is that whatever food is left is able in its liquified condition to pass through the very fine fibers of the liver and is then transformed into blood. This serves to produce vital strength and is not evacuated with the excrements of the body.

The construction of the intestines with their involved folds, woven without entanglement one with the other, indicates nothing else but the divine providence of the Creator, inasmuch as food particles neither pass quickly through the stomach nor are they immediately evacuated. If this were to happen, men would have an incessant hunger and continuous craving for food. For, when the interior is emptied and drained at the moment when the food is being immediately evacuated, an inordinate and insatiable desire for food and drink must necessarily follow—a result which without question may lead to an early death.

It is providentially designed, therefore, that the food be first digested in the upper ventricle and next be liquified in the exhalation of the liver. The resulting fluid is then transfused into the rest of the body. Our limbs are nourished by this substance, providing growth for the young and endurance for the old. The superfluous residue is carried through the intestines and finds its exit by the customary ‘door in the side.’

In Genesis it is fittingly stated that the ark of Noe, was formed in the fashion of the human body. Of the ark God said: ‘Make thee an ark of timber planks. Thou shalt make little rooms and thou shalt pitch it within and without.’ The outward appearance was as follows: ‘The door in the ark thou shalt set in the side with lower, middle chambers and third stories shalt thou make it.’ By this the Lord meant that ‘the door set in the side’ was to be the place through which superfluous food was to be ejected. It is fitting, also, that the channel for refuse was placed by the Creator remote from man’s countenance, so that, when we bend over, our countenance may not be contaminated. At the same time, take note of the fact that the shameful parts of the body are placed there where they cannot cause us shame when they are suitably covered with clothing.

The pulsation of the veins is a messenger either of infirmity or of health. Although the veins are spread throughout the entire body, they are neither exposed nor uncovered. They are sheathed in such a slight coating of flesh that one can easily find then and as readily feel them. There is no thick covering of flesh which can conceal them from view. The bones, too, are all covered with a thin coating of flesh and are bound with the tendons. Those on the top of the head have the advantage of being covered with a thin skin. They are clothed, also, with a thick growth of hair, the better to provide protection against rain and cold.

What shall I say of the genitals, which from the veins in the region of the neck through the reins and loins receive the generating seed destined for the function and satisfaction of procreation?

What shall I say of the purpose of the legs, which, without suffering any ill effects, are sufficient to sustain the weight of the whole body? The knee has a certain flexibility, by reason of which the offended master is especially appeased, his ire softened, and his favors induced. This is the gift of the most high Father to His Son: ‘That in the name of the Lord every knee should bend of those in heaven, on earth and under the earth and every tongue should confess that the Lord Jesus is in the glory of God the Father.’

There are two things which above all others give delight to God: humility and faith. The leg expresses the emotion of humility and the submission of constant service. Faith makes the Son equal to the Father and makes evident that the same glory belongs to each.

That man should have two legs and not more is altogether fitting. Wild animals and beasts have four legs, while birds possess two. Hence man has kinship with the winged flock in that with his vision he aims at what is high. He flies as if ‘on the oarage of wings’ by reason of the sagacity of his sublime senses. Hence it was said of him: ‘Your youth is renewed like the eagle’s,’ because he is near what is celestial and is higher than the eagle, as one who can say: ‘But our citizenship is in heaven.’
