[[commentary]]
quote='''
Man has been depicted by the Lord God, his artist. He is fortunate in having a craftsman and a painter of distinction. He should not erase that painting, one that is the product of truth, not of semblance, a picture, expressed not in mere wax, but in the grace of God. I speak, also, of women. They erase that painting by smearing on their complexion a color of material whiteness or by applying an artificial rouge. The result is a work not of beauty, but of ugliness; not of simplicity, but of deceit. It is a temporal creation, a prey to perspiration or to rain. It is a snare and a deception which displeases the person you aim to please, for he realizes that all this is an alien thing and not your own. This is also displeasing to your Creator, who sees His own work obliterated. Tell me, if you were to invite an artist of inferior ability to work over a painting of another of superior talent, would not the latter be grieved to see his own work falsified? Do not displace the artistic creation of God by one of meretricious worth, for it is written: ‘Shall I take the members of Christ and make them members of a harlot?’ By no means!

He commits a serious offense who adulterates the work of God. It is a serious charge to suppose that man is to be preferred to God as an artist! It is serious, indeed, when God has to say this about you: ‘I do not recognize My colors or My image, not even the countenance which I have made. What is not Mine I reject. Take up your abode with him who has painted you. Seek your favors from him to whom you have given payment.’ What will be your reply?

If it is a serious matter to adulterate the work of God, what shall we say of those who slay the work of God, who shed human blood and take away the life that God has granted? They say: ‘Let us take away the just because he is useless to us.’ Hence we read today in the Gospel: ‘The foxes have dens and the birds of the air have nests wherein to rest; but the Son of Man has nowhere to lay his head.’ So the fox hides himself in a den and the birds protect themselves in their nests. Man, however, does not hide himself in a den—rather, he is beguiled. The mouth of man is a den, and a deep den, too, is the heart of man where injurious and deceptive counsels and thoughts of evil reside.

You make preparations to take a walk while another man is setting a trap for you. ‘You are going in the midst of snares’ which your enemies have planted secretly in your way. Make careful observations, therefore, so as not to be trapped in a net like a deer or in a snare like a bird. The deer avoids the net by the keenness of his vision. The bird escapes the snares by surveying the territory from a point aloft. No one plants his net or conceals his snare up there. And so, one whose ‘citizenship is in heaven’ is not likely to be captured like a bird of prey.

And why do you wonder at man’s deception of man when the Son of Man has nowhere to lay His head? In fact, He has purposedly made man to be such that He could find therein a place to rest His head. But when our neighbors find no repose in our hearts, but traps and snares therein for our fellow men, to whom we ought to give help, then Christ turns His head away from us—this head which He was so willing to offer on our behalf even to the point of death! Do not expose yourself, therefore, to deceitfulness, cruelty and unkindness, so that there may be occasion for Christ to rest His head on you.

Moreover, He did not find rest when He had created such irrational creatures as fish and the various species of wild beasts. He found rest, however, after He had made man to His own image. Give ear to Him as He states on whom He finds rest: ‘Or on whom shall I rest but on him that is humble and gentle and that trembleth at my words?’ Therefore, be humble and gentle, so that God may find rest in your affection.

He who does not find his rest in the beasts of the field will much less find repose in his bestial heart. There exist minds of bestial nature and wild beasts, too, in the form of men, concerning whom the Lord says: ‘Beware of false prophets who come to you in sheep’s clothing but inwardly are ravening wolves.’ God does not find repose in these, but in the actions of man whom He has made to His image and likeness and who ought not to veil his head, since ‘he is the image and glory of God.’

To the soul of such a man He says: ‘Behold, Jerusalem, I have painted thy walls.’ He did not say ‘I have painted thy belly’ or ‘thy lower parts,’ but ‘I have painted thy walls,’ thus proclaiming that the strong protection of walls was granted to man. In this way, by keeping careful watch on the walls, man can ward off the dangers involved in a siege. He says, therefore: ‘I have given you neither delights nor the allurements of desire, neither incentives to luxurious living nor eagerness to possess another’s dignities. You have been granted a substantial basis for erecting walls and lofty turrets by means of which you can banish fear of an enemy’s assault and the dread of terrifying raids from legions of soldiers.’

In fact, you have in Isaias the speech made by the soul of a just man or of the Church: ‘I am a fortified city, I am a city besieged,’ defended by Christ and besieged by the Devil. But he whom Christ aids ought not to be fearful of a siege. He is defended by spiritual grace and is besieged by the perils of this world. Hence, also, it is said in the Canticles: ‘I am a wall and my breasts are as a tower.’ The wall is the Church and the towers are her priests, who have full power to teach both the natural and the moral sciences.

Be fully aware, O beautiful soul, of the fact that you are the image of God. And, man, be aware that you are the glory of God. Hear the words of the Prophet on the question of glory: ‘Thy knowledge is become wonderful to me.’ That is to say, in my work your majesty, O God, has become more wonderful; in the counsels of men Your wisdom is exalted. When I contemplate myself such as I am known to You in my secret thoughts and deepest emotions, the mysteries of Your knowledge are disclosed to me.

Know then, man, your greatness and see to it that you never on any occasion become entrapped in the snares of the Devil, so as not to fall, perchance, into the jaws of that dread beast ‘who as a roaring lion goes about seeking someone to devour.’ Take heed of what goes into you and what comes out. I do not refer to food which is absorbed and ejected, but to words and thoughts. Do not allow yourself to be led into concupiscence in regard to a neighbor’s wife or let your eye be captivated by the beauty of a woman who passes by. Your mind and your conversation should shun being involved in the crafty ways of seduction. Deceit should be far from your thoughts and you should not indulge in slander against your neighbor.

God has made you a hunter, not a harrier, for He says: ‘Behold I will send you many hunters’—hunters, not of crime, but of absolution therefrom; hunters, certainly not of sin, but of grace. You are a fisher of Christ, for whom it is said: ‘Henceforth thou shalt make men live.’ Spread your nets, direct your eyes, and control your tongue in such a manner that you destroy no one, but bring rescue to those who struggle in the waters. He has declared: ‘Let him so stand so as to take heed lest he fall’ and ‘So run as to obtain the prize.’ So struggle that you may often discover that the crown is awarded only to him who has competed according to the rules.

You are a soldier. Then take stock of the enemy, lest at night he may creep upon you. You are an athlete. Come to grips with your enemy, not with your head, but with your arms, lest he strike you in the eye. Let your vision be unobstructed and your offense be cautious so as to parry the attack; take advantage of his weaknesses, ‘shunning blows on the body with watchful eyes’ and repelling the assault by aggressive action.

If you should suffer a wound, take heed and run to a physician, to seek a remedy in repentance. Take heed, because you are made of weak and stumbling flesh. May the good physician of souls, the Divine Word, come to your assistance. May the oracles of the Lord be to you like health-giving medicines. Take heed that no unrighteous word lie hidden in your heart, for it creeps through your body like poison, bringing with it deadly infection. Take heed, lest you forget the God who made you, and do not take His name in vain.

When you have eaten your fill, build a home for your habitation, abounding in flocks and in gold and silver, together with all that you possess in plentiful abundance. Then ‘take heed that thine heart be lifted up and thou remember not the Lord,’ as the Law states.

For ‘what hast thou that thou hast not received?’ Do not these things pass like a shadow? Is not this home of yours but dust and desolation? Are not all these things false? Are not the treasures of the world mere vanities? Are you not yourself just ashes? Look into the sepulchers of men and take note that nothing will remain of you but bones and ashes. Look inside, I repeat, and tell me who in there is rich and who is poor? Distinguish now between the needy and the powerful. Naked we come into this world and naked we leave it. There are no distinctions discoverable among the bodies of the dead, unless, perchance, it may well be that those of the wealthy give forth a stronger odor because they were bloated with luxurious living. Who ever heard of a poor man dying of indigestion? His impoverished condition is beneficial to him. He exercises his body and does not overload it. ‘I have not heard of the just man forsaken nor his descendants begging bread,’ because the man who labors well in his own land has a plentiful supply of food. Take heed, therefore, man of wealth, because you, like the poor man, bear your burden of flesh.

Because your soul is a priceless thing, poor man, be on your guard. The soul is everlasting, although the flesh is mortal. Although you may lack money, you are not therefore devoid of grace. Although your house is not commodious, your possessions are not scattered. The sky is open and the expanse of the world is free. The elements have been granted to all for their common use. Rich and poor alike enjoy the splendid ornaments of the universe.

Are the paneled ceilings decked with gold in the homes of the very wealthy more beautiful than the face of the heavens decorated with glistening stars? Are the estates of the rich more extensive than the surface of the world? Hence it was said of those who join house to house and estate to estate: ‘Shall you alone dwell in the midst of the earth?’ You have actually a larger house, you man of low estate—a house wherein your call is heard and heeded. ‘O Israel,’ said the Prophet, ‘how great is the house of God and how vast is the place of his possession! It is great and hath no end: it is high and immense.’ The house of God is common to rich and poor. However, ‘with difficulty will a rich man enter the kingdom of heaven.’

Perhaps you resent the fact that ‘the light of golden lamps’ do not shine in your home. But how much more brilliant is the suffused light of the moon! In winter you find a cause for complaint that you do not possess a room-heater with its ‘breathing vapors.’ But you possess the heat of the sun, which tempers the surface of the earth and protects you from the cold of winter. Do you really consider those people happy ‘who are attended by a mighty throng’ of obsequious servants? But those who rely on the feet of others lose by disuse the power of using their own. Hence, only a few of the servitors act as outriders; most of them are needed as bearers.

You may gaze in admiration on their abundance of money: gold and silver. You see how much they have in abundance, but you not see how much they need. To be able to recline in litters in ivory is, to your mind, the height of luxury. But you do not realize how luxurious a possession is the earth, which spreads its couch of grass for the humble man. Here are sweet repose and gentle sleep—such sleep as the restless owner of a golden bed seeks in vain to attain. How much happier does he consider you to be as you lie there so peacefully! So hard is it for him to invite sleep.

Besides, there is, of course, another aspect which is much more important. I refer to the fact that the just man who is in want here will find abundance yonder and that he who has endured toil here will find elsewhere his consolation. Moreover, whoever has acquired goods here cannot hope to receive there a return for his investment. The poor man saves up his interest, whereas the rich man squanders it.

The poor man and the rich man should therefore take heed, because there are temptations for the man of poverty as well as for the man of wealth. And so the wise man says: ‘Give me neither beggary nor riches.’ He tells you how this can be attained. Man has enough when he has a sufficiency, because a wealthy man tends to distend his mind with cares and anxieties, just as he gorges his stomach with rich food. For that reason the wise man prays that he may have what is necessary and adequate, saying: ‘Lest perhaps being filled I should be tempted to deny and say, who sees me? Or being compelled by poverty I should steal and forswear the name of the Lord.’

Shun and avoid, therefore, the temptations of the world, so that the poor may not despair and the rich may not grow proud. For it is written, when you have expelled the heathen and have begun to make use of their land: ‘Lest thou shouldst say, my own might and the strength of my own hand have achieved all these things for me.’ Such a one is he who ascribes all his success to his own merits, and hence, feeling self-assured, does not recognize his own errors which drag him with their extended rope afar. For, if he believes that his acquisition of property is due either to mere chance or to shrewd cunning, there is no occasion for him to feel undue pride in matters to which there is no glory attached, or where the labor results in naught, or where there is evidence of shameless cupidity, which prescribes no limits in its pursuit of pleasure.
'''
