[[commentary]]
quote='''
And behold, men carrying on a bed a man who had been paralysed, and seeking to bring him in and lay him before him; and not finding by what way they might bring him in because of the crowd, they went up on the roof and let him down through the tiles on the bed into the midst before Jesus.

Not idle nor narrow is the healing of this paralytic, since it is first stated that the Lord prayed, not indeed for the sake of support, but for the sake of example; for he gave a pattern for imitation, he did not seek the ambition of obtaining. And when the teachers of the Law had gathered from all Galilee and Judaea and Jerusalem, among the remedies of the other infirm the healing of this paralytic is described. First of all, as we said before, every sick man ought to bring in intercessors to ask for his health, through whom the loosened frame of our life and the lame steps of our actions may be restored by the remedy of the heavenly word. Let there be, then, some admonishers of the mind, who may raise to higher things the soul of a man, though it be numb with the weakness of the outward body. By their supports, again, made ready both to lift himself up and to humble himself, let him be placed before Jesus, worthy to be seen by the Lord's gaze; for the Lord regards humility, because he has regarded the humility of his handmaid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
