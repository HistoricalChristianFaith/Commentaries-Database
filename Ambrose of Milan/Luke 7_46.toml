[[commentary]]
quote='''
Blessed is he even who can anoint with oil the feet of Christ, but more blessed is he who anoints with ointment, for the essence of many flowers blended into one, scatters the sweets of various odours. And perhaps no other than the Church alone can bring that ointment which has innumerable flowers of different perfumes, and therefore no one can love so much as she who loves in many individuals.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed is he who can anoint the feet of Christ even with oil. Indeed, Simon had not yet anointed them; but more blessed is she who anoints with ointment; for the grace of many flowers gathered into one spreads varied sweetnesses of odors. And perhaps no one could bring this ointment but the Church alone, which has countless flowers of diverse fragrance, and which rightly takes on the likeness of the sinful woman, because Christ too took on the form of a sinner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
