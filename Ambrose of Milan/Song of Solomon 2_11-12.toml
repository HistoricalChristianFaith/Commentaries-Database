[[commentary]]
quote='''
Now winter has passed, that is, the Pasch has come, pardon has come, the remission of sins has arrived, temptation has ceased, the rain has gone, the storm has gone, the shaking. Before the coming of Christ it is winter; after his coming there are flowers. Hence he says: flowers have appeared on the earth. Where before there were thorns, there now are flowers. The time he says of cutting has come. Where before there was desert, there is harvest. The voice of the turtle-dove has been heard in our land. Well did the prophet add our, as though marvelling that where before there was unchastity, there is chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
So Christ calls her to himself, that she may come, since she was already coming endowed with spiritual riches, because behold, he says, the winter has passed, the rain has gone, it has gone its way, flowers have been seen on the earth. See how the holy Church is invited. The winter, he says, has gone its way, so that, naked, she may not dread the winter: a winter not of season but of weakness, which despoils the fruitful field of the soul of every flower. For there is a winter not of the earthly sun; there is a winter of the mind, when cold steals into the mind, when the warmth of the mind vanishes, when the vigour of understanding is loosened, when excessive moisture overflows and weighs down the mind, when the inner sight grows dark. And therefore the Lord says: See that your flight be not in winter or on the sabbath. For it is good that the day of judgment or of death should come at the time when the gentle temperateness of the mind is in its vigour, when the heavenly mystery shines with serene light, when our heart burns within us. For then Christ is present, as Ammaon and Cleopas testify in the Gospel, saying: Was not our heart burning within us on the way, when he had opened the Scriptures to us? And the mind is in its vigour when a flower, too, is seen on the earth. Who is this flower of good fragrance but he who said: I am the flower of the field and the lily of the valleys? Of whom it is also written in Isaiah: A rod shall come forth from the root of Jesse, and a rod shall rise up from the root, and a flower shall come forth from the rod. The root, surely, is the family of the Jews, the rod Mary, the flower of Mary Christ; and when he shines forth in our earth and is fragrant in the field of the soul or blooms in his Church, we can neither fear the cold nor dread the rain, but can await the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"
