[[commentary]]
quote='''
Now winter has passed, that is, the Pasch has come, pardon has come, the remission of sins has arrived, temptation has ceased, the rain has gone, the storm has gone, the shaking. Before the coming of Christ it is winter; after his coming there are flowers. Hence he says: flowers have appeared on the earth. Where before there were thorns, there now are flowers. The time he says of cutting has come. Where before there was desert, there is harvest. The voice of the turtle-dove has been heard in our land. Well did the prophet add our, as though marvelling that where before there was unchastity, there is chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
