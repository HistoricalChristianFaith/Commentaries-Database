[[commentary]]
quote='''
After this white robes were given to you as a sign that you were putting off the covering of sins and putting on the chaste veil of innocence, of which the prophet said, "Purge me with hyssop, and I shall be cleansed; wash me, and I shall be made whiter than snow." For one who is baptized is seen to be purified according to the law and according to the gospel: according to the law, because Moses sprinkled the blood of the lamb with a bunch of hyssop; according to the gospel, because Christ's garments were white as snow, when in the Gospel he showed forth the glory of his resurrection. One, then, whose guilt is forgiven is made whiter than snow. Thus God said through Isaiah: "Though your sins are as scarlet, I will make them white as snow."
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 7:34"

[[commentary]]
quote='''
And so, now glad and secure because the fullness of wisdom had flashed upon him, he says to the Lord: You will sprinkle me with hyssop, and I shall be cleansed; you will wash me, and I shall be whitened above snow. Well does he both not make void the sacraments of the Old Testament and teach that the mysteries of the Gospel are to be preferred. He asks to be cleansed with hyssop according to the law; he longs to be washed according to the Gospel; and he reckons that he will be whitened above snow if he has been washed. With a bunch of hyssop he who was accustomed to be cleansed by a typical baptism was sprinkled with the blood of a lamb. But he is washed who is rinsed in the flowing stream of the eternal fountain, and he is whitened above snow whose fault is forgiven. And so it is said of the soul herself: Who is this who comes up whitened? Before she was baptized, she is the one who said: I am black and beautiful, O daughter of Jerusalem. For she was black, disfigured by the dark horror of sins; but after she had been washed through baptism and had obtained the remission of transgressions, she comes up whitened to Christ. Hence too the Lord spoke through Isaiah, saying: If your sins are like scarlet, I will whiten them like snow, that is: if they are bloody, if they are foul, I will cleanse them. This is the intelligible snow, of which it says that in the Gospel the garments of the Lord Jesus shone like snow, because he knew no sin, and his flesh, which he put on when he came into this world, was clean of every transgression. Why do you wonder that he saw the sacraments of baptism, when he said above, where he described the Lord's passion: The Lord feeds me, and I shall lack nothing; in a green place, there he has set me; he has brought me up beside the water of refreshment, and elsewhere: The voice of the Lord is upon the waters; the God of majesty has thundered? And of that very sacrament he spoke more fully: You have prepared a table in my sight; you have made my head rich with oil, and your inebriating cup, how excellent it is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 12"
