[[commentary]]
quote='''
And rightly is John preferred to his equals, from whose days the kingdom of heaven is pressed. This expression seems somewhat obscure, and therefore we thought that it should be drawn from another book of the gospel. For if we follow the letter, surely the inferior is pressed by the stronger, but the kingdom of heaven excels human things. But since there are some things which are said to be thickened by pressing, it is not absurd that the kingdom is pressed, when it is thronged by many.

And those who press plunder it. If we recall that word of the Lord which is written, when the Son of God says: The kingdom of God is within you, we observe that the heavenly kingdom is made solid in us when Christ, the kingdom of the worldly prince having been driven out and worldly delights put to flight, reigns within the secret places of our souls. Force, then, is brought to bear on the human mind, which, soothed by various allurements, flees labour and seeks pleasure, when, either restrained by fear of punishment or provoked by reward, it strives to conquer itself, and, as though its labours had been endured to the end, strives to snatch the palm which is being withdrawn from it by many adversaries. For we snatch from this world the palm of salvation, and with watchful labour we pluck fruits besieged as it were by watching serpents, yet so that it is not a stealthy taking away but a triumphal plundering. There is also another kind of plundering, when we plunder what was offered to others. Who these robbers are, then, we do not labour to understand, since we know that we have sprung from the race of Benjamin, the ravening wolf. John had gone before, to justify the people of the Jews; the Lord himself had come to the lost sheep of the house of Israel; he had appointed the apostles to found the faith of the people of the Jews either by disputation or by signs and miracles; but since they fled from the gifts offered to them, tax collectors and sinners began to believe in God, to come together into the faith. In these, then, by the apostolic preaching the kingdom of heaven is pressed and is made solid by the breath of the faithful people.

She who was troubled by the flow of blood plunders the kingdom; for when the Lord was on his way to the daughter of the ruler of the synagogue, by a kind of stealthy touch she took a foretaste of the remedy of health. That Canaanite woman plunders the kingdom, who, going out from her borders, cried out, saying: Have mercy on me, Lord, son of David; my daughter is grievously troubled by a demon. Truly she pressed the kingdom, persistent in prayers, wise in replies, faithful in words. She calls him back as he passes by, asks him when he is silent, adores him when he excuses himself, bends him when he refuses. Does she not seem to you to snatch, when she draws out what is refused, to snatch beforehand what is reserved for others? For the Lord had said that the children's bread ought not to be given to dogs; but she agreed, and by agreeing plundered it, saying: Yes, Lord; for even the little dogs eat of the crumbs which fall from the table of their masters.

You have learned how the heavenly kingdom is seized. Let us too, then, press it, let us plunder it; for no one eats the Passover except in haste. But what is it that seizes the kingdom? Not shamelessness, not wantonness, not pleasure, but that of which it is said: Great is your faith; be it done to you as you will. Behold, she seized it, who obtained what she wished, extorted what she asked. That widow too seized it, who by praying often extorts that she be heard, if not because of innocence, at least because of importunity.

So the Church seized the kingdom of the synagogue. My kingdom is Christ; I seize him, sent to the Jews under the Law, born in the Law, nourished according to the Law, that he might save me who was without the Law. Christ is seized when he is promised to some and predestined for others; Christ is seized when he is born for some and gives his support to others; Christ is seized when he is killed by some and buried by us; he is seized from those who lie in wait, he is seized from those who sleep. You have a place where they themselves confessed that we seized him, saying that they had slept: Say that his disciples came by night and stole him while we were asleep. Rise, then, you who sleep, lest you too, while you sleep, lose Christ. Rise, you who sleep, and arise from the dead. You see that those who sleep are dead. And therefore we do not envy others, but provide for ourselves; for the dead could not keep the living one.

Let those who have slept rise, even if late, even those who have lost Christ. Christ is not so lost that he does not return, if only he is sought; rather he comes back to those who watch and is at hand for those who rise, nay, he is present to all, he who is everywhere always, because he fills all things. For he fails no one; we fail; he fails no one, I say, he superabounds for all; for sin superabounded, that grace might superabound. Christ is grace, Christ is life, Christ is the resurrection. He who rises, then, finds him present.

The kingdom of heaven, then, is seized when Christ is denied by those of his household and adored by the Gentiles; it is seized when he is rejected by them and worshipped by us; it is seized when he is not acknowledged through inheritance and is acquired through adoption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
