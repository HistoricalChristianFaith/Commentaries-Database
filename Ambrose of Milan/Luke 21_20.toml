[[commentary]]
quote='''
When you see Jerusalem surrounded by an army. Truly Jerusalem was besieged and stormed by the Roman army; whence the Jews too thought that the abomination of desolation was then accomplished, because the Romans, mocking the rite of Jewish observance, threw a pig's head into the temple. That I would not say even if I were raving. For the abomination of desolation is the accursed coming of Antichrist, because with ill-omened sacrileges he defiles the inner parts of minds, sitting in the temple according to the historical sense, to claim for himself the throne of divine power. But according to the spiritual interpretation he is fittingly brought in as standing, because he desires to fix the footprint of his unbelief in the affections of each one, arguing from the Scriptures that he is the Christ.

Then desolation will draw near, since very many, having fallen away from true religion, will defect through error. Then will be the day of the Lord, which the Apostle too has plainly set forth, saying that we must take heed, as though the day of the Lord were at hand, lest anyone deceive us in any way; for unless the falling away comes first and the man of sin is revealed, the son of perdition, who opposes and exalts himself above all that is called God or that is worshipped, so that he sits in the temple of God, showing himself as though he were God, and the rest.

So he will sit in the temple, and in the inner temple of the Jews, who will deny Christ, in a temple not inviolable but subject to corruption, which either the ruin of unbelief entangles, or the force of anger overthrows, or the fire of desires burns up. And well will the day of the Lord come then, and the days will be shortened for the sake of the elect, since, just as the first coming of the Lord was for the redeeming of sins, so the second too is for the repressing of offences, lest more should slip into the error of unbelief.

Then false prophets, then famine. Recall to me the times of Elijah, and you will find then prophets of confusion, then Jezebel, then famine, then drought of the land. For what reason? Because iniquity had abounded, charity had grown cold. Indeed the righteous man was in the desert, the wicked on the throne.

There is also another antichrist, the author of this one, namely the devil, who strives to besiege with the army of his legion my Jerusalem, my soul, surely the soul of God, the peaceable soul. Ours is not, indeed, a wrestling against flesh and blood, but against principalities and powers, against the rulers of this world, of this darkness. Then is the falling away, when the soul defects from itself and, again, trembles and is troubled when it thinks of the Lord. Then, when this antichrist holds, until he be taken out of the midst, righteousness is in exile, iniquity reigns; then faith is rare, as the Lord himself said, as though in doubt: Then, when the Son of Man comes, will he find faith upon the earth? Either, surely, in our own earth or in the whole world. So also elsewhere: The Lord looked down upon the sons of men, to see if there is any that understands or seeks God, not because God doubts, but because faith was so rare among men that, in the opinion of men, there would seem to be room for doubt.

So when the devil is in the midst of the temple, there is the abomination of desolation according to the prophet Daniel; but when the spiritual presence of Christ has shone upon each one who labours, the wicked one is taken out of the midst, and righteousness begins to reign, which empties every principality out of the minds of the faithful.

There is also a third antichrist, either Arius or Sabellius; indeed, all are antichrists who lead us astray by perverse interpretation. And therefore let him who reads understand; he who understands is not led astray so as to believe false things in place of true, after the manner, surely, of the Jews, who denied the true Christ; whence it will follow that they believe him to be true who is false. So the Arians too will not deny to Antichrist what they deny to Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
