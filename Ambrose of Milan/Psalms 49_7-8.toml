[[commentary]]
quote='''
Then the discourse is woven on concerning the Lord's Passion: A brother does not redeem; a man shall redeem. Nor shall he give to God his propitiation and the price of the redemption of his soul. That is: Why shall I fear in the evil day? For what can harm me, who not only have no need of a redeemer, but am myself the Redeemer of all? Shall I make others free, and myself tremble for myself? Behold, I will make all things new, I who am above the very affection and dutiful love of brotherhood. Him whom a brother, poured forth into the light from the same mother's womb, cannot redeem, because he is held fast by the weakness of a like nature, a man shall redeem; but that man of whom it is written that he will send them, the Lord, a man who will save them, who said of himself: You seek to kill me, a man who have spoken the truth to you. But although he is a man, who shall know him? Why shall no one know him? Because, as there is one God, so there is also one mediator of God and men, the man Christ Jesus. He it is alone who shall redeem man, surpassing brothers in loving-kindness, since for strangers he shed his blood, which no one can offer for a brother. And so he did not spare his own body, that he might redeem us from sin, and gave himself as a redemption for all, as his true witness, the Apostle Paul, asserted, who says: I speak the truth, I do not lie. But why shall he alone redeem? Because no one can equal him in loving-kindness, so as to lay down his life for his little servants, no one in integrity; for all are under sin, all lie subject to that fall of Adam; the Redeemer alone is chosen who could not be liable to the old sin. Therefore by the man let us understand the Lord Jesus, who took up the condition of man, that in his flesh he might crucify the sin of all and blot out the bond of all with his blood.

But perhaps you may say: "How is it denied that a brother will redeem, when he himself said: I will declare your name to my brothers?" But not as a brother, but as man, Christ Jesus, in whom God was, forgave us our sins. For so it is written: God was in Christ, reconciling the world to himself, in that Christ Jesus of whom alone it was said that the Word was made flesh and dwelt in us. Not as a brother, then, but as Lord he dwelt in us, when he dwelt in the flesh. Since, then, he reconciled the world to God, he himself certainly had no need of reconciliation; for for what sin of his own would he propitiate God, he who knew no sins? Then, when the Jews demanded the didrachma, which was given for sin according to the Law, he said to Peter: Simon, from whom do the kings of the earth receive tribute or census? From their own sons or from strangers? Peter answered: From strangers. The Lord said to him: Then the sons are free. But so that we may not give them offence, cast a hook and take the fish that comes up first, and when its mouth is opened you will find a stater; take that and give it for me and for you. He shows that he does not owe a propitiation for sins for himself, since he was not the slave of sin, but was free from every error, the Son of God. For the Son sets free; the slave is in guilt. Therefore he who is free from all does not give the price of the redemption of his own soul, he the price of whose blood could suffice to redeem all the sins of the whole world. Rightly, then, does he set others free who owes nothing for himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
