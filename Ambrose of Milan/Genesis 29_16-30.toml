[[commentary]]
quote='''
But the one who was prefigured in Jacob is the Lord Jesus himself, the husband of two marriages, that is, a kind of partner of the Law and of grace, who loved the virgin Rachel first and loved her, predestined to be his in marriage, with a devout affection. But since Leah, like the Law, came in besides, and, weaker in her eyes, crept in like the synagogue, which in its blindness of mind could not see Christ, the grace of holy Rachel superabounded, who was sought beyond that first marriage, who even then by the meaning of her name signified the future primacy of the Church: blessed Rachel, who took away reproach by her childbearing; blessed Rachel, who hid the worship and the errors of the Gentiles, who declared their idols to be full of uncleanness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"
