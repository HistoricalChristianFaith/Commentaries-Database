[[commentary]]
quote='''
But he who has engulfed and plunged himself in such wallowing places, falls also into the snare of unbelief; for the people sat down to eat and to drink, and required that gods should be made for them. Hereby the Lord teaches us that he who gives up his soul to these two kinds of vices, is stript of the garment, not of a woollen vest, but of living virtue; that clothing which is not temporal but eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252051-60.html'
source_title="Letter 58.16"

[[commentary]]
quote='''
But what is this? While I am speaking of fasting, I hear the uproar of banquets. Unless I am mistaken food has become redolent in my sermon. Therefore the sound of language invites, examples of impatience do not disturb me. For the people, who did not suffer themselves to wait for him who was fasting and bringing those things which are of the Law, straightway sat down to eat and drink, and rose up to play. We see that sacrilege was joined to drunkenness. For as restraint is the mother of faith, so drunkenness is the mother of faithlessness. Into what crime does it not rush headlong?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 12"
