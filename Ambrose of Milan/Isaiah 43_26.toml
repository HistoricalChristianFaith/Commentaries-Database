[[commentary]]
quote='''
Tell your iniquities, that you may be justified. Why do you blush to confess those in which you were born? To deny what you were born in is the crime of one who denies, not of one who confesses. Would that you kept what you have received! Why should you think you have what you have not received?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
