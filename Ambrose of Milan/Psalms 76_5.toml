[[commentary]]
quote='''
The sons of darkness are deprived of the sun of justice and of the splendour of virtue, always sleeping and never waking, of whom it is well said: They have slept their sleep and have found nothing. For when their souls have been separated from the body, as though released from the sleep of the body, they will find nothing, they will hold nothing, and what they thought they held they will lose, since, when the stupid man and the fool has overflowed with riches, he will leave his riches to strangers, nor will the glory of his house go down together with him to the lower world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 8"

[[commentary]]
quote='''
Rightly does David cry: If riches abound, set not your heart upon them. For what do they profit me if they cannot free me from death? What do they profit me, if they cannot be with me after death? Here they are acquired, here they are left behind. Hence we speak of a dream, not of a patrimony. Wherefore the same prophet well says of the rich: They have slept their sleep: and all the men of riches have found nothing in their hands, that is, nothing have rich men found in their works, who have conferred nothing on the poor. They have helped no one in need, they have been able to find nothing contributing to their own advantage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 6"

[[commentary]]
quote='''
This favor with God have the peaceable and the meek who are settled in the sober tranquility of their minds, but the foolish of heart are troubled and are themselves the authors of their own agitation, because they are tossed by the tide of their desires and fluctuate in a kind of sea.

Who these are, he signified expressly by saying: All the men of riches. He said all, he excepted none. And well did he use the term men of riches and not riches of men, that he might show that they were not the possessors of riches, but were possessed by riches; for a possession ought to belong to the possessor, not the possessor to the possession. Whosoever therefore does not use his patrimony as a possession, who does not know how to give and distribute to the poor, he is the servant of his wealth, not its master; because like a servant he watches over the wealth of another, and not like a master does he use it as his own. Hence, in a disposition of this kind, we say that the man belongs to his riches, not the riches to the man. For a good understanding to them that use it; but who does not understand, he assuredly cannot claim for himself the grace of understanding; and so, overcome with the sleep of drunkenness, he has fallen asleep. Therefore men of this kind sleep their sleep; that is, their sleep, not the sleep of Christ. And they who sleep not the sleep of Christ have not the rest of Christ nor do they rise by the resurrection of Christ, Who says: I have slept and have taken my rest; and I have risen up, because the Lord will protect me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapters 14-15"

[[commentary]]
quote='''
And it was not a bad sheep, for it was full of the word, being the daughter of the rational hebdomad and the gift of a holy Author; yet it was nourished for a long time not on any precious things but on the cheap resources of a poor man. And so it ate, he says, of his bread and drank of his cup and slept in his bosom. Not good is the food of the Ethiopians; harmful is the golden cup, Babylon, which inebriates the nations; sleep is not useful to those who sleep: I would rather keep watch. And so all the foolish of heart were troubled; they slept their sleep and found nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 5"
