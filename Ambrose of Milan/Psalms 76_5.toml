[[commentary]]
quote='''
The sons of darkness are deprived of the sun of justice and of the splendour of virtue, always sleeping and never waking, of whom it is well said: They have slept their sleep and have found nothing. For when their souls have been separated from the body, as though released from the sleep of the body, they will find nothing, they will hold nothing, and what they thought they held they will lose, since, when the stupid man and the fool has overflowed with riches, he will leave his riches to strangers, nor will the glory of his house go down together with him to the lower world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 8"
