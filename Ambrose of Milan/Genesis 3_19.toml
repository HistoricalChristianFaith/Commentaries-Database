[[commentary]]
quote='''
For not idly was it said to man, as to none of the other living creatures: In the sweat of your face you shall eat your bread; for to those animals which are irrational by nature the earth was commanded by God's order to supply fodder, but to man alone, that he may exercise the reason he received, the course of life is prescribed in labor. For he who is not content with the fodder of the other animals, for whom the fruit-bearing tree given to all in common for food is not enough, but who searches out for himself the delicacies of varied banquets, fetches delicacies for himself from lands beyond the sea, sweeps delicacies out of the waves, ought not, since he seeks his living by labor, to refuse to undergo a brief labor for eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Add to this that men fear death in vain, as if it were the end of nature. For if we recall that God did not make death, but that after man had fallen into the shameful deed of transgression and deceit, the sentence laid hold of him that earth should return to its earth, we shall find that death is the end of sin, lest, the longer life was, the more numerous guilt should become. The Lord, then, allowed death to creep in, so that guilt might cease; but lest, again, the end of nature should lie in death, the resurrection of the dead was given, so that through death guilt might fail, but through the resurrection nature might be made everlasting. And therefore this death is the passage of all. You must pass over steadfastly: and it is a passage from corruption to incorruption, from mortality to immortality, from disturbances to tranquillity. Do not, then, let the name of death offend you, but let the benefits of a good passage delight you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 4"
