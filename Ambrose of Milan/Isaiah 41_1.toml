[[commentary]]
quote='''
Therefore Adam too, cast out of the heavenly homeland and of that seat of paradise, was banished to the island of sin. Rightly, then, does Scripture say: Be renewed, O islands, because we are surrounded by the waves of sins like islands in the strait of this world. These islands, then, have been renewed through the coming of the Lord by the remission of sins; that is, men, set in the washing in the midst of the waters as if they were islands, were being pounded by masses of waves, like islands by the resounding, dashing billows of sins, like islands on which before, as on reefs of fraud, the simple suffered frequent shipwrecks, because there was guile in the heart and flatteries in the mouth. But after the Lord Jesus, in whom there is no guile, coming into this world, calmed the depths of human minds by setting forth heavenly teaching, and poured tranquillity back into the affections of each, taking away the hedge of discord, there began to be, as it were, harbours of refuge for those who approached, so that each may moor the ship of his own repose in the affection of his neighbour or his brother, and hold fast in a kind of shoreline retreat of a devout mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 9"
