[[commentary]]
quote='''
Give a thoughtless and fickle husband, who does not know how to humour his wife, and he furnishes grounds for divorce. But Abraham, a moderate and prudent man, Behold he says your handmaid is in your hands: use her as it pleases you; for he preferred to keep his wife rather than the servant-girl. Yet even this is not a full remedy. The angry wife receives the power and uses the revenge permitted her too immoderately. But if Sarai did not keep moderation, which woman will keep it? And therefore it is written: And Sarai afflicted her, and she fled from her face. There are two things that Scripture includes, so as to express both the heavy indignation of the mistress and the swelling and pride of the handmaid. That Sarai afflicted her refers to the wrath of the one who afflicted; as for Hagar's fleeing, she would not bear the insult with a servant's patience, she who claimed for herself the eminence of sharing her master's bed. She resented the injury, she who had put on insolence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
