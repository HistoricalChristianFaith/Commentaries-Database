[[commentary]]
quote='''
In short, he who desired to do him harm could not send him away empty. For the wise man is never empty, always having within himself the cloak of prudence, being one who can say: I put on justice and clothed myself with judgment, as Job said. For these are the inner coverings of the mind, which no one else could take away, except when a man's own guilt strips him. In short, Adam, stripped in this way, was found naked; but Joseph, even when his outer garment was thrown off, was not naked, for he kept the garments of virtue safe. The wise man, therefore, is never empty. For how is he empty who has received of the fullness of Christ and keeps what he received? How is he empty whose soul is filled, the soul that guards the garments of the grace it received?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"
