[[commentary]]
quote='''
These then are that seven and eight whereof Hosea says that by that number he purchased to himself, and acquired the fulness of faith, for thus it is written, So I bought her to me for fifteen pieces of silver, and for an homer of barley, and an half homer of barley, and a measure of wine. But in the former verses God had commanded him to hire to himself an harlot, and it is manifest that he did so, in that he has mentioned the price of her hiring. Now the fifteen pieces of silver are made up of the numbers seven and eight, wherefore they represent these numbers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252041-50.html'
source_title="Letter 44:7"

[[commentary]]
quote='''
We know that the hebdomad belongs to the Old Testament and the ogdoad to the New, namely when Christ rose again and the day of new salvation dawned for all: on which day the brightness of full and perfect circumcision poured itself into human hearts. And seven and eight make fifteen. These, then, are the seven and eight, that is, the fifteen, for which Hosea hired the harlot whom the Lord had commanded him to hire. The hebdomad, then, and the eighth signify the fulfilment of the two Testaments and the fullness of faith: and the number fifteen taken four times, which makes sixty, the perfection of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
