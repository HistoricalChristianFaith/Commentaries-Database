[[commentary]]
quote='''
In saying, then, "through Him," has he denied that all things were made in Him, through Whom he says that all things exist? These words, "in Him" and "with Him," have this force, that by them is understood one and like in all respects, not contrary. Which he also made clear farther on, saying: "All things have been created through Him and in Him;" for, as we said above, Scripture witnesses that these three expressions, "with Him," and "through Him," and "in Him," are equivalent in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25203.html'
source_title="On the Holy Spirit, Book 3, 84"


[[commentary]]
quote='''
Who, then, would dare to deny the oneness of Name, when he sees the oneness of the working. But why should I maintain the unity of the Name by arguments, when there is the plain testimony of the Divine Voice that the Name of the Father, the Son, and the Holy Spirit is one? For it is written: "Go, baptize all nations in the Name of the Father, and of the Son, and of the Holy Spirit." He said, "in the Name," not "in the Names." So, then, the Name of the Father is not one, that of the Son another, and that of the Holy Spirit another, for God is one; the Names are not more than one, for there are not two Gods, or three Gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25201.html'
source_title="On the Holy Spirit, Book 1, 132"

[[commentary]]
quote='''
So let us not serve what is another's, because we ought to know no lord but Christ; for there is one God the Father, from whom are all things and we in him, and one Lord Jesus, through whom are all things. What then? Is the Father not Lord, or the Son not God? But the Father too is Lord, because by the word of the Lord the heavens were made firm, and the Son is God, who is over all, God blessed for ever. How then is it that no one can serve two lords? For the Lord is one, because God is one. Indeed you shall worship the Lord your God and him alone shall you serve. From which it is clear that the lordship of the Father and of the Son is one. And it is one if it is not divided, but is whole in the Father, whole in the Son. And so, because we assert a Trinity of one Godhead and lordship, we confess one God and one Lord. But those who speak of one power of the Father, another of the Son, another of the Spirit bring many gods and many lords into the Church by the fault of Gentile error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Here one may notice, dearly beloved brethren, how all heresies, while they attack one another, run back into one another. And so the Arians, while they separate the power of the Father and of the Son, rush madly into such an outcome of their disputation that their assertion falls in with the Manichaeans; for these say that there is one God of the Old Testament, another of the New. This profane assertion the holy Church condemns, which reads of one God, because one God the Father, from whom are all things, and we unto him, and one Lord Jesus, through whom are all things, and we through him. Surely the power of the Father and of the Son is declared almighty and one, so that we neither set the Father apart from the grace of the New Testament nor, again, separate the Son from the establishing of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
