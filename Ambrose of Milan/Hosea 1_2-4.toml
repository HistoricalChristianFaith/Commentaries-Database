[[commentary]]
quote='''
Adultery, I say, was committed in a type of salvation; for not every adultery is to be condemned. Accordingly, it was said to the prophet: Go, take for yourself a wife of fornication. The Lord commands this, that there be marriage with her who had committed fornication, a marriage whose offspring, as we said above, is Christ. For to the son who was born of fornication the name Jezreel was given by the Lord, which means "divine offspring". If, then, that union with a harlot was godly, this partnership too is surely a godly union with an adulteress. But that concerns the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 10"
