[[commentary]]
quote='''
Moreover if anyone has not been baptized, let him with all the greater security be converted, receiving the remission of his sins . . . as a kind of fire consumes sins, since Christ baptizes in fire and spirit. Hence, you read of this type in the Books of Kings where Elias placed wood upon the altar and told them to pour water thereupon from urns. And he said, Do the same the second time. And they did it the second time. And he said: Do the same also the third time. [And they did it the third time], and when the water dripped about, Elias prayed and fire descended from heaven. You, O man, are upon an altar, you who are purified by water and whose sin is burned out that life may be renewed; for fire consumes wood and stubble. Do not fear the fire through which you are enlightened. Therefore it is said to you: Come ye to him and be enlightened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 22"
