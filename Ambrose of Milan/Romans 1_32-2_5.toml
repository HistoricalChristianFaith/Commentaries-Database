[[commentary]]
quote='''
Many rejoice at the acquittal of their crimes. If they mean to amend, they do rightly; if they mean to persist in them, foolishly, because condemnation would have profited them far more, so that they should not heap up increases of their sins. On this there is the lofty judgement of the Apostle, who says that not only those who do shameful things but also those who approve them are worthy of death; and also that those who condemn in others such things as they themselves do are held inexcusable, as condemned even by their own sentence; for when they condemn others, they condemn themselves. Nor ought they to flatter themselves because for a time they seem exempt from punishment and free of guilt, since they pay heavier penalties within themselves and are guilty before themselves, though they do not seem so to others, and twist against themselves a heavier sentence of conscience when they judge the sins of others. But do not, he says, O man, despise the treasures of the divine goodness and patience; for the goodness of God calls you to repentance, invites you to correction; but your hardness, by which you persist in the obstinacy of error, increases the severity of the judgement to come, so that you receive a fitting retribution for your offences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 7"
