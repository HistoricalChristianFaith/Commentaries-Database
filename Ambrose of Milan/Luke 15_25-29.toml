[[commentary]]
quote='''
There follows the passage teaching that we ought to favor the remission of sins after repentance, lest, while we begrudge another his pardon, we ourselves not deserve it from the Lord. For who are you, to contradict the Lord, so that he may not relax guilt for whom he wills, when you forgive whom you will? He wills to be asked, he wills to be entreated. If righteousness belonged to all, where would the grace of God be? Who are you, to begrudge God?

And therefore this brother is censured, so far that he is said to come from the farm, that is, busied with earthly works, ignorant of the things that are of the Spirit of God, so that in the end he complains that not even a kid was ever killed for him; for not for envy but for the pardon of the world was the lamb sacrificed. The envious man seeks a kid; the innocent desires a lamb to be sacrificed for him. That is why he is also called the elder, because a man quickly grows old through envy. That is why he also stands outside, because the malevolence of a livid mind shuts him out. That is why he cannot hear the chorus and the symphony, that is, not those theatrical incentives to wantonness nor the harmony of courtly sounds, but the concord of the people singing together, which resounds with the sweet delight of joy over a sinner saved.

Set before me someone of those who seem righteous to themselves, who do not see the beam in their own eye and cannot bear the speck of another's fault. How indignant he is when pardon is granted to someone who confesses his sin and has long wept to obtain indulgence! How his ears cannot bear the spiritual symphony of the people! For this is the symphony, when in the Church, with the undivided concord of different ages and virtues, as of various strings, the psalm is sung together, the response is made, Amen is said. This is the symphony which Paul too knew. And therefore he says: I will sing with the spirit, I will sing also with the mind. These things we thought should be treated concerning the present parable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
