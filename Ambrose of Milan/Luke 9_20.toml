[[commentary]]
quote='''
In this one name there is the expression both of His divinity and incarnation, and the belief of His passion. He has therefore comprehended every thing, having expressed both the nature and the name wherein is all virtue. (summa virtutum)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Believe, then, as Peter believed, so that you too may be blessed, so that you too may deserve to hear: because flesh and blood has not revealed it to you, but my Father who is in heaven. For flesh and blood can reveal only the things that are earthly; but he who speaks mysteries in the spirit is grounded not by the teaching of flesh and blood but by divine inspiration. Do not, then, give your assent to flesh and blood, lest you drink in the precepts of flesh and blood and yourself become blood and flesh. For he who clings to the flesh is flesh, and he who clings to God is one spirit. My spirit shall not remain he says in these men forever, because they are flesh.

But would that those who hear were not flesh and blood, but that, withdrawn from the desires of flesh and blood, each could say: I will not fear what flesh may do to me! For he who has conquered the flesh is a foundation of the Church, and if he cannot equal Peter, he can imitate him; for great are the gifts of God, who has not only restored to us what had been ours, but has also granted us what is properly his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
And therefore Peter did not wait for the people's opinion, but brought out his own, saying: you are the Christ, the Son of the living God. He who is, is always; he neither began in order to be, nor ceases to be. Great, moreover, is the grace of Christ, who has given almost all his own names to his disciples. I am he says the light of the world, and yet he granted to his disciples the very name in which he himself glories, saying: you are the light of the world. I am the living bread; and: we all are one bread. I am the true vine; and he says to you: I have planted you a fruitful vine, all true. The rock is Christ — for they drank of the spiritual rock that followed, and the rock was Christ —: he did not deny even to his disciple the grace of this name, so that he too should be Peter, because he has from the rock the solidity of constancy, the firmness of faith.

Strive, then, that you too may be a rock. And so seek the rock not outside yourself but within yourself. Your rock is your action, your rock is your mind. Upon this rock your house is built, so that it can be battered by no storms of spiritual wickedness. Your rock is faith; faith is the foundation of the Church. If you are a rock, you will be in the Church, because the Church is upon the rock. If you are in the Church, the gates of the underworld will not prevail against you. The gates of the underworld are the gates of death, and the gates of death cannot be the gates of the Church.

And what are the gates of death, that is, the gates of the underworld, but each and every sin? If you have committed fornication, you have gone in at the gates of death. If you have violated faith, you have passed through the gates of the underworld. If you have committed a mortal sin, you have entered the gates of death. But God is mighty, who can lift you up from the gates of death, that you may proclaim all his praises in the gates of the daughter of Zion. But the gates of the Church are the gates of chastity, the gates of righteousness, which the righteous man is wont to enter, saying: open to me the gates of righteousness, and having entered into them I will confess to the Lord. But as the gate of death is the gate of the underworld, so too the gate of righteousness is the gate of God; for this is the gate of the Lord; the righteous shall enter by it. And therefore flee from persistence in offences, lest the gates of the underworld be able to prevail against you; for if sin has gained dominion in you, the gate of death has prevailed. Flee, then, contentions, dissensions, the din and tumults of discord, lest you fall into an entrance through the gates of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
