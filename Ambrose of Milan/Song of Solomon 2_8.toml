[[commentary]]
quote='''
The voice of my kinsman: behold, he comes here, leaping upon the mountains, leaping across the hills. This book is like a band of soldiers, having many noble persons, like a triumphal band, and signifying many actions, which we can understand rather than hold as expressed. For as though she had heard the bridegroom coming and talking with some who were travelling together with him, the bride says: The voice of my kinsman. While she is speaking with the daughters of Jerusalem, and asking them to rouse and rouse again the bridegroom, suddenly perceiving, as it were, the sound of a voice sent from afar, she says: The voice of my kinsman, announcing him whom she was earlier asking to have announced to her. Him whom she desired to be roused by others, believing him now, roused again by her own prayer, to be coming from the Father, she says gladly: The voice of my kinsman. Well did she add, my kinsman; so that not other women, but she alone, his kinswoman, might claim his coming for herself.

Behold, she says, he comes: I am still seeking him, and he is already coming; I am still canvassing for votes that he may come, and he is already near: I desire love to be roused for me, I think myself wounded by love, and love itself hastens the more to me: I said, Come; he leaps and leaps across: I ask him to come with grace, he works increases of graces; and as he comes, he brings with him increments of grace, and gains by coming, because he himself too is eager to please his beloved. He leaps upon the heights, to ascend to the bride; for the bride's chamber is the judgment seat of Christ. He leaps upon Adam, leaps across the Synagogue; he leaps upon the Gentiles, leaps across the Jews.

Let us see him leaping. He leaps from heaven into the Virgin, from the womb into the manger, from the Jordan to the cross, from the cross into the tomb, into heaven from the sepulchre. Prove to me, David, that he leaps, prove that he runs; for you said: He has exulted as a giant to run the way, his going forth is from the highest heaven; and his meeting reaches to its highest point, nor is there anyone who hides himself from his heat (Ps. 18 (19):6 and 7). And now he leaps, and now he runs, from the heart of the Father upon his saints, from the East upon the West, from the North upon the South. He it is who ascends above the setting sun, he above the heavens of heavens to the East, he ascends upon the mountains, he upon the hills.

Would that I, wretched as I am, might say, that my soul might say: Behold, he comes, and comes not upon earthly things, not upon the valleys, but comes: Leaping upon the mountains; for God is the God of the mountains, not of the valleys: where, then, he leaps, he leaps upon the mountains. If you are a mountain, he leaps upon you; he leaps upon Isaiah, he leaps upon Jeremiah, he leaps upon Peter, John, James. Mountains are round about him (Ps. 124 (125):2): if you cannot be a mountain and have not the strength, be at least a hill, that Christ may ascend upon you: and if he leaps across, that his passing may guard you.

We have spoken of Christ and the Church; let us speak of the soul and the Word. The soul of the just man is the bride of the Word; if she longs, if she desires, if she prays, and prays constantly, and prays without any disputing, and is wholly intent upon the Word, suddenly she seems to hear the voice of him whom she does not see, and with her inmost sense she recognizes the fragrance of his divinity, as those who believe well often experience. Suddenly the nostrils of the soul are filled with spiritual grace, and she perceives the breath of the presence of him whom she seeks breathing upon her, and she says: Behold, this is he himself whom I seek, he himself whom I desire.

Is it not so that, when we are pondering something from the Scriptures and cannot find its explanation, while we are in doubt, while we are seeking, he suddenly seems to us to ascend as it were upon the mountains, that is, upon the loftiest doctrines? Then, appearing to us as it were upon the hills, he enlightens the mind, so as to pour into our understanding what seemed hard to find: so the Word, from absent as it were, becomes present in our hearts. And again, when something is somewhat obscure to us, the Word is as it were withdrawn, and we long for his coming as though he were absent; and again he appears, he shows himself to us as though he were present to us in knowing the things we seek.

He leaps, then, often in the heart of each one; he leaps across and goes out and returns: if you follow, if you seek him again, if through the pleasant disputation of faithful teachers you ask that the Word, which had gone out and passed across, be roused again for you. Like her who sought and found, who said: My brother has passed by, my soul went out at his word (Song 5:6). So even if he leaps upon the mountains, follow; even if upon the hills, follow. For on the mountains and on the hills are found the Lord's hunters, who track down those who are caught for life; for so God said through Jeremiah: Behold, I send many fishers and many hunters, and they shall hunt them upon every mountain and upon every hill (Jer. 16:16). There, then, let the people of God be sought and found, in the teaching, grace and discipline of Peter and of Paul; that they may not be in the valley, where weeping is, but on the mountains, from which Christ enlightens each one; and when we read Peter, Christ enlightens; and when we read Paul, Christ enlightens. Paul healed, Christ enlightened; for at the invocation of the name of the Lord Jesus he arose, by whose gift he was healed. Peter raised a dead woman, Christ enlightened; and therefore he says: You give light wonderfully from the everlasting mountains (Ps. 75 (76):5).

We, therefore, who cannot be mountains, let us stand on the mountains or on the hills; so that when the Lord has sent his fishers and hunters to hunt those who are upon every mountain or upon every hill, that is, in the precepts of the law and the prophets, and who have their whole way of life in the knowledge of the New and the Old Testament, they may find us ready, and, sent as reapers at the proper time, may gather us like good ears of grain; for if anyone is found outside the mountain or the hill, he cannot be gathered like a good ear by those who, to make mention of another comparison, will be sent to separate the wheat from the chaff. The Lord, then, has ministers skilled in very many works: the same are fishers, the same are also hunters, and reapers. If at the time of harvest, when these are directed to reap, you wait ripe, you will be able to behold him leaping on the mountains, and you will see the Lord Jesus like a young roe or a fawn of the harts upon the mountains of Bethel. For he leaps upon the Church, which is the house of bread, because he strengthens the hearts of the faithful; whence the bride too says of him:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
