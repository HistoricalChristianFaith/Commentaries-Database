[[commentary]]
quote='''
Indeed he himself says: for my soul is filled with mockeries, and there is no health in my flesh. I am bent down and humbled exceedingly, I roared with the groaning of my heart. And before you is all my desire, and my groaning is not hidden from you. My heart is troubled, and my strength has forsaken me, and the light of my eyes is not with me. We notice, then, that the labour of the soul is greater than that of the flesh. Understand, then, with what mockeries the soul is filled, in that in temptations the devil seems to mock it and insult it as one labouring grievously. Symmachus, however, says "loins", in which are the seed-beds of human generation. Whence the wisdom of God commands you to have your loins girded, lest your chastity be loosened. Indeed, that you may know that in the loins are the stirrings of lust, which are mostly roused by the devil when he strives to scatter the members of Christ and make them members of a harlot, behold, he says, his strength is in his loins and his power in his womb. In the loins of the man is the seed, but in the womb of the woman. The devil, then, mocks in these, so as to bring about adultery, incest, fornications. And therefore he who fornicates sins against his own body, not outside the body: first because the flesh is weakened, which melts away in lusts and does not keep the restraints of chastity; then because the seeds, which ought to serve the procreation of offspring, work defilement of the body, not the fruit of posterity. Those things, then, are called mockeries, perhaps because in them the heat of the body often deludes without the fulfilment of intercourse. Whence the Seventy rightly spoke of mockeries of the soul, because the devil, mocking someone's disposition, strives to pour out his strength in vain, to empty his virtue, to loosen his fortitude. And therefore he says elsewhere: and my reins are loosened. In this the blessed Apostle also strengthens us, that we ought to fear neither the mockeries of the soul nor the infirmity of the flesh, because Christ is the power of both our soul and our body, he who cures the sick as a physician and strengthens the weak as the strength of all. Indeed, even if our outward man is corrupted, yet the inward is renewed from day to day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
