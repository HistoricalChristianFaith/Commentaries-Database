[[commentary]]
quote='''
Since, then, the Apostle has taught that he who has escaped from this body will be with Christ, provided that he has deserved it, let us consider what death is, and also what life is. And so, with Scripture teaching us, we have learned that death is the release of soul and body and a kind of separation of man. For we are loosed from this tie of soul and body when we depart. Hence David too says: you have burst my bonds; to you I will sacrifice an offering of praise. That the bonds of this life are meant, that is, of our conjunction, which consists of soul and body, the earlier little verse of his psalm teaches: precious in the sight of the Lord is the death of his saints. And therefore, as a prophet foreseeing that he would be with the saints and with those who for devotion laid down their souls in Christ, he rejoices, because he too offered himself faithfully for the people of God, when he fought against Goliath in single combat and alone repelled the common danger and reproach, or when he readily exposed himself to death to appease the Lord's displeasure, or when he offered himself, ready, to the divine vengeance for the safety of the suffering people. For he knew that it was more glorious to die for Christ than to reign in this world; for what is more excellent than to become Christ's offering? And so, although we frequently read that sacrifices were offered by him to the Lord, yet in this place he added: to you I will sacrifice an offering of praise. Not 'I sacrifice', he says, but 'I will sacrifice', signifying that the sacrifice is perfect when each one, released from the bonds of this body, stands before the Lord and offers himself as an offering of praise, because before death there is no perfect praise, nor can anyone in this life be proclaimed with definite commendation, since what comes after for him is uncertain. Death, then, is the loosing of soul and body. Then too we have shown that it is read in the Apostle: to be dissolved and to be with Christ is much better. And what does this loosing do but that the body is dissolved and rests, while the soul turns to its rest and is free, and, if it is godly, will be with Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
