[[commentary]]
quote='''
And since our discourse has come out at this point, let us consider for what reason the apostles, according to John, believed and rejoiced, while according to Luke they are rebuked as unbelieving; there they received the Holy Spirit, here they are bidden to remain in the city until they are clothed with power from on high. And it seems to me that the one, as an apostle, touched greater and loftier things, this one what follows and lies nearest to human things: this one used the circuit of history, the other conciseness; because neither can there be doubt about him who bears witness of things at which he himself was present, and his testimony is true. From this one too, who was found worthy to be an evangelist, it is right that every suspicion either of negligence or of falsehood be repelled. And therefore we think both true, not distinguished by a variety of statements or a diversity of persons. For although Luke says at first that they did not believe, yet he shows afterwards that they did believe. And if we consider the first things, they are contrary; if the following things, it is certain that they agree. Let us therefore consider the very words of Scripture.

John speaks thus: And the disciples rejoiced when they saw the Lord. So he says to them again: Peace be with you; as the Father has sent me, I also send you. And when he had said this, he breathed on them and said: Receive the Holy Spirit. Whose sins you forgive, they are forgiven them, and whose you retain, they are retained. But Luke says: And how they knew him in the breaking of the bread. And while they were saying these things, he himself stood in the midst of them and said to them: Peace be with you; it is I, do not fear. And troubled and terrified, they thought they were seeing a spirit. And it might seem that more were present here; but because here too it was in the evening of the day of the resurrection — for those two who, as the day was already drawing to evening, had gone in to stay with the Lord, when he suddenly withdrew himself, are shown to have returned to the disciples at the same hour, when he offered himself to be handled — and according to John too he is presented as having appeared to the disciples in the evening on that day, the first of the sabbaths, and as having offered his wounds to be handled, we thought it should be inquired into more carefully, lest it should bring any ambiguity.

For he seems to have shown himself separately to these eleven, just as he had already shown himself apart in the evening to Ammaon and Cleopas, and as those two, so too those eleven seem to have been able to come together to strengthen the rest. Indeed they also were troubled, as you have according to Luke, and therefore he opened their understanding, that they might understand the things that are written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
