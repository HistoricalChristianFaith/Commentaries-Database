[[commentary]]
quote='''
At the same time we must understand that this bodily endurance was not necessary, but voluntary. When He wills, He is taken, when He wills, He escapes. For how could He be held by a few who was not held by a whole people? But He would not have the impiety to be the deed of the many, in order that by a few indeed He might be afflicted, but might die for the whole world. Moreover, He had still rather heal the Jews than destroy them, that by the fruitless issue of their rage they might be dissuaded from wishing what they could not accomplish.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
At the same time understand that the suffering of the body was not of necessity but voluntary, and that he was not taken by the Jews but offered by himself. For when he wills he is taken, when he wills he slips away, when he wills he is hung up, when he wills he is not held. And here he had gone up to the brow of the mountain to be cast down, and behold, through the midst of them, the minds of the raging men suddenly changed or stupefied, he came down; for not yet had the hour of the Passion come. Indeed, he preferred still to heal the Jews rather than to destroy them, so that by the ineffectual outcome of their fury they might cease to will what they could not accomplish. You see, then, that here what he wrought was of his divinity, and there his being taken was of his will. For how could he be held by a few, who is not held by a people? But he did not want the sacrilege to be that of many. That he might turn back the odium of the cross upon the authors of the guilt, and be fastened by a few indeed, but die for the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
