[[commentary]]
quote='''
The Apostle, however, says: for we must all stand before the judgement seat of Christ, so that each one may receive what is proper to the body, according as he has done, whether good or evil. Many think these are contradictory and do not notice that the Savior spoke of the unbelieving and ungodly, who have not believed in the Lord Jesus. For he says thus: he who believes in me is not judged; but he who does not believe has already been judged, because he has not believed in the name of the only-begotten Son of God. And this is the judgement, that the light has come into this world, and men loved darkness rather than the light; for their works were evil. It is clear, then, of whom it was said, that is: of those who have not believed in the Lord Jesus. The Apostle too, although he said "all", certainly spoke of those who have believed, but are to render an account of their actions on the day of judgement. In fact, he himself says elsewhere that the testimony of our conscience will be revealed at the day of judgement, when our thoughts will either accuse one another, as it is written, or defend, and the secrets of the heart will lie open.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Do you wish to know how sweet are the judgments of the Lord? He who believes in him is not judged (John 3:18). Sweet, then, are the judgments to those who believe; but those who do not believe have not been condemned by the judgment of Christ, who came not to judge the world but to save and redeem it; rather they have undergone the judgment of their own impiety, since they would not believe in the remission of sins. For they cannot share in the benefit of him whom they refused to know. Those, then, who have not believed in him are seen to be unworthy of his judgment. For recognize what his judgment is, as he himself says: And this is the judgment, that the light has come into this world (ibid. 19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
