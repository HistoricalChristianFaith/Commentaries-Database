[[commentary]]
quote='''
And he added: for your arrows are fixed in me. He seems to say the same as holy Job, but the two are different. For Job too says: For the arrows of the Lord are in my body, whose fury drinks my blood; when I begin to speak, they prick me. He complains of the wound of his body; this one laments the wounds of his soul. And perhaps this one does penitence for sin, while that one pleads the cause of human infirmity and, as a defender, so to speak, of our weakness, asks the help of the Creator as a remedy for his work. This one, then, prays, that one pleads as an advocate; and therefore this one's grief is more vehement, because the wounds of the soul are heavier than those of the flesh. That one says the arrows of the Lord are in his body, this one laments them as fixed; that one's blood is drunk, this one's is poured out; that one is pricked, this one is wounded; the hand of God touched that one, upon this one it has been made firm with heavy weight; this one bewails that his soul is filled with mockeries, that one that his body is filled with sores. And by the hand of God we understand the power of punishing. This hand scourged the king of the Egyptians for the wrong done to Abraham, for the attempt upon Sarah's chastity; this hand sank the chariots and horses and peoples of the Egyptians in the depth of the Red Sea; this hand weighed down the mind of King Saul, so that he hated the grace of his preserver, and for his transgression of the heavenly command, deserted by his allies, bereft too by the slaughter of his sons, conquered by his enemies — and no sight is more shameful for a king — he turned his own sword upon himself, lest he live as an old captive, surviving both his sons and his kingdom. David experienced this hand in himself and lamented in his children the incest of one and the parricide of the other; and, what is heavier for a devoted father than the ruin of his own safety, he wept at once for the disgrace of his offspring and for the downfall of dutiful love; for one of them was inflamed to incest out of a brother's affection, the other armed to parricide out of zeal for chastity. How the borders of the virtues mocked them in the gravest crimes! Would that either the one had not loved his sister or the other had not avenged her! At last he himself, driven from the borders of his country by his son, fled as an enemy the one he wished to have as his heir; he feared to conquer, lest he be conquered at the cost of his dutiful love.

But perhaps someone may say: how was the hand of God in parricide or incest, when that is the work of the enemy? Let us recognize, then, that even where the devil wounds, the arrows of the Lord are said to wound. For so we read that, when in the council of the angels the Lord, turning to the devil, praised holy Job his servant, so that the envious one and adversary of the human race might be burned — for the praise of a man of lower substance is the condemnation of him who was cast down from a higher state —, the devil answered that Job did not worship the Lord for nothing, since by God's nod he abounded in all things. But put forth, he says, your hand and touch all that he has; let us see whether he does not bless you to your face. And God gave the devil power to put forth his hand upon all that Job had. When this was done and holy Job remained in his fortitude, because Job was not moved either by the death of his sons or by the loss of his means, the Lord spoke again to the devil, mocking him, that he had scattered all that Job had had and killed his sons, yet had in no way been able to move him from the post of his virtue. And he answered: Whatever a man has he will give for his soul. But put forth, he says, your hand and touch his flesh and bones. And again he received power to put forth his hand upon his body, yet so as to guard his soul; and he covered holy Job with sores, when he had gone out from the Lord. We notice, then, that it is called the hand of the Lord where there is the temptation of man under the devil's assault, since Job too said that it was the hand of the Lord that had touched him, and said that the arrows of the pirates were the arrows of the Lord: and he delivered me, he says, into the hands of the unjust. So in his own case he settled the question: because, when the devil wounds, the arrows are the Lord's, who permitted the devil the power of wounding. Indeed, if you order your little servant to be beaten, is he not said to have been beaten by you, even if he is struck by another standing by? There is also this reason, that the Lord gives the tempter power for this purpose, that the disposition of men may be proved in temptations; persecution happens for this, that faith may shine, virtue excel, the inner mind be made manifest to all.

Temptation, then, penetrates the inner parts of man like an arrow, and like the sword of God which searches the inner things. And the sword is the word of God, strong and sharper than every sharpest sword. Of this sword hear one saying to Mary: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed. For by the word of God all things are revealed, in whose sight all things are naked and open. The soul itself is divided, the inner marrows and the thoughts are made manifest, nor, lastly, is there any creature, as Scripture says, that hides itself from his knowledge. Let us sell everything, then, so as to buy the Word, and let us store him up in our inmost parts.

Lastly, the devil himself testifies that a man gives all he has for his soul, and confesses that the price of an entire patrimony is not worthy of the redemption of one soul. Why do we spare a patrimony which even the devil himself judges cheap for salvation? I have said too little in saying "for salvation"; he testifies that it is little even for error. Indeed, All these, he says, I will give you, if you fall down and worship me, and he showed not only the riches of the world but also honours and kingdoms. If it costs so much that the devil be worshipped, how much must a Christian offer, to be raised up with Christ? But let us dismiss the devil like the goat of sending-away into the desert; for he is not a faithful upholder of the truth, even if at times he transforms himself into an angel of light.

The testimonies of the divine Scriptures abound for us, by which we are taught that there is nothing more precious in man than faith, that no patrimony is so great as to be compared with the price of our salvation and of our soul. By faith Abraham left his country and land and even the kin he saw, and followed him whom he did not see as though he beheld him; Moses too valued the price of his soul above all the riches of Egypt. Why do I speak of sublime men? Rahab the harlot, that foreigner from the world, yet thought that her soul should be redeemed not only by contempt of all she had but even by the perils of her life; she denied the spies of Jesus son of Nave [Joshua] to her fellow citizens when they sought them, and preferred to hide rather than betray men who were enemies of her country, yet envoys of faith. Not the threats of her fellow citizens, not the perils of wars, not the burning of her country, not the dangers of her own people terrified her. Learn, man, learn, Christian, how you ought to follow the true Jesus, when a woman despised all that was hers and followed Jesus in figure because of the likeness of the name. Whence Solomon finely said: A man's riches are the redemption of his soul. Redeem, then, your soul. Money is cheap, but it becomes precious through faith; it is cheap when it is hoarded, precious when it is dispersed; for thus it is written: He has dispersed, he has given to the poor, his righteousness remains for ever.

If, then, you are such that you can despise not only all that is yours, but even your very flesh, for righteousness, than which no possession can be richer — for a clean man is a precious possession —, even if the higher rivers have shut you in, you cross over; even if the Lord has given power to tempt you, he nevertheless commands the devil himself to guard your soul, according to what is written: that you may destroy the enemy and the defender; for he tempts as an adversary, defends as a servant. For it is written: and the unicorn will be willing to serve you. For he serves who does not carry out what he wishes of his own will, but of necessity obeys imperial commands against his will. See the depth of Christ, who turned back upon the devil the price of his malice. He forces us to do what we hate; for not what I will do I do, as the Apostle said, but what I hate, that I do. The Lord turned it back upon him, so that he too often does not do what he wills, but does what he hates; indeed he guards the soul which he wishes to storm. We condemn the corruption of the flesh and follow it, like that widow who made void the faith promised to her husband and afterwards wishes to marry, which before she fled. He is an enemy to the saints and is employed as their defender, so that he may be punished the more, in that he who desires to harm does not dare to harm. And how much more tolerable it is to love the virtues, even if you cannot fulfil them, than to hate the virtues, which you cannot harm!
'''
