[[commentary]]
quote='''
Now a certain rich man was clothed in purple. It seems a narrative rather than a parable, since even the name is expressed. Not idly here did the Lord represent the rich man, who had enjoyed the delights of this world, as set in the misery of perpetual hunger in the underworld, and not without reason did he have five brothers. That is, the five senses of the body seem to have been associated in a kind of natural brotherhood, which seethed with immoderate and innumerable desires; but Lazarus he placed in Abraham's bosom, as in a kind of harbor of rest and retreat of holiness, lest, enticed by the pleasure of present things, we should remain in vices, or, overcome by weariness of labors, flee from hardships. Whether, then, Lazarus is one poor in this world but rich to God, or some apostolic man, poor in speech, wealthy in faith — for neither is all poverty holy nor are riches criminal, but as luxury defames riches, so holiness commends poverty — whether, then, it is an apostolic man who holds the true faith and does not seek the fillets of words, the paint of arguments, the showy veils of sentences: he receives a reward with interest as he attacks the heretics, Mani, Marcion, Sabellius, Arius and Photinus — for these are nothing other than brothers of the Jews, to whom they are bound by a brotherhood of unbelief — and as he checks also the desires of the flesh, which, as I said, smoke up through those five senses; he receives, I say, a reward with interest, whose compensation is overflowing abundance and whose interest is perpetuity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
