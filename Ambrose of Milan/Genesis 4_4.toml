[[commentary]]
quote='''
These were the gifts made by Abel. God had regard for his offerings because they came from the first fruits and, moreover, from the firstlings of the sheep, those which were fat and sleek. Note the fact that the offering was composed of living beings, not inanimate things. What is living, since it is very closely related to what has a spirit, is more important than what is earthly. The significance lies in the fact that the living thing comes first and that next it is endowed with spirit. The living being breathes and has a vital spirit. This is not true of the fruits of the earth. Again, note that he offered not seconds, but firsts—not lean animals, but fat ones. These are the sort of animals recommended and commanded by the Law, as related in the Scriptures: And when God shall have brought thee into the land of the Chanaanite, as he swore to thy fathers and shall give it to thee. And thou shalt set apart all male animals that openeth the womb for the Lord, and all that is first brought forth of thy cattle and thy flocks. Whatsoever shall be born thee of the male sex, consecrate to the Lord. The firstborn of an ass thou shalt change for a sheep, and if thou doth not change it, thou shalt redeem it. Consider the profound mysteries and the wealth of wisdom imbedded in these words which in their simplicity convey to us an abundance of grace of the spirit! The Chanaanites are people who are restless and uneasy. When you enter into their land and notice how they are devoid of morals as a result of their levity, uneasiness, and instability, then you have an occasion to show your constancy. Do not be disturbed by any trifling argument or flightiness of speech. These are the characteristics of the Chanaanite, inconsistency in language, emotional instability and restless contention. Be calm and present to them a tranquillity and serenity of mind and soul. Be like one who escapes the storms of the sea by casting anchor in a safe harbor.

The attainment of this goal is promised to you by the Lord. You are confirmed in your constancy by His assurance, which may be likened to an oath. But God does not solemnly swear because He has need of a believer's trust or because, deprived of the confirmation of witnesses, He requires the aid of an oath. He does not act as human beings do. We bind ourselves by a solemn oath to swear to tell the whole truth. God's very utterance inspires trust. His speech is a solemn oath. God is to be trusted, but not because of an oath. Rather, the oath is to be trusted because of God. Wherefore, then, does Moses speak of God as if He were in the act of taking an oath? Because we, as mortals, are bound by limitations. We wrap ourselves in the folds of public opinion as a sea-urchin does in his shell. We act like a snail who cannot breathe in the free air of heaven unless he is protected by his shell. We behave in a similar manner because we are cabined and confined in the earthy recesses of human custom. Wherefore, since we tend to believe that to be true which is confirmed by a solemn oath, lest we should falter in our trust, the same action is ascribed to God, who Himself does not take an oath, but is the avenging judge of those who commit acts of perjury. Hence it is written: The Lord has sworn and he will not repent: you are a priest for ever. He has assuredly kept His oath. He has given us a High Priest for ever, in order that you may know that there is a sanction for your oath and that an act of perjury will have its avenger in Him who does not deceive.

Expelling, therefore, all uneasy and disturbing thoughts from your mind and heart, God will give you free and complete ownership, so that you may till the soil in full security. You will be able to reap a harvest therein and not permit the people of Chanaan to gain entrance, that is to say, you will be able to avoid all offensive emotions. You will pluck out by root the vices of the Gentiles. You will overturn their groves by which truth is overshadowed and in which the clear vision of celestial knowledge is obscured by the dread darkness of disputation.

But you cannot attain this condition without the assistance of God. Therefore He said: He shall give it to thee, that is to say, He will give you thoughts that are on the highest plane, counsels that lead to peacefulness, and ideas that bring tranquility. When He has granted these favors, you will set apart all that opens the womb and sacrifice it to the Lord. God, although He has given you everything, does not exact anything from you. He has bestowed much in abundance for the use and support of men. There is no question of God's participation in an act of nature such as eating, drinking, sleeping. These and other functions of the body were granted to you freely by God. They are not in the nature of favors. However, thoughts that are holy are the gifts of God and are inspired by His grace. On the other hand, ordinary natural and human acts do not defile a man, but it is what comes out of the mouth. Deceit, false testimony, and sacrilege are the acts which bring defilement to man.

Let us make clean, therefore, the thoughts within us, so that our offering may not displease. Therein let us search for what opens the womb, that is to say, for what is just and excellent, because we owe to the Lord that which is holy. Yet we are not sanctified by carnal copulation, by conception, and by parturition, whereby the womb of a woman is opened and her virginity destroyed. Although a wife sanctifies a husband and a husband the wife, it frequently happens that a woman's womb is opened without the sanctification of wedlock. Again, it is not a question of sanctification being confined solely to the husband. The wife, too, partakes in it. The natural functions of each sex are distinct in the act of conception. The husband and wife contribute what is right and proper to the sex of each. The wife furnishes the generation of human succession, a function which is outside the province of a husband.

If such, therefore, be our experience in the flesh, let us turn to an examination of what is proper to the soul. There is no question that we have to deal here with something that is without sex, yet it fulfills all the offices of both sexes in that the soul conceives and, as in marriage, gives birth. Nature provides woman with a womb in which a living person is brought to birth in the course of time. Such, too, is that characteristic of the soul which is ready to receive in its womb-like recesses the seeds of our thoughts, to cherish them and to bring them forth as a woman gives birth to a child. This and no other is the meaning of the words of Isaias: We have conceived and brought forth the spirit of salvation. Some of these conceptions are associated with the female sex, such as malice of thought, petulance, sensuality, self-indulgence, immodesty, and other vices of that nature which tend to enervate the traits associated with what is distinctively masculine. These last are the virtues of chastity, patience, wisdom, temperance, fortitude, and justice, which make it possible for our minds and bodies to struggle with zeal and confidence in our pursuit of virtue. These are the conceptions to which the Prophet Isaias referred in the words, We have conceived and brought forth the spirit of salvation, that is to say, the characteristic masculine traits conceived and gave birth to the spirit of salvation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 10"

[[commentary]]
quote='''
Our souls should not only conceive, but should bring forth, after the allotted days are fulfilled, offspring such as these, lest the judgment day find us still-born. Of these births the Lord has said: Woe to those who are with child or have infants at the breast in those days! This birth should come to pass early in our lives. Our thoughts should be accompanied by a series of good works, so that our last days may find nothing imperfect or leave anything incompletely moulded in the anvil of our life's work. Make haste, therefore, and let your soul put your conceptions into form, bring them forth in good time, and quickly give sustenance to the offspring.

The form and importance of this offspring is demonstrated in the words of the Apostle: My dear children, with whom I am in labor again until Christ is formed in you. This is the form into which the whole contents of our minds should be poured and Christ should appear conspicuously in the life-giving womb of our souls. Our offspring should be faith and our sustenance, the precepts of Wisdom. With these precepts the infancy of our heart should be imbued, its boyhood be instructed, its youth be rejuvenated, and its old age grow old and grey: A spotless life is old age. That old age of the soul is good when no stains of perfidy have stained it. Hence Paul defends his offspring from this stain—through the Gospel did I beget you, he says—lest a gust of wind of false doctrine may severely affect them in their infancy. The Apostle brought into being, therefore, masculine thoughts. He yearned to bring to perfect manhood in the unity of the faith the people whom he instructed how to attain, in the recognition of the Son of God, the mature measure of the fullness of Christ. He knew that the sacrifice was an acceptable one to God, for we read in the Scriptures: Thou shalt set apart all that openeth the womb for the Lord. To this he added: All that opens the womb of thy cattle and of thy herds whatsoever thou shalt have of the male sex, thou shalt consecrate to the Lord, so that no detail be missing and everything be made clear.

The Apostle had spoken of the offspring of the better sort, that is, all that is associated with and is capable of reasoning. To this category he now added those of the common crowd whose concern is with what might be called perceptions of a lowlier kind. These are compared to cattle, devoid of reasoning power. However, these last, when directed by a righteous ruler, are easily tamed to follow his commands. They are trained to endure the yoke and to quicken their pace, to stop and turn aside at the words of their master. They become accustomed to perform and undertake any task which they are bidden to do as part of their daily routine of service. In this way, nature is overcome by the power of discipline. Those animals which do not have a share in our substance nevertheless recognize the words of command we give. While they are not themselves possessed of reason by nature, they assume by a sort of transfer the reasoning powers that we have in our own nature. We see horses which are aroused to action by the enthusiasm of the crowd, which rejoice in applause and pleasure in being petted by their master. We perceive that fierce lions lay aside their natural ferocity and at command assume an air of submission. They throw off their wild natures and adopt our manners and, although they are themselves objects of terror, they learn even to have fear. A dog is slain to inspire fear in a lion. The animal who is aroused to anger because of injury to himself is curbed by beholding one inflicted on another, whereby his will is broken. How often it happens that they learn to endure hunger even at the sight of their favorite food! How often through fear of their master do they under quick and unexpected orders refrain from food even when their jaws are ready to devour it! Thus they become oblivious of their own wills while complying with ours. How different from those wild animals or those herds of horses or flocks of any kind which run wild without anyone to control them! Deprived of any guidance or direction, they give free vent to their wild nature. This is the reason for placing herdsmen, shepherds, and guards of all sorts in charge of animals. Each one performs his individual duty, directing his charges in accordance with the type of animal committed to his care.

We see, therefore, that man is governed by two sorts of emotion, one that is under control and the other uncontrollable. In the latter case man rushes headlong, carried away by his animal nature, which itself lacks stability and co-ordination, into physical pleasures which are devoid of reason. In the former instance man's emotions are disciplined, subject, as it were, to the guidance and moderating influence of a leader. Whenever man's nature is under control, there it shows itself to be masculine and perfect. When, however, man's nature acts without a ruling force, there we find evidence of what might be called a domination exercised and imposed on man by the meaner sort. Thus we have a situation wherein a community which is deprived of the counsels of its king and chief citizens is subject to weakness in its body politic and wastes away its strength in effeminate action. Hence the apostolic injunction regarding the law in the members warring against the law of the mind, making a person a prisoner to the law of sin. Wherefore, in order to deliver himself from the body of this death, Paul placed his hopes, not in his own virtue, but in the grace of Christ. It is clear, therefore, that those emotions which are in accordance with the law of the mind emanate from God's goodness, whereas all other emotions are dominated by the body.

Those emotions, therefore, which are morally good are the first-fruits of our senses, whereas the others are of common and indifferent stock. This classification was used by Moses, following in that respect the language of the Jews, in his reference to the threshing floor of the Law: The tithes of your threshing floor and of your wine-vat thou shalt not delay to pay: thou shalt give the first born of thy sons to me. All the morally good emotions of your senses are the first fruits of the threshing floor of the soul in such a manner as grain is separated in an actual barn floor. On this barn floor the wheat and the barley are separated by a winnowing process from the chaff and from other impurities, while the solid parts, now rid of their lighter coating, settle on the floor. In a similar fashion our thoughts, when sifted, provide a solid food and pure nourishment for the exercise of virtue, as we read in the Scriptures: Not by bread alone does man live, but by every word of God. What is of no real value is dispersed like smoke or like a mist, which presents opportunities for the exercise of wickedness, while at the same time it is deleterious to one's eyes. Wickedness is rightfully compared to smoke which obscures one's vision with the darkness of this world.

On this subject the Lord says: When you are come into the land to which I bring you and shall eat of the bread of that country, you shall separate first-fruits of the Lord of the thing you eat. As you separate first-fruits of your barn-floors, so also shall you give first-fruits of your dough to the Lord. We are a composite of diverse elements mixed together, cold with hot, and moist with dry. This admixture is the source of many pleasures and manifold delights of the flesh. But these are not the first-fruits of this body of ours. Since we are composed of soul and body and spirit, the first place is held by that admixture in which the Apostle desires that we find sanctification: And may the God of peace himself sanctify you completely and may your spirit and soul and body be preserved sound, blameless at the coming of our Lord Jesus Christ. The first-fruit of this admixture are those of the spirit, that is to say, the creative and generating thoughts that emanate from the soul in its vigor. Only those thoughts are first-fruits which are devoid of malice and wickedness and all kinds of wrong-doing. There are, of course, certain bodily pleasures which are necessary. These are the pleasures of eating, sleeping, drinking, walking, and like functional processes. These, however, are not in the category of first-fruits. The Lord has put His stamp of approval, not on these, but on the others which we have mentioned, those thoughts and actions which imply chastity, piety, faith, and devotion. A clear example of this sort of thing is the offering of the patriarch Isaac. Here a father, totally immune to human emotion, proceeded to an act of sacrifice. He offered to God a clean victim and one devoid of fear and of cupidity of the flesh, although one might expect that his eagerness to offer would give way to his very real devotion as a father.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 1"

[[commentary]]
quote='''
Let us consider the implications of the word "first-fruits." Should they be measured from the point of view of time or of sanctity, in other words, does everything that is first-born have the sanctity of first-fruit? First-fruits are sanctified according to the Law, because therein we find the best kind of sacrifice, one which presents evidence of speedy fulfilment of a vow. Again, first-fruits become sanctified, not by time, but by devotion. The produce does not itself alone constitute sanctity. Hence, if the produce of the soil comes forth speedily without an accompanying fulfilment of a vow, an offence is committed. Not all first-born are therefore sanctified, but everything sanctified is also first-born. Hence, Cain was first-born, but not sanctified. Sanctified, too, was Israel, God's people, but they were not first in time. Yet Israel is called first-born, as it is written in the books of the Prophets: Israel is my first-born. And Levi was sanctified, but he was not first-born, for we hear that he was Lia's third son. Furthermore, the Levites were called first-born. Their name is derived from that fact, as it is written in Numbers: Behold, I have taken the Levites from the children of Israel, for every first-born that openeth the womb among the children of Israel and the Levites shall be mine, for every first-born is mine. Since I struck every first-born in the land of Egypt, I have sanctified whatever is first born in Israel. Therefore, the Levites were called first-born who were preferred by reason of their sanctification far beyond the rest of the children of Israel. Wherefore, listen to what the Apostle says in regard to the first-born: But you have come to Mount Sion and to the city of the living God, the heavenly Jerusalem and to the company of tens of thousands of angels and to the first-born of the churches which were enrolled in heaven. He has set down in order here four things: Mt. Sion, the city of Jerusalem, the company of the angels, and the churches of the first-born. The Lord took, therefore, the Levites from the midst of the people of Israel because He did not wish that they be involved in human cares. Rather, He wished to make them ministers of religion, and He set aside for Himself the first-born who open the womb of the Spirit. Hence they were not from the womb of nature like sinners given over to wrong-doing of all sorts, but are chosen for their avoidance of worldly things. Wherefore they have no part in what belongs to the crown and are not reckoned as part of the populace. They possess the Word of God in their own hearts, as we read in the Gospel: Where two or three are gathered together for my sake, there I am in the midst of them. And elsewhere: In the midst of you there stands one whom you do not know.

We realize, therefore, that above all things our trust in God should commend us to Him. Once we have this trust, let us put all our efforts into making our works perfect. This is indeed a full and perfect sacrifice, as the Lord tells us Himself in speaking of gifts and contributions that are His: You will offer to me my oblation in my festal days, sparing nothing, setting nothing aside, but offering a full, complete, and perfect sacrifice. By festal day is meant the Lord's Day, a time appropriate to acts of perfect virtue. These acts are made perfect if our souls quell the anxieties of this world and the enticements of the flesh in a victorious struggle over pleasure and its attractions. Thus the soul is free from the world and dedicated to God, departing not even in the slightest way from the path of good intentions and casting aside all distractions, whether of pleasure or of toil. The wise man, and no one else, celebrates with due solemnity this festal day. How difficult it is for one to be completely immune from distractions of this sort! Then you may learn to know the difference between what is a masculine and what is a feminine trait, for there is no virtue without toil and toil is a stepping stone to virtue. The very words of the Law point this out: The first-born of an ass thou shalt change for a sheep. The Law has established that an unclean animal shall not be part of a sacrifice, but in its place a clean animal be offered. The Law orders that the offspring of an ass which is unclean should be changed for a sheep, which is a clean animal and suitable for sacrifice. This is the literal meaning. If one were to pursue this matter further and seek for the spiritual sense of this passage, he will discover that the ass is a laborious animal, whereas the sheep is productive. This may be interpreted to mean that labor should be exchanged for produce, since the final result of work is the produce thereof. Or we may interpret the passage in this manner: Every action or labor of yours you can make commendable by the pure and simple manner in which you perform it.

And if thou do not redeem it, we are told, thou shalt kill it. The order literally states that another animal be offered for the unclean one or be redeemed by a price, lest there be something inferior or something unclean in the tithe offering. If we examine more deeply into the meaning of this, we perceive that we should refrain from anything which is destined to bear no fruit. He who redeems does, in fact, free himself and in doing so pays off a certain amount of indebtedness. Those works should be avoided which do not lead to real fruitfulness and to good results. I refer to those works of a worldly sort which cannot long endure. These works are barren, and devoid of truth and, though they are pursued with the greatest diligence, provide nothing for the soul. All of those works that impose servitude on our souls are of no avail, even if they are not entirely lacking in effectiveness. A mighty victory can, for example, take place and the accompanying glory of a triumphal march. But we discover frequently that these same people see their previous victory now changed to defeat. The tables are turned when the issue of war finds them in the hands of their enemies. Those who were victorious before now taste the misery of defeat. It is imperative, therefore, that you direct all your labors towards God and obtain His approval. The athlete, for example, relies on his own powers, not on those of another, in order to win a victory. But then, when the spectacle begins, he inclines to doubt his chances. When he has attained the crown of victory, then he becomes aware that this worldly glory fades away more quickly than the very leaves of his wreath of victory. When a pilot brings his ship to shore, he gives no thought to putting an end to his labors. He searches immediately for still another opportunity to work. When the soul is released from the body and has reached a terminus of this life, there is still the dubious problem of the judgment to come. What is thought to be a terminus turns out to be none at all. Wherefore let us by our prayers, our purity of conscience, and our spirit of charity cling closely to our God. Let us gain His favor by beseeching Him to rescue and free us from the cares of this world as from some cruel and boorish master. Let the substance of our prayers be that we be released from slavery to this world, so that we may obtain the liberty of celestial knowledge, wherein alone is true freedom.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 2"

[[commentary]]
quote='''
What is related in the Law may be cited in support of our argument. When the Egyptians oppressed the Jewish people by condemning them to various labors, to toils in rocky or in muddy soil, the children of Israel groaned and caused the Lord to have pity on them. And He said to Moses: I have heard the groaning of the people of Israel, wherewith the Egyptians have oppressed them into slavery, and I have remembered my covenant. Therefore say to the children of Israel: I am the Lord who will bring you out of the power of the Egyptians and will deliver you from bondage to them and redeem you with a high arm and great judgments. And I will take you to myself for my people. I will be your God. And you shall know that I am the Lord your God who will bring you out of the power of the Egyptians and will bring you into the land, concerning which I lifted up my hand. See how the Hebrew people enjoyed the fruits of their labor. They toiled in the mire with the hope of an eternal kingdom. Wherefore in the Scriptures the Lord took pity even on the empty toil of the Gentiles in the brickyards, a prey to filthy superstition and the pleasures of the flesh. A solid wall of faith, however, they were unable to build. Christ addresses the people as if speaking to the offspring of a beast of burden: Come to me, all ye who labor, and I will give you rest. Take my yoke upon you and learn from me, for I am meek and humble of heart and you will find rest for your souls. I seem to be more fully aware of the words and the secret meaning of the Law when I read that call of Christ. He has taught us that an ass should be exchanged for a sheep or redeemed for a price. In this way we not only can exchange an ass for a sheep, that is, an animal that is unclean for one that is clean, but we can even redeem it. A deeper meaning seems to be implied in this statement. If by a sacrifice of purification and by the rite of baptism we first cleanse ourselves of the stains of our offenses, then we are prepared to redeem those very sins of ours by the exercise of good works and by the price of faith and by contrition.

Our price is the blood of Christ. Hence the Apostle Peter says: Not with gold or silver you were redeemed, but with the precious blood. And Paul says: You have been bought with a price. Do not become the slaves of men. Therefore, not without reason did they marvel in the Gospel on seeing the Lord Jesus sitting on a colt, because the race of the Gentiles is to Christ like a victim which, according to the Law, is considered to be unclean. Hence we read in the Scriptures that the Levites redeemed them. In this way they would be able by the sanctity of their lives and by their prayers to take away the sins of their people. Here in the figure of the Lamb we have the true Levite who was to come and preside over the mysteries. By His own Passion He would take away the sins of the world. The word "Levite" means "raised up for me" or "on me he is light." The word "Levite" bears witness to a perfection in virtue by which the people attain holiness. He, therefore, is the expected who was born of a virgin and who came for my salvation and for the salvation of the entire world. For me He was sacrificed; for me He tasted death; and for me, too, He rose from the dead. In Him has the redemption of all men been undertaken; in Him is their resurrection. He is the true Levite. We, His Levites, He would bring closer to God so that we might pray to Him unceasingly, hope for salvation from Him, shun all worldly affairs, and finally be numbered among the elect, as it is written: O Lord, possess us. Then alone is found true possession when we are not subject to the temptations of life and when we bring forth perfect fruit for all time. The Levite is one who redeems, because a man of wisdom redeems the man who is weak and foolish. He is like a physician who revives the spirit of his helpless patient. In imitation of that Physician who came down from heaven, he assuages the convalescent with healing words of wisdom, in order to point out to men the ways of wisdom and to reveal the paths of wisdom to little ones. He perceived that those who suffer cannot be healed without a remedy. For this reason He bestowed medicine on the sick and by His assistance made health available to all, so that whoever died could ascribe to himself the real causes of his death. That man was unwilling to be cured, although he had a remedy at hand which could effect his escape from death. The mercy of God has been made manifest to all. Those who perish, therefore, perish through their own negligence, whereas those who are saved are freed by the judgment of God, who wishes all men to be saved and to come to the recognition of truth. Hence, if Sodom had fifty just men, it would not have been destroyed. If it had ten just men, Sodom would have been saved, because a declaration of the remission of sin would have rescued their souls from servitude, and the plenitude of perfect knowledge would not have allowed their hearts to be consumed in the devouring flames of lust.

The reference just noted to people in large numbers has a special significance. Groups of people of like character have a tendency to lift the moral tone and to contribute to society as a whole something of their own selves, which is a contributory factor to the group's preservation. Numbers blunt the force of envy, confound wickedness, arouse men to virtue, and enhance gracious acts. No one ought to begrudge praise to another person who benefits him. The man given to wickedness often imitates the character of the person who attempts to aid him. At any rate, he reveres him and often even loves him. The same man, too, if he knows how to benefit other men, is made better by this exercise of his zeal. In that way he binds people together and increases the tolerance of citizens for each other, thereby bringing fame to their communities. How happy is that city which has many just men! How celebrated does it become in the lips of all men! How unqualifiedly blessed for ever is that city reckoned to be! How happy I am to see so many gentle and wise people live long lives, when I behold chaste maidens and dignified and elderly widows living virtuous lives! The latter constitute in a way a venerable senate of the Church to be revered and imitated because of their conspicuous air of gravity—a fact which is conducive in itself to greater charm of manners! My joy is not for these people themselves who are subject to the manifold ills of this world while they are alive. I rejoice, rather, that many are benefited by the lives of such people. Again, when a person like this passes away, although he has by his prolonged age deferred death, I am greatly afflicted for the reason that a host of younger men have been deprived of the stout defence of old age. Wherefore the demise of citizens of dignity and wisdom, both men and women, gives us the first indication that a city is destined to perish or that ruin is imminent. When this takes place, the gates are open for a flood of misfortunes. A city, therefore, in its entirety is strengthened by the presence of men of wisdom in its midst and is weakened at their departure. If their physical presence is important, their discourse, also, when it is in a high plane of serious counsel, tends to put courage in the heart and soul of each and every individual. If we add to this the practice of wide reading, then we have a group of senators whose wise precepts and counsel constantly have their effects in that interior city which is in the heart of each one of us.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 3"

[[commentary]]
quote='''
We see, then, why Moses called the Levites first-born and redeemers of others, since they offer to one man the mentality of old age, corresponding to his own mature judgment and usefulness, and to another grant redemption. Hence Moses indicated that the cities of the Levites in the Old Testament served as a refuge, because he who fled to where the living Word of God resides, a place like a city well-protected and defended, that person attained for himself the kind of liberty which endures. If a man was guilty of involuntary homicide and if he took refuge in the cities of the Levites, no one was permitted to slay that person, provided he had his residence in those cities. In a similar way, if a person feels sorrow for a sin which was the result of an imprudent or involuntary act, the Law releases him from every penalty due to his crime, provided he remains in residence among the Levites and has no intention of leaving those instructors who dispense the commands of God.

Do not think it unreasonable that men given to evil reside together with men of good will and that those stained with guilt live side by side with the godly. Those men who have been polluted with the contagion of sin have need of purification. Thus there is a certain agreement of contraries. The Levite who has relinquished the pleasures of this world is an exile from guilt. In the same way, the person who is guilty of homicide is a fugitive from his native land. There is this difference, however, that the latter abandons his people because of fear of the Law, whereas God's minister renounces all contacts with human passions and frees himself from the exigencies of concupiscence by his pursuit of virtue. This statement is not an exaggeration. In a sense, the Levite does violence to himself, so as to rid himself of bodily pleasures with consequent annihilation of his own flesh. For example, Moses slew an Egyptian and became a fugitive from the land of Egypt so as to avoid the king of that land. But he would not have slain the Egyptian if he had not first destroyed in himself the Egyptian of spiritual wickedness and had not relinquished the luxuries and honors of the king's palace. He considered that the reproach of Christ was a far better patrimony than the treasures of Egypt. To the foolish this indeed seems to be a reproach, but the reproach of the Cross of Christ is in reality God's power and wisdom.

There are, in fact, two main types of power in God. There is the power which forgives and the power which punishes. Sins are forgiven by the Word of God of which the Levite is the interpreter and, indeed, the executor. Sins are forgiven by the priest in his sacred office and ministry. They are punished, too, by men who exercise power temporarily, that is to say, by judges. The Apostle says: Dost thou wish then not to fear the authority? Do what is good and thou wilt have praise from it. For it is God's minister to thee for good. But if thou dost what is evil, fear, for not without reason does it carry the sword. For it is God's minister, an avenger to execute wrath on him who does evil. Sins are punished even by people, as we read in the Scriptures, because the Jewish people were often waylaid by men of other races. Because of some offense against God's majesty these men were frequently aroused by His command. Even the person who unwittingly committed a murder was still within the ministry of God, since the Law makes this statement regarding him: God delivered him into his hands. His hands, therefore, served as an instrument of divine punishment. The Levite is, then, the minister who remits, whereas the man who in the example just cited unwittingly and unwillingly struck another in a homicidal act became in fact an administrator of divine punishment. See to it that Christ is infused into the act of slaying an impious man and that sanctification accompany and be part of your attempt to abolish what is abominable.

The Lord has said: On that day in which I shall slay every first-born in the land of Egypt, I shall sanctify to myself whatsoever is first-born in Israel. This does not refer to one occasion or to one crisis, but to all time. Once wickedness is renounced, virtue finds immediate entrance. The departure of evil brings about the introduction of virtue and the same effort that banishes crime leads to an adherence to innocence. You have an example of that in the Gospel. At the moment when Satan entered into the heart of Judas, Christ departed from him. At the very instant that Judas received one, he lost the other: And after the morsel Satan entered into him. Jesus therefore said to him, "What thou dost, do quickly." Why is this? Because, once Satan found entrance into Judas, at that moment there came about his departure from Christ. He is ejected, then, and banished, since the person who trafficked with the Devil could have no fellowship with Christ. There is no harmony between Christ and Belial. Wherefore, on receiving the command to leave, Judas immediately departed, as we read in the words of the Evangelist: When he had received the morsel, he went out quickly. Now it was night. It was not merely a question of departure, but it was one which was immediate and at night. The fact that one who deserted Christ should be connected with the darkness of night should excite no wonder. Just as the person who is received by the Devil is excluded from Christ, so on the other hand Zacchaeus, at the moment when he forsook gain, proceeded to welcome Christ. Marveling at the way Zacchaeus climbed a tree to see Him, the Lord was moved to say: Zacchaeus, make haste and come down, for I must stay in your house today. And he made haste and came down, and welcomed him joyfully. By receiving Christ he got rid of avarice. He sent perfidy into exile and renounced deceit. Otherwise, there is no reason for the entrance of Christ unless vice is excluded, because He has no barter with wrong-doing. Hence He ejected the money-changers from the temple, because He did not wish to associate with them. Wherefore, being aware that he could not receive Christ if he followed his old way of life, Zacchaeus ordered his former vices to leave his home in order that Christ might find an entrance therein. While people murmured that Jesus had gone to be a guest of a man who was a sinner, Zacchaeus was right in inviting the Lord to stay: Behold, Lord, I give one-half of my possessions to the poor and if I have defrauded anyone of anything, I restore it twofold. In this way he replied to those who said that a sinner ought not to offer hospitality to Christ. He said, in effect: "I am no longer a publican, no longer the Zacchaeus of old, the thief and the cheat. I restore what I have taken. I, who used to take, am now the giver. I, who formerly despoiled the poor, now make restitution. I, who plundered what belonged to others, now give of my own." Error took to flight, once Christ made entrance. Where the light of eternal light shone, there no longer existed that blindness caused by pleasures of the flesh.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"

[[commentary]]
quote='''
We have discussed the problems connected with the first-born. Now let us turn our attention to the characteristic of fatness or richness of which David speaks intelligibly when he says: Let my soul be filled as with marrow and fatness. Before that he had said: And may thy whole burnt offering be made fat. By this he means that the requirements for a sacrifice are that it be fat or rich, that it be glistening and that it be weighted with the sustenance inspired by faith and devotion and by the rich nourishment of the Word of God. Frequently we use the word "fat" or "rich" when we refer to something that is heavily and elaborately adorned, and to the finest victim as one that is not thin and scrawny. Wherefore we denominate as "rich" a sacrifice which we desire to be regarded as the "finest." We also have proof of this when we consult the prophetic passage in the Scriptures where fine cows are compared to years of fertility.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 5"
