[[commentary]]
quote='''
For what else is asked of you, O man, but that you fear God, seek after him, walk after him, lay hold of his ways? With what, he says, shall I lay hold of the Lord? Shall I lay hold of him with burnt offerings? Not with ten thousands of kids, not with thousands of rams, not with the fruits of ungodliness is the Lord reconciled and are sins redeemed; but in a good life the Lord's grace is laid hold of. It has been told you, he says, O man, what is good; or what else does the Lord require of you but that you do justice, and love mercy, and be ready to go with your Lord? So the Gospel says to you: Arise, let us go from here; the Law says to you: You shall walk after the Lord your God. You have learned how to flee from here: why do you delay?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
