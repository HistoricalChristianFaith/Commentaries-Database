[[commentary]]
quote='''
Great is the virtue of fasting; in short so splendid is the warfare that it delighted even Christ to fast; and so mighty that it raised men to heaven. And, that we may use human rather than divine examples, a word sent from the fasting mouth of Elias closed heaven to the sacrilegious people of the Jews. For when an altar had been set up to an idol by king Achab, at the word of the prophet for three years and six months dewy rain did not fall upon the earth. A worthy punishment fittingly to check insolence, that heaven should be closed to the impious who had polluted the things of earth!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 2"
