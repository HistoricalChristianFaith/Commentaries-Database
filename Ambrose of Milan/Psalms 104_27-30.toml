[[commentary]]
quote='''
For all things wait upon you, that you may give them food in due season; when you give it to them, they will gather it; when you open your hand, all things will be filled with goodness. But when you turn away your face, they will be troubled. You will take away their spirit, and they will fail and return to their dust. You will send forth your spirit, and they will be created, and you will renew the face of the earth. Do you recognize what the food is which God supplies to men? It is the food on which his only-begotten Son, our Lord, feasts according to the will of the Father, as he himself says: My food is to do the will of my Father who is in heaven. This food is saving for us, and all the things of God are saving.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
