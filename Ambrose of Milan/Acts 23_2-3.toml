[[commentary]]
quote='''
There, when the Jews had at some point stopped striking Paul because the soldiers intervened, the high priest Ananias himself ordered those standing by to strike his mouth. To him the Apostle answered: God shall begin to strike you, you whitewashed wall; and do you sit judging me according to the law, and contrary to the law order me to be struck? He certainly knew how to strike back, who struck back the high priest with a heavier fist; for he himself was struck bodily, while he gave him back the word that he would be struck in the soul by Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
