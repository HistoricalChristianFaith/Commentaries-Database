[[commentary]]
quote='''
Nor do any undertake this trading except the sons of Jacob, and they of more advanced age. Therefore ten go; the youngest does not go. His father did not send him, lest, he says, infirmity befall him. Benjamin, the youngest, was still liable to infirmity. It is indeed the patriarch Benjamin of whom we read, but that Paul of the tribe of Benjamin was being prefigured. Rightly did Jacob have misgivings about his infirmity. Indeed, he was made infirm that he might be healed: he suffered blindness, but this infirmity was for his salvation.

Indeed, that blindness brought light. We have heard the history; let us learn the mystery. Without Benjamin the patriarchs had first set out; without Paul, the apostles. Neither came first, but each, summoned by the first, made the merchandise of the earlier ones more abundant by his coming.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 8"
