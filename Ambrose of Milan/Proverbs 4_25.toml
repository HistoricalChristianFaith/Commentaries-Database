[[commentary]]
quote='''
Like an excellent artist, the soul leads the service of the body wherever it will, and fashions from it the form it has chosen, and makes whatever virtues it wishes resound in it, playing now the melodies of chastity, now the melodies of temperance, the song of sobriety, the sweetness of integrity, the delight of virginity, the gravity of widowhood. Sometimes, however, the player suffers along with his instrument: and therefore play honourable strains, so that the suffering-along may be honourable. For he who sees is often affected by seeing, and he who hears by hearing. And therefore Scripture says: Let your eyes see right things, and below: Do not be much with a strange woman. Do not fix your gaze on the eyes of a young girl, do not fix your attention on the words of a harlot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"
