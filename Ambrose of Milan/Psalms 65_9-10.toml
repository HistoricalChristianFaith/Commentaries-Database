[[commentary]]
quote='''
Good is the drunkenness of the spiritual table; finally, the cup that makes drunk, how glorious it is (Ps. 22 (23):5)! And elsewhere you have: Make its streams drunk, multiply its generations (Ps. 64 (65):11); because the drunkenness of the earth, when it has been drenched with heavenly rain, is wont to stir up the seeds and multiply the fruits. And so, when the Word, which comes down from heaven like rain, has made drunk with divine preaching the veins of our earth, that is, of the soul and the mind, zeal for diverse virtues is roused, and the fruit of faith and of chaste devotion grows up, and rightly is it said to him: You have visited the earth, and made it drunk (Ps. 64 (65):10). For by taking up a body he visited it, to heal the sick; he made it drunk with spiritual grace, to soothe the anxious with joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
