[[commentary]]
quote='''
If you see your little servant confessing his own sins and offering himself to punishment of his own accord, you are moved, you pardon: and do you distrust the compassion of the Lord? The judge himself, who in very many cases may not refrain from the sword, because he serves the laws, can yet make a gift of the penalties; and do you still tremble at what you should ask of the Lord of the laws and author of mercy, whose will is law and who has the right of granting, if only you ask that your sins be granted to you, and do not consider your honours or blush before your friends, lest you seem to have bent your dignity? The friend of God, the prophet of God, the king chosen by God himself and anointed to the kingdom offered himself of his own accord to the scourges and did not blush; and do you blush? That bashfulness will not help you much when you come to the judgement of God; but you will repent of that shame when, set in the sight not only of men but also of angels and all the heavenly powers, you begin not to deny your own sins. How will you excuse yourself, when you have committed so much? You will plead the infirmity of your condition, because no one is without sin. It will be answered to you: "You ought, then, to have repented; I had given a remedy, why did you refuse it?" You will add your shame, that you blushed for your honours. He will say: "If you blushed for me before your friends, I too will blush for you before my Father who is in heaven. Learn that what is written is true, that there is a bashfulness that brings sin. David set his grief in his sight, that he might never forget it; David himself declared his iniquity; David thought of his sin, not of his riches; David did not blush to review his sins, so as not to blush for them when set in my judgement: and did you blush? My little servant Job would not be in rest today, if he had blushed before those three kings his friends, nor David himself, if he had blushed to confess his own offences. Since, then, he did not blush to open his sins to me, neither will I blush to unlock my secrets to him. And since each of them did not blush to put the price of his deeds in my power, to commit himself to my judgement and will, neither will I blush for such little servants, so as to call them friends who have been eager to do my will. And therefore, since they were before in sorrow, they are now in consolation; you, because you were in delights, are now in torments. A great chaos is between you, so that neither their grace can pass over to you nor your punishment to them." Do you hear, then, what David says? Hear, while you are allowed to correct and amend; if you amend here, you will rest there. Let not the sweet things of the world and the pleasant things of this age delight you; they commonly vomit up heavy gall. He who chose the death of the saints rather than the life of the wicked did not seek pleasant things when set in kingship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
