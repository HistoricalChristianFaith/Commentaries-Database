[[commentary]]
quote='''
While she says this, the Word sent his working as through an opening, not yet face to face; he sent it as a hand. And my womb she says was troubled over him. And I rose to open to my brother. My hands dripped myrrh, my fingers are full of myrrh upon the hands of the bolt. Let us consider what this signifies. First, as I said, God the Word is seen in his works as through an opening, not fully and perfectly. Then love increases and what has been conceived grows, and from his seeds, which the soul has received in a kind of intelligible womb, she desires to see the whole fullness of his divinity dwelling in him bodily, as we read. She rose to see that Word of God more closely. And in this very thing her advance is signified, that she rose through vigour and virtue. For by the presence of the Word the soul drew in virtue, just as the presence of Mary, when she was heavy with child, so instructed John, placed in the womb, that he leapt in the womb and exulted, recognizing the presence of the Lord. She rose to open, and her works and deeds were mortified to the world. For such ought the soul to be which is to receive the Word, that it die to the world and be buried together in Christ; for so is Christ found, and such a lodging he seeks for himself. Then the very ministers of her workings, that is, the hands and fingers by which Christ is grasped, are mortified; these fingers we can take to be the works, the prominent parts as it were, of our deeds. And so, as if from her embrace, when she was already spreading out her intelligible hands and fingers to grasp the Word, the devout soul says that it had passed by her, but not yet passed through her. And this marks an advance, when the Word of God passes by and passes through the soul, because it is written: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed. Here she is still passed by, not passed through; like Mary, she is perhaps passed through in the later verses, where the Lord Jesus is set like a seal in her midst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
My brother put his hand in from the opening, and my belly was troubled over him. I rose up to open to my brother. My hands dripped myrrh, my fingers were full of myrrh. First, then, he puts in his hand as from the opening, when God is judged from his works; hence he says: If you do not believe me, believe the works (John 10:38). Then love increases, and, once conceived, grows deep within the inmost bowels. Then, his seeds having been poured into the intelligible womb in which is the receptacle of the Word, our soul desires to draw in his fullness dwelling bodily; for the womb of women is not troubled, except of those who are heavy with child. The soul, then, rises to open to the Word of God; but while she spreads herself out and opens, so that by receiving the Word she may mortify the works of this world, like him who said: We carry about in our body the mortification of the Lord Jesus (2 Cor. 4:10). So, while she opens, the Bridegroom passes; for he wishes always to be sought, and to be found more often. And if he finds the door shut, he knocks; and if through delay he has been shut out, he withdraws; but he quickly returns and knocks again, so that at least afterwards he may find his Bride prepared.

It can indeed also be taken in this way, My brother passed: just as we read that he penetrated the inmost marrow of the beloved, as it was said to Mary: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed (Luke 2:35). Then the Bride added that her soul went out in his word, which happens when the soul is a pilgrim away from the body and is present to God. Hearing this, the Bridegroom sent his working, the Word, as through a cleft, not yet face to face: he sent it as a hand. And my belly, she says, was troubled over him. Whoever lives so can say:

My brother put his hand in through the opening, and my belly was troubled toward him: I rose to open to my brother. It is good that our inward parts be troubled at the coming of the Lord. If Mary was troubled at the coming of the angel, how much more are we troubled at the coming of Christ! For as divine things flow in, bodily affection becomes a stranger, and that habit of the outer man fades away. You too, be troubled; you too, make haste. They are commanded to eat the lamb in haste. Rise, open: Christ is at the door, he knocks at the porch of your house: if you open, he will enter, and he will enter with the Father. Not only when he has entered does he leave a reward, but even before he enters he sends a reward ahead. Still the soul is troubled, still she gropes along the walls of her house, still she seeks the door where Christ is, still she loosens the bond of the flesh and the enclosure of the body, still Christ knocks outside.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
