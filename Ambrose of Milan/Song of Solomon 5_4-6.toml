[[commentary]]
quote='''
While she says this, the Word sent his working as through an opening, not yet face to face; he sent it as a hand. And my womb she says was troubled over him. And I rose to open to my brother. My hands dripped myrrh, my fingers are full of myrrh upon the hands of the bolt. Let us consider what this signifies. First, as I said, God the Word is seen in his works as through an opening, not fully and perfectly. Then love increases and what has been conceived grows, and from his seeds, which the soul has received in a kind of intelligible womb, she desires to see the whole fullness of his divinity dwelling in him bodily, as we read. She rose to see that Word of God more closely. And in this very thing her advance is signified, that she rose through vigour and virtue. For by the presence of the Word the soul drew in virtue, just as the presence of Mary, when she was heavy with child, so instructed John, placed in the womb, that he leapt in the womb and exulted, recognizing the presence of the Lord. She rose to open, and her works and deeds were mortified to the world. For such ought the soul to be which is to receive the Word, that it die to the world and be buried together in Christ; for so is Christ found, and such a lodging he seeks for himself. Then the very ministers of her workings, that is, the hands and fingers by which Christ is grasped, are mortified; these fingers we can take to be the works, the prominent parts as it were, of our deeds. And so, as if from her embrace, when she was already spreading out her intelligible hands and fingers to grasp the Word, the devout soul says that it had passed by her, but not yet passed through her. And this marks an advance, when the Word of God passes by and passes through the soul, because it is written: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed. Here she is still passed by, not passed through; like Mary, she is perhaps passed through in the later verses, where the Lord Jesus is set like a seal in her midst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"
