[[commentary]]
quote='''
I rose to open to my brother; my hands dripped myrrh, my fingers were full of myrrh upon the handles of the bolt. Let us consider what this signifies. First, as I have said, God the Word is seen in his works as through a cleft, not fully and perfectly; then love increases and what was conceived grows up, and from his seeds, which the soul has received in a kind of intelligible womb, she desires to see the whole fullness of his divinity dwelling in him bodily, as we read. She rose so that she might see that Word of God more nearly, and in this very thing her advance is signified, that she rose through vigor and power; for the presence of the Word drew in the power of the soul, just as the presence of Mary, when she was heavy with child, instructed John, who was placed in the womb, so that he leapt forth from the womb and exulted, recognizing the presence of the Lord.

She rose to open, and her works and deeds were mortified to the world. For such must be the soul that is to receive the Word: she must die to the world and be buried together in Christ; for so is Christ found, and such a lodging does he seek for himself. Then the very instruments of her workings, that is, the hands and fingers by which Christ is grasped, are mortified: and these fingers we can consider as the outstanding works of our deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
