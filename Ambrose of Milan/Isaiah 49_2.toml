[[commentary]]
quote='''
Let us bare our limbs to the good wound, let us bare them to the chosen arrow: this arrow is Christ, who says: He has set me as a chosen arrow (Isa. 49:2); it is good, then, to be wounded by this arrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
