[[commentary]]
quote='''
Indeed the Lord, knowing that no one can fully believe without the gospel, because as faith begins from the Old Testament so it is completed in the New, when he was asked about himself, showed who he was not by any word, but by deeds. Go he says tell John what you have seen and heard. The blind see, the lame walk, the deaf hear, the lepers are cleansed, the dead rise, the poor have the gospel preached to them.

A full testimony, surely, by which the prophet might recognize the Lord; for of him and not of another it had been prophesied that the Lord gives food to the hungry, the Lord raises up those dashed down, the Lord looses the fettered, the Lord enlightens the blind, the Lord loves the righteous, the Lord keeps the strangers, he will receive the orphan and the widow and will destroy the way of sinners. He who will do these things, he says: the Lord shall reign for ever. So these are the marks not of human but of divine power: to open to the blind the darkness of perpetual night and to heal with infused light the wounds of sunken eyes, to bring hearing into the ears of the deaf, to restore loosened limbs whose joints have slackened, and also to call back the dead into the light, pouring back the vigour of life.

These things before the gospel were either rare or none. Granted that Tobias received his eyes: he is a single example, and yet that medicine was an angel's, not a man's. Granted that Elijah raised a dead man: yet he prayed and wept, this one commanded. Granted that Elisha caused a leper to be cleansed: yet there it was not the authority of the command that availed, but the figure of the mystery. Granted that the meal, multiplying itself at the prophet's commands, did not fail for the food of the hungry widow: yet that meal kept one widow, or rather the figure of the sacrament, foreshadowed, kept that same widow too. But yet these are still small examples of the Lord's testimony: the fullness of faith is the Lord's cross, his death, his burial.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
