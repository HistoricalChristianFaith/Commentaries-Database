[[commentary]]
quote='''
He rightly puts a question to them, that they may condemn themselves by their own words, as it follows, What then will the Lord of the vineyard do to them?

He says, the Lord of the vineyard will come, because in the Son is present also the Father's majesty; or because in the last times He will be more graciously present by His Spirit in the hearts of men.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Beautifully, then, he asks, so that they may condemn themselves by their own sentence. But he says that the Lord of the vineyard will come, because in the Son the Father's majesty also is present, or because in the last times he breathes upon human affections with a nearer presence. So they themselves pronounce sentence upon themselves, that the wicked should perish and the vineyard be transferred to other tenants. Let us consider, then, who the tenants are, and what the vineyard is.

The vineyard is our type, because the people of God, founded on the root of the eternal vine, rises above the earth and, overspreading the poor soil, now ripens into budding flower, now is clothed in the greenness spread around it, now takes up a gentle yoke, when it has grown up with more mature arms like the shoots of a fruitful vine. For the husbandman is the almighty Father, the vine is Christ, but we are the branches, and unless we bear fruit in Christ we are cut down by the sickle of the eternal Cultivator. Rightly, then, the people of Christ is called a vineyard, either because the sign of the cross is marked on its forehead, or because its fruit is gathered at the last season of the year, or because for all, as for the rows of the vineyard, so for poor and rich, lowly and mighty, slaves and masters, there is in the Church of God an equal measure, no distinction. As the vine is wedded to trees, so the body is joined to the soul, and the soul also to the body. As the vineyard is raised up while it is yoked, as when pruned it is not diminished but increased, so the holy people is set free while it is bound, is lifted up while it is humbled, is crowned while it is cut down. Moreover, as a tender shoot cut from an old tree is grafted into the growth of another root, so this holy people, the scars of the old shoot smoothed away, is cherished on that wood of the cross as in the bosom of a loving parent and grows into it; and the Holy Spirit, as if let down into the deep trenches of the earth, so poured into this prison-house of the body, washes away with the watering of saving water whatever is foul, and raises the bearing of our members to a heavenly discipline.

This vineyard the diligent husbandman is wont to dig, to yoke, to prune, and, when the mounds of earthly mass have been cleared away, now to bake the hidden parts of our body with sun, now to drench them with rain, accustomed to clear the field of growth, lest the bud be harmed by brambles, lest the shade of the leaves run riot and the unfruitful boasting of words, overshadowing the virtues, hinder the ripening of our natural disposition. But far be it from us to fear anything adverse for this vineyard, which the ever-watchful guardian of the Lord Savior has fortified with the wall of eternal life against all the allurements of worldly wickedness. He stretched out its branches as far as the sea; the Lord's indeed is the earth. Everywhere God the Father is worshipped, everywhere Christ the Lord is adored.

This is our vintage. Glad, then, and secure, let some load their laps with clusters of mellow grapes, let others of us taste the heavenly gifts with our mouths, and let most of us, pressing out the fruit of the divine gift with the steps of good wills, dye our feet, bared with the buskins pulled off, in the flowing must; for the place on which we stand is holy ground, and therefore the shoes must be loosed, so that the spiritual footstep, as it ascends the tribunal of the sacred seat, may be stripped of the knots of bodily bonds; for it is fitting that the vintage of the whole world should be here, where the vineyard of the whole world is.

Behold the acceptable time, in which the year is not stiff with the winter frosts of darkening unbelief, nor does the shapeless crust of blasphemy harden under deep snows in a lasting frost, but the earth, freed from the storms of sacrilege, now is in labor with new fruits and brings forth the old; for the storm of all dissensions has subsided; all the fires of worldly greed and every heat, by which the people of Italy were scorched in the blazes of perversity, once Jewish, lately Arian, are now tempered by a serene breeze. The tempest is calmed, concord sails, faith breathes; eagerly the sailors seek again the harbors of faith which they had left, and press sweet kisses on the shores of their homeland, rejoicing that they are freed from dangers, released from errors.

Hail, vineyard worthy of so great a guardian: not the blood of one Naboth, but of countless prophets, and, what is more, the precious blood of the Lord has consecrated you. He, though he did not, terrified by royal threats, suppress his constancy through fear, nor, enticed by most lavish rewards, sell his devout affection, but, resisting the king's desire, lest a bed of mallows be sown in his garden once the vine was cut down, quenched with his own blood, since he could do nothing else, the fires prepared for the vines, was yet defending a temporal vineyard; but you the death of many martyrs has planted for us for ever, you the cross of the apostles, emulating the Lord's Passion, has propagated to the ends of the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
