[[commentary]]
quote='''
But let us return to that overseer of the wine, who, as though drunk with much wine, long forgot the author of his benefit, yet at length, in order to provide the king with an interpreter, made known the course of what had happened, not as one grateful, but as one shrewd. When he learned of it, the king too ordered Joseph to be summoned, and, having had him brought out of the prison, asked him whether he could interpret his dream for him. Delighted by his explanation, he removed the injury and conferred honour. And so see whether these things too do not fit the present. The injury was inflicted before he became known to the king; favour was returned once he was known to the king. Thus the king is free from blame, because the injury that the holy man received was another's doing, and the favour he received is the king's own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
