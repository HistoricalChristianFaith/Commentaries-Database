[[commentary]]
quote='''
Hence John says: woe to those who dwell on the earth! He certainly does not include all men who will then have run the course of this life — for there are, even placed on earth, those whose way of life is in heaven — but those whom affection for an earthly way of life and the favour of this world have overcome. Therefore we are not inhabitants but sojourners of this earth. For the sojourner bears the hope of a temporary lodging, but the inhabitant seems to place all his hope and the use of his substance there where he has thought he must dwell. And so he who is a sojourner of the earth is an inhabitant of heaven, but he who is an inhabitant of the earth is a possessor of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 7"
