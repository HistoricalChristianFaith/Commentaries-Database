[[commentary]]
quote='''
He had learned that in Egypt there was wantonness among the young men, luxury, insolent desire, intemperance in pleasures. He perceived that among men of this kind his wife's chastity would be unsafe, and that his wife's beauty would be a danger to himself: he advised his wife to say that she was his sister. By this we are taught that beauty in a wife is not greatly to be sought, since it often brings death to the husband. For it is not so much a woman's beauty as her virtue and dignity that delights a husband. Let him who seeks the sweetness of marriage not court a woman superior to him in wealth, whom the necessities of marriage would not hold, nor one adorned with necklaces, but one adorned with good character. It often offends a husband if his wife knows herself to be nobler. These things are next door to pride. Sarai was not richer in means, not more illustrious in birth. Therefore she did not think her husband unequal to her, therefore she loved him in favour as her equal, therefore she was not held back by wealth, not by parents, not by kinsfolk, but followed her own husband wherever he went. She went to foreign lands, she declared herself his sister, content, if it had to be so, to be endangered in her modesty rather than her husband in his safety; and to protect her husband she feigned sisterhood, lest those who lay in wait for her modesty should kill him as a rival and the avenger of his wife.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"

[[commentary]]
quote='''
Now Abraham, on going down into Egypt, that is, to fierce and barbarous ways that would not know how to defer to virtue, told Sarai, lest they should do harm through envy, not to say that she was his wife but to call herself his sister. And here is a great mystery of the sober mind, which is quickly envied. And therefore, to check envy, it ought to show itself more humble. Let it not claim for itself the sovereignty over all, let it not arrogate to itself alone wisdom as though it were its special possession. This is she whom Solomon acquired as his wife; for a wife is owed especially to one man. And so all desire to be seen worthy of such a union and grieve that anyone should be preferred to them, to enjoy so great a beauty alone. But a sister is joined to very many, by a kind of right or name of kinship. And therefore she keeps her true lover whole and safe from injury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 4"
