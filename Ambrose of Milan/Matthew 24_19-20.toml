[[commentary]]
quote='''
But let him who flees flee swiftly, lest he be overtaken; let him swiftly plunder this world, as the Hebrew plundered Egypt. Let whoever is in labour give birth, lest, with the womb of the mind laden and weighed down by iniquities, he be unable to flee; and let him flee not as one carrying a nursing child but as one carrying a child unencumbered, not bearing a little one but presenting one perfect in Christ; let him flee not as one keeping holiday on the sabbath, but as a workman at his business, nor as one barren in the cold, but as one rich at the harvest. For this is why it was said: Pray that your flight may not be in winter or on the sabbath. Flight, then, is fruitful in virtues, not exhausted of merits. This flight knows nothing of the cold of fear, the trembling of death, the cramping of anxiety, the idleness of slackness, the holidays of wantonness, the torpor of sluggishness; but it requires an untiring traveller to the heavenly life, a vigorous candidate for the kingdom above, a rich husbandman who gathers in his fruits and, in gathering them, carries them off as spoil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
