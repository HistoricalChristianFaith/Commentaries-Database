[[commentary]]
quote='''
He incurred punishment under the decree that none of the children of the captivity should give burial to the dead, but he was not restrained by the prohibition so much as spurred on lest he seem to abandon the duty of piety through fear of death; for the reward of mercy was the penalty of death. As a criminal discovered guilty of such an offense, he could scarcely at length as a needy exile—since his patrimony had been seized—be restored by a friend to his family.

Again he began to engage in these duties, if he had any provisions, seeking a stranger with whom he might take his food. And so when he had returned weary from performing the office of burial, and a supply of food had been set before him, sending out his son he sought a companion for his banquet. While the guest was being summoned, announcement having been made of the remains of an unburied body, he left the banquet and did not think it pious that he should himself take food while a lifeless body lay publicly exposed.

This was his daily task, and indeed it was a great one; for if the law requires us to cover the living who are naked, how much rather should we cover the dead! If we are wont to escort those starting out on rather distant journeys, how much rather should we those who have set forth to that eternal home whence they return no more! I, said Job, wept over every one that was afflicted. Who is more afflicted than the dead, concerning whom Scripture says in another place: Weep over the dead! And Ecclesiastes says: The heart of the wise is in the house of mourning and the heart of fools in the house of feasting. Nothing is more excellent than this duty: to give to him who can no longer make a return to you, to deliver from the birds, to deliver from the beasts your consort in nature. Wild beasts are said to have rendered this kindness to dead bodies—shall men refuse it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 1"
