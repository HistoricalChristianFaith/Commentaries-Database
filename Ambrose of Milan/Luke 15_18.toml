[[commentary]]
quote='''
But now let us return to the father. Although I do not fear that, through the example of this penitent, we may seem to have been long absent — for we were never absent, we who were busy in the vineyard, in which, if he too had remained, he would not have withdrawn from the father — yet we must beware lest we cause a delay in his reconciliation, which the father did not cause. He is easily reconciled when he is earnestly asked. And so let us learn with what kind of entreaty the father is to be approached. Father he says. How merciful, how kind is he, who even when offended does not disdain to hear the name of father! Father he says I have sinned against heaven and before you.

This is the first confession, before the Author of nature, the guardian of mercy, the arbiter of guilt. But even though God knows all things, yet he awaits the voice of your confession. With the mouth indeed confession is made unto salvation, since whoever burdens himself lightens the weight of his error, and he who forestalls the accuser by confessing shuts out the odium of accusation; the righteous man indeed in the beginning of his speech is his own accuser. But in vain would you wish to hide from him whom you can deceive in nothing, and you may without danger disclose what you know is already known. Rather confess, so that Christ, whom we have as advocate with the Father, may intercede for you, the Church may pray for you, the people may weep for you. Nor should you fear that you will not obtain it. The advocate pledges pardon, the patron promises grace, the champion promises you the reconciliation of the Father's paternal devotion. Believe, because he is truth; acquiesce, because he is power. He has reason to intercede for you, lest he have died for you in vain. The Father too has reason to forgive, because what the Son wills, the Father wills.

I have sinned against heaven and before you. Surely it is not the element that is meant, but it is signified that by the sin of the soul the heavenly gifts of the Spirit have been diminished, or else that one ought not to have strayed from the bosom of that mother, the Jerusalem which is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
