[[commentary]]
quote='''
But it must be considered that God called him while he was in uncircumcision, and to him, while he still remained in uncircumcision, the inheritance of a lawful son was promised, so that you may believe him to be not the father of the Jews only, as they themselves assert, but the author of all believers through faith. Sarai too, before her husband's circumcision, is blessed with no mean reward by the addition of one letter, so that she might have the primacy of virtue and of grace. From her he promises that nations and kings of the gentiles will come, so that in her a type not of the synagogue but of the Church might be established.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
