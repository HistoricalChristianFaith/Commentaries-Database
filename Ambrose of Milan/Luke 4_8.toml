[[commentary]]
quote='''
But if the Lord Jesus did not desire what was his own, why should you seek what is another's? If the Creator of all despised the glory of the world by the virtue of undergoing poverty, why should you disdain what you were born to, and covet what is not due to you? Why should you demand that things which cannot last for your use should last for your punishment? Beware of snares, beware of frauds. And by this very fact that the crafty devil shakes the whole world with fraud to overthrow man, and fights with all the enticements of the world, his blandishments are all the more to be guarded against by you. It was not food that had swayed Eve, not forgetfulness of the commandments that had made her fall away, but the alluring ambition for the promised honor deceived her. If she had been willing to adore the Lord alone, she would not have sought what was not due to her. And therefore a remedy is given by which you may blunt the weapon of ambition: that we should serve the Lord alone; for religious devotion is free of ambition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
