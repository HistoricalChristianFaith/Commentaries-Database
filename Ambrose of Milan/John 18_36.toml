[[commentary]]
quote='''
We find that the kingdom of the Lord is not of this world; for he himself said: My kingdom is not of this world. He who says that his kingdom is not of this world shows that it is above the world. So his kingdom both was and was not: it was not in the world, it was above the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
