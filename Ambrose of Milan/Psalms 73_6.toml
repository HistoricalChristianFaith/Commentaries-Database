[[commentary]]
quote='''
Therefore, he says, their pride has held them fast; they are covered with their iniquity and ungodliness. Iniquity is an evil garment; if anyone wishes to hold it on us, we must let it go, lest he begin to go to judgment with us. And if anyone tries to take away our spiritual tunic, which we have received, let go the cloak of iniquity, take up the covering of faith and patience with which David covered himself in fasting, so as not to lose the coverings of virtue. Fasting itself is a covering. Indeed, had not fasting sobriety covered holy Joseph, the wantonness of the adulteress would have stripped him. If Adam had been willing to cover himself with this fasting, he would not have been made naked. But because he tasted of the tree of the knowledge of good and evil against the heavenly prohibition, and transgressed the commanded fast with the food of incontinence, he knew that he was naked. But if he had fasted, he would also have kept the garments of faith and would not have seen himself uncovered. Let us not, then, clothe ourselves with iniquity and ungodliness, lest it be said of any of us: and he clothed himself with cursing. Adam too clothed himself badly, who, while he looked for coverings of leaves, received the sentence of the curse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 4"
