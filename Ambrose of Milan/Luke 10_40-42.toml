
[[commentary]]
quote='''
But we think ourselves idle if we seem to devote ourselves only to the word; and we esteem those who work more highly than those who practice the study of knowing the truth; for many say: Look at the man and his works: as though he who devotes himself to the word does not work, when this is a work more than the rest are. For if justice is a work, if temperance is a work, if fortitude is a work, surely wisdom too is a work; for these are held to be the four principal virtues. For if Christ works inasmuch as he is justice, surely he works inasmuch as he is the Word. And he was working when he was in the beginning with the Father. Indeed, all things were made through him, so that you may know that he is the worker of all things, and that our work is Christ Jesus. For inasmuch as he is the Word, for those who seek the Word, the Word is a great work. Hence, when Martha was hurrying about the serving, while Mary was listening to the Word of the Lord, she who listened deserved to be preferred to her who served; for to Martha, who said: Lord, do you not care that my sister has left me to serve alone? Tell her, then, to help me, the Lord answered and said: Martha, Martha, Mary has chosen the good part, which shall not be taken away from her (Luke 10:40–42). Thus it is defined by the authority of the divine sentence that to know the Word is a greater work than to serve.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
