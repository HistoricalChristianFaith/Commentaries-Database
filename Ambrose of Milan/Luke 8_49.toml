[[commentary]]
quote='''
But still also were the servants of the ruler incredulous with regard to the resurrection, which Jesus had foretold in the Law, fulfilled in the Gospel; therefore say they, Do not trouble him; (Ps. 16.) as if it were impossible for Him to raise the dead.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But to return to her who is still sick, lest she be believed to have died through our delay rather than through her own, there came he says servants saying to the ruler: do not trouble him; your daughter is dead.

And first let us consider this, that when he was about to raise the dead girl, he first healed the woman with the flow of blood, to produce faith. And that you may know that the flow of blood was stanched for the sake of an example: while the one is being sought, the other is healed. So too a temporal resurrection is celebrated at the Lord's Passion, that the perpetual one also may be believed. So too a barren woman is shown to Mary as about to give birth, that the Virgin may be believed about to conceive. Indeed, she heard that Elizabeth was to give birth, and did not doubt concerning her own childbearing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
There came he says servants saying to the ruler: do not trouble him. These too are still unbelieving toward the resurrection, which Jesus foretold in the Law and fulfilled in the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
