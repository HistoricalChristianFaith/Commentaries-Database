[[commentary]]
quote='''
In these churches are the princes of Zebulun and the princes of Naphtali, as Psalm 67 (68) teaches, of whom some are deliverers from the night-storm, crying: Let us therefore cast off the works of darkness and put on the armour of light, while others are of apostolic breadth, who can say: Our mouth is open to you, O Corinthians, our heart is enlarged. These are they who, when they were in darkness, saw a great light, as the prophet testifies, saying: The land of Zebulun and the land of Naphtali, the way of the sea beyond the Jordan. The people that sat in darkness have seen a great light. Those who sat in the region of the shadow of death, for them a light has risen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 5"
