[[commentary]]
quote='''
First he made mention of the rod, and like the almond rod struck those who were wandering, that he might afterwards comfort them in the spirit of meekness. And so meekness restored him whom the rod had deprived of the heavenly sacraments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252041.html'
source_title="Letter 41, 4"

[[commentary]]
quote='''
But Paul too threatens a rod indeed, yet visits offenders in the spirit of gentleness. Indeed, that you may know that he is a mild teacher, he consults the will of the very people whom he reproves. What do you wish? He says shall I come to you with a rod, or in charity and the spirit of gentleness? Once he spoke of the rod; twice he added milder things, joining gentleness to charity. Yet at first he threatened, but he showed gentleness; for writing in the second epistle to the same Corinthians he says: I call God as witness upon my soul that it was to spare you that I did not come to Corinth. Hear for what reason he thought he should spare them: that I might not he says come to you again in sorrow. He cast away the rod and took up the affection of charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
