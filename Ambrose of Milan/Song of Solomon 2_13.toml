[[commentary]]
quote='''
The fig tree has put forth its unripe figs. The tree which before, as though fruitless, was ordered to be cut down, has now begun to bear fruit. But why do you hesitate because he said unripe figs? It shakes off the earlier ones so as to bear better ones later, just as the fruit of the synagogue is cast off, while that of the Church is renewed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
