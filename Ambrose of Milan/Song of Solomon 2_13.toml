[[commentary]]
quote='''
The fig tree has put forth its unripe figs. The tree which before, as though fruitless, was ordered to be cut down, has now begun to bear fruit. But why do you hesitate because he said unripe figs? It shakes off the earlier ones so as to bear better ones later, just as the fruit of the synagogue is cast off, while that of the Church is renewed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
The fig tree, which was ordered to be cut down for its unfruitfulness, has now begun to bear fruit. The vineyard brought over from Egypt is no longer overrun by beasts, its walls torn down and laid low; nor is it unsightly with briars, but now fragrant with flowers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
The fig tree has put forth its green figs. The comparison of this tree is fitting for the Synagogue, because, as this tree, abounding in flowing leaves, disappoints the hope of its owner with an empty expectation of the hoped-for yield, so also in the Synagogue, while its teachers, unfruitful in works, glory only in words, as in abounding leaves, the empty shadow of the Law prevails; and the long-awaited hope of a false yield mocks the prayers of the believing people.

There is also something in the nature of the tree by which you may the more believe that the figure of the Synagogue is expressed in the comparison with it. For if you inquire diligently, you will find the habit of this tree's nature distinct from the usage of the other trees; for the others bear the flower before the fruit, and by their flower, as a herald, signify the fruits to come: this alone from the beginning puts forth fruits instead of flowers: in the others the flower is shaken off and the fruits are born; in this, fruits fall that fruits may follow. So those first ones, empty of fruit, come forth in place of the flower: thus, by a kind of premature habit of birth, those which do not know the order of nature cannot keep nature's benefit. For where the bud is wont to thrust itself out from the middle of the bark, there all the tiniest fruits of this kind break forth: of which we read in the Song of Songs: The fig tree has put forth its green figs. And so, while the other shrubs are white in early spring, the fig alone does not know how to grow white with a flower of its own; perhaps because there is no riper use in their fruits. For as others follow, those which are spat out as degenerate, and are weak with a withering root, are stripped off when those are renewed whose sap is more useful. Yet some very few remain and do not fall, on which this good fortune has smiled: that they come forth from between two twigs, where a short tendril breaks out, so that, covered by a twofold protection, as in the lap of their parent nature, they grow on with the nourishment of a fuller sap. These, called forth by the mildness of a gentler air, and grown up over longer seasons, when they have put off the wild temper of their earlier sap, are preferred above the others in appearance and in the grace of ripeness.

Look now at the worship and the minds of the Jews, who, as the first fruits of the ill-bearing Synagogue, have fallen as in the likeness of falling fruit, so that the fruits of our race, which will endure beyond the age, might follow. For the first people of the Synagogue, weak as it were with a withering root of works, could not draw in the richness of natural wisdom. And therefore it fell like a useless fruit, so that, as from the same tendrils of the fruitful tree, the new people of the Church might come forth from the richness of the ancient religion. So that which was ceased to be, that this which was not might begin: yet the first from Israel, whom a branch of stronger nature had brought forth, under the shadow of the Law and of the cross, coloured in the bosom of both with a twofold sap, after the example of a ripening green fig, surpassed the others by the grace of most beautiful fruits; to whom it is said: You shall sit upon twelve thrones, judging the twelve tribes of Israel (Matt. 19:28).

The vineyards in flower have given their fragrance (above, v. 5). Well is the Church designated by the vineyard; for as the vine is wedded to trees, so the body is joined to the soul, and the soul also to the body: as the vineyard, when it is tied, is raised up, and when cut back is not diminished but increased; so the holy people, when bound, is set free: when humbled, is lifted up: when cut back, is crowned. Moreover, as a tender shoot, cut from an old tree, is grafted into the offspring of another root: so this holy people, the scars of the old shoot smoothed away, grows on, cherished in that new sign of the cross as in the lap of a devoted parent: and the Holy Spirit, poured into this prison-house of the body, as though let down into deep trenches of the earth, washes away with the watering of saving water whatever is foul, and raises the disposition of our members to heavenly discipline.

This vineyard the careful husbandman is wont to dig, to water, to stretch out, and, having cleared away the heaps of earthly mass, now to scorch the works of our body with the sun, now to drench them with rain; he is wont to hedge the field about, lest the bud be harmed by briars, lest the shade of the leaves run riot, and the fruitless boasting of words, by overshadowing the virtues, hinder the ripening of our natural disposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
