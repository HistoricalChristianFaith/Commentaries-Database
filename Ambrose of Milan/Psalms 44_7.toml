[[commentary]]
quote='''
Hence he also says: For you have delivered us from those who afflict us, and you have confounded those who hate us; in God we shall be praised all the day, and in your name we shall confess for ever. Hear how he delivers us: the inner parts of our earth are pierced by the arrows which he shoots from heaven, so that every earthly motion may die away and be still, as he says in a later passage: From heaven you shot judgement; the earth trembled and was still. So, then, we are delivered, while the hostile and adverse powers are confounded, or the wisdom of this flesh, blunted by the heavenly commands, blushes at its own crimes and is confounded with shame at its own misdeeds: the adulterer in the flames of his lust and the fire of his insane love, the avaricious man in the heat of his immoderate greed, who, in seizing what belongs to others, desires the more the more he has invaded, the drunkard in his drunkenness, the criminal in his crime. These are confounded most grievously even here, but they will be confounded much more when they see the saints of the Lord rising again and that Gospel saying fulfilled which the Lord spoke: Many of those who sleep in the tombs of the earth shall rise again, these to eternal life, and those to reproach and everlasting confusion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
