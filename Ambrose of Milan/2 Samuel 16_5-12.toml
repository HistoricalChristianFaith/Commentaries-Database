[[commentary]]
quote='''
And how patient he was of injury and pain! He was giving way, as I have said, to the fury of his son Absalom, flanked on right and left by strong warriors, when a man named Shimei cursed him, calling him bloody and a man of blood, cast down from the kingdom by the just judgment of the Lord; but he was not moved even by such reproaches, though his companions were moved. Finally one of his comrades — Abishai was the man's name — threatened to take off his head as the price of the injury. But the king, turning to Abishai: What is there, he says, between me and you, son of Zeruiah? He curses me for this reason, because the Lord has told him to curse. With what moral wisdom he taught that the times of our injuries or dangers are contests of temptations and trials of probation, and that therefore they are not usually inflicted without divine judgment. The good athlete is exercised by reproaches, exercised by labours and dangers, that he may be worthy to have the crown of justice conferred on him. And therefore the things that are thought adverse are to be borne patiently. Finally, the divine Scripture teaches you this elsewhere too, when the just man says: If we have received good things from the hand of the Lord, why do we not endure the things that are evil?

And the holy prophet added, saying: Behold, my son, who came forth from my body, seeks my life. And if the Benjaminite curses me, let him alone, that he may curse, because the Lord has told him, that he may see my humility, and the Lord will repay me for this curse. O depth of prudence, O signal mark of patience, O great discovery for swallowing an insult! Are you moved, he says, Abishai, that a stranger curses me, when my own son seeks me with parricide? The Lord has told him to curse me. But the Lord is not a curser, nor does he delight in insults.

See how carefully he observes every point. He does not accuse the Lord as the author of the injury, but rather praises him because he allows us to suffer lesser things, that we may obtain pardon for greater sins. Behold, the insult of words lightened the affliction of the parricidal crime; he acquitted the insolent man, whose curses profit the more, since they are rewarded with a divine recompense. Who would not count such an injury a fair exchange for himself, so that God consoles with the recompense of better things the one whom man has wounded?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
