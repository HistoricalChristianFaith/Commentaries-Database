[[commentary]]
quote='''
Consider, then, this Hebrew saying to that overseer of the eunuchs, who had incurred the king's displeasure and whom he had restored to his office: Be mindful through your own self, when it is well with you, and you will show mercy to me and you will be mindful of me. He repeated it a second time for this reason, because he knew that the man would not remember what injury he had escaped once he had recovered his power. He admonished him a second time for this reason, because he set him free a second time, so that, if the memory of the first benefit did not hold him, that of the later might at least come to him, and he might not despise the author of his safety nor violate him by faithless betrayal. But, what is worse, forgetfulness of a benefit quickly creeps in with prosperity. Restored to his office, he did not become mindful of the interpreter, but forgot him. But although he was forgetting, Christ was not forgetting; he was speaking to him, and speaking through a slave, saying to him: Be mindful through your own self, that is, at least in consideration of your own office, recall what you have heard. But even if you have now forgotten, you will be mindful of me, so that you may escape danger, you who have forgotten a benefit. Yet, lifted up by power, he did not remember. And how great is this power, where the service is of wine? See the source of all the boasting! Because he was overseer of the eunuchs who served the wine in the royal cups.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
