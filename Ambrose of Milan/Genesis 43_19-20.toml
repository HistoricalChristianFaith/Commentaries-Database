[[commentary]]
quote='''
And they began to wish to plead their case at the door of the house with the man who was over the house. They still hesitate to enter, and those who wish to establish their case prefer to be justified by their own works rather than to receive grace, and therefore they are refuted in the gates. But he who awaits the fruit of the virginal womb and the inheritance of the Lord, who trades in the merchandise of the Son, is not put to shame in the gate, but at the exit of this life drives back the enemy, so that he, privy to some graver fault, may not stand in his way as he hastens to higher things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 9"
