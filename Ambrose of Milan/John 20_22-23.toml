[[commentary]]
quote='''
The Holy Spirit he either breathed upon those eleven as the more perfect and promises that he is to be bestowed on the rest later, or he breathed him on the same men there and promised him here. Nor does this seem contrary, since there are divisions of graces; to one indeed is given the word of wisdom, to another the word of knowledge according to the same Spirit, to another faith in the same Spirit, to another the grace of healings, to another kinds of tongues. So there he breathed one operation, here he promises another; for there the grace of forgiving sins was bestowed, which seems to be more august, and therefore it is breathed by Christ, that you may believe that the Spirit is Christ's and believe that the Spirit is from God; for God alone forgives sins. But Luke describes the grace of tongues poured out. Indeed there you have: Receive the Holy Spirit; whose sins you forgive, they will be forgiven. But in the Acts of the Apostles you have thus: And they were all filled with the Holy Spirit and began to speak in various tongues, as the Spirit gave them to speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
