[[commentary]]
quote='''
In the Song of Songs he signifies by this garden the garden of the soul, or the soul itself; for so it is written: An enclosed garden is the bride, my sister, an enclosed garden, a sealed fountain. And below the soul says: Arise, north wind, and come, south wind; blow through my garden, and let your ointments flow down; let my brother come down into his garden (Song 4:12 and 13). How much more beautiful is this: that the soul, adorned with the flowers of the virtues, is a garden, or has within herself a budding paradise, into which garden she invites the Word of God to come down, so that that soul, watered by the shower of the heavenly Word and by its abundance, may bear fruit! Now the Word of God is fed by the virtues of the soul whenever he finds the soul obedient to him and rich: he plucks her fruits and delights in them. And when the Word of God has come down into her, the ointments of healthful words flow down from her, and the breaths of diverse graces, giving forth their scent, are fragrant far and wide. Hence the Bridegroom says (now the Bridegroom of the soul is God the Word, to whom the soul is joined by a kind of lawful covenant of marriage):
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
