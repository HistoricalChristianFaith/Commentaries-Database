[[commentary]]
quote='''
And not only two minds, but also two laws are in us, both of which the Apostle has explained to us, saying: For I delight in the law of God according to the inner man, but I see another law in my members, warring against the law of my mind and making me captive in the law of sin, which is in my members. There is, then, a law of the inner man, and there is also one of the outer: the former forbids sin, the latter persuades to it; the former condemns error, the latter suggests it; the former instructs the mind, the latter tempts it. There are also two other, more vehement laws in us, one of God, the other of sin, according to the same teacher, who says: So then I myself with the mind serve the law of God, but with the flesh the law of sin. And it is shown that if you speak of the mind alone, you show it to be contrary to the flesh; for when Paul says that he serves the law of God with the mind, he surely shows that the mind in itself, unless it is conquered by the flesh, is good, and created by nature such that it resists error. So when it is conquered, it is the mind of the flesh, having its slipping not from nature but from the flesh, and the conquered passes, as it were, into the name and property of the conqueror; but by nature it is opposed to the flesh. So with the mind we serve God, with the flesh sin. And the mind will be the better if, as a fellow worker with the Holy Spirit, it does not interrupt its devout duty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
