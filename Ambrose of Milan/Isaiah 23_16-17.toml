[[commentary]]
quote='''
And he added: Take up a harp, wander about thou harlot city that hast been forgotten: sing well many songs, that thou mayest be remembered. But after seventy years Tyre shall be as the song of a harlot, and the Lord will visit Tyre. Wherefore we can accept even in good part the song of that harlot, Rahab, who took in the spies of Josue with believing heart. For the Lord also says: We have piped to you and you have not danced, and David says: Sing ye to the Lord a new canticle: sing to the Lord all the earth. This is the song of the harlot which that harlot earth sang before in Adam and Eve; the harlot that sang in the people of the nations. This harlot made many good harlots, of whom it has been said by the Lord Jesus to that chosen and elder people of God; The publicans and harlots shall go into the kingdom of God before you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 20"
