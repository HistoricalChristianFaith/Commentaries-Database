[[commentary]]
quote='''
The nets break, yet no fish slips away. Their partners who were in the other boat are called to help. What is that other boat but perhaps Judaea, from which John and James are chosen? Judaea has been made indeed his sanctification. These, then, came together from the synagogue to Peter's boat, that is, to the Church, so as to fill both boats; for all bend the knee in the name of Jesus, whether Jew or Greek; Christ is all things and in all. But this heap is suspect to me, lest by its fullness the boats be almost sunk; for there must also be heresies, that the good may be proved.

We can, however, understand the boat of the other as another church too; for from the one many churches are derived. See another anxiety of Peter, to whom his own catch is now suspect. But the perfect man, who knows how he can catch the scattered, knows how he can keep those stored away. Those whom he catches at the word he gives back to the word; he denies that the catch is his, he denies that the gift is his.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
