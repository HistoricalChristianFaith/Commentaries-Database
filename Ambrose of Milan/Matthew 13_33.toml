[[commentary]]
quote='''
And since we read in Matthew that the leaven was hidden in three measures, it seemed fitting that we should believe the Son of God hidden in the Law, covered in the prophets, fulfilled in the preachings of the Gospel, so that he may acquire perfect faith for us out of them all, and, formed by the comparison of the writings in us who are his body, may be fulfilled all in all; for he was the Word of God and the mystery which has been hidden from the ages and from the generations, and nothing can be said that bears more witness to the expression of his everlastingness. For he surely was; for he was in such a way that, hidden from the sacrilegious, made manifest in the saints, predestined before the ages, he was kept for glory. And this is glory, brothers, that we can search out the mystery hidden from the ages in God. Which is surely in God and from God; for God cannot admit an alien nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
