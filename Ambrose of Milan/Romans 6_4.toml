[[commentary]]
quote='''
So likewise in baptism, since it is a likeness of death, without a doubt, when you are immersed and rise again, it becomes a likeness of resurrection. Therefore, according to the interpretation of the apostle Peter, just as that resurrection was a regeneration, so is this resurrection a regeneration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Sacraments.html'
source_title="On the Sacraments, Book 3, Chapter 1"

[[commentary]]
quote='''
But there are three kinds of death. One is the death of sin, of which it is written: the soul that sins, it shall die. Another is mystical death, when someone dies to sin and lives to God, of which the Apostle likewise says: for we were buried together with him through baptism into death. The third is the death by which we complete the course and the task of this life, that is, the parting of soul and body. We observe, then, that one death is evil, if we die because of sins; another death is good, by which he who has died is justified from sin; the third death is in between, for it both seems good to the just and is to be feared by most, and though it releases all, it delights few.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
