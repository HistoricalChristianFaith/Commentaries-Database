[[commentary]]
quote='''
Death, then, is the loosing of soul and body. Then too we have shown that it is read in the Apostle: to be dissolved and to be with Christ is much better. And what does this loosing do but that the body is dissolved and rests, while the soul turns to its rest and is free, and, if it is godly, will be with Christ?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
