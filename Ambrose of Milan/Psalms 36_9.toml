[[commentary]]
quote='''
Most fittingly, then, he went on: For with you is the fountain of life, and in your light we shall see light. Extend your mercy to those who know you, and your righteousness to those who are upright of heart. For after the recalling of the heavenly benefits, thanks are rightly rendered to their author, our Lord Jesus Christ, who, the watering fountain of eternal life, came down to earth to water the drynesses of our heart. He is the brightness of the glory of God the Father and the image of his substance, and therefore in his true light, which enlightens every man coming into this world, we shall see, he says, the Father, for God is light. Rightly also it is said: In your light we shall see light, according to that saying: He who sees me sees my Father also. With you, then, O fountain of life, we shall see the Father present. For as you were with the Father in the beginning, God the Word, so the Father, who is in you, is always with you; for he is with him in whom he also is. And the coming of the Lord the Savior is prophesied, who, being to come to earth, was to say: I and the Father are one, that is: we are one light, as we are one name; through the unity of light and of name we both are one, nay, the Trinity is one in the unity of substance, but with the distinction of each person. Trinity signifies the distinction of the persons, unity the power. It can also be said to the Father: For with you is the fountain of life, that is, he from whom life proceeded, which was the Word, and which always was, for this reason, that it was with you. All things were made through him and in him, and he is the life of all things, and he has manifested you to us, that he may enlighten the hearts of men unto the knowledge of your majesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
