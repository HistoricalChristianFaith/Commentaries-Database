[[commentary]]
quote='''
Then I said: Behold, I come; at the head of the book it is written of me. It was certainly written of Christ at the beginning of the Old Testament that he would come to do the will of God the Father in the redemption of men, when it is written that he formed Eve, in the likeness of the Church, as a help for man. For what can be a protection to us in this infirmity of the body and the disturbance of this world except the grace of the Church alone, by which we are redeemed, and our faith, by which we live? At the head of the book it is written: Bone of my bones and flesh of my flesh. For this reason a man shall leave father and mother and shall cleave to his wife, and the two shall be in one flesh. Who it is that spoke, or of whom this sacrament is, hear him saying: This sacrament is great, but I say in Christ and in the Church. Hence he also admonishes that a man should love his wife as Christ loves the Church, because we are members of his body, of his flesh and of his bones. What greater salvation, then, than to be with Christ and to cleave to him in a certain unity of body, in which there is neither any spot nor the filth of sin?

It is written at the head of the book that the victim of righteous Abel pleased God, and the oblation of the parricide displeased him. Did not the Lord Jesus openly signify that he himself was to be offered for us, so that in his Passion he might consecrate the grace of a new sacrifice and abolish the rite of a parricidal people? And what is more express than that a son was offered by the holy patriarch and a ram was sacrificed? Did he not openly show that the flesh of man, which is common to all earthly living creatures, and not the divinity of the only-begotten Son of God, would be subject to the wound of the sacred Passion?

It is written at the head of the book that a man would come who would rule over the heavenly powers. It was fulfilled when the Lord Jesus came to earth and angels ministered to him, as he himself deigned to say: From now on you shall see the heavens opened and the angels of God ascending and descending to the Son of Man.

It is written at the head of the book: A lamb without blemish, clean, full-grown, male, a yearling, shall be yours, and the whole synagogue shall slay it. Who this lamb is, you have heard him say: Behold the Lamb of God, behold him who takes away the sin of the world. This is he who was slain by the whole people of the Jews, whom they still persecute with hostile hatred. And indeed it was fitting that he should die for all, so that in his cross there might be remission of sins and his blood might wash away the defilements of the world. But woe to them who denied the author of their own salvation! You have made, he says, a counsel, but not through me. How could he approve a parricide who did not approve the counsel? And yet how great his loving-kindness! He shrank indeed from the counsel, but if they were converted he did not refuse the remedy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
