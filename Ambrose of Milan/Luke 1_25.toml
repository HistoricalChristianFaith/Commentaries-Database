[[commentary]]
quote='''
And though she might blush at the time of her child-bearing, on the other hand she rejoiced that she was free from reproach, saying, Thus hath the Lord dealt with me.

For it is a shame among women not to receive that reward of marriage, which is the only cause of their being married.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Rightly, then, did Saint Elizabeth blush at the grace, even though she did not acknowledge a fault. For although she conceived of her husband — for it is not right to believe otherwise of the birth of a man — yet she blushed at the age of her childbearing. And again she rejoiced that she was free of reproach; for it is a shame for women not to have the rewards of marriage, for whom this is the sole cause of marrying. So she consoles herself that this reproach has been taken away at the cost of her own shame, that shame, as I said, which she felt on account of her age. Whence it can be understood that they no longer came together in conjugal intercourse; for she who did not blush at intercourse in old age would not blush at the childbearing; and yet she blushes at the burden of a parent so long as she does not know the mystery of religion.

She who hid herself because she had conceived a son began to boast because she was bearing a prophet; and she who before blushed now blesses, and she who before doubted is strengthened. For behold she says, as the voice of your greeting came into my ears, the infant leaped in joy in my womb. And so she cried out with a loud voice when she perceived the Lord's coming, because she believed the birth to be a holy one; for there was no cause for shame, where the birth of a prophet won faith for a begetting that was given, not sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
