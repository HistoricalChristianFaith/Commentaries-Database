[[commentary]]
quote='''
Again, the wilderness is the Church itself, for the barren has more children than she who has an husband. The word of the Lord came, that the earth which was before barren might bring forth fruit unto us.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
John the forerunner of the Word is rightly called the voice, because the voice being inferior precedes, the Word, which is more excellent, follows.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The voice of one crying in the desert. Rightly is John called the voice, the forerunner of the Word. For John himself, when he was asked: What do you say of yourself? says: I am the voice of one crying in the desert. Therefore he says: He who comes after me has been made before me, because the voice, the lesser, goes before, the Word, which excels, follows. Therefore he also wished to be baptized by John, because among men the word is consecrated by the voice of a teacher. Therefore perhaps Zechariah too received his voice back, because he uttered the voice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
