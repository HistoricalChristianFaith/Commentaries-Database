[[commentary]]
quote='''
Blessed indeed is he who is righteous in the sight of God; blessed he of whom the Lord deigns to say: Behold an Israelite indeed, in whom there is no guile; for he is a true Israelite who sees God and knows that he is seen by God, and lays open to him the secrets of his heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
