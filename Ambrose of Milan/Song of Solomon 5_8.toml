[[commentary]]
quote='''
So without loss to herself, because even if someone wishes, he cannot take away true wisdom — even if the adversary makes an uproar, yet there the true integrity of an innocent life shines out — without loss, then, she passed the watchmen and, mingling with the daughters of that heavenly city, she seeks the Word, and by seeking she stirs up his love within herself, and she recognizes where she should seek the Word. She knows that he lingers among the prayers of the saints and clings to them, and she understands that he pastures his Church, or the souls of his righteous, among the lilies. This mystery the Lord showed you in the Gospel, when on the sabbath he led his disciples through the sown fields. Moses led the people of the Jews through the desert; Christ leads through the sown fields, Christ leads through the lilies, because through his passion too the desert blossoms like the lily. Let us follow, then, so that on the sabbath day, that great sabbath in which there is great rest, we may gather fruits. And do not fear lest the Pharisees accuse you as you gather from the sown fields. Even if they accuse, yet Christ excuses, and makes the souls he wishes, which follow him, like that David who, above the law, ate the loaves of the presentation, already then foreseeing in his prophetic mind the sacraments of the new grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
I adjure you, daughters of Jerusalem, if you find my beloved, that you tell him that I languish with love. But what is this languor of the soul? The moral lesson of an ancient history, the one concerning holy Moses, makes it our duty to remember: he asked God to show himself to him, so that he might see him face to face. The holy prophet of the Lord certainly knew that he could not see the invisible God face to face. But holy devotion goes beyond measure, and he thought that even this was possible for God: to make what is incorporeal be grasped by bodily eyes. This error is not blameworthy; it is even a pleasing and insatiable desire, in that he longed to hold his Lord as it were in his hand and to see him with the gaze of his eyes. For he knew that man was made to the image and likeness of God; for when, chosen by the Lord God to free the people, he was filled with the spirit of wisdom, he had seen that angel, and his face in glory; then he was terrified by his flashing light, and he saw the bush burning and not burnt up. By his sight he caught the brightness, and wondering at it he drew near, provoked by desire and by grace to consider that brightness in the bush more carefully. And so, if he received such ardor, if he underwent such desire when he had seen the angel in the flame of fire from the bush, that, though seized with fear he did not dare to look closely, yet he wished to look: how much more did he desire to see the face of the Lord bodily, saying within himself: That face, full of light, full of grace, full of power, full of divinity, what shall I say that it is? I cannot say or think more of God; for when a man has finished, then he begins; and when he has ended, then he will be at a loss, as it is written, because the eternal majesty of God is incomprehensible (Sir. 18:6).

The result of his petition was indeed vain, but the affection of the servant was commendable; because, advancing by devotion beyond his nature, he reckoned from the angels of the Lord how much more he should desire of the Lord's face, with which he longed to satisfy his desire. He knew that in man himself there would be another glory after death, another brightness: For as star differs from star in brightness, so also is the resurrection of the dead; which, though it is sown in corruption, yet will rise in incorruption, will rise in glory, will rise in power, will rise a spiritual body (1 Cor. 15:41–44). He, then, who could know these things rightly presumed to desire to see the face of the Lord, since he would see it once he had met the death of the body. Certainly he had already taken on such a form, and the Lord already approved him as such, that the heavenly minister and executor of the oracle did not differ from the angels. And therefore, since he knew That the angels of the little ones daily see the face of the Father who is in heaven (Matt. 18:10), he thought that he could and should already see it, as though forgetful of the body and with the flesh laid aside; like him who, while still placed in the body, when he was caught up into paradise, said that he did not know whether he had been caught up to the third heaven in the body or out of the body (2 Cor. 12:3). For the saints, even when they bear a body, are yet not in the flesh but in the spirit; since those who are in carnal desire and way of life cannot please God. But the saints, in their way of life, are not in the flesh, but in heaven.

From these things, then, let us grasp the affection of the languishing Bride. As one innocent, she desired to see the face of God, as it were with a certain face of conscience; she longed to open to him the face of her inner mind and to be known more fully. Impatient love, knocking day and night at a harlot's doors, if the desires of possession are put off too long, faints from the very waiting while it hopes: and in this there is surely not the end of love, but its increase. And whatever is desirable, if it does not fall to the one who desires it, he faints toward it, and he who desires lays down, as it were, his very soul; if, however, hope rises nearer, hope close at hand gives strength; but if the beloved is absent, by the very fact that she desires him who is absent, she who has longed for him suffers a fainting of her soul. And so, the farther off that which is desired, the more does he who desires faint. This, then, is to faint: for each one to pass with all his zeal into that which he loves; he thinks of it, cleaves to it, sounds it forth, that which he has taken up to love; into it he is poured over by a certain fainting of the soul. So it is when a mother awaits the presence of her son, as Tobit's wife awaited her son on his travels: fainting from longing and set in distress, she seemed as it were undone (Tob. 10:3 ff.). For what else do her words signify but a certain fainting? But the more the affection is wearied, the more love grows; and the longer he who is desired is away, the more the desires of the one who waits are set on fire by a certain greater force of love. The flesh faints, but desire is fed and increased.

And so the holy soul does not know how to desire anything other than the Bridegroom, who is Christ Jesus: she longs for him, she desires him, she strains toward him with all her strength, she cherishes him in the bosom of her mind, she opens and pours herself out to him, and she fears this alone, that she might lose him. And so, the greater the desire with which the soul has been roused, longing to cleave to God her Savior, the more she faints. This fainting, then, brings about a diminishing indeed of frailty, but a taking on of virtue. She longed, she desired, she fainted, she was dissolved with her whole affection, so as to become wholly his whom she desired, as David himself also says: I pour out my prayer in his sight, and I declare my tribulation before him, when my spirit fails from me (Ps. 141 (142):3 and 4). For his spirit failed; nay rather, the spirit fails from him who denies himself so as to cleave to Christ. And so, as though impatient of love, she ran about and sought the Word of God everywhere, because she was wounded, because she was naked; and she sought the help of someone by whom Christ might be asked to come. See her burning, see her desiring: I adjure, she says, you, daughters of Jerusalem, etc.; then, joined with the daughters of that heavenly city, she seeks the Word, and by seeking him and contemplating his beauty she arouses in herself love for him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
