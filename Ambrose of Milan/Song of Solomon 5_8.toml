[[commentary]]
quote='''
So without loss to herself, because even if someone wishes, he cannot take away true wisdom — even if the adversary makes an uproar, yet there the true integrity of an innocent life shines out — without loss, then, she passed the watchmen and, mingling with the daughters of that heavenly city, she seeks the Word, and by seeking she stirs up his love within herself, and she recognizes where she should seek the Word. She knows that he lingers among the prayers of the saints and clings to them, and she understands that he pastures his Church, or the souls of his righteous, among the lilies. This mystery the Lord showed you in the Gospel, when on the sabbath he led his disciples through the sown fields. Moses led the people of the Jews through the desert; Christ leads through the sown fields, Christ leads through the lilies, because through his passion too the desert blossoms like the lily. Let us follow, then, so that on the sabbath day, that great sabbath in which there is great rest, we may gather fruits. And do not fear lest the Pharisees accuse you as you gather from the sown fields. Even if they accuse, yet Christ excuses, and makes the souls he wishes, which follow him, like that David who, above the law, ate the loaves of the presentation, already then foreseeing in his prophetic mind the sacraments of the new grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"
