[[commentary]]
quote='''
Then, as one stripped and free, he says: I will please the Lord in the region of the living. For that is the region . . . . Then he says that that rest of souls is the land of the living, where sins do not penetrate, where the glory of the virtues lives. But this region is full of the dead, because it is full of offences, and rightly was it said: Leave the dead to bury their own dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"
