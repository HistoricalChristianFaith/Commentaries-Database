[[commentary]]
quote='''
(in Luc. ii. 5.) St. Matthew has beautifully taught how a righteous man ought to act, who has detected his wife's disgrace; so as at once to keep himself guiltless of her blood, and yet pure from her defilements; therefore it is he says, Being a just man. Thus is preserved throughout in Joseph the gracious character of a righteous man, that his testimony may be the more approved; for, the tongue of the just speaketh the judgment of truth.

(in Luc. ii. 1.) But as no one puts away what he has not received; in that he was minded to put her away, he admits to have received her.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Saint Matthew beautifully taught what a just man ought to do who has detected the disgrace of his wife: that he ought to keep himself unstained by bloodshed and pure of adultery; he who in fact is joined to a harlot is one body. So everywhere in Joseph the grace and the character of a just man are preserved, so that he may be a witness of standing; for the mouth of the just man knows no lie and his tongue speaks judgment, his judgment speaks the truth. Nor let it trouble you that Scripture often calls her wife; for it is not the taking of virginity but the attestation of the marriage that is declared by the celebration of the nuptials. Indeed, no one puts away a woman he has not taken, and so he who wished to put her away was confessing that she had been taken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
