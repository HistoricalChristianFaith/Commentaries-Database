[[commentary]]
quote='''
And therefore the prophet added: I have been young and have grown old. So the Latins; but some, following the Greeks, have: I have been young; for indeed I have grown old, and I have not seen the righteous man forsaken, nor his seed seeking bread. For one who wishes to understand it simply, the sense is plain: that in the time of his life David did not see a righteous man forsaken. But this both belongs to a short time and is incredible; for we see many righteous men in the world forsaken by men, when some of the powerful persecute them, and no one dares to approach them when he sees them placed in fear or under injury. Hence Job says: My brothers have departed, they have acknowledged strangers rather than me; my friends have become merciless, and those who knew me have forgotten my name. David too cries out that he has been not only forsaken but even attacked by friends and neighbours: My friends, he says, and my neighbours have drawn near against me. If, then, righteous men are found forsaken in this world, how did David say things contrary to himself, unless you understand that the righteous man, even if he is forsaken in the world, is yet not forsaken by the Lord? For Job, when he was on the dunghill, was not forsaken by the Lord, whom the Lord himself praised with his own voice in the council of the angels, whom he suffered to be tempted so that he might crown him; and he gave leave for temptation upon the body, but refused it upon the soul. Nor was David forsaken, to whom he gave a kingdom, so that he might rule over a chosen people, and whom, when he had been assailed in parricidal battles and driven from the borders of his kingdom, he restored by the right of victory. Jacob too, Elijah and Elisha and John the Baptist and the others, who went about wandering in goatskins in deserts and mountains and caves and holes of the earth, although they seem to have endured many mockeries and bitter punishments, yet were not forsaken. For when Jacob was fleeing his brother and wandering unaccompanied through the deserts, he fell asleep, and rising he saw there a multitude of the heavenly host, and said: This place is called the camps of the angels. It was not enough to call it a camp, but camps, such as would suit so great a multitude. You see, then, that he thought himself alone, and the camps of the heavenly army were following him, just as the rock, as it is written, followed our fathers in Moses' time, lest they should thirst in the desert. For since we have read in Exodus that, when the people were thirsting, Moses struck the rock with his rod and water flowed and the people of God drank, and again we have read in Leviticus or in Numbers that Moses once more touched the rock with his rod and water gushed out for the fathers to drink, the Apostle most excellently interpreted this, saying: But they drank from the rock that followed them, and the rock was Christ. Those complainers, then, those murmurers, those transgressors, the Lord nevertheless did not desert, but followed. What shall I say of Elijah and Elisha, whom, as they walked through the deserts, horses from heaven and a fiery chariot met? How was Elijah forsaken, who was invited by Christ? How forsaken on earth, who was caught up to heaven? How needy and naked and empty, who left to his disciple the inheritance of a twofold spirit, so that the heir, gifted with one sheepskin cloak, might stop rivers, call the Jordan back to its source, feed the armies of kings in the desert and supply drink to the thirsty? At his will drink flowed down from heaven, on earth the dead rose again. How was Elisha forsaken, who, when he was surrounded by the army of the Syrians, to be carried off captive to the king, when his servant Gehazi said: Lord, what shall we do?, said: Do not fear, for there are more with us than with them. And he said: Lord, open his eyes that he may see? And his eyes were opened, and he saw the mountain and all things round about filled with countless horses and heavenly legions. Paul too, who said that he had been tossed about in perils in the sea, in perils in the desert, yet himself testified, saying: If God is for us, who is against us? So he, thus forsaken and abandoned by men, abounds and overflows with God. For Elijah too was so abandoned that he said: Lord, take my soul, and yet he was so strong with God that he was terrible in power to kings themselves.

How could David as a young man grasp this? For a young man considers temporal things rather than eternal, because that age inclines to vices. But there are some who are old men in youth, and others who are young men in old age. There are, I say, men whose minds are reckoned by the gravity of old men, in whom the age of old age is a spotless life, in whom hoary prudence flourishes, such as was Jeremiah, who, when he spoke of himself as young in view of his age and excused himself because of his youth, since he seemed unequal to the office of preaching, the Lord said to him: Do not say: I am young, because you shall go to all to whom I shall send you. So he did not think him young whom he judged fit for the grace of prophecy. Such a young man, then, was David, who had been renewed and had flourished again, as he himself said, as an eagle's his youth. Thus, then, it must be understood: I have been young, but sanctified, but set as a prophet among the nations, one who could already know the sacraments of the heavenly kingdom and consider the true rewards of righteousness, but I have not seen the righteous man forsaken. Afterwards too, elsewhere, strengthened both by practice and by gift, I acquired increase of wisdom; the same grace seemed to me to remain about the righteous man.

We have explained, as we could, how he said: I have been young; but let us consider how he added: for indeed I have grown old. Youth is good, but old age better; for he who perseveres to the end, he shall be saved. Hence it was not said idly of the patriarch Abraham that he was nourished in a good old age. And John began to write the Gospel or the epistles as an old man. Since he shrank from writing himself apostle, he wrote himself the elder, nor was he esteemed the less, he to whom there came a kind of swan-like grace of old age. The very vessel of the Lord's election, writing to Philemon, says: Since you are such a one as Paul the old man, and now also a prisoner of Christ Jesus, I beseech you for my son Onesimus, whom I have begotten in chains. And so, wishing to pay him the greatest honour, he compared him to Paul the elder, not the young man, and he gloried in being an old man there where he was already held in chains. And see the difference: he was signified as a young man in the passion of another, as an old man in his own; there as a young man, because he was keeping the garments of the Jews, here as an old man, where he was putting off the cast skin of his body. Thus Peter too is called an old man there where there is the contest of the passion: When you were younger, he says, you girded yourself and walked where you wished; but when you have grown old, you will stretch out your hands, and another will gird you and lead you where you do not wish. And this he said signifying by what death he would glorify God. Before the contest he is called younger; in the contest, an old man, as one who has fulfilled the whole contest. This, then, is what David says, that warrior in youth, peacemaker in old age: I have been, he says, young, but I do not want you to think me still young; for indeed I have grown old, and I have not seen the righteous man forsaken, nor his seed seeking bread.

What is the seed of the righteous man? To Abraham were the promises spoken, and to his seed. He does not say "and to seeds", as of many, but as of one: "and to your seed", which is Christ. Hear the seed of the righteous man: My little children, of whom I am in labour until Christ be formed in you. And now, if anyone coming from the Gentiles hears our discourse and the Lord deigns to help, so that Christ is formed in his mind, whereby he may bear the offspring of faith, Christ will be his seed. And so Abraham was both the father of a line of descent according to the flesh, and he who first poured the word of the Lord into the hearts of the righteous. And therefore this seed of Abraham does not seek those loaves by which bodily nourishment is furnished, because it has the bread of righteousness which came down from heaven. For just as those are denied to be sons of Abraham who have not done the works of Abraham, so those are the seed of Abraham and are received among his sons who have accomplished his work. A true seed of Abraham was Elijah, to whom an angel furnished food, and in the strength of that food he walked through a course of forty days. The true seed of Abraham did not seek this nourishment of the body, he to whom loaves were brought from heaven; thus ravens served him his daily meal. He was so in need of everything that he had nothing of his own, and he was sent to bestow sustenance on others. A true seed was Daniel, to whom, when he was set among the lions, dishes through the air, filled with the reapers' meal, were carried by the prophet Habakkuk. There is, then, a bread of angels which man has eaten; for so it is written: Man ate the bread of angels. This is the bread of which David said: The Lord feeds me, and nothing shall be lacking to me. In a green place, there he has set me; beside the water of refreshment he has brought me up. Good David taught me the bread of angels, and he himself taught me the water of refreshment. This refreshment is spiritual, this refreshment is the rest of the inner mind. Good is the water that washes away sin, that cleanses inner things. What this water is, let us hear: If anyone, he says, thirsts, let him come to me and drink. He who believes in me, as Scripture says, out of his belly shall flow rivers of living water. Now this he said of the Spirit which those who were to believe in him were beginning to receive. The righteous man, then, lacks neither this bread nor the water of refreshment, he for whom the Holy Spirit is rest and refreshment.
'''
