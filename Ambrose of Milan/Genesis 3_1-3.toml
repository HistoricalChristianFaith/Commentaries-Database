[[commentary]]
quote='''
And the serpent said to the woman: Did God say, you shall not eat of any tree of the garden? The woman answered the serpent: Of the fruit of any tree in the garden we shall eat, but of the tree in the middle of the garden, God said, you shall not eat of it, neither shall you touch it, lest you die. Although you are aware that the serpent is wiser than all creatures, his cunning is especially noticeable here. As he sets his snares, he pretends to give utterance to the words of God, for God had already said: From every tree of the garden you may eat, but from the tree of the knowledge of good and evil you must not eat, for the day you eat of it you must die. The serpent inserted a falsehood in questioning the woman thus: Did God say, you shall not eat of any tree? Whereas God had actually said: From every tree of the garden you may eat, but from one tree you must not eat, meaning, by that, the tree of the knowledge of good and evil which was not to be tasted. We need not wonder at the manner of deception. Deceit accompanies any effort at ensnaring an individual. The serpent's question was not without its purpose. But the woman's reply will indicate that there was nothing questionable in the command of God: Of the fruit of all the trees in the garden we may eat, but of the fruit of the tree in the middle of the garden, God said, you shall not eat of it neither shall you touch it, lest you die. There was nothing inexact about the command itself. The error lay in the report of the command. The Scriptural passage under discussion is self-explanatory. We realize that we ought not to make any addition to a command even by way of instruction. Any addition or qualification of a command is in the nature of a falsification. The simple, original form of a command should be preserved or the facts should be duly set before us. It frequently happens that a witness adds something of himself to a relation of facts. In this way, by the injection of an untruth, confidence in his testimony is wholly shattered. No addition therefore—not even a good one—is called for. What is, therefore, at first sight objectionable in the addition made by the woman: Neither shall you touch anything of it? God did not say this, but, rather: you must not eat. Still, we have here something which leads to error. There are two possibilities to the addition she made: Either it is superfluous or because of this personal contribution she has made God's command only partly intelligible. John in his writings has made this clear: If anyone shall add to them, God will add unto him the plagues that are written in this book. And if anyone shall take away from these words of the book of this prophecy, God will take away his portion from the tree of life. If this is true in this case, how much truer is it that nothing should be taken away from the commands laid down by God! From this springs the primary violation of the command. And many believe that this was Adam's fault—not the woman's. They reason that Adam in his desire to make her more cautious had said to the woman that God had given the additional instruction: Neither shall you touch it. We know that it was not Eve, but Adam, who received the command from God, because the woman had not yet been created. Scripture does not reveal the exact words that Adam used when he disclosed to her the nature and content of the command. At all events, we understand that the substance of the command was given to the woman by the man. What opinions others have offered on this subject should be taken into consideration. It seems to me, however, that the initial violation and deceit was due to the woman. Although there may appear to be an element of uncertainty in deciding which of the two was guilty, we can discern the sex which was liable first to do wrong. Add to this the fact that she stands convicted in court whose previous error is afterward revealed. The woman is responsible for the man's error and not vice-versa. Hence Paul says: Adam was not deceived, but the woman was deceived and was in sin.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"
