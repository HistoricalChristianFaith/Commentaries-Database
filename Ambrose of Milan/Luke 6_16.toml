[[commentary]]
quote='''
Judas too is chosen, not through imprudence but through providence. How great is truth, which not even a hostile minister weakens! How great the moral goodness of the Lord, who preferred that his judgment rather than his affection be endangered in our eyes! For he had taken on the frailty of man, and therefore he did not refuse even this part of human weakness. He willed to be deserted, he willed to be betrayed, he willed to be handed over by his own apostle, so that you, deserted by a companion, betrayed by a companion, may bear with moderation that your judgment has erred, that your kindness has been lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
