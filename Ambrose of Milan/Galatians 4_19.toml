[[commentary]]
quote='''
The form and importance of this offspring is demonstrated in the words of the Apostle: My dear children, with whom I am in labor again until Christ is formed in you. This is the form into which the whole contents of our minds should be poured and Christ should appear conspicuously in the life-giving womb of our souls. Our offspring should be faith and our sustenance, the precepts of Wisdom. With these precepts the infancy of our heart should be imbued, its boyhood be instructed, its youth be rejuvenated, and its old age grow old and grey: A spotless life is old age. That old age of the soul is good when no stains of perfidy have stained it. Hence Paul defends his offspring from this stain—through the Gospel did I beget you, he says—lest a gust of wind of false doctrine may severely affect them in their infancy. The Apostle brought into being, therefore, masculine thoughts. He yearned to bring to perfect manhood in the unity of the faith the people whom he instructed how to attain, in the recognition of the Son of God, the mature measure of the fullness of Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 1"
