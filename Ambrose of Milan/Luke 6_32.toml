[[commentary]]
quote='''
So the Christian is instructed by a good example, so that, not content with the law of nature, he seeks its grace. For if it is common to all, even to sinners, to love in return, he whose kind of profession is loftier ought also to have a richer zeal for virtue, so as to love even those who do not love. For even if the lack of any merits for loving excludes the practice of love, yet it will not have excluded the practice of virtue. For as in the case of one who loves you it is shameful not to return gratitude, and from love of returning gratitude love grows in you for him whom you did not love before, so too in the case of one who does not love you, you ought to love virtue, so that, while you love virtue, you may begin to love him whom you did not love, since the recompense of one who loves is rare and perishable, that of virtue everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
