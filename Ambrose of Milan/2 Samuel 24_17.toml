[[commentary]]
quote='''
Good, therefore, is humility. It delivers those who are in danger and raises those who have fallen. This humility was known to him who said, "Behold, it is I that have sinned, and I the shepherd have acted wickedly; and these in this flock, what have they done? Let your hand be against me." Well does David say this who made his kingdom subject to God and did penance and, having confessed his sin, asked pardon. He attained salvation through humility. Christ humbled himself to raise up all, and whoever follows the humility of Christ attains the rest of Christ.
'''
source_url=''
source_title="ON THE DEATH OF THEODOSIUS 27"

[[commentary]]
quote='''
And how admirable is this too, that he offered himself to the angel who was striking the people, saying: This flock, what has it done? Let your hand be upon me and upon the house of my father. By this deed he who was reckoned unworthy of absolution was at once judged worthy of sacrifice. Nor is it any wonder if by such an offering of himself for the people he obtained pardon for his sin, since Moses, by offering himself to the Lord for the error of the people, blotted out even the sins of the people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
