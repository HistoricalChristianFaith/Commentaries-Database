[[commentary]]
quote='''
To convince you that the serpent is the type of pleasure, take note of his condemnation.

On your breast and on your belly shall you crawl, we read. Only those who live for the pleasures of the stomach can be said to walk on their bellies, whose god is their belly and their glory is their shame, who eat of what is earthy, and who, weighed down with food, are bent over towards what is of earth. The serpent is well called the symbol of pleasure in that, intent on food, he seems to feed on the earth: On your breast and on your belly shall you crawl, dust shall you eat all the days of your life. We should not tolerate any of the excuses the Devil may make. By so doing we may, perchance, offer him an occasion to display his wickedness. We do this when we say that his iniquity resulted from his condemnation and hence that he aimed constantly to injure mankind because he was condemned for the very purpose of doing us harm. This seems to be pretty fanciful. If we regard the sentence passed on him to be in the nature of a condemnation, God did not condemn the serpent in order to cause injury to man. He pointed out what was to happen in the future. Furthermore, we have demonstrated above how that temptation can be of great service to mankind. What we are to expect can in some measure be gathered from our knowledge of what has been written: Whoever shall glorify me, him will I glorify and he that despises me shall be despised. God brings to pass what is good, not what is evil, as His words can teach you that He confers glory and disregards punishment. Whosoever shall glorify me, He says, him will I glorify, thus declaring that the glory of the good is the purpose of His work. And concerning him that despises me, He did not say I shall deprive of glory, but that he shall be deprived of glory. He did not avow that injury to them would be the result of His action, but pointed out what was to come. He did not say, therefore, I shall make you crawl on your breast and belly and feed on earth all the days of your life. What He actually said was: You shall crawl and you shall eat, in this way showing that He predicted what the serpent would do in the future rather than prescribe what he was to do. The earth, not the soul, He said, is your food, and this, in fact, can be of profit to sinners. Hence the Apostle delivered such a one for the destruction of the flesh, that his spirit may be saved in the day of our Lord Jesus Christ. He says that the serpent crawls on his breast and belly. This is due not so much to the shape of his body as to the fact that he has fallen from celestial happiness because of his thoughts of earth. The breast, in fact, is frequently referred to as the seat of wisdom. And so the Apostle leans his head, not on the ground, but on Christ's breast. If, therefore, the wisdom of the Devil is compared to that of the most cruel of animals whose breast is between its legs, if men, too, who, minding the things of the earth and without the inner urge to rise towards heaven, have the appearance of crawling on their bellies—then we surely ought to fill the belly of our souls with the Word of God rather than with the corruptible things of this world. Fittingly, therefore, does David, assuming the character of Adam, say: My soul is humbled down to the dust, my belly cleaveth to the earth. He used the word "cleaveth" in reference to the serpent who feeds on earthly iniquities. Thus the Apostle says that we should take on the pattern of Christ, so that the virtue of Christ may extend to you.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"

[[commentary]]
quote='''
For the sentence has not been loosed for him as it has for you; for the grace of Christ, which loosed you, bound him fast; for the curse remains, directed against the serpent because of your deception. For thus it was said to him: Cursed are you by all the beasts of the earth. For he who was the foe of the good is the common enemy of all, and he is condemned on behalf of those whom he had not yet harmed, since he who harmed man, to whom all those things are subject, harmed all things. For he broke the common law, since he himself, with the rest, is made subject to man. Therefore his curse is weighed down by the common hatred and execration of all. And the kind of condemnation is not death but a lasting punishment. Upon your breast, he says, and belly you shall walk. For the guilty conscience had to be pressed down, wickedness trampled, and the fraudulent secret banished, as it were, from the face of God; at the same time it is shown that wickedness is earthly, which bends one back down to the earth. And so he added: And you shall eat earth all the days of your life.

By these words the nature of the serpent seems indeed to be described, but rather every vessel of wickedness is described, every serpent of depravity, who casts himself down upon his belly and shuts his poison up within himself and rolls it about inside in his breast, slippery in his thoughts and walking upon his frauds, entangling himself in his own wiles, always stirring and agitating his poisons when he thinks, trampling also his belly, that is, the seedbed of his heart. Hence David says beautifully: Sinners have been estranged from the womb, they have gone astray from the belly, they have spoken falsehoods. Their fury is after the likeness of the serpent, like the deaf asp that stops its ears, which will not hear the voice of the charmers and of the sorcerer, who are charmed by the wise man. For this reason, too, that seems beautifully said which we read in a prophetic book: I am in pain in my belly, my belly! because wickedness is there where innocence ought to be, and that part labours the more which ought to be the calmer in us, and it is trodden down by the footprints of malice, goaded by its claws, shaken by a certain advance and growth of depravity, there where the generative seed of an eternal posterity lies. This seems indeed to be referred to his grief that the sons whom he had begotten and taken up had perished, but much more to his not having in his belly the seedbed of the word. Therefore he speaks of his belly as of something most precious. For precious is the womb of the mind, in which a fruitful crop of counsels is wont to spring up from the seed of the word, and in which certain members, as it were, of the whole life and of the virtues and disciplines are wont to be formed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
