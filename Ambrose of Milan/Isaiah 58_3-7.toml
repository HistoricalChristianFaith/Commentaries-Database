[[commentary]]
quote='''
Hunger alone however, is not demanded, but the full discipline of fasting. Therefore to others is it said: Behold in the day of your fast you find your own wills, and you goad on all who are subject to you. Or do you fast for debates and strifes, and strike with your fists? Why is there such a fast for me so that your cry is heard in clamor? Not this fast, have I chosen, for a man to afflict his soul even for a day; not if thou shouldst wind thy head about like a circle, and spread sackcloth and ashes, and not thus will ye call an acceptable fast. Not such a fast have I chosen, says the Lord. We have heard what kind of fasting is rejected, now let us hear the kind that is commendable. Loose every band of injustice, loose the bonds of violent contracts, let them that are broken go free, and tear asunder every unjust writing. Deal thy bread to the hungry, and bring the needy and the harborless into thy house. If thou shalt see one naked, cover him, and thou shalt not despise the domestics of thy seed. You see what the appearance and nature of fasting is, what the disposition of the mind should be, so that you may have time for prayer, that you may meditate upon the law of God day and night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"
