[[commentary]]
quote='''
With miseries, he says, I am afflicted and bowed down unto the end; all the day I went about saddened. Unto what end does he say he was bowed down: unto the lawful end of penitence, or further, so that we may understand it mystically, unto Christ, who is the end of the Law, who suffered himself to be stoned, suffered his dead body to be wounded? But those wounds gave off no stench of penitence, but the fragrance of grace. Indeed no corruption of death, as from other men, but a fountain of eternal life sprang from his wound, as Scripture teaches us, saying: And water shall leap with delight from the fountains of salvation. Water, then, leapt from the wound, that we might drink salvation; all the sinners of the earth shall drink, that they may lay down their sins. Look at each point. Christ was afflicted with miseries, to make blessed the men who were set in miseries. Let no one call him miserable who is righteous, because he himself said: No one will make you miserable; he was bowed down, so that we might be raised up; he was saddened, to gladden us, according to what is written: For if I sadden you, who is there to gladden me but he who is saddened by me? He, then, who is saddened by the Lord Jesus Christ himself gladdens Christ and is himself gladdened by Christ. Therefore we too, then, recognize that satisfaction must be made by us not carelessly. Let us be bowed down unto the end, that is, bringing to Christ not only faith but also perseverance in our sufferings, and let us rejoice in our sufferings, as Christ too rejoiced in his sufferings. Those he took on for his little servants; let us undergo them for the Lord. This, then, is the end: that I may fill up, he says, what is lacking of the tribulations of Christ in my flesh for his body, which is the Church, of which I have been made a minister. We see what we must take on, we who take on the priestly ministry: that we ought to bear the sufferings of the body bravely not only for ourselves but also for the Church of the Lord. But David added the sufferings of the soul too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
