[[commentary]]
quote='''
The next weapon he uses is that of boasting, which always causes the offender to fall down; for they who love to boast of the glory of their virtue descend from the stand and vantage ground of their good deeds. Hence it is said, And he led him to Jerusalem.

It is the fate of boasting, that while a man thinks he is climbing higher, he is by his pretension to lofty deeds brought low. Hence it follows, And he said unto him, If thou art the Son of God, throw thyself down.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There follows the weapon of boasting, by which one readily falls into sin, because while men desire to boast of the glory of their virtue, they depart from the place and station of their merits. And he led him he says to Jerusalem and set him on the pinnacle of the temple.

For such is boasting, that while each one thinks he is climbing to higher things, he is thrust down to lower things by laying claim to lofty deeds. And he said to him: if you are the Son of God, cast yourself down.

Truly a devilish voice, which strives to cast the mind of man down from a higher step of merits. For what is so proper to the devil as to persuade each one to cast himself down?

Learn, then, you too, to conquer the devil. The Spirit drives you: follow the Spirit. Let not the enticement of the flesh call you back; full of the Spirit, learn to despise pleasures. Fast, if you wish to conquer. It follows that the devil thinks you are to be tempted through a man; Christ, as the stronger, is tempted face to face, you through a man. And it is a word of the devil when a man says: 'you are strong: eat and drink, and stay as you are'. Do not trust yourself to yourself; do not blush to need safeguards which Christ did not need. And yet he did not neglect them, so as to teach you, saying: take heed lest your heart be weighed down with wine and drunkenness. Paul did not blush, who says: so I strive, not as one beating the air. The Apostle indeed was not beating the air, but he was scourging the powers of the air. But I chastise he says my body and bring it into slavery, lest perhaps, when I have preached to others, I myself be found reprobate.

At the same time the devil marks out his own weakness and malice, because the devil can harm no one unless that one has cast himself down. For he who leaves heavenly things and chooses earthly ones falls into a kind of voluntary precipice of a slipping life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
