[[commentary]]
quote='''
(in Luc. 8. 52.) For by the ancient custom minstrels were engaged to make lamentation for the dead.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Nor is that statement of Matthew out of keeping, where he says that there were trumpeters in the ruler's house and a crowd making a tumult, either because by ancient custom trumpeters were said to be employed to kindle and stir up mourning, or because, through the chanting of the Law and the letter, the synagogue could not grasp spiritual exultation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
