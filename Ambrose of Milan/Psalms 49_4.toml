[[commentary]]
quote='''
I will incline my ear to a parable, I will open my proposition on the psaltery. The wise hearer attends and inclines his ear, that he may understand the figures of parables. The Savior calls him his own ear who has the ear for hearing. The Lord also opens his closed proposition when he has found a fit instrument for himself and a vessel of election, which he calls a psaltery; like such a psaltery, Paul made the song of sweet grace resound, all his strings sounding in harmony with him, striking the inner and the outer string with the plectrum of the Holy Spirit, so that he prayed both with the tongue and with the mind. And therefore he says: I will pray with the spirit, I will pray also with the mind; I will sing with the spirit, I will sing also with the mind. Such a man, then, Christ promises long before, through whom he would make manifest hidden things and open what was wrapped in the obscurity of prophetic speech. A good psaltery it is when life agrees with faith and the flesh with the soul, and the will breathes in accord with virtue. This is the sweet psaltery, where the discipline of living is melodious, so that what is written may be fulfilled: The tongue of the dumb shall be clear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
