[[commentary]]
quote='''
The Mystical Table also is obtained by fasting, that Table of which David says: Thou hast prepared a table before me, against them that afflict me. Hunger is acquired at a price, and that cup which inebriates with the sobriety of the heavenly Sacraments is sought by thirst. For the Lord has said: You who thirst go to the water: and whoever of you have no money, go and buy and drink and eat. And elsewhere He says: Behold they who serve me shall eat, but you shall be hungry: behold they who serve me shall drink, and you shall be thirsty. Who are "you" unless you who have drunk before, concerning whom He has said above: You have set a table for demons, and have filled the cup of Fortune? Therefore if holy fasting leads us to that venerable table, if by this hunger we can purchase those things which are eternal, why do we hesitate about the things which are within the sphere of human use, since fasting makes these also more pleasing for us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"
