[[commentary]]
quote='''
The patriarch also teaches what kind of division it ought to be. Let the stronger divide and the weaker choose, so that he may have nothing to complain of. He will not be able to find fault with his own choice. No occasion for going back on it will remain to the one who is given the option of choosing, nor is the divider burdened; for the more prudent he is, the more cautious, so that he is neither cheated in the division nor defrauded in the choice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"

[[commentary]]
quote='''
Rightly, then, did Abraham wish to let his nephew go with good grace, whom he could not keep as he turned away from him. So too let the good mind separate and part itself from the headlong and sunken lapse of the irrational. If you he says go to the left, I to the right; or if you to the right, I to the left, that is, the things that are on the right for you are on the left for me, and those that are on the left for you are on the right for me. For to the imprudent man the things of the body are on the right. These he prefers, these he sets in the better part; riches too and honours he puts first; but the grace of attaining immortality he holds on the left, which for the wise man is on the right; for length of life is in his right hand. And the foolish man casts all the virtues of the soul to the left, but the prudent man places them at his right, and the things of the body at his left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
