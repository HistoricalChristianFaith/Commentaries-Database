[[commentary]]
quote='''
Seeing, then, the true Jerusalem and Zion, he said: When you have blessed Jerusalem and Zion in your will, then you will accept the sacrifice of justice, that is, the sacrifice of the body of Christ, who says, when he was speaking of his own passion: Open to me the gates of justice, and having entered them I will confess to the Lord. And in the gospel he says to John: Let it be so now; for thus it is fitting for us to fulfil all justice, and further on: Blessed are they who suffer persecution for justice's sake. Christ is justice; so he declares that the sacrifice of Christ will be acceptable to the Father. This, then, is what he also speaks of earlier: Sacrifice the sacrifice of justice, and hope in the Lord.

This justice is the spiritual offering and the holocaust of fervent devotion and of the infusion of the Holy Spirit, which he says is to come when the souls of believers begin to be brought to that spiritual altar of the Lord, souls which, renouncing pleasures and delights, draw as it were a plough through their inward parts, so that they may bear the fruits of a devout cultivation.

Or certainly thus: when you have blessed the Church acquired from the Gentiles, and the spiritual sacrifice of justice has begun to be offered often, then the holy martyrs too, who offered their body to be ploughed up for Christ, will be offered like calves upon the sacred altars, as we find written in the Apocalypse of John that under the altar were the souls of those who offered their bodies to martyrdom for the name of the Lord Jesus, that they might purchase for themselves the grace of Christ. To him be honour, glory, praise, perpetuity, with God the Father and the Holy Spirit, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 17"
