[[commentary]]
quote='''
For the Lord Jesus himself, when he was in the form of God, did not think it robbery to be equal with God, but emptied himself, taking the form of a servant, made in the likeness of men; found in appearance as a man, he humbled himself, becoming obedient even unto death, as the Apostle says, wishing to declare a subjection not continual and perpetual but temporal, such as was taken up with the flesh and laid down with the servitude of that body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
What shall I say of Joseph, who, set upon by his brothers, stripped of his father's garment, cast into a pit and sold into slavery, expressed a clear sign of the Lord's incarnation, in that he, the beloved of the Father, being in the form of God, did not think it robbery to be equal with God, but emptied himself, so that, taking the form of a servant, he came and humbled himself even to the death of the cross, he who, bought and sold by his own brothers, redeemed the human race by his price?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"

[[commentary]]
quote='''
Receive also a third mystery. What the Hebrews call David the Latins interpret as "humbled". But who is truly humbled except him who did not think it robbery to be equal to God, but, taking the form of a servant, humbled himself, being made obedient even unto death? This, then, is the one who is signified by David: exalted by nature, but humbled by mercy; lofty in divinity, but meek in the body. And so where he is humbled, there he is obedient. For obedience is born from the same source as humility, and ends in it. For when he is said to have been made obedient even unto death, and death not of the divinity but of the body, that obedience was surely not of the divinity but of the body, nor was that humility of the majesty but of the flesh. And so, as regards the taking up of the body, the reading from the Apostle has declared in what the humility of Christ consisted; but what pertains to the nature of the divinity was disclosed by the Gospel reading, which you followed with devout assent when you heard it read, the Son of God saying: I and the Father are one; for the Son and the Father are one in divinity, but the mystery of the body and the eternity of the divinity are not one. Yet not only did the Apostle say that the Lord was humbled, but he himself also declared that he was humble, saying: Take up my yoke, for it is light, because I am meek and humble of heart. And yet he is signified not only by interpretation but also by an open appellation, for it is written: I have found David my servant, with my holy oil I have anointed him, and below: He shall say to me: You are my father, and: I will say to him: You are my son. So we have found the David whom we were seeking: a servant indeed in appearance, but Lord in truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 7"
