[[commentary]]
quote='''
So she is praised by the bridegroom because she has sought him so well and so steadfastly, and therefore she is now not only called sister but is also named well pleasing, as pleasing to him who was pleasing to the Father, and beautiful as Jerusalem, a wonder like ranks set in order, because she holds all the mysteries of the eternal city and is a wonder to all who see her, since she is full like equity and perfect; and having borrowed her brightness from the light of the Word, while she always strains toward it, she also becomes terrible by a certain order, carried forward to the summit of the virtues. And so, as to one now perfect, he says: Turn your eyes away from me, do not strain against me. Since by her exceeding devotion and faith she has passed beyond the capacity of her nature and of her own condition, and since it is a heavy thing to gaze face to face upon the unapproachable light, Turn he says your eyes away from me, because she cannot bear the fullness of his divinity and the splendor of the true light. Yet we can also take Turn your eyes away from me in this way: though you are perfect, other souls still have to be redeemed by me, others to be propped up; for by looking at me you lift me up, but I came down for this reason, that I might lift up all. Although I have risen and have the Father's seat, yet I will not leave you orphans, as though bereft of a father's protection, but I will strengthen you by my presence. You have this written in the Gospel: Behold, I am with you even to the consummation of the world. Turn your eyes away from me, then, because you lift me up. For the more one strains toward the Lord, the more he lifts up the Lord, and is himself lifted up. Hence that man too says: I will exalt you, O Lord, for you have taken me up; for the holy man exalts the Lord, the sinner humbles him. So he wants her to turn her eyes away, lest, regarding her as one who can already follow to higher things, he should be lifted up and leave the other souls behind. That is why in the Gospel too he showed his glory not to all the disciples, but to the more perfect. Now picture some teacher who wishes to open an obscure matter to his hearers: although he himself is powerful in speech and knowledge, he nevertheless comes down to the ignorance of those who do not understand, and uses simple, plainer and ordinary speech, so that he can be understood. Whoever, then, among the hearers is livelier of mind, one who can follow easily, lifts him up and shakes him off. Seeing him, the teacher calls him back, so that he may rather allow the teacher to linger over humbler and plainer things, in order that the others too may be able to follow.

As for Aquila's rendering, sounding as one unveiled, by sounding he pointed to the wonder she deserves, as one who has great and resounding works, and by unveiled to the brightness of her works, or else to the fact that the works of her soul shine before the Father who is in heaven. Hence you understand that it was not idly that her mantle was taken from her, so that, laid open by her merits and bare, she might shine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"
