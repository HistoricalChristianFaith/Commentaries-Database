[[commentary]]
quote='''
And they say: Let us see this word which has come to pass, as the Lord has shown us. And they came in haste.

You see the shepherds make haste; for no one seeks Christ with sloth. You see that the shepherds believed the angel: you too, believe the Father, the Son, the Holy Spirit, the angels, the prophets, the apostles. See how expressly Scripture weighs the force of each word. 'They make haste' it says 'to see the word'. For when the flesh of the Lord is seen, the Word is seen, which is the Son. Let not this seem to you a slight example of faith, nor the person of the shepherds a mean one. Certainly, the meaner in point of learning, the more precious in point of faith. The Lord sought out not schools full of choirs of wise men but a simple people, which did not know how to deck out and color what it had heard; for simplicity is sought, ambition is not desired.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
