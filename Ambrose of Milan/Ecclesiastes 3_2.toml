[[commentary]]
quote='''
The fish knows ‘the time to be born.’ Solomon in his wisdom declared this to be a great mystery, this knowledge of the time to go and the time to return, the time for performance and the time for change. Fish are not deceived in this knowledge, because they follow an instinct of nature, the true teacher of loyal devotion, and not the deliberations of reason and rhetorical argumentation. Hence, all living creatures have a prescribed time for bringing forth offspring. By man alone are such times undetermined and ill-planned. The other creatures seek out a season of clement weather. It falls to women alone to give birth in seasons of inclemency. An unsettled and arbitrary desire to produce offspring leads to an uncertain time for childbirth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
