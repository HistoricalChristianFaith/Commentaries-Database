[[commentary]]
quote='''
For since God is one who draws near, not one who withdraws far off, as the Scripture of the Old Testament has it, surely he who draws near does not cast off. For it belongs to the divine mercy to be a cause of death to no one and to think that all are to be redeemed. But see whether it is not he who is cast off who withdraws himself far from the Lord, as David says: For behold, those who withdraw themselves far from you shall perish; you have destroyed all who commit fornication away from you. What is 'commit fornication away from you'? That with the mockeries of their own shamefulness they leave you and depart from you and stray from your precepts. Indeed elsewhere you have it written: But adulterers God judges, destroying them from himself, that is: by estranging them from you, you have destroyed them. He, then, who separates himself from the Lord is himself separated from the Lord, and he who does not know the Lord is not known by the Lord, and he who ignores is ignored, as the Lord himself said: Depart from me, all you workers of iniquity. I do not know you; for he does not deign to know the ministers of injustice and the authors of iniquity. The sinner, then, is not cast off, because he casts himself off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For behold, he says, those who remove themselves far from you will perish. For each one by his works either joins himself to your loving-kindness or separates himself from it; for he flees God who does those things in the knowledge of which he fears to be caught, like the one who, covered by walls and surrounded by darkness, thinks that he is not seen by the Lord God; yet he is seen, when it is said: You have destroyed all who commit fornication away from you. For just as a woman who commits fornication does not cleave to her husband, and is neither one flesh with her husband nor one spirit, but divides and separates herself by fornicating, so whatever soul does not cleave to God, but, serving the vain worship of idols, commits fornication, divides itself by the perversity of sacrilege and becomes far from the Lord, though it ought to be near; and he perishes who is separated from the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 11"
