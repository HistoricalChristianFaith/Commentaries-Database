[[commentary]]
quote='''
And in the synagogue there was a man having an unclean spirit; and below: but rising from the synagogue he entered the house of Simon and Andrew. And Simon's mother-in-law was held by great fevers.

See the clemency of the Lord Savior. Neither moved by indignation nor offended by crime nor violated by injury does he desert Judaea; indeed, unmindful of injury, mindful of clemency, now by teaching, now by freeing, now by healing, he soothes the hearts of the faithless people. And well did Saint Luke set first the man freed from the spirit of wickedness, and place after it the woman's healing. For the Lord had come to cure both sexes, and he who was created first had to be healed first; nor was she to be passed over who had sinned more by fickleness of mind than by depravity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
