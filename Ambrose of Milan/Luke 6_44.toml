[[commentary]]
quote='''
On the thorns of this world the fig cannot be found, which as being better in its second fruit, is well fitted to be a similitude of the resurrection. Either because, as you read, The fig trees have put forth their green figs, (Cant. 2:13.) that is, the unripe and worthless fruit came first in the Synagogue. Or because our life is imperfect in the flesh, perfect in the resurrection, and therefore we ought to cast far from us worldly cares, which eat into the mind and scorch up the soul, that by diligent culture we may obtain the perfect fruits. This therefore has reference to the world and the resurrection, the next to the soul and the body, as it follows, Nor of a bramble bush gather they grapes. Either because no one living in sin obtains fruit to his soul, which like the grape nearest the ground is rotten, on the higher branches becomes ripe. Or because no one can escape the condemnations of the flesh, but he whom Christ has redeemed, Who as a grape hung on the tree.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It is a great discipline of virtue too, that you should not seek fruitful things from the unfruitful, nor expect the produce of fertility from the untilled. For to each its own cultivation gives fruits: in the thorns of this world that fig cannot be found which, because it is better in its fruitful fruits, is fittingly given the likeness of the resurrection, either because, as you have read, the fig trees have put forth their green figs, since the unripe and useless and falling fruit in the synagogue went before, or because our life is unripe in the body, ripe in the resurrection. And therefore we ought to renounce, far from us, worldly cares, which gnaw the soul and scorch the mind, so that we may obtain the ripe fruits of diligent cultivation. This we cannot find in the untilled places of this world, because they do not gather figs from thorns, nor do they harvest the grape from thistles. The one refers to the world and the resurrection, the other to the soul and the body: either because no one gains by sins fruit for his soul, which, like a grape, is spoiled near the earth and ripens on higher ground, or because no one can escape the condemnation of the flesh except him whom Christ has redeemed, who hung like a grape on the tree. Far, then, from that flesh which was commanded to bring forth thistles for condemned man, let us lift up our spiritual eyes, let us stretch out our hands, so that we may harvest Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
