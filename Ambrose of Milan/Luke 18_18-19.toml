[[commentary]]
quote='''
Now a certain ruler asked him, saying: Good Master, by doing what shall I possess eternal life? And Jesus said to him: Why do you call me good? No one is good but God alone.

A crafty question, and therefore a shrewd answer. For this ruler, a tempter, called him a good master, who ought to have called him good God. For although there is goodness in divinity and divinity in goodness — for no one, indeed, is good but God alone; every, moreover, man is a liar, and whatever is a liar is surely not good — yet by adding good Master he called him good in part, not in the whole; for God is good in the whole, man in part. Therefore the Lord says: Why do you call me good, whom you deny to be God? Why do you call me good, when no one is good but the one God? He does not, then, deny that he is good, but indicates that he is God; for what is good but what is full of goodness? But when it is written: There is none who does goodness, there is not even one, surely he said it of men, not of God; for God is one, not one of a number. So too the Son of God is excepted as the only one, not as one of many, and he is only-begotten, not one of the begotten. And therefore no one is good does not prejudge Christ, because no one judges Christ. For no one is said as of what is common to us, but Christ has nothing in common with us.

But if anyone is troubled that no one is good but the one God, let him be troubled too by this, that no one is good but God. But if the Son is not excepted from God, surely Christ is not excepted from the good either. But since in God the Son is another in person but one in power — for one, indeed, God, from whom are all things, and one Lord, through whom are all things — and since God and Lord are not two gods but one God, because the Lord your God is one Lord, surely, since according to majesty God is one in both persons, the one Good too is in both. For how is he not good who is born of the good? For a tree, indeed, that is good makes good fruits. How is he not good, when the substance of goodness taken from the Father has not degenerated in the Son, which has not degenerated in the Spirit? And therefore: Your good Spirit will lead me in the right way. But if the Spirit is good, who received from the Son, surely he too is good who handed it on. And since the Father is good, surely he too is good who has all things that the Father has; or, if you deny that the Son has goodness, you deny the Father too.

An evident argument needs no examples; yet at least follow the authority of the scriptures; for it is written: The Lord is a good judge to the house of Israel. Does he say it of the Son or of the Father? But the Father judges no one, because he has given all judgment to the Son. So the good Lord is the Son. Take another. Those who come to baptism surely confess the Trinity, because they are baptized in the name of the Father and of the Son and of the Holy Spirit: so they confess both to the Father and to the Son and to the Holy Spirit. When, then, it is said: Confess to the Lord, for he is good, surely the Father is good, the Son is good, the Holy Spirit too is good, but one God; and again: that the Lord is good to those who wait for him. Or is he not good who grants good things to the soul that seeks him? Or is he not good who satisfies your soul with good things? Or is he not good who says: I am the good shepherd?

But you think God is good for this reason, that he does not have judgment, in which lies the necessity of punishing. Although it has already been set forth that the judge is good to the house of Israel, yet elsewhere you have: How good is the God of Israel to the upright of heart! Of whom, then, do you think it was said, of the Father or of the Son? If of the Father, then he is not good to all. Why, then, do you detract from the Son? If of the Son, then confess that the Son too is good God; for he is the blessed God of Israel, because he has visited and wrought the redemption of his people. He is the king and God of Israel, to whom it is said: Rabbi, you are the Son of God, you are the king of Israel. So, then, here he says: since you who tempt me cannot perceive me as good, why do you call me good? Good indeed am I, but to the upright of heart, I to whom being good comes from nature, not from craftiness. The Son, then, is good; for he is the brightness of eternal light and the spotless mirror of God's majesty and the image of his goodness. How, then, is he not good who is the image of goodness? For as the image of God is God, but one God, so also the image of the divine goodness is good, but one goodness. For me, certainly, it is profitable to believe that God is good, whom I am to have as the judge of my offenses. Let those see to it who are unwilling to believe that he is good. So, because this man who tempts him is a lawyer, as is shown in another book, he did well to say: No one is good but the one God, so as to remind him that it is written: You shall not tempt the Lord your God, but that he should rather confess to the Lord, for he is good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
