[[commentary]]
quote='''
Already then, therefore, the sign of the future cross was being prefigured, and at the same time this too: in being stripped of his tunic, that is, of the flesh which he assumed, he was stripped of the comely diversity of virtues. So it was his tunic, that is, his flesh, not his divinity, that was bloodied, and it was the clothing of the flesh, not the immortality of life, that they were able to take from him. This tunic the Jewish beasts bloodied, those of whom he says: Behold, I send you as lambs among wolves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
