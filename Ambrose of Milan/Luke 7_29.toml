[[commentary]]
quote='''
God is justified by baptism, wherein men justify themselves confessing their sins. For he that sins and confesses his sin unto God, justifies God, submitting himself to Him who overcometh, and hoping for grace from Him; God therefore is justified by baptism, in which there is confession and pardon of sin.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And all the people hearing, and the tax collectors, justified God, being baptized with the baptism of John; but the Pharisees and the lawyers spurned the counsel of God against themselves, not being baptized.

Saint Luke, by adding particulars, has made plain what Saint Matthew, speaking as it were in general terms, had left somewhat obscure; for he says: and wisdom is justified by her children. Here, first, we see it expressed what that wisdom is; for he says: they justified God. God, then, is wisdom, because the Son of God is wisdom: wisdom by nature, not by progress. One wisdom is the power of God the Father, another wisdom is a power of the soul: the former is begotten, the latter created. One wisdom is the author of works, the other a work; for it is a work of the mind to be prudently wise, to perceive keenly. These are gifts of nature, but the worker is not a creature but the Creator, that is, not a gift of nature but the giver of nature's gifts.

And so God himself is justified through baptism, when men justify themselves by confessing their own sins, as it is written: tell your iniquities, that you may be justified; and he is justified in this, that he is not rejected through stubbornness, but his gift is acknowledged through righteousness; for righteous is the Lord, and he has loved righteousness. In this, then, lies the justification of God: if he is seen to have bestowed his gifts not on the unworthy and guilty, but on those made innocent through the washing, and righteous. Let us therefore justify the Lord, that we may be justified by the Lord.

Let us inquire more earnestly what it is for God to be justified. The Apostle says: but let God be true, and every man a liar, as it is written: that you may be justified in your words and may overcome when you are judged; David too says: against you only have I sinned and done evil before you, that you may be justified in your words and may overcome when you are judged. So he who sins and confesses his sin to God justifies God, yielding to him as the victor and hoping for grace from him. In baptism, therefore, God is justified, for in it there is both confession and pardon of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
We can also take it this way: he who confesses his sin justifies the Lord. And so in the Gospel you have it that the publicans justified God, being baptized with the baptism of John. Now John the Baptist made a baptism that was of repentance. And he who does penance does not deny his transgressions. Therefore, since David had his transgression ever against him, he certainly did not deny what he also blushed at, he did not deny what he also acknowledged. And by not denying it he was certainly doing penance for the error he had committed, and so, by confessing his transgression, he justified the Lord and was himself justified by the Lord. For the Lord is justified when his justice is proclaimed and pardon is asked of him. At the same time he both justifies the one who confesses and is justified in his words, as it is written: Tell your iniquities, that you may be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 10"
