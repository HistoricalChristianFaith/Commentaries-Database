[[commentary]]
quote='''
Indeed, take the reason how we believe in the Author, lest perhaps you say: But it has the Church too, but it has the remission of sins too, but it has the resurrection too. What then? The case is equal. Thus we believe in Christ, thus we believe also in the Father, just as we also believe the Church and the remission of sins and the resurrection of the flesh. What is the reason? Because he who believes in the Author believes also the Author's work. In fact, lest you think this comes from our own ingenuity, take a testimony: If you do not believe me, at least believe the works. So you have this. Now your faith will shine out more fully if you think true and entire faith must be given to the work of your Author.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExplanation%2520of%2520the%2520Creed.html'
source_title="Explanation of the Creed"
