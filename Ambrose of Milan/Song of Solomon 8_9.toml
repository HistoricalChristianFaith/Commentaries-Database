[[commentary]]
quote='''
If she is a wall, let us build upon it silver shelters; and if she is a door, let us carve upon it cedar boards. The soul of the saint is a wall. The Church too has her walls, she who, now more perfect, says: I am a fortified city (Isa. 27:3). This is the wall which has twelve apostolic gates, through which an entrance into the Church lies open to the people of the nations. But a wall, although it encloses the circuit of the whole city, is nevertheless more strongly fortified when it has had shelters prepared, in which the defenders of the city may have a safe support for watching and defending. But because this city is rational, and all its hope is in the Word of God, not iron but silver bulwarks are required for it, accustomed to repel the assaults of the enemy by heavenly words rather than by bodily pleasures.

Supported by this protection, shining with this splendor, she is judged fitter for union with Christ. And because Christ is the door, who says: If anyone enters by me, he will be saved (John 10:9); the church too is called a door, because through her an approach to salvation lies open to the peoples. But lest she be corrupted by the moths or worms of the heretics, the daughters of Jerusalem, or the angels, or the souls of the righteous, say: Let us build upon her cedar boards, that is, the good fragrance of sublime faith. For sweet is the fragrance of this wood, which neither worm nor moth corrupts. Therefore the use of this wood is chosen for raising the gables of roofs and for forming the letters of the alphabet, by which childhood is instructed for the study of liberal learning. This wood, then, is lofty for grace, light for a burden, sweet for fragrance, useful as an instrument of knowledge, fit for the ministry of eternal understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
