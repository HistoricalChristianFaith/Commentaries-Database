[[commentary]]
quote='''
But when Herod desired to see some wonders from him, he was silent and did nothing, because neither did that man's cruelty deserve to see divine things, and the Lord was avoiding display. And perhaps in Herod all the ungodly are signified as in a type, who, if they have not believed the Law and the prophets, cannot see the wonderful works of Christ in the Gospel either.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
