[[commentary]]
quote='''
The prince of priests has died for you, for you he was crucified, that you might cleave to his nails. For in that flesh he took up both you and your sins; the handwritings of your offences were fixed to his gibbet, so that you now owe nothing to the world, which you once renounced. And rightly you owe nothing, you who are able to say: For the world is crucified to me, and I to the world, so that you no longer fear death, if you bear Christ, in whom you can say: Where, O death, is your victory? Where, O death, is your sting? For when that old man of ours was fixed to the cross, sin was destroyed, the sting blunted, guilt made void, so that we may cease any longer to serve shameful deeds. For the old man too has gone away. But now it is no longer the old man in us, but there is a new creature, having in itself the likeness of Christ, with whom we were buried together in the likeness of his death and so have taken on the image of his life; we have received the wings of spiritual grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"

[[commentary]]
quote='''
Who is that usurer of sin, if not the devil, by borrowing sin from whom, Eve indebted the whole human race with the usury of a guilty inheritance? Therefore like a wicked usurer he held the bond which afterward the Lord blotted out with His blood. For what had been written in characters of death had to be destroyed by death. Accordingly the devil is a usurer. Therefore he showed his riches to the Savior saying: All these will I give thee if falling down thou wilt adore me. But in truth the Lord, the payer of the debt, owed nothing to him, Who could say: The prince of this world cometh and hath found nothing of his in me. He owed nothing but He paid for all, just as He Himself testifies, saying: Then did I pay that which I took not away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 9"

[[commentary]]
quote='''
And so, just as the discipline of wisdom, entering into the soul, takes away imprudence, and knowledge takes away ignorance, so perfect virtue blots out iniquity, and the remission of sins blots out every sin. Hence the apostle says splendidly that he has freely forgiven us our sins, the Lord Jesus, blotting out the bond of the decree that was against us, and he took it, he says, out of the way, fastening it to the cross. With his blood he blotted out the ink of Eve; he blotted out the obligation of a liable inheritance. Faith, then, lessens sin. Therefore the Lord, when forgiving sins, used to say: Be it done to you according to your faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 13"
