[[commentary]]
quote='''
Saint Luke set down only four beatitudes of the Lord, but Saint Matthew eight. But in those eight are these four, and in these four those eight. For the one embraced four as it were cardinal virtues; the other in those eight unlocked the mystical number. For many psalms are written for the eighth, and you receive the commandment to give a portion to those eight, perhaps the blessings; for as the eighth is the perfection of our hope, so the eighth is the sum of virtues.

But first let us look at the things that are fuller. Blessed he says are the poor in spirit, for theirs is the kingdom of heaven. Both evangelists set this down as the first blessing. For it is first in order, and a kind of parent and begetting of the virtues, because he who has despised worldly things will himself merit eternal ones; nor can anyone attain the merit of the heavenly kingdom who, possessed by desire for the world, has no means of rising out of it.

The second blessing: blessed he says are the meek. The third: blessed are those who mourn. The fourth: blessed are those who hunger. The fifth: blessed are the merciful. The sixth: blessed are the pure in heart. The seventh: blessed are the peacemakers. And fittingly the seventh, since on that day God rested from all the works of the world; for it is the day of rest and of peace. The eighth: blessed are those who suffer persecution for righteousness' sake.

Come, Lord Jesus, teach us the order of your beatitudes; for not without order did you say first, blessed are the poor in spirit, second, blessed are the meek, and third, blessed are those who mourn. Even if I know something, yet I know in part. For if Paul knew in part, how much can I know, who am as inferior to Paul in word as in life? For life demands the word and acquires it, but speech without life is not the speech of God. How much wiser than I is Paul! He glories in dangers, I glory in successes; he glories because he is not lifted up by revelations, I, if any revelations came to me, would glory. But yet God can raise up men from stones and bring forth a word from what is shut, draw out a voice from the dumb. And if he opened the eyes of a she-ass so that she saw the angel, he is able to open our eyes too, so that we may see the mystery of God.

Blessed he says are the poor. Not all the poor are blessed; for poverty is a thing indifferent. The poor can be both good and bad, unless perhaps that poor man is to be understood as blessed whom the prophet described, saying that better is a righteous poor man than a lying rich man. Blessed is the poor man who cried, and the Lord heard him, poor in crime, poor in vices, the poor man in whom the prince of the world found nothing, the poor man who imitates that poor man who, though he was rich, became poor for our sake. Hence Matthew disclosed it fully, saying: Blessed are the poor in spirit; for the poor in spirit is not puffed up, is not lifted up by the mind of his flesh.

This, then, is the first blessing, when I have laid aside all sin and put off all malice and am content with simplicity, destitute of evils. It remains that I temper my character. For what does it profit me to lack worldly things unless I am meek and gentle? For he who follows the right way — he surely follows him who said: Learn of me, for I am meek and humble of heart. Lay aside, then, what is wicked, be in want of vices according to a good poverty, soften your disposition, so that you are not angry, or at least, if angry, do not sin, according to what is written: Be angry and do not sin. For it is a noble thing to temper an impulse by counsel, and it is held no lesser virtue to check anger and restrain indignation than not to be angry at all, since commonly that is reckoned the gentler, this the braver.

When you have done this, remember that you are a sinner, and mourn your sins, mourn your offences; and fittingly the third blessing is that of one who bewails his sins, because it is the Trinity which forgives sins. Wash yourself, then, with your tears, bathe yourself with weeping. If you weep for yourself, another will not weep for you; for if Saul had bewailed his sins, Samuel would not have bewailed him. Each one has his own dead to weep for. We are dead when we sin, when we are filled with dead men's bones. The evil word which comes out of the mouth is dead. For it comes out of an evil sepulchre; an open sepulchre indeed is their throat. Therefore the Apostle says: Be imitators of me. He wants us to remember our offences. Paul had nothing to mourn from the time when he believed in Christ, and yet he bewailed his former deeds, saying that I am not worthy to be called an apostle, because I persecuted the Church of God. He, then, was a sinner before faith, but we still sin after faith. Let him who is a sinner bewail himself and accuse himself, that he may become righteous; the righteous man indeed is the accuser of himself.

Let us follow out the order, then, because it is written: Set love in order in me. I have laid aside sin, I have tempered my character, I have bewailed my offences; I begin to hunger, and to hunger for righteousness; for a sick man, when he is in grave illness, does not hunger, because the pain of the sickness shuts out hunger. But what is this hunger for righteousness? What are those loaves for which the righteous man hungers? Are they perhaps those loaves of which it is said: I have been young and have grown old, and I have not seen the righteous forsaken, nor his seed seeking bread? He who hungers surely seeks an increase of strength. But what greater increase of virtue is there than the rule of righteousness?

After these, blessed he says are the merciful; for mercy follows righteousness. Hence it is said: He has scattered, he has given to the poor, his righteousness remains for ever. But even he who bestows mercy loses his reward unless he shows mercy with a pure heart; for if he seeks boasting, there is no fruit. Cleanse, then, the inner parts of your mind, and, if you have carefully cleansed the secret places of your breast, have compassion on those who are assailed, and understand how many men, how many of your brothers, seek your help.

But unless you first empty your inner parts of every stain of sin, so that dissensions and quarrels do not proceed from your disposition, you cannot bring medicine to others. Begin peace, then, from yourself, so that, when you are yourself a peacemaker, you may bring peace to others. For how can you cleanse the hearts of others unless you have first cleansed your own?

You have profited others, then, you have brought help to many: hasten. Press on to the end. Though there were many ways of departing from life, one befitted the Lord; for what had been born according to the flesh had also to die according to the flesh. He chose the Passion, to die for us; and do you say, concerning all that he has rendered to you: I will take the saving cup and call upon the name of the Lord, that is, the passion. Hence also to those who desired to sit at his right hand or his left he says: Can you drink the cup which I am about to drink? He leads you to the end, he accompanies you to martyrdom, and appoints the palm of the beatitudes.

See, then, the order. You must become poor in spirit; for humility of spirit is the riches of the virtues. Unless you are poor, you will not be able to be meek. He who is meek can mourn present things; he who mourns lower things can desire better things; he who seeks higher things avoids lower things, so that he too may be helped by those above; he who shows mercy cleanses his own heart. For what is it to cleanse the soul but to abolish the filth of death? Almsgiving indeed delivers from death, while patience belongs to perfect love. And he who suffers persecution, set in the final contest, is proved by adversities, so that, when he has striven lawfully, he may be crowned. Some hold these to be steps of the virtues, by which we may ascend from the lowest to the higher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Indeed, as there are increases of the virtues, so also are there increases of the rewards; for it is more to be a son of God than to possess the earth and to merit consolation. But since the first reward is the kingdom of heaven and the last reward is the kingdom of heaven, is the reward equal for beginners and for the perfect? Are we not perhaps taught in the mystical sense that the first kingdom of heaven is that of the Apostle: to be dissolved and to be with Christ? You have the first kingdom when the saints are caught up in the clouds to meet Christ in the air; many indeed of those who sleep shall rise, these to eternal life, those to reproach. The first kingdom of heaven, then, is set before the saints in the release from the body; the second kingdom of heaven is to be with Christ after the resurrection. When you are in the kingdom of heaven, then there is the advance through the mansions. Though the kingdom is one, yet there are diverse merits in the kingdom of heaven. After the resurrection you will begin to possess your earth, released from death. For he to whom it is said: Earth you are and into earth you shall go does not possess his own earth; for he cannot be a possessor who does not take the fruit. Released, then, through the Lord's cross, if only you are found within the yoke of the Lord, you will find consolation in the possession itself. Delight follows consolation, divine compassion follows delight. And him on whom the Lord has compassion he also calls. He who is called sees him who calls; he who has seen God is taken up into the right of divine generation. Then at last, as a son of God, he delights in the riches of the heavenly kingdom. The one, then, begins, the other is filled. For within this world too many are in the Roman Empire, but those who are nearer to the emperor obtain greater favour in the empire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
