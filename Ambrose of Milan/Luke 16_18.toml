[[commentary]]
quote='''
But we must first speak, I think, of the law of marriage, that we may afterwards discuss the forbidding of divorce. Some think that all marriage is sanctioned by God, because it is written, Whom God hath joined, let not man put asunder. (Matt. 19:6.) How then does the Apostle say, If the unbelieving depart, let him depart? (Mark 10:9, 1 Cor. 7:15.) Herein he shows that the marriage of all is not from God. For neither by God's approval are Christians joined with Gentiles. Do not then put away thy wife, lest thou deny God to be the Author of thy union. For if others, much more oughtest thou to bear with and correct the behaviour of thy wife. And if she is sent away pregnant with children, it is a hard thing to shut out the parent and keep the pledge; so as to add to the parents' disgrace the loss also of filial affection. Harder still if because of the mother thou drivest away the children also. Wouldest thou suffer in thy lifetime thy children to be under a step-father, or when the mother was alive to be under a step-mother? How dangerous to expose to error the tender age of a young wife. How wicked to desert in old age one, the flower of whose growth thou hast blighted. Suppose that being divorced she does not marry, this also ought to be displeasing to you, to whom though an adulterer, she keeps her troth. Suppose she marries, her necessity is thy crime, and that which thou supposest marriage, is adultery.
But to understand it morally. Having just before set forth that the kingdom of God is preached, and said that one tittle could not fall from the Law, He added, Whosoever putteth away his wife, &c. Christ is the husband; whomsoever then God has brought to His son, let not persecution sever, nor lust entice, nor philosophy spoil, nor heretics taint, nor Jew seduce. Adulterers are all such as desire to corrupt truth, faith, and wisdom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Everyone who puts away his wife and marries another commits adultery, and he who marries a woman put away by her husband commits adultery. I think we must first speak of the law of marriage, so that afterwards we may discuss the prohibition of divorce. For some think that every marriage is from God, chiefly because it is written: What God has joined, let man not separate. So if every marriage is from God, no marriage may be dissolved. And how did the Apostle say: But if the unbeliever departs, let him depart? In this he wonderfully both refused to let any ground for divorce rest with Christians and showed that not every marriage is from God; for Christian women are not joined to Gentiles by God's judgment, since the law forbids it.

But there meets us what Solomon says: Fathers divide house and substance among their sons, but a wife will be prepared for a man by God. He who reads it in Greek does not think it contrary. For the Greek well said ἁρμόζεται [is fitted together]; for 'armonia' [harmony] is the name given to the fitting and apt joining of all things put together. It is harmony when the pipes of an organ, joined in order, keep the grace of a regular melody, and the apt order of the strings preserves concord. So a marriage does not have its harmony when a Gentile woman is unlawfully joined to a Christian husband. Therefore, where there is marriage, there is harmony; where there is harmony, God joins; where there is no harmony, there is strife and dissension, which is not from God, because God is love.

Do not, then, put away your wife, lest you deny that God is the author of your union. For if you ought to bear with and amend the ways of others, much more those of your wife. Hear what the Lord said: He who puts away a woman makes her commit adultery. For she who may not change her marriage while her husband lives may be stolen upon by the desire to sin. So he who is the author of the error is also guilty of the fault, when she is put away, a mother with little children, when she is thrust out in her old age with tottering step. It is hard if you shut out the mother and keep the children, so that to the insult against love you add also an injury against dutiful affection; harder, if on the mother's account you drive out the children together with her, when the children ought rather to redeem the mother's fault in their father's sight. How dangerous, if you expose the fragile age of a young girl to error! How impious, if you desert the old age of one whose youth you deflowered! Shall an emperor, then, dismiss a veteran without glory, his service unhonored, and thrust him from his holding under the empire, and shall a farmer drive from his field the rustic worn out by his labor? Or is what is unlawful towards subjects lawful towards an equal?

You put away your wife, then, as if by right and without crime, and you think it is lawful for you because human law does not forbid it. But divine law forbids it; you who obey men, revere God. Hear the law of the Lord, which even those who make laws obey: What God has joined, let man not separate.

But here not only a heavenly precept is broken, but also a certain work of God. Will you endure, I ask, that your children should be under a stepfather while you live, or live under a stepmother while their mother is unharmed? Suppose the repudiated woman does not marry: ought she, too, to have displeased you as a husband, she who keeps faith with you, an adulterer? Suppose she marries: her necessity is your crime, and the marriage you think a marriage is adultery. For what difference does it make whether you commit adultery with open confession of the crime or under the guise of a husband, except that it is graver to have made a law of the crime than a theft?

But perhaps someone says: How did Moses command to give a bill of divorce and to put away a wife? He who says this is a Jew; he who says this is not a Christian. And therefore, since he objects what was objected to the Lord, let the Lord answer him: Because of the hardness he says of your heart Moses permitted you to give a bill of divorce and to put away wives; but from the beginning it was not so. Moses permitted, he says, God did not command; but from the beginning is the law of God. What is the law of God? A man shall leave father and mother and shall cling to his wife, and the two shall be in one flesh. So he who puts away his wife tears his own flesh, divides his body.

This passage shows that what was written because of human frailty was not written by God. Hence the Apostle too says: I charge he says not I, but the Lord, that a wife should not depart from her husband, and below: To the rest he says I say, not the Lord: if any brother has an unbelieving wife and he leaves her. So where the marriage is unequal, he added: But if the unbeliever departs, let him depart. At the same time the same Apostle denied that it belongs to the divine law that a marriage of whatever kind should be dissolved; he neither commanded it himself nor gave authority to the one who deserts, but took away the blame from the one deserted. So much in the moral sense.

Yet because above he set forth that the kingdom of God is preached, and when he had said of the law that not one tittle can fall, he added: Everyone who puts away his wife and marries another commits adultery. Rightly the Apostle admonishes us, saying that this sacrament is great, concerning Christ and the Church. You find, then, a marriage which no one would doubt to be joined by God, since he himself says: No one comes to me unless my Father, who sent me, has drawn him; for he alone could join this marriage. And therefore in the mystical sense Solomon said: A wife will be prepared for a man by God. The man is Christ, the wife is the Church: a wife in love, a virgin in integrity. So let persecution not separate him whom God has drawn to the Son, let luxury not turn him away, let philosophy not plunder him, let Mani not defile him, let the Arian not turn him away, let the Sabellian not taint him. God has joined, let the Jew not separate. All are adulterers who desire to adulterate the truth of faith and wisdom.

What is this he says bill of divorce of your mother, by which I put her away? You have heard of divorce: believe in the marriage. You have heard what the husband himself says to the people of the Jews: Behold, in your iniquities you have been sold, and for your sins I have put away your mother. Remain, then, in your father's house, remain with the bridegroom, strive to please your husband. O mind, you who have believed God, be a strong woman, such as she is, whether the soul that belongs to the Church or the Church herself, of whom Solomon says: Who will find a strong woman? More precious than precious stones is she who is such: her husband trusts in her. Let us see what she does for her husband, what her work is, what her service, why Christ trusts in her.

A good wife clothes her husband. Let our faith clothe Jesus with his body, let it clothe his flesh with the glory of his divinity, as she too made double garments for her husband, so that she might honor him both in the present age and in the age to come. No ordinary woman is this, whose weaving-room is such, whom her husband finds not plucking the soft threads of wool, but handling the weighed-out tasks of precious virtue; who lifts up her hands in the nights and directs her work by the balance, and weighs the weight of her own character, and knows also how to keep the measure of her deeds, weaving in the woof of glorious labor; anxious as to when her husband will return, troubled and sighing and already longing to be with her husband, saying: My husband delays to come, I myself will hasten to him; I will meet him face to face, when he begins to come into his glory.

Come, Lord Jesus, that you may find your bride, not defiled, not adulterated, one who has not violated your house nor neglected your commands. Let her say to you: I have found him whom my soul loved; let her bring you into the house of wine — for wine, indeed, gladdens the heart of man — let her be inebriated in the spirit, recognize the mystery, speak the oracle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
