[[commentary]]
quote='''
There follows: Deliver me from bloodshed, O God, God of my salvation. This can also be referred to the death of Uriah, in that, conscious of having ordered his killing, he begs pardon for so great a misdeed, and although as king he is free of the laws, he is nevertheless guilty before his own conscience. Desiring to untie himself from these bonds, he prays for divine help, that he may be cleansed from every stain of the crime he committed. And indeed, since the holy prophet, mild and gentle of heart, always gave outstanding marks of his gentleness and devotion, so that he often pardoned his adversaries and thought he must refrain from killing them, it is no wonder that he grieves so deeply that the sin of shedding innocent blood had crept upon him. Therefore he asked to be delivered from bloodshed, that is, from mortal sins.

He praised the Lord his God, he proclaimed the justice of the Lord, and therefore he added: My tongue will exult in your justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 16"
