[[commentary]]
quote='''
I read of two cups, one of death, the other of life. Christ emptied the cup of death in his own blood and served a new cup, so that we may say: I will take the cup of salvation, the cup of the new testament, which is poured out for the remission of sins. This cup is poured out and its dregs are not found, because it cleanses every sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
