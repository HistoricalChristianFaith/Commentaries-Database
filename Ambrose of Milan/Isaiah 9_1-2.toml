[[commentary]]
quote='''
Isaiah cries: he who is in distress shall not be confounded until the time. Drink this first. What is "drink this first"? Let us set aside the mystical sense and pursue the moral sense which the letter teaches. Because of their grievous errors he says that grievous crushings and vexations of the people will come, and these had to come first, so that mercy might follow. Drink first, then, tribulation; for through many tribulations we must enter the kingdom of God. Drink, that the sense of tribulation may be poured into the inmost parts of your breast; drink, with the disposition of a patient man, the pain of one who mourns; for when you have turned back and groaned, then you will reconcile the offended Lord to yourself. Drink this first, then, that you may be in pain and distress; gladness quickly pours in error. The people, grown fat and gross, rose up to play and departed from the Lord. It profits you to have a contrite heart; drink this first, that your sacrifice may be accepted by the Lord. Let the Apostle teach you what "drink this first" is, that is, the cup of tribulation; for tribulation works patience. There cannot be patience unless there has first been tribulation; tribulation, he says, works patience, and patience proof, and proof hope; and hope does not confound. First drink tribulation, so that afterwards the cups of so many virtues may be served to you. And that you may know that tribulation is drunk, you heard the prophet say today: you have made us drink the wine of compunction, and further on he says: and you will give them drink in tears by measure. He asks for drink by measure, not beyond measure, lest they be unable to bear it. In fact, with how good a disposition he prayed for this he proved by his own example, who mingled his drink with weeping, so as to incline the Lord's mercy towards himself.

Drink this first, then, that you may drink the second too — for this is the time for us to bring in the mystical sense —: drink first the Old Testament, that you may drink the New Testament too. Unless you have drunk the first, you will not be able to drink the second. Drink the first, that you may soothe your thirst; drink the second, that you may draw your fill of drinking. In the Old Testament there is compunction, in the New gladness. See how the Lord has met the arts of the devil on behalf of his little servants. The devil deceived one by the food of fraud, so as to ensnare all in the one; but Jesus redeemed all by the food of salvation, so as to restore in all that one too who had been deceived. The devil devised the golden cup of Babylon, so that whoever drank more might thirst more, and, because the drink could not please, he enticed them to drink by the value of the gold. He pledged them in his own wine, for which he sought the support of the metal; but the Lord Jesus poured water from the rock, and all drank. Those who drank in the type were satisfied; those who drank in the truth were made drunk. Good is the drunkenness that pours in gladness and does not bring confusion; good the drunkenness that steadies the gait of a sober mind; good the drunkenness that waters the gift of eternal life. Drink, then, this cup, of which the prophet said: and your inebriating cup, how excellent it is! And let it not move you that the cup of Babylon is golden, since you too drink the cup of wisdom, which is more precious than gold and silver. Drink, then, both cups, of the Old and of the New Testament, because in both you drink Christ. Drink Christ, because he is the vine; drink Christ, because he is the rock that gushed out water; drink Christ, because he is the fountain of life; drink Christ, because he is the river whose stream gladdens the city of God; drink Christ, because he is peace; drink Christ, because rivers of living water shall flow from his belly; drink Christ, that you may drink the blood by which you have been redeemed; drink Christ, that you may drink his words: his word is the Old Testament, his word is the New Testament. Divine Scripture is drunk and divine Scripture is devoured when the juice of the eternal Word descends into the veins of the mind and the powers of the soul; in fact, man does not live by bread alone, but by every word of God. Drink this word, but drink it in its order: first in the Old Testament; make haste, that you may drink it in the New Testament too. And as though he himself were hastening, he says: Galilee of the Gentiles and parts of Judaea, people who were walking in darkness, see a great light; you who dwell in the region of death, a light will shine upon you. Drink quickly, then, that a great light may shine upon you: a light not daily, not of the day, not of the sun, not of the moon, but that light which shuts out the shadow of death. For those who are in the shadow of death certainly cannot see the light of the sun or of the day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
