[[commentary]]
quote='''
Do you wish to know that Christ is a grain and that Christ was sown? Unless a grain of wheat falling into the earth dies, it remains alone; but if it has died, it will bring much fruit. So we have not erred, since we said what he himself had already said. And he is both a grain of wheat, because he strengthens the heart of man, and a grain of mustard, because he kindles the heart of man. And although both suit all things, yet he seems a grain of wheat when his resurrection is treated; for he is the bread of God who came down from heaven, because the Word of God and the example of the resurrection nourish minds, sharpen hope, strengthen affection; but a grain of mustard, because the discourse about the Lord's Passion is more bitter and sharper, more bitter for weeping, sharper for moving. And so, when we hear and read that the Lord fasted, the Lord thirsted, the Lord wept, the Lord was beaten, the Lord said at the time of the Passion: watch and pray, lest you enter into temptation, then, rebuked as by the juice of a more bitter word, we temper the sweetnesses of bodily pleasures that are sweeter than is right. So he who sows a grain of mustard sows the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
