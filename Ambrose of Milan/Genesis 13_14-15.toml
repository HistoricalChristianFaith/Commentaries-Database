[[commentary]]
quote='''
There follows a passage by which we are clearly taught how much the mind advances once the superfluous things of the irrational portion have been drained off, and how much evil vices joined to vices bring. For not idly has Scripture set down: and God said to Abraham, after Lot had departed from him: look with your eyes and see from the place in which you now are, to the south-west and the north and the east and the sea, for all the land, as much as you see, I will give it to you and to your seed for ever. From this, as from a spring, the Stoic philosophers drew the tenet of their doctrine that all things belong to the wise man. For east and west and north and south are portions of the universe; for by them the whole world is enclosed. When God promises that he will give these to Abraham, what else does he declare but that all things are at hand for the wise and faithful man, and that nothing is lacking to him? Hence Solomon too says in Proverbs: the whole world of riches belongs to him who is faithful. How much earlier was Solomon than Zeno, the master of the Stoics and the founder of that very sect! How much earlier than Plato himself, the father of philosophy, or Pythagoras, the inventor of its name! But who is faithful but the wise man? The fool, after all, is changed like the moon, but the wise man remains unmoved in faith.

But perhaps you will say: how does the whole world belong to the wise man? Because nature itself gives him a share in all things, even if he himself possesses nothing. For wisdom is the mistress and possessor of all things, since she considers the gifts of nature her own, because they were given for the use of men, and she is in need of nothing, even if what is necessary for sustenance is lacking to her. For just as a musician his instruments, or a physician his medicines, or a shipwright the things that are necessary for fitting out a ship, even if at some time he does not have them, still has them by the very fact that he is able to use them, even if for a time the use of them is not at hand: how much more does the wise man, who lives according to nature, judge whatever belongs to nature to be his own! For he does not lose his right who remembers that he was made in the image of God and that it was said to men by the Lord God: increase and multiply, and fill the earth and have dominion over it, and rule over the fishes of the sea and the birds of heaven and all the cattle and all the earth and all the creeping things that creep upon the earth and who knows that wisdom is the mother of all things and herself possesses the whole world. Finally Solomon, who asked for wisdom and received it from the Lord our God: he himself he says gave me true knowledge of the things that are, so that I might know the ordering of the world and the power of the elements, the beginning and the end and the middle of all things, and the divisions of the times and the courses of the year and the arrangements of the stars, the natures of living creatures and the rages of wild beasts, the force of the winds and the thoughts of men, the differences of plants and the powers of roots, and whatever things are hidden and unforeseen. But these things are at hand for no one but the perfect man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 7"
