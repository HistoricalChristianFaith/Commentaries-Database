[[commentary]]
quote='''
Not all can bury Christ. Indeed, although the religious women stand far off, yet, because they are religious, they carefully note the place, that they may bring ointments and pour them over him. Yet in their anxiety they both withdraw from the tomb later and return to the tomb earlier. Although steadfastness is lacking, diligence is not lacking.

Their sex wavers, their devotion is warm. Indeed at the time of the resurrection they are at hand, and when the men were put to flight, they alone are admonished by the angel not to fear. Earlier in zeal but later in confidence, they call Peter out. Indeed he comes without fear, and he who had come later steadfastly enters first, as one who had received the keys of the kingdom, to open to others.

The earthquake, moreover, is resurrection to the faithful, fear to the unskilled: to the one because the sluggish body stirs itself from the sleep of death, to the other because, troubled by the trembling of the body and earthly instability, they fall away from faith and belief in the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
