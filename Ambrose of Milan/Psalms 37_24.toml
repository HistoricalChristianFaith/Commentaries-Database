[[commentary]]
quote='''
Thus even the righteous man falls at times. But if he is righteous, when he falls he shall not be confounded. That he falls belongs to his condition; that he rises again, to righteousness, since God does not abandon the righteous man but confirms his hand. For what reason did he say not foot but hand, unless perhaps for this, that he who falls does not slip more by the foot, but the weak man is often deceived by a slippery place or stumbles against a rock? Here, however, understand the fall of the righteous man, that is, of the stronger. Thus, among the common people who wrestle, if one has put down a knee or has slipped with his foot, he is held as beaten. The athlete who has skill in wrestling and wrestles for the crown even puts down his knee on purpose, so that he may conquer; and if he has slipped he is not shut out, and if he is pressed down by one who is on top, yet supporting himself on his hands he contends lawfully, nor is the prize taken from him unless he has been thrown flat on his belly or stretched out in a lock of the arms. From this arise frequent contests, because the kinds of falls are many and unknown to most. For they properly call their falls ruin; for in Greek they are called πτώματα. Therefore, when he is gripped and pressed, he often rolls himself over, and he who was held to be underneath comes out on top, and as he rises throws down the one who was on top. This Scripture seems to signify when it says: You have turned over his whole bed in his weakness. And so it is said of him: "when the good athlete falls, he is not confounded". Very many, who trust in their art, even wish to be held, so that they may conquer the sooner. But even if he has been marked down, to use the very term, both the first time and the second, he is not shut out; he is allowed at times to renew the wrestling, and it often happens that he conquers and that he yields who had prevailed in the second bout. So, then, let the righteous man too, even if he has run into a stumbling-block and has fallen, nevertheless not abandon his zeal for devotion and faith; let him hold to sobriety, do penance, often renew himself. And therefore Peter asks: If my brother sins against me, how often shall I forgive him? Up to seven times? And the Lord answered: Not only seven times, but also seventy times seven. But that you may know that we are athletes, and are pushed, and some fall to ruin and very many are thrown down, hear him say: The Lord props up all who fall to ruin and sets upright all who have been thrown down. Hence David also says of himself, or he who spoke in the prophet: Pushed, I was overturned so that I should fall, and the Lord took me up; for Jesus did not fall, but was pushed. For since he himself turns back those who have been thrown down, how could he himself be thrown down? But Scripture testifies that the righteous man, when he has fallen, can rise again, when it says: Shall he who falls not add to rise again? Or does he who has turned away not return? Woe to those who turn away with a shameless turning away, says the Lord.

Would indeed that the athlete of Christ might be unable to be wrestled down and unconquerable, and glorious at every age and in every kind of virtue, as he says: But in all things we overcome because of him who loved us! What is "in all things"? There are athletes who are called boys, youths, men, that is, παῖδες, ἀγένειοι, ἄνδρες. Scripture too knows these ages among wrestlers, when David says: Do not turn away your face from your boy, and: I have been young and have grown old. Hence also John says: I write to you, boys, because you have known the Father. I write to you, young men, because you have overcome the evil one. I write to you, fathers, because you have known him who is from the beginning. And so, being older, writing to the brethren, he designates as mature those who are so by advance in faith and devotion. These, then, are ages of virtues, not of weakness; for the boy is not without virtue who has known the Father, the God of powers. From that boy come these boys, that boy who, before he knew how to call father or mother, received the power of Damascus and the spoils of Samaria. He himself is the boy who is born to us, a son is given to us, whose government is upon his shoulders. He himself taught us that boyhood is virtue, saying: Let them be, and do not forbid the children to come to me, and elsewhere: Amen, amen, I say to you, unless you are converted and become like this child, you shall not enter the kingdom of heaven. Even in strength of body itself boys very often overcome men. And certainly, if we consider the age of boyhood, a boy cannot either know all the practice or undergo the force of wrestling; yet we know that boys have frequently overcome those whom they could not carry; so far does vigour of mind shut out the weakness of age.

And as the boys are, so too are the youths, that is, spiritual. Scripture knows Paul as a young man already close to his conversion; it knows also Eutychus, a young man, who, while he clung intently to the discourses of Paul, overcome by sleep, fell from the third storey and rose again; it knows John too, a young man, reclining on Christ's breast, who was so strong that he did not fear persecution and overcame the evil one. This is the boy who left his natural father and followed that Father whom he knew to be eternal; as a young man, wrapped in a linen cloth, he followed the Lord at the time of the Passion, he who had left all his own things; when older, he knew that God the Word had always been and is in the very beginning, and he proved that he abides in himself.

Scripture has taught us of spiritual men too, when the prophet Agabus says: The man whose girdle this is, so shall the Jews bind in Jerusalem, and Festus says: There is a certain man left in custody by Felix. Before his passion Paul is called a young man; in his passion he is signified as a man, being already, his course finished, close to the crown.

We have come to know the ages contending for faith and devotion. Let us come to know also the kinds of the several contests. Let the tenor of Scripture teach us these too. In this worldly contest, then, there are some who wrestle in a certain simple and regular manner and contend only by holds of the body, and do not know how to strike: these are called wrestlers; others who mingle blows and the flinging of dust with the efforts of their limbs, every right of striking being permitted to them: these they call pammacharii, because they have against each other the licence of every kind of strife and fight; others who contend against each other with the gauntlets and are tormented with torn heads: these are called boxers.

All these contests the apostle Paul underwent, as he himself shows. And so elsewhere he says: For we have no πάλη against flesh and blood, but against princes and powers and — to be brief — against the spiritual wickednesses. In most Latin copies "wrestling-together" is found; in all the Greek, πάλη is written; for the πάλη of the Greeks is the wrestling of the Latins. And truly it is πάλη, because flesh and blood and the spiritual wickednesses are overcome by patience and continence of the body and by moderation of the mind. Anger, fury, slaughter are the arms of the devil. Elsewhere too he signifies that he was beaten with stripes above measure, saying: In stripes above measure, in deaths often, and that at Jerusalem he was struck with fists. There, when the Jews had at some point stopped striking Paul because the soldiers intervened, the high priest Ananias himself ordered those standing by to strike his mouth. To him the Apostle answered: God shall begin to strike you, you whitewashed wall; and do you sit judging me according to the law, and contrary to the law order me to be struck? He certainly knew how to strike back, who struck back the high priest with a heavier fist; for he himself was struck bodily, while he gave him back the word that he would be struck in the soul by Christ. In the first epistle to the Corinthians too he writes: I therefore so run, not as at an uncertainty; so I strive, not as beating the air. What in Latin he said "I strive", in Greek he says πυκτεύω. And truly, like a good boxer, he beat not the air, but the powers of the air and the heads of the Jews, because they did not have as their head the Lord Jesus, the head of all. And so in every contest the Apostle was proved, who also received the crown when his course was finished. Hence he himself also says: I can do all things in him who strengthens me.

Christ has also those who in their boyhood have overcome men mature in age, as Daniel, a boy, with strong spirit refuted those elders of the Jews and by the right of victory cast them down to death. He has others also who wrestled in their mother's womb before they were born. Thus Jacob supplanted his brother Esau and overcame the evil one, and so came out of his mother's womb as to show the token of victory and, as victor, to overturn the foot of the degenerate elder. Jeremiah was sanctified and proved in his mother's womb. John the Baptist, not yet born, knew that the president of the human contest and the rewarder of the wrestlers had come, and by leaping in his mother's womb earned the prize of a devout confession. Rightly was he already then designated for the crown, who before all had offered his name for the contest of Christ as a witness of faith and a herald of virtue. A good herald, who roused others to the contest, and truly a good herald, who cried out with so great a voice that at its sound the secrets of heaven resounded. Why say more? He moved the earth, he filled heaven. And therefore he received the name of voice, because a sacred voice went before the Word of God, as he himself taught us, saying: I am the voice of one crying in the desert. The prophet Isaiah said this; John confirmed that it had been said of himself. We have heard what the herald said: Prepare the way of the Lord, make his paths straight. This is the singular voice, and alone so resonant that it was heard by all, so sweet that it soothed the hearts of all. The Lord, then, confirmed his righteous athletes so that they might conquer; for he never deserts and abandons his own.
'''
