[[commentary]]
quote='''
It is well said that there appeared an angel to Zacharias, who suddenly beheld him; and this is the expression especially used by Divine Scripture with respect to angels or God, that what cannot be seen beforehand may be said to appear. For things which are the objects of our senses are not seen as He is seen, Who is seen only as He will, and Whose nature is not to be seen.

It was not without good reason that the angel appeared in the temple, for the coming of the true High Priest was now announced, and the Heavenly Sacrifice was preparing at which angels were to minister. For one cannot doubt that an angel stands by where Christ is sacrificed. But he appeared at the right hand of the altar of incense, because he brought down the token of Divine mercy. For the Lord is on my right hand, so that I should not be moved. (Ps. 16:8.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And there appeared to him an angel standing on the right of the altar of incense. Not without reason is an angel seen in the temple, because the coming of the true priest was already being announced, and a heavenly sacrifice was being prepared, in which angels would minister. And well is he said to have appeared to him who caught sight of him suddenly; and divine Scripture is wont to keep this especially of angels or of God, that what cannot be foreseen is said to appear; for so you have: God appeared to Abraham at the oak of Mamre. For he who is not perceived beforehand but is seen with a sudden sight is said to appear. For sensible things are not seen in the same way as he in whose will it lies to be seen, and whose nature it is not to be seen, but whose will it is to be seen. For if he does not will, he is not seen; if he wills, he is seen. For God appeared to Abraham because he willed; to another, because he did not will, he did not appear. Stephen too, when he was being stoned by the people, saw heaven opened, and Jesus too was seen standing at the right hand of God, and he was not seen by the people. Isaiah saw the Lord Sabaoth, but another could not see him, because he appeared to whom he pleased.

And why do we speak of men, when even of the heavenly virtues and powers themselves we have read that no one has ever seen God? And he added what is beyond the heavenly powers: the only-begotten Son, who is in the bosom of the Father, he himself has declared. Either, then, it must be acknowledged, if no one has ever seen God the Father, that the Son was seen in the Old Testament, and let the heretics cease to give a beginning from the virgin to him who was seen before he was born of the virgin; or certainly it cannot be refuted that either the Father or the Son or certainly the Holy Spirit — if indeed there is a vision of the Holy Spirit — is seen in such a form as the will has chosen, not as nature has formed, since we have learned that the Spirit too was seen in a dove. And so no one has ever seen God, because no one has beheld that fullness of divinity which dwells in God, no one has grasped it with mind or eyes; for has seen is to be referred to both. Indeed when it is added: the only-begotten Son himself has declared, the seeing of minds rather than of eyes is made known; for a form is seen, but power is declared; the one is grasped by the eyes, the other by the mind.

But why speak of the Trinity? The seraph appeared when he willed, and Isaiah alone heard his voice. An angel appeared, and he is present now too, but he is not seen; for it is not in our power to see, but in his power to appear. Yet, though there is no power of seeing, there is the grace of meriting, so that we may be able to see. And so he who had the grace merited the opportunity; we do not merit the opportunity, because we do not have the grace of seeing God.

And what wonder if in the present world the Lord is not seen except when he wills? In the resurrection itself too it is not easy to see God, except for those who are pure in heart. And so: blessed are the pure in heart; for they shall see God. How many blessed ones he had already numbered, and yet he had not promised them the faculty of seeing God! If then those who are pure in heart shall see God, surely others shall not see him; for neither shall the unworthy see God, nor can he who has not wished to see God see God. Nor is God seen in a place, but with a pure heart; nor is God sought with bodily eyes, nor circumscribed by sight, nor held by touch, nor heard by address, nor perceived by his gait. And when he is thought absent he is seen, and when he is present he is not seen. Indeed not all the apostles were seeing Christ. And so he says: So long a time I am with you, and yet you have not known me! For he who has known what is the breadth and length and height and depth, and the love of Christ surpassing knowledge, has seen both Christ and the Father. For we no longer know Christ according to the flesh, but according to the Spirit; the Spirit indeed before our face is Christ the Lord, who in his mercy may deign to fill us unto all the fullness of God, so that he may be seen by us. For this reason, then, the angel appeared to Zechariah on the right of the altar of incense: because he appeared when he willed, and did not appear as long as he did not will.

And he appeared on the right of the altar of incense because he was bringing the token of divine mercy; the Lord indeed is at my right hand, that I may not be moved; and elsewhere: The Lord is your protection upon your right hand. And would that for us too, as we kindle the altars and bring the sacrifice, an angel may stand by, nay rather may offer himself to be seen! For you need not doubt that an angel stands by when Christ stands by, when Christ is sacrificed; for indeed Christ our pasch has been sacrificed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
