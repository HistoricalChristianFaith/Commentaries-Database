[[commentary]]
quote='''
The Lord gave utterance to these words in the book of Jeremias: ‘The turtle and the swallow and the sparrows of the field observed the time of their coming, but my people have not known the judgments of the Lord.’ Swallows know the time of their coming and of their return. These dutiful birds know how to announce the signs of spring by the testimony of their arrival.

Ants also keep watch for the coming of sunny weather. When they notice that their store of food remains soggy because of rain storms, a careful exploration is made of atmospheric conditions to determine when a series of warm days should arrive. Then they release the food supply, which is carried out of their hiding places to be dried by prolonged exposure to the sun. For that reason you will never experience stormy weather during that whole period of time, except when it should, in the interval, happen that the ants have changed their minds and decided to restore their supply of food to their granaries.

Sheep, at the approach of winter, browse on grass with an appetite that is insatiable. They have a presentiment of the coming of inclement weather. For this reason they proceed to fill themselves to satiety before vegetation dies from the effects of bitter frost.

Hedgehogs, commonly called iricei, on sensing the approach of danger, ‘gather themselves behind their shields’ so that anyone who has in mind to harm them may be wounded by their prickly armor. In anticipation of eventualities, these animals are provided with two organs of respiration. For example, then they sense the coming of northerly winds, they close the aperture open to the north. When they note that ‘the clouds have been cleared away by the south wind,’ they turn toward the north so as to avoid the harmful breezes coming from the opposite direction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
