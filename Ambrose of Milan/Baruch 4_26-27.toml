[[commentary]]
quote='''
Such, then, is the providence of the Lord that, wherever the fruit is of a softer quality, there the thickness of the leaf presents in defense of the fruit a stouter protective covering, as we see, for example, in the fruit of the fig tree. The more delicate fruits, therefore, need a stronger defense, as the Lord Himself teaches us, speaking through the mouth of Jeremias: ‘Like these good figs, so will I regard the captives of Juda, whom I have sent forth out of this place into the land of the Chaldeans for their good. And I will set my eyes upon them for their good.’ For He surrounded His precious ones, as it were, with a stouter covering of His mercy, lest the tender fruit should perish before its time. And so, too, He says of them in a later passage: ‘My delicate ones have walked rough ways.’ To these He speaks further on: ‘Be constant, my children, and cry to the Lord.’ Against all storms and injuries this is the sole and inviolable protection and impenetrable defense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
