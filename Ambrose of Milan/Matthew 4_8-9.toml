[[commentary]]
quote='''
(in Luc. c. iv. 11.) Ambition has its dangers at home; that it may govern, it is first others' slave; it bows in flattery that it may rule in honour; and while it would be exalted, it is made to stoop.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Lastly, the devil himself testifies that a man gives all he has for his soul, and confesses that the price of an entire patrimony is not worthy of the redemption of one soul. Why do we spare a patrimony which even the devil himself judges cheap for salvation? I have said too little in saying "for salvation"; he testifies that it is little even for error. Indeed, All these, he says, I will give you, if you fall down and worship me, and he showed not only the riches of the world but also honours and kingdoms. If it costs so much that the devil be worshipped, how much must a Christian offer, to be raised up with Christ? But let us dismiss the devil like the goat of sending-away into the desert; for he is not a faithful upholder of the truth, even if at times he transforms himself into an angel of light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
