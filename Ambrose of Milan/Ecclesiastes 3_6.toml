[[commentary]]
quote='''
The roots of trees too are first planted, that they may take root; when they have taken root, then they begin to grow, afterward to produce. But truly money at usury, scarcely planted, immediately produces. Seeds burst in their season, animals bring forth in their season, for there is a time to be born and a time to die, a time to plant and a time to pluck up that which is planted, a time to kill and a time to heal, and below: A time to get and a time to lose, a time to keep and a time to cast away, as Ecclesiastes says. Money at interest is sown today, tomorrow it bears fruit; it always brings forth and never perishes; it is always being planted; only with difficulty is it plucked up. The usurer wishes always to get, [never to lose,] never to keep, his money; always to cast out, never to heal, always to kill.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 13"
