[[commentary]]
quote='''
Hence it is also written of Jacob: He was dismayed in mind; for he did not believe them. He was dismayed with the feeling of the unbelieving people; but after he learned the deeds of Christ, soothed by such great benefits and works, he took heart again, saying: It is a great thing for me, if my son Joseph still lives. I will go and see him before I die. The first and greatest foundation of faith is to believe in the resurrection of Christ. For whoever believes that he was raised seeks him with haste, approaches him devoutly, and venerates God with his inmost mind; for he believes that he himself will not die, if he believes in the author of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
