[[commentary]]
quote='''
That too, their sprinkling his tunic with the blood of a kid, seems to signify that, assailing him with false testimonies, they brought into the odium of sin him who forgives the sins of all. For us he is a lamb, for them a kid. For us, from whom he took away the sins of the world, the Lamb of God was slain; for them he is a kid, for they are the ones whose errors he heaped up, whose offences he piled high. And so he says: Fill up the measure of your fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
