[[commentary]]
quote='''
Hence also we read of the Son of God that he did not know sin. And elsewhere you have: For he who keeps the commandment does not know a wicked word, since it is perfectly clear that what is meant is not the knowledge of wickedness but a criminal fellowship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 7"
