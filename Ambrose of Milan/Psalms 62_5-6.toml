[[commentary]]
quote='''
And therefore he says: But my soul is subject to God, since from him is my patience. For he himself is my God and my saviour, my upholder; I shall not depart. That is: has the burial denied to my body taken from me the mansion of perpetual rest? I have my dwelling in the tabernacle of the Lord, and I shall rest on his holy mountain. I shall not depart through human crime, because I have been upheld by the Lord's favour, because neither death nor sword nor tribulation will be able to separate me from the love of Christ. For it is not the innocent man but the sinner who departs from the tabernacles of the righteous. The heirs of Judas the traitor depart, of whom and of their like it is rightly said: Let his sons be shaken and removed, and let them beg; let them be cast out of their dwellings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
