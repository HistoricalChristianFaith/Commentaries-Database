[[commentary]]
quote='''
Hence not undeservedly did the sun rise for holy Jacob, upon whose race the saving cross of the Lord shone, and at the same time because the sun of justice rises for him who sees God, since he himself is the eternal light.

But Jacob limped on his thigh. For this reason the sons of Israel do not eat the sinew even to this day. Would that they had eaten and believed! But because they were not going to do the will of God, therefore they did not eat. There are also those who take it in this way: that Jacob limped on one thigh for this reason, because, of the two peoples springing from his line, the numbness of one with regard to the grace of faith was already then declared as soon to come. That, then, is the people which limped through the numbness of unbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 7"
