[[commentary]]
quote='''
And they prepared the gifts, until Joseph came in at midday. The faith of Paul hastened the midday. Before, he was blind; afterwards he began to see the light of justice, since whoever reveals his way to the Lord and hopes in him, the Lord too will bring forth his justice as the light and his judgment as the midday. And when God appeared to Abraham at the holm-oak of Mamre, it was midday, and eternal light shone on him from the presence of the Lord. It is midday when the true Joseph enters his house to dine. For the day shines more brightly then, when we celebrate the sacraments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"
