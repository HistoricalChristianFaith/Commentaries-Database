[[commentary]]
quote='''
But the good husbandman, and perhaps he in whom the foundation of the Church lies, foreseeing that another was to be sent to the Gentiles and he himself to those who are of the circumcision, devoutly intervenes that it be not cut down, trusting in his calling that the people of the Jews too can be saved through the Church, and so he says: let it alone this year also, until I dig around it and put in a basket of dung.

How quickly he recognized that the hardness and pride of the Jews were the causes of the barrenness! And so he who knows how to detect vices knows how to cultivate. He promises that the hard places of their heart must be dug with the apostolic mattocks, so that the twice-sharpened word may turn over the mind's crust, laid over it by long neglect, and, the heart being broken up, may rouse the sense, now thriving with the breath of the air, lest a heap of earth overwhelm and hide the root of wisdom. He says also that a basket of dung must be put in. Great indeed is the force of dung, so great that it makes fruitful things from unfruitful, green from withered, productive from barren. On it Job sat when he was tempted, and he could not be overcome; and Paul reckons things as dung, that he may gain Christ. Indeed, whereas Job had earlier lost very many things, after he sat on the dung he had nothing that the devil could take away from him. So the earth is good that is dug, good the dung that is put in. Indeed the Lord raises the needy from the earth and lifts up the poor from the dung.

And so, through the exercise of spiritual understanding and a disposition of humility, that good husbandman judges that the Jews too will be fruitful in the Gospel of Christ. For he remembered that the Lord spoke through Haggai, that on the twenty-fourth of the ninth month, from the day on which the temple of the Lord Almighty was founded, the vine he says and the figs and the pomegranates and the olive trees, which will not bear fruit, from this day I will bless. By this it is revealed that just at the setting of the declining year, that is, at the sunset of an age already growing old, the holy temple of God, which is the Church, was to be founded, by whose grace, through the sanctification of the washing, the peoples of the Jews and of the nations can have the fruit of their merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
