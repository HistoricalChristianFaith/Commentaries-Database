[[commentary]]
quote='''
Nor shall I pass you over, Eleazar, being a priest as you were a priest; rather I must be helped by your prayers, you who, a priest by descent, skilled in the Law, ripe in years, when you were brought before Antiochus the persecutor, could neither be caught by temptations nor bent by rewards nor broken by the bitterness of tortures. Indeed, he began with blandishments, because he judged that his torments could be overcome. 'I feel shame' he said 'before your grey hair, I revere your old age, I admire your prudence: why do you think you must abstain from good food which nature bestows? Relax this kind of obstinacy, wake up at last, while I still prefer to persuade you rather than to wring it from you, lest, overcome by tortures, you do what you refuse when invited by reason.' To this the old man answered: 'We, Antiochus, are not led by obstinacy, but are held by reverence for the Law, which has commanded that we abstain from swine's flesh. You judge it a most beautiful creature; yet you cannot deny that temperance is better than pleasure, obedience to the Law better than transgression. But if you think it a light thing that we should eat swine's flesh, how will he who has despised the Law in the least things keep it in great ones? Or if a creature of this kind is precious, you are avenged when we are cheated of what is most beautiful. Our abstinence, moreover, is a discipline of chastity. For we learn to cut back luxury, to conquer desires, to shut out concupiscence, to resist the pleasures of the body. It is also an exercise of fortitude not to yield to punishments for the Law's sake, and a mark of justice too, and of prudence, that what we have chosen to follow in the fear of God we should keep even when death is set before us. Who would dictate food to free men? And who would offer himself to be laughed at, so as to be a slave in this? But you will not laugh. I am not so old that the fortitude of my soul does not grow young in me.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 10"
