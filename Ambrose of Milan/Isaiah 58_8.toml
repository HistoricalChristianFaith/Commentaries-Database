[[commentary]]
quote='''
Adam had been covered by a cloak of virtues before he transgressed. But uncovered, as it were, by his transgression, he saw that he was naked, because the garment which he had he had lost. For in the days of your fastings, Shall thy morning light arise, He says, and thy health shall speedily arise, and thy justice shall go before thee, and the majesty of the Lord shall surround thee. A good garment is light. For it is written: Surrounded with light as with a garment. A good garment it is when the Lord clothes and covers those fasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
