[[commentary]]
quote='''
My beloved, she says, has gone down into his garden, to the bed of spice, to pasture in the gardens and to gather lilies. She recognizes where she is to seek the Word: she knows that he lingers among the prayers of the saints and that he cleaves to them, and she understands that he pastures his Church, or the souls of his just ones, among the lilies. This mystery he showed you in the Gospel, when on the sabbath he led his disciples through the sown fields. Moses led the people of the Jews through the desert; Christ leads through the sown fields, Christ leads through the lilies; for through his passion the desert blossoms like the lily. Let us follow, then, so that on the day of that great sabbath, in which there is great rest, we may gather fruits. And do not fear that the Pharisees may accuse those who gather in the sown fields: even if they accuse, Christ excuses, and he makes the souls that he wills, those that follow him, like that David who, above the Law, ate the bread of proposition, conceiving even then in his mind the prophetic sacraments of the new grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
