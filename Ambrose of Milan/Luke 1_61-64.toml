[[commentary]]
quote='''
And it is well added that no one in her kindred was called by this name, so that you may understand that the name belonged not to the family but to the prophet. Zechariah too is asked by a nod; but because unbelief had taken from him speech and hearing, what he could not say with his voice he spoke with his hand and with letters; for he wrote indeed saying: John is his name; and here the name is not given but confirmed; and deservedly at once his tongue was loosed, because faith loosed what unbelief had bound. Let us too, then, believe, that we may speak, that our tongue, which is bound by the chains of unbelief, may be loosed by the voice of reason. Let us write mysteries in the spirit, if we wish to speak; let us write the forerunner of Christ not on tablets of stone, but on the fleshly tablets of the heart. For he who speaks John prophesies Christ. Let us speak John, let us speak Christ too, so that our mouth also may be opened, which, in so great a priest, the reins of a wavering faith held in, as though it were an irrational beast's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
