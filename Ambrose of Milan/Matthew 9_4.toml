[[commentary]]
quote='''
Christ's judgement is another thing, where the conscience betrays itself, which cannot lie hidden from the judge of hidden things, where thoughts shine before him who used to say to men while they were still thinking: why do you think evil things in your hearts? When he said it to the Jews, he said it to all, so that no one should think that what he did could be hidden, so that no one should think that, shut in by walls, he could escape the witness of his hidden error. And therefore the Evangelist too testifies, saying: but Jesus knew their thoughts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
