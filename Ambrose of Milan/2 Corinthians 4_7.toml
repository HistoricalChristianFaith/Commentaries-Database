[[commentary]]
quote='''
Place before your eyes the pomp of this world; you see the brilliant allurement, but the empty beauty. Let not golden and silver vessels deceive you: And we have a treasure in earthen vessels. The Apostolic vessel is earthen, but in it is the treasure of Christ. Woe to them that follow after strong drink early in the morning! Golden is this vessel, is this cup; in this cup is the poison of death, the poison of passion, the poison of drunkenness. He who drinks this is shaken and falls. He is shaken not only in body but also in his troubled heart; for to be shaken belongs to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 15"
