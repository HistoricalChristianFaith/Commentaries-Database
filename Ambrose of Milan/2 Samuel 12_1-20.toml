[[commentary]]
quote='''
But now let us pass on to the messenger. For in what went before our treatise was about that odious adultery and murder of David the prophet, and, having gone through the mysteries, we found not only nothing that should be condemned but even something that should be praised. Now the treatise begins to be about the messenger, whom the title of the psalm that has been gone through, already often repeated, shows. For it runs thus: A psalm of David, of understanding, when Nathan the prophet had come to him, when he had gone in to Bathsheba.

And so this part of the history too must be unfolded again; it is of this kind. "A rich man," he says, "and a poor man were within one city. The rich man had many herds, many sheep; the poor man had one sheep, which was fed on the poor man's bread and wine and rested in his bosom. A guest came to the rich man; the rich man took nothing from his herd or from his flocks, but killed the poor man's one sheep. When David learned this, 'That man shall die,' he said, 'and shall restore fourfold.' Nathan answered him: 'You are he.' Then he disclosed to him the heavenly command, saying that the Lord had sent word that he had conferred many good things upon him, that is, royal wealth, when he had been taken from the number of the shepherds, and that he had poured out his mercy upon him, and that therefore, since he had provoked the Lord by sin, all his possessions were to be carried off, to be seized by the enemy, and his house laid waste. Then he said: 'I have sinned'; and Nathan answered: 'Since you confess that you have sinned, the Lord will remit your sin, but your son who was born of Bathsheba shall die.' While this son was sick, David wept, lay on the ground, covered himself with sackcloth, fasted. When he learned that he was dead, he rose, washed, dined, comforted others."

See how many things there are here. First of all, that God is loving and merciful, and that the adversities which befall us we receive as the price of our error. We have learned, then, that captivity is the price of sin; for this penalty is decreed for crime. Next we notice this, that the fall of kings is the penalty of peoples. For as we are preserved by their virtue, so too we are endangered by their error. Hence we must pray that we may be able to have a glorious and perfect king. Do we, then, who wish to have a perfect king, not wish to have a perfect Lord? Or can those really wish a man to be perfect who do not wish God to be perfect? The text of the history also briefly brings about this, that we notice how quickly the hope of pardon followed. And it is no small thing that it was Nathan who denounced it to him, that is, a lesser prophet; for it is a grievous shame and disgrace to have one's offence reproved by an inferior. You see that guilt diminishes grace. Nathan knew what David did not know: so much does the mind grow dark when it is overshadowed by a certain cloud of vices. Then, this is the Nathan who in what went before had prophesied that David was acceptable to the Lord, so that he might grieve that his sin was convicted by the same witness by whose prophecy his merit had been proclaimed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 11"
