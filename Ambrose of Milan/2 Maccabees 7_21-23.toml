[[commentary]]
quote='''
But the devout mother admonished her son, saying to this one as to the rest: 'I do not know how you came into my womb; neither did I give you breath nor form your limbs, but these are the gifts of almighty God'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
