[[commentary]]
quote='''
For thus it is written: But I, when they were troublesome to me in anything, clothed myself with sackcloth and humbled my soul with fasting, and my prayer shall be turned back into my bosom. What is "in anything"? Because it is then above all that either an unseasonable word slips out or the affection is stirred, when we are in some grief or sadness, or the mind grows sick with indignation, or is hampered by some anxieties, or is taken up with disputes. Who, then, are troublesome? Understand it first of the author of sin himself and his angels, then of those who prefer to be his followers rather than Christ's. A wife is driven on, like holy Job's; a friend, as is made plain in that same book; a son, like Absalom; a slave, a freedman and a member of the household, because a man's enemies are even those of his own household, so that one by one they harass him. What remedy, then, against such sicknesses of minds but patience, but silence? And, what is more grievous, he provokes you more who has enjoyed your benefits, and among them he exasperates you more who owes you more, so that you are the more moved by the bitterness of an ungrateful man or by the indignity of some worthless person.

Therefore the righteous man, even if his friend is insolent to him, grieves for his friend, because his friend is slipping so, because he is driven on by the tempter. If he grieves for a friend, much more for a wife, for a son, if he finds them too insolent to him; and if a brother harasses him, as Esau did holy Jacob, he grieves and seeks to reconcile his brother to himself or to flee from his face, as Rebekah urged, lest his brother's wrath should find some occasion of doing harm; and if a neighbour or a member of the household does so, he grieves; and if an attendant or a freedman or a slave, he bears it patiently, and in all these things he keeps silent, so as not to answer the one by whom he sees the man driven on. Someone of the household reviles him, then: he grieves and is silent; a freedman reviles him: he is silent; a slave reviles him: he is silent. Thus is he overcome who spreads a snare for his soul with the bait of the voice. Be silent, then, you too, when an unworthy man reviles you; be silent when a slave, and above all your own, insults you, and say in your heart: I am silent, but you, do not be silent, O Lord, and add: do not depart from me, as the prophet David said, that is: do not leave me alone to those who attack me; for he is not alone to whom God is present. Take the testimony: Behold, he says, the hour comes that you will be scattered each to his own and will leave me alone; but I am not alone, because the Father is with me.

The righteous man, then, is silent before those who are insolent to him; the righteous man prays. Hear the righteous man praying: Instead of loving me they disparaged me, but I prayed. The righteous man blesses those who curse him, as the apostles did, as Paul affirms, saying: We are cursed and we bless. The righteous man loves his enemies. See how he is taught to ascend little by little, step by step, to the increase of the virtues, as the Lord says: Love your enemies. The righteous man prays for those who slander him, because the Lord commanded this too, adding: Do good to those who hate you, pray for those who slander and persecute you. He is righteous in every respect who keeps and observes these things: first, because he is silent and does not answer his enemies; next, because he prays, that is, he is not idle in his affection. And he who prays prays for good things, not for whatever might harm his enemy. It is more, then, to pray than to be silent. The righteous man blesses those who curse him. This is more than praying for himself; for, secure about himself, he blesses one whom he does not fear, or even one whom he feared before. The righteous man loves his enemy. It is more to love than to bless, because the love of the mind is greater than the graciousness of speech. The righteous man does good to him by whose hatred he has been attacked; the righteous man prays for those who slander him. Good is love and good is loving-kindness; both are of God and both are God, because love is God, as John said in his epistle. Therefore both are joined: Love your enemies and pray for those who slander and persecute you. Love is the fullness of the Law, but this too is the fullness of the Gospel, to pray for those who slander and persecute us, so that we ask pardon for their sins, just as holy Job was chosen by divine judgement, so that his prayer might abolish the offence of those kings who slandered the righteous man.

Therefore, if you are weak, pray, and if you are strong, pray; weak, you pray for yourself; strong, you pray for your enemy. Prayer is a good shield for weakness; you pray and the Lord protects you. It is a good shield also for one who triumphs, so that you defend your enemy whom you could strike, lest he be slain by someone and, what is greater, by Christ, who said: Vengeance is mine, I will repay. This is the prayer that is turned back into the bosom of him who prays, bringing back the fruit of the things he wished to obtain, so that the gifts he asked of the Lord return into his soul and mind, as this same prophet taught you later on, saying: So will I bless you in my life, and in your name I will lift up my hands. Let my soul be filled as with fat and fatness. The bosom of the soul is the secret place of its prayer, the inner chambers of the will, and certain innermost receptacles of the vows that return. Hence too the righteous are read to rest in Abraham's bosom, because those who have put on a faith conformed to his and have made their will the same as his in good works rest in his grace, in his rest, in his calm.

But perhaps someone may wonder, since the Lord said through the mouth of David that he humbled his soul with fasting, how David himself says later on: If I was not humbly minded, but exalted my soul. But let him consider that one thing refers to the wisdom of the mind, another to the humility of the heart. The wisdom of the mind is lofty, but the wisdom of the flesh ought not to be puffed up. He humbled his soul, then, with fasting, to teach that the swelling of our flesh must be chastised; the prophet exalted his soul through the sublime grace of God, since also he who exalts himself shall be humbled and he who humbles himself shall be exalted. And not only is the proud man beaten down and the humble man raised up by the due reward of merits, as must be understood first; but because the word of God is sharp on every side, like a sword which is sharp on three sides, I think it can be understood that both he who exalts himself knows how to humble himself, and he who knows how to humble himself knows also how to exalt himself. Indeed Paul shows it, saying: But I have learned to be sufficient in whatever state I am. I know both how to be humbled, I know also how to abound. So David too, by not thinking humbly of Christ, exalted his soul, which the Arians humble and cast down, and by exalting his soul through the vigour of his understanding and the grace of faith he represented the virtue of humility with devout affection.
'''
