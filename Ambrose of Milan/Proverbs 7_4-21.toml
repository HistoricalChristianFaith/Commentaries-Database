[[commentary]]
quote='''
In every way, then, the encounter with a woman's wantonness must be avoided. And therefore Acquire prudence as a disciple for yourself he says, that she may guard you from a strange wife and a harlot, lest she hold you bound in the snares of her lips and wrap you in the little curls of error. Therefore the prophet has taught you from where you ought to beware of the prostitute: that you beware of her entrances by the window. For she enters by the window of her house; her window is the eye, and therefore beware of the eyes of every shameless woman, lest love come in through the window and lust penetrate. For indeed the harlot entices the lover by sight, and unless you restrain the wanton gaze of mind and spirit, death enters through the window. Not sluggish is the impudence of the prostitute, not idle her wantonness, which makes the hearts of young men fly, so that they cannot keep the constancy of their own mind and are swept hither and thither by burning love. Beware, then, of a woman of this kind, who does not rest on her feet, wanders out of doors, lies in wait at the corners, binds with her eyes, entices with words, has woven her bed with ribbons and with coverlets spread from Egypt. For she takes her adornment not from divine knowledge but from worldly allurement, she who rightly says that her husband is absent, since no adulteress can have Christ present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
