[[commentary]]
quote='''
Zebulun shall dwell by the sea, and he beside the approaches of the ships, and he will stretch as far as Sidon. The very interpretation of the name promises better things, because the Latin rendering signifies deliverance from the things of night, which is surely a good thing and belongs to him who hopes under the wings of the Lord, whom his truth encompasses, so that he may not be afraid of the terror of the night and of the business that walks about in darkness.

Here, then, Zebulun, he says, shall dwell by the sea, so that he may see the shipwrecks of others while himself free from danger, and may look upon others tossing in the straits of this world, carried about by every wind of doctrine, while he himself remains immovable by the root of faith, just as holy Church, rooted and grounded in faith, looks upon the storms of the heretics and the shipwrecks of the Jews, since they denied the helmsman they had had. So she dwells near the waves, but is not moved by the waves, and is ready to give help rather than exposed to danger, so that if any, driven by heavy storms, wish to flee to the harbour, the Church may be at hand as a harbour of salvation, to call those in peril with outstretched arms into the bosom of her tranquillity, showing them a place of safe anchorage. The churches, then, in this world, like seaports spread along the shores, come to meet those in distress, saying that a refuge has been prepared for believers, where ships shaken by the winds may be brought in.

In these churches are the princes of Zebulun and the princes of Naphtali, as Psalm 67 (68) teaches, of whom some are deliverers from the night-storm, crying: Let us therefore cast off the works of darkness and put on the armour of light, while others are of apostolic breadth, who can say: Our mouth is open to you, O Corinthians, our heart is enlarged. These are they who, when they were in darkness, saw a great light, as the prophet testifies, saying: The land of Zebulun and the land of Naphtali, the way of the sea beyond the Jordan. The people that sat in darkness have seen a great light. Those who sat in the region of the shadow of death, for them a light has risen.

So the Lord our God set the heirs of this patriarch as watchmen beside the approaches of the ships, and his watchful care and spiritual succession stretches as far as Sidon, that is, reaches to the Gentiles, so that the Lord's mercy may lighten the sins of the nations. For Sidon is the firstborn son of Ham, of him, namely, who for his irreverence against filial piety toward his father was condemned by his father's curse. So the deliverance from the night, set as it were on the watch of a spiritual bulwark, so that no one may run upon the rocks of this life, stretches even to sinners of the gravest crimes; and the Sidonians themselves, who formerly, because of their violent superstition, were called hunters of crimes, as the interpretation teaches, it absolved, dissolving the inheritance of the curse and bestowing the inheritance of the blessing, so that where the guilt was greater, there grace may now be more abundant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 5"
