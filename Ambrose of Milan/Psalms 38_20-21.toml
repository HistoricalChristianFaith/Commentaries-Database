[[commentary]]
quote='''
We have completed the psalm, together with the interpretation of a verse which the Greeks have, and some Latin codices, but not all. For before the next response there is the verse: and they cast me away like a dead man abhorred, that is, those who repaid me evil for good. But you, do not forsake me, Lord, do not depart from me — for this follows —, that is: do not you forsake me, you who are accustomed to cure a stinking dead man. Indeed we have this in the Gospel: For when he had come to the tomb of Lazarus and had said: Take away the stone, Martha said: He already stinks, for he has been four days. He answered her: Did I not tell you that if you believe you will see the glory of God? And he called Lazarus, and he came out whole. Let us too, then, believe, so that from our wounds we may acquire for ourselves the medicine of salvation and the glory to come.

In prayers, then, and supplications, with grief and tears, penitence must be carried out, so that we may deserve to see that glory of God. Nor let it trouble you that mourning, grief, maceration of the body are most grievous sufferings; even if they seem most grievous, yet such sufferings are not worthy of the glory that is to come, as the Apostle Paul is witness. Let it not irk us, then, to bear lighter things here, so that there we may obtain things full of praise and glory, carrying off perpetual rewards for temporal labours through the Lord Jesus, to whom be praise, honour, glory, perpetuity, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
