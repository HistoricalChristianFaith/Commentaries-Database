[[commentary]]
quote='''
Noe had been uncovered when he was drunk: the filial devotion of his sons covered him. But he had been uncovered through ignorance, not through intemperance; for up to this time wine was not known. In the beginning of the human race drunkenness was unknown. He himself first planted a vineyard; he gave it its nature, he was ignorant of its power. And so wine did not spare even its author. What wonder if, since the Lord Himself has praised His creatures, he also marvelled at them? Hence the pleasantness of the newly found gift delighted him, too strong a creature assailed the unaccustomed limbs of the old man, the new drink confused him. They have all slumbered he says, who mounted on horseback. He mounted the pleasures of the body: and, though a just man, fell asleep. But his drunkenness persuades us to sobriety. For Noe became drunk only once; when he recognised the evil of drunkenness, he tempered his discovery to a remedy, he did not let it go to a vice. Wherefore the Apostle says: Use a little wine for thy frequent infirmities.

Unimpaired liberty was the possession of everyone before wine was discovered; no one knew how to exact the obedience of servitude from his consort in nature. There would be no servitude to-day if there had been no drunkenness. Envy of brotherly preference indeed had already crept in, yet up to this time reverent devotion to parents was maintained. Injured was this devotion when drunkenness was laughed at. And so not alone to those whom they assail do wines do harm, but even more to those before whose eyes the drunken limbs of the intoxicated are uncovered. From this arises irreverent laughter, from this is lust inflamed, so that with a much greater intoxication do wines trouble those whose eyes and mind they make drunk than those whose bodies they prostrate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 5"
