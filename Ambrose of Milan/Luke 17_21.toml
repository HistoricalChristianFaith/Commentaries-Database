[[commentary]]
quote='''
This, then, is what he says: go out in the heels of the flocks and pasture your kids in the tents of the shepherds, because by the flocks we understand a kingdom, since it belongs to power to preside over flocks. And each one presides over himself with a certain royal power, if he restrains in himself the luxuries of the body and brings his flesh into subjection. And therefore it was said: the kingdom of God is within you. Hence he fittingly says to the soul: go out, that is, go out from slavery, go out from the rule and dominion of the flesh, and go out not in the flesh but in the spirit, go out to the governing of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
