[[commentary]]
quote='''
The adulteress hurled a third dart by the persistence of her soliciting, but Joseph did not listen to her. You have here what to beware of after the first words. Lust is not only slippery but also bold, importunate, wanton, and the adulteress has nothing she stands in awe of. She who did not grieve at the first losses of modesty lies in wait to capture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
