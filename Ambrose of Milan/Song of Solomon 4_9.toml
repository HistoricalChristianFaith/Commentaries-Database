[[commentary]]
quote='''
You have wounded my heart, my sister, bride, you have wounded my heart with one of your eyes, and with one hair of your neck. For these eyes are the eyes of the mind, namely of the inner man, not these eyes which perform the service of sight. For there is an eye both of the mind and of the flesh; but that eye is blind which does not see the things that are divine, which is vainly puffed up by the mind of the flesh. There is also another eye, the sense of Christ, by which the Church sees Christ, as he himself says to the Bride: You have captured our heart with one of your eyes. Rightly is Christ seen with one eye, because he is not seen with the carnal eye; or because the Church, having two eyes, the moral and the mystical, sees Christ more with the eye of faith; for the mystical eye is keener, the moral sweeter.

And perhaps these are the eyes with which Paul saw eternal things, when he began not to see temporal things. Indeed, he who did not see Christ before he lost his eyes saw him after he had lost the sight of his eyes; for he saw, who said: Who are you, Lord (Acts 9:5)? He certainly saw Christ, whom he even confessed as Lord. And below: Lord, he says, what do you wish me to do? Did he not, then, see him whose command he was awaiting? With what eyes, then, did Paul begin to see more, if not with those which he himself showed us, saying: I will pray with the spirit, I will pray also with the mind (1 Cor. 14:15)? Indeed, that you may know that he saw by praying: It came to pass, he says, when I returned to Jerusalem, while I was praying in the temple, I was seized with fear; I saw him saying to me: Hasten, go out quickly from Jerusalem; for they will not receive your testimony about me (Acts 22:17 and 18).

These eyes, then, fail for the word of God, and say: When will you comfort me? With these eyes the prophets were called seers, because through revelation they discerned with the mind the things that were hidden. But because the eye of the mind and the eye of the flesh are one eye, and a man is sustained by consolation only when flesh and mind do not desire different things but desire one thing and seek one thing, therefore they are intent on him who said: I and the Father are one (John 10:30). These eyes also confess that they are one, because they are engaged in one and the same desire and office.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
