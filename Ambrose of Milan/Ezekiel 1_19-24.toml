[[commentary]]
quote='''
And Ezekiel says that the heavens were opened to him, and that among other things he saw also one wheel upon the earth joined to the four living creatures. And below: I heard he says the voice of their wings, like the voice of many waters and like the voice of the Sufficient One, and when they went, like the voice of a word, like the voice of a camp.

From this some have drawn it off into the books of philosophy, on the ground that heaven itself is like a winged thing. Indeed Plato said that heaven is a winged chariot, from what the prophet had said: When the living creatures went, the wheels joined to them went too, and when the living creatures lifted themselves from the earth, the wheels were lifted up. But the prophet did not call heaven itself a bird; he said that there are birds in heaven. So too David says: The heavens tell the glory of God, that is, the heavenly powers; or else, when the beautiful element is beheld, its maker is proclaimed. But the prophet is describing the soul, whose four motions are like horses, λογιστικὸν θυμικὸν ἐπιθυμητικὸν διορατικόν (rational, spirited, desiring, discerning). These are the four living creatures, that is, the man λογικόν, the lion θυμικόν, the calf ἐπιθυμητικόν, the eagle διορατικόν. Therefore reason has been placed first, so that the rest may follow reason. Therefore with the man, on the right, is the lion, that is: with reason, on the right, is the commotion. When these living creatures are lifted up, the wheels too are lifted up. And the wheels are the life upon earth by which we live. If the four motions of our soul are lifted up, our life too is lifted up. And so he added: For the spirit he says of life was in the wheels. It is rather the soul, then, that is the chariot, the soul which says in the Song of Songs: You made me the chariots of Aminadab, that is, of our God. So the prophetic description does not agree with the tradition of philosophy. Indeed the prophet says that he heard the voice of the wings. These wings are the virtues, which with the greatest and a double beating of prudence, fortitude, temperance and justice resound a sweet beauty, the song of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
