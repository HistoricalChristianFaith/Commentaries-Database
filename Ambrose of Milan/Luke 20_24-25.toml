[[commentary]]
quote='''
Whose image and inscription does it have? In this place the Lord teaches that we ought to be circumspect in answering against heretics or Jews. Elsewhere he said: be shrewd as serpents. Many take this place to mean that, since the cross of Christ was foretold when the serpent was lifted up, by which he would abolish the serpentine venom of spiritual wickedness, it appears that one ought to be shrewd in the way Christ is, simple in the way the Spirit is. See for yourself that serpent, which always guards its head and wards off the deadly wound. Asked by the Jews whether he had received authority from heaven, he replied: The baptism of John, whence is it, from heaven or from men? So that, since they did not dare to deny that it was from heaven, they would convict themselves of madness, denying as they did that its author was from heaven. Asked for the didrachma, he asks about the image; for the image of God is one thing, the image of the world another. Hence he too admonishes us: as we have borne the image of that earthly one, let us bear also the image of this heavenly one.

Christ does not have the image of Caesar, because he is the image of God. Peter does not have the image of Caesar, because he said: we have left all things and followed you. The image of Caesar is not found in James or John, because they are sons of thunder; but it is found in the sea, where those dragons have their heads crushed upon the water, and the greater dragon himself, his head broken, is given as food to the peoples of the Ethiopians. If, then, he did not have the image of Caesar, why did he pay the tax? He did not give of his own, but returned to the world what was the world's. And you, if you wish not to be liable to Caesar, do not have the things that are the world's. But you have riches: you are liable to Caesar. If you wish to owe nothing to an earthly king, leave all that is yours and follow Christ.

And rightly he decrees that the things of Caesar are to be rendered first; for no one can be the Lord's unless he has first renounced the world. But we all renounce in words, we do not renounce in affection; for when we receive the sacraments, we renounce. How heavy the bonds, to promise to God and not to pay! It is better he says that you do not vow than that you vow and do not pay. The contract of faith is greater than that of money. Pay what you promised while you are in this body, before the exactor comes and casts you into prison. Amen I say to you, you will not come out from there until you pay the last farthing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
