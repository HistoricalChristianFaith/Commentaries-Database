[[commentary]]
quote='''
Yet we cannot deny that it suffers along with its body. For it is also saddened, since Jesus says: My soul is sorrowful even unto death, expressing in himself the feeling of a man, and elsewhere: My soul is troubled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 7"
