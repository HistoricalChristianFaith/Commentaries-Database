
[[commentary]]
quote='''
We have received the Holy Spirit, who not only forgives our sins, but also makes us his priests to forgive the sins of others. Therefore the Prophet says: You have formed me and laid your hand upon me (Ps. 138 (139):5): he formed me through clay, he laid his hand on me through spiritual grace; although many take this psalm as spoken in the person of the Savior. Hear that the hand of the Lord is also called spirit: Job cries out: The divine Spirit who made me (Job 33:4). These, then, are the hands that prepared man: Christ and the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
