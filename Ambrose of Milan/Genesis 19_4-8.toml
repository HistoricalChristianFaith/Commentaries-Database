[[commentary]]
quote='''
And the men of the city of the Sodomites surrounded the house, from the infant to the old man, the whole people together. The equity of the divine judgement is established beforehand, lest anyone should perhaps say: what sin had the children committed, that all should be involved in the destruction? So there was no one just there, no one innocent. Hear Scripture testifying that they surrounded the house from the infant to the old man, the whole people together. No age was free from guilt — and therefore no one was free from destruction — and he who had not the possibility of committing the crime had the disposition. The strength of the old men was spent, but their mind was full of lust. Holy Lot offered the modesty of his daughters. For although that too was a shameful impurity, yet it was a lesser thing to have intercourse according to nature than to offend against nature. He set above the modesty of his own house the grace of hospitality, which is inviolable even among barbarous nations. Thus even there hospitality remains unharmed, where not even the bond of kinship is safe enough.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
