[[commentary]]
quote='''
Nor do we begrudge it if anyone wishes to refer these two brothers to the two peoples, so that the younger is the people from the Gentiles, as Israel was, whom the elder brother begrudged the benefit of the father's blessing. This the Jews were doing when they complained that Christ was eating with the Gentiles, and therefore they asked for a kid, the sacrifice of evil odor. The Jew asks for a kid, the Christian for a lamb, and therefore Barabbas is released to them, the lamb is sacrificed for us. Hence with them is the stench of crimes, with us the remission of sins, sweet in hope, delightful in fruit. He who seeks a kid awaits the antichrist; for Christ is a victim of good odor.

In the kid there also seems to be a complaint that the Jews lost the rite of the old sacrifice, or that no one's blood profited them as the blood of Christ profited the Church; for the blood of the prophets could not redeem them. But shameless he is, and like that Pharisee who justified himself with an arrogant prayer, who thought that he had never transgressed the commandment of God because he kept the Law in the letter; ungodly, he who accused his brother of having squandered his father's substance with harlots, when he ought to have noticed that it was said to him: harlots and tax collectors go before you into the kingdom of heaven,

and he stands outside, and he is not shut out, but he does not go in, ignorant of the will of God concerning the calling of the Gentiles, having now become a slave instead of a son; the slave indeed does not know what his lord is doing. When he came to know it, he envies and is tormented at the goods of the Church and stands outside. For outside, Israel hears the chorus and the symphony and is angry, because here the grace of the faithful people and the harmonious jubilation of the people sing together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
