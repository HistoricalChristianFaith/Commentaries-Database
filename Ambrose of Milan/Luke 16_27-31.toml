[[commentary]]
quote='''
Late does this rich man begin to be a teacher, when now he has the time for learning, and not for teaching. In this place the Lord most clearly declares that the Old Testament is the foundation of faith, beating back the unbelief of the Jews and shutting out the wickedness of the heretics, by whom the weaker mind is tripped up; for they are the little ones, who do not yet know the increases of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
