[[commentary]]
quote='''
Wherefore we have the precept: When thou hast made a vow, thou shalt not delay to pay it, and It is much better not to make a vow than after a vow not to perform the things promised, for, although you make a vow, you do not carry it out. A vow is a request for a benefit from God with a promise to give something in return. Hence, when you have obtained what you sought, it would be an ungrateful act to delay what you have promised.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 7"
