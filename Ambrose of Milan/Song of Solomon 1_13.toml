[[commentary]]
quote='''
A bundle of the drop is my brother to me, he will remain between my breasts, or he will dwell. She had said earlier that her nard had given her the fragrance of the bridegroom, and that through the ointment with which she had anointed him she had received the fragrance of his odour: but now she says: My brother is fragrant to me of a drop, and this not spread abroad nor scattered at will, but bound together and compressed, so that the fragrance of his sweetness may be rendered denser and stronger. And he, she says, being such, dwells and abides between my breasts, and makes his rest and dwelling in the place of my breast. A bundle, she says, of the drop is my kinsman, a cluster of henna is my brother to me, he will rest between my breasts. For the Lord Jesus, taking up a body, bound himself with the bonds of love, and joined himself not only to our members and natural passions, but also to the cross; and therefore, like a cluster, he rests in the faith of the Church and in moral grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
