[[commentary]]
quote='''
The Lord too testifies in the Gospel that the pains of a woman in labour are heavy, when he says: A woman, when she is in labour, has sorrow, because her day has come; but when she has borne the child, she no longer remembers the sorrow for joy, because a man is born into this world. Great, then, is the labour for one to acquire Christ for himself, lest without a helmsman he toss like a ship on the sea of this world. Thus the apostles were sad when Christ told them that he would return to the Father, because they thought that, with their guide absent, they would be forsaken. Christ is the joy; he is also the child with whom he is in labour who has received in the womb of his mind the spirit of salvation. He who has brought forth and nourished exults; he who is in labour is shaken and pierced.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
