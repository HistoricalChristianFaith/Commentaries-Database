[[commentary]]
quote='''
And come, he says, my dove, in the shelter of the rock, beside the outwork; that is, come beside the Gospel: the bulwarks of your faith are the deeds of Christ: the supports of your wall are the words of the Lord: the passion of the Lord's body is your strength.

Show me your face, and make your voice known; for your voice is sweet, and your face is comely. Your voice is sweet; for with the mouth confession is made unto salvation: and your face is comely; because she who does not blush for her author is not put to shame by her redeemer. She shows her face, then, bearing before her the seal of the cross: and she makes her voice known, taking up the authority of preaching. For in the covering of the body of Christ, by which there was redemption from sin, she has found the defense of spiritual grace; so that she may both perceive and speak things that bring salvation to her. Sweet, then, is the voice which spoke in the divine testimonies: Comely the face, which was not put to shame in the sight of kings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
And although there is full tranquillity, and the mysteries have grown up, yet again he says: Arise, secure in the shelter of the rock, that is, safe in the protection of my passion and the defense of faith. For they sucked honey from the rock and oil from the firm rock. Clothed with this covering, the souls of the pious are no longer naked, and this is their outwork. And therefore he says to this soul too: And come, you my dove, in the shelter of the rock beside the outwork: show me your face, and make your voice known. He exhorts her to confidence, that she may not blush for the cross of Christ, nor for its seal. He exhorts her to confession; he wishes all snares to be removed, that the good fragrance of faith may breathe, that the day may shine, that the shadow of hostile night may do no harm; since he who is beside Christ says: The night has gone before, but the day has drawn near (Rom. 13:12). There is both the shadow of worldly things, which passes away, and the day of heavenly things, Christ, who shines for his saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
