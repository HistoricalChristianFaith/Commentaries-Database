[[commentary]]
quote='''
But vain are the sons of men, lying are the sons of men in the scales, so as to deceive. If the sons of men are vain and the sons of men are lying, the sons of God can be not vain, they who were born not of blood nor of the will of the flesh nor of the will of man, but of God. For the sons of men seem to themselves to weigh out equity and to test justice by the weight of a severer judgement, hard on others, lenient to themselves, unjust in their works, censors in their speech. Hence Solomon says: A double weight is abominable to the Lord, and a deceitful balance is not good. By this he signifies those who plan plunder with an insatiable heart and put forward sobriety on their brow. Such are the scribes of the Jews, who lay on others heavy burdens of a harsher observance, not having the yoke of their own soul straight but bent by a leaning toward iniquity, while they themselves are runaways from their own precepts. So it is found in avarice, as in the root of all vices, what is the head and the kindling of iniquity, which the man who renounces the world and is buried together with Christ through the sacrament of baptism, as one dead to the world, ought to turn aside from and flee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
