[[commentary]]
quote='''
But the Lord calls those upon whom He has compassion. Hence it follows, And Jesus said, Let the dead bury their dead. Since we have received as a religious duty the burial of the human body, how is it thus that the burial even of a father's dead body is forbidden, unless you are to understand that human things are to be postponed to divine? It is a good employment, but the hindrance is greater, for he who divides his pursuits, draws down his affections; he who divides his care, delays his advances. We must first set about the things which are most important. For the Apostles also, that they might not be occupied in the office of distributing alms, ordained ministers for the poor.

The performance of a father's burial is not then prohibited, but the observance of religious duty is preferred to the ties of relationship. The one is left to those in like condition, the other is commanded to those who are left. But how can the dead bury the dead? unless you here understand a twofold death, one a natural death, the other the death of sin. (Rom. 9:11.) There is also a third death, by which we die unto sin, live unto God.

Or because the throat of the ungodly is an open sepulchre, their memory is ordered to be forgotten whose services die together with their bodies. Nor is the son recalled from his duty to his father, but the faithful is separated from the communion of the unbelieving; there is no prohibition of duty, but a mystery of religion, that is, that we should have no fellowship with the dead Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So, since we have received the duty of burying as a religious one, how is it that here even the burial of a father's corpse is forbidden, unless that you may understand that human things are to be put after divine? A good pursuit, but a greater hindrance; for he who divides his zeal draws off his affection, he who divides his care delays his progress. Therefore the greatest things must be undertaken first; for the apostles too, so as not to tie up their zeal for discoursing, ordained ministers for the poor, and they themselves, when they were sent by the Lord, were instructed to greet no one on the way, not because the duty of kindness displeased him, but because the intention of pursuing devotion pleased him more.

But how can the dead bury the dead, unless you understand here a twofold death, one of nature, the other of guilt? There is also a third death, in which we die to sin and live to God, like Christ, who died to sin; for in that he died, he died to sin once, but in that he lives, he lives to God.

There is, then, one death, by which the bond of body and soul is severed, not dreadful, not to be feared, since it seems to be a kind of departure of ourselves, not a punishment; not to be feared by the brave, to be desired by the wise, to be sought by the wretched, of which it was said: men shall seek death and shall not find it.

There is also another, which brings the destruction of worldly pleasures, in which not nature but sins die. This death we undergo when we are buried together in baptism and have died with Christ from the elements of this world, when we suffer oblivion of our former conduct. This death Balaam wished to die when he prophesied, that he might live to God, and therefore he said: let my soul die among the souls of the righteous, and let my seed be as their seed.

There is also a third death, when Christ, who is our life, is not known; but to know Christ is eternal life, which is now at hand for the righteous in shadow, but in the future will be face to face; for the Spirit before our face is Christ the Lord, of whom he said: in his shadow we shall live among the nations. In the shadow of his wings David hoped; in his shadow the Church desired and sat down.

If your shadow, Lord Jesus, confers so much, how much, surely, will the truth bring? How shall we live when we are no longer in the shadow but in life itself? For now our life is hidden with Christ in God; but when Christ, our life, appears, then we too he says shall appear with him in glory. Sweet is that life which has no death; for this life of the body has death by the lot of nature, a death which is often even desired. The soul itself too often has death through the stain of sin — for the soul that sins shall itself die —, but when, strengthened by the firmness of blessedness, it has begun not to be subject to sin, it will no longer be mortal, but will enjoy eternal life.

Toward this life, brethren, let us hasten, sorrowful in the world, because we are exiles from the Lord; for he who is not an exile from the body is an exile from the Lord. But it is far better to be dissolved from the body and to cleave to God, so that we too may be one in the presence of almighty God and, taken up through the glory of the resurrection into the brightness of nature and imitating, in the inviolable concord of souls, by an everlasting covenant, the unity of lasting peace, may see the only-begotten Son of God, so that what the Son of God promised concerning us in praying to the Father may be fulfilled. That they too may be one, as we also are one.

It is not, then, the burial of a father's corpse that is forbidden, but the dutiful love of divine religion is set before the bond of kinship; the one is left to his fellows, the other is enjoined on the chosen. Or else, because the throat of the ungodly is an open sepulchre, it is prescribed that the memory of those whose merit perished together with their body is to be blotted out; and the son is not called away from his duty to his father, but the faithful man is separated from communion with the unbelieving.

For there is a burial proper to the righteous, such as that of which it was said: for she, in pouring this ointment on my body, has done it for my burial; and therefore he who in good faith buries Christ within himself, so as to rise again with him, ought not to bury within himself the unbelief of the devil.

There is also that prophetic burial, that we should place certain things upon the tombs of our forebears, which you, reader, recognize, and which the unbeliever ought not to understand: not that food or drink is commanded, but that the venerable communion of the sacred oblation is revealed. It is not, then, a prohibition of the gift, but a mystery of religion, that there is to be no communion for us with the Gentile dead; for since the sacraments belong to the living, those who have life are not seen as dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
