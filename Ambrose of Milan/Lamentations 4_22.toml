[[commentary]]
quote='''
Jeremiah says in his Lamentations: Your iniquity has come to an end, daughter of Zion; he will not again drive you out: he has visited your iniquities, daughter of Edom, he has laid bare your sins (Lam. 4:22). Do you notice that iniquity could not come to an end without the visitation of God, nor correction be complete except through the grace of the Lord the Savior? But how iniquity comes to an end, hear the Church saying: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? The garment of the old man, then, woven with the vices of error and laid aside in the washing of regeneration, she does not know how she could put on; for through zeal for correction forgetfulness of sins had grown into her. So great is the force of a completed amendment that she returns to a kind of age of spiritual childhood, which does not know the ways of error; even if she wished, she could not commit a crime, because she has lost the habit of knowing how to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
