[[commentary]]
quote='''
So he wraps it in a linen cloth; but the Israelite both mingles diverse fragrances of virtues and puts in aloes, about a hundred pounds, that is, the measure of perfect faith. And they bound the body of Jesus according to the custom of the spiritual Jews, not indeed with the knots of unbelief, but with the bindings of faith, and laid it in a garden, to which the Church is often compared, which has the fruits of diverse merits and the flowers of virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
