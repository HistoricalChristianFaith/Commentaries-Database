[[commentary]]
quote='''
Therefore he is unmindful of injury, mindful of grace, as he himself testifies in the prophetic book, saying: I am, I am he who blots out your iniquities, and I will not remember them: but you, remember, and let us be judged; tell your iniquities first, that you may be justified (Isa. 43:25 and 26). Whoever, then, tells his iniquities to God is justified: and whoever is justified does not fear the reward, but demands it: he who does not fear the reward lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
