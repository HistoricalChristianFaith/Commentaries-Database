[[commentary]]
quote='''
For Matthew spoke of the fig tree alone, when its branch has become tender, this one of all the trees. But whether, when fruit grows green on all the trees and the fig tree, now fruitful, blossoms, so that every tongue confesses to God, the people of the Jews confessing too, we ought to hope for the coming of the Lord, at which the fruits of the resurrection will be reaped as in the season of summer; or whether, when the man of iniquity, the branch of the synagogue, has put on a light and fragile boasting like leaves, we ought to infer that the judgment is drawing near: for the Lord hastens both to reward faith and to bring an end to sinning.

This fig tree, then, has a twofold figure: either when hard things grow mild or when sins run riot. For through the faith of believers the things which were dry before will blossom, and through the grace of their offences sinners will glory. There is the fruit of faith, here the wantonness of unbelief. The tilling of the Gospel husbandman promises me fruit of the fig tree. We must not despair, if sinners have covered themselves with fig leaves as with a garment of deceit, to veil their conscience; so leaves without fruit are suspect. Such are the garments the exiles of paradise have.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
