[[commentary]]
quote='''
For the head of the woman is the man, the head of the man is Christ; but the Law too is the head of the intelligible woman. Indeed the people of the Jews is under the Law as under a husband, because law is called νόμος in Greek, and therefore the synagogue was joined to the νόμῳ as to a male, but to the bodily law, not the spiritual, that is, to the Jewish rite of the Law, by whose bonds she has been bound, not knowing the sacraments of lawful marriage. But if the Law has died, that is, the bodily interpretation of the Law, then the people, as though her former husband were dead, will lawfully marry a second husband, who rose from the dead. The Gospel is also the head of this woman. Hence certain people, interpreting mystically, have held that, when the Jewish rite was put to death, this woman married according to the Law the Gospel, as the brother of the deceased, because the Law announced the Gospel. Therefore the Law was the former husband; afterwards comes the marriage of the second husband, that is, the sacraments of the Gospel; for the two testaments are as it were two marriages. One marriage is the Old Testament, which was dissolved by the death of the former husband. And therefore that woman to whom the Law is dead rightly enters a second marriage, that is, the New Testament. So one woman is joined to two brothers, a woman for whom her former sins die and better sacraments are afterwards renewed. The Apostle has plainly set this out for us, saying: For the woman who is under a husband is bound to the law while the husband lives, that is, to the law of her husband, so as to owe him chastity. But if the husband is dead, she is loosed from the law of the husband, that is, so as to marry whom she will, provided she marries when the husband is dead, because while the husband lives she will be called, he says, an adulteress, if she is joined to another man; but if her husband is dead, she is freed from the law of the husband, so that she is not an adulteress if she is with another man. That this sacrament also pertains to Christ and the Church he showed elsewhere too, because it is a great sacrament. Here too he did not pass it over, saying: So, my brothers, you too have been put to death to the Law through the body of Christ, so that you may belong to another, who rose from the dead. How have you been put to death to the Law, unless the shadow of the Law dies for you when you approach the heavenly sacraments? For you must not approach the Gospel otherwise than loosed from the hindrances of bodily interpretation. Otherwise it is adultery to mix false things with true; but it is spiritual chastity if your soul, stripped of all the hindrances of wayward knowledge, approaches the Word of God without wrinkle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
