[[commentary]]
quote='''
This little one, then, whom you, who are an unbeliever, think of no account, the magi coming from the east followed over so long a distance, and falling down they adore him and call him king and confess that he will rise again, offering from their treasures gold, frankincense and myrrh. What are these gifts of true faith? Gold for a king, frankincense for God, myrrh for one dead; for the first is the emblem of a king, the second the sacrifice of divine power, the third the honour of burial, which does not corrupt the body of the dead but preserves it. Let us too, who hear and read these things, bring forth such gifts, brethren, from our treasures; we have indeed a treasure in earthen vessels. If, then, in yourself you ought to reckon what you are not from yourself but from Christ, how much more in Christ ought you to reckon not what is yours but what is Christ's!

So the magi offer gifts from their treasures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
