[[commentary]]
quote='''
So repentance is a good flight; the grace of God is a good flight, in which is the taking up of the one who flees; the desert is a good flight, to which Elijah, Elisha and John the Baptist fled. Elijah fled the woman Jezebel, that is, the outpouring of vanity, and he fled to Mount Choreb, which means drying up, so that in him the carnal flood of vanity might be dried up and he might know God more fully. For he was at the brook Chorrad, which is knowledge, where he might draw the flowing abundance of divine knowledge, so fleeing the world that he did not even seek food for this body except what the birds brought him as his ministers, although his food was for the most part not earthly. Indeed, for forty days he walked in the strength of the food which he had received. Surely so great a prophet was not fleeing a woman, but this world; nor did he fear death, he who had offered himself to the one seeking him, and who said to the Lord: Take back my soul, bearing a weariness of this life, not a desire for it; but he was fleeing worldly enticement, and the contagion of a stained way of life, and the sacrileges of an ungodly and transgressing nation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
