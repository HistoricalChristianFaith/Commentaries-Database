[[commentary]]
quote='''
Now let us examine another question relative to the addition which was made to the command. Does this addition in itself seem to be objectionable? If the words, neither shall you touch it, are actually advantageous and tend to put one on his guard, why did not God expressly forbid this even to the point of seemingly permitting it by not forbidding it? Wherefore, both points must be examined; namely, the reasons why He neither permitted it nor forbade it. Some raise the question: Why did He not order that the object which He had made should be seen and touched? But, when you realize that there was in that tree the knowledge of good and evil, you can understand that He did not wish you to touch what is evil. Sufficient is it for us, using the words of the Lord, to watch Satan fall as lightning from heaven, and giving to his sons not the meat of life, but that of night and darkness, as it is written: He gave him to be meat for the people of the Ethiopians. Thus far on the subject of the reason why He did not command the tree to be touched. Here are the reasons, as I understand them, why God did not prohibit this act. There are many things which do us harm, if we make up our minds to touch them before we know what they are. We often learn, in fact, by experience to be resigned if we know beforehand that a certain food or drink is bitter. You learn to be tolerant if you believe that what is bitter is beneficial, lest your sudden realization of its bitterness may offend you and cause you to reject what may prove to be salutary. It is advantageous, therefore, first to have knowledge of this bitter quality, so that you may not be squeamish and that you may realize what is good for you. These are examples of what may harm us just to a slight degree. From the discussion which now follows, take warning of what may cause us more serious damage unless we make provision against it.

Take the case of the Gentile who is eager for the faith. He becomes a catechumen and desires a greater fullness of doctrine to strengthen his faith. See to it that in his willingness to learn he is not exposed to false doctrine. Take care that he does not learn from Photinus or from Arius or from Sabellius. See that he does not hand himself over to teachers of this sort who would attract him by their airs of authority, so that his untrained mind, impressed by the weight of such august prestige, will be unable to discriminate the right from the wrong. He should first, therefore, determine with the eyes of his mind what are the logical sequences. Let him note where life exists by touching the life-giving qualities of holy Scripture, so that no interpreter will stand in his way. Sabellius reads for him: I am in the Father and the Father in me, and says that means one Person. Photinus reads that there is one Mediator between God and men, himself man, Christ Jesus. And elsewhere: Why do you wish to kill me, a man? Arius, too, read the following: For the Father is greater than I. The reading is clear, but the catechumen first ought to reflect on the matter in his own mind, so as to discover the real meaning of these passages. He is influenced by the prestige of his teachers. It would have been more to his advantage if he had not investigated at all rather than have come upon such an instructor. But the Gentile, too, if he takes up the Scriptures, reads: Eye for eye, tooth for tooth. Again: If thy right hand is an occasion of sin to thee, cut it off. He does not understand the sense of this. He is not aware of the secret meaning of the divine words. He is worse off than if he had not read at all. Hence he has furnished a lesson to these men on how they should have investigated the meaning of the Word of God. A careful, not a superficial, examination of the context of the passage should be made. It is written: What was from the beginning, what we have heard, what we have seen with our eyes, what we have looked upon and our hands have investigated: of the Word of Life. And we have seen and now testify and announce to you. You see how he investigated, so to speak, with his hands the Word of God and afterward announced it. Hence, the Word would not perhaps have caused injury to Adam and Eve if they had first touched and handled it, as it were, with the hands of the mind. Those who are infirm can by careful examination and handling investigate the nature of each and every object which they do not understand. Certainly, those weak first parents of ours should have studied beforehand the problem presented to them: How were they to touch the tree in which they knew there was knowledge of evil? The knowledge of evil, in fact, can frequently be of advantage to us. Wherefore we read in the oracular words of Scripture of the wiles of the Devil, so that we learn how we can escape his arts. We should be aware of his temptations, not that we may follow his lead, but that by instruction we may avoid these pitfalls.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"

[[commentary]]
quote='''
It is temperance, then, that prunes away desires. God commanded the first human beings to hold to it, saying: But of the fruit of the tree that is in the middle of paradise you shall not eat, nor shall you touch it, lest you die. And because it was not held to, therefore the transgressors of an excellent virtue were made exiles from paradise and without a share in immortality. This the Law teaches and pours into the dispositions of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 2"
