[[commentary]]
quote='''
And they indeed had brought silver, but good Joseph gave the grain and returned the silver; for Christ is not bought with money but with grace: your price is faith; with this the divine mysteries are bought. And this grain is carried by that ass, once unclean under the Law, but now clean under grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 8"
