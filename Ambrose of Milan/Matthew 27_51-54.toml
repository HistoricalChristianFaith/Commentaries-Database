[[commentary]]
quote='''
The rocks were split, that through the broken crags of stone it might be shown that it was to come to pass that the force of the Word would penetrate hard hearts, so that those hunters whom Jeremiah foretold might the more easily hunt for the Lord out of the hollows of the rocks. And the opening of the tombs, what else does it signify but the resurrection of the dead, the bars of death being broken? In their appearing there was faith, in their going forth a type, because by going forth into the holy city they declared, under the appearance of present things, the future everlasting lodging of those who rise again in that Jerusalem which is in heaven. The veil too is rent, by which is declared either the division of the two peoples or the profanation of the mysteries of the synagogue. The old veil, therefore, is rent, that the new Church may hang up the veils of her faith. The covering of the synagogue is taken away, that we may discern the inner mysteries of religion with the unveiled gaze of the mind. Indeed now even the centurion confesses as the Son of God him whom he had crucified. O hearts of the Jews, harder than rocks! The rocks are split, but their hearts are hardened. The judge reproves, the servant believes, the traitor condemns his own crime by his death, the elements flee, the earth is shaken, the tombs are opened; yet the hardness of the Jews remains unmoved while the world is shaken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
