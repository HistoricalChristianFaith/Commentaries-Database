[[commentary]]
quote='''
But that same David, that the difference of his actions may not perhaps disturb those who cling to the words of Scripture; that same David, I say, who had not wept for the innocent infant, wept for the parricide when dead. For at the last, when he was wailing and mourning, he said, "O my son Absalom, my son Absalom! Who will grant me to die for thee!" But not only is Absalom the parricide wept over, Amnon is wept over; not only is the incestuous wept over, but is even avenged; the one by the scorn of the kingdom, the other by the exile of his brothers. The wicked is wept over, not the innocent. What is the cause? What is the reason? There is no little deliberation with the prudent and confirmation of results with the wise; for there is great consistency of prudence in so great a difference of actions, but the belief is one. He wept for those who were dead, but did not think that he ought to weep for the dead infant, for he thought that they were lost to him, but hoped that the latter would rise again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Decease of His Brother Satyrus, Book 2.28"

[[commentary]]
quote='''
Look at another memorable thing. A parricidal son had violently invaded his father's kingdom. At first his father gave way to his fury and avoided the place of battle, so that even thus the impious one might come to his senses from his fury. He was unwilling also to take part in the war; he asked those setting out for the battle to spare his son. He who asked them to spare him was both secure of victory and no stranger to devotion, since he did not think that even an impious son ought to perish. He wept and lamented with great mourning the death of the parricide, saying: My son Absalom, who will give me death for you, my son Absalom? He thought that the man who had slain him in vindication of a father's devotion deserved to be punished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
