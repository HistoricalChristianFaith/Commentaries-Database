[[commentary]]
quote='''
Seeing her, then, ascending and not resisting, and delighted by the fragrances of her merits, recognizing too that she is the bride of that Solomon, the peaceful, they follow her with a zealous escort up to the couch of Solomon, because true rest in Christ is owed to her. For Christ is the couch of the saints, on which the hearts of all, weary with the battles of the world, find rest. On this couch Isaac rested and blessed his younger son, saying: The elder shall serve the younger; reclining on this couch Jacob blessed the twelve patriarchs; reclining on this couch the daughter of the ruler of the synagogue rose from death; lying on this couch the widow's dead son, called by the voice of Christ, broke the bonds of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"
