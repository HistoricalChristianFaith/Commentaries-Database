[[commentary]]
quote='''
Seeing her, then, ascending and not resisting, and delighted by the fragrances of her merits, recognizing too that she is the bride of that Solomon, the peaceful, they follow her with a zealous escort up to the couch of Solomon, because true rest in Christ is owed to her. For Christ is the couch of the saints, on which the hearts of all, weary with the battles of the world, find rest. On this couch Isaac rested and blessed his younger son, saying: The elder shall serve the younger; reclining on this couch Jacob blessed the twelve patriarchs; reclining on this couch the daughter of the ruler of the synagogue rose from death; lying on this couch the widow's dead son, called by the voice of Christ, broke the bonds of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
And what are the sixty? We know that the hebdomad belongs to the Old Testament and the ogdoad to the New, namely when Christ rose again and the day of new salvation dawned for all: on which day the brightness of full and perfect circumcision poured itself into human hearts. And seven and eight make fifteen. These, then, are the seven and eight, that is, the fifteen, for which Hosea hired the harlot whom the Lord had commanded him to hire. The hebdomad, then, and the eighth signify the fulfilment of the two Testaments and the fullness of faith: and the number fifteen taken four times, which makes sixty, the perfection of the Gospel.

And what is the vine-shoot round about which these mighty men stand? Naphtali, he says, is a vine let loose, putting forth beauty in its offspring. One branch of the vine is cut off, which seems useless, lest the vine run riot to no purpose in the exuberance of its branches; and another is cut back a little and let loose, that it may bear fruit, whose beauty is put forth in generation; because, while it lifts itself up to the heights, it embraces the vine, and climbing to the top clothes, as it were, the necks of the vines' yoke with the necklace of a precious branch. It too is comely in generation, because it overflows with many fruits on full branches. This is comely, but that is far more beautiful which signifies the branch clinging to the spiritual vine, of which we are the branch, and we can bear fruit if we remain in the vine; but if not, we are cut off. The holy patriarch Naphtali was an abundant branch, whence Moses too says: Naphtali, the fullness of those who receive, shall be filled with blessing from the Lord: he shall possess the sea and the south-west (Deut. 33:23); explaining what Jacob had said, what a vine let loose is, that is, released from the bonds of death through the grace of faith: in which is signified the people of God, called to the freedom of faith and the abundance of grace, spread through the whole world, which clothes the yoke of Christ with good fruit, and embraces the wood of that true vine, that is, the mysteries of the Lord's cross, and does not fear the danger of confessing him, but rather, even when placed in persecutions, glories in the name of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
