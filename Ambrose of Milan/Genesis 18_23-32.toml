[[commentary]]
quote='''
Then, when Abraham asked that he should not destroy the just together with the wicked as if they were wicked, and inquired: if there are fifty just men in the city, will you destroy them? he answered: I will not destroy he says the city, if there are fifty just men in it, and I will preserve the whole place. And so, through the order of questions and the alternation of answers, even if he should find ten just men in the city, he nevertheless promises impunity to the whole people for the sake of the justice of a few. From this we learn how great a wall for his fatherland a just man is, and how we ought not to envy holy men nor rashly disparage them; for it is their faith that preserves us, their justice that defends us from destruction. Sodom too, if it had had ten just men, could have escaped perishing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
