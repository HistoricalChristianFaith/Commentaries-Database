[[commentary]]
quote='''
So he saw Zacchaeus up above; for already by the loftiness of his faith he stood out among the fruits of new works, as on the height of a fruitful tree. And since we have turned from the type to moral matters, it delights me, amid the goodwill of so many believers, to relax the mind on the Lord's day and to mingle festivity with it. Zacchaeus in the sycamore: a new fruit, that is, of a new time, so that in this too that saying might be fulfilled: The fig tree has put forth its green figs; for Christ came for this, that from trees not fruits but men should be born. We read elsewhere: When you were under the fig tree, I saw you. So Nathanael was under the tree, that is, above the root, because he was righteous — for the root is holy — yet Nathanael was under the tree, because he was under the law; Zacchaeus was above the tree, because he was above the law; the one a hidden defender of the Lord, the other a public preacher; the one was still seeking Christ from the law, the other, now above the law, was leaving his own goods and following the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
