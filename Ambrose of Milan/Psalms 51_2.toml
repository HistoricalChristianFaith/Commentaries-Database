[[commentary]]
quote='''
And rightly holy David wrote about this history the mystical Psalm 50 (51), because of his marriage with Bathsheba, saying: Wash me abundantly from my unrighteousness and cleanse me from my sin. If the friend of God acknowledges his iniquity and that sin stands in the way of his merits, if, finally, he confesses that he has sinned against God, why should you blush at confessing a crime, since it is the contriving of a crime, not the confession of it, that brings shame?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Wash me thoroughly from my injustice and cleanse me from my transgression. He asks to be washed not so much more often as more fully, that he may wash away the caked filth. He knew that according to the law there were indeed some aids to cleansing, but none full and perfect. To that perfect one, then, he hastens with all his effort, by which all justice is fulfilled, which is the sacrament of baptism, as the Lord Jesus himself teaches. For when he had come to John, the Baptist said: I ought to be baptized by you, and do you come to me? The Lord answered: Permit it now; for thus it becomes us to fulfil all justice. But after Christ was baptized and the Holy Spirit descended upon him as a dove and the Father sealed the Son from heaven, all justice was fulfilled. Therefore the prophet says: Wash me thoroughly from my injustice; for great squalor and stain is removed not by a scanty washing but by an abundant one.

But if anyone wishes to take it otherwise, he can shape his understanding thus. The divine word cleanses, our confession cleanses, the one while it is heard, the other while it is uttered; good thought cleanses, honourable action cleanses, and so does the practice of good conduct. Cleansed by these, each one more easily draws in and, as it were, seizes into himself the splendour of spiritual grace. So it is that the precious dye does not shine out at once from a single dipping of the fleece, but first the fleece is stained with a common juice, then its natural appearance is repeatedly washed out with one juice after another and changed again and again by different colours, and so afterwards the dyeing of a fuller washing, as it were, is applied, that a truer and more perfect brilliance of purple may glow red. As, then, many murex shells are needed in the dyeing of purple, so in the washing of regeneration a multitude of heavenly compassions is needed, that iniquity may be blotted out. And so he who is thoroughly washed from injustice is cleansed from transgression, and puts off a certain habit of sinning that has grown ingrained in his pursuits and conduct, and forgets its quality. And rightly he is washed from injustice or iniquity, which is greater, and cleansed from transgression, which is lesser.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 8"
