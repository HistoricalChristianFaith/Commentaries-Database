[[commentary]]
quote='''
Consider that you do not possess these alone. With you the worm possesses them; and the rust, which consumes money. These are the consorts which avarice has given you. But see what debtors grace gives: The lips of the just shall bless him that is liberal of his bread, and there shall be testimony of his goodness. It makes God the Father your debtor, Who, like the debtor of a good creditor, pays interest for the gift by which the poor man is helped. It makes the Son your debtor, Who says: For I was hungry and you gave me to eat; I was thirsty and you gave me to drink; I was a stranger and you took me in; naked and you covered me. For what is given to even one of the least, He says, is given to Him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 14"
