[[commentary]]
quote='''
For what does it mean that a man confessing his sin sings of Zion and Jerusalem, saying: Deal kindly, O Lord, in your good will with Zion, and let the walls of Jerusalem be built, unless that he is pleased to have the gathering of the Church hastened through the calling of the Gentiles, he who would spread through the whole world the lineage of his faith, not for the sons of the slave woman but for those of the free Jerusalem, the one which is in heaven, and would found the enclosures of spiritual walls on the affirmation of apostolic teaching?

And so the walls of Jerusalem are the bulwarks of faith, the defences of disputation, the summits of the virtues; the walls of Jerusalem are the assemblies of the churches founded through the whole world; for the Church says: I am a wall, and my breasts are a tower. And rightly are the gatherings of the churches the walls of Jerusalem, since whoever enters the Church in good faith and deed becomes a citizen and inhabitant of that city on high which came down from heaven. These walls are built by a structure of living stones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 17"
