[[commentary]]
quote='''
Hence there fittingly follows: For his soul shall be blessed in his lifetime; he will confess to you when you have done well to him. Foolish men, he says, will bless him with an earthly blessing, men who consider present things, not future ones; his hangers-on and parasites will bless him. He himself too thinks himself blessed if he has seized some field that he desired. He confesses to God then, when things go favourably for him in this world, but when adversities befall, he curses with an ungodly mouth. This, then, is what he says: that the worldly man does not give thanks when placed in poverty and adversity; but the righteous man in straits blesses the Lord all the more with grateful affection. Then the devil says to God: What wonder if Job blesses you? All things abound to him. But put forth, he says, your hand and touch the things that he possesses; let us see if he blesses you to your face. And the Lord gave him power to take away the things that were of this world and to drench his flesh with the cruelty of a sore. Yet Job blessed, saying: The Lord gave, the Lord has taken away; blessed be the name of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
