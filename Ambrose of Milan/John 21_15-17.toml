[[commentary]]
quote='''
There is no doubt, then, that Peter believed, and believed because he loved, and loved because he believed. Whence he is also saddened, because he is asked even a third time: Do you love me dearly? For he is questioned about whom there is doubt; but the Lord does not doubt, who was asking not that he might learn but that he might teach whom, as he was about to be lifted up into heaven, he was leaving to us as the vicar, as it were, of his love. For so you have: Simon son of John, do you love me? Surely you know, Lord, that I love you dearly. And Jesus says: Feed my lambs. Well aware of himself, Peter testifies to an affection not taken up for the moment but long known to God. For who else is there who could easily profess this of himself? And therefore, because he alone of all professes it, he is preferred to all; for greater than all is charity.

That too must be looked at more carefully, why, when the Lord said: Do you love me? he answered: You know, Lord, that I love you dearly. In this, love seems to me to have the charity of the mind, but loving dearly a certain heat conceived from the ardor of body and mind; and I think that Peter signifies the fervor not only of his mind but also of his body in the worship of God. Indeed the third time the Lord asked no longer Do you love me? but Do you love me dearly? And no longer is he bidden to feed lambs, as at first, to be nourished with a kind of milk, nor little sheep, as the second time, but sheep, the more perfect, that he who was more perfect might govern them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Who, then, has concealed and covered more than holy David, who also says elsewhere: And in the shadow of your wings I have hoped, until iniquity pass by, and who so loved the Lord that by his exceeding charity he covered and hid every sin? For if the holy apostle Peter abolished his fall by the confession of charity, and he, questioned by the Lord, who said to him a third time: Simon, son of John, do you love me?, so that him whom he had denied three times he might confess three times, and thus by a kind of threefold veil of love hide the fall of his threefold denial: if Peter, because he wept once, obtained pardon, how much more David, who washed his bed every night and watered his couch with tears, whose tears were his bread day and night, who ate ashes like bread and mingled his drink with weeping. For if Jesus has mercy on him who has turned and groaned, if he looked upon Peter and Peter wept, how much less did he who wept long withdraw from the sight of the Lord? Peter denied and did not weep, because Jesus had not looked back at him; he denied a second time and did not weep, because the Lord had not looked back at him; he denied a third time, Jesus looked back, and at once he wept, and wept most bitterly. And therefore David, who was always weeping, said: My eyes are ever toward the Lord; he who was always seen by Christ said: Through the outlets of waters my eyes have gone down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"

[[commentary]]
quote='''
There are also those who take the first verse to be about the washing, and the second about repentance. For this reason too Peter, who had been baptized before, is asked, after he appeared to have denied the Lord: Simon, son of John, do you love me? He says to him: Surely, Lord, you know that I love you. And again he is asked: Simon, son of John, do you love me? And again he answered: You know, Lord, that I love you. And a third time he is asked: Simon, son of John, do you love me? And he was saddened, because he said to him a third time: Do you love me? and he says to him: Lord, you know all things; you know that I love you. And it was said to him three times: Feed my sheep; follow me, as to one who had covered his sin by his exceeding charity. Nor is it idly that after the confession of his exceeding charity he is commanded to rule the people, he who even when troubled had not lost the way to rule himself. We have said this for the sake of the grace of charity, because it covers sin. And so some have said that the threefold question about love was put because the denial had been threefold, so that the profession of charity, repeated as many times, might blot out the fall of the threefold denial.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 9"
