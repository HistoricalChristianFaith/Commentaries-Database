[[commentary]]
quote='''
They came to Sodom in the evening, to Abraham at midday, because the presence of angels shines upon the just man but brings darkness to the impious. Yet the fact that they came in the evening to him who was to be freed from the contagions of Sodom and from the destruction of the whole city can also be referred to the time of the Lord's passion. It was evening before Christ came, because the whole world was in darkness. It was evening for all whom the dark squalor of monstrous offences oppressed. The Lord Jesus came, redeemed the world with his blood, brought light. And the two angels came to Sodom at evening. Where grace is to be bestowed, Christ is present; where severity is to be exercised, only the ministers are present, and Jesus is absent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
