[[commentary]]
quote='''
Would anyone deny that Jacob was blessed at the very last moment of death, when he poured forth divine oracles? Would anyone deny that Joseph was blessed in prison, where by the spirit of wisdom he interpreted the truth of the dreams he had heard and revealed the course of things to come? Would anyone deny that Isaiah was blessed when he was sawn through the middle, Jeremiah when he was sunk down, holy Daniel when he stood unafraid among the lions and a prophet, carried off by an angel, brought him his meal? He was certainly not blessed because he ate another's meal, but because by his merits he shut the unfed mouths of the lions. But who would not call blessed the mother of the Maccabees, who added herself as the eighth to the deaths of her seven sons, for the praise of the heavenly triumph?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
