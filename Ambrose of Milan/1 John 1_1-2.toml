[[commentary]]
quote='''
Hence he has furnished a lesson to these men on how they should have investigated the meaning of the Word of God. A careful, not a superficial, examination of the context of the passage should be made. It is written: What was from the beginning, what we have heard, what we have seen with our eyes, what we have looked upon and our hands have investigated: of the Word of Life. And we have seen and now testify and announce to you. You see how he investigated, so to speak, with his hands the Word of God and afterward announced it. Hence, the Word would not perhaps have caused injury to Adam and Eve if they had first touched and handled it, as it were, with the hands of the mind.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"
