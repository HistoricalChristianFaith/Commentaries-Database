[[commentary]]
quote='''
Let no one think that the reverence of devotion due to a father was violated because she sat while her father stood, since it is written: He who has made more of father or mother than of me is not worthy of me. Where the cause of religion was being pleaded, faith had to hold the seat of judgment, and unbelief to stand as if accused.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"
