[[commentary]]
quote='''
Beautifully, when about to ascend the cross, he laid aside his royal garments, that you may know that he suffered as man, not as God the King; although Christ is both, yet he was fastened to the cross as man, not as God. But the soldiers, not the Jews, know at what time what garments befit Christ. At the judgment he stands as a victor; to the Passion he comes as a humble defendant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
