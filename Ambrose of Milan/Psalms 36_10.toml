[[commentary]]
quote='''
Extend, then, your mercy to those who know you. A prerogative is extended, so that those whom the merit of knowing you supports may deserve mercy. Indeed, further on we recognize that zeal for knowledge was a support even to persons of lower rank, the Lord saying: I will be mindful of Rahab and Babylon, to those who know me, that is: I will be mindful of that harlot Rahab and of that confusion among those who know me, or among them themselves, because that harlot recognized me, whom the chosen people did not know. Among those, then, who have known me Rahab will be remembered, that she may obtain the worthy reward of faith. Hence we note that it was said in the Gospel also: Harlots and publicans shall go before you in the kingdom of heaven. But because we are weak in carrying out, though devoted in believing, extend your mercy to those who believe in you, so that our deeds also may accord with our devotion and faith, and the weakness of this body may not forsake the zeal of our mind, but in our very temptations and weaknesses we may glory, in which the Apostle gloried, saying: Most gladly, therefore, will I rather glory in my weaknesses, that the power of Christ may extend itself in me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
