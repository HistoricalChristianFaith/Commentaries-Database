[[commentary]]
quote='''
Then he orders the infants to be slain. To whom else but God was such a victim owed? Though infancy is without understanding, yet it confesses God, for whom it is slain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
