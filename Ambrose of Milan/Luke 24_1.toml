[[commentary]]
quote='''
Now this place has caused great perplexity to many, because while St. Luke says, Very early in the morning, Matthew says that it was in the evening of the sabbath that the women came to the sepulchre. But you may suppose that the Evangelists spoke of different occasions, so as to understand both different parties of women, and different appearances. Because however it was written, that in the evening of the sabbath, as it began to dawn towards the first day of the week, (Matt. 28:1.) our Lord rose, we must so take it, as that neither on the morning of the Lord's day, which is the first after the sabbath, nor on the sabbath, the resurrection should be thought to have taken place. For how are the three days fulfilled? Not then as the day grew towards evening, but in the evening of the night He rose. Lastly, in the Greek it is "late;" (ὀψὶ) but late signifies both the hour at the end of the day, and the slowness of any thing; as we say, "I have been lately told." Late then is also the dead of the night. And thus also the women had the opportunity of coming to the sepulchre when the guards were asleep. And that you may know it was in the night time, some of the women are ignorant of it. They know who watch night and day, they know not who have gone back. According to John, one Mary Magdalene knows not, for the same person could not first know and then afterwards be ignorant. Therefore if there are several Maries, perhaps also there are several Mary Magdalenes, since the former is the name of a person, the second is derived from a place.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But on the morning of the sabbath they came at a very early hour to the tomb. A great doubt arises in this place for many; for although the evangelists do not seem to have said contrary things, yet they said different things, since here: in the morning at a very early hour, Mark very early, Matthew in the evening of the sabbath, John on the first of the sabbath, while it was still dark, they said the women came to the tomb. Then they recorded that here two men were seen, in Mark one young man sitting in white, in Matthew one angel, in John two angels sitting in white. Lastly, what may seem hardly possible to unravel, John wrote that it was said to Mary Magdalene: Do not touch me; for I have not yet ascended to my Father; Matthew wrote that the Lord met Mary Magdalene and the other Mary, and set out in a most evident description that they came up and held his feet and worshiped.

How then is it to be resolved, unless you think that the four evangelists spoke of four different times, so that you may infer both different persons of women and different visions? Indeed some come with ointment on the first of the sabbath, others without ointment in the evening of the sabbath. The name of these is expressed; those are described as having followed the Lord from Galilee.

In this place, lest at the end the roughness of a thorny interpretation should offend anyone, where perhaps pleasant things were expected, consider that we are now lowering the sails to complete the discourse, since we have come to the harbor; and a ship which has crossed the seas at a swift course, when it begins to draw near the shore, grazes the hidden rocks with its course checked. So, lest my discourse stick in the sands of the shore as if under a sluggish helmsman, I think the way should be slackened rather than rushed, as though I were skirting blind shallows, so that our speech may not crack open, full of leaks.

First, then, we must look at this: what is meant by what is written, that the Lord rose again in the evening of the sabbath which dawns into the first of the sabbath. For so you have that in the evening of the sabbath Mary Magdalene came, and the other Mary, to see the sepulchre. And behold, there was a great earthquake. For not on the sabbath day — for they kept silence on the sabbath according to the commandment — but after the sabbath day, certainly in the night, he rose again. Indeed those who came in the morning, though at a very early hour, yet learned that the Lord had already risen.

So, then, a balance must be struck, that the resurrection be believed to have taken place neither in the morning of the Lord's day, which is the first after the sabbath, nor on the sabbath. For how else is the three days' period completed? He rose, therefore, not as the day was drawing to evening, but in the evening of the night. Indeed the Greek said late, that is, ὀψέ. And late both marks the hour at the setting of the day and signifies the lateness of any thing, as if you should say: It was suggested to me late, that is, tardily; he came late, that is: he who arrives after the appointed time. Though he came in the morning of the following day, it is late nonetheless, when the time for acting has passed. Late is also the depth of the night, as if you should say: I rose late to work by lamplight, that is: I rose not in the evening time but in the depth of the night.

Hence the women too have the opportunity of approaching the tomb, the guards being certainly by then at rest, and the guards themselves are the more terrified, as happens to those roused from sleep. Lastly, the chief priests too, gathered with the elders, confirm that this happened at night, saying to the guards: Say that his disciples came by night and stole him while we were sleeping. For from the time, which they learned from the guards, they seize on a pretext for fraud. For John too indicates that in the morning, while it was still dark, Mary Magdalene came to him and to Peter, and yet presents her as unaware of the resurrection that had taken place; for certainly, if it had taken place as the day was drawing to evening, it could at once have become known.

It is morning, and still Peter does not know, John does not know. Would the Lord have allowed his disciples to be tormented longer by uncertainty about his death, the disciples to whom at once the angel, at once the Lord sent the women as messengers of what had been done? And that you may know that it happened at night, some women do not know, others know. Those know who kept watch nights and days; those do not know who had withdrawn. One Mary Magdalene does not know, according to John; the other Mary Magdalene knows, according to Matthew; for the same woman could not both know before and not know afterwards. Therefore, if there are several Marys, perhaps there are several Magdalenes too, since the former is the name of a person, the latter of places.

Recognize, then, that she is another. The one is allowed to hold the Lord's feet, this one is forbidden to touch the Lord; the one was found worthy to see an angel, this one, when she first came, saw no one; the one announced to the disciples that the Lord had risen, this one indicates that he has been stolen away; the one rejoices, this one weeps; the one Christ meets already in his glory, this one still seeks him as dead; the one saw the Lord and believed, this one could not recognize him when she saw him; the one worshiped in spirit with faithful affection, this one was saddened with doubting affection.

Rightly indeed is she forbidden to touch the Lord; for we touch Christ not by bodily touch but by faith. For I have not yet he says ascended to my Father, that is, I have not yet ascended for you, who seek the living among the dead; and therefore she is sent to the stronger, by whose example she may learn to believe, that they may preach the resurrection.

For as in the beginning the woman was the author of guilt to the man, and the man the executor of the error, so now she who had first tasted death first saw the resurrection, first in the remedy as in the order of guilt. And lest she should bear among men the reproach of perpetual guilt, she who had passed on guilt to the man passed on grace too, and makes up for the misery of the ancient fall by the announcement of the resurrection. Through the mouth of a woman death had gone forth before; through the mouth of a woman life is restored.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
