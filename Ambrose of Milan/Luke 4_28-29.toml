[[commentary]]
quote='''
It can not be wondered at that they lost their salvation who cast the Saviour out of their city. But the Lord who taught His Apostles by the example of Himself to be all things to all men, neither repels the willing, nor chooses the unwilling; neither struggles against those who cast Him out, nor refuses to hear those who supplicate Him. But that conduct was the result of no slight enmity, which, forgetful of the feelings of fellow citizens, converts the causes of love into the bitterest hatred. For when the Lord Himself was extending His blessings among the people, they began to inflict injuries upon Him, as it follows, And they led him unto the brow of the hill, that they might cast him down.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And all in the synagogue, hearing these things, were filled with anger, and they rose up and cast him out of the city.

The sacrileges of the Jews, which the Lord had foretold long before through the prophet — and in a little verse of a psalm he had declared what he would suffer when set in the body, saying: they repaid me evil for good — he teaches in the Gospel to have been fulfilled. For while he himself spread benefits through the peoples, they inflicted injuries. Nor is it any wonder if they lost salvation who cast out of their borders the one who brings salvation; for the Lord is moral, and, being one who taught his apostles by his own example to become all things to all, he neither repudiates the willing nor binds the unwilling, nor struggles against those who cast him out, nor fails those who ask. So elsewhere he left the Gerasenes, as weak and ungrateful, when they could not bear his mighty works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
