[[commentary]]
quote='''
He knows not the functions of nature itself, nor does he know even the regular successions of sleep, nor does he enjoy the sweetness of food, of which things no servitude is deprived: For sleep is sweet to a slave, whether he eat little or much, but as regards him that is filled with riches, there is none that alloweth him to sleep. Cupidity excites him, his ever-wakeful anxiety to plunder another's property disturbs him, he is tormented by envy, peeved by delay, worried by the unfruitful sterility of his crops, and troubled by abundance. Wherefore, to that rich man whose possession brought him abundant fruits, and who thought within himself, saying: What shall I do, because I have no room where to gather my fruits? And he said: This will I do: I will pull down my barns, and I will build greater; and into them will I gather all things that are grown to me, and I will say to my soul: Soul, thou hast much goods laid up for many years, take thy rest, eat, drink and make good cheer, God answered: Thou fool, this night do they require thy soul of thee; and whose shall those things be which thou hast provided? Not even God himself permits him to sleep; He troubles him as he thinks, and rouses him when he slumbers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 6"
