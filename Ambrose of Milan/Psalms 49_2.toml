[[commentary]]
quote='''
And therefore he added: all you earth-born and sons of men, together in one, rich and poor, that he might call all. Who is the earth-born but a son of man? Who is the spiritual but a son of God? The one formed from blood and begotten of the pleasure of the flesh and of man, the other born of God; one rich in every word and in knowledge, another poor, yet rich in grace, since the poor man cried out, and the Lord heard him. On the contrary, there is also the rich man in pride and the poor man in humility. All are called to the Church, so that all may be redeemed by Christ. He who is sick finds a physician, he who is well acquires wisdom, the captive a Redeemer, the free man a rewarder. Divine Scripture builds up all; in it each one finds the means either to heal his wounds or to confirm his merits. And the call of the rich and the poor, made together in one, summons us to a certain humility and equality, so that neither the rich man may disdain the needy nor the poor man envy the rich, but one grace may bind both to itself, since the Lord too became poor though he was rich, so that he might be the Savior both of the poor and of the rich.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
