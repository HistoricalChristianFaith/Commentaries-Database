[[commentary]]
quote='''
Having won this triumph too over a fierce nation subdued, he again undertook a mighty war in the valley of the Titans, no less against nature than against the enemy. For while he was engaged in the war he was thirsty, and he had nothing to drink. Who, he said, will give me drink from the cistern which is in Bethlehem at the gates? Now between the cistern and holy David lay the enemy, and in between the palisades of the hostile camp. Three men cut through the multitude of the adversaries and drew water from the cistern which was in Bethlehem, and brought it to the king to drink. But the king would not drink, and poured it out to the Lord — for it was worthy of so great a gift that what was the mark of lively valour should become a sacrifice of devotion — and he spoke a sentence worthy of the prophetic spirit: Far be it from me to do this, lest I drink the blood of the men who went at the risk of their lives. So he conquered nature, so that though thirsty he did not drink, and he offered an example in himself by which the whole army might learn to endure thirst. He also trained his subjects in the duty of valour, so that even through dangers soldiers would willingly obey the royal command. And by refusing to drink he declared that he had given the command for the sake of testing his soldiers, not as one conquered by the necessity of thirst; that he had also taken care that no king should seek the enjoyment of drinking at the peril of others; and finally that he had averted a wound to his devout conscience, since water sought with the blood of so many men could not have any sweetness in the drinking, because it had been bought at the cost of the dread of death set before them.

But if you wish to look more deeply and see into the mystery, David was thirsting not for water from the cistern which is in Bethlehem, but he foresaw in the spirit Christ, who was to be born of a virgin. He wished therefore to drink not the water of a river but the drink of spiritual grace, that is: he thirsted not for the element of water but for the blood of Christ. And so he did not drink the water offered him, but poured it out to the Lord, signifying that he thirsted for the sacrifice of Christ, not for the stream of nature, for that sacrifice in which there would be remission of sins; that he thirsted for that eternal fountain which would not be sought at the peril of others but would drive away the perils of others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
