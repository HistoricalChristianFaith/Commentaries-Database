[[commentary]]
quote='''
Pray that your flight be not in winter or on the sabbath. Since the Lord will come on the day of judgment, before which fire will burn, and the force of fire is either always the same or scorches more quickly in summer, how does he say that we must pray that our flight be not in winter — unless perhaps because he who flees to the mountains ought not to have to fear the cold and the ice, the storms and the hail of sins, but to wish for the calm of summer light, lest his weak footsteps slip on the slipperiness of the body?

Hence that soul too, secure now in her progress, resting now on firm roots, rejoices, saying: Winter is gone, the time of pruning has come; for in winter the wind strips the trees of their beauty, and the harshness of the cold kills the tender leaves into a semblance of death; but in spring the seeds rise again and, as it were, a new summer of greening nature grows up. In spring is the Pasch, when I was saved; in summer is Pentecost, when we celebrate the glory of the resurrection after the likeness of what is to come.

We must pray also that the Lord at his coming may not catch you on the sabbath, that is, idle from works. And therefore, according to the law, work day after day, and be fervent in spirit and wakeful in labour. Nor is it without meaning that it is written: On the sabbath you shall humble your soul, and that the people remained seventy years in captivity: then religion was violated, freedom crushed, chastity wounded. So you ought to emigrate from this life at the time when the virtues flourish and the vices are captive, not when the soul is captive, its vigour and virtue lie idle, and the sins of the body hold sway.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Release yourself, then, every sabbath, lift off the weight of error, so that you may deserve to come secure to the rest of that future sabbath; for if you carry heavy sins from here, you will have no rest there. Unburden your mind, therefore, cast off everything by which the conscience is weighed down and pressed, lest your flight be in winter or on the sabbath. This life is in labour, that one in rest. Let the consummation of this world find you lighter, lest, burdened with sins, you be unable to flee. Flee beforehand, so as to forestall it. He flees the world who is not held by the enticements of the world, who has released himself from every care of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
So Christ calls her to himself, that she may come, since she was already coming endowed with spiritual riches, because behold, he says, the winter has passed, the rain has gone, it has gone its way, flowers have been seen on the earth. See how the holy Church is invited. The winter, he says, has gone its way, so that, naked, she may not dread the winter: a winter not of season but of weakness, which despoils the fruitful field of the soul of every flower. For there is a winter not of the earthly sun; there is a winter of the mind, when cold steals into the mind, when the warmth of the mind vanishes, when the vigour of understanding is loosened, when excessive moisture overflows and weighs down the mind, when the inner sight grows dark. And therefore the Lord says: See that your flight be not in winter or on the sabbath. For it is good that the day of judgment or of death should come at the time when the gentle temperateness of the mind is in its vigour, when the heavenly mystery shines with serene light, when our heart burns within us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"
