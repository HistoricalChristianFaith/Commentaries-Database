[[commentary]]
quote='''
That is why Scripture says that he called back all the cavalry of Sodom, that is, he held the reins, he put on the bridles of reason, he called back the fault, he brought error to a halt. For the horse does not know how to stand still: swift to the charge, lifting up its neck, neighing for lust. What is so like sin? For fault boils up at its first onset and outruns every thought of what is right, and leaps out with an untimely motion, so that reason can hardly call it back. It is carried headlong and throws its rider into this sea of this world, refusing with swollen neck the yoke of correction. There is a particular form of lust which changes a man's voice, corrupts the words of the lover, and betrays itself by its own utterances. Finally the Lord God says to Judah through Jeremiah: now shall be seen your shame and your adultery and your neighing and the estrangement of your fornication upon the hills. This cavalry the just man brought back, and he also converted the character of the one who was turning aside and called them to himself, so that those who had deviated might become his imitators; because our senses run back to the discipline of the mind, he also recovered the substance.

He certainly does not mean patrimony, but the vital substance of the soul, in which there is precious wealth, not stubble, not hay, in which there is the splendour of faithful speech, in which the wealth of our hope subsists. For this is our true substance, which is rich in the abundance of wisdom; this is the immortal substance, whereas the use of the body or of accidents is of a day rather than of long duration. Hence some rightly think that patrimony is not called substance; for we do not subsist in it, since even those who lack money do not, for all that, lack the substance of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 7"
