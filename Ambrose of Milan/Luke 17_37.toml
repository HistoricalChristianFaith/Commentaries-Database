[[commentary]]
quote='''
For the souls of the righteous are likened to eagles, because they soar high and forsake the lower parts, and are said to live to a great age. Now concerning the body, we can have no doubt, and above all if we remember that Joseph received the body from Pilate. (Matt. 28.) And do not you see the eagles around the body are the women and Apostles gathered together around our Lord's sepulchre? Do not you see them then, when he shall come in the clouds, and every eye shall behold him? (Rev. 1:7.) But the body is that of which it was said, My flesh is meat indeed; (John 6:55.) and around this body are the eagles which fly about on the wings of the Spirit, around it also eagles which believe that Christ has come in the flesh. And this body is the Church, in which by the grace of baptism we are renewed in the Spirit.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they answered and said: Where, Lord? This the disciples said; but the Lord, when he had forewarned them both whither they should flee and where they should stay and what they should beware of, embraced the whole in a general definition, saying:

Wherever the body is, there the eagles will be gathered. So let us first conjecture what the eagles are, so that we may define what the body is. For the souls of the righteous are compared to eagles, because they seek the heights, leave lowly things behind, and are said to live to a long age. Hence David too says to his soul: Your youth will be renewed like the eagle's. If, then, we have understood the eagles, we can no longer be in doubt about the body, especially if we remember that Joseph received the body from Pilate. Do not Mary of Cleopas and Mary Magdalene and Mary the mother of the Lord and the company of the apostles around the Lord's burial seem to you to be eagles around the body? Do they not seem to you eagles around the body, when the Son of Man will come with the intelligible clouds, and every eye will see him, and those who pierced him?

There is also the body of which it was said: My flesh is truly food and my blood is truly drink. Around this body are the eagles which fly around it on spiritual wings. There are eagles around the body also that believe that Jesus has come in the flesh, because every spirit that confesses that Jesus Christ has come in the flesh is from God. Where, then, there is faith, there is the sacrament, there is the lodging-place of holiness. The Church too is a body, in which through the grace of baptism we are renewed in spirit, and the declining years of old age are restored to an age come alive again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
