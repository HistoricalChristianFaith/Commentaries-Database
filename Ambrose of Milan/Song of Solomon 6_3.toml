[[commentary]]
quote='''
This loftiness the soul knew in whom was the turning of the Word.

For thus she says: I am my brother's, and his turning is toward me. She repeated this thought three times, in different ways, in the Song of Songs. At the beginning she says: My brother is mine and I am his, who pastures in the lilies, until the day breathes and the shadows are removed. Then she says: I am my brother's and my brother is mine, who pastures among the lilies. At the end she says: I am my brother's and his turning is toward me. The first refers to the beginning of the soul — and that is why she also put first My brother is mine; for when he shows himself, the soul too has taken up the desire of cleaving to God — what follows to her progress, the third to her perfection. In the first, as at the beginning, the soul still sees shadows, not yet stirred by the revelation of the Word drawing near, and therefore the day of the Gospel was not yet shining for her. In the second, without the confusion of shadows, she gathers holy fragrances. In the third, now perfect, she provides rest for the Word within herself, so that he may turn toward her and lay down his head and rest; and now, holding her reward, she invites him whom she had sought before and could not find to her field, saying:

Come, my brother, let us go out into the field, let us rest in the villages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
I am my beloved's, and my beloved is mine, who pastures among the lilies. It seems an easy and common saying, but it belongs to few. For rare enough is he who can say: I am my beloved's, and my beloved is mine. What is it to say: I am yours? For he says it who cleaves to God with all his senses, who knows not how to think of anything else; he uses this saying who can say to the Lord: Show us the Father, and it is enough for us (John 14:8). Does the man greedy for money, for honor, for power use this saying? For many it is not enough to know God, and indeed for most. So many peoples, so many nations, so many rich men think it poverty to serve the Lord; and he who is above all is to them meagre and narrow: for them the Son of God, in whom are all things, is not enough. Thus that rich man in the Gospel, to whom it was said: If you will be perfect, sell all that you have, and give to the poor (Matt. 19:21), judged that God was not sufficient for him. Thus he was even made sad, as though he were bidden to leave what was worth more and to choose what was worth less. He, then, says: I am yours, who can say: Behold, we have left all things, and have followed you (ibid. 27).

This is the voice of the apostles, and yet not of all the apostles; for Judas too was an apostle, and he reclined among the apostles at the banquet of Christ. He too used to say: I am yours; but with his voice, not with his heart. Satan came and entered into him, and began to say: He is not yours, Jesus, but he is mine. Indeed he thinks the things that are mine, he turns over in his breast the things that are mine: he feasts with you, and he feeds with me; from you he received bread, from me money; he drinks with you, and sells your blood to me; he is your apostle, and my hireling. The worldly man cannot say: I am yours; for he has many masters. Lust comes, and says: You are mine; because you desire the things that are of the body; in the love of that young girl you sold yourself to me; in lying with that harlot I counted out the price for you. Avarice comes, and says: The silver and gold that you have is the price of your servitude; the possession that you hold is the purchase of your rights, it is the sale of your liberty. Luxury comes, and says: You are mine; the banquet of one day is the price of your life; that outlay on feasts is the auction of your person, it is the sum of your contract. And what is worse, you were bought at a dear price, you are cheaper than your food: your table for one day is more precious than your life for all time; amid cups I redeemed you, amid feasts I acquired you. Ambition comes, and says to you: Plainly you are mine. Do you not know that I made you command others for this reason, that you yourself might serve me? Do you not know that I conferred power on you for this reason, that I might subject you to my power? Or are you unaware that it was said to the Lord the Savior himself by the prince of this world, when he had shown him all the kingdoms of the world: All these things I will give you, if you will fall down and worship me (Matt. 4:9)? He, then, who wishes to have others subject to him is himself subjected first. All the vices come, and each says: You are mine. How cheap a slave is he whom so many compete for! How then can you, who are of this kind, say to Christ: I am yours? He will answer you: Not everyone who says to me, Lord, Lord, shall enter into the kingdom of heaven (Matt. 7:21): not everyone who says to me: I am yours, is mine.

You are plainly mine, if your conscience does not refute your voice, if your mind or your works do not disprove your word. I do not deny that he is mine who does not deny himself, or at least who for my sake denies himself to himself. I do not want to have a little slave serving very many masters. For how is he mine, if he says to me in word: I am yours, and denies it by his works, and by his deeds adjudges and binds himself to the devil? He is not mine whom lust inflames, for chastity is mine; he is not mine whom the care of despoiling the lesser drives on, for generosity is mine; he is not mine whom the breeze of fickleness unsettles, for tranquillity is mine. He is not mine who is drunken with the surfeit of wine, unclean with the filth of ambition, greedy for worldly glory, drunk to the point of peril, who cannot keep the track of sober moderation. I am peace, I know not how to quarrel: why should I have him of whom the devil may come and say: He is mine; for he has bowed his neck to me, I find more of what is mine in him: he claims your name for himself, and my gift. No one, then, is Christ's but he who is a stranger to crime: no one is Christ's but he who can always show himself to be Christ's little servant.

I am my beloved's, and my beloved is mine, who pastures among the lilies. Among the beloved things of her beloved she seems to say: My secret is mine, my secret is mine. For in the ecstasy of her love she had understood certain hidden mysteries of the faith, which she judged were not to be divulged even to the daughters of Jerusalem themselves. It is good to hide the mystery of the king; for he sins against God who thinks that the mysteries entrusted to him are to be published to the unworthy. There is danger, therefore, not only in saying false things, but even in saying true things, if one imparts them to those to whom one ought not. This fault is fourfold: of flattery, or of avarice, or of boasting, or of incautious talkativeness; for while someone wishes to flatter the one to whom he speaks, he pours out the mystery; some too, from zeal for gain, pursue the wages of betrayal, so as to sell by speaking what should be covered by silence; others, that they may seem to know more and may boast of their knowledge, lay open what they ought to conceal; very many, while they speak without judgment, let slip a word that they cannot call back. Therefore a man is praised who is serious and not idle. There was a man who hid his words, like the apostle Paul, who knows what he should say to each, and when he ought to say what.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
