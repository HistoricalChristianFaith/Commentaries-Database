[[commentary]]
quote='''
And so, lest anyone may think that fasting is earthly or new, the first experience of the world began with fasting, when the clear light shone brightly; and the second day began with fasting, when the firmament of heaven was made. On the third day the earth produced food, nature offered its homage: yet the Wisdom of Heaven observed fasting. On the fourth day the lights of the sun and moon were made: and still there was fasting. On the fifth day the waters brought forth the creeping things of living creatures and the fowls over the earth under the firmament of heaven, and God saw that they are good. And God blessed them saying: Increase and multiply, and fill the waters which are in the sea, and let the fowls multiply upon the earth: and still there was fasting. And then He blessed them, it is written, and said: Increase; He did not say "partake of food and eat."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
