[[commentary]]
quote='''
It is a great and memorable benefit of God, and one especially foretold by the mouth of the prophet, which he conferred upon your fathers, that He redeemed them from usuries and iniquity. And rightly does he say He redeemed them from usuries, for usury brings slavery; as though he should say: Those rescued from the bond of slavery he has restored to liberty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 4"
