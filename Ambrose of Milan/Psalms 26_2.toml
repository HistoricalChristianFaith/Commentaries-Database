[[commentary]]
quote='''
David, it is true, had killed a man who was by no means guilty, but he had killed him not driven by any zeal for cruelty, but to overshadow his shame, to cover the disgrace of his desire. I do not dare to say that he was overwhelmed by the force of crime — for he was not overwhelmed who knew how to raise himself from that ruin of sin — but I do say that he was bent by the force of temptation. For he had said before: Prove me, O Lord, and try me; burn my reins and my heart, and elsewhere: But I said in my abundance: I shall not be moved for ever, and: You have examined me by fire, and iniquity has not been found in me. The Lord willed that he should be subject to temptation, lest he arrogate to himself anything beyond what is man's; for power is made perfect in weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
