[[commentary]]
quote='''
And Abraham hastened into the tent to Sarah and said to her: Make haste and knead three measures of fine flour and make cakes baked under the ashes. A good husband does not suffer his wife to be without a share in a religious service, nor does he greedily claim the whole service for himself. Rightly, then, the claims both of devotion and of modesty are kept. What belongs to devotion he wishes to be shared; what belongs to modesty remains intact for Sarah. Before the tent the husband watches for the arrival of guests; within the tent Sarah guards a woman's modesty and performs women's works with her modesty safe. Outside the husband invites; inside Sarah prepares the banquet. Nor does Abraham hasten only himself, but he also tells his wife that she must hasten, showing her to be a partner in devotion and not unequal in faith.

Knead he says three measures of fine flour and make cakes baked under the ashes. In Greek they are called ἐνκρύφια, that is, hidden, because every mystery ought to lie hidden and be covered, as it were, by a faithful silence, lest it be rashly divulged to profane ears. With this the divine majesty is fed; on this affection it feasts, the affection of one who is sparing of speech and does not bring sacred things into the open. And in brief Sarah teaches the mystery of faith, making three measures of one fine flour; she bears the type of the Church, to which it is said: Rejoice, barren one who do not bear, break forth and cry out, you who do not travail. For this is she who cherishes the faith in her inmost spirit, asserting the Trinity of the same Godhead, adoring the Father and the Son and the Holy Spirit with a certain equal measure and reverence, and celebrating them together in the unity of majesty, distinguishing them by the property of the persons. With this assertion of faith knead your devotion.

Let the woman offer fine flour, that is, the inner part of the spiritual wheat, or of that grain of which it was said that unless it falls into the earth it bears no fruit. Hence Mary too was the first to see the mystery of the Lord's resurrection, and she hastened to make known the message of sacred salvation, not indiscriminately to all, but to Peter and John alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
