[[commentary]]
quote='''
Hence David also says of himself, or he who spoke in the prophet: Pushed, I was overturned so that I should fall, and the Lord took me up; for Jesus did not fall, but was pushed. For since he himself turns back those who have been thrown down, how could he himself be thrown down?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
