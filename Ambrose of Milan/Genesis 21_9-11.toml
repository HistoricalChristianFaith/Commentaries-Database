[[commentary]]
quote='''
Envy quickly follows prosperity. Sarah had given birth, had weaned her son: she saw the son of the maidservant playing with her son Isaac, and she said to Abraham: cast out the maidservant and her son; for the son of the maidservant shall not be heir with my son Isaac. This seemed hard to Abraham, to cast out his own son, even if it was the one he had received from a home-born slave woman. You too, do not join yourself to a maidservant, lest you receive a son from her and your wife not endure that he should become co-heir with her son; for you see that from this the grace of marriage is dissolved. Certainly, if you have fallen into it and have a son, cast out the maidservant and her son; for it is better that the maidservant should depart than the wife, and that the maidservant's son should be cast out than the lawful one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
