[[commentary]]
quote='''
Behold, sixty mighty men round about her vine-shoot, armed with drawn swords, and trained in the disciplines of battle. Note who these are, strong and trained in the disciplines of battle. It belongs to a strong man, and a man of the Church, not to look away when something threatens, but to look ahead and, as it were, to scout from a kind of watchtower of the mind, and with provident thought to go to meet the things to come; lest perhaps he say afterwards: I fell into these things because I did not think they could happen. Then, unless adversities are scouted out, they quickly seize us. As in war an unforeseen enemy is scarcely withstood, and, if he finds men unprepared, easily overwhelms them, so evils not scouted out break the mind the more. In these two things, then, lies that excellence of mind: first, that your mind, exercised by good thoughts, should see with a pure heart what is true and honorable: Blessed indeed are the pure in heart, for they too shall see God: and should judge that which is honorable to be the only good. Next, that it be troubled by no occupations, toss on no desires.

Nor indeed does anyone do this easily: for what is so difficult as to look down, as from some citadel of wisdom, on riches and all the other things that seem great and lofty to most people? Next, to confirm your judgment by steady reason, and to despise what you have judged light, as being of no profit? Next, if anything adverse happens, and it is thought grave and bitter, to bear it so that you think nothing has happened beyond nature, when you read: Naked I was born, naked I shall go out: what the Lord gave, the Lord has also taken away (Job 1:21); and he had certainly lost both his sons and his means: and to keep in all things the character of the wise and just man, as he kept it who said: As it pleased the Lord, so has it been done; blessed be the name of the Lord (ibid.). And further on: You have spoken like one of the foolish women: if we have received good things from the hand of the Lord, shall we not endure the things that are evil (ibid. 2)?

It is, then, no mediocre fortitude of mind, nor one set apart from the rest, that wages war in company with the virtues; but one that alone defends the ornaments of all the virtues and guards their judgments, and that contends in implacable battle against all the vices, unconquered in labours, brave in dangers, sterner against pleasures, hard against allurements, to which she does not know how to lend an ear, nor (as the saying goes) to give them a greeting; that she neglect money and flee avarice as a kind of stain that makes virtue effeminate; for nothing is so contrary to fortitude as to be conquered by gain. Often, when the enemy has been driven off and the line of the adversaries turned to flight, the warrior, while he is caught by the spoils of the slain, has fallen pitiably among the very men he laid low: and legions cast down by their own triumphs, while they are busy with the spoils, have called back upon themselves the enemy who had fled.

Let fortitude, then, drive back and trample down so monstrous a plague; let it be neither tempted by desires nor broken by fear; for virtue is consistent with itself, so that it bravely pursues all vices as the poisons of virtue. Let it drive off anger, which takes away counsel, as if with weapons of a kind, and shun it as a sickness. Let it beware also of the craving for glory, which has often done harm when sought too immoderately, and always when usurped. For to be softened by flattery seems not only to be no part of fortitude, but even a mark of cowardice. Seeing the camp of these strong men in the spirit, Jacob says: This, he says, is the camp of God (Gen. 32:2).
'''
