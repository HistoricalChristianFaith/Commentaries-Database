[[commentary]]
quote='''
But why should I set out that slave's arrangements concerning a private house, when he governed an empire? Yet it is a greater thing that he first governed himself and, though he was comely in appearance and very handsome in face, did not divert the beauty of his countenance to another's injury but kept it for his own grace, thinking himself the more beautiful if he were shown to be more handsome not at the cost of chastity but by the cultivation of modesty. That, he thought, was true comeliness, which would not capture others' eyes nor wound frail minds, but would win the judgment of all, to be a harm to none and a praise to himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
