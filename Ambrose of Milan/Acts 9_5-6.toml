[[commentary]]
quote='''
Indeed, he who did not see Christ before he lost his eyes saw him after he had lost the sight of his eyes; for he saw, who said: Who are you, Lord (Acts 9:5)? He certainly saw Christ, whom he even confessed as Lord. And below: Lord, he says, what do you wish me to do? Did he not, then, see him whose command he was awaiting?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
