[[commentary]]
quote='''
Your hand utterly destroyed nations, and you planted them; you afflicted peoples and drove them out. We know indeed that the Lord uprooted and overthrew many nations, so that the people of the Jews might find a possession for itself, the lands of which nations the Lord declared he would give to the seed of Abraham. But since this psalm proclaims the Gospel of the Lord and the times of his coming, it seems to me not to recount what was done earlier by the Jews, but to mark out what was to come: how the people of the nations would believe. It confirms, then, the faith of the Church before it announces it, and recounts the victories of its devotion, which drove out savage nations not by its own arm nor by its own sword, and put hostile squadrons to flight not by warlike combat, but by gentleness and faith possessed the lands of its enemies without any bloodshed; for faith alone fought. And therefore it earned triumphs which unbelief could not reverse but only increase, because the Church of the Lord is not conquered by its persecutions, but proved. Let us learn, then, what these nations are which the Church has conquered. I speak old names, but new mysteries: they are the Canaanites, the Hittites and the Amorites, the Perizzites, and the rest whose names we will set out below. These are names of peoples, but they are the infirmities of the passions and the incitements and reproaches of human sins. What comes first, then, is this: man in Christ tamed himself and conquered himself, so as to live for himself; for he lives for himself who lives for God, so as to live the eternal life of Christ. The people of the Church, then, did not fight with military arms and iron weapons, as the people of the Jews fought. That people fought in figure, we fight in the spirit; that people fought against foreigners, we have a war within ourselves, and therefore the passions of our own body must first be conquered by us.

Hear the apostle Paul fighting against the nation of the Canaanites: I see, he says, a law of my flesh fighting against the law of my mind and making me captive in the law of sin. Now our flesh raises itself up, now it casts itself down; it raises itself against the mind, it casts itself down before power, and, when it sees itself pressed, it abandons its constancy and, ready for subjection, is led along in the law of sin, so as to abandon faith, succumb to unbelief and, under the sway of Hittite weakness, destitute of the truth, yield to falsehood, serve crime, acquiesce in error and, like an Amorite, speak bitter things instead of sweet; for faith is sweet, unbelief bitter. Hence Peter excellently expressed what faith is, saying: Lord, to whom shall we go? You have the words of eternal life, and we believe. How then do you bid us depart from you? For, captivated by the sweetness of the heavenly words, he did not wish to depart from Christ; but he who denies Christ separates himself, or is separated, from Christ. But neither the crafty disputation of the Amorites, which through philosophy leads some away from the truth, nor the base abjectness of the Jebusites, which subjects itself and lies down beneath those who run the worldly course, a course which cannot be perpetual but fails at the gates of death, from which the prophet David rejoices that he has been lifted up, nor the Kenite, who is possessed through his money, as the avaricious man is through his insatiable craving, nor the Kenizzite, who thinks that there is a perpetual possession in riches, sets a vain hope in perishable things and boasts himself in an empty opinion, nor the Rephaim, who professes to bring medicine to others when he cannot cure his own wounds. And therefore, if anyone takes refuge with a physician of this kind, he must first consume his whole patrimony before receiving any progress toward health, like that woman in the Gospel who for twelve years could not stanch the flowing blood of bodily pleasures, until after she took refuge with Christ. For she understood that no one is a perfect physician except him who had come down from heaven, of whom she had learned that it was said: He sent his word and healed them, and she noticed that it was said of him: Behold, I have given my words into your mouth and set you today over nations and kingdoms, to root up and to destroy and to ruin and to pull down and to plant. For although God has frequently spoken in the prophets, yet in whom has he spoken more expressly than in his own Son, who, expressing all the power of the Father, says: My doctrine is not mine, but his who sent me? Not Jeremiah, then, who underwent exile in the time of the captivity, but the Lord Jesus by his words rooted out the vices of the Gentiles from their inmost hearts, destroyed the unbelief of the nations and the depraved inventions of crafty thoughts, and abolished every trace of iniquity. Then afterwards he poured in faith and the discipline of continence, lest the sacraments of the virtues should turn sour in a confusion of vices, as in a tainted vessel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Hence the Apostle says to you beautifully: But death reigned from Adam to Moses. What is Moses but the Law, since he himself is the interpreter of the Law? But the end of the Law is Christ Jesus. Sin, then, reigned in this world, and in sin death, cruel and intolerable, a kind of punishment of sin. Moses indeed taught us to lift up our hands to the Lord, establishing the discipline of devout worship. He taught how Amalek the crafty-tongued was to be conquered: that we should lift up our conduct and our works to Christ; that thus unbelief could be destroyed; but if we were to cast down our soul, bend our affection and turn our mind away from the pursuit of continence, so that vain persuasion overcame us, there would be no remedy, unless Jesus raised up the already lowered arms of Moses, that is, the weakness of the Law, and sustained them by his mercy. But the help of the Law would still have been weak, had not Jesus himself come to earth, to take our infirmities upon himself, he alone whom our sins could not weigh down, nor could they bend his hands, who bent himself even unto death, and the death of the cross, on which, spreading out his hands, he raised up the whole world that was about to perish, lifted up those who lay low, and drew to himself the faith of all nations, saying to a man: Today you shall be with me in paradise. This, then, is to destroy and to plant: that vicious things are rooted out and better things planted in the hearts of each. Of this Moses says excellently in the song of Exodus: Bringing them in, plant them in the mountain of your inheritance, in your prepared dwelling, asking that the Lord would bring his people into those nurseries of lofty virtue and wisdom, and that there it should be planted for his works and instructed in the disciplines of the heavenly precepts, and that in it he should prepare for himself the dwelling of his sanctification, which the Lord deigns to confer surely not by hereditary right nor in consideration of our merits, but according to his grace. For how could we return to the place where we were unable to remain, unless upheld by the privilege of eternal redemption?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
