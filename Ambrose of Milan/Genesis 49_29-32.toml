[[commentary]]
quote='''
This man was truly most rich in the riches of simplicity and sincerity, comely with a greater beauty of soul than of body, a beauty that knows not how to fade, unwearied in age, one who could, when he wished, go out of this hovel of the body and pierce the heights of paradise by the vigour of his mind, exulting in spirit when he gave his last commands about his tomb. For he did not suppose that he was to be shut up in an earthly grave, but that he was to be received into a heavenly dwelling. And therefore he gave commands about the tomb as if for another, but, secure about himself, he thought that death to be immortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
