[[commentary]]
quote='''
But this is to flee from here: to die to the elements of this world, to hide one's life in God, to turn aside from corruptions, not to be defiled by desires, not to know the things that belong to this world, which lays various sorrows upon us, empties when it has filled, and fills when it has emptied. And all these things are void and empty, and in them there is no solid fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
