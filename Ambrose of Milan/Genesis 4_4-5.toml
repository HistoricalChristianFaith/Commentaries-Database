[[commentary]]
quote='''
The look of God, then, is our salvation, and in his countenance is our help. How great a force there is in it divine Scripture declares, which not idly added that God looked upon the gifts of Abel, but upon Cain he did not look; and therefore Cain was saddened, because he knew that his sacrifice had displeased God and his brother's had pleased him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
