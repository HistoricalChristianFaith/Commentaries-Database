[[commentary]]
quote='''
He has given [judgment to the Son], that is to say, not out of largess but in the act of generation. See, then, how unwilling God was that you should dishonor his Son—even to the point that he gave him to be your judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25202.html'
source_title="Exposition of the Christian Faith 2.12.100"
