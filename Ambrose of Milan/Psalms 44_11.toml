[[commentary]]
quote='''
There are also those who become sheep for food. Good is our Lord Jesus Christ, because he became the sheep of our feasting. Do you ask how he became so? Hear the one who says: Christ our passover has been sacrificed, and consider how our forefathers, in figure, tearing the lamb apart, ate it, signifying the Passion of the Lord Jesus, whose sacrament we feed on daily. Through that sheep, then, they became flocks of food, as Aquila said, or flocks for food, as Theodotion put it, or the pasture of those who eat, as Symmachus said. But a good feasting not only is not to be feared by the saints, but is even to be desired. For otherwise the kingdom of heaven cannot be reached, since the Lord himself has said: Unless you eat my flesh, you will not have eternal life. It is proved, then, that our Lord is the feasting or the nourishment of those who eat, as he himself says: I am the living bread who came down from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And so that you may know that all these things were done for our sake, from the time when he came down, from that time the saint says: We all are one bread. Let us not fear, then, because we have become sheep for food. For as the flesh of the Lord and his blood redeemed us, so Peter too endured much for the Church; much too did the holy apostle Paul and the other apostles suffer, when they were beaten with rods, when they were stoned, when they were thrust into prison. For by that endurance of injuries and experience of dangers the people of the Lord was founded, and the Church gained its increase, while the rest hastened to martyrdom, seeing that through those sufferings nothing had been taken away from the virtues of the apostles, but rather that in return for this short life immortality had been gained for them.

This the following verse also shows, for they said: Among the nations you have scattered us. Theodotion said the same; but Aquila and Symmachus: in the nations or among the nations you have winnowed us. For the holy apostles were sent to the nations and scattered among the nations, as were the holy prophets too, of whom we spoke above, so that in that scattering very much fruit might spring up. For as our Lord Jesus Christ fell into the earth like a grain and died, so as to bring forth much fruit, so too the holy apostles were scattered, so as to bring good seed among the nations, by which the fruit of the nations might sprout after their likeness. Indeed Scripture says that the Lord said this: For this reason I have sent you, that you may go and bring forth very much fruit, and that your fruit may remain. The Lord, then, became like a seed, according to what was said to Abraham: and to your seed, which is Christ. Christ, then, is the seed of all, and therefore he suffered himself to fall and be scattered, so as to transfigure the body of our lowliness into conformity with his own body. This saving seed, then, sprouted for all men, and from it the holy apostles, formed after his image like seeds, were sent through various places and scattered, so that the nations, gathered into the field of the Church, might shine with various fruits throughout the whole world. These, then, are called the scatterings, as the same David also says in a later passage: The Lord building Jerusalem and gathering the scatterings of Israel. For they were scattered so as to produce new fruits, and afterwards to be carried, like new wheat, into the granaries of the Church.

Now this scattering takes place not in the lower regions, that is, not on earth, but in heaven. Indeed the precepts of the Law confirm this, through which the Lord says: If your scattering be from the height of heaven even to the height of heaven, from there I will gather you, says the Lord. What is the scattering from the height of heaven even to the height of heaven? Who is this so great one, who could be sown in this way? If a man is born on earth, he began from the lowest, not from the highest. If these things trouble and disturb you, go back to the earlier words of this holy prophet and hear who that great one is who made harvests of this kind fruitful on earth, so that their fruit reached the heavenly storehouses. It is that bridegroom who like a giant ran through this whole way, impassable to others, passable to himself; and from him it began to be passable now to mortals, yet so that, while these were to ascend, he himself alone came down first, so that afterwards his saints might merit to ascend. Hear, then, how the sowing was from the height of heaven to the height of heaven: From the highest, he says, heaven is his going forth, and his meeting even to its height. To what man could this be attributed? Moses scarcely ascended to the top of Mount Sinai, and that because he was called by the Lord and urged on by a heavenly voice. Who would come down from the highest heaven but Christ, who, even when he came down to earth, remained in heaven? For no one has ascended into heaven but he who came down from heaven, the Son of Man who is in heaven. You see, then, that both when he came down and when he ascended, he himself was in heaven and remained there. For he himself said: I fill heaven and earth, says the Lord; he it is who is in heaven. Let this suffice to have been said about the scattering.

As for his saying: you have winnowed us, though it differs in the word, it agrees in the sense. For as those who were scattered were proved, so too those who were winnowed merited to come to approval. For as wheat is winnowed and separated from the chaff and is clean, but if it has not been winnowed it cannot be clean, but stands caked and mixed with chaff, so too man, unless he has been winnowed by temptations, cannot separate from himself whatever is frail, or the chaff. Hence too it was said to Peter: Simon, behold, Satan has demanded to winnow you like wheat; but I have asked my Father that your faith may not fail. See what he says and understand: Peter is winnowed, so that he is driven to deny Christ. He fell into temptations; he spoke certain words as if full of chaff, but he spoke them with his word, so as to be more firmly founded in his affection. Indeed he wept and washed his chaff, and by those temptations he merited that Christ should intercede for him. How much greater is the patronage than the trial of that disturbance! And therefore he gained more than he suffered; for he gained Christ as his patron. But the adversary is driven to tempt the saints of the Lord to his own loss; for while he tempts, he makes them better, so that he who is tempted, who seemed weak in himself, can instruct others too. Indeed Peter is set over the Church after he was tempted by the devil. And therefore the Lord signifies beforehand what it means that afterwards he chose him as shepherd of the Lord's flock. For here he said: But you, when you have turned, confirm your brothers. The holy apostle Peter, then, turned to good fruit and was winnowed like wheat, so as to be himself, with the saints of the Lord, one bread, to be nourishment for us. For while we read the acts of Peter and learn the precepts of Peter, there comes to be for us a nourishment of eternal life and salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
