[[commentary]]
quote='''
He pronounces it to be foreign to the character of a preacher of the heavenly kingdom to run from house to house and change the rights of inviolable hospitality; but as the grace of hospitality is supposed to be offered, so also if they are not received the dust must be shaken off, and they are commanded to depart from the city; as it follows, And whosoever will not receive you when ye go out of that city, shake off the very dust from your feet for a testimony, &c.

Or it is a great return of hospitality which is here taught, i. e. that we should not only wish peace to our hosts, but also if any faults of earthly infirmity obscure them, they should be removed by receiving the footsteps of apostolical preaching.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
To them, first of all, is given the general command of peace and constancy: that they bring peace, keep constancy, guard the rights of the bond of hospitality; for he declares that it is foreign to a preacher of the heavenly kingdom to run about from house to house and to change the rights of inviolable hospitality. But just as the favor of hospitality is held to be something to be offered, so too, if they are not received, they are commanded to shake off the dust and to go out of the city. By this is taught the reward of the no small good of hospitality: that not only do we grant peace to our hosts, but also, if any offences of earthly fickleness overshadow them, these are taken away when the footsteps of apostolic preaching are received. And not idly, according to Matthew, is it decreed that the house which the apostles enter is to be chosen, so that there may be no cause for changing lodging and violating the bond. Yet the same caution is not enjoined on the one who gives hospitality, lest, while a guest is being chosen, hospitality itself be lessened.

But as, according to the letter, this is a venerable form of precept concerning the sacredness of hospitality, so also concerning the mystery a heavenly meaning smiles on us. For when a house is chosen, a worthy host is sought. Let us see whether perhaps the Church is meant as the one to be preferred, and Christ. For what house is more worthy of the entrance of apostolic preaching than the holy Church? Or who seems more to be preferred to all than Christ, who is wont to wash the feet of his guests, and does not allow whomever he has received into his house to dwell with soiled footsteps, but deigns to cleanse their steps, though stained by their former life, for the rest of their way? He alone, then, is the one whom no one ought to forsake, no one to exchange, to whom it is well said: Lord, to whom shall we go? You have the words of eternal life, and we believe. You see the performer of the heavenly precepts, who, because he did not change his lodging, earned fellowship in heavenly consecration.

We are commanded, then, first of all to seek out the faith of the Church; if Christ is going to dwell in her, she is without doubt to be chosen. But if an unbelieving people or a heretical teacher disfigures the dwelling, we are told that the communion of heretics is to be avoided, the synagogue fled. The dust of the feet must be shaken off, lest the footprint of your mind be defiled by the crumbling droughts of barren unbelief, as by dry and sandy ground. For just as the preacher of the Gospel ought to take upon himself the bodily infirmities of the faithful people, and, as with his own footprints, to lift up and wipe out their empty deeds, comparable to dust, according to what is written: who is weak, and I am not weak? — so, if there is any church which rejects the faith and does not possess the foundations of apostolic preaching, it must be forsaken, lest it be able to sprinkle on us any stain of unbelief. This the Apostle too clearly asserted, saying: avoid a heretical man after one correction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
