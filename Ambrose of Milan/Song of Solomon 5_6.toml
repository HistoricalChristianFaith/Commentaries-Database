[[commentary]]
quote='''
"I opened to my beloved, but my beloved had gone." What is this going? Simply that he has penetrated into the center of the mind as it was said to Mary, "And his sword will pierce your soul." For the living Word of God, as piercing as a sharp sword, comprehends both the limits of bodily thoughts and the secret places of the heart.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 11:67"

[[commentary]]
quote='''
Next, at once, there is another advance of the passing Word, because the soul went out at his word, that is, following his word she went out from the body, raising herself from its dwelling and making herself a stranger to it, that she might be present with God and be a fellow citizen of the saints; for we cannot at the same time be of the household of the flesh and of God. Therefore in this place the soul is said, as I said, to go out when she withdraws herself from the pleasures of the body. Indeed it is written: Go out from Babylon, fleeing from the Chaldaeans. The Hebrew is admonished by the prophetic address to flee, not of course the regions of Babylon, but its ways, since there are Hebrews who are in Babylon and yet show by their ways that they have gone out from Babylon. For those too of whom the prophet says that they sat by the rivers of Babylon were indeed sitting in the region of Babylon, but they were not in its vices and confusion. For how were they in that confusion of vices who wept, doing penance because they had fallen from the ark of devotion and faith and from the merits of their fathers' virtue? But the soul that goes out in the Word seeks the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"
