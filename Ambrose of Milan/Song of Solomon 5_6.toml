[[commentary]]
quote='''
"I opened to my beloved, but my beloved had gone." What is this going? Simply that he has penetrated into the center of the mind as it was said to Mary, "And his sword will pierce your soul." For the living Word of God, as piercing as a sharp sword, comprehends both the limits of bodily thoughts and the secret places of the heart.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 11:67"

[[commentary]]
quote='''
Next, at once, there is another advance of the passing Word, because the soul went out at his word, that is, following his word she went out from the body, raising herself from its dwelling and making herself a stranger to it, that she might be present with God and be a fellow citizen of the saints; for we cannot at the same time be of the household of the flesh and of God. Therefore in this place the soul is said, as I said, to go out when she withdraws herself from the pleasures of the body. Indeed it is written: Go out from Babylon, fleeing from the Chaldaeans. The Hebrew is admonished by the prophetic address to flee, not of course the regions of Babylon, but its ways, since there are Hebrews who are in Babylon and yet show by their ways that they have gone out from Babylon. For those too of whom the prophet says that they sat by the rivers of Babylon were indeed sitting in the region of Babylon, but they were not in its vices and confusion. For how were they in that confusion of vices who wept, doing penance because they had fallen from the ark of devotion and faith and from the merits of their fathers' virtue? But the soul that goes out in the Word seeks the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
I opened, she says, to my brother; my brother passed. How he passed: that is, he penetrated the inner parts of the mind, as was said to Mary: And a sword shall pass through your own soul. For the living word of God, like a sharp sword, penetrating the bars of bodily thoughts, searches out the inner parts of the heart. Placed, then, on your bed and in the time of night, meditate always on Christ, and hope for his coming at every moment. If he seems to you to delay, rise up. He seems to delay when you sleep long; he seems to delay when you are idle from prayer; he seems to delay when you do not lift up your voice in psalms. Dedicate to Christ the firstfruits of your vigils; offer to Christ the firstfruits of your actions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
And so, when, as if from her embrace, she was already stretching out her intelligible hands and fingers to grasp the Word, the devout soul says that it had passed her, but had not yet passed through her. And this is the progress there is when the Word of God passes and passes through the soul, for it is written: And a sword shall pass through your own soul, that the thoughts of many hearts may be revealed (Luke 2:35). Here, then, there is still a passing, not a passing through; so that, as in Mary, there is perhaps a passing through in what follows, where the Lord Jesus is set as a seal in her midst.

Then at once there is another progress of the Word passing through, because the soul went out in his Word: that is, following his Word, she went out from the body, lifting herself from its dwelling and making herself a stranger to it, so that she might be present to God and be a citizen with the saints. For we cannot be at once members of the household of the flesh and of God. In this place, then, as I have said, the soul is signified to go out when she withdraws herself from the pleasures of the body. Accordingly it is written: Go out from Babylon, fleeing from the Chaldeans (Isa. 48:20). Not, certainly, that the Hebrew should flee the regions of Babylon, but its ways, as he is admonished by the prophet's address; since there are Hebrews who are in Babylon and yet show by their ways that they have gone out of Babylon. For those too of whom the prophet says that they sat upon the rivers of Babylon (Ps. 136 (137):1) sat indeed in the region of Babylon, but were not in its vices and confusion. For how were they in that confusion of vices, who wept, doing penance because they had fallen from the ark of devotion and faith and from the merits of their fathers' virtue? But the soul that goes out in the word seeks the Word; hence she too, while she was seeking, fell in with the watchmen who go about the city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
There, then, daughters, let us seek Christ, where the Church seeks him: on the mountains of good fragrance, which, by the loftiness of their exalted deeds, breathe forth the sweet fragrance of life from the summits of their merits. She who seeks Christ must not be common, must not be in the market place, nor in the streets, with a plaintive voice, a slippery step, easy of access, cheap in appearance. The Apostle denies you earthly company, and teaches that you must fly away to heaven on spiritual wings, almost beyond the bounds of nature. Mind, he says, the things that are above, not those upon the earth (Col. 3:2). But because this was impossible for those shut up in this enclosure, as it were, of the body, and because the soul is said to fly back to higher things when bodies have died, being bound while we live by a certain law of our nature, therefore he added: For you are dead, and your life is hidden with Christ in God (ibid. 3). If it is hidden with Christ in God, let it not appear to the world; for Christ died to the world, he lives to God. See now how Christ loves to be desired, does not love idle talk. That virgin opened her doors to the Word of God; but he passed, she says, and my soul went out in his word. She went out from the world, she went out from the age, she remained in Christ. I sought him, she says, and did not find him. For Christ loves to be sought long.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
