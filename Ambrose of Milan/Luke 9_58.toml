[[commentary]]
quote='''
Let a man, as far as he can, show a sincere faith and keep the observance of the commandments with a religious mind, lest it be said to him: the foxes have holes. For it is a deceitful animal, always intent on ambushes, and it practices the plunder of fraud. It allows nothing to be safe, nothing to be at rest, nothing to be secure, since it seeks its prey among the very dwellings of men.

Now he compares heretics to foxes. Indeed, when he calls the Gentiles, he shuts out the heretics; for the fox is an animal full of fraud, preparing a hole and always desiring to lurk in the hole. So are the heretics, who do not know how to prepare a house for themselves, but try to deceive others with their trickeries. Jacob dwells in a house; the heretic is in a hole, like the fraudulent fox always plotting a snare for that hen of the Gospel, of which it is written: how often would I have gathered your children as a hen her chickens, and you would not? Behold, your house will be left to you desolate. Rightly, therefore, do they have holes, because they have lost the house they had had. This animal is never tamed, whence the Apostle too says: avoid a heretic after one rebuke; nor is it of any use or good for food; for it is not of this that Christ says: my food is to do the will of my Father who is in heaven. Indeed he even banishes them from his fruits, saying: take for us the little foxes that destroy the vineyards, that is, those that destroy the lesser vineyard, not the greater. And therefore Samson tied torches to their tails and let them loose into the harvests of the foreigners, because heretics try to burn up the fruits of others, more resonant with barking than polished in speech — for he who denies the Word has no voice either —, free of mouth for the present, but for the future, their end already bound, signifying by the torches of the tail the burning of their own end.

The birds of the air too, which are often drawn into a likeness of spiritual wickedness, build as it were certain nests in the hearts of the wicked; and therefore the Son of Man, because iniquity has abounded, has nowhere to lay his head. For when cunning holds sway, since there is no room for simplicity, the divinity can have no possession in the affections of individual men. For the head of Christ is God, who, when he has found a mind innocent, in a manner lays upon it the weight of his majesty, which seems to be a sign that a more abundant grace is implanted in the hearts of the good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
