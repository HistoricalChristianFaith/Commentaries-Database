[[commentary]]
quote='''
With what affection shall I honour you, loving pledges of a holy mother? With what brush of my speech shall I portray the likeness of your form and of your souls? You stood amid the royal armies by which the whole world had been subdued, which India too shunned, fleeing into the secret places of the farthest sea, and you alone brought back victory over a proud king without warlike conflict. In you the arms of devotion alone conquered; the tyrant paid the penalty, both because he could not conquer you and because he was destroyed by a dreadful death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 12"
