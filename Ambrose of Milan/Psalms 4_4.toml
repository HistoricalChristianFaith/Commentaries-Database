[[commentary]]
quote='''
He is not commanding us to be angry but making allowances for human nature. The anger that we cannot help feeling we can at least moderate. So, even if we are angry, our emotions may be stirred in accordance with nature, but we must not sin, contrary to nature. If someone cannot govern himself, it is intolerable that he should undertake to govern others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FEpistle%252063.html'
source_title="LETTER 63:60"


[[commentary]]
quote='''
Let there be a door to your mouth, that it may be shut when need arises, and let it be carefully barred, that none may rouse your voice to anger, and you pay back abuse with abuse. You have heard it read today: "Be angry, and sin not." Therefore although we are angry (this arising from the motions of our nature, not of our will), let us not utter with our mouth one evil word, lest we fall into sin; but let there be a yoke and a balance to your words, that is, humility and moderation, that your tongue may be subject to your mind. Let it be held in check with a tight rein; let it have its own means of restraint, whereby it can be recalled to moderation; let it utter words tried by the scales of justice, that there may be seriousness in our meaning, weight in our speech and due measure in our words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FON%2520THE%2520DUTIES%2520OF%2520THE%2520CLERGY%2FBook%25201.html'
source_title="On the Duties of the Clergy 1.3.13"


[[commentary]]
quote='''
It is said that the greatest of the philosophers granted immunity from punishment to those crimes that had been committed through anger, but the divine Scripture says better: "Be angry, and sin not." It preferred rather to cut off sin than to excuse it. It is better to find praise for mercy in an occasion for indignation than to be incited by wrath toward vengeance.
'''
source_url=''
source_title="ON THE DEATH OF THEODOSIUS 14"

[[commentary]]
quote='''
Now the most grievous passion of guilt is concupiscence, which reason softens and represses. For it can soften it; it cannot root it out, since the soul that is capable of reason is not the master of its passions but their restrainer. For it cannot be that one who is quick to anger should not be angry, but only that he should temper himself by reason, check his indignation and hold himself back from punishing, as the prophet too teaches us, saying: Be angry and do not sin. He granted what belongs to nature; he forbade what belongs to guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 1"

[[commentary]]
quote='''
But what is more full of tribulation than when the very bed, given for common rest, inflicts a grievous wound? For then we are wont to recall what we have done, and the conscience within is pierced by the goads of its own deeds. Hence Scripture too says to such men: What you say in your hearts, be pierced for it also on your beds? It is indeed the remedy of a debt, but still it has wounded the conscience.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 3"
