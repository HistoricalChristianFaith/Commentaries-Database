[[commentary]]
quote='''
And would that our discourse too might close with the end of the Gospel!

Why, according to Matthew and Mark, does he command the disciples: I will go before you into Galilee; there you will see me, but according to Luke and John he offered himself to be seen even within a closed room? And indeed that he often offered himself to be seen, both to more than five hundred brothers and to Peter and James, we have proved also by the testimony of the Apostle, and Luke taught in the Acts of the Apostles that he showed the disciples that he was alive after his Passion, appearing to them in many proofs and discussing the kingdom of God. Therefore, because he appeared quite often and to different persons, since Scripture has by no means marked a prescribed and defined time when he was seen in Galilee, while it has expressed both the day and the hour when he offered himself in Jerusalem, the more timid were visited within closed rooms, the stronger gathered at the mountain.

Indeed John presents the disciples gathered within a closed room, the doors shut, for fear of the Jews, which Luke wrote were not eleven but more. But Matthew did not keep silent that these eleven alone met in Galilee. Indeed so you have: But the eleven disciples went into Galilee, to the mountain where Jesus had appointed them, and seeing him they worshiped, but some doubted. To them he gave the power of teaching and baptizing. Mark too writes at the end that he appeared to the eleven disciples as they sat at table, when likewise he commands them the office of preaching throughout the whole world.

Hence I think this more fitting: that the Lord did indeed command the disciples to see him in Galilee, but that he offered himself first to them while they stayed within the closed room through fear, and that afterwards, their minds having been strengthened, those eleven made for Galilee. Or certainly — I find that this too has pleased careful writers — nothing prevents us from saying that there were fewer within the closed room, and very many on the mountain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
