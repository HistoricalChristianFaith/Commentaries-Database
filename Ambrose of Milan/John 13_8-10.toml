[[commentary]]
quote='''
Our iniquity is one thing, that of our heel another, in which Adam was wounded by the serpent's tooth and left the inheritance of the human succession liable to his wound, so that we all limp from that wound. Hence the Lord washed his disciples' feet, to wash away the serpent's poisons, and Peter is rebuked because he was excusing himself, so that the Lord should not wash his feet. And therefore it was said to him: Unless I wash your feet, you will have no part with me. On hearing this he offered not only his feet but also his hands to be washed. To him the Lord answered: He who has been washed has no need to wash again, except to wash his feet, but he is wholly clean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
