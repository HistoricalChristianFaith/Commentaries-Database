[[commentary]]
quote='''
When my enemies, he says, were setting the signs of their iniquity above the summit — what is the summit but your head, where the senses are, where Christ is wisdom? — I did not know, that is, I did not acquiesce, I did not consent to them and join the verdict of my thought to theirs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
