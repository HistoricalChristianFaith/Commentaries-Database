[[commentary]]
quote='''
But Peter distinguished not only by earnest feeling, but also by devout deeds, wishing like a zealous workman to build three tabernacles, offers the service of their united labour; for it follows, Let us make three tabernacles, one for thee, &c.

Nor does the condition of man in this corruptible body allow of making a tabernacle to God, whether in the soul or in the body, or in any other place; and although he knew not what he said, yet a service was offered which not by any deliberate forwardness, but its premature devotion, receives in abundance the fruits of piety. For his ignorance was part of his condition, his offer of devotion.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It is good he says for us to be here — hence that other also says: for to be dissolved and to be with Christ is far better — and, not content to have praised it, more excellent not only in affection but also in devotion of deeds, a ready workman, he promises the service of common obedience to build three tabernacles. And although he did not know what he was saying, yet he promised a duty by which not thoughtless forwardness but premature devotion heaps up the fruits of dutiful love. For that he did not know belonged to his condition; that he promised belonged to his devotion. But the human condition does not permit, in this corruptible, in this mortal body, the making of a tabernacle for God. Whether in the mind or in the body or in some other place, shun seeking what it is not lawful to know. If Peter did not know, how can you know? If he who made the promise, and who by the greatness of his mind knew nothing of the limits of the body, did not know, how can we know, shut in within the enclosure of the flesh by a certain sloth of mind? In the end, such great devotion pleased God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
