
[[commentary]]
quote='''
His hands are turned, golden, full of hyacinths. See what hands made man, and what man they made! That man, surely, Whom we have put on according to Christ, stripping off the old man with his deeds, and putting on the new, who is renewed unto knowledge according to the image of him who created him: where there is not slave and free, but Christ is all and in all (Col. 3:9–11). We have put on Christ, then, as it is said elsewhere too: You have put on Christ (Gal. 3:27). We have received the Holy Spirit, who not only forgives our sins, but also makes us his priests to forgive the sins of others. Therefore the Prophet says: You have formed me and laid your hand upon me (Ps. 138 (139):5): he formed me through clay, he laid his hand on me through spiritual grace; although many take this psalm as spoken in the person of the Savior. Hear that the hand of the Lord is also called spirit: Job cries out: The divine Spirit who made me (Job 33:4). These, then, are the hands that prepared man: Christ and the Spirit.

Therefore the Lord Jesus is also the author of our body, he who first made man to the image, and afterwards formed him from clay, and willed to save what he had made, to save what he had fashioned, so that he might make the whole man safe. These are the turned hands of God, that is, perfect: golden because of wisdom, who is Christ; full of hyacinths because of the Holy Spirit and the fullness of his gifts of grace.

His belly is of ivory, studded with sapphires. The Apostle: Even if, he says, he was crucified out of weakness: behold the belly, that is, the weakness of the flesh; yet he lives by the power of God (2 Cor. 13:4): behold the studding of sapphire. For the sapphire, because it bears the appearance of the clear sky, signifies the works of divinity. But ivory [the edition prints "onir", evidently corrupt; the verse and the sense call for ivory], because of its chastity, brightness and lastingness, signifies that flesh of the Savior of which the same Apostle says: That even if we have known Christ according to the flesh, yet now we know him no longer (2 Cor. 5:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
