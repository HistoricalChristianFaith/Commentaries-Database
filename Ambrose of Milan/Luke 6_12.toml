[[commentary]]
quote='''
Let not thy ears be open to deceit, that thou shouldest think that the Son of God prays from want of strength, that He may obtain what He could not perform; for being Himself the Author of power, the Master of obedience, He leads us by His own example to the precepts of virtue.

Every where also He prays alone, for human wishes comprehend not the wisdom of God; and no one can be a partaker of the secrets of Christ. But not every one who prays ascends a mountain, he only who prays advancing from earthly things to higher, who is not anxious for the riches or honours of the world. All whose minds are raised above the world ascend the mountain. In the Gospel therefore you will find, that the disciples alone ascend the mountain with the Lord. But thou, O Christian, hast now the character given, the form prescribed which thou shouldest imitate; as it follows, And he continued all night in prayer to God. For what oughtest thou to do for thy salvation, when Christ continues all night in prayer for thee?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And it came to pass in those days, he went out onto the mountain to pray, and he was spending the night in the prayer of God. Not everyone who prays goes up the mountain — for there is a prayer which makes sin — but he who prays well, advancing from earthly things to higher, goes up to the summit of lofty care. But he does not go up the mountain who is anxious about the riches of the world or about honour; he does not go up the mountain who desires the right to another's estate. He goes up who seeks God, he goes up who asks the Lord's help for his course. All the great, all the lofty go up the mountain; for not to just anyone does the prophet say: Go up onto a high mountain, you who bring good tidings to Zion; lift up your voice in strength, you who bring good tidings to Jerusalem. Not by bodily steps but by loftier deeds may you go up this mountain. Follow Christ, that you yourself may be a mountain; mountains indeed are round about him. Search in the gospel: you will find that only the disciples went up the mountain with the Lord.

The Lord prays, then, not to beseech for himself but to obtain for me; for although the Father has put all things in the power of the Son, yet the Son, to fulfil the form of man, judges that the Father must be besought for us, because he is our advocate. Do not open treacherous ears, so as to think that the Son asks as one weak, asks so that he may obtain what he, the author of power, could not fulfil. The master of obedience shapes us by his own example to the precepts of virtue. We have an advocate he says with the Father. If he is an advocate, he ought to intercede for my sins. Not then as one weak, but as one full of loving-kindness does he beseech. Do you wish to know how he can do all that he wills? He is both advocate and judge. In the one is the office of loving-kindness, in the other the mark of power.

And he was he says spending the night in the prayer of God. A pattern is given you, a form is prescribed which you ought to emulate. For what ought you to do for your own salvation, when Christ spends the night in prayer for you? What befits you to do when you wish to undertake some office of devotion, when Christ, about to send the apostles, prayed first and prayed alone? Nor is he found anywhere else, if I am not mistaken, to have prayed with the apostles: everywhere he beseeches alone; for human prayers do not grasp the counsel of God, nor can anyone be a sharer with Christ in his inner things. Do you wish to know how he prayed for me, not for himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
