[[commentary]]
quote='''
And he sent away his brothers, and they departed. And Joseph said to them: Do not be angry on the way. How well he teaches that we must beware of anger, since it can separate even brothers who love one another, and that discord must above all be shunned on the way, where the very companionship of the journey ought to hold the fellowship of inviolable grace! But what else did our Lord Jesus say, when he was about to depart from this body and dismissed his disciples, but that they should not be angry on the way, when he said: Peace I leave you, my peace I give you? For where there is peace, anger has no place, discord is banished, dissension is put to flight. This, then, is what he says: My peace I give you, that is, Do not be angry on the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
