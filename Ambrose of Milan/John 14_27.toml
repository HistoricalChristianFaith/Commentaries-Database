[[commentary]]
quote='''
And he sent away his brothers, and they departed. And Joseph said to them: Do not be angry on the way. How well he teaches that we must beware of anger, since it can separate even brothers who love one another, and that discord must above all be shunned on the way, where the very companionship of the journey ought to hold the fellowship of inviolable grace! But what else did our Lord Jesus say, when he was about to depart from this body and dismissed his disciples, but that they should not be angry on the way, when he said: Peace I leave you, my peace I give you? For where there is peace, anger has no place, discord is banished, dissension is put to flight. This, then, is what he says: My peace I give you, that is, Do not be angry on the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"

[[commentary]]
quote='''
Perfect virtue has the tranquillity and stability of rest; therefore the Lord reserved its gift for the more perfect, saying: My peace I leave you, my peace I give you. For it belongs to the perfect not to be easily moved by worldly things, not to be disturbed by fear, not to be agitated by suspicion, not to be shaken by terror, not to be troubled by pain, but, as if on a most safe shore, to keep the mind unmoved and calm in a faithful anchorage against the rising waves of the storms of the world. This firm support Christ brought into Christian minds, bringing inner peace into the souls of the approved, so that our heart may not be troubled nor our soul agitated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 6"

[[commentary]]
quote='''
And do not let it trouble you that he has placed peace in evil. Indeed, in the Gospel too you have it that there is a peace which Christ rejects, as he himself says: My peace I leave you, my peace I give you: not as the world gives do I give to you. For there is a peace that has no stumbling block, and there is one that has. That which comes from love has no stumbling block; that which comes from pretence has. Therefore the prophet too says: Peace, peace; and where is peace? Let us flee, then, the peace of sinners; for they conspire against the innocent, they band together to oppress the just man, to destroy the widow or to storm her chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 3"
