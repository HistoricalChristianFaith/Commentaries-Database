[[commentary]]
quote='''
But it is a great thing to follow up this example in faith. For to the birds of the air who have no labour of tilling, no produce from the fruitfulness of crops, Divine Providence grants an unfailing sustenance. It is true then that the cause of our poverty seems to be covetousness. For they have for this reason a toilless and abundant use of food, because they think not of claiming to themselves by any special right fruits given for common food. We have lost what things were common by claiming them as our own. For neither is any thing a man's own, where nothing is perpetual, nor is supply certain when the end is uncertain.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Consider he says the birds of the sky. A great example truly, and a fitting one for us to follow by faith. For if divine providence bestows unfailing nourishment on the birds of the sky, which have no practice of tilling, no yield from the fruitfulness of harvests, it is true that avarice appears to be the cause of our want. For they have the use of unlabored fodder in abundance for this reason, that they do not know how to claim by a special ownership the fruits given to them for common food; we have lost the common things while we claim things as our own; for nothing is one's own where nothing is perpetual, nor is plenty certain where the outcome is uncertain. For why should you set value on your riches, when God willed that even your sustenance should be common with the other living creatures? The birds of the sky claim nothing as their special own, and therefore they do not know how to lack food, because they know not how to envy others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
