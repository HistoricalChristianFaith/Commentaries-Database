[[commentary]]
quote='''
How great are the mysteries, since there is the Church of God, in which God appears and speaks with his humble servants! There the idols of the Gentiles are snatched away and hidden; for the faith of the Church has abolished every observance of paganism. But I ask why he hid them under the lentisk. Certainly that kind of tree is unfruitful. There, then, are the gods of the Gentiles, where there is no fruit. There the earrings of the Gentiles are buried, which they gave to Jacob, so that they may now grow accustomed to hear a new language and know nothing of the old sound of unbelief, that their ears may grow deaf to sacrilege and be cleansed for grace. Not undeservedly did holy Daniel there detect the false testimony against Susanna. For there unbelief still wished to set its roots, but it could not lie hidden, because it was detected by the prophetic spirit. And the error of the elder was in keeping with the true confession, in that he said chastity had been defiled there where the idols of the Gentiles were buried; but the truth of the Church did not cover over unbelief: it hid it away, and stopped up the ears of paganism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 7"
