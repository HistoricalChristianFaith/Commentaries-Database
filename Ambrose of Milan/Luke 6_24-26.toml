[[commentary]]
quote='''
And mark, that Matthew by rewards called the people to virtue and faith, but Luke also frightened them from their sins and iniquities by the denunciation of future punishment.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Here, however, we can understand by the rich the people of the Jews, or the heretics, or certainly the philosophers of the world, who, delighted with an abundance of words and a certain patrimony of ambitious eloquence, overstepping the simplicity of true faith, have laid up useless treasures. Does not some heretic seem so to you, when you hear him disputing about the generation of the Lord according to the usage of the world, rich in words, poor in strength? He thinks he has abundant riches at this time, but in the future he will recognize the poverty of his faith, and, wasted away by the eternal fast of faith, he will know that the food of unbelief which he belched forth in the present age is the cause of so great a punishment. And the time will come when those who now laugh at our words will mourn their laughter. To them it is well said: Woe, when all men speak well of you!

Does he not seem to you to say this to those who lately at the Council of Ariminum, authors of an unbelieving betrayal, while they followed the favour of the emperor, lost the grace of God? While they hunt for ways to please the powerful, they have subjected themselves to a perpetual curse.

So Saint Matthew called the peoples to virtue and faith by rewards; this one also deterred them from crimes and sins by the announcement of future punishments, he who, advancing not idly through the enumeration of many heavenly deeds, came later to the place of the blessings, that he might teach the peoples, strengthened by the miracles of divine things, to advance beyond the path of the Law in the footsteps of the virtues. There caution may have been needed, where the hearts of a still weak people were wavering; here virtue had to be roused by the blast of the trumpet. This is taught by the discourse of this book, which is laid open in its prefaces and in the progress of its speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
