[[commentary]]
quote='''
While she is being praised by the bridegroom, she modestly shrinks from being praised to her face; then, called back by the bridegroom's love, she says: I went down into the garden of nuts to see in the birth of the torrent. For where is the Church but where the rod and the priestly grace flower? There she often is, that she may be tested in bitternesses and temptations. By the nut we understand bitternesses, by the torrent temptations, but such as can be borne, for it is written: Our soul has passed through the torrent. And so she goes down into the place of bitterness, where the vine flowers, and the fruit, diverse and manifold in the form of pomegranates, which, as under one covering for the whole body, is protected by faith and love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
