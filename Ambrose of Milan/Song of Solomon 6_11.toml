[[commentary]]
quote='''
While she is being praised by the bridegroom, she modestly shrinks from being praised to her face; then, called back by the bridegroom's love, she says: I went down into the garden of nuts to see in the birth of the torrent. For where is the Church but where the rod and the priestly grace flower? There she often is, that she may be tested in bitternesses and temptations. By the nut we understand bitternesses, by the torrent temptations, but such as can be borne, for it is written: Our soul has passed through the torrent. And so she goes down into the place of bitterness, where the vine flowers, and the fruit, diverse and manifold in the form of pomegranates, which, as under one covering for the whole body, is protected by faith and love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
I went down into the garden of nuts, to see in the birth of the torrent, and to look whether the vine had flowered, and the pomegranates had budded. The Word of God, then, is invited into the garden of nuts, in which is the fruit of prophetic reading and the priestly grace, which is bitter in temptations, hard in labors, fruitful in the inner virtues. Hence also the rod of Aaron, of nut wood, blossomed, no longer by its own nature, but by a hidden power. Let him go down, then, into the garden, that he may gather the vintage of faith, take in the fragrances, find heavenly pasture, feast on the sweetness of our honey.

For while she is praised by the Bridegroom, she modestly shrinks from being praised in his presence; then, called back by the bridegroom's love, she says: I went down into the garden of nuts to see in the birth of the torrent. For where is the Church, if not where the priestly rod and grace flourish? There she is often, that she may be proved in bitternesses and in temptations. By the nut we understand bitternesses, by the torrent temptations, but bearable ones, for it is written: Our soul has swum across the torrent (Ps. 123 (124):5). And so she goes down into the place of bitterness, where the vine flowers, and the diverse and manifold fruit, in the appearance of pomegranates, which, as with a single covering for the whole body, is fortified by faith and love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
