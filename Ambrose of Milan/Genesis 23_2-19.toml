[[commentary]]
quote='''
The passage that follows contains the death of a wife, the weeping of a husband and the duty of burial, by which a husband's affection is proved. And Abraham rose up he says from the dead, so that we may not cling too long to the dead, but may pay them as much duty as is enough. Abraham, moreover, hastened to pay the price for the place of the tomb, though it was being given free, so that we may build the tombs of our parents or kinsmen not in places belonging to others, but rather in our own; for often, when possessions are alienated, the burial places that are in those same places become saleable. But Abraham did this because there were not yet temples of God of this kind, in which the remains of the faithful are laid up for the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
