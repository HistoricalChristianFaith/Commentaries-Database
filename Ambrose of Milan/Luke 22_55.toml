[[commentary]]
quote='''
And by this time there was a fire burning in the house of the High Priest; as it follows, And when they had kindled a fire, &c. Peter came to warm himself, because his Lord being taken prisoner, the heart of his soul had been chilled in him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us consider also in what state he denies. It was cold. If we consider the season, it could not have been cold; but it was cold where Jesus was not recognized, where there was no one who saw the light, where the consuming fire was denied. The cold, then, was of the mind, not of the body. Indeed Peter stood at the coals, because he was chilled in affection. Evil is the Jewish flame: it burns, it does not warm. Evil is the hearth which sprinkles a kind of soot of error even on the minds of saints, beside which even Peter's inner eyes grew dim — those eyes not of flesh and blood, but the eyes of the mind, with which he saw Christ.

Someone says: Do you condemn even the elements of the Jews? I do not condemn the elements, because they are not the Jews', but it is another flame I condemn, the flame of unbelief. This flame of the Jews I condemn, following the divine oracles; for the Lord says: your silver is reprobate. If the silver of the Jews is reprobate, the hearth of the Jews too is reprobate. Indeed with the hearth and the gold of the Jews the head of a calf was fashioned, that is, the sovereignty of sacrilege.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
