[[commentary]]
quote='''
The Lord said to my Lord. As he is about to complete his precepts, the Lord also closes, at the end of his testament, with the faith and the mercy that lead the way to the Passion: faith, in that we should believe Christ both to be our Lord God and to sit at the right hand of God — not that he who is everywhere sits bodily. Indeed he himself is in the Father, because he is in the substance of God, because there is one power, one majesty. He himself, then, is in the Father and the Father in him, because the Word is in God, God in the Word; he himself is in the Father, he himself is at the right hand of the Father, because he shares with the Father, second to none; he himself is sent by the Father, because he came down from heaven to fulfil the Father's will. Take away from here the questions of unbelief, and religion is complete. He is not set above because he sits at the right hand, nor does he suffer injury because he is sent. No rank of dignity is sought where there is the fullness of divinity.

This too must be considered: that he rebukes those who call Christ the son of David; and how then did that blind man merit healing by confessing the son of David? How did the children, saying Hosanna to the son of David, bring to God the glory of a most exalted proclamation? But they are not rebuked in this passage because they confess the son of David, but because they do not believe him the Son of God. For in true faith it is not the one or the other, but both; for although in the beginning we determined to know nothing except Christ Jesus and him crucified, now, however, as men near to the judgment, we no longer know Christ crucified, but await him coming in the clouds. The unbeliever looks upon the wounds; the faithful man, caught up into the air, runs to meet Christ.

Let us therefore believe that Christ is both God and man, one in both, not another, he to whom his enemies are made subject by the Father, not through any weakness of his own power, but through the unity of nature, because the one works in the other. For the Son too makes enemies subject to the Father, he who glorifies the Father upon the earth, and the Father gave the Son the name which is above every name. But the Son also says to the Father: I have manifested your name to the men whom you gave me. And in giving the name which is above every name he gave no more than he had, but gave all that he had. And he gave this name so that every tongue should confess to God that the Lord Jesus is in the glory of God the Father.

See, then, each point. The Father makes subject to the Son, the Son makes subject to the Father; the Father raises the Son, the Son raises himself. Hence he says: Destroy this temple, and in three days I will raise it up again. Both the Father is Lord and the Son is Lord — The Lord said to my Lord — yet not two lords, but one Lord, because both the Father is God and the Son is God, yet one God, because the Father is in the Son and the Son in the Father. One God, because there is one Godhead — Your throne, O God, is for ever and ever; an upright rod is the rod of your kingdom. You have loved righteousness and hated iniquity; therefore God, your God, has anointed you — yet one God, in whom the teaching of both the New and the Old Testament agrees. For in the Old Testament too it is written: You shall love the Lord your God and You shall worship the Lord your God and him alone shall you serve; in the New: One God and Father of all. So too the Father is Lord and the Son is Lord, yet one Lord. Indeed it is written: do not serve two lords. This is in the New; and in the Old it is written: Hear, O Israel, the Lord your God is one Lord. Hence the Apostle admirably, so as not to speak of two gods, or name two lords, or detract from either the Son or the Father: One he says God the Father, from whom are all things, and one Lord Jesus, through whom are all things. For he who is God is also Lord, and he who is Lord is God. Indeed it is written: Know that the Lord himself is our God.

All things, then, that the Father has, the Son also has. God the Father according to the principle of generation, God the Son according to the unity of the image. The Son is Lord, because he subjected all things to himself by reason, though he could have done so by power; the Father is Lord, because he is the root of the Son. Thus for us the Father in the Son is distinguished by the definition of the persons and joined by the unity of power. And so the one is in the other, and they are one in each other. For it is both the glory of the Father, if he has not degenerated in the Son, and the grace of the Son, if the Father is seen in Christ. So he is not degenerate in whom is the supreme majesty of unity, nor alien in whom the property of generation is the expression of the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
