[[commentary]]
quote='''
Therefore, to return to the beginning of this discourse, the mind is good which has the reasoning of reason and is intent on the disciplines of wisdom; but it has a heavy struggle with the body of death, and often the enticement of the flesh overcomes the reason of the mind. Therefore the Lord first gave the Law, to which the mind of man gave itself up to obey, and it began to serve it, so as to be subject to it; but the flesh was not subject, because the wisdom of the flesh is not subject to the Law, and it fought against its precepts. For it could not obey virtue, given over as it was to desires and entangled in the allurements of the flesh. Therefore we must labour to hold fast the grace of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 5"
