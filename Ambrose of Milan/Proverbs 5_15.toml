[[commentary]]
quote='''
In truth, while you realize that you possess frailty in common with the flowers, you know that you have access to delight in the use of the vine, from which is produced wine, wherein the heart of man finds cheer. Would that, man, you could imitate the example of this species of plant, so that you may bear fruit for your own joy and delight. In yourself lies the sweetness of your charm, from you does it blossom, in you it sojourns, within you it rests, in your own self you must search for the jubilant quality of your conscience. For that reason He says: ‘Drink water out of thine own cistern and the streams of thine own well.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
There was a fount which irrigated the land of Paradise. Is not this stream our Lord Jesus Christ, the Fount as well as the Father of eternal life? It is written: For with thee is the fountain of life. Hence: From within him there shall flow living waters. We read of a fountain and a river which irrigates in Paradise the fruit-bearing tree that bears fruit for life eternal. You have read, then, that a fount was there and that a river rose in Eden, that is, in your soul there exists a fount. This is the meaning of Solomon's words: Drink water out of thy own cistern and the streams of thy own well. This refers to the fount which rose out of that well-tilled soul, full of pleasant things, this fount which irrigates Paradise, that is to say, the soul's virtues that blossom because of their eminent merits.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"
