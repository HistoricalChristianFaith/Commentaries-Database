[[commentary]]
quote='''
This, then, is to destroy and to plant: that vicious things are rooted out and better things planted in the hearts of each. Of this Moses says excellently in the song of Exodus: Bringing them in, plant them in the mountain of your inheritance, in your prepared dwelling, asking that the Lord would bring his people into those nurseries of lofty virtue and wisdom, and that there it should be planted for his works and instructed in the disciplines of the heavenly precepts, and that in it he should prepare for himself the dwelling of his sanctification, which the Lord deigns to confer surely not by hereditary right nor in consideration of our merits, but according to his grace. For how could we return to the place where we were unable to remain, unless upheld by the privilege of eternal redemption?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
