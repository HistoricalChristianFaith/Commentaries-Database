[[commentary]]
quote='''
Let us flee, then, the wickedness of this world, in which the days themselves, he says, are evil, and let us flee untiringly. And so Isaiah cries: Be strong, you slackened hands and loosened knees, that is, be strong, knees not of the body but of the soul, so that the footstep of the mind, directed to the highest places of heaven, may be lifted up, so that its course may be firmer, its life riper, its grace fuller, its prudence more circumspect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
