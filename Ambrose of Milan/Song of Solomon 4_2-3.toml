[[commentary]]
quote='''
Now the rest, the teeth and the cheeks, and the lips of the bride like a scarlet cord, we understand to be the virtues of the soul and the diversities of teachers: who either supply spiritual nourishment to the mind by diligent dispensing, or bind the hearer by the preaching of the Lord's cross, as by a kind of line of the Word; or are bashful in modesty and most pleasing in the flower of youth. Even if they are held back from touch by modesty, yet let the fragrance of Christ breathe in them; and as the ointment descends upon the cheeks as from the priestly head, so in them too let the beauty of doctrine shine forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
