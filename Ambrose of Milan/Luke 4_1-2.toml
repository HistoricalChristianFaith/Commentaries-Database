[[commentary]]
quote='''
He was led therefore into the wilderness, to the intent that He might provoke the devil, for if the one had not contended, the other it seems had not conquered. In a mystery, it was to deliver that Adam from exile who was cast out of Paradise into the wilderness. By way of example, it was to show us that the devil envies us, whenever we strive after better things; and that then we must use caution, lest the weakness of our minds should lose us the grace of the mystery. Hence it follows: And he was tempted of the devil.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There are three things which united together conduce to the salvation of man; The Sacrament, The Wilderness, Fasting. No one who has not rightly contended receives a crown, but no one is admitted to the contest of virtue, except first being washed from the stains of all his sins, he is consecrated with the gift of heavenly grace.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It was not out of place, I think, that we completed a work on the generation of the Lord; certainly it has not been fruitless to linger rather long over the Lord's forebears. For if those who prepare to cross a great sea by coasting along the shore, avoiding, as we do, out of weakness of confidence, the shortcut of a course on the deeper sea, often visit, captivated by the beauty of the places, the countryside and the cities set down along the shore, how much more ought we, placed in so great a deep, not of the elements but of heavenly deeds, to skirt the nearer harbors and to love frequent excursions, lest anyone, wearied by the tedium of a long voyage, be unable to hold back the vomit of disgust. Certainly if anyone has perceived the treacherous faults of an unsafe vessel, then, as though the frequent harbor of the books were set before him, he may lower the sails of his ears and fix the anchor of his reading. He who goes down into harbor does not seem to have deserted the ship, but to have completed his course.

And in many places perhaps the very pleasantness of the places may invite the one passing by. For if that Ulysses, as the fables relate — although the prophet too has said: daughters of the Sirens shall dwell in it, and even if the prophet had not said it, no one would rightly find fault, since Scripture has included both the giants and the valley of the Titans — if then that Ulysses, hastening to his fatherland after ten years of exile, in which war was waged at Ilium, and ten years of wandering, could be detained by the Lotus-eaters with the sweetness of their berries, if the gardens of Alcinous delayed him, if finally the Sirens, enticing him with the song of their voice, had almost led him to that famous shipwreck of pleasure, had he not closed the ears of his companions with wax put into them against the sounds of the alluring song, how much more is it fitting that religious men be charmed by wonder at heavenly deeds! And here it is no longer the sweetness of berries that is to be drunk in, but that bread which came down from heaven; it is not the vegetables of Alcinous that are to be gazed at, but the sacraments of Christ; for let him who is weak eat vegetables. So the ears are not to be closed but to be opened, that the voice of Christ may be heard; whoever has received it will not fear shipwreck; he is not to be tied to the mast with bodily bonds like Ulysses, but his mind is to be bound to the wood of the cross with spiritual ties, so that he may not be moved by the enticements of wantonness and twist the course of nature into the peril of pleasure.

For the fable is colored with poetic fictions, so that certain maidens are said to have dwelt on a rocky shore of the sea, who, if with their sweet voice they had driven any to turn their ship aside for the sweetness to their ears, would lead them onto hidden shoals and, deceived by a treacherous anchorage, destroy them by the lot of a pitiable shipwreck. This was composed for show and painted with an ambitious comparison, so that a sea, a woman's voice, and shoaling shores are invented. But what sea is more precipitous than the world, so treacherous, so changeable, so deep, so stormy with the blasts of unclean spirits? What does the figure of the maidens mean but the enticement of unmanning pleasure, which makes effeminate the constancy of the captured mind? And what are those shoals but reefs to our salvation? For nothing is so blind as the danger of worldly sweetness, which, while it soothes the mind, overwhelms the life and dashes the sense of the mind against certain bodily rocks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Rightly, then, does our Lord Jesus by his fasting and by the desert train us against the enticements of pleasures, and the Lord of all suffers himself to be tempted by the devil, that in him we all might learn to conquer. Let us notice, then, that the Evangelist has described three things, not idly ordained by the Lord as chief. For there are three things that serve the use of human salvation: the sacrament, the desert, the fast; for no one is crowned unless he has striven lawfully, and no one is admitted to the contest of virtue unless he has first been washed from all the stains of sins and consecrated by the gift of heavenly grace.

So the Lord came to the washing, that the grace of the mystery might be proved to us both by sight and by sense. And since the law is promulgated with heaven and earth as witnesses, so that you might believe the mystery of the divinity, hidden from the ages in God, to be more than the law, heaven is no longer called to bear witness, but performs the office of a witness, when the voice of God is borne down from heaven. At the same time, lest you stumble at the mystery of faith through doubt of mind, invisible things are visibly declared to you to be at work.

The Lord came to the washing; for he became all things for you. To those who are under the law, as though he were under the law. Though he himself was not under the law, he was circumcised, that he might win those who are under the law; to those who were without the law he joined himself in the fellowship of a banquet. That he might win those who lived without the law. He became weak to the weak through the suffering of the body, that he might win them; finally he became all things to all, a poor man to the poor, a rich man to the rich, weeping with the weeping, hungry with the hungry, thirsty with the thirsty, overflowing to those who abound. He is in prison with the poor man, he weeps with Mary, he feasts with the apostles, he thirsts with the Samaritan woman, he hungers in the desert, that the food of the first man, which he had tasted by transgression, might be undone by the fast of the Lord. To our peril Adam broke his hunger for the knowledge of good and evil; to our gain this one took hunger upon himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
