[[commentary]]
quote='''
Know from this that he has mounted this soul too and brought her to the place of the palm, when he also says to her: How have you become beautiful and sweet, O love, in your delights? Your stature has become like a palm. And she herself says: I said: I will go up into the palm. But love itself is also the palm; for it is the fullness of victory, for love is the fullness of the Law. Let us run, then, that we may lay hold of it; let us run, that we may conquer. He who has conquered goes up into the palm and eats its fruits. He who has conquered no longer runs, but sits, as it is written: He who has conquered, I will grant him to sit with me on my seat, as I too have conquered and sit with my Father on his seat. Hence the philosophers set forth in their books those chariot contests of souls, and yet they could not reach the palm, since their souls did not know the summit and the loftiness of the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
