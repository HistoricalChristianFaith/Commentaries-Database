[[commentary]]
quote='''
Hence and their inheritance shall be for ever, because they sought eternal goods, not the gains of a temporal inheritance, and they will have nothing to blush for in the evil time, that is, of the heavenly judgement, and in the days of famine they shall be filled, for man does not live by bread alone, but by every word of God. But what man? I know a man in Christ fourteen years ago — whether in the body I do not know, or out of the body I do not know, God knows — such a one caught up even to the third heaven. That man, then, who is in Christ, who does not know himself to be in the flesh, who does not walk in the flesh but in the spirit, he who is caught up not only to heaven but even to the third heaven, and is caught up into paradise and hears words which it is not lawful for a man to speak, who glories not in his powers but in his weaknesses, he lives not by bread alone but by every word of God. For the Word of God is life, because the Word was made flesh. Hence the Evangelist said most excellently: What was made in him is life.

The Alexandrians, indeed, and the Egyptians read: All things were made through him, and without him was made nothing that was made, and, putting a pause in between, they add: In him is life. Let that division of the text stand for the faithful; I do not fear to read: What was made in him is life, and the Arian has nothing to lay hold of, because I do not consider his poisons, but recognize the custom of the sacred reading. For he did not say "the Word was made before every beginning", he did not say "the Word was made", but if you wish to hear what he did say: The Word, he says, was with God. He was with God, who worked with him, who ruled with him. He did not say "the Word was made", but he said: The Word was God. And God is not a thing made, but the Maker and Creator. Open your ears and hear: All things were made through him, and without him was made nothing. You learn that he is the Son, in whom is the fullness of divinity. Open your ears a little longer and hear him say: What was made in him is life. "In him", he says, "was made", not "the Word of God was made". Or if this moves you to slander, because he said "was made in him", do you also slander God the Father, because the Son of God said: But he who does the truth comes to the light, that his works may be made manifest, because they have been done in God, or because David said: I will confess to you, O Lord, since you have heard me and have been made salvation for me, that is: you have turned to me for salvation, you have worked for salvation? I could use other passages, but I do not want you to believe me, lest you think them arguments of ingenuity, not testimonies of truth.

Let the son of thunder himself, he who reclined on Christ's breast, he from whom the Lord did not keep his secrets silent, to whom Peter beckoned that he should ask the Lord, and he asked and the Lord revealed it, let him himself expound what he meant by what he said: What was made in him is life. Hear him, then, interpreting, for he was already guarding against your slanders, O Arian: That which was from the beginning, and which we have heard and have seen with our eyes, which we have looked upon and our hands have searched out concerning the Word of life, and the life appeared. It is, then, the flesh which appeared in Christ, or Christ in the flesh; he himself is our life in all things. His divinity is life, his eternity is life, his flesh is life, his passion is life. Hence also Jeremiah says: In his shadow we shall live. The shadow of the wings is the shadow of the cross, it is the shadow of the Passion. His death is life, his wound is life, his blood is life, his burial is life, his resurrection is the life of all. Do you wish to know how his death is life? We have been baptized into his death, that with him we may walk in newness of life. And he himself says: Amen, amen, I say to you, unless a grain of wheat falling into the ground dies, it remains alone; but if it dies, it brings forth much fruit. He himself, the grain, was loosed in body and died for us, that he might bring forth much fruit in us. And so his death is the fruit of life. What was made in him, then, is life. Flesh was made in him: it is life; infancy was made in him: it is life; judgement was made in him: it is life; death was made in him: it is life; the remission of sins was made in him: it is life; a wound was made in him: it is life; mockery was made in him: it is life; division was made in him: it is life; burial was made in him: it is life; resurrection was made in him: it is life. See how many things were made in him, by which the restoration of our life was made, so that what had perished might be given back. Lastly, a sale was made in him: it is life; redemption was made in him: it is life. He was sold to death by Judas, bought by the Jews for death, so that we might be redeemed to life by his precious blood. This is the life which was made, this is the life which appeared, this is the life which we have seen, this is the life which was with the Father, because he himself who was in the beginning was himself born of the Virgin, so as to be life for those who were to die.

Let us question this very passage set before us. What is: a man in Christ? That is, made in Christ, in whom all things were made, whether thrones or dominions or principalities or powers: all things were created through him and in him, and he is before all, and all things hold together in him, that is, in his power. A man, then, in Christ, who has been made after his image and likeness; a man in Christ, who is wholly in Christ. For just as God the Father, through the unity and fullness of divinity, is wholly in the Son, and the Son in the Father, so, through intention and the affection of devotion — to use it by way of example, not of comparison — man is wholly in Christ; for he who cleaves to the Lord is one spirit. The man in Christ, then, is not that earthly one, not that one of sin, but the man of Christ. Why, then, does what was made in him is life trouble anyone, if man too, especially the inner man, was made in him, crucified in him, renewed in him, buried in him and buried together with him, raised again in him? Why does it trouble anyone, as I said, that it is written: What was made in him is life, when a man has said: In God we shall do valiantly? If you ask what the life is, if what has been made in him troubles you, take this: surely the life is the Church. She was made in him, in his side; in him Eve was raised up. And Eve is life, that is, that which was made, because Eve, who had perished, has been saved through the Church, that is, through the bearing of her children, as it is written, because a sober inheritance has amended the offence of the earlier one. Hence Paul himself too was caught up to life, who before was a persecutor unto death.

We have wandered rather far, in order to speak of that man who lives not by bread alone but by every word of God. Let us return to the psalm: and therefore the spotless will not be confounded in the day of judgement, and in the days of famine they shall be filled.
'''
