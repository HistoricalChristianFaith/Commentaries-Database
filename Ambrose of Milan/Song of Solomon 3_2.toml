[[commentary]]
quote='''
But yet not even so does she find him, and therefore she says: I will rise, that is, I will raise and lift up my intent, that I may seek tirelessly, seek carefully: I will enter into the city. There is also a soul that says: I am a fortified city, I am a besieged city (Isa. 27:3). There is a city fortified through Christ; there is that city, Jerusalem in heaven, in which interpreters of the divine law and men skilled in the disciplines abound, through whom the Word of God is sought. I will seek, she says, in the marketplace of that city, in that marketplace where the jurists treat of rights, where the oil is sold which the virgins of the Gospel buy, that their torches may always shine and the smoke of iniquity may not put them out. I will seek, she says, in the streets in which the waters overflow that burst forth from those fountains from which Solomon says we must drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
