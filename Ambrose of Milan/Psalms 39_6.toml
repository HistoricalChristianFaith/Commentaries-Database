[[commentary]]
quote='''
And he rested a little while, groaning at the misery of the human condition, because he had said: Nevertheless all things are vanity, every man living, and after the diapsalma, having recovered his breath, he says: Although man walks in the image of God, yet he shall be troubled in vain; he lays up treasure, and knows not for whom he gathers it. See how first he tempered the harshness of his statement, afterwards completed the reasoning of his utterance. He tempered it by saying that man walks in the image of God. Blessed man, you who walk by faith after the likeness of God; blessed because you have faith in you, more blessed if you had no avarice. The eternal good of the mind is one thing, the vain fire of carnal desire another; for faith serves as a soldier of God, avarice of the tempter; the latter heaps up what may profit itself, the former what may benefit others. What, then, is so vain as not to know for what heir one toils? For who knows whether his own son or grandson will survive him? Often the heir written in the tablets of the will goes before the testator to the tomb by an untimely death, or the survivor swallows up the inheritance, or a profligate squanders it, or a very foolish one does not protect it, or one proscribed loses it. If, then, you see anyone eagerly gathering riches, say you too: He is troubled in vain; he lays up treasure, and knows not for whom he gathers it. For he cannot take with him what he possesses, and when he dies he will leave his riches to strangers. Often an enemy and an ungrateful man succeeds him, and the successor insults his predecessor; those whom the one loved the other persecutes, those whom the one nurtured the other sells.

The Greek, however, does not have: in the image of God, but only: in the image. In what image, then, does man walk? In that, surely, after whose likeness he was made, that is, after the image of God; and the image of God is Christ, who is the brightness of his glory and the image of his substance. Christ, then, is the image of the Holy One. This image came to earth to the image, so that we might walk no longer in the shadow but in the image; for he who follows the Gospel walks in Christ. Therefore he says to his disciple: Get behind me, that is, that you may follow me. Therefore the people of the Jews went astray, because it walked in the shadow; therefore the Christian people does not go astray, because it walks in the image, having the sun of righteousness shining upon it. A good image, not shaped in the wax of a gleaming painting, but expressed by the fullness of divinity. In this image both the Father and the Son are seen together, because the unity of operation of both of them shines forth. Even though Christ has already risen, yet in the Gospel his image is still shown to us. I read that he raised Lazarus, and I believe it the work of the Father and of the Son. The Son called, the Father heard, Lazarus walked. I read that the demons confessed him; they confessed the Father also, they who besought the Son of God, and they were cast out in him or through him, as it is written: But if I cast out demons by the Spirit of God, by whom do your sons cast them out?

First, then, the shadow went before, the image followed, the truth will be; the shadow in the Law, the image in the Gospel, the truth in heavenly things. The shadow of the Gospel and of the gathering of the Church was in the Law, the image of the truth to come in the Gospel, the truth in the judgement of God. Therefore, of the things that are now celebrated in the Church there was a shadow in the words of the prophets: a shadow in the flood, a shadow in the Red Sea, when our fathers were baptized in the cloud and in the sea, a shadow in the rock which poured out water and followed the people. Was not that the sacrament of this most holy mystery in shadow? Was not the water from the rock in shadow, as it were the blood from Christ, who followed the peoples that fled from him, so that they might drink and not thirst, be redeemed and not perish? But now the shadow of the night and darkness of the Jews has departed; the day of the Church has drawn near. We now see good things through the image, and we hold the good things of the image. We have seen the chief of priests coming to us, we have seen and heard him offering his blood for us. We priests follow as we can, so as to offer sacrifice for the people: weak in merit, yet honourable by the sacrifice; because, even if Christ is not now seen to offer, yet he himself is offered on earth, since the body of Christ is offered; indeed he himself is shown to offer in us, he whose word sanctifies the sacrifice that is offered. And he himself stands by as our advocate with the Father, but now we do not see him; then we shall see him, when the image has passed away and the truth has come. Then no longer through a mirror, but face to face, the things that are perfect will be seen.

Ascend, then, O man, into heaven, and you will see those things of which there was here the shadow or the image; you will see not in part, not in an enigma, but in their fullness, not under a veil, but in the light. You will see the true light, the eternal and perpetual priest, whose images you saw here: Peter, Paul, John, James, Matthew, Thomas. You will see the perfect man no longer in an image but in truth; as, indeed, is the heavenly, such are they also that are heavenly, surely they too already in glory and beauty, already in the grace of the resurrection, not in the body of death and the deformity of corruption.

See that you do not carry the image of the earthly to where the light of heavenly things is. Here, if anyone keeps the images of a tyrant who has already been conquered and perished, he is rightly condemned. How do you bring the image of the enemy and adversary into the city of the true emperor, unless so that he may condemn you? And if you wish to bring in the image of the earthly, the prince of this world will oppose you; he will say: "This image is mine, and the things you offer are mine". What will you do when you are caught, when he says to you: "Mine is avarice, mine is ambition, mine are the riches whose image I recognize in you"? For he is both adversary and defender. But if you are such as Jacob was, you will say to Laban, to him who transforms himself into an angel of light: Search whether you find anything of yours with me. Then he will search and, finding nothing, will go away confounded, because you have hidden and blotted out all the likenesses of the vices. Blessed is he who can say: The prince of this world will come and will find nothing of his in me. For he seeks the things that are his, not those that are Christ's. If, then, you follow Christ, do not strive after riches you do not have, nor increase those you have, but let the poor man feel that you are rich for him. Bring the needy into your house, break bread for the hungry and cover the naked, so that a treasure may be laid up for you in heaven that will pass over with you. Christ became poor, though he was rich, that by his poverty he might make us rich. Do not, then, be troubled in vain on account of riches, be roused from sleep, think how you may keep your money and increase your wealth, go out by night, keep watch at the judge's house so as to plunder others' goods, bring a lawsuit against a poor man, fear the tax-collector. Vain is that trouble.
'''
