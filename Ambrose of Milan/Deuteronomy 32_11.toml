[[commentary]]
quote='''
Finally, listen to Moses saying: He spread his wings and took them, and carried them on his shoulders (Deuteronomy 32:11): just as an eagle carries its offspring, which it is accustomed to examine; in order to hold and nurture those who have the true nature of birth, and to observe the grace of incorruptible nature; or to reject those in whom it has detected the weakness of a degenerate origin at a tender age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan/Interrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Chapter V"

[[commentary]]
quote='''
It is generally stated in treatises dealing with the eagle that she, too, abandons her young. This is true, however, only of one out of two nestlings. Some have thought this situation arose from a reluctance to bring up a twin brood. But this is hardly worthy of credence, especially since Moses has given us such convincing testimony on the devotion of this bird to her young when he said: ‘As the eagle protects his nest and inspires trust in his nestlings: hovering over them, he spreads his wings and hath taken them and carried them on his shoulders. The Lord alone led them.’ How, then, did he spread his wings over his young if he killed one of them?

For this reason I think that this bird does not act cruelly from a desire to refrain from giving nourishment. Rather, there is a question of making a decision. For it is agreed that the eagle tests the quality of her young, lest signs of degeneracy and deformity may cause deterioration in a species which affects the role of regal dominion over all birds. And so it is asserted that the eagle exposes her nestlings to the rays of the sun and suspends with her claws her young in mid-air. If one of them stays unruffled and unmoved, fearlessly facing the light of the sun as it strikes his eyes, he is approved. He has thus demonstrated the truth of nature by the steadiness of his unaffected gaze. The one, however, who turns away his eyes, ‘dazzled by the sun’s rays,’ is rejected. He is deemed unworthy of such a parent, unfitted to be recognized as genuine offspring, and hence undeserving of support. The eagle does not therefore reject her young because of natural cruelty. This is, rather, the result of her soundness of judgment. There is no refusal of what is native, but rather a rejection of what is alien.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
