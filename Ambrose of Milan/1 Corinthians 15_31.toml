[[commentary]]
quote='''
And truly Paul died daily according to the flesh, set in fastings, in shipwrecks, in various dangers, in miseries; but he did not die wholly. His outer man died, but the inner was renewed, and therefore he did not fail when he was pressed by so many dangers, because, though his outer man was being corrupted, the inner was renewed from day to day, since the faith and grace of working of each one lights up the day for him. Hence the apostle Paul did not know night either, because he who is renewed is always in the light. Or does he not seem to you to be in the light who holds within himself the charity of Christ? And therefore, secure about being sacrificed, he does not flee hard things, nor can any persecution or famine or sword separate from Christ the Lord him whom the bonds of divine charity bind fast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
