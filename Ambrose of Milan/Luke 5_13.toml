[[commentary]]
quote='''
He heals in the same manner in which He had been entreated to heal, as it follows, And Jesus put forth his hand, and touched him, &c. The law forbids to touch the leprous man, but He who is the Lord of the law submits not to the law, but makes the law; He did not touch because without touching He was unable to make him clean, but to show that he was neither subject to the law, nor feared the contagion as man; for He could not be contaminated Who delivered others from the pollution. On the other hand, He touched also, that the leprosy might be expelled by the touch of the Lord, which was wont to contaminate him that touched.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
In the words which follow, I will, be thou clean, you have the will, you have also the result of His mercy.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
He says then, I will, for Photinus, He commands, for Arius, He touches, for Manichæus. But there is nothing intervening between God's work and His command, that we may see in the inclination of the healer the power of the work. Hence it follows, And immediately the leprosy departed from him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But if the word is the healing of leprosy, the contempt of the word is the leprosy of the mind.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
To him the Lord answered with a certain moral holiness: I will; be made clean. And immediately his leprosy departed from him. For there is nothing between the work of God and his command, because the work is in the command. Indeed he spoke, and they were made. You see therefore, what cannot be doubted, that the will of God is power. If then his will is power, those who assert that the Trinity is of one will surely assert that it is of one power. So the leprosy departed at once: that you may understand the affection of the healer, he added truth to the work.

Indeed, according to Mark the Lord had pity on him, which is beautifully put. And the evangelists set down many such things, wishing to ground us in both, describing signs of power for faith, expressing works of virtue for imitation. Hence he both touches, not disdaining, and commands, not distrusting; for this is the token of power, that as one having the power of healing and the authority of commanding he does not shun the testimony of the deed. I will then he says on account of Photinus, he commands on account of Arius, he touches on account of Mani.

Nor is the leprosy of one man only cured, but of all those to whom it is said: Now you are clean because of the word which I have spoken to you. If then the word is the medicine of leprosy, surely contempt of the word is the leprosy of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
At the same time this is wonderful, that he healed him in the very manner in which he had been besought. If you will, you can make me clean. I will he says, be made clean. You have the will, you have also the effect of loving-kindness. And stretching out his hand he touched him. The Law forbids lepers to be touched, but he who is Lord of the Law does not obey the law, but makes the law. He touched him, then, not because he could not cleanse without touching, but to prove that he was not subject to the Law and did not fear contagion as men do, but that he who was freeing others could not be defiled; and at the same time, conversely, that the leprosy, which was wont to defile the one who touched it, should be put to flight by the Lord's touch.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
