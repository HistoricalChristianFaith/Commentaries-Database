[[commentary]]
quote='''
Come, Paul, interpret for us by what reason the Lord of heaven and earth called himself poor, what this poverty is. You certainly called him rich; how is the same one rich and poor? Let us hear the testimony of Paul: You know, he says, the grace of our Lord Jesus Christ, that for your sakes he became poor, though he was rich, that you through his want might be made rich. Come you too, Isaiah, interpret for us how Christ called himself sorrowing, who was wont to heal the pains of wounds. The physician came to cure the sick: what had he himself to grieve over? Let us hear the testimony of Isaiah too: For us, he says, he grieves, and we reckoned him to be in sorrows. He expressed the feeling of a physician, who, even if he himself had no wound to grieve over, yet suffered with the wounded. This, then, is what the Lord reproaches the Jews with in the psalm: "I am poor for your sake, I grieve for you, and you laid ungodly hands on me, saying: Let us take away the righteous man, because he is useless to us. Let us put wood into his bread".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
