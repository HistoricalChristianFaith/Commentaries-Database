[[commentary]]
quote='''
Let us come now to the turtle dove, chosen as a chaste victim by the Law of God. Hence, when the Lord was circumcised, the dove was offered, because it is written in the Law that there should be a presentation of ‘a pair of turtles or two young pigeons.’ For this is the true sacrifice of Christ: chastity of body and grace of the spirit. Chastity belongs to the turtle dove; grace, to the pigeon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
For this reason, when eight days had been completed from the virgin Mary's giving birth, they brought our Lord Jesus to Jerusalem, to present him to the Lord according to the Law and to give as an offering a pair of turtle-doves or two young doves, because in the dove there is spiritual grace, and in the turtle-dove the nature of incorrupt generation or the purity of an immaculate body. Rightly, then, are the turtle-dove and the dove commanded to be taken for the sacrifice after the ram, so that you may understand that incorrupt purity and spiritual grace cling to the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
