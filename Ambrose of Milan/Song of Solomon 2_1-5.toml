[[commentary]]
quote='''
Consider each in turn: in moral things he is a flower, the lily among thorns, as he himself says: I am the flower of the field, and the lily of the valleys (above, v. 1). In moral things, then, he is a flower, as in natural things he is the sun of justice, who, rising and rising again, gives light, and, setting, casts shadow. Take care that he does not set for you, for it is written: Let not the sun go down upon your anger (Eph. 4:26). In mystical things he is love, because Christ is the fullness of the law. And therefore the Church, which loves Christ, is wounded with love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
