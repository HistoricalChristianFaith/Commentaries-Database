[[commentary]]
quote='''
For if they think that to be without sin is this, to have ceased to sin, I too agree — all indeed have sinned and lack the glory of God — but if they deny that he who has corrected his old error and transformed himself into such a quality of life that he refrains from sin abstains from offences, I cannot come round to their opinion, since we read that the Lord so loved the Church as to present her to himself glorious, not having spot or wrinkle or any such thing, but that she might be holy and spotless. For since the Church has been gathered from the Gentiles, that is, from sinners, how can she be spotless out of the spotted, unless first by the grace of God, in that she has been washed from offence, and then in that by the quality of not sinning she abstains from offences? Thus she is not spotless from the beginning — for this is impossible for human nature — but through the grace of God and her own quality, because she no longer sins, it comes about that she is seen to be spotless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
