[[commentary]]
quote='''
For how is that destroyed of which the Wisdom of God said that no one is to be feared who can kill the body but cannot kill the soul? Of which the prophet says: My soul is in your hands always. Always he says, not for a time.

And you too, commend your soul into the hands of the Lord. Not only when it withdraws from the body, but also when it is in the body, it is in the hands of the Lord, because you do not see it, whence it comes or whither it goes. It is both in you and with God. Indeed, the heart of the king is in the hand of the Lord, and is ruled and governed by him. The heart is filled with mind, because the mind is the ruling part of the soul and is the strength of the soul. I do not mean the strength that is in the arms, but that which is in counsels, in temperance, piety and justice. If the heart of man is in the hand of the Lord, much more the soul. If the soul is in the hand of God, surely our soul is not shut up in the tomb together with the body, nor held by the grave mound, but enjoys a holy repose. And therefore men build costly tombs in vain, as if they were receptacles of the soul and not of the body alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 10"
