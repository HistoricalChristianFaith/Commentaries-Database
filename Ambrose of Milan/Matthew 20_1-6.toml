[[commentary]]
quote='''
For what does it mean that the laborers are hired on one day at different hours, except that a thousand years in the eyes of the Lord are as yesterday which has passed, and an hour in the night? What is the night but that which went before, that the day might draw near? And well an hour in the night, because a thousand years are as one day. He knew the force of this day who said: Jesus Christ is the same yesterday and today and for ever. He too knew that the day is manifold who wrote: this is the day of the generation of heaven and earth, when they were made; on which day God made heaven and earth and every green thing of the field. For when he had described seven days above, he afterwards embraced in one day all that had been made, showing the whole time of the world in the sight of the Lord as one day, because out of what was formless and dark the form of this world came forth by the brightness of the divine work. So if the day is the whole time of the world, it surely has its hours also in the ages, or the ages themselves are hours. And the hours of the day are twelve. Hence well, in a mystery, Christ is the day, whose apostles are twelve, who shone with heavenly light, the turns of grace within them being marked out.

So the householder came and at the first hour hired laborers, perhaps those who from the beginning of the world until the flood deserved to be righteous, of whom he says: and I spoke to you before the light and sent to you my servants the prophets before the light. The third hour begins after the flood, embracing the times of Noah and of the rest, who as good laborers are appointed to the vineyard. That is why Noah was made drunk, as at the midday meal. The sixth and the following hours are marked out by the merits of the patriarchs Abraham, Isaac and Jacob. At the ninth, when the age was already declining and the light of virtue was, as it were, growing pale, the Law and the prophets censured the faded morals of men. The eleventh, and what remains of the day, the holy advent brings forth. Hence he himself also says in the Gospel: walk, while you have the light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
