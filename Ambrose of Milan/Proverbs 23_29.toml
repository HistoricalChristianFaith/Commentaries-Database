[[commentary]]
quote='''
You have heard what He said through Moses; hear what is written in the book of the sayings of Isaias. For the Lord inveighs in verses of this kind and says: Woe to them who rise up early in the morning and follow intoxicating drink, and are drunk in the evening: for wine will burn them. For with the harp, and the psaltery, and the timbrels, they drink wine: but the works of the Lord they regard not, nor do they consider the works of his hands. Who hath woe? he says, Who hath judgments, who hath tumults? Other men have diverse troubles, drunkards have all. For woe to them who are drunk in the evening! What then of those who are intoxicated before evening and frequently until dawn? Therefore, as the woe that is their due, they have quarrels. They engage in disputes; they rush into bloodshed; they go, or are called, to judgment. Therefore, like defendants, they also have their judgments. Sometimes a rather serious disturbance arises because the mind of the drunkard is subverted by wine: And he does not remember the king or the magistrate, as it is written, and he makes all things speak through talents. And they do not remember, when they drink, friendship nor fraternal ties; but after the tumult they take up their swords; and when they have been immersed in wine and stand up they themselves do not remember what they have done. Therefore they have even a worthy reward for their tumult.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 15"
