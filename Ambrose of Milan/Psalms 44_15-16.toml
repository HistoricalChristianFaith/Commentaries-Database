[[commentary]]
quote='''
Whether, then, you wish to understand the confusion of Christ as his cross, which seemed to be a confusion to the Jews, who insulted him as though Christ blushed at that work in which he was working the common salvation, or also as this confusion which seemed to be heaped upon him by the voice of him who reproaches and reviles, by the face of the enemy and the persecutor. For he blushed that his chosen people had so fallen, and he was confounded before the Father about those whose end had come. For the Father was present to the Son, from whom the Son can never be separated, and therefore he heard him saying to the Jews: Behold, your house shall be left to you desolate.

But there are also those who glory in their confusion, like those of whom the Apostle says that their glory is in their confusion. To them the glory of Christ is contrary, who took up the cross and did not flee confusion, which we too ought by no means to fear, nor to shun through dread or disdain, lest that which can bring the grace of life should bring sin upon us. For there is also a glory of confusion, as when you fall among many Gentiles or philosophers, and they cast the cross of Christ in your face, and you cannot answer with a word, and no one listens to you as you relate the words of salvation. It is confusion, but by the voice of him who reproaches and reviles, by the face of the enemy and the persecutor. And therefore do not answer a fool according to his folly; be like a man dumb and silent, and as though not hearing the words of those who insult and revile, not because you cannot answer, but because you ought not to answer. For there is a time for everything, a time to keep silence and a time to speak. You must keep silence when you do not find a ready hearer; you must speak when the Lord grants a tongue of learning, so that your speech may work upon the affections of the hearers. But how should he listen to you who reviles you for this very reason, that he does not wish to hear your wholesome speech, or how should he acquiesce in you who is a persecutor and wishes to lay claim to you for himself, or, as Aquila or Symmachus said, to avenge and punish in you the fact that the inheritance of Christ seems to have been transferred to the Gentiles? Far removed, then, is this confusion from the confusion and reproach of the sinner. For the conscience of the one who has not forgotten his God is enlightened; that of the others is confounded, whose mind is darkened and disturbed by the memory of their sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
