[[commentary]]
quote='''
This is a good answer to the foolish superstition of the Jews, who in building the tombs of the prophets condemned the deeds of their fathers, but by rivalling their fathers' wickedness, throw back the sentence upon themselves. For not the building but the imitation of their deeds is looked upon as a crime. Therefore He adds, Truly ye bear witness that ye allow, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A good passage too against the most empty superstition of the Jews, who by building the tombs of the prophets condemned the deeds of their fathers, but by emulating their fathers' crimes turned the sentence back upon themselves. For by building the prophets' tombs they convicted of crime those who had killed them, and by emulating like deeds they declared themselves too heirs of their fathers' iniquity. It is not the building, then, but the emulation that is reckoned as the crime. For they cannot be acquitted of inherited iniquity who, by crucifying the Son of God, which is more grievous, added a crowning heap to their fathers' crimes. And therefore he rightly added elsewhere: fill up the measure of your fathers, because there is nothing beyond the wrong done to God in which they could sin more grievously.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
