[[commentary]]
quote='''
Then Abraham is presented as having returned there, that is, to Bethel, from which he had gone down into Egypt, so that we may recognize that even the just, set in the house of God and intent upon the word of God, are indeed tempted by worldly afflictions, but are not estranged from the house of God and from the keeping of the heavenly commandments. To be content with one's own borders, not to be lifted up by abundance of riches when things flow according to the favour of pleasures: this belongs to the best mind; always to meditate on the beginning and the end, to go forth to that point and to set out from there: this is good. And the good is wisdom; for no one is good but God alone. From him we proceed, created through him; to him we return, because to be with Christ is far better. And that you may know that it is good for the beginning and the end to agree, the good Lord Jesus himself says: I am the A and the Ω, the beginning and the end.

Let our mind, then, be always with him; let it never withdraw from his temple, from his word. Let it be always in the reading of the Scriptures, in meditations, in prayers, so that the word of him who is may always work in us. And as, going forth daily to the church or applying ourselves to prayers at home, we begin from him and end in him, so let the whole day of our life here and the course of each day take its beginning from him and end in him; for just as to believe and to be initiated to God from the beginning of life is salvation, so perseverance too is necessary to the end. And this is the diligence of the best mind: that, intent upon the word of God, it does nothing irrational from which sadness may steal in, so that, continually well conscious of its actions, it may keep the joy of a good conscience. For what is good is without fear and without sadness, that is, full of security and of grace; for the possession of the just man is to be pleasing to God, but none of the foolish is pleasing. Therefore Isaiah says, 'when the good draws near,' 'sorrow and sadness and groaning shall flee.' John too in the Apocalypse: And he himself he says God shall be with them and shall wipe away every tear from their eyes, and death shall be no more, nor mourning nor crying nor pain any longer. For in the resurrection of the just there will be continual joy and grace, when that good has begun to be with his saints, when they shall rest in the bosom of Abraham, set in his tent, which is fixed within the house, or the word, of God and his grace; signifying that the innocence of the faithful gives thanks to its Author, they who have nothing to make them repent of having been in this world.

And so by the simple deeds of Abraham the proofs of great teachings are unfolded. Rightly is he rich, who even makes rich the disputations of the philosophers, who shaped their precepts from his conduct.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 5"
