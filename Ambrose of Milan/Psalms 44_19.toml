[[commentary]]
quote='''
We have given the sense. But it is fitting for us to consider more expressly what the place of affliction is: whether it is this world, which is set in wickedness, or rather our flesh, in which our soul is humbled when it comes down into fellowship with this flesh, or the adversities by which we are exercised while set in this body, in which we groan, being burdened, because we do not wish to be stripped, but to be clothed over. For it is a heavy labour while we wait for this mortal thing, of which we ought to strip ourselves, to be swallowed up by life; for it is stripped off with less labour than it is swallowed up. And see whether this is not the difference between the one who strips himself and the one who waits for it to be swallowed up by life: grace strips off, penitence swallows up; loftiness of mind strips off, diligence swallows up. But how can you doubt that this is the place of affliction, when it is the body of death, in which the shadow of death also covers us? And therefore we must always attend to that lamp which is the Word of God, so that we may know how to direct the paths of our mind and the inner footsteps of our thought, so that the light of souls may dispel bodily darkness.

And the interpretation of Aquila too has beautifully expressed how we ought to understand the place of affliction, by saying: For you have humbled us in the place of the sirens, so that the fault lies not in the flesh or in nature, but in those things which have made the flesh corruptible. Indeed the sirens, of whom divine Scripture has made mention a second and a third time, pagan history has related to be certain maidens who, singing with the sweetness of their voice, provoked sailors by their enticements, out of eagerness to hear, to bring their ship to the shore; and ancient history has handed down to posterity that, when they followed the charm of the voice, they suffered shipwreck in a rocky place. Their interpretation is this: the pleasure of the voice and a kind of flattery. So, then, the pleasure of the world delights us with a kind of carnal flattery, so as to deceive. As, then, there the fault lay not in the shore but in the melodious sweetness, which caused the roughness of the shore not to be guarded against, so the fault lies not in the flesh but in those things by which this flesh is solicited and tossed. Indeed the sea, when there is no storm, is calm; if a tempest rages, it is dangerous.

And the view of the Seventy seems to agree with these, when they say: for you have humbled us. Testimonies of this interpretation must be fetched for us from the divine Scriptures. For he says in Deuteronomy: If you go out, he says, to battle against your enemies, and the Lord your God delivers them into your hands, and you take their spoils as plunder, and you see in that plunder a woman of good appearance and live with her, and below: If afterwards you do not want her, you shall let her go free, because you have humbled her. You see, then, that it is not her own nature, but he who robbed her of the integrity of her modesty, who is said to have humbled her. Humiliation, then, belongs to the deed through which this flesh has been made a body of sin and a place of affliction. Again, elsewhere: If a virgin is betrothed to a man, and a man, finding her in the city, lies with her, both shall be brought out to the gate of their city and shall be stoned, and the girl shall die because she did not cry out in the city nor call on a man to help her, and the man, he says, because he humbled his neighbour's wife. Here too the reason for this language is the same: she is said to have been humbled by her corrupter. You also have a third testimony on this matter, and more if you seek them; yet hear one from the same book: If anyone finds a virgin who is not betrothed, and, doing violence to her, lies with her, and is found, he who lay with her shall give the girl's father fifty denarii, and she shall be his wife, because he humbled her; nor shall he be able to put her away at any time, because he humbled her. The same expression is repeated, so that you may understand that it is not the condition of the flesh that seems to humble us, but guilt.

Yet we cannot deny that the flesh too is humbled by many things: by the place itself, by the enticements themselves, and also by the frailty through which it lay open to error. And although it was deceived by no ordinary adversary, the serpent, yet it had no ordinary grace of its own before sin crept in: Adam was in the sight of God, he flourished in paradise, he shone with heavenly grace, he spoke with God. Did you read that he was humbled before, except after his own transgression humbled him? He surely passed on to us the inheritance of this fault, so that, set in this body, we are unwilling to sojourn away from the body and to be present with God. And therefore we humble our soul, which longs to lift itself up to God; but the corruptible body weighs down the soul, and the earthly dwellings weigh heavier, so that the mind devoted to God is frequently bent down and cannot subject itself to God, since the wisdom of the flesh, which entangles our affection, knows nothing of subjection.

Saying these things about ourselves, what do we say about the flesh of our Lord Jesus Christ? He surely took up the truth of this flesh, and therefore he humbled himself even unto death, and the death of the cross. Pay careful attention and consider each point. See that he willingly took up this form of our body and the obedience of your servitude, made in the likeness of men, not in the likeness of flesh, but in the likeness of sinful men; for every man is under sin. Therefore, and being found in appearance as a man — as it is written of him: He is both a man, and who shall know him? a man according to the flesh, but beyond man according to his working —, as a man, he says, he humbled himself, because God came to free those who had been humbled. He humbled himself, then, for our sake. His body, then, is not a body of death, since it is the body of life, nor is his flesh the shadow of death, since it is the brightness of glory, nor is there in him a place of affliction, since in that body there is the grace of consolation for all. He humbled himself so that you might learn what humility is. Indeed hear him saying: Learn from me, for I am meek and humble of heart. He humbled himself so that you might be exalted; for he who humbles himself shall be exalted. But not all who are humbled shall be exalted; for crime humbles many to their ruin. But the Lord was humbled even unto death, so as to be exalted from the gates of death.

Behold, see the grace of Christ, see his benefits. After Christ came, this flesh which was the shadow of death began through the grace of the Lord to shine and to have a light of its own; hence also it was said: The lamp of your body is your eye. But see what eye he speaks of: not the outer, but the inner. If your eye, he says, is single, your whole body will be full of light. Surely it is the inner eye which enlightens the whole body of a man; it is the inner eye too which brings blindness to the whole body, because it is written: But if your eye is evil, your whole body will be dark. You see in one man that from the place where darkness is born, from there light arises. You yourself, then, are your own darkness or light: the darkness of iniquity and the shadows of sins, the light of innocence. You yourself, then, are the author either of your injury or of your grace; the divine working errs in nothing. The light is in yourself, because your infancy is innocence, the pure mind of man before the slipperiness of adolescence and the error of youth. You, then, have made for yourself darkness out of what is light. Indeed the same eye, that is, the sense of man, is dark in the sinner, bright in the innocent.

Nor let us pass over what Symmachus says: You have afflicted us in a desert place. We are afflicted for this reason, that at times we are left destitute of heavenly protection, and this region is under a curse or in worldly slipperiness. Also, our Lord Jesus Christ had not yet blessed his earth, and therefore they laboured, and the gaze of the spiritual eyes was not directed to the light of his loving-kindness. Next, because the pleasure and delight of the world frequently creeps in. Hence we ought not to bind and tie ourselves with the bonds of that man, nor to shut our ears with wax, but to turn away the ear whenever anyone thinks fit to speak things foreign to the faith and contrary or adverse to our profit, lest in that speech the shadow of death cover us. And if anything of the kind is uttered, we ought nevertheless to put in the Word of God, which may enlighten the eyes of our mind with the brightness of its discussion.
'''
