[[commentary]]
quote='''
He who, though he was rich he says, became poor for your sakes, so that by his want you might become rich. That poverty, then, is my inheritance, and the weakness of the Lord is my strength. He chose to be in want himself, so that he might abound for all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"


[[commentary]]
quote='''
But perhaps you may say: "How is Christ rich in poverty?" Even if my own wit fails, yet the aids of the divine readings do not fail, since the Apostle has said: for the Lord Jesus became poor, though he was rich, that you might be enriched by his want. What, then, is this poverty that makes men rich? Let us consider it, let us look closely at the venerable sacrament itself. What can be purer than it, or simpler? No one is drenched with the blood of a bull, as the rites of the Gentiles are said to have it; the sinner is not washed with the gore of goats and rams — for he is not purified by it; the flesh is washed, the guilt is not cleansed away — but: water shall go forth, he says, with delight from the fountains of salvation, and a heavenly table is prepared in your sight, and the cup that inebriates, how glorious it is! These are the riches of simplicity, in which lies the precious poverty of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Asher, his bread is rich, and he will give food to princes. Asher, by Latin interpretation, signifies riches. Who, then, is rich, except where there is the depth of the riches of the wisdom and knowledge of God? Who is rich, except the Lord Jesus, who always abounds and never fails? Poor he came into this world, and he abounded for all; he filled everyone. How great in riches is he who by his poverty made all men rich! But he was poor for our sake, rich with the Father; poor, that he might deliver us from want, as the Apostle teaches, saying: for your sakes he became poor, though he was rich, that by his want you might be made rich. His want enriches, his fringe heals, his hunger satisfies, his death gives life, his burial raises up. This, then, is the rich treasure whose bread is rich. And well is it called rich, for whoever eats it will not be able to hunger. This bread he gave to the apostles, that they might divide it to the people of the believers, and today too he gives it to us, the bread which he himself, as priest, consecrates daily with his own words. This bread, then, has become the food of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 9"
