[[commentary]]
quote='''
Father, if it is possible, take this cup from me. Many stick fast at this place, who bend the sadness of the Savior into an argument for a weakness ingrown from the beginning rather than one taken on for a time, and want to twist the sense of the natural meaning. But I not only do not think it needs excusing; nowhere, indeed, do I more admire his dutiful love and his majesty; for he would have conferred less on me, had he not taken on my affection. So he grieved for me, who had nothing for himself to grieve over, and, setting aside the delight of eternal divinity, he is touched by the weariness of my weakness. For he took on my sadness, to bestow his joy on me, and in our footsteps he came down even to the distress of death, to call us back to life in his footsteps. Confidently, then, I name sadness, because I preach the cross; for he took on not the appearance of the Incarnation, but its truth. He had therefore to take on grief too, that he might conquer sadness, not shut it out. For those do not have the praise of fortitude who have borne the numbness rather than the pain of wounds; for a man, indeed, under the stroke and knowing he says how to bear infirmities.

He wished to teach us, so that, since in Joseph we had learned not to fear prison, we might learn in Christ to conquer death and, what is more, how we might conquer the sorrow of death to come. For how should we imitate you, Lord Jesus, unless we followed you as a man, unless we believed you dead, unless we had seen your wounds? How would the disciples believe that he had been going to die, had they not learned of the sadness of one about to die? So they still sleep and do not know how to grieve, they for whom Christ grieved; for so we read that he bears our sins and grieves for us. You grieve, then, Lord, not for your own wounds but for mine, not for your own death but for our weakness: and we reckoned you to be in sorrows, when you grieved not for yourself but for me; for you were made weak, but because of our sins, not because that weakness was yours, taken from the Father, but because it was taken on for me, since it profited me that the instruction of our peace should be in you and that by your bruise you should heal our wounds.

But what wonder if he grieved for all who wept for one? What wonder if, about to die for all, he is weary, who sheds tears when about to raise Lazarus? But there he is moved by the tears of a loving sister, because human things touched his mind; and here he works with a deep affection, so that, since in his flesh he was destroying our sins, the grief of his soul might also abolish the grief of our soul. And perhaps he is sad for this reason, that after the fall of Adam we had to depart from this world by such a passage that it was necessary to die: God, indeed, did not make death, nor does he rejoice in the perdition of the living, and therefore he loathes what he himself did not make.

Indeed he says: Take this cup from me, as a man refusing death, as God keeping his own sentence; for we must die to the world, that we may rise to God, so that, according to the divine sentence, the law of the curse may be undone when the end of our nature has been dissolved into the clay of the earth.

But when he says: Not my will, but yours be done, he referred his own will to the man, the Father's to the divinity; for the will of man is temporal, the will of the divinity eternal. The will of the Father is not one, the will of the Son another; for there is one will where there is one divinity. Learn, however, to be subject to God, so that you choose not what you yourself want, but what you know will please God.

Next let us consider the proper sense of the words themselves: My soul is sad, and elsewhere: Now my soul is greatly troubled — so it is not the one taking up, but the one taken up that is troubled; for the soul is subject to passions, the divinity is free — and then: The spirit is ready, but the flesh is weak. Now it is not he himself who is sad, but the soul. Wisdom is not sad, nor the divine substance, but the soul. He took up my body; he did not deceive me, so as to be one thing and seem another: he seemed sad and he was sad, not for his own Passion, but for our scattering. Indeed he says: I will strike the shepherd, and the sheep of the flock will be scattered. He was sad because he was leaving us little ones behind. For the rest, how steadfastly he offered himself to death Scripture declares, since he went to meet those seeking him, strengthened the troubled, roused the fearful, received the traitor with the condescension of a kiss.

Nor is this far from the truth, that he was sad for his persecutors, whom he knew would pay the penalties of sacrilege in evils. And therefore he said: Take this cup from me, not because the Son of God feared death, but because he did not wish even the wicked to perish. Indeed he says: Lord, do not lay this sin against them, that his Passion might be saving for all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"


[[commentary]]
quote='''
But perhaps you may say: "How did he say in the Gospel: Father, if it is possible, take this cup from me; but not as I will, but as you will?" And there seems to be a difference of will. But we understand that one thing is expressed according to the unity of the divinity, where he says: I and the Father are one, and another thing he spoke according to the affection of man, whom he taught that he ought to be cautious and not presume what he cannot easily fulfil, lest, while he seeks the prize, he fall into sacrilege. Hence he says: When they persecute you in this city, flee into another. Rightly, then, here too, being about to undergo the passion of the body, he began to be sorrowful and to be sad, and, having taken with him Peter and the two sons of Zebedee, he first said: My soul is sorrowful, and afterwards added: Watch and pray, that you may not enter into temptation; the spirit is ready, but the flesh is weak. You see that everywhere he speaks according to man, prays according to man, is sorrowful according to man, said according to man: My Father, if it is possible. What, indeed, is impossible to God? But it is man's part to doubt, God's to confirm. Therefore he took with him the readier ones, as chosen witnesses of his final judgement, who would recognize the sacrament of his words. Finally, the others were sleeping; these alone were watching with faithful mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
