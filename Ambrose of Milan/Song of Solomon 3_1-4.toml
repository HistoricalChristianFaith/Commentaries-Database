[[commentary]]
quote='''
And since through the Gospel we see the heavenly mysteries figured on earth, let us come to that Mary, let us come to Magdalene. Let us consider how they sought Christ on the bed of his body, in which he lay dead, in the nights, when the angel said to them: You seek Jesus, who was crucified: he is not here; for he has risen. Why then do you seek the living with the dead? Why do you seek in the tomb him who is already in heaven? Why do you seek in the bonds of burial him who looses the bonds of all? Not a tomb but heaven is his seat. And so one of them says: I sought him and did not find him.

Yet while they are going to tell the apostles, he had pity on them as they sought, and Jesus met them, saying: Hail. And they came up and held his feet and worshipped him. Jesus is held, then, but he is delighted to be held so, because he is held by faith. In fact that woman too delighted him who touched him and was healed of her flow of blood, of whom he said: Someone touched me; for I feel that power has gone out from me. Touch him, then, and hold him by faith, and clasp his feet faithfully, so that power may go out from him and heal your soul. Even if he says: Do not touch me, hold him; for I have not yet ascended to my Father he said. Once he said: Do not touch me, when he had risen, or perhaps he said it to her who thought he had been taken away by theft and not raised by his own power. In fact in another book you have it that to those who were holding his feet and worshipping he said: Do not fear. Hold him, then, you too, O soul, as Mary also held him, and say: I have held him and will not let him go, as both of them were saying: we hold you. Go to the Father, but do not leave Eve behind, lest she fall again. Lead her with you, no longer wandering but holding the tree of life. Snatch her up as she clings to your feet, so that she may ascend with you. Do not let me go, lest the serpent again pour out his venom, lest he again seek to bite the woman's heel, so as to supplant Adam. Let your soul say, then: I hold you and will bring you into the house of my mother and into the secret chamber of her who conceived me, that I may know your mysteries, that I may drink in your sacraments. Receive, then, Eve, no longer covered with fig leaves but clothed with the Holy Spirit and glorious with new grace, because she no longer hides as one stripped naked, but comes to meet you as one encompassed by the splendour of a shining garment, because grace clothes her. But neither was Adam naked at first, when innocence clothed him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
But neither is it enough for grace to seek perfunctorily; you must persist and be intent upon the task. Then, this one, whether the Church or the soul, who sought on her bed, sought in the nights, did not find at first; because perhaps she sought on her bed. But after she rose and went into the city (see whether it is not into that city to which the Lord, when he was about to celebrate the Passover, sent his disciples, saying (Matt. 26:18): Go into the city to a certain man), after she sought, as I said, in the marketplace, where the oil is sold which those awaiting the Bridegroom were accustomed to buy; where there is right, where there are laws. For if the law is spiritual, the marketplace too is surely spiritual, where those skilled in the eternal law dispute. This marketplace is not tumultuous with lawsuits, but glorious with the judgment seats of Christ. Where did she seek, I say? In the marketplace, and afterwards she sought in the streets, from which those were gathered who were to come to the dinner of the householder of the Gospel, those who, when called, did not think they should excuse themselves from such a feast. After she had sought, I say, in the marketplace and the streets, she fell in with those who go about the city, and then at last she was able to find what she sought; perhaps because, placed in tribulation and fear, she finds grace the more. Then she says afterwards:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
