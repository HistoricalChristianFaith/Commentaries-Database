[[commentary]]
quote='''
We have a physician—let us follow his remedy! Our remedy is the grace of Christ, and the body of death is our body. Let us therefore be exiled from the body lest we be exiled from Christ. Even if we are in the body let us not follow what is of the body. Let us not neglect the rights of nature, but let us prefer the gifts of grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Death of Satyrus 2.41"

[[commentary]]
quote='''
Rightly, then, did he depreciate and dishonour this body, calling it the body of death. For who has been able to see the splendour of the virtues with the eyes, who to grasp justice with the hands, who to behold wisdom with the gaze of the eyes? Then, when we are thinking about something, we want no one to come in our way, no one to make a noise in our ears, and we so concentrate with the mind that very often we do not see what is before us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
