[[commentary]]
quote='''
These Israelites add further, saying: You have made us a parable to the nations, a shaking of the head among the peoples. To what nations were they made so, unless those which were to believe? For the things which befell the Jews were done as a likeness, so that the destruction of the Jews should become for us a type and figure, and that from that likeness we should seek through the parable a solution for present things, by which we may guard against their examples; next, because all the affairs of the Jews are like parables, that is, like figures needing a solution. Indeed the Lord spoke to the Jews in parables, so that the unskilled might not understand and the wise might understand, as the apostles understood, and in what troubled them they questioned the Lord; but the Jews neither understood nor, again, desired to learn what they had not understood.

Learn what a parable is: Abraham, then, had two sons, one by the bondmaid and one by the free woman. The Jew did not understand this except according to the letter; he did not know which of the two sons received the father's inheritance, because he leaned towards carnal things. The parable needed a solution. The teacher of the Gentiles came, the faith of the nations, and understood that those two women are the two testaments: one from Mount Sinai, which bore the people of the Jews into servitude, which is Hagar; and therefore Sinai, which by interpretation signifies 'its measure'; for measure belongs to the Law, but grace is superabundant. Sinai is also called 'wage', and it suits the people of the Jews, who preferred to be justified by the wage of works rather than by the grace of faith. The Jerusalem, then, which was under the Law was in servitude with her children, but the Jerusalem which is above is free. And therefore Sarah, who is called 'princely', has freedom, because he who is righteous and upright is master of himself. From the two testaments, then, come two peoples, one of the Jews, the other of the nations, which believed in Christ. That people of the Jews which did not believe is in servitude; it is born according to the flesh, because it interpreted divine Scripture according to the flesh and according to the letter, not according to the spirit. But he who is of the free woman is born through the promise, that is, he to whom the promise comes from faith. He is the son of the Church, holding the freedom of grace, on whose account the Church says: Cast out the bondmaid and her son; for the son of the bondmaid shall not be heir with my son Isaac, and the Apostle says: So then, brothers, we are not children of the bondmaid, but of the free woman. This, then, is the solution: what the Jew did not know, the faith of the Gentiles has solved, poured into the minds of the nations by Paul the teacher. Therefore, then, their deeds are for us in a parable.

But the Lord too said: I became a parable to them. Those who sat in the gate exercised themselves against me; and he became a parable because, he says, you say: Physician, heal yourself. He became a parable because he rebuked those sitting in the gate; for at the going out we ought to be not idle but exercised. And therefore it is written: See that your flight be not in winter or on the sabbath, that is, not in idleness but in business. The Jews, then, sat sluggish, because those could not stand who did not know the courts of the true Jerusalem; for if they had known, they would have sought that Jerusalem. These, then, sat wearied in the gate. And he did not only say 'they sat', but also that they hated the Lord who reproved them in the gates. For he was in the gate who was about to undergo the passion of his body, through which he would depart from the earth and return to heaven. He was in the gate when he said: Walk while you have the light. What, then, is I became a parable to them, unless that Christ is the end of the Law, and his death solved the riddles of the prophets, and the things which before were unknown to the Jews when they were prophesied were afterwards made manifest by the effect of the Lord's Passion? He became a parable to them, because he offered himself as if worthless, thrusting himself upon them and not fleeing their seditions, and leading them on to the time of his good pleasure, so as to die for all men, that by his blood the race of men might be cleansed.

Likewise it is written in a parable: You shall not bind the mouth of the ox that treads out the corn. The Apostle solves this parable, saying: Is it for oxen that God has care? Or does he say it surely for our sake? For they were written for our sake. Who is it that ploughs, unless he who ploughs in hope, so as to reap in the judgement of the Lord? And therefore, like good husbandmen, when our earth has been ploughed for the sake of hope by bodily continence, let us sow not carnal but spiritual things, since from carnal things corruption is gathered, from spiritual things eternal life is gained. Let the deeds of our forefathers, then, be to us a type and figure; let the Law written in our hearts be a type, so that in it there may be for us a certain figure of things to come, not the truth. Let the Law, then, be to us as a figure, the Gospel as the light and seal of the truth.

In a parable, then, the Lord showed himself to the Jews, but they did not understand the parable, because they did not receive the physician who would heal the souls of the suffering and free them from every sickness and unevenness of ailment. He became a parable also because he took up flesh which the Jews crucified, not understanding the spiritual parable. For they understood so little that, when they were crucifying the Author of life and saw the saving flesh of the Lord hanging on the cross, they shook the head; for if they had understood, they surely would not have insulted, but would have groaned. And yet that very shaking of the head turned out for them as a likeness, so that it signified not what they meant, but what the mysteries declared. For they, according to the custom of the common people, shook their heads in insult to the Lord, as those who desire to insult the righteous shake the head if they happen to see them wearied in this world.

This shaking of the head has a twofold understanding. For those who shake the head seem blameworthy according to the authority of Scripture, since Matthew too says: Those who passed by blasphemed the Lord Jesus, shaking their heads, and Mark: Those who went past blasphemed him, shaking their heads. And that passers-by are reckoned blameworthy this same prophet teaches, who says of the vineyard of Sabaoth: And all who pass along the way gather its vintage. Indeed the verse that follows also marks this: The boar from the wood has laid it waste, and the solitary wild beast has fed upon it; and in a later passage he says: And those who passed along the way did not say: The blessing of the Lord be upon you, because he who passes by and does not stand in the courts of the Lord does not give a blessing. So, then, the Jews shook the head over the Lord Jesus so as to pass by, being men who could not have a firm and solid footing of faith. And they shook their own head, those whose head Christ ought to have been, whom the unbelief of the Jews ought not to have shaken off and thrust away. But because they did not suffer themselves to be members of Christ, therefore Christ was not their head. Nor was the Law their head either, because they were being stripped even of the Law by the people of the nations. The Word of God was not their head, because they had lost the prophets and did not have the apostles. Let this be said of the blameworthy shaking of the head. Yet there is also a praiseworthy shaking of the head: blameworthy for the Jews, praiseworthy for the people of the nations. For what is the head but that in which the senses are? For the eyes of the wise man are in his head; and these eyes, that is, the senses of your mind, must be moved, so that they may not grow sluggish through any torpor. Move, then, your prudence, move your wisdom, move your thoughts by comparing the heavenly sayings and discussing the prophetic words, so that you may not sin against the covenant of God, but your faith may be firm. For there are heretics who move their senses, yet so as to stir up unbelief, not faith.

But now we must speak more expressly of that shaking of the head itself, which has been set as a likeness of the people. Who is the head of the peoples but Christ? For the head of the woman is the man, the head of the man is Christ; but the Law too is the head of the intelligible woman. Indeed the people of the Jews is under the Law as under a husband, because law is called νόμος in Greek, and therefore the synagogue was joined to the νόμῳ as to a male, but to the bodily law, not the spiritual, that is, to the Jewish rite of the Law, by whose bonds she has been bound, not knowing the sacraments of lawful marriage. But if the Law has died, that is, the bodily interpretation of the Law, then the people, as though her former husband were dead, will lawfully marry a second husband, who rose from the dead. The Gospel is also the head of this woman. Hence certain people, interpreting mystically, have held that, when the Jewish rite was put to death, this woman married according to the Law the Gospel, as the brother of the deceased, because the Law announced the Gospel. Therefore the Law was the former husband; afterwards comes the marriage of the second husband, that is, the sacraments of the Gospel; for the two testaments are as it were two marriages. One marriage is the Old Testament, which was dissolved by the death of the former husband. And therefore that woman to whom the Law is dead rightly enters a second marriage, that is, the New Testament. So one woman is joined to two brothers, a woman for whom her former sins die and better sacraments are afterwards renewed. The Apostle has plainly set this out for us, saying: For the woman who is under a husband is bound to the law while the husband lives, that is, to the law of her husband, so as to owe him chastity. But if the husband is dead, she is loosed from the law of the husband, that is, so as to marry whom she will, provided she marries when the husband is dead, because while the husband lives she will be called, he says, an adulteress, if she is joined to another man; but if her husband is dead, she is freed from the law of the husband, so that she is not an adulteress if she is with another man. That this sacrament also pertains to Christ and the Church he showed elsewhere too, because it is a great sacrament. Here too he did not pass it over, saying: So, my brothers, you too have been put to death to the Law through the body of Christ, so that you may belong to another, who rose from the dead. How have you been put to death to the Law, unless the shadow of the Law dies for you when you approach the heavenly sacraments? For you must not approach the Gospel otherwise than loosed from the hindrances of bodily interpretation. Otherwise it is adultery to mix false things with true; but it is spiritual chastity if your soul, stripped of all the hindrances of wayward knowledge, approaches the Word of God without wrinkle. As, then, Christ is the head of the Church, so the Law is the head of the synagogue, that is, of those who are under the Law, for whose sake the Apostle made himself to be under the Law, though he was not under the Law, so as to gain those who are under the Law. And again, as teacher of the Gentiles, he became as though he himself were without law, so as to win for Christ those who were without law. And he says beautifully that he was not without the law of God and remained in the law of Christ.

But the Law was not the head of the synagogue from the beginning, because Christ was the head of the old synagogue which Moses founded and established. Indeed, hear one who says that it was founded by the word of the Lord: By faith, he says, Moses, when he was grown, denied that he was the grandson of King Pharaoh; for he chose to suffer with the afflicted rather than to delight in temporal things, and he esteemed the reproach of Christ greater riches and preferred it to the treasures of Egypt; for he looked to the reward of God's promises, which is the grace of the resurrection. But when, because of the unbelief of the Jews, the Word of God died to the unbelieving and fell from the hearts of the Jews, the spiritual understanding of the Law perished, and the synagogue married the bodily rite and the observance of unbelief. But that was not the sobriety of a spiritual marriage, but adultery against chastity. Therefore the synagogue could not be free, since she had married badly and had not believed that the resurrection of Christ would come. Hence the Church was rightly married to him, she for whom, according to the sacred dispensation, Christ died according to the flesh, so that that Jewish soul, which before had been bound by sin, might through the death of Christ be loosed from the bond of sins. A woman, then, does not marry another husband unless her husband has died, that is, unless she has been loosed from the bond of lawful love; but if her husband has died, she is freed.

She was indeed bound by the Law to be joined to the brother of her own husband, if her husband had left her no seed. This bond was tied more by the interpretation of the letter than by spiritual grace. Indeed the brother of the deceased had it in his will, if he was unwilling, not to take his brother's wife to raise up seed for the deceased. Hence he was ordered to loose his shoe, so that he might be freed from the tie of union with her whom he had shown to be estranged from his favour. For thus it is written, that he loosed his shoe and gave it to his neighbour, saying: This shall be for a testimony in Israel. And the kinsman said: Take it and acquire it for yourself. And he loosed his shoe. And the bystanders also said: May the Lord make the wife who enters your house like Rachel and like Leah, who both built the house of Israel and wrought power in Ephrathah. But this bound the Jew according to the interpretation of the letter; for the rest, it was a figure that Christ would come to earth, to raise up the seed of the dead people by right of a brother, because it was said: I will declare your name to my brothers, and: whose are the fathers, and of whom is Christ according to the flesh; or else because the Gospel would work the restoration of the dead Law in the descendants, so that the course of the Gospel might raise up the seed which the Law had not left.

It is no wonder, then, if they shook their head by perverse interpretation, so as themselves to thrust away from themselves Wisdom, the Author of their salvation, or at least, by shaking their own head, to become the cause of a shaking of the head not to a few but to peoples. This shaking of the head took place, since their sound went out into all the earth, so that all the earth might become the Lord's and the kingdom of the Lord be among the nations. Hence in a later passage too he says: The Lord has reigned, let the peoples be angry; you who sit upon the Cherubim, let the earth be moved. This Aquila beautifully interpreted by saying μετάστασιν, that is, a transmutation from place to place, from Judaea to the peoples of the nations. How the Law was moved can be shown clearly from that reading which is in the Gospel, where Scripture says: The scribes and Pharisees have sat upon the chair of Moses. All things, then, which they tell you, observe and do; but do not do according to their works; for what they say they do not do. They bind heavy burdens and lay them upon men's shoulders, but they themselves will not move them with their finger. And they do all things to be seen by men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
What is 'the scribes have sat', unless that the letter is written? Hence the scribes are also called γραμματεῖς in Greek, following the interpretation of the letter, not the understanding of the spirit; but the letter kills. Those, then, who follow the killing letter and echo it in their very name are scribes and Pharisees, that is, those who are divided from the unity of truth; for phares is interpreted 'division'. And the Pharisees divide the words of the Law in this way: they echo them and meditate on them, but do not see the mysteries and sacraments of the spiritual Law. For if the Law is spiritual, surely the precepts of the Law are spiritual and its works are spiritual. Saying, then, what Moses wrote, they bind heavy burdens with the bodily things of the Law — for those things are heavy which are contrary to the yoke of Christ — and through their wayward doctrine they lay heavy burdens on the ears of their hearers, which they themselves will not move even so far as to stir them from the bodily things of the Law to the spiritual words of Scripture. For so it is to be understood that they will not move them with their finger, that is, not even for a tiny point and moment do they carry themselves over to spiritual understanding. There is also this, that it is written: But if I cast out demons by the finger of God. What the finger is, Scripture itself interprets, which says in another book of the Gospel: But if I cast out demons by the Spirit of God. The finger of God, then, is the Spirit of God; for God is spirit and has nothing bodily in his substance, but is wholly spirit. He, then, casts out the demon by the Spirit of God who casts it out by the finger of God. Hence holy David too says: For I will see your heavens, the works of your fingers, that is: the heavens are the works of your Spirit, as it is also written: By the word of the Lord the heavens were established, and all their power by the spirit of his mouth.

To conclude the discussion, then: the scribes and Pharisees refer nothing to the inner man, who, as he himself was made in the image and likeness of God, so in the things which he thinks and meditates ought to think of things that are spiritual rather than those that are carnal. They strive, then, to refer everything to that outer, that earthly man, and therefore all their works are such as to be seen by men, not so as to please the Father who sees in secret; for they fear to reveal their works.

This, then, is the shaking of the head which took place among the peoples, or, as Aquila and Symmachus said, among the nations; for all the nations shook their head so as to interpret the Law spiritually. Let no one think that he is to be saved according to the letter of the Law, because the letter of the Law holds a curse, the spirit brings a blessing. No one can be justified by the works of the Law, because all who are under the letter are under a curse. Let all, then, flee the curse of the Law and take refuge in the grace of blessing, so as to have a blessing in the heavenly places in Christ Jesus, who died for us so that faith might pass over to the Gentiles, and who, though he was formerly the husband of the synagogue, did not desert her either, and redeemed us. For he did not desert her, so that a remnant might be saved; he redeemed us by choosing the peoples of the nations. This election of the Gentiles, then, is salvation for the Jews; for the remnant has been saved not through its own works but through the election of grace. It is, then, the grace of Christ which both redeemed us and gave life to the remnant. The shaking of the head took place among the Gentiles, but from this shaking the Jews, whose remnant has been saved, received the grace of no ordinary change.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
