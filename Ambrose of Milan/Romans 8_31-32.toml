[[commentary]]
quote='''
But do you fear the uncertain windings of life and the snares of the adversary, when you have the help of God, when you have from him such great condescension that he did not spare his own Son for you? Scripture has used a beautiful word to declare the loving purpose of God the Father towards you, who offered his Son to death. And the Son could not feel the bitterness of death; but, as far as lay with the Father, he kept back nothing for himself, he offered the whole for you, because in the fullness of the divinity he himself lost nothing, and he redeemed you. Consider a father's affection. As is the part of love, he took on the danger as of a son about to die, he drank in the grief as of bereavement, so that the fruit of redemption might not be lost to you. So great was the Lord's zeal for your salvation that he almost put at risk what was his own while he was gaining you. For your sake he took on our losses, to graft you into things divine and consecrate you to things heavenly. Wonderfully too he added: He handed him over for us all, to show that he so loves all that he handed over his most beloved Son for each one. Can it be, then, that for those for whom he gave what is above all things, he has not given all things in him? For he excepted nothing who gave up the author of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 6"
