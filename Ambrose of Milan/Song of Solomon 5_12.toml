
[[commentary]]
quote='''
His eyes too are like doves. The eyes are men adorned, namely, with spiritual senses, who are keen to see the mysteries and ready to penetrate the secrets of divine Scripture, shining with rational milk, in whom there is no spotted confusion of guile, but the spotless sincerity of a simple affection. Therefore he recalled these doves as washed in milk in the abundance of waters, saying:

His eyes are like doves upon the abundance of waters, washed in milk, of him who sits upon the fullness. The Lord baptizes in milk, that is, in sincerity. And these are the ones who are truly baptized in milk, who believe without guile and bring a pure faith, so that they may put on a spotless grace. Therefore the Bride ascends white to Christ, because she has been baptized in milk; therefore the Powers marvel at her, saying: Who is this who ascends made white (Song 8:5)? A little before she said, I am black (Song 1): now she is seen made white, and she ascends to heaven, and, leaning on the Word of God, she now penetrates the heights.

And not without reason is there an abundance of waters there, where Christ is, from which the human mind may desire to be filled. These waters the hart thirsts for, and when it has drunk them it cannot thirst. These waters the Prophet thirsted for when he said: My soul has thirsted for you (Ps. 41 (42):3). Christ, then, sits upon the abundance of waters and upon the fullness; and therefore he who baptizes in water says: And we have all received of his fullness (John 1:16). Hence too "the eye of punishments" is not foreign to the Church; because, though John baptized in Aenon, he baptized near Salim, where there was an abundance of waters, and twelve fountains, and seventy palm trees. The Church has these fountains: that is, in the Old Testament the twelve patriarchs, in the New the twelve apostles; and therefore it is said: In the churches bless the Lord God from the fountains of Israel (Ps. 67 (68):27). Whoever attains the most holy mysteries is first bathed in these fountains; for these fountains, flowing from the eternal fountain, have streamed over the whole world. Where these fountains are, there is the ascent of souls. Indeed, they have interpreted Salim as "he himself ascending"; for he truly ascends who lays aside his own sins. By this word, then, the practice of purifying sanctification is expressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
