[[commentary]]
quote='''
Nor must this be passed over, that when a lawful generation had been promised him, Abraham answered God: Let this Ishmael live in your sight. It belongs to the just man to intercede even for sinners, and therefore let the Jews believe at least this, that he intercedes for them too, if only they believe. For this is to live in the sight of God: to carry on affairs worthy of the word of God; for the eyes of the Lord are upon the just.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
