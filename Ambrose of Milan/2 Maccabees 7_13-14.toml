[[commentary]]
quote='''
And when he had been killed, he ordered the fourth to be bound to the wheel, so that by its turning he might be loosened in all his limbs. But he, while he was being savagely tortured: 'You dissolve the limbs of the body' he said 'but you add grace to the passion, and you do not snatch its solace from death.' For there is the voice of thunder in the wheel, because in the good and unstumbling course of this life the heavenly oracle resounds, as it resounded in John and in James, the sons of thunder. And so what I have read I now recognize more clearly, that a wheel runs within a wheel and is not hindered. For a smooth life, without any stumbling, turns in any suffering whatever, and within these things too the wheel runs. The Law runs within grace, and the observance of the Law is within the course of divine mercy; for the more it is turned, the more it is proved. 'It is better here to bear adversities from the ungodly, so that there we may find consolation from the Lord'. And he too, finishing his course, broke off his breath and, a victor, poured out his soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
