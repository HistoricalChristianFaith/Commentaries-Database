[[commentary]]
quote='''
But that the men in Sodom were savage and sinners in the sight of the Lord exceedingly: this is no slight dispensation, so that you may notice that the gentle God is moved to vengeance by the heavy bitterness of sins, and that not undeservedly Abraham could not obtain pardon for the Sodomites by entreaty, because they were wicked beyond measure. Very many are the more hidden the more wicked they are, who escape the tracking of men, where things are done without a witness, or a just man is circumvented by false testimony; yet he remains just before God, even if he is condemned by men, because God looks not at the outcomes of trials, nor at affairs interwoven with the contrivances of wickedness, but at the naked nature of affairs. But in the examination of men the error of false opinion mostly covers over the force of truth. Susanna remained exceedingly chaste before God even when she was condemned for adultery, because God did not examine the truth of the deed by the assertions of false witnesses, but questioned the conscience of the inmost mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
