[[commentary]]
quote='''
Tortures were applied to the sixth also. But he: 'Do not' he said 'err in vain and ascribe it to your power that you exercise these things against us. This is the price of our offences, that we are punished as sinners; and thanks to the Lord, that here our sins are exacted from us twofold, so that there consolation may be brought to us. Thanks also to you, that you are so hard and pitiless, so that through such tortures of ours the Lord, against whom we have sinned, may become merciful to our nation. We too lighten our hardship, while we delight in the sufferings of faith'. And he too, torn apart by hard and harsh tortures, was laid beside his brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
