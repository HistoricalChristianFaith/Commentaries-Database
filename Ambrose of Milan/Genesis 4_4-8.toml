[[commentary]]
quote='''
Good is diligence with wisdom, and discovery with natural talent. Indeed, holy Isaac, having union with wisdom close at hand, was walking in the field, or rather was withdrawing himself. Let us too first be united with wisdom, and so go out into the field, desiring to seek and to find. For many seek badly without wisdom. And therefore Cain, because he had not received prudence from God, sought badly and went out badly into the field; Abel well, who fulfilled the perfect gift of sacrifice; for good is the sacrifice of wisdom, good victims are faith and every virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
