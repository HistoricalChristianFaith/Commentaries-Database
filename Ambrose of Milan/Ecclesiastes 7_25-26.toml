[[commentary]]
quote='''
I hated the whole of life said Ecclesiastes. He who hated life certainly proclaimed death. Indeed, he praised the dead more than the living, and judged him blessed who has not come into this life nor taken up this empty labour. My heart went round he says to know the gladness of the ungodly, and to consider and seek wisdom and number, and to know through the ungodly man gladness and trouble and tossing, and I find it more bitter than death: not because death is bitter, but because it is bitter to the ungodly. And yet life is more bitter than death. For it is heavier to live for sin than to die in sin, because the ungodly man, as long as he lives, increases sin; if he dies, he ceases to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 7"
