[[commentary]]
quote='''
In that place the Lord appeared to him and said: To your seed I will give this land. See how by a promise, as though by one often repeated, he shapes and trains one who is still weak, and how Abraham, mindful of himself, ascribes everything to God and claims nothing for himself. Therefore also he built an altar to God, who appeared to him, and withdrew from there to the mountain east of Bethel, desiring to see the Sun of justice still rising for him. And therefore he pitched his tent not in the valleys but on a mountain, because God is God of the mountains and not of the valleys.

And he called upon the name of the Lord. Where Bethel is, that is, the house of God, there also is the altar; where the altar is, there is the calling upon God. And not undeservedly did he make such great progress, because he hoped that God would be a help to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"
