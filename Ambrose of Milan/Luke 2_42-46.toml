[[commentary]]
quote='''
And when he had reached twelve years. From the twelfth year, as we read, the beginning of the Lord's teaching is taken; for this number of those preaching the Gospel was owed to the proclaiming of the faith. Nor is it idly that he, unmindful of his parents according to the flesh, he who according to the flesh was being filled with the wisdom of God and with grace, is found after three days in the temple: it was to be a sign that after three days of that triumphant Passion he who was believed dead would rise again and present himself to our faith in the heavenly seat and in divine honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
