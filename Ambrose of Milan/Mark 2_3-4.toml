[[commentary]]
quote='''
The housetop, then, is the office of a sublime mind and the summit of the soul, by which the naked infirmity of the body is covered. Hence it seems to me that that paralytic too, who was let down from the roof by four young men, was holy for this reason, that with the support of four virtues, prudence, fortitude, temperance and justice, he laid himself at the feet of Christ by a certain lofty reasoning. For nothing is more exalted than humility, which, being as it were higher, knows not how to be lifted up, because no one aspires to what he judges to be beneath him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
