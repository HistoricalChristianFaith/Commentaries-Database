[[commentary]]
quote='''
Holy Rachel, moreover, that is, the Church or prudence, hid the images, because the Church knows nothing of empty ideas and the vain shapes of images, but knows the true substance of the Trinity. In short, she abolished the shadow and manifested the splendour of glory. Let us, then, who seek the sun, leave the shadow behind; let us who follow the light forsake the smoke. Smoke is iniquity, because as smoke is to the eyes, so is iniquity to those who practise it. Life is a shadow; for a shadow is our present life on earth, as Job said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
