[[commentary]]
quote='''
Now the greatest testimony to this good is that he who has it does not seek other things. For what should he seek who despises lower things and clings to the most excellent, as it is written: let the stag of friendship and the foal of graces converse with you? And let friendship go before you and be one with you at every time; for good is the friendship of the virtues and the love of the highest good. Therefore that perfect man seeks nothing else but the sole and glorious good. Hence he also says: one thing I have asked of the Lord, this will I seek, that I may dwell in the house of the Lord all the days of my life and see the delight of the Lord. Nor should you disdain him as narrow and needy because he is content with the solitary company, as it were, of one good. For surrounded by its friendship he will be manifold. For it is abundantly sufficient to such a man for blessedness and for the possession of the good, and therefore he desires nothing else. For he who has all things seeks nothing as if it were new. For there is nothing of the good that he does not have, nor does he delight in superfluous things, but in necessary ones, and in that very necessity only in so far as it is necessary not to himself but to the flesh that clings to him; and he grants it what does not disagree with the purpose of the inner man, so that he may make both one and reconcile to God the inner man and the outer alike, so that in both there may be one spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 7"

[[commentary]]
quote='''
The beauty of the soul is pure virtue, and her comeliness is the truer knowledge of higher things, so that she may see that Good on which all things depend, while it depends on nothing. By it, then, she lives and receives understanding. For that supreme Good is the fountain of life; love and desire for it are kindled in us; to draw near to it and be mingled with it is pleasure; to one who does not see it, it is an object of desire, and in one who sees it, it is present; and therefore he despises all other things and is soothed and delighted by this. This is what supplies substance to all things, while itself, abiding in itself, it gives to others, but receives nothing into itself from others. Of it the prophet says: I said to my Lord: You are my God, since you have no need of my goods. This alone he desired to see, as he himself says elsewhere: One thing I have asked of the Lord, this will I seek: that I may dwell in the house of the Lord all the days of my life, and see the delight of the Lord, and consider his temple. If, then, anyone has been found worthy to see that pure and incorporeal supreme Good, what else would he have to desire?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
