[[commentary]]
quote='''
I have done judgment and justice; do not hand me over to those who slander me. Where there is justice, there is mercy. Mercy frees from sin. How then am I handed over to sinners? Like this is that saying in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? I have put off the tunic of the sinner and the covering of the earthly man; why am I judged as a sinner and an earthly man? I have washed my feet, so that no lot of sin might cling to my footstep; why do you give power over me to those who transgress?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
