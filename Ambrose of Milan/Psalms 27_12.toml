[[commentary]]
quote='''
Cain said: Am I my brother's keeper? and he lied to himself. Ananias said that he had brought the whole price of his sold land, and he lied to himself, who could have offered less without fraud. And therefore he says splendidly: And iniquity has lied to itself. For it lies first to itself when it lies to its own ruin; he sins against himself who robs himself of the sweetness of innocence. For what fruit is sweeter than purity and simplicity of heart, what food more pleasant than that on which the mind of one with a good conscience and the heart of the innocent feast?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
