[[commentary]]
quote='''
And he added: by this I knew that you have desired me, because my enemy will not rejoice over me. Above he spoke of his Passion as a man; from here he now reveals his majesty: that he alone is without sin, he alone over whom the sinner could not ride, he alone whom the Father loved as his only Son. For what reason, then, did the enemy not rejoice over him? Because, although he took on death for us, yet he rose again, and himself insulted the enemy, whose victory he destroyed and whose sting of death he broke. And we, although we are sorrowful in this world, and the enemy rejoices in our grief and in the contrition of our heart and mind, yet by rising again we destroy his joy. Whence Micah too said: do not rejoice over me, O my enemy, because I have fallen, for I shall rise again. It is the resurrection, then, by which all the chains of the enemy are loosed and his every triumph is abolished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
