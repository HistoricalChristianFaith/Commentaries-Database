[[commentary]]
quote='''
Not idly, moreover, nor superfluously do many seem to be troubled at the passage that follows, because the Lord spoke thus: Since the male who has not been circumcised and has not circumcised the flesh of his foreskin on the eighth day, that soul shall perish from its kind, because he has broken my covenant. For it is thought harsh that the negligence of the parents should turn to the harm of an infant of eight days, so that his soul should perish, when the Law itself has appointed cities even for the homicide who has nevertheless committed the deed of killing a man not voluntarily, so that by fleeing to them he may merit impunity for the blood. How then is account taken there of an accidental killing, and here no account taken of infancy, in which there could be no crime either of neglect or of will, unless perhaps some think that the parents are punished more heavily in the death of a son? But it is thought unjust that for the fault of the guilty a penalty should be inflicted on the innocent, or that the innocent should be punished on account of the penalty of the guilty, or that one unlike in desert should be made a partner in the punishment. Hence some think that he is speaking of the parent being cut off, that it is his soul that perishes, not the little one's. But this is very doubtful, although what he says supports this assertion: because he has broken my covenant. Therefore this seems rather to be referred to one who understands than to an infant. Others think that the Lord God is threatening heavier things to the parents even by his silence, so that the elders may fear the more when not even the infant is spared.

But to me it is clear enough that it was said of the mind of each one. For we have said that by the name of the male the mind is signified, because the vigour of the mind is strong and draws the soul into union with itself, and is more vehement, as being superior in sex and in manly strength. So this is the reason: that every mind which has not been circumcised from bodily superfluities and purged by the solemn rite, so as to strip itself of the vices of the passions, shall perish. Not the flesh, he says, shall perish, not the man, but that soul shall perish, because it could have been saved if it had had purification; but, bare of protection and made weaker by the filth of an uncircumcised heart, it could not preserve the salvation of its kind. Now every kind seems immortal. As man is the genus and the individual the species, man is always spoken of, the individual not always; or rather, the individual does not fail. He fails who does not have faith. The person of one fails; the condition or the name of men does not fail. So from what is lasting and harmless the sinner is led down into what is temporal and harmful, and he ought to ascribe to the infancy of his mind that he was incautious and intemperate, or did not acquire the remission of sins. Unless one has been reborn of water and the Holy Spirit, he cannot enter into the kingdom of God. Certainly he excepted no one, not the infant, not one prevented by some necessity: though they may have that hidden immunity from punishments, I do not know whether they have the honour of the kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
