[[commentary]]
quote='''
But still these are but slight examples of the testimony to the Lord. The full assurance of faith is the cross of the Lord, His death and burial. Hence He adds, And blessed is he who shall not be offended in me. For the cross may cause offence, even to the elect. But there is no greater testimony than this of a divine person. For there is nothing which seems to be more surpassing the nature of man than that one should offer Himself for the whole world.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And therefore, when he had said those earlier things, he added: Blessed he says is he who shall not be scandalized in me.

For the cross could bring scandal even to the elect, but there is no greater testimony than this to the divine person. There is nothing that seems more to be beyond human things than that one should have offered himself for the whole world; by this alone the Lord is fully declared. Indeed so he was designated by John: Behold the Lamb of God, behold him who takes away the sins of the world. But this answer is given not to those two men, John's disciples, but to us all, that we may so believe in Christ, if the deeds agree. For one will come who will usurp this name for himself, whom, though you cannot distinguish him by the appellation of the name, you may yet discern by consideration of his deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
