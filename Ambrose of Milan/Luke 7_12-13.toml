[[commentary]]
quote='''
For this widow surrounded by a great multitude of people seems to be more than the woman who was thought worthy by her tears to obtain the resurrection of her only son, because the Church recalls the younger people from the funeral procession to life by the contemplation of her tears, who is forbid to weep for him to whom resurrection was promised.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But when he drew near to the gate of the city, behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a great crowd with her. And when the Lord saw her, moved with mercy he said to her: Do not weep. And he came near and touched the bier.

This place too overflows toward both graces, so that we both believe that the divine mercy is quickly bent by the lamentation of a widowed mother, especially of one who is broken either by the suffering or by the death of an only son, though the crowd at the funeral wins for her the merit of a widow's dignity; and that this widow, surrounded by a crowd of peoples, seems to be more than a woman, she who by her tears merited to obtain the resurrection of her only son, a young man, because holy Church, in regard for her tears, calls back to life from the funeral procession and the last rites of the grave the younger people, she who is forbidden to weep for him to whom resurrection is due.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
