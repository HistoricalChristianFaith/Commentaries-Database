[[commentary]]
quote='''
And it came to pass, while Zechariah was performing the priesthood in the order of his course before the Lord God according to the custom of the priesthood, that it fell to him by lot to put on the incense, entering into the temple of the Lord; and the whole people was praying outside at the hour of incense.

Saint Zechariah seems here to be designated a high priest, because, as we have read, from the first tabernacle, into which the priests always entered in accomplishing their ministries, he entered into the temple at one time only of the year: but into the second, once a year, the high priest alone, not without blood, which he offers for himself and for the offences of the people. This is that high priest who is still sought by lot, because the true one is still unknown; for he who is chosen by lot is not comprehended by human judgment. That one, then, was being sought, and another was being figured. That one was being sought, the true priest for ever, to whom it is said: You are a priest for ever, who would reconcile God the Father to the human race not by the gore of victims but by his own. But then blood was shed in semblance, in semblance a priest was ordained; now, because the truth has come, let us leave the semblance and follow the truth. And then indeed there were courses, but now there is perpetuity. So he was, and certainly he was, whose place was even then being filled by turns.

By lot, then, the priest was chosen to enter the temple. If therefore in the type no witness could be brought in, what else was signified but that that priest would come whose sacrifice would not be in common with the rest, who would sacrifice for us not in temples made with hands, but in the temple of his own body would empty out our sins? By lot, then, the priest was sought. For that reason perhaps the soldiers too cast lots for the garments of the Lord: so that, since the Lord was preparing to offer sacrifice for us in his own temple, the shaking of the lot around him too might fulfil the precept of the Law. On this account he says: I have not come to destroy the Law, but to fulfil it, surely so that he might be the one who would be seen both as awaited by the Old Testament and as chosen by the commandment of God. Indeed the lot fell also upon the apostle Matthias, lest the choice of an apostle should seem to depart from the command of the old Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
