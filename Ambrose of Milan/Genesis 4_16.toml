[[commentary]]
quote='''
Golden is this vessel, is this cup; in this cup is the poison of death, the poison of passion, the poison of drunkenness. He who drinks this is shaken and falls. He is shaken not only in body but also in his troubled heart; for to be shaken belongs to sin.

Therefore, Cain, departing from the sight of God dwelt in the land of Naid, which interpreted signifies "shaking." Therefore he who is drunk from a golden cup is shaken by sin. Why do you put yourself under the curse of that parricide Cain, that you may tremble and be shaken? And the persecutors of the Lord also, passing by, wagged their heads; for they were being agitated by the Evil Spirit who is accustomed to shake bodies filled with himself. And when he is wanting, the trembling ceases; but drunkenness causes a perpetual trembling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapters 15-16"
