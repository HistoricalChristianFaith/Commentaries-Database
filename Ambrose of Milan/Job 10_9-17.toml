[[commentary]]
quote='''
The necessity of this body, then, begets many occupations for us, and habit brings them in, by which the vigour of the soul is hindered and its attention called away. Hence holy Job beautifully says: remember that you fashioned me of clay. If, then, the body is clay, it certainly smears us, it does not wash us clean, and it defiles the soul with the defilement of intemperance. With skin and flesh, he says, you clothed me, with bones and sinews you wove me together. And so our soul is bound and stretched by the sinews of this body, and therefore at times it grows stiff, often it is bent. And he added: you did not make me innocent of iniquity. For if I am ungodly, woe to me! But if I am just, I shall not be able to recline; for I am full of confusion. You have brought temptations upon me. For what is this life but full of snares? We walk among snares, we move among very many temptations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
