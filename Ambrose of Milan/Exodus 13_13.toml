[[commentary]]
quote='''
Then you may learn to know the difference between what is a masculine and what is a feminine trait, for there is no virtue without toil and toil is a stepping stone to virtue. The very words of the Law point this out: The first-born of an ass thou shalt change for a sheep. The Law has established that an unclean animal shall not be part of a sacrifice, but in its place a clean animal be offered. The Law orders that the offspring of an ass which is unclean should be changed for a sheep, which is a clean animal and suitable for sacrifice. This is the literal meaning. If one were to pursue this matter further and seek for the spiritual sense of this passage, he will discover that the ass is a laborious animal, whereas the sheep is productive. This may be interpreted to mean that labor should be exchanged for produce, since the final results of work is the produce thereof. Or we may interpret the passage in this manner: Every action or labor of yours you can make commendable by the pure and simple manner in which you perform it.

And if thou do not redeem it, we are told, thou shalt kill it. The order literally states that another animal be offered for the unclean one or be redeemed by a price, lest there be something inferior or something unclean in the tithe offering. If we examine more deeply into the meaning of this, we perceive that we should refrain from anything which is destined to bear no fruit. He who redeems does, in fact, free himself and in doing so pays off a certain amount of indebtedness. Those works should be avoided which do not lead to real fruitfulness and to good results. I refer to those works of a wordly sort which cannot long endure. These works are barren, and devoid of truth and, though they are pursued with the greatest diligence, provide nothing for the soul. All of those works that impose servitude on our souls are of no avail, even if they are not entirely lacking in effectiveness. A mighty victory can, for example, take place and the accompanying glory of a triumphal march. But we discover frequently that these same people see their previous victory now changed to defeat. The tables are turned when the issue of war finds them in the hands of their enemies. Those who were victorious before now taste the misery of defeat. It is imperative, therefore, that you direct all your labors towards God and obtain His approval. The athlete, for example, relies on his own powers, not on those of another, in order to win a victory. But then, when the spectacle begins, he inclines to doubt his chances. When he has attained the crown of victory, then he becomes aware that this worldly glory fades away more quickly than the very leaves of his wreath of victory. When a pilot brings his ship to shore, he gives no thought to putting an end to his labors. He searches immediately for still another opportunity to work. When the soul is released from the body and has reached a terminus of this life, there is still the dubious problem of the judgment to come. What is thought to be a terminus turns out to none at all. Wherefore let us by our prayers, our purity of conscience, and our spirit of charity cling closely to our God. Let us gain His favor by beseeching Him to rescue and free us from the cares of this world as from some cruel and boorish master. Let the substance of our prayers be that we be released from slavery to this world, so that we may obtain the liberty of celestial knowledge, wherein alone is true freedom.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 2"

[[commentary]]
quote='''
I seem to be more fully aware of the words and the secret meaning of the Law when I read that call of Christ. He has taught us that an ass should be exchanged for a sheep or redeemed for a price. In this way we not only can exchange an ass for a sheep, that is, an animal that is unclean for one that is clean, but we can even redeem it. A deeper meaning seems to be implied in this statement. If by a sacrifice of purification and by the rite of baptism we first cleanse ourselves of the stains of our offenses, then we are prepared to redeem those very sins of ours by the exercise of good works and by the price of faith and by contrition.

Our price is the blood of Christ. Hence the Apostle Peter says: Not with gold or silver you were redeemed, but with the precious blood. And Paul says: You have been bought with a price. Do not become the slaves of men. Therefore, not without reason did they marvel in the Gospel on seeing the Lord Jesus sitting on a colt, because the race of the Gentiles is to Christ like a victim which, according to the Law, is considered to be unclean. Hence we read in the Scriptures that the Levites redeemed them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 3"
