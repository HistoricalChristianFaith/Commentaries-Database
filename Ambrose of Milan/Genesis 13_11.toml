[[commentary]]
quote='''
Finely does Scripture say: Lot chose for himself, that is, turning aside, because God has set before us good and evil, that each may choose what he wishes. Let us not, then, choose what seems more pleasant in appearance, but what excels in truth, lest, when the option has been granted us to follow the better things, we lift up our eyes, enticed by the false beauty of pleasantness, and overshadow the truth of nature as with averted gaze.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
