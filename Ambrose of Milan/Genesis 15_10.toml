[[commentary]]
quote='''
As to his saying: Abraham divided the bodies and sat down by them, lest anyone think it an inspection of entrails, I do not deny that the words belong to haruspicy — for so I hear — but since the reading asserts that a division was made of the bodies of the four-footed animals and not of the birds, surely, if there had been an inspection of these, a division of the birds too would have been made, so that the inspection might take place. What if this agrees with our faith? And so let us seek what the teaching of the word gives us beyond haruspicy. We said above that in the heifer we take the earth, in the she-goat water, in the ram air. This is gathered from the very name, in that they are commanded to be taken for the sacrifice three years old, because the earth itself is divided among three kinds of itself — for it is either mainland or island or peninsula — and water itself into three, because it is either sea or rivers or lakes; for springs or wells are private matters, by no means worthy of a general and public division; wells lie hidden, springs give origin to the others. The air too has the divisions of the seasons, spring, summer and winter. And this is the division of the world. To what does this serve? That we may know that God is the author of these things and the ruler of all, who has given order to all things and has distinguished them by that division, so that from these you may gather that God can bestow on you what you devoutly ask, and fulfil what he pledges.

And so Abraham, because he had answered the Lord who promised him the inheritance of the land: Whence shall I know that I shall be heir of this land?, is instructed through those kinds of victims to believe that God is above the world, who has divided all the things of the world with provident distinction, but that the things which are divided are dissolved afterwards, while the things which are not divided — for he did not divide the birds, that is, the turtle-dove and the dove — are never dissolved. For faith remains whole, which in the manner of the dove rises on high, surveying the things above and flying round heaven on the spiritual oarage of its wings. To the turtle-dove too is compared that mind which, after the habit of this bird, is nourished in secret places, seeking that intelligible and undivided substance of the Trinity, shunning a kind of rabble of creatures, not mingling itself with a bodily company, and setting itself apart from every stain of the passions. This sacrifice is asked of you. He who offers such victims, faith and purity of mind, the grace of simplicity, the affection of charity and peace, recognizes himself as heir of that blessed land, as the Lord too declared more openly in the Gospel, saying: Blessed are the peacemakers, for they shall possess the land.

Take another division. Our flesh too has all its members divided by the very ordering of God. There are two eyes, two ears, two cheeks, divided nostrils, a double row of teeth. Breasts, shoulders, hands, sides, thighs, knees, feet, shins: are they not all in pairs, so that all our functions may seem to be supported by doubled aids? The soul too admits a division of its parts. For διορατικόν, that is, the higher parts, as if certain opposite eyes, is the rational and the irrational. The rational itself is divided into mind and speech, its sensible part into hearing and sight, by which the grace of this life is heaped up. For smell and taste seem to provide a necessary service for the use of life. The nostrils, by receiving the life-giving inhalation with continual breath, feed the substance of man with a kind of continuous food; taste is produced by drink and meals; while the fifth sense, that is, touch, is as it were mixed in with those four. Smell and taste are rather certain nourishments of the body, by which the service of this flesh is sustained, while sight and hearing help the mind. These are the divisions which have been divided by the supreme maker according to our flesh and soul.

Hence we must gather that this world too is arranged as though through certain paired members and, as it were, ἀντιπρόσωπα (facing each other): the earth into mountains and plains, as some parts of our body are higher, others flatter. The shoulders stand out, and the upper parts of the feet or of the hands, while the sides and the lower parts of the neck are like worn and hollow valleys. This may also be understood of the palm of the hand; for who doubts that in the very heel of the foot some parts stand out while the middle parts are curved inward? Water is salt in the sea, sweet in the river or in springs. The air is cold in winter, temperate in the months of spring, hot in summer. These things, then, the maker divided; but our mind, which, borne like the birds on the oarage of diverse virtues and of its own vigour, flies up above heaven, he did not divide, because it clings to the Trinity, which divides all things and alone is undivided. Hence the philosophers hold that the higher substance of this world, which they call ether, does not consist of an admixture of the other elements, but, being splendid and shining with much light, and admitting nothing of the filth of the earth, nor of the moisture of the waters, nor of the cloudiness of the air, nor of the redness of fire itself, they assert to be of a certain fifth usia, and to be, as it were, the winged mind of this world, swifter and purer than the other parts. For the other parts are mixed with one another and compounded; but we think nothing exempt and free from material composition except that sole substance of the venerable Trinity, which is truly pure and simple, of a sincere and unmixed nature, although some think that a brighter light is of that fifth usia, the light of which David said that God is clothed about with light as with a garment, and of which the Apostle wrote concerning the almighty God himself that he alone has immortality and dwells in light inaccessible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
