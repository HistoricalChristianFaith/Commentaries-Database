[[commentary]]
quote='''
But above, too, he says likewise: His soul shall dwell among good things, and his seed shall inherit the land; that is, the soul of him who fears God shall abide among good things, so as to be always in them and in accordance with them. This can also be taken of one who is in the body: that he too, if he fears God, may abide among good things and be in heavenly things, and possess his body and rule over it as over a thing brought into servitude, and possess the inheritance of glory and of the heavenly promises.

Hence we too, if we wish to be among good things after the death of this body, should take care that our soul is not glued to this body, not mixed with it, not clinging to it, not dragged by the body, and does not, as if drunk with its disturbances, stagger and waver; nor should it entrust itself to the body and to its delights so as to commit itself to its senses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"
