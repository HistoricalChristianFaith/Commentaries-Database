[[commentary]]
quote='''
Nor should you fear that your heart may be troubled at the sight of the angel — for we are troubled and estranged from our own disposition when we are dazzled by the encounter of some higher power —; for the same angel who meets us will be able to strengthen us, as he strengthened Zechariah, troubled before, in mind, saying: Do not fear, Zechariah, for behold, your prayer has been heard, and your wife Elizabeth shall bear a son, and you shall call his name John; and he shall be a joy to you, and many shall rejoice at his birth.

Divine benefits are always full and overflowing, not confined within a small number but heaped up in a rich accumulation of good things, as here: first the fruit of prayer, then the childbearing of a barren wife, then the gladness of very many and greatness of virtue. A prophet of the Most High too is promised; nay more, lest there should be any doubt, the name of the one to come is also designated. Since so many things, then, were flowing beyond his prayer, not without reason is silence the penalty of distrust, which we shall explain in what follows. But there is a solemn gladness at the birth and begetting of saints; for a saint is not only a grace to his parents but also the salvation of very many. Hence we are admonished in this place to rejoice at the begetting of saints.

Parents too are admonished to give thanks no less for the birth than for the merits of their children; for it is no small gift of God to give children, propagators of the race, heirs of the succession. Read that Jacob rejoiced in the begetting of twelve sons; a son is given to Abraham; Zechariah is heard. The fruitfulness of a parent, then, is a divine gift. Let fathers therefore give thanks because they have begotten; sons, because they have been begotten; mothers, because they are honored with the rewards of marriage; for sons are the wages of their warfare. Let the earth bloom unto the praise of God because it is tilled, the world because it is known, the Church because it is increased by the number of a devoted people. Nor was marriage joined by the command of God at the very beginning of Genesis to no purpose, but so that heresy might be destroyed. For God so approved marriage as to join it, so rewarded it that divine love granted children to those whom barrenness had denied them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
