[[commentary]]
quote='''
It is written at the head of the book: A lamb without blemish, clean, full-grown, male, a yearling, shall be yours, and the whole synagogue shall slay it. Who this lamb is, you have heard him say: Behold the Lamb of God, behold him who takes away the sin of the world. This is he who was slain by the whole people of the Jews, whom they still persecute with hostile hatred. And indeed it was fitting that he should die for all, so that in his cross there might be remission of sins and his blood might wash away the defilements of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Nor is it without purpose that he ran to the oxen, took a tender and good calf, and set it before them with milk. Indeed, in Exodus, when he was declaring the Passover of the Lord, Moses says: The lamb shall be for you without blemish, clean, perfect, a year old, a male; you shall take it from the sheep and the kids. And you shall slay it he says the whole multitude of the synagogue, towards evening. Hence here too it is described as midday when hospitality is offered by Abraham to the Lord. But for the supper the calf is sacrificed and eaten with milk, that is, not with blood, but with the purity of faith. A good calf, as being one that would wash away sins; tender, because he acknowledged the yoke of the Law not with a hard neck but with a soft one, and did not refuse the gibbet of the cross. And rightly tender, he of whose head and feet and inward parts nothing was left, and not a bone was broken from him, but he passed wholly into the food of those who feast. Such a one the shadow of the Law prefigured for us; such a one the truth of the Gospel has shown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
