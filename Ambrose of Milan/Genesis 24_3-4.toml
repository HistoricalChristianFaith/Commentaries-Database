[[commentary]]
quote='''
He bound him, moreover, not to bring a wife for his master from the seed of the Canaanites, the author of whose race had not honoured his father and therefore passed on to his descendants an inheritance of cursing, so that we may learn that faith, and a certain inheritance from the stock of its author, is to be sought in those whom we wish to join to ourselves: for with the holy you will be holy, and with the perverse you will be perverted. If this is so in other matters, how much more in marriage, where there is one flesh and one spirit! And how can love agree if faith disagrees? And therefore beware, Christian, of giving your daughter to a Gentile or to a Jew. Beware, I say, of bringing home as your wife a Gentile or a Jewess or a foreigner, that is, a heretic or any woman alien to your faith. The first faith of marriage is the grace of chastity. If she worships idols, whose adulteries are proclaimed, if she denies Christ, who is the teacher and rewarder of chastity, how can she love chastity? Even if she is a Christian, it is not enough unless you are both initiated in the sacrament of baptism. You must rise together to prayer, and God must be besought with joined petitions. Another mark of purity is added if you believe that the marriage that has fallen to your lot was given to you by your God. Hence Solomon too says: from God he says a wife is prepared. Those unequal in faith cannot believe this, so that one would think the grace of marriage was bestowed on him by one whom he does not worship. Reason teaches it, but examples warn us more fully. Often a woman's allurement has deceived even the stronger husbands and made them depart from religion. Either have regard for love or beware of error. The first thing sought in marriage is religion. Therefore Abraham sought to give his son a kinswoman.

You too, seek a kinswoman. Who is one's neighbour? He who showed he says mercy. The Lord Jesus says this in the Gospel. You too, seek one who is near to the seed of Abraham and akin to your neighbour. The seed of Abraham is Christ; he is the neighbour of all, who showed mercy upon all, taking away the sin of the world. Learn what is to be sought in a wife. Abraham sought not gold, not silver, not possessions, but the grace of a good nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
