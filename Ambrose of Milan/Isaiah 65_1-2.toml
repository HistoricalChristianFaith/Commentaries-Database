[[commentary]]
quote='''
Shut in, therefore, on every side, they turn the attempts of their faithlessness to this, that they assert it to be incredible that God took up flesh; but on what reasoning he could not take it up they cannot explain. For I ask whether they reckon that flesh could not be taken up by God by reason of impossibility or of injury? If of impossibility, is anything, then, impossible to God? For there is nothing that he has willed to do and could not do. It remains, then, that it be shown whether he willed or did not will. But what greater sign of his will is there than what he himself said: I appeared openly to those who did not seek me. I spread out my hands to a people not believing and contradicting? If, then, he willed and was able, do we think that he did not will by reason of injury? And what injury to itself does the divinity feel? For it is free of insult and is not subject to our passions; for flesh could bring the divinity neither loss nor increase.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 5"
