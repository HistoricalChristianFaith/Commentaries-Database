[[commentary]]
quote='''
So the daughters of Jerusalem, seeing her clinging to Christ and still ascending with him — for he deigns often to come to meet those who seek him and to come down to them, so as to lift them up — say: Who is this who comes up from the desert? — this place on earth seems a desert and uncultivated, overgrown with the briars and thorns of our sins —, marvelling, that is, how the soul, which before was left in the underworld, clings to the Word of God and has ascended like a shoot of the vine raising itself to the heights, like smoke born of fire and seeking the heights, and besides how she is fragrant with good fragrances. Now that fragrance breathes the sweetness of devout prayer, which is directed like incense in the sight of God. And in the Apocalypse we read that the smoke of the incense went up with the prayers of the saints, which incense, namely the prayers of the saints, is borne by an angel upon that golden altar which is before the throne, and it is fragrant like a sweet ointment of devout supplication, because it is composed of petition for eternal and invisible things, not for bodily ones; above all, however, she is redolent of myrrh and frankincense, because she is dead to sin and lives to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"
