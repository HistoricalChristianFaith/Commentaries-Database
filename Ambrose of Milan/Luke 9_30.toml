[[commentary]]
quote='''
Peter goes up, who received the keys of the kingdom of heaven; John, to whom his mother is entrusted; James, who first mounted the priestly throne;

then Moses and Elijah appear, that is, the Law and the prophet with the Word; for neither can the Law be without the Word, nor is anyone a prophet except one who prophesied of the Son of God. And those sons of thunder indeed beheld Moses and Elijah too in bodily glory, but we too see Moses with the Son of God every day; for we see the Law in the Gospel when we read: you shall love the Lord your God; we see Elijah with the Word of God when we read: behold, a virgin shall conceive in the womb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
