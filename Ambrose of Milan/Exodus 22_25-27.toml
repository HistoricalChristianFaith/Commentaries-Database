[[commentary]]
quote='''
Not new nor negligible is this evil, which is restrained by the precept of the Old and Divine Law. The people who had despoiled Egypt, who had crossed the sea on foot, is warned to beware shipwrecks from the money of usury. And although it has prescribed once or with many times repeated admonition concerning other sins, most frequently has it referred to usury. You have in Exodus: But if thou lend money to a ward, to an orphan, to a poor man among you, thou shalt not strangle him nor oppress him with usury. It shows what strangling is, that is, oppressing with usury, for, what is even worse, the noose of the creditor strangles the soul. With this word it has expressed the violence of the robber and the suffering of a horrible death. If thou take of thy neighbor a garment in pledge, thou shalt give it him again before sunset. For that same is the only thing wherewith he is covered, this is the clothing of his dishonor, in what shall he sleep? But if likewise he cry to me I will hear him. Have you heard usurers, what the Law says, concerning which our Lord said: I am come not to destroy the law but to fulfill it? What the Lord did not destroy, do you destroy? "To seek usury", he said, "is to strangle". This has also been said later by certain of their wise men outside the fold. "What is it to take interest? It is to kill a man", he says. But surely Cato was not before Moses who received the law. He was much later.

If thou take of thy neighbor a garment in pledge thou shalt give it to him again before sunset, lest the shame of a naked man should be revealed. But you despoil and strip and do not return. See to it lest the sun go down upon your greed, and lest the sun of justice should go down for you because you do not hold to justice, or the sun of iniquity sink upon your wickedness. Day also ends for a man though against his wish; night falls as upon Judas, who when the devil had gone into his heart arose for the betrayal, and it became night; for the sun of justice had set for him, and there rested upon him one who had entered into his heart. He made darkness about him that he might not see the author of light. There the wretch perished at that banquet through which others are saved. Give back therefore his garment to the debtor, in which he may sleep and be at rest. If you will not return it I will hear him, he says, because I am merciful. If you do not hear him, I shall hear him, I shall pity him, I shall not despise the prayer of the needy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 14"
