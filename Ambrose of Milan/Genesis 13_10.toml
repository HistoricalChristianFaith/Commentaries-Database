[[commentary]]
quote='''
And Lot lifted up it says his eyes and beheld all the region of the Jordan. Boastfulness is a friend to those who turn aside from the truth. Then, as Abraham acted more humbly, who offered the choice, so Lot more insolently, who usurped the choice — virtue humbles itself, but iniquity exalts itself — he who ought to have entrusted himself to the more mature, that he might be safer; in short, he did not know how to choose. For first he lifted up his eyes and beheld the region, that is, that thing which was not first in order but third, that is, last. For first are the goods of the soul, second those of the body, that is, health, strength, beauty, grace of form; third are those that befall us, that is, riches, powers, country, friends, glory. The region, then, is placed in the third rank; for it is a matter of habitation.

He saw, then, the region which was watered, before God overthrew Sodom and Gomorrah, like the paradise of God and the land of Egypt, until you come to Zothopa. In this, unless you attend carefully, can you say that he erred in choosing the neighbourhood of the Jordan and the places that were watered like the paradise of God? Not, surely, according to the letter; but since the Jordan is also called descent. For he descends who has deserted the fellowship of virtue and chosen appearance, not truth. For paradise is the delightfulness of perfect beatitude, or the foundations of a fruitful soul, in which are the seedbeds of wisdom, of justice and of the other virtues; but the land of Egypt signifies bodily substance, whose seedbeds are the senses and the passions of the body. So, just as the green growth of the virtues has Christ for its fountain, and the richness of spiritual grace by which to abound, so intemperance is a kind of fountain of bodily passions, by which superfluous things are nourished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
