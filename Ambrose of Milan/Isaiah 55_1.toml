[[commentary]]
quote='''
He then who is wise is free, bought with the price of the heavenly oracles, with that gold, that silver of the Divine Word; bought with the price of blood (for it is no small thing to acknowledge one's Redeemer;) bought with the price of Grace: he who heard and understood the words, Ho every one that thirsteth, come ye to the waters, and he that hath no money, come ye, buy and drink and eat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252031-40.html'
source_title="Letter 37, 15"

[[commentary]]
quote='''
Let us buy, then, the food with which we can drive away hunger. Let no one be held back by consideration of his poverty; let no one who has no silver be afraid. Christ does not seek silver, but faith, which is more precious than silver. Indeed, Peter bought him, who had no silver. Silver, he says, and gold I do not have, but what I have I give you. In the name of Christ Jesus rise and walk. And the prophet Isaiah says: You who thirst, go to the water, and all you who have no silver, go, buy and drink and eat without silver and without the price of wine. For he did not seek a price from us who paid the price of his own blood for us, because he redeemed us not with gold and silver but with precious blood. Therefore you owe that price with which you were bought. Even if he does not always demand it, still you owe it. Buy Christ for yourself, then, not with what few have, but with what all have by nature, but few offer through fear. What Christ asks back from you is his own. He gave life to all; he offered his death for all. Pay for your Author what you will pay by law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"

[[commentary]]
quote='''
The Mystical Table also is obtained by fasting, that Table of which David says: Thou hast prepared a table before me, against them that afflict me. Hunger is acquired at a price, and that cup which inebriates with the sobriety of the heavenly Sacraments is sought by thirst. For the Lord has said: You who thirst go to the water: and whoever of you have no money, go and buy and drink and eat. And elsewhere He says: Behold they who serve me shall eat, but you shall be hungry: behold they who serve me shall drink, and you shall be thirsty. Who are "you" unless you who have drunk before, concerning whom He has said above: You have set a table for demons, and have filled the cup of Fortune? Therefore if holy fasting leads us to that venerable table, if by this hunger we can purchase those things which are eternal, why do we hesitate about the things which are within the sphere of human use, since fasting makes these also more pleasing for us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"
