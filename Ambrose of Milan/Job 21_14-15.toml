[[commentary]]
quote='''
For the abundance of prosperity is a great enticement to offend: it lifts one up into pride, it pours in forgetfulness of the Author. Consider that rich man in the Gospel reclining on crimson and purple, from whose table that just poor man Lazarus gathered the crumbs: does not that rich man seem to you to say to God: Depart from me; I do not wish to know your ways? And truly men of this kind do not wish to know the ways of the Lord; for if they wished, they would know them, but because they are full of toil, they are shunned and avoided by the lost. So, like a drunken man, he does not recognize the Author of salvation. Then, turning to his drinking companions, Let us eat, he says, and drink. What does it profit if we serve him? Or what advantage is there if we observe him? These things, then, says the man drunk with the abundance of worldly things, because the deserts of crimes are not repaid at once in the world; for he lay back at his ease, because everything was at hand for his pleasure, and, conscious of his ungodliness, whose punishment was being deferred, he thought that God did not see the crimes of the ungodly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
