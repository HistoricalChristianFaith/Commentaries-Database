[[commentary]]
quote='''
We have here the message of the Scriptures which declares: ‘Children, love your fathers; parents, do not provoke your children to anger.’ Nature has implanted in beasts the instinct to love their own brood and hold dear their own progeny. They know nothing of relations-in-law. Here, parents do not become estranged from their offspring by the act of changing their consorts. They know nothing of preferences given to children of a later union to the neglect of those of a former marriage. They are conscious of the value of their pledges and are unacquainted with distinctions in respect to love, to incentives due to hate, and to discriminations in acts that involve wrong-doing. Wild creatures have a nature that is simple and one which has no concern in the perversion of truth. And so the Lord has ordained that those creatures to whom He has bestowed a minimum of reason are endowed with the maximum of feeling.

What wild animal would not willingly face death in defense of her young? What wild beast, although exposed to countless armed men advancing ‘in wedge formation,’ would not protect with her own life’s blood her own progeny? With her body she sets up a wall of stout defense around her little ones, so that they are immune from peril in the midst of ‘a harvest of spears’? What has man to offer—he who pays no heed to what is enjoined on him and is oblivious to the dictates of nature? A son despises his father; a father disinherits his son. An occasion when a man’s own progeny is condemned to death is regarded as an act of justice. A father actually passes judgment on himself by treating his own child as something without real substance. An act in which nature is punished with sterility is considered to have the sanction of authority.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
