[[commentary]]
quote='''
While you are going with your adversary to the magistrate, on the way take pains to be freed from him, lest perhaps he condemn you before the judge, and the judge hand you over to the exactor, and the exactor send you to prison. I tell you, you will not come out from there until you pay even the last farthing. Matthew too set this down, but he in a particular sense, this one in a general; for he thought it was said of restoring peace between brothers at variance, this one of repentance and the amendment of every offense. Let us then discuss who the adversary is, who the magistrate, who the judge, or who the exactor, or what we should think the farthing is, which, unless one has paid it, he is sent to prison.

And according to Matthew the adversary is one with whom you seem to have been least of all at peace in this life, who pursues you before the judge to come of the dead and the living with the charge of an abiding enmity; but according to Luke our adversary is above all that one who sows the enticements of sins, that he may have as partners in punishment those whom he had as companions in error; and therefore he seeks associates in guilt, that he may betray them as liable to punishment. The apostle Peter warns us to beware of him, saying: your adversary the devil, like a lion ravening and roaring, seeks whom he may devour.

According to Matthew our adversary is every practice of virtue and the apostolic and prophetic word, which binds us to harsher precepts and to the teachings of a harder life, with which it befits us to agree, so that we emulate it by works, lest by some stubbornness of ours we be shown to have fallen away from it. But according to Luke nothing is more our adversary than our own lapse, which accuses us by the evidences of our life; not that any judge to come seeks the service of an accuser, but because before him who takes cognizance of all, our own conduct accuses us, when it is found a stranger to the practice of virtue and to the apostolic precepts.

So every practice of the vices is an adversary to us, lust is an adversary, avarice an adversary, all wickedness an adversary, every unjust thought an adversary, every bad conscience, in short, which both afflicts us here and in the future will accuse and betray us, as the Apostle testifies, saying: their conscience bearing them witness and their thoughts among themselves accusing or even defending. But if conscience betrays each one, how much more is the work of our deeds present before God, which, expressed in our body, will be reviewed at the last time, and the secret of our thought, written in our hearts, will be read! Let us therefore take pains that, while we are set in this course of life, we may be freed from wicked action as from an evil adversary, lest, while we go with the adversary to the magistrate, he condemn our error on the way.

Therefore also according to Matthew he says: be agreeing with your adversary, while you are with him on the way; but the Greek said εὐνοῶν, that is, well-wishing. For if, while we are in this life, we release ourselves from the bonds of the devil, neither will he be condemned on our account, and we shall be strangers to his bonds. Hence also Psalm 79 (80) is written for the Assyrian. For you counsel well for the adversary and act for that Assyrian, that is, the vain one, if, freed from his snares, you show him this good will, so that he escapes the penalty of your lapse and of death. But if you stick fast in his bonds, he will hand you over as a defendant to the magistrate, he who is both accuser and betrayer.

Who is the magistrate except him with whom is all power and who claims for himself the lofty dignity of full and perfect time, to whom the holy prophet, relying on the consciousness of good works and not fearing the adversary, hastens, saying: my soul has thirsted for the living God; when shall I come and appear before the face of God? For this magistrate will hand the defendant over to the judge, that is, to him to whom he gave power over the living and the dead, and gave it by nature, not by grace; for he did not receive a power that he did not have, but that which he took from the substance of the Father when he was begotten. He who showed you the accuser shows you this magistrate and judge, and shows when he is to be revealed. In the day, he says, when God will judge the secrets of men according to my Gospel through Jesus Christ our Lord. This then is the judge, Jesus Christ, through whom secrets are convicted and the penalty of wicked work is ordered.

Do you wish to know that Christ is the judge, who hands over to the exactor and sends to prison? Ask him himself, or rather read him in the Gospel, saying: take him and send him into the outer darkness. He himself also showed his exactors in another place, where he says: so it will be at the consummation of the world; the angels will go out and separate the wicked from the midst of the righteous and send them into the furnace of fire: there will be weeping and gnashing of teeth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
