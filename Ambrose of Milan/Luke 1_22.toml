[[commentary]]
quote='''
But a nod is a certain action of the body, without speech endeavouring to declare the will, yet not expressing it.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But in one man the voice of the people was put to silence, because in one man the whole people was addressing God. For the word of God has come over to us, and in us is not silent. He is dumb who understands not the Law; for why should you think the man who knows not a sound, to be more dumb than him who knows not a mystery. The Jewish people are like to one beckoning, who cannot make his actions intelligible.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he was nodding to them. So Zechariah remained dumb and was nodding to them. What is a nod but a kind of bodily act without a word, striving to indicate the will and not expressing it, a kind of dumb speech of the dying when the voice has been suppressed by death at the last? Does not the people of the Jews seem to you like him, so irrational that it cannot give an account of its acts, a people which, set in the last decease of living hope, has lost the voice it had, which by the act of a tottering body longs to set forth the sign of a word, not the word? Dumb, then, is the people, without reason, without the Word. For why should he seem to you more dumb who does not know the sound than he who does not know the mystery? There is surely a voice of works and a cry of faith, as we have read: The blood of your brother cries to me. And he cries who cries in his heart all day. So he who has lost the cry of the heart has lost that of the tongue; for he who does not hold the distinctness of faith, how can he hold that of words? And before, indeed, Moses had said that he could not speak, but after he had spoken, he received the word and brought forth the brightness of good works. So as Moses was a type of the people and a type of the Law, so too Zechariah was silent.

We must consider, then, how each thing concurs: the word in the womb, the Law in silence; John is named and Zechariah speaks; the word is brought forth, the Law is released, but the release of the Law is the unfolding of the word; and so he who has said the word speaks, even if he did not speak before. Zechariah is commanded by an angel to be silent, by an angel the voice of the Jews is suppressed; for this is the command not of human but of divine power, that he should not speak to God who did not believe Christ. And so let us believe, so that we may speak; let the Jew believe, so that he may be able to speak. Let us speak mysteries in the spirit; let us understand the reason of the ancient sacrifices, the riddles of the prophets. He is dumb who does not understand the Law, he is dumb who does not understand the sequence of the divine Scriptures; for our voice is faith. And so: I would rather speak five words in the church with my mind, so as to instruct others, than ten thousand words in a tongue; for tongues are for a sign not to the faithful but to the unfaithful, but prophecy not to the unfaithful but to the faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
