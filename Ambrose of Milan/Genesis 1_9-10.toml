[[commentary]]
quote='''
And now, on the statement: ‘Let the waters be gathered together in one place,’ the question would arise: How could one body of water be formed from what is scattered over lakes, marshes and swamps, also waters which inundate valleys, plains and level lands, stemming from springs and from rivers? Moreover, how could these waters form one mass, whereas today waters are scattered in diverse seas? For we speak of such varied seas as these: the ocean, the Tyrrhenian, Adriatic, Indian, Egyptian, and Pontic seas, the Propontic, the Hellespont, Euxine, Aegean, Ionian, and Atlantic seas. Many also speak of a Cretic Sea and of a Northern Caspian. Let us therefore consider the meaning of the words of Scripture and weigh them with exactitude.

‘Let the waters,’ He said, ‘be gathered together in one place.’ The mass of water is continuous and unbroken, yet there are different coastal bays, as a profane writer states. For the Pontus is a very large bay of our sea [the Mediterranean] to which different names are given in different places. Rightly so, because the regions adjacent to these bodies of water give them special names, yet there is but one mass of water, because one continuous and unbroken body of water extends from the Indian sea up the shores of Cadiz and from there extends to the Red Sea, to the extreme limit of the world, which is enclosed by the circumambient Ocean. Within this circle the Adriatic mingles with the Tyrrhenian Sea, while other seas form a union with the Adriatic—seas distinguished from it by name, but not by a difference of water mass.

Hence, God has fittingly said: ‘The getting together of waters he called seas.’ And so there is one general mass which is called a sea and many bodies of water which are called seas after the regions where they are situated. Just as there are many lands, such as Africa, Spain, Thrace, Macedonia, Syria, Egypt, Gaul, and Italy, which are given names from their respective regions, so there is but one earth. In a similar manner, there are many seas named after their locations, but there is but one actual sea, as the Prophet says: ‘Thine are the heavens and thine is the earth, the world and the fulness thereof Thou hast founded; the north and the sea thou hast created.’ And the Lord Himself says to Job: ‘I have shut up the sea with doors.’

Now that we have spoken of one mass, the question arises how a single body of water could drain the land of water, although that water had previously possessed all the land, poured into the hollow places in the mountains, plains, and valleys—water which lay stagnant in an universal inundation. For, if everything was covered in this way—for He would not have said: ‘The earth appeared,’ unless He wished to indicate that it was uncovered everywhere—if the flood in the time of Noe hid even the mountains when there already was a separation of the waters above the heavens and those below the firmament—if this were so, then how can one doubt that the tops of the mountains were hidden in the inundation we speak of? Whence, then, came that overabundant supply of water? What reservoirs were there, so continuous and unbroken as to hold all the water in place?

On this subject there is much at hand for the formulation of reply. First of all, the Creator of all things had the power of enlarging space—a power which some before us have in their private opinion laid down as a possibility. And I am not overlooking in this case the potency of God; but what He actually has done, which I have not learned from the clear testimony of Scripture, I pass over as a mystery, lest, perchance, that stir up other questions starting even from this point. Nevertheless, I maintain in accord with the Scriptures that God can extend the low-lying regions and the open plains, as He has said: ‘I will go before thee and make level the mountains.’ The very force of water can also make its bed deeper by the violent movements of the waves and by the impact of the surf of that wild element which day by day stirs up the bottom of the sea, drawing forth sands from its very depths.

Who, then, knows how far that mighty sea pours its waters which, unapproachable even to daring navigators, encloses the British Isles with its innumerable bays and extends even to remote regions, unknown and unrecorded even in legendary tales? Who is not aware of the mass of water from the sea which has seeped into the numerous lakes, such as the Lucrine and Lake Avernus in Italy, Lake Tiberias, too, in Palestine, not to mention that lake that lies in the desert region of Arabia between Palestine and Egypt, and the water which has seeped into the several ports made by Augustus and by Trajan, as well as into many similar ones throughout the entire world?

Still, there are some lakes and standing waters which are not connected with other waters, such as Lake Como, Lake Garda, the Alban lake—and many others. How then can one speak of one mass of water? But, just as God made two luminaries, the sun and the moon—although there still exist, to be sure, the lights of the stars—in like manner, we speak also of one mass of water, although there are very many such. The reason is that what has not been taken in consideration in any enumeration is not reckoned in the sum total.

But it seems that, while I was speaking of the sea, I exceeded my bounds a little. Let us return to our theme and let us reflect on the words of the Lord: ‘Let the waters be gathered together into one place and let the dry land appear,’ He did not say: ‘Let the land appear.’ Who does not note the appropriateness of this statement? For the earth could be a composite of mud and water, and thus its appearance would be concealed by the inundating water. The term ‘dry” applies not only to the general nature of the earth, but can also be used in a specific way, so that the earth may be useful, firm, suitable, and ready for cultivation. At the same time, it was provided that the earth would, to all appearance, have been dry by the hand of God rather than by the sun, for the earth actually became dry before the sun was created. Wherefore, David, too, distinguished the sea from the land, referring to the Lord God: ‘For the sea is his and he made it, and his hands made the dry land.’

The word ‘dry’ is the expression of a natural characteristic; the word ‘earth’ is a simple name of a thing which has in itself that same characteristic. Just as the word ‘animal’ is a generic term which includes within it a certain notable property, and as man has his special characteristic which is reason, in like manner the word ‘earth’ can be used indifferently of what is saturated with water or of a place ‘in a desert land and where there is no way and no water.’ Therefore, the land saturated with water has within it elements of dryness, as it has been written: ‘He hath turned rivers into a wilderness and the sources of waters into dry ground,’ that is to say, He made dry the land that was before filled with water.

The earth, therefore, has its own peculiar property, just as the individual elements have, for each has its own characteristic: the air is humid, water is cold, and fire is warm. That these are the chief qualities of each of the elements can be determined by our observation. If we should desire to make a test of these elements with our bodily senses we find that their qualities exist in a certain combination. For example, we discover earth to be dry and cold; water, cold and humid; air, warm and humid; fire, warm and dry. Thus, each and every one of the elements is bound together by qualities shared in common with some other element.

Since earth has a quality both dry and cold, it is connected with water by association of its cold quality, and through water it is related to the air because the air is humid. Hence, water seems to embrace with its two arms, as it were, cold and humidity, on the one side, the earth, on the other, air—the earth with its quality of coldness, the air with its quality of humidity. Air, by its nature, also forms an intermediary between two opposing elements, that is, between water and fire, for it binds both elements together. It shares with water the quality of humidity and with fire the quality of warmth. Fire, too, since it is by nature warm and dry, is bound to air by its quality of warmth, and, because of its dry quality, is turned back to form an association and a union with earth. In this manner these elements, by a circuitous process, meet together in a dance measure of concord and association. Hence, the Latin elementa is found in Greek as στοιχεῖα, denoting agreement and harmony.

We have come to this point because Scripture says that God called the earth ‘dry,’ that is to say, He denominated by its natural quality that which is its prime characteristic. The natural characteristic for earth is dryness. This is a quality reserved for it. Its prime quality, therefore, is dryness. A secondary quality is that of coldness, but this does not take precedence over its primary trait. The fact that it is humid is also derived from its kinship with water. Hence, the former characteristic is peculiar to the earth, the other is alien: dryness belongs to earth; humidity is alien to it. The Author of nature accordingly adhered to what He had first granted to the earth, for one quality is founded on nature; the other comes from an [external] cause. The peculiar qualities of the earth, therefore, ought to be determined from the primary qualities, not from what is accidental, in order that our knowledge might be formed from an observation of the preferred characteristic.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
‘And God saw that it was good.’ We do not fail to record the fact that some do not believe that either in the Hebrew or in other versions it is said: ‘The waters were gathered together into their places and dry land appeared. And God called the dry land Earth and the gathering together of the waters he called Seas.’ Also, when God said: ‘And it was so done,’ they are generally of the opinion that there we have the words of the Creator signifying the fulfillment of the work. But, because in regard also to other created things there is found first the formula of a command and afterwards the repeated indication or execution of a work, for that reason we do not think that which is considered an addition to be in the nature of an absurdity, even if by other interpreters sufficient proof may be presented for either its truth or its authenticity. Much that was added or attached to the Hebrew version by the writers of the Septuagint we have discovered not to be superfluous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
