[[commentary]]
quote='''
And God cast Adam into a deep sleep and he slept. What does the phrase deep sleep signify? Does it not mean that when we contemplate a conjugal union we seem to be turning our eyes gradually in the direction of God's kingdom? Do we not seem, as we enter into a vision of this world, to partake a little of things divine, while we find our repose in the midst of what is secular and mundane? Hence, after the statement, He cast Adam into a deep sleep and he slept, there follows: The rib which God took from Adam he built into a woman. The word "built" is well chosen in speaking of the creation of a woman because a household, comprising man and wife, seems to point toward a state of full perfection. One who is without a wife is regarded as being without a home. As man is considered to be more skilful in public duties, so woman is esteemed to be more adaptable to domestic ministrations. Reflect on the fact that He did not take a part from Adam's soul but a rib from his body, that is to say, not soul from a soul, but bone of my bone and flesh of my flesh will this woman be called.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 11"
