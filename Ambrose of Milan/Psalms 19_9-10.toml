
[[commentary]]
quote='''
The judgments of the Lord are true, justified in themselves, more to be desired than gold and very precious stone (Ps. 18 (19):10 and 11). What is severe in others is sweet in Christ, is pleasant in Christ, because he himself is pleasant: Finally, taste and see that the Lord is pleasant (Ps. 33 (34):9). Sweet are the judgments to one who confesses, because he himself says: I am, I am he who blots out your iniquities, and I will not remember them: but do you remember, and let us be judged. Tell your iniquities, that you may be justified (Isa. 43:25 and 26). Sweet are the judgments to one who does penance, because he himself has said: There will be joy over one sinner doing penance more than over ninety-nine just who need no penance (Luke 15:7). If, then, the judgments of the Lord are sweet, let us labor to gather the fruits of their pleasantness. Do you wish to know how sweet are the judgments of the Lord? He who believes in him is not judged (John 3:18). Sweet, then, are the judgments to those who believe; but those who do not believe have not been condemned by the judgment of Christ, who came not to judge the world but to save and redeem it; rather they have undergone the judgment of their own impiety, since they would not believe in the remission of sins. For they cannot share in the benefit of him whom they refused to know. Those, then, who have not believed in him are seen to be unworthy of his judgment. For recognize what his judgment is, as he himself says: And this is the judgment, that the light has come into this world (ibid. 19). Sweet, then, because it is light; sweet the judgment, because mercy goes before it; for so it is written: Mercy and judgment I will sing to you, O Lord (Ps. 100 (101):1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
