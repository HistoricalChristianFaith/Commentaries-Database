[[commentary]]
quote='''
What shall I say of Joseph, who, set upon by his brothers, stripped of his father's garment, cast into a pit and sold into slavery, expressed a clear sign of the Lord's incarnation, in that he, the beloved of the Father, being in the form of God, did not think it robbery to be equal with God, but emptied himself, so that, taking the form of a servant, he came and humbled himself even to the death of the cross, he who, bought and sold by his own brothers, redeemed the human race by his price?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"
