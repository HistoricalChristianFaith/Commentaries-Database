[[commentary]]
quote='''
But in the mystical sense the people of the nations desires that he whom the people of the Jews crucified should remain inviolate from injury, and, as regards faith, it believed the word, that is, inferring that health is given to men by Christ not by the power of a man but by that of God. But as regards the mystery, it saw that Christ could not yet enter into the breasts of the Gentiles. And therefore he who had not yet washed away the stains of his past thinking thought himself burdened rather than helped by the Lord's condescension. So the widow of Zarephath judged herself unworthy of the prophet's hospitality. And therefore the Lord in this one man sets forth the faith of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
