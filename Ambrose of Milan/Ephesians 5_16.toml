[[commentary]]
quote='''
And again he himself warns us that we ought to beware, because the days are evil. What days are evil? Those, surely, in which evil is known, which is from the evil one. Or perhaps the days of the world are evil, because the world is set in wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
