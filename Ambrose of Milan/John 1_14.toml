[[commentary]]
quote='''
It is written, they say, "The Word was made flesh." It is written. I do not deny it. But consider what follows, for there follows: "And dwelt among us," that is, that word that took on flesh, this Word dwelt among us, that is, dwelt in human flesh, and so he is called Emmanuel, that is, "God with us." So this statement, "The Word was made flesh," stands for that which took place. He became man even as he said in Joel: "I will pour out of my spirit upon all flesh," for the future pouring out of spiritual grace is promised not for irrational flesh but for humanity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Sacrament%2520of%2520the%2520Incarnation%2520of%2520the%2520Lord.html'
source_title="On the Sacrament of the Incarnation of the Lord 6.59"

[[commentary]]
quote='''
Of divine things, however, I do not dare to speak of an adultery, though a godly one, lest even the sound of the word offend anyone, though a more reverent sense is ready to hand. Yet, as may be said more cautiously, if not more expressly: from unequal unions a godly cohabitation was made when the Word was made flesh. For the partnerships of divinity and flesh are not lawful, nor do the divinity and the flesh keep, as it were, the law of a lawful marriage-bed, as by a certain covenant of nature flesh is joined to soul and soul to flesh. God took up flesh, assumed a soul; through an unwonted and not lawful incarnation he made the partnership to be lawful, so that God may be all and in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 10"
