[[commentary]]
quote='''
Do not, he says, hope in iniquity, and do not covet plunder; if riches flow, do not set your heart on them. You see that they flow in; do you not see that they flow past? Naked you were born, naked you will die. Why do you seek to take in what you cannot take away with you? What you admire are streams; as they come, so they pass and recede. The Jordan alone was turned back, the Jordan into which you went down, which admonishes you to return to the very fountain and origin of nature, which brought you forth naked, not clothed in a garment, so that you may learn not to seek superfluous things. That you blush to be naked, sin taught you, not nature; for there would be no shame about the genitals if there were no sin. For neither are the other animals clothed so as to be covered, nor are they clothed so as to be protected; all are protected enough by the covering of their own nature. We, while we seek superfluous things, have lost the covering of nature, have forfeited the common right. And therefore a healing teaching is ascribed in this psalm, because by spiritual exercise he trained either Jeduthun, or himself under his name, for undergoing temptations, so that one who is set in straits may subject himself to God and, if he has sinned before, may cease to sin and not be moved by a relapse into error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
