[[commentary]]
quote='''
The Holy Spirit too came down and filled the whole house, in which a great many were sitting, and there appeared tongues divided as of fire. Good are the wings of love, true wings, which flew through the mouths of the apostles; and wings of fire, which spoke a purified speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
