[[commentary]]
quote='''
His special merit it was, as we have said, to see the rise of the Church in this mystery and to receive the oracle that Christ would be born of his line. For the one thing belongs to the Church, what he said: Behold, we heard of her in Ephrathah, we found her in the fields of the forest; the other belongs specially to the pledge of the Lord's body, which is revealed by a most manifest oracle when it is said: Of the fruit of your womb I will set upon my throne. Yet do not be careless of so great a promise; for it was not given without a condition, but, if you keep the covenant and observe the testimonies of the Lord, which in the Gospel he promises he will speak, to you too access to the eternal throne will lie open.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
