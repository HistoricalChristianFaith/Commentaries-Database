[[commentary]]
quote='''
The innocent man indeed believes every word, nor does he often change himself into various arts, as cunning does, which, to be wary, fears everything and does not trust itself to its own counsels, but turns its own opinions over and over; but simplicity knows nothing of fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
