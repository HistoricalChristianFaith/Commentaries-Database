[[commentary]]
quote='''
So through the nature of the tree the appearance of the synagogue is indicated, fruitful in its second yields — for we are from the seed of the fathers — and rightly are the Jews compared to dropping green figs, because with a fattened heart and a very hard neck they cannot come to their own perpetuity. If they die and as it were drop off from this world, so as to be reborn into the inner man through the grace of the washing, they will surely be fruitful. But the unbelief of obstinate men made the synagogue useless, and therefore, as barren, it is ordered to be cut down.

What was said of the Jews I think all must beware of, and we most of all, lest, empty of merits, we occupy the fertile ground of the Church, we who, like pomegranates, ought to bear blessed fruits within, fruits of modesty, fruits of union, fruits of mutual charity and love, enclosed in the one womb of mother Church, lest the wind harm them, lest the hail shake them off, lest the heat of desire scorch them, lest the shower of moisture crush them.

Some, however, think that this fig tree is by allegory a figure not of the synagogue but of malice and wickedness. These, however, differ in nothing except that they choose the genus instead of the species; and they say that they are guarding against this, because the Lord said to the fig tree: may fruit never be born from you forever, whereas we surely know that very many of the Jews have believed and will believe. But he who believes is no longer the fruit of the synagogue but of the Church, and he is not born of the synagogue who is reborn in the Church. For as there are those who went out from us, but were not of us, for if they had been of us, they would have remained with us, so we say of those of the Jews who believe that, if they were of the synagogue, they would remain in the synagogue, but they went out from the synagogue for this reason, that they may be believed not to have been of the synagogue. Moreover, he would otherwise be interceding for malice and saying that it should be cultivated so as to bear fruit, when the Lord came for this very purpose, to abolish the seeds of wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
