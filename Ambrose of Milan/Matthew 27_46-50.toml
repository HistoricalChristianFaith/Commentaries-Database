[[commentary]]
quote='''
Indeed Matthew says: he sent forth the spirit; for what is sent forth is voluntary, what is lost is of necessity. Therefore he added: with a loud voice. In this there is either the glorious profession that he had descended even to death for our sins — so neither shall I blush to confess what Christ did not blush to profess with a loud voice — or the evident manifestation of God testifying to the separation of the divinity and the body. For so you have: Jesus cried with a loud voice, saying: God, my God, look upon me! Why have you forsaken me? The man cried out, about to die by the separation of the divinity. For since the divinity is free of death, there could certainly be no death unless life departed, because the divinity is life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
