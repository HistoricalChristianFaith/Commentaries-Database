[[commentary]]
quote='''
At the head of the book it is written: Bone of my bones and flesh of my flesh. For this reason a man shall leave father and mother and shall cleave to his wife, and the two shall be in one flesh. Who it is that spoke, or of whom this sacrament is, hear him saying: This sacrament is great, but I say in Christ and in the Church. Hence he also admonishes that a man should love his wife as Christ loves the Church, because we are members of his body, of his flesh and of his bones. What greater salvation, then, than to be with Christ and to cleave to him in a certain unity of body, in which there is neither any spot nor the filth of sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
