[[commentary]]
quote='''
Rightly naked, then, because she lost her cloak; or perhaps naked because it sometimes belongs to virtue not to have a covered breast, not to have a veiled heart. Accordingly, that veiled one, that is, the synagogue, which had a veil in the reading of the Old Testament, a veil which is not lifted, since it is done away in Christ — that veiled synagogue, I say, Christ despised and spurned; whence even today a veil is laid upon the heart of the Jews. But she who is turned to the Lord with her whole mind is naked and open to view. For when anyone has turned to the Lord, the veil will be taken away, so that, beholding the glory of God, we may be able to see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 9"
