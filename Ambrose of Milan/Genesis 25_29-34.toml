[[commentary]]
quote='''
Temperance, then, is the forerunner of correction, the mistress of discipline.

Setting out from this, holy Jacob received from his brother the rights of the firstborn, which he did not have, and, preferred with his brother's assent, taught for the future that the intemperate are worthless even in their own judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 2"

[[commentary]]
quote='''
What made Esau the slave of his brother? Was not the food, sweet for the moment, bitter afterwards? What gave Jacob the mastery of his brother? Was not contempt of food bitter temporarily, but salutary thereafter?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 11"
