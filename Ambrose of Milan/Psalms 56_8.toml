[[commentary]]
quote='''
But I think that he who does penitence, who afflicts himself, ought to enumerate not his good things but the sins he has committed. Indeed, as I think, we are taught this by those verses in which he says: God, I will declare my life to you; you have set my tears in your sight. For he does not announce his life as innocent, where tears are shed, which usually undertake the embassy for sins. Unless perhaps we understand it thus: that, even if someone is innocent, he cannot be secure, since he has daily contests against most grievous enemies, and therefore, even where a glad conscience shines, the fight is yet tearful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
