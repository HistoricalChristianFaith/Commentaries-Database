[[commentary]]
quote='''
‘Consider the lilies of the field,’ what brilliance in their petals, how they appear to arise in packed rows all the way to the top so as to form a goblet! Note how within it gleams like gold, and, furthermore, how around its edge as a defense against any injury a kind of rampart is constructed! If any one were to pluck this flower and take each petal apart, what craftsman’s hand is so expert as to be able to restore the form of the lily? Who is such an effective imitator of nature as to presume to reconstruct this flower, to which the Lord has so borne testimony as to say: ‘Not even Solomon in all his glory was so arrayed like one of these’? A king so rich and wise was deemed inferior to the beauty of this flower!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
