[[commentary]]
quote='''
Hence the holy man, who dreads the judgment of God, wishes always to cleave to Christ and to place his hope in him, so as to praise the Lord, to whom is honour, glory, everlastingness from the ages, and now and always and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 11"
