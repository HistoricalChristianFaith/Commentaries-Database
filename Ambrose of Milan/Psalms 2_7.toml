[[commentary]]
quote='''
Immaculate he returned to the Father, from whom immaculate he went forth when he descended to earth. Whence the Father says to him: you are my Son, today I have begotten you, that is: I recognize in you the privilege of my generation, you whom no stain of sin could defile. You lived among sinners, you took up the sins of all, you were made sin for all, you were made a curse for all, but no practice of sin could pass over to you. So you lived among sinners as though you were living among angels. You made the earth to be what heaven is, so that there too you might take away sin. Today I have begotten you, in whom I am well pleased. You have proved yourself the Son, you who have fulfilled the Father's will in all things. Today I have begotten you, in whom I recognize the light of an immaculate offspring. Yesterday and today you are the same to me, and for ever. There is no night in you, because you are wholly day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
