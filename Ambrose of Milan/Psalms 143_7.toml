[[commentary]]
quote='''
And therefore, as one in despair, he flees to the remedy, saying: Hear me quickly, O Lord, for my spirit has failed. For when the offer of such a judgement was set before him, in which truth was to be examined rather than mercy bestowed, he failed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
