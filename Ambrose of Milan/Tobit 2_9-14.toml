[[commentary]]
quote='''
While the prophet, wearied by so holy a duty, was resting in his chamber, he was made blind through dung falling from a sparrows' nest; but he did not complain and lament, nor did he say, Is this the reward of my labors? He grieved more at being deprived of the performance of the office of burial than of his eyes, and considered his blindness not a penalty, but a hindrance. And when his wife was contributing to his support through her earnings, he took care that nothing stolen should enter his house. His wife had received a kid as pay, but he, having regard for honesty more than for dutiful affection, [did not give credence to] the one to whom he owed his support.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 2"
