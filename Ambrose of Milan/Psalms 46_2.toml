[[commentary]]
quote='''
So it is that we do not fear when our earth is troubled and the mountains are carried over, because if you are for us, who is against us? We cannot fear the frailties of this flesh, which is broken by fear and dread, inflamed by desires, softened by luxury, enervated by delights, heated by fevers, vexed by pain, made lifeless by distress; or when those mountains are carried into the heart of the sea, of which the Savior said: If you have faith like a grain of mustard seed, you shall not only do this to the fig tree, but even if you say to this mountain: Be taken up and cast into the sea, nothing shall be impossible to you. This mountain cast itself into the heart of Judas and troubled his mind with a heavy tempest, tossing it with the waves of various passions. For as the soul that is fruitful in good works and in the fruits of devotion and faith is compared to the fertility of the lands, so that the smell of Jacob is like the smell of a full field, so too the soul of one who does not know how to be quiet and stirs up heavy waves with bitter thoughts is figured by the restlessness of the stormy sea. In fact, not even by his kiss did the Lord Jesus temper the bitterness of Judas the traitor. The traitor received the kiss, poured in poison, inflicted death, whose sting Christ indeed blunted, but the traitor alone did not escape. And to show us plainly a mountain of this kind, elsewhere too, when he had commanded a demon to go out of a man and the apostles asked for what reason they themselves had not been able to cast it out, he says: This kind is not cast out except by prayer and fasting, and he added: If you have faith like a grain of mustard seed, you shall say to this mountain: Pass from here to there, indicating with his hand which mountain it was that perfect faith could move. For perfect faith is compared to a grain of mustard seed, as the Apostle says: If I have all faith so that I move mountains, but have not charity, it profits me nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
