[[commentary]]
quote='''
For if anyone gathers the flowers of faith and preaches Jesus Christ crucified, he pours the ointment of his faith into the whole Church, which is the body of Christ, dead to the world, resting in God. The whole house begins to smell of the Lord's Passion, begins to smell of his death, begins to smell of his resurrection, so that each one of this number of the holy people can say: but far be it from me to glory except in the cross of our Lord Jesus Christ. The odor breathes, the ointment smells in the body, if anyone can — and would that I could! — say with confidence: to me however the world is crucified. Not to one who loves riches, not to one who loves the honors of the world, not to one who loves the things that are his own, but to one who loves the things of Jesus Christ; not to one who loves the things that are seen, but the things that are not seen; not to one desirous of life, but to him who hastens to be dissolved and to be with Christ, is the world crucified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
This is the glory of faith, if you truly understand the cross of Christ. Other crosses profit me nothing; the cross of Christ alone is useful to me, and truly useful, through which the world is crucified to me and I to the world. If the world is crucified to me, I know that it is dead: I do not love it; I know that it passes away: I do not covet it; I know that corruption will consume this world: I avoid it as foul, I beware of it as a plague, I leave it as something that will do harm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
What else, then, do the just do in this life but strip themselves of the contaminations of this body, which bind us like bonds, and strive to separate themselves from these troubles, renounce pleasures and luxury, and flee the flames of lusts? Does not each one, then, placed in this life, imitate the likeness of death, if he is able so to conduct himself that all the delights of the body die to him and he himself also dies to all desires and to the allurements of the world, as Paul had died, saying: to me for the world is crucified, and I to the world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"

[[commentary]]
quote='''
The prince of priests has died for you, for you he was crucified, that you might cleave to his nails. For in that flesh he took up both you and your sins; the handwritings of your offences were fixed to his gibbet, so that you now owe nothing to the world, which you once renounced. And rightly you owe nothing, you who are able to say: For the world is crucified to me, and I to the world, so that you no longer fear death, if you bear Christ, in whom you can say: Where, O death, is your victory? Where, O death, is your sting? For when that old man of ours was fixed to the cross, sin was destroyed, the sting blunted, guilt made void, so that we may cease any longer to serve shameful deeds. For the old man too has gone away. But now it is no longer the old man in us, but there is a new creature, having in itself the likeness of Christ, with whom we were buried together in the likeness of his death and so have taken on the image of his life; we have received the wings of spiritual grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"
