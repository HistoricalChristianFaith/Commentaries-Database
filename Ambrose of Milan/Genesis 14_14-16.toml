[[commentary]]
quote='''
When Abraham learned this, he numbered his home-born servants, and with three hundred and eighteen men he gained the victory and freed his nephew. The affection behind the division is proved, since he so loved his nephew that he did not even shrink from the danger of war for his sake. What is he numbered? That is, he chose. Hence that saying too refers not only to God's knowledge but also to the grace of the just, which the Lord Jesus spoke in the Gospel: and all your hairs are numbered. For the Lord knew those who are his, but those who are not his he does not deign to know. And he numbered three hundred and eighteen, so that you may know that not the quantity of the number but the merit of election is expressed. For he took to himself those whom he judged worthy to be in the number of the faithful, who would believe in the passion of our Lord Jesus Christ. For the Greek letter T signifies three hundred, and the sum IH, eighteen, expresses the name of Jesus. It was therefore by the merit of faith that Abraham conquered, not by a populous army. In short, going out with a few home-born servants, he triumphed over those to whom the arms of five kings had yielded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
