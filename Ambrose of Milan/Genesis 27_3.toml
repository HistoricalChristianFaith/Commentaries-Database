[[commentary]]
quote='''
But perhaps you will say: In what did he cause delay, he who was sent by his father to hunt? But consider that his father too declared that he could not have ready what was being sought spiritually. And therefore, since he was failing in natural talent, he required him at least to add the help of diligence. He also admonishes him to speed, saying: Take your bow and arrow. Yet he too receives the fruit of diligence who recognizes that the gift of natural talent is higher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
