[[commentary]]
quote='''
And yet what does the recounting of this revelation achieve, except to teach that one ought by no means to glory in revelations, but in weaknesses, because weakness is both the remedy for revelation and the exercise of virtue, whereas revelation is a slippery path to elation? For Paul himself, who was caught up into the third heaven, received a thorn of the flesh, lest he should be lifted up by the sublimity of the revelation. Weakness, then, came to his aid, lest grace should be turned into danger. Weakness, then, was more useful than grace. This same weakness is also the workshop of virtue, as the Lord testified, that virtue is perfected in weaknesses. Thus this very man after the revelation asked for the remedy of health and did not obtain it; but in weakness he did not seek a remedy, but finished the course and found the crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The apostle Paul also tells us that the Lord our God took forethought, lest, either through the sublimity of revelations or through the prosperous and unbroken progress of their works, the human disposition should be lifted up even in the saints, and they should credit to themselves and attribute to their own virtue what had been conferred on them by divine working. Therefore, lest they should rush into so great a judgment and fall into the pit of faithlessness, the Lord allowed fault to steal in upon them, so that they too might perceive that they needed divine help and might recognize that the guide of their salvation must be sought. And so Paul testifies that weakness profited him, when the Lord said to him, as he asked that the goad of his flesh might depart from him: My grace is sufficient for you; for strength is perfected in weakness. And rightly he glories in weaknesses; for he knew that through abundance of strength very many, even of the saints, had fallen beyond remedy. How much more profitable, then, to have given place to reproof once or twice than to have drawn upon oneself the perpetual offense of the Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 2"

[[commentary]]
quote='''
David, it is true, had killed a man who was by no means guilty, but he had killed him not driven by any zeal for cruelty, but to overshadow his shame, to cover the disgrace of his desire. I do not dare to say that he was overwhelmed by the force of crime — for he was not overwhelmed who knew how to raise himself from that ruin of sin — but I do say that he was bent by the force of temptation. For he had said before: Prove me, O Lord, and try me; burn my reins and my heart, and elsewhere: But I said in my abundance: I shall not be moved for ever, and: You have examined me by fire, and iniquity has not been found in me. The Lord willed that he should be subject to temptation, lest he arrogate to himself anything beyond what is man's; for power is made perfect in weakness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
