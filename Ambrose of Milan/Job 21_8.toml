[[commentary]]
quote='''
Let us look at another point: Their seed, he says, is according to the soul, that is, they are not counted among the just. For the just sow in the spirit and from the spirit will reap eternal life, but those who sow according to the soul cannot reap spiritual things, because the natural (soul-ish) man does not perceive the things that are of the Spirit of God; for it is foolishness to him, and he cannot know the things that are of the Spirit, and therefore he is not filled with spiritual things, but is judged.

Their sons are in their eyes, that is, what they do they do in order to be seen by men, not because, being good, they take counsel so as to choose what will be approved at the judgment to come. So Scripture frequently speaks of sons in place of works, because our posterity is richer in good deeds than in sons. Hence Hezekiah too, freed from a grave sickness, From this day, he says, I will make sons, who will proclaim your justice, O Lord of my salvation, and I will not cease blessing you with the psaltery all the days of my life; for good is the posterity of devotion and of faith, which did not know how to succumb to the captivity that the sons of Hezekiah endured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
