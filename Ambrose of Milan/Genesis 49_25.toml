[[commentary]]
quote='''
And he blessed him with the blessing of heaven from above and with the blessing of the earth that holds all things; for he subjected all things to him, the heavenly things as the blessing of heaven and the earthly things as the blessing of the earth, that he might be lord over both men and angels.

And so in that body, contemptible as it seemed, you prevailed, he says, on account of the blessing of the breasts and of the womb, the blessings of your father and mother. By the breasts he meant either the two Testaments, in one of which he was announced and in the other shown forth — and well are they called breasts, since the Son nourished us as it were with a spiritual milk, brought us up and offered us to God — or he means the breasts of Mary, which were truly blessed, from which the holy Virgin drew a drink of milk for the people of the Lord. Hence that woman in the Gospel too says: blessed is the womb that bore you, and the breasts that you sucked! But as for his saying: the blessing of the womb of your father and mother, if we choose to understand the womb of Mary alone, the reason why he joined both blessings will remain hidden — for he could have spoken of the mother's womb alone — but I think it finer that, according to the spiritual mystery, we should understand both generations of the Lord Jesus, both according to the divinity and according to the flesh, because before the ages he was begotten of the Father. Hence the Father too says: my heart has poured forth a good word, because he proceeded from that inmost and incomprehensible substance of the Father and is always in him. Hence the evangelist too says: no one has ever seen God, except the only-begotten Son, who is in the bosom of the Father; he has declared him. As, then, the bosom of the Father is understood spiritually as an inmost secret, as it were, of the Father's love and nature, in which the Son ever is, so too the womb of the Father is that of a spiritual, inward hidden place, from which, as from a womb that gives birth, the Son proceeded. Indeed, we read in different places now of the womb of the Father, now of his heart, with which he poured forth the Word, now of his mouth, from which justice proceeded, from which wisdom came forth, as she herself says: I came forth from the mouth of the Most High. Thus, since no single thing is defined and all express one thing, it signifies the spiritual mystery of the Father's generation rather than any bodily member. But as we understand that generation from the Father, so also, for the completeness of faith, let us understand the generation from Mary, when the womb of the mother is blessed, that virginal womb of Mary, surely, which brought forth for us the Lord Jesus. Of it the Father says through Jeremiah the prophet: before I formed you in the womb I knew you, and before you came forth from your mother's womb I sanctified you. The prophet, therefore, declared a twofold substance in Christ, of divinity and of flesh, the one from the Father, the other from the Virgin, yet in such a way that he was not without his share in his divinity when he was born of the Virgin and was in the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"
