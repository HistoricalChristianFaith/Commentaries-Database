[[commentary]]
quote='''
Which certainly He did not do, because He was unable to heal when absent, but that He might set them an example of imitating His humility. He would not go to the son of the nobleman, lest He should seem thereby to have respected his riches; He went immediately here, that He might not seem to have despised the low estate of a centurion's servant. But the centurion laying aside his military pride puts on humility, being both willing to believe and eager to honour; as it follows, And when he was not far off, he sent unto him, saying, Trouble not, thyself: for I am not worthy, &c. For by the power not of man, but of God, he supposed that health was given to man. The Jews indeed alleged his worthiness; but he confessed himself unworthy not only of the benefit, but even of receiving the Lord under his roof, For I am not worthy that thou shouldest enter under my roof.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the centurion wished not to trouble Jesus, for Whom the Jewish people crucified, the Gentiles desire to keep inviolate from injury, and (as touching a mystery) he saw that Christ was not yet able to pierce the hearts of the Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
How great a mark of divine humility, that the Lord of heaven did not at all disdain to visit a centurion's little slave! Faith shines in works, but humanity works more in affections. This he certainly did not do because he could not cure him while absent, but to give you a form of humility to imitate, by which he taught that deference is due alike to the humbler and to the higher. Indeed elsewhere he says to the nobleman: Go; your son lives, that you may know both the power of divinity and the grace of humility. There he would not go, lest in the nobleman's son he should seem to have deferred rather to riches; here he went himself, lest in the centurion's servant he should seem to have despised the condition of a slave; for we are all, slave and free, one in Christ.

But see that faith is the prerogative of medicine. Note also that in the Gentile people itself there is discernment of the mystery. The Lord goes on; the centurion excuses himself, and, laying aside military pride, takes up reverence, both easy to faith and ready to do honour. And well does Luke say that friends too were sent by the centurion to meet him, lest by his own presence he should seem to burden the Lord's modesty and to have provoked courtesy with courtesy. So much in the moral sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
