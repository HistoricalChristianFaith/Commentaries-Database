[[commentary]]
quote='''
About natural things too you have it said in Ecclesiastes: I made myself pools of water, to water from them a sprouting grove. Nor should it trouble you that he put pools in place of a well, for Moses too spoke of the well of Breadth, because he who has transcended this world with a devout mind is freed from all care and from straits. Not without reason, then, does Ecclesiastes have pools, he who saw that there is no abundance under the sun, but that, if anyone wishes to abound, he should abound in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Of natural things too you have the well itself in Ecclesiastes: I made myself pools of water, to water from them a sprouting wood (Eccles. 2:6). Nor let it trouble you that he put pools in place of a well, since Moses too spoke of the well of breadth; because he who has risen above this world with a pious mind is released from all anxiety and straits. Not without reason, then, does Ecclesiastes have pools, he who saw that there is no abundance under the sun: but if anyone wishes to abound, let him abound in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
