[[commentary]]
quote='''
After him the seven boys were set before him with their mother. One may jeer at the tyrant, who, while he cunningly thought that he should begin with the old man, chose a teacher who would make his disciples braver; their boyish age, as it were, he tried to provoke to guilt with rewards and pressed to fear with terrors. But they, not unworthy of so great a leader, answer: 'Why do you despise us or try to get round us as if we were boys? Our faith is grey-haired; our discipline is strong. Put it to the test, by all means: subject our boyish flesh to whatever punishments you please; you will not find boyish hearts, nor will the engines of torment be more powerful than the watch kept by our observance of the Law. Him whom old age conquered, boyhood, the rival of old age, will overcome. As sons we follow our father, as disciples our teacher. Gather up the instruments of torture you have set out: while they are seen, they bring a training in patience, not the terror of ignorance'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
