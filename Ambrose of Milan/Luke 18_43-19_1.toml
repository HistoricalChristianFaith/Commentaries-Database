[[commentary]]
quote='''
And at once he says he saw and followed him, magnifying the Lord. And he was passing through Jericho.

For otherwise he would not see, unless he followed Christ, unless he proclaimed the Lord, unless he passed beyond the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
