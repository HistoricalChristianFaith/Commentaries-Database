[[commentary]]
quote='''
Luke having first introduced a man delivered from an evil spirit, goes on to relate the healing of a woman. For our Lord had come to heal each sex, and he ought first to be healed who was first created. Hence it is said, And he arose out of the synagogue, and entered into Simon's house.

But if we weigh these things with deeper thoughts, we shall consider the health of the mind as well as the body; that the mind which was assailed by the wiles of the devil may be released first. Eve was not a hungered before the serpent beguiled her, and therefore against the author of evil himself ought the medicine of salvation first to operate. Perhaps also in that woman as in a type our flesh languished under the various fevers of crimes, nor should I say that the fever of love was less than that of bodily heat.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If we weigh these things with deeper counsel, we ought to understand the healing both of mind and of body, so that the mind, which was suffering from the serpent's snares, was set free first. For the soul would never be overcome by the body unless it had first been tempted by the devil. For since the soul drives, quickens and governs the body, how could it be carried away captive into the body's enticements unless it too were bound by the chains of some higher power? Finally, Eve did not hunger before the serpent's cunning tempted her; and therefore the medicine of salvation had to work first against the very author of sin.

Perhaps too, in the type of that woman, the mother-in-law of Simon and Andrew, our flesh was languishing with the various fevers of crimes and burning with the immoderate enticements of diverse desires. Nor would I say that the fever of love is less than the fever of heat. So the one fever inflames the mind, the other the body; for our lust is a fever, in that desires are fiery. Hence the Apostle too says: if they do not contain themselves, let them marry; for it is better to marry than to burn. Our luxury is a fever, our wrath is a fever, which, though they are vices of the body, yet entwine fire in the bones and assail the understanding, the mind and the senses. This is first solicited by the devil's art. For a good field, a garment, a necklace are the persuasion of the serpent. The favor of honors, the height of powers, the sweetness of banquets, the beauty of a harlot are the snare of the devil, and as it were an alluring address of spiritual wickedness, which, through the enticement of the flesh, which is quickly softened with a kind of feminine levity, casts down the mind too from its step; for the mind does not desire the beauty of a woman before the eye of the body does. Finally, what you have not seen you will not love; but when the flesh has desired, the constancy of the mind too, suffering with it, flags, and the mind is bent by the fellowship of love — for the two are in one flesh — and so death creeps in by the effect of crime, the devil tempting, the flesh persuading.

Yet the fever of the mind is more violent than that of the body, and therefore for the pleasure of the mind the health of the body is very often despised, and there is no abstaining from dangers. Hence it does not seem out of place to recall how Theotimus, when he was suffering from a grave affliction of the eyes and loved his wife, though the physician had forbidden him the faculty of intercourse, being impatient of desire and carried away by the impulse of lust, was unable to restrain himself. For knowing and aware that he would lose his eyes, before he came together with his wife, in the very heat of burning desire and in the preparation of their wonted intimacy, 'farewell' he said 'beloved light'. So lust burns more fiercely than a fever, and hurls down and inflames more gravely.

But when anyone has come back to his senses from the frenzy, then the sight of the inner conscience is opened, and repentance for the deed follows, and each one blushes at the shameful things of his own crime. Then God is feared and the sinner wishes to hide himself, but cannot; then the flesh is blamed, the devil accused, the one as a procuress of vices, the other as author of the error. The deformity lies open; for every secret is naked to God, nor are the secrets of shameful deeds veiled by the leaves of that fig tree, that is, by bodily covering or by worldly boasting. And each one, with a mind conscious of sin, dreads the divine judgment, saying: 'what mountains are to fall upon me, in what clefts of the rocks shall I hide myself, when he comes to shatter the earth?' Then the flesh breeds thistles and thorns for the mind, that is, the bites of cares and of anxieties, and the heats which the mind itself has put around itself through the concupiscence of the flesh. For the soul is fastened as if by certain nails to bodily pleasures, and once it has clung to them, sunk in earthly desires, it can hardly fly back without the favor of God to the height from which it came down. For, bound by the snares of its own acts and exposed to the enticements of worldly delights, it is now held fast.

This Adam, then, this Eve the Lord came to free; of whom the one was made to the image of God, the other received the strength of her husband; as long as she was subject to the stronger, they bore in one spirit one will pleasing to God, and, set in the paradise of God, they worked the nourishment of heavenly life. But after the flesh began to persuade otherwise and not to keep its proper law, they were made exiles from paradise and fell back, as their sin deserved, into this lower and sunken place. Nor let anyone think it incongruous if Adam and Eve are reckoned as a type of soul and body, since they are reckoned as a type of the Church and of Christ. For when the Apostle said that the two are in one flesh, he added: This sacrament he says is great, but I speak of Christ and of the Church. In that, then, in which there is a mystery of God on high, there can much more be a mystery of our mind.

But it clings, it is fastened, it is captured, and, kindled by bodily fevers, it sickens through fellow-suffering with the flesh. A physician must be sought. But who is this one so great as to heal the wounds of the stricken mind? What man is so great as to be able to help others, when he cannot help himself? Who could restore life to others, when he himself cannot escape death? All indeed died in Adam, because through one man sin entered into this world, and through sin death, and so it passed through to all men, in whom all sinned. His guilt, then, is the death of all. Finally saints were sent, prophets too were sent, to speak the divine oracles, and they could accomplish nothing. Let us seek, then, a physician from among the angels or archangels. But how can they bring me protection, so that I may not sin, when an archangel himself could not abstain from sin? How will an angel be able to call me back to paradise, when Satan himself and his angels cannot keep the seat which they received?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
