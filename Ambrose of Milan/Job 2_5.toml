[[commentary]]
quote='''
The Lord, then, put forth his hand upon his servant, and crushed the hand and the arm of the sinner, which he had put forth upon him after receiving power. Thus the devil was deceived by his own speech, who said: Put forth your hand upon him, and let us see whether he does not bless you to your face; for he did not dare to say "curses", but left this to be understood. The Lord put forth his hand and Job was confirmed: he who was believed to curse began to bless; for when the divine hand touches the righteous, it heals, it does not wound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
