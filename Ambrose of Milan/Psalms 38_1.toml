source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Lord, do not rebuke me in your wrath, nor chasten me in your fury. He who repents must be ready to bear reproaches and to undergo injuries, and not be disturbed if anyone casts up to him the crime of his sin. For since he ought to accuse himself, how does he not bear another rebuking him? But if he ought not to fear being rebuked by man, how much less by the Lord his God, against whom we all sin even in the things that are hidden, especially since condemnation in things present is absolution in things to come; but those who are not condemned in this world will not be scourged with men. Woe to me, if it is said of me: "He has his reward"! If a good deed is condemned by this sentence, how much more is a crime weighed down! For if mercy boasted of in easy speech is cheated of eternal fruit, how much more is the punishment of iniquity deferred with the addition of bitter interest! He who repents, then, must offer himself to punishment, so that he may be punished here by the Lord and not be kept for eternal torments; nor should he wait for the time, but go to meet the divine indignation.

See that David's deeds agree with his prayers. He had offended the Lord, because he had ordered the people to be numbered. By confession he forestalled God's messenger, recalling that he had sinned greatly and had done very foolishly, not as if reminding one who had forgotten, but as if pressing one who delayed, so that he should not put off any longer the stirring of anger at the offence. I have sinned, he says, greatly, because I have done this thing; and now, Lord, blot out the iniquity of your servant. Hear one saying how sins are blotted out: Her sin is loosed, for she has received from the hand of the Lord her sins double. He does not ask, then, that his sin be wholly remitted to him, but that it be blotted out by a moderate payment, that is, that its memory be blotted out for the future. Indeed the Lord, as if addressed by the voice of one pressing him not to prolong the vengeance for the error committed, sent Nathan the prophet to him, and he came to the king and said to him: Choose what you wish to be done: three years of famine upon the land, or that you flee for three months from the face of your enemies, and they pursuing you, or that there be death in the land for three days. And now know and see what I am to answer him who sent me. See God teaching by what moderation his indignation is softened, if we do not wholly refuse the stripes, but ask that the punishment be of a kind that lightens it, not one that escapes it. He proposed three, so that he might choose what he thought more moderate. See also how he provokes us to penitence, so that we offer ourselves to injury, commanding him to choose, so that in the very punishment a certain privilege of choice may be kept, and he may soothe his guilty one with this word. And David said to Nathan: I am in straits in these three; but let me fall rather into the hands of the Lord, since his mercy is great, than into the hands of men. Did he ask that the punishment for his error be forgiven him? Had he done so, he would have been branded with impudence, as one ungrateful for the divine moderation. A modest confession greatly supports the guilty, and the punishment we cannot escape by defence we lighten by shame. He chose not what would be immune from the scourge, but what he judged more moderate, so as to commit himself to the gentleness of God, who knew how to pardon, rather than to the power of men, who often exceed the measure of vengeance. He has mercy, then, who does not know how to err; he does not have mercy who is a partaker of error.

Nor did his faith deceive holy David, but even in the offence itself he earned the grace of the divine compassion. For he who had proposed to exercise death in the land for three days did not let even one day pass, but at the hour of the midday meal he gladly granted pardon, and, to use the word of Scripture, he repented over the evil. See how Scripture exhorts you not to shun penitence either, if you follow God, whom you ought to follow. He did well to add "over the evil", because every vengeance seems harsh. Therefore the day of judgement too is called an evil day, from which he is blessed who is delivered by God, as it is written: In the evil day the Lord will deliver him. And the Lord, it says, told the angel to spare. But see that, when the Lord wishes to pardon, he gives the grace and the confidence to entreat. And David saw the angel striking and said: Behold, it is I. I have sinned, and I the shepherd have done evil; and these in this flock, what have they done? Let your hand be upon me and upon my father's house. If the Lord had commanded the angel to spare, how was the angel still striking, unless because the Lord, even though he wishes to pardon, wishes to be asked, and works so that he is asked? Nor would the man have seen the angel striking, had the Lord not revealed the angel to his eyes. Whence Elisha too says: Lord, open now the eyes of this boy, that he may see; and the eyes of his boy were opened, and he saw the mountain filled with horses and chariots round about the prophet. Nor let it trouble you that the person of a little servant is meaner than that of a prophet or a king, because the sight of horses and chariots too is meaner than the holiness of angels.

And perhaps to some who read carelessly it may seem harsh that David, that man humble of heart and meek, who spared his enemies, chose the death of the people rather than his own flight or famine upon the land. He avoided the famine of the people, because it is held heavier than death and all torments, and pestilence too follows it, which pollutes the sky and heaps up death. He did not ask for his own flight for this reason, because the prophet could intercede for the people, as was done, but the people could not intervene for the prophet. For it is written: If the people goes astray, the priest will pray for it. If the priest goes astray, who will ask for him? And yet, when he saw the people being slain, he offered himself to the striking angel, so that he himself might rather be struck for the people. That, not terrified even by the very sight of the dead, he offered himself to the sword, is more than if he had wished for the remission of the condition proposed. In the choice, then, he followed reason; in the grief, dutiful love.

But see the grace of the Lord, that he himself also turned aside from the condition proposed. Is it any crime of compassion that it threatens more and exacts less? He who keeps his promises in the reward of prizes retracts what he prescribed in the exacting of punishments. When he is angry, he puts off the guilty; when he has mercy, he hastens to absolve. He terrifies to correct, warns to amend, forestalls to pardon. Whence elsewhere too the prophet says of the Lord: The cup in the hand of the Lord is full of unmixed wine, mingled; nevertheless its dregs have not been emptied out. For terrifying the cup is full; for striking it is not emptied out. The cup was full when death for three days was ordered, but the mercy of God came to meet it and held the angel's hand before he emptied that cup. And that you may know that the cup is punishment or the sword, hear one saying: Take this cup of unmixed wine from my hand, and you shall make all the nations drink to whom I shall send you, and they shall vomit and go mad before the sword; and to Jerusalem it is said: You have drunk the cup of wrath from the hand of the Lord; for you have drunk the cup of ruin and emptied it, and there was none to console you. Jerusalem drank the measure, she who sinned beyond measure. The Church of the Christians does not know how to empty the cup of wrath, but she has emptied out ointment, she for whose sake Christ emptied himself, that it might be fragrant everywhere. From the hand of the Lord she received this gift, but the cup of death she does not know. I read of two cups, one of death, the other of life. Christ emptied the cup of death in his own blood and served a new cup, so that we may say: I will take the cup of salvation, the cup of the new testament, which is poured out for the remission of sins. This cup is poured out and its dregs are not found, because it cleanses every sin.

We have said how the Lord bends back his anger in avenging; let us say how in rewarding he forestalls our prayer, and teach it by an example. Hear that one of the two thieves saying to the Lord: Remember me, Lord, when you come into your kingdom. The Lord answered: Amen I say to you, today you will be with me in paradise. He was still asking that he remember him when he had come into the kingdom, and the Lord was already granting the heavenly kingdom. How swift a mercy! The prayer of the one asking is slower than the reward of the one rewarding.

That is why David kept to moderation and did not pray for remission, saying: Lord, do not rebuke me in your wrath, nor chasten me in your fury. Fury is called θυμὸς in Greek, and it is the onset of wrath. This, then, is what the Latin meant to express: "neither in wrath nor in the very onset of wrath rebuke me or chasten me". And chastening is instruction; in Greek it is called παίδευσις, of which it is said: Blessed is the man whom you instruct, Lord. For God is not open to passion, so as to be angry, since he is impassible; but because he avenges, he seems to be angry. It seems so to us, because we ourselves are accustomed to avenge with agitation. Yet men too are often found who, when they avenge, are not moved, but carry out vengeance and apply torments with the utmost patience. Why, then, should you wonder at it in God, if you recognize it at times in man? And that vengeance is wrath we said above, concerning the day of wrath. Indeed usage has it that we say of anyone punished that he has fallen under the wrath of the laws, not because the laws have wrath, but because he has fallen under the severity of the laws. So too elsewhere he says of the ten plagues of the Egyptians: He sent wrath upon them through evil angels, that is, vengeance; for the law does not know how to be angry, but the minister of the laws does. He, then, who is the author of the laws does not know how to be angry either, he whose will is to terrify, not to punish. Imitate, then, you emperors, the divine example, so that you may be more severe in establishing laws, merciful in exacting punishments. Let the severity of the laws restrain insolent audacity; let the mercy of princes withdraw the guilty from punishment. The prophet, then, recognizes his fault, sees his wounds, asks to be cured. He who wishes to be healed does not dread being rebuked; but he does not wish to be rebuked in fury, but in the word of God. The word of God is health; for so we read: He sent his word, and healed them. He does not wish to be instructed in wrath, but in teaching, as if you were to ask a physician not to cut your wound but to apply a medicine. He presses with the medicine, but does not cut; there is pain, but not beyond the measure of pain; it bites, but does not draw blood.
'''
