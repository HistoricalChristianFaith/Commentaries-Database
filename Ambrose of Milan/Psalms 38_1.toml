[[commentary]]
quote='''
I wrote two little books on penitence long ago, and I think I must write on it again: first, because it is useful to pray for the pardon of sins even daily; then, because in those two little books there is an exhortation to penitence, or the profit it brings if it is practised, but now it must be set out how penitence ought to be done; for it profits nothing to do it unless it is done as it ought to be. In this holy David has set before us a teaching to follow, and he seems to me to have tasted sin for this reason, that he might teach how sin could be abolished. For from what did medicine take its beginning, if not from a wound? While the first age of the human race teaches others what profited itself, and shows others how it healed its own wound, use made the art and sickness the teaching. For this is the first and strong school of medicine, which experience, not conjecture, formed. And so the first physicians were called empirics from experience, and from that school the others were derived, and from it they took a certain sap of their own power. But what is stronger for encouraging penitence than that the holy prophet David taught us to repent of our sins? For who would disdain to humble himself before God, when a king has humbled himself, or who would hesitate to afflict his soul, when so great a prophet has afflicted his, paying the price of tears for the redemption of sin? And although he has spread the precepts for doing penitence through the whole body of his writings — for which of his psalms is not a remedy for a sinning conscience, since in one place he has shown how he was thrust, in another how he was troubled, so that he might demonstrate not only how wounds are to be healed but also how they are to be guarded against, and teach us by his own example? And who would believe that he himself stands, where even the stronger has fallen? — yet in Psalm 37 (38) he has expressed a greater force of inward grief and of lamentable mourning.

Indeed at the outset the title itself reminds us that precepts of this kind are being shaped; for thus we read: for a remembrance, he says, concerning the sabbath day, a psalm of David. For the remembrance of sins is the full definition of penitence, so that each one may chastise his sins as with a kind of scourge of daily speech, and condemn the outrages he has committed. For so we are taught, as God says: Tell your iniquities, that you may be justified, and the Apostle says: with the mouth confession is made unto salvation. But perhaps it may trouble someone that he did not say "a remembrance of sins", but "concerning the sabbath day" or, as another version has it, "of the sabbaths". What, then, is the sabbath but the rest of things to come, the relief of things present, on which the Law commands that men's works keep holiday and burdens be laid down? What burdens are heavier than our sins? Let these be laid down on the days of the sabbaths, that is, in this time of this life. For every week is closed in seven days; in six days this world was formed; on the seventh day the Lord rested from his work, he who rests in our meekness, as he himself said: Upon whom shall I rest but upon the humble and meek? Release yourself, then, every sabbath, lift off the weight of error, so that you may deserve to come secure to the rest of that future sabbath; for if you carry heavy sins from here, you will have no rest there. Unburden your mind, therefore, cast off everything by which the conscience is weighed down and pressed, lest your flight be in winter or on the sabbath. This life is in labour, that one in rest. Let the consummation of this world find you lighter, lest, burdened with sins, you be unable to flee. Flee beforehand, so as to forestall it. He flees the world who is not held by the enticements of the world, who has released himself from every care of it. Flee also the wrath to come, that is, the day of judgement. He flees it who has repented; for so John the Baptist defined it, saying: Brood of vipers, who showed you to flee from the wrath to come? Bear therefore fruits worthy of penitence.

You have heard read today that John was baptizing in Aenon near Salim. Aenon is called "eye of punishments", Salim "he himself ascending"; this is what the interpretation holds. He, then, who chooses to be baptized foresees the punishments, and so takes refuge in the sacrament of baptism, to lay down every sin, lest he begin to be liable to punishments. And perhaps he who is baptized with the baptism of penitence foresees punishments; but he who is baptized in Christ looks to grace. The baptism of John, then, is the eye of punishments, the baptism of Christ the eye of graces. Yet, although John baptized in Aenon, he baptized near the one ascending; for this interpretation holds this too, that Salim is called "he himself ascending". He, then, who announced his coming was nearest to Christ. For the Son of Man, who descended from heaven, is himself also the one who ascended into heaven, that he might fill all things. But because as is the heavenly, such also are the heavenly, he too ascends into heaven who, laying aside earthly things, is buried together in Christ, so that with Christ he may rise from the death of sin to newness of life and to a share in the inheritance, so as to become, as it is written, an heir of God, a co-heir of Christ.

True medicine, then, is to do penitence, which was lawfully preached at the time when the physician came from heaven, one who would not exasperate wounds but heal them. A good physician, who taught how we should seek remedies in this earth of our body, when the flower of the healing herb rose up for us, he who from sin condemned sin in the flesh. The flesh, then, was made an antidote, which before was the poison of sin, because it was the enticement of sins. Hear how the flesh is an antidote: the Word of God was made flesh, put his hand into the hole of asps, emptied out the poison, took away sin, that is: from sin he condemned sin in the flesh.

And so that this may be considered more fully, let us go over the very passage of the Apostle. For thus it is written: God, sending his own Son in the likeness of the flesh of sin, also from sin condemned sin in the flesh, that the justification of the Law might be fulfilled in us, that we may walk not according to the flesh but according to the Spirit. The Son of God, then, came in the likeness of the flesh of sin; certainly he did not come in the likeness of flesh, he who took on true flesh, but in the likeness of the flesh of sin, that is, of sinful flesh; for by the fraud of the serpent, and infused with his poison, our flesh had been made a flesh of sin. After it was made liable to sin, it had become a flesh of death, because it was owed to death. The likeness of this flesh, already guilty, already prejudged, Christ took on in his own flesh, because, although he had taken on the natural substance of this flesh, he had nevertheless taken on no contagion, nor was he conceived in iniquities and born in sins, he who was born not of blood nor of the will of the flesh nor of the will of man, but of the Holy Spirit and the Virgin. What, then, is: from sin he condemned sin in the flesh? Is it from the likeness of the flesh of sin; or because Christ took on our sins not by practice but by their quality, not by crime but by the sacrament of his mercy, and he who himself did no sin was made sin for us; or rather because from this flesh of sin too, that is, this our liable and prejudged flesh, he condemned sin in the flesh, by teaching how, set in the flesh, we may walk not according to the flesh but according to the Spirit? For it is sin to walk according to the flesh, because he who conducts himself according to the wisdom of the flesh lives for luxury and pleasures and wantonness and the desires of the flesh; for the wisdom indeed of the flesh is an enemy to God, whence those who are in the flesh cannot please God. And therefore he condemns sin from sin who, lifting himself off from the vices of the flesh, lives according to the Spirit, wholly given to God and intent on the heavenly oracles; for this Christ came, to do not his own will, that is, the flesh's, but God's. If anyone, then, follows him, so as to do what pleases God and to curb the craving of his own flesh, he is an imitator of Christ.

We have expressed what we think; you who read, choose what to follow. There is no error where the disposition of devotion is simple and every sense is faithful. Christ condemned sin by taking on the likeness of the flesh of sin, so as to abolish the sins of our flesh. He condemned sin so as to crucify our sins in his own flesh, himself made sin for us, so that we, who were the captivity of death and the prey of the serpent, might be the righteousness of God in him. This taking on of sins, then, is of loving-kindness, not of crime. Through this sin the eternal God absolved us, he who did not spare his own Son and made him to be sin for us. Then, Christ condemned sin in the flesh from the very flesh of sin, which with a kind of judicial vigour and censorial authority hates the vices it had been used to love, and shudders at the unchastity which it used to think pleasure. It separates itself from wantonness, disowns its desires, renounces crimes and outrages, drives off avarice, which makes effeminate a certain manliness of the flesh. See for yourself that imitator of Christ, himself condemning sin from sin in the flesh: So I run, he says, not as at an uncertainty, so I wrestle, not as beating the air, but I chastise my body and bring it into servitude, lest, when I have preached to others, I myself become reprobate.

We have not, I think, digressed superfluously, because this too belonged to the medicine of man. Providing for this medicine, God, as he commanded this earth to bear the healthful juices of herbs and trees, by which the wounds of the flesh might be cured, so also filled the series of the divine Scriptures with healthful precepts, by which the infirmity of the soul might be healed. How grievous it is, then, that dumb animals know how to doctor themselves and seek out healthful herbs for their wounds and do not refuse to pick them, and the diligence of men does not seek them, though even a physician has been sent to them, to point out the seeds of healthful medicine in the old Scriptures and to bring new ones himself! Let us take examples from the earth itself, then, of how many things are healthful that are carelessly judged harmful.

The serpent nourishes poison, has harmful bites, wounds the flesh; but in its very poison too you will find an antidote, if you look for it. Indeed its flesh is burnt, and from its ash theriac is made, by which the force of poison is commonly blunted, so that it cannot harm. Not the earth, then, is at fault, which brings forth the serpent, but he who does not know how to beware of the serpent. The serpent itself can benefit you, if you understand, or rather if you do not spurn the physician's precepts. Learn that the one you think should be fled is to be imitated: Be, he says, shrewd as serpents and simple as doves. Guard your head like the serpent; even if you are torn in your whole body, you will revive. Your head is Christ, because he is the head of man; if you keep the faith, even if you die like the serpent, you too will rise again. Imitate the serpent, which puts off its outer self so that the inner may be renewed; imitate the serpent, which vomits out its poison. Blessed are you if you too vomit out your evil thoughts and lay down the poisons of your malice. It is a well-known story, and one strong with the authority of writers, that the serpent, approaching the waters, with a hiss pledges itself to union with a female snake; that she, consulting her own safety, promises the sought use of her union on this condition, if the serpent vomits out its poison; and that he, captivated, obeys her commands, lays down his arms, and by the custom of their own union puts his head into her mouth; and that, when the intimacy begins to grow warm, the female, whether by some violence of nature or by the heat of lust, tightens her mouth and presses bites upon the kisses of lust, and so the serpent's head is cut off.

Will you not recognize in the nature of the serpent a mystery of faith? That serpent of paradise first provoked the woman to the adultery of guilt. But when its poison was poured out into this world, the offspring of that woman, avenging the deception of its parent and the fraud of the serpent, stripped it of its arms and cut off its head. But if the poisons have prevailed, and sin, in which is the sting of death, has crept in, use the example of physicians, so that the serpent may die for you, even if late: you should crush its poison and break up its body, and know that it must be blended, mixed with healthful juices, so that it not only loses its force and venom but also becomes a remedy from poison. And that intelligible serpent dies for you, if you die to sin and your sins die to you. So its poison is crushed, if your deeds prick you; so all its force is abolished, if you cover the crime committed with good works and temper it with faithful confession. Hear how the power of the dragon itself is crushed: May God, he says, crush Satan under your feet. Crush first your heart, in which was the lair of the dragon, so that it may not find where it can dwell. Crush the flesh of the dragon; its flesh is our sins. Therefore God says to you: the nations feast on him, and below he says: dying runs ahead. And the flesh of his body cleaves to him. For as the saints are the body and members of Christ, so sinners, who do not desert sin but cleave to sin, are the body and members of the dragon. Therefore we feast on the body of Christ, but they feast on the body of the dragon. We who strive to cleave to Christ feast on the daily remission and pardon of sins; but they, who daily link sins to sins, feast on a continuation of outrages and crimes.

Crush, therefore, this flesh and sprinkle over it the contrition of your heart, then pour over all of it the water of the Jordan. For the Jordan is a descent and an ascent, since he who has descended into the sacred font also ascends, to seek the things that are above; for he who is baptized in Christ descends into the death of Christ and ascends into his resurrection. But if you have gone astray when already baptized, pour the water of tears, not lying but true, so that you may cry from the depth to the Lord your God and it may be said of you: A voice was heard in Ramah, weeping and much wailing; Rachel weeping for her sons, and she would not be consoled, because they are not. Rachel is the Church, in which the people of God is blessed. Let her weep for you, let her lament your sins and weep very much, so that she does not easily admit consolation, as those do who grieve very much. She would not be consoled for this reason, because you who were have ceased to be; but by this perseverance in grief and weeping let it be earned that she may say: my son was dead and has come to life again, he was lost and is found. Or perhaps Rachel would not be consoled for the sons of the Jews, because they are not, whom she had surely borne for this, that they might be. And therefore she did not admit consolation when the little ones were slain by Herod, because they did not believe in the coming of Jesus, filling up the measure of wickedness so as even to kill the little ones, so that among them the Son of the Virgin too might be killed. The Church of the Lord, then, would not be consoled for the Jews, because they are not; but in the Christians, who have been gathered from the nations, she feasts and rejoices, since those who were not have begun to be.

You have poured, then, the water of the Jordan, the water of grace; drink this first. You have poured the water of tears, the water of penitence; this is the second cup, so that you may restore the first. Drink water from your own vessels, drink water from your own weeping, so that you may say: and I mingled my drink with weeping. Your weeping, then, is your drink, and your tears are your food. My tears, he says, have been bread to me. If tears are loaves, you have from the sin of iniquity the food of conversion, according to what you read in the Gospel, that he to whom more is forgiven loves more. Whence we often see some who were negligent Christians before become more diligent after committing some sin, and commonly come out of it perfect through penitence. As, then, conversion comes from sin, so the remedy comes from poison. Hear this remedy: The righteous man at the beginning of his speech is his own accuser. Sin is poison, iniquity is poison; the confession of one's own crime is the remedy for the fall. And therefore it is truly a remedy from poison, if you tell your iniquities, that you may be justified.

But now let us take up the psalm, so that it may itself teach us how penitence is to be done. Thus, then, it begins:
'''
