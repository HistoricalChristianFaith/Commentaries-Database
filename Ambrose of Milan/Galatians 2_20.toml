[[commentary]]
quote='''
There is also the case of one who, although placed in this life, dies for life. Such was the situation of the Apostle who said: It is now no longer I that live, but Christ in me. To sin he is dead, but he lives for God, that is, death in him is dead, but living in him is that life which is the Lord Jesus. Good, therefore, is the life of those who live for God and wicked the life of those who live for sin.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 9"

[[commentary]]
quote='''
We may note here a certain gradation. When we eat the earth, it seems that we are in a sort of warfare. When we eat the herbs, there is a certain advance. When finally, we eat bread, then our life of trial has reached its terminus. Let us experience a series of advancements in this life as Paul did: It is now no longer I that live, that is, not I who before this ate the earth, not I who ate grass, for all flesh is grass, but Christ lives in me. This signifies that living bread which comes from heaven, and that wisdom, too, is living, together with grace, justice, and resurrection.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
