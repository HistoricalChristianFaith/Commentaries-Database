[[commentary]]
quote='''
Your shoots, he says, are a paradise of pomegranates with the fruit of apples, henna with nard, nard and saffron, calamus and cinnamon, with all the trees of Lebanon, myrrh and aloes with all the first ointments. The gifts of the soul are praised which were sent by the Bridegroom, endowed with which she was coming (and to God pious souls are good fragrances): myrrh, aloes, saffron and the rest, with which the grace of gardens breathes and the stench of sins is abolished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
