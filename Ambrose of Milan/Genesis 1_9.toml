[[commentary]]
quote='''
In our discourse today, the third day rises, as it is recorded in Scripture, a notable day which freed the earth from inundation at the bidding of God: ‘Let the waters that are under the heaven be gathered together into one place.’ With this fact it is my wish to begin my preface.

‘Let the waters be gathered together.’ These words were spoken, and the waters gathered together. It has often been said, ‘let the people be gathered together,’ and there was no gathering. It brings no slight blush of shame to see that the elements which are without sensibility are obedient to the command of God, whereas men to whom their Author has bestowed sensibility fail to obey His injunction. And perhaps it is the same blush of shame which has brought you here today in greater numbers. It would hardly appear right for the people to fail to congregate in the church of the Lord on the day in which water is congregated in one body.

This is not the only example of the obedience of water available to us, for elsewhere we find it written: ‘The waters saw thee, O God, the waters saw thee and they were afraid.’ What is said here of the waters does not seem to be without a semblance of truth, since elsewhere the Prophet also speaks in the same manner: ‘The sea saw and fled: Jordan was turned back. Who does not know how in actual fact the sea fled at the crossing of the Hebrews? When the waters were divided, the people crossed over, believing because of the dust under their feet that the sea had fled, and that the waters had vanished. Therefore, the Egyptian believed what he saw and entered in, but the waters which had fled returned for him. The waters, then, know how to congregate, how to fear, and how to flee, when commanded to do so by God. Let us imitate these waters and let us recognize one congregation of the Lord, one Church.

There once were gathered here waters from every valley, from every marsh, from every lake. The valley signifies heresy; the valley means the people of the Gentiles, because ‘The Lord is God of the hills, but is not God of the valleys.’ Therefore, in the Church there is exultation; among the heretics and Gentiles, there is grief and weeping. Hence Scripture says: ‘In the valley he set up tears.’ Accordingly, the Catholic people have congregated from every valley. Now, there are not many congregations; rather, there is one congregation, one Church. Here, too, was it said: ‘Let waters be congregated from every valley,’ and there came into existence a spiritual congregation, one people. Out of heretics and Gentiles has the Church become filled.

The valley is a theater, the valley is a circus where runs the horse who ‘is useless for safety,’ where there is vile and abject contention, where there is the ignoble strife of litigants. From these, then, who used to cleave to the circus has faith grown in the Church, and daily attendance is increasing.

The marsh is self-indulgence, the marsh is intemperance, the marsh is incontinence, where are found wallowing places for lusts, the grunts of beasts, and the lairs of passions. Whoever falls therein is dragged down and does not emerge. Here men’s feet find no foothold, but waver uncertainly. Here water fowls are begrimed when they bathe, and above us are heard the mournful cries of doves. Here the sluggish turtle buries himself in the muddy waters. Therefore we have the sayings: ‘A boar in the marsh,’ ‘a stag at the fountains.’ And so from every marsh, where like frogs they have sung their ancient chant of complaint, has congregated here faith; here, too, have congregated purity of heart and simplicity of mind.

Waters have gathered from every lake and from every pit, so that no one prepares a pit for his brother wherein he himself may fall. Rather, all love each other in mutual love, all cherish one the other, and support themselves as one body, although of diverse members. They find delight not in the baleful songs sung by theatrical performers, songs which lead to sensual love, but in the chants of the Church. Here we hear the voice of the people singing in harmony the praises of God. The sight of their piety gives us pleasure. Here are people who find no delight in tapestries of purple or costly stage curtains. Their pleasure lies rather in their admiration of this most beautiful fabric of the world, this accord of unlike elements, this heaven that is ‘spread out like a tent to dwell in’ to protect those who inhabit this world. They find their pleasure in the earth allotted to them for their labors, in the ambient air, in the seas here enclosed in their bounds. In the people who are the instruments of the operations of God they hear music which echoes from melodious sound of God’s word, within which the Spirit of God works. They see this temple here, the holy place of the Trinity, the habitation of sanctity, the holy Church, in which gleam those celestial curtains of which it is said: ‘Enlarge the place of thy tents and of thy curtains; fasten, spare not, lengthen thy cords and strengthen thy stakes; stretch further on the right and on the left; and thy seed shall inherit the Gentiles and thou shalt inhabit the desolate cities.’ The Church, therefore, has its curtains, by which it raises aloft the good life, shields the sinner, and overshadows the fault.

This is the Church, which is founded upon the seas and is prepared upon the rivers. For the Church is made strong and is prepared above you, who flow down as rivers do from that pure source into the fountain of the world, of whom it has been said: ‘The floods have lifted up, O Lord: the floods have lifted up their voices with the voice of many waters.’ And the Psalmist added: ‘Wonderful are the surges of the sea; wonderful is the Lord on high.’ Beneficent are the woods; you have drunk from that perennial and full spring, whither you are flowing, which says to you: ‘He who believes in me’ (as the Scripture says), ‘from within him shall flow rivers of living water.’ He said this, however, of the Spirit, whom they who believed in him were to receive. But, like the waters of the good Jordan, return with me to the beginning.

‘Let the waters,’ Scripture says, ‘that are under the heaven be gathered together into one place and let the dry land appear. And it was so done.’

Perhaps one may not at all believe in our preceding discussion, where we have argued that the earth was invisible for the reason that it was covered with water, so that it could not be seen by corporeal eyes, for his own point of view, that is, from our condition here, did the Prophet speak—not from that of the majesty of divine nature, which, of course, sees all things. In order to point out to you that we have undertaken this laborious task, not for the sake of displaying our talents, but for your instruction, we bring as witnesses for our cause texts from Scriptures. These clearly prove that, after the gathering of the water above the earth and its later falling down into the seas, the dry land appeared. Let them cease, therefore, as far as we are concerned, to stir up contentious disputes by saying: How is the earth invisible when form and color are naturally attached to every body and every color presupposes a form?

The voice of God cries out: ‘Let the waters be gathered together and let the dry land appear.’ And again Scripture says: ‘The waters are gathered together in one place and the dry land appeared.’ Why was there need to repeat this, if the Prophet had not thought it necessary to forestall disputes? Does he not seem to say: ‘I have not said the earth was invisible according to nature, but in respect to the inundation of waters?’ Hence, he added that the dry land, which before was not seen, showed itself when this covering was removed.

Again, they sow the seeds of other disputes by saying: If the waters were in different masses, how came it about, if these masses were in the upper regions, that the waters did not flow down to that place where, after the command given by God, they eventually arrived? For they say it is natural that waters flow of themselves into lower regions. Moreover, if these masses were below, how did it come to pass that they rose up to higher regions, a movement contrary to the nature of water? Accordingly, either this natural course did not need God’s command or, notwithstanding this command, it could not succeed because it is contrary to nature.

I will gladly respond to this question, if they will first reply to me and show me that before God’s command this was the nature of water, namely, flowing and falling downward. It does not have this quality from association with the other elements; it is, rather, a special quality, peculiar to itself. It is not the result of some natural propensity, but issues from the will and operation of the most high God. The waters listen to the command of God and the voice of God is the efficient cause of nature. This voice coincides with the completion of the effect of its operation. The water began to flow downwards so as to form one mass—water which before this had been spread over all the earth and had settled in numerous lurking places. I had not read of its course before, of its movements I had been uninformed: my eye had not seen, nor had my ear heard. The water stood still in diverse places; at the voice of God it was moved. Does it not seem that the voice of God gave it this natural tendency? The creature followed the injunction of its Creator and from the law proceeded custom, the law of its first constitution left its imprint for future ages.

Hence, God created day and night at the same time. Since that time, day and night continue their daily succession and renewal. The water was ordered to run together in a mass. From that moment, water runs. Springs flow down to form rivers, rivers run into larger bodies of water; lakes find an outlet in the seas; wave precedes wave, presses on it, and follows. There is but one way, one mass. Although the depths differ, the surface remains, however, at an equal level. Hence, too, I believe it is called ‘aequor’ [level] because its surface is level.

I have made my reply according to the point of view of my adversaries. Let them now answer my question: Have they ever seen springs shoot up from below? Or water rise out of the ground? Who compels it to do so? Whence does it issue forth? How is it that it does not fall? How does it happen that such deep openings spill forth water? These phenomena are in accordance with the mysterious secrets of nature. Moreover, who does not know that water frequently falls to a very low depth with a great rush and then rises up to a higher position, even to the summit of a mountain? Also, that in canals made by a craftsman’s hands, the water often subsides as much as it previously had been uplifted? Accordingly, if either by its own force or by the skill of an engineer water is conducted and raised contrary to its own nature, do we wonder if by the operation of divine command it has acquired some disposition in its nature which it did not have before?

They may say now to me how God ‘gathered the waters of the sea as in a vessel,’ as Scripture has it, and how ‘he brought forth water out of the rocks.’ Could not He who brought forth water, which did not exist, out of a rock, also not guide water which already existed? ‘He struck the rock,’ cried David, ‘and the streams overflowed,’ and elsewhere, ‘above the mountains shall the waters stand.’ In the Gospel we read that when there was a severe storm and the sea was in violent motion, so much so that the Apostles feared the dangers of shipwreck and aroused the Lord Jesus who was asleep in the stern, He arose and rebuked the wind and the sea and the tempest was abated and calm was restored. Could not He who was able to calm the whole sea at His bidding also move the waters by His command? Well, in the account of the flood it is related that ‘the fountains of the great deep were broken up’ and that God afterwards caused the wind to blow over the deep so as to dry up the waters. If these men do not wish to concede that nature obeyed and that the habitual character of an element was changed by God’s command, at least they can concede this: the waters could have been moved by the force of the wind, a phenomenon to be seen every day on the sea, when the waters flow in the direction of the movement of the wind. If the sea was dried up by the force of a strong south wind in the time of Moses, could not a body of water be dried up in the same manner? Did not the waters, too, have the power of flowing into the sea, water which later on was actually severed from the bed of the sea? Let them learn that nature can be changed, after water burst forth from a rock and iron floated on water, a marvel which Eliseus succeeded in doing by the power of prayer and not by command.

If, therefore, Eliseus caused iron, contrary to nature, to lose its weight in water, could not Christ put the water in motion? But He had the power of moving the waters who was able to say, ‘Lazarus, come forth’ and bring the dead back to life, since God always brings to pass what He ordains. In like manner understand the words: ‘Let the waters be gathered together in one place,’ and they were gathered. By saying: ‘Let them be gathered,’ He not only moved the waters from their place, but He also set them down in a place, so that they would not flow away, but stand still.

The following is on this account a greater marvel: how all the bodies of water flowed into one body and how that one body was not full to overflowing. Scripture, too, reckoned this among extraordinary happenings by stating: ‘All the rivers run into the sea, yet the sea doth not overflow.’ By the command of God, therefore, two things are accomplished: the waters flow, yet do not overflow. A boundary is set up by which the seas are circumscribed and confined, lest the waters inundate everything by pouring over the earth and lest the earth, devoid of cultivation, may prevent the soil from fulfilling its natural function of producing in abundance.

Let them recognize the fact, therefore, that this is the result of divine precept and of celestial operation, for the Lord addresses Job from the clouds, saying, among other things, this, also, about the barrier of the sea: ‘I set my bounds around it and made it bars and doors, and I said: “hitherto thou come and shalt go no further, but on thyself shall be broken thine own waves.”’ Do we not ourselves often see the sea billowing so that its waves rise up ‘like a sheer mountain of water,’ when it breaks its force in foam against the shore, beaten back by what might be called the barriers of the low-lying sandy beach, according to what the Scripture says: ‘Will you not then fear me, saith the Lord, who has set the sand a bound for the sea?’ Thus the violent onslaught of the sea is held in check by the most unstable of all things, ordinary coarse sand of the seashore. The waves recoil and are guided to their prescribed bounds by a command from heaven, and the violent movement of the water is broken by meeting itself. It then departs in receding ripples.

Moreover, unless the force of a celestial decree did not serve as a check, who would prevent the Red Sea from pouring over the plains of Egypt (which is claimed to be flat and low-lying with very deep valleys) and from mingling its waters with the Egyptian Sea? The men who wished to connect these two seas and to make them one have made us aware of the fact. The Egyptian Sesostris of an older period and Darius the Mede, in virtue of his greater power, wanted to put into effect what had been attempted before their time by a native of the country. This fact is substantial evidence that the Indian Ocean, which includes the Red Sea, is of higher elevation than the Egyptian Sea, the level of whose waters is lower. And it may well have been that both kings relinquished their projects lest the sea, in headlong rush from a higher to a lower level, should inundate their land.
'''
