[[commentary]]
quote='''
Neither hold back the maidens of whom it is written, "Thus have the maidens loved you, and they have brought you into the house of their mother." You may not, then, separate the little ones from the love of Christ whom they proclaimed with prophetic exaltation even from their mother's womb.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 7:41"

[[commentary]]
quote='''
I will take you up she says and bring you in. Rightly is the Word of God taken up and brought in, because he knocks at the soul that the door may be opened to him, and unless he finds the door open to him, he does not enter; but if anyone opens the door, he enters and sups. So the bride takes up the Word, that by taking him up she may be taught. Hence not undeservedly she goes up still to higher dwellings and always makes progress.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
