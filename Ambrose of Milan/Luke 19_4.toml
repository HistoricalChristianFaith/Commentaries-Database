[[commentary]]
quote='''
He has well added, that our Lord was to pass that way, either where the sycamore-tree was, or where he was who was about to believe, that so He might preserve the mystery, and sow the seeds of grace. For He had so come as that through the Jews He came to the Gentiles. He sees then Zacchæus above, for already the excellence of his faith shone forth amidst the fruits of good works, and the loftiness of the fruitful tree; but Zacchæus stands out above the tree, as one who is above the law.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He added beautifully: because the Lord was to pass by that way, either where the sycamore was, or where one who was to believe was, so that he might both keep the mystery and sow grace; for he had so come as to pass through the Jews to the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
