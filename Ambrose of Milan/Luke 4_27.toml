[[commentary]]
quote='''
Now in a mystery the people pollute the Church, that another people might succeed, gathered together from foreigners, leprous indeed at first before it is baptized in the mystical stream, but which after the sacrament of baptism, washed from the stains of body and soul, begins to be a virgin without spot or wrinkle.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And there were many lepers in the times of Elisha the prophet, and none of them was cleansed except Naaman the Syrian. Clearly this word of the Lord Savior instructs us and exhorts us to zeal in venerating the divinity, since no one is shown to have been healed and freed from the disease of a spotted body except him who sought health with religious duty; for divine benefits are conferred not on those who sleep, but on those who keep watch. And well, by the fitting example of a comparison, is the arrogance of the envious citizens beaten back, and the Lord's deed is taught to agree with the ancient Scriptures, since in the books of Kings too we read that a Gentile man, Naaman, was freed from the spots of leprosy by the prophet's oracle, while leprosy of body and mind alike consumed very many of the Jews; for indeed the history relates that those four too, who, compelled by famine, were the first to make for the camp of the king of Syria, were lepers. Why, then, did the prophet not cure his brothers, not cure his fellow citizens, not heal those who shared his lot, while he healed strangers, healed those who had neither the observance of the law nor fellowship in religion, unless because medicine belongs to the will, not to the race, and the divine gift is drawn out by prayers, not conferred by right of nature? Learn to ask for what you desire to obtain; the gains of heavenly gifts do not attend fastidious men.

But though the simple exposition shapes the moral disposition, yet the grace of the mystery is not hidden. For while later things are derived from earlier ones, so also earlier things are confirmed by later ones. For we said in another book that in that widow to whom Elijah was sent a type of the Church was set forth beforehand. It is fitting that the people should follow the Church. That people gathered from foreigners, that people once leprous, that people once spotted, before it was baptized in the mystical river, the same people, after the sacraments of baptism, washed from the spots of body and mind, began to be no longer leprosy but a spotless virgin without wrinkle. Rightly, then, is Naaman described as great in the sight of his lord and admirable in countenance, since in his type salvation to come is declared to the Gentiles; he, warned by the counsel of a holy girl, who, when the strength of her fellow citizens was broken, had come as a captive under hostile power, to hope for health from the prophet, is healed not by the command of an earthly king but by the generosity of divine mercy.

Why is he ordered to plunge himself a mystical number of times? Why is the river Jordan chosen? Are not good he says Abana and Pharpar, rivers of Damascus, rather than the Jordan? But in anger he preferred these; on reflection he chose the Jordan; for anger does not know the mystery, faith knows it. Learn the grace of saving baptism: he who had plunged as a leper emerged a believer. Learn that spiritual sacraments are signified: a remedy for the body is sought, a remedy for the mind is gained. The flesh is washed, the disposition is washed. For I see that the leprosy of the body was cleansed no more than that of the mind, when after baptism, the filth of the old error wiped away, he declares that he will not offer to strange gods the victims which he pledges to the Lord.

Learn also the precepts of a fitting virtue: he proved his faith who refused rewards. Learn from the twofold teaching of words and of deeds what you should follow. You have the Lord's precept, the prophet's example: freely to receive, freely to give, and not to sell the ministry but to offer it; for the grace of God is not assessed at a price, nor is gain sought in the sacraments, but the service of the priest.

Yet it is not enough if you yourself do not seek gain: the hands of your household too are to be restrained. Nor is this alone demanded, that you keep yourself alone chaste and spotless; for the Apostle did not say 'yourself alone', but keep yourself chaste. So what is required is that not only you, but also your house, be kept chaste from markets of this kind; it behooves indeed the priest to be irreproachable, set well over his house, having children subject with all chastity. But if anyone does not know how to preside over his own house, how will he take care of the Church of God? Instruct, then, your household, exhort it, guard it; and if a little slave deceives you — for I do not rule out what is humanly possible — let him, once caught, be rejected after the prophet's example. Leprosy quickly follows shameful pay, and money ill gotten stains body and soul. You have received he says money, and you will possess from it a field and a vineyard and olive groves and flocks. And the leprosy of Naaman will cleave to you and to your seed for ever. You see that by the deed of the author the succession of the heir is condemned; for the guilt of a mystery sold is inexpiable, and the vengeance of heavenly grace passes to descendants. Finally, the Moabites and the rest shall not enter to the third and fourth generation: so long, that is, to interpret more simply, until the succession of many generations should abolish the guilt of the authors.

But since those who sinned against God by the error of idolatry seem to have been punished to the fourth generation, surely the sentence seems harsher by which the seed of Gehazi is condemned for ever by prophetic authority for the desire of having, especially since our Lord Jesus Christ has given remission of sins to all through the regeneration of the washing — unless you are to understand the seed of vices rather than of race? For just as those who are children of the promise are reckoned as good seed, so too those who are children of error are reckoned as evil seed. For the Jews too are of their father the devil, certainly not by succession of the flesh, but of crime. So all the covetous, all the avaricious possess the leprosy of Gehazi with their riches, and by ill-gotten pay have gathered not so much a patrimony of wealth as a treasure of crimes, with eternal punishment and brief fruit. For while riches are perishable, the punishment is perpetual, because neither the avaricious nor the drunkard nor the idolater will possess the kingdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
