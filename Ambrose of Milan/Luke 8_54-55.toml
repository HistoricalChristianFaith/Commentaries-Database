[[commentary]]
quote='''
Now the Lord taking hold of the hand of the maid, cured her. Blessed is he whom wisdom takes by the hand, that she may bring him into her secret places, and command to be given him to eat. For the bread of heaven is the word of God. Hence comes also that wisdom which has filled its altars with the food of the body and blood of God. Come, she says, eat my bread, and drink the wine which I have mixed for you. (Prov. 9:5.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So Jesus, holding the girl's hand, healed her, and ordered that she be given something to eat. This is a testimony of life, so that it might be believed to be not a phantom but the truth. Blessed is he whose hand Wisdom holds. Would that she might hold my acts too, that Righteousness might hold my hand, the Word of God hold it, lead me into his inner chambers, turn away the spirit of error, turn toward me the spirit of salvation, and order that I be given to eat! For the Word of God is the heavenly bread. Hence too that Wisdom, which has filled the most holy altars with the nourishment of the divine body and blood: come she says eat my loaves and drink the wine which I have mixed for you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
