[[commentary]]
quote='''
Of the horseman we read: And the horseman will fall backward, looking for the salvation of the Lord. For, since no one is without a fall, even if a horseman be brought down and turned aside by some earthly vices, yet, if he does not cast aside the hope of rising again, relying on the divine mercy he comes to salvation. But as regards the rider, there is a clear proof that he is considered reprehensible, since Moses himself says in the Canticle of Exodus: The horse and the rider he hath thrown into the sea. And in Zacharias the Lord has spoken, saying: I will strike every horse with madness and his rider with foolishness. He did not say the horse only but also the rider, just as you have also in Exodus, the horse and the rider. For where there is a rider who cannot manage his horse, the horse rushes headlong and, through its unbridled fury, is carried to precipices and dangers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 15"
