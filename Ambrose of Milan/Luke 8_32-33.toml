[[commentary]]
quote='''
They are carried violently down, for they are reclaimed not by the contemplation of any good deed, but thrust as from a higher place to a lower, along the downward path of iniquity, they perish amidst the waves of this world, shut out from the approach of air. For they who are carried to and fro by the rapid tide of pleasure cannot receive the communication of the Spirit; we see then that man himself is the author of his own misery. For unless a man lived like the swine, the devil would never have received power over him, or received it, not to destroy but to prove him. And perhaps the devil, who after the coming of our Lord can no longer steal away the good, seeks not the destruction of all men, but only the wanton, as the robber lies in wait not for armed men, but the unarmed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Who are these swine, unless perhaps those of whom it was said: do not give what is holy to the dogs, nor cast your pearls before swine, lest perhaps they trample them under their feet? Those, namely, who after the manner of unclean animals, devoid of speech and reason, have defiled the ornaments of the natural virtues by the muddy acts of their life; who are borne headlong by their impulse, since they are called back by regard for no merit, but, thrust down as it were from higher to lower along the slope of wickedness, they are choked in the waters amid the floating things of this world, perishing like men strangled, with the passage of their breath shut off; for in those who are carried uncertain hither and thither by the flowing tide of pleasures there can be no life-giving exchange of any spirit.

We see, then, that man himself is the author of his own misery. For had someone not lived after the manner of a swine, the devil would never have received power over him, or, had he received it, it would have been not to destroy him but to test him. Or perhaps, because after the Lord's coming he could no longer deprave the good, he now seeks the destruction not of all men but of the fickle, as a robber lies in wait not for the armed but for the unarmed, and assails the weak with injuries, knowing that he is either despised by the strong or condemned by the powerful.

But someone says: why is this permitted to the devil by God? And I say: that the good may be proved and the wicked punished; for this is the punishment of sin. Indeed, read that the Lord sends fever and trembling and evil spirits and blindness and every scourge according to the deserts of sins. But let us return to the reading.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
