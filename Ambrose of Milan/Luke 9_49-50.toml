[[commentary]]
quote='''
But lest we seem to have improvidently passed over the question why here he says that those who can command unclean spirits in the name of Jesus through the laying on of hands are not to be forbidden, whereas according to Matthew he says to them: I do not know you. Depart from me, all you workers of iniquity, we ought to observe that there is no difference of sense or discord of sayings, but that the latter is to be judged by this, that not only the duties of office but also the works of virtue are required in a cleric, and that the name of Christ is so great that it helps even those who are not very holy to protection, even if it does not help them to grace. Hence no one ought to boast or claim for himself the credit for a man cleansed, in whom the power of the eternal Name has worked, not any capacity of human frailty; for the devil is conquered not by your merit but by hatred of him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
