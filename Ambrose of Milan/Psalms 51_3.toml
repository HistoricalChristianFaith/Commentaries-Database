[[commentary]]
quote='''
What punishment is greater than to fear what you cannot avoid, and not to escape what you have feared? Hence David, splendidly expressing the most grievous dunning of a sinful conscience, says: For I acknowledge my iniquity, and my sin is ever against me. For the avenging image of our sin is spread before us and does not allow its defendant to be at rest; it brings on a wretched servitude and draws him into its chains, so that he cannot untie himself, since he willingly sold himself, though he was free not to take on the debt of sins and to keep the liberty of innocence. And so while we pray, sin spreads itself before us; when sleep has relaxed the senses of the body, sin returns. Always our error meets us like a wicked exactor, or like a shameless usurer dunning his debtor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
