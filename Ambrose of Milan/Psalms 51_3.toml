[[commentary]]
quote='''
What punishment is greater than to fear what you cannot avoid, and not to escape what you have feared? Hence David, splendidly expressing the most grievous dunning of a sinful conscience, says: For I acknowledge my iniquity, and my sin is ever against me. For the avenging image of our sin is spread before us and does not allow its defendant to be at rest; it brings on a wretched servitude and draws him into its chains, so that he cannot untie himself, since he willingly sold himself, though he was free not to take on the debt of sins and to keep the liberty of innocence. And so while we pray, sin spreads itself before us; when sleep has relaxed the senses of the body, sin returns. Always our error meets us like a wicked exactor, or like a shameless usurer dunning his debtor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Did he, then, cover his sins or not? But who would deny it, when this very prophet has taught that iniquities are remitted, that sins are covered and are not imputed by the Lord? He himself taught that his sin had been remitted to him, as it is written: I acknowledge my transgression, and my injustice I have not concealed. I said: I will declare my injustice against myself to the Lord, and you forgave the ungodliness of my heart. If he said: I will declare, and merited pardon before he declared it, how much more, when he made his declaration about himself, saying: I acknowledge my iniquity, was every sin remitted to him. And besides, the prophet Nathan too answered specifically about this: And the Lord has taken away your sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"

[[commentary]]
quote='''
And therefore he added: For I acknowledge my iniquity, and my transgression is ever against me. It is no small thing for each one to acknowledge his sin. And therefore he also said above: Who will understand falls? That is, who is so great as to understand them? As in that saying: Who will dwell in your tabernacle?, or: Who will ascend into the mountain of the Lord? Not, surely, no one, but few; for he who can acknowledge can turn aside, can choose what he should follow. Many glory in their falls and think those things matters for praise which are matters for accusation: if a man has defiled another's bed and overcome the affection of a chaste woman, if he has by some fraud changed a widow's resolve; another thinks that murder, the ambushes of brigandage and living by plunder count as virtue; some judge that to circumvent and deceive belongs to wisdom. None of these can say: For I acknowledge my iniquity, but only he who can grieve for what he has done and condemn the wrong he has done, he whom his vices prick. Hence the prophet also says: The things you say in your hearts, be pricked for them on your beds as well. Many horses, when they have fallen, are wont to throw themselves about, and though the fall has not harmed them, they weaken and break themselves by their thrashing. Others, such as the nature of Greek horses is said to be, when they have been thrown in a chariot race or have fallen by chance, are wont not to move at all, and keep a certain discipline of quiet and patience. For these, if the fall has done no harm, the quiet does good; at least the hurt is not made worse. Are not those to be reckoned worse than dumb animals who boast in their shameful deeds and think that to be a mark of virtue where there is a fall into crime? Therefore it is said, as to a dumb beast of burden: You have sinned; be still.

Hence he finely added: And my transgression is ever against me. For the foolish man delights in his errors and, by overshadowing old sins with new ones, thinks himself helped, and therefore he exults in crime. But the wise man judges that his transgression is against him, and he thinks that the falls of his faults stand against him like hostile battle lines, in the manner of adversaries. Whatever has sounded, whatever has made a noise, his own fault always meets him; whatever has been said or read, he thinks it said against himself; whatever he turns his mind to, he thinks it is he who is marked out by signs, he by eyes. If he feasts, if he thinks, if he prays and entreats, his own error is always before his eyes, and at every moment his fault knocks at his conscience and lets him neither rest nor forget. Like a stern censor, he harasses himself with perpetual terror. So he who is displeasing to himself finds everything adverse; he himself is his own accuser, he himself his own witness, and he who presses and goads himself finds nowhere to flee. But it belongs to a good mind to feel the wound of sin. For those who are without pain do not feel the bitterness of the wound, which belongs to an incurable sickness; but those who are pricked by some pain, just as they do not lack the sense of pain, so they do not lack progress toward health either. For where there is the sense of pain, there is also the sense of life; for to feel belongs to vital vigour and function. Hence he who does not acknowledge his error is mad, raves, is senseless; but he who acknowledges it surely comes to his senses, does not spurn the remedies of health, restrains himself, repents of his fault, always thinks about it and by thinking condemns himself; and the just man moreover is his own accuser at the beginning of his speech. He who accuses himself is just; he who is just is sober, is sound. The just man does not know how to flatter himself; he does not know how to bend the rigour of judgment even in his own case; he shudders at the remembrance of his own fall and blushes at the error he has committed; he dreads, fears, shrinks from every memory of it, judges it grievous to himself, shuns himself as arbiter and does not dare to entrust himself to himself, because he thinks no one more severe toward him than the one from whom he cannot hide, whom he cannot deceive, whom he can find no way to flee and avoid, unless he deny himself and take up the Lord's cross.

Great is the force of a guilty conscience, great its torments. Eve and Adam were afraid and, when they heard the voice of the Lord walking in paradise, they wished to hide themselves, though no one was seeking them. Cain too was afraid that everyone who found him would kill him. Thus he bore within himself the sentence that he deserved that no one should pardon him. Hence he says well: And my transgression is ever against me, that is: without any interval the remembrance and the very image of my error assails me. Consider how it confounds us when we commit some transgression, how it rushes upon our eyes, how it keeps coming back into our memory. He who is ashamed of what he has committed does not know how to commit anything like it afterwards, for which he would blush in the same way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 9"
