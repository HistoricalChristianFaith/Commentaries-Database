[[commentary]]
quote='''
But neither were the sons less than such a parent; they exhorted one another, they said with one zeal and as it were with one battle-line of souls: 'Let us crush the onset of hostile death. For then we shall live, when we have died. Let no one desert the rank of devotion, let no one withdraw himself from the triumphal battle. Not to a man, but to almighty God have we devoted our souls; not for a man, but for the author of all things do we serve as soldiers. Such is this fight, that he has conquered more gloriously who has been more cruelly slain'. And so no one feared, no one trembled, none of so many brothers was slower to death, but all ran to death through bitter tortures as if on the way to immortality. And the mother, seeing the harmonious ranks of her sons, offered, like a devoted soul, the members of her own body in her sons, and seemed to herself to undergo in her own limbs the torments she had prayed for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 12"
