[[commentary]]
quote='''
But if you doubt, let Rebekah teach you how blessed is the flight which Jacob undertook. Rebekah urged him: Flee she says into Mesopotamia. And Isaac says: Rise and go into Mesopotamia, into the house of Bathuel. In hymns or oracles Bathuel is called wisdom by most, as has been written before us, but in Latin interpretation it means "daughter of God". Into the house of wisdom, therefore, Jacob is sent, and he is admonished to take a wife from the daughters of Laban, who dwelt in Charrae, which means caves, in which there is a figure of the senses, which are as it were in the caves of the body, as sight in the eyes, hearing in the ears, smell in the nostrils, taste in the mouth. For he who delights in this world and dances in the pleasures of the body is liable to the passions of the senses and dwells and lodges in them. Hence Rebekah also says that he must dwell with him a few days, not for a long time, lest he be coloured by bodily pleasures and be captured by the enticements of the world;

but she persuades him to dwell there, so that, as one eager for discipline, he may learn the powers of the senses and, as it were, certain sites and regions of the flesh, so that he may know himself and know the vehemence of the flesh, what has been created and for what cause, and how each sense works. Whoever has looked he says on a woman to lust after her. The eye sees wrongly thus. Let the eye, then, see and perform its function, and not be directed to a fall at the command of a slippery mind, so that it brings back vice instead of duty. A short time, then, is given for knowing, or rather for experiencing, the senses, and perhaps the first beginnings of tender youth, and at once he is called back, lest he totter too long on slippery ground and the inner footsteps of the mind be submerged by a kind of divided flood of this body and of the world. But when he has either gained experience or has stood upon unstable, uncertain and wet ground, he is called back by his mother, patience or perseverance, who says: I will send to you and fetch you from there, so that even there, on slippery ground, you may find the safe harbour of wisdom, which will not allow you to toss as in a shipwreck, and, having returned, may know how to persevere in the worship of God, and may be in the assembly of the Gentiles, signifying that by his faith the Church of the Gentiles was to be gathered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"

[[commentary]]
quote='''
But perhaps you will say: Why then was Jacob sent to Laban, if Laban is blameworthy? If we consider the name, in Latin it means "white". So Jacob is bidden to go out to brighter things. But since he was carnal, we better understand the brighter things of this life. As one not yet perfect, he goes first to him with whom he might for a time exult in his light. But Laban had worse sons, that is, a name more tolerable than his works. And therefore, by his mother's counsel, by the divine oracle, and by the will of Jacob himself, a lover of discipline, he is deserted and abandoned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
