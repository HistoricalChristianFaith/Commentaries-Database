[[commentary]]
quote='''
And at the time of the fruits he sent his servants. Rightly he put the time of the fruits, not the yield; for there was no fruit of the Jews, no yield of this vineyard, of which the Lord says: I waited for it to make grapes, but it made thorns. So the winepresses overflowed not with the wine of gladness, not with spiritual must, but with the gory blood of the prophets. Indeed Jeremiah was cast into the pit; for these were by now the winepresses of the Jews, filled not with wine but with mire. And although the prophets in general seem to be meant, yet the reading leads us to believe that the one who was stoned is Naboth, of whom, though we have received no prophetic word, we have yet received a prophetic deed, because by his own blood he prophesied that there would be many martyrs for this vineyard. But who is the one who is wounded in the head? Surely Isaiah, the frame of whose body the saw divided more easily than it bent his faith, or wore down his constancy, or cut away the vigor of his mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
