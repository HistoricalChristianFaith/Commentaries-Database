[[commentary]]
quote='''
He also rebukes the arrogance and boastfulness of the Jews, in that they seek the first places at table at banquets. Against the lawyers themselves too a sentence of condemnation is pronounced, who, like tombs that do not appear, mislead by their appearance and deceive in their use, so that, while outwardly they promise what is fair, within they enclose what is full of stench. This most teachers do, who demand from others what they themselves cannot emulate. And therefore they themselves are tombs, as it is also said elsewhere: their throat is an open sepulchre.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
