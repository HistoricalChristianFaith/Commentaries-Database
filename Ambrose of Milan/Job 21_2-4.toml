[[commentary]]
quote='''
These things, then, he answered more sparingly at the beginning, to remind them of the judgment of God and, recalling them from insolence and fury, to bring them to their senses like a good physician. But after he noticed that they persisted in their insults, he went on to more and stronger things, and struck them as with a more powerful fist, since they were stoning an innocent man with the stones of their words. Hear he says, hear my words; let it not be mine to seek consolation from you: bear with me, for I shall speak stronger things. The weight of my words will be heavy. I too will speak according to your opinion, because many abound in this world in the successes of prosperity, and others are weighed down and set in tribulation: and this seems to be dealt out according to the desert of sins. Even if I say this, do not laugh as though I had agreed with you. Even if I am a sinner, I am not guilty before man, because he too who judges, and claims for himself power over me, is under sin. Or if I am judged as a man, that is common to all. I ought not to be rebuked: it is the weakness of our condition, not a particular wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 3"
