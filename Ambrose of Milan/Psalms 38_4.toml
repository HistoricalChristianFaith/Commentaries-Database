[[commentary]]
quote='''
Whence the saint groaned, saying: for my iniquities have risen above my head, as a heavy burden they have weighed heavily upon me, that is: my iniquities have passed over my head and tower above me, so as to press down my senses; for the eyes indeed of the wise man are in his head. And therefore Nabal was evil and hard, because malice and iniquity barred his senses. Whence he could not bear even the word of Abigail, but his heart hardened and he fell down as one sick. Or see whether this is not the head of which the Apostle says that he who is puffed up by the mind of the flesh does not hold it. And this head is Christ, because the head of every man is Christ. This is the head which through the joinings and bindings of the whole people grows to the increase of God, because in all of us Christ rises up through each of his members. So when our sins weigh heavy and we are pressed down to earthly things by a kind of leaden talent of iniquity, let us burst their bonds and cast away their yoke from us, so that we may lift the eyes of our mind and hear him saying: Come to me, all you who labour and are burdened, and I will refresh you. Indeed avarice burdened Egypt, money troubled the merchandise of the Ethiopians, as it is written: Egypt has laboured, and the merchandise of the Ethiopians, and the Sabeans, lofty men, will pass over to you. Egypt laboured before it knew the truth, but it labours no longer, now that it has passed over to Christ. The Sabean men, who before fled, follow willingly, because the bonds of charity hold them, which are stronger than adamant. Finely too that word of Isaiah fits this place: Every head in pain and every heart in sorrow. From the feet up to the head there is neither wound nor scar nor stroke with inflammation. For iniquity is inflamed when it lords it over our head, lifting itself up and occupying the place, so that Christ, the teacher of penitence, may not hold it. These iniquities have no small force, if you consider that man of iniquity who is to come according to the working of Satan in all power and signs and lying wonders and every seduction of iniquity, whom the Apostle has shown we must beware of, because he will receive the working of error, so that the faithful may be proved and the faithless judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
