[[commentary]]
quote='''
And so, to begin from the plainer things: him whom God has justified, you judge. It is a very small thing to me, says Paul, that I should be judged by you or by a human day; but neither do I judge myself. And he was still set in the body, still exposed to temptation, yet he did not judge himself for this reason, that the spiritual man is judged by no one except by God alone. Then he added: He who judges me is the Lord. Therefore do not judge anything before the time. But David has already fulfilled his time and has merited grace and has been justified by Christ, since the Lord himself rejoiced to be called the son of David, and those who confessed him so were enlightened. Why do you summon the man of God from reward to judgment? The Lord has already judged concerning him, of whom he said to Solomon: If you walk in my sight, as David your father walked in holiness of heart and justice, to this end, that he might do according to all that I commanded him. Is he then worthy of judgment or of reward, who did according to all the heavenly commands, walking in holiness and justice of heart? Where the sins and vices of others lie hidden, there David received the divine testimony of his virtue and of his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 1"
