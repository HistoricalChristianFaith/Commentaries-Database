[[commentary]]
quote='''
This Joseph Luke called righteous, Matthew rich. And rightly is he called rich in this place, where he received the body of Christ; for in receiving the Rich One he knew no poverty of faith. He who is righteous, then, is rich.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
