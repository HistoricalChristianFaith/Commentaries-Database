[[commentary]]
quote='''
Let us not then despise (as the Pharisees did) the counsel of God, which is in the baptism of John, that is, the counsel which the Angel of great counsel searches out. (Is. 9:6. LXX.) No one despises the counsel of man. Who then shall reject the counsel of God?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us not, then, despise the counsel of God as the Pharisees did. The counsel of God is in the baptism of John; who then would doubt that the counsel of God is in the washing of Christ? This is the counsel which the Angel of great counsel found, which no one has known; for who has known the mind of the Lord? No one despises the counsel of a man: who would reject the counsel of God? So let us, as children, justify our mother; let us follow our mother. We know that a mother offers herself to danger for her children. Let us obey the counsel of wisdom our mother, the command of our mother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
