[[commentary]]
quote='''
He was very rich, inasmuch as he lacked nothing good, he who did not covet what belonged to another, because he needed nothing that he would wish to be called his own. For this is to be rich: to have what suffices for one's will; for frugality has a measure, wealth has none, since its limit lies in the will of the one who seeks it. And he was rich in cattle, in silver and in gold. What does this mean? It does not seem to me that worldly riches are being praised in a just man. Hence in the cattle I understand the bodily senses, because they too are irrational; in the silver, speech; in the gold, the mind. Rightly was Abraham rich, because he ruled the irrational senses. Indeed he both tamed them and made them gentle, so that they became rational. He had speech splendid with the colour of faith, purified by the grace of spiritual discipline; he had a mind full of prudence. And therefore a good mind is compared to gold, because, just as gold surpasses the other metals, so a good mind in man is more excellent than the other portions of human substance. In three things, then, lies the wealth of the wise man: in sense, speech and mind. A kind of ascent has been made in order, as we also read in the Apostle: But there abide faith, hope, charity, these three: but the greater of these is charity. And so the mind too is the greater, because it is the mind that grinds the spiritual grain, so as to bring forth the cleansing of the senses and of words. Everywhere the character of the wise man is preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 5"
