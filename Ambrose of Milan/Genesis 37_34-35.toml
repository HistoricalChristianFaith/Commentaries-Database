[[commentary]]
quote='''
And rightly Jacob, lamenting the losses of his posterity, wept as a father for a lost son, and as a prophet mourned the destruction of the Jews. And so he also tore his garment, which we read was done at the passion of the Lord Jesus by the chief of the priests, in whom there was not a private person but the charge of a public office. And the veil of the temple was torn, so that by such signs it might be shown that the mysteries were profaned, the people stripped of the garments of salvation, the kingdom divided and bound to be destroyed, because every kingdom divided will easily be destroyed. And truly divided, when what had been Christ's began now to be the devil's. For those could not remain undivided who were separating the Son from the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
