[[commentary]]
quote='''
(in Luc. ii. 45.) The star is the way, and the way is Christ; and according to the mystery of the incarnation, Christ is a star. He is a blazing and a morning-star. Thus where Herod is, the star is not seen; where Christ is, there it is again seen, and points out the way.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do you want to know how good a merit they have? The star is seen by them, and where Herod is, it is not seen; where Christ is, it is seen again and shows the way. So this star is the way, and the way is Christ, because according to the mystery of the Incarnation Christ is the star; there shall rise indeed a star out of Jacob, and a man shall spring up out of Israel. Indeed, where Christ is, there the star is too; for he himself is the bright and morning star. So he marks himself out by his own light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
