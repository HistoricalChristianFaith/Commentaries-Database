[[commentary]]
quote='''
Hence, as one visited by him, he says: You have held my right hand, and in your will you have led me, and with glory you have taken me up. So we have received it, and according to the Greek it agrees so. For the Greek said: ἐκράτησας τῆς χειρός, that is, you have held the hand, τῆς δεξιᾶς μου, my right hand. He is well directed whose right hand God holds with his own hand. He can say: The Lord is at my right hand, that I may not be moved. If Adam had been willing to have the Lord at his right hand, he would not have been deceived by the serpent. But because he forgot the commandment of God and fulfilled the will of the serpent, the devil held his hand and made it stretch out to the tree of the knowledge of evil and good, so that he plucked what was forbidden. In him judgment was passed beforehand on all, and the adversary began to stand at the right hand of all. Hence also that form of curse went forth against Judas: And let the devil stand at his right hand. If that curse is heavy, this blessing is very great, by which the bonds of the harsh curse are loosed. Therefore the Lord Jesus set the devil at his own right hand, as we read in the book of Zechariah; for he had taken up the cause and the place of man. He stood, then, there where the inheritance of Adam stood. Like a good athlete he allowed him to stand at his right hand, so that he might drive him back, saying: Get behind, Satan. And so the adversary, cast down from his place, withdrew; and so that the devil might not stand at your right hand, he says: Come, follow me. David, therefore, foreseeing the coming of the Lord, who came down from heaven to free us from the power of the adversary, says: The Lord is at my right hand, that I may not be moved. But he at whose right hand the devil was, was moved. Rightly, then, does he say here too: You have held my right hand, that is: so that I can no longer sin, so that I, who before was wavering with slippery step, may be able to stand firm in a sure station. How well the apostle said this, when the Lord saw him troubled and, stretching out his own right hand, did not suffer him to stagger, and made him firm with fearless step! And so Peter, set free, what else did he speak but these prophetic verses: You have held my right hand, and in your will you have led me, and with glory you have taken me up? What is the right hand but the active virtue of the soul? If it is directed by the will of the Lord, it desires nothing else, seeks nothing, demands no riches of this world, no aids.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 10"
