[[commentary]]
quote='''
And so Jacob, who had cleansed his heart of all rancour and bore a peaceable disposition, after he had sent away all that was his, remained alone and wrestled with God. For whoever disregards worldly things draws nearer to the image and likeness of God. For what is it to wrestle with God, but to take up the contest of virtue, to engage with one who is stronger, and to become an imitator of God beyond the rest? And because his faith and devotion were invincible, the Lord revealed hidden mysteries to him, touching the breadth of his thigh, because from his line the Lord Jesus was to arise, born of a virgin, who would be neither unequal nor inferior to God. The breadth of the thigh, growing numb, signified his cross, because, spread through the whole world by the remission of sin, it would bring salvation to all, he who by the numbness and sleep of his own body would grant the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 7"
