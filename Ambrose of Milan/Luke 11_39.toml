[[commentary]]
quote='''
Now you Pharisees cleanse the outside of the cup and the dish first. You see that our bodies are signified by the representation of earthen and fragile things, which, thrown down by a short fall, are broken. And you see that the inner things the mind has willed are easily betrayed through the senses and the acts of the body, just as the things a cup holds within shine through outside. Hence too there is no doubt that later on the Passion of the body is declared by the word cup, when the Lord says: the cup which my Father has given me, do you not wish me to drink it? For he drinks his body who absorbs bodily frailty with a spiritual disposition and, as it were, pours it over into the mind and soul, so that the weakness of the outer things is swallowed up by the inner. You perceive, then, that it is not the outside of this cup or dish that defiles us, but the inside.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
