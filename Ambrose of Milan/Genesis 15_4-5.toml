[[commentary]]
quote='''
But if Abraham's view does little to correct men, hear the oracle of God condemning an inheritance of this kind. This one shall not he says be your heir, but another who shall come forth from you, he shall be your heir. Whom does he call another? For Hagar too bore a son, Ishmael, but he does not mean him; he means holy Isaac. And therefore he added: who shall come forth from you; for he truly came forth from Abraham who was begotten in lawful wedlock. But through Isaac, the lawful son, we can understand that true lawful one, the Lord Jesus, whom at the beginning of the Gospel according to Matthew we read to be the son of Abraham, who showed himself the true heir of Abraham, illuminating the succession from its founder, and through whom Abraham looked up to heaven and recognized the splendour of his posterity, no less illustrious than the brightness with which the heavenly stars shine. For as star differs from star in brightness, so also the resurrection of the dead, the Apostle said, because, granting to men the fellowship of his resurrection, he made those whom death used to hide in the earth partakers of the heavenly kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
