[[commentary]]
quote='''
I will say to the Lord: Why do you judge me thus? Or is it good to you that I should be unjust, because you have cast off the works of your hands and given heed to the counsel of the ungodly? Do you see as a mortal sees? Or is your life as a man's, or your years as a man's, that you have searched out my iniquities and tracked down my sins? For you know that I have not acted ungodly; but who is there to rescue from your hands? Great faith, great authority of conscience, to summon God as witness of one's own mind! What belongs to the condition he does not deny, what belongs to ungodliness he repels, what belongs to weakness he confesses. To have sinned belongs to the condition, because no one is immune from falling; to act ungodly belongs not to the condition, but is the poison of faithlessness and of a most wicked mind. This the just man does not acknowledge; but the absolution of man lies in God's compassion, not in man's power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
