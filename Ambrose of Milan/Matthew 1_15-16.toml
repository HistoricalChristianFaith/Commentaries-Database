[[commentary]]
quote='''
We notice this too, that Saint Matthew recorded that Jacob, who was the father of Joseph, was the son of Matthan, but Luke described Joseph, to whom Mary was betrothed, as the son of Heli, and Heli as the son of Melchi. How are there two fathers of one man, that is, Heli and Jacob? How also two paternal grandfathers, Matthan and Melchi? But if you follow it up, you will find that, according to the prescription of the old Law, two brothers begot of one wife different sons born of the same womb. For it is handed down that Matthan, who drew his line from Solomon, begot a son Jacob and died, his wife surviving him, whom Melchi afterwards took as wife, and of her Heli was begotten. Again, when Heli's brother died without children, Heli was joined to his brother's wife and begot a son Joseph, who according to the Law is called Jacob's son, since according to the course of the old Law the brother raised up the seed of the dead brother. So he was called the son of two, not begotten by both, but because he was made the son of the one by generation, of the other by law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
