[[commentary]]
quote='''
But he cried out: 'Never may it befall me that as an old man I become an incitement to the error of the young, I who until now was a saving pattern of our way of life. Shall I, then, by these mockeries, gain a little more life, and make over the labours of my whole life for the journey-money of a brief old age? Old age ought to be a harbour, not a shipwreck, of the life before it. I will not deny you, law of our fathers; I will not forswear you, holy institutions of our ancestors; I will not discolour you, priestly fillets; I will not openly defile you with the dust of faithlessness, grey hair'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 10"
