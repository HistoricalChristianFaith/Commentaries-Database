[[commentary]]
quote='''
In the preceding pages we have discussed the subject of Paradise, including the account of the fall of Adam and Eve. We have recorded these facts to the best of our ability, just as the Lord has inspired us to interpret their meaning. Now, we have it on record that this sin did not stop at that point, but, to make matters worse, lived on and had a successor in the person of one who was still more debased. Let us take note, then, of what happened subsequently, as we follow in due order the events related in the pages of holy Scripture.

Adam knew his wife and she conceived and bore Cain, saying: I have begotten a man-child through God. In using the expression "giving birth to," it is usual for us to consider the categories "by what," "from what," and "through what." The phrase "by what" refers to the material; "from what," to the author; "through what," to some instrument. Can the expression, I have begotten a man-child through God, induce us to think of God as an instrument? Certainly not. We are to understand here that God is the Author and Creator. Hence, Eve ascribed the work to God when she said: I have begotten a man-child through God, so that we, too, in a similar situation, ought not to claim our succession to ourselves, but attribute it entirely to God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 1"
