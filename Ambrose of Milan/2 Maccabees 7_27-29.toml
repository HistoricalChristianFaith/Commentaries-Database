[[commentary]]
quote='''
But she said to her son in her native tongue: 'You alone, son, survive, the sum of my prayers; you last closed my childbearing, do you, the last, complete my joys. Have pity on me, who carried you in my womb through so many courses of months, lest in one moment you put my old age to shame, lest you discolour the trophies of so many brothers of yours, lest you leave their sacred company, lest you desert their fellowship. These triumphs still await you. Look to heaven, whence you drew your breath, to the Father of all; look to the earth, which before supplied you with nourishment; look to your brothers, who seek their companion; look to your mother, I who gave you milk. Pay back the reward of loving blood: do not be torn from your brothers, do not be torn from your mother. Temporal are the riches that Antiochus promises, temporal the honours: everlasting is the crown which is conferred by almighty God. The Lord gave you to me as the lights of seven days; I have now closed the sixth day, and the works of all are very good. You owe it to me, son, that I, who laboured in those six, may rest in you on the seventh, as one now keeping holiday from the works of the world.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
