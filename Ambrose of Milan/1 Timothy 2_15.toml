[[commentary]]
quote='''
The servitude existed formerly, in fact, but in a condition of disobedience which was to be later made salutary by the generation of children in faith and love and holiness with modesty. What was certainly among the fathers a generation brought into existence in sin shall become salutary in the children, so that what was a stumbling block to the Jews shall in the society of Christians undergo improvement.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 14"
