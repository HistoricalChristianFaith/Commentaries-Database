[[commentary]]
quote='''
For relationship does not make a neighbour, but compassion, for compassion is according to nature. For nothing is so natural as to assist one who shares our nature.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Therefore, since no one is more a neighbor than he who healed our wounds, let us love him as Lord, let us love him also as neighbor; for nothing is so near as the head to the members. Let us love also him who is an imitator of Christ, let us love him who suffers with another's need through the unity of the body. For it is not kinship that makes a neighbor but mercy, because mercy is according to nature; for nothing is so much according to nature as to help one who shares our nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
