[[commentary]]
quote='''
In another place, a grain of mustard seed is introduced where it is compared to faith. If then the mustard seed is the kingdom of God, and faith is as the grain of mustard seed; faith is truly the kingdom of heaven, which is within us. (Luke 17:21.) A grain of mustard seed is indeed a mean and trifling thing, but as soon as it is crushed, it pours forth its power. And faith at first seems simple, but when it is buffeted by adversity, pours forth the grace of its virtue. The martyrs are grains of mustard seed. They have about them the sweet odour of faith, but it is hidden. Persecution comes; they are smitten by the sword; and to the farthest boundaries of the whole world they have scattered the seeds of their martyrdom. The Lord Himself also is a grain of mustard seed; He wished to be bruised that we might see that we are a sweet savour of Christ. (2 Cor. 2:15.) He wishes to be sown as a grain of mustard seed, which when a man takes he puts it into his garden. For Christ was taken and buried in a garden, where also He rose again and became a tree, as it follows, And it waxed into a great tree. For our Lord is a grain when He is buried in the earth, a tree when He is lifted up into the heaven. He is also a tree overshadowing the world, as it follows, And the fowls of the air rested in his branches; that is, the heavenly powers and they whoever (for their spiritual deeds) have been thought worthy to fly forth. Peter is a branch, Paul is a branch, into whose arms, by certain hidden ways of disputation, we who were a far off now fly, having taken up the wings of the virtues. Sow then Christ in thy garden; a garden is truly a place full of flowers, wherein the grace of thy work may blossom, and the manifold odour of thy different virtues be breathed forth. Wherever is the fruit of the seed, there is Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
To what is the kingdom of God like, and to what shall I reckon it to be like? It is like a grain of mustard, which a man took and cast into his garden, and it grew and became a tree, and the birds of the sky rested in its branches.

The present reading teaches us that the nature of comparisons is to be looked at, not their appearance. So let us see why the lofty kingdom of heaven is compared to a grain of mustard; for I remember that in another place too a grain of mustard is read, where it is compared to faith, the Lord saying: if you have faith like a grain of mustard, you will say to this mountain: be lifted up and cast into the sea. And this faith is not slight but great, which can command a mountain to remove itself; for the Lord does not require a middling faith of the apostles, who, he knows, must contend against the height of spiritual wickedness that exalts itself. Do you wish to know that great faith is required? Read in the Apostle: and if I have all faith, so that I move mountains.

So if the kingdom of heaven is like a grain of mustard and faith is like a grain of mustard, faith surely is the kingdom of heaven and the kingdom of heaven is faith. So he who has faith has the kingdom of heaven, and the kingdom is within us and faith is within us; for we read: the kingdom of God is within you; and elsewhere: have faith in yourselves. Indeed Peter, who had all faith, received the keys of the kingdom of heaven, that he might open it to others also.

Now let us consider, from the nature of mustard, what the force of the comparison is. Its grain is certainly a cheap and simple thing: if it begins to be ground, it pours out its strength. Faith too at first seems simple, but if it is ground by adversities, it pours out the grace of its power, so as to fill others too, who either hear or read, with its odor. Our martyrs Felix, Nabor and Victor are a grain of mustard: they had the odor of faith, but they lay hidden. Persecution came, they laid down their arms, they bent their necks, and, crushed by the sword, they spread the grace of their martyrdom through the bounds of the whole world, so that it may rightly be said: their sound has gone out into all the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
