[[commentary]]
quote='''
Yet the same soul, knowing that she has been darkened by her fellowship with the body, says to other souls, or to those heavenly powers appointed to the sacred ministry: do not look at me, for I have been darkened, for the sun has not looked upon me. The sons of my mother have fought against me, that is, the passions of the body have assailed me, the allurements of the flesh have discoloured me; therefore the sun of justice has not shone upon me. Bereft of this protection, I have not been able to keep my devotion and my observance whole. For this is the meaning of: my vineyard I have not kept, because I brought forth thorns and not grapes, that is, producing sins instead of fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
The sons of my mother have fought against me; that is, the passions of the body have assailed me, the allurements of the flesh have discoloured me: therefore the sun of justice has not shone upon me, because, bereft of protection, I could not keep my devotion and full observance; for this is: I have not kept my vineyard, because I brought forth thorns and not grapes, that is, committing sins instead of fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
They have set me as keeper in the vineyards; my own vineyard I have not kept. Some think that this is said of those who bind the Synagogue to the precepts of the Law, that she should keep the Law and guard her vineyard, which she could not keep. Thus she guarded it that it might yield grapes, but it yielded thorns. What the vineyard is, then, David comes to testify to us, saying: You have brought a vineyard out of Egypt, and you have cast out the nations and planted it (Ps. 79 (80):9). The sons of her mother can also be the apostles, who truly fought against the Synagogue, saying: Behold, we turn to the Gentiles: and they began to sow the word of God among the nations. The prophets too can be understood, who, by warning and announcing that the Synagogue should keep her vineyard, achieved nothing; for she, who ought to have borne rich fruits of virtue, made thorns of wickedness: and therefore she confesses that she could not keep her people, and rightly seeks late to hold him whom she lost when she held him: far unlike her who says: I found him whom my soul loves, I held him, and I will not let him go (Song 3:4).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
