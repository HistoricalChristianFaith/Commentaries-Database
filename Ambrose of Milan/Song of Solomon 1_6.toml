[[commentary]]
quote='''
Yet the same soul, knowing that she has been darkened by her fellowship with the body, says to other souls, or to those heavenly powers appointed to the sacred ministry: do not look at me, for I have been darkened, for the sun has not looked upon me. The sons of my mother have fought against me, that is, the passions of the body have assailed me, the allurements of the flesh have discoloured me; therefore the sun of justice has not shone upon me. Bereft of this protection, I have not been able to keep my devotion and my observance whole. For this is the meaning of: my vineyard I have not kept, because I brought forth thorns and not grapes, that is, producing sins instead of fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
