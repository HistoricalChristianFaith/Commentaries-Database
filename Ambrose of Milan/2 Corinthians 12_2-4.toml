[[commentary]]
quote='''
Hence the just are caught up into Paradise, just as Paul was caught up into paradise and heard secret words that man may not repeat. And if by the vigor of your mind you are caught up from the first heaven to the second and from the second heaven to the third, we can explain it in this way. Each and every man is first of all corporeal; secondly, he is of a sensual nature; and thirdly, he is spiritual in that he is carried to the third heaven to behold the brilliance of spiritual grace. The sensual man does not perceive the things that are of the Spirit. For that reason the ascent into the third heaven is necessary for him in order that he may be caught up into Paradise. At this stage, without incurring danger, you will be caught up, in order that you may be able to pass judgment on all things, because the spiritual man judges all things and he himself is judged by no man. Perchance, although still infirm, you will hear secret words that man may not repeat. Forbear to reveal anything and keep in your heart what you shall hear. Paul the Apostle kept these words in his heart lest he fall and for a certainty lead others into sin. Or perhaps Paul used the words that man may not repeat because he was still in the body, that is to say, because he saw the passions of this body of ours and because he saw the law of his flesh warring against the law of his mind. I prefer to take the meaning in this sense, lest the question of future danger should seem to be disregarded. That would imply freedom during our lifetime from the anxiety and dread of snares which might lead to sin in the future. Whoever, therefore, shall reach upward into Paradise by the exercise of virtue will hear those hidden and secret words of God. He shall hear, too, the Lord speaking as to the repentant thief who abandoned his life of thievery for one of faith: This day thou shalt be with me in paradise.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 11"

[[commentary]]
quote='''
Indeed she says: the king has brought me into his chamber. Blessed is every soul that enters the inner places. For, rising up from the body, she becomes more remote from all things, and within herself she searches and seeks whether she can in any way follow after that divine being. And when she has been able to grasp it, having passed beyond the things that are intelligible, she is established in it and is fed by it. Such was Paul, who knew that he had been caught up into paradise, but did not know whether he had been caught up outside the body or caught up in the body. For his soul had risen up from the body and had withdrawn and lifted itself away from the entrails and bonds of the flesh, and, having become a stranger to himself, he held within himself the unspeakable words which he heard, and could not make them public, because he perceived that it is not lawful for a man to speak them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Blessed is the soul that enters the inner recesses of the Word, for, rising up from the body, she becomes more remote from all things; and she searches and seeks that which is above itself, that divine thing, if in any way she can attain it: and when she has been able to lay hold of it, having passed beyond the things that are intelligible, she is established in it and is fed by it. Such was Paul, who knew that he had been caught up into paradise, but did not know whether it was out of the body or in the body. For his soul had risen up from the body, and had withdrawn and lifted herself from the inward parts and bonds of the flesh, and, become a stranger to himself, he kept within himself the ineffable words which he heard and could not divulge, which he perceived it is not lawful for a man to speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
