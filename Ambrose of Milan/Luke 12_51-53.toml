[[commentary]]
quote='''
Do you think that I came to give peace on the earth? No, I tell you, but separation. For from now on there will be five in one house divided, three against two and two against three will be divided. Father against son and son against father will be divided, mother against daughter and daughter against mother, mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.

While in almost all passages of the Gospel the spiritual understanding is at work, it is so most of all in the present one: lest the harshness of a bare exposition offend anyone, the course of the sense must be tempered by spiritual depth, especially since our most holy religion, by moral disciplines and gentle examples of devotion, graciously invites even those exiled from faith to reverence for itself, so that discipline, going before faith, may by its gentleness dissolve the hardness of superstitions, and may compel minds subject to errors to believe also by faith, which it was able to soothe by devotion. For when the deep things of faith are not grasped by weak hearts, the things that are to be venerated are judged through the things that are commanded, so that just things from the Just One, holy things from the Holy One, may bear witness that the author of their goods is good.

Shall we then suppose that the Lord, who at once embraced in his counsel reverence for the divinity and the grace of dutiful love, saying: you shall love the Lord your God and you shall love your neighbor, has now so changed as to abolish the names of kinship and to dash the affections of dutiful love? Are we to believe that he commanded separations from our dearest ones? And how is he himself our peace, who has made both one? How does he himself say: my peace I give you, my peace I leave you, if he came to separate parents from children and children from parents by severing the bond of kinship? How is cursed he who does not honor his father, and religious he who deserts him?

But if we observe that the first cause is that of religion, the second that of dutiful love, we shall consider this question also untangled; for you must place human things after divine ones. For if duty is to be shown to parents, how much more to the author of parents, to whom you owe thanks even for your parents! Or if they do not acknowledge the Parent at all, how are you to acknowledge them? He does not say, then, that we must renounce our dear ones, but that God must be preferred to all. Indeed you have in another book: he who loves father or mother more than me is not worthy of me. You are forbidden not to love your parents, but to prefer them to God; for the dear ones of nature are benefits of the Lord, and no one ought to love the benefit he has received more than God, by whom the benefit received is preserved. So even according to the letter a religious exposition is not lacking for those who understand with devotion; yet there lies beneath it something for which we may think this sense should be referred higher, since he added:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
