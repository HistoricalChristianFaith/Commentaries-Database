[[commentary]]
quote='''
Since, then, God is a refuge, and God is in heaven and above the heavens, surely we must flee from here to there, where there is peace, where there is rest from works, where we may feast on the great sabbath, as Moses said: And the sabbaths of the land shall be food for you. For it is a banquet, full of joyfulness and tranquillity, to rest in God and to see his delight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
