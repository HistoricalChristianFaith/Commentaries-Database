[[commentary]]
quote='''
Abraham had grown old. Therefore, as befits a good father, he had to provide a wife for his son, but because of God's oracle he could not return to the place from which he had been commanded to go out. He was living, however, in the land of the Canaanites, and he shrank from seeking his lawful succession from that race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
