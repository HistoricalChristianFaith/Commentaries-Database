[[commentary]]
quote='''
But does anyone deny that the Godhead of the eternal Trinity is to be adored, when the Scriptures also set forth the inexplicable majesty of the divine Trinity, as the apostle says elsewhere: "For the God who commanded the light to shine out of darkness has shined in our hearts, to give the light of the knowledge of the glory of God, in the face of Christ Jesus?" … Who is it, then, who shined that we might know God in the face of Christ Jesus? For he said: "God shined," that the glory of God might be known in the face of Jesus Christ. Who else do we think but the Spirit who was made manifest? Or who else is it but the Holy Spirit, to whom the power of the Godhead is referred? For those who exclude the Spirit must introduce another to receive with the Father and the Son the glory of the Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25203.html'
source_title="On the Holy Spirit 3.12.86. 88"

[[commentary]]
quote='''
For if the face of man shines more than the other parts of the limbs, and whomever we look upon we either come to know if he is unknown or recognize if he is known, he whom our gaze does not suffer to lie hidden, how much more does the face of God enlighten him upon whom it looks! On this, as with the rest of his sayings, so this too is splendid, from the holy Apostle, who is truly the interpreter of Christ, so that he might pour him into our minds with apter sense and speech. Hence he says: For God, who said that light should shine out of darkness, has shone in our hearts to the enlightenment of the knowledge of the brightness of the Lord in the face of Christ Jesus. We have heard, then, where Christ shines in us. For he is the eternal brightness of souls, whom the Father sent to earth for this purpose, that, enlightened in his face, we who before were held in earthly darkness might be able to behold eternal and heavenly things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
