[[commentary]]
quote='''
He, then, who presumes not on his own arm, that is, on his own working, but on the grace of God, believing that it is not their own deeds that justify each man but a ready faith, says to the Lord: You are yourself my king and my God, who command the salvations of Jacob. It is no perfunctory word, that you should say: You are yourself my king. Not just anyone says this, but he in whom is the kingdom of God; and in whom God reigns, surely in him sins do not reign; for God's kingdom has nothing in common with crime. And who calls God his own, except him who shows him a disposition full of reverence and devotion? For to the righteous man it is said: I am your God. Indeed Thomas too, when he touched the side of Christ with his own hand and found the evident signs of an undoubted resurrection, answered: My Lord and my God: Lord, because he redeemed his little servants; God, because he not only rose again, but also raised himself up. And he commanded the salvations of Jacob, because in each of the oracles there is salvation, in each of the mansions too there is salvation, salvation in the ministries of the angels who are appointed for the protection of men. Salvation, then, is conferred on man by the command of God, not by his own working. For God preferred that salvation should be sought by man by faith rather than by works, lest anyone should glory in his own deeds and incur sin. But he who glories in the Lord acquires the fruit of devotion and escapes the crime of boasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
