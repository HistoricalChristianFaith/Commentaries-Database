[[commentary]]
quote='''
Nor again let us follow vain and empty things, lest we be judged to weave a spider's web, since sins can have no substance of perpetuity. Hence, when you see some eager to enlarge their resources, to heap up powers, to strive after splendour, you will say that word of Isaiah: These men weave a spider's web in all things of one day, which cannot be lasting, but is quickly torn apart, and all its work is undone; for it is not set upon any solid foundation, but is hung in the void. Nothing slack, nothing soft befits the true soldier of Christ; behold, indeed, those who are clothed in soft garments are in the houses of kings. All the avaricious seem to themselves clever and industrious. What is cleverer, what more diligent than the spider, which always attends to its work day and night and makes a garment at no cost and no expense? But all that it has made is vain. So is every man who does not set his work on the foundation of Christ; vainly, night and day, he too is troubled, since often, like the spider, the ruin of his own work entangles him even in the very effort of his wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
