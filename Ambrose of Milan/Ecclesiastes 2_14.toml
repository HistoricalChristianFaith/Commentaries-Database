[[commentary]]
quote='''
First, let us make note of the fact that the body of man is constructed like the world itself. As the sky is pre-eminent over air, earth, and sea, which serve as members of the world, so we observe that the head has a position above the other members of our body. In the same way, the sky stands supreme among the other elements, just as a citadel amid the other outposts in a city’s defense. In this citadel dwells what might be called regal Wisdom, as stated in the words of the Prophet: ‘The eyes of a wise man are in his head.’ That is to say, this position is better protected than the others and from it strength and prevision are brought to bear on all the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
Wisdom is in the head, action in the hands; for the eyes of the wise man are in his head, because he is truly wise whose mind is in Christ and whose inner eye is raised to the things above. And therefore the eyes of the wise man are in his head, but those of the fool in his heel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
