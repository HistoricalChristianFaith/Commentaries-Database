[[commentary]]
quote='''
Gold is in the mines, silver is in the mines: it is dug out of the mine and returns into the mine. For what else is the mind of the miser but a mine? It keeps whatever it has received as if buried, and hides it in the veins and hiding places of the earth, because it does not know how to use it. Every day gold is brought out of the mines: who has ever been able to bring anything out of a miser?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
