[[commentary]]
quote='''
For by the thigh we recognize the emblem of generation, according to that saying: Gird your sword upon your thigh, O most mighty (Ps. 44 (45):4): by which it is signified that the Son of God, when he had emptied himself, girded with the divinity of the Word and shod with human generation, would come forth from the Virgin to give salvation to all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
