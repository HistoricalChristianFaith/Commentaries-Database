[[commentary]]
quote='''
He is the Lord who seals and numbers the multitude of the stars: he it is who alone stretches out the heaven, who walked as on a pavement upon the sea, when Peter saw him walking and said: Lord, bid me come to you upon the waters. And the Lord bade him, but he faltered, and had the Lord not stretched out his right hand to him, he would have sunk beneath the waves and perished. The flesh faltered, the right hand saved. And he said to him: O you of little faith, why did you doubt? It was faith, then, that walked in the apostle, not the flesh. In fact, faith faltered, and the flesh had begun to feel shipwreck.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 5"
