[[commentary]]
quote='''
Not without purpose did one call it a new tomb, another the tomb of Joseph. Christ, then, did not have a tomb of his own. For a tomb is prepared for those who are under the law of death; the victor over death does not have a tomb of his own. For what fellowship has a tomb with God? Indeed Ecclesiastes says of him who meditates on good things: And there is no burial for him. The death of Christ, then, is special, beyond the common death of all, and therefore he is not buried with others, but is shut alone in a tomb; for the Incarnation of the Lord had all things in the likeness of men, but the likeness is with a difference of nature: from a virgin, with likeness of birth, with unlikeness of conception. He healed the sick, but he commanded. John baptized with water, he with the Spirit. And so the death of Christ is common according to the nature of the body, special according to its power.

But who is Joseph, in whose tomb he is laid? Surely that righteous man. Well, therefore, is Christ entrusted to the tomb of a righteous man, that the Son of Man may have where to lay his head and may rest in the dwelling of righteousness. And well in a new one: according to the letter, indeed, lest it be said by the unbelieving that another had been raised; but in the mystical sense what can we understand, unless perhaps because we read: Their throat is an open sepulchre? An open sepulchre, then, is the throat of man, in which deadly unbelief and dead words are buried, which through age and some incursion of beasts crumbles and falls apart. There is, then, on the contrary, a tomb in the secret places of men, which the righteous man has hewn out for himself with the penetrating Word in hearts of Gentile hardness, polished by the works of faith and doctrine, that the power of Christ might reach out among the nations.

To it, most beautifully, a stone was rolled, that it might not stand open; for whoever has buried Christ well within himself, let him guard him diligently, lest he lose him, or lest there be an entrance for unbelief. For you see that Peter and John were found worthy to enter first. Indeed John himself did not go in before he believed.

And well is it said to have been hewn in rock, that is, in the firmness of faith, from which the true Israelites have sucked the sweetness of honey and the spiritual oil. For the righteous man and he who saw God buried Christ; for none bury Christ except those who believe God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
