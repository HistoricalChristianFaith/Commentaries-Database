[[commentary]]
quote='''
And therefore he says: for I will not hope in my bow, and my sword will not save me, although we must hope in a bow, but in the bow of God which he set in the cloud, so that the human race might cease to fear a flood. With this bow he protects us, the bow with which he also shoots the arrows with which he strikes our enemies and adversaries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
