[[commentary]]
quote='''
For all things that are of the world remain in the world, and whatever is gathered for heirs passes away from us; for those things are not ours which we cannot take away with us. Virtue alone is the companion of the dead, mercy alone follows us, which, as guide and forerunner to the heavenly dwellings, acquires eternal tabernacles for the dead through the use of cheap money, as the precepts of the Lord testify, who says to us: make for yourselves friends of the unrighteous mammon, that they may receive you into their eternal tabernacles. Good therefore and salutary and fitting is the precept, which could rouse even the avaricious, so that they may be eager to exchange corruptible things for everlasting, earthly things for divine. But since the devotion of faith is often called back by weakness, and those ready to bestow their patrimony are drawn back by thought of their own livelihood, for this reason the Lord added, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
