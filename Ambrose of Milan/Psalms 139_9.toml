[[commentary]]
quote='''
But perhaps you will say: How then does he say here that flight has perished from him, who had said earlier: If I take my wings before the dawn? Is this a contradiction? Far from it. For many are the contests of the just. Does an athlete wrestle only once? How often, after many crowns, is he defeated in another contest! How often does he who has often conquered at times waver and stick fast in uncertainty! And it often happens that a strong man engages with strong men, and greater contests arise, where there are greater proofs of strength. So David, when he was seeking flight to get away from the adversary and was not finding his wings, was wavering in a doubtful contest; since, where he has his wings in his power, the title of the psalm is Unto the end, that is, to the perfection and consummation of victory. Indeed, as a victor he says: Lord, you have proved me and you have known me. You have known my sitting down and my rising again. Rightly did he have the faculty of flying who had received the wings of rising again; but this one is still in the cave, that is, in the flesh, in a kind of cavern of this body, contending with King Saul, the son of hardness, and with the power of that intelligible prince who is not seen but is understood. Hence also the title of the psalm is Understanding; yet David, though placed in the flesh, hemmed him in, but he earned the power to hem him in by praying. Indeed he began with the voice of prayer.

Add this too, that that psalm is said in the person of the Saviour, this one in the person of David, who did not have victory in his power but hoped for it from Christ. And yet he too, after he had spread out his hands to God like the wings of his soul, and had taken refuge in the Lord, and had asked for the guidance of the Holy Spirit, so that he might know the way by which he could ascend, saw the heavens bowed so that Christ might descend, and asked that he would lift him up with his hand. Or perhaps he no longer sought his own wings for this reason, that, having become more perfect, he longed for the hand of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
