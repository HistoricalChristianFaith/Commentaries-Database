[[commentary]]
quote='''
Therefore he received the robe of his brother, because he excelled in the wisdom of age; therefore the younger brother stripped the elder brother, because he shone forth in the dignity of faith. This robe Rebekah, as a type of the Church, brought out and gave to her younger son: the robe of the Old Testament, the prophetic and priestly robe, that royal robe of David, the robe of Solomon, of the kings Hezekiah and Josiah; and she gave it to the Christian people, who would know how to use the garment they had received, since the Jewish people had it without using it and did not know their own adornments. This robe lay in the shadow, laid by and neglected; for it was obscured by the dark gloom of ungodliness and could not be unfolded more widely in the narrow heart of the people. The Christian people put it on, and it shone. They illumined it with the brightness of their faith and the light of devout deeds. Isaac knew the familiar smell of his own race, he recognized the robe of the ancient Scripture, but he did not recognize the voice of the ancient people, and therefore he knew that it had been changed. For the same robe remains even today, but the confession of a more devoted people has begun to ring with song, and rightly he said: the voice indeed is the voice of Jacob, but the hands are the hands of Esau. And he smelled the smell of his garments. And perhaps this is because we are justified not by works but by faith, since the weakness of the flesh is an obstacle to works, but the brightness of faith, which merits the pardon of offences, overshadows the error of deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 2"
