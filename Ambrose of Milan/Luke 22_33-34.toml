[[commentary]]
quote='''
But Peter, although ready in spirit, yet still weak in the affection of the body, is told beforehand that he will deny the Lord; for he could not equal the constancy of the divine purpose. The Passion of the Lord has rivals; it has no equals. So I do not reproach him for denying; I praise him for weeping. The one belongs to the common condition, the other is peculiar to virtue. And therefore he is instructed to take care, not compelled to deny.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
