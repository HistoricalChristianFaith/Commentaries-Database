[[commentary]]
quote='''
I am no longer worthy to be called your son; for he who has been cast down ought not to exalt himself, so that by the merit of his humility he may be lifted up.

Make me as one of your hired servants. He knows that there is a difference between sons, friends, hired servants, slaves. A son through the washing, a friend through virtue, a hired servant through labor, a slave through fear. But even from slaves and hired servants friends are made, according to what is written: you are my friends, if you do what I command you; I no longer call you slaves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
