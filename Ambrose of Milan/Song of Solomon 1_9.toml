[[commentary]]
quote='''
To my mare among the chariots of Pharaoh I have likened you, my nearest one. In this, while the likeness of the Church seems to be compared to the running of swift horses, her rich grace is esteemed. Do not, then, understand one mare of a rich king, but the word used absolutely for the cavalry, as we have often said, as "his sheep" is said for a flock of sheep. Pharaoh, then, as a most powerful and very rich king, had powerful horses; whence Scripture too says: The chariots of Pharaoh (Exod. 14:9), as a most powerful kind for the use of wars and a support in fighting: thus with these chariots Pharaoh easily overtook the fleeing Hebrews. Just as, then, horses yoked together easily draw a chariot, and patiently take the yoke, and carry it with grace, and grow gentle by taking up that yoke: so too the congregation of the nations, untamed in its Gentile ways, used formerly to toss itself about. But when it took up the yoke of him who says: Take my yoke upon you, for it is light; and my burden, for it is sweet (Matt. 11:29 and 30); and the bride of Christ began to be exalted by the concord and gentleness of the peoples, and to be carried around the whole world, like a chariot with swift horses she was caught up above the world and ascended to the bridegroom.

For Christ has his horses, of which the prophet says: You sent your horses into the sea, troubling many waters (Hab. 3); because the apostles, by preaching the Gospel, stirred up the peoples of the Gentiles, who are moved like many waters and are roused into waves of waters, so that, rising up from the earthly ceremonies of idols, they might believe in Christ. And above he says: You mounted your horses, your cavalry is health. O wonderful team of twelve good horses, whose bridles are of peace, whose reins are of love: bound to one another by the bonds of concord, and subject to the yoke of faith, carrying on four wheels the mystery of the Gospel to the ends of the whole world, bearing the good charioteer, the Word of God: by whose whip the allurements of the world have been put to flight, the prince of this world cast out, the course of the just fulfilled. O great contest of rational horses! O wonderful mystery! A wheel ran within a wheel and was not hindered, the New Testament in the Old Testament; it ran within that by which it was announced. The wheels went in four directions, and did not turn back; because the spirit of life was in them, which ran into the four parts of the whole world: and it ran without stumbling, because the good life of the horses squared with it. The horses, then, ran, because he who had mounted the horses did not sleep.

Jesus, then, is the charioteer of our souls; he wishes us too to mount our horses, that is, our bodies, and always to keep watch, lest it be said to us: Those who mounted horses have slumbered (Ps. 75 (76):7). This sea must be crossed without sloth; it is scarcely crossed even by those who keep watch. But if anyone sleeps, he will not be able to cross, but is sunk, like the Egyptian, whose soul and body both perished. For The horse indeed and its rider he has thrown into the sea (Exod. 15:1), those who did not follow the law, but persecuted it.

To my mare among the chariots of Pharaoh I have likened you. The labour of virtue seeks victory, so that it cannot be compared to that mare which is Solomon's, swift to run, apt for bearing; since fruitfulness of the soul is desired and sought. This mare, then, is precious, and the chariots of Pharaoh swift. But in this place we have undertaken to speak of the soul, of this mare which is reckoned like this soul, that is, of prophetic or apostolic virtue: in that she is numbered in the flock of those who by the fruitfulness of their preaching have filled the spaces of the whole world. And although they were placed in the body, they suffered no loss in their spiritual course.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
