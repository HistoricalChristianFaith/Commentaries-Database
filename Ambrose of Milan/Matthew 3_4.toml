[[commentary]]
quote='''
But Saint Matthew and Mark wished to declare him a prophet by his clothing, his girdle and his food, in that he had a garment of camel's hair and a leather belt about his loins, and ate locusts and wild honey. For the forerunner of Christ did not suffer the skins of unclean beasts to perish, signifying by the very token of his clothing too that Christ would come, who, taking upon himself the sins of the unclean Gentile world, woven of bestial filth for the deformity of our merits, would strip off on that trophy of the cross the garment, as it were, of our flesh.

And what does the girding with a leather belt mean but that this flesh, which before was wont to weigh down the mind, after the coming of the Lord began to be to it not a hindrance but a girdle? For, according to David, we have hung our instruments on the willows, and, according to the Apostle, we have no confidence in the flesh and we have confidence in the body; we have none in pleasures, we have it in sufferings, so that our affection, fervent in spirit, may be strong, and we may be girded for every obedience to the heavenly precepts, intent with devotion of mind and unencumbered in the readiness of the body.

His food too is an index of his prophetic office and a messenger of the mystery. For what is so idle, as regards a man's duty, as to look for locusts, and what so full, as regards a prophet's mystery? For the more useless locusts are for fruit, the more idle for use, the more fleeting to the touch, roving in their leaping, shrill in their sound, the more fittingly is the figure of the Gentile people likened to them, a people who, with no practice of labour, with no fruit of its own work, without weight, without a voice, uttered a sound of complaint and knew not the word of life. This people, then, is the food of the prophets; for the more numerous the people gathered, the more richly the use of the prophetic mouth increases. The grace of the Church too is prefigured in the wild honey, not found within the hive of the Law as the produce of the Jewish people, but spread abroad in the fields and leaves of the forest of Gentile error, according to what was said: We found it in the fields of the forest.

And this one, indeed, ate wild honey, announcing that the peoples were to be filled with honey from the rock, as it is written: and with honey from the rock he filled them. So too the ravens fed Elijah in the desert with food brought from elsewhere and with drink gained, that it might be a sign that the peoples of the nations, foul with the dark color of their merits, who before sought their food in fetid carcasses, would now supply from themselves nourishment brought in for the prophets; for the food of the prophets is the fulfilment of the divine will, as the Lord himself declared, saying: My food is to do the will of him who sent me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
For what is fasting unless the substance and image of heaven? Fasting is the restoration of the soul, the food of the mind; fasting is the life of the angels; fasting is the death of guilt, the destruction of sins, the means of salvation, the root of grace, the foundation of chastity. By this step we come more quickly to God, by this step Elias ascended before [he ascended] in a chariot; on departing to heaven, he left this inheritance of moderate sobriety to his disciple; and in this virtue and spirit of Elias came John. Hence in the desert he also devoted himself to fasting; and his meat was locusts and wild honey. And therefore he who had surpassed the strength of human life in continence was thought not a man but an angel. Of him we read: Even more than a prophet. For this is he of whom it is written: Behold I send my angel before thy face, who shall prepare thy way before thee. Who by human power could have mounted fiery horses, fiery chariots; who could have guided aerial chariots save him who had changed the nature of the human body by virtue of incorruptible fasting?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 3"
