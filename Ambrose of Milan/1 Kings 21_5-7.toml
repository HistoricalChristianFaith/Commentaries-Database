[[commentary]]
quote='''
But why do I say that you should not put off generosity? May you not hurry to robbery! May you not extort what you covet! May you not seek what is another's! May you let pass what is denied you! May you bear patiently what is excused, and not hear that Jezabel, who is avarice, say with a loathsome flux, as it were, of vanity: "I will give thee the possession which you desire. You are sad because you wish to consider the measure of justice, so that you may not seize what is another's: I have my rights, I have my laws, I will calumniate him that I may despoil him, and, that the possession of the poor man may be seized, his life will be beaten out."

For what else is described in that story if not the avarice of the rich, which is a vain, loathsome flux, because, in the manner of a river, it carries off everything and transfers it elsewhere, bringing profit to none? This Jezabel is not one, but manifold; not of one age, but of many. She says to all, as that other said to her husband, Achab: Arise, eat bread, and return to thyself, I will give thee the vineyard of Naboth, the Jezrahelite.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 9"
