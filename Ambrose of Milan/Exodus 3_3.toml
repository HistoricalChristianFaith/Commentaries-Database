[[commentary]]
quote='''
Moses, too, passing by things of this world, saw a great sight and said, "I will turn aside and see this great sight," for had he been held by the fleeting pleasures of this world he would not have seen so great a mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Repentance%2FBook%25201.html'
source_title="Concerning Repentance 1.14.74"

[[commentary]]
quote='''
Therefore Moses, seeing the bush shining and not burning, says: Passing over, I will see this great sight. He who passes over from this world sees a great sight; he who loosens the chains of this bond by which we are bound to this body sees a great sight. Moses sees many wonders in Exodus; no other who is not in an exodus sees so many. The same Moses passed over; the people of the fathers too passed over, because it was going out of the land of captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
