[[commentary]]
quote='''
You shall not cook a lamb in its mother's milk, lest it be said to you: Woe to those who are with child and to those who give suck. For Christ was born of Mary in such a way that you should acknowledge him, as the ox acknowledged its owner, and know that he himself created you and he himself possessed your forefathers. Do not nourish him as a little child, but know that he is to be adored as true and perfect God from true and perfect God. For so the magus adored him, that he did not cook a lamb in its mother's milk, but venerated him as the eternal God. Thus, to find him, he looked up at the sky; he therefore did not seek on earth him whom a star shining from heaven was pointing out.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
