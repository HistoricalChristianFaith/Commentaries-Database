[[commentary]]
quote='''
There follows: I said: Lord, have mercy on me; heal my soul, for I have sinned against you. This can be said in the person of King David, who, seeing in the spirit so great a victory and grace of Christ, asks that in that remission of all sins he may have mercy on him too, since he too, even if as a king he was not bound by human laws, yet acknowledges that he is liable to God for his sins. He confesses his sin, then, so that he may receive remission and obtain the gift of the general pardon. It can also be expressed in the person of the Savior, who asks God's mercy for us and said that he had sinned, because for us he was made sin. At the same time he teaches us, when we are set in some contest against the enemies of God, to implore the help of God, to confess our sins ourselves, and most of all then, when we are pressed hard and worn down, to prostrate ourselves with grief and bitterness, lest we seem to have kept silent, so that medicine may be brought the sooner to our wounds, and that, healed, we may resist the adversary. For how can a wounded man engage? From which we learn that we are wounded by the stings of our sins. A wound seeks a physician; the physician demands confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
