[[commentary]]
quote='''
In fact, elsewhere too it is said in the person of the sinner: and I will bear the anger of God, because I have sinned, until he justifies my judgement; for God, desiring to convert the sinner, punishes him and burns him in order to cleanse him. Hence he says: and he will lead me out into the light. For fire too burns wax: it melts so as to be purified; and we are proved through fire; and smoke, once all its material has been consumed, is purged away and does not pass beyond its nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
