[[commentary]]
quote='''
But if you hesitate, if you despise your wife's judgement and it seems hard to you, God says to you what he said to Abraham. For what he said to him he says to you, and he says it to all: let it not be hard in your sight concerning the boy and the maidservant. In all that Sarah has said to you, hear her voice, for in Isaac shall your seed be called. Nowhere else did he say 'hear the voice of your wife' except here, that is: 'you have done your wife an injury and have not soothed her feelings; you have received a son from a maidservant and have not honoured your wife's son. Can your seed be called in the son of a maidservant? Certainly not; in the lawful son is the true succession. But you fear, because he is your son, that perhaps, once cast out, he may perish and die. My grace will not fail him'. Our God feeds all, supports everyone, both the just and the unjust. Indeed he also rains upon the just and the unjust. As Abraham did, so you too do. Cast out the maidservant, so that your wife may remain at home secure and unoffended. Cast out the maidservant's son, so that he who has not the privilege of birth may not have a share in the inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
