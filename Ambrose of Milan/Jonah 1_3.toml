[[commentary]]
quote='''
I dare to say that so Jonah too fled into Tarshish, not by flight of the body but by ascent of the mind, for he ascended even to the likeness of Christ, so as to become a type of Christ. For as Jonah was in the belly of the whale three days and three nights, so he says will the Son of Man also be in the heart of the earth three days and three nights. For if he had not fled thus, he would never have been heard from the belly of the whale.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
