[[commentary]]
quote='''
Until the day breathes and the shadows decline. Zacchaeus climbed into a sycamore tree to see Christ: for us too Jesus spread out his hands, to overshadow the whole world. How are we not in shadow, who are protected by the veil of his cross? How are we not in shadow, whom the Crucified defends from the malice of the world and the heat of the body? Or do we not know that the Word of God, coming into this world, did not come as the Word, such as he was in the beginning, such as he was with God: but emptied himself, taking the form of a servant (Phil. 2:7)? He came in a light cloud, and, being the power of the Most High, he overshadowed Mary, that he might transfigure the body of our lowliness, to be made conformable to the body of his glory. As he, then, changed his form when he was born of the Virgin, so the words of God too seem to us to be transfigured when they are read in the Gospel, when their appearance is seen in the Scriptures as through a mirror; because the whole truth cannot be grasped here, but when that which is perfect has come, they shine no longer through discussion, nor through appearance, as transfigured, but in truth whole and clear.

Let him, then, bend the soul to the yoke of the Word, and guide her with his reins, so that by the will of God she may be drawn away from vices and catch the fragrance of eternal life; for this life is not perfect, but this life is in shadow. Therefore, that the man Christ Jesus might be born of the Virgin, the power of the Most High overshadowed the future mother; because he came down in shadow, beginning from shadow to work the salvation of man, and about to complete it in the brightness of the eternal sun. This life, then, is a shadow. Hasten to the sun, that it may defend you from the cold of this shadow, and pour summer warmth upon you. And therefore he counsels us to pray that our flight be not in winter or on the sabbath, not signifying a season and a day, but forbidding us to be cold in merits, and to be fasting from good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
