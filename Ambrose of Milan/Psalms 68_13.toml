[[commentary]]
quote='''
Phison, therefore, stands for prudence. Hence it has pure gold, brilliant rubies, and topaz stones. We often refer to wise discoveries as gold, as the Lord says, speaking through the Prophet: I gave to them gold and silver. Daniel says of the wise: If you sleep among the midst of the lots, you shall be as the wings of the dove covered with silver and the hinder parts of her back like to gold. In this way one who puts his trust in the aid of the Old and New Testament can by resourceful inquiry attain the inmost secrets of the Wisdom of God. Here, therefore, is found pure gold, not the metal which is melted, which belongs to this earth, and is subject to corruption.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"

[[commentary]]
quote='''
The parasites standing about, who used previously to despise you, now suddenly salute you, take you home, rouse you to merriment, incite you to spending, saying: Come therefore and let us enjoy the good things that are present and let us speedily use the creatures as in youth. Let us fill ourselves with costly wine and with ointments, and let not the flower of the time pass by us. Let us crown ourselves with roses before they be withered: let no meadow escape our riot: Let us everywhere leave tokens of our joy: For this is our portion and this is our lot. And truly their whole fortune (sors) is made, but you remain bereft (exors) of your possessions.

Not such lots (sortes) has Scripture pointed out to you, not among the midst of such lots does Holy David remind us that we should sleep, saying: If you sleep among the midst of lots; for if you had slept among the midst of those lots, that is, of the Old and the New Testament, the greed for money would never have immersed you in the whirlpool of most wicked usury, but the grace of spiritual faith would have given you silver, and would have formed you in the likeness of gold through the instruction of divine wisdom. But if we have accepted this one testimony of the divine Scripture, and have refused that luxurious banquet, certainly such a man also could have been saved if he had clung to divine wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 5"

[[commentary]]
quote='''
Let this pledge be returned in the night of this world, let him put on this garment in the darkness of this world. For this pledge is of the lot of the Lord, not of that opposite one. For we read in Leviticus that there were two lots, concerning which it is said: The one thou shalt offer to the Lord, the other for an emissary. The emissary has transferred his lot to usurers, the servants of the Lord are in the lot of Christ. Standing in this lot Aaron warded off the plague of the opposite lot, when, standing between the two divisions of the people, he prevented death from creeping from the dead into the lot of the living by the interposition of his own body. A good pledge of this lot is the covering of the Word. Let no one take this garment from you, debtors; you should pledge this garment to no one if you wish never to endure shame, so that you may sleep among the midst of lots, like Aaron, that you may sleep between the two Testaments, that you may sleep the sleep of the resurrection and may be able to restore yourselves. This is the garment, which, even if you have given it as a pledge, holy Solomon in Proverbs urges us must be recovered, saying: Take off thy garments; for an unjust man is passing by.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 20"

[[commentary]]
quote='''
But so that she might be able to come from Lebanon, he said beforehand: Arise, come, my near one, my beautiful one, my dove, my perfect one. Near, surely, by the desire of faith; beautiful by the comeliness of virtue; a dove by spiritual grace. For the wings indeed of a dove covered with silver signify that eternal power, and the flight of the dove declared the presence of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"
