[[commentary]]
quote='''
Phison, therefore, stands for prudence. Hence it has pure gold, brilliant rubies, and topaz stones. We often refer to wise discoveries as gold, as the Lord says, speaking through the Prophet: I gave to them gold and silver. Daniel says of the wise: If you sleep among the midst of the lots, you shall be as the wings of the dove covered with silver and the hinder parts of her back like to gold. In this way one who puts his trust in the aid of the Old and New Testament can by resourceful inquiry attain the inmost secrets of the Wisdom of God. Here, therefore, is found pure gold, not the metal which is melted, which belongs to this earth, and is subject to corruption.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"
