[[commentary]]
quote='''
For it is said to Moses when he was desiring to draw nearer: "Put off your shoes from your feet," how much more must we free the feet of our soul from the bonds of the body and clear our steps from all connection with this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Repentance%2FBook%25202.html'
source_title="Concerning Repentance 2.11.107"

[[commentary]]
quote='''
Pass by like Moses, that you may see the God of Abraham and of Isaac and of Jacob and that you may see a great vision. This is a great vision, but if you wish to see it, remove the sandals from your feet, remove every bond of iniquity, remove the bonds of the world, leave behind the sandals which are earthly. Likewise Jesus sent the apostles without sandals, without money, gold and silver, so that they would not carry earthly things with them. For the man who seeks the good is praised not for his sandals but for the swiftness and grace of his feet, as Scripture says, "How beautiful are the feet of those who preach the gospel of peace, of those who bring glad tidings of good things!" Therefore remove the sandals from your feet, that they may be beautiful for preaching the gospel.
'''
source_url=''
source_title="FLIGHT FROM THE WORLD 5.25"

[[commentary]]
quote='''
Such was Moses, of whom it is said: Take off the sandals from your feet (Exodus 3:5), so that he, in calling the people to the kingdom of God, might first lay aside the trappings of the flesh and walk with a naked spirit and the mark of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul 4.16"


[[commentary]]
quote='''
Stand therefore firm in your hearts, that no one overthrow you, that no one be able to make you fall. The Apostle has taught us what it is "to stand," that is what was said to Moses: "The place whereon thou standest is holy ground;" for no one stands unless he stand by faith, unless he stands fixed in the determination of his own heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FEpistle%252063.html'
source_title="Epistle 63.41"

[[commentary]]
quote='''
He looses his shoe who does not take the Church. And to Moses it is said: Loose the shoe of your feet, lest he himself should be believed to be the bridegroom of the Church. He alone did not loose it who is the true bridegroom. And therefore John says: The strap of whose shoe I am not worthy to loose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Indeed he says to Moses: loose the shoe from your feet; for the place on which you stand is holy ground. He is bidden, then, to loose the mortal and earthly shoe when he was being sent to free the people; for the minister of this task ought to fear nothing nor be held back from the duty he has undertaken by the danger of death. For he himself, when he had willingly taken up the defense of his brethren, that is, of the Jews, was called back from what he had begun by the terror of a false charge and fled from Egypt. And therefore, since the Lord had approved his affection but had seen that his condition was weak, he judged that the footstep of his soul and mind should be stripped of mortal bonds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Therefore it is said to Moses: Loose the sandal from your feet, lest he, who was being chosen as leader of the people, should be believed to be the Bridegroom of the Church. Therefore Joshua son of Nun loosed his sandal, so that he too might keep the grace of so great an office for the one who was to come. Therefore John says: After me comes a man the strap of whose sandal I am not worthy to loose; therefore he says: He who has the bride is the bridegroom; but the friend of the bridegroom, who stands and hears him, rejoices with joy, that is: He alone is the husband of the Church, he is the expectation of the nations; yielding to him the union of nuptial grace, the prophets loosed their sandals. He is the Bridegroom, I am the Bridegroom's friend: I rejoice because he has come, because I hear the nuptial voice, because I hear now no longer the harsh punishments of sinners, the harsh torments of the Law, but the remission of crimes. The voice of gladness, the sound of joy, the exultation of the wedding feast is what we hear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"
