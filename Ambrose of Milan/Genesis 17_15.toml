[[commentary]]
quote='''
To Sarai (Sara) also one letter is added, that is R, so that she was called Sarah (Sarra). And surely it is right that this, as in the earlier case, be weighed not by the addition of one letter. For God's gift is not one letter, but the virtue of the letter, which expresses the grace of the divine gift. For Sara means ἀρχὴ ἐμή, that is, my power or my sovereignty . . . . beginning or of a king . . . ., but Sarra is called in Greek ἄρχουσα, in Latin 'she who rules.' The one is mortal, the other immortal; the one specific, the other general. For there is in me prudence, in me purity, in me virtue, in me justice; they rule me alone and are lords over me, and they are mortal; for when I die they are dissolved, and they too die. But the prudence which is spoken of generally, the purity, the fortitude and the other principal virtues, principal however in a general way, and certain immortal queens: in these is the power, that immortal sovereign principle, as the Church is queen, who rules not me alone but all. So we see the species turned into the genus, the part into the whole, corruptibility into incorruptibility, all of which it is certain befit the Church; for the reason here is not specific but general, nor is it the salvation of a part but of the whole. And therefore, with these going before, when his prudence has led each one to this principal salvation, spread through all, in which is the fount of wisdom and justice, there is sought a generation and that offspring of perfect joy whose name is Isaac; for no pleasure is better than the grace of an amended conscience. From this the Epicureans drew their view that pleasure is the highest good, but they reckoned it by the defilement of the body rather than by the sobriety of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
