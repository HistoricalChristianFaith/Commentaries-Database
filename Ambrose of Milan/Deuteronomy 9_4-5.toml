[[commentary]]
quote='''
The man who justifies himself, lest he be puffed up with the swelling of his heart, has hearkened also to the salutary mandate of the oracle: Say not in thy heart, when the Lord thy God shall bring to destruction those nations in thy sight: Because of my justice hath the Lord brought me in to possess this land, whereas the Lord will destroy these nations before thy face for their wickedness. It is not for thy justices nor the uprightness of thy heart that thou hast gone in to possess that land, but because of the wickedness of the nations, the Lord will destroy them from thy sight and will accomplish his testament which he promised by oath to thy fathers. The testament referred to is the perfect grace of God. God gives nothing that is imperfect. Perfect is virtue and perfect, too, the works of virtue. This testament is one which brings with it a legacy of what is good. Rightly, too, is this testament called divine, because what is really and truly good is bestowed on us and granted to us by celestial mandate. And the testament referred to is one that is old in type but new in truth, because it is sealed in blood. By this testament we hold the pledge of divine grace: For God so loved this world that he delivered his only Son for us all. Wherefore the words of the Apostle point to the perfection of grace: How can he fail to grant us also all things with him?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 7"
