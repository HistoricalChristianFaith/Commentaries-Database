[[commentary]]
quote='''
And who is it who took a wife from the Gentiles, except him who gathered the Church to himself from the nations, and received from her a son, Manasseh, through whom he forgot all his sorrows, which he had because of the sacrileges of the Jews? He received another son also, Ephraim, through whose progress it became clear that the humility taken on in the flesh both did not humble his divinity and heaped up his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
