[[commentary]]
quote='''
Mindful of these things he says I poured out my soul upon myself. The holy man gathers himself in from the things that are outside and pours out his soul over himself, so that the soul, poured out over the body, may hide the weakness of the flesh, cover the appetite of the body, and the virtue of the soul and the mind may stretch forth everywhere. Hence also in later verses he says: I will pour out my prayer in his sight. Where prayer is poured out, there sins are covered. But of what things does he say he is mindful? Of those, surely, which he desired: that he might come and appear in the sight of God, that he might see that eternal court of his, in which he walked about in spirit and took delight in an entrance anticipated.

For I shall go in he says into the place of the wonderful tabernacle, even to the house of God, with the voice of exultation and praise, the sound of one feasting. Not undeservedly did he weep, because he was dwelling on earth, he to whom heavenly tabernacles were owed and whom entrance into the court of the Mighty One awaited. In short, he preferred that court alone to all the riches of his kingdom, as he himself testified elsewhere, saying: One thing I have asked of the Lord, this will I seek: that I may dwell in the house of the Lord all the days of my life, and that I may see the delight of the Lord. The delight of the Lord is in the Church. The Church is the image of heavenly things; for after the shadow passed, the image succeeded. The shadow is the synagogue: in the shadow is the Law, in the Gospel the truth. Therefore in the light of the Gospel the image of the truth shines out. The prophet therefore wept because good things full of grace and filled with joy were being delayed.

In short, in later verses too he says: Woe is me, that my sojourning is prolonged! And therefore he interrogated the Lord, because he was hastening to better things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapters 2-3"
