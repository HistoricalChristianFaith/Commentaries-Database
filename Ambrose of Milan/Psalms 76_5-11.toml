[[commentary]]
quote='''
Or at least, if it pleases, let us so interpret: that he said that the rich have slept their sleep; that he uttered first the rebukes of the Lord upon them; that he then spoke of his terror and praised the power of Him whom not even the rich can resist. Turning to all he says: "Let the rich fall asleep, let the rich be rebuked, Pray ye, and pay to the Lord your God, all that are round about him bring presents, that is give thanks, O poor men, that God is not a respecter of persons." Let them amass riches, hoard money, and pile up treasures of gold and silver; you pray, who have nothing else; you pray, who have this alone that is more precious than gold and silver. Return gifts, you who depart not from the Lord, and are round about Him, since you who were afar off have been made nigh. But they who seem to themselves to be nigh through their riches and power are afar off on account of their avarice. For no one is without, unless he whom sin shuts out, as it cast out Adam from paradise and shut out Eve; no one is afar off unless he whom his own crimes keep removed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 16"
