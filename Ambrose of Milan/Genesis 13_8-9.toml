[[commentary]]
quote='''
This disposition holy Abraham desired to keep. And so, as a peaceable man, he first says: Let there be no quarrel between me and you. Then he says: and between my shepherds and between your shepherds. Third he set down: Behold he says the whole land is before you, that is: if it cannot be agreed, I yield everything; take the whole, if the dissension is about place or possession. But if there is no agreement in ways of life, depart from me. How much he put first, so as not to be forced to part! But this too belongs to virtue and discipline. For a man who came from the discipline of philosophy said before us that these four things are in a good man: first, that he labour to make all men his friends; second, that, if he cannot make them friends, at least he make no enemies; third, that, if not even that is within his reach, he depart with this resolve; but if anyone pursues him as he yields, let him avenge himself as he can. But those three earlier ones we recognize in Abraham, not in bare words but in true works.

But the fourth is not so, since even toward the one who withdrew he kept a kinsman's affection, so that he not only did not pursue him but even rescued and freed him when he was taken captive. Then the Apostle, while he teaches those three, by his precepts does away with the fourth, which philosophy had added. For he says, when he wished to shape the peaceable people of God: If it can be, as far as lies in you, having peace with all men; then, if this cannot be, at least neither discords nor enmities. And therefore he added: Not avenging yourselves, dearly beloved, in which that fourth too is excluded. Let us by no means wish to avenge ourselves; but give he says place to wrath. You have the third also, that you should rather withdraw and commit vengeance to God than exact it for yourself; although he wished this too to seem said rather according to the Law; for according to the Gospel you have above: Bless those who persecute you. You have these precepts to Timothy in the second epistle. For which cause he says I admonish you to stir up the grace of God which is in you through the laying on of my hands. For God has not given us a spirit of fear, but of power and of love and of sobriety. And again: But you, my dearest son, take strength in grace. You have, then, the precept of the first maxim, that he should bestow grace upon all; then, if he cannot win all by his precepts, that he beware lest he exasperate some by words, that is, lest he make enemies. Hence he says below: These things I bring to your mind, testifying before God: do not contend with words; it is useful for nothing but the subversion of the hearers. But the servant of the Lord must not quarrel, but be gentle toward all. Finely, a little after, he added and supplied the reason, which philosophy did not see: With modesty he says teaching those who resist, in case God should at some time give them repentance to know the truth. That third also, that we should withdraw from those with whom we cannot agree, you have added, when he commands him to speak the things that befit sound doctrine, then to turn aside from the battles of the Law, that is, first to sow grace, then to turn no one away by quarrelling, third that he avoid a heretical man after one correction. For he who is such is subverted and sins, since he is condemned by himself. How shrewdly he withdraws from our vengeance one condemned by his own judgement, as unworthy to be avenged upon! But David plainly removes the zeal for vengeance, saying: If I have repaid evils to those who repaid me.

So the mind of the wise man strives to correct the lapses or the irrational motions of the same soul and to join them to itself. For it can happen that things which at times displease are amended with grace. Squandering of patrimony, if it is cut back, has liberality without loss. Modesty is at times too slack; if it is strengthened, it has both the grace of a sense of shame and constancy of purpose. Agitation, if it is tempered, lays aside the harshness of indignation and takes on the praise of vigour. But if the mind cannot amend, let it not exasperate intemperance. He who has detected the ardour of lust, let him restrain it by marriage, lest, while continence is sought, unchastity creep in. And therefore the good teacher: I say he says to the unmarried and to widows: it is good for them if they so remain, even as I. But if they do not contain themselves, let them marry; for it is better to marry than to burn. There are some women left destitute by the untimely death of their husbands, and they cannot contain themselves: I will he says that the younger ones marry, bear children, be mothers of families, give no occasion to the adversary. But if delights please some, and they wish to grow wanton in Christ, affecting the glory of widowhood but not guarding its gravity, he judges that they are to be avoided, as you have it written: But avoid the younger widows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
