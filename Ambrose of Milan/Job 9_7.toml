[[commentary]]
quote='''
How then do they excuse themselves as not having known, when some of them saw, and others learned, that the sun, before the course of the day was complete, withdrew itself and again, before the space of the night was finished, came forth, and made night in the day, and day in the night? Surely they ought to have understood that the sun withdrew at a command and came forth at a command. For the Lord had foretold that he would be in the heart of the earth three days and three nights: the sun learned this, it kept the precept. So it was in doubt, saying: What am I to do? I rise, and it is day; I set, and it is night. If I keep my course, I shall delay the salvation of the world. Let us hasten to our own redemption too: I too must hasten to the new life; for by the benefit of the cross, by which all things are renewed, there will be both a new sun and a new heaven. I hasten, therefore, that I may see that sun of justice who enlightens the souls of all. But what am I to do? He himself wills that the resurrection take place after three days. I have found what to do, so that I both make no delay and keep the number of the days. I shall not make a whole day and a whole night. I shall shorten the hours, so that the Lord Jesus may indeed be among the dead for three days and nights, yet rise from the dead sooner than the intervals of three days and nights allow. I shall shorten the hours, therefore, once he has mounted the cross. From the sixth hour let night fall at once, that I may not see the Lord's passion, but may flee the spectacle of a parricidal persecution. I shall set, and there will be a night of three hours; I shall come forth and renew the day, so that it is of three hours: the first day has run its course; the second night will follow in its own span; the day will likewise follow; the third night will begin; the Lord will rise in the night, and it will be day in the light of the one who rises, so that that saying may be fulfilled: And the night shall be lit up as the day. This is that great day which Abraham saw and was glad, of which David too said: This is the day which the Lord has made; let us exult and rejoice in it, a day at which I shall be present not in the ministry of labour but in the fruit of exultation.

The Lord himself, then, will lead forth the day, and before the consummation of the world the light of the world will be seen, which enlightens every man coming into this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 5"
