[[commentary]]
quote='''
And on the heights of the mountain indeed, the law was being given to the fasting Moses, while, at its foot, a sacrilegious transgression was being enkindled in the people as they ate with the extravagance of banqueters. Moved by this sight, Moses broke the tables, judging it unworthy that a law be given to a drunken people. And so the tables of the law which abstinence received, drunkenness caused to be shattered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 6"
