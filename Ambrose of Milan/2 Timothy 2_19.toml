[[commentary]]
quote='''
The Lord considered and knew those that were His, and drew His saints to Himself; and those whom He chose not, He did not draw to Himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FEpistle%252063.html'
source_title="Epistle 63"
