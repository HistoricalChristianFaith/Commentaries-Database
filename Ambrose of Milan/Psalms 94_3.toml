[[commentary]]
quote='''
There is this besides: he seems to kindle the very torches of youthful wantonness, because he did not blush at his adultery, did not hide it, but made it public by a kind of proclamation in a divine song. What then? Was holy David so shameless and so improvident that he himself should sing his own disgrace, especially since he himself said in another psalm too, which has been gone through today: How long shall sinners, O Lord, how long shall sinners glory? Does he forbid others to glory in sin, and does he himself glory, even in a sacred song? How then are we to distinguish these things?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 1"
