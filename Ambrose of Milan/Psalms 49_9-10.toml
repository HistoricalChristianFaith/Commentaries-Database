[[commentary]]
quote='''
But he who has kept the commandments of life shall not see destruction, when he sees those die who seemed to themselves most wise and most prudent in this world. This applies specially to the scribes and Pharisees, who claim for themselves the chairs in the synagogues as though they were the primacy of wisdom. They truly labour in vain, since they think that they are set free by the didrachma, while they have despised the spiritual price of their soul and that unique sacrifice of the Lord's body through some empty interpretation of the Law, shunning the sacrament of baptism. For the blood of goats and bulls redeems no one, but the one blood of Christ frees all, of which in Leviticus there is the figure, not the truth. For it is not by the didrachma, but by the price of that blood alone, that we are set free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
