[[commentary]]
quote='''
No ordinary man is this Samaritan, who did not himself despise the one whom the priest, whom the Levite had despised. And do not despise for the name of his sect one whom you will marvel at for the interpretation of the word; for by the word Samaritan a guardian is signified. This is what its interpretation holds. Who is the guardian but he of whom it was said: the Lord guarding the little ones? So, just as there is one Jew in the letter, another in the spirit, so too there is one Samaritan outwardly, another in secret. This Samaritan, then, coming down — who is he who came down from heaven, if not he who ascended into heaven, the Son of Man who is in heaven? — seeing the man half-dead, whom no one had been able to cure before, like that woman with an issue of blood who had spent all her substance on physicians, came near him, that is: he was made our neighbor by taking upon himself compassion for us, and near to us by the bestowal of mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
