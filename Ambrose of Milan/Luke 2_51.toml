[[commentary]]
quote='''
And he came to Nazareth and was subject to them. For what should the master of virtue do but fulfil the duty of dutiful love? And do we wonder that he defers to the Father, who is subject to his mother? Surely this subjection belongs not to weakness but to dutiful love, though the serpent of unbelief, sent out from its sinister lurking-places, should lift up its head and vomit poisons from its serpentine breast. When the Son says that he was sent, the heretic calls the Father greater, so as to call the Son imperfect, as one who can have a greater, so as to assert that he who is sent needs the help of others. Did he then need human help too, that he obeyed his mother's command? He deferred to a human being, he deferred to a handmaid — for she herself says: Behold the handmaid of the Lord — he deferred to a reputed father: and do you wonder if he deferred to God? Or is it dutiful love to defer to a man, but weakness to defer to God? Rather, weigh divine things from human ones and recognize what love is owed to the Father. The Father honours the Son: do you not want the Son to honour the Father? The Father with a heavenly voice professes that he is well pleased in the Son: do you not want the Son, clothed in the garment of human flesh, when he speaks with a human voice and a human affection, to say that the Father is greater? For if great is the Lord and greatly to be praised, and of his greatness there is no end, surely a greatness that has no end has no increase either. But why should I not receive with devout ears that the Son was obedient to the Father in the taking up of a body, when I devoutly receive that the Father defers to the Son?

Learn rather precepts for your own profit and recognize examples of dutiful love. Learn what you owe your parents, when you read that the Son does not differ from the Father in will, in work, in time. Though they are two in persons, they are one in power, and certainly that heavenly Father underwent no toil of generation; but you owe to your mother the wrong done to her modesty, the loss of her virginity, the danger of childbirth; to your mother long weariness, to your mother long perils — to her who, poor woman, meets a greater danger in the very fruit of her prayers, and when she has brought forth what she longed for, is freed from the birth, not from fear. Why should I speak of fathers anxious for their sons' advancement, and of estates multiplied for the use of others, and of the seeds sown by the farmer to profit the ages of those who come after? Ought not at least obedience to be repaid for these things? Why should a father's life seem too long to an undutiful son, and the sharing of the inheritance too narrow, when Christ does not shun co-heirs?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
