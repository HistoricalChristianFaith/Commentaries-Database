[[commentary]]
quote='''
Now, since we have already seen the trophy, let the one who triumphs mount his chariot, and let him hang, not on tree trunks or four-horse wagons the spoils won from a mortal enemy, but on the triumphal gibbet the captive spoils taken from the world. Here we do not see nations with their arms bound behind their backs, nor images of razed cities and likenesses of captured towns, nor do we marvel at the bowed necks of captive kings, such as the spectacle of human triumphs is wont to be, nor the bounds of victory marked off by the limit of a region; but rejoicing peoples of the nations, won not for punishment but for reward, kings worshiping with free affection, cities surrendered by willing zeal, and images of towns reformed for the better, which no paint has portrayed but the devotion of faith has colored, arms and the rights of victories running through the whole world, the prince of the world a captive, and the spiritual hosts of wickedness that are in the heavenly places obedient to the command of a human voice, dominions subdued and the forms of various powers, shining not with silks but with virtuous conduct. Chastity gleams, faith shines, and devotion of fortitude, clad in the spoils of death, now rises again. One triumph of God, the cross of the Lord, has made almost all men now triumph.

It matters, therefore, to consider in what state he ascends. I see him naked: so let him who is preparing to conquer the world ascend thus, that he may not seek the aids of the world. Adam was conquered, who sought garments; he conquered who laid aside coverings. And he ascended such as nature formed us, God being its author. Such had the first man dwelt in paradise; such did the second man enter into paradise. And that he might conquer not for himself alone but for all, he stretched out his hands, to draw all things to himself, that he might join to heavenly things those which before were earthly, freed from the knot of death and hung upon the yoke of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
And the place of the cross itself is either in the middle, that it might be conspicuous to all, or above the burial place of Adam, as the Hebrews argue. For it was fitting that the first fruits of our life should be placed there where the beginnings of death had been.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
