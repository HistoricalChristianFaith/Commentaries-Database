[[commentary]]
quote='''
Even today the fertility of the earth carries into effect its age-old fecundity by exercise of spontaneous growth, for you see how many plants are still grown without being sown. But even in much that is gathered by the labor of our hands there still remains a large part of our produce which, by the kindness of Providence, comes without effort to us while we are at rest. This we are taught by the reading of the Gospel before us, wherein the Lord says: ‘This is the kingdom of God, as though a man should cast seed into the earth, then sleep and rise night and day and the seed should sprout and grow without his knowing it. For of itself the earth bears the crop, first the blade, then the ear, then the full grain in the ear. But when the fruit is ripe, immediately he puts in the sickle because the harvest has come.’ Therefore, while you are asleep, man, and without your knowing it, the earth of itself produces its fruits. You fall asleep and then rise, marveling how the grain has increased in the course of one night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
