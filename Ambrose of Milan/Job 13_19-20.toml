[[commentary]]
quote='''
But what is finer than to laugh when we are cursed? For we ought to rejoice if things that are not ours are said of us. First, because the enemy, wishing to say something against us by which to fasten a charge on us, did not find what is true, but composed falsehoods in place of truths. Next, because the Lord himself said in the Gospel, of such an accusation, brought falsely against the innocent for justice's sake: Rejoice and exult, because your reward is great in heaven. He who recognizes the charge, then, ought to be silent, lest he aggravate the wound and the scar be torn open; and he who does not recognize it ought to be silent too; for he hears another's crime, not his own. If he answers back, he makes it his own; if he is silent, he turns it back and wounds the reviler. He too ought to be silent who relies on the reward just mentioned; for he suffers no prejudgment who is subject to no judgment. And if there has been a prejudgment in the world, there will be none in the judgment of God. Indeed, that you may know that insult does not prejudge a good conscience, hear holy Job speaking, a richer witness surely than if he had gained the empire of the Roman world: Now I will be dumb and give up: if now there is prejudgment against me, then I shall not be hidden from your face.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 3"
