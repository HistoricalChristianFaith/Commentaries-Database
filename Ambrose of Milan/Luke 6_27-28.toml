[[commentary]]
quote='''
There those who are weak are still given to drink a kind of milk of the Law, and therefore they are led along the path of the Law to grace — they hear the things that are of the Law, so that by following the Law they may advance beyond the Law —; here the Church, more firmly founded, is not nourished with milk but eats food; for the stronger food is love. Indeed among the three greatest, hope, faith, love, the greater is love.

Love, then, is set in order when it is said: Love your enemies, so that that word of the Church which has already been spoken before may be fulfilled: Set love in order in me; for love is set in order when the precepts of love are formed. See how he began from the higher things and cast the Law behind the back of the gospel blessing. The Law commands the requital of vengeance; the gospel bestows love for enmities, kindness for hatreds, prayers for curses, help for persecutors, patience for the hungry, and the grace of reward. How much more perfect is the athlete who does not feel the injury!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
