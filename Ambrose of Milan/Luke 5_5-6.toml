[[commentary]]
quote='''
Master, he says, laboring through the whole night we have caught nothing; but at your word I will let down the net. I too, Lord, know that it is night for me when you do not command. No one has yet given in his name; I still have night. I have cast the javelin of my voice through Epiphany, and still I have caught nothing; I have cast it through the day. I wait for you to command; at your word I will let down the nets. O empty presumption, O fruitful humility! Those who had before caught nothing enclose at the word of the Lord a great multitude of fish. This is not the work of human eloquence, but the gift of the heavenly calling. The disputations of men give way; the people believe by their own faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
