[[commentary]]
quote='''
Nor should it trouble anyone that we said John's infancy was passed over by a higher counsel, whereas we assert that Christ's infancy was described; for it is not for all to say: I became weak to the weak, that I might gain the weak; I became all things to all, nor can it be said thus of anyone else that he was wounded for our iniquity and made weak for our sins. He, then, was a little one, he was a tiny infant, so that you might be able to be a perfect man; he was wrapped in swaddling clothes, so that you might be loosed from the snares of death; he in mangers, so that you might be at altars; he on earth, so that you might be among the stars; he had no other place in that inn, so that you might have many mansions in the heavens. He who, though he was rich he says, became poor for your sakes, so that by his want you might become rich. That poverty, then, is my inheritance, and the weakness of the Lord is my strength. He chose to be in want himself, so that he might abound for all. The weeping of that wailing infancy washes me, those tears have washed away my sins. I owe more, then, Lord Jesus, to your injuries, by which I am redeemed, than to your works, by which I am created. It would profit nothing to be born, had it not profited to be redeemed.

But let no one shut up the whole form of the divinity within the condition of the body. The nature of the flesh is one thing, the glory of the divinity another. Weakness for your sake, power in himself; poverty for your sake, wealth in himself. Do not judge by what you see, but recognize that you are redeemed. You see that he is in swaddling clothes, you do not see that he is in the heavens. You hear the wailing of an infant, you do not hear the lowing of the ox recognizing its Lord; the ox in fact has known its owner, and the she-ass the manger of her lord, or rather I should say praesaepium [manger], as he who made the translation wrote; for to me there is no difference in the word where there is none in the sense. For if the orator of those who pursue the trappings of speech denies that the fortunes of Greece depend on whether he used this word or that, but thinks that the matter is what must be looked to; if their very philosophers, who spend whole days in disputation, made less use of Latin and accepted words in order to use terms of their own; how much more ought we to disregard words and look to mysteries, in which plainness of speech prevails, because the miracles of the divine works, adorned by no words, have shone with the light of their own truth? Indeed, that rational she-ass was fed by the holy mangers not with the gloss of dainties but with the sap of natural nourishment.

This is the Lord, this the manger, by which a divine mystery was revealed to us: that the Gentiles, living in their stalls after the irrational manner of cattle, were to be fed with the richness of sacred nourishment. So the she-ass, that is, the figure and form of the Gentiles, knew the manger of her lord. And therefore she says: The Lord feeds me, and I shall want nothing. Is God proved by slight signs, in that angels minister, magi adore, martyrs confess? He is brought forth from the womb, but he flashes from heaven; he lies in an earthly inn, but he is mighty with heavenly light. A married woman bore him, but a virgin conceived him; a married woman conceived him, but a virgin brought him forth. For Saint Matthew taught us no slight mystery, which Saint Luke, because it had already been fully set out, thought should be passed over in silence, believing that he would be rich enough if out of all things he claimed for himself the Lord's manger.

This little one, then, whom you, who are an unbeliever, think of no account, the magi coming from the east followed over so long a distance, and falling down they adore him and call him king and confess that he will rise again, offering from their treasures gold, frankincense and myrrh. What are these gifts of true faith? Gold for a king, frankincense for God, myrrh for one dead; for the first is the emblem of a king, the second the sacrifice of divine power, the third the honour of burial, which does not corrupt the body of the dead but preserves it. Let us too, who hear and read these things, bring forth such gifts, brethren, from our treasures; we have indeed a treasure in earthen vessels. If, then, in yourself you ought to reckon what you are not from yourself but from Christ, how much more in Christ ought you to reckon not what is yours but what is Christ's!

So the magi offer gifts from their treasures. Do you want to know how good a merit they have? The star is seen by them, and where Herod is, it is not seen; where Christ is, it is seen again and shows the way. So this star is the way, and the way is Christ, because according to the mystery of the Incarnation Christ is the star; there shall rise indeed a star out of Jacob, and a man shall spring up out of Israel. Indeed, where Christ is, there the star is too; for he himself is the bright and morning star. So he marks himself out by his own light.

Take another proof. The magi came by one way, they return by another; for having seen Christ, having understood Christ, they go back better, surely, than they came. For there are two ways, one that leads to destruction, the other that leads to the kingdom. The one is the way of sinners, which leads to Herod; this way is Christ, by which one returns to the fatherland; for here our sojourn is for a time, as it is written: my soul has long been a sojourner. Let us beware, then, of Herod, the ruler for a time of worldly power, that we may attain the eternal dwelling of the heavenly fatherland.

These rewards are set before not the elect only but all, since Christ is all and in all; for you see that it was not idly that Abraham, from among the Chaldeans, who are reckoned more skilled in numbers, believed God, or that the magi, who, though they spend their zeal on winning over the deity to themselves by magical arts, believed in the Lord's birth on earth; not idly, I say, but so that from hostile nations a testimony to holy religion and an example of the fear of God might be taken.

And yet who are these magi but those who, as a certain history teaches, draw their descent from Balaam, by whom it was prophesied: There shall rise a star out of Jacob? These, then, are heirs no less of his faith than of his line. He saw the star in the spirit, they saw it with their eyes and believed. They had seen a new star which had not been seen since the creation of the world, they had seen a new creature, and not only on earth but in heaven too they were seeking the grace of the new man, according to what Moses set down prophetically, that there shall rise a star out of Jacob, and a man shall spring up out of Israel. And they knew this to be the star which signifies man and God. They adored the little one. Surely they would not have adored him, had they believed him only a little one. The magus, then, understands that his arts are coming to an end, and do you not understand that your gifts have come? He confesses what belongs to another, and do you not recognize what was promised to you? He believes against himself, and do you not think you should believe for yourself?

So the magi announce that a king is born: Herod is troubled, gathers the scribes and the chief priests and asks where the Christ is to be born. The magi announce only a king, Herod seeks the Christ; so he confesses the very king about whom he asks. Then, when it is asked where he was to be born, he is surely shown to have been foretold; for one who had not been foretold could not be sought. O senseless Jews, you do not believe that he has come whom you see; you do not believe that he has come whom you say is to come! Bring me word he says so that I may come and adore him. Herod indeed lays a snare, but he does not deny God, whom he declares must be adored. Then he orders the infants to be slain. To whom else but God was such a victim owed? Though infancy is without understanding, yet it confesses God, for whom it is slain. We have taken these few things from Matthew, so that it might be clear that the time of his infancy was by no means void of the works of divinity.
'''
