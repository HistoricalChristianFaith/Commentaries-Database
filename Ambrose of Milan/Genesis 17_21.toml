[[commentary]]
quote='''
Now the generation is promised for the following year, so that you may notice which generation the Lord promises, that is, not that of Sarah's bodily womb, but this offspring of the Church which was to come. Indeed further on he also says: I will return to you in time to come, and Sarah shall have a son. In this we can take both: both this assembly of the Church and the resurrection of the faithful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
