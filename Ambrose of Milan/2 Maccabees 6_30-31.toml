[[commentary]]
quote='''
Why say more? By dying in his torments he became a lesson in perseverance to the rest, he who had been chosen as an example of weakness. Blessed, then, is he in whom torments could not conquer reason. Or is he not blessed who could by the virtue of his soul be victor over punishments and, by the oarage of devotion, keep his passion whole amid such great waves?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 10"
