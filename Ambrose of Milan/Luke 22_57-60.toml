[[commentary]]
quote='''
But let us look at the course of the denial, which I see is different among the evangelists. So new a thing was it that Peter could sin that his sin could not be grasped even by the evangelists. And so Matthew put it that Peter, when the maidservant betrayed him as one of those who were with Jesus the Galilean, answered at his first utterance: I do not know what you say. This Mark too has, who followed Peter and could learn it more truly from Peter himself. The first utterance of Peter as he denies is one by which, however, he seems not to deny the Lord, but to have separated himself from the woman's betrayal.

Yet consider what he denied. That he was one, surely, of those who were with Jesus the Galilean, or, as Mark put it, with Jesus the Nazarene. Did he deny that he had been with the Son of God? It is as if to say: I do not know the Galilean, I do not know the Nazarene, whom I know as the Son of God. Let men have the names of places; the Son of God cannot be named from a homeland, whose majesty no place encloses. And so that you may know this is true, it is also proved by an example; for elsewhere, when the Lord asked the disciples: Who do men say that I am, the Son of Man? some said Elijah, others Jeremiah or one of the prophets, but Peter said: You are the Christ, the Son of the living God. Did he deny there too, because he chose to confess Christ not as the son of man but as the Son of God? Surely, what do we think ambiguous here, which Christ himself approved? Take another point too.

For Peter, when asked: And are you one of those who were with Jesus the Galilean? shrinks from the word of eternity — for they 'were' not, who began to be — that is to say: he alone was who was in the beginning.

Indeed he says: I am not; for to be belongs to him who always is. Hence Moses too says: He who is has sent me. Again, when he was pressed as being one of them, according to Mark he denied, so that you may know that the evangelist gave more to truth than to favour; but nevertheless he denied that he was one of them, he did not deny Christ. He may have denied the fellowship of men, not the grace of God. He may have denied that he was one of those who were with the Galilean; he did not deny that he was with the Son of God.

Indeed, according to Matthew, when betrayed as having been with Jesus the Nazarene, he says: I do not know the man. This same thing at the third utterance too both evangelists whom we have set forth recorded: that he answered with an oath that he did not know the man. And rightly did he deny the man, whom he knew as God. Indeed, where there is an oath, the answer is cautious. For although Peter denied, yet he did not swear falsely, because the Lord had not said that he would swear falsely. But if it is doubtful in Peter, how dangerous an oath is!

John, however, put it thus: that Peter, asked by the maidservant whether he was one of the disciples of that man, answered at his first utterance: I am not; for he was not the apostle of a man, he who was Christ's. Indeed Paul too denied that he was the apostle of a man, saying: Paul an apostle, not from men nor through man, but through Jesus Christ and God the Father. But lest he should seem to bring in any ambiguity about the Incarnation, he added: who raised him from the dead, so that you may believe him man too, when you have first believed him God. This he keeps elsewhere also in the same tenor, where he says: For there is one God and one mediator of God and men, the man Christ Jesus. He named him mediator of God, surely, before he named him mediator of men; for it is not enough to believe both, unless the order of faith is kept.

The answer, then, agrees everywhere; for it was fitting that he who said: I do not know the man, when asked whether he was one of the disciples of the man, should say: I am not. And so he did not deny that he was a disciple of Christ, but denied that he was a disciple of a man. And so both Peter and Paul denied the man whom they confessed to be the Son of God. What Peter perceived, Paul expressed; from this one the other too made progress. The error of Peter is the teaching of the righteous, and the stumbling of Peter is the rock of all. Indeed he stumbles upon the waves, but stretches out his right hand to Christ; he falls on the mountain, but is raised by Christ; the same Peter stumbled on the sea, but he walked. The stumbling of Peter is firmer than our firmness. He falls there where no one climbs; he totters there where no one walks. And yet among the waves, though he stumbles, he does not slip; he totters, he does not fall; he is tossed, he is not cast headlong. And if he fell, yet he fell on the mountain; but he fell more happily than others stood, more happily he fell, whom Christ raised up.

Again, John wrote that when asked a second time whether he was one of his disciples, he denied. And rightly did he deny, because he was said to be one of the disciples of him whom they had spoken of above as a man. For the third time too he denied that he had been seen with him; this too is derived from what precedes: I have not been with him whom you call a man, but I have not departed from the Son of God.

Luke also wrote that Peter, asked whether he was one of them, answered at his first utterance: I do not know him. And rightly he spoke. For it would have been rash for him to say that he knew him whom the human mind cannot comprehend; no one, indeed, knows the Son except the Father. Again, at the second utterance according to Luke, the same Peter says: I am not; he preferred, that is, to deny himself rather than Christ. Or, because he seemed to deny fellowship with Christ, he surely denied himself. Certainly, when he denies concerning a man, he sinned against the Son of Man, so that it might be forgiven him, not against the Holy Spirit. Asked a third time too, he says: I do not know what you say, that is: I do not know your sacrileges.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
