[[commentary]]
quote='''
And so they are admonished to claim for themselves the distinction of works rather than the nobility of birth, since there is no prerogative in descent unless the inheritance of faith supports it, an inheritance which he revealed in prophetic speech was by God's will to be transferred to the peoples of the Gentiles, saying: God is able from these stones to raise up children to Abraham. For although God can convert and change diverse natures, yet because the mystery profits me more than the miracle, in the forerunner of Christ I ought to recognize nothing more than the building up of the rising Church, which, built not of rocky stones but of living stones into a dwelling of God and the pinnacle of a temple, has risen by the conversion of our souls. For God was preparing to soften the hardness of our minds and from stones of stumbling to raise up worshippers of religion. For what else were they held to be but stones, who served stones, like indeed to those who made them? So it is prophesied that faith was to be poured into the stony breasts of the Gentiles, and the oracles promise that those would become sons of Abraham through faith, in whom, through hardness of mind, a kind of stony habit of an insensible and irrational nature had grown. For if the apostolic sentence compared men made firm by the strength of faith to living stones, according to what is written: And you, as living stones, be built up a spiritual house, into a holy priesthood, offering spiritual sacrifices, much more deeply do men here seem to be compared to stones by the prophetic voice, men who had so lost the sense of the human mind that, while they think that the reason of some divinity is present in stones, they themselves were turned into the nature of stones, not by the use of the body but by the habit of the mind. Indeed, those who sprang from Abraham's line according to the flesh are called both princes of Sodom and whitewashed walls. So likeness of conduct, rather than the order of ancestors, lays claim to the prerogative of birth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
