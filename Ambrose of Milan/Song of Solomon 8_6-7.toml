[[commentary]]
quote='''
O mother, truly stronger than adamant, sweeter than honey, more fragrant than a flower! O indissoluble bond of love! O truly love strong as death, jealousy hard as hell of devotion and faith! No floods of such great sufferings could shut out your love, no rivers of such great bitternesses could overflow it. As the ark in that flood of the world was borne unharmed over the expanses of the whole earth, so you too stood immovable in devotion against the tide of such grievous sufferings, and, though you could have chosen the safety of your sons, you would not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 12"
