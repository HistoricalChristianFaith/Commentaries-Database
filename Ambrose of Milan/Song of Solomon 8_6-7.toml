[[commentary]]
quote='''
O mother, truly stronger than adamant, sweeter than honey, more fragrant than a flower! O indissoluble bond of love! O truly love strong as death, jealousy hard as hell of devotion and faith! No floods of such great sufferings could shut out your love, no rivers of such great bitternesses could overflow it. As the ark in that flood of the world was borne unharmed over the expanses of the whole earth, so you too stood immovable in devotion against the tide of such grievous sufferings, and, though you could have chosen the safety of your sons, you would not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 12"

[[commentary]]
quote='''
Under that aspect, too, the jealousy of love is hard, and its wings are wings of fire. It has wings like a dove, for there are the feathers of a dove covered with silver, with which he who loves flies away, saying: Lo, I have gone far off in flight, and remained in solitude (Ps. 54 (55):8). But the wings of love are wings of fire, with which it inflames the ardor of love. With this heat the Lord made his angels fervent spirits, and his ministers a burning fire, but one that does not burn up. We read also of the wing of the temple, upon which the devil, in tempting him, made the Savior go up, which was on the summit of the temple (Matt. 4:5). There are, then, pinnacles of piety, there are summits of love, which are accustomed to kindle the heat of grace in human hearts; so that much water cannot extinguish and shut out love, and no rivers of worldly storms can hem it in. We have said that love shuts out fear; we did not say that it shuts out every disturbance; for he who loves God has a deep tranquility of a confirmed mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
