[[commentary]]
quote='''
What is a name but that by which each one is properly signified, which he does not have in common with others? For the word man is a common term; unless you add what he is called, he cannot be made known. A name, then, is the property of each one, by which he can be understood. Hence I think that Moses too, wishing to know what is proper to God and something special about him which was not common to the heavenly powers, asked: What is your name? Indeed God, knowing his mind, answered not with a name but with the reality, that is, he expressed the thing, not the appellation, saying: I am who am, because nothing is so proper to God as always to be. Let those, then, who deny that Christ is coeternal with the Father see that they deny God, whose property it is always to be and never at any time not to have been.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
