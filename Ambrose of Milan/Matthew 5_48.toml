[[commentary]]
quote='''
Let us, therefore, upheld by the support of faith and lifted up by its oars, approach that seat of grace, fleeing this world and its contagion. And this is to flee: to abstain from sins, to take on the form of the virtues after the likeness and image of God, to stretch out our strength to the imitation of God according to the measure of our ability. For the perfect man is the image and glory of God. Hence the Lord also says: Be perfect, as your Father also, who is in heaven, is perfect. This, then, is to be like God: to have justice, to have wisdom, and to be perfect in virtue. For God is without sin, and therefore he who flees sin is after the image of God. There is no doubt, then, that he who abstains from sin flees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
