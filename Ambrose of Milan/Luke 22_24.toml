[[commentary]]
quote='''
If the disciples did contend, it is not alleged as any excuse, but held out as a warning. Let us then beware lest any contentions among us for precedence be our ruin.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let us turn, then, and beware lest there be among us, to our ruin, any contention about precedence; for if the apostles contended, it is not held out as an excuse, but set before us as a warning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
