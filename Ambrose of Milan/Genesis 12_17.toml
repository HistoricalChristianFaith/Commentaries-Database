[[commentary]]
quote='''
But the Lord afflicted Pharaoh with great and severe afflictions, and his house, because of Sarai the wife of Abraham. A great testimony and lesson for guarding chastity is this passage, so full of exhortation that each person should show himself chaste, should not covet another's bed, nor, in the hope of concealment or of acting with impunity, assail another man's wife, nor be provoked by a husband's carelessness or foolishness or by his longer absence. God, the guardian of marriage, is present, from whom nothing is hidden, whom no one escapes, whom no one mocks. He takes the place of the absent husband, he keeps watch; nay rather, without a watch he catches the guilty one before he does what he has prepared: in the spirits of individuals, in the minds of all, he recognizes the crime. Though you, adulterer, have deceived the husband, you do not deceive God; though you have escaped the husband, though you have tricked the judge of the forum, you do not escape the Judge of the whole world. He avenges more heavily the wrong done to the helpless, the insults done to an unwary husband; for the wrong is greater when the author of the marriage chamber is spurned and disregarded than when its guardian is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"
