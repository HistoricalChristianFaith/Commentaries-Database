[[commentary]]
quote='''
This loftiness the soul knew in whom was the turning of the Word.

For thus she says: I am my brother's, and his turning is toward me. She repeated this thought three times, in different ways, in the Song of Songs. At the beginning she says: My brother is mine and I am his, who pastures in the lilies, until the day breathes and the shadows are removed. Then she says: I am my brother's and my brother is mine, who pastures among the lilies. At the end she says: I am my brother's and his turning is toward me. The first refers to the beginning of the soul — and that is why she also put first My brother is mine; for when he shows himself, the soul too has taken up the desire of cleaving to God — what follows to her progress, the third to her perfection. In the first, as at the beginning, the soul still sees shadows, not yet stirred by the revelation of the Word drawing near, and therefore the day of the Gospel was not yet shining for her. In the second, without the confusion of shadows, she gathers holy fragrances. In the third, now perfect, she provides rest for the Word within herself, so that he may turn toward her and lay down his head and rest; and now, holding her reward, she invites him whom she had sought before and could not find to her field, saying:

Come, my brother, let us go out into the field, let us rest in the villages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
I am my brother's, and his turning is toward me. This sense she has repeated three times, in different ways, in the Song of Songs. At the beginning she says: My brother is mine, and I am his: he who pastures in the lilies, until the day breathes and the shadows decline (Song 2:16). Then she says: I am my brother's, and my brother is mine, he who pastures among the lilies (Song 6:2). At the end she says: I am my brother's, and his turning is toward me. The first is for the instruction of the soul; and therefore she also put first: My brother is mine; for as he showed himself, she too took up the desire of cleaving to God. What follows is according to progress; the third according to perfection. In the first, as at the stage of instruction, the soul still sees shadows, not yet stirred by the revelation of the Word drawing near; and therefore the day of the Gospel was not yet shining for her: in the second, without the confusion of shadows, she plucks holy fragrances: in the third, now perfect, she provides rest in herself for the Word, so that he may turn toward her, and lay down his head, and rest; and she invites him to her field, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
