[[commentary]]
quote='''
The figure itself of the body is full of dignity. No blush of drunkenness is suffused on the cheeks to offend the gaze of onlookers, but the countenance is bright with a chaste pallor inspiring respect. Speech is rather serious, the eye rather modest, the gait rather firm and moderate; for frequently a disturbance of the mind is betrayed by the disordered pace. The rather intent look is, as it were, both the arbiter of its thought, and the silent interpreter of the heart; so that it neither disguises sadness nor is it changed by immoderate laughter. For do not think that this is unnecessary for our admonition, because Wisdom says in the Gospel: And when you fast be not as the hypocrites sad. He said hypocrites for this reason, that they assume another character through pretense, just as those who perform tragedies on the stage excite their own feelings in keeping with the words of those whose characters they represent so that they either become angry, or grieve, or rejoice; for they put on that they may appear to be fasting, desiring to be approved more by men than by God, as the Jews did.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"
