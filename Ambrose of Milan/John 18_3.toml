[[commentary]]
quote='''
John found the lamp and showed it, when the persecutor came with a lantern and pointed it out; for a lantern has a light enclosed, not free. The light of the Jews is like a lamp under a bushel or torches under a veil; it can be seen, but is not seen. But we, with unveiled face, behold the eternal glory of the Lord, so as to be re-formed into his image from glory to glory through the Holy Spirit. The crowd of persecutors, then, came with lanterns, and so their eyes could not see the enclosed light; it came with torches, which have more murky smoke than brightness in their light. Indeed it is the custom for the corpses of the dead to burn by torches. The Jews, then, who persecuted the author of salvation, were already bringing burnings upon themselves. They came with arms, signifying that they, who refused the peace of the Lord, would perish by arms at the hands of the Romans, to the destruction of the whole city and temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
