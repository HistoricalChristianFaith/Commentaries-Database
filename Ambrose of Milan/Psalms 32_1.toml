[[commentary]]
quote='''
For some sins Thou dost wash away in the blood of Thy Son, others Thou dost remit unto us, that by good works and confession we may cover our errors. The expression therefore "that pardoneth iniquities", appertains to remission; because He takes them away altogether, so that the things which He remembers not are as though they did not exist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252061-70.html'
source_title="Letter 70, To Horontianus"

[[commentary]]
quote='''
Therefore penitence is toilsome, grace is sweet, because sin is stripped off where grace is, swallowed up where penitence is; there it is remitted, here it is hidden; and therefore it is written: Blessed are they whose iniquities are remitted and whose sins are covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
