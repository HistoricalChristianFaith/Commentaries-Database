[[commentary]]
quote='''
For Scripture teaches us that the ascent of devotion is like a ladder, on which holy Jacob, a man of exercise, saw the angels of the Lord ascending and descending; he has been set before us so that through him we may learn that we must advance a step of virtue little by little, and that thus we can strive from the lowest things to the highest if we proceed by small advances towards the things that seem higher than human nature. Keep this ladder always set before you. Do not fear, O man, to climb these steps of discipline. The first step is near the earth, the next is like the first. So by equal steps one climbs to the summit. Do not disdain, O man, that first step as if it were the meanest. That first ascent separates you from the earth; you tread on air once you have lifted your foot from the ground. Placed in virtue, you have left the earth by rising; you leave the earth if you turn aside from fault. The beginning of progress towards virtue, then, is to abstain from sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
