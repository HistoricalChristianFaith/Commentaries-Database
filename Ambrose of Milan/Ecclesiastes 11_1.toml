[[commentary]]
quote='''
With this discussion that saying of Ecclesiastes also agrees: Send your bread before the face of the water, because there is heavenly bread where there is the water of grace, since those rightly receive the substance of the word and the nourishment of the mystical meaning from whose belly flow rivers of living water. Likewise also, this living bread is there where there is the water of tears and the weeping of penitence. For thus it is written: In weeping they went out, and in consolation I will call them back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 2"
