[[commentary]]
quote='''
In the third, now perfect, she provides rest for the Word within herself, so that he may turn toward her and lay down his head and rest; and now, holding her reward, she invites him whom she had sought before and could not find to her field, saying:

Come, my brother, let us go out into the field, let us rest in the villages. Above, she invited him to the garden; here, to the field, which has not only the grace of flowers but also wheat and barley, that is, the supports of more solid virtues, so that he may look upon its fruits. Let us rest she says in the villages, to which Adam had been banished when he was cast out of paradise. In these he rested, but he worked the earth. The reason why she wants him to go out into the field is plain to the understanding: that, like a good shepherd, he may pasture his flock, lift up the weary, call back the straying. For although this soul has kept for him things new and old, yet there are still those who are like lambs, who have to be nourished on the juice of milk. So, as one perfect, she intercedes not for herself but for others: that he may go out from the bosom of the Father, that he may come forth like a bridegroom going out from his chamber and run the way to win the weak; that he may not linger on that secret throne of the Father and in that light, where the weak cannot follow, but that he may be taken up and brought into the house and the secret chamber of the bride; that he may be outside as far as she is concerned, so as to be within for us; that he may be in our midst, though he is not seen by us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
