[[commentary]]
quote='''
Seeing this, he says, the kings of the earth were gathered together and passed over into one; they themselves, seeing, then marvelled. Good kings are those who can show themselves rulers of their own body, flowing from the very origin and teaching of the patriarch Abraham, who taught that sin can be overcome; therefore he was a true king, for he knew not how to be subject to shameful deeds, he in whom the allurement of guilt and error could not reign. Hence also it was said to such a man by the sons of Heth: You are a king from God among us. Such kings of the earth, then, who command the flesh, were gathered together, so as to be of one heart and one spirit, as we read that the multitude of believers had one soul and one heart and there was no division among them. These are they who passed over into one, not so much into one place as into the same disposition and purpose; for to the one who is approved it is said: Pass over, sit down at table. For it is no small virtue to pass over from wicked things to honourable ones, from earthly things to eternal ones, and to change the habit of carnal life and abolish all its practice, to take up new ways and to turn aside the whole state of the old manner of life; and rightly it is said to him: If you pass through the water, I am with you. God is with the one who passes over, not with the one who stops.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
