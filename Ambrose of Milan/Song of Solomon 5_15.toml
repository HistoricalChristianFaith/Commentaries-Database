[[commentary]]
quote='''
Who indeed but Christ could dare to claim the church as his bride, whom he alone, and none other, has called from Libanus, saying, "Come here from Lebanon, my bride; come here from Lebanon"? Or of whom else could the church have said, "His throat is sweetness, and he is altogether desirable"? And seeing that we entered upon this discussion from speaking of the shoes of his feet, to whom else but the Word of God incarnate can those words apply? "His legs are pillars of marble, set upon bases of gold." For Christ alone walks in the souls and makes his path in the minds of his saints, in which, as upon bases of gold and foundations of precious stone the heavenly Word has left his footprints ineffaceably impressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25203.html'
source_title="Exposition of the Christian Faith 3.10.74"

[[commentary]]
quote='''
His legs are marble columns, founded upon bases of gold. They signify that the Apostles are columns of the Church, who are founded in holy fear. For as Peter, James, John and Barnabas seemed to be columns of the Church, so too whoever has conquered this world becomes a column of God, which he confirms who says: I have confirmed its columns (Ps. 74 (75):4). So too the golden base is fear full of discipline, because it is the beginning of wisdom. In the fear of the wise, then, the apostolic preaching, the column of Christ, is made firm as upon a golden base. Therefore for eloquence and for apostolic speech the tribunal is the fear of the just man, and a golden base full of prudence; and the good statue, as the likeness of truth, is the speech of the saints.

And see that the fear of the saints is like a golden base. Read Isaiah: see after how many things he placed fear, so as to make fear blameless and good: The spirit, he says, of wisdom and understanding, the spirit of counsel and of power, the spirit of knowledge and of piety, the spirit of the fear of the Lord (Isa. 11:2). After how many things he has placed fear, so that it might have something it can follow! It is formed through wisdom, instructed through understanding, directed by counsel, strengthened by power, governed by knowledge, adorned by piety. Take these things away from the fear of the Lord, and fear is irrational and foolish, one of those: Fightings without, fears within (2 Cor. 7:5); by which Paul too would have been afflicted, had he not had the Lord to console him.

His appearance is as of Lebanon, chosen as the cedars. He dwells on high and looks upon lowly things, because his appearance is like the cedar of Lebanon, which thrusts its foliage into the clouds, its root into the earth; for his beginning is from heaven, and his later parts on earth have brought forth fruits close to heaven. This kind of tree never loses its greenness; in winter as in summer it nourishes its foliage, and it is not changed to a different color: this tree alone the wind never strips of its honor; it alone is never stripped of its old garment nor clothed in new flower. So the apostolic grace too knows no failing, and flowers with its own perpetual loveliness. The soul, then, that thrives with flourishing members knows no corruption; she always sustains with patient magnanimity the summits of justice and of the other virtues; and therefore she does not waste away or fail, because there is nothing in her ruinous or slack, nothing unstable, nothing slippery, nothing that could be poured out of her by a fault of speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
