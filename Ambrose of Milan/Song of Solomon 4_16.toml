[[commentary]]
quote='''
For this reason, too, the church, guarding the depth of the heavenly mysteries, repels the furious storms of wind, and calls to it the sweetness of the grace of spring, and knowing that its garden cannot displease Christ, invites the bridegroom, saying, "Arise, O north wind, and come, you south; blow upon my garden, and let my ointments flow down. Let my brother come down to his garden and eat the fruit of his trees." For it has good trees and fruitful, which have dipped their roots in the water of the sacred spring, and with fresh growth have shot forth into good fruits, so as now not to be cut with the axe of the prophet, but to abound with the fruitfulness of the gospel.
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 9:56"

[[commentary]]
quote='''
Recognize also the voice of the church inviting us when it says, "Arise, O north wind, and come, O south wind, blow through my garden and let my ointments flow forth. Let my brother come down into his garden and eat the fruit of his apple trees." For knowing even then, O holy church, that from these also you would have fruitful works, you promised to your anointed one the fruit from such as these. It was you who first said that you were brought into the king's chamber, loving [Christ's] breasts above wine. For you loved him who loved you, you sought him who nourished you, and you despised dangers for religion's sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Death of Satyrus 2.118"


[[commentary]]
quote='''
Having thus learned where to seek out Christ, learn now how to merit that he may be seeking you. Arouse the Holy Spirit by saying, "Awake, O north wind, and come, O south wind! Blow upon my garden, and let its fragrance be wafted abroad. Let my beloved come to his garden and eat its choicest fruits." The garden of the Word is the affection of a flourishing soul, and its fruit is the produce of virtue.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:54"

[[commentary]]
quote='''
To this wind it is said in the Song of Songs: come, O south wind, so that by the mildness of a softer air the fields of our heart may be loosened, which, bound by the winter frost, refused their lap to the seeds to be received. It is good for us that this wind should breathe, to bring safely into port the ships of Tarshish that carry to the true Solomon the things that seem needful for his temple. But this wind breathes only then, if that heavy wind, the north wind, has ceased to blow. Therefore either the Church or the devout soul says: arise, O north wind, and come, O south wind, that is: you, north wind, withdraw; and come, south wind, breathe upon my garden, so as not to shake off the flowers but to preserve them. The soul full of devotion, then, has a garden, or is itself a garden that bears fruits; the soul that lies open to ungodliness has dust, which is barren of fruit. The Lord indeed made it fruitful, but it gathered for itself the dust of ungodliness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
From here Plato composed that garden of his. He called it in one place the garden of Jupiter, in another the garden of the mind; for he called Jupiter both god and the mind of the universe. Into this garden, he says, the soul, which he names Venus, entered, to fill herself with the abundance and riches of the garden, in which Porus lay filled with drink, pouring out nectar. This, then, he composed from the book of the Song of Songs, on the ground that the soul cleaving to God entered into the garden of the mind, in which there was an abundance of various virtues and flowers of words. And who does not know that he thought the abundance of virtues should be transferred from that paradise which we read of in Genesis, having the tree of life and the tree of the knowledge of good and evil and the other trees, and planted in the garden of the mind, which Solomon in the Song of Songs signified as the garden of the soul, or as the soul itself? For thus it is written: a garden enclosed is my sister, my bride, a garden enclosed, a fountain sealed; your sendings forth are a paradise. And below the soul says: arise, north wind, and come, south wind, blow through my garden, let my ointments flow down. Let my brother come down into his garden. How much more beautiful is this, that the soul adorned with the flowers of the virtues is a garden, or has in itself a paradise budding forth! Into this garden it invites the Word of God to come down, so that that soul, watered by the heavenly rain of the Word and by his abundance, may bear fruit. And the Word of God feeds on the virtues of the soul whenever he finds it obedient to him and rich, and he plucks its fruits and delights in them. And when the Word of God has come down into it, the ointments of healthful words flow down from it, and the fragrant breaths of manifold graces breathe out fragrance far and wide.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
