[[commentary]]
quote='''
So when he was hung up and beaten severely on this side and on that, and his aged limbs could no longer bear the punishment of the blows, though the executioners and the stretchers were wearied, he, bowed down to the earth, bore an unbowed mind. And someone, whether pitying his great age or wishing to get round him with temptations: 'Only answer' he said 'that you will eat: we will make you exempt from that food'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 10"
