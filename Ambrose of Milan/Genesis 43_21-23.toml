[[commentary]]
quote='''
Hence, mystically, the steward of the house answered them. And understand who he is when you read of Moses, faithful in all his house. For Moses, Peter, Paul and the other saints are stewards of the house, but Christ alone is the Lord. It is written that Moses was faithful in all his house as a servant, for a testimony of the things that had been spoken, but Christ as a son in his own house; which house we are, if we hold fast the freedom and the glory of hope.

This steward of the house, then, answered them: May he be gracious to you, do not be afraid. For your God and the God of your fathers has given you treasures in your sacks: your good silver I have received. For they had said: We found each man's silver in our sacks. We have brought back our silver by weight. O great mysteries, and clearly expressed! This is to say: Why are you puffed up? Do you keep claiming that you have your own silver in your sacks? For what do you have that you did not receive? But if you received it, why do you boast as if you had not received it? Already you are filled, already you have become rich, you who believe that you have silver; but the God of your fathers gave you the silver. He is your God, he is the God of your fathers, whom you denied. But he pardons, but he forgives, but he receives you back, if you return. It is he who does not seek your silver, but gives his own. He himself gave you silver in your sacks. Now your sacks, which held clay, hold silver; and therefore he is yours who says: You have torn my sack and clothed me with gladness. Christ is the gift of gladness. He is your silver, he is your price. The Lord Jesus does not demand from you the price of his grain, he does not seek the weight of your silver. Your silver is base; the silver of the sack is not good.

Your good silver I have received, that is: that is not material silver, but your spiritual silver, that is, the good silver, which you have brought with faithful devotion as sons of Jacob, which is given without loss and counted out without any expense, since by such a price the detriment of death is shut out and the gain of life is acquired.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 9"
