[[commentary]]
quote='''
And my covenant he says shall be in your flesh. Perhaps it may be retorted at this point: 'How do you call circumcision spiritual, when the oracle says: the covenant of circumcision shall be in your flesh?' As though temperance were required of the soul alone and not of the passions of the body. For a certain purity is required of sight and of hearing and of smell and of taste and of touch and of the voice itself, because a too forward gaze also has guilt, and therefore it is written: Do not give heed to a deceitful woman, nor be taken by the eyes, nor be carried off by the eyelids; and in hearing itself there is guilt, if a harlot seduces you and binds you with much flattery of speech and with the snares of her lips. And in touch itself there is guilt, and therefore it is said to you: Do not be much with a strange woman, nor be held fast in the embraces of one not your own; and in the voice there is fault; for his own lips are a very strong snare to a man, and he is led away by the lips of his own mouth. And do not eat much even of honey, lest you vomit. It is necessary, therefore, that the moderation of all the senses be keen, lest either impulse drag us into vice, or excess harm us, or delay become an offence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
