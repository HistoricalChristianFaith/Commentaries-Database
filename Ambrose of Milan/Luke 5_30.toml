[[commentary]]
quote='''
For by His eating with sinners, He prevents not us also from going to a banquet with the Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
This was the voice of the Devil. This was the first word the Serpent uttered to Eve, Yea hath God said, Ye shall not eat. (Gen. 3:1) So they diffuse the poison of their father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But again the envy of the treacherous is kindled, and the form of their future punishment is prefigured; for while all the faithful are feasting in the kingdom of heaven, the faithless will be cast out hungry. Or, by this is denoted the envy of the Jews, who are afflicted at the salvation of the Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But again the envy of the unbelieving is kindled, and a figure of future punishment is foreshown; for while the faithful feast and recline in that kingdom of heaven, unbelief will be tormented fasting. At the same time it is shown how much difference there is between the devotees of the Law and of grace: that those who follow the Law suffer the eternal hunger of a fasting mind, but those who have received the Word into the inner parts of the soul, refreshed by the abundance of heavenly food and of the fountain, cannot hunger and thirst. And therefore those who were fasting in mind murmured, saying:

Why does he eat and drink with tax collectors and sinners? That voice is the serpent's. Indeed the serpent uttered this as his first word, saying to Eve: Why indeed has God said: Do not eat of every tree? So they pour out their father's venom who say: Why indeed does he eat and drink with tax collectors and sinners?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
