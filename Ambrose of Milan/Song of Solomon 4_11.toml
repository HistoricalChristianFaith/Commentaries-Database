[[commentary]]
quote='''
Your lips, bride, are a dripping honeycomb. Let your works, then, build the honeycomb; for virginity is worthy to be compared to bees, so laborious, so modest, so continent: the bee feeds on dew, knows no mating, makes honey. The virgin's dew, too, is the divine speech, because the words of God descend like dew. The modesty of the virgin is an undefiled nature; the offspring of the virgin is the fruit of the lips, free of bitterness, fertile in sweetness: the labor is in common, common is the fruit. How I would wish you, daughter, to be an imitator of this little bee, whose food is a flower, whose offspring is gathered by the mouth and formed by the mouth. Imitate her, daughter; let your words put forward no veil of guile, have no wrapping of fraud, so that they may both have purity and be full of gravity. Let an eternal posterity of your merits, too, be brought forth for you by your mouth; and gather not for yourself alone, but for many as well; for how do you know when your soul may be required of you? Lest, leaving behind storehouses heaped with grain, which will be of use neither to your life nor to your merits, you be snatched away to where you cannot carry your treasure. Be rich, then, but for the poor, so that those who are sharers of your nature may also be sharers of your means.

Your lips, bride, are a dripping honeycomb. Teach us, Solomon, what the honeycomb is. For you have said: Good words are a honeycomb of honey (Prov. 16:24). And truly good is the honeycomb which the Church eats, fragrant with honey gathered by the spiritual abundance of many prophets, as of bees. This is the honey of which he says: I have eaten my bread with my honey (Song 5:1). The lips of the preacher drip honey when the members of a fallen soul, bruised by hard falls or ruins, are restored. Your lips drip a honeycomb, bride; honey and milk are under your tongue; for the mouth of the just drips wisdom; from the mouth of the just proceed the honeys of sweetness and mercy; in the mouth of the just there is no guile, no deceit, no bitterness of sin. The Church hears the words of the just, the people of God hears the words of the wise, delights in the sweetness of his address, is soothed by the pleasantness of moral discourse, saying: How sweet are your words to my throat, above honey and the honeycomb to my mouth (Ps. 118 (119):103)! For the honey of bees delights for an hour, but its taste soon vanishes, and often unhealthy inner parts are harmed by it; but the honeys of moral words, even if they sting, do not harm.

Yet know to whom these things are to be entrusted; for it is written: Say nothing in the ear of a fool, lest at some time he mock your prudent words (Prov. 23:9). For the fool, who cannot perceive the sweetness of your speech, will vomit it up and reject it. How can the words of God be sweet in your throat, in which there is the bitterness of wickedness? How can there be honey and milk under your tongue, when your tongue frames guile, so that you conceive one thing in your breast and put forward another in public speech, to deceive the unwary? And this though the apostle Peter tells you to put away all malice and cast off the paint of pretense, saying: As newborn infants, rational and without guile, desire milk (1 Pet. 2:2). For, showing us what it is to have honey and milk under the tongue, he teaches that we should know how not to curse those who curse us, but to return a blessing; that we should not know how to hate anything but the way of iniquity, so that with resisting affection we may beware of doing what we detest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
