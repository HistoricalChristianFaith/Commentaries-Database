[[commentary]]
quote='''
But who is this people that owes more, if not we, to whom more has been entrusted? To them were entrusted the oracles of God; to us is entrusted the childbearing of the Virgin. You have as your talent the Virgin's childbearing, you have the hundredfold fruit of faith. Emmanuel, God with us, has been entrusted to us; the Lord's cross, death and resurrection have been entrusted to us. Although Christ suffered for all, yet he suffered especially for us, because he suffered for the Church. And so there is no doubt that he owes more who has received more. And according to men he who owed more perhaps offends more; but through the mercy of the Lord the case is changed, so that he loves more who owed more, if only he obtains grace. For grace is both had by him who repays it, and he who has it pays it in the very fact that he has it; for it is both had by repaying and repaid by having.

And therefore, since there is nothing that we can worthily render to God — for what are we to render for the injury of the flesh he took on, what for the scourges, what for the cross, the death, the burial? — woe to me if I do not love! I dare to say: Peter did not repay, and therefore he loved more; Paul did not repay; he repaid indeed death for death, but other things he did not repay, because he owed much. Hear him saying that he did not repay: who has first given to him, and it shall be repaid him? Though we repay cross for cross, burial for burial, do we repay anything, seeing that from him and through him and in him we have all things? Let us therefore repay love for the debt, charity for the gift, grace for the money; for he loves more to whom more is given.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
