[[commentary]]
quote='''
And therefore let the spear of sinners enter, he says, into their own heart, and let their bows be broken, so that, just as the peace of those who bless returns to the servants of God from those who have not received it, so also the malice of sinners, by which they try to harm the righteous man, may return to their own destruction, so that they are slain by their own weapons and wounds; for often darts are flung back upon the very men who threw them. This happened also in the recent war, when unbelieving and sacrilegious men were attacking one who trusted in the Lord and were striving to go and snatch away his kingdom, threatening the churches of the Lord with savage persecutions: suddenly a wind arose which struck the shields out of the hands of the unbelievers and turned back the darts and missiles of all of them upon the army of the sinner. The enemy was not yet there, and already they could not bear the battle of the winds and were being laid low by their own spears, and, what is worse, those wounds of their bodies were not more grievous than those of their minds; for they failed in heart when they knew that God was fighting against them. And so they had gone out provoking, and from the quiver of their heart were bringing forth the poisoned darts of unbelief against the Christian people, but their ungodliness returned upon their own head. Thus they were broken up among themselves by their own unbelief, and the Lord scattered the snares prepared for the faithful, so that not only could they not harm the devout, but they were stripped of their own auxiliaries, and their own arms passed over to the enemy. How much better had they not brought forth the sword from the sheath, that is, had they by no means uttered ungodly words! For if each one is to render an account for an idle word, how much more will he expiate words of sacrilege with grievous punishments!

You have tried us with fire, says David. All, then, will be tried by fire. And Ezekiel says: Behold, the Lord almighty comes. And who will endure the day of his entrance? Or who will endure when he appears to us? For he himself will enter as the fire of a smelting furnace and as the trough of those who wash. And he will sit smelting and purifying as gold and silver, and he will purify the sons of Levi and will pour them out as gold and as silver, and they will be offering sacrifice to the Lord in equity. By fire, then, the sons of Levi will be purified, by fire Ezekiel, by fire Daniel. But these, although they will be tried through fire, will yet say: We have passed through fire and water. Others will remain in the fire. For the former the fire will fall like dew, as for the Hebrew children, who were thrown into the blaze of the burning furnace; but the avenging fire will burn up the ministers of ungodliness. Woe to me, if my work is burned and I suffer the loss of this labour! Although the Lord will save his servants, we shall be saved through faith, yet so saved as through fire; though we shall not be burned up, yet we shall be burned. How, however, some remain in the fire while others pass through, let divine Scripture teach us in another place. Surely, the people of the Egyptians was drowned in the Red Sea, but the people of the Hebrews passed over; Moses passed through, Pharaoh was cast headlong, since his grievous sins sank him. In that way will the sacrilegious be cast headlong into the lake of burning fire, who have hurled proud insults against God. Let us, then, while placed here, follow the pillar of fire, which may enlighten us while we are placed in this body and show us the way, so that in the future the cloud of night may cool us, whereby we may be able to relieve the fierce burnings.

But see what Scripture says: may the Lord, it says, break the bows of sinners. Yet he set his own bow in the cloud when the floods had ceased, so that calm might be poured back. Hence it is to be believed that the adversary and malignant one bends his bow so as to stir up tempests in quiet minds, to raise up blasts. Let us pray, then, that the Lord our God may break up the bow of malignity, and may stand by his poor and needy man, who through the fear of God does not know that riches are to be striven after, the estates of lesser men seized, widows stripped of the inheritances left by their forefathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
