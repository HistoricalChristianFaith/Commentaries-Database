[[commentary]]
quote='''
Thus Christ desired the beauty of his Church and prepared to take her to himself as wife. But because she was under the Law — for Peter, John and the other apostolic men were under the Law —, he thought that we must first be released from the bonds of bodily observance. For although the Law is religious, the Law is just, as the person of Uriah is presented, because he was so religious and chaste that on returning from the war he did not know his wife again nor go in to her, yet when Uriah came to know of the union of David, that is, of the humble man, the Law was departing from its conjunction with the synagogue and preparing a place for the future wedding of the Church. Hence John too received the type of the Law, who, although he was of the fathers, announced that the ways of the Lord were being prepared and prophesied the union of the Church, and therefore he is presented as slain, to show the failing of the lawful observance; for the Law and the prophets were until John. So Uriah has now been slain in type of the Law, so that the synagogue might be loosed from the snares of the Law, since the woman who is under a husband is bound to the Law while the husband lives, but if the husband has died, she is loosed from the law of the husband. Therefore, while the husband lives, she will be called an adulteress if she has been joined to another man; but if her husband has died, she is freed from the law of the husband, so that she is not an adulteress if she has been with another man. So the human condition is not an adulteress: though it was under the Law, yet, the observance of the Law having been in a certain way abolished, it has been claimed for grace.

Yet it was not Christ who abolished the observance of the Law. Hence too it was not David who killed Uriah, but he allowed him to be killed by the fighters; that is, Christ allowed the rite of the observance that came from the Law to be profaned through the incursion of the barbarians and the captivity of the Jews. Accordingly, Uriah means "my light". And what is the light of Christ but the Law and the Gospel? — For if you believed Moses, you would believe me also; for he wrote of me — because the light of Christ went before in the Law, and afterwards his grace in the Gospel, as in a seven-lamped Spirit, filled all things of this world. From this Law, then, he took away the flesh and joined the Church to himself. The light of this Law the hostile people diminished, when they violated the holy things of the Law. So the light of God was diminished in the people of the Jews, because blindness has befallen Israel in part, until the fullness of the Gentiles should come in, and so all Israel should be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 9"
