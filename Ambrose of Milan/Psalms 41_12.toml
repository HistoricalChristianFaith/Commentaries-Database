[[commentary]]
quote='''
There follows: but because of my innocence you have received me and have confirmed me in your sight for ever. Blessed be the Lord God of Israel for ever, from age to age; so be it, so be it. The innocent man harms no one, sins against no one. Therefore Christ is designated by the authority of divine Scripture as without sin, without guile; this, then, is declared here too, where he says: but because of my innocence you have received me. But what receiving is signified? For elsewhere too we read: you received me from my mother's womb. Since, then, he who was born of the Spirit and the Virgin was born clean of every concretion of human generation, the Father received him for this reason, because no customary concretion of bodily generation darkened his birth. He received him rising again, because no offence of a lapse had bespattered him. Immaculate he returned to the Father, from whom immaculate he went forth when he descended to earth. Whence the Father says to him: you are my Son, today I have begotten you, that is: I recognize in you the privilege of my generation, you whom no stain of sin could defile. You lived among sinners, you took up the sins of all, you were made sin for all, you were made a curse for all, but no practice of sin could pass over to you. So you lived among sinners as though you were living among angels. You made the earth to be what heaven is, so that there too you might take away sin. Today I have begotten you, in whom I am well pleased. You have proved yourself the Son, you who have fulfilled the Father's will in all things. Today I have begotten you, in whom I recognize the light of an immaculate offspring. Yesterday and today you are the same to me, and for ever. There is no night in you, because you are wholly day. Rightly is he said to be confirmed in the sight of the Father for ever, because he is always with the Father and truly in the sight of him whose brightness of glory and image of substance he is. But just as the Father is well pleased in the Son, so the Son too blesses the Father; for the Father honours the Son and the Son honours the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
