[[commentary]]
quote='''
Those, then, are the heel of whom he says: who trust in their own power and glory in the abundance of their riches; for the rich, indeed, have been in want and have hungered. This was said of the Jews; but all those too who live luxuriously and do not hold the head are the heel of Christ. But these are general things, which extend widely; specifically, however, he spoke of Judas the traitor, who seemed to himself strong and rich in the glory of the apostleship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
