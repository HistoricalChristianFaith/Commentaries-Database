[[commentary]]
quote='''
He was a little one who said: Lord, I did not exalt my heart, nor were my eyes lifted up, nor did I walk in great things nor in wonderful things above me. And that you might know that this one was little not in age, not in understanding, but by his humility and a certain turning away from boasting, he added: but I exalted my soul. Do you see how lofty this little one was, on how high a summit of the virtues?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
