[[commentary]]
quote='''
But if you again remind me of your grief because he departed so early from life, I certainly do not deny that he died at an untimely age, one whom we would have wished to support with time taken from our own life, that he might live out of our own years who could not complete his own. But I ask whether or not there is any consciousness after death? If there is, he is alive; no, rather, because there is, he now enjoys eternal life. For how does he not possess consciousness whose soul lives and flourishes and will return to the body, and will make that body live again when it has been reunited with it? The apostle cries out, "We would not, brothers, have you ignorant concerning those who are asleep, lest you should grieve, even as others who have no hope. For we believe that Jesus died and rose again, so with him God will bring those also who have fallen asleep through Jesus." Life, therefore, awaits them for whom resurrection awaits.
'''
source_url=''
source_title="CONSOLATION ON THE DEATH OF EMPEROR VALENTINIAN 43-44"

[[commentary]]
quote='''
A man of this purpose, then, is neither diminished by losses, nor broken by adversities, nor held back by barriers, nor saddened by the loss of his own. For his instruction the Apostle says: we do not want you to be ignorant, brothers, about those who are asleep, so that you may not be sad, as also the others who have no hope. For he consoles himself with faith in the resurrection and with the grace of the reward to come, and he does not admit sadness into that mind by which he clings to God, and he rejoices in the delight of the divine presence. But he who is saddened by these things is not saddened according to God, and what is not according to God is full of folly. Far from the perfect man, then, is the sadness of this world, which is not according to God, and every anxiety over bodily hardship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 7"
