[[commentary]]
quote='''
You are all fair, my nearest one, and there is no reproach in you. Who, indeed, can reckon any beauty greater than the beauty of her who is loved by the king, approved by the judge, dedicated to the Lord, consecrated to God? Always a bride, always unwedded; so that neither does love have an end, nor modesty a loss. This assuredly is true beauty, which lacks nothing, which alone deserves to hear from the Lord: You are all fair, my nearest one, and there is no reproach in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
