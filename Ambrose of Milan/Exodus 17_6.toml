[[commentary]]
quote='''
The people of the fathers thirsted, Moses touched the rock, and water flowed out of the rock. Did not grace work a result contrary to nature, so that the rock poured forth water, which by nature it did not contain?
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 9.51"


[[commentary]]
quote='''
It does not surpass faith that a virgin gave birth, when we read that even a rock poured out water and that the waves of the sea were made solid in the form of a wall. 
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252041-50.html'
source_title="Letter 42.7"

[[commentary]]
quote='''
Likewise we know that Moses tempered for his thirsting people the bitterness of waters, not wines. To him for whom the rock poured forth water even an abundance of wine could not be lacking. Therefore, God said: Thou shalt strike the rock, and water shall come out and the people shall drink. He did not say: "Wine will come out of it among the people;" for it was dangerous to serve wine, which even the stronger men could scarcely take.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 5"
