[[commentary]]
quote='''
This, then, is a passage of precept about praying often, about the hope of obtaining, about the way of persuading, first in a precept, afterwards in an example. For he who promises something ought to bring hope of what is promised, so that obedience may be paid to admonitions and faith to promises; and faith, by contemplating human loving-kindness, gains a greater hope of eternal loving-kindness, provided, however, that just things are asked, lest prayer be turned into sin. Nor was he ashamed to ask for something rather often, lest he should seem either to distrust the Lord's mercy or arrogantly to resent that he had not obtained something at the first prayer — for this he says I asked the Lord three times —; and he shows that God often does not grant what is prayed for, because he judges useless the things that we believe will profit us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
