[[commentary]]
quote='''
And what can the ten cities be, unless perhaps souls, over which he is rightly set who has lent out at interest to the minds of men the money of the Lord and those chaste words, tried like silver? For as Jerusalem is said to be built as a city, so are peaceful souls. And as the angels preside, so too do those who have merited the life of the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
