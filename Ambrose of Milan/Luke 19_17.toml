[[commentary]]
quote='''
And what can the ten cities be, unless perhaps souls, over which he is rightly set who has lent out at interest to the minds of men the money of the Lord and those chaste words, tried like silver? For as Jerusalem is said to be built as a city, so are peaceful souls. And as the angels preside, so too do those who have merited the life of the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Hence the Lord also says: But when they pursue you in this city, flee into another. Amen I say to you, you will not finish the cities of Israel until the Son of Man comes. For although he seems to urge flight upon us because of the weakness of the flesh, yet he flees better who flees worldly enticement, so that he is not held by anxiety for his riches, nor by the contemplation of his treasure, nor by desire for this life, but with the intent of his mind set straight hastens to the glory of the heavenly kingdom, hurries to the crown, and is not called back from the passion of his own body by gazing on earthly things.

Flight, therefore, is a death, either enacted or foreshadowed. And perhaps he expresses those cities of lawful refuge, so that we may flee to the summits of the virtues, which elsewhere he dispenses as rewards to the good money-lender, saying: Because you have been faithful in a little, you shall have power over ten cities. The Law knows six cities; but because he who could say: I have not come to destroy the law, but to fulfil it, has fulfilled the Law, he grants a more perfect number of reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
