[[commentary]]
quote='''
Who for a long time he says was driven, inasmuch as he was harassed from the flood until the coming of the Lord, bursting the bonds of nature with mad fury. And not without reason did Saint Matthew also indicate that they dwelt in the tombs, since the souls of such men seem to dwell in certain mounds of sepulchres. For what else are the bodies of unbelievers but certain sepulchres of the dead, in which the words of God do not dwell? He was driven, then, into desert places, that is, barren of spiritual virtues, a fugitive from the Law, cut off from the prophets, far removed from grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
