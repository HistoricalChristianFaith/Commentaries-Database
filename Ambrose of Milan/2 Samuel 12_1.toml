[[commentary]]
quote='''
But now let us seek the mystery. There were two men, he says, in one city, one rich and the other poor. Who is this rich man or poor man, unless perhaps the one is the people of the Jews, the other the Christian people? That one is rich in the Law, rich in the words of God entrusted to him, rich in prophecies, rich in oracles; but this one is poor. But do not flee from this poverty, which the kingdom of heaven follows; for it is written: Blessed are the poor in spirit, for theirs is the kingdom of heaven. A good poverty, which does not lose what it has had! A good poverty, which, if it has no treasures of money, yet has treasures of knowledge and wisdom! Do not, children, despise poverty as something cheap; this poor man cried and the Lord hears him. Do not envy riches as though they were great; the rich have been in want and have hungered. But if you wish to have good things, seek the Lord; those who seek indeed the Lord shall not be lacking in any good. Therefore do not reject any poor man. Peter was poor and had no small coin to give, but he gave salvation, more precious than all money. Poor was that Lazarus in the Gospel; but he who before reclined rich in crimson and purple wished, after the end of his life, to be refreshed by the dripping finger of the poor man. Although that rich man, proud in royal crimson and purpled garments, fastidious, shuddered at the poor man's wounds, yet, placed in the underworld, he wished he had been in the place where Lazarus was. In this place the reading does not seem to describe a rich man and a poor man in terms of money, but that poor man who for faith and devotion did not shudder at the wounds of the body, and endured hunger and fasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 11"
