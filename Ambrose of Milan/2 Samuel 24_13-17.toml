[[commentary]]
quote='''
And perhaps to some who read carelessly it may seem harsh that David, that man humble of heart and meek, who spared his enemies, chose the death of the people rather than his own flight or famine upon the land. He avoided the famine of the people, because it is held heavier than death and all torments, and pestilence too follows it, which pollutes the sky and heaps up death. He did not ask for his own flight for this reason, because the prophet could intercede for the people, as was done, but the people could not intervene for the prophet. For it is written: If the people goes astray, the priest will pray for it. If the priest goes astray, who will ask for him? And yet, when he saw the people being slain, he offered himself to the striking angel, so that he himself might rather be struck for the people. That, not terrified even by the very sight of the dead, he offered himself to the sword, is more than if he had wished for the remission of the condition proposed. In the choice, then, he followed reason; in the grief, dutiful love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
