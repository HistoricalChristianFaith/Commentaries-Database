
[[commentary]]
quote='''
Thus Christ, by doing the will of the Father, fulfilled the law, and therefore he is the end of the law and the fullness of charity, because, loving the Father, he applied his whole effect to his will. Hence the Apostle said, by way of glory: But when all things have been subjected to him, then he himself also will be subject to him who subjected all things to himself, that God may be all in all, and he himself says of himself: Is not my soul subject to God? For from him is my salvation. Thus it was out of dutiful love, not out of weakness, that he was subject to his parents Joseph and Mary. But the greatest glory of Christ is that he pours himself into the hearts of all men and calls all back from the ungodliness of unbelief and from the disposition of heathenism, so as to make them subject to himself. But when he has subjected all things to himself, when the fullness of the Gentiles has entered and all Israel has been saved and in the whole world there is one body in Christ, then he himself also will be subject, offering his gift to God the Father, and as it were the prince of all priests and possessed of the heavenly altars, so that the faith of all may be the sacrifice. This subjection, then, belongs to loving-kindness, in that the Lord Jesus will be subject in the body, whose body and members we are. Be subject, then, O man, to Christ, that is: subject to the wisdom of God, subject to the Word, subject to righteousness, subject to power, because Christ is all these things. Let every man subject himself to God; for he teaches not one but all, that they should subject their heart, subject their soul, subject their flesh, so that God may be all and in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Subjection, then, is the teaching of human virtue, not a lessening of divine power. For if they call the Son less than and unequal to the Father because he was subject to God the Father, is he then also less than his mother because he was subject to his mother? For it is read of Joseph and Mary: And he was subject to them. But dutiful love is not a loss to us all but a gain, the dutiful love through which the Lord Jesus poured faith and grace into us all, so as to make us subject to God the Father with a faithful spirit. And therefore by a new and deep counsel the Apostle says that he himself will be subject to the Father in us, when there is in all men the fullness of faith and a kind of unity of devotion. For now, as long as we disagree in our opinions, we in a manner lessen the kingdom of Christ, because not yet are all things subjected to him whose kingdom is unity; but when all things have been subjected to him, then he himself also shall be subject to him who subjected all things to himself, that God may be all in all, as it is written. For now he is above all by power, but there is need that he be in all by will; and he will so will when he knows that all things in us are full of him and empty of sins. Not yet, then, is he subject to the Father, because not yet is Christ all and in all; but when Christ is all and in all, God will be all and in all. Hence it is gathered that the kingdom of the Father and of the Son and also of the Holy Spirit is one, because he who has received the Son receives also the Father, receives also the Holy Spirit, because the power of the Trinity is one, its grace one, its working one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
