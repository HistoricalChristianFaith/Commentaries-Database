[[commentary]]
quote='''
Scripture has taught us to sing with gravity, to sing psalms spiritually; it has taught us also to dance wisely, when the Lord says to Ezekiel: clap with your hand and stamp with your foot; for God, the censor of morals, would not demand the actor's movements of a loose body, nor would he command of men unseemly clatterings and womanish clappings, so as to bring so great a prophet down to the mockeries of the stage and the softness of women. The revealed mysteries of the resurrection do not agree with the disgraces of dancing exacted. There is indeed, there is a clapping proper to good deeds and acts, whose sound may go out into the world and the glory of things well done may resound; there is an honorable dancing, in which the mind leaps for joy and the body is lifted up by good works, when we hang our instruments upon the willows.

The prophet, then, is bidden to clap with his hand and stamp with his foot, he is bidden to sing psalms, because he already saw the wedding of the Bridegroom, in which the Church is betrothed and Christ is loved. And good is the wedding, when the soul is wedded to the Word, the flesh to the Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
