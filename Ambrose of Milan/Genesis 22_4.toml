[[commentary]]
quote='''
And he came on the third day to the place which God had told him. And he himself sets out as the third with two, leading his victim, and on the third day comes to the place of sacrifice. This number is a saving one and fitting for those who are to sacrifice. Thus later too Moses says to Pharaoh king of Egypt: we will go a journey of three days and sacrifice to the Lord our God, as he told us. And rightly the sacrifice of the Trinity is celebrated on the third day.

And Abraham, looking about, saw the place with his eyes from afar. He who hastens to fulfil a task searches carefully. Although he quickened his aged step with zeal, yet, thinking this too slow, he went ahead with his eyes. The functions of each of his members were vigorous, though aged members could not be vigorous. The sight of old men is usually dulled, so that they do not easily make out even things close at hand. This man not only saw the place, but even beheld it while placed far off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
