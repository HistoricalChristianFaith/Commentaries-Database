[[commentary]]
quote='''
Whence he says has wisdom been found, or what is the place of discipline? Mortal man does not know its way, nor has it been found among men. The abyss said: It is not in me; and the sea said: It is not with me. It is not permitted to you, O man, to know the heights of wisdom; therefore it is written for you: Do not be high-minded, but fear. Why do you curiously desire to search out what it is not expedient for you to know, nor given you to learn? Paul heard certain secrets of wisdom which he was forbidden to make known to others, and therefore he was caught up into paradise, caught up even to the third heaven, that he might hear the things which, placed on earth, he could not hear. If the things that a man heard he was not permitted to speak, how does he inquire into what he has not heard? You are not permitted to know the counsels of this emperor on earth, and you want to know the divine counsels? You are not permitted to search too curiously into what is done on earth, and do you inquire too curiously what is done above the heaven? Why do you dispute whence wisdom was born? Man does not know its way, nor has perfect wisdom been found among men. It was not in Moses, not in Aaron, not in Joshua son of Nun, not in David himself, who says: You have made manifest to me the uncertain and hidden things of your wisdom, since he himself said in later verses: I became like a beast of burden before you. To know the height of wisdom is above you, O man; it is enough for you to believe. For if you do not believe, he says, neither will you understand. You cannot know the abyss, you cannot comprehend the abyss; how will you comprehend the height of wisdom? The abyss said: It is not in me, and can you say that wisdom is in you?

The abyss, then, said: It is not in me, because the Lord himself said: You will not leave my soul in the underworld. And the Apostle said: Who has descended into the abyss? That is, to bring Christ up from the dead. So if the abyss is asked: Where is wisdom? it answers: It is not in me, because he has risen. If the sea is asked: Where is wisdom? it says: It is not with me, because he trod upon me, and my waves could not trouble it. You too, then, set in this strait of the present world, do not seek that perfect wisdom of God in this world, because the world did not know it. But if you wish to find it, tread upon the waves of this world, as Peter trod upon them, and walk upon the waters of this age. Wisdom will stretch out her right hand to you, as she stretched it out to Peter too, for there has been no one whom the wave of this world has not troubled. It troubled Abraham too, it troubled Moses too, it troubled Peter too. Moses crossed through the sea and led an army on foot through the sea, but first he himself was troubled. Peter trod upon the waters, but he had sunk in body, because he limped with the footstep of a weaker faith. Do not, therefore, seek wisdom in the sea, because the Lord Jesus did not say that he would be with the sea, but with his apostles, that they might know him in some part; to them he says: Behold, I am with you until the consummation of the world. Blessed are they with whom he is: would that he were with us too, but the sea is with us. Peter was with Christ, because he too trod upon the sea: to us gold and silver are dear to the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
