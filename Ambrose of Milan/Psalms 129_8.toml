[[commentary]]
quote='''
Let us flee from here, because the time is short. Hear how you are to flee: And let those who have wives be as if they had none, and those who weep as though they were not weeping, and those who rejoice as though they were not rejoicing, and those who buy as though they were not possessing, and those who use this world as though they did not use it; for the form of this world is passing away. Let not our works, then, pass away with the passing form of the world, lest we ourselves also pass away; but let us remain in the truth. If we remain in Christ, we remain in the truth, and we shall remain with him and shall not pass away, but we shall say: The blessing of the Lord be upon you; we bless you in the name of the Lord. For those who pass by cannot say it, because those who passed by the way did not say: The blessing of the Lord be upon you, as the prophet said. So if we wish our works not to pass away, let us not pass by the commandment of God, let us not pass by the diligence of seeking the Lord Jesus, of earning his grace. That woman did not pass him by. She, going even into the house of the Pharisee, in which Christ was reclining, poured out ointment upon his feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
