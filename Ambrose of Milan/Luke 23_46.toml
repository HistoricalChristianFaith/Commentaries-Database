[[commentary]]
quote='''
The flesh dies that the Spirit may rise again. The Spirit is commended to the Father, that heavenly things also may be loosed from the chain of iniquity, and peace be made in heaven, which earthly things should follow.

His spirit then is commended to God, but though He is above He yet gives light to the parts below the earth, that all things may be redeemed. For Christ is all things, and in Christ are all things.

He gave up His Spirit, because He did not lose it as one unwilling; for what a man sends forth is voluntary, what he loses, compulsory.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And therefore he says: Into your hands, Lord, I commend my spirit. And well is the spirit commended which is kept in reserve; for what is commended is certainly not lost. The spirit, then, is a good pledge, a good deposit. Whence that man too says: O Timothy, guard the good deposit. For the spirit is commended to the Father, and therefore he says: For you will not leave my soul in the underworld. But see a great mystery. Now he commends his spirit into the hands of the Father, now he sits in the bosom of the Father, because no other holds the whole Christ. Indeed I he says am in the Father and the Father in me. The spirit, therefore, is commended to the Father. But while it is in the higher places, it illumines the underworld too, that all things may be redeemed; for indeed Christ is all things and in Christ are all things, although Christ works in each one. The flesh dies, that it may rise again; the spirit is commended to the Father, that heavenly things too might be loosed from the bond of iniquity and there might be peace in heaven, which earthly things would follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
And having said this he gave up the spirit. And well gave up, he who lost it not unwillingly. Indeed Matthew says: he sent forth the spirit; for what is sent forth is voluntary, what is lost is of necessity. Therefore he added: with a loud voice. In this there is either the glorious profession that he had descended even to death for our sins — so neither shall I blush to confess what Christ did not blush to profess with a loud voice — or the evident manifestation of God testifying to the separation of the divinity and the body. For so you have: Jesus cried with a loud voice, saying: God, my God, look upon me! Why have you forsaken me? The man cried out, about to die by the separation of the divinity. For since the divinity is free of death, there could certainly be no death unless life departed, because the divinity is life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
