[[commentary]]
quote='''
And how splendid it was that, when three conditions were offered him, to choose whichever he wished, after he had incurred offense by numbering the people: when it was put to him whether he wished a famine to come upon the land for three years, or to flee for three months from the face of his enemies pursuing him, or death to come upon the land for three days, he chose the third, because he preferred to commit himself to the power of the Lord rather than to that of men; for the Lord, quickly moved to compassion, would forgive. And so he speaks thus: I am in very great straits in these three, but I will rather fall into the hand of the Lord, for his mercy is very great, than fall into the hands of men. By this humility, prudence and gentleness he brought it about, to use the words of Scripture, that the Lord repented of his own wrath. And so it is written that the Lord repented of the evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
