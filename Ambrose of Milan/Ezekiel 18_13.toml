[[commentary]]
quote='''
If anyone takes usury, commits robbery, he does not live by life, as you have it in Ezekiel. But if anyone who is just keeps the ordinances of the Lord so as to do them, 'by life,' he says, 'he shall live and he shall live in them'. He, then, is in the region of the living, in that region where life is not hidden but free, where there is no shadow but glory; for here not even Paul himself lived in glory. Indeed, he groaned in the body of death. Hear him saying: for now our life is hidden with Christ in God; but when Christ, our life, appears, then we too shall appear with him in glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
