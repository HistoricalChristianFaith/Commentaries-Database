[[commentary]]
quote='''
But how will he be able to be in want who all the day has mercy and lends? What is it that the righteous man lends? Not bronze, not iron, not lead, but silver tried by fire. This he brings to the table of the Lord and divides among those who seek it; to one one mina, to another two, to another five he divides daily, and it never fails. But we have heard that lending at interest was censured in the Law, when Moses says: You shall not lend at interest. Lending is twofold, one of money, the other of grace. Divide the two, because it is written: If you offer rightly but do not divide rightly, you have sinned; be still. And you, divide rightly, lest you sin. Let Moses himself teach you to divide, who warned that one must divide rightly, so that you may follow what Abel did, who divided rightly, and flee what Cain was; he was a fratricide who did not know how to divide rightly. The Holy Spirit, then, divides the divisions, who works all things, dividing to each as he wills. He as he wills, you as you can, as you are able by your talent. Distinguish when the Law speaks of money, when of grace. For it said to you: You shall lend to the nations — that of which the Lord exacts interest — but you shall not borrow. There is the money of lending, and there is also grace, of which the Lord exacts interest; the money of lending holds bronze, grace confers faith. Lend, then, faith to the nations, so that grace may abound for you; but do not borrow as one in need, but lend as one rich and wealthy. Peter lent, Paul lent, John the Evangelist lent, or both of them, and were not in need, that is: they lent the money of Christ, they did not lend moneys at usury. Lend, then, and do not cease to lend. Do you hear what Scripture says: All the day he has mercy and lends? The righteous man lends by day, the avaricious man at night; for grace belongs to the light, but avarice is the usury of darkness. And therefore the seed of him who lends faith shall be in blessing, having indeed the reward of blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And lest they break out afresh in the same way and say that they are even urged to usury by the pronouncement of the Law, because it is written: Thou shalt lend to many nations and shalt not borrow, it is seasonable to discuss more fully and expressly and to teach what ought to be loaned at usury and to whom the statutes of the law command it; for the question of usury precedes the question of pledge. The sinner shall borrow, it says, and not pay, but the just showeth mercy and giveth. You hear, debtor, what you ought to avoid; you hear, creditor, what you ought to imitate. And below: I have been young and am old and I have not seen the just forsaken nor his seed seeking bread. He sheweth mercy and lendeth the day long. Whence has this man what he may lend the day long? Is then the just man rich, and the richer each one may be, the more just? He, who has more from which he may lend, will he be more just? But hardly does a rich man enter into the kingdom of heaven.

What then he should lend, tell me, Holy David! I have brought witness against myself unless you help me. Peter said, Silver and gold I have none. Was he then not just? Explain to me then, what he should lend. For you have said: Blessed is the man that showeth mercy and lendeth: he shall order his words with judgment. I have found what the just man lends. But let Peter, moreover, teach me himself also what he may lend, who said to the helpless man looking earnestly at him and John: Silver and gold I have none. Will you then give nothing to the poor man, apostle? But you do give, and you give more than others, you give to the helpless man what others cannot give, you give to the helpless man that after receiving which he cannot lack, you give to the helpless man what even the rich long to receive, you give to the helpless man what those who have that silver and gold cannot bestow, because greed hinders them. You give to the helpless man, you who make him richer than the rich. You have moved my heart, I long for this gift of thine. Tell, I beseech, what you give. Do not keep me long in suspense; I desire to seek if you pay quickly. But you did pay quickly; you did not put off the needy, you did not despise the prayer of the poor, you did not make him despair longer, you did not go empty up to the temple, saying: Silver and gold I have none. Not they alone go up with full hands who have gold and silver; the poor man also does not go up empty, nor did Peter go up empty because he had not gold and silver. Let us hear what the poor man gives. But what I have, he said, I give thee. In the name of Jesus of Nazareth, arise and walk. O poverty greatly to be desired, O richer want! He was lame to whom the rich gave; one poor man gave, and straightway he who was lame was made whole.

The just man therefore has what he may lend, he has even silver which he may lend: he lends his words. This is the just man's silver, for the words of the Lord are pure words, silver tried by the fire, purged of earth, refined seven times.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 18"
