[[commentary]]
quote='''
Yet where we read of the great Church elsewhere: I will confess to you, Lord, in the great Church; in a weighty people I will praise you, there, then, is the great Church where the people is weighty, that is, not restless and fickle, like the one which sat down to eat and drink and rose up to play. A weighty people is one which keeps faith with its God, and which is not changed by any levity nor wavers and fluctuates, but is founded in love in Christ, so that it can say: for I am confident that neither death nor sword nor tribulation can separate me from the love of God which is in Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
