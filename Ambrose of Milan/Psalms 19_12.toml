[[commentary]]
quote='''
It is no small thing for each one to acknowledge his sin. And therefore he also said above: Who will understand falls? That is, who is so great as to understand them? As in that saying: Who will dwell in your tabernacle?, or: Who will ascend into the mountain of the Lord? Not, surely, no one, but few; for he who can acknowledge can turn aside, can choose what he should follow. Many glory in their falls and think those things matters for praise which are matters for accusation: if a man has defiled another's bed and overcome the affection of a chaste woman, if he has by some fraud changed a widow's resolve; another thinks that murder, the ambushes of brigandage and living by plunder count as virtue; some judge that to circumvent and deceive belongs to wisdom. None of these can say: For I acknowledge my iniquity, but only he who can grieve for what he has done and condemn the wrong he has done, he whom his vices prick.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 9"
