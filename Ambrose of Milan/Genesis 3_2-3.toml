[[commentary]]
quote='''
At this point there are some who doubt whether God meant that the fruit of every tree should be eaten—this injunction to include every tree, inclusive of the tree of the knowledge of good and evil—or whether, in fact, He referred to every tree, but excluded only the tree of knowledge of good and evil? These people are of the opinion that this matter is not without significance, because, although the fruit of this tree is harmful in itself, still, if it were combined with that of the other trees, it could not be injurious. They cite as example of this fact the belief that an antidote can be obtained from the body of a serpent which, being poisonous since it is extracted from a serpent, is harmful when taken alone, but when mixed with other drugs has medicinal properties. The knowledge of good and evil, also, if one possesses wisdom that is ever an aid toward survival and if one reaches out after the other types of virtue, is considered to be of no inconsiderable value. On that account, therefore, many hold that we can even understand the reason why God made this prohibition. He did not wish that tree of the knowledge of good and evil should be eaten alone and not in combination with the fruit of the others. He did not prohibit this if the other trees are taken into consideration at the same time. Wherefore what God said to Adam is cited: Who told you that you were naked? You have eaten, then, of the tree which alone I commanded you not to eat. This would seem to offer an occasion for disputation. In the preceding passage the woman might well have not made any reply to the serpent's question: Did God say, you shall not eat of any tree of the garden? But she answered: Of the tree in the middle of the garden, God said, you shall not eat of it. In this incident, as she was on the point of sinning, the woman's faith may appear to have been weak. Moreover, I shall not despoil Adam of all the virtues, so that he would appear to have attained no virtue in Paradise and would seem to have eaten nothing from the other trees, but had fallen into sin before he had obtained any fruit. I shall, therefore, not despoil Adam lest I may despoil the whole human race, which is innocent before it acquires the capacity to know good and evil. Not without reason was it said: Unless you turn and become like this child, you shall not enter into the kingdom of heaven. The child, when he is scolded, does not retaliate. When he is struck, he does not strike back. He is not conscious of the allurements of ambition and self-seeking.

The truth seems to be, then, that He commanded the tree not to be eaten, not even along with the fruit of the other trees. Knowledge of good, in fact, although of no use to a perfect man, is, on the other hand, of no value to a man who is imperfect. Paul speaks of himself as imperfect: Not that I have already obtained this or already have been made perfect, but I press on hoping that I may lay hold of it already. Hence the Lord says to the imperfect: Do not judge that you may not be judged. Knowledge is, therefore, of no use to the imperfect. Hence we read: I did not know sin unless the Law had said, thou shalt not lust. And further on we read: For without the Law sin is dead. What advantage is it to me to know what I cannot avoid? What avails it for me to know that the law of my flesh assails me? Paul is assailed and sees the law of his flesh warring against that of his mind and making him prisoner to the law of sin. He does not rely on himself, but by the grace of Christ is confident of his deliverance from the body of death. Do you think that anyone with knowledge of sin can avoid it? Paul says: For I do not the good that I wish, but the evil that I do not wish. Do you consider that this knowledge which adds to the reproach of sin can be of help to man? Granted, however, that the perfect man is unable to sin. God foresaw all men in the person of Adam. Hence it was not fitting that the human race in general should have a knowledge of good and evil—a knowledge which he could not utilize because of the weakness of the flesh.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"
