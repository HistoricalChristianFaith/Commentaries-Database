[[commentary]]
quote='''
Now he says dismiss your servant. See the just man, shut up as it were in the prison of the bodily mass, wishing to be dissolved, so that he may begin to be with Christ; to be dissolved indeed and to be with Christ is far better. But let him who wishes to be dismissed come into the temple, come into Jerusalem, wait for the Christ of the Lord, receive the Word of God in his hands and embrace him as it were with the arms of his faith. Then he will be dismissed, so as not to see death, he who has seen life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
