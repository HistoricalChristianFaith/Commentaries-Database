[[commentary]]
quote='''
For an evil sickness is the sickness of error, the sickness of avarice, the sickness of insatiable desire. These are riches, as Ecclesiastes says: there is an evil sickness which I have seen under the sun: riches kept to the harm of him who possesses them. Tell me, O Ecclesiastes, for what cause this sickness is evil. He will answer: because greedy hope devours many. The voracity of desire is insatiable; he who covets silver does not know how to be sated with silver. Riches distend, they do not fill. Even if one has been sated with riches, there is no one, he says, who lets him sleep. And indeed all his days are in darkness and mourning and much wrath and sickness and anger. For how can he sleep who keeps anxious guard over gold, who dreads losses, who ponders gains, who reckons interest, who counts his storehouses? Evil, then, is the sickness that takes away the good rest of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For what is a rich man unless a kind of insatiable whirl-pool of riches, an insatiable hunger and thirst for gold? The more he drinks, the more he is set on fire. He that loveth silver, he says, shall not be satisfied with silver, and below: And this is a most deplorable evil; as he came, so has he departed; and his abundance laboreth for the wind. And all his days are in darkness and sorrow and in great anger and evil and passion, so that the condition of slaves is more endurable, for they serve men, but he, sin; for he who commits sin is the servant of sin. He is always in snares, always in bonds; never is he free from shackles because he is always in crimes. How wretched a servitude it is to serve sin!

He knows not the functions of nature itself, nor does he know even the regular successions of sleep, nor does he enjoy the sweetness of food, of which things no servitude is deprived: For sleep is sweet to a slave, whether he eat little or much, but as regards him that is filled with riches, there is none that alloweth him to sleep. Cupidity excites him, his ever-wakeful anxiety to plunder another's property disturbs him, he is tormented by envy, peeved by delay, worried by the unfruitful sterility of his crops, and troubled by abundance. Wherefore, to that rich man whose possession brought him abundant fruits, and who thought within himself, saying: What shall I do, because I have no room where to gather my fruits? And he said: This will I do: I will pull down my barns, and I will build greater; and into them will I gather all things that are grown to me, and I will say to my soul: Soul, thou hast much goods laid up for many years, take thy rest, eat, drink and make good cheer, God answered: Thou fool, this night do they require thy soul of thee; and whose shall those things be which thou hast provided? Not even God himself permits him to sleep; He troubles him as he thinks, and rouses him when he slumbers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 6"
