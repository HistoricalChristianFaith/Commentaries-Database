[[commentary]]
quote='''
For an evil sickness is the sickness of error, the sickness of avarice, the sickness of insatiable desire. These are riches, as Ecclesiastes says: there is an evil sickness which I have seen under the sun: riches kept to the harm of him who possesses them. Tell me, O Ecclesiastes, for what cause this sickness is evil. He will answer: because greedy hope devours many. The voracity of desire is insatiable; he who covets silver does not know how to be sated with silver. Riches distend, they do not fill. Even if one has been sated with riches, there is no one, he says, who lets him sleep. And indeed all his days are in darkness and mourning and much wrath and sickness and anger. For how can he sleep who keeps anxious guard over gold, who dreads losses, who ponders gains, who reckons interest, who counts his storehouses? Evil, then, is the sickness that takes away the good rest of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
