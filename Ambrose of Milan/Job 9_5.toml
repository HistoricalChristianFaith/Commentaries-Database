[[commentary]]
quote='''
For how shall a mortal be just before the Lord? For if he should wish to contend with him in judgment, he will not hear him, so that he may not contradict one word of his with a thousand speeches. For he is wise in understanding, and strong and great. Who is so hard that he can stand in his sight? He who makes the mountains grow old, and they do not know, and overturns them in his wrath; who shakes the whole earth from its foundations, and its pillars are moved; who speaks to the sun, and it does not rise, and sets his seal against the stars; who alone stretches out the heaven and walks as on a pavement upon the sea; who makes the Pleiades and the evening star and the north and the ministry of the south wind; who does great and unsearchable things, glorious and immense, of which there is no number. If he passes by me, I shall not see, and if he has gone past me, not even so shall I know. With how much more vehement a trumpet has this man sounded forth about the Lord's power? But in it there is help for the just, not ruin. In fact, it is power that seems to be expressed, but rather the mysteries of our redemption are declared.

For who are the mountains which he made grow old but Moses, Aaron, Joshua son of Nun, Gideon, the prophets, all the books of the Old Testament? The Lord Jesus came: he brought a New Testament, and what had been before was made old. The Christian has been made new, the Jew has grown old: grace has been renewed, the letter has grown old. He has overturned the mountains and turned them about. For he overturned and undermined the understanding according to the letter and established the spiritual understanding. That carnal understanding of the Law, then, has vanished: it has become spiritual. Hence the Apostle says: But we know that the Law is spiritual, but I am carnal. But he too who was carnal has himself become spiritual, as he himself declared, saying: For I think that I too have the Spirit of God. These mountains, then, Jesus has made grow old, and the Jews do not know. For if they had known, they would never have crucified the Lord of majesty, they would never still be following Jewish ravings. They, then, are the ones who do not know. Hence in the Gospel too the Lord Jesus says: Forgive them, Father, because they do not know what they do.

But they are not excused because they do not know, since they are unwilling to know what they ought to have recognized. Certainly we do not begrudge them, if they follow the Lord's sentence; for a sentence usually absolves what is past, not what is to come. But neither is he free from crime who crucified the author of his own salvation and afterwards did not ask for pardon. Granted that before he did not know whom he was persecuting: yet he ought to have recognized the one placed on the cross as the Lord of all the elements, under whom all the elements trembled, the heaven was darkened, the sun fled back, the earth burst apart, the tombs of the dead lay open, the dead received again the company of the living. Hence the centurion too said: Truly this was the Son of God. The centurion acknowledges one not his own, the Levite does not recognize his own: the Gentile worships, the Hebrew abjures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapters 4-5"
