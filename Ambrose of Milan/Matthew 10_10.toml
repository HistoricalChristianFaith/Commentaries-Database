[[commentary]]
quote='''
The apostles are bidden not to take staffs in their hand; for so Matthew thought it should be written. What is a staff but the badge of power displayed and the instrument for avenging pain? So the disciples of the humble Lord — for in humility his judgment was taken away —, of the humble Lord, I say, carry out his precept by the duties of humility; for he sent them to sow the faith, men who would not compel but teach, nor put forth the force of power, but exalt the doctrine of humility. In this place he thought that patience too should be joined to humility, because he himself also, according to the testimony of Peter, when he was reviled, did not revile in return; when he was struck, did not strike back. This, then, is to say: be imitators of me; lay aside the pursuit of revenge; beat back the insolence of those who strike you not by returning the injury, but by the magnanimity of patience. No one ought himself to imitate what he blames in another; gentleness returns heavier wounds upon the insolent. With this fist the Lord struck back at the one who strikes, by saying: to him who strikes you on the cheek, offer the other also. For it comes about that he who notices that kindness has been returned to him in exchange for the injury he did condemns himself by his own judgment and is pricked in his feelings by a kind of goad.

Yet he has apostles whom he sent even with a rod, as Paul testifies, saying: what do you wish? Shall I come to you with a rod, or in charity and the spirit of gentleness? This rod the Apostle also gave to Timothy, saying: reprove, entreat, rebuke. Or perhaps before the Lord's Passion, which made firm the hearts of wavering peoples, gentleness alone was needful, and after the Passion correction. Certainly let the Lord soothe, let Paul rebuke; let him persuade who can soften even hard hearts, let him reprove who cannot carry all things by persuasion. Paul, then, had taken up the rod from the teaching of the Law. For he had read: he who spares the rod hates his son. He had read too that those who ate the lamb were bidden by a prophetic command to have a staff in their hands. And therefore the Lord says in the Old Testament: I will visit their iniquities with the rod; but in the New he offered himself, so that he might pardon all, saying: if you seek me, let these go. And elsewhere you have it that, when the apostles wished to ask for fire from heaven to consume the Samaritans, who would not receive the Lord Jesus within their city, he turned and rebuked them and said: you do not know of what spirit you are; for the Son of Man came not to destroy men's souls but to save them.

The more perfect, then, are sent without a rod; the weaker eat with a staff. But Paul too threatens a rod indeed, yet visits offenders in the spirit of gentleness. Indeed, that you may know that he is a mild teacher, he consults the will of the very people whom he reproves. What do you wish? He says shall I come to you with a rod, or in charity and the spirit of gentleness? Once he spoke of the rod; twice he added milder things, joining gentleness to charity. Yet at first he threatened, but he showed gentleness; for writing in the second epistle to the same Corinthians he says: I call God as witness upon my soul that it was to spare you that I did not come to Corinth. Hear for what reason he thought he should spare them: that I might not he says come to you again in sorrow. He cast away the rod and took up the affection of charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
