[[commentary]]
quote='''
Be fully aware, O beautiful soul, of the fact that you are the image of God. And, man, be aware that you are the glory of God. Hear the words of the Prophet on the question of glory: ‘Thy knowledge is become wonderful to me.’ That is to say, in my work your majesty, O God, has become more wonderful; in the counsels of men Your wisdom is exalted. When I contemplate myself such as I am known to You in my secret thoughts and deepest emotions, the mysteries of Your knowledge are disclosed to me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
