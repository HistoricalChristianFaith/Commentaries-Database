[[commentary]]
quote='''
She was indeed bound by the Law to be joined to the brother of her own husband, if her husband had left her no seed. This bond was tied more by the interpretation of the letter than by spiritual grace. Indeed the brother of the deceased had it in his will, if he was unwilling, not to take his brother's wife to raise up seed for the deceased. Hence he was ordered to loose his shoe, so that he might be freed from the tie of union with her whom he had shown to be estranged from his favour. For thus it is written, that he loosed his shoe and gave it to his neighbour, saying: This shall be for a testimony in Israel. And the kinsman said: Take it and acquire it for yourself. And he loosed his shoe. And the bystanders also said: May the Lord make the wife who enters your house like Rachel and like Leah, who both built the house of Israel and wrought power in Ephrathah. But this bound the Jew according to the interpretation of the letter; for the rest, it was a figure that Christ would come to earth, to raise up the seed of the dead people by right of a brother, because it was said: I will declare your name to my brothers, and: whose are the fathers, and of whom is Christ according to the flesh; or else because the Gospel would work the restoration of the dead Law in the descendants, so that the course of the Gospel might raise up the seed which the Law had not left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
