[[commentary]]
quote='''
In approaching this subject I seem to be possessed by an unusual eagerness in my quest to clarify the facts about Paradise, its place, and its nature to those who are desirous of this knowledge. This is all the more remarkable since the Apostle did not know whether he was in the body or out of the body, yet he says that he was caught up to the third heaven. And again he says: I know such a man—whether in the body or out of the body I do not know, God knows—that he was caught up into paradise and heard secret words that man may not repeat. Of such a man I will boast; but of myself I will glory in nothing save in my infirmities. For if I do wish to boast, I shall not be foolish; for I am speaking the truth. If Paradise, then, is of such a nature that Paul alone, or one like Paul, could scarcely see it while alive, and still was unable to remember whether he saw it in the body or out of the body, and, moreover, heard words that he was forbidden to reveal—if this be true, how will it be possible for us to declare the position of Paradise which we have not been able to see and, even if we had succeeded in seeing it, we would be forbidden to share this information with others? And, again, since Paul shrank from exalting himself by reason of the sublimity of the revelation, how much more ought we to strive not to be too anxious to disclose that which leads to danger by its very revelation! The subject of Paradise should not, therefore, be treated lightly. With these words let us set aside the question of what was hidden to Paul.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 1"
