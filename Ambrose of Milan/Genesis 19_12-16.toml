[[commentary]]
quote='''
A place is given to devotion, in that, when the overthrow of the whole region had been made known to him by the angels, holy Lot is presented both as having sons-in-law and as warning them to flee, so that he might not, by deserting them and not warning them, seem less devoted towards his daughters' husbands, nor might the cause of their error be laid to his charge, since they, deprived of the company of husbands, sought intercourse with their drunken father. Scripture therefore does not leave the holy man undefended, and he is presented as having both given his daughters to husbands and warned his sons-in-law. But it seemed to them that he was mocking them; and yet Lot still lingered, to persuade his sons-in-law, and he would almost not have set out to escape, had he not been compelled to go out by the angels urging him and holding his hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
