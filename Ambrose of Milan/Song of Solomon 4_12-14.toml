[[commentary]]
quote='''
An enclosed garden is my sister, my bride, an enclosed garden, a sealed fountain; your shoots are a paradise of pomegranates with the fruit of henna. The bride is praised because she is a garden having in herself the fragrance of that full field of which Isaac says: The fragrance of my son is as the fragrance of a full field. So the good soul is fragrant with the fragrances of righteousness. And perhaps the field is the patriarch, and the garden is the soul of someone lower, a portion, as it were, of the field; and an enclosed garden, lest it be overrun by beasts, and a sealed fountain, she who by the integrity of the seal and by persevering faith has washed away her own sins. For whoever takes it of the Church has something to refer to the grace of virginity, because, placed in the paradise of delight, she gathers spiritual fruits without labour, since the souls of the patriarchs, with a kind of rustic labour, bring her their fruits, whereby she may obtain an everlasting sweetness. She is rightly called a sealed fountain, because the image of the invisible God is impressed in her. They praise also the gifts of the soul, which were sent to the bridegroom, with which she came endowed. Now the dowry of the devout soul is good fragrances, myrrh, aloes, saffron, by which the grace of gardens breathes and the stench of sins is done away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"
