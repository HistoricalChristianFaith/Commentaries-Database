[[commentary]]
quote='''
But if you seek the increase of usury, in the law is blessing, in the Gospel a heavenly reward. What is sweeter than a blessing, what is greater than Heaven? If usury of food is desired, that too is ready, as we read: For he who pitieth the poor is himself fed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 16"
