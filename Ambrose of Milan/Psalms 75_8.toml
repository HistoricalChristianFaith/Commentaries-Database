[[commentary]]
quote='''
Is it any crime of compassion that it threatens more and exacts less? He who keeps his promises in the reward of prizes retracts what he prescribed in the exacting of punishments. When he is angry, he puts off the guilty; when he has mercy, he hastens to absolve. He terrifies to correct, warns to amend, forestalls to pardon. Whence elsewhere too the prophet says of the Lord: The cup in the hand of the Lord is full of unmixed wine, mingled; nevertheless its dregs have not been emptied out. For terrifying the cup is full; for striking it is not emptied out. The cup was full when death for three days was ordered, but the mercy of God came to meet it and held the angel's hand before he emptied that cup. And that you may know that the cup is punishment or the sword, hear one saying: Take this cup of unmixed wine from my hand, and you shall make all the nations drink to whom I shall send you, and they shall vomit and go mad before the sword; and to Jerusalem it is said: You have drunk the cup of wrath from the hand of the Lord; for you have drunk the cup of ruin and emptied it, and there was none to console you. Jerusalem drank the measure, she who sinned beyond measure. The Church of the Christians does not know how to empty the cup of wrath, but she has emptied out ointment, she for whose sake Christ emptied himself, that it might be fragrant everywhere. From the hand of the Lord she received this gift, but the cup of death she does not know. I read of two cups, one of death, the other of life. Christ emptied the cup of death in his own blood and served a new cup, so that we may say: I will take the cup of salvation, the cup of the new testament, which is poured out for the remission of sins. This cup is poured out and its dregs are not found, because it cleanses every sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
