[[commentary]]
quote='''
Hasten with all your intention to him by whose breath you subsist: A great thing, he says, is man, and precious is a merciful man: but a faithful man it is a task to find (Prov. 20:6). Learn, O man, where you are great and precious. The earth shows you to be vile, but virtue makes you glorious, faith rare, the image precious. For where is anything so precious as the image of God? which ought first to pour faith into you, so that a certain likeness of the author may shine in your heart, lest he who questions your mind should fail to recognize the author. Or is anything so precious as humility, so that, looking closely at the nature of body and soul, you subject yourself in the one and recognize yourself in the other? The allurement of the flesh, prone to vice, urges mercy; because what you bestow on another you pay to yourself: whatever proceeds from you runs back into you, and whatever you do, you pay to yourself: and whatever good you do profits you. The vigour of a living soul, the sense of reason, capable of understanding and judgment, so that it may seem a worthy house for so great an inhabitant, should not lose the prerogative of its nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
