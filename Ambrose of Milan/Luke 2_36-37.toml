[[commentary]]
quote='''
So Simeon prophesied; she who was joined in marriage had prophesied, the virgin had prophesied; a widow too had to, so that no state of life and no sex should be lacking. And so Anna is brought in, such both in the service of her widowhood and in her conduct that she may be believed to have been fully worthy to announce that the Redeemer of all had come. Since we have described her merits elsewhere, when we were exhorting widows, we do not think they should be repeated in this place, as we are hastening on to other things. Yet not idly did he state the eighty-four years of her widowhood, since both seven twelves and two forties seem to signify a sacred number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
