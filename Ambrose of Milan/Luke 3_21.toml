[[commentary]]
quote='''
Now it came to pass, when all the people had been baptized, and when Jesus had been baptized and was praying, that heaven was opened and the Holy Spirit descended in bodily form like a dove upon him, and a voice came from heaven: You are my Son, in you I am well pleased. So the Lord was baptized, not wishing to be cleansed but to cleanse the waters, so that, washed by the flesh of Christ, which knew no sin, they might have the right of baptism. And so whoever comes to the washing of Christ lays aside his sins. Beautifully, too, Saint Luke the evangelist has abridged what was said by the others, and has left it to be understood, rather than expressed, that the Lord was baptized by John. What the cause of the Lord's baptism was, the Lord himself declares, saying: Let it be now; for thus it becomes us to fulfil all righteousness.

Since, then, God by divine favour granted such great things for the building up of his Church that, after patriarchs, prophets, angels, the only-begotten Son of God should come down and come to the washing, have we not come to know that it was truly and divinely said of the Church: Unless the Lord builds himself a house, they have laboured in vain who build it? Nor is it any wonder if man cannot build, when he cannot guard: Unless the Lord guards the city, they have watched in vain who guard it. So much from a certain psalm. Yet I too dare to say that a man cannot set out on the way unless he has the Lord going before him. Hence it is written: You shall walk after the Lord your God; and: By the Lord are a man's ways directed. Indeed, he was the more perfect who understood that he could not walk without the Lord. Your ways he says teach me. And to come to the history — for we ought not only to drink in the simple sequence of what was done, but also to refer our own acts to the imitation of what is written — the people went out of Egypt. It did not know the way that would lead to the holy land. God sent a pillar of fire, that the people might learn the way by night. He sent also by day a pillar of cloud, that they might turn aside neither to the left nor to the right. But you are not such, O man, as to deserve a pillar of fire too; you do not have Moses, you do not receive a sign; for now, after the coming of the Lord, faith is required, signs are put away. Fear the Lord and take confidence in the Lord; the angel indeed of the Lord will encamp round about those who fear him and will deliver them. You surely see that everywhere the power of the Lord cooperates with human efforts, so that no one can build without the Lord, no one guard without the Lord, no one begin anything without the Lord. And so, according to the Apostle: Whether you eat or drink, do all things in the glory of God, in the name of our Lord Jesus Christ; for in two epistles he bade you act, in one in the name of our Lord Jesus Christ, in the other in the glory of God, so that you may know that the glory of the Father and of the Son is the same and the power the same, and that the Father and the Son, who do not differ in regard to our protection, differ in nothing in regard to their divinity. So David taught me that no one without the Lord builds a house or guards a city.

Moses too taught me that no one but God made the world; in the beginning indeed God made heaven and earth. He taught also that God made man by his own work, and not idly did he set down: God formed man from the slime of the earth and breathed into his face the breath of life, so that you may observe a certain act of God in the building of man, after the manner of a bodily working. He taught also that God made the woman too; God indeed cast a deep sleep upon Adam, and he slept; and he took one rib from his side and filled up his flesh. And the Lord God built the rib which he took from Adam into a woman. Not in vain, as I have said, does Moses bring in God working on Adam and Eve with bodily hands, as it were. God commanded the world to be made, and it was made, and by one word Scripture indicates that the work of the world was finished; when it comes to man, the prophet was at pains in some way to show you the very hands of God at work.

The works of God, so carefully wrought, compel me to understand something more in them than I read. The Apostle comes to the help of one perplexed, and what I did not understand — what is meant by: bone of my bones and flesh of my flesh and she shall be called woman, because she was taken from her man — he revealed to me by the divine Spirit, saying: This sacrament is great. What sacrament? That the two shall be in one flesh, and that a man shall leave father and mother and cleave to his wife, and that we are members of his body, of his flesh and of his bones. Who is this man for whose sake the woman leaves her parents? The Church leaves her parents, she who was gathered from the Gentile peoples, to whom it is said prophetically: Forget your people and your father's house. For the sake of what man, unless perhaps him of whom John says: After me comes a man who has been made before me? From whose side, as he slept, God took a rib; for he it is who slept and rested and rose again, because the Lord upheld him. What is his rib but power? For then, when the soldier opened his side, at once there came out water and blood, which was poured out for the life of the world. This life of the world is the rib of Christ, this is the rib of the second Adam; the first indeed Adam unto a living soul, the last Adam unto a life-giving spirit; the last Adam is Christ, the rib of Christ is the life of the Church. We therefore are members of his body, of his flesh and of his bones. And perhaps this is the rib of which he said: I perceive that power has gone out from me; this is the rib which went out from Christ and did not diminish his body; for it is not a bodily rib but a spiritual one, and the Spirit is not himself divided, but divides to each as he wills. This is Eve, the mother of all the living. For if you understand you seek the living among the dead, you understand that those are dead who are without Christ, who are not partakers of life; for this is what it is not to be partakers of Christ, since Christ is life. The mother of the living, then, is the Church, which God built with Christ Jesus himself as the chief cornerstone, in whom the whole structure, joined together, grows into a temple.

Let God come, then, let him build the woman: that one indeed the helper of Adam, this one the helper of Christ — not that Christ needs help, but because we seek and desire to come to the grace of Christ through the Church. Now she is being built, now she is being formed, now the woman is being fashioned, now she is being created. And so Scripture used a new word, because we are built up upon the foundation of the apostles and prophets. And now a spiritual house rises into a holy priesthood. Come, Lord God, build this woman, build the city. Let your Servant come too; for I believe you when you say: He will build the city for me.

Behold the woman, the mother of all; behold the spiritual house; behold the city that lives for ever, because it knows not how to die. For she is the city of Jerusalem, which is now seen on earth, but will be caught up above Elijah — for Elijah was but one — she will be translated above Enoch, whose death is not found; for he was caught up, lest wickedness should change his heart, but she is loved by Christ as glorious, holy, immaculate, without wrinkle. And how much better it is that the whole body is taken up than that he was taken up! For this is the hope of the Church. She will surely be caught up, she will be taken up, she will be translated to heaven. Behold, Elijah was caught up in a chariot of fire; the Church will be caught up. You do not believe me? Believe at least Paul, in whom Christ spoke. We shall be caught up he says in the clouds to meet Christ in the air; and so we shall always be with the Lord.

To build her, then, many are indeed sent: patriarchs are sent, prophets are sent, Gabriel the archangel is sent, countless angels are dispatched, and the multitude of the heavenly host praises God, because the building of this city was drawing near. Many are sent to her, but Christ alone builds her; yet he is not alone, because the Father is present; and if he alone builds, yet he does not alone claim the grace of so great a building. It is written of the temple of God which Solomon built, in which there was a type of the Church, that there were seventy thousand who carried on their shoulders and eighty thousand stonecutters. Let those angels come, let the stonecutters come, let what is superfluous in our stones be hewn away, let the rough places be made smooth; let those also come who carry on their shoulders; for it is written: They shall be carried upon shoulders.

So he came to John, since you have learned the rest. He came to John's baptism, but John's baptism held repentance of sins. And therefore John forbids him, saying: 'I ought to be baptized by you, and do you come to me? Why do you come to me, you who have no sin? For he must be baptized who has sin; but why should he who has done no sin seek the washing of repentance?' Let it be he says now — that is: while the Church is being built — it becomes us to fulfil all righteousness. What is righteousness but mercy? He has scattered indeed, he has given to the poor: his righteousness remains for ever. He gave to me, poor as I was, he gave to me, needy as I was, the grace which I did not have before; so his righteousness remains for ever. What is righteousness but that you yourself should be the first to begin what you wish another to do, and should exhort others by your example? What is righteousness but that, because he took up flesh, he should not as God exclude the feeling or the service of the flesh, but as man should conquer the flesh, that he might teach me to conquer? For he taught by what means I can bury, as to its crimes, the filth of the guilty flesh compacted of earthly vices, and renew it in virtues.

O truly divine foresight in the very humility of the Lord! For the more abject the humility, the more divine the providence. By the bitterness of the injuries he suffered God is revealed, and by his use of remedies, he who needed no remedies, he is proved God. For what is so divine for calling forth the peoples as that no one should shun the washing of grace, when Christ did not shun the washing of repentance? Let no one say he has no share in sin, when Christ came to the remedy of sins. If Christ washed for us, nay rather washed us in his own body, how much more ought we to wash away our own sins? By what work, then, by what mystery more than by this is God proved, though he is God in all things, when, through the whole world, wherever the condition of the human race is spread, through the partings and expanses of separate regions, in one moment, in one body, God abolished the fraud of the ancient error and poured out the grace of the heavenly kingdom? For one was immersed, but he raised up all; one descended, that we might all ascend; one took upon himself the sins of all, that in him the sins of all might be cleansed. Purify yourselves, then, as the Apostle says, because he purified himself for us, he who had no need of purification. So much concerning us.
'''
