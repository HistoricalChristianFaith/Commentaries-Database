[[commentary]]
quote='''
The crowd, then, recognizes God, calls him king, repeats the prophecy: Hosanna to the Son of David, that is, it declares that the Redeemer of the house of David, the one awaited, has come, also, according to the flesh, the Son of David — and this was that crowd which was to crucify him after a brief moment. Truly a memorable mark of the divine working, that testimony against themselves is wrung from the unwilling, when they deny in their affections the God whom they confess with their voices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
