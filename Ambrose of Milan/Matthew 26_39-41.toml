[[commentary]]
quote='''
For if it had been a spiritual body, he would not have said: the spirit is ready, but the flesh is weak. Hear, then, both voices, of the weak flesh and of the ready spirit: Father, if it is possible, let this cup pass from me: this is the voice of the flesh. But not what I will, but what you will: you have the devotion and the vigor of the spirit. Why do you reject the condescension of the Lord? It is of condescension that he took my body, of condescension that he took my injuries, took my infirmities, which the nature of God certainly could not feel, since even the nature of man has learned to despise them, or to sustain and endure them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
