[[commentary]]
quote='''
So it came about that, when he had sent many others, whom the Jews sent back to him dishonored and empty-handed, since they could gain nothing from them, last of all he sent even his only-begotten Son, whom the unbelievers, desiring to remove him as the heir, killed by crucifying him and cast out by denying him.

Briefly, then, how great things, and how many! First, that goodness is natural, which often trusts the unworthy; next, that Christ came as the last remedy for evils; then, that he who denies the heir despairs of the author. But Christ is heir and likewise testator: heir, because he outlived his own death, and obtains in our progress, as an inheritance, the profits of the testaments which he himself drew up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
