[[commentary]]
quote='''
"Your navel is like a round bowl, not wanting tempered wine. Your belly is like a heap of wheat, set about with lilies. Your neck is like a tower of ivory. Your eyes are a pool in Heshbon." The good navel of the soul, capable of receiving all virtues, is like a bowl, fashioned by the author of faith himself. For in a bowl wisdom has mixed her wine, saying, "Come, eat my bread and drink the wine which I have mingled for you." This navel, therefore, fashioned with all the beauty of the virtues, does not lack mixed wine. His belly also was filled not only with the wheaten food of justice, as it were, but also with that of grace, and it bloomed with sweetness like a lily.
'''
source_url=''
source_title="CONSOLATION ON THE DEATH OF EMPEROR VALENTINIAN 69"

[[commentary]]
quote='''
Her navel like a turned bowl is proclaimed, not lacking mixed wine; because, being turned in all doctrine, it does not fail in the fullness of knowledge and in spiritual drink. And her belly is not only fattened with a heap of wheat, that is, with the stronger foods of the heavenly mystery, but is also filled, as with certain lilies, with the sweetness of moral teachings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Your navel like a turned bowl, never in need of cups. Fine is the navel and belly of the soul that ascends to Christ; and therefore she is praised by the voice of the Bridegroom, saying: Your navel like a turned bowl, not lacking mixed wine; your belly a heap of wheat fenced among lilies. For it is turned in all doctrine, not lacking spiritual drink, in fullness and in the knowledge of heavenly secrets. The belly of the soul too is mystical, as the navel is: by this belly she takes not only strong food, by which hearts are strengthened, but also sweet and flowery food, by which they are delighted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
