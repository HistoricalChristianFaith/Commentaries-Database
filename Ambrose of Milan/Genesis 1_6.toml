[[commentary]]
quote='''
We have finished as best we could our discussion of the first day—or, rather, of one day, in order to keep to the phrase preferred by the inspired book. On this day, by the work of the omnipotent God, and the Lord Jesus Christ, together with the Holy Spirit, we know that the heavens were founded, the earth was created, the waters and the air were sent forth around us, and a separation was made between light and darkness.

Who, therefore, does not marvel at the fact that a world formed of dissimilar elements should rise to the level of unity in one body, that this body should combine by indissoluble laws of concord and love to link together and form a union of such discordant elements? Furthermore, who does not marvel that these elements so naturally separate should be tied together in the bonds of unity and peace as if by an indivisible compact? Or who in a moment of weakness would, on beholding this, question the possibilities of order or plans? All these elements a divine power incomprehensible to human minds and incapable of being expressed in our language has by the might of His will woven closely together.

God, therefore, created the heavens and the earth and those things which He as Author has ordained to exist, not just as a designer of their form but as a Creator of their nature. How, in fact, can the creative power of God which is impassive and the nature of matter which is passive form an agreement together, as if one borrowed from the other what was lacking in each? If matter is uncreated, then God is without the power to create matter and must borrow from matter what is a conditional basis for His work. If, however, matter is unformed, it surely is remarkable that such material, co-eternal with God, which has not received from the Creator its substance, but has itself possessed it in timeless existence, has been unable to bestow beauty on itself. The Creator of all things, therefore, would have found ready for His work more things than He contributed to it. He would have found material on which to work and would have merely bestowed the form which would confer beauty on what has already been found.

Hence, such a day should be distinguished from the others as ‘one day,’ and should not be compared with other days as ‘the first day,’ for on it the foundations of all things were laid and there began to come into existence the causes of all things on which the substance of this world and of the entire visible creation is based. Wherefore, our discourse can now proceed to the wonderful works of the second day. The importance of these works should not be rated by what we have achieved in our discussion, but should, in accordance with Scripture, be referred to the praise of the Creator.

I bid you, therefore, be considerate enough to regard in a natural sense our plausible discourse and to weigh our statements in simplicity of mind and with attentive intellect, not following the traditions of philosophy nor those who gather the semblance of truth in the ‘vain deceit’ of the arts of persuasion, but in accordance with the rule of truth, which is set forth in the inspired words of God and is poured into the hearts of the faithful by the contemplation of such sublimity. For it is written: ‘Strengthen thou me in thy words.’ ‘The wicked have told me fables but not as thy law, O Lord. All thy statutes are truth.’ Therefore, not the nature of the elements, but Christ Himself, who created the world in the abundance and plenitude of His divinity, should be our standard in the examination of what was created and in the question as to what natural power is able to achieve. The people who beheld with their own eyes the miracles related in the Gospel of the healing of the leper and that of giving sight to the blind did not regard these as a medical process, but rather, marveling at the power of the Lord, ‘gave praise to God,’ as it is written. Moses did not follow the calculations of the Egyptians and the conjunctions of the stars and the relations of the elements when he stretched out his hand to divide the Red Sea, but was complying with the commands of divine power. Hence, he says himself: ‘Thy right hand, O Lord, is magnified in strength. Thy right hand, O Lord, hath broken the enemy.’ To Him, therefore, ye faithful people, lift up your mind and bring to Him all your heart. God does not see as man does: God sees with His mind; man sees with his countenance. Therefore, man does not see as God does. Give ear to what God saw and what He praised. Do not, therefore, estimate with your eyes nor weigh with your mind the problem of creation. Rather, you should not regard as a subject for debate what God saw and approved of.

And God said: ‘Let there be a firmament made amidst the waters and let it divide the waters from the waters, and it was so.’ Listen to the words of God: ‘Let there be,’ He said. This is the word of a commander, not of an adviser. He gives orders to nature and does not comply with its power. He does not regard its measurements, nor does He examine its weight. His will is the measure of things and His word is the completion of the work. ‘Let there be a firmament made amidst the waters,’ He said. Firm is everything which God has established. Appropriately enough has He stated: ‘Let there be a firmament made’ before He added ‘amidst the waters,’ in order that you might first believe that the firmament was made by God’s command before you would begin to doubt about the problem of the fluid nature of water. If the nature of the elements is taken into consideration, how it is possible for the firmament to be stable between the waters? The one is liquid, the other solid; one is active, the other, passive. ‘And let it divide the waters from the waters,’ He said. But water usually mingles, not separates. How, then, does He command what He knows to be a contradiction in terms of the first principles of the elements? But, since His word is nature’s birth, justly therefore does He who gave nature its origin presume to give nature its law.

But first let us discuss the problem of the nature of the firmament, whether it is the same as what God previously called heaven or something different? The question also arises whether there are two heavens or more. There are some who say that there is but one heaven. Moreover, they maintain, since there was only one ὕλη, as they call it, that there could not be at hand material for making a second heaven. Moreover, since this material had been already consumed in the first heaven, there would be nothing left over in their opinion which would furnish material for a second or third heaven. On the other hand, an opinion that there are countless heavens is held by others, who thereby furnish an occasion for laughter to some members of their own school (contending among themselves even more than they do with us), who pretend to prove by mathematical means and the law of necessity that another heaven could not exist. Again, they maintain that nature could not allow that a second or a third such entity should exist and it would not be a fitting exercise of power for a Creator to bring into existence many heavens.

And who would not find the crafty and eloquent phrases of these men a subject of ridicule? They would not deny the human capacity of making more objects of the same kind from one and the same material, yet they doubt whether the Creator of all things can make more heavens, of whom it is written: ‘But the Lord made the heavens,’ and elsewhere: ‘He hath done all things whatsoever he would.’ Why is it difficult for one whose wishes are acts? Their theory that this impossibility exists is, therefore, unsubstantial when they treat of God, of whom in truth it is said: ‘Nothing is impossible to thee.’

Accordingly, we cannot deny the existence of not only a second heaven, but also of a third, since the Apostle attests in his writings that he ‘was caught up to the third heaven.’ David, too, introduced ‘Heaven of heavens’ into the chorus of those who give praise to God. In imitation of him philosophers introduced the harmonious movement of five constellations along with the sun and moon, to whose spheres or, rather, round bodies they state that all things are connected. They consider that these bodies, bound together and, as it were, linked one with the other, are borne in a backward motion and one contrary to the rest of things. By the impact and motion of these spheres there is produced a tone full of sweetness, the fruit of consummate art and of most delightful modulation, inasmuch as the air, torn apart by such artful motion, combines in even and melodious fashion high and low notes to such a degree that it surpasses in sweetness any other musical composition.

If you should inquire into the truth of this phenomenon and demand that proof be presented to our senses and to our hearing, these philosophers are embarrassed. For, if what they say were true, how is it possible that we who are accustomed to hear lesser sounds do not perceive the impact of the movement of the sphere? This takes place, according to their theory, when in the course of the sphere’s motion the celestial sphere, to which the course of the constellations is uninterruptedly attached, produces by its swifter motion a high tone, while the lunar sphere gives us a deeper tone. If, then, we demand a proof of that hypothesis from the evidence of our sense of hearing, they report that our ears have become deafened and our sense of hearing has become dulled because we have become accustomed to that sound from the first moment of our birth. And they present an illustration from the river Nile, the mightiest of rivers. In that place where that river flows precipitously from the highest mountains into the Cataracts, the noise of the waterfall is so great that the ears of the natives are affected to the extent that they are said to be deaf.

But experience itself presents us an easy rebuttal to their arguments. We are able to hear thunderbolts produced by the collision of clouds; how, then, are we unable to hear the revolution of such mighty spheres which, in proportion surely to their swifter motion, should produce sounds all the more resounding? They maintain, furthermore, that such music does not reach the earth. Otherwise, men, captivated by the sweetness and charm which that exceedingly swift motion of the heavens produces, would from the regions of the east as far as the west have abandoned all their occupations and labors. Thus, everything here would be in a state of inactivity as a result of what might be called the rapture of men at the sound of celestial music. But subjects which are alien to our purpose and to divine testimony should be left to those ‘who are outside.’ We should adhere closely to the doctrine laid down by the celestial Scriptures.
'''
