[[commentary]]
quote='''
You can be blessed, if you wish, you can be just. For he is a just man, according to Ezechiel, who shall restore the pledge to the debtor, and shall not give his money upon usury, and shall not take an increase, and shall withdraw his hand from iniquity. [This man is just.] He shall live, he says, saith the Lord. Moreover, he who hath not restored the pledge, and hath lifted up his eyes to idols, hath committed abomination. Since he hath given upon usury and hath taken increase, he shall not live. He hath done all these detestable things, he shall die, his blood shall be upon him. See in what manner he has connected the usurer with the idolater, as though he would make the crime equal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 15"

[[commentary]]
quote='''
But since the Lord Himself, through Ezechiel the prophet, proclaims that he is just who has returned a pledge, unjust who has kept it, assuredly he urges that not some special one, but in general every pledge should be returned, since Job says: The writing which I held against anyone, received under oath, I read, putting on my crown, and if I did not tear it up I returned it receiving nothing from the debtor. Since the Lord teaches that nothing ought to be hoped from those to whom we have lent, which we should receive, how, according to law, do they think a pledge should be retained?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 17"
