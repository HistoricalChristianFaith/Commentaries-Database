[[commentary]]
quote='''
Or out of the same bed of human infirmity, one is left, that is, rejected, another is taken up, that is, is caught to meet Christ in the air. By the two grinding together, he seems to imply the poor and the oppressed. To which belongs what follows. Two men shall be in the field, &c. For in these there is no slight difference. For some nobly bear up against the burden of poverty, leading a lowly but honest life, and these shall be taken up; but the others are very active in wickedness, and they shall be left. Or those grinding at the mill seem to represent such as seek nourishment from hidden sources, and from secret places draw forth things openly to view. And perhaps the world is a kind of corn mill, in which the soul is shut up as in a bodily prison. And in this corn mill either the synagogue or the soul exposed to sin, like the wheat, softened by grinding and spoilt by too great moisture, cannot separate the outward from the inner parts, and so is left because its flour dissatisfies. But the holy Church, or the soul which is not soiled by the stains of sin, which grinds such wheat as is ripened by the heat of the eternal sun, presents to God a good flour from the secret shrines of the heart. Who the two men in the field are we may discover if we consider, that there are two minds in us, one of the outer man which wasteth away, the other of the inner man which is renewed by the Sacrament. These are then the labourers in the field, the one of which by diligence brings forth good fruit, the other by idleness loses that which he has. Or those who are compared we may interpret to be two nations, one of which being faithful is taken, the other being unfaithful is left.

For God is not unjust that He should separate in His reward of their deserts men of like pursuits in life, and not differing in the quality of their actions. But the habit of living together does not equalize the merits of men, for not all accomplish what they attempt, but he only who shall persevere to the end shall be saved.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Nor should we pass over interpreting it of two peoples, that is, that in this world, which is very often compared to a field, there are two peoples, one of believers, the other which does not believe, who will receive the recompense of their merits; and therefore the one which is faithful is taken, the other which is unfaithful is left. And those two women grinding are two souls, or certainly the Church and the synagogue; for a figure in the divine scriptures is accustomed to be not single but manifold, so that one word comprises several meanings. So the mind of the flesh and the soul of the flesh and the synagogue gather that wheat and grind that fine flour which are offered in vain; but the mind which is joined to the soul, and the soul which is the receiver of salvation, or the Church of God, cultivate and grind the spiritual fine flour of the true law. Hence also come the loaves of proposition, which only the priests eat, to whom it is prescribed to eat a purer bread, that, surely, which came down from heaven. And we are all, if our merits allow, priests of righteousness, who are consecrated with the anointing of gladness to kingship and priesthood.

So let us so work and cultivate our field, set as we are in the task of this cultivation, that in that higher Jerusalem, where the true keeping of the law is celebrated, we may have fine flour from our sheaves — and blessed are they who have been able to gather them — so that coming they may come with exultation, bearing their sheaves. These, then, are the spiritual fruits and the happy yields of true labor, which are soaked by no useless rain; but the fruit of the flesh is liable to corruption, and therefore he who sows carnal things will reap carnal things. But of the field what shall I say, since it is plain that in the work of the farmer lies either praise or blame?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
