[[commentary]]
quote='''
In a sense, the Levite does violence to himself, so as to rid himself of bodily pleasures with consequent annihilation of his own flesh. For example, Moses slew an Egyptian and became a fugitive from the land of Egypt so as to avoid the king of that land. But he would not have slain the Egyptian if he had not first destroyed in himself the Egyptian of spiritual wickedness and had not relinquished the luxuries and honors of the king's palace. He considered that the reproach of Christ was a far better patrimony than the treasures of Egypt. To the foolish this indeed seems to be a reproach, but the reproach of the Cross of Christ is in reality God's power and wisdom.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"
