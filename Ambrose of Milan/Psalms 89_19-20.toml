[[commentary]]
quote='''
There was, then, another kingdom of the true David, which Christ alone received, and there was another seed of David, which remains for ever, of which Christ alone was begotten, who alone is the true son of David, whose name too he alone received, according to what is written: I have found David my servant, with my holy oil I have anointed him. That this is said not of the prophet David but of the Lord, the words that precede declare; for it is written: I have laid help upon one who is mighty and have exalted one chosen from my people; for Christ alone is mighty, he alone is chosen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
