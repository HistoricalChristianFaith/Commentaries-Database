[[commentary]]
quote='''
He saw, then, the mysteries of the future incarnation, he who sent his son to his brothers to see whether the sheep were well. What sheep was God already then seeking in that zeal of the patriarch, but those of whom the Lord Jesus himself said in the Gospel: I have not come except to the lost sheep of the house of Israel? And he sent, it says, to Shechem, which by interpretation is called 'shoulder or back', that is, to those who would not turn to the Lord but, fleeing from his face, would turn their backs, which is properly the mark of the sinner; for Cain, indeed, went out from the face of God, and the prophet says: You will make them a back. But the just man does not turn away from the Lord; he runs to meet him, saying: My eyes are ever toward the Lord. And Isaiah, when the Lord said: Whom shall I send?, offered himself of his own accord, saying: Behold, I. And Simeon waited to see Christ the Lord, and after he had seen him, since he had seen the forgiver of sins and the redeemer of the whole world, as though relieved of sin he asked to be released from the use of this flesh, saying: Now dismiss your slave, Lord, for my eyes have seen your salvation. And Zacchaeus first found the privilege of his commendation in this, that he climbed a tree to see Christ. So Joseph was sent by his father to his brothers, or rather by that Father who did not spare his own Son but delivered him up for us all, by that Father of whom it is written: God sending his own Son in the likeness of the flesh of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
