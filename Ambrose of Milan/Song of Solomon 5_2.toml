[[commentary]]
quote='''
As the dew from the heavens removes the dryness of the night, so the dew of our Lord Jesus Christ descends as the moisture of eternal life into the nocturnal shadows of the world. This is the head that knows nothing of the dryness caused by the heat of this world.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 12:70"

[[commentary]]
quote='''
Hearing this, the soul drank in the inebriation of the heavenly mysteries and, as if put to sleep by wine and as though placed in a going out of herself or in a stupor, she says: I sleep, and my heart keeps watch. Then, struck by the light of the Word present, when she had rested with her eyes lowered, she is roused by the Word. Now this is already the fourth stage of progress of the soul. For first, impatient with love and not bearing the delays of the Word, she was asking that she might merit kisses, and she merited to see the one she desired, and she was also brought into the chamber of the King. Second, when she was exchanging words with him, she rested in his shadow, and suddenly the Word departed from her in the middle of their talk; yet he was not long absent from her as she sought him, but came leaping over the mountains and bounding over the hills. And not long after, like a roe or a fawn of the harts, while he was speaking to his beloved, he leapt away and left her. Third, when she had sought him on her bed and in the nights, in the city and the marketplace and the streets, and had not found him, at length she called him back by her prayers and grace, so much so that she was even called nearer by the bridegroom. Fourth, she herself is now roused by him as she sleeps, although she was keeping watch in her heart, so that she heard at once the voice of him who knocked. But she suffered a delay while she rises, because she could not keep pace with the swiftness of the Word; while she opens the door, the Word passed by, and she went out at his word, and him whom she sought through wounds, but wounds of love, she at last, and barely, found and held, so as not to lose him afterwards. In sum, I have touched on these things in a brief discourse; now let us examine them one by one.

Even if you sleep, provided only that he knows the devotion of your soul, Christ comes and knocks at its door and says: Open to me, my sister. Well does he say sister, because the nuptials of the Word and the soul are spiritual. For souls do not know the covenants of marriage and the use of bodily union, but are like the angels in heaven. Open he says to me, but close to strangers. Close to this age, close to the world, and do not yourself go out to those material things, nor, leaving your own light, seek another's, because material light pours in a gloomy darkness, so that the light of true glory is not seen. Open, then, to me; do not open to the adversary, nor give place to the devil. Open yourself to me; do not be narrowed, but be enlarged, and I will fill you. And because, having gone over the whole world, I found more of trouble and offence, and did not easily find where to rest, therefore do you open, so that the Son of man may lay his head in you, he who has no rest except upon the humble and meek.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
But so that she might be able to come from Lebanon, he said beforehand: Arise, come, my near one, my beautiful one, my dove, my perfect one. Near, surely, by the desire of faith; beautiful by the comeliness of virtue; a dove by spiritual grace. For the wings indeed of a dove covered with silver signify that eternal power, and the flight of the dove declared the presence of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"

[[commentary]]
quote='''
Hearing these things, the soul drank in the inebriation of heavenly mysteries, and, as though made drowsy by wine, and as if placed in ecstasy or stupor, she says: I sleep, and my heart keeps watch (Song 5:2). Then, struck by the light of the present Word, she is roused by the Word. This is the fourth progress of the soul. For first, impatient with love and not bearing the delays of the Word, she asked that she might be granted kisses, and she was granted to see the one she desired. Second, brought into the chamber of the king, while she was exchanging mutual speech, she rested in his shadow, and suddenly the Word departed from her in the middle of the conversation; yet he was not long absent from her as she sought him, but came leaping over the mountains and bounding across the hills. And not long after, like a young roe or a fawn of the harts, while he was speaking to his beloved, he leapt away and left her. Third, when she did not find him whom she sought on her bed and by night, in the city and the marketplace, in the streets, and at length, through her prayers, grace called her back as she sought, so much so that she was even called nearer by the bridegroom. Fourth, when she herself was already sleeping, she is roused by him, although she was keeping watch in her heart, so that she at once heard the voice of the one knocking: but she suffered delay while she rose (because she could not grasp the swiftness of the Word), and while she was opening the door, the Word passed by, and she herself went out at his Word; and, seeking him through wounds, but wounds of love, she at last barely found him, and held him, so that she might not lose him afterward. In sum, I have touched on these things in a brief discourse; now let us examine them one by one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
I sleep, and my heart keeps watch. The sleep of the saints is a working sleep too, according to what is written: I sleep, and my heart keeps watch. And so holy Jacob, sleeping, saw divine mysteries which waking he had not seen: from heaven to earth an air that opened the way for the saints, the Lord looking down, and promising the possession of his land. And so, sleeping a brief sleep, he obtained what he afterwards acquired with great labor; for his inheritance is the sleep of the saints, free from all pleasures of the body, from every disturbance of the mind, bringing tranquillity to the mind and calm to the soul, so that, as though loosed from the bond of the body, she may relieve herself and cleave to Christ. This is the sleep of the life of the saints.

The voice of my beloved knocking: open to me, my sister. Even if you sleep, if only Christ knows the devotion of your soul, he comes and knocks at its door and says: Open to me, my sister. Rightly sister, because the marriage of the Word and the soul is spiritual; for souls do not know the covenants of wedlock and the practice of bodily union, but are like the angels of God in heaven. Open, he says, to me, but shut to strangers. Shut to the age, shut to the world. Do not go out yourself to those material things, and do not leave your own light and seek another's; for material light pours in a dark mist, so that the light of true glory is not seen. Open, then, to me: do not be narrowed, but enlarge yourself, and I will fill you. And because, having gone round the circle of the lands, I found more trouble and offence, and did not easily have where to rest, therefore do you open, that in you the Son of Man may lay his head, for whom there is no rest except upon the humble and meek.

Open to me, my sister, arise, my nearest one, my dove, my perfect one. Nearest by love, a dove by simplicity, perfect by virtue. For my head is full of dew; for as the dew of heaven takes away the droughts of the night, so the dew of our Lord Jesus Christ has dropped the moisture of eternal life upon the darkness of the night and of the world. This is the head which could not be dried up by the heat of the world; hence he says: For if they do these things in the moist, what will they do in the dry (Luke 23:31)? This head, then, drops dew for others and abounds for itself. And rightly does the head of Christ abound; for your head is Christ, who is always full, and is neither drained by his own generosity nor fails through long-continued largesse. Upon this head no iron comes up, which is the instrument of war, the badge of discord. Now look, and see what that dew is like: namely, of no common moisture.

But my locks are of the drops of the night. Do not, my nearest one, take these locks to be of bodily hair: those are not adornments but faults, the enticements of beauty, not the precepts of virtue. The Nazirite has other locks, upon which no iron comes up, which no one cuts off: locks which, not arranged with curling irons or set in order by art, but curling with the manifold grace of shining virtues, have shone out. Learn from the history what kind of locks the Nazirite has: as long as Samson kept them untouched, he could never be conquered. He lost his locks, and he lost the merit of his power (Judg. 16:17).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Open to me, my sister. When you desire to meet one of the leading men, do you not first approach his house, then seek to be informed and instructed so as to learn the mind of the master of the household, and then implore that you may enter his house, lest anyone cast you off and shut you out? Knock, then, you too, at that heavenly palace; knock not with the hand of the body, but with a kind of right hand of your prayer. Not only the hand of the body knocks; the voice knocks too; for it is written: The voice of my brother knocks at the door. We knock with the finger too. Thomas, indeed, was found worthy to open the door of the resurrection with his finger; and to you too Jesus says: Put your finger here, and put it into my hands and my side, and do not be unbelieving, but faithful (John 20:27). Knock, then, with the finger if you cannot with the whole hand; knock at the door. Christ is the door, who says: If anyone enters through me, he will be saved (John 10:9).

When, then, you have knocked at this door, see how you enter, lest perhaps, even having entered, you be out of the king's sight. Many enter palaces and do not at once see this earthly king, but wait upon him often, that at some time they may be found worthy to see him. Nor do they presume upon an opportunity of seeing him, but are presented at his command and pour out their petition, so that they may be received with goodwill, careful about the first entrances of their speech, lest anything falter, lest anything give offence: how much more must God be asked that our prayer may enter the door of his mercy!

The voice of my brother knocks at the door. Learn also, O bride of Christ, to bar your door in the hours of night, lest anyone easily find it open. The Bridegroom himself wants it shut when he knocks. Our door is our mouth: it ought to be opened almost to Christ alone, and let it not be opened unless the Word of God has first knocked. The voice of my brother knocks at the door. Hear him knocking, hear him who desires to enter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Open to me, my sister, bride, my dove, my perfect one; for my head is full of dew, and my hair of the drops of the night. Consider when God the Word knocks most at your door: when his head is filled with the dew of night. For he deigns to visit those who are set in tribulation and temptations, lest anyone perhaps give way, overcome by hardships. His head, then, is filled with dew or drops when his body labors. Then, therefore, we must keep watch, lest, when the Bridegroom comes, he withdraw shut out. For if you sleep and your heart does not keep watch, he departs before he knocks; if your heart keeps watch, he knocks and asks that the door be opened to him.

We have, then, a door of our soul; we have gates too, of which it is said: Lift up your gates, O princes, and be lifted up, eternal gates, and the King of glory shall enter (Ps. 23 (24):7). There is, then, a heaven too in those in whom there are eternal gates. If you will lift up these gates of your faith, the King of glory will enter in to you, bearing the triumph of his own passion. For justice too has gates; for of these also we read it written, the Lord Jesus saying through his prophet: Open to me the gates of justice (Ps. 117 (118):19). And below the prophet David says: Praise the Lord, Jerusalem, praise your God, Zion; for he has strengthened the bars of your gates (Ps. 147:12).

There is, then, a soul that has a door, there is one that has gates. To this door Christ comes and knocks; he knocks at the gates too. Open, then, to him: he wants to enter, he wants to find the Bride keeping watch. Do not, then, make the good lover wait: he quickly withdraws, and you will seem by the sleep of your body to have shut out him who knocks. For you shut him out when you are slothful, when lazy, when drowsy. By these bars Christ is shut out: if you are chaste, if you are sober, take care that you are not negligent. He does Christ a greater injury who drives him back as he comes.

Open to me, my sister, my nearest one: he knocks at the door even when you are asleep; if only you either wake up when roused, or open the door of your breast when called, he will enter. But if you flee the reading of the prophets, if you do not read at home, if you will not listen in church, are you not like one who, with gaze turned away, shuts his eyes so as not to see what he could see, who closes his eyes so as not to look, though he has the power of seeing? Or as many in a fury have laid hands upon their own eyes; so you too at first turn away, by a pretense that shuts its eyes rather than by an abrupt refusal. For when you come to church and declare yourself to be a Christian, you seem sound, you open the eyes with which you can see; but while you pretend not to hear what is read, you close them so as not to see for yourself, even though you seem to others to see. You also lay certain hands of faithlessness and intemperance upon the eyes of your soul, and bring upon your heart a blindness (which is more grievous) that is voluntary, so that seeing you do not see, and hearing you do not hear.

Do you think you are alone when you commit fornication, and do you not remember that the eyes of the Lord see the whole earth? Do you not hear him who says: Behold, the hour comes when you will be scattered, each to his own, and will leave me alone: but I am not alone, because the Father is with me (John 16:32). The Father, then, is present, the Son of God is present too, the ministers are present, the Cherubim and Seraphim are present, who say. Holy, holy, holy, the earth is full of your majesty (Isa. 6). For the world is full of powers, because it is full of wickednesses: the whole earth is full of remedies, because it is full of snares.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
