[[commentary]]
quote='''
Nor ought mention of righteous Noah to be passed over among the Lord's generations, so that, since the builder of the Church was being born, he might be seen to have sent before him, as founder of his line, him who had founded the Church beforehand in type. For what shall I say of Methuselah, whose years are counted beyond the flood, so that, since Christ alone is the one whose life felt no age, he might seem in his forebears too not to have felt floods? And is not Enoch a manifest sign both of the Lord's devotion and of his divinity, in that the Lord too did not feel death and returned to heaven, since the founder of his line was carried up to heaven? Hence it is manifest that Christ too could have not died, but did not will it, so that that death might profit us. And Enoch indeed was carried off, lest malice should change his heart, but the Lord, whom the malice of the world could not change, returned by the majesty of his nature to the place from which he had come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
