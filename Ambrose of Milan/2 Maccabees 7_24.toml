[[commentary]]
quote='''
The youngest of the brothers remained, and Antiochus was now ashamed that he had been made such a laughing-stock by an unripe age. So, wishing to get round him by tricks, he promised him honours, riches, his own friendship, a share in his secrets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
