[[commentary]]
quote='''
He who commanded the waters to be separated by the interposition of the firmament lying between them provided also the manner of their remaining in position, once they were divided and separated. The word of God gives nature its power and an enduring quality to its matter, as long as He who established it wishes it to be so, as it is written: ‘He hath established them forever and for ages of ages. He hath made a decree and it shall not pass away.’ And that you may know that He said this concerning these waters which you say cannot exist in the higher parts of the heavens, listen to the words which precede: ‘Praise him, ye heaven of heavens, and let all the waters above the heavens praise the name of the Lord.’

Did He not speak to you in such a way as to answer your objections? ‘For he spoke and they were made. He commanded and they were created. He hath established them forever and for ages of ages. He hath made a decree and it shall not pass away.’ Does He not seem to you to be one who is fitted to give a law to His work? Here speaks to you a God venerable by nature, inestimable in magnitude, in rewards immeasurable, in His works incomprehensible, the depth of whose wisdom who can ever strive to measure? But He speaks to His Son, that is, to His arm; He speaks to His power; He speaks to His wisdom, to His justice. And the Son acts as one who is powerful; He acts as the power of God; He acts as the wisdom of God, as divine justice. When you hear this, why do you marvel if, by the operation of such majesty, water can be held suspended above the celestial firmament?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
