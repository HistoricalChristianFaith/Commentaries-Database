[[commentary]]
quote='''
Judah is a lion's whelp. Has he not plainly both expressed the Father and declared the Son? What could be so plain, to teach that God the Son is of one nature with the Father? The one is a lion, this one a lion's whelp. By a lowly comparison the unity of the same nature or power is understood. A king proceeded from a king, a strong one from a strong one. Because he foresaw that there would be those who would maintain that the Son was of a younger age, he meets them by adding: From a shoot you have come up for me. Lying down you slept like a lion and like a whelp. And elsewhere you have it that the whelp himself is the lion of the tribe of Judah. So because he had said "whelp," he did well to put "lion" at once, that is to say: Let not your ears be caught because they heard "whelp"; I have expressed a son, I did not say a lesser one. He too is a lion, like the Father. Let them hear that he called him both lion and whelp: lion, as being of perfect and full power, whelp, as being a son, lest anyone on hearing it should think the Son not equal to the Father. The Son is not so praised as to be separated from the Father. He who confesses him Son proves him equal.

Wonderfully, too, he expressed his incarnation, saying: From a shoot you have come up for me, because like a shrub of the earth he sprouted in the virgin's womb, and like a flower of good fragrance, sent forth from his mother's womb with the splendour of a new light, he came up for the redemption of the whole world, as Isaiah says: There shall come forth a rod from the root of Jesse, and a flower shall come up from the root. The root is the family of the Jews, the rod Mary, the flower of Mary Christ. Rightly a rod, for she is of royal race, of the house and country of David, and her flower is Christ, who abolished the stench of worldly filth and poured in the fragrance of eternal life.

You have, then, the incarnation; receive the passion. Lying down, he says, you slept like a lion, when he lay in the sepulchre, at rest as in a kind of sleep of his body, as he himself says: I slept and took my rest and rose up, because the Lord will uphold me. Hence Jacob too says: Who will rouse him? That is: him whom the Lord will uphold. Who else is there to raise him again, unless he raise himself again by his own power and the Father's? I see him born by his own authority, I see him dead by his own will, I see him sleeping by his own power. He who did all things by his own choice, whose help will he need in order to rise again? He himself, then, is the author of his own resurrection, who is the arbiter of death, who is awaited by the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"

[[commentary]]
quote='''
Love is God, as we read; love is Christ (1 John 4:8). He is roused as a lion, and a lion's whelp; that he may come up from the shoot of Judah (Gen. 49:9): he is roused again as one sleeping, as one lying down; because not by a human majesty, but by his own and the Father's, he was raised from the dead. Hence Scripture says: Who shall rouse him? For neither an angel nor a Power could rouse him by a majesty not his own, since he himself roused others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
