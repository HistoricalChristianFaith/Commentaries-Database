[[commentary]]
quote='''
The Law also teaches you that the world must be fled and God followed. For what else does it teach when it says: You shall appoint cities for yourselves as a refuge, and they shall be refuges for you, to which the manslayer may flee for refuge, everyone who has struck down a soul unwillingly; and below: Six cities shall be refuges for you. Three cities you shall give beyond the Jordan, and three cities you shall give in the land of Canaan? Openly, indeed, refuges have been set forth for those who take refuge because of this crime of manslaughter; but let us consider it more deeply. There are four things which warn us that the secrets of this reading must be looked into more profoundly. The first: for what reason, out of those cities which fell by lot to the Levites as their portion, six cities were given as a refuge to those labouring under the crime of manslaughter, and why the cities of the other tribes were not also assigned to this office. The second: for what reason six in number; for this number, of neither more nor fewer cities, does not seem to have been prescribed idly. The third: why three cities were appointed beyond the Jordan and three in the region of Canaan, to be a refuge for those who sin. The fourth: why a reckoning and definition of time was laid down, within which the manslayer should dwell in the city of refuge, until the high priest dies, and after the death of the high priest the manslayer should return to the city of his dwelling. We must, then, speak of each, and resolve the questions in the order in which we have set them forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 2"
