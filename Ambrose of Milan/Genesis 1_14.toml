[[commentary]]
quote='''
This statement can give us occasion for thought: ‘Let there be lights in the firmament of the heavens to separate day from night,’ because it had already been said, when God created the light, that ‘God separated the light from the darkness and there was evening and morning, the first day.’

But let us reflect on the fact that the light of day is one thing and the light of the sun and moon and stars another, for the reason that the sun itself with its rays appears to add to its brilliance to the light of day. This can be seen at the dawn of day or at its setting. There is daylight, in fact, before the rising of the sun, but it is far from being brilliant. The light gleams forth more resplendently, of course, when the sun is at noon. This is pointed out by the Prophet when he says: ‘And he will bring forth thy justice as the light and thy judgment as the noonday.’ He compares the justice of the saint not merely to light: he means the light of midday.

Therefore, God ordained that there should not be just one indication by which to distinguish day from night. He established two signs by which light should be divided: one at the rising of the sun and another at its setting. Likewise, the rising of the stars would mark the division between the setting of the sun and the beginning of night. When the sun has set, there still remains some remnant of daylight until darkness covers the earth. Then the moon rises and the stars. It is very evident that the extent of the night is measured by the illumination of the moon and stars, since the sun on its rising causes the glitter of the moon and of all the stars to be invisible by day. As to the day, even the burning rays of the sun can inform us that daylight and sunlight differ both in their nature and in their aspect. The aspect of daylight is uncompounded: it merely furnishes light. The sun, on the other hand, not merely has the power of illuminating; it has also the power of heating. The sun is fiery, and fire both illuminates and burns.

Hence, when God wished to show to Moses His marvelous power for the purpose of stirring him to greater zeal in His service and of inflaming his heart to belief, He appeared to Moses in a flaming bush. But the bush was not afire; it appeared merely to shine with the appearance of fire. One function of fire, therefore, was void, the other was in operation. The power of kindling was lacking, though the power of illumination was functioning. And so Moses marveled that fire, contrary to its nature, did not burn the bush, since this was an element which usually consumes materials of a more solid nature. The fire of the Lord illuminates, not consumes.

Still, you perhaps may say, wherefore is it written: ‘I am a consuming fire’? Your suggestion is a good one. God usually consumes only the sinful. Even in the retributions dispensed to men in accordance with their merits we perceive the nature of divine fire. It illuminates some and consumes others. It illuminates the just and consumes the wicked. It does not illuminate the same people which it consumes. Rather, its illumination is inextinguishable in the direction of its performance toward the good, whereas its power of consumption is mighty to punish the sinner.

But let us return to the division between day and night. At the coming of daylight, night is put to flight. At the departure of daylight, night appears everywhere. There is no association between light and darkness, since the Lord set this down as a principle at the beginning of His work. When He made the light, He made a distinction between light and darkness. Accordingly, in clear daylight, when the sun has sprinkled its rays upon the earth, we see how the shadow of an object, man, or plant is separated from the light. We note how in the morning this shadow falls toward the west, while in the evening it turns toward the east and in midday toward the north. Nevertheless, the shadow is a thing apart and has nothing in common with the light. In a similar way, night seems to yield to daylight and to verge away from its light. In fact, as has been pointed out by more expert authors who have precedence over us whether in time or in ability, night is a shadow of the earth.

The shadow adheres and stays close to the body in accordance with nature, so much so that artists strive to depict the shadows of objects in their paintings. They maintain that it is the province of art not to ignore a quality inherent in nature. An artist whose painting does not represent the requisite shadows may be likened to one who contravenes the natural law. When, then, an object in daylight happens to face the sun, there arises a shadow of that part from which the sunlight is deflected. In the same way, at sunset, when the earth stands in the way of the light of day or of the sunlight, there is an effect of shadow. Hence it is clear that night is caused by the shadow of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
God made the sun, moon, and stars, and allotted to them the measurement of time, the sun for the daytime and the moon and stars for night. The former augments the beauty of the day; the latter illumine the shadow and the darkness: ‘Let them serve as signs and for the fixing of seasons, days and years.’ The sun, moon, and stars divide time in diverse fashion, but in an equal manner in respect to changes based on months, and ‘they serve as signs’ for them, also. We cannot deny that some signs are formed from the sun and moon together. The Lord said: ‘And there will be signs in the sun, moon and stars.’ And when the Apostles asked for a sign of His coming, He replied: ‘The sun will be darkened and the moon will not give her light and the stars will fall from heaven.’ These, He said, were to be the signs of a fulfillment in the future, but for us in our anxiety these should serve as an appropriate measure of time.

In fact, some men have attempted to set down the characteristics of birth days and the future state of each new-born child. Yet a prognostication of this sort is both vain and useless to those who seek it and is an impossibility for those who promise it. What is so inane as to suppose that everyone should be convinced that he is what his birth has made him? No one, then, ought to change his condition of life and his habits or strive to become better, but, rather, remain in that conviction. In which case you cannot commend the good nor condemn the wicked, since each seems to comply with the destiny of his birth. And wherefore has the Lord laid down rewards for the good or punishment for the wicked if their habits are prescribed by fate and their social behavior depends on the course of the stars? And what else does this lead to other than to deprive man of his humanity, if no room is left for character, no outlet for education or for freedom of action?

How many do we see snatched from amid their vices and sins to be converted to a better life? It was certainly not the circumstances of their birth which freed and called the Apostles from the company of sinners. Rather, the coming of Christ sanctified them and the hour of His Passion redeemed them from death. The condemned thief who was crucified with our Lord passed over into everlasting paradise, not because of a favorable nativity, but because of his confession of faith. It was not the influence of his natal star, but the offense of having neglected the divine prophecy which cast Jonas into the sea. A whale which received him and after three days vomited him forth, as a symbol of future mystery, and preserved him for the service of prophecy. Peter was rescued from impending death in prison by the angel of Christ, not by the disposition of the stars. Blindness converted Paul to grace when he was struck by a viper. When he was a victim of shipwreck he was saved, not by his natal star, but by the merits of his piety.

What shall we say of those who by the prayers of the Apostles arose from the dead? Was it their natal star or the grace of the Apostles that restored them? What need was there for them to resort to fasting and expose themselves to danger, if they could obtain what they desired simply by virtue of their natal star? If they had put their trust in that, they would never, while awaiting the destinies meted out to them by fate, have reached such perfection of grace.

What about the impossibility of all this? In fact, if we allow some force to their arguments for the sake of refuting them and not for the sake of proof, they say that the time of our birth is of great importance. This time should be determined strictly within the limits of moments of the smallest extent, because, if no heed is paid to exactness, the greatest differences do ensue. Only the tiniest moment separates the nativity of the helpless from that of the powerful, of the needy from the rich, of the innocent from the guilty. It often happens that at the same hour is born one who is destined to a long life and one who will die in early childhood, if other circumstances turn out to be dissimilar and if there is just one single point of difference.

Let them reconstruct the following if they would. Suppose a woman is giving birth to a child. As a matter of course the midwife first observes the child. She looks for his cry as giving evidence of life and notes whether the child is a male or a female. How many moments will you allow for all these acts? Suppose that there is an astrologer near at hand. Can a man be present at a childbirth? While the midwife is giving information and while the Chaldean is listening and setting up the horoscope, the fates of the new-born child have already entered the space of the lot belonging to another person. It follows that while an investigation is being made regarding the fate of one person, the nativity of another is in the process of being established.

Even suppose that what they maintain concerning fate and nativity is true, their conclusions cannot, however, be true. A moment passes away: ‘Time is flying beyond recall.’ There is no doubt that time is made up of moments and of ‘a twinkling of an eye.’ I am led to believe that assumption since we shall all arise, as the Apostle testifies, in a moment, in the twinkling of an eye: ‘Behold I tell you a mystery: we shall all indeed rise, but we shall not all be changed—in a moment, in the twinkling of an eye, at the last trumpet and the dead shall rise incorruptible and we shall be changed.’ Between the time when the child was born, taken up, and laid down again; between the time of his cry and the report of it, how many moments do you think have elapsed!

So far I have only touched the surface of this question. The upholders of this system divide that well-known circle of twelve signs, which has such vital importance for them, into twelve parts. Furthermore, as the sun travels over the twelfth part of that indescribable sphere—it completes its course in this way in the period of a year—they divide each one of these twelve parts into thirty smaller divisions which the Greeks call μοῖραι, and each of these smaller divisions they separate in turn into sixty other individual parts. How incomprehensible all this is! To think that the moment of a nativity is made up of a sixtieth of a sixtieth part and that such is exactly the motion and the aspect of each sign occurring at the actual moment of a nativity! Wherefore, since it is impossible to take such tenuous moments of time into account and since the slightest variation introduces an enormous error, the whole affair is based on mere phantasy. Its advocates are ignorant of their own destiny. How, then, can they know that of other men? They do not know what is in store for themselves. Can they announce the future of others? It is ridiculous to believe this, because if they were able to do so, they would inevitably foresee what the future held for themselves.

Now how stupid it is to think that if a person were to say that he was born under the sign of Aries and should suppose that, just because such an animal is pre-eminent in his own herd, he himself would turn out to be conspicuous for his wisdom! Or that he would become quite rich for the reason that the Ram possesses by nature a raiment and every year puts on a new and costly garment. Wherefore this man would appear to be one who is destined to be no stranger to profit and gain. In a similar way they form their conclusions regarding the signs of the Bull and the Fishes. From the nature of ordinary animals they consider that the significance of the movements of the heavens and of the signs can be interpreted. And so our food and our sustenance have established for us the destines of our lives, that is to say, the Ram, the Bull, and the Fish imprint on us the norms of our character! Wherefore, then, do they summon from heaven the causes for material things and the basis for this life of ours, when at the same time they share the causes of their own motion with the celestial signs, arguing from the very qualities of ordinary human food? They maintain that a person born under the Ram is generous because the ram yields its wool without resistance. They prefer to ascribe that kind of virtue to the nature of an ordinary animal than to heaven, from which comes to us the gleam of sunshine, and often, too, a downfall of rain. They assert that those who at their birth fall under the aspect of the Bull will be subject to toil and will endure servitude, because that laborious animal willingly submits his neck to the yoke. They say, too, that those whom at their birth the Scorpion has encircled will turn out to be assassins and that they will spit out the venom of wickedness—a venom which is in essence poisonous.

Why, therefore, do you pretend on the basis of the significance of celestial signs to give an authoritative standard for living? Why do you present certain nonsensical facts as proof of your assertion? If the movements of the heavens take their character from the moral qualities typical of such animals, then heaven itself seems to be subject to the influences of bestial natures, since from these natures it supposedly has received a substantial and vital force which it would communicate to men. But if this is a far cry from what is the truth, so much the more ridiculous is it to think that these men, deprived as they are of any solid basis of fact, should have recourse to this assumption in order to give credence to their arguments.

Next let us consider the fact that they give the name of ‘planet’ to those signs which by their movements determine the destinies of our lives. Either, as the name indicates, the planets wander for all time, or, if we follow their own statements, they move along in rapid motion. We are told that the planets in innumerable circular movements change their positions ten thousand times, or, if this seems incredible, show manifold aspects each day. Whatever may be the case, it cannot be accepted that such a wandering course and such a swift motion can be the means of establishing a fixed and immovable lot as a basis for our lives. Again, they maintain that the movements of the planets are not all equal. Some move around with more speed, others are slower in motion, so that they often at the same time gaze upon and hide from each other in the course of their transits.

They say that it makes considerable difference whether favorable or unfavorable and harmful signs look at the inception of a birth and the difference in birth lies in the fact that the aspect of a favorable sign confers very great benefits, while that of an unfavorable sign brings with it considerable harm. Such are the terms which they use of these very signs that they hold in veneration. I feel it necessary to make use of the vocabulary of those whose assertions I discuss, lest they proceed to remind me that their arguments have been ignored rather than utterly refuted. For example, that wandering and swift movement to which I have made reference escapes their comprehension in their attempt to establish to a nicety as an aspect of a favorable sign a point or moment of incomprehensible time. It frequently happens, in fact, that the threat of an unfavorable sign enters as a disturbing factor in the midst of their calculations.

What wonder, then, if men are deceived when favorable signs are defamed? If the very nature of these signs is believed to be unfavorable, then God, who is supreme, is accused of being the creator of evil and responsible for wickedness. If, in fact, the signs are considered to have taken on by their own volition the power of harming the innocent and injuring those who are conscious of not having up to that time done any vile deed for which a punishment is assigned even before the fault is committed, what, I repeat, is so irrational, exceeding in that respect even the irrationality of beasts, as to attribute the practice of deceit or of good will, not to the merits of men, but to the movements of the signs? He was in no way guilty, it is said, but an unfavorable sign looked upon him! He came in contact with the star of Saturn. On the other hand, by a very slight deviation, according to their calculations, bad omens are shunned and wrong-doing avoided.

This wisdom of theirs is similar to that encountered in a spider’s web from which a gnat or fly cannot extricate itself once it has become entangled therein. However, if an animal more robust by nature is seen to enter the web, right away it passes through, breaks the feeble strands, and destroys the useless snares. Such are the nets of the Chaldeans. In these nets the weak are trapped, but those of a more robust nature find no obstacle there. You who have more strength of character say to the astrologers when you see them: You weave spider’s webs which cannot have any use or binding force when a person strikes against them, not in a moment of weakness like a gnat or a fly, but like a sparrow or a dove, rending their meshes in the swiftness of their winged flight.

In fact, what sensible man would believe that signs, which frequently change from day to day and so many times return on themselves, can by their movements denote what are the indications of future power? If such were the case, what combinations indicating royal birth would be announced day after day! As a consequence, kings would be born every day. Succession to the throne would not be transmitted to sons. Rather, at all time men of diverse social conditions would arise who would lay claim to the rights of imperial power. What king, therefore, would care to think under these circumstances of the birth of a son to succeed him, if the royal power is destined for someone else and if it is not within his own power to hand down to his own children the imperial succession?

We read, of course, that ‘Abia begot Asaph, Asaph begot Josaphat, Josaphat begat Joram, Joram begat Ozias,’ and so up to the time of the captivity every succession took place through a line of kings of equal rank and honor. Do you think that, because they were kings, they had the power actually to govern their own movements—movements which were committed to the control of the celestial signs? What human being can have dominion over these?

Again, if all our acts and deeds depend on the fates acquired at our birth and not on principles of morality, why are laws established and statutes promulgated by which punishment is meted out to the wicked and security bestowed on the innocent? Why is pardon not granted to the accused, since, to be sure, they fell into crime by reason, as is maintained, of necessity and not by an act of their own will? Why does the farmer toil and not rather wait until it is time to convey into his storehouses the produce for which he has not labored, relying on the prerogatives of his birth? If he was destined by birth to be endowed with wealth without the expenditure of labor, he should undoubtedly wait until the earth brings forth fruit spontaneously without seed. If such were the case he should not sink his ploughshare into the earth or put his hands on the curved scythe or undergo the expense of harvesting the grapes. Rather, the wine would without effort flow plenteously into his stock of jars. Without effort, too, he would let the wild olive berry exude its oil without the labor of grafting upon the trunk of the olive tree. In the same way a merchant who travels over the wide seas would not be in dread of the perils that threaten his own life, for it is within his power, because of a certain destiny allotted to him at birth, to come without labor into a wealth of treasure.

But this is far from the accepted opinion. As a matter of fact, the farmer cleaves the earth ‘with deep-driven plough’; ‘stripped he ploughs, stripped he sows’; stripped in the glowing ‘heat he thrashes on the floor the parched ears.’ The merchant, impatient when the east winds are blowing, ploughs the sea often when the course is unsafe. Insolent and rash men such as these are condemned by the Prophet, who says: ‘Be thou ashamed, O Sidon, the sea speaketh,’ that is to say, if dangers do not move you, then shame can check and modesty confound you. ‘Be thou ashamed, O Sidon,’ in which there is no place for virtue, no care for safety, no young men exercised in arms and ready to fight in defense of their country. They are anxiously and entirely preoccupied with gain and the benefits derived from commerce. ‘What the merchant sows, so does he reap.’

What reward is there for a Christian, if in his activities and labors he follows the dictates of necessity, not those of his own free will? There, where destiny decides, personal initiative is held in no esteem.

We have spoken at length on this subject and do not desire to say any more, lest some people may form the opinion that what was taken up merely for the purpose of refutation has been presented for the purpose of publicizing it. As a matter of fact, how can these subjects which as children we held in ridicule now seriously enter our thoughts in our declining years? Therefore, let us now direct our pen to what remains of our reading of Scripture.
'''
