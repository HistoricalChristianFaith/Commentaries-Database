source_title="The Six Days of Creation"

[[commentary]]
quote='''
‘Let there be lights to serve as signs and for the fixing of seasons, days and years,’ He said. We have already discussed the subject of ‘signs.’

What are seasons but successive changes, that is, winter, spring, summer, and autumn? During these seasons the passage of the sun is either swift or slow, scarcely touching us at one time with its rays; at another, burning us with its heat. And so we have winter when the sun lingers in the southern regions. When the sun is somewhat far away, the earth grows rigid with frost and is stiffened by cold. The earth is covered by all-pervading nocturnal shadows, so that the nights are much longer in extent than are the days. From this fact it happens that during the storms of winter a great amount of snow and rain is precipitated. When, however, the sun, leaving the southern regions, returns to its position over the earth, the duration of day and night becomes equal. Then, the more it prolongs its sojourn, the more it gradually tempers the air with its heat and with the clemency of its atmosphere, which fosters all things and forces them once more to reproduction. The result is that the earth germinates and the seeds released from the furrows come to life again, the trees sprout and in their effort to perpetuate their kind successively each year all species of terrestrial and marine life propagate themselves. But when the sun rises toward the summer solstice in the north, the daytime is lengthened, thereby narrowing and restricting the period of night. And so, the more assiduously the sun links itself and mingles with our atmosphere, the more completely does it furnish heat to the air and at the same time dry up the moisture of the earth, thus causing the seeds to sprout forth and the offspring of the forests to ripen, as it were, into manhood. At the time when the sun becomes warmer, the shadows at noon become shorter, inasmuch as the sun in this region shines from a position high above us.

Since the Synagogue says in the Canticle of Canticles: ‘Show me, O thou whom my soul has loved, where thou feedest, where thou liest at midday, lest perchance I begin to wander after the flocks of thy companions,’ that is: Announce to me, O Christ, whom has my soul loved. Why not rather whom [my soul] loves? The Synagogue loved, but the Church loves and never changes her affection for Christ. ‘Where thou feedest,’ we read, ‘where thou liest at midday.’ I desire to follow you into those places like a foster-child, to whom I once held fast as if in wedlock and I wish to search for your flock because I have lost mine. You feed at midday in the Church’s pasture where Justice shines, where Judgment gleams like the noonday, where no shadow is seen, where the days are longer, because the Sun of Justice dwells therein for a longer time just as in the months of summer. The day of the Lord is, therefore, not brief. It is long because it has been written: ‘Before the great day of the Lord doth come.’ Hence Jacob says: ‘All the days of my life are brief and evil,’ for a dubious light is evil. Brief days are, therefore, of dubious light and are not luminous. The contrary is true of the long days, as many people who live in warm countries realize from experience. Accordingly, the Synagogue in its brief and evil days was in very deep shade. Its type is often expressed in the person of Jacob or of his people. It did not behold the Sun of Justice shining from overhead, but, rather, since winter was at hand, shining from the direction of the south. But this is said to the Church: ‘The winter is now past, is over and gone. The flowers have appeared in our land, the time of the harvest has come.’ Winter existed before the coming of Christ; after His coming, the flowers of the spring and summer’s harvest appear. Since it faces the light shining from the south and from the region of the converted Gentiles, the Synagogue lies in shadow. The Gentiles ‘who sat in darkness’—the Gentiles, the people of the nations, a confused people—‘have seen a great light; to them that sat in the region and shadow of death, a light has arisen.’ This is a great and divine light which is not darkened by any shadow of death. So it shines from above, because through the voice of Zachary it is written: ‘Wherewith the Orient from on high has visited us, to shine on those who sit in darkness and in the shadow of death.’ There is, of course, a shadow of salvation, not of death, as has been said: ‘Thou shalt protect me under the shadow of thy wings’—‘shadow,’ in fact, because it is of the body; ‘shadow,’ too, because it is of the cross. It is the shadow of salvation, because in it was the remission of sins and the resurrection of the dead.

We can state the problem succinctly in the following way: winter days are short while their shadows are long; summer days are long, whereas their shadows are short. In the middle of the day a shadow is shorter than it is at its beginning or end. This is the situation with us who live in the west. However, there are people living in the southern regions who for two days in the year are without shadows, since the sun’s rays strike from a position directly overhead, thus illuminating everything on all sides. Hence, these are called in Greek ‘Ascii.’ Many also report the fact that in that region the sun is so perpendicularly situated above that water can be seen gleaming deep down through the narrow openings of a well. In the south there is report of a people who are called ‘Amphiscii’ because they cast a shadow on each side.

The person, in fact, who travels in the direction of the sun casts his shadow behind him. This happens when he advances toward the east in the morning hours or toward the south at midday or toward the west at sunset. From three directions, therefore, may the sun strike a person; from the east, the south, and the west. Our shadows are behind us in the morning and in the evening, and at noon the situation is similar. Moreover, the sun does not reach us from the north. For that reason, if you face northward in the morning or in the evening or at midday you cast no shadow behind you. Only those people who live in the southern regions of this world which we inhabit are able, it appears, to cast their shadows in a southerly direction. This is said to happen in the height of summer when the sun is advancing toward the north.

For us there is the relief of autumn. At its coming the excessive heat of summer is broken. Autumn, relaxing its warmth and moderating its temperature to what is equable, hands us over without malice or harm to the breezes of winter.

‘Let there be [lights] for the fixing of days,’ says the Scripture—not that they may make the days, but that they may have a principal part in their making, so that the sun may illuminate the dawn with more generous gifts and with its light can designate the course of the entire day. In such a sense some interpret the words of the Prophet: ‘The sun to rule the day, the moon and the stars to rule the night,’ as they cast their lights around.

The sun and the moon, too, were designed ‘to fix the years.’ The moon in twelve times thirty days, according to the Hebrews, completes the year with the addition of a few days, and according to the Romans with an intercalary day added every fourth year. The solstitial year is that portion of time which corresponds to the completion of a period in which the sun makes a circuit through all the signs and then returns to the point of its departure.
'''
