[[commentary]]
quote='''
So the colt was in the village, and it was tied with the ass. It could not be loosed except at the command of the Lord. The apostolic hand loosed it: such the deed, such the life, such the grace. Be such that you can loose those who are bound.

Now let us consider who they were who, when their error was discovered, were cast out of paradise and bound in the village. And you see how life called back those whom death had driven out. And therefore according to Matthew we read of both an ass and a colt, so that, since in two human beings each sex had been driven out, in two animals each sex might be called back. So there, in the mother ass, he figured as it were the Eve of error, but here, in the colt, he expressed the generality of the Gentile people.

And therefore the colt of the ass is sat upon. And well: on which no one has sat, because no one had, before Christ called the peoples of the nations to the Church. Indeed according to Mark you have it thus: which no one of men has yet sat upon. But it was held tied with the chains of unbelief, made over to an unjust lord, a slave to error; but he could not claim dominion for himself whom not nature but guilt had made lord. And therefore when 'Lord' is said, one is recognized — for there are indeed many gods and many lords, but in a general sense — one God and one Lord. So if the Lord is not specified, he is defined no longer by the addition of a person, but by the universality of nature.

But Mark brought in the colt tied before the door, because whoever is without Christ is outside, in the road, but he who is in Christ is not outside. He added in the thoroughfare, where no one has a sure possession, no manger, no food, no stable. Wretched is the servitude whose right is unsettled; for he who does not have one master has many. Strangers tie up so as to possess; this one looses so as to hold; for he knows that gifts are stronger than chains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
