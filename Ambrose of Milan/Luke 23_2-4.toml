[[commentary]]
quote='''
There follows an admirable passage, by which a moral patience for bearing injuries with equanimity is poured into human hearts. The Lord is accused and is silent. And well is he silent who has no need of a defense: let those seek to be defended who fear to be defeated. So he does not confirm the accusation by being silent, but despises it by not refuting it. For what should he fear, who did not seek his own safety? The Salvation of all gives up his own, that he may gain that of all. But why should I speak of God? Susanna was silent and conquered; for that cause is the better which is not defended and is proved. And here Pilate acquits, but he acquits by his judgment, he crucifies by a mystery. But this is proper to Christ, and that is human: that before unjust judges he should seem rather to have been unwilling than unable to be defended.

Why the Lord was silent he himself said beforehand, saying: If I tell you, you do not believe me; if I ask you, you will not answer me. Yet this was most excellent, that he chose to prove himself a king rather than to say so, so that those who confess the very thing they charge against him could have no ground for condemning him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
