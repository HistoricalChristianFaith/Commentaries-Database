[[commentary]]
quote='''
It is important then to consider, in what condition He ascends the cross; for I see Him naked. Let him then who prepares to overcome the world, so ascend that he seek not the appliances of the world. Now Adam was overcome who sought for a covering. He overcame who laid aside His covering. He ascends such as nature formed us, God being our Creator. Such as the first man had dwelt in paradise, such did the second man enter paradise. But about to ascend the cross rightly, did He lay aside His royal garments, that you may know that He suffered not as God, but as man, though Christ is both.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The garments are divided; one thing falls to one man by lot, another to another; for the Spirit of God is not grasped by human opinion, but glides in as by a certain unexpected chance. And perhaps these soldiers bear the type of the four evangelists, who wrote down the title, which we may all read. I read the title of the King of the Jews when I read: My kingdom is not of this world; I read the charge against Christ written above his head when I read: And the Word was God; for the head of Christ is God.

These, then, were guarding Jesus, and they guard him today, lest perhaps he should slip away from anyone, lest for anyone he should come down from the Passion, as the people of the Jews was asking. For me, plainly, let Christ die in the Passion, that after the Passion he may rise again. He would not come down for himself, that he might die for me. For us, therefore, Christ is now kept; for our sake his garments are divided. Individuals cannot have everything, and therefore lots are cast over the tunic, because the division of the Holy Spirit is not made according to the will of man; there are divisions indeed of graces, but the Spirit has worked, dividing to each as he wills.

Look now at the garments of Christ divided. Where shall I seek them? Seek in Matthew: you will find with him alone the scarlet cloak, with John the purple garment, with Mark the purple only, with Luke the white garment; for with this alone was he content as his portion. How many, then, has Christ clothed with his garment! But I think that he clothed not four only, but all the soldiers, and abounded for all. But let us return to the evangelists.

These four parts, then, seem to me to be not parts of garments but qualities of virtues. For one wrote more loftily of the kingdom, another more fully of the formation of man. Luke chose for himself the splendor of the priestly garment; Mark did not want a woven texture of words; finally John wove in, as it were, certain sentences with which to clothe our faith. Does not that seem to you woven in: In the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God. All things were made through him? But Mark, as if content with the brilliance of the purple, without any weaving in of words: The beginning he says of the Gospel of Jesus Christ, the Son of God.

Therefore the garments of Christ that were divided are either his deeds or his grace, because the tunic could not be divided, that is, faith, since it belongs not to the portion of individuals but by right is common to all; for what is not divided among individuals remains whole.

And well woven from above; for so is the faith of Christ woven, that it comes down from divine things to human things, in that he who was born of God before the ages took up in a later time the assumption of flesh. It is signified to us, therefore, by this that faith ought not to be torn but to remain solid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
