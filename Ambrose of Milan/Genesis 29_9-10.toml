[[commentary]]
quote='''
And he came to Laban and fed his sheep. Wickedness sits idle and unattended; wisdom does not neglect the duty of ruling. It does not know how to be idle even in what belongs to others, it does not know how to be an exile among strangers. For how is it an exile, when everywhere it keeps its own right and has in itself what it possesses?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 4"
