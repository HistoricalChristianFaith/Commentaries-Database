[[commentary]]
quote='''
Most beautiful too is this passage for arousing zeal for devotion, in that he who follows God is always safe. And therefore we ought to prefer God to all things, and neither regard for our country nor love of parents and children nor consideration for a wife ought to call us back from carrying out the heavenly precepts, because God bestows all those things on us and is able to preserve what he gives. Thus it is a great example of Abraham's devotion that he went down into Egypt with a beautiful wife. The just man did indeed have a care for conjugal chastity, but greater was his zeal to bring his devotion to fulfilment without delay, lest he should seem to have preferred the guarding of his marriage bed to the heavenly commands. And so, since for God's sake he despised all things, he received all things multiplied from God. But first God gave a reward to chastity, which he knew to be pleasing to the wife; for since in his zeal to fulfil the heavenly oracle he had led his wife too into danger to her modesty, God also defended the purity of the marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"
