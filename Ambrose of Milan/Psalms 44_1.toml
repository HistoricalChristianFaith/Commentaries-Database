[[commentary]]
quote='''
The title of the psalm is: Unto the end; for the sons of Korah, of understanding. Now that the mysteries of the Lord's Passion, of baptism and of the approach to the most holy altar have been gone through, the holy prophet David teaches how Christ trains his athlete, whose name is to be enrolled in the contest of the saints. For just as, without labour of ours, not from works but from faith, through his grace, he forgave us our sins, and most indulgently and kindly admitted us to seek the crown, and did not let our former crimes stand against us, by which we would be judged unworthy of so great a contest — for even in those who undergo this lustral contest a discipline of living is also required —, so in turn, lest, slackened by so great a forgiveness of sins, we return to our former crimes or to sloth, this psalm warns us that many and heavy contests are set before us, so that no one is crowned except he who has contended lawfully. We must wrestle, then, against the enticements of this flesh and the heat of the blood; we must wrestle against spiritual wickednesses. No one is more grievous than an adversary of one's own household, no one more harmful than that enemy whom the power of a heavenly substance supports. When I say 'no one', remember the divine saying in which the Lord said that among those born of woman there is no one greater than John the Baptist; for he who was born of a virgin is himself above all. And therefore let us, who have Christ, fear no one, since, if Christ is for us, who is against us? Let us contend, then, unto the end, so that, when all the things which formerly fought in our body against Jesus and the Lord's will have been made void, we may, intent on the exercises of true virtue, serve our God and Lord alone. For this is the end, as it is written: Christ the firstfruits, then the end, when he shall have delivered up the kingdom to God and the Father, when he shall have made void every principality and power and virtue, so that death may be destroyed last, and we may begin to be subject to God, keeping within us the heavenly kingdom where before there was the cesspool of sins.

Rightly, then, it is inscribed Unto the end; for the sons of Korah, of understanding, so that in coming to know it not common hearing but spiritual understanding may be at work. Indeed Aquila has put 'a psalm of discipline'. And therefore Scripture says to you: Give your heart to discipline, and prepare your ears for the words of understanding, and elsewhere: Love wisdom and discipline. Wisdom is that which wells up from the understanding; discipline is the form of the virtues grown together into a kind of habit of nature, and the judgement of the mind strengthened by the disciplines of knowledge. Scripture has also taught us to understand obscure speech, the prudence of sayings and the riddles of Proverbs; and on its authority we gather that these are the principal virtues of prudence, in that wisdom, like a fruitful mother, is always bringing forth, discipline, like a sterner mistress, holds in check, and understanding, like a diligent searcher, finds and probes out true righteousness and judgement.

Let us show these things by testimonies of the sacred reading. Wisdom says: I, like a fountain from paradise, said: I will water my garden, and further I will pour out doctrine like prophecy; for like a devoted mother she pours her offspring and good thoughts into the mind of man. Take also the testimonies of discipline: My son, do not neglect the discipline of God, nor faint when you are rebuked by him; for whom God loves he rebukes. Discipline is indeed severe in rebuking, but sweet in correcting, so that we may not drift and wander astray, but be received by Christ; for discipline, as it is written, when untested, wanders. But here he has put discipline for manner of life. Yet as with wisdom, so with discipline: both the perfect and the imperfect are called by the same name; but where discipline or wisdom is named without any addition, they take the definition of perfection. Untested discipline, then, drifts, but tested discipline does not drift. Of understanding too the same Scripture gives a definition, that understanding is good to all who practise it. And since understanding holds in itself both the grace of wisdom and the order of discipline, we are surely taught that both wisdom and discipline are good to those who carry out their precepts in their own ministries. We have spoken of the title; let us take up the psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
O God, with our ears we have heard. So Symmachus. Theodotion said in our ears, as did the Seventy also. What does he mean in saying 'with our ears'? If 'we have heard' was not enough, surely, if that was what he wished, 'with ears we have heard' was complete. Since, then, 'our' has been added, what does it mean, unless that you should understand that those things are ours which belong to the mind, and that these are better than those which belong to this body? And therefore this same prophet says here, as though of another: I will not fear what the flesh may do to me, and elsewhere: With my voice I cried to the Lord, and my voice to God, and he regarded me. That is my voice which is heard by Christ, not that which resounds in public. He does not wish, then, that what is corruptible and earthly be his own, who remembers that he was created in the image and likeness of God. Indeed Scripture teaches us that man was first formed in the image of God, and afterwards made from clay. As the superior, then — for he is superior who is older —, the vigour of the soul, both pilot and ruler of this body, says: with our ears we have heard. Who is this, unless the one to whom it is said: He who has ears to hear, let him hear? For there are those who have ears and cannot hear the mysteries, of whom Jesus says in the Revelation of John: Outside with the dogs and the sorcerers and the unchaste, whose ear for hearing the lust for crimes and the rust of money has stopped up. Let us consider, then, what they say they have heard, or from whom they recall having heard it.

Our fathers, he says, have declared to us. Who are these fathers? The title holds that the psalm was written for the sons of Korah, to be sung by them, who had received the office of singing psalms and had been appointed to a duty of this kind. Now Korah and Dathan and Abiram, with others who had risen up against Moses and Aaron in stubborn zeal, were swallowed by a chasm of the earth in the desert and killed. When they were dead, what other fathers could have declared to their sons the wonderful works of the Lord? For into a malicious soul wisdom does not enter. If, then, they did not declare it to their own sons, much less to strangers, who would have shunned the offspring of the unbelieving. Who, then, are these fathers? See whether they are not those of whom it was said: Ask your father, and he will tell you. You ask when you read Paul; or, if you do not read him and something troubles you, inquire of him. For he is a good father, who can teach and form the Lord Jesus in us, as he himself testified, saying: My little children, with whom I am in labour until Christ be formed in you. The Evangelist John shows you these fathers, who says: I say to you, fathers, who have known what is from the beginning. These are the fathers whose old age is a spotless life. Therefore in the gathering of the elders put your finger to your mouth, so that you may hear what will profit you and come to know the sacraments of eternal life, lest, an insolent recruit, you make a din against your teachers and presume to speak when you ought still to be learning. Let us hear, then, what these fathers declared to the sons of Korah.

The work, he says, which you wrought in the days of old. Let us inquire what these days are in which God wrought great and wonderful things. Scripture teaches us that there are certain glorious days in which divine deeds have shone forth, since it is read that the sun shall be turned into darkness and the moon into blood, before the great and illustrious day of the Lord comes; and it shall be that whoever calls upon the name of the Lord shall be saved. For on that very day Christ rose again for men, and therefore it was said specially of it: This is the day which the Lord has made; let us exult and rejoice in it. Though God made all days, yet to this day above the rest the prerogative of the divine work has been given, the day on which all sin was taken away; but the other days are days of sins. This, then, is the day which that sun of righteousness has lit up; for righteousness itself is also wont to have its risings and its settings, whence it is also written: In his days righteousness shall arise. There are, then, days of Christ in which righteousness has arisen, there are days of Christ in which abundance of peace has arisen, there are days of Christ in which wisdom has arisen. Hear how wisdom arises: If anyone among you seems to be wise in this world, let him become a fool, that he may be wise. And therefore Wisdom, which has chosen the foolish things of this world, says: The Lord created me the beginning of his ways for his works. For as in the days of King Uzziah, in the days of Nebuchadnezzar, unbelief arose and captivity held sway, so in the days of the Lord Jesus faith arose, which has spread the splendour of its brightness and light over the whole world. For what days are better than those in which the vision of God shone upon us, as Jacob said? For thus it is written: I saw God face to face, and my soul was saved. And at once the sun rose upon him. Who is this sun, unless he who made the days of righteousness shine, in which Christ was born on earth of a virgin? Jacob saw in figure and said that he had seen God; the Jews saw in truth and did not believe. Therefore for them the days were shortened, for us lit up, since for them the day was failing, for us it was drawing near. Hence holy David, fleeing the blindness of the Jews, says: Do not lead me off at the half of my days. For the day of the Lord is great and illustrious in this way: surely not by length of time, but by the brightness of righteousness or of grace. Half-days, then, are those which are shortened by the darkness of ungodliness and the squalor of unbelief, those in which the sun sets upon the prophets, as it is written. For as the sun of righteousness rises for the righteous, so it sets for unbelievers.

But that saying meets us in which the Lord says: For the sake of the elect the days shall be shortened, and it seems contrary, unless you pay careful attention and go back over what precedes. For the Lord says: Then, if anyone says to you: Look, here is the Christ, or: Look, there, do not believe it; for false christs and false prophets shall arise and shall give great signs and wonders, so that even the elect, if it can be, are led into error. And therefore, so that the elect may not be deceived, the Lord admonishes what is to be followed: that we may not be caught by the speech of false prophets nor be deceived by any portentous deeds of theirs, but may believe that Christ is to come at that time when days full of righteousness begin to shine. For Christ will be revealed in the full light of his majesty, and, as the lightning goes out from the east and spreads its light over the whole world even to the west, so too the Son of Man, coming with his angels, will light up this world, so that every man may believe and all flesh be saved. Let us not, then, believe the antichrist, of whom the false prophets will say: This is the Christ; for the days of the antichrist will be days of unbelief. Let us not believe those who will say: 'Christ is in the desert, Christ is in the inner rooms'; for when Christ begins to draw near, all things are already full of Christ. But when we see the things which Christ foretold beforehand in his Gospel, then let us believe in his coming, lest, while we seek the true light, we fall into the darkness of unbelief.

The signs of unbelief, then, are to be guarded against, by which the days are shortened and lessened. For the sun will be darkened, the stars will fall, that is, the righteous of God; for there are those who shine like stars in heaven. When you see these things, believe that Christ is still delaying; for where Christ is, there faith is brighter; where the antichrist is, there are half-days. Of these the prophet David would surely not complain, if it were to be referred to shortness of time, since he himself said elsewhere: Woe is me, that my sojourning is prolonged! How could he grieve either that that heavenly sojourning was put off or that this earthly one was drawn out, he who had earlier begged not to be led off at the half of his days, if shortness of days seemed to bring a shortcut for hastening this course? Hence it is also gathered how we ought to understand that saying: Honour your father and mother, that you may be long-lived upon the earth. For many who honour them are often snatched away quickly, so that they die at an unripe age; many too who show less deference to their parents enjoy the wages of a long-lived old age; and unless we take that long life as the life eternal, Scripture is found to be left without the support of truth. Hence the Greek has said more expressly: that you may be of many days, that is, πολυήμερος; for whoever keeps the devout duties of worship with diligent service, being a stranger to the darkness of night, dwells in the light of days. And therefore of him who reads Deuteronomy, he shall read, it says, it all the days of his life, surely not by nights, but by days, because the day shines for one who reads the mysteries of truth and the oracles of divine loving-kindness. Let us consider what follows.
'''
