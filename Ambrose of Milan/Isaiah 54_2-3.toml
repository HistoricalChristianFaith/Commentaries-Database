[[commentary]]
quote='''
They see this temple here, the holy place of the Trinity, the habitation of sanctity, the holy Church, in which gleam those celestial curtains of which it is said: ‘Enlarge the place of thy tents and of thy curtains; fasten, spare not, lengthen thy cords and strengthen thy stakes; stretch further on the right and on the left; and thy seed shall inherit the Gentiles and thou shalt inhabit the desolate cities.’ The Church, therefore, has its curtains, by which it raises aloft the good life, shields the sinner, and overshadows the fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
