[[commentary]]
quote='''
Scripture teaches us that there are certain glorious days in which divine deeds have shone forth, since it is read that the sun shall be turned into darkness and the moon into blood, before the great and illustrious day of the Lord comes; and it shall be that whoever calls upon the name of the Lord shall be saved. For on that very day Christ rose again for men, and therefore it was said specially of it: This is the day which the Lord has made; let us exult and rejoice in it. Though God made all days, yet to this day above the rest the prerogative of the divine work has been given, the day on which all sin was taken away; but the other days are days of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
