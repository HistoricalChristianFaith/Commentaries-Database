[[commentary]]
quote='''
According to Matthew you have: Go into the city to a certain man. First, mark the majesty of the divinity. He speaks with the disciples and already knows what is going to happen elsewhere. Next, behold his condescension, for it is not the person of a rich or powerful man that is chosen, but a poor man is sought out, and the cramped lodging of a poor man is preferred to the spacious houses of the nobles. Go he says to a certain man. You knew, Lord, his name, whose service you knew; you knew his service, whose meeting you knew; but he is designated without a name, so that he may be reckoned obscure. Nothing here is contrived, where not the person but the cause is expressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
