[[commentary]]
quote='''
And the Lord says to the covetous man: Go, sell your goods, and come, follow me; for a patrimony is not the perfect good, but these are the goods of the covetous, which consist in some gain. Sell, he says, what you think to be yours, though they are not yours, since they pass to others like a river, and follow me, so that you may know the immortal good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
