[[commentary]]
quote='''
Indeed, according to Mark the Lord had pity on him, which is beautifully put. And the evangelists set down many such things, wishing to ground us in both, describing signs of power for faith, expressing works of virtue for imitation. Hence he both touches, not disdaining, and commands, not distrusting; for this is the token of power, that as one having the power of healing and the authority of commanding he does not shun the testimony of the deed. I will then he says on account of Photinus, he commands on account of Arius, he touches on account of Mani.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
