[[commentary]]
quote='''
For he who receives the followers of Christ, receives Christ; and he who receives the image of God, receives God; but because we cannot see the image of God, it has been made present to us by the incarnation of the Word, that the divine nature which is above us, may be reconciled to us.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Indeed he says above: whoever receives this child in my name.

In this place the Lord teaches that there ought to be simplicity without arrogance, charity without envy, devotion without anger; for we are urged that the mind even of a child is to be received with the disposition of one more advanced, because the child, while he claims nothing for himself, carries out the pattern of virtue and, if he does not know reason, knows nothing of guilt. Yet because to most people simplicity without reason seems not virtue but weakness, you are admonished to receive the true simplicity, that is, to carry out by diligence the gift of nature.

And therefore he says: whoever receives this child in my name receives me. And he who receives me receives him who sent me. For he who receives an imitator of Christ receives Christ, and he who receives the image of God receives God. But since we could not see the image of God, he was made present to us through the Incarnation of the Word, so that the divinity which is above us might be reconciled to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
