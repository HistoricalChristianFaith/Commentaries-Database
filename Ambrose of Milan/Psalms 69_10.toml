[[commentary]]
quote='''
Accordingly appetite makes us naked, fastings cover us even when we are without clothing. Wherefore the Lord says And I covered my soul in fasting. Good is the covering which covers the soul also lest it be seized by the tempter, lest it be made naked by the tempter. Good is the cloak which covers sin. Abstinence covers it, grace covers it; for blessed are they whose iniquities are forgiven, and whose sins are covered. Grace covers when it remits and effaces all error: abstinence covers when it overshadows vice and conceals it by a feeling of sorrow and lessens it by repentance. For fasting and alms deliver from sin. Adam had been covered by a cloak of virtues before he transgressed. But uncovered, as it were, by his transgression, he saw that he was naked, because the garment which he had he had lost. For in the days of your fastings, Shall thy morning light arise, He says, and thy health shall speedily arise, and thy justice shall go before thee, and the majesty of the Lord shall surround thee. A good garment is light. For it is written: Surrounded with light as with a garment. A good garment it is when the Lord clothes and covers those fasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
