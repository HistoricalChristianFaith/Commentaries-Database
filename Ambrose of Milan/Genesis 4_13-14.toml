[[commentary]]
quote='''
There is no disputing the fact that the wicked are confronted with evil and always will be. Present evils cause sadness; future evils, dread; but the wicked are more perturbed by present evils than by those in the future. Wherefore Cain said the Lord: My punishment is too great to bear. If you abandon me today, I shall hide myself from your face. There is nothing more grievous than to be a wanderer and to be irrevocably bereft of God. With a sinner's death there comes an end of sinning, whereas his life, deprived of God, his Pilot, suffers shipwreck and disaster. If the shepherd abandons his flock, the wild beasts make their inroads. In like manner, when God deserts man, the Devil makes his entrance. To be deprived of a guide is a matter of serious consequence for the foolish. When no physician is at hand, there is occasion for diseases to creep in and inflict more injury. The man who desires to hide his faults and cover up his sins goes into concealment. The man who does wrong hates the light of day and waits for darkness to serve his iniquities. The just man, however, is apt not to conceal himself from his Lord and God. Rather, he desires to offer himself to God, saying: "Behold, I am here as one whose conscience is clear and who fears no detection."

With reason, therefore, does the man who is conscious of evil hide himself and say: Whoever finds me will kill me. The man of limited vision is afraid when death has come upon him. He pays no heed to the continuous presence of death. The judgment of God is ignored and his sole concern is his body's decease. But from what source did he fear death whose parents were the only living beings on earth? There was the possibility that one who broke the ordinances of the Law of God could have had fears of an attack from wild beasts. A person who taught man how to kill could not have assumptions regarding the rest of the animal kingdom. A person who showed how the crime of parricide could be committed might well fear a parricidal act on the part of his own parents. The parents could learn that lesson from their son which later generations learned from their parents.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 9"
