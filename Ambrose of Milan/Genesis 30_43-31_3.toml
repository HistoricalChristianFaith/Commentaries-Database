[[commentary]]
quote='''
By these means, then, as Scripture says, he became very rich, rearing a good flock for Christ, which he ennobled with the title of faith and the variety of the virtues, as with the insignia of a glorious name. And so, rich in the wealth of faith, he did not seem to himself straitened, and he was made an object of envy to the sons of Laban as very wealthy, because he had heaped up his own flock by the addition of another's flock. And God said to him: Return to the land of your father and to your people, and I will be with you, showing that nothing was lacking to him to whom the fullness of all things was present; that this alone abounds for the perfect man, that in this all things consist and all things are referred to it, that nothing was new to him, nothing superfluous was necessary to him, who had a faithful peace at hand, through which he might reconcile what had at first been at variance. Nor is it surprising if he had peace who had set up a pillar and anointed it to God, which is the Church. For she is called the pillar and foundation of truth. He anoints it who pours out on Christ the ointment of faith, on the poor the ointment of mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"
