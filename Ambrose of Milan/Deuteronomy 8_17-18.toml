[[commentary]]
quote='''
Now learn how each and every one of us may be warned against thinking of himself as the originator of his own good: Lest thou shouldst say, we are told, in thy heart: my own might and the strength of my own hand achieved this virtue for me. But remember the Lord thy God that hath given thee strength that thou mightest attain virtue. Wherefore that Apostle is to be commended who, in not boasting of his own virtue, followed the Law and said that he was the last of the Apostles and that we owe what we have, not to our own merits, but to divine grace. He said: What hast thou that thou hast not received? If thou hast received it, why dost thou boast as if thou hadst not received it? Here is the lesson of humility rather than of arrogance. You should strive, therefore, to be industrious rather than be powerful. Here is advice that is salutary. Do not, then, make light of the experience of a surgeon who makes a deep incision so as to rid a wound of all infection.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 7"
