[[commentary]]
quote='''
Now, since you behold both lions and elephants subject to you, recall to mind, man, that the saying ‘know thyself’ is not something emanating from Pythian Apollo, but from Solomon, who says: ‘If thou know not thyself, fairest among women.’ Furthermore, long before this time Moses wrote in Deuteronomy: ‘Keep thyself.’ The Law says: ‘Man, keep thyself.’ And the Prophet says: ‘If you know not thyself.’ To whom does he say these words? He adds: ‘Fairest among women.’

What constitutes the beautiful among women if not the soul, an outstanding attribute in both sexes? Not without reason is the soul comely, since it longs, not for the things of earth, but for those of heaven; not for the corruptible, but for the incorruptible, the beauty of which is not liable to perish. All corporeal things, on the other hand, suffer decay either in the march of time or because of the inroads of disease. ‘Keep thyself,’ says Moses, in that in which you form a totality—that in which the better part of you consists. Hence, the Lord explained your nature when He said: ‘Beware of false prophets,’ for they cause your soul to weaken and your mind to totter. Thus, you are not flesh alone. What is flesh without the guidance of the soul and the vigor of the mind? We put on the garment of flesh today and tomorrow it is laid aside. The flesh is temporal, whereas the soul is lasting. Like a garment for the body, such is flesh for the soul. You are not, therefore, a garment, but one who puts on a garment for use. And so you are told to ‘strip off the old man with his deeds and put on the new’—you who are renewed not in the quality of the body, but in the spirit and affirmation of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
‘Attend to thyself alone,’ says Scripture. In fact, we must distinguish between ‘ourselves,’ ‘ours,’ and ‘what surrounds us.’ ‘Ourselves’ refers to body and soul. ‘Ours’ are the members of our bodies and our senses. ‘What surrounds us’ consists of our money, our slaves, and all that belongs to this life. ‘Attend to thyself,’ therefore, ‘know thyself,’ that is to say—not what muscular arms you have, not how strong you are physically, or how many possessions or power you have. Attend, rather, to your soul and mind, whence all our deliberations emanate and to which the profit of your works is referred. Here only is the fullness of wisdom, the plenitude of piety and justice of which God speaks—for all virtue comes from God: ‘Behold, Jerusalem, I have painted thy walls.’ That soul of yours is painted by God, who holds in Himself the flashing beauty of virtue and the splendor of piety. That soul is well painted in which shines the imprint of divine operation. That soul is well painted in which resides the splendor of grace and the reflection of its paternal nature. Precious is that picture which in its brilliance is in accord with that divine reflection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
