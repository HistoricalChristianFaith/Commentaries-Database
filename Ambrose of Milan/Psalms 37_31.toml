[[commentary]]
quote='''
The form of righteousness is still being described and enlarged, when Scripture says: The law of his God is in his heart, and his steps shall not be supplanted. In the heart of the righteous man is the law of God. What law? Not the written, but the natural; for the righteous man, indeed, the law is not laid down, but for the unrighteous. In his heart is the law, not superficially, as on the lips of the Jews; for with the heart one believes unto righteousness. He who believes also speaks; but he who speaks does not forthwith believe. Thus the people did not believe of whom it was said: This people honours me with their lips, but their heart is far from me. If, then, the Gentiles, when they do the things that are of the law, are a law to themselves, knowing what they ought to follow or beware of, how much more does the faithful and righteous man, who lives according to the image and likeness of God, know how to discern things seemly and honourable, and to use a kind of lawful helm of natural wisdom, so that his footsteps may not be supplanted like those of Esau, whom his brother, on account of the greed of his gullet, supplanted so that he fell, and poured out his footsteps into death!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
