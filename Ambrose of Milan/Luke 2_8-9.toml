[[commentary]]
quote='''
Observe with what care God builds up our faith. An Angel teaches Mary; an Angel teaches Joseph; an Angel the shepherds also, of whom it is said, And there were in the same country shepherds abiding in the field.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But if the age of the flesh was idle for work, surely it was God who exercised the age of the flesh in the works of divinity, who also made the shepherds in that region keep watch, keeping the watches of the night over their flock.

See the beginning of the rising Church: Christ is born and the shepherds began to keep watch, to gather into the Lord's fold the flocks of the Gentiles, which before had lived like cattle, so that they might not suffer the attacks of spiritual beasts through the darkness of the night spread around. And rightly do the shepherds keep watch, whom the good shepherd forms. The flock, then, is the people, the night the world, the shepherds are the priests. Or perhaps that one too may be a shepherd to whom it is said: Be watchful and strengthen, because the Lord has not only ordained bishops to guard the flock, but has also appointed angels. Behold, an angel of the Lord stood before them.

See how the divine care builds up faith. An angel instructs Mary, an angel Joseph, an angel the shepherds. It is not enough that one be sent once; for at the mouth of two and three witnesses every word stands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
