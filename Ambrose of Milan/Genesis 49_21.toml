[[commentary]]
quote='''
Naphtali is a vine let loose, putting forth beauty in its shoot. One vine-twig is cut off, because it seems useless, lest the vine run riot to no purpose in an exuberance of vine-twigs; another is cut back for a little while and let loose, that it may bear fruit, and its beauty is put forth in its generation, because, while it raises itself toward the heights, it embraces the vine, and, climbing to the top, it clothes, as it were, the necks of the vines' yoke with the necklace of a precious branch. That one too is a beauty in its generation, because with full branches it overflows with much fruit.

This is beautiful, but far more beautiful is that which it signifies: the branch clinging to the spiritual vine, whose vine-twig we are, and we can bear fruit if we abide in the vine; but if not, we are cut off.

The holy patriarch Naphtali was an abounding branch. Hence Moses says: Naphtali is the fullness of those who receive; he will be filled with blessing from the Lord, he will possess the sea and the south-west, expounding what Jacob had said, that he is a vine let loose, that is, freed from the bonds of death through the grace of faith. In him is signified the people of God, called to the freedom of faith and the abundance of grace, spread throughout the whole world, a people that clothes the yoke of Christ with good fruit and embraces the wood of that true vine, that is, the mysteries of the Lord's cross, and does not fear the danger of confessing him, but rather, even when set in persecutions, glories in the name of Christ.

He is truly let loose from bonds who is bound by no tie of fear — whence the prophet too says: they will go out and leap like calves loosed from bonds — and therefore he puts forth beauty in his shoot, because, placed in a place of pasture and brought up beside the water of refreshment, through the sacraments of his regeneration he sprouts the good beauty of the Word and is taken up into that most beautiful grace of Christ, who can increase the loveliness of your beauty.

Finally, he who is beautiful above all gives what he has, because no one can give what he does not have; and therefore it was said: the Lord has reigned, he has put on beauty. For by grace he put on the beauty of the Church, which, laying aside in that washing the foulness of all sins, has shone with the splendour of heavenly grace. And therefore the Bridegroom says of her: who is this that looks forth like the dawn, fair as the moon, chosen as the sun, a wonder like an array?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 10"

[[commentary]]
quote='''
Naphtali, he says, is a vine let loose, putting forth beauty in its offspring. One branch of the vine is cut off, which seems useless, lest the vine run riot to no purpose in the exuberance of its branches; and another is cut back a little and let loose, that it may bear fruit, whose beauty is put forth in generation; because, while it lifts itself up to the heights, it embraces the vine, and climbing to the top clothes, as it were, the necks of the vines' yoke with the necklace of a precious branch. It too is comely in generation, because it overflows with many fruits on full branches. This is comely, but that is far more beautiful which signifies the branch clinging to the spiritual vine, of which we are the branch, and we can bear fruit if we remain in the vine; but if not, we are cut off. The holy patriarch Naphtali was an abundant branch, whence Moses too says: Naphtali, the fullness of those who receive, shall be filled with blessing from the Lord: he shall possess the sea and the south-west (Deut. 33:23); explaining what Jacob had said, what a vine let loose is, that is, released from the bonds of death through the grace of faith: in which is signified the people of God, called to the freedom of faith and the abundance of grace, spread through the whole world, which clothes the yoke of Christ with good fruit, and embraces the wood of that true vine, that is, the mysteries of the Lord's cross, and does not fear the danger of confessing him, but rather, even when placed in persecutions, glories in the name of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
