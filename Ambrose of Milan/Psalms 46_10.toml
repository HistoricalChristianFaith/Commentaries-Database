[[commentary]]
quote='''
Be at leisure, he says, and see that I am the Lord. The voice of the Lord after the wars have been calmed is "be at leisure", so that there may be no preoccupation of souls, lest the overflowing of worldly disturbances should cloud the eye of the inner mind. Be at leisure, he says, from errors; be at leisure from disturbances; be at leisure from sins, because everyone who sins has not seen God nor known him, as John the Evangelist said in his epistle. Be at leisure, then, for the study of knowing the divinity; do not be occupied with earthly works. That is why the king of the Egyptians ordered the number of bricks and the other burdens of the Jews to be increased, so that they might not know God and be at leisure for sacred worship, offended by the voice of the holy men Moses and Aaron, who said: Let the people of God go, that we may go and serve the Lord our God.

I shall be exalted among the nations, and I shall be exalted on the earth. The Lord was exalted in the heights, that is, among the angels and archangels, among the patriarchs and prophets, who thought lofty things of him and did not compare him with earthly images and rough-hewn idols; but he was not exalted among the peoples of the nations, who seemed to seek their god in grottoes and in dwellings in caves. In fact, the Magdalene is reproved, who wept for Christ as though he were dead and sought him as though buried in the tomb. Hence Christ says to her: Mary, why do you weep? Whom do you seek? Surely not one who could be taken away? She heard his voice and recognized him and wished to touch him, and the Lord said: Do not touch me, whom you think dead; I am going to the Father. Do you wonder that you did not find in the tomb him whom heavenly things await? Or perhaps she is reproved because nothing but perfect faith touches Christ, as the woman with the issue of blood touched him with full faith. Hence the Lord says: Someone has touched me; I perceive that power has gone out from me. At this word she recognized in herself that she had been cured by the power going out, and at once, conscious of what had happened to her, she confessed that it was she who had touched the Lord. Hence the Lord says: Your faith has made you whole; go in peace. But the Lord was exalted on the earth, according to what he himself says: When I am exalted, I will draw all things to myself, or because his will was done as in heaven so also on earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
