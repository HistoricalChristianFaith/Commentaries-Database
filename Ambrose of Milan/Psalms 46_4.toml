[[commentary]]
quote='''
After the Passion of the Lord, what else had to follow but that a river went out from the body of the Lord, when water and blood flowed from his side, by which he gladdened the souls of all, because with that river he washed away the sin of the whole world? There is also the river which goes out from Eden and encircles the whole earth: the Word of God, by which the intelligible paradise is watered and every soul is called to the grace of Christ, as the Word of God himself says: If anyone thirsts, let him come to me and drink. Whoever I give water to, rivers of living water shall flow from his belly. For from that one Word of God flowed the streams of the four rivers, of prudence and fortitude, of temperance also and justice. For to one is given through the Spirit the word of wisdom, to another faith in the same Spirit, to another the grace of healings in the one Spirit, to another the working of powers. All these, indeed, one and the same Spirit works, dividing to each as he wills. These are the rushings of the river, when by a spontaneous division it pours itself out into the grace of ministries, of working and of power.

By these courses of the heavenly river, then, that city in which God dwells is watered, and the tabernacle of the Most High is sanctified: every soul that is indwelt by Christ, or that body which the virgin brought forth, of which the angel Gabriel said: And that which shall be born of you shall be called holy, the Son of the living God. A good tabernacle, which no sins could overshadow, a wonderful temple of God and a heavenly court, which, when it was dissolved, could not be corrupted, but within three days rose again, raised up by him who seemed dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
