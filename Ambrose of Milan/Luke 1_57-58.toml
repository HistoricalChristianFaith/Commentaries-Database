[[commentary]]
quote='''
If you carefully observe, you will find that the word signifying fulness is no where used except at the birth of the righteous. Hence it is said, Now Elisabeth's full time came. For the life of the righteous hath fulness, but the days of the wicked are empty.

For the bringing forth of saints causes the rejoicing of many; it is a common blessing; for justice is a public virtue, and therefore at the birth of a just man a sign of his future life is sent beforehand, and the grace of the virtue which is to follow is represented, being foreshadowed by the rejoicing of the neighbours.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Indeed, Mary stayed just so long, until Elizabeth fulfilled the time of her delivery. But if you attend carefully, you will find this set down nowhere except in the birth of the just. Indeed, the days were fulfilled that Mary should bring forth, the time was fulfilled that Elizabeth should bring forth, the time of life was fulfilled when holy men departed from this course of life. The life of the just has fullness, but the days of the ungodly are empty.

So Elizabeth bore a son and the neighbours rejoiced with her. The birth of saints brings joy to many, because it is a common good; for righteousness is a common virtue. And so at the birth of a just man a token of his future life is sent ahead, and the grace of virtue that is to follow is signified by the rejoicing of the neighbours, which prefigures it. Beautifully is the time described in which the prophet was in the womb, so that the presence of Mary might not be passed over in silence; but the time of his infancy is passed over, because he was strengthened in the womb by the presence of the Lord's mother, he who knew not the hindrances of infancy. And so in the Gospel we read nothing about him except his birth and the oracle, his leaping in the womb, his voice in the desert. For he felt no age of infancy who, beyond nature, beyond age, placed in his mother's womb, began from the measure of the perfect age of the fullness of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
