[[commentary]]
quote='''
My heart grew hot within me, and in my meditation a fire shall blaze out. Graver wounds, as we know, are treated with a caustic medicine or by applying fire. The wise man, then, is himself his own physician; yet, though he is a physician, he burns his own wound, and therefore, if he has not been fully brought to the condition of unimpaired health, his heart steams, he has a fever, he catches fire at the reproaches cast at him and, if he keeps silent, he is chafed even within himself. If stone is rubbed against stone, it strikes out fire. So, then, even a good conscience is kindled with shame if the memory of its own sins is renewed in it, and in that very meditation a fire blazes out. Not evil is the fire that scorches but does not burn up; such was the fire that Moses saw in the bush, when the bush was burning but was not burned up. There is, then, a fire that diminishes sin and devours guilt with its heat. There is also a fire that is kindled by meditations on the heavenly Scriptures, like that of which Jeremiah says: And there was a flaming fire in my bones, or that of which Cleopas and he who was travelling with him, when after the resurrection Christ joined himself to them, conferred in talk with one another, saying: Was not our heart burning within us, when he opened the Scriptures to us? Therefore the Lord also came to send this fire upon the earth, to enlighten by it the souls of all, to kindle zeal, to burn up crime.

I spoke with my tongue: Make known to me, O Lord, my end, and the number of my days which is, that I may know what is lacking to me. Good is the fire that made the prophet speak. And see whether it is not the very fire that was seen when, on the day of Pentecost, as the disciples were gathered in one place, the Holy Spirit came down upon them with great force and they spoke in various tongues. For thus it is written: Their tongues were seen dispersed like fire. This, then, is he who said to Jeremiah: Behold, I give my words into your mouth as fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
