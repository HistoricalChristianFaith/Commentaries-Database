[[commentary]]
quote='''
On the sixth day beasts were created and with the beasts there arose the capability of eating and the use of foods. When food began to exist, then the completion of the world was made, then the world began not to know its own increase, then the Divine Labors upon it began to cease. And by this sign it was made manifest that through food the world would necessarily be destroyed, since through this it had ceased to be increased. No one knew crime, no one feared punishment, no one knew death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
