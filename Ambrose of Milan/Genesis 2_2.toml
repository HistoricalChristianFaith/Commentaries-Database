[[commentary]]
quote='''
But now we seem to have reached the end of our discourse, since the sixth day is completed and the sum total of the work of the world has been concluded. There has taken place, in fact, the creation of man himself, who holds the principate over every living thing and is what might be called the summation of the universe and the delight of every creature in the world.

Surely we should now make our contribution of silence, since God has rested from the work of the world. He found repose in the deep recesses of man, in man’s mind and purpose, for He had made man with the power of reasoning, an imitator of Himself, a striver after virtue, and one eager for heavenly grace. God finds comfort in these traits, as His own testimony declares: ‘Or on whom shall I find repose but on him who is humble and peaceful and who trembles at my words?’

I give thanks to our Lord God, who made a work of such a nature that He could find rest therein. He made the heavens. I do not read that He rested. He made the earth. I do not read that He rested. He made the sun, moon, and stars. I do not read that He found rest there. But I do read that He made man and then found rest in one whose sins He would remit.

It may well be that He had given a symbolic picture then of the future Passion of the Lord, thus revealing that in man one day Christ would find repose. He anticipated for Himself repose [of death] in the body for the redemption of mankind, as He declares is His own words: ‘I have slept and taken my rest and I have risen up, because the Lord hath protected me.’ He, the Creator, rested. To Him be honor, praise, and glory everlasting from the beginning of time, now, always, and for ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
