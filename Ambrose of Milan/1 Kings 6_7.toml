[[commentary]]
quote='''
He quickly splits the door if he finds it open; but Christ knocks, he does not throw it down, he who has strengthened, O Jerusalem, the bars of your gates. Christ knocks with his hand, that you may open; the adversary cuts down with axes; and therefore it is written that neither axe nor hammer should enter the house of God. Pride and deceit ought to be outside, not inside; for battles are outside, peace is inside, the peace which is above all understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 7"
