[[commentary]]
quote='''
And it came to pass on the second-first sabbath, as he was passing through the sown fields, his disciples were plucking ears of grain and eating, rubbing them in their hands.

Not only by the comprehension of words but also by the very practice and appearance of deeds, the Lord Jesus begins to strip man of the observance of the old Law and to clothe him with the new garment of grace. So he now leads him through the sown fields on the sabbath, that is, brings him to fruitful things. What the sabbath means, what the crop, what the ears, is no small mystery. For the field is this whole world; the crop of the field is the numerous fruitfulness of the saints in the sowing of the human race; the ears are the fruits of the Church, which the apostles, threshing them out by their works, fed upon, nourishing themselves on our progress.

There stood, then, already the crop fruitful in virtues, with its sprouting ears, to which the fruits of our merit are compared; for they likewise either wither in the rain or are scorched by the sun or are soaked by showers or are beaten down by storms or are stored by the reapers within the receptacles of happy barns. So the earth had already received the word of God, and the kindly field, sown with heavenly seed, had poured forth rich offspring. The disciples hungered for the salvation of men, and, as from the husks of bodies, drew out the fruits of minds to the light of faith by the glorious miracles of their works. But the Jews thought this was not lawful on the sabbath, whereas Christ, by the gift of new grace, was marking out the rest of the Law as the work of grace.

Nor do I think it without mystery that in this the evangelist, according to Matthew and Mark, set down the sabbaths without qualification, because the sabbaths are the perpetual holidays of eternal resurrection. So either in this world, while the superstitions of the Jews keep holiday and lie idle, or in the future, ourselves celebrating the holidays in perpetual solemnity, we shall eat the good things of the earth, according to what is written: They shall eat, but you shall hunger.

Wonderfully, however, according to Luke he spoke of a 'secundoprimum' [second-first], not a 'primosecundum' [first-second] sabbath — for δευτερόπρωτον [second-first] is what is written —; for that which excels ought to be put first. Second, because the first went before from the Law, in which a penalty too was prescribed if anyone worked; but first, because that sabbath of the Law, which was first, has been dissolved, and this has become first, which was established second. For since it is lawful to work on the sabbath and there is no penalty for one who works, surely not even the name clung to the sabbath of the Law, whose force has been dissolved; but yet, granted that that one was first in order, this one is first in gift, nor is this one the less because it is second. For Adam too was first, yet he is not to be compared with the second Adam; for the first Adam into a living soul, the last Adam into a life-giving spirit; and: The first man from the earth, earthly; the second man from heaven, heavenly. Surely the second was preferred to the first; for the one was the cause of death, this one of life. So also the sabbath is called second-first: second according to number, first according to the grace of its working; for better is the sabbath on which impunity is given than that on which a penalty is prescribed. The Law first, the gospel second; yet fear is inferior to grace. Or perhaps here too it is first in the predestination of the counsel and second in the sanction of the decree.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
