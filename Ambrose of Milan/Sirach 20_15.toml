[[commentary]]
quote='''
For what is more vile than the man who puts out money at interest today and requires it tomorrow. Such a man as this is hateful, Scripture says. For bland is the giving, but cruel the exaction. Certainly the kindness itself of the giving causes the cruelty of the exaction. He has put out his money, he requires securities, and hides them in his strongbox. One sum is given by the usurers, and how many are exacted from the debtors! How many terms have they made for themselves! Money is given, it is called a loan; it is termed money at interest, it is designated capital; it is written down as debt; this huge monster of many heads (capitum) causes frequent exactions; the usurer names the bond, he speaks of the signature, he demands securities, he talks of a pledge, he calls for sureties; he claims the legal obligation, he boasts of the interest, he praises the hundredths.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 12"
