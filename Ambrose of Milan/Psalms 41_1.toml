[[commentary]]
quote='''
In good order, he who in the preceding psalm said: behold, I come, in this one now comes and suffers. And therefore the psalm is entitled the fortieth, because the Lord Jesus fasted forty days, so that by that number he might complete the perfection of man, who had perished. For just as through his craving for the forbidden fruit man had lost grace, so his virtue had to be restored through fasting, so that he who had perished in Adam might be restored in Christ. Therefore, then, Unto the end, because he himself is the end of our hope; to him we direct our efforts, to him we bring our vows, because he is the fullness, he is the consummation of all things, he is the sum of all virtues. Therefore to David himself, as to him who alone of all took up our sins in his own flesh, who alone, the Lamb of God, took away the sin of the whole world, who alone blotted out the handwriting of the decree by the shedding of his blood, and took it out of the way and fixed it to the cross; as to wisdom, knowing how to undo the old sin of the world; as to redemption, knowing how to renew man from guilt; as to sanctification, knowing how to sanctify him unto grace. This, then, is the title, this the beginning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"


[[commentary]]
quote='''
Blessed is he who understands concerning the needy and the poor. Open your ears, you who are beginning to know the sacraments of the Lord's Passion. For this reason it is said to you: he who has ears to hear, let him hear. For this reason the Lord in the Gospel touched the ears and the lips of that deaf and dumb man, so that he might know what he was hearing in the mystery, and also what he should speak and when he should speak. For not idly is it written: the Lord has given me a tongue of learning, that I might know when it is fitting to speak a word. You ought, then, to know what you hear, to know what you ought to say, to know also when you ought to speak.

Hear him, then, saying: blessed is he who understands concerning the needy and the poor. Blessed indeed is he who suffers with the poor man, who takes his needs into himself, who knows what evil want brings to the needy; but what does this opening mean in the Lord's Passion? It is true indeed that he suffered for the sake of the poor, but yet he himself rebuked Judas when he said of that ointment which Mary had poured over the feet of Christ: this could have been sold for three hundred denarii and given to the poor. The other apostles too had thought the same, but with a different disposition, he through avarice, they through mercy; for Judas was looking to theft, the disciples were taking thought for the feeding of the poor. To them in common he answered: let her alone, so that she may keep it for the day of my burial; for the poor you always have with you, but me you do not always have.

Therefore another is to be understood here as the blessed man who understands concerning the poor. Here he speaks of faith, elsewhere of mercy; faith, then, comes first, mercy second. With faith mercy is precious; without faith it is bare, without faith it is unstable; for faith is the stable foundation of all the virtues. Blessed, then, is he who understands concerning the want and poverty of Christ, who for our sakes became poor, though he was rich; rich in the kingdom, poor in the flesh, because he took up this flesh of the poor. For we became exceedingly poor, we who through the serpent's deceit lost the precious vesture of the virtues, shut out of paradise, cast out of our homeland, banished into exile, stripped even of the covering of the body, which the hedges of the virtues once protected and our transgressions afterwards laid bare. If, then, he was needy and poor in the flesh, surely he was needy and poor in the passion of that flesh. Not, then, in his own riches, but in our poverty did he suffer. And therefore it was not the fullness of the divinity, which dwells in him bodily, as Scripture testifies, but the flesh that suffered. Understand this, pursue this, hold to this, lest it be said to you: he would not understand concerning the beggar and the poor man. For if you are in doubt here, surely in that psalm which is spoken in the person of the Savior against the betrayal of Judas you will not be able to be in doubt about that verse in which he says: and he persecuted the poor and beggarly man. Understand, then, the poverty of Christ, that you may be rich; understand his weakness, that you may receive health; understand his cross, that you may not be ashamed; understand his wound, that you may heal your wounds; understand his death, that you may acquire eternal life; understand his burial, that you may find resurrection.

But perhaps you may say: "How is Christ rich in poverty?" Even if my own wit fails, yet the aids of the divine readings do not fail, since the Apostle has said: for the Lord Jesus became poor, though he was rich, that you might be enriched by his want. What, then, is this poverty that makes men rich? Let us consider it, let us look closely at the venerable sacrament itself. What can be purer than it, or simpler? No one is drenched with the blood of a bull, as the rites of the Gentiles are said to have it; the sinner is not washed with the gore of goats and rams — for he is not purified by it; the flesh is washed, the guilt is not cleansed away — but: water shall go forth, he says, with delight from the fountains of salvation, and a heavenly table is prepared in your sight, and the cup that inebriates, how glorious it is! These are the riches of simplicity, in which lies the precious poverty of Christ. There is also a good poverty in morals, whence the Lord too said: blessed are the poor in spirit, and in the psalms we find that the Lord will save the humble in spirit. There is also an abounding poverty in a slender contribution, if faith abounds. Whence the Apostle says: and their deep poverty has abounded in the riches of their simplicity.

But that we may understand from other words of his as well that he called himself poor, we have it written elsewhere: I am poor and grieving, that is, because he grieves for us, as we read; for he had nothing in himself to grieve over. As, then, he grieves for us, as Isaiah interpreted, who saw him in the spirit, so surely it was for us that he was sorrowful, according to which he called his soul sorrowful even unto death, yet not on account of death; and he called the flesh weak which was subject to the weakness of death, so that he might break the sting of death, and so free us in the day of judgement, which he called evil not lightly.

For thus he went on: in the evil day the Lord will deliver him, since that day seems bitter which adjudges many to punishment. For the way of virtue is narrow, the way of transgression broad; therefore fewer walk in virtue, more are engaged in wickedness. Hence it comes about that the number of those who will receive the rewards of recompense is smaller than that of those who, as the price of grave sins, will carry away the adverse lot of the judgement. As one grieving, therefore, he called the day of judgement evil. For if the angels rejoice at the absolving of one sinner, how much more will men be wasted with grief at the condemnation of so many men! And rightly he grieves for that sheep which he carried back on his shoulders and called back, as it wandered, to his fold. The Son of God speaks with our affection, because the day of judgement, which we fear, is bitter to us. To all it seems evil, because it is full of terror, the day on which God judges not only the public deeds of man but also his hidden ones, on which each one is compelled to lay open what he has done or what he has thought. And therefore many are condemned, few are crowned. But even those who are crowned will grieve; for the righteous will be crowned, but the righteous man counts his brother's affliction as his own. And who am I to judge of that day on which man will be brought into the councils of the angels? Let us hear the sentence of the Lord himself: the hour will come, he says, in which all who are in the tombs will hear the voice of the Son of Man, and those who have done good will come forth to the resurrection of life, those who have done evil to the resurrection of judgement. Those, then, who have done evil will be judged, and therefore the day is named evil and harsh by the Judge himself, so that you may know that he suffers with us in the Gospel who suffered with us in the prophets.

But we can also take in the evil day in this way, that is, in an evil time; for the world is set in evil, and therefore the days of this world are evil, and the day abounds in its own evil. It is no small thing that we be delivered here from the snares of the sinner. He who has been free from crime here will be free from punishment there, and will not be able to undergo the severity of the judgement.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
