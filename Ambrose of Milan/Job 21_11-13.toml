[[commentary]]
quote='''
But perhaps this may trouble you, that he added that they remain like eternal sheep, and their children play, taking up the psaltery and the lyre, and they delight in the voice of the psalm. And they have ended their life in good things, and in the rest of the underworld they have fallen asleep. Distinguish these things, and since you are spiritual, judge between them. The ungodly are like the eternal, not eternal, because they cannot receive eternity from him who is not eternal. For he cannot give what he does not have, nor can he enlighten who does not possess light; but he transforms himself into an angel of light, to deceive the unbelieving. And he transforms himself by the pretence of a false light, not by the splendour of everlasting brightness. Hence the Saviour too says: I saw Satan like lightning falling from heaven. He is not lightning, but like lightning. Consider some heretic intent on abstinence of the body and on the knowledge of the heavenly mysteries: he is thought to be like one eternal, but he does not have the wage of eternal life, because he who does not have the truth of faith has a false imitation. His little ones play, like that woman who, when she has grown wanton, wishes to marry. She has grown wanton in the psaltery and the lyre, that is, in the sound of the voice, not in the depth of the mysteries, so that it resounded on the lips but did not reach into the hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
