[[commentary]]
quote='''
The title of this psalm is inscribed thus: Unto the end; for the sons of Korah, for the hidden things, a psalm to David himself. What is "for the hidden things"? That he had knowledge of hidden things through the revelation of the Lord Jesus, the holy prophet also records in Psalm 50 (51), saying: The uncertain and hidden things of your wisdom you have made manifest to me. And what those hidden things are, we are taught in the holy Gospel, where the Son of God says that the mysteries of wisdom are hidden from the wise and revealed to little ones. These are, unless I am mistaken, the things which eye has not seen nor ear heard, nor have they entered into the heart of man, which the Lord has prepared for those who love him. Let us therefore store away the hidden things of wisdom in the hidden place of our heart, and not rashly divulge them to any except those who share in the sacraments, whom the Lord has called to his grace, he who wishes to be entreated in secret, since he alone is the one who knows things secret and hidden.

In fact the Lord Jesus himself willed that Moses alone, though not without Jesus [Joshua], should go up the mountain to receive the Law; in the Gospel too he revealed the glory of his resurrection to Peter, John and James alone out of the whole number of the disciples. So hidden did he wish his mystery to be, and he warned them often not to announce easily to anyone what they had seen, lest someone weaker, who could not drink in the force of the sacraments with a wavering mind, should meet a stumbling block. In fact Peter himself did not know what he was saying, since he believed that three tabernacles were to be made for the Lord and his servants. Then he could not bear the brightness of the glory of the Lord as he was transfigured; he fell to the ground; the sons of thunder, James and John, fell too, and a cloud covered them, and they could not rise until Jesus came and touched them and bade them rise and put away their fear. They entered, then, into the cloud, that they might come to know things secret and hidden, and there they heard the voice of God saying: This is my beloved Son, in whom I am well pleased; hear him. What is "This is my beloved Son"? That is: "Do not err, Simon, by thinking that the Son of God is to be compared with servants. This is my Son; Moses is not the Son, Elijah is not the Son, although the one opened the sea and the other shut the heaven. For at the word of the Lord each of them overcame the nature of an element; but they furnished a ministry, while this is he who made the waters solid, shut the heaven with drought, and when he willed released it into showers. Where testimony to the resurrection is called in, let the ministries of servants bear their witness in support; where the glory of the Lord rising again is shown, the splendour of servants is hidden. For the risen sun veils the very globes of the stars, and all their lights vanish under the sun of this world. How then could fleshly stars be seen under the eternal Sun of righteousness and that divine brightness? Where, then, are those lights which by a kind of miracle shone before your eyes? All things are darkness in comparison with the eternal light. Let others hasten to please God by their ministries; this one alone is the true and eternal light, in whom the Father is well pleased, or in whom it has well pleased me, so that whatever he has done is mine, and whatever I have done may rightly be believed to be the work of the Son. Hear him saying: I and the Father are one. He did not say: 'I and Moses are one'; he did not say that he and Elijah had any partnership in the divine glory. Why do you prepare three tabernacles? This one has his tabernacle not on earth but in heaven." The apostles heard and fell down, shaken with dread. The Lord came and raised them up and bade them tell no one what they had seen.

To him, then, keep your hidden things, to whom David committed his hidden things, saying: From my hidden things cleanse me, O Lord; for clean must be the receptacles in which the hidden mysteries of devotion are kept. And therefore it is said to you: Drink water from your own vessels and from the springs of your wells, and let your waters overflow in the streets, so that you may be cleansed by a watering spring. Therefore it is said to you: Let your presses overflow with wine; therefore it is said: In tribulation you called upon me and I delivered you, and I heard you in the hidden place of the tempest; I proved you at the water of contradiction. For there is in tribulations a certain savage tempest within the breast, when there are fightings without, fears within. There is a water of contradiction, when our thoughts toss as with a kind of surge of the salt sea, and are calmed by no stability of resolve in the depths of our minds. Then there is a tempest in a hidden place, then a water of contradiction, which can be stilled only by the word of Christ, by which he forgives us our sins, according to what he himself deigned to say: Now you are clean because of the word which I have spoken to you. Speak, Lord Jesus: your word is medicine, your word is light, your word is the washing away of our filth, your word is a fountain; you speak, and guilt is washed away.

And since our discourse has been led to the hidden place of the tempest and to the water of contradiction, the Word of God has become all things for us. It became flesh, to save the flesh; it became water, to temper by its grace the water of contradiction and to take away the bitterness of ungodliness. And so it is written: Deep water is the word in the heart of a man; in one place "word", in another again "counsel"; for there is good counsel where the word of God is good. And therefore the Law says to you: Take heed to yourself, lest an evil word arise in your heart, and lest Jesus say: Why do you think evil things in your hearts? For God sent his Word to heal man, not to destroy him. This Word is medicine, not punishment. Let this Word be in your heart and in your mouth; let this Word be in the hidden places, where the devil lies in wait; let the Word enter, let the devil go out. For if the devil creeps in, Christ withdraws, as he withdrew from Judas after the devil had plunged himself into his heart. You too, then, say: From my hidden things cleanse me, O Lord, lest the devil lie in wait in hidden places, like a lion in his lair. But if you keep the hidden things of Christ devoutly and faithfully, there can be no place for the devil to lie in wait. And so in Psalm 9 (9-10), where David writes of the hidden sacraments of the Lord, that is, the conversion of sinners, the calling of the Gentiles, the kingdom of God, the preparation of the heart, the judgement of the poor, the refreshment of the needy, he first says that the adversary must be driven out of the hidden and secret places of your breast, lest he sit in hidden places, desiring to kill the innocent. And so it is said to you: Enter into your chamber and, having shut the door, pray to your Father in secret. Let your prayer go down to that place where he who searches hidden things may hear it; there let him find your patience, whether in covering an injury or in avoiding boasting; for the wise man hides his injury. There is the hiding place of wisdom; for he made darkness his hiding place; the wicked shall seek me and shall not find me.

That is why Abraham dug a well, so that whoever sought water might find it; that is why Isaac dug a well; that is why the Lord Jesus sat at a well — now the fountain of Jacob was there — he sat at a well, so that you might seek. The fountain there for you was Christ. He is a fountain, so that waters may overflow for those who seek them, by which all the shameful deeds of the flesh may be washed away and its fires quenched. This, then, is the depth of the wisdom and knowledge of God, that the wicked do not find it, while the good seek it and are occupied in the zeal and meditation of acquiring it. Do you want to know how true this is? Hear the words of Wisdom herself: Ask, and it shall be given to you; seek, and you shall find; knock, and it shall be opened to you. Knock, then, at the gate, for Christ is the gate; knock at the door of the word, that it may be opened to you to speak the mystery of Christ, and that you may be able to find the treasures of wisdom hidden in Christ. In him our wisdom, in him our life is hidden, as Paul declared, who was caught up even to the third heaven, that he might hear the things which it is not lawful for man to speak. How great is the discipline of hidden things! It is lawful for man to know, and not lawful to speak. To know is life, to speak is death.

Knowing, then, that the end of the hidden things, which in Greek is called σκοπὸς, is this, and this the sum of it: that the unworthy should not grasp the discipline of wisdom, and that those who have the desire to take in the knowledge of the divine sacraments, but with the merits of life and faith supporting them, and who labour and sweat in daily exercises, should deserve to obtain the fruit of their striving, let us read Psalm 9 (9-10) and Psalm 45 (46) more carefully, so that we may be able to grasp with a faithful mind the wisdom hidden in a mystery; for these alone bear at their head the title concerning the hidden things. But now let us set about the psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
God our refuge and power. What is "our"? That is: of us who believe in you. So also elsewhere: Lord, you have become a refuge for us; "for us", he says, who believe, not for unbelievers; for us who seek the truth, not for those who flee from it. For he can say this who has placed the hope of his salvation in the protection of God alone. For us, then, you have become a refuge, both our refuge and power, we who are from the peoples of the nations. The Jews denied you, the Jews did not receive you, and therefore you turned to the Gentiles; you called us, and you have become our refuge, and you are power for us. Do you want to know how truly this was said of us who are from the Gentiles? The cross of the Lord is to the Jews a stumbling block, to the Greeks foolishness, but to us the power and wisdom of God, and below: But of him you are in Christ Jesus, who has been made wisdom for us from God. Certainly Paul spoke not of the Jews nor of the Gentiles, but of those who, converted to the Lord Jesus, proclaimed him the author of their salvation. You have fled for refuge, then, to Christ: do not desert the foundation, do not forsake the one who strengthens you, so that he who took you up may himself protect you, and the loving merchant of our souls may recognize his own merchandise.

A helper in the tribulations which have found us exceedingly. "Exceedingly" fits both well, so that it can be understood both as "in the tribulations which have found us exceedingly" and as "a helper exceedingly". For the greater the tribulations are, the greater and the stronger the helps we need. And therefore it often happens that we are crowned in the heavier and harsher contests, because by tears and groans and more frequent prayers we call to our side the aid of the eternal divinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
