[[commentary]]
quote='''
We have received, he says, O God, your mercy in the midst of your temple. If it is said to the Son of God, we understand the temple in the way he himself spoke of his body: Destroy this temple, and in three days I will raise it up. Truly the temple of God is the body of Christ, in which is the purification of our sins. Truly the temple of God is that flesh in which there could be no contagion of sin, but which itself was a sacrifice for the transgression of the whole world. Truly the temple of God is that flesh in which the image of God shone, in which the fullness of the divinity dwelt bodily, since Christ himself is the fullness. Therefore it is said to him: We have received, O God, your mercy in the midst of your temple. What is this, but what he says: In the midst of you stands one whom you do not know, that is, he is in your midst and is not seen? But if it is referred to the Father, what is "in the midst of your temple", but that God was in Christ reconciling the world to himself?

In that temple, then, we have received, he says, your mercy, that is, the Word which was made flesh and dwelt in us. For as Christ is redemption, so also is he mercy. And what greater mercy than that for our shameful deeds he offered himself to be sacrificed, to wash with his blood the world, whose sin could have been abolished in no other way? For if the Apostle said of holy men: You are the temple of God, and the Holy Spirit dwells in you, how much more should I call the flesh of the Lord Jesus the temple of God, who is read to have been always full of the Holy Spirit, and himself testifies, saying: I perceive that power has gone out from me, the power which healed the bitter wounds of all! This too can be understood: that he said he had received with the people the mercy of God in the midst of his temple, since he himself founded his Church and spread it abroad for ever, since truly he himself, with his only-begotten Son, bestowed this grace on his people, and showed him also to be its builder, saying: He shall build me a city, which, spread over the whole world, has brought it about that the whole earth should be full of his praise and of his name. For as it is written: The earth is full of his praise, so it is written: A name has been given him above every name, that at the name of Jesus every knee should bend, of things in heaven and on earth and under the earth, and every tongue confess that the Lord Jesus is in the glory of God the Father.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
