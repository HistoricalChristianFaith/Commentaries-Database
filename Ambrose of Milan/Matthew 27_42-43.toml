[[commentary]]
quote='''
And how they blessed with the mouth and cursed with the heart, the course of the Passion shows, when they said: Let him come down from the cross and we believe him — fools! He rose from death and they did not believe: how would they have believed if he had come down from the cross? —, He hoped in the Lord, let him rescue him; let him deliver him now, since he wills him; for they said these things mocking rather than wishing it, and they asked whether he was the Son of God, speaking peaceable things in words while in their heart they were devising a charge of sacrilege.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
