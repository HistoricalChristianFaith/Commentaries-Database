[[commentary]]
quote='''
David conquered his adversaries by keeping silent, and, because he became as one dumb, he received his voice back, for, turned to the Lord, he spoke, saying: For in you, Lord, have I hoped; you will hear me, Lord my God. For I said: Lest at any time my enemies exult over me. Look at each point. David was silent, his enemies spoke; they provoked him so that he too might say something. They said: "Let us hear your voice"; he, silent, spoke within himself: "What need is there for them to hear these things, which cannot profit them? In you, Lord, have I hoped; to you alone I speak; hear me, you who can hearken. I have always asked of you that my enemies may not at any time exult over me, because, even if I have sinned, you forgive sin; even if I have fallen, you raise up, so that those who rejoice in others' sins may have nothing to exult in." For we who have sinned more have gained more, because your grace makes us more blessed than our innocence. We have this sense also in the book of Micah the prophet: Do not rejoice over me, my enemy, because I have fallen; but I shall rise again. The fall of infirmity is not grievous, if there is not also a resolve of the will not to rise from it. Have the will to rise: he is present who can make you rise again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
