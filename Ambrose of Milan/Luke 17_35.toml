[[commentary]]
quote='''
Two women grinding at the mill. The sense indeed is that those seem to be signified who seek nourishment from hidden things and bring it out from the inner parts into the open. But yet we must inquire what these women grind, unless perhaps it is what we read in Isaiah: If you bring fine flour, it is vain, so that the fine flour is what is offered by those who grind. Let us examine, then, which women grind, and what they grind, and what the mill is. And perhaps this world is the mill; in it, I think more fittingly, the form of the human body is represented, in which our soul is shut up as in a kind of bodily prison, to work heavenly bread, if it takes good counsel. In this mill, then, either the synagogue or the soul that is liable to offenses, grinding wheat soaked and spoiled with heavy moisture, cannot separate the inner parts from the outer, and therefore it will be left, because its fine flour has displeased. But the holy Church, or the soul stained by no contagions of offenses, which grinds such wheat as is parched by the heat of the eternal sun, which God has clothed as he willed and the angels have cleansed from every stain of refuse, offers to God good fine flour from the inner chambers of men and commends the offerings of her sacrifice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
