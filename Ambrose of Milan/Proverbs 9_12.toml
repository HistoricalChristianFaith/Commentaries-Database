[[commentary]]
quote='''
The unrighteous man, then, is both useless to others and harmful to himself, but the life of the righteous man is fruitful to others and sweet to himself; for Solomon says: Son, if you are wise for yourself, you will be wise for your neighbours also; but if you turn out evil, you alone will drink up evils.

We observe, then, that righteousness is born for others rather than for itself; it looks to the common advantage, not its own, and counts another's good as its own gain. Blessed and glorious is righteousness, whose good profits all; for the most part it sets out from one and reaches all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
