[[commentary]]
quote='''
For if righteousness is through the Law, then Christ died in vain; for Christ died to fulfil righteousness. Indeed, to John, who said: I ought to be baptized by you, and do you come to me? he answered: Let it be so now; for thus it becomes us to fulfil all righteousness. So Christ did not die in vain, but died for us, that the righteous might shine as the sun in the kingdom of their Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
