[[commentary]]
quote='''
Hence he added: There fell those who work iniquity. What is "there"? Is it where pride is, where the hand of sinners is, or where they stood, where they had been planted before, that there they fell; or in the mire; or on the spot, as it were at that very time, in that very place? And it seems ambiguous. But elsewhere we are taught what "there" means, where it is said: There were pains as of a woman in travail. Good is the pain for one who is in labour with faith, by which Christ is formed and born in the Church. And elsewhere he says: I will be mindful of Rahab and Babylon, to those who know me; for indeed the foreigners and Tyre and the people of the Ethiopians, these were there, that is: where those are who know me, where are the foundations on the holy mountains, there are the foreigners too, because they too thought that they must believe in me. There, then, they fell where they ought rather to have stood, because Adam too fell in paradise, and Christ came for a fall and for a resurrection, that he might be the fall of the unbelieving, but the resurrection of the righteous and the faithful.

Next, they were thrust out, because unrighteous men could not stand in the holy place. Hence the Apostle also said: And you who stand, see that you do not fall, and surely he said it to one who stood not in body but in faith. We can also understand "there" of the future, as in: There shall be weeping and gnashing of teeth, and: Naked shall I go there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
