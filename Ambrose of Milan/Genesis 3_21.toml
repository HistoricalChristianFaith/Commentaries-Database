[[commentary]]
quote='''
The soul, hearing Open to me and a head full of dew, that is, suddenly troubled by worldly temptations, and as if about to rise, she who was bidden to rise, says, while she was fragrant with aloes and myrrh, the tokens of burial: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? For she fears lest she rise again into temptations, lest she return again into fault and sin, and begin to soil her goings out and the advances of her virtues with earthly footprints. Certainly in this way too she shows the perfection of her virtue, she who merited so great a love of Christ that he comes to her and knocks at her door, and comes with the Father and sups with that same soul, and she with him, as John said in the Apocalypse. For when she had heard above: Come here from Lebanon, bride, come here from Lebanon, and when she observed that she could not be present to Christ in the flesh, but would be present then if she was present in the spirit, conforming herself to his will, so that she too might be conformed to the image of Christ, she no longer feels the cast-off spoils of the flesh; now, like a spirit, she has stripped herself of union with the body; now, as one who has forgotten and who could not remember that union even if she wished, she says: I have put off my tunic; how shall I put it on? For she has put off that tunic of skins which Adam and Eve received after their fault, the tunic of corruption, the tunic of the passions. How shall I put it on? She does not seek to put it on, but signifies that it has been so cast aside that it can no longer be a garment for her. I have washed my feet; how shall I soil them? That is: I washed my footsteps while I went out and raised myself from my cohabitation with the body, from that connection and intimacy of fleshly embrace; how shall I soil them by returning into the enclosure of the body and that dark prison of its passions?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"
