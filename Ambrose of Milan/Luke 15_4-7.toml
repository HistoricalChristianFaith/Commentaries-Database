[[commentary]]
quote='''
Let us rejoice, then, since that sheep which had perished in Adam is lifted up in Christ. The shoulders of Christ are the arms of the cross. There I laid down my sins; on the neck of that noble gibbet I rested. That sheep is one in genus, not in species; for we all indeed are one body, but many members, and therefore it is written: you, however, are the body of Christ and members from his members. There came therefore the Son of Man to save what had perished, that is, all, because as in Adam all die, so in Christ all are made alive.

Rich, then, is the shepherd, of whom we all are a hundredth part. He has innumerable flocks of angels, of archangels, of dominions, of powers, of thrones and of others, which he left on the mountains. And since they are rational, not undeservedly do they rejoice at the redemption of men. Yet this too may serve as an incentive to uprightness, if each one believes that his conversion will be pleasing to the companies of the angels, whose patronage he ought to seek, or whose offense he ought to fear. So you too, be a joy to the angels; let them rejoice at your return.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
