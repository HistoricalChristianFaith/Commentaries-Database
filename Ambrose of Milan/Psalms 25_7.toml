[[commentary]]
quote='''
Hence not without reason David himself offered no defence of the sins of his youth, but asked that they be forgotten: The sins, he says, of my youth and of my ignorance remember not. Not without reason, then, did Solomon say that he did not know what his father, in whom there was a greater grace of God, testified that he had been ignorant of. And perhaps he referred the sins of youth to the heat of the flesh, but those of ignorance to the slipping of words, which are mostly poured out not from our judgement but from a certain impulse and rush of speaking; and the prophet, knowing that this is dangerous, says: I believed, therefore I have spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
