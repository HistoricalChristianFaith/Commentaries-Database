[[commentary]]
quote='''
They then departed, when our Lord's manifestation had begun. There are three seen at the beginning, one at the end; for faith being made perfect, they are one. Therefore are they also received into the body of Christ, because we also shall be one in Christ Jesus; or perhaps, because the Law and the Prophets came out from the Word.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when the voice was made, Jesus was found alone. So, although they were three, they became one. Three are seen at the beginning, one at the end; for in perfect faith they are one. Indeed the Lord also asks this of the Father, that we may all be one. And not only are Moses and Elijah one in Christ, but we too are one body of Christ. Therefore they too are, as it were, received into the body of Christ, because we too shall be one in Christ Jesus; or perhaps because the Law and the prophets come from the Word, and the things that began from the Word end in the Word; for the end of the Law is Christ for righteousness to everyone who believes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
