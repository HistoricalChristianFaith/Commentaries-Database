[[commentary]]
quote='''
I add more. Not only does Christ not owe for himself the price of his redemption or a propitiation for sin, but even if you take it of any man whatever, it may be understood that individuals do not owe their own propitiation, since Christ is the propitiation of all and he himself is the redemption of all. For whose blood is now fit for his own redemption, when Christ has shed his blood for the redemption of all? Is there, then, anyone's blood that could be compared with the blood of Christ? Or what man is so powerful that he could give his own propitiation for himself beyond that propitiation which Christ offered in himself, who alone reconciled the world to God through his blood? What greater victim, what more excellent sacrifice, what better advocate than he who was made an entreaty for the sins of all and gave his life as a redemption for us? No propitiation or redemption of individuals, then, is sought, since the price of all is the blood of Christ, with which the Lord Jesus redeemed us, who alone reconciled the Father and laboured unto the end, since he himself took up our labour, saying: Come to me, all you who labour, and I will refresh you. See him labouring: I have laboured crying out, my throat has become hoarse, and elsewhere: Issachar desired what is good, resting among the lots, and below: He put his shoulder to labour and became a man of the soil. Therefore man will no longer give his own propitiation or redemption, since he has once been washed from sin through the blood of Christ; yet he will labour to keep the precepts of living and not depart from the heavenly commandments. While he lives, let him be in labour and persevere in it, so that he may live unto the end, lest he too should die by death when he has already been redeemed from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
