[[commentary]]
quote='''
The Lord is praised from the heavens and seen on earth, of whom Saint Mark says that he was with the beasts and the angels ministered to him, so that in the one you may recognize the emblem of mercy, in the other the token of divine power. It is for your sake that he suffers the beasts, it is his own that he is proclaimed by angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
