[[commentary]]
quote='''
Beautifully did the Greeks call death an end; for they call death τελευτήν (teleutē), because it is the end of this life. But Scripture also names death sleep, as in this saying: Lazarus our friend sleeps; but I go to awaken him. And sleep is good, since it is repose, as it is written: I slept and rested and rose again, for the Lord will take me up. Sweet, then, is the repose of death. Indeed, the Lord awakens those who repose, because the Lord is the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 8"
