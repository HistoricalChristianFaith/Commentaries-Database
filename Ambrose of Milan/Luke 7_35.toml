[[commentary]]
quote='''
The Son of God is wisdom, by nature, not by growth, which is justified by baptism, when it is not rejected through obstinacy, but through righteousness is acknowledged the gift of God. Herein then is the justification of God, if he seems to transfer His gifts not to the unworthy and guilty, but to those who are through baptism holy and just.

He well says, of all, for justice is reserved for all, that the faithful may be taken up, the unbelievers cast out.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So wisdom is justified by all her children. Well does he say by all, because righteousness is kept in store toward all, so that there may be the receiving of the faithful and the rejection of the unbelieving. Hence many of the Greeks also have it thus: wisdom is justified by all her works, because it is the work of righteousness to keep the measure according to each one's merit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
