[[commentary]]
quote='''
Jerusalem, Jerusalem: he came indeed to her whom he even deigned to call; but this Jerusalem is earthly, which kills the prophets, that is, the Synagogue of the Jews: How often, he says, would I have gathered your children, as a hen her chicks, and you would not? Behold, your house will be left deserted (Matt. 23:37 and 38). He circled, then, toward the Gentiles; and in circling the Spirit of God circled, and turned back upon his circuits, so that God might be all in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
