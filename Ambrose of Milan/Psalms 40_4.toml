[[commentary]]
quote='''
Why say more? From that wretched sinner a blessed man has been made, no longer looking upon the various vanities of this world; for this whole world is vanity of vanities, and all is vanity, as Solomon the wise said. For what is it but vain to follow things which cannot endure and which all pass away like a shadow? Now, false madnesses are declared to be either those contests of wars in which so much blood has been shed for a temporal possession, or the dissensions of theatrical rivalries, or the partisan passions of the circus, full of frenzy, or the deadly doctrine of heretics, or the feigned gestures and contrived words of false prophets in the manner of heavenly oracles. For so the prophet said: Blessed is the man whose hope is the name of the Lord, and who has not looked upon vanities and false madnesses.

There are, then, also true madnesses, and perhaps those of the prophets, who, placed in ecstasy of mind, prophesied filled with the Spirit of God, so that to some they seemed to be mad, when, unmindful of their own safety, often naked and barefoot, like holy Isaiah, they ran through the peoples, crying aloud not what they themselves wished, but what they were commanded by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Beautifully, then, does David, who had learned by experience that even a man's very glances are perilous, call him blessed whose whole hope is in the name of God. For thus he does not look upon vanities and madnesses, if he always strains toward Christ, always beholds Christ with the inner eyes. Hence, turning again to him, he says: Turn away my eyes, that they may not see vanity. The circus is vanity, because it profits nothing; vain is the swiftness of horses, because it is a liar as to safety; the theatre is vanity, every game is vanity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 1"
