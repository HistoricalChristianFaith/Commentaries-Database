[[commentary]]
quote='''
David himself also says later: But the malicious who turned away from me I did not know, and he declares where the adversaries wished to set these signs. As on a way he says above the summit. As in a forest of trees they have cut down its gates with axes all together; with the two-edged axe and the adze they have thrown it down. What does this mean, except to show that our faith ought not to be as if on the way, lest the birds of the sky come and take it away, just as that word which you read of in the Gospel ought not to be sown along the ways and paths?

Therefore the adversaries, wishing to uproot the faith of this holy man, since they do not see their signs in his heart, tried to place them as if on the way, that is, in an open thoroughfare; but the heart is at the summit, because the eyes of the wise man are in his head. And they set up signs as in a forest of trees, which are quickly burned up by fire or cut down with axes; for fire goes out from the forest and burns up even the cedars of Lebanon. And they thought this should be done in order to defile the tabernacle of the divine name, which is in us. For just as we are the temple of God, so too are we the tabernacle of God, in which the feasts of the Lord are celebrated. Therefore you, O man, guard your summit, so that you may shatter the heads of the enemies, the crown of the hair of those who walk about — for they walk about in superfluous things, not in holy ones: in the crown of the hair, not in the crown of devotion and faith — and if the spirit of one who has power rises up against you, as you have in Ecclesiastes, do not leave your place. For Christ, who made you after the image of God, has set you higher. Hold, therefore, the higher place of faith and devotion which you received from Christ, so that, having been made higher, you may easily repel the wicked spirit rising from the lower things, that is, from earthly and worldly things, and not receive his signs in your breast. Let him not occupy the porches of your soul nor the entrances of your mind, and, as in a forest of trees, lay waste with his fires what is frail and perishable, or cut down the doors of your heart with his axes. Let there be in us, then, not a forest but a vineyard; let the gate of our mouth and of our heart be shut most carefully, lest the enemy go in. He quickly splits the door if he finds it open; but Christ knocks, he does not throw it down, he who has strengthened, O Jerusalem, the bars of your gates. Christ knocks with his hand, that you may open; the adversary cuts down with axes; and therefore it is written that neither axe nor hammer should enter the house of God. Pride and deceit ought to be outside, not inside; for battles are outside, peace is inside, the peace which is above all understanding. Let your soul not be cut by the iron, but as the soul of Joseph did, so let your soul pass through the iron, lest your ruling part, like a kind of tabernacle of the Word, be torn down at the very beginning of faith and at the entrance of spiritual teaching. For one who is founded by practice and exercise remains immovable and gives no place to him who, transforming himself as it were into an angel of light, tries to climb up to the summit. If he does not see his signs in us, he will not be able to have the authority to resist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 7"
