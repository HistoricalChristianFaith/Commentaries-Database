[[commentary]]
quote='''
And rising up not only on the following day but even at dawn, so that the night seemed to have brought delays to the zeal of the hastening father, he saddled his she-ass and took with him two servants and Isaac his son, and he cut wood for the whole burnt offering. We are taught to bring everything prepared to the sacrifice; we learn also to claim for ourselves the preparation of the sacrifice, the office of ministry, and not to delegate it to others. Old Abraham, rich in cattle and abounding in slaves, did not seek troops of attendants; he himself also cut the wood and did not leave off services beyond his strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
