[[commentary]]
quote='''
Add this too, that that psalm is said in the person of the Saviour, this one in the person of David, who did not have victory in his power but hoped for it from Christ. And yet he too, after he had spread out his hands to God like the wings of his soul, and had taken refuge in the Lord, and had asked for the guidance of the Holy Spirit, so that he might know the way by which he could ascend, saw the heavens bowed so that Christ might descend, and asked that he would lift him up with his hand. Or perhaps he no longer sought his own wings for this reason, that, having become more perfect, he longed for the hand of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
