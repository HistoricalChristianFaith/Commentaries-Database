[[commentary]]
quote='''
And so the old man declared that this mystery is spiritually about the peoples. For when his son thought he had erred through the fault of dimmer sight, he wished to turn his hands round, saying: Not so, father; for this one is the firstborn. Lay your right hand upon his head. And he would not, but said: I know, son, I know. This one too shall become a people, and this one shall be exalted, but his younger brother shall be greater than he, and his seed shall be a multitude of nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 1"
