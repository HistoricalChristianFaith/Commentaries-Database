[[commentary]]
quote='''
And gifts are sent ahead to the father too. The son honours the father; Christ invites his people with promises, invites them with gifts. Those asses carry these gifts, once useless and toiling, now useful; they carry, in a type, the gifts of Christ, they who in the Gospel would carry the giver of the gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
