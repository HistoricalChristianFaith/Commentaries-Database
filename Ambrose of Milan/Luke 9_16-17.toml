[[commentary]]
quote='''
It is mystical too that the people eat and are satisfied, and the apostles serve; for in the being satisfied is marked the sign of hunger driven off forever, because he will not hunger who has received the food of Christ; and in the ministry of the apostles the future distribution of the Lord's body and blood is foreshadowed. Now that is divine, how the five loaves overflowed for five thousand people; for it is clear that the people was satisfied not with scanty food but with food multiplied.

You would have seen, by a kind of incomprehensible watering, pieces they had not broken bearing fruit between the hands of those who were dividing, and fragments untouched by the fingers of those who were breaking springing up of their own accord. How should one who reads these things marvel at the perpetual courses of the waters, and be amazed that unbroken successions flow from liquid springs, when even bread overflows and a watering of a more solid nature abounds? These things, then, were done so that we might discern those things too which we do not discern. By these he clearly showed that he is also the author of those things and the creator of the whole of material nature, which — not found, as the philosophers would have it, but made — supplies flowing successions for the generating of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
This indeed is a wonder, that whatever you draw from rivers is marked by no sign of loss, that whatever you take from springs is restored by a kind of usurious flow. But even in rivers, if nothing seems to be lost, still nothing seems to be added; and in springs, as the heaped-up streams are seen, so, when the streams are diminished, this is betrayed. But this bread which Jesus breaks is in the mystical sense the word of God and discourse about Christ, which increases while it is divided; for from a few words he has supplied nourishment overflowing for all peoples. He has given us words like loaves, which are doubled in our mouth while they are tasted. Visibly too this bread, in an incredible manner, while it is broken, while it is divided, while it is eaten, is heaped up without any perceptible loss.

Nor should you doubt whether the food grows in the hands of those serving or in the mouth of those eating, since everywhere the testimony of our work is enlisted to strengthen belief. So at the wedding wines took their color from the springs while the servants were at work, and those very men who had filled the water jars with water drew out wine which they had not brought. Grasp, if you can, such great wonders of things. Here, as the peoples eat, the fragments grow by their own loss, and from five loaves greater leftovers are gathered than the whole amount; there the elements are turned into an appearance not their own, and nature neither suffers its own diminishing nor recognizes its own origins, yet recognizes its proper uses. Nay more, the nature of wine that is changed is better than that of wine that is born, because it lies in the will of the Creator both what uses he will assign to natures and what natures he will impart to things to be produced. See with how many works he builds up the work. While the servant pours in water, the fragrance poured into it intoxicates, the changed color gives it form, and the taste, once drunk, heaps up faith as well.

Let the pagans compare, if they please, with the benefits of Christ, not the deeds but the fictions of their gods. Their fables certainly tell that there was a certain king for whom whatever he touched became gold. But even his very banquets were deadly; for the very napkins stiffened when grasped by his fingers, and the food crackled in his mouth, bringing not nourishment but wounds, and the drink stuck in his throat, able neither to go down nor to come back. Benefits worthy of the prayers, gifts worthy of so great a petitioner, liberality worthy of the giver! Such are the benefits of idols, that when they seem to help, they harm the more. But the gifts of Christ seem small and are very great, and they are bestowed not on one man but on peoples; for the food of those who ate grew in their mouths, and it seemed to be bodily nourishment, but it was taken as the nourishment of eternal salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
