[[commentary]]
quote='''
Because of these horns of the Lord Jesus, David too, singing with the voice of the horn trumpet, was heard by Christ, and Moses taught that the rites of the sacrifices were to be celebrated with the sound of the trumpet, as it is written: Sound the trumpet at the beginning of the month. For whom was this written but for us? For the ancients were wont to reckon the months from the beginning of the moon. But the moon is the Church, which is lifted up by spiritual and evangelical preaching in abundance of peace, as the prophet said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
A divine ordinance was delivered to the patriarchs that whenever they set out to war they should sound their trumpets, at the sound of which the Lord would remember His people, and the more would bring the aid which was sought, recognizing these incentives to His mercy; and that on the days of their joy, on the days of the new moon, they should send forth in concert the sound of their trumpets. Wherefore David also says: Sound forth the trumpet in the first of the month on the crowded day of your solemnity. Therefore the day of solemnity will come to us and is already approaching. Let us sound the trumpet as if going forth to battle, let us sound the trumpet that we may proclaim the day of solemnity. Likewise a struggle also hangs over us and victory is promised anew. Our victory is the Cross of Christ, our trophy the Paschal Lamb of the Lord Jesus. But He fought first that He might conquer, not because He Himself needed a struggle, but that He might first prescribe the manner of warring and afterwards grant the grace of triumphing. Our struggle is fasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 1"
