[[commentary]]
quote='''
And Mary said to the angel: How shall this be, since I know not a man? Here Mary seems not to have believed, unless you attend carefully; for it is not right that she who was chosen to beget the only-begotten Son of God should seem to have been unbelieving. And how could it be — granted that the prerogative of the mother is kept safe, to whom indeed more deference was due; but as her prerogative was greater, so greater faith too had to be reserved for her — how, then, could it be that Zechariah, who had not believed, should be condemned to silence, while Mary, if she had not believed, should be exalted by the infusion of the Holy Spirit? But Mary ought neither to disbelieve nor to presume so rashly: neither to disbelieve the angel nor to lay claim to divine things. For it was not easy to know the mystery hidden from the ages in God, which not even the higher powers could know. And yet she did not refuse faith, did not decline the duty, but adapted her disposition and pledged her obedience. For when she says: How shall this be? she did not doubt the outcome, but asked about the manner of the outcome itself.

How much more measured is this reply than the words of the priest! She says: How shall this be? He answered: Whence shall I know this? She is already dealing with the matter, he is still doubting the message. He who denies that he knows denies that he believes, and seeks, as it were, yet another guarantor for his faith; she professes that she does it and does not doubt that what she asks how it can be done is to be done; for so you have it: How shall this be, since I know not a man? An unbelievable and unheard-of generation had first to be heard of, that it might be believed. For a virgin to bring forth is the sign of a divine mystery, not a human one. Indeed, take he says a sign for yourself; behold, a virgin shall conceive in the womb and bear a son. Mary had read this, and so she believed that it would be; but how it would come about she had not read before; for how it would come about had not been revealed even to so great a prophet. For the mystery of so great a message was to be brought forth not by the mouth of a man but by that of an angel. Today for the first time is heard: The Holy Spirit will come upon you, and it is heard and it is believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
How quickly, then, Mary believed, even in an unequal condition! For what is so unequal as the Holy Spirit and a body? What so unheard-of as a virgin with child, against law, against custom, against modesty, whose care is dearer to a virgin? Zechariah, however, disbelieved not on account of an unequal condition but on account of old age; for the condition was fitting. From man and woman birth is the usual thing, nor ought it to seem unbelievable where nature agrees. For since age belongs to nature, not nature to age, it often happens that age hinders nature; yet it is not unreasonable that the lesser cause should yield to the greater, and the stronger prerogative of nature exclude the use of the inferior age. Add to this that Abraham and Sarah had received a son in their old age, and Joseph is a son of old age. But if Sarah is rebuked because she laughed, more justly is he condemned who believed neither the oracle nor the example; but Mary, when she says: How shall this be, since I know not a man? does not seem to have doubted about the fact but to have inquired about the manner of the fact. For it is clear that she had believed it was to be done, she who asked how it would be done. Hence she also deserved to hear: Blessed are you who believed. And truly blessed, who was more excellent than the priest. When the priest had denied, the virgin corrected the error. Nor is it any wonder if the Lord, about to redeem the world, began his work from Mary, so that she through whom salvation was being prepared for all should be the first to draw the fruit of salvation from her offspring.

And rightly she asked how it would be; for she had read that a virgin would bring forth, she had not read how a virgin would bring forth; she had read, as I have said: Behold, a virgin shall conceive in the womb; but how she would conceive, the angel first spoke of in the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
For in the Gospel too, when Mary had heard from the angel that as a virgin she would bear a son, she answered: How shall this be, since I have not known a man? And rightly she answered, that is: since what belongs to nature is not at hand, because she who has not been joined to a man does not usually give birth, I ask how, beyond the ordinances of nature, I can bring forth as a virgin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
