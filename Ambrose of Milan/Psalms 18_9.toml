[[commentary]]
quote='''
Therefore great power made the heavens, great power bowed the heavens, as we read: And he bowed the heavens and came down. By this it is shown that the Son of God was never without a share in his divinity, not even when he dwelt among men, since, even if he took up what he was not, yet he did not cease to be what he was. And so, when it is said: And he bowed the heavens and came down, he seems not so much to have come down from heaven as to have come down with heaven itself. For when the Father addressed the Son set on earth, and angels ministered to him, the Son of God seems not so much to have changed his seat as to have moved it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
