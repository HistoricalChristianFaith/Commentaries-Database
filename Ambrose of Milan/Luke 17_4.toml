[[commentary]]
quote='''
Or this number is used because God rested on the seventh day from His works. After the seventh day of the world everlasting rest is promised us, that as the evil works of that world shall then cease, so also may the sharpness of punishment be abated.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But what does this mean: If he turns to you seven times, forgive him? Is a number fixed beforehand for pardon, or is it rather because, since on the seventh day God rested from all his works, after the week of this world a lasting rest is promised to us, so that, just as the evils of this world will cease and keep holiday, so also the severity of vengeance may come to rest? Now the sabbath is not only of days but also of months, and therefore on the tenth day of the seventh month there is the sabbath of sabbaths; and not only of months but also of years, and not of years only but also of generations, and finally of the world itself, of which the great sabbath is a type, as in the law there is the seventh week, after which the year of jubilee is celebrated. This mystery the Lord willed to reveal to us when he says: Not only seven times, but also seventy times seven, because in the seventh generation, as you have it according to Luke, Enoch was carried off, lest wickedness should change his heart, and in him the sting of sorrow came to rest. But in the seventy-seventh generation the Lord was born of Mary, and taking upon himself the sins of the human race he granted remission of all offenses.

So although according to the letter you learn to forgive often and not to hold on to indignation — for there is nothing by which he can be offended who has the habit of forgiving — yet recognize the mystery. For not idly did the Lord say to the woman on the sabbath: You are released from your infirmity, showing his people, who like that woman would follow when called, that by his coming he had remitted their sins. So Lamech is condemned seventy-seven times, because he sins more gravely who commits a crime while punishing one. But the sacraments of baptism remit every enormity of crime. Learn, then, to forgive the injuries done to you, because Christ forgave his persecutors.

Nor is it idle that he suffered on the great sabbath, signifying that there would be a sabbath on which death would be destroyed by Christ. And if the Jews so celebrate the sabbath that they keep both a month and a whole year as a sabbath, how much more ought we to celebrate the resurrection of the Lord! And therefore our forebears handed down to us that all the fifty days of Pentecost are to be celebrated as Easter, because the beginning of the eighth week makes Pentecost. Hence the Apostle too, as a disciple of Christ who knew that there is a diversity of times, writing to the Corinthians says: With you he says perhaps I shall remain and spend the winter; and below: But I shall remain at Ephesus until Pentecost; for a great door has been opened to me. So with the Corinthians, by whose errors he was distressed, he spends the winter, because their affection towards the worship of God had grown cold; with the Ephesians he celebrates Pentecost and hands on the mysteries to them, and relaxes his mind, because he saw them glowing with the ardor of faith. So through these fifty days the Church knows no fasting, just as on the Lord's day, on which the Lord rose again, and all the days are as the Lord's day.

There will be another Lord's day too, on which the Lord's body will rise again. Paul knew it, who says: But you are the body of Christ and members from members. For this body of the Lord, and bones from his bones, will cleave to the head; and the head, moreover, of the Church is Christ. Then, therefore, fasting will cease, since in perpetual joy weariness, care and fatigue will cease. Then death will be destroyed; for last of all, indeed, death will be destroyed. For although it ceased in Enoch and was not found in him, yet it was not destroyed; for he was carried off so that he might escape, Christ was sacrificed so that he might destroy it. And therefore he well said: Where, O death, is your victory? Where, O death, is your sting? So in this resurrection Christ will rise a second time, as it were, in his own body. Blessed, then, is he who has a part in the first resurrection; for as Christ is the firstfruits of those who sleep, so then the firstfruits of those who rise again will be his saints of the Church.

This mystery Peter could not know. Perhaps he knew about Enoch: yet who could grasp with a human mind the mystery hidden in God? Let the Lord come, then, into my soul, into my mind, and subject it to himself, so that when my mind has been subjected, I may say: I will not fear evils, for you are with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
