[[commentary]]
quote='''
And so, when he had come into the house, he took a few as witnesses of the resurrection to come; for the resurrection was not believed by many at once.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Yet what is the reason for so great a difference? Above, the widow's son is raised publicly; here the many witnesses are removed. But I think that in this too the Lord's compassion is shown there, because the widowed mother of an only son could not bear delays, and therefore speed is added, lest she be afflicted further. There is also a pattern of wisdom: in the widow's son, that the Church would believe quickly; in the daughter of the ruler of the synagogue, that the Jews would indeed believe, but out of many only a few.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
