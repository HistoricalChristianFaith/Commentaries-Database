[[commentary]]
quote='''
Indeed, it was not without reason that the mark was set upon Cain, that no one might kill him. Thus it was indicated that evil is not destroyed or removed from the earth. Cain was afraid that he might be killed, because he did not know how to flee. For evil is augmented and amassed by the practice of evil, and it exists without moderation or limit, fights through guile and deceit and is revealed by its deeds and by the blood of the slain, even as Cain also was revealed.
'''
source_url=''
source_title="FLIGHT FROM THE WORLD 7.39"


[[commentary]]
quote='''
Therefore as a slave he received a sign, but even thus he could not escape death. Thus the sinner is a slave to fear, to cupidity, to avarice, to lust, to malice, to anger, nay, he is a greater slave than if he were set under tyrants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252031-40.html'
source_title="Letter 37, To Simplician"

[[commentary]]
quote='''
Now let us consider the reason for God's statement, Whoever kills Cain shall be punished sevenfold, and why a token was placed upon him so that no one should kill him, a parricide. A provision was made to protect a person against the slaying of an innocent man. Besides the five bodily senses, man has the power of speech and the ability to propagate. He also has an eighth power, the power of reason. The other powers are subject to death unless they are subject to the control of reason. Wherefore, the man who is without reason in exercising these faculties incurs danger to himself. A loss of reason, therefore, bring with it an ineffectual use of these seven bodily gifts. They have no efficacy without the saving bonds of reason. The number seven of which we speak has better uses. It conveys ideas of rest and remission. The person, therefore, who has not spared the life of a sinner has begrudged him the opportunity for the remission of his sins and at the same time deprived him of all hopes of remission. He will, in fact, be subject in equal measure to divine justice.

As regards the token God placed on Cain with the purpose of protecting him from death at the hands of another, this may be said. He wanted the wanderer to have time for reflection and by such kindness inspire him to change his ways. It generally happens that we entrust ourselves more readily to those persons to whom we are indebted. The favor granted to him was not great. Yet it was enough to scotch the foolish actions of a stupid man. This man, although liable to eternal punishment, did not demand that the punishment be remitted. He believed that he should plead for his life on this earth where there is more anxiety than pleasure. Death consists in the severance of the body from the soul and is at the same time the termination of our life here. With the coming of death, man's bodily sufferings are ready to cease, not to increase. The fears, in fact, which frequently haunt us in this present life—the griefs, pains, lamentations, and tortures of varied sort, the mutilations provoked by exposure to illness and disease—all these for mankind are more often the equivalent of death. Death under such circumstances truly appears to be a mercy, not a penalty which has the character of finality. By a sentence such as this our life is not taken away. We experience a life that is far better. When the wicked who are unwilling to quit the paths of sin leave this life, they reach, without their knowing it, not a goal set by nature, but a terminus for their wrongdoing. Those men who are indentured to sin are thus prevented from doing other deeds of wickedness. If, again, men are seen to have fulfilled life's expectations, they are believed to have migrated to another world and not to have foundered here below.

This is an opportune time to discuss the question of the spirituality of the soul. Truly happy is that life when every man who is conscious of having lived well has cast aside the trapping of his flesh and has freed himself from this prison of the body. Then we are free to fly to that place above, where our souls once groaned in the act of commingling with the bodily passions of this flesh of ours. Our souls were destined there to complete the task appointed by our Pilot, namely, by the use of reason to bring under subjection the irrational emotions of our bodies. This is why the Prophets were late in accompanying the Jewish people into captivity. Otherwise, the rest of the people would have been deprived of the guidance and counsel of holy men and would thus have undergone more serious calamities. With their presence the people would be likely to be stirred on hearing words of encouragement and thus be induced to pay homage to the Lord, their God. The people, overwhelmed by the adversities of captivity, could thus avoid the sin of perfidy and not despair of their eternal salvation.

At this point it is opportune to refute the arguments of those who believe that this life here is the only one—a life subject to calamity and to grief. Our refutation rests on a simple alignment of facts. We have in Cain and Abel two contrasting characters. One was just, innocent and loyal. Because of the acceptability of his offerings to God he incurred the hatred of his brother and, while still a youth, become a victim of the sin of parricide. The other brother was unjust, evil, and disloyal. Polluted even with a brother's blood, he lived to a ripe old age, married, left a family and founded cities—all this under the providence of God. Is not this a clear case for divine intervention? You are wrong in assuming that we have here an example of a life of pleasure. You do not take into account a prolonged old age, steeped in misery—an old age that experienced those anxieties that time inevitably brings in its wake. Add to this the fact that we are subject to disasters every moment of our lives. Surrounded by monsters like Scylla, are we not continually exposed to the poundings of a thunderous sea and compelled to dwell as best we can in habitations of sheer rock in the manner of that monstrous animal—a monster, not merely of immemorial time, but of immemorial wickedness? Hence, Cain's old age is not to be considered as something desirable. It was, rather, an occasion for punishment, inasmuch as he lived in the midst of fears and spent his extended period of time in fruitless labors. There is no penalty more grievous than that which conscious guilt imposes. Behold, then, the perpetuity of life which the just enjoy—an enjoyment in which the wicked have no share! The blood of the just man who has suffered death cries out to God, whereas the sinner's life is like that of a fugitive from justice.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 9"
