[[commentary]]
quote='''
But let us speak of the death common to all. Why should we fear it, when it is not wont to harm the soul? For it is written: do not fear those who kill the body, but cannot kill the soul. Through this death the soul is set free, while it is separated from the close company of the body and stripped of the wrappings of disturbance. Hence let us too, while we are in the body, imitating the practice of death, lift up our soul from the couch of this flesh and rise, as it were, from this tomb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"

[[commentary]]
quote='''
So let us not fear death, since it is rest for the body, and for the soul either freedom or release. Nor let us fear him who can kill the flesh but cannot kill the soul, because we do not fear him who can take away a garment, we do not fear him who can steal what is ours but cannot steal us. We, then, are souls, if we wish to be Hebrews, of those who are companions of Jacob, that is, his imitators. We are souls, but our members are garments. The garments must indeed be looked after, so that they are not torn, so that they do not grow old; but he who uses them ought rather to look after and guard himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
