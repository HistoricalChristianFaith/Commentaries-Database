[[commentary]]
quote='''
Say thou also, Depart from me, for I am a sinful man, O Lord, that God may answer, Fear not. Confess thy sin, and the Lord will pardon thee. See how good the Lord is, who gives so much to men, that they have the power of making alive. As it follows, From henceforth thou shalt catch men.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Depart he says from me, Lord, for I am a sinful man. For he marveled at the divine gifts, and the more he had merited, the less he presumed. You too say: depart from me, Lord, for I am a sinner, that the Lord may answer you: do not fear. Do not fear to confess your sin to the indulgent Lord; do not fear also to bring to the Lord what is yours, since he has granted us what is his. He knows not how to envy, knows not how to snatch, knows not how to take away. You see how good the Lord is, who grants so much to men that they have the power of giving life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
