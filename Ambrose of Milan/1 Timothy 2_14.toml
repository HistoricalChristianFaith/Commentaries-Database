[[commentary]]
quote='''
Note the fact that man was created outside Paradise, whereas woman was made within it. This teaches us that each person acquires grace by reason of virtue, not because of locality or of race. Hence, although created outside Paradise, that is, in an inferior place, man is found to be superior, whereas woman, created in a better place, that is to say, in Paradise, is found to be inferior. She was first to be deceived and was responsible for deceiving the man. Wherefore the Apostle Paul has related that holy women have in olden times been subject to the stronger vessel and recommends them to obey their husbands as their masters. And Paul says: Adam was not deceived, but the woman was deceived and was in sin. This is a warning that no one ought to rely on himself, for she who was made for assistance needs the protection of a man. The head of the woman is man, who, while he believed that he would have the assistance of his wife, fell because of her. Wherefore, no one ought to entrust himself lightly to another unless he has first put that person's virtue to the test. Neither should he claim for himself in the role of protector one whom he believes is subservient to him. Rather, a person should share his grace with another. Especially is this true of one who is in the position of greater strength and one who plays the part of protector.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 4"

[[commentary]]
quote='''
And many believe that this was Adam's fault—not the woman's. They reason that Adam in his desire to make her more cautious had said to the woman that God had given the additional instruction: Neither shall you touch it. We know that it was not Eve, but Adam, who received the command from God, because the woman had not yet been created. Scripture does not reveal the exact words that Adam used when he disclosed to her the nature and content of the command. At all events, we understand that the substance of the command was given to the woman by the man. What opinions others have offered on this subject should be taken into consideration. It seems to me, however, that the initial violation and deceit was due to the woman. Although there may appear to be an element of uncertainty in deciding which of the two was guilty, we can discern the sex which was liable first to do wrong. Add to this the fact that she stands convicted in court whose previous error is afterward revealed. The woman is responsible for the man's error and not vice-versa. Hence Paul says: Adam was not deceived, but the woman was deceived and was in sin.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"
