[[commentary]]
quote='''
He withdrew he says from there to the mountain east of Bethel. The eminence of the mountain signifies an increase of devotion, and its ascent is a sign of richer progress. East, because he was prophesying that the sun of justice was to come, that there wisdom would prepare a house for herself and from there would predestine her rising through a virgin. He wished, then, to receive already the light of the mysteries to be known. For as the world is lit by the sun, so the whole mind will be lit by the splendour of wisdom. And rightly he set down 'east of Bethlehem'. For Bethlehem, in which Christ was born, is called the house of God. Hence God says through the prophet: And you, Bethlehem, are not least among the princes of Judah; for from you shall come forth a prince who shall rule my people. He did not say 'opposite Bethlehem', but called the tent itself Bethlehem; for the Church is the tent of the just. Now who would not marvel at those mysteries, that Bethlehem is by the sea, † aggeę (Aggai) on the east. For either the soul, which deserves to be called the temple of God, or the Church is beaten by the waves of worldly cares, but is not overthrown; it is struck, but not shaken, easily able to press down and calm the commotions of the waves and the uprisings of the bodily passions. It looks on the shipwrecks of others, itself untouched and free from danger, ever ready for Christ to shine upon it and to gain joy for itself by his illumination. For as the eyes are fed by the first light of day, so too our mind is nourished by the discoveries of wisdom and seems to grow bright with certain of its rays. For by the rays of the visible sun the lands are warmed, but invisible rays penetrate the inner recesses of our heart.

Again he built an altar and called on the name of the Lord. He signified the progress of faith in calling upon the Lord. This he added to what went before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 3"
