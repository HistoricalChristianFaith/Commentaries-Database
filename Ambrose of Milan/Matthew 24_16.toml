[[commentary]]
quote='''
Therefore, since because of the wicked the good must suffer contrition of heart and mind in this age, so that they may receive a richer reward in the future, they are furnished with remedies, so that those who are in Judea should flee to the mountains. What is this Judea? For I know another Judea too, according to the spirit, not according to the letter; for known, indeed, in Judea is God. And what sort of mountains are these, that can check the movement of the future judgment, since it is written: Trembling, moreover, will seize the mountains? Heaven and earth will pass away: how will a portion of the earth remain immune, or be able to protect me, when it does not preserve itself? Where, then, shall I hide myself from the wrath of him who troubles the depth of the sea? If I ascend into heaven, he is there; if I descend into hell, he is present. He who is everywhere, then, cannot be deceived, but he can be appeased.

The day of judgment, then, is at hand. If you do not wish to be seized, fear daily, flee daily. Do you ask how you should flee? Go up onto a mountain, you who bring good tidings to Zion, so that you may stand out on the summit of lofty merits; for God, indeed, is of the mountains and not God of the valleys. Go up to where Christ sits at the right hand of God, whose foundations are on the holy mountains, and mountains are round about him. Paul is your mountain, Peter is your mountain. Set the footstep of your mind upon their faith. Those established in the law of God and in the inheritance of faith the day of judgment finds not for punishment but for glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
