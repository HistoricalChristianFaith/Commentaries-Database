[[commentary]]
quote='''
Hence the Apostle excellently says: for to me to live is Christ and to die is gain, referring the one to the necessity of life, the other to the advantage of death; for to us to live is Christ, whom we serve, to whom obedience must be rendered by his saints in the preaching of the gospel. Then Simeon too, who said: now you dismiss your servant, was waiting because of Christ. For Christ is our king: therefore we cannot abandon and despise what the king commands. How many does the emperor of this earth command to stay in foreign places, either for the sake of honour or on account of some office! Do these depart without consulting the emperor? And how much greater a thing it is to please divine things than human ones! For the saint, then, to live is Christ and to die is gain. For as a servant he does not flee the obedience of life, and as a wise man he embraces the gain of death; for it is gain to have escaped the increases of sin, gain to have fled worse things, to have passed over to better. And he added: to be dissolved and to be with Christ; for it is much better; but to remain in the flesh is more necessary for your sake. The one is better, the other necessary: necessary for the sake of the fruits of work, better for the sake of the grace and the union of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
