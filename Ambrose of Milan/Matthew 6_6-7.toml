[[commentary]]
quote='''
Our Lord's teaching on prayer is revealed to us more clearly in the Gospel: But when thou prayest, go into thy room and closing the door, pray to the Lord in secret and thy Father, who sees in secret, will reward thee. But in praying do not multiply words. And He adds: For your Father knows what you need before you ask him. Your room is the secret place of your heart and soul. Enter into this room, that is, enter into the depths of your soul, remove yourself entirely from the exterior vestibule, and close your door.

What is meant by the phrase "your door"? Set a watch, O Lord, before my mouth and a door around my lips. Paul makes a prayer for himself when he says: That God may open the door of his Word for me to announce the mystery of Christ. Appropriate for the occasion was the substance of his prayer. In preaching the Gospel he was clearly chosen to be the one who opened the door of the Word, from which issued the salvation of the Gentiles and life itself for all people. We should, however, close this door lest sin enter in and that from our tongue should issue no unseemly word. Sin enters in when we open our mouths to utter what is unrighteous. How does sin find entrance? We read: In the multitude of words you shall not escape sin. When a multiplicity of words has come forth, sin has found an entrance, for in this very multiplicity of words what we utter is not in the slightest degree subject to measure. Because of lack of prudence we fall into error. In fact, to give expression to our thoughts without duly weighing our words is in itself a grave sin.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 9"
