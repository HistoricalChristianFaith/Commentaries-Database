[[commentary]]
quote='''
But let us return to our theme: ‘Let there be a firmament made amidst the water.’ Let it not disturb you, as I have already said, that above He speaks of heaven and here of a firmament, since David also says: ‘The heavens narrate the glory of God and the firmament declareth the work of his hands.’ That is to say, the created world, when one beholds it, praises its own Author, for His invisible majesty is recognized through the things that are visible. It seems to me that the word ‘heaven’ is a generic term, because Scripture testifies to the existence of very many heavens. The word ‘firmament’ is more specific, since here also we read: ‘And he called the firmament, heaven.’ In a general way, He would seem to have said above that heaven was made in the beginning so as to take in the entire fabric of celestial creation, and that here the specific solidity of this exterior firmament is meant. This is called the firmament of heaven, as we read in the prophetic hymn, ‘Blessed are thou in the firmament of heaven.’

For heaven, which in Greek is called οὐρανός, in Latin, caelum, is connected with the word ‘stamped’ [caelatum], because the heavens have the lights of the stars impressed on them like embossed work, just as silver plate is said to be ‘stamped’ when it glitters with figures in relief. The word οὐρανός seems to be derived from the Greek verb ‘to be seen’ [ὁρᾶσθαι]. In distinction, therefore, to the earth, which is darker, the sky is called οὐρανός, because it is bright, that is to say, visible. Hence, I believe, is the origin of that expression: ‘The winged ones of heaven always behold the face of my Father, who is in heaven.’ And again: ‘The winged fowl above the firmament of heaven.’ The powers which exist in that visible place behold all these things and have them subject to their observation.

Therefore, the heavens were closed in the times of Elias when godlessness reigned with Achab and Jezabel, since the people were made responsible for the sacrilege of their kings. For that reason, no one attempted to raise his eyes to heaven, no one paid reverence to his Creator, but, rather, worshiped sticks and stones. How do we come to this conclusion? Because in His maledictions against the people of Israel God said: ‘The heaven that is over thee will be of brass and your soil of iron,’ when paying the price of godlessness, the people of Juda were punished by the inclemency of heaven and the sterility of earth—for heaven is the source of fertility. Therefore, Moses, too, granted this blessing to the tribe of Joseph: ‘From the confines of heaven and from the dew and from the deep that lieth beneath and from the course of the sun in accordance with the season and from the months that meet and from the tops of the mountains and the eternal hills.’ For it is true that the fruitfulness of the earth is sustained by heavenly guidance.

Hence, the sky which gives forth no moisture at a time when no showers break through the clouds has the appearance of iron. The sky is also of ‘iron’ when the air is dark and dense, with clouds of the color of iron rust, at a time when the earth is held in bonds by the rigidity of cold. Then moisture seems to be suspended over our heads and to be ready to fall at any moment. Frequently, too, water is solidified in the form of snow when subjected to icy winds at a time when snow falls through the cleft air.

This firmament cannot be broken, you see, without a noise. It also is called a firmament because it is not weak nor without resistance. Hence, in dealing with thunderbolts, which give forth a tremendous crash when currents of air on the point of arising in the midst of the clouds meet together in collision, the Scripture speaks of strengthening the thunderbolt. Therefore, the firmament is called because of its firmness or because it has been made firm by divine power, just as Scripture teaches us, saying: ‘Praise ye him in the firmament of his power.’

And I am not unaware that some refer ‘the heaven of heavens’ to the intelligible powers, the firmament to the efficient powers and that the heavens praise and ‘shine forth the glory of God and the firmament declareth it’—yet, as we have said above, they declare them not as spiritual powers, but as things of the world. Others also interpret the waters to mean the purificatory powers. We accept this interpretation as a simple adornment to our treatise. To us, however, it does not appear to be inappropriate nor absurd, if we are to understand these to be real waters for the reasons given above. According to the hymn of the Prophet, dew, frost, cold and heat bless the Lord, the earth, too, blesses Him. Furthermore, we do not understand the stars to be unseen powers of nature, but as having real existence. Even dragons give praise to the Lord, because their nature and aspect, if one examines them closely, are not without presenting a certain modicum of beauty and design.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
