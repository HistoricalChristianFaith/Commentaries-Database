[[commentary]]
quote='''
It is difficult, therefore, for anyone ensnared in the allurements of lust to escape unharmed. Nor is this judged difficult by my opinion only, but it has been judged impossible even in the Proverbs of holy Solomon, who, led by his own example, says: Shall anyone bind fire in his bosom, and not burn his garments? Or shall anyone walk upon coals of fire, and not burn his feet? Beware, then, you too, lest you kindle within the bosom of your mind the fire of lust and love, lest the bodily garment be consumed by that burning of the mind, and the perpetuity of the resurrection, or at least the footstep of your mind, be burned, if you think that you must walk through the torches of lusts; for he who is burned in heart is burned up in body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
