[[commentary]]
quote='''
Then he also prays specially for himself, to teach us how we ought to pray to the Lord: Let not, he says, the foot of pride come to me, that is: let me not fall into pride. Indeed elsewhere too he makes mention of himself, saying: If I have not walked in great things. Here he prayed, there he fulfilled it; he would not have fulfilled it had he not prayed. Pride must be guarded against, which trips us up even in prosperity; indeed Adam fell more grievously in paradise than if he had fallen on earth. To fall from the heights is a precipice; on level ground it is called a slip. Therefore the foot of the proud man errs, because he does not hold the head; the eyes, indeed, of the wise man are in his head. It is no wonder, then, if the step errs where no eye is kept. Let the eye go before, that the foot may follow. How then will you go as a traveller in darkness? The foot quickly stumbles in the night, if the moon, as a kind of eye of the world, does not show the way. And you are in the night of this world; let the Church show you the way, let the sun of righteousness enlighten you from on high, so that you cannot fear a fall.

And because he had spoken of the foot of pride, he added: and let not the hand of sinners move me. For as the saints are members of Christ, so the ungodly are members of the devil. Let not the hand of sinners move me, that is: let not the acts of those who sin move me from my station of righteousness. For often, when we see sinners abounding in prosperous successes, we waver in our affection, and as if by a kind of hand of sinners we are torn from the root of virtue. We must beware, then, lest the hostile hand supplant those whom the divine hand has planted in the house of God. Yet beautifully does he say this who is beaten by persecutors. But those who are moved from their root, which had already clung to Christ, fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
