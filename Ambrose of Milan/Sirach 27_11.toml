[[commentary]]
quote='''
If you are afflicted with sadness at the sight of the waning of the moon ‘which repairs its losses’ and renews itself, all the more ought you to be saddened if your soul, which has been filled with the fruit of virtue, should frequently afterward change its intent and purpose by an attitude of inconstancy and heedlessness. This is the height of stupidity and ignorance, for, as Scripture says: ‘A fool is changed as the moon.’ Hence, a wise man does not change with the moon: ‘He shall continue with the sun.’

Wherefore the moon does not partake of folly, because the moon does not change like the fool, but the fool like the moon. The seed of the just remains ‘as the moon, perfect for ever and a faithful witness in heaven.’ To perform one’s function is one thing; to have no fixed beliefs and to be carried away by unstable whims and emotions presents a situation that is quite different. The moon toils for you and by reason of the will of God is made subject: ‘For creation is made subject to vanity, not by its own will but by reason of him who made it subject in hope.’ It is you who undergoes changes of your own volition, not the moon. The moon ‘groans and travails in pain’ in its changes. You, without understanding, often find joy in this. The moon frequently awaits your release from sin, that it may be released from the servitude in which all creation shares. But you place obstacles to your release from sin and to the moon’s freedom. The fact that you yourself still await that conversion which fails to come, whereas the moon suffers change, is, then, the result, not of the moon’s folly, but of yours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
