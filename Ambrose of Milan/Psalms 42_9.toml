[[commentary]]
quote='''
With me he says is prayer to the God of my life; I will say to God: you are my upholder. Well does he seek help already known to him, and he approaches the author of the promise and the provider of the accustomed gift, so that in giving aid, if the merit of man falls short, the divine precedent may not fall short. Someone says: 'When did God uphold him'? To establish this, come with me to the beginning of sacred Scripture; see how the Lord with his own hands formed man out of clay, whence this same man also says in later verses: Your hands have made me and fashioned me. Like a potter, God wrought the fabric of human flesh. And to Jeremiah it is said: Go down into the potter's house, and there you will hear my words. It often happens to a potter, surely, that while a vessel is being shaped it falls from his hands, and he gathers up the clay again to remake the vessel. In short, Jeremiah too says: I went down and saw how the vessel fell which he was making in his hands. And again he says: He made another vessel as it pleased him. Rightly, therefore, he is called upholder, because he himself upheld us with his hands, he himself formed us. Those are a human potter's vessels, some for honour, others for dishonour. We are all earthen vessels: even if someone is a king, he is an earthen vessel; even if an apostle, he is a vessel. Hence Paul too: We have, he says, this treasure in earthen vessels; and the prophet says of the king: Jeconiah has been made worthless like a vessel for which there is no need. And he added: Earth, hear the word of the Lord: write this man down as disowned. As if by a father's right, our God is wont to disown degenerate sons; therefore the earth too writes down those who are sons of the earth. Hence, when the Jews were accusing the adulteress, the Lord Jesus was writing with his finger on the earth. But the just are not written on the earth, as we read. To them it is said: Rejoice, because your names are written in heaven.

The Lord, therefore, upheld us when he fashioned us; he upholds us also when he commands us to be born. Hence the just man says: You upheld me from my mother's womb. Of which mother? Before I formed you in the womb, I knew you. Those whom he forms he also upholds; he upholds them also as they come forth: And before you came forth from your mother's womb, I sanctified you. He is an upholder who has upheld with his hands, as the maker of the human race is called upholder, and one who has upheld by visitation, in order to protect. Hence the prophet himself says elsewhere: He who dwells in the help of the Most High will say to the Lord: You are my upholder and my refuge. The first upholding is of workmanship, the second of defence. In short, hear Moses saying: Spreading out his wings he took them up and upheld them upon his shoulders. He upheld them as an eagle does, which is accustomed to test its young, so as to keep and nourish those in whom it has observed that the native quality of a true birth and the grace of an uncorrupted nature bear witness, or to cast off those in whom it has detected, at a still tender age, the weakness of a degenerate origin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 5"

[[commentary]]
quote='''
Why have you forgotten me? and why have you cast me off? God does not forget — for it is impossible that he should forget, to whom all things that are, that have been made and that are to come, are present — but our sins pour into him grounds for forgetting, so that he blots out those whom he has known to be unworthy of his visitation; for the Lord knows those who are his. Yet where some work iniquity, to them he says: I do not know you. Who, then, is there who could say to God: Why have you forgotten me? But yet this is common to the saints and to us who are weak. The holy man says it as one conscious, as it were, of his own merit, and yet the holier he is, the humbler. But if the holy man scarcely says it, what shall I, a sinner, say, unless I refer it to this: why have you forgotten your work, why have you forgotten your visitation, finally, why have you forgotten my weakness? For what is man, except that you visit him? Do not, then, forget the weak. Remember, O Lord, that you made me weak; remember that you fashioned me of dust. How shall I be able to stand, unless you always fix your gaze on this clay to make it firm, so that my firmness may come forth from your face? When you turn away your face, all things will be troubled: if you fix your gaze, woe is me. You have nothing to look upon in me except the contagions of offences; it is profitable neither to be forsaken nor to be seen, because while we are seen, we offend. Yet we may judge that he does not cast off those whom he sees, because he cleanses those whom he looks upon. A fire burns before him, to burn away the crime.

It is good for us, then, not to be cast off. Therefore David complains, because he believed that he, who had before been upheld, was cast off. Indeed, in what comes later he said: Upon you I have been strengthened from the womb. But above too we have it written: Upon you I was cast forth from the womb, from my mother's belly, you are my God. It is good even to be cast forth, but upon God. Indeed, this is said in Psalm 21 (22) in the person of Christ, who truly was cast forth from the virgin's womb upon the Father; for earthly things did not receive him as he died. Hence, when he was placed on the cross, as he sent forth his spirit, he said to the Father: Into your hands I commend my spirit.

Let none, then, add Lord, as the psalm-singers do, for I have found it neither in my Latin manuscript nor in the Greek nor in the Gospel, which is clearer still. Indeed, he had said above: Father, forgive them this sin, and therefore he commends his spirit into his hands as to the Father, in whose bosom the Son always is. And yet, even if they add that he said Lord, let them consider that he speaks this as a man placed in death.

Therefore he was cast forth from the womb upon the Father, from his mother's belly, that is: he defined that the womb which cast him forth is his mother's belly. But the Father says: From the womb before the morning star I begot you. Surely the Father did not cast forth the Son, from whom the Son never went out, as he himself says: I was delivered up and did not go out. He did not cast forth him to whom he is joined by the unity of the same substance. It can therefore be read thus too: Upon you I was cast forth from the womb, from my mother's belly, so that there follows: You are my God, do not depart from me. It can also be read thus: From my mother's belly you are my God, since even when placed in the womb I never withdrew from you; I was with you, I who, like Jonah placed in the womb of the whale, was beseeching you for the people. And truly from his mother's belly he was with God, according to what is written: For before the child knew good or evil, he chose what is good and: Before he could call father or mother, he plundered the strength of Damascus and the spoils of Samaria, so that, having called forth the Gentiles, he might win a kingdom for the Father by the worship of loving devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 6"
