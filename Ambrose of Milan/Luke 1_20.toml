[[commentary]]
quote='''
And Zechariah said to the angel: Whence shall I know this? For I am old, and my wife has advanced in her days. And the angel answered him, saying: I am Gabriel, the angel who stands before the Lord, and I have been sent to announce these things to you. And you shall be silent and shall not be able to speak until the day on which all these things come to pass, because you did not believe my words, which shall be fulfilled in their time.

The unbelief of the priest is condemned by silence, and the faith of the prophets is approved by an oracle. Cry he says, and I said: What shall I cry? All flesh is grass. You see the command of the one who orders, the compliance of the one who obeys, the disposition of the one who asks, the oracle of the one who complies. For he believed who asks what he should cry, and because he believed, he prophesied. But Zechariah, because he did not believe, could not speak, but he was nodding to them and remained dumb. It is not the mystery of one man nor the silence of one man.

The priest is silent, the prophet is silent. Unless I am mistaken, in one man the voice of the whole people became dumb, because in one man the whole people used to speak to the Lord through Moses. The ceasing of the sacred rites and the silence of the prophets: that is the speechlessness of the prophet and the speechlessness of the priest. I will take away he says the mighty power, the prophet and the counselor. And truly he took away the prophets, from whom he took away the Word, which was wont to speak in the prophets. And truly he took away power from those from whom the power of God withdrew; he took away the counselor from those whom the angel of great counsel turned away from; he took away the voice, because the voice belongs to the Word, the Word does not belong to the voice; for unless that Word works in us, there is no sound of voice. John is a voice — the voice indeed of one crying in the desert — Christ is the Word; this Word works, and so, where it ceased to work, like some tongue of the soul, suddenly dumb and lacking the spirit, the voice fell silent. For the Word of God has passed over to us, and in us it is not silent. Indeed the Jew can no longer say what the Christian can say: You seek a proof of him who speaks in me, Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
