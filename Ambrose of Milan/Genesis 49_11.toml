[[commentary]]
quote='''
This is he who is binding his ass to the vine, and to the haircloth the colt of his ass, so that the gathering of the nations, formerly slack and negligent, but now devoted through Christ, may have the fervour of the Holy Spirit, and that we, like a fruitful branch, may be bound by certain bonds of indissoluble faith to that everlasting vine, that is, to the Lord Jesus, who says: I am the vine, my Father is the husbandman. This is that mystery, that he ordered the colt of the ass to be loosed in the Gospel, and the Lord Jesus himself sat on it, so that, bound to the vine, it might rest in the everlasting sweetness of the saints.

He will wash, he says, his robe in wine. A good robe is the flesh of Christ, which covered the sins of all, took up the offences of all, hid the errors of all; a good robe, which clothed all with the garment of gladness. He washed this robe in wine when, as he was being baptized in the Jordan, the Holy Spirit descended like a dove and remained upon him. By this is signified that the fullness of the Holy Spirit was undivided in him and did not withdraw. Hence the evangelist too says that full of the Holy Spirit the Lord Jesus returned from the Jordan. Jesus washed his robe, then, not to wash away filth of his own, which there was not, but ours, which there was. And so he added: and his mantle in the blood of the grape, that is, in the passion of his body he washed the Gentiles with his blood; for the Gentiles are the mantle of the Word, as it is written: As I live, says the Lord, unless I put them all on like a garment, and elsewhere: Like a cloak you will change them, and they shall be changed. Not, then, sins of his own, which there were not, but our offences, which we committed, he cleansed with his own blood. And rightly he said "grape," because like a grape he hung on the wood. He is the vine, he is the grape: the vine clinging to the wood, the grape because his side, opened by the soldier's lance, sent forth water and blood. For so John said, that there came forth from him water and blood, water for washing, blood for the price. The water washed us, the blood redeemed us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"
