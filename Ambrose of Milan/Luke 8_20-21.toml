[[commentary]]
quote='''
My mother and my brothers are these who hear the word of God and do it. The teacher of morals, who offers others an example from himself, is both the one who gives the precepts and himself the one who carries out his own precepts. For being about to prescribe to others that he who has not left his father and his mother is not worthy of the Son of God, he first subjects himself to this sentence; not that he rejects the dutiful services of a mother's love — for it is his own precept: he who does not honor his father and mother shall die the death — but because he knows that he owes himself more to his Father's mysteries than to his mother's affections. Nor yet are parents rejected injuriously; but we are taught that the bonds of minds are more sacred than those of bodies.

So those who were seeking to see Christ ought not to have stood outside; for the word is near in your heart and in your mouth. The Word, then, is within, the light is within. Hence he too says: draw near to him and be enlightened. For if even his own parents, standing outside, are not acknowledged — and perhaps are not acknowledged for the sake of an example to us — how shall we be acknowledged if we stand outside?

Nor let anyone think that there is a stumbling block to dutiful love where the commandment of the Law is fulfilled; for if a man shall leave father and mother and shall cleave to his wife and the two shall be in one flesh, rightly is this sacrament kept in Christ and in the Church. And therefore it was not fitting that parents should be preferred to his own body. So here his mother, who is acknowledged even from the cross, is not denied, as certain heretics, setting their little snares, try to catch at; but the pattern of the heavenly precepts is preferred to bodily kinship. It is not unreasonable to understand this also: that by the figure of his parents he shows that the Church which has believed is to be preferred to the Jews, from whom Christ is according to the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
