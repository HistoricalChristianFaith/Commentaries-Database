[[commentary]]
quote='''
Abraham is the title of this book, since it has come into my mind to consider in order the deeds of this patriarch also. Our treatment of him will first be moral and simple. For if by a loftier discussion a certain progress and form of virtue and a certain likeness of it may be expressed, yet to look also at the outward traces of his actions is an advance in virtue. For if the things which nature has produced for the sustenance of men are of not one but a twofold or even a richer grace, how much more fitting is it that the things on which minds feast should be reckoned to be of no narrow but of more abundant use, and of manifold food.

Nor is it a slight or idle task. For since the Lord our God endowed him with the rich dowry of his blessing, so that his grace might call forth others and his instruction correct them, and Moses too described him for us to imitate, so that by the sight of this man he might raise up the hearts of men slipping into vice as from a kind of earthly tomb, it ought not to seem perfunctory if we too turn over the footsteps of this man with some care. For if the wise men of this world, that is, Plato himself also, the prince of philosophers, set before himself to be pursued not some real but a feigned and shadowy republic, that πολιτείαν (Republic) which we read, in order to teach what kind of commonwealth there ought to be, and so thought that he should describe one which he had neither heard of nor seen in any city, so that those whose office this is might be taught how to govern the commonwealth; and if Plato's fellow-disciple, Xenophon the Socratic, likewise wished with feigned matters to shape the person of the wise man in the book which he entitles Κύρου παιδείαν (The Education of Cyrus), so that the discipline of a just and wise king might proceed from the inmost bosom of philosophy: how much more ought we to review more intently, not a composed figure of a wise man, but virtue expressed and established by divine teaching, and to follow the ways of him whom Moses so described that in a certain manner he looked back upon himself.

Truly a great man, and renowned for the distinctions of many virtues, a man whom philosophy could not equal even with its wishes. In short, what that man invented is less than what this man did, and the simple faith of truth is greater than the ambitious falsehood of eloquence. Let us therefore consider what kind of devotion there was in this man. For that virtue is first in order which is the foundation of the others, and rightly God required this one of him first, saying: Go out from your land and from your kindred and from your father's house. It would have been enough to have said from your land. In that lay going out from his kindred, going out from his father's house; but he added each one for this reason, to test his affection, lest perhaps he should seem to have caught him unawares, or some deceit be prepared by the heavenly commands. But just as the precepts had to be heaped up, so that nothing should be hidden, so also rewards had to be set before him, lest perhaps he should despair. He is tested as a brave man, urged on as a faithful man, challenged as a just man; and rightly he went out as the Lord had spoken to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapters 1-2"

[[commentary]]
quote='''
We have followed the moral sense of the passage with what simplicity of understanding we could, so that those who read may draw from it lessons of conduct for themselves: but just as, because the sword's edge is sharp on both sides, you fight on both sides, so too the word of God, which is sharper than any sharpest sword, piercing even to the division of the soul, you find ready and fit whichever way you turn, so that it passes through the soul of the reader to reveal the riddles of the prophetic Scriptures. Hence I think it not absurd to carry the sense up to higher things and, through the history of different persons, to unfold a certain progress of the form of virtue, especially since in Adam we have already tasted the beginnings of a deeper understanding. For we said that Adam is the mind, we indicated that Eve is sense, and by the figure of the serpent we expressed delight. But there the mind was turned aside to sin from the highest blessedness and a certain natural pleasantness of the virtues, through the deceit of sense and the allurement of delight; here, however, it is given us to behold the progress of the mind. For the lawgiver did this with foresight, so that, just as he showed the fall of the mind, that we might beware of those paths of error, so too he might indicate the progress of the mind and a certain return on high, so that we might learn how the broken mind can reform itself. For the Lord had cleansed the earth by the pouring in of the flood, he had washed away the filth of human frailty, but this was not enough for progress in virtue unless man were also instructed how he should rule and govern himself . . . . Abraham is brought in in the place of the mind. Indeed Abraham is also called passage. Therefore, so that the mind, which in Adam had given itself wholly to delight and bodily allurements, might pass over into the form and beauty of virtue, a wise man has been set before us to imitate. Indeed Abraham, as the Hebrews have it, is called according to the Latins father, because the mind governs the whole man with a certain fatherly authority, judgement and care.

This mind, then, was in Haran, that is, in the caverns, subject to various passions. And therefore it is said to it: Go out from your land, that is, from your body. He whose way of life is in heaven went out from this land. And from he says your kindred. The senses of the body are the kindred of our soul. For our soul is divided in two, into that which is rational and that which is irrational. And in that which is irrational are the senses; therefore they are kindred of the rational part, that is, of the mind. And from your house he says go out. The house of the mind is the uttered word. For just as the father of a household dwells in his house and has it in his power how he shall rule his house, so too the mind dwells in our speech and governs our words, and its force and discipline shine out in speech. As a good father of a household is judged from the very entrance of the house, so too our mind is weighed from our speech. Indeed it even strikes and recalls with the modulations of the voice.

Therefore let him who wishes to attain perfect purification separate himself from these three, from the body, from the bodily senses, from the voice, in which are all the passions of the body and the deceits of the senses, by which we are deceived and mocked. For in none of these three is the good; not in the flesh, although the school of Epicurus and many lovers of pleasure too burst themselves praising the delight of the body, nor in the senses, which are often deluded, nor in the sound of the voice, which mostly soothes the soul with false songs, is the perfect good; for these things are corruptible, but what is truly good is incorruptible. And the proof is plain. For when a man dies the flesh is corrupted, the senses perish, the voice is lost: the mind remains immortal, receiving an incorporeal life. Hence it is called into another land, full of blessedness, where it may discern not false things in place of true, as in this life, but the living substance of things, because, having shaken off a certain misty image of the body and of the senses and of the voice, it lays aside the corruptible darkness and with unveiled face surveys with its gaze the grace of the blessed life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 1"
