[[commentary]]
quote='''
The Son lives by the Father, because he is the Son begotten of the Father; by the Father, because he is of one substance with the Father; by the Father, because he is the Word given forth from the heart of the Father, because he came forth from the Father, because he is begotten of the "bowels of the Father," because the Father is the fountain and root of the Son's being.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25204.html'
source_title="Exposition of the Christian Faith 4.10.133"

[[commentary]]
quote='''
Of this pen you have it said: My tongue is the pen of a scribe who writes swiftly, which others wish to refer to Christ. In one place, then, are read the Word, the pen and the scribe: the Word, because he proceeded from the begetting secret of the Father — my heart has brought forth a good word —; the pen, because the flesh of Christ expressed the sequence of the Father's will and fulfilled the commands of the divine tongue by the shedding of the sacred blood; the scribe, because with his pen, by a certain indivisible distinction of the New and the Old Testament, or of divinity and flesh, he revealed to us the mysteries of the Father's disposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
