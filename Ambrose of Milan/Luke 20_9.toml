[[commentary]]
quote='''
Now many derive different meanings from the name vineyard, but Esaias clearly relates the vineyard of the Lord of Sabaoth to be the house of Israel. (Isa. 5.) This vineyard who else but God planted?

Not that our Lord journeys from place to place, seeing that He is ever present in every place, but that He is more present to those who love Him, while He removes Himself from those who regard Him not. But He was absent for a long time, lest His coming to require His fruit might seem too early. For the more indulgent it is, it renders obstinacy the less excusable.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The vineyard is also our type. For the husbandman is the Almighty Father, the vine is Christ, but we are the branches. (John 15:5.) Rightly are the people of Christ called a vine, either because it carries on its front the sign of the cross, or because its fruits are gathered in the latter time of the year, or because to all men, as to the equal rows of vines, poor as well as rich, servants as well as masters, there is an equal allotment in the Church without distinction of persons. And as the vine is married to the trees, so is the body to the soul. Loving this vineyard, the husbandman is wont to dig it and prune it, lest it grow too luxuriant in the shade of its foliage, and check by unfruitful boastfulness of words the ripening of its natural character. Here must be the vintage of the whole world, for here is the vineyard of the whole world.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A man planted a vineyard. Many derive various meanings from the name of vineyard, but Isaiah plainly recorded that the vineyard of the Lord of Sabaoth is the house of Israel. Who else but God established this vineyard? He it is, then, who let it out and went abroad: not that the Lord, who is always everywhere, set out from place to place, but because he is more present to those who love him and is absent from those who neglect him. For a long time he was away, lest the demand should seem too hasty. For the more indulgent the generosity, the more inexcusable the obstinacy.

Hence according to Matthew you rightly have that he also set a hedge around it, that is, he fortified it with the rampart of divine protection, so that it might not easily lie open to the incursions of spiritual beasts. And he dug in it a winepress. How are we to understand what the winepress is, unless perhaps because psalms bear the title of the winepresses, since in them the mysteries of the Lord's Passion, like must, seethed over more abundantly as the Holy Spirit of the prophets fermented? Indeed, those with whom the Holy Spirit overflowed were thought to be drunk. So here too he dug a winepress, into which the inner fruit of the rational grape might flow down by a spiritual infusion. He built a tower, that is, raising up the summit of the Law; and so he let out this vineyard, fortified, furnished and adorned, to the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
