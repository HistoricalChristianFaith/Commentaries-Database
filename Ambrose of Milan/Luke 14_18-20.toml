[[commentary]]
quote='''
Or let us suppose that three classes of men are excluded from partaking of that supper, Gentiles, Jews, Heretics. The Jews by their fleshly service impose upon themselves the yoke of the law, for the five yoke are the yoke of the Ten Commandments, of which it is said, And he declared unto you his covenant, which he commanded you to perform, even ten commandments; and he wrote them upon two tables of stone. (Deut. 4:13.) That is, the commands of the Decalogue. Or the five yoke are the five books of the old law. But heresy indeed, like Eve with a woman's obstinacy, tries the affection of faith. And the Apostle says that we must flee from covetousness, lest entangled in the customs of the Gentiles we be unable to come to the kingdom of Christ. (Eph. 5:3, Col. 3:5, Heb. 13:5, 1 Tim. 6:11.) Therefore both he who has bought a farm is a stranger to the kingdom, and he who has chosen the yoke of the law rather than the gift of grace, and he also who excuses himself because he has married a wife.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Last, as to a man whose service is completed, the pay of despising possessions is prescribed, since neither can he who, intent on lower pursuits, buys up earthly possessions for himself obtain the kingdom of heaven, since the Lord says: sell all your goods and follow me, nor he who buys oxen, since Elisha killed those that he had and divided them among the people. And he who takes a wife thinks of the things that are of the world, not those of God; not that marriage is blamed, but because integrity is called to a greater honor, since the unmarried woman and the widow thinks of the things that are of the Lord, that she may be holy in body and spirit. For she who is married thinks of the things that are of the world, how she may please her husband.

But that we may now return to favor with the married too, as above with the widows, we do not shun the opinion which many follow, so that we consider three kinds of men to be excluded from the fellowship of that great supper: Gentiles, Jews, heretics.

And therefore the Apostle says that avarice must be fled, lest, hindered after the manner of the Gentiles by iniquity, malice, impurity, avarice, we be unable to come to the kingdom of Christ; for everyone indeed who is avaricious or unclean, which is the service of idols, has no inheritance in the kingdom of Christ and of God.

The Jews, however, by a bodily ministry place on themselves the yokes of the Law, and therefore, according to the prophet, let us break their bonds and cast away their yoke from us; for we have received Christ, who has hung the gentle yoke of his kindness upon our necks. And the five yokes are those of the ten words, or the five books of the old Law, concerning which he seems to say to the Samaritan woman in the Gospel: for you have had five husbands.

But heresy, like Eve, tempts the firmness of faith with a womanish affection, and, slipping with slippery ease, courts the allurements of a false comeliness, neglecting the inviolate beauty of truth. For this reason, then, they make excuses, because the kingdom is closed to no one except him whom the profession of his own voice has shut out; but the Lord graciously invites all, and it is either our sloth or our error that turns us away.

So he who bought a farm is a stranger to the kingdom — for, as you have read, the floods swallowed up those who were buying and selling in the time of Noah — and so is he who chose the yoke of the Law rather than the gift of grace, and he who excuses himself because he is taking a wife; for it is written: if anyone comes to me and does not hate his father and mother and wife, he cannot be my disciple. For if for your sake the Lord renounces his mother, saying: who is my mother or who are my brothers? Why should you wish to put anyone before your Lord? But the Lord bids us neither to ignore nature nor to be slaves to nature, but so to indulge nature that you revere its Author and do not fall away from God through love of parents.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
