[[commentary]]
quote='''
Hence the Lord also says: Yes. Behold, Sarah your wife shall bear you a son. And concerning Ishmael I have heard you. When he says Yes, he confirms the promises; for it is a word of confirmation. And therefore he first confirms the future generation of the Church, so that the prophet might know to be true what God said he had heard concerning Ishmael, foreseeing that blindness was to befall Israel in part, until the fullness of the Gentiles should come in, and so all Israel should be saved. So, just as the testaments of men first put forward the heir and afterwards set out the legacy, the inheritance for the better, legacies for the inferior, so in the testament of the Lord, from which we too have received this custom, the heir is written down, good by nature, noble, begotten in lawful wedlock; the inferior is presented with a legacy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
