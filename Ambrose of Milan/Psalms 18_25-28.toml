[[commentary]]
quote='''
Let us not follow what is alluring and seductive, but let us follow that which is good, let us cleave to it, let us imitate it; let its presence, its communion make us better and colour our morals; let a certain fellowship with it shape us. For he who cleaves to the good takes on from it what is good, because it is written: With the holy you will be holy, and with the perverse you will be overturned, and with the innocent you will be innocent; for by constant companionship and imitation a kind of image of likeness is formed. And therefore he added: For you light my lamp, O Lord. For he who draws near to the light is the sooner lit up, and the splendour of the eternal light shines more brightly in him from close at hand. So the soul which cleaves to that invisible good, God, the immortal, itself also flees these bodily things and abandons earthly and mortal things, and becomes like that which it desires and in which it lives and is fed. And because it is intent on the immortal, it is not itself mortal. For the soul that sins dies, not indeed by any dissolution of itself, but it deservedly dies to God, because it lives to sin. So the soul that does not sin does not die, because it abides in its own substance, abides in virtue and glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"
