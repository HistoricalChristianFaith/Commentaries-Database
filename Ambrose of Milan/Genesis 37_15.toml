[[commentary]]
quote='''
And Joseph was wandering, it says, because he could not find his brothers. Not without reason was he wandering who was seeking those who wandered; for the Lord knows, indeed, those who are his. And so Jesus too, wearied from the journey, sat upon the well. He was wearied, he who did not find the people of God whom he was seeking; for they had gone out from the face of the Lord. For he who follows guilt goes out from Christ. The sinner goes out, the just man goes in. And so Adam, a sinner, hid himself, but the just man says: Let my prayer go in before your sight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
