[[commentary]]
quote='''
Hence she too, while she was seeking, fell in with the watchmen who go about the city. They struck me she says and wounded me; the watchmen of the walls took my mantle from me. Well indeed was she coming, as a bride, with a mantle with which to veil her head when the bridegroom came to meet her. Just as Rebecca, on learning that Isaac was coming to meet her, got down from the camel and covered herself with a mantle, so this soul was putting on beforehand the tokens of the nuptial garment, lest perhaps she be cast out as not having a wedding garment, or in order to veil her head because of the angels; but they struck her, so that she might be proved more fully; for souls are exercised by temptations. They took her mantle from her, inquiring whether she brought the true beauty of naked virtue, or because one ought to enter that heavenly city without a covering, bringing no coverings of disguise with oneself. There are also those who inquire lest any soul carry with it the cast-off spoils of fleshly allurement and bodily concupiscence. She is stripped of her mantle when her conscience is laid bare. But there is also one who is stripped to good effect, to whom it is granted to imitate him who says: For the prince of this world is coming, and in me he will find nothing, surely because in him alone he finds nothing who did not commit sin. Blessed too is that soul in whom he finds nothing grave or much, but finds in her the cloak of faith and the discipline of wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
The watchmen who go about the city found me, they struck me and wounded me, and the watchmen of the walls took away my cloak from me. Rightly indeed she came as a bride with a cloak, with which she might veil her head when the bridegroom met her; like Rebecca, who, on learning that Isaac was coming to meet her, got down from the camel and covered herself with her cloak: so this soul too sent ahead the insignia of the wedding garment, lest perhaps she be cast out as one who has no wedding garment; or so that she might veil her head because of the angels. But they struck her, so that she might be tested further; for souls are exercised by temptations. They took away her cloak, inquiring whether she brought the true beauty of naked virtue; or because one ought to enter that heavenly city without a covering, bearing with oneself no coverings of paint. There are also those who inquire lest any soul carry with her the cast-off spoils of fleshly allurement and bodily concupiscence. She is stripped of her cloak when her conscience is laid open. But there is one who is well stripped, who may imitate him who says: For the prince of this world comes, and in me he finds nothing (John 14:30); because surely in him alone did he find nothing, who did not commit sin.

Blessed too is she in whom he finds nothing grave or much, but finds in her the garment of faith and the discipline of wisdom. And so without loss to herself (for even if one wishes, he cannot take away true wisdom), even though the adversary clamors against her, yet, where the true integrity of a blameless way of life shines out, she has passed the watchmen, and, joined with the daughters of that heavenly city, she seeks the Word; and by seeking she arouses in herself love for him, and recognizes where she should seek the Word. It is not only an injury not to have found him whom you seek, but often it is also a wound to have sought where one ought not: to have sought in the houses of men who falsely take to themselves the name of teachers, to have sought more boldly than modestly. Let us, then, take care by her example, lest the watchmen who go about the city find us.

They found me, she says, the watchmen who go about the city: they struck and wounded me, and the watchmen of the walls took away my cloak from me. The Church is wounded not in herself, daughters, but in us. Let us take care, then, that our fall become not a wound of the Church, that no one take away our cloak, that is, the garment of prudence, the badge of patience, by which the ambition for softer clothing is put off: for those indeed who are clothed in softer garments are in the houses of kings (Matt. 11:8). But to us Christ has given a cloak, with which he himself clothed his apostles and his body; which indeed he bids you give, so that, if anyone asks your tunic of you, you let him have your cloak also (Matt. 5:40): that is, that you hand over the badge of your philosophy, and clothe round, as with the garment of your prudence, him who before was naked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
The watchmen of the walls found her. Perhaps there are other watchmen too, whom we ought rather to understand. For there is a city which does not have the gates of its walls shut, of which it is said: And its gates shall not be shut by day (Rev. 21:25); for there will be no more night in it; the nations will bring glory and honor into it. That, then, is the city Jerusalem which is in heaven, within which you are kept as though already perfect and spotless; for nothing common enters into it. Chastity is not common, modesty is not common, which is written in the book of life.

If, then, we have found the city, let us enter into it, let us see its light, let us see its walls, let us see the foundations of its walls, let us see also the watchmen of the walls. But how shall we enter into it? In this city is life, and there is one way that leads to life. The way, then, is Christ; therefore let us follow Christ. But the city itself is in heaven; how then shall we ascend to heaven? The Evangelist teaches us, who says: And he led me out in the spirit to a great and high mountain, and showed me the holy city Jerusalem coming down from heaven (Rev. 21:10). Let us ascend, then, in spirit, because the flesh cannot ascend to it. Let us meanwhile ascend to heaven, so that afterwards that city may come down to us from heaven, in which the light is like a most precious stone, like a stone of jasper and of crystal; it has a great and high wall.

You have learned the light, you have learned the wall; learn the gates, learn the watchmen. It has, he says, twelve gates, and at the gates twelve angels, on which are written the names of the twelve tribes of the sons of Israel (ibid. 12). In the gates are contained the names of the patriarchs, in the wall those of the apostles; for the foundations of the city are the apostles, and the cornerstone is Christ, in whom the whole structure rises. God outside, God within, God is everywhere: For the city, he says, has the majesty of God (ibid. 11). You too, then, holy virgins, and all of you who are just and bear the spotless chastity of the soul, are fellow citizens with the saints and members of the household of God. But you will possess that nobility of your homeland only if you seek Christ within the enclosures of that city, having entered by faith and by precious deeds, made bright by the light of the patriarchs, founded upon the apostles, moving among the angels.

How, then, are these watchmen angels, who take away the cloak of a chaste soul? The cloak of virgins is one thing, that of a young girl who roams the market place is another. She who seeks Christ in the market place has lost even the cloak she had. For prudence is possessed not in the market place, not in the streets, but in the Church. And perhaps, so that we may be reconciled with them too, and teach that God is merciful to all, since they too sometimes find Christ, if only they seek him constantly, this cloak is the garment of the body. He, then, who has sought Christ on his bed, if only he has sought him as he did who said: Thus have I remembered you upon my bed (Ps. 62 (63):7); if he has sought in the nights, according to what is written: In the nights lift up your hands to the holy places (Ps. 133 (134):2); if he has sought in the city, in the market place and in the streets, in the city of our God: in the market place perhaps, in which that judge of divine law sits, in the streets from which were gathered those who came together to the Lord's supper; he can, while he seeks long, meet the angels who guard the city of God. Indeed, from the heavenly nature of the watchmen we can understand a heavenly city, a heavenly market place of everlasting justice, not common streets, but perhaps those in which that fountain is wont to overflow, of which it is written: Let the waters of your fountain overflow for you, and let your waters be spread abroad in your streets (Prov. 5:16). He, then, who seeks Christ thus reaches the angels.

But if the angels are reached by good merits, why is he who has reached them wounded? There is a good sword too, and the wound of that sword is good. The word of God wounds, but does not make a festering sore. There is a wound of good love, there are wounds of love; and therefore she said: I am wounded by love (Song 2:5). She who is perfect is wounded by love. Good, then, are the wounds of the Word, good are the wounds of one who loves: For more useful are the wounds of a friend than the willing kisses of an enemy (Prov. 27:6). Rebecca is wounded by love, who left her parents and went over to her bridegroom. Rachel is wounded by love, who was jealous of her sister and loved her husband; for she, still barren, envied her sister because she abounded in sons, since she bore the type of the Church, to which it is said: Rejoice, barren one, who do not bear; break forth and cry, you who are not in labor (Isa. 54:1).

The watchmen, then, found her and wounded her, and took away her cloak; that is, they removed the wrapping of bodily action, so that the naked simplicity of the mind might seek Christ; because no one clothed in the garment of philosophy, that is, in the habit of worldly wisdom, can see Christ. And rightly is the garment of philosophy taken from her, lest anyone despoil her through philosophy. Rightly is the cloak taken from her who draws near to Christ, so that, being about to see God, she may walk with a clean heart: Blessed indeed are the clean of heart, for they shall see God (Matt. 5:8). And so, when she had cleansed her heart, she found the Word, she saw God. Seek him, then, virgin; nay rather, let us all seek him; for the soul has no sex. But perhaps it received a feminine name for this reason: that the more violent heat of the body drives her, while she herself soothes the impulse of the flesh and of her love with a certain soft and gentle reason. Therefore we ought to invite God with prayers and supplications, that he may deign to breathe upon us like a good south wind, and breathe on us the breeze of the heavenly Word, which is wont not to disturb the fruit-bearing trees with a heavy wind, but to stir them with a gentle breath and a soft blowing.

They took my cloak from me. A good garment is the eternity of life: this cloak, of which the first man had been stripped, the watchmen of the walls wished to take away from the Bride; but the soul devoted to God, by holding long him whom she had sought and by not letting go her beloved, clothed herself with the precious wrapping of divine love. Blessed, then, are those who are clothed with such a cloak and have merited a garment of this kind by the observance of the law; because they have not forgotten the law, but have done the things that were of the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
