[[commentary]]
quote='''
‘And He divided the light from the darkness and God saw the light that it was good.’ He spoke, and no one heard the sound of His voice. He divided, and no one noticed the effort expended in His work. He saw, and no one observed the glance of His eyes. ‘And God saw,’ he says, ‘the light that it was good.’ He did not see that of which He had no knowledge, nor did He approve what He before had neither known nor seen. It is a fitting quality of good works that they need no one to applaud them outside of oneself, but when they are seen give evidence of their own intrinsic value. It is more important that one be approved in the sight of men rather than be lauded in their conversation, since such a person relies on his own testimony and not on the recommendations of others.

But if in our own experience we are able to perceive by means of our eyes, by the aid of which the beauty of natural objects is immediately appreciated, how much more is this true in the case of God! He sees all things which He approves and approves of all things which He sees, according to the Scriptures: ‘The eyes of the Lord are upon the just.’ The nature of light is of such a kind that its value does not rest in number or measurement or weight as is the case with other things. Its whole value comes from its appearance. Accordingly, Scripture fittingly described the nature of light, which pleases us when seen, inasmuch as it furnishes us with the ability to see. Not undeservingly was light able to find as its eulogist one who first justly praised it, since it was also responsible for making the other objects in the world worthy of commendation. God, therefore, saw the light and illumined it with His countenance and saw that it was good. And this is a conviction not only on the part of God, but of all mankind. And so the value of light is conceded to be great, not only because of its splendor, but also on account of its usefulness. For this reason there was a division made between light and darkness, so that, when separated, there would seem to be no grounds for confusing the nature of light and the nature of darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
