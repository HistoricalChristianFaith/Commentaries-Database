[[commentary]]
quote='''
In short, when David noticed that the surges of the waves of the world were coming over him, which we must undergo in great number on the sea of this life, mindful of the mercies of the Lord, which he has promised in countless oracles, turning to prayer he appeals to God, knowing that his mercy is commanded in the light, that is, in the Law, because your precepts are light, but in temptations it is made manifest as in the darkness of night. Hence, like a traveller who longs to return to his homeland and to reach the place he is making for, but is wearied by the rough road of this life, he summons a guide and begs for relief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 5"
