[[commentary]]
quote='''
Not only did Angels and Prophets, the shepherds and his parents, bear witness to the birth of the Lord, but the old men and the righteous. As it is said, And, behold, there was a man in Jerusalem whose name was Simeon, and he was a just man, and one who feared God. For scarcely is righteousness preserved without fear, I mean not that fear which dreads the loss of worldly goods, (which perfect love casteth out,) (1 John 4:18) but that holy fear of the Lord which abideth for ever, (Ps. 19:9.) by which the righteous man, the more ardent his love to God, is so much the more careful not to offend Him.

Well is he called righteous who sought not his own good, but the good of his nation, as it follows, Waiting for the consolation of Israel.

He desired indeed to be loosed from the chains of bodily infirmity, but he waits to see the promise, for he knew, Happy are those eyes which shall see it. (Job 6.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And behold, there was a man in Jerusalem whose name was Simeon, and this man was just and God-fearing, awaiting the consolation of Israel. Not only from angels and prophets, from shepherds and parents, but also from elders and just men does the generation of the Lord receive testimony. Every age and both sexes and the wonders of events build up faith: a virgin begets, a barren woman bears, a mute man speaks, Elizabeth prophesies, a magus adores, one shut in the womb leaps, a widow confesses, a just man waits. And rightly just, for he sought not his own grace but the people's, desiring himself to be released from the chains of bodily frailty, but waiting to see what was promised; for he knew that blessed are the eyes that would see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
