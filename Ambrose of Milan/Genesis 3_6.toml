[[commentary]]
quote='''
And the woman saw that the tree was good for food, pleasing to the eyes and beautiful to gaze upon. She showed her weakness in passing judgment on what she had not tasted. It is not easy under any circumstance to make such an assumption without deep reflection and a careful examination of the facts. She took of its fruit, we are told, and ate it and also gave some to her husband and they both ate. Omission is made, and rightly so, of the deception of Adam, since he fell by his wife's fault and not because of his own.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 13"
