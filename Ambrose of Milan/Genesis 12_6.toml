[[commentary]]
quote='''
Having gone forth, he travelled through as far as Shechem, which in Latin interpretation is called shoulder or neck, by which we understand the carrying out of the prescribed work, since below too we have it written: he put his shoulder under to labour. Hence we observe that by the figure of the places this is expressed: that holy Abraham proved his devotion not only by zeal but also by fruitful effectiveness, by which he came as far as the oak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"

[[commentary]]
quote='''
And Abraham passed through he says as far as the place Shechem, to the high oak. Do these things not seem superfluous, unless you seek the reason, since he did not even pass over the height of the oak? But where there is reason, nothing is superfluous. For Shechem means either shoulder or neck, which is a sign of labour and exercise. Hence Jacob too, a man well exercised, gave it as a special gift to his son Joseph. Therefore, since exercise by itself cannot confer perfection without the endowment of nature, and the grace of nature is left destitute if exercise is lacking — for diligence is the support of the gifted —, that man is brought in, in imitation of whom you are formed, made, by exercise joined to the grace of nature, so much more firmly founded and more lofty that he passed through as far as the high oak. This tree, being lofty and also sturdy, is a sign that the soul of holy Abraham was not easily bent by the storms of this world, but remained on high, so as to lift itself from earthly inquiries to the height of divine knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 3"
