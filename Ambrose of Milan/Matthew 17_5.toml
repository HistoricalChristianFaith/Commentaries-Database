[[commentary]]
quote='''
They entered, then, into the cloud, that they might come to know things secret and hidden, and there they heard the voice of God saying: This is my beloved Son, in whom I am well pleased; hear him. What is "This is my beloved Son"? That is: "Do not err, Simon, by thinking that the Son of God is to be compared with servants. This is my Son; Moses is not the Son, Elijah is not the Son, although the one opened the sea and the other shut the heaven. For at the word of the Lord each of them overcame the nature of an element; but they furnished a ministry, while this is he who made the waters solid, shut the heaven with drought, and when he willed released it into showers. Where testimony to the resurrection is called in, let the ministries of servants bear their witness in support; where the glory of the Lord rising again is shown, the splendour of servants is hidden. For the risen sun veils the very globes of the stars, and all their lights vanish under the sun of this world. How then could fleshly stars be seen under the eternal Sun of righteousness and that divine brightness? Where, then, are those lights which by a kind of miracle shone before your eyes? All things are darkness in comparison with the eternal light. Let others hasten to please God by their ministries; this one alone is the true and eternal light, in whom the Father is well pleased, or in whom it has well pleased me, so that whatever he has done is mine, and whatever I have done may rightly be believed to be the work of the Son. Hear him saying: I and the Father are one. He did not say: 'I and Moses are one'; he did not say that he and Elijah had any partnership in the divine glory. Why do you prepare three tabernacles? This one has his tabernacle not on earth but in heaven." The apostles heard and fell down, shaken with dread. The Lord came and raised them up and bade them tell no one what they had seen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
