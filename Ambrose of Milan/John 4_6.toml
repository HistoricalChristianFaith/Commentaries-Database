[[commentary]]
quote='''
Many things we read and believe, in the light of the sacrament of the incarnation. Even in the very affections of our human nature we behold the divine majesty. Jesus is wearied with his journey, that he may refresh the weary. He desires to drink when about to give spiritual drink to the thirsty; he was hungry, when about to supply the food of salvation to the hungry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25205.html'
source_title="Exposition of the Christian Faith 5.4.53"

[[commentary]]
quote='''
Now Jacob's fountain was there: And being wearied, he says, he was sitting thus upon the well. Hence we recognize that there too this well is referred to mystical doctrine, because there that Samaritan woman, that is, the keeper (and the keeper of the heavenly precepts), drew from that well the divine mysteries, learning that God is spirit, and is worshiped not in a place but in spirit; and that the Messiah has come, who is Christ. When she had heard these things, that woman, who bears the figure of the Church, came to know the sacraments of the Law and believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
