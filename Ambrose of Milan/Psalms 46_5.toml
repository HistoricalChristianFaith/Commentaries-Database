[[commentary]]
quote='''
Nor is it any wonder, since God was in the midst of his city and was not moved: whether because the Son of God was moved by no lapse into any sin, nor stumbled by striking against any error, nor wavered at the push of bodily allurement; or because the grace of God did not leave his soul but remained inseparable in it, since it continued unstained by all the filth of sin. Hence the Son of God also said to the Father: Nor will you leave my soul in the underworld. Therefore, because it lay within him not to sin even in the flesh, he says divinely: I am in the Father and the Father in me, and elsewhere: I was delivered up and I did not go out. From him, surely, he did not go out to whom he said afterwards: I have risen, and I am still with you. But where anyone sins more gravely, God is moved in him, so as to pass away from him. Hence too he seemed to Adam, when he sinned, to be walking about, and to Stephen to be standing, because the one fell in transgression, the other was crowned in martyrdom. And in the book of Zechariah it is written thus: The Lord shall walk in the commotion of the threatening of his wrath. Something similar was said to the Jews in the Gospel: Behold, your house shall be left to you desolate; for the Lord forsook the Jews, and at once ruin followed the synagogue. But if Christ had not deserted it, final destruction would never have followed it. We have opened, then, what was said: God is in the midst of her; he shall not be moved.

There follows: God shall help her at daybreak, by which it is signified that the morning resurrection confers on us the support of heavenly helps, for it drove back the night and poured the day back again, as Scripture says: Rise, you who sleep, and arise from the dead, and Christ shall shine upon you. But see the mystery. Christ suffered in the evening; therefore according to the Law too the lamb is slain towards evening. He rose in the morning; for thus it is written: On the first of the sabbath Mary Magdalene came at first light to the tomb, while it was still dark, and saw the stone removed from the door. He is slain at the evening of the world, when the light was already failing, because this whole world was in darkness, and it would have been wrapped in a greater squalor of darkness had not Christ come to us from heaven as eternal light, to restore to the human race the times of innocence. The Lord Jesus suffered, then, and by his blood forgave our sins; the light of a purer conscience shone out again, and the day of spiritual grace gleamed forth; hence the Apostle also says: The night has gone before, the day has drawn near. We have awakened, therefore; let us sleep no longer. We have put on the garment of light; let us not go back to the wraps and the cast-off skins of a dark way of life. We have bidden farewell to revellings and delights, which belong to the time of night; we have chosen sobriety, by grace of which Jacob found the primacy which he did not have.

In other copies too is found: God helps her with his countenance. What this too signifies, let the prophet himself teach us; for he himself said in a later place: Show your face, and we shall be saved. The look of God, then, is our salvation, and in his countenance is our help. How great a force there is in it divine Scripture declares, which not idly added that God looked upon the gifts of Abel, but upon Cain he did not look; and therefore Cain was saddened, because he knew that his sacrifice had displeased God and his brother's had pleased him. Hence that too which was sung today in the response of the psalm greatly supports our assertion: Waiting I waited for the Lord, and he looked upon me. Whom the Lord looks upon, he saves. In fact, at the Passion of the Lord, when Peter faltered in speech, not in mind — although the very speech of Peter, even faltering, is more faithful than the teaching of many —, Christ looked at him, and Peter wept, and by this he washed away his own error. So him whom he seemed to deny with his voice he confessed with his tears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
