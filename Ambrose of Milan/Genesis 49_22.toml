[[commentary]]
quote='''
Now, to conclude the history with a kind of epilogue, as it were, as divine Scripture too is brought to its close, let us set out the prophecy of holy Jacob concerning the name of holy Joseph: my son to be increased, Joseph, my son to be increased, to be envied, my younger son, return to me. Taking counsel against him, they cursed, and the masters bent the bow against him. And their bows were crushed with might, and the sinews of the arms of their hands were loosed by the hands of the mighty one of Jacob; and from there Israel prevailed from the God of your father. And my God helped you and blessed you with the blessing of heaven from on high and with the blessing of the earth that holds all things, on account of the blessing of the breasts and of the womb, the blessings of your father and mother. He prevailed above the blessings of the abiding mountains and the desires of the everlasting hills: they will be upon the head of Joseph and upon the crown of those brothers over whom he was set.

What reason is there why the father honoured his son Joseph more richly than all his sons, except that he saw in him the mysteries that prefigured Christ? Hence, blessing him who was expected rather than him who was seen, he says: my son to be increased, Joseph. Who is to be increased, except Christ, whose grace is ever increased and whose glory has no end to its progress? Of him John too says: he must increase, but I must decrease, because through that saving and perfect name of his grace has been heaped up and has abounded in this world — my son to be increased — and therefore, because they saw him increasing, his brothers began to envy him; and the intelligible Joseph, too, met with jealousy from those whom he cherished the more. Indeed, he said: I have not come except to the lost sheep of the house of Israel. And they said: we do not know where he is from. He was healing them, and they were denying him.

My son, he says, the younger. Younger indeed, for he was almost the last by birth. Indeed Scripture too says: Jacob loved him, because he was the son of his old age. This too refers to Christ. For as the world was growing old and already setting, the Son of God, shining upon it, came late through the childbearing of the Virgin Mary. As a son of old age he took up a body, according to the mystery, he who was always with the Father before the ages.

Hence the Father says to him: return to me, calling back to heaven from the earth him whom he had sent for our salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"
