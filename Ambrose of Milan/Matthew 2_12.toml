[[commentary]]
quote='''
The magi came by one way, they return by another; for having seen Christ, having understood Christ, they go back better, surely, than they came. For there are two ways, one that leads to destruction, the other that leads to the kingdom. The one is the way of sinners, which leads to Herod; this way is Christ, by which one returns to the fatherland; for here our sojourn is for a time, as it is written: my soul has long been a sojourner. Let us beware, then, of Herod, the ruler for a time of worldly power, that we may attain the eternal dwelling of the heavenly fatherland.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
