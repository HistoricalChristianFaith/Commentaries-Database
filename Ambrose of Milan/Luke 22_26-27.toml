[[commentary]]
quote='''
Next, it must be observed that humility is not defined by every eagerness to show honour; for you can defer to someone for the sake of worldly favour, out of fear of power and regard for advantage. Your edification is sought, not another's honour, and therefore one form of sentence is given to all, so that there may be no boasting about precedence, but a contention about humility; and for this the Lord sets himself forth to be imitated. We had need of all things, he of nothing, and yet he showed himself the author of humility when he served his disciples. This he surely did not out of eagerness for advantage, but as an exercise of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
