[[commentary]]
quote='''
Or there seems to have been a kind of synagogue in the city of the Gerasenes who besought our Lord to depart, because they were seized with great fear. For the weak mind receives not the word of God, nor can it endure the burden of wisdom. And therefore He no longer troubled them, but ascends from the lower parts to the higher, from the Synagogue to the Church, and returned across the lake. For no one passes from the Church to the Synagogue without endangering his salvation. But whoever desires to pass from the Synagogue to the Church, let him take up his cross, that he may avoid the danger.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And therefore he was not troublesome to them any longer, but went up and returned. He went up, surely, from the lower to the higher, that is, from the synagogue to the Church, and returned across the lake, as he says here, or, as Matthew says, across the strait; for between us and them there is a great strait. And so no one passes from the Church to the synagogue without danger to his salvation; but he too who desires to pass from the synagogue to the Church, let him take up his cross, that he may escape the peril.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
