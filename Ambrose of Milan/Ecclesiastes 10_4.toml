[[commentary]]
quote='''
Let no one then say, We have no portion in Jacob nor inheritance in Israel. Let no one say, I am not among the Clergy, for it is written, Give unto Levi his lots; and again David says that he who lieth in the midst among the lots ascends to heaven with spiritual wings. Say not of your God, He is grievous to us, nor of your place, it is not for our turn, since Scripture says, Leave not thy place: For the adversary would fain deprive thee of it, he would fain drive thee away, for he envies thee thy hopes and thy function.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252081-91.html'
source_title="Letter LXXXI, To Certain of the Clergy"

[[commentary]]
quote='''
Therefore you, O man, guard your summit, so that you may shatter the heads of the enemies, the crown of the hair of those who walk about — for they walk about in superfluous things, not in holy ones: in the crown of the hair, not in the crown of devotion and faith — and if the spirit of one who has power rises up against you, as you have in Ecclesiastes, do not leave your place. For Christ, who made you after the image of God, has set you higher. Hold, therefore, the higher place of faith and devotion which you received from Christ, so that, having been made higher, you may easily repel the wicked spirit rising from the lower things, that is, from earthly and worldly things, and not receive his signs in your breast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 7"
