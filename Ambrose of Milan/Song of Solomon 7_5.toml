[[commentary]]
quote='''
Hence she herself also, as a well-deserving queen, is crowned with the blood of Christ, as it is written: And the adornment of her head as purple. The blood of Christ is purple, which dyes the souls of the saints, resplendent not only in color but also in power; because it makes kings, and better kings, to whom it gives an eternal kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
