[[commentary]]
quote='''
Rightly, then, does the prophet say: Hope in the Lord and do goodness, and inhabit the land, and you shall be fed in its riches. What is the land which he urges you to inhabit, but your soul, which you ought to cultivate well and frequently plough with spiritual ploughshares, lest it grow rough with long neglect? For a good husbandman works his field with daily labour and watchful care, and guards his own lands, lest the boar out of the wood lay them waste and the robber snatch away the ripe fruits. Plough, then, your land, so that when he comes who sows the Word, he may find your soul prepared, lest the seed fall upon the untilled places of your heart, and the birds of heaven come and carry off what has been sown. What the land is, then, hear him say: Behold, the sower went out to sow his field. And while he sows, some fell by the wayside, some upon the rock, some upon good ground. But that upon good ground, these are they who, hearing the word with a good heart, retain it and bring forth fruit through patience. Let your heart, then, be clean, let your soul be clean, so that you may be able to bring forth the fruit of goodness, that is, of spiritual grace. For goodness is the fruit of the Holy Spirit, as it is written: But the fruit of the Spirit is charity, joy, peace, patience, kindness, goodness, faith, modesty, continence. These are the fruits on whose riches we are fed and with whose abundance we are filled. In this land righteous Noah planted that fruitful vine, and drank of its fruit, and was loosened in his inmost heart, when the twofold posterity of his virtues clothed him with the praiseworthy covering of dutiful love. In another place also the holy prophet has shown us these riches, in which he was rich in Christ and abounded in all things that lead to eternal life. And in truth, who is richer than he who is rich in the Lord, so that he can say: I have delighted in the way of your testimonies as in all riches? For what could be lacking to a man who was enriched by heavenly oracles? And therefore he urges in this psalm that we should seek for ourselves that eternal treasure and take delight in acquiring it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
