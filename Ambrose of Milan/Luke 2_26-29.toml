[[commentary]]
quote='''
Therefore, if life is full of burden, surely its end is a relief. Now relief is a good, and death is the end: death, then, is a good. For in no other way did Simeon also rejoice, who had received the answer that he would not see death until he had first seen the Lord's Christ. And when his parents brought him into the temple, he took him up in his hands and said: now you dismiss your servant in peace, as if he were held in this life by a kind of necessity, not by his will. So he asks to be dismissed, as though he were hastening from certain bonds to freedom. For there are, as it were, certain bonds of this body and, what is heavier, bonds of temptations, which bind us and tie us down by a kind of law of sin to the injury of captivity. Then, in the very departure, we see how the soul of one who is dying looses itself little by little from the bonds of the flesh and, sent forth from the mouth, flies away, as though stripped of the prison-hovel of this body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
