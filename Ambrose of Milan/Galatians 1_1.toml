[[commentary]]
quote='''
Indeed Paul too denied that he was the apostle of a man, saying: Paul an apostle, not from men nor through man, but through Jesus Christ and God the Father. But lest he should seem to bring in any ambiguity about the Incarnation, he added: who raised him from the dead, so that you may believe him man too, when you have first believed him God. This he keeps elsewhere also in the same tenor, where he says: For there is one God and one mediator of God and men, the man Christ Jesus. He named him mediator of God, surely, before he named him mediator of men; for it is not enough to believe both, unless the order of faith is kept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
