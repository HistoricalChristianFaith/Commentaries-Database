[[commentary]]
quote='''
Mary abode with Elisabeth until she had accomplished the time of her bringing forth; as it is said, And Mary abode, &c.

Now it was not only for the sake of friendship that she abode so long, but for the increase also of so great a prophet. For if at her first coming the child had so far advanced, that at the salutation of Mary he leaped in the womb, and his mother was filled with the Holy Spirit, how much must we suppose the presence of the Virgin Mary to have added during the experience of so long a time? Rightly then is she represented as having shown kindness to Elisabeth, and preserved the mystical number.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Learn, virgins, not to run about through other people's houses, not to linger in the streets, not to join in conversations with anyone in public. Mary, slow at home, quick in public, stayed with her kinswoman three months; for she who had come for a service held fast to the service. She stayed three months, not because another's house delighted her, but because to be seen too often in public displeased her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
And Mary stayed with her three months and returned to her own house. Saint Mary is well represented as having both rendered a service and kept a mystical number; for the cause of her staying long was not only their familiarity, but also the advancement of so great a prophet. For if at her first entrance so great a progress came about, that at Mary's greeting the infant leaped in the womb and the infant's mother was filled with the Holy Spirit, how much do we think the presence of Saint Mary added through the use of so long a time? And Mary stayed with her three months. So the prophet was anointed and, like a good athlete, was trained in his mother's womb; for his strength was being prepared for the greatest of contests.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
