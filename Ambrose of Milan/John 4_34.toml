[[commentary]]
quote='''
The food of a priest is the remission of sins. Therefore, the Prince of priests, Christ, says, "My food is to do the will of him who sent me." What is the will of God but this: "When you turn and groan, then shall you be saved"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252057.html'
source_title="LETTER 57 (TO SIMPLICIANUS)"


[[commentary]]
quote='''
But as Christ is not yet made subject [to the Father], so also is the work of God not yet perfected. For the Son of God said, "My food is to do the will of him who sent me and to complete his work." How can anyone doubt that the subjection of the Son in me is still in the future when the work of the Father is still unfinished [in me] because I myself am not yet perfect?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25205.html'
source_title="Exposition of the Christian Faith 5.13.169"

[[commentary]]
quote='''
Accordingly let us imitate him and let us seek that food, by virtue of which we can advance by day and by night to the knowledge of heavenly things. For not all food is material nor all meat corporeal: there is the meat of the mind, as we have said, on which souls feast; concerning which the Lord says: My meat is to do the will of my Father who is in heaven. This is the meat of angels, namely to serve the Divine Will. For them there is no care of courses, no familiarity with banquets, no renewal feasts, no drinking of wine or intoxicants, no distention of the body, no vexation of the stomach.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 3"
