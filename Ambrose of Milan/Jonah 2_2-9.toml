[[commentary]]
quote='''
Indeed the very prayer of holy Jonah teaches that these are the mysteries of the Lord's Passion: And he said: I cried, he says, to the Lord my God in my tribulation, and he heard me from the belly of the underworld. You see that he said the belly of the underworld, not of the whale. And the Lord went down not into a whale but into the underworld, so that those too who were in the underworld might be loosed from everlasting bonds. Indeed very many even rose again. But what rivers surrounded Jonah, or of what abyss did Jonah say: The uttermost abyss surrounded me, it plunged my head into the clefts of the mountains, I went down into the earth whose bars are everlasting restraints? Surely this does not fit and suit the person of Jonah. But the Son of God went down into the clefts of the mountains when he went down into the tomb. For Joseph, as the Gospel teaches, laid him in his new tomb, which he had hewn in the rock, and rolled a great stone to the door of the tomb. Indeed in another book too: He laid, it says, him in a tomb hewn out, in which no one had yet been laid.

And who is it that sacrificed with the voice of praise and of confession of the Lord, unless the prince of all priests, who both vowed vows for all and paid them? For he alone had power over his own fulfilment. As, then, Jonah was sent into the sea and the sea ceased from its commotion, so our Lord Jesus Christ came into this world, so as to gain the world and by his blood to make peace for all things, whether earthly or heavenly. By his coming, then, he redeemed all men and called them forth to the worship of God by his works; when he raised the dead and healed the sick, he poured the fear of God into human affections. He it is who sacrificed to the Lord a saving sacrifice for us and offered to God victims worthy of our conversion; he it is who slept and awoke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
