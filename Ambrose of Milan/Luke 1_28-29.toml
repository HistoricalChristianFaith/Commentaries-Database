[[commentary]]
quote='''
Mark the virgin by her manner of life. Alone in an inner chamber, unseen by the eyes of men, discovered only by an angel; as it is said, And the angel came in unto her. That she might not be dishonoured by any ignoble address, she is saluted by an angel.

But mark the Virgin by her bashfulness, for she was afraid, as it follows; And when she heard, she was troubled, It is the habit of virgins to tremble, and to be ever afraid at the presence of man, and to be shy when he addresses her. Learn, O virgin, to avoid light talking. Mary feared even the salutation of an angel.

She wondered also at the new form of blessing, unheard of before, reserved for Mary alone.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"
[[commentary]]
quote='''
And the angel came in to her and said: Hail, full of grace, the Lord is with you, blessed are you among women. But she, when she saw him, was troubled at his entrance.

Learn the virgin by her conduct, learn the virgin by her modesty, learn the virgin by the oracle, learn her by the mystery. It is the way of virgins to tremble, to be afraid at every entrance of a man, to dread every address of a man. Let women learn to imitate this purpose of modesty. Alone in the inner rooms, she whom no man might see, the angel alone might find: alone without a companion, alone without a witness, lest she be corrupted by some base address, she is greeted by the angel. Learn, virgin, to shun wantonness of words; Mary was afraid even of the angel's greeting.

Yet she was he says pondering what manner of greeting this was, and so with modesty, because she was afraid, with prudence, because she wondered at the new form of blessing, which had nowhere been read, nowhere met with before. This greeting was reserved for Mary alone; for rightly is she alone called full of grace, who alone obtained the grace that no other had merited, to be filled with the Author of grace. Mary therefore blushed, Elizabeth also blushed, and so let us recognize what the difference is between the modesty of a married woman and that of a virgin. The one blushed for a cause, the other out of modesty; in the married woman a measure of shame is kept, in the virgin the grace of shame is increased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
