[[commentary]]
quote='''
Now sin is either freely forgiven, or blotted out, or covered. It is freely forgiven through grace, blotted out through the blood of the cross, covered through charity. So too with iniquity, which is reckoned the habit of an unjust mind, although John in his epistle said that he who has committed sin has also committed iniquity, as we have it written: Everyone who commits sin commits iniquity also. Sin is iniquity, because in sin itself there is iniquity; yet, as it seems to us, sin is the work of iniquity, while iniquity is the worker of fault and transgression. It is a greater thing, then, that iniquity itself should be blotted out, that the root and seedbed of sins should be cut away. Let the evil root be removed, lest it bear evil fruits; let every inclination to error be abolished; let all the kinds of iniquities be taken away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 13"
