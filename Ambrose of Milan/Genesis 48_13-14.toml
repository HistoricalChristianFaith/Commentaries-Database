[[commentary]]
quote='''
How glorious are the mysteries in this: that Joseph, taking his sons whom he had received in Egypt, Ephraim at his own right but at the left of Israel his father, and Manasseh at his own left but at the right of Israel, brought them before his father; but Israel, stretching out his right hand, laid it upon the head of Ephraim, who was the younger and stood at his grandfather's left, and laid his left hand upon Manasseh, who was at the right, and so, with his hands exchanged, he blessed them! In this Joseph kept the order of nature, so as to give more to the elder son, just as Isaac too desired to confer the blessing on Esau, the first son; but he believed that the younger son, as a type of the younger people, was to be preferred, just as he himself had been preferred by his mother.

And so Manasseh is signified, by Latin interpretation, as "from forgetfulness," because the people of the Jews forgot their God who made them, and whoever of that people believes is recalled as it were from forgetfulness. Ephraim, on the other hand, by the interpretation of his name promises fruitfulness of faith, he who increased the father, as Joseph himself says: For God has increased me in the land of my humiliation. This is proper to the younger people, which is the body of Christ, increasing the father and not forsaking its own God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 1"
