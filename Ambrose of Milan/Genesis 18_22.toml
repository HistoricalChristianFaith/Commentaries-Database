[[commentary]]
quote='''
But what does it mean that the very men who had come to Abraham together with the Lord made for Sodom, unless that their crime might be heaped up, if the impious tried with greater sacrilege to do violence to those whom the just man had honoured? For as to his calling them men, the reason is evident: they bore the appearance of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
