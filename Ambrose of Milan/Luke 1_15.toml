[[commentary]]
quote='''
Next to his becoming the rejoicing of many, the greatness of his virtue is prophesied; as it is said, For he shall be great in the sight of the Lord. The greatness signified is not of the body, but of the soul. Greatness in the sight of the Lord is greatness of soul, greatness of virtue.

He extended not the boundaries of an empire, nor brought back in triumph the spoils of war, (but, what is far greater,) preaching in the desert he overcame by his great virtue the delights of the world, and the lusts of the flesh. Hence it follows; And he shall drink no wine nor strong drink.

On whomsoever the Holy Spirit is poured, in him there is fulness of great virtue; as in St. John, who before he was born, when yet in his mother's womb, bore witness to the grace of the Spirit which he had received, when leaping in the womb of his parent he hailed the glad tidings of the coming of the Lord. There is one spirit of this life, another of grace. The former has its beginning at birth, its end at death; the latter is not tied down to times and seasons, is not quenched by death, is not shut out of the womb.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he shall be great before the Lord. Here he has declared a greatness not of body but of soul. There is before the Lord a greatness of soul, a greatness of virtue; there is also a smallness of soul and a childhood of virtue. For we reckon the ages of soul and of body alike, not by the reckoning of time but by the quality of virtue, so that he is called a perfect man who is free from the error of childhood and through maturity of mind does not feel the slipperiness of youth, but he is called little who seems to have made as yet no progress in virtue. Hence that saying in Jeremiah, when the Lord had pity on Ephraim weeping and begging pardon for his own sins: From my youth he says Ephraim is a beloved son to me, a child in delights. For had he not been a child in delights, he would never have sinned. And well did he say both, that he was in delights and that he was a child; for he is a child who does not sin. Behold my child, whom I have chosen. Through delights, then, he sinned who had been so formed by the Lord as to be ignorant of error. So if he had not been a child in delights, and if he had advanced into the perfect man by the age of virtue, he would never have fallen, so as to need to ask pardon for his offences, when he ought rather to have hoped for the rewards of merits. This our Lord too seems to express in the Gospel, when he says: Do not despise one of these little ones. But let more be kept for its own place. So the little one is the opposite of the great. And if, according to the Apostle, the little child is under the elements — when indeed we were little children, we were under the elements of this world — then the great one is above the elements of the world.

John, then, shall be great, not by strength of body but by greatness of soul. Indeed he did not extend the borders of any empire, nor did he prefer triumphs won with the glories of warlike contest; but, what is greater, preaching in the desert he subdued the delights of men and the wantonness of the body by great virtue of soul. Little, therefore, in the world, great in the spirit. Indeed, as one who was great, he was not caught by the allurements of life, nor did he change the constancy of his judgment through desire of living.

And with the Holy Spirit he says he shall be filled while still in his mother's womb. There is no doubt that this promise of the angel was true, since Saint John, before he was born, while still placed in his mother's womb, showed the grace of the Spirit he had received. For though neither his father nor his mother had done any wonders before, leaping in his parent's womb he proclaimed the good news of the Lord's coming. For so you have it that, when the mother of the Lord had come to Elizabeth, she said: Behold, as your greeting came into my ears, the infant leaped in my womb; for he did not yet have the spirit of life, but the spirit of grace. Indeed elsewhere too we have been able to observe that the grace of sanctifying can run ahead of the substance of living, when the Lord says: Before I formed you in the womb, I knew you, and before you came out of the womb, I sanctified you and set you as a prophet among the nations. For the spirit of this life is one thing, the spirit of grace another. The one takes its beginning in being born, its ending in dying; the other is not confined by times or by ages, is not extinguished by death, is not shut out by a mother's womb. Indeed both Saint Mary, filled with the Holy Spirit, prophesied, and Elisha, when dead, raised a man's dead body by the touch of his own body, and Samuel after death, by the testimony of Scripture, did not keep silent about things to come:

And with the Holy Spirit he says he shall be filled; for to whom the spirit of grace is present nothing is lacking, and in whom the Holy Spirit is poured there is a fullness of great virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
