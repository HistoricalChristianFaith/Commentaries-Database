[[commentary]]
quote='''
But when are those days, in which Christ shall be taken away from us, since He has said, I will be with you alway, even unto the end of the world? But no one can take Christ away from you, unless you take yourself away from Him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the days will come, when the bridegroom shall be taken away from them. What are those days in which Christ is taken away from us, especially since he himself said: I am with you even to the consummation of the world, he himself said: I will not leave you orphans? For it is certain that if he leaves us, we cannot be saved. No one can take Christ away from you, unless you take yourself away. Let not your boasting take you away, let not arrogance take you away, and do not presume upon the Law; for he came not to call the righteous, but sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
