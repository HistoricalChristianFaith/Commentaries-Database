[[commentary]]
quote='''
Do not think that the Lord does not know your way; if you are righteous, he knows it. Believe the prophet when he says: The Lord knows the ways of the spotless, and their inheritance shall be spotless; they shall not be confounded in the evil time. He who knows Christ is known by the Lord; he knows the righteous, he does not know the unrighteous. Therefore he will say to the unrighteous: Depart from me, all you who work iniquity; I do not know you, that is: because you are unworthy of divine knowledge; I do not know you, because you yourselves chose not to know me. Your works do not know me, your deeds do not know me; even if you say that you know me, your sins refute you. Every sin is from the evil one, but he who does not sin abides in me; this John wrote. Why should I speak of the Lord, that he disdains to know the ungodly man? Paul disdains it, who said: If any among you is a prophet or spiritual, let him recognize what I write to you; but he who does not know will not be known; and elsewhere it was said thus: The Lord has known who are his. Let us, then, be the Lord's, so that the Lord may know us, and let everyone who names the name of the Lord depart from iniquity.

The Greek has: The Lord knows the days of the spotless; for there are days of Elijah, there are days of Nebuchadnezzar. Therefore the Gospel has: In the days of Elijah, when heaven was shut. It was night for the unbelieving, but for Elijah there was light; heaven was shut for the unbelieving, but for Elijah it lay open; there was famine for the unbelieving, but for Elijah plenty. For he could not hunger to whom heavenly things supplied food, nor did he hunger who himself fed others. The righteous man, then, is a day to himself in the darkness, because the light also shines in the darkness. And Joseph was in Egypt, and the noonday shone for him, as he said above. But to the sinner God said: Why do you declare my righteousnesses? Righteousness is light, because above it has: And he will bring forth your righteousness as the light. You have, then, something to shine in you, if you follow righteousness. The day shines bright for you, the night gives light to you, because for the faithful the night too shall be lit up as the day. The Lord, then, knows the days of the righteous man, because he himself enlightens every man coming into this world, that is, the one who lives according to the image and likeness of God, the one who knows himself to be his man, so that he flees the neighing lust of horses, the madness of wild beasts, the timidity of little hares, the cunning of foxes, the rapine of wolves; the man who acts as though he had come into this world from elsewhere, who has been born not of blood nor of the will of the flesh, but of God. You have come, then; do not stay behind, do not cling to earthly things. But that you may know that the days are good, hear him say: Abraham saw my day and was glad. He has a good day who knows the Son of God to be the good God and confesses him as Lord. And again he himself warns us that we ought to beware, because the days are evil. What days are evil? Those, surely, in which evil is known, which is from the evil one. Or perhaps the days of the world are evil, because the world is set in wickedness. But we read of an evil day even after the world: In the evil day the Lord will deliver him, that is, on the day of judgement, on account of the punishments of many. For it must be that the unrighteous are tormented and the righteous suffer with them, because the angels too rejoice when a single sinner is saved from death. They suffer with him, then, when he is punished, although we read elsewhere: The righteous man shall rejoice when he sees the vengeance on the ungodly, which I reserve for its own place, although you have often heard why he rejoices; but let us not thrust one task into another.

The Lord knows the days of the spotless, because his grace and fullness has mercy on spotless innocence; it does not have mercy on those who go astray. These have no day, because they flee the light; of them it was beautifully said: their days pass away like a shadow. The knowledge of God, then, is one of condescension, not of sight. His eyes are light; those on whom he looks he enlightens; and therefore his eyes are the day of the righteous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
