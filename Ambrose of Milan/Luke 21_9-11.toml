[[commentary]]
quote='''
Of these heavenly words, however, none are witnesses more than we, whom the end of the world has found. For how many battles, and what reports of battles have we received! The Huns rose up against the Alans, the Alans against the Goths, the Goths against the Taifali and the Sarmatians; us too, in Illyricum, the exile of the Goths has made exiles from our homeland, and the end is not yet. What a famine for all, what a plague of oxen and men alike and of the other cattle, so that pestilence has made even us, who did not endure the war, equal to the vanquished! So, since we are at the setting of the world, certain sicknesses of the world go before. Famine is a sickness of the world, pestilence is a sickness of the world, persecution is a sickness of the world.

But there are also other wars which the Christian man endures, battles of diverse desires and clashes of passions, and enemies at home far more grievous than those from outside. Now avarice goads, now lust inflames, now fear terrifies, now anger stirs up, now ambition moves, now the spiritual forces of wickedness which are in the heavenly places try to terrify. And so the shifting disposition of the wavering mind is pressed as if by certain battles and shaken as if by certain earthquakes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
