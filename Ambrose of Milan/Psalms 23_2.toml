[[commentary]]
quote='''
What are our pastures, that is, those of the faithful, if not Christ? In whose pastures the Prophet rejoiced to be placed, saying: In a place of pasture, there he has set me (Ps. 22 (23):2); for there he feeds us and refreshes us. Good pastures are the divine sacraments. There you pluck a new flower, which has given the good fragrance of the resurrection: you pluck the lily, in which is the splendour of eternity: you pluck the rose, that is, the blood of the Lord's body. Good pastures also are the books of the heavenly Scriptures, in which we are fed by daily reading, in which we are restored and refreshed, when we taste what is written, or, having sipped it with the tip of the mouth, chew it over again and again. With these pastures the flock of the Lord is fattened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
