[[commentary]]
quote='''
For if David, because, lifted up by presumption of virtue, he had said: If I have repaid evil to those who repaid me; and elsewhere: But I said in my abundance: I shall not be moved for ever, recorded that he at once suffered the penalty of this insolence, saying: You turned away your face from me, and I became troubled; if the very founder of the Lord's line incurred offence for insolence, how much more must we other sinners, whom no prerogative of merits supports, fear the rock of insolence, on which the good suffer shipwreck, especially since so great a man is for us the author both of teaching and of example, who thought that a kind of palinode must be sung afterwards to win back the Lord's favour, saying: Lord, my heart is not exalted, nor are my eyes lifted up on high; and: The Lord is at my right hand, that I may not be moved; for he knew that, when he trusted in himself, he fell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
