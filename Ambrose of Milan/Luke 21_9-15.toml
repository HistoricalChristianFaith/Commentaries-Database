[[commentary]]
quote='''
But the stronger man says: If camps stand against me, my heart shall not fear; if battle rise up against me, in this will I hope. He stands in the battle line, presenting his breast to meet the enemy; even if some Goliath rises up, savage and towering, yet, while the rest are afraid, he rises up, lowly, like David, casting off the armour of an earthly king, taking up the lighter weapons of faith, and hurling with a threefold cord the javelin of pure confession he wounds the shamelessness of the persecutor, scorning threats, heedless of the powers, fit even to have Christ speak in him. Now Christ, now the Father, now the Spirit of the Father speaks. These do not disagree, but accord. What one speaks the three speak, because the voice of the Trinity is one. To this victor, who has slain Goliath with his own sword while he meets death for Christ, once the foreigners are put to flight, the young maidens run to meet him — those, namely, like eagles — saying: Saul struck among thousands, David among ten thousands. This is a sign that the victors over the world are set before princes. Indeed, when kings are dead, the martyrs succeed for ever to the kingdom in the honour of heavenly grace, and the former become suppliants, the latter patrons.

There is also another sword of Goliath, another weapon of the devil, namely the speech of heretics, which the man who knows how to sing psalms seizes in order to overcome the adversary — one who hears of wars here but does not suffer them, not restless, not moved by any wind of doctrine, not knowing the famine of the word and filled with the abundance of heavenly Scripture — one who would not shrink from challenging the heretic as he resounds with empty words. Then let the one who is weak wait, lest by an unequal encounter he create a prejudice against the rest. Let David come, whose mouth Christ opens to declare the mysteries; let that Nazirite come whose hair does not fall, either having nothing superfluous which could fall or being about to lose nothing of his higher virtues, whole in sobriety, strong in peace, one who guards all his senses and his words to the end.

Let the Gospel be preached, so that the world may be destroyed. For just as the preaching of the Gospel has gone before into the whole world — the preaching which already both Goths and Armenians have believed, and therefore we see the end of the world — so also the Gospel is preached by the spiritual man, when he pursues all the advances of wisdom and all the virtues with a mind and spirit that sing psalms, destroying death last of all. For then is the end, when Christ shall have delivered up in him the kingdom to God and the Father, and this man shall have been made subject to him who subjected all things to himself, that God may be all in all. And the Gospel will be preached through all the cities, that is, the cities of Judea; known, indeed, in Judea is God. For then the cities of Judea are built, when the foundations of the virtues are laid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
