[[commentary]]
quote='''
Judas, do you betray the Son of Man with a kiss? A great indication of divine power, a great lesson in virtue. Both the plan of the betrayal is laid open and yet patience is not withheld. You showed, Lord, whom he was betraying, while you make hidden things manifest. You showed also whom he was handing over, when you say: the Son of Man, because it is the flesh, not the divinity, that is seized. Yet this convicts the ungrateful man the more, that he handed over him who, though he was the Son of God, had nevertheless willed for our sake to be the son of man, as if he were saying: For your sake, ungrateful man, I took on what you hand over. Behold the hypocrisy! So I think it should be pronounced as a question, as though he were rebuking the traitor with the affection of one who loves: Judas, do you betray the Son of Man with a kiss? That is: do you inflict a wound with the pledge of love, and shed blood with the office of charity, and bring death with the instrument of peace? Do you, a servant, betray your master, a disciple your teacher, a chosen one your maker? This is that saying: Useful are the wounds of a friend rather than the willing kisses of an enemy. This is said to the traitor; but what is said to the peaceable one?

Let him kiss me with the kisses of his mouth. And he kissed him, not to teach us to dissemble, but so that he might not seem to shrink from the betrayal, and might move the traitor the more by not denying him the offices of love; for it is written: With those who hated peace I was peaceable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
