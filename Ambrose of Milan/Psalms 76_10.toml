[[commentary]]
quote='''
Let your thoughts confess to the Lord. Do not say: "We have not sinned." Paul has said: Although I am not conscious to myself of anything, but added, nevertheless, yet am I not hereby justified. And you, even if you are not conscious to yourselves of anything, confess, however, to the Lord, lest there be anything which may escape you. For he who confesses to the Lord and brings to confession the remainders of the thought shall keep holiday in the sanctuary of his mind and shall feast, not with the leaven of malice and wickedness, but with the unleavened bread of sincerity and truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 16"
