[[commentary]]
quote='''
Let the weak man eat herbs; but you, plant a vine in your field, set out a vineyard, and if Ahab comes to say to you: Give me your vineyard, that I may plant herbs for myself, do not consent to him, lest by your consent he sow perishable things and cut down eternal ones. Therefore Naboth is held among the saints, because he thought that the inheritance of his forefathers was not to be yielded even to the king, and preferred to be stoned rather than give up his vineyard to be plundered. The inheritance of the forefathers is the true faith. There arose Arians, supported by royal power, who thought that the temple of the Lord ought to be handed over to them, threatening bitter punishments. But far be it that, with a mind serving the Lord, the fear of punishment should weigh more than the pattern of devotion. Unbelief did not prevail, because faith stood firm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
