[[commentary]]
quote='''
The rulers of the synagogue condemn themselves by their own judgement; for they confess that what they had given was the price of blood, while they reproach the one who gives it back. For if it was not to be received back, neither was it to be paid. And would that they had either not given it or, since they had given it, had not taken it back! For they spurned what they would not put into the treasury, and with it they bought a field for the burial of sojourners. Rightly, then, the Gentiles, for whom the burial in that field which was bought by the death of Christ has been of profit, are no longer newcomers and sojourners, but have become fellow citizens of the saints and members of the household of God, because they are buried together with the Son of God; but the Jews, who spurned the price of his Passion, sojourn away from Christ. More tolerable than they is the traitor, at least in this, that he confesses his error, while they make their crime worse by excusing it; for confession after a sin is the more modest. Shamelessly, then, they rebuffed him as he confessed the sacrilege they shared, saying: What is that to us? See to it yourself; for what was the traitor saying but this: I have sinned in that I have betrayed righteous blood? What was the crime of the one who betrayed, how could it not be the sin of those who received, since crime was joined to crime, so that they slaughtered the more criminally him whom they had criminally bought?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
