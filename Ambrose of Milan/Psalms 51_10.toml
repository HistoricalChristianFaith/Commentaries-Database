[[commentary]]
quote='''
There follows: Create a clean heart in me, O God, and renew a right spirit in my inward parts. Above he asks to be cleansed from hidden things; here he asks that a clean heart be created for him, which benefits him who is renewed in spirit; for in the new man the heart is clean in whom the filth of old transgressions has been blotted out and no image of iniquity has remained inscribed. And the cleansing of the heart is a great gift. Hence Solomon finely says: Who will boast that he has a chaste heart? and the Lord in the Gospel: Blessed are the clean of heart, for they shall see God. For this reason David too desired to have a clean heart, lest he should be cast away from the face of the Lord.

And in him in whom the heart is clean, the spirit is renewed in his inner parts. For the inward parts are, as it were, the inner parts of the soul; for just as the inward parts are the inner parts of the body, so too there are inner, intelligible inward parts of the soul, as are the inward parts of mercy, as are the inner things that are in him, of which he says: Bless the Lord, O my soul, and all that is within me, his holy name. And the inward parts of the soul are the inventions of the senses, good thoughts, the pursuits of the virtues, perseverance, and finally those which in Greek are called ἔννοιαι (notions).

And the right spirit, which directs well, which leads into the right way, is the Spirit of truth, or at any rate the upright conscience of a man, bent by no sins, or the spirit which is in man. We have not passed over what others think; yet it seems to us that, since the reading speaks of the mysteries and the grace of the renewal to come is expressed, it is the infusion of the Holy Spirit that is asked for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 14"
