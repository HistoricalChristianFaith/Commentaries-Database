
[[commentary]]
quote='''
But perhaps someone may say that it was said by the Apostle: That the kingdom of God is not in speech, but in power (1 Cor. 4:20). I do not deny that it is written, but I know in what speech: namely, the speech which one who is puffed up has poured out, speech which cannot profit the hearers, which is without the demonstration of the spirit and of power. This speech Paul does not deign to know; for he wishes rather to commend the power of speech. Indeed, the Apostle wished his speech to be such that it came in weakness, so as to make others stronger; in fear and trembling, so that those who feared might fear nothing but the Lord Jesus, and those who trembled might keep his peace and tranquillity. Hear, then, what kind of speech the Apostle had: And my speech, he says, and my preaching were not in the persuasion of the words of human wisdom, but in the demonstration of the spirit and of power (1 Cor. 2:4); because faith is made firm not in the forensic speech of wisdom, but in the demonstration of the spirit, in the power of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
