[[commentary]]
quote='''
And the woman said: The serpent deceived me and I ate. That fault is pardonable which is followed by an admission of guilt. The woman, therefore, is not to be despaired of, who did not keep silent before God, but who preferred to admit her sin—the woman on whom was passed a sentence that was salutary. It is good to suffer condemnation for our sins and to be scourged for our crimes, provided we are scourged along with other men. Hence, Cain, because he wanted to deny his guilt, was judged unworthy to be punished in his sin. He was forgiven without a prescribed penalty, not, perhaps, for having committed such a serious crime as parricide—he was responsible for his brother's death—as one of sacrilege, in that he thought he had deceived God when he said: I do not know. Am I my brother's keeper? And so the accusation is reserved for his accuser, the Devil, prescribing that he be scourged along with his angels, since he did not wish to be scourged with men. Of such, therefore, has it been said: There is no regard for their death and they shall not be scourged like other men. The woman's case is, accordingly, of a different character. Although she incurred the sin of disobedience, she still possessed in the tree of Paradise food for virtue. And so she admitted her sin and was considered worthy of pardon. The just is first accuser of himself in the beginning of his speech. No one can be justified from sin unless he has first made confession of his sin. Wherefore the Lord says: Tell if thou hast anything to justify thyself.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 14"

[[commentary]]
quote='''
The serpent urged me, she said. This seemed to God to be pardonable, inasmuch as He knew that the serpent found numerous ways to deceive people. Satan disguises himself as an angel of light and his ministers as ministers of justice, imposing false names on individual things, so as to call "rashness" a virtue and avarice "industry." The serpent, in fact, deceived the woman and the woman led the man away from truth to a violation of duty. The serpent is a type of the pleasures of the body. The woman stands for our senses and the man, for our minds. Pleasure stirs the senses, which, in turn, have their effect on the mind. Pleasure, therefore, is the primary source of sin. For this reason, do not wonder at the fact that by God's judgment the serpent was first condemned, then the woman, and finally the man. The order of condemnation, too, corresponded to that of the crimes committed, for pleasure usually captivates the senses and the senses, the mind.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"

[[commentary]]
quote='''
Rightly then, on being questioned, did the woman reply when she recognized the author of the sin: The serpent persuaded me and I did eat. The serpent urges the cause of the appetite, the Lord decrees fasting. Therefore He Himself says: [Fast] and pray that ye enter not into temptation. And so appetite drove man, while reigning supreme, from paradise; abstinence recalled him to paradise from his wandering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
