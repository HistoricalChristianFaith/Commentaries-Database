[[commentary]]
quote='''
Since, therefore, evils are to be fled and turned aside from, and evils are on earth, iniquities on earth, let us flee earthly things, lest iniquities seize us, as they seized even holy David, as he himself testifies, saying: My iniquities have overtaken me, and I was not able to see, because the eye of the soul is blinded by the smoke of iniquity, so that it does not see the things that are full of light. So, then, Laban too could not see the good things of Jacob, nor the prince of the world the glory of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
