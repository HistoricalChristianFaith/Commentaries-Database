[[commentary]]
quote='''
For Job too says: For the arrows of the Lord are in my body, whose fury drinks my blood; when I begin to speak, they prick me. He complains of the wound of his body; this one laments the wounds of his soul. And perhaps this one does penitence for sin, while that one pleads the cause of human infirmity and, as a defender, so to speak, of our weakness, asks the help of the Creator as a remedy for his work. This one, then, prays, that one pleads as an advocate; and therefore this one's grief is more vehement, because the wounds of the soul are heavier than those of the flesh. That one says the arrows of the Lord are in his body, this one laments them as fixed; that one's blood is drunk, this one's is poured out; that one is pricked, this one is wounded; the hand of God touched that one, upon this one it has been made firm with heavy weight; this one bewails that his soul is filled with mockeries, that one that his body is filled with sores.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
