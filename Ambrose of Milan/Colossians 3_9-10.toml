[[commentary]]
quote='''
In the regions of Arabia there is reported to be a bird called the phoenix. This bird is said to reach the ripe old age of 500 years. When the phoenix realizes that he is coming to the end of his life, he builds himself a casket of incense, myrrh, and other aromatic plants, into which he enters and dies when his time has come. From the moisture proceeding from his flesh he comes to life again. In the course of time this bird puts on ‘the oarage of his wings’ until he is restored to his primitive form and appearance. By the very act of his resurrection the phoenix furnishes us a lesson by setting before us the very emblems of our own resurrection without the aid of precedent or of reason. We accept the fact that birds exist for the sake of man. The contrary is not true: that man exists for the sake of birds. We have here an example of the loving care which the Author and Creator of the birds has for His own saints. These He does not allow to perish, just as He does not permit in the case of one sole bird when He willed that the phoenix should rise again, born of his own seed. Who, then, announces to him the day of his death, so that he makes for himself a casket, fills it with goodly aromas, and then enters it to die there where pleasant perfumes succeed in crowding out the foul odor of death?

You, too, man, should avail yourself of a casket: ‘strip off the old man with his deeds and put on the new.’ Your casket, your sheath, is Christ who protects and conceals you in the day of evil. Do you wish to be convinced that it is a casket of protection? ‘In my quiver he hath hidden me,’ Scripture declares. The casket, then, is your faith. Fill it with the goodly aroma of your virtues, that is, of chastity, compassion, and justice, and immerse yourself wholly in the inmost mysteries of faith, which are fragrant with the sweet odors of your significant deeds. May your exit from this life find you clothed with that faith, so that ‘your bones may be made fat’ and ‘be like a watered garden,’ thus coming to life and flourishing. Be aware, therefore, of the day of your death, as the Apostle Paul realized when he said: ‘I have fought the good fight, I have finished the course, I have kept the faith. There is laid up for me a crown of justice.’ Like the good phoenix, he entered his casket, filling it with the sweet aroma of martyrdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
