[[commentary]]
quote='''
And so he began thus: Reuben, my firstborn, you are my strength and the beginning of my sons, hard to bear and hard and headstrong, you have done outrage. Like water, do not boil over; for you went up to your father's bed: then you defiled the couch where you went up. Does he not seem to be rebuked rather than blessed? And therefore it is a prophecy rather than a blessing. For a prophecy is the announcement of things to come, while a blessing is the votive bestowal of sanctification and of graces.

The Jews, too, think that the old man says these things to his son Reuben because he lay with Bilhah, his father's concubine, and defiled his father's couch — but they are easily refuted, for this had been done earlier —, whereas Jacob promises that he will tell the things that were to come in the last days, not those that had been done. So the patriarch's statement is consistent and agrees with itself: seeing the Lord's future passion at the hands of the persecuting Jews, he curses the monstrous audacity of the firstborn people, which, unbelieving and not subject to the law of God, and not knowing how to bear the yoke of Christ with its hard neck, assailed the author of life not only with the crime of murder but also with the injury of sacrilegious insult.

Do not boil over, he says, like water, so that it may not burst out into greater madness and the heat of fury and insanity not allow the sinners to come to their senses, but that they may do penance for their offences, since the hard people went up to the father's bed and defiled the holy couch, that is, by fastening to the gibbet of the cross the flesh of the Lord Jesus our creator, in which, as in a kind of bed and fatherly couch, his saints rest in saving refreshment. Who then would deny that this was said of the people, when all these things fit the people? For it was the people that was called Israel the firstborn, the people that was said to be of a hard neck; of it Moses said: But you are a people of hard neck. And in truth, who is so hard and so headstrong and so outrageous as the people of the Jews, who scourged with whips and pierced with nails the Lord Jesus, through whom they had seen the dead raised and the blind given light, though they could not deny his divine works? That this was committed at the instigation of the scribes and the high priests, with Caiaphas, the chief of the priests, raging alongside them, the course of the Gospel has declared; and therefore the holy prophet shrank from any share in so great a crime, lest through the succession of their descent they should dare to claim for themselves fellowship with so great a patriarch.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 2"
