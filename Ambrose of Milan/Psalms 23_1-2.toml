[[commentary]]
quote='''
There is, then, a bread of angels which man has eaten; for so it is written: Man ate the bread of angels. This is the bread of which David said: The Lord feeds me, and nothing shall be lacking to me. In a green place, there he has set me; beside the water of refreshment he has brought me up. Good David taught me the bread of angels, and he himself taught me the water of refreshment. This refreshment is spiritual, this refreshment is the rest of the inner mind. Good is the water that washes away sin, that cleanses inner things. What this water is, let us hear: If anyone, he says, thirsts, let him come to me and drink. He who believes in me, as Scripture says, out of his belly shall flow rivers of living water. Now this he said of the Spirit which those who were to believe in him were beginning to receive. The righteous man, then, lacks neither this bread nor the water of refreshment, he for whom the Holy Spirit is rest and refreshment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
