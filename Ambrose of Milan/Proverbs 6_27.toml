[[commentary]]
quote='''
Beware, then, of the counsels of the ungodly; let counsels of this kind not penetrate your mind, lest it be said of you: will anyone bind fire in his bosom, and not burn his garments? For he who has once kindled in the bosom of his mind the flame of a burning shameful deed will quickly burn the garments of his body. And as fire leaping onto stubble clings and remains until it consumes all it has seized, so even a tiny spark of sin, if it has been roused by some tinder of vices, rouses a great fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
