[[commentary]]
quote='''
As he says these things, behold, through the Holy Spirit a present image of things to come was poured into him, and seeing, after the heavy turmoil of wars, peace spread over the whole world at the coming of the saving Lord, he cries out to all, saying: Come and see the works of the Lord, which he has set as prodigies upon the earth. "Come" looks to assembling, "see" to attention and zeal for knowing the truth. See, he says, the works of the Lord full of miracles, in which are the signs of great powers. In fact τέρατα in Greek are called in Latin things to be wondered at. Do not, then, take the works of the Lord as prodigies of horror, but as full of wonder. Excellently is it said: "he has set upon the earth", that is, into the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
