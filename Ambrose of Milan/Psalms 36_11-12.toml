[[commentary]]
quote='''
And how brief, yet how great, is the conclusion at the close! "Let me not be proud," he says, "so as to sin; let me not sin, lest I be moved; let me not be moved, lest I fall; let me not fall, lest I be thrust out, as Adam was thrust out of paradise, because in him first the foot of pride could not stand". Pride does not know how to stand, and if it has fallen, it does not know how to rise again. And therefore he spoke beautifully of the proud in earlier psalms also: Some in chariots and some on horses, but we shall be magnified in the name of our God — for this is stable, that untrustworthy — and he subjoined: They are bound and have fallen, but we have risen and are set upright. And in the book of the prophet Micah it is written: Do not rejoice proudly over me, my enemy, because I have fallen; but I shall rise again. For we have fallen in this world, but in Christ we have risen, to whom be honour, glory, power, perpetuity, both from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
