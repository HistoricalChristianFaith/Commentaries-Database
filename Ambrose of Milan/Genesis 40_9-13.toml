[[commentary]]
quote='''
And the overseer of the wine told his dream: There was a vine before me, and on the vine three roots, and it was blossoming, bearing shoots, and the clusters of grapes were ripe, and Pharaoh's cup was in my hand. And I took it and pressed it into the cup and gave the cup into Pharaoh's hands. And Joseph said to him: The three roots are three days. Yet three days, and Pharaoh will bear in mind your chief office and will restore you to your former office, and you will give the cup into Pharaoh's hands. But be mindful through your own self, when it is well with you, and you will show mercy to me and you will be mindful of me before Pharaoh and you will bring me out of this prison, for I was stolen away by theft from the land of the Hebrews, and here I have done nothing evil, but they sent me into the pit of this prison.

The other's dream I do not care to tell. You surely remember my words, that even then I shrank from interpreting it in the case of one whose end I shrink from, whose death I dread. Let us speak first of the one who seemed to himself happy because he was overseer of the wine, and who believed it the highest summit of all power that he gave the king his cup. This was his glory, this his magnificence in this world: deprived of it, he grieved; restored to it, he rejoiced. But this is a dream, and all the power of the world is a dream, not the truth. Indeed, it was through a dream that he saw his chief office restored to him. And Isaiah says that men of this kind, who in this world delight in prosperity, are just so. As one who eats and drinks in his sleep seems to himself, while he sleeps, to be filled with food or drink, but when he wakes begins to hunger the more — then he understands how empty was that food and drink of the dreamer — so he who sleeps in this world and does not open his eyes to the divine mysteries, as long as he is weighed down by the sleep of the body, thinks this worldly power to be of some moment — he sees it as though in sleep —; when he wakes, he discovers how empty is the pleasure of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
