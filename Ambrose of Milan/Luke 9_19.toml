[[commentary]]
quote='''
But it is no trifling opinion of the multitude which the disciples mention, when it is added, But they answering said, John the Baptist, (whom they knew to be beheaded;) but some say, Elias, (whom they thought would come,) but others say that one of the old Prophets is risen again. But to make this enquiry belongs to a different kind of wisdom from ours, for if it were enough for the Apostle Paul to know nothing but Christ Jesus, and Him crucified, what more can I desire to know than Christ? (1 Cor. 2:2.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It matters, however, what is meant by the fact that the crowd supposed him to be no other than either Elijah or Jeremiah or John the Baptist. Elijah perhaps, because he was caught up to heaven. But Christ is not Elijah. The one is caught up, this one returns; this one did not think it robbery to be equal with God; the one is avenged by fires called down, this one chose to heal his persecutors rather than destroy them. But why did they think him Jeremiah? Perhaps because he was sanctified in the womb. But this is not Jeremiah. The one is sanctified, this one sanctifies; the sanctification of the one began from the body, this one is holy from the Holy. Why, too, does the people think him John, unless perhaps because, placed in his mother's womb, John perceived the presence of the Lord? But this is not John. The one worshipped in the womb, this one was worshipped; the one baptized in water, Christ in the Spirit; the one urged repentance, this one forgave sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
