[[commentary]]
quote='''
Lastly he opens a heavenly mystery, that it pleased God to reveal his grace to little ones rather than to the wise of this world; which the apostle Paul has set out with a fuller pen, saying: has not God made foolish the wisdom of this world? For since, in the wisdom of God, this world did not know God through wisdom, it pleased God through the foolishness of preaching to save those who believe.

Let us take, then, the little one to be him who does not know how to exalt himself and to vaunt the art of his own wisdom with decked-out words, as most philosophers do. He was a little one who said: Lord, I did not exalt my heart, nor were my eyes lifted up, nor did I walk in great things nor in wonderful things above me. And that you might know that this one was little not in age, not in understanding, but by his humility and a certain turning away from boasting, he added: but I exalted my soul. Do you see how lofty this little one was, on how high a summit of the virtues? Such little ones the Apostle wishes us to be, when he says: if anyone among you seems to be wise in this world, let him become a fool, that he may be wise; for the wisdom of this world is foolishness with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
