[[commentary]]
quote='''
He leaps from heaven into the Virgin, from the womb into the manger, from the Jordan to the cross, from the cross into the tomb, into heaven from the sepulchre. Prove to me, David, that he leaps, prove that he runs; for you said: He has exulted as a giant to run the way, his going forth is from the highest heaven; and his meeting reaches to its highest point, nor is there anyone who hides himself from his heat (Ps. 18 (19):6 and 7). And now he leaps, and now he runs, from the heart of the Father upon his saints, from the East upon the West, from the North upon the South. He it is who ascends above the setting sun, he above the heavens of heavens to the East, he ascends upon the mountains, he upon the hills.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
