[[commentary]]
quote='''
But to us Christ has given a cloak, with which he himself clothed his apostles and his body; which indeed he bids you give, so that, if anyone asks your tunic of you, you let him have your cloak also (Matt. 5:40): that is, that you hand over the badge of your philosophy, and clothe round, as with the garment of your prudence, him who before was naked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
