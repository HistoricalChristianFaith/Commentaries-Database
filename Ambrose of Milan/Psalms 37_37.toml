[[commentary]]
quote='''
Keep innocence and behold equity. He who keeps innocence beholds equity, since he who is clean sees God, whose rod is upright and whose righteousness is upright, so that he turns away from those who have turned aside to the pursuits of perversity. Good is the innocence which sees God. Thus others have put: Keep perfection; for he is perfect who does not know malice nor is acquainted with guile. Therefore, he says, keep perfection, for there are remnants for the peaceable man. The remnants of a man are spoken of from the body of one who has died, from his cast-off remains. They are called remnants because they are seen to survive after a man's death; for those things survive which are kept for the resurrection. For this corruptible must put on incorruption, and this mortal put on immortality. Rather, then, the remnants for a man are the hope of resurrection and the faith of conversion and the grace of love, since the ungodly do not rise again unto judgement, but the life of the righteous is known to God and is approved by the judgement of the Lord. To this place that saying beautifully fits: The remnants according to the election of grace have been saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
