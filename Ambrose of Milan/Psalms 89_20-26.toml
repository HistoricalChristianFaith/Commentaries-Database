[[commentary]]
quote='''
And yet he is signified not only by interpretation but also by an open appellation, for it is written: I have found David my servant, with my holy oil I have anointed him, and below: He shall say to me: You are my father, and: I will say to him: You are my son. So we have found the David whom we were seeking: a servant indeed in appearance, but Lord in truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 7"
