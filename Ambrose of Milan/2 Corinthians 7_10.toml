[[commentary]]
quote='''
Many, in fact, because of their manifold iniquities have no awareness of sin. But he who says: I chastise my body and bring it into subjection, feels sadness because of regret for the sins to which we are subject. He himself did not have such serious faults for which he ought to feel sorrow. Hence he teaches us that that kind of sorrow is of value which has, not this world, but God, as its end. It is right, he says, that you become sorrowful, so as to feel repentance in the face of God: For the sorrow that is according to God produces salvation, whereas the sorrow that is according to the world produces death.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
