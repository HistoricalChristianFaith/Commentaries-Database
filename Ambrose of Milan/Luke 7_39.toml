[[commentary]]
quote='''
See the economy: in the house of the Pharisee the sinful woman is glorified; in the house of the Law and the prophet it is not the Pharisee but the Church that is justified; for the Pharisee did not believe, she believed. Indeed, he said: if he were a prophet, he would surely know who and what sort of woman this is who touches him. Now the house of the Law is Judaea, which is written not on stones but on the tablets of the heart. In this the Church is justified, being now greater than the Law; for the Law does not know the remission of sins, the Law does not have the mystery by which hidden things are cleansed; and therefore what is lacking in the Law is completed in the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
