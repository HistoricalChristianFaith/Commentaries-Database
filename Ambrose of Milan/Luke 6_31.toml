[[commentary]]
quote='''
And lest the Lord should seem to destroy the Law, he keeps requital in benefits, which he disregards in injuries. But yet, by saying: As you wish that men should do to you, do likewise to them, the requital itself is more abundant, when the deed is made equal to the wishes. For virtue knows no measure in gratitude, and, not content to return what it has received, it wishes to heap up what it has taken, lest it be inferior in the benefit, though it be equal in the duty. For benefits are weighed not only by their heap but by order and time, since in an equal benefit he is first who began first; for he is the benefactor who began the kindness, he the debtor who returned it. So the precedence of a benefit is a further benefit; for if someone has returned money, he has not discharged the gratitude, and he remains a debtor of gratitude, even if he is no longer a debtor of the money. Why should we think that gratitude can be emptied by returning it, when its return is a testimony of gratitude received rather than of gratitude paid off?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
