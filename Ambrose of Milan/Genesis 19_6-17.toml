[[commentary]]
quote='''
Let us flee as Lot did, fearing the crimes of Sodom more than its punishments. For more devout, surely, is he who fled the contagion of crimes, who shut his house to the Sodomites, and, while dwelling among them, did not know those whose shameful deeds he was ignorant of and whose disgraces he turned away from, and in his flight did not look back at those whose way of life he did not desire. He then flees as Lot did who renounces vices, who disowns the customs of the inhabitants, who does not look back behind him, who enters that higher city by the entrance of his thoughts and does not withdraw from it until the prince of priests dies, who took away the sin of the world. He died indeed once, but he dies for each one who is baptized into the death of Christ, that we may be buried together with him and rise again with him and walk in the newness of his life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"
