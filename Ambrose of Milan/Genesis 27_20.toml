[[commentary]]
quote='''
Nor was Jacob less quick to find than to carry out; when his mother had told him to bring food in to his father, we see that kinds of definition were at his command. For he both found quickly and testified that God was the author of what he had found, in which are signified both the palm of diligence and the richness of natural talent. The first definition, then, lies in discovery. What is found is sought, and what is sought belongs to time, and what belongs to time surely belongs to diligence. But what anticipates the use of time, God pours in, God gives; and what God gives belongs to nature, not to diligence. Natural talent, therefore, is of divine gift, and what is of divine gift is of nature. Natural talent, then, belongs to nature, discovery to diligence: the former is without time, the latter needs time. And so the former is at hand at the moment, the latter is searched out over a space of time; the former is referred to what is above us, the latter to us.

So when his father sought the food of the word — for man does not live by bread alone, but by every word of God; such food Isaac sought, such food Peter hungered for when he saw the mysteries of the Gentile people who were to believe — Esau did not have at hand the food of a spiritual and swifter talent. While he hunts and seeks and prepares to offer a very hard and rustic discourse, Jacob anticipates him with a swift discovery and with a gentle and almost homely answer, serving a sweet word with which to soothe and delight him. Hence his father, in wonder, says: What is this, that you have found so quickly, my son? Jacob answered: What the Lord your God delivered into my hands. The first definition is in the question, the second in the answer. So the father, finding complete everything that belonged either to natural talent or to diligence, concluded with the consummation of a definition, saying: Behold, the smell of my son is as the smell of a full field, which the Lord has blessed. For a field has both the natural talent of fertility and the temporal diligence of cultivation, and rightly is there fullness in that which lacks neither. At the same time, since he added which the Lord has blessed, he seems to have preferred the grace of nature to the labour of cultivation. And Esau confirmed it, saying: Rightly was his name called Jacob; for he has supplanted me now twice and has taken my birthright.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
