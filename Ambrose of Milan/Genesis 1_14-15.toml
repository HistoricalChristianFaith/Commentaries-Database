[[commentary]]
quote='''
To prevent deterioration of wine it is customary for those who gather in the vintage to first clean the vessels before the wine is poured in. For of what avail is it ‘to plant the vine in rows,’ to loosen the earth each year or to make furrows with a plough, to prune or to tie back the shoots and join them in marriage, as it were, to the elms, if after such toil the wine stored away in the vessels becomes sour? In like manner, if a person desires to behold the sun rising in the morning, he proceeds to cleanse his eyes, lest there be within any speck of dust or dirt which would dull the observer’s eyesight or prevent any misty darkness from obscuring the vision of the spectator.

In our reading of the Scripture passage, the sun, which before this did not exist, has now to arise. We have now passed the first day without a sun, and the second and the third days we have completed still without a sun. On the fourth day God bade the luminaries of the heavens to be created: the sun, the moon and stars. The sun begins to arise. Cleanse, now, the eyes of your mind and the inward gaze of your soul, lest any mote of sin dull the keenness of your mind and disturb the aspect of your pure heart. Cleanse your ear, in order that you may receive the clear flow of holy Scripture in a clean receptacle, so that no impurity may enter therein. With its great splendor the sun precedes the day, filling the world with its great light, encompassing it with warm exhalations.

Be on your guard against stressing merely the magnitude of the sun. Its excessive brilliance may blind the eyes of your mind, as happens in the case of one who directs his sight directly at its beams. Because of the deflection of light, such a person is suddenly bereft of his sight and, if he does not turn his face and eyes in another direction, he is led to believe that nothing is visible and that he is deprived of his powers of vision. However, if he turns his eyes aside, their functional operation remains unimpaired.

See, therefore that the rays of the rising sun do not trouble your sight. For that reason, look first upon the firmament of heaven which was made before the sun; look first upon the earth which began to be visible and was already formed before the sun put in its appearance; look at the plants of the earth which preceded in time the light of the sun. The bramble preceded the sun; the blade of grass is older than the moon. Therefore, do not believe that object to be a god to which the gifts of God are seen to be preferred. Three days have passed. No one, meanwhile, has looked for the sun, yet the brilliance of light has been in evidence everywhere. For the day, too, has its light which is itself the precursor of the sun.

Do not, therefore, without due consideration put your trust in the sun. It is true that it is the eye of the world, the joy of the day, the beauty of the heavens, the charm of nature and the most conspicuous object in creation. When you behold it, reflect on its Author. When you admire it, give praise to its Creator.

If the sun as consort of and participant in nature is so pleasing, how much goodness is there to be found in that ‘Sun of Justice’? If the sun is so swift that in its rapid course by day and night it is able to traverse all things, how great is He who is always and everywhere and fills all things with His majesty! If that which is bidden to come forth is deemed worthy of our admiration, how much more does He surpass our admiration of whom we read: ‘Who commandeth the sun and it riseth not’! If the sun which the succession of the seasons advances or recedes is mighty, how mighty must He be, also, who, ‘when he emptied himself’ that we might be able to see Him who ‘was the true light that enlightens every man who comes into this world’! If the sun which from the interposition of the earth often undergoes eclipses is an extraordinary object, how surpassing is the majesty of Him who says: ‘Yet one little while and I will move the heaven and the earth’! The former is hidden by the earth, which in its turn cannot sustain the influence of the Lord except when it is supported by the reality of His will. If the blind suffer loss by being deprived of beholding the beauty of the sun, how great is the loss of the sinner who, despoiled of the gift of the true light, is subject to the darkness of night eternal!

When, therefore, you see the sun, take note, too, of the green earth which was formed before it; take note of the green herb which holds priority in rank; take note of the woods which nod their approval, because they came into being before the light of heaven. Do you think for a moment that the herb is greater than the sun or that the woods hold a position of preference? Far be it from us to prefer things that have no feeling to Him who is the provider of such a spectacle! What else, therefore, does ‘the depth of the wisdom and the knowledge of God’ have in view when the woods came into being before these two luminaries of the world (those eyes, as it were, of the celestial firmament), unless it is that all might recognize by the testimony of holy Scripture that without the aid of the sun the earth can be productive? The earth which could cause the first seeds of things to germinate without the aid of the sun can surely nourish the seeds provided for it and can, without the heat of the sun, bring forth offspring by its own fostering care.

With the voice, so to speak, of her gifts does Nature cry out: Good, indeed, is the sun, but good only in respect of service, not of command; good, too, as one who assists at my fecundity, not as one who creates; good, also, as the nourisher of my fruits, not as one who is the author of them. At times the sun burns up my produce and often is the cause of injury to me, leaving me in many places without provision. I am not ungrateful to my fellow servant, one who is granted to me for my use, subject like me to toil, to vanity, and to the service of corruption! With me he groans, with me he is in travail, in order that there may come the adoption of sons and the redemption of the human race by which we, too, may be freed from servitude. By my side he praises the Author; along with me he sings a hymn to the Lord God. Where his beauty is most pronounced, there I have common cause with him. Where the sun blesses, there the earth blesses, also; with me share their blessings the fruit-bearing trees, the flocks and birds. At sea the sailor reproaches the sun and longs for me. In the hills the shepherd shuns him and hastens to my foliage, to my trees, under whose shadow he may find comfort in the heat, and hastens to my springs when he is thirsty and fatigued.

But in case the evidence presented to your eyes may appear to be scanty, cleanse your ear and apply it to the heavenly oracles: ‘On the word of two or three witnesses every word is confirmed.’ Hear God speaking: ‘Let there be lights made in the firmament of heaven to give light upon the earth.’

Who says this? God says it. And to whom is He speaking, if not to His Son? Therefore, God the Father says: ‘Let the Sun be made,’ and the Son made the sun, for it was fitting that the ‘Sun of Justice’ should make the sun of the world. He, therefore, brought it to light. He illuminated it and granted it the power of light. Therefore the sun was made; for this reason it is also a subject, since it has been said: ‘Thou hast foundeth the earth and it continueth. By thy ordinance the day goeth on: for all things serve thee.’ In truth, since day serves, wherefore does not the sun which was made in the presence of the day also serve? Wherefore do not they serve, too, the moon and the stars which were made in the power of the night? Surely the greater the beauty which the Creator has granted to them—as, for instance, an unusual brightness is bestowed on the air by the brilliance of the sun, the day has a serener light, and the darkness of night is illuminated by the flashing rays of the sun and stars, the sky twinkles with its ignited lamps as if crowned with flowers, reminding one of a paradise in bloom, resplendent with living garlands of sweet-smelling roses—the greater the beauty, then, which seems to have been granted to these, the greater is the debt they owe: ‘To whom much is given, much is required.’ And so the sun has been well called by many the adornment of the sky, the precious jewels of which are the stars.

Furthermore, that we may know that the fertility of the earth is not to be ascribed to the heat of the sun, but should be assigned to the goodness of God, the Prophet says: ‘They all look to you to give them food in due time. When you give it to them, they gather it; when you open your hand, they are filled with good things.’ And further on: ‘When you send forth your spirit, they are created and you renew the face of the earth.’ And in the Gospels: ‘Look at the birds of the sky: they do not sow or reap; yet your heavenly Father feeds them.’ The sun and moon are not, therefore, authors of fecundity, but God the Father through the Lord Jesus bestows on all things the gift of freedom of fertility.
'''
