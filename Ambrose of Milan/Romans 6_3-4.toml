[[commentary]]
quote='''
He then flees as Lot did who renounces vices, who disowns the customs of the inhabitants, who does not look back behind him, who enters that higher city by the entrance of his thoughts and does not withdraw from it until the prince of priests dies, who took away the sin of the world. He died indeed once, but he dies for each one who is baptized into the death of Christ, that we may be buried together with him and rise again with him and walk in the newness of his life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"
