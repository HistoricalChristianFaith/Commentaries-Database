[[commentary]]
quote='''
Not idle is the number, not idle the order, not idle the leftovers of those who ate. For why are the more, that is, five thousand, satisfied with five loaves, that is, with a smaller number, while the fewer, who are four thousand, are fed with seven loaves, that is, with a more abundant number? For if we follow only the miracle of the deed, that seems more divine which from a smaller measure abounded for more people. Why, then, was what is less added to what is more, as though it surpassed it? For we read that first five thousand were satisfied with five loaves, and afterwards four thousand also with seven loaves. Let us therefore seek the mystery, which surpasses the miracle.

And so those five thousand, as the five senses of the body, seem to have received from Christ nourishment still nearest to bodily things; but the four thousand, although they are still in the body and in this world, which consists of four elements, are yet not idly said to have received the food of mystical rest; for they are now on a par with the world, being destined to be above the world. For though they are in this world, yet those to whom the nourishment of mystical rest is imparted are not within the world; for in six days the world was made, on the seventh day there was rest, and the Lord sanctified it. Beyond the world, then, is rest; beyond the world also is the fruit of rest. Indeed, blessed are the peacemakers; for they shall be called children of God. For since God is above the world, surely no one can see God unless he first transcends the world with spiritual gaze. And so the seventh blessing is that of the peaceable; seven baskets of fragments, too, remain over for those four thousand. No ordinary bread is this bread of the sabbaths, bread sanctified, bread of rest. And perhaps, if you have first eaten the five loaves with the senses, I will dare to say it too: after the five loaves and the seven, the third time you will not eat bread on earth, but above the earth you will eat eight loaves, like those who are in the heavenly places; for as the seven loaves are loaves of rest, so the eight loaves are loaves of the resurrection. So these who are fed with seven loaves persevered for three days, and perhaps attained an entire faith and constancy in the resurrection to come. Indeed, it is the voice of the saints: we will walk three days, that we may feast to the Lord our God. But those things in their place.

But concerning the five loaves Saint John taught me what I did not know, what Saint Matthew had not taught, what Saint Luke had not taught — for a different grace was imparted to each one — he taught me, I say, that these five loaves were of barley. And therefore we said not unfittingly that this food is suited to those who are of the body. For why barley first? Because he who comes to faith must be nourished first with milk, then with solid food; for we were not yet able, and perhaps many of us are not able even now. For since there are contentions and dissensions among us, are we not carnal and walking according to man? Each food is suited to its own strengths; and therefore first barley, then wheat is given us for nourishment, while to the stronger, as to Elijah, bread of meal from the inner part of the grain is supplied. But whom can sinners not defile, but only feed?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
