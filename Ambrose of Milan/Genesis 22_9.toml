[[commentary]]
quote='''
Abraham came to the place predestined for the sacrifice and built there an altar and laid on the wood. What great efforts on the part of one about to sacrifice, lest he be thought to have been swept suddenly into sacrificing! And having bound the hands and feet of Isaac his son, he laid him on the altar upon the wood. The father binds his son with bonds with his own hands, lest the son, in shrinking back and startled by the force of the fire, should incur sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
