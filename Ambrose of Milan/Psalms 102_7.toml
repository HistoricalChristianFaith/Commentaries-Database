[[commentary]]
quote='''
Now it is not doubtful that the soul is compared to a sparrow, since you read: our soul has been rescued like a sparrow from the snare of the hunters. And elsewhere: how do you say to my soul: move to the mountains like a sparrow? We read also that man himself is compared to a sparrow, for it is written: but I am like a solitary sparrow in the building, that is, formed out of two sparrows into one sparrow, that is, into the fineness of a spiritual substance, by the joining of both wings in concord. So the sparrow is good to whom nature supplies the power of flight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
