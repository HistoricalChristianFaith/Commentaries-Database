[[commentary]]
quote='''
Pray, therefore, rich men! You have not in your works what is pleasing. Pray for your sins and your heinous offenses, and return gifts to the Lord your God. Return them in the poor man, render them in the needy, lend them in the destitute, whom otherwise you cannot placate because of your crimes. Whom you fear as an Avenger, make your Debtor. I will not take calves out of thy house, He says, nor he-goats out of thy flocks, for all the beasts of the woods are mine. "Whatever you offer," He says, "is mine, because the whole world is mine. I do not demand the things that are mine; but rather the zeal of devotion and faith which you can offer from yourselves. I do not delight in ostentation in sacrifices; only, O man: Offer to God the sacrifice of praise, and pay thy vows to the Most High."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 16"
