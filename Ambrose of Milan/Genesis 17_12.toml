[[commentary]]
quote='''
Now the Law orders that the boy be circumcised on the eighth day, certainly by a mystical precept, because that is the day of the resurrection; for on the Lord's day the Lord Jesus rose again. So if the day of resurrection finds us circumcised and stripped of the superfluities of sins, washed from all filth, clean of bodily vices: if you go forth from here clean, you will rise again clean. Circumcise yourself, then, not in the flesh but from carnal vice, and circumcise not only your home-born servant but also the one bought with a price. If you refer it to particulars, the home-born servants are the natural motions; those bought with a price are those acquired by reason and teaching. Both these and those, like young shrubs, need cleansing and the cutting back of their luxuriance, so that they may not straggle like barren shoots and the useless overshadow the fruitful; or, as a vine overloaded with every fault labours in vain, so we must beware lest our mind too, taken up with many things, not only fail to bring forth good offspring but also degenerate into a great many useless ones; and at the same time that, like a pruned vine, it may not easily run wild nor quickly fall apart, but be preserved for posterity. For the gifted, too, bring forth many things which it is useful to circumcise, and those who have attained learning by diligence ought to see their ignorance in themselves. But the meaning of the mystery is clear. For the home-born servants are the Jews; those bought with a price are the Gentiles who have believed, because the Church was redeemed at the price of the blood of Christ. So both Jew and Greek, whoever has believed, ought to know how to circumcise himself from sins, so that he may be saved. Let both the member of the household and the foreigner, both the just man and the sinner, be circumcised by the remission of sins, so that sin may work no longer, because no one ascends into the kingdom of heaven except through the sacrament of baptism. Nor will the justice of an earlier time profit, if at the end of life one has abandoned justice. Therefore Paul says: You were bought with a price; do not become servants of men. For these are contraries, because servitude is contracted through sin, and sin is remitted through a price.

We think, then, that these things are abundantly enough for understanding by a simple exposition. And therefore we do not discuss with empty care the cubes of geometry, nor the square number of philosophy, nor the Pythagorean confession, as they say, nor the numbers of the hebdomad, which they call ever-virgin; nor do we shape the world with the geometer's rod, nor seek heaven in the dust, nor enclose the globe within narrow abacuses; but we open the true mysteries, that the one salvation is the resurrection of Christ. Let us then be planted together in the likeness of his death, so that we may merit fellowship in the resurrection. And let our old man be nailed together to the cross, so that the body of sin may be destroyed.

Excellently, moreover, the Law orders that males be circumcised in the first wailings of infancy, even the home-born servants, because just as sin is from infancy, so circumcision is from infancy. No time ought to be empty of protection, because none is empty of fault. Even the infant must be called back from sin, lest he be polluted by the contagion of idolatry, and lest he grow used to adoring an idol and kissing an image, violating the parent's nest, wounding devotion. At the same time, lest anyone be puffed up because he seems to himself just, Abraham is ordered to be circumcised in the course of a riper age. So neither the old proselyte nor the infant home-born servant is excepted, because every age is liable to sin, and therefore every age is fit for the sacrament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
