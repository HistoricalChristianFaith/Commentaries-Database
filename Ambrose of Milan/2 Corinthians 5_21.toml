[[commentary]]
quote='''
For God himself, the Word, in his flesh, was not a rational and intelligent soul, but a rational and intelligent soul, and the same human, and of the same substance as our souls, and a flesh similar to our own, and of the same substance as our flesh. The Word of God, assuming this, was also a perfect man, without any stain of sin; for he himself did not sin, but was made sin for us, so that we might become the righteousness of God in him. Therefore, the flesh is of the same essence as the soul, and our soul and flesh are of the same substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Sacrament%2520of%2520the%2520Incarnation%2520of%2520the%2520Lord.html'
source_title="On the Sacrament of the Incarnation of the Lord, Chapter 7"


[[commentary]]
quote='''
But if you hold to the letter, as you think, from what is written, that the Word was made flesh, that the Word of God was made flesh; do you deny that it is written about the Lord, that he did not commit sin, but became sin? Therefore, the Lord was not turned into sin? Not so; but because he took on our sins, he was called sin. For the Lord was also called cursed, not because the Lord was turned into a curse, but because he himself took on our curse: Cursed is he who hangs on a tree. Therefore, you marvel because it is written: The Word was made flesh, when flesh was assumed by the Word of God; for when it is written that he was made sin, it means that he was made sin in the likeness of sinful flesh, not in nature or operation of sin, but in order to crucify our sin in his own flesh, he assumed the reception of the weaknesses of our guilty body, which is carnal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Sacrament%2520of%2520the%2520Incarnation%2520of%2520the%2520Lord.html'
source_title="On the Sacrament of the Incarnation of the Lord, Chapter 6"

[[commentary]]
quote='''
Unless perhaps it should seem to someone a slight cause that so great a prophet should err for the sake of our correction, when for the redemption of all Christ took upon himself our infirmities, he who was made sin for us, though he knew not sin. And is it thought unworthy and not believed likely that David should have fallen into the reproach of one fall for the profit of posterity, when the Lord himself was made a reproach for us, as he himself says: But I am a worm and no man, a reproach of men and the outcast of the people, and elsewhere: And the reproaches of those who reproached fell upon me? Therefore he sent on before, in his own, the mystery of the dispensation to come; and the little servants indeed bore the sins of their own condition, and therefore they could not themselves be free of sin, but the Lord took up a burden not his own, and therefore he alone was without any share in transgressions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"
