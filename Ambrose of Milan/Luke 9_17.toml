[[commentary]]
quote='''
It is clear that the multitude were filled not by a scanty meal, but by a constant and increasing supply of food. You might see in an incomprehensible manner amid the hands of those who distributed, the particles multiplying which they broke not; the fragments too, untouched by the fingers of the breakers, spontaneously mounting up.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Not without meaning are the fragments which remained over and above what the multitudes had eaten, collected by the disciples, since those things which are divine you may more easily find among the elect than among the people. Blessed is he who can collect those which remain over and above even to the learned. But for what reason did Christ fill twelve baskets, except that He might solve that word concerning the Jewish people, His hands served in the basket? (Ps. 81:6.) that is, the people who before collected mud for the pots, now through the cross of Christ gather up the nourishment of the heavenly life. Nor is this the office of few, but all. For by the twelve baskets, as if of each of the tribes, the foundation of the faith is spread abroad.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But why is there more left over for the five thousand men, less for the four thousand? Because those four thousand were three days with Christ, and therefore received more of the heavenly fodder.

And not idly are the things left over from the crowds gathered by the disciples, because the things that are divine you can find more easily among the chosen than among the peoples. Would that it might be my lot to hear: gather what is left over! If I hear and do it, I shall have many things which the crowds, I shall have many things which the children and the women could not eat. Blessed is he who can gather what is left over even by the learned.

Let us see how one gathers. The Law said: you shall not commit adultery. Christ broke this bread, divided this word, not adding from elsewhere, but sharing out from what was his own. He who has looked he says at a woman to lust after her has already committed adultery with her. You have a fragment from his own. He added: if your right eye causes you to stumble, pluck it out. You have another: and if your right hand causes you to stumble, cut it off; and: he who marries a woman put away by her husband commits adultery. You see how many fragments from one. Moses says that Abraham had two sons, one by the bondwoman and one by the free woman. Paul said: these are the two testaments. He divided this word and found a mystery. Blessed, then, is he who gathers what Christ divides.

For what reason did Christ fill twelve baskets, unless to undo that word about the Jewish people, that his hands served in the basket, that is, the people who formerly gathered clay in baskets now, through the cross of Christ, works the nourishment of heavenly life and heaps up the food of faith where before there was the filth of Gentile unbelief? Nor is this gift for a few, but for all. For through the twelve baskets there overflows, as it were, the strengthening of the faith of each tribe; for bread strengthens the heart of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
