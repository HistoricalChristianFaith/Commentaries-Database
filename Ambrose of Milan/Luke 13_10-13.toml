[[commentary]]
quote='''
And he was teaching in their synagogue on the sabbaths. And behold, a woman who had a spirit of infirmity for eighteen years and was bent over.

How quickly he showed what he was saying about the synagogue! He shows that he had come to that very tree, since he was preaching in it. Then in the infirm woman there follows a figure as of the Church, which, when it has fulfilled the measure of the Law and of the resurrection, raised up to the lofty summit in that perpetual rest, will not be able to feel the bending down of our infirmity. Nor could this woman have been cured otherwise than because she fulfilled the Law and grace, the Law in the commandments, grace in the washing, through which, dead to the world, we rise again to Christ; for in the ten words is the perfection of the Law, in the number eight is the fullness of the resurrection. The work of the sabbath, then, is a sign of the future, that each one who has fulfilled the Law and grace will through the mercy of Christ be stripped of the troubles of bodily frailty. And therefore sanctification was sent ahead earlier in a sign through Moses, that there might be a training for the future sanctification and for the spiritual observance of abstaining from worldly works. Indeed God too rested from the works of the world; not from works, for his operation is everlasting and unceasing, as the Son says: my Father works until now and I work, so that, after the likeness of God, our worldly works, not our religious ones, might cease.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
