[[commentary]]
quote='''
Indeed, when the angel asked her where she was going, she answered: From the face of Sarai my mistress I flee. And this too belongs to immoderate swelling, that she first spoke the name of Sarai and only afterwards indicated her as mistress. The one was put first as an insult, the other added to identify the person. The handmaid's insolence did not please the angel, and therefore the angel said to her: Return to your mistress. Surely it would not have escaped the angel if she had fled overcome by the violence of punishments, and he would rather have rebuked the cruelty of the one who beat her than the departure of the one who fled; but to show that she was fleeing as a proud woman, so as not to be subject to her mistress, he added: and humble yourself under her hands. I wish, therefore, that no one may fall into this vice; but if anyone has fallen into it, let him learn to humble his handmaid to his wife, lest, while he wishes to defend his handmaid, he shut out his wife.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
