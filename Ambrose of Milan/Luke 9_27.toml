[[commentary]]
quote='''
If then we also wish not to fear death, let us stand where Christ is. For they only cannot taste death who are able to stand with Christ, wherein we may consider from the nature of the very word, that they will not experience even the slightest perception of death, who are thought worthy to obtain union with Christ. At least let us suppose that the death of the body is tasted by touch, the life of the soul preserved by possession; for here not the death of the body, but of the soul, is denied.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But I say to you truly: there are some standing here who shall not taste death until they see the kingdom of God. Just as the Lord always raises us toward the future rewards of the virtues and teaches that contempt for the things of the world is profitable, so too he sustains the weakness of the human mind with a reward in things present. For it is hard to take up the cross and to offer one's life to dangers and one's body to death, to deny what you are when you would wish to be what you are not; and rarely does virtue, however lofty, exchange present things for future ones. For it seems difficult to men to buy hope with dangers and to purchase the gain of a future age with the loss of present things. Therefore the good and moral Master, lest anyone be broken by despair or weariness, since the allurement of sweet life soothes even a steadfast disposition, promises the faithful an unbroken continuance of living; for consolations grow cold under the fear of death, and a great love of life barely sets the blandishments of hope against the terror of the safety it has sought. You have nothing, then, to complain of, nothing to excuse yourself with: the Judge of all has given both a reward to virtue and a remedy to weakness, so that weakness may be sustained by things present, virtue by things to come. If you are strong, despise death; if you are weak, flee it. But no one can flee death unless he follows life. Your life is Christ; he is the very life that knows not how to die.

So if we wish not to fear death, let us stand where Christ is, so that he may say of us too: truly there are some standing here who shall not taste death. It is not enough to stand, unless one stands where Christ is; for they alone cannot taste death who are able to stand with Christ. Here one may weigh from the very nature of the word that those who are seen to have deserved the fellowship of Christ will not have even a slight sense of death. Certainly the death of the body is tasted by sipping, but the life of the soul is held by possessing.

But what is it to taste death? Can it be that, just as bread is life, so bread is also death? For there are those who eat the bread of sorrow; there are also the peoples of the Ethiopians, who have received the dragon for food. Far be it from us to devour the venom of the dragon; for we have the true bread, that bread which came down from heaven. He eats that bread who keeps the things that are written. There are, therefore, those who do not taste death until they see the kingdom of God. There are also those who do not see death, as it is written: who is the man who shall live and shall not see death?

But who is the man who does not die, since there can be no resurrection except of the dead? Although we have heard of no death of the body concerning Enoch and Elijah, and the Lord said of John the evangelist: if I will him to remain until I come, yet since we think that here it was not expressed of John alone, but that this was laid down generally of many, here it is not the death of the body but that of the soul that is denied. For there are those who live though dead, since there are those who are dead though living, like her who living is dead, as it is written: let death come upon them, and let them go down living into hell. If, then, anyone goes down living into hell — for by sin he goes down into hell, the dwelling of death — there are surely those for whom the course of living has not been broken off even in the death of the body, like Abraham, Isaac and Jacob, whom we learn by the authority of the divine sentence to be living, since, as he is the God of Abraham, Isaac and Jacob, he is certainly not the God of the dead but of the living.

So he speaks not of one but of very many; for neither did Peter die, against whom, according to the Lord's sentence, the gate of the underworld could not prevail, nor did James and John die, the sons of thunder, over whom, taken up for the use of heavenly glory, earthly things do not prevail but lie beneath them. Be you too, then, a Peter, devout, faithful, peaceable, so that you may open the gates of the Church and escape the gates of death. Be a son of thunder. You say: how can I be a son of thunder? You can be, if you recline not on the earth but on the breast of Christ. You can be a son of thunder, if earthly things do not move you, but you rather shake the things that are earthly by the virtue of your mind. Let the earth tremble at you, not take you captive; let the flesh fear the power of your soul and, being shaken, be subdued. You will be a son of thunder if you are a son of the Church. Let Christ say to you too from the gibbet of the cross: behold your mother, let him say to the Church: behold your son; for then you will begin to be a son of the Church, when you see Christ victorious on the cross. For he who thinks the cross a stumbling block is a Jew, he is not a son of the Church; he who thinks the cross foolishness is a Greek. But he is a son of the Church who thinks the cross a triumph, if he recognizes the voice of Christ triumphant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
