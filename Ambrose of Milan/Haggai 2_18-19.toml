[[commentary]]
quote='''
For he remembered that the Lord spoke through Haggai, that on the twenty-fourth of the ninth month, from the day on which the temple of the Lord Almighty was founded, the vine he says and the figs and the pomegranates and the olive trees, which will not bear fruit, from this day I will bless. By this it is revealed that just at the setting of the declining year, that is, at the sunset of an age already growing old, the holy temple of God, which is the Church, was to be founded, by whose grace, through the sanctification of the washing, the peoples of the Jews and of the nations can have the fruit of their merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
