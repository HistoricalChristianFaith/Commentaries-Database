[[commentary]]
quote='''
So he took up our sins in order to carry them; he took them up also in order to cleanse them. Then it is written: And he himself cleansed their sins. Therefore he himself shall possess many as an inheritance and shall divide the spoils of the strong. For there the triumph is greater where the inner mind is cleansed. What he carries, then, belongs to remission; what he cleanses, to correction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
