[[commentary]]
quote='''
Paul too fled, so as to get away, let down through the window in a basket — for he knew that a threefold cord of broom cannot be broken — but he fled so that he might preach the Gospel of the Lord in the whole world, and therefore he was caught up into paradise. Let us too flee through the window, hearing the precepts of the Lord and keeping them with sober sight and chastity of the eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"
