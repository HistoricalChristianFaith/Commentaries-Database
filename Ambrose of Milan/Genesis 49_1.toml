[[commentary]]
quote='''
When this blessing had been performed, he called his sons as well. And he who earlier had preferred the younger to the elder began with the first, so that in the one case he might give precedence to the grace of the mystery, and in this keep the order of age; at the same time because earlier, in the two, he had blessed them all, with all their posterity and the offspring of those to come, lest either a repeated blessing of the people should seem superfluous or the former should be judged weak. And rightly he says that what he confers this second time is an announcement of the things that were to come to pass in later times rather than a blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 2"
