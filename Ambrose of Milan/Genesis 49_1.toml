[[commentary]]
quote='''
When this blessing had been performed, he called his sons as well. And he who earlier had preferred the younger to the elder began with the first, so that in the one case he might give precedence to the grace of the mystery, and in this keep the order of age; at the same time because earlier, in the two, he had blessed them all, with all their posterity and the offspring of those to come, lest either a repeated blessing of the people should seem superfluous or the former should be judged weak. And rightly he says that what he confers this second time is an announcement of the things that were to come to pass in later times rather than a blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 2"

[[commentary]]
quote='''
He, hindered in the service of his eyes, he, with the strength of his body worn out, leaving his body on his bed as in a tomb, rose up within himself, and, gathering himself far from others and within himself, had withdrawn himself from present things and was mingling with the future age of the last days. For so it is written: I will announce he says to you the things that will befall you in the last days.

What, then, was lacking to him, to whom God was present, who had said to him as he was about to set out: I will go down with you into Egypt, and I will lead you forever? Nor was God absent when the Holy Spirit spoke in him. Who is so powerful in his own dwelling as this man in another's? Who so abounding in plenty as this man in famine? Who so strong in youth as this man in old age? Who so active in business as this man in leisure? Who so swift on the racecourse as this man on his couch? Who so glad in the flower of youth as this man on the border of death? Who so rich in a kingdom as this man in a foreign place? Indeed, he blessed kings. And not without reason was he not poor, who lacked nothing. He was not poor who did not think himself poor. And who would call him poor of whose way of life the whole world was not worthy, and whose way of life was therefore in heaven?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
