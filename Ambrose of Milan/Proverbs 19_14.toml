[[commentary]]
quote='''
But there meets us what Solomon says: Fathers divide house and substance among their sons, but a wife will be prepared for a man by God. He who reads it in Greek does not think it contrary. For the Greek well said ἁρμόζεται [is fitted together]; for 'armonia' [harmony] is the name given to the fitting and apt joining of all things put together. It is harmony when the pipes of an organ, joined in order, keep the grace of a regular melody, and the apt order of the strings preserves concord. So a marriage does not have its harmony when a Gentile woman is unlawfully joined to a Christian husband. Therefore, where there is marriage, there is harmony; where there is harmony, God joins; where there is no harmony, there is strife and dissension, which is not from God, because God is love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
