[[commentary]]
quote='''
There follows: Why shall I fear in the evil day? The iniquity of my heel shall compass me about; that is: since my mouth speaks wisdom and the meditation of my heart prudence, what can I fear in the day of judgement, unless perhaps the iniquity of my heel must be washed away from me? Our iniquity is one thing, that of our heel another, in which Adam was wounded by the serpent's tooth and left the inheritance of the human succession liable to his wound, so that we all limp from that wound. Hence the Lord washed his disciples' feet, to wash away the serpent's poisons, and Peter is rebuked because he was excusing himself, so that the Lord should not wash his feet. And therefore it was said to him: Unless I wash your feet, you will have no part with me. On hearing this he offered not only his feet but also his hands to be washed. To him the Lord answered: He who has been washed has no need to wash again, except to wash his feet, but he is wholly clean.

Therefore David says: My iniquities have gone over my head, he who knew that he had been conceived in iniquity and brought forth by his mother in sins. But the Lord, who had no sins of his own and knew no iniquities of his own, says: The iniquity of my heel shall compass me about, that is, the iniquity of Adam, not my own. But it cannot be a terror to me; for in the day of judgement it is our own crimes in us that are punished, not those of another's iniquity. Hence I think that the iniquity of the heel is rather the slipperiness of offending than any guilt of our own offence. And rightly the Lord, who took up all things for us, says: Let us wash the feet too, so that we may take away the slipperiness of the heel, whereby there may be a sure standing of virtues and no one may slip through his father's error; he who is ready to stand by his purpose, let him not fear the slipperiness of the inheritance, he who desires to keep the footstep of virtue. The iniquity of our heel, then, is the transgression of Adam, through which he slid into contempt and neglect of the heavenly commandments.

The iniquity of the heel is also the detestable betrayal of Judas. "Of the heel" for this reason, because it is written: He who eats my bread has lifted up his heel against me. Well did he say "his" there and "my" here: his, because Christ is without iniquity, while this is the iniquity of the traitor alone; but Christ calls Judas "my" "heel" as being the last part of his body, Christ whose body and members we are. The apostles are the more excellent and active members of Christ, Judas the heel, as being the extreme part of the body, exposed to the serpent and open to a wound. The first heel, then, is Adam, the second heel Judas; the one is the fall of the whole inheritance, the other of the traitor alone, who could not entangle the inheritance, since we are no longer carnal but the inheritance of the Redeemer, as Scripture says: There is an inheritance for those who believe in the Lord.

There is also that iniquity of his heel which compassed Christ: Compassing, he says, they compassed me, and in the name of the Lord I have taken vengeance on them. His heel is the synagogue; the beauty and glory of his countenance is the Church, as it is written: The Lord has reigned, he has put on beauty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
