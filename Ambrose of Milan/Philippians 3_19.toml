[[commentary]]
quote='''
On your breast and on your belly shall you crawl, we read. Only those who live for the pleasures of the stomach can be said to walk on their bellies, whose god is their belly and their glory is their shame, who eat of what is earthy, and who, weighed down with food, are bent over towards what is of earth.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
