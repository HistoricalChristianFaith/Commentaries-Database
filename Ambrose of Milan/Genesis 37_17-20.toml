[[commentary]]
quote='''
And Joseph found his brothers in Dothan, which signifies 'failing'. For where is he who deserts God, if not in failing? Nor is it any wonder if those were failing who did not hear him who says: Come to me, all you who labour and are burdened, and I will refresh you. So Joseph came to Dothan, and they saw him beforehand coming from afar, before he drew near to them, and they raged to kill him. Rightly were they far off who were in failing, and they raged for this reason, that Christ had not drawn near to them. For if the type of Christ had drawn near to them, they would surely have loved their brother; but those could not be near who were plotting fratricide. Behold, it says, that dreamer is coming. Now therefore come, let us kill him. Were not these the words spoken by those who were plotting a fratricidal sacrilege, as Solomon says of them: Let us take away the just man, for he is useless to us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
