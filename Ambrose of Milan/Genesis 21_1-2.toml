[[commentary]]
quote='''
In treating of his father we have already set out sufficiently both the origin and the grace of holy Isaac. It redounds to his full glory that, born to so great and so inimitable a man, he was a reward to his father Abraham. Nor indeed is this to be wondered at, since in him a figure of the Lord's birth and passion went before: for a barren old woman bore him by the promise of God, that we might believe that God is able to bring it about that even a virgin can give birth; and he was offered, an only son, to be sacrificed, one who would both not be lost to his father and would fulfil the sacrifice. And so by his very name he signifies the figure and the grace; for Isaac means in Latin laughter, and laughter is the sign of joy. And who does not know that he is the joy of all, who, with the dread of fearful death either crushed or its grief removed, has been made for all the forgiveness of sins? So the one was named and the other was signified; the one was portrayed and the other was announced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 1"
