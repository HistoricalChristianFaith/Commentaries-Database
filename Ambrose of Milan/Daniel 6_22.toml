[[commentary]]
quote='''
Daniel, a man of desires, by a fast of three weeks indeed taught lions to fast. Being sent into the lions' den with his limbs hardened to the rigor of adamant through the firmness of abstinence, he was not susceptible to wounds. So had fastings compressed him that there was no place in his body for the teeth of wild beasts. The lions held their mouths closed; mouths which the sanctity of the prophet's abstinence restrained, so that, bound as it were, by the bonds of merit, the beasts could not open them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 7"
