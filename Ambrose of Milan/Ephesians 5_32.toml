[[commentary]]
quote='''
Whence Adam too said of the partner of his charity and co-heir of the grace of life: This now is bone of my bones and flesh of my flesh; which the Apostle interpreted, saying: This sacrament is great, but I speak in Christ and in the Church. And who would doubt that the sacrament of Christ and the Church is not carnal but spiritual, since every good man, even in marriage itself, is held not by the beauty of the flesh but by that of virtue, and loves in his wife her character, not her use?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
