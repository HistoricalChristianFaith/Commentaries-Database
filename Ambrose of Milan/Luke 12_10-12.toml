[[commentary]]
quote='''
And everyone who says a word against the Son of Man, it will be forgiven him, but whoever has spoken against the Holy Spirit, it will not be forgiven him. Surely by the Son of Man we understand Christ, who was begotten of the Holy Spirit and of a virgin, since his only parent on earth is a virgin. Is the Holy Spirit then greater than Christ, that those who sin against Christ obtain pardon, while those who offend against the Holy Spirit do not deserve to obtain remission? But where there is unity of power, there is no question of comparison nor dispute about greatness, since the Lord is great and there can be no end of his greatness. If then, as we believe, there is unity of the Trinity, the greatness is surely undivided, as the operation is undivided, which is shown in what follows; for while it has been said elsewhere: the Father gives you what you are to speak, here he has added:

for the Holy Spirit will teach you in that hour what you ought to say. So if the operation is one, the insult also is one. But let us return to our subject. Here it seems to some that we should understand the same Christ as both the Son of Man and the Holy Spirit, saving the distinction of persons and the unity of substance, since the one Christ, both God and man, is likewise Spirit, as it is written: a Spirit before our face is Christ the Lord, and likewise holy, because just as the Father is God and the Son is Lord, and the Father is Lord and the Son is God, so also the Father is holy and the Son is holy and the Spirit is holy. Indeed the cherubim and seraphim cry out with unwearied voices: Holy, holy, holy, so that the Trinity may be signified by the title repeated a third time. If then Christ is both, what is the difference, except that we should know that it is not lawful for us to deny the divinity of Christ? Indeed in persecution what is sought except that we deny that Christ is God? And so whoever does not confess God in Christ, and Christ from God and in God, does not deserve pardon. But also every spirit that does not confess that Christ has come in the flesh is not of God; for he who has denied the man has denied God, because Christ is God in man and man in God.

Most, however, hold this view, saying that the blasphemy is not pardonable if anyone says that Christ casts out demons by Beelzebub, not by divine power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
