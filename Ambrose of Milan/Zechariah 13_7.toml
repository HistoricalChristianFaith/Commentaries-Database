[[commentary]]
quote='''
And therefore he said: I will strike the shepherd, and the sheep of the flock will be scattered (Zech. 13:7), that the whole world might be filled with the flock of Christ, signifying that the Synagogue will be saved then, when she too has joined herself to this dispersion which has filled this world; for the tents of the shepherds are the kingdoms of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
