[[commentary]]
quote='''
Therefore she says the maidens have loved you. Draw us: let us run after the fragrance of your ointments. Good indeed is prudence, but sweet is mercy; for few attain the one, while the other reaches all. Because of this indulgence of yours, she says, souls renewed in spirit love you. Hence it is said also to the soul: your youth will be renewed like the eagle's; for he was speaking to the soul when he said: bless the Lord, O my soul. And therefore this soul too hastens to the Word and asks to be drawn, lest perhaps she be left behind, because the Word of God runs and is not bound. Indeed, he exults like a giant to run the way, and, because his going forth is from the highest heaven and his running back is to its highest point, seeing herself unequal to such great speed she says: draw us. Good is the soul which asks not for herself alone, but for all. Draw she says us. For we have the desire of following, which the grace of your ointments breathes into us; but because we cannot match your courses, draw us, so that, supported by your help, we may be able to tread in your footsteps. For if you draw us, we too shall run and shall catch the spiritual breezes of swiftness. For the burden is laid down by those to whom your hand is a support, and your oil is poured in, by which he was healed who had been wounded by robbers. And lest what she says, draw us, seem shameless to you, hear him saying: come to me, all you who labour and are burdened, and I will refresh you. You see that he draws us willingly, so that we may not be left behind as we follow. But let him who wishes to be drawn run, that he may lay hold; and let him run forgetting the things that are behind and reaching out to those that are before; for so he will be able to lay hold of Christ. Hence the Apostle too says: so run that you may all lay hold. She too who desires to lay hold wishes to reach the prize. Prudently, then, she asks to be drawn, because not all are able to follow. Indeed, to Peter when he said: where are you going? the Word of God answered: you cannot follow me now, but you will follow afterwards. He had entrusted to him the keys of the kingdom of heaven, and yet he judged him unequal to following him. This soul, however, he did not put off, because she was not presuming, but asking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
