[[commentary]]
quote='''
Suddenly, while he was consoling himself, coming back to himself he says: My soul is troubled within myself, that is: I who ought to strengthen others am myself troubled, and since I have no support from myself, let us take it from the Author.

Therefore he says I will remember you, O Lord, from the land of the Jordan and of Hermonin. He remembers from the land of the Jordan, in which grace heaps up the memory of devotion. Into the Jordan that Naaman the Syrian went down and was made clean of leprosy. In the Jordan Christ was baptized, when he instituted the form of the saving washing. The name Jordan signifies descent, the descent by which the Lord Jesus came down, who cleansed the neighbours of the river Jordan from the contagion of offences. This river goes out of Egypt and divides the land of promise. Therefore whoever is troubled, if he takes good counsel, goes out of Egypt and follows the way of light; for they have interpreted Hermonin as the way of the lamp. Go out of Egypt first, then, if you wish to see the light of Christ. The Canaanite woman went out from the borders of the Gentiles and found Christ, to whom she said: Have mercy on me, Son of David! Moses went out of Egypt and was made a prophet and was sent back to the people, to free their souls from the land of affliction. And the lamp of Christ is in the body. This lamp shows you the way. Hence also the holy man says: Your word is a lamp to my feet, a lamp because it has enlightened the souls of all and shown the way in darkness. The Gospel is the way of the lamp; it shines in shadow, that is, in the world. Hence you also have elsewhere: They will be made white as snow in Selmon, that is, in overshadowing.

Christ is also the Jordan, who divides the land; hear how he divides: And a sword will pass through your own soul, to reveal the thoughts of many hearts, because he is the divider of our souls, who descends into the inmost secrets of the heart and detects the thoughts of minds. This sword is the living word of God. In short, in the Letter to the Hebrews you read thus: For the word of God is living and powerful and sharper than any sharpest sword, piercing even to the division of soul and spirit and of joints and marrows. This is the spring of Siloam, which is called Sent, since Christ said that he was sent by the Father. There is also that division which is gathered from the fact that the tribes of the Jews inhabited both banks of the Jordan, since the Son of Man, who came down from heaven in later times, that true Jordan, that true divider of earthly and heavenly things, gave the fathers a divided possession: one to be possessed on earth, the other to be kept for the merits of the future life. Both of these befit Christ alone, either to divide heavenly things or to detect hidden things; for he divides inward things who detects hidden things, which is surely the mark of divinity. In short, you have it written thus, that God said: I will rejoice and divide Sicima. This is that magnificent portion which Jacob assigned to his son Joseph as more excellent than all. Hence he says: But I give you Sicima, magnificent above your brothers, which I took from the hands of the Amorites with my sword and arrow, because the division was owed to the Lord alone, a division which is grasped by the word, that is, by that spiritual sword of the true Solomon. What is meant by "alone"? The Father without Christ, or Christ without the Father? Not at all. When I say "the Father alone", I do not separate the Son, because the Son is in the bosom and secret of the Father. When I say "the Son alone", I join the Father too, as the Son also joined him, saying: Behold, the hour comes that you leave me alone; but I am not alone, because the Father is with me. So, therefore, the Father too is called blessed and alone powerful in such a way that the Son is not set apart from him, who is always in the Father. In short, John said excellently: In the beginning was the Word, but he was not without the Father. And God the Father was, but he was not without the Word, because the Word was with God.

This Sicima is the Church; for Solomon chose her, whose hidden love he distinguished. This Sicima is Mary, whose soul the sword of God passes through and divides. This Sicima is "ascending", as the interpretation has it. Who she is that ascends, hear him saying of the Church: Who is she that ascends, made white, leaning upon her brother? She is the active one, who in Greek is called ἐναργής, because she shines forth with faith and works. To her sons it is said: Let your works shine before my Father, who is in heaven.

David therefore remembers God from the land of the Jordan and of Hermonin, from the little mountain. Who is this little mountain? Let us consider whether perhaps the divinity of Christ is the great mountain. In short, I fill heaven and earth says the Lord. If, therefore, the divinity of Christ is the great mountain, surely his incarnation is the small mountain. Christ, therefore, is both, both the great mountain and the lesser: great truly, because great is the Lord and great is his power; lesser, because it is written: You have lessened him a little below the angels. Hence Isaiah says: We saw him, and he had neither form nor comeliness. Yet the same one both became lesser from great and great from lesser: lesser from great, because though he was in the form of God, he emptied himself and took the form of a servant; and great from lesser, because Daniel says: And the stone which struck the image became a great mountain and filled the whole earth. If you ask who this stone is, recognize it: The stone which the builders rejected, this has become the head of the corner. Yet the same one, even when he seemed small, was great. To this Isaiah assents, saying: A child is born to us, a son is given to us, whose beginning is upon his shoulders, and he is called the angel of great counsel. Christ is all things for your sake: a stone for your sake, that you may be built up; a mountain for your sake, that you may ascend. Ascend, therefore, above the mountain, you who seek heavenly things. For this he bowed the heaven, that you might be nearer; for this he rose up to the summit of the mountain, that he might lift you up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapters 3-4"
