[[commentary]]
quote='''
And because Ecclesiastes, a book of Solomon, is a profitable teacher in all things, let us apply ourselves to it for a little. The eye will not be satisfied with seeing, says he, neither will the ear be filled with hearing. Neither is the usurer filled with getting nor is his passion satiated by the daily hearing of his money being counted. And again: All that has been is the same as that which shall be. Money is always increasing, greed knows no rest, usury no holidays. All rivers, he says, run into the sea, and the sea does not overflow. The usurer is that sea; he absorbs everyone's patrimony like a flood and himself cannot be filled. Many however make use of the sea for gain, no one employs the usurer except for loss; the former is a benefit to many, the latter the shipwreck of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 13"
