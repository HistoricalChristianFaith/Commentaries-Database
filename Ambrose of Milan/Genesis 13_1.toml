[[commentary]]
quote='''
So Abraham departed from there, having with him his wife Sarai, that is, the ruling one, not one who serves. And therefore it is also said to him: Listen to Sarah your wife. For she who has stripped herself of the servitude of sins holds sovereignty, not servitude. The stronger mind, then, has with it the ruling virtue, that is, one that commands the senses of the body, not one that obeys them; which brought everything back with it from Egypt, lost there nothing of its disciplines, was not stained by intemperance, insolence, the immoderation of shameful deeds, was not stripped of the cloak of diligent sobriety, was not divested of the garment of modesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 5"
