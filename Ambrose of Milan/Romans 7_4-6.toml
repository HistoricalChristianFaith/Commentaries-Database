[[commentary]]
quote='''
Christ joined her to himself, to render her spotless; he made her his partner, to take away the adultery. And because she was under the Law, she had to die, so that she might be freed from the Law, so that through that death a kind of marriage, as it were, of the Law and the flesh might be dissolved. So the flesh died in Christ, so that we, made dead to the Law through the body of Christ, as the Apostle said, might belong to another, who rose from the dead, and that the passions and desires of the flesh and the thoughts of sins, which through the Law were in our members, might die in that death, and that we, loosed from the law of death, might rise again in newness of spirit as by a new union with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 10"
