[[commentary]]
quote='''
There follows: I will teach the unjust your ways, and the ungodly will be converted to you. That helmsman is outstanding who steers a ship along a rocky shore; that teacher is good who sharpens the duller wits for progress in learning; that warrior is excellent, a wonderful leader, who fires the more timid for battle and supports them with the natural features of the ground he has reconnoitred, so as to make up for weakness of strength by the advantage of a favourable position: so likewise that preacher of the faith too is great who teaches the unjust. Hence he says finely: I will teach the unjust. He did not say: I will teach the just — for the just know the ways of the Lord —, but the unjust, he says, I will teach. And so the author of prudence and master of all says: I came not to call the just, but sinners. And that heavenly physician: The healthy have no need, he says, of a physician, but the sick.

Whether, then, he set it down well in the person of him who called the Gentiles or in his own: I will teach the unjust, it is because heavenly teaching can change the innermost affections and convert the purpose, and the divine working can pour the pursuits of devotion into sacrilegious breasts, so that those who lived without the law, who before were turned away, may be converted to the true God; so that also, by the example of a king's repentance, those who practise iniquities and bitter shameful deeds may be corrected and, converted in faith and in deed, may receive the remedy of saving teaching and enter the ways of the Lord, in which no winding of error, no byways of a headlong slip may make them stumble. For just as the pattern of a good life and the model of virtue is found in those men who have run through the seasons of their life without offense, so those who, renouncing the shameful deeds they did before or the errors of unbelief, have amended the course of their later years are set forth for imitation to those who fall either in deed or in knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 16"
