[[commentary]]
quote='''
Yet I wonder why, then, O rich men, you think you should be puffed up, since gold is rather the material of the stumbling block than a cause of commendation: For gold is a stumbling block also and woe to them who eagerly follow after it. Therefore the rich man is blessed that is found without blemish: and that hath not gone after gold, nor put his trust in treasures of money. But just as if he cannot be known, he desires that such a man be pointed out to him: Who is he, he says, and we will praise him? For he has done what we should admire rather as something new than as something customary. And so he who can be commended in riches is truly perfect and worthy of glory. He that could have transgressed, he says, and hath not transgressed; that could do evil things, and hath not done them. Therefore gold, wherein there is so great an allurement to sin, he commends to you not so much for its own sake as for its being a punishment due to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 13"
