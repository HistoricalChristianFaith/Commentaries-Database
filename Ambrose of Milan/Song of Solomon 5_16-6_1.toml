
[[commentary]]
quote='''
Such is my beloved, and my friend, daughters of Jerusalem. So the Church, or the holy soul, joined with the daughters of that heavenly city, seeks the Word, and by seeking arouses in herself love for him; while they inquire and say: Where has your beloved gone, O most beautiful among women? Where has your beloved turned aside, that we may seek him with you?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
