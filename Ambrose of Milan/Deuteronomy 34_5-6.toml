[[commentary]]
quote='''
Accordingly, we do not read of him, as we do of others, that he fell sick and died. We read that he died by the word of God—for a God does not grow weak or undergo diminution or addition. Hence Scripture added: No man hath known of his sepulture until this present day—by which we are to understand that he was taken up into heaven rather than buried, for death may be called a separation of the soul from the body. He died, therefore, as the Scripture states: by the word of God—not "in accordance with the word"—so as to make known that this was not an announcement of his death, but was more in the nature of a gracious gift to one who was translated rather than left here, and whose sepulture was known to no man. Who could ever find the remains on earth of one who has been shown in the Gospel to be with the Son of God. Hence there appeared with him Elias, who was carried away in a chariot and who did not die nor was buried according to Scripture, for he still lives, being with the Son of God. We read, indeed, that Moses did die, but he died by the Word of God, by which all things are made: By the word of God the heavens were established. By the Word of God, therefore, there is no cessation of work, but, rather, a foundation. We are not to understand that here with the dissolution of the body we have a return to earth. A special favor was bestowed on him by the operation of the Word of God, so that to his body was granted repose rather than a monumental sepulcher.

There is a clear distinction between servant and master. What is a privilege in a master is in a servant a favor. We read that no one knows the sepulcher of Moses and that Christ died and was taken up from earth to heaven. Christ, in accordance with the mystery of the Law, looked forward to the Redemption, so that He would rise again. Moses did not, in accordance with the favors granted in the Gospel, look forward to Redemption; rather, he himself was the bestower of it. Hence his sepulcher is not really known, but the sepulcher which the creature could not any longer endure has been set free, since of himself every creature makes haste to be delivered from its slavery to corruption. No one, therefore, knows the burial place of Moses, because all men have knowledge of his life. We have seen the sepulcher of Christ, but now no longer know it, since we have come to know His Resurrection. His tomb, in fact, ought to be recognized, so that His Resurrection be made manifest. Hence in the Gospel His tomb is described in all detail. There is no account of this in the Law, because, although the Law announced His Resurrection, it was left to the Gospels in their very detailed account to give us confirmation of this fact.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 2"
