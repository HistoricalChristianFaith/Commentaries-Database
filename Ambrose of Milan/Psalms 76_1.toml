[[commentary]]
quote='''
Now beautifully has holy David thus begun in the Seventy-Fifth Psalm, singing a hymn to God written to the Assyrian, that is, against the Assyrian of spiritual wickedness, the vain and foolish prince of this world: In Judaea God is known, that is, not in the rich, not in the mighty and the noble is God known, but in the soul that confesses Him. And his name, he says, is great in Israel, not in princes and consuls, but in him who sees God; for he is Israel in whom deep faith has been able to arrive at the knowledge of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 14"

[[commentary]]
quote='''
For just as ointment shut up in some vessel holds in its fragrance, and that fragrance, so long as it is confined within the narrow limits of that vessel, although it cannot reach many, yet keeps its strength; but when the ointment has been poured out of the vessel in which it was shut, it is said to be spread far and wide: so too the name of Christ, before his coming, was shut up among the people of Israel, as in a vessel, in the minds of the Jews: for Known indeed in Judea is God, in Israel his name is great. (Ps. 75 (76):1). This, then, is the name which the vessels of the Jews held confined within their narrow limits. Great indeed was the name even then, when it was held within the narrow limits of the weak and the few, but it had not yet poured out its greatness through the hearts of the Gentiles and to the ends of the whole world: but after he shone upon the whole world by his coming, he extended that divine name of his through every creature, not filled up by any addition, for fullness knows no increase, but filling what was empty, that his name might be wonderful in all the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
