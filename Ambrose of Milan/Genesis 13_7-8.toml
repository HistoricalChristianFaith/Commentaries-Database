[[commentary]]
quote='''
Devotion, then, has by just order claimed the first place for itself. Let us see also the grace of the other virtues. Holy Abraham was comforted by the presence of his nephew, to whom he showed a father's affection. A quarrel broke out between the servants of the nephew and of the uncle. Being the more prudent, he perceived that the harmony of masters is usually dissolved by the dissensions of servants; he cut off the fringe of discord, lest the contagion should creep further. For he thought it more tolerable that their companionship be separated than that their goodwill be broken. This you too ought to do, if perhaps you meet with something of this kind, so as to remove the seedbed of dissension. For you are not stronger than Abraham. He judged that the quarrels of servants should be avoided, not despised. And if you are stronger, beware lest the other be weaker, and lend his ear to the whisperings of servants. Undivided households of slaves often sow discord among kinsmen. Divide rather, so that friendship may remain; an undivided house does not sustain two. Is it not better to move away in good grace than to live together in discord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
