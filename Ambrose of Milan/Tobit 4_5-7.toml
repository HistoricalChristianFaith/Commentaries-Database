[[commentary]]
quote='''
Because therefore he entrusted his money and did not put it out at usury, he observed the duty of a just man; for lending by which usury is sought is evil. But that lending is not evil concerning which it is written: Lend to thy neighbor in the time of his need. For David says also: The just showeth mercy and lendeth. That lending is different and rightly accursed, to give money for usury, which the law prohibits. But Tobias shunned this, who warned his son not to transgress the precept of the Lord, but of his substance to give alms, not to put out his money at interest, not to turn his face from any poor man. He who advises this condemns usury in lending. From this many have made a profit, and to many it has been a business to lend money. And yet the saints have forbidden it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 2"
