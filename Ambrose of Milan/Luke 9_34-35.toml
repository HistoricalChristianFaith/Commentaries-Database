[[commentary]]
quote='''
And as he was saying these words a cloud came and overshadowed them. This overshadowing is of the divine Spirit; it does not darken men's affections but reveals hidden things. It is also found in another place, when the angel says: and the power of the Most High shall overshadow you. Its effect is shown when the voice of God is heard, saying: this is my beloved Son, hear him,

that is: not Elijah the Son, not Moses the Son, but this is the Son, whom alone you see; for they had withdrawn when the Lord began to be pointed out. You see that this is the perfect faith not only of beginners but also of the perfect, indeed even of the heavenly ones: to know the Son of God. But since we have already spoken of these things above, know that this cloud is not one congealed from the misty moisture of smoking mountains, nor the pitchy gloom of condensed air which veils the sky with the horror of darkness, but a bright cloud, which does not drench us with rain waters and the flood of a soaking shower, but from which, when the voice of almighty God was sent forth, the dew of faith watered the minds of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
