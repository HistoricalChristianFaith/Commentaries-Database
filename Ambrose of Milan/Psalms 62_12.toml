[[commentary]]
quote='''
And therefore he himself will render to each according to his works; in this he includes also the quality of the works, so that either he may render to the merits of each the rewards of many and better works, or, on the contrary, we may be weighed down both by the number and by the bitterness of our deserts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
