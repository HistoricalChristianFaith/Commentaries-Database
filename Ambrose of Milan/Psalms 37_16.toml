[[commentary]]
quote='''
Better is a little to the righteous man than the many riches of sinners. It is not, then, riches that are accused, but the riches of sinners, unless perhaps because the sinner said: All these things have been delivered to me, and to whom I will I give them; and then because riches rather inflame the torch of covetousness, and each man, while he desires greater things, does not turn aside from the byways of sinners. Hence also the Savior said: Make for yourselves friends of the mammon of iniquity. For that wealth belongs to iniquity which is in the devil's power, to be bestowed on whom he will. This too can be understood, that better is a little to the righteous man than the many riches of sinners, because there is a certain man rich in words, as are the philosophers of this world, disputing about sacrileges, about the motion of the stars, about the star of Jupiter and of Saturn, about the generations of men, about the worship of images, about geometry and dialectic. The philosophers, then, are rich in speech, needy in faith, without share in the truth. And there are very many simple priests of the Lord, poor in speech, sublime in abstinence and virtue. Those speak unbelief to many, these assert the faith in few words; those lose their own priests daily, this poor man acquires peoples for the Church and for the number of believers. He, then, who has heard these and seen the quality of their works will say: Better is a small portion to the righteous man than the many riches of sinners. From here Solomon derived that saying, which he set down as if his own: In much speaking you will not escape sin. Dialectic, then, flows with riches of words; devotion keeps the fear of God. Therefore this man, sparing in words, rich in spirit, would rather fear than fling about empty words about the truth. For fear is the discipline of wisdom; talkativeness is the shipwreck of innocence and virtue, and the incitement to falling and to guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
