[[commentary]]
quote='''
There remains the fourth point, what it says about the death of the high priest: for until that time that manslayer shall be in the city of refuge, until the high priest dies, in which the interpretation, according to the letter, sticks fast. First, the flight itself is determined by chance rather than by the equity of any judgment; then, in equal cases the outcome is unequal; for it could happen that the high priest should die on the day after that manslayer had taken refuge. And what sort of sentence rests on uncertainty? Therefore, since the letter sticks fast, let us seek the spiritual sense. Who is this high priest but the Son of God, the Word of God, whose advocacy on our behalf we have with the Father, who has no part in any offences, voluntary or accidental, in whom all things that are on earth and that are in heaven hold together? For all things are bound together by the bond of the Word and are held by his power and consist in him, since in him they were created and in him dwells all fullness. And therefore all things abide, because he does not allow to be dissolved the things which he himself has bound together, since they consist in his will; for he restrains all things by his command as far as he wills, and rules them, and binds them with a natural concord. The Word of God, then, lives, and lives above all in the souls of the devout, and the fullness of the Godhead never dies. For the everlasting Godhead and the eternal power of God never die. Yet he dies to us if he is separated from our soul, not that he is corrupted by death, but that our mind is loosed and stripped from union with him; for true death is the separation of the Word and the soul. And then at once the soul begins to lie open to voluntary sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 2"

[[commentary]]
quote='''
But since the Law was able to stop the mouths of all and was not able to convert the mind, therefore the last remedy of that final city was owed, in which there should be a saving refuge, so that the death of the prince of priests might free us from all dread of death and strip us of fear.

Who is he but the one of whom it has been read: Behold the Lamb of God, behold him who takes away the sin of the world? Whom God has set forth as a propitiator through faith in his blood, for the showing of his justice. And understand that he himself is the great prince of priests. The Father swore concerning him, saying: You are a priest for ever. Rightly for ever, because all the others, being temporal, are under sin, but this one has an inviolable priesthood. All are under death, but this one is ever living, since how could he who is able to save others perish himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 3"

[[commentary]]
quote='''
He then flees as Lot did who renounces vices, who disowns the customs of the inhabitants, who does not look back behind him, who enters that higher city by the entrance of his thoughts and does not withdraw from it until the prince of priests dies, who took away the sin of the world. He died indeed once, but he dies for each one who is baptized into the death of Christ, that we may be buried together with him and rise again with him and walk in the newness of his life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"
