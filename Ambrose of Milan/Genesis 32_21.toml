[[commentary]]
quote='''
In short, when he was about to seek concord with his brother, he slept in the camp. Perfect virtue has the tranquillity and stability of rest; therefore the Lord reserved its gift for the more perfect, saying: My peace I leave you, my peace I give you. For it belongs to the perfect not to be easily moved by worldly things, not to be disturbed by fear, not to be agitated by suspicion, not to be shaken by terror, not to be troubled by pain, but, as if on a most safe shore, to keep the mind unmoved and calm in a faithful anchorage against the rising waves of the storms of the world. This firm support Christ brought into Christian minds, bringing inner peace into the souls of the approved, so that our heart may not be troubled nor our soul agitated. That this peace is above every mind the Apostle, our teacher, asserted, saying: And the peace of God, which surpasses every mind, will guard your hearts and your thoughts in Christ Jesus. And so the fruit of peace is not to be disturbed in one's breast. In short, the life of the just man is quiet, but the unjust man is full of disquiet and disturbance. And so the impious man is afflicted more by his own suspicions than most men are by the blows of others, and the weals of the wounds are greater in his soul than in the bodies of those who are beaten by others.

It is a great thing for someone to be tranquil within himself and at one with himself. Outward peace is sought either by the anxious foresight of an emperor or by the hand of soldiers, or it comes from the prosperous outcome of wars or from some slaughter of barbarians, if in a hostile commotion they turn their arms against themselves. In that peace there is no virtue of ours, but only an outcome. Certainly the glory of that peace is referred to the emperor; the fruit of this peace is in us, the peace which is in our minds and is held in the dispositions of each one. Greater is the fruit of this peace, by which the temptations of spiritual wickedness are repelled, than that by which hostile arms are repelled. This peace, which shuts out the allurements of the bodily passions and calms disturbances, is more sublime than that which quells the incursions of barbarians; for it is more to resist an enemy shut up within you than one far away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 6"
