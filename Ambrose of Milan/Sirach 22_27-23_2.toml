[[commentary]]
quote='''
Therefore the Wise Man said: Who will give me scourges for my thoughts and a seal for my lips?, that he might scourge his heart with his own thoughts and seal his lips, so as both to diminish old sins and not to renew others by speaking, so that, instructed by his own rebukes, he might put on the exercises of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
