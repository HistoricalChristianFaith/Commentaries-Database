[[commentary]]
quote='''
Hence also John says: I write to you, boys, because you have known the Father. I write to you, young men, because you have overcome the evil one. I write to you, fathers, because you have known him who is from the beginning. And so, being older, writing to the brethren, he designates as mature those who are so by advance in faith and devotion. These, then, are ages of virtues, not of weakness; for the boy is not without virtue who has known the Father, the God of powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
