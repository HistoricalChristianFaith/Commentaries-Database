[[commentary]]
quote='''
Let us, then, walk according to the will of God, so that we may be said to cleave to God. For he who lives according to the appetite of the body is flesh; he who lives according to the precepts of God is spirit. Let not our soul, then, become flesh, that is, so that we are called flesh; as were those too who perished in the flood, of whom it was said: Because they are flesh (Gen. 6:3). But rather let our flesh, obedient to the helm of the soul, become soul, and deserve to be called by this name; as the family of the patriarch Jacob was called, and the holy posterity of his line; for thus it is written: These are the sons of Bilhah, whom Laban gave to Rachel his daughter: she bore these to Jacob, seven souls. And in the same place: But all the souls who entered with Jacob into Egypt, who came out of his thighs, besides the wives of his sons, were sixty-six (Gen. 46:25 and 26). And at the beginning of Exodus we read: Now all the souls from Jacob were five and seventy (Exod. 1:5).

Those, then, who dwelt with Joseph and came out of Egypt are souls; but those who, though they were angels of God, that is, imitating the grace of the angels by the uprightness of their life (For those who (Matt. 22:30) do not take wives, and who do not marry, will be like the angels of God in heaven); those, then, who, though they seemed to be angels, were captured by womanly beauty, these are flesh, as the Lord God said: My spirit shall not remain in men forever, because they are flesh (Gen. 6:3). And rightly those who are free of lust are compared to angels; for they are not flesh, because they are not in the flesh but in the spirit: such as were those who followed the Apostle as their teacher, to whom he says: But you are not in the flesh, but in the Spirit (Rom. 8:9). But those who are captured by bodily lust for women are flesh: and would that they were only flesh, and not also neighing horses! Because, he says, they neighed after the wife of their neighbor (Jer. 5:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
