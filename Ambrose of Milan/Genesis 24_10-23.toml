[[commentary]]
quote='''
And the servant rose up and set out for Mesopotamia, and according to the order of the vow that the servant had vowed on setting out, Rebecca met him, having a pitcher upon her shoulder, a virgin very beautiful, whom no man had known. And she went down to the spring and filled the pitcher, gave the servant to drink, and watered all his camels. Then the servant of Abraham took golden earrings of a drachm each, and gave two bracelets into her hands — their weight ten pieces of gold — and asked her whether there was room for lodging and whose daughter she was. A moral simplicity is expressed, in that there was no room for ambition even in the seeking of a marriage, but the Lord, as the patron of marriage, fulfilled the request for the marriage. Yet we may behold the mysteries of the Church. Where is the Church found but in Mesopotamia? There she is sought, from there she is fetched, where she is enclosed by two rivers, the laver of grace and the weeping of penitence. For unless you have wept for your own sins, unless you have received the grace of baptism, the faith of the Church and a certain marriage bond are not acquired for you. The Tigris, that is, prudence, and the Euphrates, that is, justice and fruitful enlightenment, fortify her, separating her from the barbarian nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
