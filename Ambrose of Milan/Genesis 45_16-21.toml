[[commentary]]
quote='''
And Pharaoh rejoiced that Joseph had recognized his brothers. Hence the news was spread abroad in Pharaoh's house, and he urged holy Joseph to invite his brothers to come with their father, and he orders their packs to be filled with wheat and to be put on wagons. Whence this kindness in a barbarian, unless that great mystery were being shown, that the Church no longer begrudges when the Jews are redeemed, and the Christian people rejoices at this union and helps them with what aid it can, and sends men to preach the good news of the kingdom of God, so that they may be called forth the sooner?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
