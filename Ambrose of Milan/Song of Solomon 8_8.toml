[[commentary]]
quote='''
The daughters of Jerusalem heard this, that the Lord God was now joining the Church to himself: and because, considering the greatness of the Word, they judged themselves unequal to so great a marriage, lest perhaps they might not be able to bear the weight of so great a union, they excuse themselves, saying:

Our sister is little, and has no breasts. For thus those who wish to defer a marriage are accustomed to excuse themselves, pleading the weakness of an immature age and asserting that they do not have breasts, which signify the marriageable time of life. This is wont to be the token common to all virgins who are to marry: that when their breasts have begun to stand out, then they are judged fit for union. Troubled, then, that the Bridegroom in the eagerness of love is pressing on the marriage, they say:

What shall we do for our sister, on the day when he shall speak in her, or, as Symmachus has it, when he shall speak to her? That is, at the celebration of a betrothal there is usually a conversation, and the confirmation of the marriage. What then shall we do, they say in their trouble, since the spiritual union presses? They cannot beg off from so great a marriage; for there is no one who does not think blessed the union either of soul and spirit or of Christ and the Church. But because the fullness of the Word, or of the Holy Spirit, quivers and shines, and there is nothing that can be made equal to them, therefore they desire to defer it, so that by that delay either the soul or the Church may become more perfect. They say, therefore:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
