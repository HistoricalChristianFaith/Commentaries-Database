[[commentary]]
quote='''
And so there follows: Do not cast me away from your face, and do not take your Holy Spirit from me. If one of our slaves has offended us, we are accustomed to turn our countenance away from him. And many of the rich are wont to banish their slaves and relegate them to little farms, and this punishment is reckoned the heavier. Indeed, the slaves are wont rather to offer themselves to the lash. If this is held grievous among men, how much more with the Lord our God! Was it not from this that the fratricidal resentment broke out (which ought indeed to have been checked, if any devotion could have tempered it), that God turned his face away from the gifts of Cain but looked upon the gifts of Abel? And so with a silent look he pronounced the one innocent, the other a sinner. Therefore, like the lowest slave, he humbles himself, and, as one caught in sin and guilty of offense, he entreats that he may be scourged rather than cast away from the face of the Lord.

Hear how God casts away from his face, as he says: Take him into the outer darkness; there will be weeping and gnashing of teeth. He who is banished from his face is set in darkness. Therefore the just man, lest he suffer darkness, says: Your countenance, O Lord, will I seek. For where the countenance of the Lord is, there is light, as it is written: Make your face shine upon your servant. And so, as soon as he turned his gaze and saw Peter, he also enlightened him.

It is a great punishment, then, to be cast away from the face of the Lord. Adam was cast away when he went out of paradise, and not undeservedly; for he had first hidden himself from the face of God. Cain too went out from the face of God, not only after the fratricide he had committed, but also after he thought that God was to be deceived, so that he denied his crime. The sinner, then, is shut out from the face of God, but the just man says: Behold, here I am. And so David himself, when he saw the people perishing, offered himself, saying: Behold, here I am; I have sinned, and I the shepherd have done wickedly, and so the wrath of the Lord was appeased and pardon was granted.

At the same time he shows that the saints remain, while the criminals are cast away. And therefore we must keep spiritual grace, lest on account of our sins it be taken from us. For he in whom the Holy Spirit is is not cast away, but, the fruit of the Spirit's gift remaining unimpaired, he strives always to offer himself to the Lord, like him who, when the Lord said: Do you also wish to go away? answered: Lord, to whom shall we go? You have the words of eternal life, and we believe.

At the same time we must consider this, that the Spirit is not taken away except by the will of the Lord, just as he is not given except by the will of the Lord. And when he is given, he certainly does not work as one compelled, but is distributed according to his own will, as it is written, where the apostle says: But all these things one and the same Spirit works, distributing to each one as he wills. Since, then, he is not taken away except by the will of the Lord, it is clear that the will of the Trinity is one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 14"
