[[commentary]]
quote='''
Next, this is another virtue: that no one should move from house to house with roving levity, so that we may keep constancy even in the love of hospitality and not easily dissolve a bond of friendship once grown together; that we should bring forward the message of peace, so that our very first entrance may be hallowed by the blessing of peace; that we ought to be content with the food and drink offered; that the banners of faith are not to be kept down and the Gospel of the heavenly kingdom is to be preached; that the dust is to be shaken off the feet, if anyone has thought that we are not to be received in the hospitality of his city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
