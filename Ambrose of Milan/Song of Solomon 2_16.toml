[[commentary]]
quote='''
My brother is mine, and I am his. This is the voice of a virgin; for to keep the body spotless from union with a man, and, by the guarding of integrity, to carry the palm of chastity in a body of clay up to the way of life of the angels, is a private benefit and a public praise. How rare on earth is he who can say this, how far from vices, how set apart from every stain of sin, who has nothing in common with the world, saying: My beloved is mine and I am his, he will dwell in the midst of my breasts. That is, let him claim for himself nothing of this world, who has no possession of bodily desires, whom lust does not inflame, avarice does not goad, wantonness does not make effeminate, luxury does not discolour, ambition does not lay low, envy does not waste away, no care of worldly business makes anxious: a true minister of the altar, born for God, not for himself; for Levi, as the interpretation has it, signifies: He himself taken up for me; it signifies: And he is mine; it signifies also simply: Taken up; it signifies: And taken up for me.

He is the same, both Levi to me and to God. Just as the same is both priest to me and to God. And he is both my advocate and the Lord's intercessor: offering sacrifice for me, and the same offering himself to the Lord. In short, elsewhere too Levi is said, by interpretation, to mean For me (Pro me); for indeed, if Levi is named by me, Levi is for me: if he offers for me, he is for me: if he intercedes for me, he is for me: but if he is called by the Lord, he is called He himself to me (Ipse mihi): that is, not a tributary to another, not a payer of tithes, not bountiful out of his possession. He himself to me, that is, as one abundant in place of all his goods. From him I seek no tithes, no fruits, no gifts, no offerings; he himself is to me in place of an offering, he himself is in place of tribute. Not bountiful to me with his possession, but he himself is my possession, he himself my fruit, he himself my understanding. Taken up by me, or taken up for me: this cannot be without divine grace. For as a possession cannot be mine unless I buy it, so there cannot be a Levi unless he has been taken up by the Lord; for when he has been taken up, he is rightly called, He is mine. In short, when Moses had been told to divide the settlements for the Jewish people by their several tribes, and to distribute a portion to each tribe, God excepted the tribe of Levi, saying to the sons of Levi: He shall have no portion, nor lot, in the midst of his brothers; for the Lord God is their part (Deut. 10:9): and elsewhere: I the Lord am their portion (Num. 18:20).

An earthly allotment is denied to these, so that, while they claim no worldly portion for themselves, they may become a heavenly possession: or that they may know how to possess this alone, that is, the service of faith and devotion, being much richer than those who spread out the wide extents of their possessions. For however far they extend their boundaries, the land gives out, and the sea encloses their mad desires, and they pay tributes greater than their fruits. But this man, possessing nothing, serves as a soldier for none but God; his portion is above the earth, it does not give out with the earth, it is not enclosed by the sea. He whose portion is God is the possessor of all nature. In place of fields, then, he is enough for himself, having a good fruit which can never perish. In place of houses he is enough for himself, that he may be the dwelling of the Lord and the temple of God, than which nothing can be more precious. For what is more precious than God? Or what does this man lack who can say: May it not befall me to glory except in the cross of our Lord Jesus Christ, through whom the world is crucified to me, and I to the world (Gal. 6:14)?

In him the prince of this world can claim no partnership for himself, since he finds nothing of his own in him. And therefore the Lord, who came to teach that God might become our portion, says: For the prince of this world comes, and finds nothing in me (John 14:30). And rightly, wishing us to be his imitators, he says: Do not possess gold, nor silver, nor money (Matt. 10:9). Hence Peter, showing that his portion is in God, not in the world, says: Silver and gold I have not, but what I have, this I give you: in the name of Jesus Christ of Nazareth, rise and walk (Acts 3:6); that is, this is my portion, my portion is Christ: In the name, then, of Christ Jesus rise and walk (ibid.). That is, in my portion I am rich, in my portion I am mighty. Rightly I presume such fruits of this portion, that salvation and life are bestowed; for this is the patrimony of that portion which I have chosen for myself: My beloved is mine, and I am his.

Who feeds among the lilies. The lily signifies chastity. So the good shepherd knows where to feed his flock, what pastures are good for his sheep. What are our pastures, that is, those of the faithful, if not Christ? In whose pastures the Prophet rejoiced to be placed, saying: In a place of pasture, there he has set me (Ps. 22 (23):2); for there he feeds us and refreshes us. Good pastures are the divine sacraments. There you pluck a new flower, which has given the good fragrance of the resurrection: you pluck the lily, in which is the splendour of eternity: you pluck the rose, that is, the blood of the Lord's body. Good pastures also are the books of the heavenly Scriptures, in which we are fed by daily reading, in which we are restored and refreshed, when we taste what is written, or, having sipped it with the tip of the mouth, chew it over again and again. With these pastures the flock of the Lord is fattened. Good pastures of Christ also are the mountains of the valleys; for in these too Christ feeds like a young roe or a fawn of the harts, that is, in the splendours of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
