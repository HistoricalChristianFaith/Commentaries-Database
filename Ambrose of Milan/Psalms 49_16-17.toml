[[commentary]]
quote='''
Since, then, the things that are in this world cannot pass over with us, therefore it is said to you: Do not fear when a man has become rich and when the glory of his house has been multiplied, for when he dies he shall not take all things, nor shall the glory of his house descend with him. Do not, he says, be dismayed at riches and the power of the rich man and the glory of the world, since those things are perishable and depart more quickly than they came. This treasure is a dream; you wake, and it is gone, since he who has been able to sleep off the drunkenness of this world and to take on the sobriety of virtue despises these things and counts money as nothing. Nor should you fear when you hear of the multiplied glory of some powerful man's house. Look closely, and it is empty, since it has nothing of the fullness of faith. And what shall I say of a house? This whole world was empty before Christ filled it with the number of believers, and therefore it is written: He shall judge among the nations, he shall fill up the ruins. For what else was there before in this world but the ruin of unbelief? What is ruin? Hear him who says: Where there is ruin, there also are the eagles, that is: where there is ruin, there also is resurrection. Ruin is empty of firmness; resurrection is the fullness of living. And therefore the ruin of that Adam emptied us, but the grace of Christ filled us again. Therefore he emptied himself, that he might fill us and that the fullness of power might dwell in the flesh of man. Learn what ruin is. While a man lives, he is filled with spirit; when he has died, he is surely empty of this vital spirit. Much more does the loss of spiritual grace make him empty whom grace was wont to fill, so that we may say: For we have all received of his fullness, and grace for grace. Of another it is said: I have laboured for what is empty, but the righteous man is like the scent of a full field.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
