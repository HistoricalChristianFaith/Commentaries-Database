[[commentary]]
quote='''
Someone says: How then did Thomas, while he did not yet believe, nevertheless touch Christ? But he seems to have doubted not about the Lord's resurrection but about the quality of the resurrection, and by his touch he had to teach me, as Paul too taught: For this corruptible must put on incorruption, and this mortal put on immortality, that the unbelieving may believe and the hesitant may be unable to doubt; for we more easily believe what we see. Now Thomas had cause for wonder when he saw, with all things shut, a body brought in through enclosures impassable to bodies, the structure unbroken; and therefore it is a wonder how a bodily nature poured itself through an impenetrable body, with an invisible entrance, a visible appearance, easy to touch, hard to understand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
