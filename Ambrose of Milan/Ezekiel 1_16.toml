[[commentary]]
quote='''
The wheel within a wheel is life under the law, life under grace; inasmuch as Jews are within the church, the law is included in grace. For one is within the church who is a Jew secretly; and circumcision of the heart is a sacrament within the church. But that Jewish people are within the church of which it is written: "In Judah is God known"; therefore as wheel runs within wheel, in the same way the wings were still and the wings were flying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25203.html'
source_title="On the Holy Spirit 3.21.162"

[[commentary]]
quote='''
And when he had been killed, he ordered the fourth to be bound to the wheel, so that by its turning he might be loosened in all his limbs. But he, while he was being savagely tortured: 'You dissolve the limbs of the body' he said 'but you add grace to the passion, and you do not snatch its solace from death.' For there is the voice of thunder in the wheel, because in the good and unstumbling course of this life the heavenly oracle resounds, as it resounded in John and in James, the sons of thunder. And so what I have read I now recognize more clearly, that a wheel runs within a wheel and is not hindered. For a smooth life, without any stumbling, turns in any suffering whatever, and within these things too the wheel runs. The Law runs within grace, and the observance of the Law is within the course of divine mercy; for the more it is turned, the more it is proved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
