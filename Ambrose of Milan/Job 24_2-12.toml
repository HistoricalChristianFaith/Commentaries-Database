[[commentary]]
quote='''
Then he enumerates the crimes of the ungodly: that they have passed over the boundaries, and plundered the flock together with the shepherd, led away the orphan's yoke-beast, taken the widow's ox in pledge, reaped a field not their own, while the weak have worked in their vineyards without wage and food; that, stripping off their clothes, they have made many sleep naked, whose soul's covering they have taken away. These were wet with the drippings of the mountains, and, because a covering was lacking, they covered themselves with the rock. Orphans were snatched from their mothers' breasts; those who had fallen, who ought rather to have been raised up, were crushed. The hungry were cheated of food; the soul of the little children groaned heavily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
