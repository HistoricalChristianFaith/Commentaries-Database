[[commentary]]
quote='''
Arise, come, my nearest one, do not fear the nets; the winter has now passed. The Pasch has come, pardon has come, the remission of sins has come, temptation has ceased, the rain has gone, the storm has gone and the shaking. Before the coming of Christ it was winter; after the coming of Christ there are flowers; hence he says: The flowers have appeared on the earth. Where before there were thorns, there now are flowers; The time, he says, of cutting has come. Where before there was desert, there is harvest. The voice of the turtledove has been heard in our land: well did the prophet add our, as if marvelling that where before there was unchastity, there is chastity. The fig tree has put forth its green figs. That which, as unfruitful, was ordered to be cut down has now begun to bear fruit. But why do you hesitate because he said green figs? It shakes off the earlier ones, that it may bring forth later and better ones: as the fruit of the Synagogue is cast away, while that of the Church is renewed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
