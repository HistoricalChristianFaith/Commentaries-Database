[[commentary]]
quote='''
Accordingly, so that you may know that it is a mystery, interpret the names. For you take David in type of Christ; Bathsheba is called "daughter of the sabbath" and "full daughter" and "well of the oath". What, then, is more express than that the daughter of the sabbath is the flesh of Christ, because God sent his Son, made of a woman, made under the Law? The same is full, because in his passion is the fullness of the Law, or because she is full of the Holy Spirit; for Jesus, full of the Holy Spirit, returned from the Jordan. The same is also the well of the oath, that is, of religion and faith. And rightly a well, because rivers of living water shall flow from her belly. Assuming her, then, to himself, God the Word made the union lawful, a mystery which that wedding also declared which is in the Song of Songs, in which the Church is wedded to Christ and the flesh to the spirit. And therefore she ran about and sought the Word of God everywhere, because, wounded, naked, adulterous in all, though spotless in Christ, the wretched flesh was seeking a redeemer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 10"
