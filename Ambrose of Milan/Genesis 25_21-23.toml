[[commentary]]
quote='''
And Rebecca conceived, and by her patience she loosed the knot of barrenness. But let us consider what the prophetic and apostolic soul brings forth, and how she brings forth. She went it says to inquire of the Lord, because the infants were leaping in her womb. And she received the answer: two nations are in your womb, because she presumes nothing of herself, but in all things asks the most high God to preside over her counsels, and at the same time, full of peace and piety, she joins two peoples by her faith and preaching and, as it were, encloses them in her womb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
