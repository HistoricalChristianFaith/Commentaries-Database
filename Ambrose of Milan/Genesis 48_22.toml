[[commentary]]
quote='''
This fact cannot be denied; yet we can interpret that by Shechem shoulders are signified, and by shoulders works. So he chose holy Joseph above the rest as the heir of good works, whose works his brothers could not equal. For who could equal the deeds of Christ?

Then, moreover, immaculate and chaste, he carried off spoils from this earthly lodging and from the authors of impurity, capturing a place given over to debaucheries and crimes for the sojourning of the saints by heavenly words and the spiritual sword, so that where formerly the inhabitants of wantonness and the princes of luxury dwelt, where there had been the incitements of lust and the kindlings of wickedness, there holy priests may now teach the lessons of chastity, and very many examples of virginal integrity may shine forth with a kind of brightness of the light on high.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 3"
