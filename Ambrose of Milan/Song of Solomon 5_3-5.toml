[[commentary]]
quote='''
Having heard, then, the voice of the Word, do not ask how you may put on the tunic which you had put off at night; for it is shown, and often offered, through spiritual wickedness: how, I say, you may put it on. Forget it and do not know it. As though the Lord were already standing by, rise up troubled, free from bodily bonds; prepare your inner mind with prayers while you rise, so that from lowly things you may strive toward things above, and be eager to open the doors of your heart. While you stretch out your hands to Christ, your deeds will breathe forth a faithful fragrance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
