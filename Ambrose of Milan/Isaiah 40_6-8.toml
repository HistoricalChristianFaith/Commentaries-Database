[[commentary]]
quote='''
What more need I add to the theme of the marvels of this creation and to the proof of the existence of a Creative Wisdom? For, in the appearance of a bud on the one hand, and in the provision of a green herb, on the other, there lies an image of the life of man and what may be termed a clear indication and mirror of our nature and of our condition. That green herb and flower of the field are a figure of the flesh of man, as the true interpreter of divinity has expressed in organ tones: ‘Cry! What shall I cry? All flesh is grass and all the glory of man is as the flower of the field. The grass is withered and the flower is fallen, but the word of the Lord endureth forever.’ This is the thought of God though uttered by the voice of man. God says: ‘Cry,’ but He speaks in the person of Isaias, who answered: ‘What shall I cry?’ and, as he had heard what he should say, added: ‘All flesh is grass.’ And with truth, for the glory of man waxes green in his flesh like grass, and what is considered to be sublime is actually a lowly green herb. Blooming early as a flower and briefly as the green herb, it has the outward appearance of vigor, but its fruit has no lasting quality. It displays like a flower the joys of a happy existence, but is destined to pass away in all too brief a moment like the green herb, ‘which withereth before it be plucked up.’ For what strength can there be in flesh, what enduring quality can there be in health?

Today you may behold a youth who is strong and vigorous in the flower of his age, pleasing in aspect and with the fine glow of health. Tomorrow you meet the same youth, but how changed are his form and features! The young man who the previous day appeared to luxuriate in health and beauty is now an object of pity, prostrate and weakened by the inroads of some illness. Toil or want take their toll of health: some suffer from stomach ills; others from abuse of wine. Still others are enfeebled by old age; others are emasculated and disfigured by overindulgence in pleasure. Is it not true that ‘the grass is withered and that the flower has fallen?’

Another man, who claims nobility from his grandfather and great-grandfather and has been made illustrious by the insignia of offices held by his ancestors, a man renowned by the trappings of his noble birth, abounding in friends, surrounded on both sides by a crowd of clients who accompany him like a troop of slaves to and from his house—should this man suddenly find himself faced with some passing peril, he is abandoned by all, he is shunned by his friends and assailed by his relatives. Consider how true it is that the life of man is like the grass of the field, ‘which withereth before it is plucked up.’

There is also the man who for a long time has had abundance of wealth, the fame of whose generosity has flitted over the lips of every man, a man renowned for his honors, outstanding in power, with a lofty seat in the tribunals, enthroned aloft and regarded as happy by the populace while he is being announced by the cries of the heralds. By a sudden change of fortune he is dragged away into the same prison into which he himself had cast others. Among his own victims he bewails in anguish his impending punishment. What crowds of sycophants and what a invidious procession of throngs of people had formerly conducted him from his home! Just one night put an end to the splendor of that triumphal pomp! Human glory of this kind is like a flower of the field which, even when it is taken away, contributes nothing to the labor. From it no fruit is obtained and, when it is allowed to fall, it fades away, depriving man of the protective covering by which he is shaded from above and animated within.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
