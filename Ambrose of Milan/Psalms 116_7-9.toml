[[commentary]]
quote='''
Theodosius, now at peace, rejoices that he has been snatched away from the cares of this world, and he lifts up his soul and directs it to that great and eternal rest. He declares that he has been admirably cared for, "since God has snatched his soul from death," the death that he frequently withstood in the treacherous conditions of this world, when he was disturbed by the waves of sin. And God has snatched his eyes from tears, for sorrow and sadness and mourning shall flee away. And elsewhere we have, "He shall wipe away every tear from their eyes; and death shall be no more; neither shall there be mourning or crying or pain." If, then, death will be no more, he cannot suffer a fall when he is in that rest, "but he will please God in the land of the living." For while humankind is here enveloped in a mortal body subject to falls and transgressions, that will not be so there. Therefore, that is the land of the living where the soul is, for the soul has been made to the image and likeness of God; it is not flesh fashioned from earth. Hence, flesh returns to earth, but the soul hastens to celestial rest, and to it is said, "Turn, my soul, to your rest."
'''
source_url=''
source_title="ON THE DEATH OF THEODOSIUS 30"

[[commentary]]
quote='''
Who, then, would doubt the good of death, when that which is restless, that which is shameful, that which is hostile to us, that which is violent, that which is stormy and alluring to every vice, comes to rest and lies still and is shut up like a wild beast in the cage of the tomb; when its madness is left lifeless and the dead framework of the entrails is dissolved into the earth; while that which is akin to the virtues, a friend to disciplines, eager for glory, a follower of the good, subject to God, flies away to that sublime place and abides with that pure, everlasting and immortal good, cleaves to it and is with it, from which it draws its kinship, as someone says: for we are also his offspring? For it is plain that the soul does not die with the body, because it is not from the body. And that it is not from the body Scripture teaches in many ways. For Adam too received the spirit of life from the Lord our God and became a living soul, and David says: Return, my soul, to your rest, for the Lord has done good to me. And hear in what he has done good: For he has delivered he says my feet from falling. You see that he gives thanks for the remedy of this death, because it has become the end of error, because it was guilt, not nature, that failed.

Then, as one stripped and free, he says: I will please the Lord in the region of the living. For that is the region . . . . Then he says that that rest of souls is the land of the living, where sins do not penetrate, where the glory of the virtues lives. But this region is full of the dead, because it is full of offences, and rightly was it said: Leave the dead to bury their own dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"

[[commentary]]
quote='''
In this good there is pure rest, immortal light, perpetual grace, the inheritance of souls, a holy and secure tranquillity, not subject to death but rescued from death, where there are no tears, there is no weeping — for whence weeping there, where there is no falling? — where your saints are released from errors and anxieties, from folly and ignorance, from fear and dread, from desires and all bodily filth and passions; where the region of the living is; and, that we may add authority to this assertion, concerning this good the prophet says: Return, my soul, to your rest, for the Lord has done good to me, because he has rescued my soul from death, my eyes from tears, my feet from falling. I will please the Lord in the region of the living. I will please, he said, not I please; that is, he flatters himself about the time to come. But future things are contrary to present ones, and eternal things to temporal ones. And therefore, since there is the region of the living, here surely is that of the dead.

Or is this not the region of the dead, where there is the shadow of death, where the gate of death, where the body of death? Then it is granted to Peter that the gates of hell shall not prevail against him. These gates of hell are earthly ones, whence he too says: You who lift me up from the gates of death. For just as there are gates of justice, in which the saints confess to the Lord, so there are gates of crimes, in which the ungodly have denied the Lord. Hear that this region is that of the dead: If anyone, then, touches a dead man, he will be unclean; and every unjust man is unclean in the sight of the Lord. If anyone, then, touches iniquity, he will be unclean; if anyone lives in pleasures, he is dead, since she who lives in pleasures is dead. And those who are unbelievers go down alive into hell: even if they seem to live with us, yet they are in hell. If anyone takes usury, commits robbery, he does not live by life, as you have it in Ezekiel. But if anyone who is just keeps the ordinances of the Lord so as to do them, 'by life,' he says, 'he shall live and he shall live in them'. He, then, is in the region of the living, in that region where life is not hidden but free, where there is no shadow but glory; for here not even Paul himself lived in glory. Indeed, he groaned in the body of death. Hear him saying: for now our life is hidden with Christ in God; but when Christ, our life, appears, then we too shall appear with him in glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
