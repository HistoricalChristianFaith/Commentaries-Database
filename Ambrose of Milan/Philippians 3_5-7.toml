[[commentary]]
quote='''
But no one is justified by the Law; rather he is redeemed by grace. There is, then, righteousness in the Law, but righteousness is not through the Law; for the Apostle himself too, a Hebrew of Hebrews, according to the Law a Pharisee, according to the righteousness which is in the Law having lived without complaint, he who glories on the ground of the Law: What things were gain to me he says these I counted loss for Christ, that is: he cast away the righteousness and the glory of the Law; for the righteousness of the Law without Christ is empty, because Christ is the fullness of the Law. And therefore, though there is righteousness in the Law, yet righteousness is not through the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
