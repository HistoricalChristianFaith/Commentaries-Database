[[commentary]]
quote='''
Come you too, Isaiah, interpret for us how Christ called himself sorrowing, who was wont to heal the pains of wounds. The physician came to cure the sick: what had he himself to grieve over? Let us hear the testimony of Isaiah too: For us, he says, he grieves, and we reckoned him to be in sorrows. He expressed the feeling of a physician, who, even if he himself had no wound to grieve over, yet suffered with the wounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
