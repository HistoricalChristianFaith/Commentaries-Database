[[commentary]]
quote='''
But when you hear of battles and reports of battles. The Lord, asked when the destruction of the temple would come and what would be the sign of his coming, teaches about the signs; about the time he does not think it should be made known. But Matthew added a third question, so that the disciples asked both about the time of the temple's destruction, and about the sign of the coming, and about the consummation of the age; Luke thought that enough was known about the consummation of the age if one learned about the coming of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
