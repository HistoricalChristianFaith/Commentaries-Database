[[commentary]]
quote='''
Those who go about the city found me; they took my cloak from me. She had, then, a struggle: but for what reason they did not take her cloak from her here, I am at a loss to discover; unless perhaps because there she said she had asked: Have you seen him whom my soul loved? She who spoke of Christ was not stripped of her cloak, and found him whom she sought. Learn how Christ is to be sought: surely by those who do not seek perfunctorily, but hold him fast by force, like this one who says: I held him and will not let him go: she found him with faith, she bound him fast by meditation.

If we take them as good watchmen, they are surely angels. But he who passed by the angels found the Word; and therefore there was no great interval when he passed from them and found Jesus. How then did they take her cloak below, unless perhaps because, in the course of an offence against the faith, the Church, while she is stripped, is loved the more by the Lord, putting off the old man that she may put on the new, whom sins do not cover, but the secret places of the mind make bright; or because, when she was about to come to Christ, she laid aside the garment of worldly wisdom? And he was not stripped of his cloak after he had begun to be more perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
