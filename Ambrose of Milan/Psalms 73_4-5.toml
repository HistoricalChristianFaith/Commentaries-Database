[[commentary]]
quote='''
Hence, Cain, because he wanted to deny his guilt, was judged unworthy to be punished in his sin. He was forgiven without a prescribed penalty, not, perhaps, for having committed such a serious crime as parricide—he was responsible for his brother's death—as one of sacrilege, in that he thought he had deceived God when he said: I do not know. Am I my brother's keeper? And so the accusation is reserved for his accuser, the Devil, prescribing that he be scourged along with his angels, since he did not wish to be scourged with men. Of such, therefore, has it been said: There is no regard for their death and they shall not be scourged like other men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 14"

[[commentary]]
quote='''
For scourges profit nothing after death. And therefore David, while he was in the life of this body, made himself ready for scourges, that the Lord might receive him chastened. Consider again for me holy Job, who was covered with ulcers and shaken in all his limbs and full of pains in his whole body, dissolving the clods of earth with the matter and moisture of his wounds: how, since he could not recline while placed in this body, he found the rest of death. And therefore, conscious of himself, he said: Death is rest to a man. So he was not moved in his stroke, nor did he waver through any slip of his speech, he who in all those things did not sin with his lips, as Scripture testifies; but rather he found the support of his stroke, through which he was strengthened in Christ. So both Job and David, because they were scourged here, had support in their stroke, because the father scourges the son whom he receives; but those who are not scourged here are not received there as sons. And therefore they are not in the toils of men, and they will not be scourged with men, so that they may be scourged for ever with the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 3"
