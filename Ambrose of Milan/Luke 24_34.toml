[[commentary]]
quote='''
And there is no doubt that this one wrote more broadly, that one more succinctly. For how would they say that he had been seen by Cephas alone, if he had been seen by all? But as among the women he was seen by Mary and by the other Mary Magdalene, so among the men he was seen by Peter early in the morning. And Paul speaks thus: For I delivered to you first of all that Christ died according to the Scriptures, and that he was buried, and that he rose on the third day according to the Scriptures, and was seen by Cephas. And therefore Mark specially introduces the young man bidding the women tell Peter and the disciples that the Lord had risen.

Peter, therefore, alone saw the Lord; for his devotion, always ready and prompt, believed, and therefore he was eager to gather the more frequent signs of faith. Now with John, now alone, yet everywhere he runs untiring, everywhere either alone or first; not content to have seen what he had seen, he goes back to look again, and, kindled with love of seeking the Lord, he is not sated with seeing. He sees alone, he sees with the eleven, he sees with the seventy, he sees also when Thomas believed, he sees when he was fishing; but not content to have seen, impatient in his longing, heedless of the catch, unmindful of danger, yet not unmindful of reverence, when he saw the Lord on the shore, he covered himself with his garment, thinking it too late if he should arrive with the others in the boat. So, when the Lord was walking on the sea, he ran to meet him over the waves of the sea, forgetful of his own nature; so, when the Lord was being held by the Jews, he alone drew a sword against the crowds; so now too, when the Lord had stood on the shore, by a perilous shortcut he hastened his religious homage.

There is no doubt, then, that Peter believed, and believed because he loved, and loved because he believed. Whence he is also saddened, because he is asked even a third time: Do you love me dearly? For he is questioned about whom there is doubt; but the Lord does not doubt, who was asking not that he might learn but that he might teach whom, as he was about to be lifted up into heaven, he was leaving to us as the vicar, as it were, of his love. For so you have: Simon son of John, do you love me? Surely you know, Lord, that I love you dearly. And Jesus says: Feed my lambs. Well aware of himself, Peter testifies to an affection not taken up for the moment but long known to God. For who else is there who could easily profess this of himself? And therefore, because he alone of all professes it, he is preferred to all; for greater than all is charity.

That too must be looked at more carefully, why, when the Lord said: Do you love me? he answered: You know, Lord, that I love you dearly. In this, love seems to me to have the charity of the mind, but loving dearly a certain heat conceived from the ardor of body and mind; and I think that Peter signifies the fervor not only of his mind but also of his body in the worship of God. Indeed the third time the Lord asked no longer Do you love me? but Do you love me dearly? And no longer is he bidden to feed lambs, as at first, to be nourished with a kind of milk, nor little sheep, as the second time, but sheep, the more perfect, that he who was more perfect might govern them.

And therefore, as to one perfect in all things, whom the flesh could no longer call back from the glory of suffering, a crown is decreed. When you were younger he says you girded yourself and walked where you wished; but when you are old, you will stretch out your hands, and another will gird you and lead you where you do not wish. Good is old age, not weak for use through length of life, but prepared for martyrdom by the maturity of virtue; which represses the wantonness of bodily pleasures and does not indulge desires, turns aside from everything sweet, does not seek after what is fair to see; for the flesh lusts against the spirit, and finds for itself crosswise paths of diverse pleasures by which to walk where it wills. But good is the old age of the mind, which chooses not what it thinks sweet to the body but what is useful to the mind, and is not captured by the willful appetite of the body, but is called back, as though unwilling, by a resisting governance.

So Peter too, although he was ready in mind to undergo martyrdom, yet when the danger came, he bent the constancy of his mind; for the enjoyment of the heavenly gift holds us captive by its sweetness. For who would not choose martyrdom, if he could die gladly? So Peter too seems unwilling, but he prepares to conquer. And what wonder if Peter is unwilling, when the Lord says: Father, if it can be, take this cup from me; yet not my will, but yours be done? Indeed after the testing of his presumption Peter no longer dares to promise perseverance of will, but, as if for his own comfort, seeks the companionship of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
