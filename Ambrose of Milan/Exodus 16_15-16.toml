[[commentary]]
quote='''
He who is more curious asks what that is which is sweeter than honey: the minister of God answers him: This is the bread which the Lord has given you to eat. Hear what this bread is: The word, he says, which God has ordained. This ordinance of God, then, this nourishment, nourishes the soul of the wise, and enlightens and sweetens it, shining with the flash of truth, and soothing it as with a honeycomb, so with the sweetness of diverse virtues and with the speech of wisdom. Honeycombs indeed of honey are good words, as it is written in Proverbs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
