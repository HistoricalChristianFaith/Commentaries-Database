[[commentary]]
quote='''
Grant, however, that David erred wantonly: did Christ also err, so that we should think he did not have right judgment? Aptly, then, did David prophesy today, as if to them, saying: Understand, you senseless ones, and you fools, be wise at last. For how could Christ err? It is not right that this should even come into our thoughts. He who planted the ear, does he not hear? Or he who formed the eye, does he not consider? He who chastises the nations, shall he not reprove, he who teaches man knowledge? Is Christ, then, ignorant of how to examine guilt and to hear a just accusation? Could Christ approve wantonness? Did Christ, who chastises the nations, not think that the adulteress should be reproved? Christ, who knows the inner things of each one's heart, teaches the knowledge of the Law: could he either be deceived by an error or judge against the tenor of the Law? And how did he himself say: I came not to destroy the Law but to fulfil it? Could Christ, who condemns hidden things, overlook things made public? Can Christ, who made the times, not know the times? He who knows the vain thoughts of men, does he not know the criminal ones also?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 1"
