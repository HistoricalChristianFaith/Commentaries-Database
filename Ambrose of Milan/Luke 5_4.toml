[[commentary]]
quote='''
Finally, though the others are commanded to let down their nets, yet to Peter alone is it said: put out into the deep, that is, into the depth of discourses. For what is so deep as to see the depth of riches, to know the Son of God, and to take up the profession of the divine generation? Though the human mind cannot comprehend it by the investigation of full reason, yet the fullness of faith embraces it. For though it is not permitted me to know how he was born, yet it is not permitted me not to know that he was born. I do not know the sequence of the generation, but I acknowledge the authority of the generation. We were not present when the Son of God was born of the Father, but we were present when he was called the Son of God by the Father. If we do not believe God, whom do we believe? For all that we believe we believe either by sight or by hearing. Sight is often deceived; hearing is in faith. Or is the person of the one who asserts it called into question? If good men said it, we would think it wicked not to believe: God asserts it, the Son proves it, the sun fleeing confesses it, the trembling earth bears witness. Into this deep of discourse the Church is led by Peter, to see on the one side the Son of God rising again, on the other the Holy Spirit flowing forth.

And what are the nets of the apostles which they are commanded to let down but the interweavings of words, and, as it were, certain folds of speech and recesses of discourses, which do not let go those whom they have caught? And well are nets the apostolic instruments of fishing, which do not kill those they catch, but keep them, and draw them out of the deep to the light, and lead those tossed by the waves from the lowest things to the things above.

There is also another apostolic kind of fishing, the kind with which the Lord bids Peter alone to fish, saying: cast a hook and take the fish that comes up first. Great indeed and spiritual is the lesson by which Christian men are taught that they ought to be subject to the higher powers, lest anyone think that the ordinance of an earthly king may be dissolved. For if the Son of God paid the tax, who are you, so great, that you think it ought not to be paid? And he paid the tax who possessed nothing; but you, who follow the gain of the world, why do you not acknowledge your duty to the world? Why do you carry yourself above the world with a certain arrogance of mind, when you are subject to the world by a wretched greed?

So the didrachma is paid, which was the price of our redemption and of our body, set forth beforehand in the Law, paid in full in the Gospel, found not idly in the mouth of a fish; out of your mouth indeed you will be justified. For our confession is to us the price of immortality, because, as it is written, with the mouth confession is made unto salvation.

And perhaps this first fish is the first martyr, having in his mouth the didrachma, that is, the price of the tax. Our didrachma is Christ. That first martyr, then, namely Stephen, had a treasure in his mouth when he spoke Christ in his passion. But let us return to the passage set before us and learn the apostolic humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
