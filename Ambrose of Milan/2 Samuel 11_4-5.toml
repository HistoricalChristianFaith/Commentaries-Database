[[commentary]]
quote='''
And so, unless I am mistaken, by the prophet we shall understand the Holy Spirit, while by the adulteress we may reckon the various fornications of the synagogue. And therefore we see it revealed long before that from the Holy Spirit and from the family of the Jews, whose are the fathers, of whom is Christ according to the flesh, the Lord Jesus was to be begotten, who indeed, as a Jew, was born of an adulterous family, but, as one spotless, of a virgin. The family of the Jews was under the Law, was as it were under a husband. The observance of the Law had to be abolished, so that truth and grace might be put in its place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 7"
