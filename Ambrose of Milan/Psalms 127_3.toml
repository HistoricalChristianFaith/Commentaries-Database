[[commentary]]
quote='''
The Holy Spirit knows his own speech and never forgets it, and prophecy is fulfilled not only by the wonders of events but also by the propriety of words. Who is this fruit of the womb but he of whom it was said: Behold, the inheritance of the Lord, sons; the reward, the fruit of the womb? That is: the sons are the inheritance of the Lord, who are the reward of that fruit, of him who came forth from the womb of Mary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
