[[commentary]]
quote='''
A most beautiful passage on the faith is joined on, when he says that all things have been delivered to him by his Father. When you read all things, you recognize the Almighty, not faded in hue, not degenerate from the Father; when you read delivered, you confess the Son, to whom by nature all things are his own by right of the one substance, not conferred as a gift through grace. He added: no one knows who the Son is except the Father, and who the Father is except the Son, and he to whom the Son wills to reveal him.

I recall that this passage was not passed over in the books which I wrote on the faith. But that you may know that, just as the Son reveals the Father to whom he wills, so also the Father reveals the Son to whom he wills, hear the Lord Jesus himself speaking, when he praised Peter because he had confessed that he was the Son of God: blessed are you, Simon Bar-Jona, for flesh and blood has not revealed it to you, but my Father who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
