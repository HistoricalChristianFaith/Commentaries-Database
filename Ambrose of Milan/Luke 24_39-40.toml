[[commentary]]
quote='''
Someone says: How then did Thomas, while he did not yet believe, nevertheless touch Christ? But he seems to have doubted not about the Lord's resurrection but about the quality of the resurrection, and by his touch he had to teach me, as Paul too taught: For this corruptible must put on incorruption, and this mortal put on immortality, that the unbelieving may believe and the hesitant may be unable to doubt; for we more easily believe what we see. Now Thomas had cause for wonder when he saw, with all things shut, a body brought in through enclosures impassable to bodies, the structure unbroken; and therefore it is a wonder how a bodily nature poured itself through an impenetrable body, with an invisible entrance, a visible appearance, easy to touch, hard to understand.

Indeed the disciples, troubled, thought that they were seeing a spirit, and therefore the Lord, to show us the form of the resurrection, Handle me he says and see, for a spirit does not have flesh and bones, as you see that I have. Not, then, through an incorporeal nature, but through the quality of a bodily resurrection, he passed through what was shut and impassable to ordinary use. For what is touched is body, what is handled is body; and in the body we rise again; there is sown indeed a natural body, there rises a spiritual body, but that body is finer, this one coarser, as being still compacted with the quality of earthly decay.

For how was it not a body, in which there remained the marks of the wounds, the traces of the scars, which the Lord offered to be handled? In this he not only strengthens faith, but also sharpens devotion, in that he chose to carry into heaven the wounds received for us, and would not abolish them, that he might show to God the Father the price of our freedom. Such a one the Father places at his right hand, embracing the trophies of our salvation; such were the martyrs he showed us there by the crown of his scar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
