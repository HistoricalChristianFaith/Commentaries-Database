[[commentary]]
quote='''
And Jesus returned in the power of the Spirit into Galilee. In this place is fulfilled the prophecy of Isaiah, who says: the region of Zebulun and the land of Naphtali, and the rest who inhabit the coast, and those along the seaside and beyond the Jordan, of Galilee of the Gentiles, the people that sat in the shadow of death, have seen a great light. For who is the great light but Christ, who enlightens every man coming into this world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
