[[commentary]]
quote='''
Do you wish to know that Adam was not with Christ? The Lord said to him: Adam, where are you? He who seeks him as though absent would certainly not say "where are you?", if he knew that he was abiding in him. But let us hear who made him absent: They hid themselves, he says, both, from the face of the Lord. Christ sees all, but he who hides himself is hidden, since he who does not know shall not be known; for the Lord knows those who are his. He wishes all whom he has founded and created to be his own. Would that you, O man, did not flee and hide yourself from Christ! He seeks even those who flee and does not wish the hidden to perish, but calls out, saying: Adam, where are you?, that is: "Man, where are you? I placed you in the light; you have sought the darkness".

Finally, in paradise, where it is always the day of morning, evening came, since all sins are dark. Therefore you have it that they heard the voice of the Lord God walking towards evening in paradise. At the same time recognize the mystery. In the morning you went astray; at evening you are set free. For how can there be evening where Christ is? For although his seat is above the heaven of heavens, yet Christ is in his saints. How, then, can there be evening where God is, since God is light?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
