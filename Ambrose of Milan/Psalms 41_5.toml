[[commentary]]
quote='''
From here too the Savior begins more and more to open the sacrament of his Passion, which without doubt agrees with the Gospel. For the Jews were cursing him, seeking his death, lying in wait for him, pressing him hard, not bearing the glory of his work as it grew daily. This, then, the prophecy announces which was fulfilled in the Gospel: my enemies have spoken evil to me: when will he die and his name perish? Madmen, who believed that the author of life could die! But the Church was destroying their wishes, believing that even when dead, according to the condition of the body, he would increase his name. And therefore she sang to him, saying: I will be mindful of your name in generation and generation; she repeated: your name is ointment poured out. Those will die who presume that you can die; I shall not die, who know you as the arbiter of life, the author of salvation. For we know that at the time of the Passion and resurrection the disciples were praying, gathered together, when Magdalene announced to them that the Lord had risen, and when the Lord, the door being shut, showed himself to them in the body of the resurrection, when Thomas saw his wounds and believed. The Jews, then, were mocking him as one dead, but the Lord was revealing himself alive to the apostles. When, then, the Jews said: behold, the whole world has gone after him, when they said that he was leading the people astray by his wonderful works, what else were they saying but: when will he die and his name perish? And therefore at his Passion they cried out: take away, take away from the earth such a one as this, let him be crucified, let him be crucified. What they asked was done: he was taken away from the earth, he rose again, he ascended into heaven, and out of us he re-formed his kingdom in the seats of paradise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
