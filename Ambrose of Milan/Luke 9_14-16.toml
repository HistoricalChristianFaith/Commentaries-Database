[[commentary]]
quote='''
And there is a difference not only of bread and of number, but also of reclining; for those sit down upon the grass, these recline upon the ground; upon the grass the five thousand, upon the ground the four thousand. It is more to press the ground than to lie upon the grass; for those who still have bodily senses delight in softer things, and therefore recline upon the grass — for all flesh is grass — but these upon the ground, which brings forth wheat and wine and the olive, obtain the food of grace. Those sit down, these recline; for there is a certain greater rest in one who reclines. There two fishes, here without number; hence many have thought that the grace of the sevenfold Spirit is to be understood as defined in the loaves, and in the fishes too the figure of the twofold Testament.

We are not reluctant, then, to think that the four thousand, gathered from the four parts of the world, in which the Church is figured, take food of greater grace, according to what is written: because they shall come from the east and the west and from the north and the south, and shall recline with Abraham and Isaac and Jacob in the kingdom of heaven. Hence here thanks are given to the Father by Christ; for not in vain is there only a blessing in the one place, but here also a giving of thanks. For the Lord is wont to give thanks to the Father for his Church, because what he hid from the wise he has revealed to little ones. The blessing, then, is upon us, who are lower; the thanksgiving upon those who by sacred sufferings have triumphed over the infirmities of their bodies. We have already touched on this above, that whereas they are bidden to sit down by fifties, though with a sacred number defined, here, however, there seems to be the people of a more firmly founded Church, which reclines without any defining of number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
