[[commentary]]
quote='''
Let us learn, therefore, that the temptations of the Devil are full of guile. Of the things that he promised, scarcely one of them seems to be true. He contrived falsehoods, as we can see if we read elsewhere: And the serpent said to the woman, you shall not die. Here we have one falsehood, for man, who followed the promises of the serpent, is subject to death. Hence he added: For God knows that when you eat of it, your eyes will be opened. This alone is true, because further on we read: They both ate and their eyes were opened. But the truth is that as a result of this act harm followed. Hence, opening one's eyes is not to everyone's advantage, for it is written: They will see and will not see. But the serpent was quick to attack a falsehood to his statement, when he said: And you will be like gods, knowing good and evil. Hence you may note that the serpent is the author of idolatry, for his cunning seems to be responsible for man's error in introducing many gods. His deceit lay in stating that they will be like gods, for not only have men ceased to be like gods, but even those men who were like gods (to whom it was spoken, I have said you are gods) have fallen from His favor.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 13"
