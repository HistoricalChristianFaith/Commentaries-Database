[[commentary]]
quote='''
It was said also of John, that he shall be great, but of him indeed as of a great man, of Christ, as of the great God. For abundantly is poured forth the power of God; widely the greatness of the heavenly substance extended, neither confined by place, nor grasped by thought; neither determined by calculation, nor altered by age.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the angel of the Lord said to her: Fear not, Mary; for you have found grace with God. And behold, you shall conceive in the womb and bear a son, and you shall call his name Jesus. He shall be great.

It was said indeed by the angel of John too that he shall be great; but that one great as a man, this one great as God; for great indeed is the Lord and greatly to be praised, and of his greatness there is no end. And truly that one too is great, because among those born of women there is no greater prophet than John the Baptist. Yet he has one greater, because he who is least in the kingdom of God is greater than he. John, then, is great. But before the Lord even the great John drinks no wine or strong drink, while this one eats and drinks with tax collectors and sinners. Let the one, who had no power by nature, gather merit by abstinence; but Christ, who had by nature the means to forgive sins, why should he shun those whom he could make better than the abstinent?

At the same time, in the mystical sense, he does not disdain the banquet of those to whom he is to give the sacrament. So this one eats, the other fasts, a type of both peoples: in the one there is fasting, in this one feeding. But Christ too fasted, so that you might not shun the precept; he ate with sinners, so that you might see his grace and recognize his power. John, then, is great too, but his greatness has a beginning, has an end; whereas the Lord Jesus is himself the end and the beginning, himself the first and the last. Nothing before the first, nothing beyond the last.

Nor let the custom of human generation draw you into error, so that you think he is not first because he is Son. Follow the Scriptures, so that you cannot go wrong. The Son is called first. It is read too that the Father also is alone, who alone has immortality and dwells in light inaccessible, as you have read: and to the immortal, only God; but neither first before the Father nor alone without the Son. If you deny the one, you assert the other: follow both, and you confirm both. He did not say: 'I am the former and I am the latter', but: 'I am the first and I am the last'. The Son is first and therefore coeternal; for he has the Father, with whom he is eternal. I dare to say: 'The Son is first, but he is not alone', and I say it rightly and I say it devoutly. Why do you prick up your ears for impiety, heretics? You have fallen into the snares that you lay. The Son is first and is not alone: first, because he is always with the Father; not alone, because he is never without the Father. It is not I who say this, but he himself said: And I am not alone, because the Father is with me. The Father alone, because one God; the Father alone, because the divinity of the Father and of the Son and of the Holy Spirit is alone, and what is one is alone. The Father alone, the Only-begotten alone, the Holy Spirit too alone; for he who is Son is not also Father, nor he who is Father also Son, nor he who is the Holy Spirit also Son. The Son is one, the Holy Spirit another; for we read: I will ask the Father, and he will give you another Paraclete. God alone, because one God, from whom are all things; the Son alone, because one Lord, through whom are all things. It is the divinity that makes one alone. Generation bears witness both to the Father and to the Son, so that nowhere is the Son seen to be without the Father or the Father without the Son. So he is not alone, because he is not alone immortal; nor does he alone dwell in light inaccessible, because no one has ever seen God except the only-begotten Son, who is in the bosom of the Father, who sits at the right hand of the Father. And some dare to say that the light which the Father dwells in is inaccessible to him. Is the light, then, better than the Father? But what light is inaccessible to him to whom the Father is not inaccessible, the Father who is himself the true light and the begetter of the eternal light, of which it was said: That was the true light, which enlightens every man coming into this world? Consider whether that is not the inaccessible light which the Father dwells in, and the Son dwells in too, because the Father is in the Son and the Son in the Father.

Rightly, then, great; for the power of God is poured out far and wide, the greatness of the heavenly substance extends far and wide. The Trinity has nothing prescribed, nothing circumscribed, nothing measured out, nothing measured off. It is not shut in by place, not grasped by opinion, not enclosed by estimation, not changed by age. The Lord Jesus indeed gave greatness to men; for their sound indeed went out into all the earth, and their words into the ends of the world; yet not into the ends of the universe, not into the ends of heaven, not beyond the heavens. But in the Lord Jesus all things were created in the heavens and on the earth, visible and invisible, and he is before all, and all things hold together in him. Look at heaven, Jesus is there; gaze at the earth, Jesus is present; ascend in word into heaven, descend in word into the underworld, Jesus is present. For if you ascend into heaven, Jesus is there; if you descend into the underworld, he is present. Today, while I speak, he is with me, within this point, within this moment; and if a Christian is speaking now in Armenia, Jesus is present; for no one indeed calls Jesus Lord except in the Holy Spirit. If in thought you penetrate the abysses, there too you will see Jesus at work; for it is written: Do not say in your heart: Who has ascended into heaven? that is, to bring Christ down; or who has descended into the abyss? that is, to bring Christ back from the dead. Where, then, is he not, who has filled the things of heaven, the things below, the things of earth? Rightly, then, is he great whose power has filled the world, who is everywhere and will be always, because of his kingdom there shall be no end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
