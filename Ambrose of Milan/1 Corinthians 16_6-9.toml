[[commentary]]
quote='''
Hence the Apostle too, as a disciple of Christ who knew that there is a diversity of times, writing to the Corinthians says: With you he says perhaps I shall remain and spend the winter; and below: But I shall remain at Ephesus until Pentecost; for a great door has been opened to me. So with the Corinthians, by whose errors he was distressed, he spends the winter, because their affection towards the worship of God had grown cold; with the Ephesians he celebrates Pentecost and hands on the mysteries to them, and relaxes his mind, because he saw them glowing with the ardor of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
