[[commentary]]
quote='''
One is a slave to an evil mistress, the appetite, that is always seeking and is never satisfied. For what is more insatiable than the stomach? To-day, it receives, to-morrow it demands. When it has been filled there is talk about temperance: when it has digested its food, farewell is bidden to virtues, it seeks indulgence. Between cups philosophy is lauded, among philosophers wines are praised. Watchings he says, and choler, and gripes are with an insatiable man. He eats and a little later he repents him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 8"
