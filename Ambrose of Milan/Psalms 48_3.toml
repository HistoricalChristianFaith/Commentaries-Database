[[commentary]]
quote='''
And since the remnant of the Jews has been saved through the election of grace, in them God is known, in Peter, Paul, John, James, who, weighty and lofty men, are as it were the foundations and summits of the Church: like weighty foundations, since no heavy blasts of the north wind have shaken them, but unmoved they have kept the foundation of faith, so that the whole Church should not totter; most lofty like summits, since they have raised up its peak with the towers of their virtue. For just as a founder is recognized in his works and a builder in his buildings, so that, even if you do not hear the name, you nevertheless discover the craftsman from the quality of the works — and what wonder in human things, when of the eternal Creator himself, who is not seen by us, we yet understand the invisible things through the things that are made? — so in lofty and great houses, which house we are, if we hold the foundation of freedom and glory firm to the end, God the indweller is recognized, as the God of Abraham, the God of Isaac, the God of Jacob. For he is the true God who founded such men by the instruction of his precepts. Therefore, just as in them he showed himself the eternal God, so, he says, when he shall take up the city of the great king, he will pour into her steps the reception of the knowledge of himself, so that those may become taught of God who have both heard his commandment and judged that it must be carried out, lest they fall away from the firmness of that house built upon the rock.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
