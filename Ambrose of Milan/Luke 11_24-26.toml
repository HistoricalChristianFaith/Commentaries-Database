[[commentary]]
quote='''
When the unclean spirit has gone out of a man, he walks through places that have no water, seeking rest and not finding it. It cannot be doubted that this was said of the people of the Jews, which the Lord, in what went before, separated from his kingdom. Hence understand that all heretics and schismatics too are separated from the kingdom of God and from the Church. And therefore it is clearly evident that every assembly of schismatics and heretics is not of God but of the unclean spirit. So in one man there is a comparison of the whole Jewish people, from which the unclean spirit had gone out through the Law. But since among the nations and the Gentiles it could not find rest, through the faith of Christ — for Christ is a burning to unclean spirits, he who in the hearts of the Gentiles, which before were dry and afterwards through baptism grew moist with the dew of the Spirit, had quenched the fiery darts of the adversary —, therefore it went back to the people of the Jews, which, adorned with an outward and perfunctory appearance, remains more polluted in its inner mind. For it neither washed away nor quenched its burning with the stream of the sacred font, and rightly the unclean spirit returned to it, bringing with it more wicked spirits, since with a sacrilegious mind it had offended against both the week of the Law and the mystery of the eighth day. So, just as for us the grace of the sevenfold Spirit is multiplied, so for them every injury of the unclean spirits is heaped up; for totality is sometimes comprehended in this number, because on the seventh day, the works of the world being completed, God rested. Therefore also the barren has borne seven, and she who was populous in sons has been weakened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
