[[commentary]]
quote='''
Two he says debtors there were to a certain moneylender: one owed five hundred denarii, the other fifty.

Who are these two debtors but two peoples, one from the Jews, the other from the Gentiles, indebted to that moneylender of the heavenly treasury? One he says owed five hundred denarii, the other fifty. No ordinary coin is this denarius, on which the image of the King is formed, which bears the Emperor's trophy stamped upon it. It is not material money that we owe this moneylender, but merits tried in the balance, the coin of virtues, whose worth is weighed out by the heaviness of gravity, by the appearance of righteousness, by the ring of confession. Woe to me if I do not have what I received; or, since it is hard to find anyone who can pay this moneylender the debt in full, woe to me if I do not ask: 'Forgive me the debt!' For the Lord would not have taught us to pray so, that we should ask that our debts be forgiven us, unless he knew that few would be solvent debtors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
