[[commentary]]
quote='''
Could he be ignorant of these things, whom nothing escapes? The underworld is naked in his sight, and there is no covering for the most wicked, because they cannot lie hidden. He stretches out the north over nothing, he hangs the earth upon nothing, binding up the water in his clouds, and the cloud is not rent beneath his feet. The pillars of heaven have leapt apart and have trembled at his rebuke. By his power he has calmed the sea, and by discipline he has laid low the great fish of the sea. The bars of heaven dread him: by his command he put to death the apostate dragon. Who understands the power of his thunder?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
