[[commentary]]
quote='''
The foxes have holes and the birds of the air nests, where they may rest; but the Son of Man has nowhere to lay his head. It does not seem consistent with reason that we should judge this man simple and faithful who is rejected from the Lord's favor, though he had pledged the obedience of untiring service; but the Lord seeks not the appearance of obedience but purity of disposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
But the Lord does all things wonderfully. He neither receives that man who offers himself rashly, nor is he moved on his own account against these who undevoutly reject the Lord, to show that perfect virtue has no zeal for revenge, and that there is no anger where there is the fullness of charity, and that weakness is not to be shut out but helped. Far from religious men be indignation, far from the great-souled the desire for revenge, far too from the prudent an inconsiderate attachment and an incautious simplicity. Hence it is said to this man too: the foxes have holes, and the obedience of him whose service is not approved is not admitted. For the hospitality of faith ought to be circumspect, lest, while we unbar the inner rooms of our house to unbelievers, we slip by improvident credulity into the snares of another's unbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
