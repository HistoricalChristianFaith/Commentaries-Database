[[commentary]]
quote='''
But for what reason he said that the birds came down upon the divided bodies of the heifer, the she-goat and the ram, I do not easily find, unless it is that all things earthly, maritime and even aerial are full of snares and disturbances. For these birds seem to have come down upon the bodies for the sake of food. And by nature the more violent and those stronger in might rush upon the weaker, and fall upon them as though upon dead bodies, often rushing in unexpectedly; or, as I think more truly, because the prince of this world and the birds of heaven, the spiritual wickednesses which are in the heavenly places, assail with grievous onset those who are divided by worldly anxiety and care, and tear them like the corpses of the dead with harsh tooth. For of these it was said: Leave the dead to bury their dead, because they are of the kingdom of the devil, who is divided against himself. But those who are of the kingdom of God, to whom Jesus says: The kingdom of God is within you, these are not divided, because they cling to God, for he who clings to a harlot is one body; for the two, it says, shall be in one flesh. But he who clings to the Lord is one spirit. These, then, are not dead bodies, for the birds of heaven to eat them, but they are spirits; for his angels God makes spirits. Indeed they did not come down upon the dove and the turtle-dove, because these birds had not been divided; for the just are not divided, to whom it is said that they should be simple as doves. And so David says that the sparrow has found itself a house, and the turtle-dove a nest for herself, where she may lay her young. These things Abraham was watching, these he was considering with a deep and spiritual gaze.

And so it is written: Abraham sat down by them, not as an interpreter of haruspicy but as an interpreter of heavenly revelation, searching out the signs of the divine working. For the mind directed to the grace of Christ saw that this world is full of iniquity, which flies as it were from the height of heaven and crushes the lowest of the earth, but that chastity, faith and sincerity are subject to no passions, while avarice and the anxieties of the world, by which those who have the pleasures of riches are choked, are torn apart and divided. Hence riches too have been called the cares and thoughts of this world, because they divide the mind, split it in different directions, drag it into parts, and do not allow it to be incorrupt and whole. So the man of peaceable mind sat by and considered how far he could ward off at close quarters those evils which are brought upon men; for the mind of the wise and just man is eager to heal human misfortunes and to ward off and cut away the troubles of our souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
