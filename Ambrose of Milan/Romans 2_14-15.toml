[[commentary]]
quote='''
What is sin, if not the violation of divine law and the disobedience to heavenly precepts? Not by the ear, but by the mind, do we form a judgment regarding injunction from above. But with the Word of God before us we are able to formulate opinions on what is good and what is evil. One of these we naturally understand should be, as evil, avoided, and the other we understand has been recommended to us as a good. In this respect we Seem to be listening to the very voice of the Lord, whereby some things are forbidden and other things are advised. If a person does not comply with the injunctions which are believed to have been once ordained by God, he is considered to be liable to punishment. The commands of God are impressed in our hearts by the Spirit of the living God. We do not read these orders as if they were recorded in ink on a tablet of stone. Hence, in our own thought we formulate a law: For if the Gentiles who have no law do by nature what the law prescribes, those having no law of this kind are a law unto themselves. They show the work of the law written in their hearts. There is something, therefore, like the Law of God which exists in the hearts of men.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 8"
