[[commentary]]
quote='''
He signifies that the works of the Lord's medicine were begun on the sabbath, so that the new creation might begin where the old creation had before left off, and that he might show at the very beginning that the Son of God is not under the law but above the law, and that the law is not undone but fulfilled. For the world was made not through the law but by the word, as we read: by the word of the Lord the heavens were made firm. So the law is not undone but fulfilled, that there may be a renewal of man, who was already falling. Hence the Apostle too says: stripping off the old man, put on the new, who has been created according to Christ. And well did he begin on the sabbath, to show himself the Creator, who wove works into works and pursued the work which he himself had already begun; as when a builder sets about renewing a house, he begins to undo the old not from the foundations but from the roof. And so he first puts his hand where he had before left off.

Then he begins from lesser things to arrive at greater. Men too can free from a demon, but by the word of God; to command the resurrection of the dead belongs to the divine power alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
