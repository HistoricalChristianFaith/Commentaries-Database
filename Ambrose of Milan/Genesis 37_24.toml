[[commentary]]
quote='''
And as for the pit being dry, what wonder if the pit of the Jews has no water, since they have forsaken the fountain of living water and have made for themselves broken pits? And that you may know that this is truly a mystery, the Lord himself says of himself: They placed me in the lower pit, in darkness and in the shadow of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
