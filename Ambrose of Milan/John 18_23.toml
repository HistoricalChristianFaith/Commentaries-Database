[[commentary]]
quote='''
For the Lord Jesus himself truly was silent when he was accused, and when he was struck did not strike back. Indeed, when struck he answered: If I have spoken evil, bear witness of the evil; if well, why do you strike me? See how, as if truly weak and as one who could not avenge himself, he spoke with a kind of childlike affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
