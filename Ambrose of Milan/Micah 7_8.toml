[[commentary]]
quote='''
And we, although we are sorrowful in this world, and the enemy rejoices in our grief and in the contrition of our heart and mind, yet by rising again we destroy his joy. Whence Micah too said: do not rejoice over me, O my enemy, because I have fallen, for I shall rise again. It is the resurrection, then, by which all the chains of the enemy are loosed and his every triumph is abolished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
