[[commentary]]
quote='''
And so those who kept the solemnity of the sabbath according to the Law called it the one of the sabbath, as though there were one sabbath and not another. We, who have put on a spiritual observance and desire to shape our warfare after the likeness and the rest of God, and to render our service in that heavenly city where there is no copy, no shadow, but truth, say the first of the sabbath, as it is written: But in the evening of the sabbath, which dawns into the first of the sabbath. Nothing is more beautiful, nothing more explicit. Before the resurrection he said 'sabbath'; after the resurrection he called it 'the first of the sabbath'. John the Evangelist also says: On the first of the sabbath Mary Magdalene came in the morning, while it was still dark: darkness for the time, morning for grace.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
