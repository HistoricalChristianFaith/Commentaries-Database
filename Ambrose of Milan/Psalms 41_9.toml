[[commentary]]
quote='''
"But why do I accuse the others?" says the Lord Jesus; "what wonder if the people did not know me and adjudged me to the cross, when my own apostle exacted the price of betrayal, when my own table-companion sold my death? For indeed the man of my peace, in whom I hoped, who ate my bread, has enlarged the supplanting over me". Some think that Judas should be excused, because he paid back the money which he had received as the price of the purchase. But see, he is condemned beyond the unbelief of the Jews; for from him to whom more has been given more is required. "Why", he says, "should I complain of the others? The man of my peace, to whom I had given my peace, to whom I had wished to leave my peace, led the persecutors to me and handed me over, and he deceived me, in whom I hoped". Was he unaware that he would be his betrayer, he who had foretold of him: one of you will betray me? Surely not. But to condemn him the more, he said that he had hoped in his faith. Aquila said I had trusted, Symmachus put I was trusting. For we bear more heavily upon one in whom we say we had very great hope or confidence, if afterwards he has disappointed our hope and our good opinion.

At the same time he shows how great is the force of divine sanctification, which shuts out malice and amends a depraved character, if the form of a better purpose is joined to it. How many we know to have been converted! That Zacchaeus was changed, the publican intent on gain with an avaricious disposition, who afterwards paid for his error with a fourfold restitution, condemned avarice in himself, forswore the gains of his former time, and made it good to the poor if the claimant was lacking. The thief himself changed his wickedness by a better purpose, recognized Christ on the cross, confessed the Son of God, called him king with his own voice. At the time when very many righteous men were wavering, when the apostles themselves were certainly in hiding, the centurion, the very executioner, did not deny him. Why do I speak of the time of the Gospel? Rahab was a harlot, who fed herself on the wages of unbelief and incontinence. Yet when she saw the spies whom Joshua son of Nun had sent, she put on faith, and with danger hanging over her she kept righteousness, and did not betray those she had taken in, but protected them with faithful kindness. Therefore, then, he says that he had hoped, as though he had rightly presumed that the apostle would lay aside his former ways and follow better ones, and that he who had received the office of sanctifying others would himself guard in himself the grace of holiness and cleave to the duties of sincerity. Rightly he says I hoped, because he gave man the free choice of what to follow. I have set, he says, before you good and evil. If you choose evil, it is not nature that sins, but the disposition of the one who chooses. If every man who has chosen evil is condemned, what do we say of Judas, who betrayed him to whom he was joined in the sweetness of the banquet?

Who ate, he says, my bread, has enlarged the supplanting over me. Why is it that he added "my bread"? He could have said: "who ate bread with me", unless you understand that nourishment which is peculiar to Christ, that is, the nourishment of the heavenly Word; not indeed by bread alone does man live, but by every word of God. Indeed, elsewhere he says: who always took sweet food with me. We rightly use these verses against those who have thought that men should be killed with whom they are seen to have feasted. The Gentiles are recorded to observe this, enemies for the most part, robbers even, that they spare those with whom they recline at table. Hence, because of a disposition of this kind belonging to the grace of the banquet, if we consider the words, not idly did he speak of sweet food. For how are they sweet which quickly spoil? But see whether he did not call the words of life sweet food; for no bitterness spoils this food, no corruption of death defiles it. Whence he also said "always". For no one can always be eating, but we can always cleave to the word of God, by night and by day, if we meditate on the law of God day and night.

What, too, is "has enlarged"? The Greek said ἐμεγάλυνεν, that is, "has magnified". The Lord set out for us both points that might move us, saying in the Gospel: he who eats bread with me has lifted up his heel over me. Let us consider whence this expression has been taken: we were, he says, unbelieving, erring, serving desires and pleasures. Let us confess our error, that we may be washed clean. I too, as a boy, saw an athlete who, when he had thrown his adversary, struck him on the forehead with his heel, which was a sign that he was insulting the vanquished. This is what he says: has magnified the supplanting over me, by which word he declared the boastfulness of one who insults. Judas too, then, lifted his heel over Christ when he betrayed him, but he did not lift it with impunity. Adam still lifts the heel which was wounded by the serpent. And surely Christ had washed his feet, he had heard him saying: he who is washed needs only to wash his feet, but is clean all over. But what grace had washed, unbelief had defiled. Judas, then, lifted his heel to the wound. Truly he did not hold the head who lifted his heel over Christ. Adam lifted it over himself, this man over Christ, and therefore the serpent wounded him more grievously than the rest. He lifted his heel who offered the deceitful kiss, by which to supplant his author, and therefore it is written in the prophet: he has enlarged the supplanting over me. Esau too says of his brother: he has now supplanted me twice. He who supplants practises a deceit by which he throws down or wounds his adversary. Therefore Judas too is said to have supplanted, because by his kiss he inflicted a wound, by which he showed the persecutors the sign for seizing the Savior. He supplanted, then, like a serpent, which pours poison from its mouth and wounds the heel with its tooth; for this man too wounded not the divinity of Christ, but the heel, the extremity of the body. Judas also lifted his heel like an insolent and proud wrestler, with which to strike the head of the Savior. But he could not strike the head of Christ, because the head of Christ is God. His own head, indeed, he bound with the knot of a hideous noose, so as to take away from himself the remedy of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
See whether you can devoutly apply that which the holy patriarch Jacob said in Genesis, when he was prophesying of his sons: Dan shall judge his people as one tribe in Israel, and: let Dan be as a serpent sitting in the way and in the path, biting the heel of the horse, and the rider shall fall backward, awaiting salvation from the Lord. We read indeed that Samson, of the tribe of Dan, was a judge in Israel, but another is signified here, one to come, who, proceeding from that tribe, will afflict the people with the punishments of sacrilegious ungodliness, that Antichrist who will sit in the temple as though he were God, truly judgement, which is what the interpretation holds; for Dan signifies judgement. And beautifully he said that he will judge his own people, he who will become liable to perpetual punishment; for he who does not believe is already judged, but he who believes will not be judged, because he believes in the Son of God, the Redeemer of his soul. And therefore, as one free of judgement, he says: he who judges me is the Lord. He will judge, then, the people of ungodliness, not the folk of faith; for those are judged who fall by the ruin of unbelief, not those who rise again by the freedom of faith.

He will sit, therefore, in the way and lie in wait in the path like a serpent, to wound those who pass by and to bite the heel of our horse; for the soul of the faithful he will not be able to wound. But in what way will he sit and in what path, if not those from which, as we read, Christ the Lord called the people of the nations to his supper, saying: go out into the ways and round the hedges and compel them to come in, that my house may be filled? And since Judas likewise is read to have amplified the supplanting over Christ, he himself seems to be signified in this place, in that he was to bite the heel of the horse on which Christ the Lord was carried. Whence it was said: your riding is salvation, because his flesh was to take up the sin of the whole world, so that salvation might succeed in place of destruction and eternal life in place of death. Wounded, then, was the horse that alone is not false for salvation; wounded was the horse which took up the sins of the whole world and bore our burdens and was not wearied; wounded was the horse which did not know how to neigh in the frenzy of lust. And therefore perhaps to John the Evangelist heaven was shown opened and a white horse, upon which sat one having diadems on his head and a name written on his thigh: King of kings and Lord of lords. White was he who was immaculate, who had known no defilements of sin. For if lust is dark, rightly holiness shines and gleams. This horse, then, was wounded, but not held back. Indeed, with the very wound he rose again from the tomb, ran to heaven above all the angels and archangels, and was found swifter than all the cavalry of the heavenly host, above even those fiery horses by which Elijah was carried off. And deservedly swifter, he who ascended above all the heavens and above the heaven of heavens to the seat of God almighty, and sits there, as Scripture has taught us, saying: hereafter you will see the Son of Man sitting at the right hand of power.

This horse, then, was shown beforehand too, in a figure, in the time of the Maccabees, the horse which that captain of the heavenly host sat, gleaming in golden armour, who laid low, struck down Heliodorus, that plunderer of the widows' deposit and of the other things which had been committed to sacred keeping, and afterwards, won over by the prayers of Onias the priest, restored him to the use of life. Hence golden armour truly gleamed on him, because he alone sat this horse and conquered, on which no one came through free from guilt: not Enoch, who was carried off lest malice should change his heart, not Abraham, not Isaac, not Jacob, not Moses. For all are under sin, all under death. Indeed, death reigned from Adam to Moses. He alone it is who did no sin; Christ alone it is who took away the sin of the world, who said to death: where, O death, is your victory? where, O death, is your sting?

How, then, did Judas amplify his supplanting over him, and how did the rider fall backward? As to what is in Judas, he practised deceit; as to what is in Christ, he suffered willingly. We often see the stronger man wish to be struck, so that, provoked, he may rise up more fiercely and be roused more vehemently. The serpent, then, bit the heel of the horse and spewed out the venom of his deceit; the rider willingly threw himself down, willingly fell, so as to raise us up. Yet what is it that Scripture says: and the rider shall fall backward? Why backward, except that he might guide from behind those who follow him? Peter was behind, to whom he said: go back behind me; behind were the apostles and the other disciples. Therefore he fell backward, because those upon whom he falls he saves. Everyone indeed who falls upon this stone, he says, will be shattered; but upon whomever it falls, it will cleanse him. Others have: it will winnow him, others: it will crush him. For he who winnows the grain cleanses it of chaff; he who crushes something reduces it to powder, so that the softness of the powder may be of use either in a healthful drink or in the rest of medicine. Hence we gather that we must take care lest anyone, once received by Christ through baptism, stray from his body, that is, be shaken out of the Church; for that is the ruin of perpetual death. But him who comes to believe in Christ, so that his death may find him, his cross take him up, his nail fix him, his blood pour over him, his burial too wrap him round, the grace of his resurrection lift him up, rouse him from sleep, give him life from death, him, I say, he frees from the world, cleanses from sin, heals from his wound, bends from the hardness of ungodliness, softens to the gentleness of devotion, so that with a circumcised heart he may draw in that sweet and incomprehensible Spirit and drink the cup of eternal salvation. The rider, then, fell backward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Take another reason too why he fell backward. All are behind him, no one before him. He fell, then, not for himself but for all, so that by falling upon us he might soften the hardness of our heart. He fell upon Adam, whom he was seeking, that he might find him. He sought him behind, so that as the good shepherd he might place him upon his shoulders and carry him with himself into paradise in the redemption of that thief.

But perhaps you may say: "The persecutors too fell backward; for so it is written, that the chief priests, whom Judas the traitor had brought, and the others who had come to seize the Lord Jesus, went backward and fell to the ground". This is what I too say, that he wished to fall upon sinners, not upon the righteous; for the righteous man has no need of a physician, but sinners have. If the shadow of the apostles healed, how much more does the flesh of Christ defend from death those whom it touches! Indeed, he touched a leper and cleansed him without delay. But that you who read may know that he wished to free even his persecutors, question the witness of Christ. For when Peter was inveighing against the Jews because they had killed the prince of life, he showed them the remedy, that they should repent and deserve to have the sin which they had committed remitted to them. Why, then, do you doubt that he fell for this reason, that he might raise up, since he himself said: I will strike and I will heal? Yet see the difference in the words. In Genesis it has: the rider shall fall backward, awaiting salvation from the Lord, that is, so that he may not turn his eyes away from God, may not bend back his own mind, may claim the prerogative of his own resurrection and raise himself up by divine power. But here it has: they went backward and fell to the ground. He who is earthly falls to the earth; he who is heavenly cleaves to heaven. Even if he falls in body, he does not fall in power, but always aims at the things that are above; for he always looks to the Father, so as to fulfil his will concerning us. Would that these too had not gone backward, but had received Christ, as Joseph received him and buried him in a new tomb! He who is faithful does not fall to the earth; he who is unbelieving falls and goes down into the lower parts of the earth, as it is written: let them go down alive into hell. Therefore the persecutor falls upon the earth and into hell; Christ falls upon those who are to rise again, Christ upon the rock, Christ upon the Church. Hear how he falls upon the Church. Peter was behind and was following him when he was being led by the Jews to the house of Caiaphas, the ruler of the synagogue. He is that Peter to whom he said: you are Peter, and upon this rock I will build my Church. Where Peter is, therefore, there is the Church; where the Church is, there is no death, but life eternal. And therefore he added: and the gates of the underworld shall not prevail against it, and to you I will give the keys of the kingdom of heaven. Blessed Peter, against whom the gate of the underworld did not prevail, against whom the gate of heaven did not shut itself, but who on the contrary destroyed the entrance-halls of hell and threw open the heavenly places. Set on earth, therefore, he opened heaven and closed the underworld.

This too may fit this place: that the Samaritan did not pass by that man who was going down from Jericho, wounded by robbers, but took him up and tended his wounds, pouring in oil and wine, and set him upon his own beast and brought him to the inn. Why do you doubt about the good horse, when you have read of a good beast too, when you have read that many horsemen, and very many with four-horse teams and chariots, enter into that Jerusalem? And let it not trouble you that you have read: some in chariots and some on horses, but we will be magnified in the name of the Lord our God. They have been bound and have fallen. But Elijah did not fall, who entered in a chariot; for where the name of God is, there no one is bound, but all are loosed. In the name of our God the poor man is safe and the rich, the noble and the base-born, the weak and the mighty. Riches do not prejudice faith, if only we know how to use riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
[[commentary]]
quote='''
The iniquity of the heel is also the detestable betrayal of Judas. "Of the heel" for this reason, because it is written: He who eats my bread has lifted up his heel against me. Well did he say "his" there and "my" here: his, because Christ is without iniquity, while this is the iniquity of the traitor alone; but Christ calls Judas "my" "heel" as being the last part of his body, Christ whose body and members we are. The apostles are the more excellent and active members of Christ, Judas the heel, as being the extreme part of the body, exposed to the serpent and open to a wound. The first heel, then, is Adam, the second heel Judas; the one is the fall of the whole inheritance, the other of the traitor alone, who could not entangle the inheritance, since we are no longer carnal but the inheritance of the Redeemer, as Scripture says: There is an inheritance for those who believe in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
