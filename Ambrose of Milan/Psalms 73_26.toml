[[commentary]]
quote='''
And fittingly he says: My heart and my flesh have failed, O God of my heart. For things everlasting cannot succeed unless earthly things have failed. The flesh therefore fails when the things that are carnal are put to death; those also fail who carry about the dying of Jesus Christ in their flesh; for the death of Christ works in them, so that every allurement of errors may die. Hence it is gathered that the heart of man also fails when the evil thoughts that proceed from the heart are put to death, so that forgetfulness may hide all earthly things, and God may become the God of the heart of those who, blessed and pure in heart, deserve to see God, so that they may draw near to you and not separate themselves. For God is one who draws near, not one who repels those who draw near; for he wishes to be to all a cause of salvation, not of death. In short, he repels no one except him who has thought that he must be kept apart from his sight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 11"
