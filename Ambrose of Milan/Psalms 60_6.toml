[[commentary]]
quote='''
In short, you have it written thus, that God said: I will rejoice and divide Sicima. This is that magnificent portion which Jacob assigned to his son Joseph as more excellent than all. Hence he says: But I give you Sicima, magnificent above your brothers, which I took from the hands of the Amorites with my sword and arrow, because the division was owed to the Lord alone, a division which is grasped by the word, that is, by that spiritual sword of the true Solomon. What is meant by "alone"? The Father without Christ, or Christ without the Father? Not at all. When I say "the Father alone", I do not separate the Son, because the Son is in the bosom and secret of the Father. When I say "the Son alone", I join the Father too, as the Son also joined him, saying: Behold, the hour comes that you leave me alone; but I am not alone, because the Father is with me. So, therefore, the Father too is called blessed and alone powerful in such a way that the Son is not set apart from him, who is always in the Father. In short, John said excellently: In the beginning was the Word, but he was not without the Father. And God the Father was, but he was not without the Word, because the Word was with God.

This Sicima is the Church; for Solomon chose her, whose hidden love he distinguished. This Sicima is Mary, whose soul the sword of God passes through and divides. This Sicima is "ascending", as the interpretation has it. Who she is that ascends, hear him saying of the Church: Who is she that ascends, made white, leaning upon her brother? She is the active one, who in Greek is called ἐναργής, because she shines forth with faith and works. To her sons it is said: Let your works shine before my Father, who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 4"
