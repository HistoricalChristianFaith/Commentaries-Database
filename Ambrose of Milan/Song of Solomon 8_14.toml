[[commentary]]
quote='''
Christ, detested by coiling snakes and beset by reptiles crawling on the earth, flees from the barren plain; he knows no dwelling except the heights of virtue; he knows no home except among those daughters of the church who can say, "We are a sweet fragrance of Christ to God." For some indeed, it is an odor of death, leading to death, for those who perish; but to others, it is an odor of life, leading to life—in those namely, who with living faith, breathe the fragrance of the Lord's resurrection.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:49"

[[commentary]]
quote='''
But because it was to come about that, when the Church had come to her fullness, she would be tried by various persecutions; therefore, while she was delighting in the grace of the Word, she suddenly perceives the snares of the persecutors: and as one who feared more for the Bridegroom than for herself, or because Christ is sought more by the persecutors in us, therefore she says:

Flee, my brother, and be like a young roe or a fawn of the harts, upon the mountains of spices. He flees for the sake of the weak, who could not bear heavier trials. Therefore it is written that we should flee from cities to cities: and if they persecute us in this city, let us flee into another. For the sake of the weak, then, as we have said, let him flee the persecutors: or let him flee from the lowest things and pass over to the mountains of spices, he who in return for martyrdom can yield the fragrance of the blessed resurrection. The mountains of spices are the saints. To them Christ flees for refuge; because His foundations are on the holy mountains (Ps. 86 (87):1). To them, then, he flees for refuge, who are his stable foundations. In us he flees, in them he stands firm in a faithful station. A mountain of spices, then, is Paul, who can say: We are the good fragrance of Christ to God (2 Cor. 2:15). A mountain of spices is David, the fragrance of whose prayer ascended to the Lord, and therefore he said: Let my prayer be directed as incense in your sight (Ps. 140 (141):2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Flee, my brother, and become like a hart or a fawn of the hart, onto the mountains of spices. For, hated by serpentine snakes, and ever fleeing from dogs, and hostile to the serpents that creep on the ground, he knows not how to dwell except in the loftiness of the virtues, knows not how to abide except with such daughters of the Church as can say: For we are the good fragrance of Christ to God (2 Cor. 2:15). But to some it is a fragrance of death unto death, in those who perish: to others a fragrance of life unto life, in those, surely, who with living faith hope for the fragrance of the Lord's resurrection. These are the mountains of spices, who received the body of the Lord Jesus and bound it in linen cloths with spices. For whoever believed that Jesus died, and was buried, and rose again, these have raised the lofty peak of true faith with the summits of the virtues. Where, then, is Christ sought? In the breast, surely, of a prudent priest?

Flee, my brother. She urges the Bridegroom to flee, because she herself will now be able to follow him as he flees earthly things. She says that he should be like a little doe which escapes from the nets; for she herself too wishes to flee and to fly away above the world. Let us flee, then, to our truest homeland. There is our homeland, and the Father by whom we were created, where Jerusalem is, the city which is the mother of all. But what is this flight? Not, surely, of the feet, which belong to the body; for these, wherever they run, run on the earth, and pass from ground to ground. Nor let us flee in ships or chariots, or on horses, which are entangled and fall; but let us flee with the mind and the eyes, or with the inner feet; let us accustom our eyes to see what is clear and bright, to behold the face of continence and temperance and all the virtues, in which there is nothing rough, nothing dark and crooked: and let each one look upon himself and his conscience, and cleanse that eye, that it may have nothing sordid. For what is seen ought not to be out of tune with him who sees; since God has willed us to be conformed to the image of his Son.

Known to us, then, is that good, and it is not far from each one of us: For in him we live, are present, and move; for we are also his offspring (Acts 17:28), as the Apostle wished to admonish the Gentiles. For this is the good which we seek, and the only good; for no one is good but God alone. This is the eye which beholds that great and true beauty. Only a sound and strong eye looks upon the sun, nor can any but a good soul see the good: let him, then, become good who wishes to see the Lord, and that which is good. Let us be like this good, and let us do, according to it, the things that are good. This is the good which is above all operation, above every mind and understanding; it is that which always remains, giving life and being to all; because Christ is the fountain of the life of all, of whom the prophet says: In his shadow we shall live. For now our life is hidden in Christ: but when Christ our life appears, we too shall appear with him in glory.

Let us not fear death, then; for it is rest for the body, but for the soul either liberty or release. Nor let us fear him who can kill the flesh but cannot kill the soul; because we do not fear him who can take away a garment, we do not fear him who can steal what is ours but cannot steal us. Let us, then, be souls, if we wish to be Hebrews, of those who are companions of Jacob, that is, his imitators. Let us be souls, and our members are garments: the garments indeed are to be kept, that they be not torn, that they grow not old: but he who uses them ought rather to keep and guard himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
