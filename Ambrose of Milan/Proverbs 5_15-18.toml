[[commentary]]
quote='''
There is, then, a blessed life among men, but, to be sure, in those in whom the life has been perfect. Now the perfect life is not this life of the senses, but that rational life according to the reasoning of reason and the liveliness of the mind. In this there is not a portion of man but his perfection, which lies not so much in man's condition as in his activity; for it is this that makes him blessed. To this man, then, what is good except himself to himself? What he has, this good is both present to him and will be for him the cause of good things to come. Of this good Solomon said: drink water from your own vessels and from the springs of your wells. Let waters overflow for you from your own spring, and let them run about in your streets. Let them be established for you alone, and let no stranger share them with you. Let the spring of your water be your own. Use, then, your inner good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 7"

[[commentary]]
quote='''
And so that we may know that Solomon too interpreted these wells in such a way as to refer them to moral, natural and mystical teaching, he set these wells in each of his books which he wrote on moral, natural or mystical matters.

For in Proverbs too, when he was saying that the outward show of worldly allurement must be avoided, he says: drink water from your own vessels and from the fountains of your wells, and let waters overflow for you from your own fountain. And below: let the fountain of your water be your own, and rejoice with your wife, because true wisdom is a remedy for us against the temptations of the world, and moral teaching too, which with its watering washes away, and with the stream of its fountain wipes clean, the image of worldly pleasure smeared, as it were, with harlots' paints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
For in Proverbs too, when he was saying that the appearance of worldly allurement must be shunned, he says: Drink water from your own vessels, and from the springs of your own wells, and let waters overflow for you from your own fountain (Prov. 5:15). And below: Let the fountain of your water be your own, and rejoice with the wife who is from your youth (ibid. 18); because true wisdom is a remedy for us against the temptations of the world. Moral doctrine too it is that washes away with its watering, and wipes off with the stream of its fountain, the image of worldly pleasure smeared with a kind of harlot's paints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
