[[commentary]]
quote='''
Now let us examine the reason why God, as if He were unaware that Abel was slain, asked Cain: Where is your brother? But we are shown God's knowledge, when Cain's attempt to deny his guilt is offset by the statement: The voice of your brother's blood cries out to me from the ground. A profounder meaning may be seen here in God's exhortation that sinners do penance, for confession of guilt leads to a lessening of punishment. Hence, in the civil courts, those who deny their guilt are put on the rack, whereas an admission of guilt tends to mercy on the part of the judge. To confess his guilt—not to evade his guilt, but to admit it—indicates that the sinner humbly awaits his sentence. Admission of guilt placates the judge, whereas denial rouses his opposition. God wishes to stir you up to seek pardon. He wants you to look for indulgence from Himself. He wishes to have it made clear by your admission that He is not responsible for your wrong-doing. Those who, like the Gentiles, place the responsibility for their sins on some external force, inherent in God's decree or in His work, seem to bring God to court as one who is responsible for their sins. According to this theory, a person does not of his own will commit a murder if his actions are the result of some external force. However, we cannot condone those acts which emanate from ourselves, whereas we tend to excuse those that are beyond our own control. That the Author, not of your guilt, but of your innocence, should be made a partaker of the shame of your crime is a conception of a much more serious nature than the sin itself.

Consider the parricide's reply: I do not know. Am I my brother's keeper? Although this reply savors of insolence, there is still the implication that, considering the goodness of his brother, Cain should by his actions make known his loyalty to him. Who is there to whom he is more bound by necessity to offer protection? But how could that person who did not recognize the influence of family bonds have been expected to observe what is expedient in relations of brotherly love? Or how was it possible for him to comply with the laws of nature when he did not show reverence even to God? The existence of God is denied, as if He were unaware of Cain's act. Cain shirks his duty to be his brother's keeper, as if this were beyond the bounds of nature's laws. He steers away from judgment, as if he were above judgment. Why do you feel astonishment at the fact that he did not acknowledge his loyalty to his brother, if he did not even recognize his own Creator? From these incidents in Scripture we learn the lesson that faith is the root of all virtues. Wherefore the Apostle says: Our foundation is Christ and whatever you build on this foundation is uniquely profitable and conducive to reward for virtuous acts.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 9"
