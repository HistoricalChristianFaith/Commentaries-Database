[[commentary]]
quote='''
It is night for all who have no perfect security; whence the Lord says: The night will come when no one can work. While I am in this world, I am the light of this world (John 9:4). Let us not, then, work in darkness; for if our works shine, we do not work in darkness, but in the light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
