[[commentary]]
quote='''
‘And God called the light, day, and the darkness, night,’ in order that day and night might be distinguished even in name. For this reason we notice that the rising of light rather than that of the sun seems to open the day. The beginning of day closes up night’s exit and a definite time limit and an established boundary seem to have been prescribed for night and day. The sun gives the day its brilliance; the light, its existence. The sky is often overlaid with clouds, so that the sun is hidden and its rays are not seen. Still, the presence of light points to the fact that it is day and that darkness has vanished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
‘And there was made evening and morning, one day.’ Some inquire why Scripture first mentions evening and after that, morning? Would not this appear to mean that night came before day? They do not notice that this is preceded by a reference to day: ‘And God called light, day, and the darkness, night,’ and then, again, because the evening is the termination of day and morning is the termination of night.

Therefore, in order to give preference and primacy to the day of creation, Scripture first indicated the end of a day, which night was soon to follow, and then it added the termination of night. There is a further reason why Scripture could not prefer night to day: It included in the term ‘day’ the space of time for both day and night and bestowed on that term the prestige, as it were, of a principal name. And this usage is found in Scripture to confer a name on the more important element. This is proved by numerous examples, for Jacob has said also: ‘The days of my life have been short and wretched.’ And again: ‘All the days of my life.’ And David set down: ‘The days of my years’; he did not say also ‘the night.’ Hence we note that those events which are now recorded in the form of history have established for themselves a precedent for the relation of future events.

The beginning of the day rests on God’s word: ‘Be light made, and light was made.’ The end of day is the evening. Now, the succeeding day follows after the termination of night. The thought of God is clear. First He called light ‘day’ and next He called darkness ‘night.’

In notable fashion has Scripture spoken of a ‘day,’ not the ‘first day.’ Because a second, then a third, day, and finally the remaining days were to follow, a ‘first day’ could have been mentioned, following in this way the natural order. But Scripture established a law that twenty-four hours, including both day and night, should be given the name of day only, as if one were to say the length of one day is twenty-four hours in extent. In such fashion, also, is the generation of men reckoned which is understood to include that of women, also. Because what is secondary is bound up with what is primary, the nights in this reckoning are considered to be component parts of the days that are counted. Therefore, just as there is a single revolution of time, so there is but one day. There are many who call even a week one day, because it returns to itself, just as one days does, and one might say seven times revolves back on itself. This is the form of a circle, to begin with itself and to return to itself. Hence, Scripture speaks at times of an age of the world. Although in other passages there is a mention of an age, there Scripture seems to mean the diversities in public and private affairs: ‘For the day of the Lord is great and glorious.’ And elsewhere: ‘What avail is it to you to seek the day of the Lord.’ And here is meant darkness and not light, for it is clear that that day when innocence will gleam forth and guilt be tormented is dark to those who are conscious of evil deeds and unworthy acts. Moreover, Scripture teaches us that the everlasting day of eternal reward is to be one in which there is no interchange or intermission of day and night.

Fittingly, then, in calling one day the interchange of both times Scripture closes this period with morning, so that we are taught that day begins with light and in light comes to an end. This is true because day and night could not be considered as a unit of time unless that time has been completely traversed. Hence, ‘let us walk becomingly as in the day’ and ‘let us lay aside the works of darkness.’ We know that night is passed in sleep and forgetfulness so that the body may find rest. Night is not designed for the performance of any task or of any transaction. Let us not be sharers in feasting and drunkenness, in chambering and immodesty. Let us not say: Darkness and walls cover us and who knows if the Most High will see us. But let there be in us a love of light and an esteem of goodness, so that, as if walking in daylight, we may desire that our works shine in the presence of God. To Him be honor, praise, glory, and power, together with our Lord Jesus Christ and with the Holy Spirit, from eternity and now and always, for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
