[[commentary]]
quote='''
Now the sabbath day was later in the order of days, but earlier by the sanctification of the Law. But when the end of the Law came, who is Christ Jesus — for Christ is the end of the Law unto righteousness for everyone who believes — and by his resurrection sanctified the eighth day, the same day began to be first which is the eighth, and the eighth which is the first, having its precedence from the order of number and its holiness from the resurrection of the Lord. Hence we also read in the Gospel of the δευτερόπρωτον sabbath, which in Latin is called "secundoprimum" [second-first]. For when the Lord's day, on which the Lord rose again, began to excel, the sabbath which had been first began to be reckoned second after the first; for the first rest ceased, and the second succeeded it.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
