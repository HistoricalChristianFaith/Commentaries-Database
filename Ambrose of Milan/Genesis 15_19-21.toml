[[commentary]]
quote='''
And foreign nations are given to him as if for discipline, so that the mind most observant of equity may cut back vices and correct errors. Yet the mystery of the Church is declared more evidently, because through his apostles, who are Israelites, whose fathers . . . . and from which fathers Christ according to the flesh was made under the Law, the Church was to be gathered out of the peoples of the nations who were to believe. These he signified by the number ten, not idly, but to show that they, faithless before, when they had filled up the measure of impiety, would surely obtain the crown of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
