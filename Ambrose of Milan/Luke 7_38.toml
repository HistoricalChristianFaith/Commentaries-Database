[[commentary]]
quote='''
That other woman is different, either a different person or different in progress, and she is near to us; for we have not yet renounced our sins. Where are our tears, where our groaning, where our weeping? Come, let us worship and fall down before him and weep before the Lord our God, who made us, so that we may at least be able to come to the feet of Jesus. For we are not yet able: the sinner comes to the feet, the righteous to the head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
