[[commentary]]
quote='''
This is the good which penetrates all things, and we all live in it and depend on it; but it has nothing above itself, but is divine; for no one is good but the one God. What, then, is good is divine, and what is divine is good. And therefore it is said: When you open your hand, all things will be filled with goodness; for through the goodness of God all things that are rightly called good are granted to us, things with which no evil is mixed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
