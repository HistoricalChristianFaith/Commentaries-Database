[[commentary]]
quote='''
This truly is the property of God, that he is the Father of Christ, and therefore he who came to do the will of the Father came in the name of the Father. And therefore he says: I have come in the name of the Father, and you have not received me; if another comes in his own name, him you will receive, signifying that the Jews, who would not believe in Christ, would believe in the antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
