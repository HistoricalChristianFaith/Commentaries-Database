[[commentary]]
quote='''
Let us follow him by day, the present day of the church, which Abraham saw and was glad. This is why we follow Christ during the day; for he will not be found by night. "Upon my bed," Scripture says, "by night I sought him whom my soul loves. I called him, but he gave no answer."
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 8:45"

[[commentary]]
quote='''
Let holy devotion allow no time empty of proclaiming to pass by. If those who study worldly learning indulge very little in sleep, how much more ought those who desire to know God not to be hindered by the sleep of the body, except so far as suffices for nature? David each night washed his couch with tears; he rose even in the middle of the night to confess to the Lord: and do you think the whole night should be given over to sleep? Then above all must you pray to the Lord, then must protection be asked for, sin guarded against, when it seems to have secrecy. Then most of all, when darkness is round about me and walls cover me, must one consider that God beholds all hidden things. Do not say, then, surrounded by darkness: Who sees me? And whom do I fear, hedged about and shut in by walls? For The face of the Lord is upon those who do evil (Ps. 33 (34):17). Then, if you do not see a witness, do you not see yourself? Do you not fear the testimony of your own conscience? Do you not know that that gloom of night is not a covering of sin but an incitement to it? When bodies are heated with sleep and food, then the vigor of the mind too is slackened by drowsiness, dissolved by sleep. Then the lust of impure intercourse creeps in, then the heart is troubled by the squalor of uncleanness, chastity is not seen, purity is not considered, the glory of modesty is not called to mind.

It was night when Judas betrayed, when Peter denied. At that time, therefore, above all, the justifications of God must be gone over again in the mind, the commandments of exhortation read again: let those precepts on chastity not be absent, so that the mind, occupied with them, may quench the flaming of lust, the burning of the flesh. Hold this in your mind: I will wash my couch every night (Ps. 6:7). For who that is given over to debauchery, wrapped up in shameful deeds, washes his couch every night? He who commits what ought to be wept over does not know how to weep; and though he himself is to be lamented, he has no tears for his own punishment. But he who chastises his body, and is a careful governor of himself, and, groaning and grieving over the offence of his former fall, seeks how he may wash it away with the tears of penitence, he washes his couch every night. Let us not, then, sleep whole nights through, but devote the greatest part of them to reading and to prayers. Hear the voice of the Church, seeking Christ even in the nights: On my bed, she says, in the nights I sought him whom my soul loved.

Take it according to the letter: that she sought in the nights by praying, by entreating, even by lamenting with tears. She sought in the nights, because He made darkness his hiding place (Ps. 17 (18):12), that we might learn to seek him more carefully. The Church, then, gathered from the Gentiles, sought in the prophets, and therefore she believed. Then, the Evangelists and Paul set down testimonies to the Lord's coming from the prophets; whence it is written: For night to night shows knowledge (Ps. 18 (19):3). She sought in the nights, in persecutions and adversities, in tribulations and hard sorrows. It is night for all who have no perfect security; whence the Lord says: The night will come when no one can work. While I am in this world, I am the light of this world (John 9:4). Let us not, then, work in darkness; for if our works shine, we do not work in darkness, but in the light.

It is day for those with whom Christ is present, it is night for those from whom he withholds himself. It is no great thing for you if you give thanks to the Lord at the time when you are in prosperity and good fortune; but it is if you cleave to Christ at the time when the persecutor harasses you, when some storm troubles you. Have you lost a son? In that grief, in that night, in that desolation, remember the Lord your God, lest, as though you had not been heard, you be ungrateful and transgress in your affliction. Have you been driven into exile? Remember the Lord your God, lest you prefer to God your love for the fatherland that is forbidden you. Oppressed by the power of some rich man, have you lost your own means, do you lack a living? Remember the Lord your God, lest the night of want lead you away from the affection of devotion. For this is the commandment of the Law, that you seek more in the night, when you are more heard by the Lord, and can say: In tribulation I called upon the Lord, and the Lord heard me in a wide place (Ps. 117 (118):5).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Let us, then, be mindful of the heavenly justifications; so that while we sing them with the secret voice of the mind, we may be mindful in the night of the name of the Lord, and may say, as it is written: This has come to me, because I have sought out your justifications (Ps. 118 (119):56); that is, this remembrance has come to me, that I should be mindful even in the night of your name, not lulled by drunkenness, not loosened into sleep by feasting, not occupied with worldly cares, lest forgetfulness of your worship should creep upon me: but chastising my limbs by daily meditation, and exercising the intent of my mind; so that by constancy this course may become customary for us, so that we may venerate the Lord Jesus even in the nights with all our affection.

In my chamber, in the nights I sought him whom my soul loved. We can also understand it thus. He seeks Christ on his bed who seeks him with tranquillity, with peace. He seeks him in the nights, since he spoke in parables; He made indeed darkness his hiding place, and night to night shows knowledge (Ps. 17 (18):12). Next, since the things we say in our heart ought to pierce us with compunction on our beds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
