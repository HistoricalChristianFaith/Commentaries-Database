[[commentary]]
quote='''
Therefore the holy man says: For what remains for me in heaven? And what have I wished from you upon the earth? That is: you are my portion, you suffice me for all things; I have sought nothing else but to have you as my share; I have subjected myself to no heavenly creature, as the Gentiles do; I have coveted no riches of this world and no allurements of pleasures. I need nothing, I who have been taken up by you, nor does anything remain in the heavenly places that I should seek further. Having nothing, I have all things, because I have Christ, whom the most high Father did not spare, but delivered him up for us all; how then has he not with him given us all things? as the Apostle said; for all things are in Christ, through whom are all things and in whom all things hold together. Having all things in him, therefore, I seek no other reward, because he himself is the reward of all. And therefore he said to the perfect man: Take up your cross and follow me. He who follows him is not led to perfection by a prize, but is brought by perfection to its consummation in the prize. For the imitators of Christ are good not because of hope, but out of love of virtue; for Christ is good by nature, not out of desire for a prize. He suffered for this reason, that it delighted him to do good, not because he sought an increase of glory from his passion. Therefore he who desires to imitate him works not what profits himself, but what profits others. Hence not undeservedly he fails himself, but grows strong for others by the increase of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 11"
