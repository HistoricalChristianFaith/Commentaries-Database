[[commentary]]
quote='''
But he alone never bent aside of whom it is written: Behold, a virgin shall conceive in the womb and bear a son, and you shall call his name Emmanuel: he shall eat butter and honey before he knows or brings forth evil, he shall choose the good, for before the child knows good or evil, he does not trust malice, so as to choose what is good. This Abraham could not do, to choose the good before he knew evil, but he clung to the heavenly precepts so as not to turn aside from the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 2"
