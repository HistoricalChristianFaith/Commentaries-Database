[[commentary]]
quote='''
But God, he says, shall deliver my soul from the hand of hell, when he has received it. Well does he say this who knew that his soul was not to be left in hell. For he descended to set the captives free from the jaws of the underworld, not to remain a captive among them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
