[[commentary]]
quote='''
So Scripture frequently speaks of sons in place of works, because our posterity is richer in good deeds than in sons. Hence Hezekiah too, freed from a grave sickness, From this day, he says, I will make sons, who will proclaim your justice, O Lord of my salvation, and I will not cease blessing you with the psaltery all the days of my life; for good is the posterity of devotion and of faith, which did not know how to succumb to the captivity that the sons of Hezekiah endured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
