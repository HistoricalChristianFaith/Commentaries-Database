[[commentary]]
quote='''
Christ therefore bearing His cross, already as a conqueror carried His trophies. The cross is laid upon His shoulders, because, whether Simon or Himself bore it, both Christ bore it in the man, and the man in Christ. Nor do the accounts of the Evangelists differ, since the mystery reconciles them. And it is the rightful order of our advance that Christ should first Himself erect the trophy of His cross, then hand it down to be raised by His martyrs. He is not a Jew who bears the cross, but an alien and a foreigner, nor does he precede but follow, according as it is written, Let him lake up his cross, and follow me. (Matt. 16:24, Luke 9:23.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But now let the victor raise up his trophy. The cross is placed upon his shoulders as a trophy, which, whether Simon carried it or he himself, both Christ carried in the man and the man carried in Christ. Nor do the accounts of the evangelists disagree, when the mystery agrees; and it is a good order for our progress, that he himself should first raise the trophy of his cross, then hand it over to the martyrs to be raised. It is not a Jew who carries the cross, but a foreigner and a stranger, and he does not go before but follows, according to what is written: Take up your cross and follow me. For Christ ascended not his own cross, but ours. Nor was that the death of the divinity, but as of a man. Whence he himself says: God, my God, look upon me! Why have you forsaken me?

Beautifully, when about to ascend the cross, he laid aside his royal garments, that you may know that he suffered as man, not as God the King; although Christ is both, yet he was fastened to the cross as man, not as God. But the soldiers, not the Jews, know at what time what garments befit Christ. At the judgment he stands as a victor; to the Passion he comes as a humble defendant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
