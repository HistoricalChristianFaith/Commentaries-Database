[[commentary]]
quote='''
But what is there that the Lord has not conferred on you? He gave the Law; he added grace. For the Law announced sin, but in a slippery condition it could not restrain it completely. For I came to know sin, which I did not know; I came to know that concupiscence is sin, and on this occasion of the knowledge of sin the debts were heaped up, because sin, which before had seemed dead through my ignorance, revived in me; but I died under the wound of sin, because the knowledge of guilt, which seemed likely to profit me, did me harm, so that I knew what I could not avoid. For it betrayed sin, and through the good of its announcement it heaped up the odium of sin itself. And so sin became beyond measure for me, because it was heaped up by the announcement of the commandment; for guilt grows when it is revealed and not guarded against. How then is the commandment good, which is death to me? Or how is it not death to me, since sin, which was to be shown up through the good of its signification, has wrought death in me? For it is certain that death came upon me when I recognize that what I do is sin, as the Lord himself says: If I had not come and spoken to them, they would not have sin.

Why then do you wonder if the Law is death to some, when even the saving coming of the Lord, through which we have been redeemed, is death? For the unbeliever seeks death for himself from grace, but the grace of the commandment remains. Indeed, just as the knowledge of poisoned cups is brought to completion for the discipline of medicine, so the divine commandment is for eternal life. But just as, for one who makes bad use of harmful potions, the knowledge of them is turned to evil and danger, and the more he has come to know poisons, the more he understands that he is in danger, so the form of the commandment is the author of death for those who interpret the Law badly, or who cannot avoid sins even when they have been shown and forbidden. Just as, then, an antidote is good, even if it is not good for the imprudent or the intemperate, so the commandment is good, even if it is not good for the intemperate. Therefore the commandment is good which is death to someone. Have, then, the answer to the first proposition: that the commandment which is death to me can be good: good through the nature of the saving precept, death through the intemperance of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 4"
