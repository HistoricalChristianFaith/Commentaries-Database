[[commentary]]
quote='''
What reason then for concealment, except shame? For there are certain allowed times in wedlock, when it is becoming to attend to the begetting of children; while the years thrive, while there is hope of child-bearing. But when in good time old age has come on, and the period of life is more fitted for governing children, than begetting them, it is a shame to bear about the signs of pregnancy, however lawful. It is a shame to be laden with the burden of another age, and for the womb to swell with the fruit of not one's own time of life. It was a shame then to her on account of her age; and hence we may understand the reason why they did not at this time come together, for surely she who blushed not at their coming together in their old age, would not blush at her child-bearing; and yet she blushes at the parental burden, while she yet is unconscious of the religious mystery. But she who hid herself because she had conceived a son, began to glory that she carried in her womb a prophet.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And after these days Elizabeth his wife conceived and hid herself five months, saying: Why has the Lord done so to me in the days in which he looked upon me to take away my reproach among men?

Great is the care of the saints for modesty, so that often there is shame even in their wishes, as we observe in this place that Saint Elizabeth, who certainly desired to have children, hid herself five months. What cause was there for hiding but shame? For to every duty an age is prescribed, and what is becoming at one time is not becoming at another, and the change of age often changes the nature of each act. There are also certain times prescribed for marriage itself, when it is seemly to give attention to children: while the years are vigorous, while there is hope of having children, while the use of begetting accords with example, and the use of union too with eagerness. But when ripe old age has come on, and an age more fit for ruling children than for creating them, it is a shame to bear the tokens of intercourse, lawful though it be, and to be weighed down by the burden of another age, and for the belly to swell with a fruit not of its time. For the old are shut off by their very age, and by a just shame of intemperance are called back from doing the works of marriage. Young people themselves often put forward the wish for children, and think the heat of their age must be excused by the desire of begetting. How much more shameful for the old to do what the young are ashamed to confess! Nay, even young men themselves, who temper their hearts, sober with the fear of God, often renounce the works of youth once offspring have been received.

And why wonder at men, if beasts too, by a kind of dumb deed, declare that they have a zeal for begetting, not a desire for coupling? For once they have felt their belly heavy and the seed received in the genital field, they no longer indulge in mating nor take on the wantonness of a lover, but the care of a parent. But men spare neither what is conceived nor God: they defile the one, they provoke the other. Before I formed you he says in the womb, I knew you, and in your mother's womb I sanctified you. To restrain your wantonness, you observe certain hands of your Maker forming man in the womb. He is at work, and do you defile the secret place of the sacred womb with lust? Either imitate the beast or revere God. And why do I speak of beasts? The earth itself often rests from the work of generating, and if it is occupied with seeds sown frequently by the impatient eagerness of men, it punishes the shamelessness of the farmer and changes its fruitfulness into barrenness. So there is a certain shame of nature, in the very elements and in beasts, at not ceasing from the use of generating.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
