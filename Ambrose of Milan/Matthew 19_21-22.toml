[[commentary]]
quote='''
For many it is not enough to know God, and indeed for most. So many peoples, so many nations, so many rich men think it poverty to serve the Lord; and he who is above all is to them meagre and narrow: for them the Son of God, in whom are all things, is not enough. Thus that rich man in the Gospel, to whom it was said: If you will be perfect, sell all that you have, and give to the poor (Matt. 19:21), judged that God was not sufficient for him. Thus he was even made sad, as though he were bidden to leave what was worth more and to choose what was worth less.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
