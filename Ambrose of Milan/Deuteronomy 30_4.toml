[[commentary]]
quote='''
What is the scattering from the height of heaven even to the height of heaven? Who is this so great one, who could be sown in this way? If a man is born on earth, he began from the lowest, not from the highest. If these things trouble and disturb you, go back to the earlier words of this holy prophet and hear who that great one is who made harvests of this kind fruitful on earth, so that their fruit reached the heavenly storehouses. It is that bridegroom who like a giant ran through this whole way, impassable to others, passable to himself; and from him it began to be passable now to mortals, yet so that, while these were to ascend, he himself alone came down first, so that afterwards his saints might merit to ascend. Hear, then, how the sowing was from the height of heaven to the height of heaven: From the highest, he says, heaven is his going forth, and his meeting even to its height. To what man could this be attributed? Moses scarcely ascended to the top of Mount Sinai, and that because he was called by the Lord and urged on by a heavenly voice. Who would come down from the highest heaven but Christ, who, even when he came down to earth, remained in heaven? For no one has ascended into heaven but he who came down from heaven, the Son of Man who is in heaven. You see, then, that both when he came down and when he ascended, he himself was in heaven and remained there. For he himself said: I fill heaven and earth, says the Lord; he it is who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
