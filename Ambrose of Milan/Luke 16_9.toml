[[commentary]]
quote='''
Or he spoke of the unrighteous Mammon, because by the various enticements of riches covetousness corrupts our hearts, that we may be willing to obey riches.

Or else, make to yourselves friends of the mammon of unrighteousness, that by giving to the poor we may purchase the favour of angels and all the saints.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Thou hast, he says, much goods. The miser does not know how to mention goods, except those which are lucrative. But I agree with him that those things which are pecuniary may be called goods. Why, therefore, do you make evils from goods, since you ought to make goods from evils? For it is written: Make unto you friends of the mammon of iniquity. For him, then, who knows how to use them, they are goods; for him who does not, they are rightly evils. He hath distributed, he hath given to the poor: his justice remaineth forever. What is better than this? They are goods if you bestow them on the poor, wherein you make God your debtor by a kind of pious usury. They are goods if you open the barns of your justice so that you may be the bread of the poor, the life of the needy, the eye of the blind, and the father of orphan children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 7"

[[commentary]]
quote='''
We have also many things furnished to us whereby we may redeem our sins. You have money: redeem your sin. The Lord is not venal, but you yourself are venal. You have been sold by your sins; redeem yourself by your works, redeem yourself by your money. Cheap is money, but precious is mercy. For Alms delivereth from [sin]; and in another place: The ransom of a man's life are his riches; and in the Gospel: Make unto yourselves friends of the mammon of iniquity. And poison is frequently tempered by an antidote; that is, poison is expelled by poison; by poison is death repelled, life saved. Do you also, like a good steward, make the aid of mercy from the instrument of avarice, and make the favor of purity from the enticement of corruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 20"
