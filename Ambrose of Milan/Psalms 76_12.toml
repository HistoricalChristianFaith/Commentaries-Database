[[commentary]]
quote='''
Therefore you who are stationed nigh, pray and return gifts To him that is terrible, even to him who taketh away the spirit of princes; to the terrible with the kings of the earth, because He is not bought off by any rich man's bribe. He is not changed from His purpose by the haughtiness of the powerful, Who fixes the rewards for guilt, Who the more he gives to anyone the more He demands of him, Who gave a kingdom to Saul although of humble station,—but because he did not keep His commandment, he lost both his kingdom and his life—, Who for their perfidy made many kings of the people of the fathers to be captives of the gentiles, and, that we now speak of the history before us, Who so ordered King Achab—ungrateful for divine favors—to be killed, that his wounds were licked by dogs. For since he had coveted the poor man's vineyard, filled in vain with all the wealth of power, he was reduced by the Lord below the most utter want. There was no one found who would wash his wounds, none who would cover his body. Toward him was wanting the kindness of men, and the fury of dogs took its place. Clearly did the miser find worthy assistants at his funeral.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 16"
