[[commentary]]
quote='''
"I [the prodigal son] have sinned," he says, "against heaven and before you." He confesses what is clearly a sin to death, that you may not think that any one doing penance is rightly shut out from pardon. For one who has sinned against heaven has sinned either against the kingdom of heaven or against his own soul, which is a sin to death, and against God, to whom alone is said: "Against you only have I sinned and done evil before you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Repentance%2FBook%25202.html'
source_title="Concerning Repentance 2.3.17"

[[commentary]]
quote='''
Let us inquire more earnestly what it is for God to be justified. The Apostle says: but let God be true, and every man a liar, as it is written: that you may be justified in your words and may overcome when you are judged; David too says: against you only have I sinned and done evil before you, that you may be justified in your words and may overcome when you are judged. So he who sins and confesses his sin to God justifies God, yielding to him as the victor and hoping for grace from him. In baptism, therefore, God is justified, for in it there is both confession and pardon of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
There follows: Against you alone have I sinned. He was certainly a king; he himself was bound by no laws, because kings are free from the bonds of transgressions; for they are not summoned to punishment by any laws, being safe in the power of their rule. So he did not sin against man, to whom he was not held liable. But although he was safe in his rule, he was nevertheless subject to God in devotion and faith, and, knowing himself to be subject to his law, he could not deny his sin, but confessed it with bitterness like one accused, since he knew that he was held by greater bonds because he owed greater things, for more is required of him to whom more has been entrusted.

We can also take it this way: Who judges me, when all are under sin? And so the Lord said of that adulteress: Let him who is without sin, he said, be the first to stone her. And no one stoned her. This, then, is what the prophet says: Against you have I sinned, you who alone are without sin. But he who is liable to sin cannot judge another as a sinner. For every man is inexcusable who condemns in another the things that he himself does; for in the very thing in which he judges another he passes sentence on himself.

Against you, he says, have I sinned and done evil before you, that you may be justified in your words and may prevail when you are judged. Against you have I sinned, who called me forth to the pursuits of virtue, who instructed me in your law. Against you alone have I sinned, whom alone the hidden things of the thoughts and the secrets of the mind do not deceive.

And I have done evil before you, to whom sanctification alone is fitting. We shun the witness of man, and in your sight we commit things that are unworthy. It is an affront to a man to watch shameful deeds; we know that God is the arbiter of all things, and with him himself as witness we sin.

And yet in these things the Lord our God is all the more justified, because our injustice commends the justice of God and our lie celebrates the truth of God; but let God be true, and every man a liar.

That you may be justified in your words. The words of God are full of truth and justice, and therefore whatever the Lord has spoken about human frailty is true: that their heart is inclined to wickedness and leans towards deceit; and that he has laid it down that there is no man who does not sin: All indeed have turned aside and become useless. Therefore he prevails while he is judged, since by the slip of all men he has proved whatever he judged about our deceitfulness. So if we say that we have done iniquity, we justify the Lord in his words; if however we say that we have not sinned, we make God a liar; but for him it is impossible to lie. It is clear, then, that we are all under sin.

How great a crime it is, then, for a man to deny that he is a sinner, since, as far as lies in him, he seems to charge the supreme God with a lie and to refute him, who is so moderate and patient that he prevails when he is judged.

For the case comes to judgment, and God says: My people, what have I done to you, or how have I grieved you, or how have I been troublesome to you? For I brought you out of the land of Egypt, and from the house of bondage I delivered you, and I sent before your face Moses and Aaron and Miriam. My people, keep in mind what Balak devised concerning you. One by one he sets his benefits in your sight, so that you may judge, as it were, of the things you ought to have kept, and so be the more guilty, you who could not abide by the divine benefits. What have I done, he says, to you? He makes himself the defendant, as it were, and you the judge. Or how have I grieved you? He does not refuse the charge of an offended countenance, if you have been grieved, with God as the cause. Or how have I been troublesome to you? He confesses the wrong of importunity, if it has been thought too troublesome. He adds his benefits, whose favour he who proved ungrateful did not blush at.

In this case too, consider how the Lord offered himself to be judged by David himself, that he might prevail; for Nathan says: Thus says the Lord God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul, and I gave you all that was your lord's, and his wives I gave into your bosom, and I gave you the very house of Israel; and if these things are few, I will add to you. And why have you held the Lord as nothing, so as to do wickedly in his sight? Confronted by the recounting of these things, when he saw that he, the judge, was the loser, he says: I have sinned against the Lord. Thus he justified the Lord, he who did not dare to deny his sin.

We can also take it this way: he who confesses his sin justifies the Lord. And so in the Gospel you have it that the publicans justified God, being baptized with the baptism of John. Now John the Baptist made a baptism that was of repentance. And he who does penance does not deny his transgressions. Therefore, since David had his transgression ever against him, he certainly did not deny what he also blushed at, he did not deny what he also acknowledged. And by not denying it he was certainly doing penance for the error he had committed, and so, by confessing his transgression, he justified the Lord and was himself justified by the Lord. For the Lord is justified when his justice is proclaimed and pardon is asked of him. At the same time he both justifies the one who confesses and is justified in his words, as it is written: Tell your iniquities, that you may be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 10"

[[commentary]]
quote='''
Against you he says I have sinned and done evil before you, that is: even if men do not see, yet you see; even if men cannot judge me, since they are partners in offences, yet you are the judge of each one, you who are free of offences. However much harmful thoughts may lie hidden in the inmost heart, yet they are before you, who can say: Why do you think evil things in your hearts? Surely it is Christ who says this. He, then, who knows what is written in the heart can blot out whatever is inscribed in the heart. To him holy David confesses that he has sinned, not only in himself but also in the first man, when the divine precepts are violated.

Here one may notice, dearly beloved brethren, how all heresies, while they attack one another, run back into one another. And so the Arians, while they separate the power of the Father and of the Son, rush madly into such an outcome of their disputation that their assertion falls in with the Manichaeans; for these say that there is one God of the Old Testament, another of the New. This profane assertion the holy Church condemns, which reads of one God, because one God the Father, from whom are all things, and we unto him, and one Lord Jesus, through whom are all things, and we through him. Surely the power of the Father and of the Son is declared almighty and one, so that we neither set the Father apart from the grace of the New Testament nor, again, separate the Son from the establishing of the world.

In fact, let us consider whether the same God is the founder of both Testaments. Surely we have all sinned in the first man, and through the succession of nature the succession of guilt too has been poured from one into all. Against whom, then, did I sin, against the Father or against the Son? Surely against him who entrusted to me that which I sinned by not keeping. It was commanded to man that he should taste of all the things that were in paradise, but not touch the tree of the knowledge of good and evil. Adam, then, is in each one of us. For in him the human condition offended, because through one man sin passed over into all. I see the sum entrusted to me, I see what debts of transgression I have contracted while I taste things forbidden and prohibited. Hence I owe the interest on the principal committed to me, because I could not keep with inviolate faith the loan at interest of the heavenly commandments that was entrusted to me.

We have acknowledged what was entrusted; let us acknowledge the creditor too. Surely it is the creditor's right both to exact and to remit. And therefore the same one remits who has the right of exacting. When, therefore, Christ has said to me in the Gospel: Your sins are remitted to you, do I not understand that the same one is lord of the principal whom I recognize as the arbiter of pardon? Or if the Father lent and the Son remitted, not through unity, as we say, but, as the Arians assert, through a difference of power, did then one God lend and another remit? Whence they run into this, that they do not escape the faithlessness of the Manichaeans. Next, in saying that one God is good, let them notice into what snares of their own madness they fall. If he who lent is good, how is he not good who remitted? Therefore let the Arians have their portion with those with whose assertion they agree. Nor is it surprising if he who has once begun to stray from the truth entangles himself in the knots of another's error.

And therefore there is one judgment which destroys the engines of all the heretics: that we believe the Trinity to be of one power, majesty and virtue, and therefore neither separate the Father from what the Son did nor set the Son apart from what the Father commanded. For so it will come about that we do not bring in one God of the Old Testament and another of the New, but that through the unity of power both the Son is understood in the Father and the Father in the Son, and the Son lends at interest in the Father and the Father remits in the Son. For the Father too forgives sin: that the Son has forgiven we have already said.

Learn that the Father too forgives. Forgive he says us our debts, as we also forgive our debtors. Surely the Son says this to the Father in our person. Nor does he say it as though he himself could not forgive, but he says it so that you may understand the unity of power.

In fact, if you seek authority in the Son, Now you he says are clean because of the word which I have spoken to you. He forgives by a word, he forgives by command, but he forgives with reason, saying: Go, see that after this you do not sin. You have authority, because he pardoned the things of the past; you have judgment, because he gave a rule for the things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
