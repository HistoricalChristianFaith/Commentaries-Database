[[commentary]]
quote='''
And so, in order to call the Gentiles to the grace of his resurrection — for this is the rich and fertile land, which brings forth eternal fruits, fruits a hundredfold and sixtyfold — he put his shoulder under the labour, subjecting himself to the cross, that he might bear our sins. And therefore the prophet says: whose rule is upon his shoulder, that is, the power of the divinity is above the passion of the body, or the cross rising above the body. So he set his shoulder, bending to the plough, patient in undergoing every insult, so subjected to labour that he might be wounded for our iniquities and made weak for our sins. And he became a husbandman, knowing how to sow his land with good wheat and to plant fruit-bearing trees with deep roots.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 6"
