[[commentary]]
quote='''
Yet mindful of his pure conscience and of his clean prayer, he says: Earth, do not cover over in the blood of my flesh, so that his prayer may be directed like incense to the Lord and not be turned aside into the earth. For the prayer of a holy man pierces the clouds; the prayer of the sinner the earth, opening its mouth, hides in the blood of the flesh, as was said by God to Cain the parricide: Cursed he says are you from the earth, which opened its mouth to receive your brother's blood from your hand, since you will till the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 8"
