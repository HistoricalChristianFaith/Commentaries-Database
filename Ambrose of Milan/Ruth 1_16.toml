[[commentary]]
quote='''
Rightly, then, Saint Matthew, being about to call the Gentiles to the Church through the Gospel, recorded that the Lord himself, the author of the gathering of the Gentiles, took on according to the flesh a generation from foreigners, so that there should be a sign even then that that generation would bring forth the caller of the Gentiles, whom we all, gathered from foreigners, should follow, leaving our ancestral ways and saying to him who called us to the worship of the Lord, for example to Paul or to any bishop: Your people is my people, your God my God. So Ruth, like Leah and Rachel, forgetting her people and her father's house, loosing the bond of the Law, entered into the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
