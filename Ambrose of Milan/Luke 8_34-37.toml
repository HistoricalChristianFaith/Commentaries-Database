[[commentary]]
quote='''
When the masters of the herds saw he says this, they fled. For neither the professors of philosophy nor the rulers of the synagogue can bring any medicine to perishing peoples. Christ alone it is who takes away the sins of the peoples, if only they do not refuse the patience of being healed. For the rest, he does not deign to cure the unwilling, and quickly leaves the weak to whom he sees that his presence is a burden, as with the peoples of the Gerasenes, who, coming out of the city, in which the likeness of the synagogue seems to appear, asked him to depart, because they were held by great fear.

For a weak mind does not grasp the word of God, nor can it bear the weight of wisdom; it gives way and is undone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
