[[commentary]]
quote='''
But since no man could be so great as to take away the sins of the whole world, neither Enoch nor Abraham nor Isaac — who, though he offered himself to death, was yet preserved, because he could not abolish all sins; for what man is so great that in him the sins of all should die? — therefore not one from the people, not one from the multitude, but the Son of God was chosen by God the Father, who, since he was above all, could offer himself for all. It was fitting that he should die, so that, being stronger than death, he might set others free, having become free among the dead without help, that is, free without the aid of man or of any creature, free from death; and rightly free, he who repelled the slavery of the desires and knew not the bonds of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
