[[commentary]]
quote='''
Notice also that this was not written idly in Genesis: And you will be near me, you and your sons and the sons of your sons; for this is what he said in the Gospel: Behold, I am with you all days until the consummation of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 12"
