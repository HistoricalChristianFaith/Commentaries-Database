[[commentary]]
quote='''
And therefore it was said to him by the Lord Jesus Christ, to his servant David, so as to declare the mystery: Because you did this in secret, I too will do this thing before all Israel in the sight of this sun. And at first indeed, not knowing the sacrament, David was moved with indignation, but he did not err in his feeling. But afterwards, when he recognized the great mystery — for it is the great sacrament of Christ and the Church — seeing the remission of all sins that was to come, and foreseeing the splendour of grace through the washing of regeneration and the infusion of the Holy Spirit, he said, secure of pardon: I have sinned against the Lord, so that he too might come into the fellowship of those to whom the remission of fault would come. Do you notice how he lamented his own sin? Who, then, would wonder that it was forgiven him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 5"
