[[commentary]]
quote='''
Accordingly he often touches him sharply; for to him who was boasting in the law that he had kept all things from his youth, he showed, so as to expose his empty boasting, that what belongs to the law was still lacking to him. And therefore he is brought, sorrowful, to the precept of mercy, and upon him a kind of natural form of sentence is pronounced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
