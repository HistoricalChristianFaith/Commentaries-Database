[[commentary]]
quote='''
And therefore he says: Delight in the Lord, and he will give you the petitions of your heart. Why did he not say "your petitions", but "the petitions of your heart"? For the petitions of the outer man and of the inner are not shared, nor are all approved by Christ, because the law of the flesh frequently fights against the law of the mind. But those which belong to the inner man, who has been renewed in the spirit, those petitions the Lord, when he is asked, grants in effect. Hence also elsewhere he says: May the Lord grant you according to your heart and confirm all your petitions. He says "according to the heart", not "according to the appetite of the flesh", and may he confirm, he says, those petitions which come forth from the inmost heart, not those which are directed by the allurement and pleasures of this flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
