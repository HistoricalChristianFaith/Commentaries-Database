[[commentary]]
quote='''
A wheel ran within a wheel and was not hindered, the New Testament in the Old Testament; it ran within that by which it was announced. The wheels went in four directions, and did not turn back; because the spirit of life was in them, which ran into the four parts of the whole world: and it ran without stumbling, because the good life of the horses squared with it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
