[[commentary]]
quote='''
And it came to pass after these words, God tested Abraham. God tests in one way, the devil in another. The devil tests in order to overthrow, God tests in order to crown. Indeed he tests those whom he has proved for himself. Hence David too says: prove me, O God, and test me. He proved holy Abraham first and so tested him, lest, if he tested him before he had proved him, he should weigh him down. He proved him when he commanded him to go out from Haran, and found him obedient. He proved him when, relying on the title of faith, he freed his nephew, when he touched nothing of the spoil, when he promised the old man a son — and though he himself was a hundred years old, and though he considered Sarah's organs of generation as dead, yet he believed and did not waver in faith, he who could have wavered on account either of barrenness or of old age —; he proved him by the diligence of his hospitality. Having proved him, then, he judged that, as a stronger man, he should be tested with greater and, as it were, harder commands. And here indeed we are taught by example that a man is proved by true things, but tested by things contrived and feigned. For God did not wish the son to be sacrificed by his father, nor did he wish this offering to be carried out, he who provided a sheep to be sacrificed in place of the son; but he was testing the father's affection, whether he would put God's precepts before his son, and not bend the force of his devotion out of regard for fatherly love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
