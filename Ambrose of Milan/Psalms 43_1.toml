[[commentary]]
quote='''
The third interrogation, too, is that, placed in the midst of men who practise wickedness, he desires his cause to be separated from their contagion. Many think this should be referred to the Lord Jesus, because it belongs to him alone not to fear judgment, who conquers when he is judged. For he has a judgment from a man of iniquity, a judgment which Christ enters willingly, as you have it written: My people, what have I done to you, or how have I grieved you? Yet since the Father has given all judgment to him, certainly not as to one who is weak, but as to the Son, what judgment can he himself undergo? If they think that the Son must undergo the Father's judgment, the Father surely judges no one, but has given all judgment to the Son, so that all may honour the Son as they honour the Father. The Father honours the Son, and do you pass judgment on him? We have set this down so that no one should think that we, as if out of fear of the question, put the person of the prophet in the place of the Lord, since holy David, foreseeing in the spirit that the Jews would rise up against the Lord's passion, does not dread the judgment upon his own faith, and also demands that his cause be distinguished from the nation of the persecutors, lest the lineage of the whole Jewish race be entangled with the wicked heirs of his family and posterity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 8"
