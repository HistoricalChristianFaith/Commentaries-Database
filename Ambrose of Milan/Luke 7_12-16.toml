[[commentary]]
quote='''
Even if there is a grave sin which you cannot yourself wash away with the tears of your repentance, let mother Church weep for you, who intercedes for each one as a widowed mother for her only sons; for she suffers with them by a certain spiritual pain of nature when she sees her children driven to death by deadly vices. We are inward parts of her inward parts; for there are also spiritual inward parts, which Paul has, saying: Yes, brother, may I enjoy you in the Lord: refresh my inward parts in Christ. We, then, are the inward parts of the Church, since we are members of her body, of her flesh and of her bones. Let the loving mother grieve, then; let the crowd too stand by — not only a crowd, but a great one — let it suffer with the good parent. Now you will rise again at your funeral, now you will be freed from the sepulchre; those ministers of your funeral will stand still, you will begin to speak words of life, all will fear; for by the example of one very many are corrected. They will praise God too, who has granted us such great remedies for escaping death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
