[[commentary]]
quote='''
Good, then, is love, having wings of burning fire, which flies through the breasts and hearts of the saints and burns up whatever is material and earthly, but proves whatever is pure, and makes better by its fire whatever it has touched. This fire the Lord Jesus sent upon the earth, and faith shone forth, devotion was kindled, love was lit up, justice shone out. With this fire he set the heart of his apostles aflame, as Cleopas testifies, saying: Was not our heart burning within us, while he opened the Scriptures? The wings of fire, then, are the flames of divine Scripture. In fact he opened the Scriptures, and fire went out and pierced the hearts of the hearers. And truly they are wings of fire, because the words of the Lord are pure words, silver tried by fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
