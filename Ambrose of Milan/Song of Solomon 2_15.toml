[[commentary]]
quote='''
Catch us the little foxes that destroy the vineyards, that our vineyards may flower. Scripture calls him a man who is in the image and likeness of God: but the sinner it is wont to call not a man, but either a serpent, or a horse neighing after females, or a little fox, or a beast of burden. Of one of these the Lord says: Go, tell that fox (Luke 13:32), that is, of Herod. And elsewhere, when he perceived that he was being questioned deceitfully, he said: Foxes have holes, and the birds of the air nests, where they may rest (Matt. 8:20); because they deceitfully linger in certain lairs of earthly passions.

Hence also Samson tied foxes together in pairs, bound torches to their tails, and let them loose through the harvests of the Philistines (Judg. 15): signifying by this figure that wicked and deceitful men, and above all heretics, have a free tongue for barking, but hampered outcomes, or quarrelsome beginnings, and the end of their deceit consigned to burning. And therefore he let loose three hundred foxes too, because the faithless desire to commend themselves by the preaching of the cross, but cannot hold its mystery; who, with this preaching contrived, false and feigned, try rather to burn the fruits of others: whereas the true cross of the Lord surely does not burn up the merits of others, but makes them fruitful.

And rightly it is written: Catch us the little foxes that destroy the vineyards, that our vineyards may flower. By this it is shown that either the Lord Jesus or the Church commands that the wiles of the deceitful are to be driven out of their vineyards, lest they harm the tiny vineyards, since they cannot harm vines already grown. For the heretic can tempt one who is imperfect; he cannot supplant one who is perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
