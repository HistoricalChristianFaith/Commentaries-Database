[[commentary]]
quote='''
And a son, Isaac, was born to Abraham, when he was a hundred years old. You too, if you are perfect, will have a posterity of gladness and an inheritance of exultation. And Sarah said: the Lord has made laughter for me; and whoever hears of it will rejoice with me. This is certainly not to be understood of this generation, which is liable to a great many mishaps, so that sometimes it would have been better not to have begotten, but of the generation by which each sinner who does penance, when he is redeemed from death, brings gladness to the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
