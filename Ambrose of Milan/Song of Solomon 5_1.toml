[[commentary]]
quote='''
The groom descends, and delighted by the diversity of its fruits, he rejoices that he has found a stronger food, he has also found a sweeter one. For it is like a certain bread of the word, and honey: one speech is more forceful, another more persuasive. And there is another faith, more ardent, like wine: another, more clear, like the juice of milk. Christ feasts on this food within us, drinks this cup, and by the intoxication of his drink, he incites us to surpass lower things and strive for better and best things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul 5.49"

[[commentary]]
quote='''
"I have eaten my bread with my honey." This solid is gathered from the flowers of various virtues by the cooperative work of those bees that proclaim wisdom. Holy church puts it in honeycombs so that it may be the food of Christ.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 16:98"

[[commentary]]
quote='''
Do you find delight in songs which charm the banqueter? Listen to the voice of the Church, who exhorts us not only in canticles, but in the Canticle of Canticles: Eat, O friends, and drink and be inebriated, my brethren. But this inebriation makes men sober. This inebriation is one of grace, not of intoxication. It leads to joy, not to befuddlement. In the banquet hall of the Church there will be pleasant odors, delightful food, and drink in variety. There will be noble guests and attendants who grace the occasion. It will not be otherwise! What is there that is nobler than to have Christ at the Church's banquet, as one who ministers and is ministered unto? Attach yourself closely to Him who reclines as a guest at that banquet. Unite yourself to God. Do not disdain the banquet table which Christ chose, saying: I am come into my garden, O my sister, my spouse. I have gathered myrrh with my aromatic spices. I have eaten my bread with my honey and I have drunk wine with my milk. The garden is the Garden of Paradise, that is to say, the place of the Church's banquet, where Adam was before he committed sin and where Eve sat before she became responsible for a deed of wrong. There you will gather myrrh, that is to say, perform the burial of Christ, so that as you are buried with him by means of baptism into death, and as He has risen from the dead, you, too, may rise. There you will eat bread which strengthens man's heart. You will taste of honey which is a delight to the tongue. You will drink wine along with milk, that is to say, with splendor and purity. This refers to the purity of simplicity or to grace which is untainted and is applied to the remission of sins. Its effects are comforting as milk is to infants at breast, who thereby grow with delight into the plenitude of perfect age. Approach, therefore, this banquet.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 5"
