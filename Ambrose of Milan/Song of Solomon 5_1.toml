[[commentary]]
quote='''
"I have eaten my bread with my honey." This solid is gathered from the flowers of various virtues by the cooperative work of those bees that proclaim wisdom. Holy church puts it in honeycombs so that it may be the food of Christ.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 16:98"

[[commentary]]
quote='''
Do you find delight in songs which charm the banqueter? Listen to the voice of the Church, who exhorts us not only in canticles, but in the Canticle of Canticles: Eat, O friends, and drink and be inebriated, my brethren. But this inebriation makes men sober. This inebriation is one of grace, not of intoxication. It leads to joy, not to befuddlement. In the banquet hall of the Church there will be pleasant odors, delightful food, and drink in variety. There will be noble guests and attendants who grace the occasion. It will not be otherwise! What is there that is nobler than to have Christ at the Church's banquet, as one who ministers and is ministered unto? Attach yourself closely to Him who reclines as a guest at that banquet. Unite yourself to God. Do not disdain the banquet table which Christ chose, saying: I am come into my garden, O my sister, my spouse. I have gathered myrrh with my aromatic spices. I have eaten my bread with my honey and I have drunk wine with my milk. The garden is the Garden of Paradise, that is to say, the place of the Church's banquet, where Adam was before he committed sin and where Eve sat before she became responsible for a deed of wrong. There you will gather myrrh, that is to say, perform the burial of Christ, so that as you are buried with him by means of baptism into death, and as He has risen from the dead, you, too, may rise. There you will eat bread which strengthens man's heart. You will taste of honey which is a delight to the tongue. You will drink wine along with milk, that is to say, with splendor and purity. This refers to the purity of simplicity or to grace which is untainted and is applied to the remission of sins. Its effects are comforting as milk is to infants at breast, who thereby grow with delight into the plenitude of perfect age. Approach, therefore, this banquet.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 5"

[[commentary]]
quote='''
I have entered into my garden, my sister, bride: I have gathered the vintage of myrrh with my ointments, I have eaten my bread with my honey: I have drunk my drink with my milk. Why I have said bread and wine, the faithful understand. But this is not doubtful: that he himself eats and drinks in us, just as you have read that in us he said he was in prison (Matt. 25:36). Hence also the Church, seeing so great a grace, exhorts her sons, exhorts her nearest ones, to run together to the sacraments, saying: Eat, my nearest ones, and drink, and be drunk, my brothers. What we are to eat, what we are to drink, the Holy Spirit has expressed to you elsewhere through the prophet, saying: Taste, and see that the Lord is sweet; blessed is the man who hopes in him (Ps. 33 (34):9). In that sacrament is Christ, because it is the body of Christ: it is therefore not bodily food but spiritual. Hence the Apostle too says of its type: That our fathers ate spiritual food and drank spiritual drink (1 Cor. 10:3). For the body of God is a spiritual body; the body of Christ is the body of the divine Spirit; for Christ is spirit, as we read: The Spirit before our face is Christ the Lord (Lam. 4:20). And in the epistle of Peter we have: Christ died for us (1 Pet. 2:21). Finally, this food strengthens our heart, and this drink gladdens the heart of man, as the prophet has recalled (Ps. 103 (104):15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Eat, he says, my brothers, and be drunk: I have gathered the vintage of myrrh with my ointments (Ps. 79 (80):9). What is this vintage? Know the vineyard, and you will recognize the vintage. A vineyard, he says, you have transplanted out of Egypt, that is, the people of God. You are the vineyard, you are the vintage: as a vineyard you were planted, as a vintage you have given fruit. I have gathered the vintage of myrrh with my ointments, that is, into the fragrance which you have received.

I have eaten my bread with my honey. You see that in this bread there is no bitterness, but all is sweetness. I have drunk my wine with my milk: do you see that such is the gladness that is polluted by the defilement of no sin? For as often as you drink, you receive the remission of sins and are made drunk with the spirit. Hence the Apostle too says: Do not be drunk with wine..... but be filled with the Holy Spirit (Eph. 5:18). For he who is made drunk with wine sways and staggers; he who is made drunk with the spirit is rooted in Christ. And therefore it is a glorious drunkenness, which works sobriety of mind.

Eat, he says, my friends, and drink, and be drunk. Good is the drunkenness which produces a certain going out of the mind toward better and joyful things, so that our spirit, unmindful of cares, is cheered by the wine of joy. Good is the drunkenness of the spiritual table; finally, the cup that makes drunk, how glorious it is (Ps. 22 (23):5)! And elsewhere you have: Make its streams drunk, multiply its generations (Ps. 64 (65):11); because the drunkenness of the earth, when it has been drenched with heavenly rain, is wont to stir up the seeds and multiply the fruits. And so, when the Word, which comes down from heaven like rain, has made drunk with divine preaching the veins of our earth, that is, of the soul and the mind, zeal for diverse virtues is roused, and the fruit of faith and of chaste devotion grows up, and rightly is it said to him: You have visited the earth, and made it drunk (Ps. 64 (65):10). For by taking up a body he visited it, to heal the sick; he made it drunk with spiritual grace, to soothe the anxious with joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
