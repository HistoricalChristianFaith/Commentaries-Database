[[commentary]]
quote='''
Indeed they are expressed in the very same words, so that we may understand that it is he himself who spoke both earlier in Joseph and afterwards in his own body, since he did not even change the words. For he said then: Do not be sad, and below: Go up to my father and say to him: Thus says your son Joseph: God has made me lord of the whole land of Egypt. And in the Gospel he says: Do not fear. Go, tell my brothers to go into Galilee, and there they will see me. And below he says: All power has been given to me in heaven and on earth, that is to say: it was of divine disposition, not of human bitterness, that I should receive power. He who recounts the reward does not reproach them with the crime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 12"
