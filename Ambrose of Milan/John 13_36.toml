[[commentary]]
quote='''
Prudently, then, she asks to be drawn, because not all are able to follow. Indeed, to Peter when he said: where are you going? the Word of God answered: you cannot follow me now, but you will follow afterwards. He had entrusted to him the keys of the kingdom of heaven, and yet he judged him unequal to following him. This soul, however, he did not put off, because she was not presuming, but asking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
