[[commentary]]
quote='''
What then hinders us from believing that Bathsheba too was joined to holy David in figure, so that there might be signified the congregation of the nations, which was not united to Christ by any lawful marriage of faith, since it was to enter into his grace through certain side entrances, outside the prescription of the law; in which congregation the bare sincerity of mind and open simplicity, through the justifying mystery of the washing, might win over the mind of the true David and eternal king and provoke his charity? Rightly he came hidden, and so as to deceive the prince of the world, who is like that Uriah, whose name is interpreted "my light", transforming himself into an angel of light. He came, I say, into this world, and he came hidden; he entered as an adulterer, so as to claim his lawful right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"
