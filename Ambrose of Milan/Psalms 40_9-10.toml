[[commentary]]
quote='''
But he who preaches in the great Church does not hide the righteousness of God in his heart, but lifts up his voice with all his strength and proclaims Christ. He does not fear to preach him before the people, he is not ashamed of his cross, but glories in that Passion of the Lord. He does not follow the letter of the Law, but digs out deep mysteries by which to reveal the glory of the Lord Jesus, who, as the Law signified, was to come to the Church, which was to be gathered as a great one. Righteousness, then, is faith. Finally, Abraham believed God, and it was reckoned to him for righteousness. Behold, I will not restrain my lips. Lord, you have known. So also elsewhere: You have known my sitting down and my rising again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
