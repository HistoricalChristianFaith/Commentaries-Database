[[commentary]]
quote='''
And he called the elder servant of his house and told him to go to Haran and to seek a wife from among his kinsfolk for his young master. Learn from this that even servants of riper age are called boys by their masters or by any of their betters. Hence a certain poet too thought this usage worth following, whether he found it himself in the usage of those who think themselves learned and wise, or carried it over himself from our writers, or found it already carried over: Feed your cattle as before, boys, rear your bulls. Hence we too speak of boys when we also mean servants, expressing not their age but their condition.

Mark now the virtues of a good father of a household, and consider first what charge he entrusts and to whom, so that you too may so train your servants that they show a father's affection to your children and carry out their duties. One of the servants was found, but an elder one, to be chosen to provide a wife for his young master, and he was bound to swear by putting his hand under his master's thigh. By the thigh we understand generation. And the generation of Abraham is Christ. Hence too To Abraham were spoken says the Apostle the promises, and to his seed. He does not say: and to seeds, as of many, but as of one: to your seed, which is Christ, showing that through him there would be a holy sacrament for us, through him sure help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
