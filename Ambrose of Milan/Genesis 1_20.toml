source_title="The Six Days of Creation"

[[commentary]]
quote='''
As we have entered upon a discussion on the trait of craftiness, whereby a man strives to circumvent and deceive his brother and to contrive new ways of deception, thus trapping by guile and trickery a person whom he cannot overcome by force, it is not my intention to overlook the well-known deceitful character of the polypus. This animal, coming upon a rock on a shallow coast, fixes itself firmly on it. At the same time, it assumes by subtle art the color of the rock and conceals its back in a similar fashion. In this manner a great number of fish, unsuspecting any fraud and innocently believing that what they see is a rock, are taken into this artfully contrived trap to be waylaid by the tentacles of the polypus.

The prey thus makes its approach without external compulsion. It is captured by such methods as one would expect of those who often change their nature and stir up diverse means of ill, so as to tempt the minds and hearts of all severally. Some boast of their continence when in converse with the continent. Associating with the intemperate, they show themselves to be devoid of chastity and to wallow in the troughs of intemperance. Those who see or hear them yield easily to their influence and for that reason soon fall into temptation, being unable to turn aside or avoid what is likely to injure them. Weakness, when cloaked in the veil of benignity, can inflict harm of a more serious nature. And so we should be aware of those who extend the tentacles of their deceit far and wide or those who assume various shapes. These people are like the polypus that has manifold entanglements and many astute ways by which it can ensnare whatever falls into the rocky shores wherein we are beguiled.

What tricks are displayed by the crab in its eager search for food! The oyster is a special objective in its quest for a delicious banquet. But its eagerness for food is tempered by its sense of the possibility of being involved in danger, for the chase is as difficult as it is perilous. Its difficulty lies in the fact that the flesh of its victim is enclosed in a shell of more than usual solidity. Just as in compliance with divine power the delicacy of the flesh of its prey has been stoutly defended by nature which nourishes and fosters it in the form of an encircling rampart, so all in vain are the crab’s attacks, because the closed oyster cannot be opened by any display of force. There is the danger, too, that the oyster may hook it in its claws. Therefore, the crab resorts to artifice and contrives new ways of waylaying its prey.

Accordingly, since every living being is attracted by sentiments of pleasure, the crab looks for an occasion when the oyster, finding a place protected from the wind and within range of the sun’s rays, opens wide its double doors and unbars the bolts of its shell in order to enjoy to the full the open air. At that moment the crab, by stealthily injecting a pebble within the shell of the oyster, prevents it from being closed. Having acquired an entrance in this manner, the crab inserts its claws without danger to itself and devours the flesh within the shell.

There are men who, like the crab, exercise surreptitiously their guile on others and fortify their own weaknesses by the use of certain inherent characteristics. Thus they weave a web of deceit around their brethren and find their sustenance in another’s anxieties.

Be content with what is your own and do not let your well-being be based on doing harm to your neighbor. You may find your livelihood in the simplicity of innocence. The man in possession of his own good knows nothing of waylaying others. He is not inflamed by the desires of the avaricious man, whose every gain is at the expense of virtue and a further incentive to cupidity. Therefore, ‘should he come to know his blessings,’ the poor man is truly happy who lives righteously in a manner which is to be preferred to all the treasures of the world, because ‘better a little with the fear of the Lord than great treasures without fear.’ How much under these circumstance does man need to support life? If you go beyond that little and seek that, also, which others find pleasure in possessing, that, too, has little to commend it: ‘It is better to be invited to herbs with love than to a fatted calf with hatred.’

Let us use our talents, therefore, for the acquisition of grace and the attainment of salvation, not for the circumvention of others who harm us not. We may well make use of examples taken from the sea, not for the purpose of exposing others to danger, but to make ourselves more perfect in the way of salvation.

The urchin, a tiny, common and despicable animal—I refer to the sea variety—is frequently used by navigators as a sign of a threatening storm or as a harbinger of clear weather. The reason for this lies in the fact that at the approach of a wind storm this little creature takes hold of a fairly large pebble and uses it as a sort of ballast or anchor so as to avoid being carried out of the water. Thus it balances and directs itself by means of an alien weight, not by its innate strength. This sign gives an indication to the sailor that a storm is brewing. Accordingly, he takes precautions lest the sudden approach of a hurricane may find him unprepared.

What follower of the occult sciences, astrologer, or Chaldean can reveal in a comparable way the course of the stars, the movement of the heavens, and of the zodiacal signs? By what natural instinct has the tiny creature acquired this art? What teacher has instructed it? Who served as its interpreter of augural lore? Men behold the turmoil in the air and are often deceived, because at times the winds rush in without bringing on a tempest. The sea-urchin is not beguiled. Never at any time do its special signs fail to bring results.

Whence did this tiny creature acquire such sure knowledge of the future? As there is nothing in the animal itself which can make possible such foreknowledge, be assured that it, too, has obtained the gift of prescience through the loving-kindness of the Lord of all things.

For, if God so clothes the grass of the field that we are struck with admiration; if He feeds the birds of the air; ‘if he provides food for the raven, when her young ones cry to God’; if He has given to women skill in the art of weaving; if the spider, who so artfully and delicately ‘hangs on the doorway her loose-woven nets,’ is not left bereft of wisdom; if He has given strength to the horse and sends forth terror from his mane, so that he exults in the field and laughs in the face of kings as he smells the battle afar off and is aroused by the sound of the trumpet—if He has filled with the largesse of His wisdom these manifold irrational creatures as well as the grass and lilies of the field, who can doubt but that He has distributed this gift of foreknowledge also to the sea-urchin?

He has left nothing unexplored, nothing unrevealed. He sees all who nourishes all. He fills all things with wisdom who, as it is written, ‘has made all things in wisdom.’ And so, if He has not neglected the sea-urchin as beyond the range of His visitation; if He has care of it and moulds it so as to enable it to see signs of what is to come—if that is true, has He no care of you and yours? Surely He has, as He testifies in the words of His own holy Scripture: ‘Look at the birds of the air’; if He feeds them, ‘are not you of much more value than they’? For, if God so clothes ‘the grass of the field which flourishes today and tomorrow is thrown into the oven, how much more you, O you of little faith?’

Are we to suppose that fish without a special gift of nature possess also that instinct whereby each species has allotted to it a definite space which no one species may leave and into which no other species may enter? What geometer has plotted the bounds of these habitations, never at any time to be broken? We have heard of one who has measured land, never of one who has applied measurements to the sea. Yet fish know their own confines, which are not bounded by city walls, by gates, or by buildings; neither are they marked as in the boundaries of fields. But each has a terminal limit of space in accordance with its need, so that only so much is given to each as to satisfy completely its wants—not so much as its unregulated greed can claim for itself.

There is, if I may say so, a law of nature that one should seek only what suffices for nourishment and that the allotment ‘which thy fathers have set’ should be in proportion to the need for food. One species of fish breeds and flourishes in one arm of the sea; another species, in another. Hence, you will not find different species of fish mixed together. What in one place is abundant is, contrariwise, lacking elsewhere. This bay is the haunt of the cephali. In another bay we find the sea-wolves. In still another live certain species of crustaceans. Each is not free to wander as it pleases, yet the passage is not impeded by intervening mountain ranges nor by river channels. Rather, by force of habit each one is by nature constrained to keep itself within the bounds of its native habitat and to consider suspect a fish that leaves the regions of its fellows.

But for us, men, there are far different sentiments. We desire change for various reasons: a wish for travel, for release from daily associations. We long for the approval of strangers and to remove the age-long boundaries which our ancestors have set up, adding estate to estate, household to household.

The earth alone does not suffice. We use the sea itself for our foundations. On the other hand, in compliance with individual whims, the land is excavated and sea water is brought in so as to form islands or straits for men’s use. Men claim the sea for themselves by right of ownership and boast that they have subjected fishes like slaves to a condition of servitude. This, they say, is my bay; that one belongs to another. Like sovereigns, they divide the elements among themselves. For some people, oysters are bred in water. For others, fish are enclosed in a fish pond.

The sea does not suffice for their luxuriant living. They must have reserve stores of oysters. They keep a reckoning of the age of each oyster bed. Receptacles are built for the fish in case the rich man’s table may not be replenished from the sea. How they are all ears when the word ‘neighbor’ is mentioned! How eagerly will they gaze on his possessions! What plans enter their minds day and night to take something away from their neighbors! ‘Shall they alone dwell in the midst of the earth?’ exclaims the Prophet. The Lord is aware of this and waits to punish them.

How alien to the fish is this monstrous greed! Men seek after what is remote in the realm of nature. They are familiar with the seas beyond the bounds of the known world. There no islands intervene, nor are there bodies of land either in that region or situated beyond that point. For that reason, in that place where the wide extent of water precludes every desire to gaze upon it and every sentiment of boldness to sail thereon for the sake of gain, there the whale is said to have his lair. There, too, live a huge species of fish, reported to be mountainous in size by those who have ventured to approach and see them. This huge fish lives tranquilly there, remote from islands and uncontaminated by the nearness of port towns. They have their separate habitats and locations all their own. They are unaffected by the presence of neighboring boundaries and do not desire frequent change of place and to flit aimlessly to and fro. Rather, they cherish their habitat as their native land and consider it a delight to dwell therein. They have selected these regions in order to pass their lives in solitary fashion, remote from interference and from contact with other creatures.

There is another species of fish which changes its location, not because of natural instability, but from the necessity of spawning. They formulate a plan and design to reach a certain place at a time of the year which is right and opportune. Gathering together, as if with joint purpose, from many places and from diverse inlets of the sea, they go out in search of the north wind, swimming in massed array. Impelled, as it were, by a law of nature, they hasten to their familiar haunts in the northern regions. If you were to behold this huge school of fish on the move, you would have the impression of encountering an ocean current—such is the force of their onward rush through the waters, such is their mad desire to reach the Black Sea through the straits of Propontis.

Who announces these places, who prescribes these seasons for the fish? Who has arranged their itinerary for them, their plan for mass movement, their destination, and the time of their return? Men, of course, have their commanders whose orders are waited, whose watchwords are agreed upon, whose edicts are made known to the people of the provinces for the purposes of assembly, and whose dispatches are sent to the military tribunes, fixing the day—notwithstanding all these preparations, many people find it impossible to come on the appointed days. What commanding officer has given the order? What teacher has given this instruction, what surveyor has plotted the journey, what guide has led the way, so that no obstacle is encountered?

But I am aware of the identity of the Commander, who by reason of divine dispensation infuses His orders in the senses of all created things, who, without the use of words, allows mute animals to follow the directions of natural instinct. His instruction reaches even to the smallest creatures; it is not limited to the largest. Fishes follow a divine law, whereas men contravene it. Fishes duly comply with the celestial mandates, but men make void the precepts of God. Because a fish is mute and deprived of reason, is it, therefore, an object of contempt in your eyes? See to it that you do not begin to be more contemptible to yourself, if you prove yourself to be more irrational than the irrational creatures.

What is more rational than this migration of fish, a procedure which becomes less intelligible as we recount it than it is when we look at the facts themselves. They advance in summer time to the straits of the Black Sea because the water in this region is sweeter than in others. The sun does not linger in those waters as long as it does elsewhere. There is not, therefore, a loss of sweet and drinkable water. Who is not aware of the fact that marine animals often find delight in fresh water? Hence it happens that different species of fish are frequently caught while they are on the way to spawn in the upper reaches of a river.

This, therefore, may be the reason why they manifest preference for the Black Sea. It may well be, too, that the prevailing north wind tempers the summer heat there. Again, they select that region as a more suitable one for the task of bringing up their offspring. Their young, in fact, can hardly endure exposure to the vicissitudes of a different climate. The gentle clemency of the climate in that locality fosters their growth. Accordingly, when their objective is achieved, all return together to the point from which they departed.

Let us reflect on the reason for this. The Black Sea forms a body of water which is exposed to the north wind and to other winds of the most violent nature. Hence, when a severe storm rages and tempests are brewing in that region, sand is churned up from the deep, as the turbidness of the water there gives proof. This condition is intensified by the force of the wind. The water becomes more dense and presents, we can be sure, an intolerable situation not only for sailors, but even for animal life in the sea. An additional reason is offered by the condition of the Black Sea itself. Into it flow numerous and mighty rivers. Hence, this body of water is very cold in the winter season and freezes over, augmented by the continual inflow. Wherefore the fish, acting like supreme lords of the waters, seek to take advantage of the cooler air there in the summer season. When they have enjoyed this pleasant temperature, they hasten back once more in order to avoid the wintry blasts. So they flee from the bitter weather of the northern regions and take themselves into other bodies of water where the winds are kindlier and calmer or where a more temperate sun can bring spring-like weather.

The fish knows ‘the time to be born.’ Solomon in his wisdom declared this to be a great mystery, this knowledge of the time to go and the time to return, the time for performance and the time for change. Fish are not deceived in this knowledge, because they follow an instinct of nature, the true teacher of loyal devotion, and not the deliberations of reason and rhetorical argumentation. Hence, all living creatures have a prescribed time for bringing forth offspring. By man alone are such times undetermined and ill-planned. The other creatures seek out a season of clement weather. It falls to women alone to give birth in seasons of inclemency. An unsettled and arbitrary desire to produce offspring leads to an uncertain time for childbirth.

Fish cross over so many seas in order to bestow some benefit on their species. We, too, cross over manifold seas. But how much more commendable is a voyage which is undertaken, not for the sake of material profit, but for the love of one’s offspring! Loyal devotion is the propelling motive in their case. In our case the motive is commercial gain. They bring back with them their own progeny, more precious to them than any kind of merchandise. Urged by a dire lust for gain, we bring back a cargo that is far from atoning for the dangers involved. They make an effort to reach their home, while we abandon it. They, as a result of their migration, acquire an addition to their species. We, on the other hand, in the course of navigation are subject to a decrease.

When we behold this preparation made with such keenness of instinct for a ritualistic migration to the north for the production of a numerous progeny, and again when we note that other marine animals possess such power in their tiny bodies that they are able to bring to a stop mighty ships sailing along under full sail, who would then deny that such an instinct and capacity have been infused in them by a divine power? We have reference here to a little fish called echeneis, which is said to slow up without effort a huge ship. The vessel seems to be adrift and, as it were, rooted in the sea, for at times this fish keeps the ship motionless. Do you suppose that this marine animal has such potential power without the aid of divine intervention?

What shall I say of the sword-fish, the saw-fish, the sea-dog, the whale, or the hammer-fish? What shall I say of the turtle which inflicts a sting even when dead? Just as a person who treads on the still palpitating head of a viper is said to suffer a more serious injury—in fact, an incurable wound—than he would from poison, so, too, a turtle when dead is reported to inflict a more dangerous wound from its sting than it does when alive. Again, the hare, which is a timid animal on land, is formidable as a sea animal and causes infection which spreads rapidly and is not easily cured. The Creator has so ordained it that not even at sea are you to be quite safe from lurking perils. Because of these few harmful creatures you should take your stand like a sentry on guard, armed always with the weapons of faith and the shield of devotion, awaiting the protection of your Lord.

We wish, now, to return to the Atlantic Ocean. What whales are found there, of huge bulk and measureless size! If they were to float on the surface of the sea, you would imagine that they were islands or extremely high mountains whose peaks reach to the sky! These animals are said to appear, not on the coast or on shore, but in the depths of the Atlantic Ocean. To catch sight of them sailors are enticed to risk navigation within those regions. But these elemental mysteries are not likely to be faced without experiencing mortal terror!

Now let us rise upward from the depths of the sea. Let our discourse emerge a little therefrom and take itself to higher regions. Let us take note of matters which are pleasing in themselves and which also have come under the observation of many people. We hear of water changing into masses of salt so solid that an axe is frequently required to cut it. In fact, we do not need to marvel at what is reported of salt in Britain. This takes on the appearance and the dazzling splendor of marble itself and, in addition, is a salutary aid to bodily needs of food and drink. Note, too, how the not unpleasing coral is only a sea plant which, when exposed to the air, becomes solid as a stone. We see how nature has inserted in the oyster a highly valuable pearl, which by the action of sea water has become a solid particle within the oyster’s soft flesh. Wealth which is hardly attainable by kings lies open to common gaze along our shores. It is found in, and gathered from, rugged rock and cliff.

Water also produces a ‘golden fleece’ and the sea coasts are the source of a wool which is similar in appearance to the metal just mentioned. Its color has not been duplicated up to now by those who apply to woolen goods different types of dye. For that reason human ingenuity is unable to compete with the natural products of the sea. We are aware of the care and attention given to the less costly sheep’s wool. No matter how perfect it is, under no circumstances do we find wool that comes naturally dyed. Here is a color that is natural—a color never yet approached by the application of dyes. And to think that this [golden] fleece is a fish! Moreover, the shell-fish that yields the purple which distinguishes a king is itself a marine animal.

What delightful scenes in meadow or garden can equal the prospect of a light blue sea? Your flowers may flash forth a golden hue, but the wool of the sea has its golden refulgence, too! Whereas the colors of the flowers quickly fade, the other retains its hue for many a day! From afar we note the lily’s brilliance in the garden. From afar, too, we see the flashing sails of the ships. A breath of perfume follows one; a breeze, the other. What use does a leaf supply to equal the advantage of the commerce of ships at sea? Lilies give us sweet odors for the pleasure of our senses, whereas sailing ships bring sustenance for mankind.

Add to this the picture of the flying fish and the frolicking dolphin. Moreover, there is the additional delight in the roar of the resounding billows, in the sight of ships flitting to shore or sailing out to sea. ‘Even as when from the barriers the chariots stream forth’—what an occasion for delight and enthusiasm on the part of the spectators! Yet, in contrast to the ships of commerce, the steed runs to no purpose. The latter, because devoid of cargo, runs in vain. The other has its holds filled with sustenance for men.

What is more to be desired than what is speeded along, not by the impulse of a whip, but by a breeze, where there is nothing to hinder one’s progress, where all is favorable, and where no one who reaches his goal is a loser. All the boats which come to land are given a wreath. The palm is the prize for a successful voyage and victory is the reward for their homecoming. What a difference between the outgoing course and the return! One shows a cautious pace. The other is affected by the urge to make the goal. Add to this the sight of the shore with its line of boats awaiting a breeze from the skies as a signal for the start. Whereas the charioteer at the conclusion of his race is granted mere empty applause, the boatmen take part in giving thanks for their safe return.

How shall I adequately speak of Jonas, whom the whale swallowed to grant him life and to return him to his activity as a prophet? The water restored to him the understanding which the earth had taken away. He who grieved when on land began to sing psalms in the belly of the whale. Again, the redemption of both elements is not lost sight of. The salvation of the earth had its forerunner in the sea, because the marvelous act of Jonas stands for that of the Son of Man. As Jesus lay ‘in the heart of the earth,’ so was Jonas in the whale’s belly. There is salvation in both elements. However, the sea furnishes a more significant example of piety, since a fish gave welcome to him whom men had repelled and has preserved, in the person of Jonas, Him whom men have crucified. Peter, too, weakened when on the sea, but he did not fall. What he had admitted on the waters, however, he denied on land. And so, in the former occasion he was accorded a hand-clap as to one who was loyal; in the latter case, because of his forgetfulness, he was met with a look of rebuke.

But now let us request the Lord that our words, like those of Jonas, be cast on the land and not be suffered to float any longer on the sea. And it was well that the gourd-vine sprang up so as to shield us from misfortunes. But the earth, now parched by the advancing sun, warns us to seek rest, lest our minds begin to suffer from the earth’s heat and our words, too, may fail us. Be assured that water has been given to us, more than it was to the Ninevites, as a source for the remission of sins.
'''
