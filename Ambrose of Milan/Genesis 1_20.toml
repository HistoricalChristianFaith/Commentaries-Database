[[commentary]]
quote='''
The entire earth was now arrayed in its verdant garb of diverse plants. The sun, too, and the moon, those twin luminaries, and the stars in their splendor shone forth in the heavens. A third element still remained, in which the blessing of life was to be bestowed by the gift of God. All things on earth are being sustained and nourished by the air above. The earth opening up the seeds gives life to everything. Then under the command of God’s word, it blossomed forth at the gift of creative life. Water alone seemed not yet to have been affected by the generosity of God’s’ gift. There still was something which waited for the hands of the Creator. With the water He saved a certain fitting and special endowment which He would set aside for the functions appropriate to it. The earth was the first element on which the boon of life was conferred, but this life has no animating soul. The water, in its turn, was bidden to produce that which would bestow the force and dignity of something that is alive—something that is provided with a sense of self-preservation and with the instinct of shrinking from death.

And God also said: ‘Let the waters abound with life and above the earth let winged creatures fly below the firmament of the heavens.’

At this command the waters immediately poured forth their offspring. The rivers were in labor. The lakes produced their quota of life. The sea itself began to bear all manner of reptiles and to send forth according to its kind whatever was there created. The tiny creeks and the muddy marshes were not without exercising the power of creation granted to them. Fish leaped from the rivers. Dolphins frolicked in the waves. Shell-fish clung to the rocks. Oysters adhered to the depths and the sea-urchins waxed strong.

Alas, enticement, the mother of our life of ease, existed before the creation of man! Before man there existed things to delight us! The temptation of man antedated his creation. But this was not nature’s fault. Nature gave us nourishment and did not prescribe vice. These things were given for common use. Therefore, you were not to claim anything as your own personal property. For you did the earth give generously of her fruits. For you did the waters generate the scari and the acipenseres and all their produce. Not satisfied with these, you have tasted food that is forbidden to you. Everything is heaped up before your envious eyes, so that the perversity of your greed may become all the more grievous.

But we are unable to record the multiplicity of the names of all those species which by divine command were brought to life in a moment of time. At the same instant substantial form and the principle of life were brought into existence; associated was a sort of vital vigor and power. The earth was replete with plants. The sea was filled with living things. In the one, vegetative life blossomed forth; in the other, animal life prevailed. In the earth, too, water claimed its part. The earth is laved by the fish of the sea. From it comes their prey. Gnats buzz and frogs croak even around the borders of the marshes that gave them birth. They, too, have heard the command of the Lord: ‘Let the waters abound with life.’

We know that the serpent species is given the name of ‘creeper’ from the fact that it is creeps over the earth. With more assurance we can say that every creature that swims presents the natural appearance of a creature that creeps. For, when these animals sink into deep water, they seem to cleave through it. Yet, when they swim, they seem to creep with their whole body as they propel it over the surface of the water. Hence David has also said: ‘This great sea which stretcheth wide its arms; there are creeping things without number.’ There are a great many such animals provided with feet for walking. They are amphibians, living either in the water or on land; for example, seals, crocodiles and water-horses. The latter are called hippopotamuses from the fact that they are generated in a river, in this case, the Nile. These animals do not walk, however, when they are in deep water. Rather, by using their feet they are able by swimming to propel themselves forward; not, however, as one would perform the act of walking. The animal makes progress as one would with the use of an oar, just as a boat glides along with the help of oars and ‘ploughs the waters with its keel.’

‘Let the waters abound with life,’ said the Lord—a brief statement, but a significant one and one that is widely effective in endowing with their nature the smallest and the largest animals without distinction. The whale, as well as the frog, came into existence at the same time by the same creative power. Without effort does God produce the greatest things. He is not averse to creating the least. Nature is not in pain when she gives birth to dolphins, just as she is not in pain when she produces tiny animals like snails and purple-fish.

Take note of the fact that there are far more animals in the sea than on land. Count, if you can, all the species of fish from the smallest to the greatest, for example, the cuttlefish, the polypus, the oyster, the sea and river crab, and even the different types among these. What shall I say of the different species of serpent, of the dragon, the murena, and the eel?—not to mention the scorpions, the frogs, the tortoise, the mustela, also, and the sea-dog, the sea-calf, the monstrous shark, the dolphin, the seal, and the sea-lion. What need is there to add to our list the sea-ousel, the sea-thrush, and the sea-peacock, whose colors we see in the feathers of birds as, for example, the black ousel and the peacock with its varied colored back and neck; also in the feathers of the thrush with its spotted breast and in the feathers of the rest of the birds whose names and species belong to this earth of ours? These, as a matter of fact, came into existence in the seas and in the multitudinous rivers, since the waters at the divine command were the first to produce ‘creeping creatures having life.’

Add to this the beneficence of God whereby what we cherish in the water is an object of fear on land. This is true, because what is harmful on land is in water without harm—even the water-snakes are bereft of poison. The lion is a terrifying animal on land; he is gentle in the water. The murena, which is said to be somewhat harmful, is a choice table food. The frog is repellent when in the marshes, is pleasing when in water, and excels all in its deliciousness as food. If you desire to know more on this subject, make enquiry of fishermen in different localities, for no one person can possibly know all there is to know.

Be on your guard, of course, against dogs; even those in the sea. These the Apostle instructs us to beware of and to avoid even in the Church: ‘Beware of the dogs, beware of the evil-workers.’ The mustela (marten), which on land is malodorous, is sweet-smelling in the sea. As a land animal it is capable of defending itself by its odor; as a marine animal, it affords no less pleasure when caught than when it is free.

I shall not refrain from addressing by name the thymallus, endowed with the name of a flower. Wherever you are found, whether in the waters of the Ticino or of the beautiful Adige, a flower you are. A more forceful testimony to the fact that you give forth a sweet odor lies in the facetious remark: You smell like a fish or a flower. According to usage, therefore, the odor of the fish is identical with that of the flower. What is more pleasing than your appearance, more delightful than your sweetness, and more fragrant than your odor? You emit from your body an odor which may well be compared to that of honey.

What shall I say of the tender qualities of the ravens and wolves of the sea? These wolves do not inspire fear in lambs. Such is the charm of water that its sea-lions flee from the sea-calves, as follows from the prophetic utterance on the sanctity of the Church: ‘Then the wolf and the lamb shall feed together, the lion and the ox shall eat straw.’ This is not to be wondered at, since even in the Church the effect of water [of baptism] is such that the guilt of the wicked, once it is washed away, has become assimilated to innocence.

Why should I make mention here, also, of the purple of kings which adorn their banquet halls and give color to their garments? What is venerated in kings is a gift of water; of water, too, is the brilliance of their array. Add to this fact that the sea-pig was esteemed by the Jews, because there is nothing impure which water does not make clean. For this reason, that which is not in the same status as the land animal they cannot consider to be impure.

Innumerable are the ways, innumerable, too, are the species of fish. Various kinds of larger fish, such as trout, produce eggs. They entrust these seeds to the fostering care of the waters. The water, therefore, like a fond mother of living things, gives them breath and life and carries out the function, as if it were a perpetual one, provided by the first primal law. Others, such as the female of the mustela, produce from their bodies living offspring. This is true of the sea-dogs and the monstrous whales, the dolphins, seals, and others of that species. If, perchance, when they have brought forth their offspring, they have a presentiment of some situation of extreme danger, in order to protect their youthful progeny and to allay their panic, they have recourse to the following manifestation of maternal affection. Opening their mouths, they cause their offspring to attach themselves to their teeth, which in this case cause no harm. It is related, also, that they receive and hide their offspring within their bodies, even within the womb that bore them.

What human emotion can compare with this devotion on the part of fish for their progeny? We are satisfied to offer a kiss. It is not sufficient for them to open their wombs to receive their young. They invite them back without inflicting harm and reanimate them by the fostering heat of their bodies. They restore them by their breath, so that they live as two in one body. This they do until conditions are safe for their young or while by the interposition of their bodies they are able to defend their own brood from the perils which lie in wait for them. Who on beholding this devotion would not, even though he were able to attain it, consider himself to be their inferior by far? Who would not in his wonder be astonished that nature should retain among fishes that quality which men have lost? Many men have slain their long-wanted sons because of suspicion and hate of a step-mother. Others, as we read, have eaten the flesh of their own children. A mother became the tomb of her own dear ones, whereas the womb of the parent fish serves as a sort of rampart to protect the innocent fosterlings sheltered within her womb.

Different species of fish, therefore, follow diverse customs. Some produce eggs; others give birth to offspring alive and already formed. Those which produce eggs do not, as birds do, build a nest. They do not undergo the fatigue resulting from an extended period of brooding; they do not at great discomfort to themselves give nourishment to their young. The egg falls and is received in the womb of mother nature, who welcomes it as a fond nurse would, quickly forming it into a living being by the exercise of fostering care. No sooner is the egg given life by the touch of the parent that it falls and fish issues forth.

And then what pure and untarnished generations follow without intermingling one after another, so that a thymallus produces a thymallus; a sea-wolf, a sea-wolf. The sea-scorpion, too, preserves unstained its marriage bed. Thus it shares in the chastity of its species, but not in its poisonous qualities, for the sea-scorpion does not sting. On the contrary, it has curative qualities.

Fish, therefore, know nothing of union with alien species. They do not have unnatural betrothals such as are designedly brought about between animals of two different species as, for instance, the donkey and the mare, or again the female donkey and the horse, both being examples of unnatural union. Certainly there are cases in which nature suffers more in the nature of defilment rather than that of injury to the individual. Man as an abettor of hybrid barrenness is responsible for this. He considers a mongrel animal more valuable than one of a genuine species. You mix together alien species and you mingle diverse seeds. You go to the extent of frequently forcing animals to a forbidden copulation—all this in the name of ‘efficiency.’ And because you cannot cause in man a lack of fecundity by a mingling of species, you take from man that with which he was born—you take what is virile from man and deny him the use of his sexual organs. In this way you make a man a eunuch, so effecting by your audacity what is denied to man by nature.

How good a mother water can be we can learn from the considerations that I here propose. Man has taught that parents should repudiate their sons; he has taught separations, hates, and injuries. For your benefit learn of the close ties between parents and children.

Fish cannot live without water. They cannot endure separation from the association with their parents and from the nourishment provided for them. Nature has so ordained it that they die immediately when they are separated from their element. They do not live, as other animals do, by breathing this air of ours. Nature has not furnished them with the means of respiration; otherwise, they would not be able to keep living under water without breathing in air. Our air corresponds to their water. Just as air provides for us the means of living, water for them serves a similar function. Life leaves us the instant our organs for breathing are cut off, because we cannot even for a brief moment be deprived of the breath of life. When deprived of their sustenance in water, fish, too, cease to live.

The reasons for this are clear. We have lungs which receive the air as it enters through the larger passages of the thorax. Being permeated with numerous pores, the lungs are able by the infusion of air to cool the internal heat. When the thorax receives nutriment, it separates what is superfluous from the health-giving juices and the blood; so, too, the lung is accessible in order that the intake of air may all the more readily reach it. Fish are furnished with gills which sometimes fold up and close, at other times expand and open up. In the process of closing and opening, the function of respiration is carried out as water is received and transmitted within.

Fish, therefore, have their own peculiar nature, which is not shared with other animals. They have distinctive habits and find their material for sustaining life in a very special and alien substance. Wherefore they do not receive nourishment from man and do not find, as land animals do, any pleasure and delight from the touch of man’s hand, not even if they are kept alive in private fish-ponds.

What shall I say about the closely packed arrangement of the teeth of fish? They do not have what sheep and oxen possess, partial denture on one side of their gums. Rather, they are armed with teeth on both sides, because, if they delay in the act of swallowing their food in water, their prey could easily be washed and carried away by the water’s action. For that reason their teeth are closely-packed and sharp so as to be able to bite and dispatch quickly their food and swallow it easily without delay. Hence, they do not chew the cud, as the scarus is said to do, if we are to believe those who either by chance or design have come to know such matters.

To be sure, not even these have been able to escape experiencing acts of violence imposed on them by their fellows. The weaker everywhere are subject to the greed of the more powerful. The weaker one is, the more is he an object of prey. Many, it is true, feed on herbs and tiny worms, but there are those, also, who devour each other and feed on their own flesh. The lesser among them is the food of the greater and the greater in his turn is attacked by one stronger than he. The one who uses another as his prey becomes the food of still another. So it comes to pass that he who has devoured one fish is devoured in turn by another. They both meet in the same belly: the devourer and the devoured. The result is that together in the same entrails there is fellowship of victor and avenger.

In their case, perhaps, this violent way of living has grown from inner compulsion, whereas with us it springs from avarice, not from nature. Again, fish are given to man for his use. They also constitute for us a pattern of the vices to be observed in our society. They serve, too, as an example to be avoided, lest the attack of the stronger on the weaker may present an occasion for the former to be exposed in turn to the violence of one who is still more powerful than he. In this way the person who does injury to another prepares for himself a snare for his own ultimate destruction.

Those of you who attack another with deadly intent and those of you who drown the weak and pursue your victim even into the depths follow the example of this sort of fish. Be on your guard, while you are in pursuit of him, against an attack of a still stronger foe. The person who escapes your trap may well lead you into another. While he is in dread of the calamity in store for himself, your misfortune may first come before his eyes.

What is the difference between a rich man driven by his wicked lusts to absorb the patrimony of the weak and the fish called silurus whose belly is filled with the blood and flesh of smaller fish? ‘The rich man died’ and his spoils were of no use to him. Why, even the infamy of his deeds of depredation have made his name a by-word. The silurus is taken and the futility of his predatory acts is revealed. How many are the fish found here who have themselves devoured others! And you, rich man, have in your conscience the fate of one who preyed on another, who had himself come into possession of a poor man’s patrimony. In ruining him you added two patrimonies to your possessions, yet you are not satisfied. You say that you are taking vengeance on others when you are performing the same deed for which you are seeking vengeance. Thus, you are more unjust than the unjust, more iniquitous than the iniquitous, more avaricious than the avaricious! See that you do not come to the same end as the fish. Beware of the hook and the net!

But you do not anticipate any resistance to your power. The silurus did not foresee that someone would throw out a fish-hook or stretch out a net. He believed that, if he were caught in the net, he would be able to break through it. Still he did not escape the fisherman’s trident. He became enmeshed in bonds that were too strong to permit him to escape. Without a doubt, the more serious the iniquities which he commits, the more difficult is it for a person to escape his crimes, until one day he is forced to pay for his evil deeds the debt which is certainly difficult for him to avoid.

We are justified, therefore, in comparing man to a fish. Listen to the reason for that statement: ‘And the kingdom of heaven is like to a net cast into the sea that gathered in fish of every kind. When it was filled, they hauled it out and sitting down on the beach, they gathered the good fish into vessels, but threw away the bad. So will it be at the end of the world. The angels will go out and separate the wicked from among the just and will cast them into the furnace of fire.’

Fish, then, are either good or bad. The good are preserved for their reward; the bad are straightway burned. The good fish is not ensnared by the net, but is lifted up. He is not slain or killed by the hook, but is suffused with the blood of a precious wound. In his mouth is found the good price by which the apostolic tribute and the tax due to Christ may be paid. For thus is it written in the words of the Lord: ‘From whom do the kings of the earth receive tribute or customs; from their own sons or from others? And Peter replied: “from others.” The Lord said: “Go to the sea and cast a hook and take the first fish that comes up. And opening its mouth thou wilt find a stater; take that and give it to them for me and for thee.”’

Do not, then, hold in fear, my good fish, the hook of Peter. It does not kill. Rather, it consecrates. Do not underestimate yourself because your body is weak. You have in your mouth something which may serve as an offering for Peter and for Christ. Do not hold in fear the nets of Peter, to whom Jesus speaks: ‘Put out into the deep and lower your nets for a catch.’ He does not throw out his net on the left, but on the right side as was commanded by Christ. Do not have fear for his catch, because it was to him that was said: ‘Henceforth thou shalt catch men alive.’ He threw out his net, therefore, and caught Stephen, who in the Gospel was the first to arise having in his mouth a stater of justice. Whence he called out with sure confession of faith: ‘Behold I see the heavens opened and the Son of Man standing at the right hand of God.’ The Lord Jesus is a true representative of this fish, for He knew that in the mouth of the fish there was the tribute of His tax. Stephen, a generous witness of his faith, fulfilled the judgment and the teaching of Peter on him as well as the grace of Christ by a glorious martyrdom.

Do not be troubled by the fact that I have compared the Gospel to a sea. The sea is the Gospel on which Christ walked. It is the Gospel on which Peter, with the support of Christ’s right hand, discovered a defense for his faith and the grace of stability, although he swerved from the way by denying Him. And it is precisely from the Gospel that Stephen arose. The Gospel is the sea in which the Apostles fish, into which is cast the net which is like the kingdom of heaven. The Gospel is the sea in which the mysteries of Christ are revealed. The Gospel is the sea by which the Hebrew made his escape and the Egyptian was overwhelmed and slain. The Gospel is the sea, because the Church is the bride of Christ and is also the plenitude of divine grace, which is poured over the seas, as the Prophet said: ‘He hath founded it upon the seas.’ Man should immerse himself in the waters, because he is in truth a fish. Let not the floods of this world overwhelm you. If there is a storm, make for the high seas and the depths. If the weather is calm, play in the waves. If a tempest should come, beware lest the seething waters drive you on the rocky shore, for it is written: ‘Be therefore wise as serpents.’

Since the example of the cunning serpent has been offered, let us be cunning, also, in regard to entrance into the state of matrimony and to remaining therein. Let us love this mutual association which has become our lot. If those who have at the time of their births lived in entirely different regions yet agree to live together, if it happens that the husband should undertake a trip to a foreign land, no distance or abstinence should diminish the cherished love of the pair. The same law binds the present and the absent; the same bond of nature cements together the rights of conjugal love between the absent as well as between the present. The necks of both parties are linked together in the same beneficent yoke, even if one of them should find himself in regions entirely remote, because both parties share in the yoke of grace which is one of the spirit, not of the body.

When the viper, the deadliest kind of animal and the most cunning of the whole species of serpents, evinces a desire for copulation, he searches for a sea-murena already known to him or he seeks for a new mate. Proceeding toward the shore, he makes his presence known by a hissing sound, whereby he invites conjugal embrace. The sea-murena does not repulse the appeal and yields to the poisonous serpent the desired enjoyment of their conjugal bond.

What is the purpose of such a discussion as this, if it does not mean that we should put up with our married partner and, if he is away from home, that we should await his return to his family? Although he may be cruel, deceitful, uncouth, wayward, and drunken, can this be more intolerable than the poison which is no obstacle to the sea-murena in dealing with her mate? When invited, she does not fail to respond and embraces the slimy serpent with great affection. The male endures your defects and your feminine levities. Can you not bear with your husband? Adam was deceived by Eve, not Eve by Adam. It is right that he whom the woman enticed to do wrong should assume the office of guide, lest he fall once more because of feminine instability.

But he is repugnant and uncouth! Yes, but he pleased you at one time. Do you think that a husband should be chosen more than once? The ox and the horse look for and cherish their mates, and, if a substitution takes place, they are unable to carry the yoke together. They feel that they do not form an integral part of the team. You repudiate your yoke-mate and think that a frequent change should be made. If one day he fails you, you bring in a rival and straightway without knowing why, yet knowingly, you do violence to your sense of modesty.

The viper searches for his absent mate, calls to her with a hiss of invitation. When he feels his mate approaching, he spits forth the poison with due regard for his consort and the nuptial rite. Why do you repel your husband coming back from a far country? The viper gazes upon the sea in an endeavor to find his consort. You put obstacles in the path of your husband. You stir up the poison of litigation. You reject him and in the conjugal embrace emit dread poison, scorning your husband and putting to shame your nuptial bond.

As for the man—for we can apply this example to him, also: lay aside the inordinate emotions of your heart and the rudeness of your manners when you meet your patient wife. Get rid of your obstinacy when your gentle consort offers you her love. You are not a master, but a husband. You have not acquired perchance a handmaid, but a wife. God designed you to be a guide to the weaker sex, not a dictator. Be a sharer in her activities. Be a sharer in her love. The viper pours forth his poison; can you not get rid of your hardness of heart? Although you have by nature a severity of character, you ought to temper it in consideration of your married state and control your tendency to rudeness by holding in respect your conjugal relationship.

There are occasions for sin. Do not seek the bed that belongs to another. Do not by guile enter into another union. Adultery is a grievous offense. It does violence to nature. At the beginning God formed two creatures, Adam and Eve; that is, man and wife. He formed woman from the man; this is, from the rib of Adam. He bade them both to live in one body and in one spirit. Why, then, do you cleave one body apart? Why do you divide one spirit? That is an adulterous offense against nature. It is a lesson which is taught us by the willing union of sea-murena and viper, a union not grounded on similarity of species, but on ardent desire. Give ear, men! He who desires association with such a serpent may be likened to one who seeks occasion to have adulterous relations with another man’s wife. It can be said that he has the very traits of a serpent. He hastens to the viper who embraces him in the devious ways of lubricity, not in the righteous ways of love. He hastens to one who takes up again his poison like the viper and who is said to consume again the poison, once the act of copulation has been completed. The adulterer is like a viper. Hence Solomon says that when a man is intoxicated his passions are aroused. His body is swollen as if bitten by a snake and his poison is spread abroad like a basilisk’s. That you may realize that he has spoken of an adulterer, he added these words: ‘Thy eyes shall behold strange women and thy mouth shall utter perverse things.’

Do not form the opinion that we have based our argument on contradictions, in that we have made use of the example of a viper in order to point both a good and a bad moral. It serves the purposes of instruction to bring forward a two-fold consideration. On the one hand, we are like the serpent in being ashamed to be loyal to our beloved. Again, by severing the bonds of holy matrimony we prefer the harmful and the lubricous, as in the case of union with a serpent, to what is really and truly salutary.
'''
