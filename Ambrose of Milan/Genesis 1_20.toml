source_title="The Six Days of Creation"

[[commentary]]
quote='''
He remained silent for a little while and then resumed his discourse.

We have shied away, beloved brethren, from the necessity of dealing with birds, and our discussion on this subject might have taken wing along with the birds! It follows, somehow, as a natural consequence that those who hold some object in view or who desire to give expression to it in words are apt to take on the qualities of that which they behold or of that which they express orally. The result is that we linger, when exposed to what is more than usually inactive, and our observation takes on speed with the swift action of the object in view. This variability extends, also, to the area of literary style. Accordingly, at the moment when I am on my guard lest objects sunk deep in the sea may escape my observation—at such a moment the entire race of winged creatures has already escaped my ken. While I was bent over in diligent examination of the lowest depths of the sea, I paid no heed to the aerial flights of birds and not even the shadow of ‘nimble wings’ flashing in the waters has caused me to verge from my task.

In fact, when I arrived at the point where I believed that I had exhausted my subject, and when I felt that I had completed the fifth day, this reflection came into my mind: It is customary for the birds at nesting time ‘to charm the sky with song,’ in joy that their allotted task is done. This usually happens, following, as it were, a ritual pattern, at dawn and at sunset, when the birds sing the praises of their Creator, at the moment of transition from day to night or from night to day. By such an omission I would have lost a mighty incentive for arousing our religious devotion. For what person of natural human sensibility would not blush to terminate the day without a ritual singing of the psalms, since even the tiniest bird ushers in the approach of day and night with customary devotion of sweet song?

Let us return, therefore, to a discussion of the winged flock. We have almost lost sight of them as, like eagles they have taken flight, and hidden themselves amid the clouds. We realize that our pen should be recalled to the task when our eyes, laved in the waters, reached from the sea upwards to the sky and there beheld the birds ‘borne through the empty air.’ You who are snarers of my words will act as judges as to whether they have flown off with better purpose or whether they have fallen into your nets to add to your good fortune.

I am not disturbed in my discussion on birds by any possibility of boredom in your part—a boredom which was not in evidence when I examined the depths. Otherwise, some of us would have nodded off during my sermon, only to be awakened by the song of birds. But I surely have no doubt that those who kept awake amid the mute company of fish will be unable to fall asleep when the birds sing, such is their charm to inspire wakefulness. A subject which might well have been passed over in our treatment of the third part of created living beings should not, in fact, be regarded as an indifferent one. The fact that there are three races of living creatures those of the earth, the air, and the water—is not open to doubt. Therefore it has been written: ‘Let the waters bring forth reptiles, living creatures according to their kind, and winged creatures, flying over the earth along the firmament of heaven, each according to its kind.’

We are recalled to our previous theme like forgetful travelers who, because they have heedlessly passed their destination, are compelled to return. He, however, is a good traveler who makes up for the loss of time involved in retracing his steps by corresponding speed in the rest of his journey. I believe that I should act especially in this way now that I have come to the subject of birds, whose speedy flight often dazzles the eyes of men. Why should one see fit to linger in those subjects in which swiftness generally brings pleasure? Let our discussion get on its pathless and unwonted way of literary composition. Let it resound and ‘ring with the musical song of birds.’

But where shall I find the swan’s song which gives us pleasure when sung in moments of grave danger, even to the point of imminent death? Where shall we find those strains of natural chant which emanate even from marshy regions—strains of most tuneful and delightful music? Where shall I find the voice of the parrot and the sweet song of the blackbird? Would that the nightingale were to give forth a song to arouse a sleeper from his slumber! That is the bird accustomed to signal the rising of the sun at dawn and to spread abroad joy more penetrating than morning light. Still, if sweetness is lacking to their song, we have with us the moaning turtle-dove, the cooing pigeon, and ‘the raven who with deep tones calls down the rain.’ Wherefore let us illustrate as far as we can in our discourse the ‘haunts of the birds’ in the countryside, relying on the knowledge which we have garnered from rustic folk.

Now that we have discussed creeping creatures in the water, it is a highly difficult task to transfer our discourse at a moment’s notice upwards to the birds in the sky. Let us, then, first speak of these birds which frequent the seas and the rivers. With their aid we can emerge. Accordingly, let us begin our discussion with the halcyon. This is a sea bird that is to be found bringing up her young on the shore, depositing her eggs in the sand about mid-winter. This is the time allotted for the hatching, when the sea is at its stormiest and the waves make their most destructive inroads on the shore. Wherefore the graciousness of this bird should appear all the more evident because of the periodic and unexpected recurrence of calm weather, because atmospheric conditions suddenly take on a milder tinge at the moment when the eggs are laid, when the sea is still stormy. The stormy blasts and violent winds subside while the halcyon broods over her eggs, ‘when the sea was at peace and still.’ The eggs are hatched in seven days. At the end of that period the young brood leaves the protecting shell. At this point there is another period of seven days, during which the fledglings are nourished until they grow to maturity. Do not wonder at the fact that such a slight amount of time is needed for their growth, because very few days are necessary for the completion of the brooding stage. So much significance has been accorded by divine power to this tiny bird that sailors keep on the lookout for these fourteen days, which they call ‘halcyon days,’ during which they expect calm weather and dread no more the tumult of the raging tempest.

‘Are you not of more value than the sparrow?’ Thus the Lord spoke. If, therefore, at the sight of a tiny bird the sea rises suddenly and as suddenly subsides, and if in the midst of winter’s cruel storms and tempests a tranquillity, permeating all the elements, ‘sweeps the clouds from the sky,’ quickly calming the waves—if this is true, do you realize, you, a man made to the image of God, how much hope you ought to have, if only in your eagerness for a pious life you would imitate that little bird’s trusting confidence. The halcyon is not turned aside from her purpose at the sight of the approaching tempest and of the winds that rage at winter’s onrush—rather, she is impelled all the more. Hence she lays her eggs on the shore where the sand, still wet from the retreating waves, welcomes them. She does not dread the rising waves, which she beholds as they break on the shore with threatening sound.

And that you may not conclude that the halcyon shows slight regard for her eggs, she builds her nest without delay at the very place where she laid her eggs. She broods over her offspring and, while the waves pound the shore, shows no fear for her own safety. Rather, she entrusts herself to the winds and waves, secure in the beneficence of God. That is not all. Many more days still remain to complete the period of growth. During this time she has no fear that the tranquillity of the perfidious sea will be broken. She relies on her own merits, based now on the regular pattern of nature. She does not hide her brood in some secret corner of a house or in a cave. On the contrary, she entrusts them to the bare, cold ground. She does not protect them from the cold, but considers that they will be safer with the comfort of divine warmth, by means of which she may all other things disdain.

Who is there among us who does not cover his little ones with garments and who does not protect and shield them within the walls of his home? Who is there who does not close the windows on all sides to prevent even the slightest breeze to enter? And while we so anxiously attend to clothing and warmth, we are therefore depriving them of the protecting cover of celestial clemency, whereas the halcyon, by casting her brood out naked, has thereby clothed them with vesture that is divine.

I shall not overlook the diving gulls. They have acquired that name from their frequent diving operations. They are always able by their diving to gather signs of the approach of a wind storm. When they see a threatening tempest, they quickly ‘fly back from mid-ocean’ and withdraw ‘while their screams rebound on the shore’—to safety! What shall I say of the waterfowl—a bird that finds delight in the depths of the sea? Soon he sports in the shallows, after taking refuge from the sea’s upheaval which he foresaw. And the heron that is found to frequent the marshes ‘quits his familiar haunts’ and, fearful of the rain storms, ‘soars above the clouds’ to escape the storms generated in that region. Let us take note of the different varieties of sea birds, who at the coming of a wind storm take refuge in marshy regions, where they find a safer and for the moment a more pleasant habitation. They rummage round after their familiar food in some remote corner of the world.

Who does not marvel at the nightly sentry watches of the geese, who give evidence of their vigilance by their constant cackling? That was the way in which they defended even the Roman Capitol from the Gauls. You, Rome, rightfully owe to them the preservation of your empire. Your gods were sleeping, but the geese were awake. And so on those festal days you perform sacrifices, not to Jupiter, but to a goose; your gods give way to the geese, who were once their defenders, as they came to realize. The gods themselves might have been taken prisoners were it not for their aid.

After our description of the various fishes we have appropriately taken up next in order the subject of those birds that are also associated with water, in so far as they, too, in a similar fashion find pleasure in the art of swimming. Hence these birds seem to be primarily related to the fish species, since each has a certain element in common, that of being able to swim. The second elements which fishes and birds also share lies in the fact that the art of flying is an aspect of that of swimming. As a fish cuts through the water in the act of swimming, so a bird ‘cuts the air’ in his swift flight. Both species are provided in a similar way with tails and ‘with the oarage of wings.’ So the fish directs himself forward and advances to distant points by the aid of his wings [fins]. He uses his tail as a rudder in order to guide himself or change his route by a sudden movement from one area to another. Birds also exercise their wings in the air as if they were floating on water, using them in the way one would use one’s arms. By use of their tails they are able to direct themselves upward or downward at will.

Hence, while all of these species follow the same pattern, they are but complying with the divine precept that places the origin of both in water. For God said: ‘Let the waters bring forth reptiles, living creatures according to their kind, and winged creatures flying above the earth along the firmament of heaven, each according to its kind.’ Not without reason, therefore, do both species have the innate faculty of swimming, since both have their origin in water.

While, of course, both the slimy snake and all species of serpents—who derive their name from the fact that they creep, not walk—and the dragon, too, like the general run of fish are without legs, nevertheless there is no species of bird devoid of the use of legs. They need to obtain food from the earth. For this reason they use the support that legs give as a necessary aid in acquiring their natural food. Accordingly, other birds like the hawk and the eagle, who live by plunder, are provided with claws to catch their prey. Others make fitting use of them in the acts of either walking or of searching for food.

There is one name for ‘bird,’ but there are various species. Who can know them all or hold their names in memory? There are birds, for example, who live on flesh. Hence, they have sharp claws, a curved and sharp beak, and are swift on the wing. Thus they live by plunder, and are able to lay hold of what they pursue, and with their beaks and claws eviscerate it. There are birds, also, that search for and find their food in seeds. Others search for different kinds of food as they come upon them.

There is diversity, too, in the way in which they group together. Those birds that are intent on plunder are devoid of this tendency. They do not act in common, because of their rapacity and the necessity of snaring their prey. Hence they disassociate themselves from groups—for greed avoids participation—moreover, a large flock would easily betray its own purposes. For birds of this sort there is no group life except that of conjugal relationship. This is the mode of life among the eagles and hawks. On the other hand, birds such as doves, cranes, starlings, crows, ravens, and even thrushes flock together for the most part.

There are also other species of birds. Some are stationary, that is, stay in one place. Others are migratory birds who fly off to other regions and return at the end of winter. Still others return to us in winter time and fare abroad in summer. In the former case they seek a warmer climate in winter. In the latter case they spend the summer each year in those places which they know to be pleasanter. Hence thrushes return at the end of autumn when winter is already beginning and summer has passed for them. We contrive snares for them, acting as cruel hosts. We catch them in different ways, either by surprising them when they land or by deceiving them by a whistling sound, or by trying ‘to snare game in toils.’ The stork returns, holding high the standard of spring. The crane, because of his partiality for flying high, often finds delight in voyaging afar.

Some birds submit themselves to be handled. They are ‘accustomed to the table,’ and are delighted to be fondled. Other birds shrink from this through fear. Some find pleasure in frequenting man’s habitations, whereas others choose to live in remote deserts, where their difficulties in procuring food find compensation in their love of liberty. Some birds utter cries, while others delight us with sweet and modulated song. Certain birds by nature, others by training, learn ‘to match the measures’ of different tones, so much so that you would think a man, and not a bird, had spoken. How sweet is the voice of the blackbird; how distinct the words of the parrot!

There are also other birds; some guileless like the dove, or artful like the partridge. The cock is inclined to be boastful; the peacock, to be vain. There are birds, too, that display diversities in their lives and habits. Some love to consult together in groups, thus helping to form by their combined strength a state of their own under a king. Other birds love to look out, each one for his own interest, avoiding a systematic rule, and, when captured, long ‘to quit a slavery’ that is disdainful to them!

Let us begin, then, with those birds which have become examples for our own way of life. These birds have a natural social and military organization, whereas with us this service is compulsory and servile. How well do the cranes carry out their guard duty at night without orders and without compulsion! You may note the watchers at their appointed places. Again, while the rest of the flock is at rest, some make the rounds and make certain that no attack is attempted from any quarter. With unabated vigilance they render complete protection. When the watcher has completed his period for guard duty, he prepares for sleep, after arousing with a warning cry the sleeper who is destined to take his place as the next sentry. The latter willingly accepts his lot. He does not act as is the custom with us when, under such circumstances, we are loath to give up our sleep. Rather, he rises eagerly from his resting place, performs his duty, and repays with equal care and courtesy the favors that he has received. Hence there are no deserters, because their loyalty is a natural one. Hence their guard duty furnishes real protection, because their wills are free.

They also follow this procedure when in flight. In this way they alleviate fatigue as they perform in turn the function of leadership. At a certain prescribed time one takes, a position ahead of the rest, in advance of the banners, so to speak. Later, he turns back and yields to a successor the task of leading the flock. What is nobler than this, wherein toil and preferment is open to all, where power is not the privilege of the few, but is distributed in voluntary fashion equally among all?

This was the functional process of the primitive community. It resembled the constitution of a free state. From the beginning men began in this manner to establish a political system based on nature, with the birds as models. Thus there was equal participation in both labor and office. Each individual in his turn learned to set up a division of responsibilities, to take his share in doing service and in supervising it. Thus no one was devoid of office and no one was without his allotment of work.

Here was an ideal state where no one became accustomed to unbroken power. Again, no one was intimidated by a long period of servitude, because advancement, due to interchange of office and to the fitting measure of its duration, appeared all the more supportable in that it resulted in establishing that each one would have a share in the task of government. No one ventured to exact servitude of another when the latter in his term of office could retaliate with frowns of scorn. Toil was not heavy when the thought of a dignified office in the future could bring comforting relief.

But when the lust for domination began to arrogate to itself powers that were acquired, and when this same lust encouraged unwillingness to relinquish powers that were assumed, when military service began to take on the character of servitude rather than of a right shared by all, when men were more eager to seize power than to follow due process of law to attain it—when this became a fact, then the performance of hard tasks was regarded as a burden and what was not undertaken voluntarily left the way open for displays of negligence. How unwillingly do men submit to be assigned to guard duty, how difficult it is to induce anyone to accept a perilous post in camp, when the vigil is imposed by the command of a king! Penalties are set for neglect of duty. Yet, indifference often asserts itself and the sentries fail to be vigilant. That necessity which imposes obedience on the unwilling is often accompanied by a loathing, for nothing is so easy as not to seem difficult to one who acts unwillingly. Therefore, unbroken toil repels good will. Continuous and prolonged power breeds arrogance. Where can you find a man who of his own volition lays down his imperial office, gives up the insignia of his leadership, and willingly moves from the first position to take his place among the last? Not only do we struggle to reach first place, we are often concerned even about a position of modest import. We lay claim to the first position at a banquet and, moreover, we desire that what has once been assigned to us should be ours in perpetuity.

On the other hand, the cranes carry out their activities with equanimity and perform their official duties with humility. They are instructed to take up in their turn the post of watch. No admonishment is necessary that they lay down their powers. In the former situation the tranquillity of natural sleep has to be broken; in the latter, an occasion presents itself to show their pleasure in the performance of a voluntary act of service.

It is related that storks proceed in orderly array in the direction in which they propose to advance and that in many places in the East they form ranks together as if they were soldiers marching under the command of an officer. You could well believe that you were witnessing an army going forward with banners displayed—such is the pageant of military precision which they show. They are under the leadership and direction of crows who accompany them, providing a stout escort and auxiliary force against any attacking army of birds. They undertake at their own risk campaigns that are planned by others. A proof of this is deduced from the fact that these crows are not found to stay any length of time in these regions. Moreover, when they return, they are covered with wounds. Clear evidence of their having undergone a severe and bitter conflict may be gathered from what may be termed their cries of blood and from other indications. Who, then, has set forth for them the penalty for desertion? Who has laid down the laws of severe punishment for dereliction of military duty? The fact is, no one attempts to steal away from the lines of these friendly escorting troops. On the contrary, each one strives to outdo his companions in carrying out his allotted task.

Let men learn to preserve the rights of hospitality and from the example of birds realize what reverence is due and what courtesies accorded to one’s guests—courtesies which expose crows even to danger. Whereas birds offer even their own lives for strangers, we close our doors to them. We ban from our doors those birds who at the risk of peril to themselves serve as escort to others. Whereas the storks consider these as their defenders, we frequently treat them as enemies.

I may be in error, but this may have been the reason why the people of Sodom suffered punishment or why the fury of the Egyptians, when they attempted war on the people who had been their guests, brought its penalty for their lack of hospitality when the waters overwhelmed that perfidious race.

We should dwell on the fact that while the gentleness of human beings is equal to the loyalty and wisdom of this bird [the stork], none of us have effectively imitated the virtues of irrational creatures, not even when an example has been set before our eyes. In fact, the offspring, gathering around the body of their ‘father sick unto death,’ cherish with the movement of their wings the limbs of their parent, now, because of his advanced age, bereft of his plumage and deprived ‘of the oarage of his pinions.’ Furthermore—need I add—the offspring offer a contribution of food, wherewith loss of natural strength is repaired, so that, lifting by the leverage of their wings their aged parent, they make him fit for flight and restore to strength their dear father’s limbs, now unaccustomed to perform their primary functions.

Who is there among us who is not loath to lift up the burden of his ailing father? Who would place his ‘wearied sire’ on his own shoulders—a fact which is scarely credible when related in history? Who would not rather, to fulfil his duty, hand this out over to servants? The birds do not refuse to provide food for their parents. This duty many men have refused to do even under compulsion of necessity and when driven by fear of punishment. Birds, on the other hand, are bound by a natural and not by a written code of laws. By no ordinances, but rather by the prescriptions of natural grace, they carry unashamedly the body of a revered and aged parent. This act of carrying one’s parent is, in fact, an expression of piety. Popular belief has borne witness to it to the extent that it has acquired, as is fitting, a merited fame. The Romans are accustomed to call this bird ‘pious’—a title which these birds have without exception merited has been bestowed by decree of the Senate on scarcely a single emperor. These birds have been accorded this designation by a decree of their own elders, for it is right that sons be first declared ‘pious’ by virtue of what their fathers believed. They also have the approval of all mankind, for ‘thankfulness’ is called ἀντιπελάργησις, a word derived from πελαργός, which means a stork. Such is the derivation of the word denoting this virtue. A repayment for kindness is associated with the name of the stork.

We have an example of devotion to parents on the part of a bird’s progeny. Let us now listen to an impressive instance of a mother’s solicitude for her children. The swallow has a very small body, but gives evidence of extremely great affection and devotion. Although devoid of all goods, she constructs her nest as cunningly as if it were a thing ‘more precious than gold.’ What wiser act is there for a bird given to wandering than that she should avail herself of her liberty and build for her little ones homes near the abodes of men, where no one would attack her brood? It is a commendable act to cause her nestlings from their very birth to become accustomed to human society and thus make them safer from the snares of their bird enemies. Notable, too, is the admirable way she, like a skilled artisan, builds her home without a helper. She gathers twigs in her beak and dips them in the mire so as to fasten them together. Because she is unable to lift the mire with her feet, she sprinkles the tops of her wings with waters so that what before was dry dust now becomes mud. In this way twigs and straw are collected and made compact. Thus is the entire nest built. The nestlings find no obstacles as they busy themselves on the smooth surface within their little house. At the same time, no intruder can damage the structure by planting his feet in an opening. The young ones, too, are not affected by draughts of cold air.

This industrious activity is common to many birds. The extraordinary characteristics just mentioned show the high regard they have for paternal affection and are an indication of a far-seeing and instinctive knowledge. These birds give evidence of possessing a medical skill. If any of the nestlings suffers blindness as a result of an injury to an eye, its eyes are restored to their former effectiveness by the application of certain curative agents.

Let no one, therefore, complain of poverty because he has not provided money for his household. The swallow, who lacks money, is poorer—but is rich in industry. She builds and spends not. She erects a shelter without depriving a neighbor of anything. She experiences no compulsion to harm anyone, either because of indigence or poverty. She does not resign herself to despair when at times her offspring becomes helpless. We on the other hand, are affected by poverty and are made anxious by the urgency of want. Indigence drives many to evil deeds and offenses. In the pursuit of gain we turn our minds to deceit and, while fitting our sentiments to the occasion, we set our hopes in the most violent displays of passion. In the process our minds snap. We lie prone, bereft of spirit and life at a time when it would have been more satisfactory, since the protection of man has failed us, to place our hopes in the benevolence of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
Men should learn to love their children. We find this to be a normal sentiment among crows, who form a constant escort to their offspring in flight. Solicitous, too, lest perchance they may become weak because of their tender age, they strive to supply them with food. They continue to perform this function for a long time. On the other hand, the females of our species quickly give up nursing even those they love or, if they belong to the wealthier class, disdain the act of nursing. Those who are very poor expose their infants and refuse to lay claim to them when they are discovered. Even the wealthy, in order that their inheritance may not be divided among several, deny in the very womb their own progeny. By the use of parricidal mixtures they snuff out the fruit of their wombs in the genital organs themselves. In this way life is taken away before it is given.

Who except man himself has taught us ways of repudiating children? Who has discovered such cruel parental customs? Who, notwithstanding the fact that nature imposes equality among brothers, has caused them to be unequal? One has a superabundance from his father’s legacy. The other bewails the fact that he has been given but a miserable portion of his father’s rich patrimony. Can we say that nature has thus apportioned the deserts of these sons? On everyone she has bestowed on an equal basis the possibility of possessing wherewith to be born and wherewith to live. She can teach you not to discriminate in inheritance those whom you made equal by right of consanguinity. It stands to reason that those to whom you have granted the right to be born in the same manner should not themselves be begrudged to have that in common which by nature they have inherited.

Hawks are said to show harshness toward their own offspring. They eject them from their nests when they notice their first attempts at flight. If they still linger, they are immediately pushed headlong by their parents, who beat them with their wings and compel them to perform the fearful action. At no time after that do they perform their office of giving sustenance to their young. Yet why should we wonder that birds accustomed to plunder find it distasteful to nourish their progeny? Let us keep in mind the fact that fear schools birds also to be cautious, never to relax their watchful care, but to anticipate and avoid dangers from birds of prey. Hence, since nature has inured these birds to a life of plunder, they appear to prepare their young from an early age to acts of pillage rather than just cut short the period of sustenance. Precaution is taken lest they become flabby in that early period, or become weak through pampering, or lest they languish in idleness. They are trained to search for food rather than expect it, so that they may not lose their innate vigor. Those activities are allowed to elapse which are connected with the nourishing of the young, who as a result of this are forced to resort to a life of pillage.

It is generally stated in treatises dealing with the eagle that she, too, abandons her young. This is true, however, only of one out of two nestlings. Some have thought this situation arose from a reluctance to bring up a twin brood. But this is hardly worthy of credence, especially since Moses has given us such convincing testimony on the devotion of this bird to her young when he said: ‘As the eagle protects his nest and inspires trust in his nestlings: hovering over them, he spreads his wings and hath taken them and carried them on his shoulders. The Lord alone led them.’ How, then, did he spread his wings over his young if he killed one of them?

For this reason I think that this bird does not act cruelly from a desire to refrain from giving nourishment. Rather, there is a question of making a decision. For it is agreed that the eagle tests the quality of her young, lest signs of degeneracy and deformity may cause deterioration in a species which affects the role of regal dominion over all birds. And so it is asserted that the eagle exposes her nestlings to the rays of the sun and suspends with her claws her young in mid-air. If one of them stays unruffled and unmoved, fearlessly facing the light of the sun as it strikes his eyes, he is approved. He has thus demonstrated the truth of nature by the steadiness of his unaffected gaze. The one, however, who turns away his eyes, ‘dazzled by the sun’s rays,’ is rejected. He is deemed unworthy of such a parent, unfitted to be recognized as genuine offspring, and hence undeserving of support. The eagle does not therefore reject her young because of natural cruelty. This is, rather, the result of her soundness of judgment. There is no refusal of what is native, but rather a rejection of what is alien.

What some consider to be a disposition toward cruelty in such a royal bird is compensated by the kindly traits of a bird of lower caste. This bird, known as the waterfowl (the Greek name is φενη), adopts the nestling of the eagle when disowned or not recognized and allows him to mingle with her own brood. She exercises over him the same maternal care as she does over her own, providing food and nourishment impartially. The φενη, therefore, supports an alien brood, whereas we show excessive cruelty when we abandon our own children. Rather, she does not acknowledge them to be such, but considers them to be base-born. Our procedure is worse. We renounce what we acknowledge to be our own.

Let us come now to the turtle dove, chosen as a chaste victim by the Law of God. Hence, when the Lord was circumcised, the dove was offered, because it is written in the Law that there should be a presentation of ‘a pair of turtles or two young pigeons.’ For this is the true sacrifice of Christ: chastity of body and grace of the spirit. Chastity belongs to the turtle dove; grace, to the pigeon. It is related that the turtle dove, when widowed by the loss of her consort, was ‘utterly weary of the bridal-bed’ and even of the world itself, for the reason that ‘her first love, turning traitor, cheated her by death.’ He was regarded as unfaithful from the point of view of perpetuity and as dour in respect to beauty in that he had created more pain as a result of his death than sweetness from his love. Therefore, she renounces any other marriage alliance and does not break the laws of chastity or her pledges to her beloved, reserving for him alone her love, for him alone cherishing the name of wife. Learn, women, how great are the joys of that widowhood which even birds are said to observe.

Who has given these laws to the turtle dove? A search for a human law-giver will not bring results. No one has ventured to propound laws for these birds. Not even Paul has succeeded in doing so in the question as to whether a widow should remarry or not. He says: ‘I desire therefore that the younger widows marry, bear children, rule their households and give the adversary no occasion for abusing us.’ And elsewhere: ‘It is good for them if they so remain. But if they do not have the self-control, let them marry, for it is better to marry than to burn.’ Paul wishes that women should do that which is customary with the turtle doves. Also, he exhorts the younger widows to marry because our women are unable to maintain the chaste life of these birds. God has therefore infused into the turtle dove this sentiment for the virtuous practice of continency. He alone has the power to prescribe the laws which all are obliged to follow. The turtle dove is not inflamed by the flower of youth, is not tempted by occasional enticements, and cannot break her first pledge, because she knows how to preserve the chastity she promised at the time of her first marriage.

We have spoken of widowhood as it appears in the life of birds. We have shown how this virtue first arose among them. Now let us discuss the virtue of continency—a virtue which birds are said also to possess. This virtue can be found even among vultures. It is said that vultures ‘do not indulge in conjugal embraces’ or in any sort of union or nuptial tie. They are said to conceive without contact with the male seed and that without the union of sexes they generate offspring that live to a ripe old age. In fact, it is asserted that they live as long as a hundred years and that by no means does ‘the limit of a natural span of life await them.’

What do those people say who usually ridicule our mysteries when they hear that a virgin gave birth to a child—people who consider that parturition is impossible to one who never had any relations with a man? Is that to be thought impossible for the Mother of God which is admitted to be possible in the case of vultures? A bird gives birth without contact with a male. No one has cast any doubt on that. But because Mary, though unwedded, brought forth a child, they raise doubts about her chastity. Do not our observations show that the Lord has provided many precedents in the realm of nature by which to prove the glory of His own Incarnation and assert its veracity?

Now I shall proceed to show what birds usually live under the control of laws in a sort of commonwealth. From this is derived the fact that the state establishes laws bearing equally on all citizens—laws which are loyally observed by all members of the community. No claim is made to a right which is clearly not permitted to all the citizens. Rather, each and every member of the group shares equally in these rights. What is not permitted to every citizen is not considered a right. All share in paying respects to their elders, by whose wise counsel the state is governed. Each one has a right to the common place of abode. Social duties are shared. They all follow a single prescribed and orderly mode of life.

These facts are of great importance. In the case of bees they are even more important. Alone of all species of living creatures they share their offspring in common. All have the same abode and are confined within the limits of one native land. They engage in the same labor. They share the same food and partake of the same activities. The same productivity is shared and—what could be more notable—the same flight on the wing. The act of generation is common to all. Their bodies are uncontaminated in the common act of parturition, since they have no part in conjugal embraces. They do not unnerve their bodies in love nor are they torn by the travail of childbirth. A mighty swarm of young suddenly appears. They gather their offspring in their mouths from the surface of leaves and from sweet herbs.

They appoint a king for themselves and establish their own community. Though they serve under a king, they are free. They have the privilege of selection and of extending their loyal devotion. They love him as one elected by them and they pay him honor by producing a swarming hive.

The king is not chosen by lot, because there is in a lot, not an element of discrimination, but one of chance. By virtue of the unpredictable nature of a lot, it frequently happens that what comes last is preferred to what is better. The election is not brought about by the vulgar shouts of an uninformed mob which does not hold in esteem the merits due to virtue. The mob scrutinizes, not the benefits to be bestowed by what is serviceable for all, but is swayed by the incertitude of change. This election, moreover, is not founded on hereditary privilege or in dynastic succession, since circumspection and wisdom cannot exist in one who is so inexperienced in public life. Add to this the flatteries and the inordinate pleasures which, imbibed at an early age, are apt to weaken men of the best natural endowments. Then, again, we note the custom of employing eunuchs; most of them tend to sway the king more for their own profit than for the public good.

There are notable and natural characteristics in the king as he appears among the bees. He must be, for example, outstanding in size and beauty. Besides that, he must possess what is a conspicuous trait in a king—gentleness in character. He does not make use of his sting to inflict punishment. There are well-defined laws in nature, not set down in writing, but impressed in the mold of custom, by virtue of which those who possess the greatest power tend to be more lenient in the exercise of it. Those bees who do not obey the laws of their king are so overcome by remorse that they even kill themselves by their own stings!

This custom is observed today by the Persians. They inflict death on themselves in punishment for a transgression. But no people—neither the Persians whose subjects live under the severest laws nor the Indians or Sarmatians—hold their kings in such high esteem as do the bees. So true is this that they dare not leave their abodes nor go in search of food except when the king takes the initiative by assuming for himself primacy in flight.

They fly over the countryside with its fragrant gardens and sweetly smelling flowers, where a brook steals through banks of lush grass. There the young bees find occasion for spirited sport. There, too, they perform their martial exercises and find relaxation from labors. Their toil is sweet. From the flowers and the plants they erect the foundations for their camps. What is the honeycomb but a sort of camp? Hence ‘they drive the drones from these folds.’ Does not the square-shaped form of a camp compare favorably for beauty of construction with the art of the honeycomb in which tiny rounded cells are interlocked? What architect taught them how to arrange symmetrically the walls of these separate cells, how to hang aloft ‘within the confines of their homes’ delicate pieces of wax—to staff all this with honey and ‘swell with nectar,’ as it were, their granaries interwoven with flowers?

You can perceive them all engaged in their tasks. Some keep guard over the food supply. Others keep anxious watch on the camp. Others are on the alert for possible rainstorms and cloudbursts. Some fashion the wax obtained from flowers, while still others gather in their mouths the dew that settles on these same flowers. Yet no one lays snares to pilfer the fruits of another’s labors or aims ‘to live by plunder.’ Would that they did not fear the cunning stratagems of thieves! However, they still can resort to their stings and, if they should be aroused, infuse poison into the honey. In the heat of attack ‘they lay down their lives in the wound.’

And so into the recesses of their camp abodes the moisture of the dew is poured. This in the course of time is gradually transformed into honey. What before was liquid takes on the sweetness of honey as a result of the infusion of wax together with the aroma of flowers.

Scripture rightly commends the bee as a good worker: ‘Behold the bee, see how busy she is, how admirable in her industry, the results of whose labors are serviceable to kings and commoners and are sought after by all men.’ Do you hear what the Prophet says? He enjoins on you to follow the example of that tiny bee and to imitate her work. You see how pleasing it is and what labor it entails. Her fruit is desired and sought after by all men. Its recipients do not differ in character. It supplies without distinction the same sweetness to kings and to commoners. It contributes not to our pleasures alone, but to our health as well. It soothes our throats and ministers to our wounds. Even to our organic ills it serves as a healing draught. Thus the bee, though weak in body, manifests her strength in the vigor of her wisdom and in her high regard for virtuous deeds.

The bees fight, in fact, to their utmost in defense of their king. They consider it a noble act to give up their lives for his sake. While the king is safe, they stand by him with the greatest devotion. When he is lost, their enthusiasm for their work declines. They destroy their store of honey, because death has come to the prime mover of their enterprise.

Although other winged creatures scarcely bring forth offspring once a year, the bee is blessed with two such periods, surpassing to such a degree all other [such] creatures in fecundity.

Let us now examine the sense of the words, ‘Let the waters abound with life and above the earth let winged creatures fly below the firmament of the heavens.’

It is clear that ‘above the earth’ is said because they search for their food on the earth. But why, ‘below the firmament’? Eagles fly above all other birds, yet they do not fly ‘below the firmament of the heavens.’ The word for ‘heaven’ in Greek is οὐρανός, derived from the Greek word ‘to see,’ for the reason that the air is clear and transparent and so living species are said to fly through the air. One should not be disturbed by the phrase ‘below the firmament of the heavens.’ The word ‘firmament’ is used, not in its proper, but in its derivative sense. The air which we perceive with our eyes is, in comparison with that ethereal substance, the firmament, of greater thickness and density.

Now, having discussed just briefly the nature and beauty of flying creatures (we do not have time to describe every creature of the same or similar species), let us consider what diversity there is among birds themselves.

We find that the crow has talons which are divided and separated, whereas nature has formed that part differently in the raven, even in her young. Those birds that feed on flesh have hooked talons, to enable them to seize their prey. Those that are accustomed to swimming have feet which are broad, with their parts bound and joined together by a kind of membrane. Here we find examples of admirable design in nature. In one case, flight or the acquisition of food is made easier. In the other, assistance is given in the art of swimming, whereby this act, too, is made easier. They use their feet as oars in such a manner that a current of water is propelled by the broad formation of the membrane attached to their feet.

We can easily comprehend why a swan has a rather long neck. With a body that is somewhat corpulent, the swan cannot easily reach the lowest depths in search for food. Hence, the neck acts as a sort of advance scout for the rest of the body when on the lookout for food in the deep waters. This long neck has the additional advantage of giving a sweeter and more modulated tone to the swan’s cry, which becomes clearer the more frequently it is exercised.

How sweet is the chant from the tiny throat of a cicada! In the heat of midsummer ‘they rend the thickets’ with their songs. The greater the heat at midday, the more musical become their songs, because the purer the air they breathe at that time, the clearer does the song resound.

The bees, too, have a song that is not unpleasant. In that hoarse voice of theirs is an agreeable sweetness which we appear to have first imitated ‘in the broken trumpet-blasts.’ There is no sound more fitting than this to arouse hearts to vigorous action. Yet they have this curious gift, although they are said not to possess the function of breathing through lungs, but to breathe in the air as food. Hence they die immediately if oil is poured over them, because they are unable to take in that breath of air when their pores are closed. If one were straightway to pour vinegar over them, they quickly revive, since vinegar has the power of quickly opening those pores which had been sealed by the mass of oil.

Now that we are discussing flying creatures, it may not be amiss to treat here what is reported by certain eyewitnesses about the Indian worm. It is related that this horned worm is first changed into the form of a plant stalk, then gradually into a chrysalis. This form is not retained, for it seems to take on wings when seen on the wide surface of a leaf. From these leaves the Chinese ‘comb those soft fleeces’ which the wealthy appropriate for their own use. Hence the Lord says: ‘What did you go out to the desert to see? A man clothed in soft garments? Behold, those who wear soft garments are in the houses of kings.’

The chameleon is said also to assume new forms by a deceptive change of color. We know, in fact, from close observation that hares take on a white color in winter and that in summer they return to their original shade.

These matters have been mentioned in order that you may be aroused by the force of such examples as these to a belief in the change which will be ours at the Resurrection. We refer to that change which the Apostle clearly indicates when he says: ‘We shall all indeed rise, but we shall not all be changed.’ And further on he says: ‘And the dead shall rise incorruptible and we shall be changed. For this corruptible body must put on incorruption and this mortal body must put on immortality.’ Many, interpreting the nature and appearance of that transformation which they have not attained, are not without giving it an incongruous explanation, based on an anticipation which they do not merit.

In the regions of Arabia there is reported to be a bird called the phoenix. This bird is said to reach the ripe old age of 500 years. When the phoenix realizes that he is coming to the end of his life, he builds himself a casket of incense, myrrh, and other aromatic plants, into which he enters and dies when his time has come. From the moisture proceeding from his flesh he comes to life again. In the course of time this bird puts on ‘the oarage of his wings’ until he is restored to his primitive form and appearance. By the very act of his resurrection the phoenix furnishes us a lesson by setting before us the very emblems of our own resurrection without the aid of precedent or of reason. We accept the fact that birds exist for the sake of man. The contrary is not true: that man exists for the sake of birds. We have here an example of the loving care which the Author and Creator of the birds has for His own saints. These He does not allow to perish, just as He does not permit in the case of one sole bird when He willed that the phoenix should rise again, born of his own seed. Who, then, announces to him the day of his death, so that he makes for himself a casket, fills it with goodly aromas, and then enters it to die there where pleasant perfumes succeed in crowding out the foul odor of death?

You, too, man, should avail yourself of a casket: ‘strip off the old man with his deeds and put on the new.’ Your casket, your sheath, is Christ who protects and conceals you in the day of evil. Do you wish to be convinced that it is a casket of protection? ‘In my quiver he hath hidden me,’ Scripture declares. The casket, then, is your faith. Fill it with the goodly aroma of your virtues, that is, of chastity, compassion, and justice, and immerse yourself wholly in the inmost mysteries of faith, which are fragrant with the sweet odors of your significant deeds. May your exit from this life find you clothed with that faith, so that ‘your bones may be made fat’ and ‘be like a watered garden,’ thus coming to life and flourishing. Be aware, therefore, of the day of your death, as the Apostle Paul realized when he said: ‘I have fought the good fight, I have finished the course, I have kept the faith. There is laid up for me a crown of justice.’ Like the good phoenix, he entered his casket, filling it with the sweet aroma of martyrdom.

I shall put this question before you: Why are vultures able by certain indications to foretell a man’s death? Whence have they derived their knowledge? When two armies face each other in battle array to engage in ‘tearful war,’ these particular birds follow in formation as a sign that a great number of men are destined to fall a prey to vultures. At any rate, they seem to make this observation by the exercise of an instinct analogous to human reasoning.

Divine grace has penetrated even into the life of a locust. When a locust swarms over and takes possession of some extent of land, no harm at first is done to the land. Nothing is devoured by these unfriendly invaders except when a sign from heaven has been received. A passage in Exodus provides an example of this. There the locust as minister of divine vengeance inflicts punishment for an offense against heaven.

This animal is devoured in turn by a bird called σελευκίς—this is its Greek name—given to us as a remedy for the ills that the locust usually inflict. The Creator has given this bird an insatiable appetite wherewith the all-devouring plague, to which we have just referred, can be utterly destroyed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
But what is this that has happened? While we are prolonging our discourse, see how the birds of night flit around us! They admonish us by that very act to put an end to our discourse and at the same time give us a hint that they, too, should be included. Birds of different species all fly back to their accustomed nesting places. The coming of evening compels them to give way to night. Accordingly, they conceal themselves in their hiding places, saluting the close of day with a song, lest they depart without offering such thanks as a creature owes to glorify his Creator.

Night also has its songs wherewith to soothe the hearts of men who lie awake. The night owl, too, makes a contribution of song. What shall I say of the nightingale who keeps long watch over her nest, cherishing her eggs with the warmth of her body? She solaces with the sweetness of her song the sleepless labors of a long night. The highest aim of the nightingale, in my opinion, is to give life to her eggs by the sweet charm of her song no less than by the fostering warmth of her body. A woman, humble but chaste, imitates this bird when she uses her arms to work ‘the indented millstone,’ that her little ones may not lack bread for their sustenance. By her evening song she comforts herself amid the distressing realities of her poverty. In her love and attentiveness she follows the nightingale’s pattern, although she fails to match the sweetness of the song.

The night owl is insensible of the horrors accompanying the gloom of night because of the large yellow pupils of his eyes. Contrary to the experience of other birds—the darker the night, the freer the flight of the owl. However, when dawn with its bursts of light appears, his eyes are dazzled and he flees aimlessly as if in darkness. The owl provides us with a lesson that some there are who, although they have eyes to see, yet are unable to use them. They exercise the function of sight solely in times of obscurity.

I speak of the eyes of the mind which the wise in this world have and see not. They discern nothing in the light. They walk in obscurity, groping in the darkness of the demon powers, while they are convinced that they are looking at the heights of heaven. ‘They trace with a rod’ the universe, taking the measure of the air itself. Nevertheless, they become more and more involved in the darkness of eternal sightlessness. Beside them are the daylight of Christ and the light of the Church, and they see them not. They open their mouths as if in possession of all knowledge. To subjects of little value their minds are acute, but to the eternal verities they are blind. In the prolixities of prolonged disputation they reveal the obscurity of their own knowledge. Therefore, while they flit around in subtle discourse, they act like the night owl by vanishing at the approach of the light of day.

The bat is an ignoble creature, whose name is taken from the word for evening. They are equipped with wings, but at the same time they are quadrupeds. They are provided with teeth, in this respect differing generally from other birds. As a quadruped, too, the female brings forth her young alive and not in the oval stage. Bats fly in the air like birds but prefer to be shrouded in the dusk of evening. In flight they do not use the support of wings but rely on their webbed feet which serve as wings, both as a balance and as a means of propulsion. These common creatures have this faculty, too, of adhering one to another, assuming any position like a pendant bunch of grapes, so that, if the lowest in place gives way they all fall apart. Here we see the virtue of love in action—a virtue difficult to find among men here below.

The cock’s crow is pleasant at nightfall. It is not only pleasant, but useful, too. As a good domesticated fowl he arouses the sleeper, gives him warning when he is perturbed, and consoles the voyager by asserting in musical tones that night is approaching. When the cock crows, the thief forsakes his schemes and the star of dawn rises to illumine the sky. When the cock crows, the sailor’s gloom and trepidation disappear. Tempests and storms stirred up by gusts of wind at eveningtide subside. At his crowing the devout of heart bestir themselves for prayer and resume their reading. Finally, on this occasion ‘the rock of the Church’ washed away his sin which he had committed before the cock crowed. At cock-crow hope returns to all, the sick find comfort, the wounded find relief, the feverish are calmed, the lapsed return to the faith. Jesus has regard for those who stumble and corrects the errant. Hence He paid heed to Peter and forthwith the sin departed. Peter revoked his denial and his confession was completed. That this was God’s plan and not a mere accident is revealed in the words of the Lord. It is written that Jesus said to Simon: ‘Before the cock crows, thou wilt deny me three times.’

In daytime Peter is quite brave, but is disturbed at nightfall. Before cock-crow he falls three times so that you may realize that his sin was not due to mere thoughtlessness, but to an emotional disturbance. The same man became braver after the cock crowed. He became worthy of Christ’s regard, for ‘the eyes of the Lord are upon the just.’ He realized that remedial action had come, following which he was unable to sin. He turned aside from the ways of error to those of virtue and wept bitterly. He washed away his sins with his tears.

Have regard, Lord Jesus, for us, also, that we may acknowledge our errors, efface our faults with tears of devotion and merit indulgence for our sins. And so we have purposely prolonged our discussion in order that the cock may come also to us as we speak. Wherefore, if any error has obtruded itself in our speech, we pray that Christ forgive our sin. Grant us the tears of Peter. Deliver us from the sinner’s exultation.

The Hebrews wept and were liberated when the waters of the sea divided. Pharao was glad because he had surrounded the Hebrews, but he was swallowed up in the sea along with his people. Judas, too, rejoiced in the price of betrayal, but by reason of the same price ‘he hanged himself with a halter.’ Peter wept for his sins and deserved to be able to forgive the sins of others.

But now it is fitting time that this discourse be brought to an end—a time for silence or for tears, a time in which is celebrated the forgiveness of sins. For us, too, in our holy rites that mystical cock crows, as the cock of Peter did in our discourse. May Peter, who wept so well for himself, weep also for us and may the benign countenance of Christ turn toward us. Let there come upon us the Passion of the Lord Jesus which daily forgives us our sins and effects the office of remission.

The good Lord does not desire to send you away fasting lest some faint on the way. He said: ‘I have compassion on the crowd for they have now been with me three days and have nothing to eat and I am unwilling to send them away fasting lest they faint on the way’—Mary took note of these words on the occasion when she declined to make preparations for a meal. We, too, should realize the fact that those who live on the word of God are not numerous and that refreshment for the body is what is more generally desired. In fact, more exacting than the triduum (which we have celebrated) is that which we propose for the day that approaches.

And so, now that we have enjoyed ourselves with birds and have crowed with the cock, let us sing the mysteries of the Lord. Let the eagles, when they have been rejuvenated, gather by the body of Jesus, for now the mighty whale has really restored Jonas to us. Let us congratulate ourselves that evening has come. The morning shall become—the sixth day!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
