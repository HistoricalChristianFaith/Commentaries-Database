[[commentary]]
quote='''
To these two robes each are given.

And she sends Paul as her envoy, when she brings forth his words, he on whom three hundred gold pieces and five robes of different colour are conferred by Christ. He has three hundred gold pieces who preaches the cross of Christ, and therefore he says: For I did not judge that I knew anything among you except Christ Jesus, and him crucified. And rightly he receives gold pieces, because he preached not in persuasive words of wisdom but in the demonstration of the Spirit. And he receives five robes, either as the disciplines of manifold wisdom, or because, captured by no allurements of the bodily senses, he held victory where others met danger; he overcame all the pleasures of the flesh by singular continence and virtue; no weakness of the body dulled his intellect and his zeal; while he was in the body, he did not know that he had a body. Indeed, caught up into paradise, not knowing whether in the body or outside the body, he heard ineffable words which it was not lawful for a man to speak; and finally he smelled of nothing earthly on earth, as he himself teaches, saying: For we are the good fragrance of Christ to God among those who are being saved.

Paul therefore excels and his portion overflows, but yet the other preachers too have their own grace. They receive two robes each. Which ones? Those, surely, about which you ought not to doubt, because you have read what is said of Wisdom: She made double garments for her husband. One is mystical, the other moral. But not all are apostles, not all prophets, not all pastors, not all powers; not all have the grace of healings, not all speak in tongues. Where the rewards are different, the merits are different.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
