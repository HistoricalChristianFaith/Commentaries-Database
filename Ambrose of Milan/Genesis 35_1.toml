[[commentary]]
quote='''
Hence to him, as he prophesied the coming of the Lord Jesus, the divine answer was given: Arise, go up to the place Bethel, that is, into the house of bread, where Christ was born, as Micah the prophet testifies, saying: And you, Bethlehem, house of Ephrathah, you are not the least, that you should be among the princes of Judah. For from you shall come forth a prince in Israel, and his going forth is from the beginning, from the days of the world. Truly the house of bread, which is the house of Christ, who came to us from heaven as the bread of salvation, so that now no one hungers who gains for himself the food of immortality. There the patriarch is commanded to dwell, there to make an altar to God who appeared to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 7"
