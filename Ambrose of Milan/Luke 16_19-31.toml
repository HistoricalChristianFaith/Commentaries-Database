[[commentary]]
quote='''
One may notice, moreover, that in the comparison of that steward earlier and of this rich man now there is an incentive to mercy: there, perhaps, he teaches that we should give to the saints, whom he calls friends and to whom he grants tabernacles; but here he teaches that we should give to the poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
