[[commentary]]
quote='''
What is more rational than that wonderful joining which Saint Mark thought should be placed right at the beginning: Behold, I send my angel and the voice of one crying in the desert, so that he might both stir wonder and teach that man must please by humility and abstinence and faith, just as that Saint John the Baptist climbed to immortality by these steps: his clothing, his food, his message?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
