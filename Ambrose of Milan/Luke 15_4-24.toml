[[commentary]]
quote='''
What man of you he says who has a hundred sheep, and if one of them has strayed, does not leave the ninety-nine in the desert and go after the one that strayed? You had learned in what went before to banish negligence, to avoid arrogance, to take up devotion, not to be held by worldly occupations, not to prefer perishable things to everlasting ones; but since human frailty cannot keep a firm footing amid such slipperiness of the world, the good physician has also shown you remedies against error, the merciful judge has not denied you the hope of pardon. And so it is not idly that Saint Luke set down three parables in order: the sheep which was lost and was found, the drachma which was lost and was found, the son who was dead and came to life again, so that, called forth by a threefold remedy, we may heal our wounds;

a threefold cord indeed will not be broken. Who are these, the father, the shepherd, the woman? Are they not God the Father, Christ and the Church? Christ carries you on his body, he who took your sins upon himself; the Church seeks, the Father receives. As a shepherd he carries back, as a mother she searches, as a father he clothes. The first is mercy, the second intercession, the third reconciliation. Each fits each: the Redeemer comes to aid, the Church intercedes, the Author is reconciled. The mercy of the divine work is the same, but the grace differs according to our merits. The weary sheep is called back by the shepherd, the drachma which was lost is found, the son returns to his father by his own footsteps and comes back with full repentance for the error he condemns. Hence it is well written: men and beasts you will save, O Lord. What are these beasts? The prophet said: I sow Israel with the seed of men and Judah with the seed of animals. And so Israel is saved as a man, Judah is gathered as a sheep. I would rather, then, be a son than a sheep; for a sheep is found by the shepherd, a son is honored by the father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
