[[commentary]]
quote='''
Behold, see the grace of Christ, see his benefits. After Christ came, this flesh which was the shadow of death began through the grace of the Lord to shine and to have a light of its own; hence also it was said: The lamp of your body is your eye. But see what eye he speaks of: not the outer, but the inner. If your eye, he says, is single, your whole body will be full of light. Surely it is the inner eye which enlightens the whole body of a man; it is the inner eye too which brings blindness to the whole body, because it is written: But if your eye is evil, your whole body will be dark. You see in one man that from the place where darkness is born, from there light arises. You yourself, then, are your own darkness or light: the darkness of iniquity and the shadows of sins, the light of innocence. You yourself, then, are the author either of your injury or of your grace; the divine working errs in nothing. The light is in yourself, because your infancy is innocence, the pure mind of man before the slipperiness of adolescence and the error of youth. You, then, have made for yourself darkness out of what is light. Indeed the same eye, that is, the sense of man, is dark in the sinner, bright in the innocent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
