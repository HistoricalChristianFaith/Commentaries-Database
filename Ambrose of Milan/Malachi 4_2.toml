[[commentary]]
quote='''
And because his faith and devotion were invincible, the Lord revealed to him secret mysteries, touching the width of his thigh; because from his seed the Lord Jesus was to descend from the Virgin, who was neither unequal nor unequal to God; the width of the thigh signified the cross of him who astoundedly died, because the forgiveness of sin, spread throughout the whole world, would be beneficial to all who, astonished by their own body and given sleep, would grant resurrection to the dead. Hence not undeservedly rose the sun of holy Jacob, upon whose race the saving cross of the Lord shone brightly; for he is the sun of justice, who beholds God; for he is the eternal light.

But Jacob limped from his hip: For this reason, the sons of Israel do not eat the tendon to this day. Oh, if they had eaten and believed! But because they were not going to do the will of God, they did not eat. There are also those who take it this way, that Jacob limped from one hip because, with two peoples flowing from his generation, the wonder of one was already declaring himself to be about to become about the grace of faith. He is therefore the people who limped in the astonishment of treachery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life"
