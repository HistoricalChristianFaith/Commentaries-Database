[[commentary]]
quote='''
So when those who had been sent were loosing the colt, did they use their own words? Not at all, but they spoke as Jesus had told them, so that you may recognize that not by their own speech but by the word of God, not by their own name but by the name of Christ, they poured faith into the Gentile peoples, and that the adverse powers, which claimed for themselves the homage of the nations, gave way to the divine command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
