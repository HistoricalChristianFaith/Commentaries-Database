[[commentary]]
quote='''
It seemed good he says to me. What he declares seemed good to him can have seemed good not to him alone. For it did not seem good by human will alone, but as it pleased him who he says speaks in me, Christ, who works so that what is good may seem good to us also; for whom he pities he also calls. And so he who follows Christ, when asked why he wished to be a Christian, can answer: It seemed good to me. When he says this, he does not deny that it seemed good to God; by God indeed the will of men is prepared. For that God should be honored by a saint is the grace of God. Indeed very many wished to write a gospel, but only four, who merited divine grace, were received.

It seemed good he says to me also, having followed all things diligently from the beginning in order. No one will doubt that this book of the Gospel is longer than the others. And so he claims for himself not things that are false but things that are true. Indeed he merited a testimony to his diligence from the apostle Saint Paul as well. For thus he praises Luke: whose praise he says is in the Gospel throughout all the churches. And truly praiseworthy is he who merited to be praised by so great a teacher of the Gentiles. So he says that he followed not a few things but all, and having followed all, it seemed good to him to write not all things but out of all; for he did not write all things, but he followed all things, since the things which Jesus did he says if they were all written, I do not think that even the world itself could contain them. For you notice that he deliberately passed over even those things which had been written by others, so that a varied grace might shine forth in the Gospel and the several books might stand out by certain wonders, proper to each, of mysteries and of deeds. For the soldiers of Christ divided among themselves the garments of the Lord, which will be explained more fully in its place.

Now the Gospel was written to Theophilus, that is, to him whom God loves. If you love God, it was written to you; if it was written to you, receive the gift of the evangelist. Keep carefully the pledge of a friend in the inner chambers of your mind; guard the good deposit through the Holy Spirit, who has been given to us; look into it frequently, examine it more often. Faith is owed first of all to a pledge; diligence follows faith, lest moth or rust consume the pledges entrusted to you; for what has been entrusted to you can be consumed. The Gospel is a good pledge, but see that neither moth nor rust consume it even in your mind.

The moth consumes if you believe badly what you have read well. The moth is the heretic, the moth is Photinus, your moth is Arius. He rends the garment who separates the Word from God. Photinus rends the garment when he reads: In the beginning was the Word, and the Word was with God, and God was; for the garment is whole if you read: and God was the Word. He rends the garment who separates Christ from God. He rends the garment who reads: Now this is eternal life, that they may know you, the only true God, unless he knows Christ also. For it is not only knowing the Father as truly God that is eternal life, but also knowing Christ as true God, true from true, God from God, is life everlasting. It is a moth to know Christ without faith in his divinity or the sacrament of his body. Arius is a moth, Sabellius is a moth. The spirit of the wavering suffers these moths; the spirit suffers these moths which does not believe that the Father and the Son are one in divinity. He rends what is written: I and the Father are one, who divides the One through separate substances. The spirit suffers this moth which does not believe that Jesus Christ has come in the flesh, and it is itself a moth; for he, he says, is the antichrist. But those who are of God hold the faith, and so cannot suffer the moth, which divides the garment. For everything that is divided against itself, like the kingdom of Satan, cannot be lasting.

There is also a rust of the mind, when the edge of religious intention is overcast with the filth of worldly desires, or the purity of faith is discolored by the cloud of unbelief. Rust of the mind is the desire of household property, rust of the mind is negligence, rust of the mind is the craving for honors, if the highest hope of the present life is placed in these. And so, turning to divine things, let us sharpen our wits, exercise our affection, so that that sword which the Lord bids be bought by selling a garment we may have always ready and bright, laid up as it were in the sheath of the mind. For spiritual arms, mighty through God for the destroying of fortifications, ought always to be at hand for the soldiers of Christ, lest, when the leader of the heavenly army comes, offended by the neglect of our arms, he should separate us from the fellowship of his legions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
