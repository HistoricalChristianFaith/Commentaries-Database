[[commentary]]
quote='''
But since there was not yet in that type of the leaders of the people of the Jews this same free preaching, Joseph wept; that is, in him Jesus wept.

And he ordered everyone to withdraw, so that he might be recognized by his brothers; for he had not come, as he himself says, except to the sheep of the house of Israel that perished. And sending forth his voice with weeping, I am, he says, Joseph; does my father still live? That is: he spread out his hands to a people unbelieving and contradicting, seeking neither envoy nor messenger, but, as the Lord himself, wishing to save his people. I myself who spoke am present, he says, and made manifest to those who did not seek me, I appear to those who did not ask for me. What else, then, did he cry out at that time but I am Jesus, when, tested by the leaders of the Jews who asked: Are you the Son of God?, he answered: You say that I am; when he said to Pilate: You say that I am a king; for this I was born; when to the chief of the priests, who said: I adjure you by the living God, that you tell us whether you are the Christ, the Son of God, he replied: You have said it. Amen I say to you, from now on you will see the Son of man sitting at the right hand of power and coming with the clouds of heaven? This, then, is what he says: I am Joseph: I am of divine power. Does my father still live? That is: I do not deny my father, I acknowledge my brothers, if either you recognize your brother or the father recognizes his son. Does my people, then, still live, from the family of which people I have chosen a brother for myself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapters 11-12"
