[[commentary]]
quote='''
But if you have gone astray when already baptized, pour the water of tears, not lying but true, so that you may cry from the depth to the Lord your God and it may be said of you: A voice was heard in Ramah, weeping and much wailing; Rachel weeping for her sons, and she would not be consoled, because they are not. Rachel is the Church, in which the people of God is blessed. Let her weep for you, let her lament your sins and weep very much, so that she does not easily admit consolation, as those do who grieve very much. She would not be consoled for this reason, because you who were have ceased to be; but by this perseverance in grief and weeping let it be earned that she may say: my son was dead and has come to life again, he was lost and is found. Or perhaps Rachel would not be consoled for the sons of the Jews, because they are not, whom she had surely borne for this, that they might be. And therefore she did not admit consolation when the little ones were slain by Herod, because they did not believe in the coming of Jesus, filling up the measure of wickedness so as even to kill the little ones, so that among them the Son of the Virgin too might be killed. The Church of the Lord, then, would not be consoled for the Jews, because they are not; but in the Christians, who have been gathered from the nations, she feasts and rejoices, since those who were not have begun to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
