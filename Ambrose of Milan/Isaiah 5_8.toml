[[commentary]]
quote='''
But for us, men, there are far different sentiments. We desire change for various reasons: a wish for travel, for release from daily associations. We long for the approval of strangers and to remove the age-long boundaries which our ancestors have set up, adding estate to estate, household to household.

The earth alone does not suffice. We use the sea itself for our foundations. On the other hand, in compliance with individual whims, the land is excavated and sea water is brought in so as to form islands or straits for men’s use. Men claim the sea for themselves by right of ownership and boast that they have subjected fishes like slaves to a condition of servitude. This, they say, is my bay; that one belongs to another. Like sovereigns, they divide the elements among themselves. For some people, oysters are bred in water. For others, fish are enclosed in a fish pond.

The sea does not suffice for their luxuriant living. They must have reserve stores of oysters. They keep a reckoning of the age of each oyster bed. Receptacles are built for the fish in case the rich man’s table may not be replenished from the sea. How they are all ears when the word ‘neighbor’ is mentioned! How eagerly will they gaze on his possessions! What plans enter their minds day and night to take something away from their neighbors! ‘Shall they alone dwell in the midst of the earth?’ exclaims the Prophet. The Lord is aware of this and waits to punish them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
How far, O ye rich, do you push your mad desires? Shall ye alone dwell upon the earth? Why do you cast out your consort in nature and claim for yourselves the possession of nature? The earth was made in common for all, both rich and poor. Why do you arrogate to yourselves, ye rich, exclusive right to the soil? Nature, which begets all poor, does not know the rich. For we are neither born with raiment nor are we begotten with gold and silver. Naked it brings men into the light, wanting food, clothing and drink; naked the earth receives whom it has brought forth; it knows not how to include the boundaries of possessions in the tomb. A narrow sod is ample enough for rich and poor alike, and the earth, which did not contain the desire of the rich man living, now contains him entire. Nature, therefore, knows not how to discriminate when we are born, it knows not how, when we die. It creates all alike, all alike it encloses in the bosom of the tomb. Who can distinguish the forms of the dead? Uncover the earth and, if you can, pick out the rich man. Clear away presently the rubbish from the tomb, and if you recognize the poor man, prove it; unless perchance by this alone: that with the rich more things perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 1"

[[commentary]]
quote='''
The prophet cries out: Woe to those that join house to house and farm to farm, and he accuses them of fruitless avarice. For they shun dwelling together with men, and so they exclude their neighbors; but they cannot flee because, when they exclude these, they again find others; and, when they have driven off the latter, they must come into the neighborhood of others still, for alone they cannot inhabit the earth. Birds join birds so that heaven is often overspread with the flight of their myriad throng; cattle join cattle and fish join fish; nor do they consider it a loss, but a profit in living, when they strive for a most numerous company; and they aspire to a certain protection in the solace of a larger society. You alone, O man, exclude your consort, you take in wild beasts, you construct habitations for animals, you destroy those of men; you conduct the sea into your estates that monsters of the deep may not be wanting, you extend the boundaries of your land that you may not possibly have a neighbor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 3"
