[[commentary]]
quote='''
Concerning Judas the traitor, too, a clear prophecy is added in the verses which follow: and he came in to see, he spoke vain things; his heart gathered iniquity to itself. And he went outside and spoke. So we find it punctuated in the Greek manuscripts. Judas, then, came in, seeking to betray the Savior, to see what he was doing or what he was saying, so that he might catch him in his speech and report it to the Jews; but he found nothing, who understood nothing. Scripture says well that he was not within with Jesus who had withdrawn from his teaching and abandoned his instructions. He wished to enter, but could not penetrate, because his own unbelief shut him out; for every man who is unchaste or covetous or unclean, which is the service of idols, has no inheritance in the kingdom of Christ and of God. Not only, then, was he striving to enter and did not enter, but he also wished to see and did not see. Indeed, Jesus spoke in parables, but Judas did not hear. Indeed, he did not see the divine mysteries; for not all who seem to themselves to hear hear the word of God. For if all heard, Jesus would not say: he who has ears to hear, let him hear. And therefore, because he did not hear and could not see, he spoke vain things instead of true ones, and thought that he was deceiving Jesus when he said: this could have been sold and given to the poor, whereas he was providing for his own thefts, not for the poor; he called him Rabbi and teacher, from whose teaching he was straying, while the devil was gathering to himself his heart, into which he had thrust himself, and was increasing his iniquities. For he was iniquitous to himself, unjust to himself, he sinned against himself, he who was devising within himself a deceit which could not lie hidden. For Jesus was not being outwitted, who was betrayed willingly and testified: one of you will betray me. Indeed, Judas confessed it, saying: is it I, Rabbi? And the Lord said: you have said it. Not even so did Judas understand that he was known; for if he had understood, he would not have betrayed him.

But nonetheless and he went outside and spoke. A fitting verse against those who betray someone's secret. Beautifully he says: he went outside; for outside are the wolves, outside the robbers. Within, Moses in the cloud with Joshua, outside, the Jews; within, Zechariah the priest in the temple, outside, the multitude; within, the Holy Spirit cries to the Father in our hearts, outside, our adversary keeps watch like a lion for prey; outside, the unbelievers, within, the faithful. And therefore those who are outside God will judge, but those who are within Christ will absolve. Judas, therefore, went out and spoke. He went out from the faith, he went out from the council and the number of the apostles, he went out from the banquet of Christ to the brigandage of the devil, he went out from the grace of sanctification to the snare of death, he who spoke vain things to the unbelieving; he went outside, who was abandoning the inner mysteries of life; he went out, who did not know the inner things of Scripture. For if he had known, he would have understood him who says: shall he who sleeps not add so as to rise again? He would have understood this also: but you, man of one mind with me, my guide and my familiar friend, who always took sweet food with me; in the house of the Lord we walked in agreement. He did not understand, then, this psalm, nor Psalm 108 (109), nor others, nor the other testimonies of the Scriptures. Of him, and of the other unbelievers, John the Evangelist rightly says: they went out from us, but they were not of us; for if they had been of us, they would have remained with us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
