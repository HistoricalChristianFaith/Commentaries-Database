[[commentary]]
quote='''
Or this is said because faith keeps out the unclean spirit, especially since the nature of the tree falls in with this meaning. For the fruit of the mulberry is at first white in the blossom, and being formed from thence grows red, and blackens as it gets ripe. The devil also having by transgression fallen from the white flower of the angelic nature and the bright beams of his power, grows terrible in the black odour of sin.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If you have faith like a grain of mustard seed, you will say to this mulberry tree: 'Be uprooted and be cast into the sea', and it will obey you. Of the grain of mustard seed we have spoken above; now we must discuss the mulberry tree. I read of a tree, yet I do not believe it a tree. For what reason is there, what profit is there here for us, that a tree which bears fruit for toiling farmers should be uprooted and cast into the sea? Although we may judge this possible by the power of faith, that insensible nature should obey the commands of sensible beings, what yet does the very kind of tree mean? I have read indeed: I was a goatherd, plucking mulberries, and I think the prophet signified to us that he himself, a sinner, was converted from a flock of sinners; although it fits that the future prophet of the Gentiles should seem to have sought fruit among brambles, to have dug out food from brambles, as one who would place the discolored and fetid flocks of the Gentiles, the peoples of the nations, in the pastures of his writings, so that they might grow fat with spiritual refreshment, while he himself would milk spiritual milk from the converted sinner.

But since in another book of the Gospel it was said of a mountain — whose appearance, bare of growing things, starved of vines and olives, barren of harvests, fit for the lairs of beasts and restless with the coursing of wild animals, seems to express the self-exalting height of spiritual wickedness, as it is written: Behold, I am against you, corrupt mountain, which corrupts the whole earth — it is fitting that in this place too we should think the same is meant, since faith shuts out the unclean spirit, especially as the nature of the tree agrees with this opinion. For its fruit is first white in the flower, then, when formed, it reddens, and at maturity it turns black. The devil too, cast down by transgression from the white flower of the angelic nature and from his glowing power, grew foul with the black stench of sin. Behold him, then, saying to the mulberry tree: Be uprooted and be cast into the sea, when he casts the legion out of a man and permits it to pass into the swine, which, driven wild by the devilish spirit, plunged themselves into the sea.

This passage, then, is an exhortation to faith, teaching in the moral sense that even things that have been made solid can be dissolved by faith. From faith comes love, from love hope, and in turn they flow back into one another in a kind of holy circuit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
