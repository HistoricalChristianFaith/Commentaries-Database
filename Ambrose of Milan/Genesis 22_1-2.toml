[[commentary]]
quote='''
And he said to him: Abraham, Abraham! By the repetition of the name he rouses his mind, so that he might be more ready. Then he answered: here I am. And he said: take your most beloved son, whom you have loved, Isaac, and go into the high land, and you shall offer him to me as a whole burnt offering on one of the mountains, which I shall tell you. He does not allow the father's affection to be idle. From the beginning he goads him and pricks him with the stings of fatherly love, and adds the son's name to the name of the relationship and to the force of love. He did not think it enough to have called him son; he joined to it most beloved, whom you have loved, Isaac. What does it mean that he says: whom you have loved, and did not say: whom you love? We can indeed use in defence of divine Scripture the fact that it often puts past things for future or present ones, as you have in the Gospel: this is my most beloved Son, in whom I have been well pleased, though certainly the Father is always well pleased in the Son. And in the psalm you have: the Lord said to my Lord: sit at my right hand, though he is always seated. Yet we can also take most beloved of the present, and whom you have loved to mean that he signified him as beloved not by some recent impulse of love but by a love long ingrained and proved. For what increases for a time dissolves in time, but what has pleased for long or always cannot quickly be abolished. This too may seem not absurd, that we love more those who are about to die; that is: whom you loved before, as though he now loves him as one to be sacrificed. Nor does he idly add the name of holy Isaac, that is, him whom you received in old age, received from your wife as your only one, received as the reward of your faith, the recompense of your works, received from the promise of God, not from the fruitfulness of your wife, from whom you could not hope for another. You shall offer me a whole burnt offering, but first go into the high land. An interval is set between, lest the affection seem to be hurried on suddenly, so that by that delay the grace of fatherly love might creep in, the father's longing. He added: on one of the mountains, which I shall tell you. And here likewise, so that, while the old man climbed, the impulse might be broken, the right hand grow weary, the intention fail, and while he sought to learn the mountain, he might unlearn his preparation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
