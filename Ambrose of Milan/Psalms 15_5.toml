[[commentary]]
quote='''
What is more cruel than to lend money to one who has none and then to exact double the amount? If one cannot pay the simple amount, how will he pay double?… Nations have often failed because of usury, and this has been the cause of public calamity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252011-20.html'
source_title="Letter 19: To Vigilius"

[[commentary]]
quote='''
Wherefore also David esteemed both blessed and worthy of a heavenly habitation the one who did not give money to usury. If therefore he who did not give it is blessed, without doubt accursed is he who has given to usury. Why then do you choose a curse rather than a blessing? You can be blessed, if you wish, you can be just.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 15"
