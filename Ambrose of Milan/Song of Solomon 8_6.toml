[[commentary]]
quote='''
The Lord Jesus himself, invited by such eager love and by the beauty of comeliness and grace, since now no offences pollute the baptized, says to the church, "Place me as a seal upon your heart, as a signet upon your arm"; that is, you are comely, my beloved, you are all fair, nothing is lacking in you. Place me as a seal upon your heart, so that your faith may shine forth in the fullness of the sacrament. Let your works also shine and set forth the image of God in whose image you were made. Let no persecution lessen your love, which cannot be quenched by many waters nor drowned by many rivers.
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 7:41"

[[commentary]]
quote='''
And since you are worthy to be compared not now with humans but with heavenly beings, whose life you are living on earth, receive from the Lord the precepts you are to observe: "Set me as a signet upon your heart, and as a seal upon your arm." [Thus] clearer proofs of your prudence and actions may be set forth, in which Christ the figure of God may shine, who, equaling fully the nature of the Father, has expressed the whole which he took of the Father's Godhead. Whence also the apostle Paul says that we are sealed in the Spirit; since we have in the Son the image of the Father, and in the Spirit the seal of the Son. Let us then, sealed by this Trinity, take more diligent heed, lest either levity of character or the deceit of any unfaithfulness unseal the pledge which we have received in our hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25201.html'
source_title="Concerning Virginity 1.9.48"

[[commentary]]
quote='''
That we may fully know that this is true you have in the Canticles to the soul, now fully perfect, what I wish the Lord Jesus may say to you, "Put me as a seal upon your arm." May peace glow in your heart, Christ in your works, and may there be formed in you wisdom and justice and redemption.
'''
source_url=''
source_title="LETTER 80, TO LAYMEN"

[[commentary]]
quote='''
Hence, since Christ was now formed in her, he says: Set as a seal upon your heart, as a signet upon your arm. Christ is a seal on the forehead, a seal on the heart: on the forehead, that we may always confess; on the heart, that we may always love; a seal on the arm, that we may always work. Let his image shine, then, in our confession, let it shine in our love, let it shine in our works and deeds, so that, if it can be done, his whole form may be expressed in us. Let him be our head, because the head of the man is Christ; let him be our eye, that through him we may see the Father; let him be our voice, through whom we may speak to the Father; let him be our right hand, through whom we may bring our sacrifice to God the Father; he is also our seal, which is the mark of perfection and of love, because the Father in his love sealed the Son, as we read: whom God the Father sealed. So Christ is our love. Good is the love, when he offered himself to death for sins; good is the love that forgave sins.

And therefore let our soul put on love, and love of such a kind as is strong as death, because as death is the end of sins, so too is love, since he who loves the Lord ceases to sin. For love indeed thinks no evil, nor rejoices over iniquity, but bears all things. For how can one who does not seek his own things seek what belongs to others? There is also that death which is strong through the laver, by which all sin is buried and guilt is forgiven. Such was the love which that woman of the Gospel brought, of whom the Lord said: Her sins, which are many, are forgiven, because she loved much. Strong too is that death of the holy martyrs which wipes out former guilt, and therefore strong: a death to which love is not unequal, the love that is made equal to the passion of the martyrs, so as to take away what sins deserve.

Jealousy too is as the underworld, since he who has jealousy for God does not spare even his own for Christ's sake. And so love has death, and love has jealousy, and love has wings of fire. In fact Christ, loving Moses, appeared to him in fire, and Jeremiah, having within him the gift of divine love, said: And there was a flaming fire in my bones, and I was undone on every side, and I cannot bear it. Good, then, is love, having wings of burning fire, which flies through the breasts and hearts of the saints and burns up whatever is material and earthly, but proves whatever is pure, and makes better by its fire whatever it has touched. This fire the Lord Jesus sent upon the earth, and faith shone forth, devotion was kindled, love was lit up, justice shone out. With this fire he set the heart of his apostles aflame, as Cleopas testifies, saying: Was not our heart burning within us, while he opened the Scriptures? The wings of fire, then, are the flames of divine Scripture. In fact he opened the Scriptures, and fire went out and pierced the hearts of the hearers. And truly they are wings of fire, because the words of the Lord are pure words, silver tried by fire. When Paul too was taken up by Christ, he saw a light shining round above him and above those who were with him; he fell from fear and rose up more approved; in fact he who had come as a persecutor was made an apostle. The Holy Spirit too came down and filled the whole house, in which a great many were sitting, and there appeared tongues divided as of fire. Good are the wings of love, true wings, which flew through the mouths of the apostles; and wings of fire, which spoke a purified speech. With these wings Enoch flew away, snatched up to heaven; with these wings Elijah flew away, carried up to the heights in a fiery chariot and with fiery horses; with these wings the Lord God led the people of the fathers by the pillar of fire; these wings the Seraphim had when he took a coal of fire from the altar and touched the prophet's mouth and took away his iniquities and purged his sins; by the fire of these wings the sons of Levi were purified, and the peoples of the nations are baptized, as John testifies, saying of the Lord Jesus: He will baptize you in the Spirit and fire. Rightly did David wish his reins and his heart to be burned, for he knew that the fiery wings of love were not to be feared; rightly did the Hebrew youths in the burning furnace not feel the blaze of the fire, because the flame of love kept them cool. And that we may know more fully that perfect love has wings, you heard him saying a while ago: How often have I wished to gather your children, as a hen gathers her chicks under her wings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
Set me as a seal upon your heart, as a signet upon your arm; for love is strong as death, your jealousy hard as the underworld. Its wings are wings of fire, and flames. Much water will not be able to shut out love, and rivers will not overwhelm it. Because the Church has seen such great devotion, she thinks the peoples now fit, we who can carry his seal in our heart and on our arm. For God the Father has sealed him, and he who has received his testimony has set his seal that God is true; and therefore those who work for the food that endures to eternal life are sealed after the image and likeness of Christ, who is the image of the invisible God. As, then, God is true, so you too seal truth in your thought and in your work; that your mouth may not speak a lie, that your hands may not work the works of men, which belong to this deceitful world, but those which are of God: that they may give generously to the poor, lift up the weak, honor the dead with the tombs of burial. By these works love is sought, so that no one can be torn from Christ even by the danger of death; whence he says: Who will separate us from Christ? Tribulation, or distress, or persecution (Rom. 8:35)? And below: For I am confident that neither death, nor life, nor angels (ibid.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Set me as a seal on your heart, as a signet on your arm. The seal of Christ is on the forehead, the seal is in the heart: on the forehead, that we may always confess; in the heart, that we may always love; the seal on the arm, that we may always work. Let his image, then, shine in our confession, let it shine in the reading, let it shine in works and deeds; that, if it can be, his whole likeness may be expressed in us. Let him be our head, because the head of man is Christ; let him be our eye, that through him we may see the Father; let him be our voice, through which we may speak to the Father; let him be our right hand, through which we may offer our sacrifice to God the Father. He is also our seal, which is the emblem of love and of perfection; because the loving Father sealed the Son, as we read: Him has God the Father sealed (John 6:27). Our love, therefore, is Christ. Good love, when he offered himself to death for the beloved: good love, which forgave sin.

And therefore let our soul put on love, and love of such a kind as is strong as death; because as death is the end of sins, so too is love; since he who loves the Lord ceases to sin: Love indeed thinks no evil, nor rejoices over iniquity, but bears all things (1 Cor. 13:5). For he who does not seek his own, how will he seek what belongs to others? There is also that strong death through the washing, through which every sin is buried and guilt is forgiven. Such was the love which that woman of the Gospel brought, of whom the Lord says: Her many sins are forgiven, because she loved much (Luke 7:47). There is also that strong death of the holy martyrs, which abolishes former guilt; and therefore it is strong, a death to which love is not unequal, love which is made equal to the passion of the martyrs, so as to take away the desert of offenses.

Jealousy too is as the underworld, since he who has the jealousy of God does not spare even his own for Christ. Thus love has death, and love has jealousy, and love has wings of fire. Indeed, Christ, loving Moses, appeared to him in fire. And Jeremiah, having in himself the gift of divine love, said: And there was a fire burning in my bones, and I was loosed on every side, and I cannot bear it (Jer. 20:9). Good, then, is love, having wings of burning fire, which flies through the breasts and hearts of the saints and burns up whatever is material and earthly, but whatever is pure it proves; and whatever it has touched it makes better by its fire.

This fire the Lord Jesus sent upon the earth, and faith shone out, devotion was kindled, love was illumined, justice shone again. With this fire he inflamed the hearts of his apostles, as Cleopas testifies, saying: Was not our heart burning within us, when he opened the Scriptures (Luke 24:32)? The wings of fire in flame, then, are the divine Scriptures. Indeed, he opened the Scriptures, and fire went forth and pierced the hearts of the hearers. And they are true wings of fire, because: The words of the Lord are chaste words, silver tried by fire (Ps. 11 (12):7). When Paul too was taken up by Christ, he saw a light shining round about over him and over those who were with him; he fell from fear, and rose up more approved. Indeed, he who had come as a persecutor was made an apostle. The Holy Spirit too came down and filled the whole house in which very many were sitting, and there appeared divided tongues as of fire. Good wings, the wings of love, truly wings that flew through the mouths of the apostles: and wings of fire, because they spoke a purified word.

With these wings Enoch flew away, caught up to heaven; with these wings Elijah flew away, carried to the heights by a fiery chariot and fiery horses. With these wings the Lord God led the people of the fathers by the pillar of fire. These wings the Seraphim had when he took coals of fire from the altar, and touched the mouth of the prophet, and took away his iniquities, and purged his sins. By the fire of these wings the sons of Levi were purified, and the peoples of the nations were baptized, as John testifies, saying of the Lord Jesus: He will baptize you in spirit and fire (Matt. 3:11). Rightly did David wish his reins and his heart to be burned, because he knew that the fiery wings of love are not to be feared. Rightly did the Hebrew children in the burning furnace not feel the burning of the fire, because the flame of love cooled them. And that we may know more fully that perfect love has wings, you heard a little while ago him who said: How often have I wished to gather your children, as a hen gathers her chicks under her wings (Matt. 23:37).

Let us take up, then, these wings, which like flames direct us to higher things. Let each one strip his soul of its baser wrappings and, like gold in the fire, prove her wiped clean of mud. For thus the soul is purified, like the finest gold. And the beauty of the soul is sincere virtue and comeliness, a truer knowledge of things above; that she may see that good on which all things depend, while it itself depends on nothing. By it, therefore, she lives and receives understanding. For that highest good is the fountain of life, the desire for which is kindled in us, to draw near to which and to be mingled with which is pleasure: which, to him who does not see it, is an object of desire; and to him who sees, it is life; and therefore he despises all other things, is soothed by this one thing alone, and delights in it. This is what supplies all substance: but itself, remaining in itself, gives to others, and receives nothing into itself from others; of which the Prophet says: I said to the Lord: You are my God, for you have no need of my goods (Ps. 15 (16):2).

Its wings are wings of fire. All who desire to return to paradise must be proved by fire; for not idly was it written that, when Adam and Eve had been cast out of their abode in paradise, God placed at the exit of paradise a fiery, turning sword. All must pass through the flames, whether it be John the Evangelist, whom the Lord so loved that he said of him to Peter: If I wish him to remain, what is it to you? You follow me (John 21:22). Of his death some have doubted; of his passing through fire we cannot doubt, because he is in paradise and is not separated from Christ. Or whether it be Peter, who received the keys of the kingdom of heaven, who walked upon the sea, he must say: We have passed through fire and water, and you have brought us out into refreshment (Ps. 65 (66):12). But for John the fiery sword will quickly be turned, because no iniquity is found in him whom equity loved. If there was in him anything of human fault, divine love burned it away: For its wings are like wings of fire. He who has had the fire of love here will not be able to fear the fire of the sword there. To Peter himself, who so many times offered his death for Christ, he says: Pass, recline. But he says: He has tried us with fire, as he himself has tried silver.

Its wings are wings of fire. Therefore, since the means of flying has been given to us, let each one stir up in himself the grace of God, and, forgetting what is behind, reaching for what is before, press on to the goal. Far from the honors of public service, far from the heats of the world; lest, as the fables tell, the wax melted by the heat of the sun, with the feather slipping away, should leave flights like Icarus's without support. For although the gravity of the words stands against it, yet with poetic wit they wished to declare that flights through the sky are safe for the maturity of the prudent; but that youthful lightness, liable to the desires of the world, with its feathers flowing away, and the framework of its merits loosened through forgetfulness of the truth, falls back to earth with greater ruin.

Flight is not easy for all; difficult too is the course of human life for living creatures in discord upon the earth. But if the order of our action is in accord for you, the prophet will see in us too that one wheel upon the earth, joined to the four living creatures. Ezekiel will see it again, then, for he still sees and flourishes and will flourish (Ezek. 1:15 and 16): he will see, I say, a wheel in the middle of a wheel, gliding upon the earth without stumbling. For the wheel upon the earth is the life of the body fitted to the virtue of the soul and formed, in a coherent course, to the precept of the Gospel. And the wheel in the middle of the wheel is as it were life within life, in that the life of the saints is not out of tune with itself; but such as it was in the earlier age, such let it be also in the following one: or that in this life of the body the practice of eternal life may revolve. When these things have come into accord, then let the divine voice resound, then above the likeness of the throne there will appear a likeness as the appearance of a man. This man is the Word, because The Word was made flesh (John 1:14): this man is the charioteer of our living creatures, he is the driver of our ways, who, according to the reckoning of our merits, often mounts either a chariot, or a mountain, or a ship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Set me as a seal on your heart, as a signet on your arm, you who have kept for me things new and old. You are my seal, you are after my image and likeness. In you shines the image of justice, the image of wisdom, the image of virtue. And because the image of God is in your heart, let it be also in your works: let the likeness of the Gospel be in your deeds, so that in your conduct you may keep my precepts. The likeness of the Gospel will be in you if to him who strikes your cheek you offer the other, if you love your enemy, if you take up your cross and follow me. For this reason I carried the cross for you, that you might not hesitate to carry it for my sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
