[[commentary]]
quote='''
And you, deserve it by your deeds and beg it by your prayers, that your steps may be directed by the Lord, lest your feet be moved, because it is written: But my feet were almost moved, my steps had well-nigh been poured out. You must beware also lest you abandon the straight path and the byways of crooked roads deceive you. Therefore it is said: Prepare the way for the Lord, make his paths straight. Let us, then, prepare the way for the Lord our God in our minds, let us make his paths straight, let us make straight the paths of our souls, lest we slip. Let not our steps be poured out like those of Lot's wife, who looked back behind her and could not hold her steps, but they were poured out when she was suddenly turned into salt. Let them not be poured out like those of the Egyptians, whose step the wave of the sea poured out. For the very Hebrews who were with Moses, because they sinned in the desert, the footsteps of their feet fell, so that they did not enter the land of the resurrection.

Is it not also beautifully said of these that their advances have been poured out, whose hopes have slipped, whose labour has been poured out in vain, whose vows have been forsaken? For consider that someone for some years had zeal for uprightness, the guarding of chastity, the love of a more careful life, the purpose of devout service, the duty of diligent observance, and that suddenly he was changed, left the monastery, bade farewell to fasts, renounced continence, indulges in delights, gives himself to luxury. Not long ago they went out of the monasteries, and now they are teachers of luxury, sowers of incontinence, inciters of wantonness, detractors of modesty. Would you not beautifully say of these: "their steps have been poured out", who repented of having directed them well? And so they have done penance of a new kind, for their virtues, and they do not do it for their offences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
