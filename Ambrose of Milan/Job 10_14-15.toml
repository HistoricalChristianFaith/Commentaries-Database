[[commentary]]
quote='''
These things he says having in you, I know that you can do all things, and nothing is impossible to you. For if I sin, you will guard me, but you have not made me spotless from iniquity. If I am ungodly, woe is me! If I am just, I cannot lift myself up; for I am full of confusion. I am hunted like a lion for the slaughter. Look at three things: If I sin, he says, you will guard me: and therefore, O man, confess your sin, that you may obtain pardon. Tell your iniquities, that you may be justified. Why do you blush to confess those in which you were born? To deny what you were born in is the crime of one who denies, not of one who confesses. Would that you kept what you have received! Why should you think you have what you have not received? Let the sinner, then, confess, let the ungodly man groan, let the just man not lift himself up and exalt himself, lest through arrogance he lose the fruit of justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
