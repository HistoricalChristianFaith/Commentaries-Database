[[commentary]]
quote='''
The authors of this injury, then, are a woman and eunuchs: but the woman is one of the Egyptian women, who are accustomed to mingle wanton talk with men, to provoke the modest, to pursue those who flee, to press hard upon the bashful. Since she could not defend her own vices, she accused the innocent, adding faithlessness to faithlessness, keeping what belonged to another, herself condemning others, setting no limit to her fury. For what cause was there for her cruelty, except that she saw her lusts resisted and her desires cheated, consent being denied her? See for what reason the prison is opened: that it may receive the innocent; chains are loosed from the guilty, that they may be laid upon the faithful; adulterers of the truth are set free, that he may be shut in who refused the adultery of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
