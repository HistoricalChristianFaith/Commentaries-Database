[[commentary]]
quote='''
But it belongs to the perfect mind to take nothing of earthly things, nothing of bodily allurements, to abstain from earthly things. Therefore Abraham says: I will take nothing of all that is yours. He turns aside, as it were, from the contagion of intemperance; he flees, as it were, the stain of the bodily senses; he rejects worldly delights, seeking the things that are above the world. This is to stretch out the hands to the Lord; the hand is the working virtue of the soul. This he stretches out not to the fruit of an earthly tree but to the Lord, who made he says heaven and earth, that is, the intelligible and the visible substance; for the intelligible usia is heaven, the visible or sensible substance is earth. He signifies, then, that he stretches the virtue of his soul to the higher things, so that from that intelligible substance he may put on the loftiness of the contemplative life, looking not at the things that are seen but at those that are not seen, that is, not at earthly, not at bodily, not at present things, but at incorporeal, eternal, heavenly ones; and that from this visible substance he may take up the grace of the practical and civic discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
