[[commentary]]
quote='''
Many indeed have lamented the weakness of human frailty, yet holy Job and holy David more excellently than the rest. The former, the earlier of the two, is direct, vehement, sharp, and, as if exasperated by grievous pains, in a grander buskin; the latter is gentle and placid and mild, of a milder feeling, so that he truly imitated the feeling of the hart, which he set before himself to imitate. Nor let it disturb you if I seem to proclaim so great a prophet by the likeness of a wild beast, since you read that it was said to the apostles: Be shrewd as serpents, simple as doves.

But nevertheless, although likenesses of this kind are supported by devout examples, and the nature of harts is innocent and gentle, I think that the hart set forth in this place for the prophet's imitation is the one of whom Solomon, the champion of his father's mind, said in Proverbs: Let the hart of friendship and the foal of graces converse with you. For the true Son of God expressed in himself the nature that he himself gave to living creatures; he came into this world like a hart, and with wonderful simplicity joined himself to those by whom snares were being prepared for him. For the simplicity of harts of this kind is said to be such that, when they see themselves being hunted, they attach themselves to those horsemen who, set there in the service of deceit, lead them, drawn in by a show of flight and a pretence of companionship, right into the nets. So therefore the Lord, as if unaware of the danger and unforeseeing, mingled with the Jews who were contriving a trick against him, and took to himself the companionship of Judas the traitor, by whose deadly pretence he came right up to the snares of the cross and the nets of the passion. Hence, turning to him, he said: Judas, do you betray the Son of Man with a kiss? And in this way indeed he came to the nets of the synagogue and willingly put them on, but he was neither entangled nor bound, he who set all free.

In short, he stood out above the nets. And because his own had not received him, he called the Church and conferred his grace upon her, as the most holy Church herself testifies in the Song of Songs, saying: I have adjured you, daughters of Jerusalem, by the powers and strengths of the field, if you will stir up and stir up again love until it pleases. She asks, therefore, in the odour of the field of which holy Jacob smelled, that is, by that faith, by that devotion, that her bridegroom be stirred up by the daughters of Jerusalem, so that he may hasten to the bride, and that his love be stirred up in her, or even that he himself be stirred up, because love is the bridegroom. For God, as John said, is love. But he did not allow himself to be stirred up by others, since he was hastening of his own accord; going forth from his bridal chamber, he exulted like a giant to run the way. The bride saw him and heard the voice of him coming, and suddenly turning she said: Behold, he comes here, leaping upon the mountains, leaping over the hills; for he leaps upon the greater, leaps over the lesser, so as not to suffer hindrances to his devout haste. My kinsman is like she says a roe or a young hart upon the mountains of Bethel. A good hart, whose mountain is the house of God, to which he ran with such speed that he anticipated the vows and desires of the bride. In short, him whom she had seen coming from afar she suddenly knew to be present with her, and hence she says: Behold, he is here behind our wall, looking out through the windows, standing out through the nets. My kinsman answered and said to me: Rise, come, my near one, my beautiful one, my dove, for behold, the winter has passed, the rain has gone: it has departed of itself; flowers have been seen on the earth. The winter is the synagogue, the rain the people of the Jews, who could not see the sun; the flowers are the apostles. And he added: The harvest of the cutting has come, the voice of the turtledove has been heard in our land. That harvest is the faith of the Church; the voice of the turtledove is chastity.

Not with these alone .... but Christ also took on the likeness of the hart, because, coming to earth, he trod down that serpent, the devil, without any harm to himself; he offered him his heel, but did not feel his venom. Hence it was said to him: You will walk upon the asp and the basilisk. Let us therefore also be harts, so that we may be able to walk upon serpents. We shall be harts if we follow the voice of Christ, which prepares harts and makes them not fear the bites of serpents, and, if any happen to have been wounded, takes away their pain by loosing the offence. Of these harts the Lord says to Job: Have you guarded the births of the harts? And have you numbered their months full of bearing, and have you loosed their births or reared their sons, so that they do not fear? Hear how the sons of such harts do not fear. Let Isaiah teach you, saying: And a little child will put his hand into the den of asps, and they will not harm him. And so that you may recognize that it seems to signify the sons of the Church, he added: And will you send forth their births? Their sons will break forth and will be multiplied in generation. They will go out and will not return back. For no one putting his hand to the plough and looking back is fit for the kingdom of God.

Rightly therefore the Lord became a hart, so that the voice of the Lord might prepare for himself such harts, of whom he says: In my name they will cast out demons, they will speak with new tongues, they will take up serpents, and if they drink anything deadly, it will not harm them. For they took up serpents when the holy apostles, by the spirit of their mouth, drew the spiritual wickednesses out of the lurking places of bodies, and did not feel the deadly venoms. In short, when a viper springing out of the brushwood had bitten Paul, the barbarians, seeing the viper hanging from his hand, thought that he would suddenly die. But he stood undaunted, and was neither moved by the wound nor filled with the venom. Hence, seeing him as one not begotten by the condition of man but brought forth, as it were, by the grace of God, they thought him to be above men. See the hart drawing vipers out of their lurking places by the divine spirit which was in his nostrils, as Job said. Paul, turning it says in the spirit and looking back with grief at the python, said: I command you in the name of the Lord Jesus Christ to come out of her at once. And it came out that same hour. See the hart when he came to baptism and, washed in the flowing water of the sacred font, cast off all the venoms of persecution. See the hart, the Lord Jesus, when he came to John the Baptist, and, when John said to him: I ought to be baptized by you, and do you come to me? he answered: Let it be so now. And with this word, thirsting for the salvation of all, he went down into the waters with all eagerness. But now the hart has played enough for us in the opening of the treatise, as at the beginning of the year, after the custom of the common people. Let us go on to the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 1"
