[[commentary]]
quote='''
Phison, therefore, stands for prudence. Hence it has pure gold, brilliant rubies, and topaz stones. We often refer to wise discoveries as gold, as the Lord says, speaking through the Prophet: I gave to them gold and silver. Daniel says of the wise: If you sleep among the midst of the lots, you shall be as the wings of the dove covered with silver and the hinder parts of her back like to gold. In this way one who puts his trust in the aid of the Old and New Testament can by resourceful inquiry attain the inmost secrets of the Wisdom of God. Here, therefore, is found pure gold, not the metal which is melted, which belongs to this earth, and is subject to corruption. In this land, we are told, there is found the brilliant ruby stone in which there exists the vital spark of our souls. Here, too, is the topaz stone which by the nature of its color reveals an effect of greenness and vitality. Plants which are alive give forth green sprouts, while those that are dead are sapless and dry. The earth grows green when it is in bloom. The seeds, too, sprout forth green shoots in their periods of growth. The river Phison is rightfully given first place. The Hebrews call it Pheoyson, which means "change of mouth," because it flows even through Lydia and not merely around one nation, for Wisdom, which is of benefit to all men, is productive and useful. Hence, if a person were to leave Paradise, this river of Wisdom would be the first object he would meet. Thus he may not become inert and arid and his return to Paradise may be facilitated. Many men resort to this river, which is considered to have marvelous beauty and fecundity. Accordingly, it is regarded as a figure of Wisdom, which confers manifold fruits in the coming of the Lord of Salvation. It flows, too, to the very ends of the earth, because, by Wisdom all men have been redeemed. Wherefore it is written: Their sound hath gone forth into all the earth and their words unto the end of the world.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"
