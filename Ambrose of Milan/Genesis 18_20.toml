[[commentary]]
quote='''
The cry he says of Sodom and Gomorrah is filled up. Great is the patience of the Lord, that he does not punish the sinner at once, but long delays, awaiting correction, and is not moved to take vengeance unless the sinner exceeds the measure. Hence the Lord Jesus too says to the Jews in the Gospel: fill up the measure of your fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
