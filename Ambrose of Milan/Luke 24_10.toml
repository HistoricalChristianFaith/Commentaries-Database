[[commentary]]
quote='''
It is not allowed to women to teach in the church, but they shall ask their husbands at home. (1 Tim. 2:12, 1 Cor. 14:35.) To those then who are at home is the woman sent... For that the woman might not endure the everlasting reproach of guilt from men, she who had transfused sin into the man, now also transfuses grace.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But because her steadfastness is less fit for preaching and her sex weaker for carrying it out, the office of evangelizing is entrusted to men. For just as through Jesus the guilt of women is not only loosed but grace is also multiplied, so that she who had once deceived one man may persuade many, so too the man, who had rashly believed before, had to recover the gift with interest, that he who had himself been unsteady in believing might become fit for preaching to others.

But let us mark the very words of the command: Do not touch me; for I have not yet ascended to the Father. But go to my brothers and say to them: I ascend to my Father and to your Father, my God and your God. How had you not ascended, Lord Jesus? How were you absent, who had commended your spirit into the hands of the Father? Or when can you be absent, who are always in the Father, always with the Father? Indeed you yourself said: If I go down into the underworld, you are there: if I take my wings before the light and dwell in the uttermost part of the sea, even there your hand will lead me. Or how do you ascend, who are always everywhere?

You came down indeed as the Son of Man, and when you came down you were not absent from the Father; but you came down for us, that we might see you with our eyes and minds, that we might believe in you. So you ascended too for us, that we might follow with our minds you whom we cannot see with our eyes. You ascended for the apostles, to whom you said: He who has seen me has seen the Father too. Indeed John knew where he should seek you. He sought you with the Father and found you, and therefore he says: And the Word was with God. You ascended for Paul too, who, not content to follow you by himself, taught us too how we should follow you and where we could find you, saying: If then you have risen together with Christ, seek the things that are above, where Christ is, sitting at the right hand of God. And lest we should think this a duty of the eyes rather than of the minds, he added: Set your mind on the things that are above, not on those upon the earth.

Therefore we ought to seek you not above the earth nor on the earth nor according to the flesh, if we wish to find you; now indeed we no longer know Christ according to the flesh. Indeed Stephen did not seek above the earth, he who saw you standing at the right hand of God; but Mary, who was seeking on earth, could not touch. Stephen touched, because he sought in heaven; Stephen saw you absent, among the Jews; Mary did not see you present, among angels. But why she could not touch, the evangelist himself has taught us, saying that when she saw you, she did not know that it was you. For so you have: She turned back and saw Jesus standing, and did not know that it was Jesus. Rightly could she not touch, who had not been able to see; for he who sees touches.

And so the Scripture distinguishes what difference there is between that Mary and this one. The one runs to meet him, that she may see Jesus; this one turns back; the one is greeted, this one is rebuked. Indeed so you have: Jesus says to her: Woman. She who does not believe is a woman and is still designated by the name of bodily sex; for she who believes runs to meet him into the perfect man, into the measure of the age of the fullness of Christ, lacking now the name of the world, the sex of the body, the slipperiness of youth, the talkativeness of old age. So Jesus says: Woman, why are you weeping? As if he said: God requires not bare tears, but faith. Good are tears, if you recognize Christ. Whom do you seek? he says; for the Lord condemns belated efforts. But well did he add whom, not that he doubts whom she is seeking, but because she does not know whom she seeks; for she does not seek Christ, whom she thinks stolen away. Christ is present: how is he sought? He who is sought, then, is not known, when he is not recognized though he is seen.

Indeed she saw Christ and thought him the gardener; for so you have: She, supposing that he was the gardener, said to him: Lord, if you have taken him away, tell me where you have laid him, and I will take him away. Though uncertain in faith, yet she is not slippery in speech; though she thought him the gardener, yet she designated the Son of God; though she does not yet believe, yet she strives to believe; for he himself who raised the body took it away. Pardonable, therefore, is the error of the woman, who, although she ought not to have doubted that the body of Christ had been taken up through the glory of the resurrection, yet longs to be taught by Christ. And in her devotion she now promises her faith, that she too may now take him away from the earth and seek him at the right hand of God.

Indeed after these words she is called no longer woman, but now Mary; for the one is the common name of the crowd, the other the special name of a person following Christ. And she is sent to the disciples, though not yet a judge of full faith, yet as a messenger. But she is forbidden to touch, because she had not yet learned, as Paul had, that the fullness of the divinity dwells bodily in Christ; she had not yet emptied out the slipperiness of the world, the uncertainty of the flesh; she had not yet lived the life of Christ. Indeed this one neither worships the Lord nor holds his feet, as that other Mary did, in whom surely there is signified not so much bodily homage as the affection of full faith, because she believes Christ to be both man and God; for it is God who is worshiped, man who is held.

The Lord, then, whose feet Mary too anointed with ointment, does not disdain to be touched by a woman, nor does he scorn her touch, but teaches progress, because not all can touch Christ rising again who touched him while he dwelt in this life and body. Let him who wishes to touch Christ mortify his members and, made like him who was to rise again, put on the heart of mercy, and not hesitate to renounce earthly things.

What, then, is Do not touch me? Do not lay your hand on greater things, but go to my brothers, that is, to the more perfect — for whoever does the will of my Father who is in heaven, he is my brother and sister and mother — because the resurrection cannot easily be grasped except by the more perfect; the prerogative of this faith is kept for those more firmly grounded, but I do not permit women to teach in the church; let them ask their husbands at home. She is sent, therefore, to those who are of the household, and she received the commands prescribed for her.

Nor does it escape notice in this place that some have thought that Christ was unwilling to be touched because he had not yet received back the form which he had commended to the Father, as if she ought not yet to touch him.

I ascend to your Father, my God and your God. Well did he distinguish, because he was speaking to a woman; for we have no nature in common with Christ except that of the human condition. To him he is Father by his own generation, to us by voluntary adoption; to him by nature, to us by grace; to him he is God by the unity of the mystery, to us by heavenly power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
