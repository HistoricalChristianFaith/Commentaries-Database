[[commentary]]
quote='''
And all the countries came into Egypt to Joseph to buy; for the famine had prevailed. For all are hungry whom Christ has not fed. Let us buy, then, the food with which we can drive away hunger. Let no one be held back by consideration of his poverty; let no one who has no silver be afraid. Christ does not seek silver, but faith, which is more precious than silver. Indeed, Peter bought him, who had no silver. Silver, he says, and gold I do not have, but what I have I give you. In the name of Christ Jesus rise and walk. And the prophet Isaiah says: You who thirst, go to the water, and all you who have no silver, go, buy and drink and eat without silver and without the price of wine. For he did not seek a price from us who paid the price of his own blood for us, because he redeemed us not with gold and silver but with precious blood. Therefore you owe that price with which you were bought. Even if he does not always demand it, still you owe it. Buy Christ for yourself, then, not with what few have, but with what all have by nature, but few offer through fear. What Christ asks back from you is his own. He gave life to all; he offered his death for all. Pay for your Author what you will pay by law. This is no small contract; not all see it easily. Indeed, those virgins in the Gospel whom the bridegroom shut out at his coming were left outside for this reason, because they did not buy the oil that was for sale. Hence it is said to them: Go rather to those who sell, and buy for yourselves. And not undeservedly is the merchant praised who sold all that he had and bought the pearl.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
