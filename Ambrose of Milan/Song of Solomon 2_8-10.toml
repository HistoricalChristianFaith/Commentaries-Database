[[commentary]]
quote='''
And here let these things have been run through in the moral sense. But those mystical things, if we can, let us look upon at least in outline. The Bride, devoted to the Lord, was sitting within the house, within the wall of the Law and the prophets, founded by the building-up of spiritual stones, which enclosed and fortified the royal house, full of joy and gladness. She was marvelling at the royal treasures, and was looking at them anxiously, desiring to take to herself the wisdom which might show her these riches. She was in a secret place, but she was seeking an interpreter of that very secret. The Lord Jesus came, leaping upon the mountains. To us he seemed to come late, but he was hastening. In short, he leapt and leapt across, that he might leap across the bodily and stony doctrines of the Jews. He stood behind the wall of the house which was in the Old Testament, peering through the window of the Law and the hollows of the prophets.

Not yet were the forecourts of that house open, not yet had the keys of wisdom opened the bars of the gates by which the inner parts of the Law were shut; yet, peering out from the upper part, that is, the spiritual, he calls the Church, that through the Law and the prophets, rising aloft on the summit of the Gospel, she may tread with fearless step on the nets and knots of Jewish interpretation. And therefore she is called Nearest, that she may cleave to Christ and not seek worldly things: therefore Fair, that she may carry the beautiful feet of those who bring good tidings: therefore Dove, that she may seek spiritual things and leave earthly things behind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
