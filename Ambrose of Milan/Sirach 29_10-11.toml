[[commentary]]
quote='''
Many through fear of loss do not lend, since they fear fraud, and this is what they are accustomed to say to those who ask of them. To every one of these it is said: Lose thy money for thy brother's sake and for thy friend, and hide it not beneath a stone to be lost. Place thy treasure in the precepts of the most high and it shall avail thee more than gold. But the ears of men have been deaf to such salutary precepts, and especially the rich have their ears closed by that brazen din of their money. While they are counting their money they do not hear the words of Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 3"
