[[commentary]]
quote='''
How, then, do you judge unequal in condition those whom you recognize as equal in virtue to King David or to Solomon, so as to think that Solomon, the son of David, sits at the right hand of God, especially when David himself plainly expressed of whom it had been said? For he would not say of his own son: The Lord said to my Lord: Sit at my right hand. For how would he name his son his lord? The Law forbids, religion resists, faith abhors that you should place a mortal man at the right hand of almighty God. Another is he who sits at the right hand: he who took up a body, not he who began from a body; he who was begotten before the daystar, that is, before the brightness of all lights, since he himself created the brightnesses of the various lights; for Solomon surely is after the daystar. Solomon was not a priest; and therefore it could not be said to him by almighty God: From the womb before the daystar I begot you; it could not be said to him: You are a priest for ever according to the order of Melchizedek, especially since at that time when Solomon lived the priests were according to the order of Aaron, not according to Melchizedek. For the priests were still offering the blood of goats and bulls for the sins and errors of the people; but after he came who offered himself for the salvation of the world, so that the blood of Christ might wash clean those whom the blood of bulls could not wash, the priests began to offer themselves in place of victims.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
