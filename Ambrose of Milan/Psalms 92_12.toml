[[commentary]]
quote='''
By the appearance of the cedar the glory of the forefathers who were just is designated. For the just man will flourish like the palm tree, and like the cedar which is in Lebanon he will be multiplied (Ps. 91 (92):13); for as the cedar does not rot, so neither is the glory of the forefathers corrupted by any age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
