[[commentary]]
quote='''
But to return to our theme, namely that God judged that wickedness should for the meantime be held in check rather than abolished: he says to the serpent: And I will put enmities between you and the woman, and between your seed and the seed of the woman. She will watch for your head, and you for her heel. Where there are enmities, there is discord and the eagerness to harm; where there is the eagerness to harm, there wickedness is placed. So there is discord between the serpent and the woman. Wickedness underlies discord; therefore wickedness has not been taken away. Indeed, it was granted the serpent to watch for the heel of the woman and of her seed, where he might harm and pour in his poison. Let us not, then, walk among earthly things, and the serpent will not be able to harm us. Let us put on the shoe of the Gospel, by which the serpent's poison is shut out and his bite blunted, so that we may have our feet shod for the Gospel. And perhaps this is why Moses is bidden to loose the shoe from his feet, that he might put on the shoe of the Gospel; or else because the preaching of the Gospel was due not to Moses, that is, not to the prophets, but to the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
