[[commentary]]
quote='''
Hence she says: Who will give you to me as a brother, brother, sucking the breasts of my mother? Finding you outside, I will kiss you. Good is the soul that is outside, so that the Word may be within. She is outside the body, so that the Word may dwell in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
