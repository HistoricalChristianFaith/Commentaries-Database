[[commentary]]
quote='''
That Canaanite woman plunders the kingdom, who, going out from her borders, cried out, saying: Have mercy on me, Lord, son of David; my daughter is grievously troubled by a demon. Truly she pressed the kingdom, persistent in prayers, wise in replies, faithful in words. She calls him back as he passes by, asks him when he is silent, adores him when he excuses himself, bends him when he refuses. Does she not seem to you to snatch, when she draws out what is refused, to snatch beforehand what is reserved for others? For the Lord had said that the children's bread ought not to be given to dogs; but she agreed, and by agreeing plundered it, saying: Yes, Lord; for even the little dogs eat of the crumbs which fall from the table of their masters.

You have learned how the heavenly kingdom is seized. Let us too, then, press it, let us plunder it; for no one eats the Passover except in haste. But what is it that seizes the kingdom? Not shamelessness, not wantonness, not pleasure, but that of which it is said: Great is your faith; be it done to you as you will. Behold, she seized it, who obtained what she wished, extorted what she asked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
