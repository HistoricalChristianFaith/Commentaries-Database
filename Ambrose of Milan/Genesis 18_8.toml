[[commentary]]
quote='''
They ate he says but Abraham stood under the tree. We observe that the office of humility is commended by his courtesy. Abraham stood, and you seize the first place at table. Indeed, that humility found favour, so that a son was promised him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
