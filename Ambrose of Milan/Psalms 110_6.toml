[[commentary]]
quote='''
This whole world was empty before Christ filled it with the number of believers, and therefore it is written: He shall judge among the nations, he shall fill up the ruins. For what else was there before in this world but the ruin of unbelief? What is ruin? Hear him who says: Where there is ruin, there also are the eagles, that is: where there is ruin, there also is resurrection. Ruin is empty of firmness; resurrection is the fullness of living. And therefore the ruin of that Adam emptied us, but the grace of Christ filled us again. Therefore he emptied himself, that he might fill us and that the fullness of power might dwell in the flesh of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
