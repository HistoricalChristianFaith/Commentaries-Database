[[commentary]]
quote='''
Instructed, then, by these disciplines of patience and perseverance, Jacob set out and acquired for himself a union with wisdom, the partner of his purpose, with a rich dowry of prudence, so that with her he might run through the seasons of his life without any stumbling. With the treasure of wisdom added, then, he established for himself a flock of varied sheep, but that rational flock, shining with the diversity of very many virtues. Hence also he cut back the boasting of his flesh, which the numbness of the thigh signifies, without prejudice to the interpretation of the sacred mystery. By these virtues, then, as by certain steps, his mind ascended into heaven, and he knew the secrets of God and was strengthened and filled, so that Laban, searching his house, found nothing empty with him, nothing void, no idols, no likeness of vanity. For with him there was not an image but the truth, not a likeness of sloth but the solid form of justice and the intelligible expression of living virtue. And so Laban searched his spiritual house and did not find likenesses; for it was full, not of figures but of deeds.

He could, however, have found the foundations and the summits of the virtues, had he not brought with him blindness of heart and the darkness of a faithless mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
