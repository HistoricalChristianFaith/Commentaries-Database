[[commentary]]
quote='''
Grasp, if you can, how at the touch of the saving right hand pain flees and wounds are healed, not sprinkled with medicine but closed over by a touch. The clay recognizes its worker, and the flesh follows the hand of the Lord, its worker; for the Creator restores his work as he wills. So too elsewhere sight is re-formed for that blind man by clay smeared upon his eyes, as if he returned to his nature. He could have commanded, but he preferred to work, so that we might know that he is the one who from the clay of the earth formed the members of our body, fitted for various offices, and gave them life by infusing the vigour of the mind.

So they came and seized him, to perish the more grievously by the fruit of their own zeal; and the unhappy men neither understood the mystery nor revered so merciful an affection of dutiful love, in that he did not allow even his enemies to be wounded. They were bringing death upon the Just One; he was healing the wounds of his persecutors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
