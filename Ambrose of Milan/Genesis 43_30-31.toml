[[commentary]]
quote='''
And he was troubled, just as you have it in the Gospel that he troubled himself in spirit when he was raising Lazarus; and there he wept, so that he might first wash away with his tears the offences of the dead man. But he wept within, and washed his face. The blindness of Paul is the weeping of Christ: he washes his face when the light that was lost is restored to Paul. Christ washed his face when Paul was baptized, through whom the Lord Jesus would be seen by many more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"
