[[commentary]]
quote='''
Not very long did his intemperance delight that rich man, who was clothed in purple and fine linen; and feasted sumptuously every day, at whose gate Lazarus the beggar lay full of sores, desiring to be filled with those things which fell from the rich man's table. When shortly after he died, being in hell, he began to ask that the poor man might dip the tip of his finger in water and cool his tongue, which was burning with the fire. Where were those riches, where those carousals? He thirsts who was wont to be drunk, he abounds who asked for alms. At the very feast while they drink, they thirst; and when they have become drunk they drink more. Just as if a whirlpool had been opened, wine is no longer drunk but is poured in; the cup is not sipped but drained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 8"
