[[commentary]]
quote='''
How could the Son not have immortality who has life in himself? He has it in his nature. He has it in his essential Being. God has it not as a temporal grace but owing to his eternal Godhead. He has it not by way of a gift as a servant but by peculiar right of his generation, as the coeternal Son. He has life in the same way that the Father has life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25205.html'
source_title="Exposition of the Christian Faith 5.2.35"

[[commentary]]
quote='''
It is read too that the Father also is alone, who alone has immortality and dwells in light inaccessible, as you have read: and to the immortal, only God; but neither first before the Father nor alone without the Son. If you deny the one, you assert the other: follow both, and you confirm both. He did not say: 'I am the former and I am the latter', but: 'I am the first and I am the last'. The Son is first and therefore coeternal; for he has the Father, with whom he is eternal. I dare to say: 'The Son is first, but he is not alone', and I say it rightly and I say it devoutly. Why do you prick up your ears for impiety, heretics? You have fallen into the snares that you lay. The Son is first and is not alone: first, because he is always with the Father; not alone, because he is never without the Father. It is not I who say this, but he himself said: And I am not alone, because the Father is with me. The Father alone, because one God; the Father alone, because the divinity of the Father and of the Son and of the Holy Spirit is alone, and what is one is alone. The Father alone, the Only-begotten alone, the Holy Spirit too alone; for he who is Son is not also Father, nor he who is Father also Son, nor he who is the Holy Spirit also Son. The Son is one, the Holy Spirit another; for we read: I will ask the Father, and he will give you another Paraclete. God alone, because one God, from whom are all things; the Son alone, because one Lord, through whom are all things. It is the divinity that makes one alone. Generation bears witness both to the Father and to the Son, so that nowhere is the Son seen to be without the Father or the Father without the Son. So he is not alone, because he is not alone immortal; nor does he alone dwell in light inaccessible, because no one has ever seen God except the only-begotten Son, who is in the bosom of the Father, who sits at the right hand of the Father. And some dare to say that the light which the Father dwells in is inaccessible to him. Is the light, then, better than the Father? But what light is inaccessible to him to whom the Father is not inaccessible, the Father who is himself the true light and the begetter of the eternal light, of which it was said: That was the true light, which enlightens every man coming into this world? Consider whether that is not the inaccessible light which the Father dwells in, and the Son dwells in too, because the Father is in the Son and the Son in the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
