[[commentary]]
quote='''
And therefore he says: make for yourselves friends of the unrighteous mammon, so that by giving generously to the poor we may procure for ourselves the favor of the angels and of the other saints. Nor is the steward blamed, in whom we learn that we ourselves are not lords, but rather stewards of the property of others. And therefore, although he sinned, yet because he sought help for himself for the future from the indulgence of his lord, he is praised. And finely did he call mammon unrighteous, because avarice tempted our affections with the various enticements of riches, so that we wished to be slaves to riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
