[[commentary]]
quote='''
Hear the apostle Paul fighting against the nation of the Canaanites: I see, he says, a law of my flesh fighting against the law of my mind and making me captive in the law of sin. Now our flesh raises itself up, now it casts itself down; it raises itself against the mind, it casts itself down before power, and, when it sees itself pressed, it abandons its constancy and, ready for subjection, is led along in the law of sin, so as to abandon faith, succumb to unbelief and, under the sway of Hittite weakness, destitute of the truth, yield to falsehood, serve crime, acquiesce in error and, like an Amorite, speak bitter things instead of sweet; for faith is sweet, unbelief bitter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
