[[commentary]]
quote='''
Hence the Apostle says finely: He has abounded, he says, in the riches of his simplicity. For what is richer than simplicity, which, like a good father of a household, abounds enough for itself and, content with its own purity, does not seek what is another's nor gnaw it away, but pours out of itself to others?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
