[[commentary]]
quote='''
While he says these things and confesses the filth of sins both particular and common, suddenly the splendour of truth and the brightness of spiritual grace shone upon him. For, passing beyond the shadow in the prophetic spirit, he saw the very sacraments of the heavenly mysteries, whose type Moses prefigured in the law. And so, wounded with the wound of charity and seized by the desire to search out the truth, he stretched the gaze of his mind towards higher things, and, looking forward into the future, he saw the treasures of wisdom and knowledge in Christ; he foresaw the sacrament of baptism, and, marvelling at the grace, he suddenly cried out, saying: For behold, you have loved truth; the uncertain and hidden things of your wisdom you have made manifest to me. Not that the mysteries are uncertain, for they are certain; nor are the secrets and hidden things of wisdom uncertain, but they are not manifest. For this is what it means: things that had as yet been made manifest to no one; for what eye has not seen nor ear heard, nor has it entered into the heart of man, this God has prepared for those who love him. Seeing these things, then, he says: Behold, now no longer in shadow, not in figure, not in type, but in truth the open light shines forth. Behold, now I look upon the truth, I recognize the splendour of the truth; now I venerate you, O Lord our God, with greater love. For behold, you have loved truth. Not through a mirror, not in an enigma, but face to face you show yourself to me, O Christ; I hold you in your sacraments. These are the true sacraments of your wisdom, by which the hidden things of the mind are cleansed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 12"
