[[commentary]]
quote='''
It befits the mind of the wise man also to be hospitable, so that it may impart its grace to others too, and share the fruit of its prudence with others as well, and so feast on the good foods of teaching and set out its banquet for those who desire it,

then, besides, that it know nothing but to live according to nature, in whose institution and order is the Law of God; that it know how to mingle itself with no perverse desire, prefer union with wisdom alone, and not know how to put the glory of this world and a certain inheritance of present praise before the commandments of God; and that, as it sacrifices its own interests on the altars of the Lord, so it neither receive nor dread the fire of judgment, but rather labour even to rescue others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
