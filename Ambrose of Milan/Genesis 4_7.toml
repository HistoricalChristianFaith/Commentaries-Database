[[commentary]]
quote='''
There are four ways by which a sacrifice may be made acceptable. The sacrifice should consist of a gift, the newest of the new, or it should be dried or broken into pieces, or it should be unbroken. The "newest of the new" belongs to the early season of the year and is consistent with the nature of first-fruits. Now, it has been made clear to us that this refers to those who are renewed by the sacrament of baptism. That, in fact, is the real sacrifice of first-fruits when a person offers himself as a victim and begins of himself to act so as to ensure in the future an offering of a gift that is his very own. The new faith of those who have been made new is strong and vigorous, seeking for itself an increase of virtue. The faith which is weak and slack—the faith which has the sluggish and slothful character of old age—is not one that is fit for sacrifice. We need a faith which blossoms with the lush growth of wisdom and with the youthful vigor of divine knowledge, a faith, moreover, which has the sap of ancient doctrine. There ought to be a concurrence of the old and the new, as in the case of the Old and the New Testament. It is written: Eat the oldest of the old store and, new coming on, cast away the old. Let our food be a knowledge of the patriarchs. Let our minds banquet in the prophetic books of the Prophets. Such nourishment should our minds partake of, the truth of the body of Christ, and not just the external appearance of a lamb. Our eyes should not be affected by the shadow cast by the Law. Rather, the clear grace of the Lord's Passion and the splendor of His Resurrection should illuminate our vision.

If you offer a sacrifice of the first-born of a sheep, a rich burned offering, then you should make an offering of those first-fruits as they are specified in Scripture, according to which your faith ought to be tested as if by fire and ought to glow with the Holy Spirit. Hence Jacob cooked a mess of pottage and thus took the benefits from his own brother, who would surely have attained them by the exercise of a robust faith. One, therefore, increased in strength and vigor, while the other, who was unable to cook his own food, became weak and feeble. Let your soul acquire virtue by being burnt, as with fire, by the Word of God. See the example of Joseph: The word of the Lord inflamed him. Let your faith be roasted like the ears of corn gathered by the harvesters, who choose to gather in the crop soon after it has been browned in the heat of the sun. Frequent reading of the Scriptures, therefore, strengthens the mind and ripens it by the warmth of spiritual grace. In this way our powers of reasoning are strengthened and the influence of our irrational passions brought to naught. Wherefore Esau was weakened when the bonds of virtue were loosed, while those who girded up their loins and were bidden not to eat anything raw nor boiled in water, but who were ordered to eat the head of a lamb roasted in the fire, as it is written in Exodus—these men with stout and trusting hearts crossed the sea on dry ground. In the Gospel, too, the Lord ate a piece of broiled fish, whereby the plenitude of His Spirit was renewed. Perhaps Esau was weak because he desired food that was cooked in water. Food which was unsuitable for himself Jacob gave to one who was infirm.

Our offerings and our prayers ought not to be lacking in order. On the contrary, they should follow a precise pattern. In every case where there is disorder there is room for precision. Especially is this true of prayers and sacrifices which lack clarity unless they have clear divisions. Hence the Law commands that the limbs of a victim be cut up, for the most part. The Law also commands that holocausts be offered, so that the sacrifice be pure without admixture or covering. The reason is that our faith, pure and devoid of all externals, may thus become fervent. In that way our faith may not be enshrouded in dubious and false opinion, but appear in its pure and unadorned simplicity. Again, faith may be divided into suitable parts. Virtue, in fact, is such that it can be divided into several species, the chief of which are four: Prudence, Temperance, Fortitude, and Justice. Let your prayer, therefore, give forth a fragrance of Prudence, aiming at knowledge of God and the truth of faith. Let it have the fragrance of Temperance, a virtue which the Apostle believed should be required of married people: Do not deprive each other, except perhaps by consent, for a time, that you may give yourselves to prayer. The Law commands that those who intend to perform a sacrifice be chaste for one or two days previous. Let your prayer show fortitude, so as not to be interrupted by fear nor be affected by weariness. Pressure of adversity should make us all the more strenuous in prayer. Our supplications should retain an element of Justice. If Judas had adhered to that virtue, his prayer would not have become sinful. At what time ought we to refrain from unjust thoughts and deeds if not when we call upon the justice of God? And so the Lord recommends us to seek justice, saying: Blessed are they who suffer persecution for justice' sake, for theirs is the kingdom of heaven. Judas did not have this justice; otherwise, he would not have betrayed his Lord and Master. Cain, too, did not possess this virtue; otherwise, he would have offered to the Lord first-fruits of the soil, not those of inferior quality. So, too, he failed to divide his gifts into parts. Hence the reply: If you offer rightly and you do not divide equally, thou hast sinned. Hold thy peace. You see the seriousness of the offense. Where there is no division into parts, then the whole sacrifice comes to naught.

One question remains for us to discuss. How much time should we spend in prayer? The Lord spent a night in prayer. He did this not for His own benefit, but that He might teach us a lesson. Frequent prayer tends to strengthen our wills, so that we become more amenable to God's purposes through practice, just as we may become less amenable through indifference. Exercise of this sort, therefore, is salutary. The body's strength is increased by frequent exercise. Lack of exercise tends to diminish or weaken our bodies. In fact, persons who refrain from exercise lose even that strength which is natural to them. In like manner, fortitude of the soul is enhanced by a course of exercises. The very toil expended in such practice will, in the end, turn out to be advantageous rather than useless. Let us give our souls this nourishment, which, like the bread of God from heaven, will, if it is sifted and refined by long meditation, produce real strength in our hearts. Not without reason is the bread described as sifted and refined, because we ought with our whole heart and soul to sift and polish for a long period of time the teachings of holy Scripture in order that the essence of that spiritual food may suffuse the very depths of our souls. Wherefore, if our faith blossoms forth in the spirit of youth, relinquishing the enfeeblement of age—if our faith should glow within, adhering to the principle of due division according to the Law, and if we acquire grace by constancy—then we attain to that rich and, so to speak, unctuous type of prayer of which the Prophet speaks: Thou hast anointed my head with oil. Just as lambs become fat from a plenteous store of milk and as sheep become sleek from rich pasture land, so, too, the prayers of the faithful profit much from drinking in the health-giving words of the Apostles.

If any of the conditions which we have named is not fulfilled, a sacrifice is not approved. Wherefore Cain was warned: If you make a righteous sacrifice, you should divide in no unrighteous way, because the world itself, we are told, was separated into parts. Its previous condition was chaotic, for the earth was waste and void. First of all, light was created and God called it by name and God divided the light from the darkness and He called the darkness night. We read of each of the world's objects created in due order, of the firmament, the earth, the fruit-bearing trees, and the various species of animals. Lighter elements, such as air and fire, were given a higher position, while the heavier elements, such as water and earth, were placed below them. God could, of course, have commanded all to be created at the same time, but He preferred to keep them separate. This procedure we now follow in all our business affairs and especially in our social amenities. It is not sufficient to return what you actually received. You must make the return an acceptable one. To slight in any way a person to whom you feel indebted is much more vexatious than not to pay a debt at all. Therefore, it is the spirit in which you act and the very way in which you make your acknowledgment that count, rather than the material itself of your presentation. In this way, it is true, a person makes an offering which follows the pattern of correctness sufficient to indicate his devotion and his gratitude. Still, such a person has not yet made a due distinction. He ought, first of all, to give first-fruits to God so as to attain God's favor. In fact, the division should proceed in the following way: What is primary should precede what is secondary, rather than contrariwise. What belongs to heaven should take precedence over what is of the earth—not the earthly over what belongs to the heavens.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 6"

[[commentary]]
quote='''
Because Cain disturbed this order, he was told: Thou hast sinned. Hold thy peace! All this is the teaching of God: first, that you should not sin, as He had warned Adam; and, second, that, if you have fallen into sin, you should hold your peace, as Cain was instructed to do. We ought to condemn sin and be ashamed of it. We should not apologize for it, because by our shame our fault is diminished, whereas sin is increased by our attempts to justify it. We undergo correction by keeping silent, whereas we stumble into error by our contentions. Let there be at least a feeling of humiliation where there is no occasion for forgiveness. Hence we have the statement: The just is first accuser of himself. Elsewhere we read the words of the Lord Himself: Tell if thou hast anything to justify thyself. How great is the power of shamefacedness, which obtains that justice which the accusation of guilt has taken away! And so He says: Hold thy peace, since you have no excuse to offer. You have it in your power to be weaned away from sin. The blame is not to be laid on one's brother, but the wrong-doing is to be attributed to the one who is really to blame. The sin returns to you, we are told—the sin which began with you. You cannot plead necessity rather than intent. Your wickedness has come back on you like a boomerang. Thou hast dominion over it.

This statement (Thou hast dominion over it) is well expressed, for impiety is the mother of error and a person who has once sinned grievously is likely to fall easily into other sins. How is it possible for man to exercise control over human things when he has done violence to what is divine? How can a man who has done injury to God be good in the eyes of men? It follows, then, that other vices are found in the wake of serious implications of immorality, since derelictions, once entered upon, lead to others. You have dominion, therefore, over your own acts; you are master of your own transgressions. You cannot enter a plea of ignorance or of compulsion. You are subject to trial as a voluntary defendant. It was not by accident or by guile that you put yourself in the category of one accused of inflicting injury on God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 7"
