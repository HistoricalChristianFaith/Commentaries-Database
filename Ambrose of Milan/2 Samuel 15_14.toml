[[commentary]]
quote='''
Look at another memorable thing. A parricidal son had violently invaded his father's kingdom. At first his father gave way to his fury and avoided the place of battle, so that even thus the impious one might come to his senses from his fury. He was unwilling also to take part in the war; he asked those setting out for the battle to spare his son. He who asked them to spare him was both secure of victory and no stranger to devotion, since he did not think that even an impious son ought to perish. He wept and lamented with great mourning the death of the parricide, saying: My son Absalom, who will give me death for you, my son Absalom? He thought that the man who had slain him in vindication of a father's devotion deserved to be punished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
