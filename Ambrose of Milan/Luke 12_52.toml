[[commentary]]
quote='''
Nor does it seem incongruous if we untangle this sense by a mystical interpretation. One house is one man; for each man is the house either of God or of the devil. Thus the spiritual house is the spiritual man, as we have in the epistle of Peter: and you, like living stones, are built up a spiritual house into a holy priesthood. In this house, then, two are divided against three, three against two. Two, we frequently read, are the soul and the body. But if the two have agreed on earth, he has made both one. And elsewhere: I chastise my body and bring it into servitude. That which serves is one thing, that to which it is subjected another.

If we have recognized the two, let us recognize the three as well, which is easy to understand from those two. For there are three affections of the soul in the body, one rational, another concupiscible, the third irascible, that is, λογιστικόν, ἐπιθυμητικόν, θυμικόν. So not two against two, but two against three and three against two will be divided; for through the coming of Christ man, who was irrational, has been made rational. Before, we were like the beasts, which know not reason; we were carnal, we were earthly, according to the sentence: earth you are and into earth you shall go. The Son of God came, he sent his Spirit into our hearts, we were made spiritual sons.

We can say that in this house there are another five, that is, smell, touch, taste, sight, hearing. So if, in accordance with the things we hear or read, setting apart the sense of sight and hearing, we shut out the superfluous pleasures of the body which are produced by taste and touch and smell, we divide two against three, because the disposition of the mind is not caught by the enticements of the vices, but through emulation of virtue withdraws itself from the allurements of pleasure, and there is not one consent of all, which would hurl it headlong into error, but by dividing, the desires of the heart and the duties of virtue separate themselves. Or if we take the five senses of the body, then the vices of the body and its sins separate themselves. And perhaps these are the five whom that rich man in the Gospel, given to luxury, who is described as tormented in the underworld, calls his brothers, to whom he asks that word be sent, that they may know that in this world delights must be renounced, so that the pursuits of virtue may have rest after this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
