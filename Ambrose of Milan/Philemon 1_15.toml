[[commentary]]
quote='''
Show us that which is good, like itself, always indissoluble and unchangeable, in which we may be eternal in the knowledge of every good, as Paul, the vessel of your election, testified, saying: For perhaps he departed for an hour for this reason, that you might receive him as eternal. So he called the minister of God eternal, writing to Philemon, whose faith, in the knowledge of every good that is in the saints, he asked to become more evident in Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
