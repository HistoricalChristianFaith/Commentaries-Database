[[commentary]]
quote='''
But he who conquers ought not to claim the victory for himself, but to ascribe it to God. This Abraham teaches, who was made humbler by his triumph, not prouder. In short, he offered sacrifice, he gave tithes; and therefore Melchizedek too, who in Latin interpretation is called king of justice, king of peace, blessed him; for he was a priest of the most high God. Who is the king of justice, the priest of God, but he to whom it is said: You are a priest for ever according to the order of Melchizedek, that is, the Son of God, the priest of the Father, who by the sacrifice of his own body made the Father propitious again toward our sins?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
