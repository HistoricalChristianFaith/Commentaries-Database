[[commentary]]
quote='''
And so Reuben and Judah, keeping the holy rights of brotherhood, wished to free him from their hands, and rightly Judah is preferred in his father's blessing, when it is said to him: The sons of your father shall worship you. A lion's whelp is Judah, and he is the expectation of the Gentiles. This surely befits Christ alone, for whom it was reserved to be worshipped by his brothers and awaited by the Gentiles, to wash his robe in wine by the passion of his own body, because he stained his flesh with no spot of sin. Asher too surely did not believe that this applied to himself: Asher, his bread is rich, and Asher himself is with princes. And what of Joseph himself, to whom it was said: My son to be increased, Joseph, my son to be increased, my son envied, my younger son, return to me, against whom they took counsel and whom they cursed, in whom the blessing prevailed over the blessings of the abiding mountains and the desires of the everlasting hills: whom did he understand to be signified in himself but him who, surpassing the merits of all, held, above the desires of all the saints, the summit of immeasurable power, whom no one could equal even in wish? So in the patriarchs envy is made good by grace; they are both excused from guilt and consecrated by the gift of revelation. For it is not so blameworthy to have said what belongs to the people as it is blessed to have seen what belongs to Christ. They took on the role of the sinful people, so as to receive the grace of the Lord the Redeemer. Surely grace has wiped out the guilt; the guilt has not lessened the grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
