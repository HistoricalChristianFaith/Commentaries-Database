[[commentary]]
quote='''
Are not five sparrows sold for two pennies, and not one of them is in forgetfulness before the Lord? But even the hairs of your head are all numbered. Do not fear: you are more than many sparrows. The Savior has woven in a most beautiful passage on holding fast to simplicity and emulating faith, lest after the manner of Jewish unbelief we press down some things in our affection and feign others with our voice, since at the last time the hidden things of our thoughts, accusing or even defending, will be seen to lay open the secret of our mind. For what greater enticement to simplicity is there than that each one should know that there can be no hiding place for fraud?

But since the cause of unbelief is twofold, because it springs either from ingrained malice or from a fear that befalls, lest anyone, terrified by fear of a power, be compelled to deny God whom he knows in his heart, he fittingly added that only the punishment of the soul is to be dreaded, that the penalty of the body is not to be feared — for death is the end of nature, not a penalty — and therefore that death is the ending of bodily punishment, but the penalty of the soul is perpetual, and that God alone is to be feared, to whose power nature sets no bounds, but that same nature is subject to it; and that death is not terrible, which immortality will redeem with a richer interest.

The Lord had breathed in the disposition of simplicity, he had raised up the strength of the mind; faith alone was wavering: well did he strengthen it from meaner things; for if God does not forget sparrows, how can he forget men? But if the majesty of God is so great and so eternal that not one of the sparrows nor the number of our hairs is beyond God's knowledge, how unworthy it is to think that the Lord is either ignorant of the hearts of the faithful or despises them, he who knows meaner things!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
