[[commentary]]
quote='''
And how much holy Job granted to death, when he said: May the blessing of one who is about to die come upon me! For even though Isaac blessed his sons as he was dying, and Jacob blessed the patriarchs, yet the grace of that blessing could be ascribed solely to the merits of those who blessed, or to fatherly love. Here, however, there is no prerogative of merits, none of fatherly love, but the privilege of death alone, since the blessing of anyone at all who is about to die has so much virtue that the holy prophet desired it for himself. And therefore let us always think on this little verse and hold it in our heart.

If we see a poor man about to die, let us help him with our means; let each one of us say: May the blessing of one who is about to die come upon me. If we see someone weak, let us not desert him; if we see someone at his last, let us not abandon him: let it occur to us too to say: May the blessing of one who is about to die come upon me. May everyone about to die praise you too, everyone laid low by age, everyone worn out by a grievous wound, everyone consumed by disease and already near to death. How many this little verse has caused to be blessed! How often it has struck me with shame, if I passed by one about to die, if I did not visit one gravely ill, if I disdained a needy man, if I did not redeem a captive or despised an old man! Let it be always in the heart, then, to spur on the harder and to admonish the readier. Let the last words of one about to die echo you, and let the soul as it goes out of the body carry with it a blessing on you. Rescue also him who is being led to death, who was about to perish unless you had come to his help, so that you may say: May the blessing of one who was about to perish come upon me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 8"
