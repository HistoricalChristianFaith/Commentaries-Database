[[commentary]]
quote='''
Lot chose the pleasant part, which quickly caught the eyes of plunderers. Hence war among kings, the victory of the adversaries, the captivity of the inhabitants. And so Lot too paid the price of his weaker counsel, deceived not by the barrenness of the lands but by the envy their pleasantness aroused, so that he himself too was led away captive, since through the vice of servile wickedness he had turned away from the better and had chosen the portion of the most shameful men; for Sodom is luxury and wantonness. And therefore Lot is called in Latin interpretation turning aside, because he chooses vices who turns aside from virtue and deviates from equity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"

[[commentary]]
quote='''
We have learned the progress of the good mind, which, rising up out of the vice of slippery deviation, at once sought the reward of wisdom, the inheritance of justice. But how much attendant vices harm fickleness, the series of the readings that follow teaches. For those four kings, who triumphed over the five kings and carried off all the cavalry of Sodom, also took Lot, the son of Abraham's brother, and departed. The five kings are the five senses of our body, sight, smell, taste, touch, hearing; the four kings are the bodily and worldly allurements, since both the flesh of man and the world consist of four elements. Rightly they are called kings, because fault has its own dominion, has a great kingdom. Hence the Apostle says: let not sin reign in your mortal body. Our senses, then, easily yield to bodily and worldly delights and are captured by a certain power of theirs. For bodily delights and the allurements of this world nothing conquers but the mind which has become spiritual, cleaving to God and separating itself wholly from earthly things: every deviation is captured by them. Hence John says: woe to those who dwell on the earth! He certainly does not include all men who will then have run the course of this life — for there are, even placed on earth, those whose way of life is in heaven — but those whom affection for an earthly way of life and the favour of this world have overcome. Therefore we are not inhabitants but sojourners of this earth. For the sojourner bears the hope of a temporary lodging, but the inhabitant seems to place all his hope and the use of his substance there where he has thought he must dwell. And so he who is a sojourner of the earth is an inhabitant of heaven, but he who is an inhabitant of the earth is a possessor of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 7"
