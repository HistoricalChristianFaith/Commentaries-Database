[[commentary]]
quote='''
This man is the Word, because The Word was made flesh (John 1:14): this man is the charioteer of our living creatures, he is the driver of our ways, who, according to the reckoning of our merits, often mounts either a chariot, or a mountain, or a ship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
