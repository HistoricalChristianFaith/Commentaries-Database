[[commentary]]
quote='''
Hence many have raised no small question, whether divine Scripture seems to assert that nature perishes, especially since elsewhere it says: I will crush them like dust before the face of the wind, and like the mud of the streets I will wipe them out, and elsewhere: behold, all the adversaries shall be confounded and shall be ashamed; for they shall be as though they were not. First, then, I ask whether they think ungodliness is according to nature or contrary to nature. If they assert that it is according to nature, it is certain that their opinion errs. Then let them say whether sin befits nature or not. But it is certain that to sin is to deviate from what is according to nature. What, then, is so absurd as for them to say that to be ungodly seems a lesser thing than to be a sinner, when the bitterest of all is whatever is seen to be done to the injury of God? But if acting ungodly is not contrary to nature, then living ungodly according to nature should neither be counted as sin nor be judged worthy of reproach; for no one is reproached who acts according to nature. Hence it is concluded that ungodliness is contrary to nature. How, then, does Scripture bring in, together with the destruction of a habit, συναπολουμένας φύσεις, that is, natures that will perish, when ungodliness is certainly not natural but contrary to nature? For what you do not have you do not lose, nor can that substance perish which did not exist. For dust too, when stirred, is changed either into the substance of water or into air or into fire, that is: it often seems to pass into another nature. It does not, then, fail into nothing, but passes into something else.

What, then, prevents him too who is crushed like dust by the power and reason of the word from being, not scattered into nothing, but changed for the better, so that from an earthly man he becomes a spiritual one, and from being wiped out like the mud of the streets in such a way that whatever seems rough and filthy is taken away and whatever is smooth and clean remains? And as for what he says of the adversaries of Jerusalem: they are as those who are not, he could certainly have said: "they will not be". But since he said: they shall be confounded and shall be ashamed, you surely understand that they will be, in substance and in the progress of conversion, but they will not be as adversaries, which they were. And so through the failing of their wickedness they will not be; they will be, changed by faith and devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
