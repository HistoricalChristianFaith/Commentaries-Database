[[commentary]]
quote='''
Or: John saw into the secrets of the heart; but let us remember by whose grace, for it is of the gift of God to reveal things to man, not of the virtue of man, which is assisted by the Divine blessing, rather than capable of perceiving by any natural power of its own. But quickly answering them, he proved that he was not the Christ, for his works were by visible operations. For as man is compounded of two natures, i. e. soul and body, the visible mystery is made holy by the visible, the invisible by the invisible; for by water the body is washed, by the Spirit the soul is cleansed of its stains. It is permitted to us also in the very water to have the sanctifying influence of the Deity breathed upon us. And therefore there was one baptism of repentance, another of grace. The latter was by both water and Spirit, the former by one only; the work of man is to bring forth repentance for his sin, it is the gift of God to pour in the grace of His mystery. Devoid therefore of all envy of Christ's greatness, he declared not by word but by work that he was not the Christ. Hence it follows, There cometh after me one mightier than I. In those words, mightier than I, he makes no comparison, for there can be none between the Son of God and man, but because there are many mighty, no one is mightier but Christ. So far indeed was he from making comparison, that he adds, Whose shoes latchet I am not worthy to unloose.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
By the words, Whose shoes I am not worthy to bear, he shows that the grace of preaching the Gospel was conferred upon the Apostles, who were shod for the Gospel. (Eph. 6:15.) He seems however to say it, because John frequently represented the Jewish people.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
I he says baptize you with water.

He quickly proved that he was not the Christ, since he works by a visible office. For since man consists of two natures, that is, of soul and body, what is visible is consecrated through visible things, what is invisible through the invisible mystery; for by water the body is washed, by the Spirit the sins of the soul are cleansed. We do one thing, we invoke another, though even in the font itself the sanctification of the divinity breathes; for the washing is not wholly by water; but these cannot be divided from each other, and so the baptism of repentance was one thing, the baptism of grace is another: this is from both, that from one. For since sins are common to mind and body, the purification too had to be common. And well did Saint John, indicating that he had understood what they were thinking in their hearts and yet, as though he had not understood, declining the odium of majesty, declare not by word but by deed that he was not the Christ. For it is the work of man to repent of sins, it is the gift of God to fulfil the grace of the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
But one stronger than I is coming. He made no comparison, as if he had said that Christ was only so much stronger than himself — for there could be no comparing the Son of God and a man — but he says it because there are many strong. For the devil too is strong; no one indeed can plunder the goods of a strong man unless he first binds the strong man. Many, then, are strong, but none stronger except Christ. Indeed, so far was he from making a comparison that he added: whose sandals I am not worthy to carry, showing that the grace of the preaching of the Gospel had been conferred on the apostles, who are shod for the Gospel.

Yet he seems to say this because John often took on the person of the Jewish people. Hence they refer to this what he says: He must increase, but I must decrease, meaning that the Jewish people had to become less, and the Christian people to increase in Christ. Indeed, Moses too took on the person of the people, but he also carried not the Lord's sandal but that of his own feet. And these were shod perhaps with a sandal not of their own feet, whereas he is bidden to loose the sandal of his own feet, so that the step of his soul and mind, loosed from the bonds of bodily ties, may tread a spiritual path. But the apostles had laid aside the bodily sandal when they were sent without sandal, without staff, without wallet, without belt; but they did not at once carry the Lord's sandals. Perhaps they began to carry them after the resurrection; for before, they were warned not to tell anyone the deeds of the Lord. Indeed, afterwards it is said to them: Go into the whole world and preach the Gospel, so that, putting forth the footstep of the preaching of the Gospel, they might carry the sequence of the Lord's deeds round the whole world. The nuptial sandal, then, is the preaching of the Gospel. But we shall explain something about this more fittingly elsewhere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
