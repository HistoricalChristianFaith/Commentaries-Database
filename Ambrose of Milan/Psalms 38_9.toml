[[commentary]]
quote='''
The Apostle, then, puts groaning before all things as the sign of the Holy Spirit, as we read. Let us, then, guard the doors of our soul, so that the entrance of our confession may not be split by the axes of much speaking. Let nothing insolent and proud come out of our mouth, and let us not lift the axe or the hammer, which do not enter into the church of the Lord. Shut the doors when you pray, so that the wicked spirit may not thrust himself in, to extort sin there where we wish to acquire the gain of devotion. He who prays thus, his groaning is not hidden from the Lord. Indeed the groaning of Saint Peter was both known and heard, when he wept most bitterly; surely it was not the tears that were bitter, but the affection that shed them. Even in unbelieving Ahab groaning would have found grace, had not his abiding envy heaped up the offence. For it is not a careless groaning that is commended, but one that has conversion; for it is written: If, being converted, you groan, you will be saved.

Let us also set all our desire before the Lord. What is desire? For I have read of the desire of a good thing: With desire I have desired to eat this pasch with you, and: The hart desires the fountains of waters. But I think that he who does penitence, who afflicts himself, ought to enumerate not his good things but the sins he has committed. Indeed, as I think, we are taught this by those verses in which he says: God, I will declare my life to you; you have set my tears in your sight. For he does not announce his life as innocent, where tears are shed, which usually undertake the embassy for sins. Unless perhaps we understand it thus: that, even if someone is innocent, he cannot be secure, since he has daily contests against most grievous enemies, and therefore, even where a glad conscience shines, the fight is yet tearful. In view of these verses, then, we can take it as concupiscence rather than desire; for the Greek has put ἐπιθυμίαν, and both concupiscence and desire are called ἐπιθυμία, but concupiscence is said of both good and evil: My soul has coveted and fainted for the courts of the Lord, for good, but in the Law otherwise: For I did not know concupiscence, unless the Law said: You shall not covet, surely for evil. Indeed the words that follow teach us that, taking occasion, sin through the commandment works every concupiscence in the disposition of man. Yet we can take it thus: "I set all my desire before you", that is, I make plain to you what I desire to obtain, so that it seems it should be referred to the series of petitions, not to a boasting of virtues; for boasting is insolent even in the blameless, entreaty praiseworthy even in a sinner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
