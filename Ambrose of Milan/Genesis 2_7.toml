[[commentary]]
quote='''
So the soul is not blood, because blood belongs to the flesh; nor is the soul a harmony, because a harmony of this kind too belongs to the flesh; nor is the soul air, because the breathed spirit is one thing, the soul another; nor is the soul fire, nor is the soul an entelechy; but the soul is living, because Adam was made into a living soul, in that the soul gives life to the body, which is without sense and lifeless, and governs it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 2"
