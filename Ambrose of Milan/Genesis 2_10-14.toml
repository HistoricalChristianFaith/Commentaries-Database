[[commentary]]
quote='''
The river, we are told, is separated into four branches. The name of one is Phison which encircles all the land of Hevila, where there is gold. And the gold of that land is good; bdellium and onyx there. The name of the second river is Gihon. This river encircles all the land of Ethiopia. The name of the third river is Tigris, which river flows by the Assyrians. And the fourth river is the Euphrates. There are, therefore, four rivers. Phison—so called by the Hebrews, but named Ganges by the Greeks—flows in the direction of India. Gihon is the river Nile, which flows around the land of Egypt or Ethiopia. The land enclosed by the Tigris and Euphrates rivers is called Mesopotamia because it lives between these two rivers. This name conveys its location even to far-distant peoples and, besides, expresses popular belief. But how is the fount called the Wisdom of God? That this is a fount the Gospel tells us in the words, If anyone thirst, let him come to me and drink. Wisdom is a fount according to the Prophet: Come and eat my bread and drink the wine which I have mingled for you. As Wisdom is the fountain of life, it is also the fountain of spiritual grace. It is also the fountain of other virtues which guide us to the course of eternal life. Therefore, the stream that irrigates Paradise rises from the soul when well-tilled, not from the soul which lies uncultivated. The results therefrom are fruit trees of diverse virtues. There are four principal trees which constitute the divisions of Wisdom. These are the well-known four principal virtues: prudence, temperance, fortitude, and justice. The wise men of this world have adopted this division from us and transferred it to their writings. Hence, Wisdom acts as the source from which these four rivers take their rise, producing streams that are composed of these virtues.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"

[[commentary]]
quote='''
In these four rivers are symbolized, therefore, the four principal virtues. It may well be said that these virtues have been the determining boundary lines for the four great ages of the world. This, in fact, is the topic of the discourse which follows.

The first age, then, is the age of Wisdom. This period extends from the beginnings of the world up to the time of the Flood. The Lord has given us the names of the just men of this age. Abel was so called, and so was Enos, a man made to the image of God, who hoped to invoke the name of the Lord God. Henoch, also, whose name in Latin means "grace of God," was carried up to heaven, and Noe, who was a just man, and one who might be called a guide to tranquillity.

The second age of the world is that of Abraham and Isaac, Jacob, and a number of other patriarchs. This was a period in which religion flourished in its more temperate and purest form. Pure was Isaac, a son given to Abraham according to promise, not as an offering of the body, but as a gift of divine beneficence. In him there is found the figure of Him who is pure as the Apostle teaches. The promises were made to Abraham and to his offspring. He does not say, "And to his offsprings," but as of one, "And to thy offspring," who is Christ.

The third age lies in the period of the Law of Moses and in the time of the other Apostles. For time will fail me if I tell of Gideon, of Barac, of Samson, of David and of Samuel, Elias and Elisaeus, who by faith conquered kingdoms, wrought justice, obtained promises, stopped the mouths of lions, quenched the violence of fire, escaped the edge of the sword, recovered strength from weakness, became valiant in battle and captured the camps of aliens. Not without reason, then, do these men stand as types of fortitude. Further on we are told: They were sawed asunder, they were tempted, they were put to death by the sword. They went about in goatskins, destitute, distressed, afflicted—of whom the world was not worthy—wandering in deserts, mountains, caves and holes in the earth. Appropriately, therefore, do we set these men down as types of Fortitude.

The figure of Justice is, according to the Gospel, a meritorious one, because it is unto salvation to everyone who believes. Hence, the Lord Himself says: Permit us to fulfill all justice. She is truly the prolific parent of the other virtues. Yet, whoever possesses any of the above-mentioned principal virtues has the other virtues, also, since these virtues are so connected as to form a unit. Surely, Abel, a just and courageous man, Abraham, a man of great patience, the Prophets, men of the greatest wisdom, and Moses, a man of great learning, considered that the ingloriousness of Christ brought far greater honor than the treasures of Egypt. Who was wiser than Daniel? Solomon, too, sought wisdom and merited it. Enough has been said, therefore, on the subject of the four rivers of virtue whose waters are salutary.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"
