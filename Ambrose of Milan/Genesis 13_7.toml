[[commentary]]
quote='''
Let us consider, then, who the shepherds are, and of what animals, and what the quarrel is between the shepherds of Abraham and the shepherds of Lot. Shepherds are the masters of flocks, either diligent and sober, not allowing the cultivated fields to be trampled by the print of the foot and scorched by teeth, or negligent and slack, who do not call back their flock to where grassy and not fruit-bearing places may be grazed, but let it wander freely through the various fruits of the field. So the skilful watchfulness of these shepherds is necessary, lest perhaps what happened through the carelessness of the negligent should be ascribed to the diligent. But because the discourse is not about visible things, let us first consider of what herd they are the shepherds. We can define these shepherds. Shepherds it says of beasts of burden; and we have understood that beasts of burden signify the irrational senses of the body. Who then are the shepherds of the senses but their teachers and, as it were, certain governors and leaders, or the counsellors of some discourse, or the thoughts of our mind? These, if they are skilled in the shepherd's discipline and hold fast to it, do not permit the flock of the senses to wander too far and to cling to useless or harmful pastures, but call it back with provident leading, apply the reins of reason and resist it when it struggles. But bad teachers or useless disputations allow them to be carried by their own impulse, to rush headlong into the precipice and into danger, to trample the cultivated land, to graze down what bears fruit, so that, if there are any fruits of virtue up to now in the same soul, they scatter these too. Hence, then, the discord of our thoughts. When the flesh fights against the spirit, and the spirit against the flesh, it is no slight battle, since the Apostle himself, the vessel of the Lord's election, says: I see the law of my flesh fighting against the law of my mind and making me captive in the law of sin, which is in my members. He himself had been unable to calm this battle, and therefore he fled to Christ, saying: Unhappy man that I am, who will free me from the body of this death? that is, so that I may not cling to the delights of the flesh. Who then is it that may free me from these bonds, and unite me, set free, to God, and turn my senses toward the sobriety of the soul rather than toward the drunkenness of the body? But because among men he could not find such a governor, turning to God, The grace he says of God through Jesus Christ the Lord. If the stronger man did not entrust himself to his own strength in order to escape the body of death, but sought help from Christ, what ought we, the weaker, to do? Abraham knew this battle to be grievous, and therefore he thought it must be guarded against at the beginning; for the wise man has a zeal for peace, while to the imprudent quarrels are dear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
