[[commentary]]
quote='''
And Abraham, looking about, saw, and behold, a single ram caught in a thicket. Why a ram? Surely as one that stands foremost in the flock. Why suspended? So that you might observe that that victim was not an earthly one. For what cause suspended by the horns, except that it raised its flesh from the earth by a higher power? According to what is written: whose sovereignty is upon his shoulders. Who indeed is signified but he of whom it was said: he will exalt the horn of his people? Our horn is Christ, who excelled all, as we read: beautiful in form beyond the sons of men, he alone raised up and exalted from the earth, as he himself teaches us when he says: I am not of this world, I am from above. Him Abraham saw in that sacrifice, his passion he beheld. And therefore the Lord himself says of him: Abraham saw my day and rejoiced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
