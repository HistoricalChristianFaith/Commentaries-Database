[[commentary]]
quote='''
There are two generations in Christ, one from His Father, the other from His mother; the Father's more divine, the mother's that which has come down for our use and advantage.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Why is it that you were seeking me? Did you not know that I must be in the things that are my Father's? There are two generations in Christ: one is from the Father, the other from the mother; that from the Father is the more divine, while that from the mother is the one that came down to our toil and use. And so the things that are done above nature, above age, above custom are not to be ascribed to human powers, but must be referred to divine might. Elsewhere his mother urges him on to the mystery; here the mother is reproved, because she still asks for what is human. But since here he is described as twelve years old, there he is shown to have disciples, you see that the mother had learned from her son, so as to ask a mystery from him when he was grown, she who had marvelled at a miracle in him when he was younger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
