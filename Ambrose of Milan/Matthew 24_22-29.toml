[[commentary]]
quote='''
But that saying meets us in which the Lord says: For the sake of the elect the days shall be shortened, and it seems contrary, unless you pay careful attention and go back over what precedes. For the Lord says: Then, if anyone says to you: Look, here is the Christ, or: Look, there, do not believe it; for false christs and false prophets shall arise and shall give great signs and wonders, so that even the elect, if it can be, are led into error. And therefore, so that the elect may not be deceived, the Lord admonishes what is to be followed: that we may not be caught by the speech of false prophets nor be deceived by any portentous deeds of theirs, but may believe that Christ is to come at that time when days full of righteousness begin to shine. For Christ will be revealed in the full light of his majesty, and, as the lightning goes out from the east and spreads its light over the whole world even to the west, so too the Son of Man, coming with his angels, will light up this world, so that every man may believe and all flesh be saved. Let us not, then, believe the antichrist, of whom the false prophets will say: This is the Christ; for the days of the antichrist will be days of unbelief. Let us not believe those who will say: 'Christ is in the desert, Christ is in the inner rooms'; for when Christ begins to draw near, all things are already full of Christ. But when we see the things which Christ foretold beforehand in his Gospel, then let us believe in his coming, lest, while we seek the true light, we fall into the darkness of unbelief.

The signs of unbelief, then, are to be guarded against, by which the days are shortened and lessened. For the sun will be darkened, the stars will fall, that is, the righteous of God; for there are those who shine like stars in heaven. When you see these things, believe that Christ is still delaying; for where Christ is, there faith is brighter; where the antichrist is, there are half-days.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
