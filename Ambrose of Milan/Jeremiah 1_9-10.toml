[[commentary]]
quote='''
And therefore, if anyone takes refuge with a physician of this kind, he must first consume his whole patrimony before receiving any progress toward health, like that woman in the Gospel who for twelve years could not stanch the flowing blood of bodily pleasures, until after she took refuge with Christ. For she understood that no one is a perfect physician except him who had come down from heaven, of whom she had learned that it was said: He sent his word and healed them, and she noticed that it was said of him: Behold, I have given my words into your mouth and set you today over nations and kingdoms, to root up and to destroy and to ruin and to pull down and to plant. For although God has frequently spoken in the prophets, yet in whom has he spoken more expressly than in his own Son, who, expressing all the power of the Father, says: My doctrine is not mine, but his who sent me? Not Jeremiah, then, who underwent exile in the time of the captivity, but the Lord Jesus by his words rooted out the vices of the Gentiles from their inmost hearts, destroyed the unbelief of the nations and the depraved inventions of crafty thoughts, and abolished every trace of iniquity. Then afterwards he poured in faith and the discipline of continence, lest the sacraments of the virtues should turn sour in a confusion of vices, as in a tainted vessel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
