[[commentary]]
quote='''
Hence Scripture says: Abraham called the name of that place 'the Lord saw,' so that today they say: 'on the mountain the Lord appeared,' that is, that he appeared to Abraham revealing the future passion of his body, by which he redeemed the world, and showing also the manner of the passion, when he showed it suspended. That thicket is the gibbet of the cross, and on this wood the most excellent leader of the flock, being exalted, drew all things to himself, so that he might be known by all. Hence he himself says: when you have exalted the Son of man, then you will know that I am.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
