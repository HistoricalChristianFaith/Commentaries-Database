[[commentary]]
quote='''
Did he, then, cover his sins or not? But who would deny it, when this very prophet has taught that iniquities are remitted, that sins are covered and are not imputed by the Lord? He himself taught that his sin had been remitted to him, as it is written: I acknowledge my transgression, and my injustice I have not concealed. I said: I will declare my injustice against myself to the Lord, and you forgave the ungodliness of my heart. If he said: I will declare, and merited pardon before he declared it, how much more, when he made his declaration about himself, saying: I acknowledge my iniquity, was every sin remitted to him. And besides, the prophet Nathan too answered specifically about this: And the Lord has taken away your sin.

So he both merited the remission of his iniquity and covered and concealed his sins with charity, and covered them with good works. Nor was the sin imputed to him, because there was in him not the guile of malice but the fall of error; and then, because it was not a surge of wickedness but the shadow of a mystery. And yet he confessed his transgression, acknowledged his iniquity, saw the washing, and saw and believed. He loved much, so that by his exceeding charity he could cover any error whatever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 7"
