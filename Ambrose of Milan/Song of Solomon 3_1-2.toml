[[commentary]]
quote='''
But because we ought always to be watchful, always intent, and because the Word of God leaps forth like a roe or like a fawn of the harts, let the soul always keep watch and reach forward, the soul that seeks him again and desires to hold him. Therefore, as though he had slipped away from her, On my bed she says in the nights I sought him whom my soul loved. Let him who seeks well seek on the bed, let him seek in the nights. Let neither the day be a holiday nor the nights; let no time be free from the duty of piety, and, if she has not found him at first, let her persevere in seeking. And so she says: I will rise therefore and seek in the city, in the marketplace, in the streets. And perhaps she has not yet found him for this reason, that she sought in the marketplace, where there are lawsuits, and in the streets, where there are fairs of goods for sale; for Christ is not bought with any money.

We can also understand it thus: she seeks Christ on the bed who seeks him with tranquillity, with peace; she seeks him in the nights, because he spoke in parables — he made, you see, darkness his hiding place, and night to night shows knowledge —, and then because the things we say in our heart ought also to prick us with compunction in our beds. But not even so did she find him, and so she says: I will rise, that is, I will raise up and lift my attention, so as to seek tirelessly, to seek anxiously; I will enter into the city. There is also a soul which says: I am a fortified city, I am a besieged city. There is a city fortified through Christ; there is that city, Jerusalem in heaven, in which interpreters of the divine Law and men skilled in its teaching abound: through them the Word of God is sought. I will seek she says in the marketplace of that city, in that marketplace where those learned in the law treat of rights, where the oil is sold which the virgins of the Gospel buy, so that their torches may always shine and the smoke of iniquity may not put them out. I will seek she says in the streets, in which the waters overflow that burst forth from those fountains from which Solomon says we must drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"
