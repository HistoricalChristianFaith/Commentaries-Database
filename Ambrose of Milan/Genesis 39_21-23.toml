[[commentary]]
quote='''
But what wonder if Christ visits those placed in prison, he who recalled that he himself was shut up in prison in his own, as you have it written: I was in prison, and you did not come to me? Where does divine mercy not penetrate? Joseph found such grace that he who had been shut up in prison himself rather kept the bars of the prison: the keeper of the keys gave up his office and committed all those shut in to his power. And so not only did Joseph not feel the prison, but he also relieved others of the hardship of the prison.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
