[[commentary]]
quote='''
The sinner borrows, he says, and will not repay, but the righteous man has mercy and gives. This too befits the person of Paul, because the righteous man has mercy and gives. See him dividing out the words of the Lord, see him lending out the Lord's silver at interest. He received one mina, he returned two; he received two, he returned four; he received five, he returned ten. He did not tie up in a napkin what he had received, but paid it out to the money-changers, and what he had paid out he received back with interest. Thus he both freed the one who received from the greatest sin, lest the Lord's money should perish with him, and he himself earned to be set over ten cities. What the ten cities are, recognize in the epistles which he wrote, although the apostles are not held to a prescribed number, to whom it was said: Go through the whole world and preach the Gospel to every creature. This man, then, from Jerusalem through the East and Illyricum and Italy, dispensed the Lord's money. And lest anyone should think that he was lending out his own, he testified that the money was the Lord's, saying: But to those who are joined in matrimony I give charge, not I but the Lord, that the wife depart not from her husband, and elsewhere: Do you seek a proof of Christ who speaks in me? Thus the king himself, in whom there is a figure of the Lord, said this: You ought to have committed my money to the money-changers. "My", he says, not "your". The righteous man, then, has mercy and gives. How he gives, hear him say: I teach throughout all the churches. But the sinner borrows and does not repay. See the rich man borrowing and not returning, the poor man receiving and at once repaying, so as not to be in debt any longer. These are the moral things.

See now the mystical poor man, that is, the simple man who fears the name of God, hearing the word about chastity and repaying, hearing about mercy and repaying, hearing about gentleness and not being angry; but that rich man, arrogant and proud, hearing indeed, but casting the words of God behind him, hearing about the condemnation of luxury and indulging in luxury the more. Thus the Church repays what she has received; the synagogue does not repay. Recognize that the Church repays: They were yours, he says, and you gave them to me, and they have kept your word, and elsewhere: For the Father himself loves you, because you love me. The Church, then, has returned the money of charity which she received from the Lord, but the synagogue has not returned it. And therefore it is said of the Jews: If I had not come and spoken to them, they would not have sin; but now they have no excuse for their sin, because they certainly heard and did not believe. It has been proved, then, that the sinners borrowed and did not repay. The sinner, therefore, is always in need, but the righteous man, whose conscience is rich, abounds and gives. Therefore the Jews were in need in their riches — the rich were in need and went hungry —, but the Christians did not fail in the riches of their simplicity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
There is also the mystical righteous man who has mercy and gives, who gave us all the words which he received from the Father, and remitted to us the debts of our sins, and paid his blood for our debts, so that we should not be under another's usury, but the good creditor might hold us in his own debt. There is also that sinner who gathered what he did not bring forth and borrowed what he did not hold, and will not restore what he received. Hear that the devil borrowed: To you, he says, I will give all this power and their glory, because they have been delivered to me, and to whom I will I give them, if you will fall down and worship me. Most wicked one, you received it for temptation, not for death, that is: you received it so that the servants of God might be tested, not that they might be destroyed; you received it so that God might be worshipped, not that he might be denied. You received the things of this world; why do you snatch away the things that are eternal? You received the things that are the world's; why do you wish to take away the things that are Christ's? Give those things to whom you will, we do not grudge them; why are the things that we desire grudged us by you? Do you wish to be worshipped, you who, more wicked than all, are unworthy even of slavery itself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
