[[commentary]]
quote='''
Rightly, then, it is said in the person of that people: You have made us a reproach to our neighbours, a mockery and a derision to those who are round about us. Who these neighbours are, and how they appear to have belonged to the neighbourhood of the Israelite people, is not easy to discern. If a spiritual neighbourhood is sought, some light of knowledge is lacking for searching out the mystery of Christ, especially since we have learned in that very book of Solomon which is entitled Ecclesiastes that the more wisdom is sought, the deeper it is judged to be. For thus it is written: I said: I will seek wisdom, and it went far from me, much farther than it was, and in its depth who shall find its height? Hence diffidence rises up in me at searching the mysteries of the divinely breathing Scripture and examining its words, which he could worthily do who spoke wisdom among the perfect. I see the perfect, and not undeservedly would I call you perfect, since I see that you have your senses trained for the discernment of good and evil; but even he, who knew how to take more solid food, sought aid, so that the word of the Lord might run in him. Nor could this man either claim this without prayer, that his praise should become pleasing to God; for the assertion is not of one who claims, but of one who prays.

Yet, so that we may not seem to have shrunk back entirely, let us consider who were the neighbours of the tribes of the Jews. For, to review old matters, the Philistines were held to be neighbours of the tribe of Judah; on another side the same people bordered on the tribe of Reuben. The Ammonites too were in the desert, and those who were in the territories of Tyre and Sidon were joined to Galilee, that is, to the tribe of Zebulun and the tribe of Naphtali, which were in Galilee, as Isaiah said: The land of Zebulun and the land of Naphtali, the way of the sea beyond the Jordan. From this one can gather what the particular character of each of the several tribes was, that they were joined to certain particular neighbours, so that the knowledge of the heavenly sacraments might gradually be poured into the nations as well. This can surely be understood of that Canaanite woman who went out from her territories to meet the Lord Jesus as he passed by and, setting aside her idols, to adore the true author of salvation; to her our Lord Jesus Christ gave testimony that her faith was great. The grace of the Gospel and the light of his august presence were indeed already shining forth; but yet, because she went out of her own accord and begged for mercy and confessed the Lord with a devout voice and, though treated as it were with disdain, persevered in crying out her petition, this woman received no ordinary prerogative, she who was the first to go out from the peoples of the Gentiles and merited by persevering supplication to carry off so great a testimony from the Lord.

In this passage indeed I have learned that certain people have, as it were, been in doubt as to what it means that he says: I was not sent except to the sheep that have perished of the house of Israel, as though the Lord, who came so that all might be redeemed, seemed to have sought the nobility of a chosen race for saving souls. But he deigned to show his purpose: that he by no means wished to reject those whom he had first chosen, and that, though they were often straying and wandering, he yet sought to call them back with a kind of fatherly affection. But when they themselves forsook their own Author, he, knowing that he was the God of the mountains, not of the valleys, and that the kingdom of heaven is plundered not by those who disdain it but by those who use force, turned little by little to the Gentiles, so that both the affection of the nations might be the more approved and the obstinacy of those others deservedly condemned.

Then what does he mean in saying: It is not lawful to take the children's bread and throw it to the whelps? Surely he called the Israelites, that is, the people of the Jews, children, and the people of the nations whelps. What then? Is it for the rich or the more noble to receive the heavenly sacraments, and not for those who press on more with devout fervour of mind toward the knowledge of the heavenly mystery? And if some Israelite is slack and negligent or obstinate, casting the words of God behind him, but a Canaanite wishes unhesitatingly to bend his mind to acquiring the sacraments, is he who is indifferent to be preferred rather than he who offers zeal? Surely not. And therefore we must attend carefully to what he expressed, who, when he had said: It is not lawful to take the children's bread and throw it to the whelps, and the Canaanite woman answered: For even the whelps of dogs eat of the crumbs which fall from their masters' table, praised her zeal and her humility, since she did not claim for herself the depth of wisdom from the start, although she had already gone out from the territories of Tyre and Sidon, but believed that certain crumbs of the saving word, falling from her masters' table, were to be gathered up. For he who diligently and minutely searches out the words of Scripture is wont to reach the height of the mysteries. Hence it is said to her too: Great is your faith. Be it done to you as you will, that is: may the door of the word be opened to you and the saving mystery of eternal life shine forth.

Let him, then, who is a neighbour go out and desire to see Christ and cry out in prayer, as this Canaanite woman went out from her territories and saw Christ and cried out with unceasing voice, so as to carry off his mercy. So, while the Canaanites believe, let the Jew be in reproach, because he himself did not believe, and let him grieve that he is mocked, and groan that he is derided by those who are round about.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And this prophecy seems to be about the nations who were to believe, especially as what follows shows it, for he says: You have made us a likeness to the nations, a shaking of the head among the peoples, because we have learned on the authority of the Apostle that through the fault of the Jews salvation came to the Gentiles, and that what was done among them in figure has served for our knowledge. And truly they were made a reproach to the Gentiles, because the Gentiles preferred the reproach of the Lord's cross to all the riches of the world. But he who thought that cross a reproach and fled from it as a reproach has truly remained in long-lasting reproach. Yet since those who could say: For we have not dealt unjustly in the covenant of the Lord, and whose heart did not turn back from the Lord, seem not to be Israelites according to the flesh, see whether they do not recall that they were a mockery and a derision to those set round about them, of whom the Lord says: Many calves have surrounded me; for the persecutors surrounded him when, according to the counsel of his own will, he underwent the Passion. Hence elsewhere too he says: Surrounding, they surrounded me, and in the name of the Lord I have taken vengeance on them. Therefore it is better to hold to the straight way, on which the wicked cannot walk; they quickly fall, because they do not walk in uprightness. Hence those men too, when they wished to seize the Lord Jesus, fell as soon as he looked at them. Because of these, then, who are wont to walk round about, the Lord has set an angel to drive back the enemies who lie in wait behind. The angel of the Lord, then, stretches himself round about those who fear him, and protects and guards them; for round about the ungodly walk, as it is written. See, then, the difference. The ungodly walk round about, but the angel stretches himself round about those who do not walk round about, and he stretches himself out for this reason, to rescue the righteous from the snares of their persecutors. Those, then, who speak these things seem to be righteous spiritual Israelites, in that they were subject to the temptations of the world and were a reproach to their neighbours, that is, to those who did not dwell in Jerusalem their homeland, and were a mockery also to the spiritual wickednesses and powers against which the righteous are wont to have their wrestling. Indeed let history teach you that the Jews carried off to Babylon, although they seemed to be subjected because of their sins, were yet held to be much better than the Gentiles. For those round about them who insulted them were worse, since they themselves were bowed down by the weight of grave sins.

The first understanding, then, is to be applied to our captive fathers, whom the Assyrians insulted, mocking them in Babylon, and over whom that most wicked king Nebuchadnezzar also ruled. The second understanding is to be referred to higher things: that the most savage king is the devil. He is the Assyrian Nebuchadnezzar, who is wont to lie in wait for the good, so as to draw them into sin through the enticement of the flesh. Mark this king, then, in that place where the Apostle says: I see a law of my flesh fighting against the law of my mind and leading me captive in the law of sin, that is, in that law of carnal enticement. The adversary is a lion who presses hard on the guilty and wears out the righteous. Hence Aquila put it beautifully: You have made us a scorn and a pageant to those who are round about us. For so they were reckoned contemptible who were made a theatre to this world, both to angels and to men, because, even if they do not sin against the covenant of God nor are turned away from the Lord by the enticements of the flesh, yet they seem to be carried about as in a kind of pageant and despised, since sinners are wont to insult the humility of the righteous, so as to count the cross of the Lord and Savior and the humility of the righteous a reproach. Indeed the Apostle, set as it were in a kind of pageant of the theatre, says: I am well pleased in injuries, in necessities, in persecutions, in distresses. In these he is well pleased who counts all things of the world as loss, so as to gain Christ, seeking him alone through life and death, he for whom to live is Christ and to die is gain, so that he may be found in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
