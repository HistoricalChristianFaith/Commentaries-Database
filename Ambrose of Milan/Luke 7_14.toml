[[commentary]]
quote='''
This dead man was borne on the bier by the four material elements to the grave, but there was a hope of his rising again because he was borne on wood, which though before it did not benefit us, yet after Christ had touched it, began to profit unto life, that it might be a sign that salvation was to be extended to the people by the wood of the cross. For we lie lifeless on the bier when either the fire of immoderate desire bursts forth, or the cold moisture breaks out, and through the sluggish state of our earthly body the vigour of our minds waxes dull.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
This dead man, indeed, was being carried to the tomb in a coffin by the four material elements, but he had the hope of rising again, because he was carried on wood. And although this had not profited us before, yet after Jesus touched it, it began to avail for life, so that it was a sign that salvation would be poured back upon the people through the gibbet of the cross. So, when the word of God was heard, those bitter bearers of the funeral stood still, who were pressing on the human body with the deadly flux of material nature. For what else is it but that we lie lifeless as on a kind of bier, that is, the instrument of the last funeral, when either the fire of immoderate desire boils up, or cold humour overflows, or the vigour of souls is dulled by some sluggish habit of body, or our spirit, empty of pure light, nourishes the mind with a clotted stain? These are the bearers of our funeral.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
