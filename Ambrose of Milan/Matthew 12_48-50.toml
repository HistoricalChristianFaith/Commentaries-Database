[[commentary]]
quote='''
There are many fathers through the Gospel, and many mothers, who bring forth Christ. Who then will show me the parents of Christ? He himself has shown them, saying: Who is my mother, or who are my brothers? Whoever does the will of my Father who is in heaven, he is my brother and sister and mother. Do the will of the Father, that you may be the mother of Christ. Many have conceived Christ and not brought him forth. So she who brings forth righteousness brings forth Christ, she who brings forth wisdom brings forth Christ, she who is in labour with the Word is in labour with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
