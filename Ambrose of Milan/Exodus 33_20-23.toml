[[commentary]]
quote='''
You hear of certain members of God; recognize the powers: his hand is the fullness of goodness, his face is the enlightenment of the mind. And therefore let us always hope from him, direct our prayers and all our endeavours to him, and not despair even if we cannot see him bodily. For neither did Moses despair, to whom it was said: You cannot see my face; for man shall not see my face and live; and he added: Behold, there is a place beside me; you shall stand on the rock; and when my glory passes by, I will put you in a cleft of the rock and cover you with my hand until I pass by; and I will take away my hand, and you shall see my back parts, but my face you shall not be able to see. The face of God, then, is not seen by man, yet there is a place in which God shows himself to man by faith. This place is beside God, and therefore, if we stand on the rock, that is, in the consciousness of this flesh and the firmness of faith, even if we cannot see his fullness, yet as far as we can we shall drink in, as it were, the remnants of his light. For Moses did not see the whole fullness of his divinity which dwells in Christ bodily, but he saw the back parts of Christ; he saw his brightness as a man, he saw the glory of his Passion, through which he unlocked for us the heavenly kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
