[[commentary]]
quote='''
This love, therefore, she rouses and rouses again, until she receives his voice and summons his presence, because when sought he not only comes, but comes leaping, leaping upon the mountains, leaping over the hills. He leaps upon souls of greater grace, he leaps over those of lesser. Or thus: how does he come leaping? With a kind of leap he came into this world. He was with the Father; he came into the Virgin, and from the Virgin he leapt across into the manger. He was in the manger, and he shone from heaven; he went down into the Jordan, went up on the cross, went down into the tomb, rose from the tomb and sat at the right hand of the Father. Thence, like a fawn of the harts, which longs for the fountains of waters, he came down to Paul and shone round about him, and sprang upon the holy Church, which is Bethel, which is called the house of God; for the calling of Paul is the strength of the Church.

So he comes, and first he is behind the wall, so as to dissolve the enmities of soul and body by taking away the wall, which seemed to bring a hindrance to concord. Then he looks out through the windows. What the windows are, hear the prophet saying: the windows from heaven have been opened. So he means the prophets, through whom the Lord looked upon the human race before he himself came down to earth.

And even today, if any soul seeks him much, she will gain much mercy, since to him who seeks much, very much is owed. If, then, any soul seeks him more zealously, she hears his voice from afar, and although she inquires of others, she hears his voice before those very ones of whom she inquires. She sees him coming to her leaping, that is, hastening and running and leaping over those who with a weak heart cannot grasp his power. Then, by reading the prophets and holding fast to their words, she sees him looking out through the enigmas of the prophets; she sees him looking out, but as through a window, not yet as present. She sees him standing out above the nets. What is this, unless perhaps that those nets are for us, not for him? Nets, because that soul is still among sensible and worldly things, which are accustomed to capture the mind of man and wrap it in a kind of fold of their own. To her, then, while she is still placed among worldly things but yet seeks him, he shows himself through the nets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
