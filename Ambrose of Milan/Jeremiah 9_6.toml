[[commentary]]
quote='''
Among serpents also the times for mating and for giving birth are various; money at interest, from the day on which the contract has been entered into, creeps along with increasing usury. It knows nothing of giving birth because it itself rather transfers the pains to others. There were pains as of a woman in labor. Whence also the Greeks have called interest offspring (τόκους), because it seems to arouse the pains of child-birth in the mind of the debtor. The first of the month arrives, the capital brings forth its hundredth; each month comes, interest is born, evil offspring of evil parents. This is the generation of vipers. The hundredth has developed; it is demanded, it is not paid; it is applied to the principal. The curse of the prophet is brought to pass: Guile within guile; usury is a worse offspring of a wicked seed. And therefore it begins to be no longer interest, but principal, that is to say, not a hundredth of interest, but interest on a hundredth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 12"
