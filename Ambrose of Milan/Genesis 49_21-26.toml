[[commentary]]
quote='''
But let us hear also the other things which the holy patriarch Jacob sounded forth on that wonderful instrument of his mind: Naphtali is a vine spread out, putting forth beauty in its shoot. My son Joseph is increased, my son is increased, my son assailed with jealousy, my youngest son, return to me and below: He has prevailed over the blessings of the abiding mountains and the desires of the everlasting hills. What is sweeter than a blessing, what more pleasing than eternity? The words themselves are song, and in the words are the great rewards of prayers, the summits of merits.

What is sweeter than holy Joseph, who freed us from reproach by the mystery of the Lord's cross? For just as Christ was made a curse to loose the curse of the Law, and was made sin to take away the sin of the world, so he was made a reproach to take away the reproach of the Gentiles; but that reproach of Christ was esteemed more precious than the treasures of Egypt. And therefore Moses left the court of King Pharaoh and chose the reproach of faith, and for that reproach the seas divided before him. He, then, is Naphtali, a vine spread out through the whole world, to pour into all peoples the abundance of the spiritual cup; he is the one increased, having the name above every name, who, because he offered himself to death for all, therefore hears from the Father: return to me. Jacob spoke, and God was heard. He blessed, and the Lord sounded forth, saying to the Son: return to me, that is, return after the passion. Return to your seat, return with the trophy, return to me, so that the dead may follow you as you rise and may rise by your power and likewise by your example, so that you may become the firstborn from the dead, so that you may sit at the right hand of the Father. Hence the Son also said: From now on you will see the Son of Man sitting at the right hand of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
