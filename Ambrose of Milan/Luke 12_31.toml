[[commentary]]
quote='''
But He goes on to show, that neither at the present time, nor hereafter, will grace be lacking to the faithful, if only they who desire heavenly things seek not earthly; for it is unworthy for men to care for meats, who fight for a kingdom. The king knoweth wherewithal he shall support and clothe his own family. Therefore it follows, But seek ye first the kingdom of God, and all these things shall be added unto you.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In this place he seems also to touch on that question which the Apostle too did not pass over, which the nations of this world ask, how the dead rise and with what body they come.

For when he says: seek the kingdom of God and all these things will be added to you, he shows that grace will be lacking to the faithful neither in the present nor in the time to come, provided that those who desire divine things do not seek earthly ones. For it is unbecoming that men who serve as soldiers for a kingdom should be anxious about food. The king knows how to feed, nourish, clothe his household, and therefore he said: cast your thought upon God and he himself will nourish you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
