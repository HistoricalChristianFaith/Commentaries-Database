[[commentary]]
quote='''
Finally, he who betrayed the majesty could not bear the patience of the Lord, so much so that the guilt of so great a crime could not be washed away from him. And so he went away and gave back the money, that is, he condemned his avarice, the author of so great an ungodliness, and returned to the synagogue the price of unbelief. The traitor, who could find no place for penitence, is not excused, but the sacrilege of the Jews is made more bitter, for they are convicted even by the words of the traitor. He acknowledged his crime, saying that he had betrayed righteous blood; they both took back the price of the crime and persecuted the prince of righteousness with keener zeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
