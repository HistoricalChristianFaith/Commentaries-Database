[[commentary]]
quote='''
Indeed, concerning the man who came into this world and endured the vanity and the darkness of this world through a long old age, Ecclesiastes declared that a miscarriage is better than he. For this one has rest rather than that one, because he did not experience the changes of the world, in which, even if someone has lived a thousand years, he could not see what is good. So to have escaped these things is more a grace than to have undergone them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
