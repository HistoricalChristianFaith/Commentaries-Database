[[commentary]]
quote='''
And he said to them: whom do you say that I am? Simon Peter answered: the Christ of God. Not even the crowd's opinion is idle, because some believed that Elijah, whom they thought was to come, others that John, whom they knew had been beheaded, or one of the earlier prophets, had risen. But to inquire into this is beyond us: it belongs to another's judgment, to another's wisdom. For if it is enough for Paul the Apostle to know nothing but Christ Jesus and him crucified, what more ought I to desire to know than Christ? For in this one name is the expression both of the divinity and of the Incarnation, and faith in the Passion. And therefore, although the other apostles know, yet Peter answers before the rest: you are the Christ, the Son of the living God. And so he embraced all things, who expressed both the nature and the name, in which is the sum of powers. Do we even raise questions about the generation of God, when Paul judged that he knew nothing but Christ Jesus and him crucified, and Peter thought that nothing else was to be confessed but the Son of God? We, with the regard of human weakness, pry into both when and how he was born and how great he is. Paul knew that in these things there was more of a stumbling block of questioning than of progress in edification, and therefore he judged that he knew nothing but Christ Jesus. Peter knew that in the Son of God are all things; for all things the Father has given to the Son. If he gave all things, he poured into him the eternity which he has, and majesty. But whither am I slipping further? The end of my faith is Christ, the end of my faith is the Son of God. It is not permitted me to know the sequence of the generation; yet it is not permitted me to be ignorant of faith in the generation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
