[[commentary]]
quote='''
But see the economy: the faith of the master is approved, and the health of the servant is strengthened. So the merit of the master can avail even for his servants, not only by the merit of faith but also by zeal for discipline. Behold also another economy of the Lord's humility. What he does not promise, he performs; for although he had not yet commanded the healing, yet the servants who had been sent found the little slave healthy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
