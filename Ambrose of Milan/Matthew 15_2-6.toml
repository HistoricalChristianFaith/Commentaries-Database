[[commentary]]
quote='''
For the Jews, while they follow the tradition of men, neglect that of God. The disciples, preferring the tradition of God, neglected that of men, so as not to wash their hands when they ate bread, since he who has been washed all over has no need to wash his hands. Jesus had washed them; they did not seek another washing; for by one baptism Christ did away with all baptisms. So he whom the Church has washed has no need to wash again. The disciples, then, were attentive to the mystery, seeking the cleanness not of their body but of their soul. This the Jews reproached, but they are shrewdly refuted by the Lord, because they observe empty things and despise those that would profit. And therefore he says to them: Why do you say to father or mother, whom the law commands to be honored: Whatever gift is from me will profit you? That is: when a needy father or mother asks the son for something for their expenses, the Jew, because, fearing the law, he seeks an excuse for not giving, is wont to say: A gift, whatever you would gain from me, so that the devout father shrinks from accepting money dedicated to God. But this is the tradition of men who weave excuses for their own avarice; the tradition of God, however, is that you feed your parents first. For if, according to the divine oracle, an insult to a parent is atoned for by death, how much more hunger, which is graver than death!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
