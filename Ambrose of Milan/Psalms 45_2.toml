
[[commentary]]
quote='''
Beautiful in form beyond the sons of men (Ps. 44 (45):3). For he was man according to the flesh, but beyond man according to his divine working. Indeed, when he touched the leper, he seemed a man; but he was beyond man when he cleansed him. And when he wept for Lazarus dead, he wept as a man; but he was above man when he bids the dead man come out with his feet bound. He seemed a man when he hung on the cross; but he was above man when, opening the tombs, he raised the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
