[[commentary]]
quote='''
Having heard, then, what God had spoken in him, and having learned through the Holy Spirit that the Son of God would not only come to earth but would also descend to the dead to raise the dead to life — which was indeed done then as a testimony for those present and an example for those to come — he turned to the Lord and said: Would that you kept me in the underworld, and hid me until your wrath ceases, and set me a time in which you would make remembrance of me. For if a man has died, he will live, completing the days of his life. I will wait until I come to be again. Then you will call me, and I will hearken to you; but do not despise the works of your hands. You have numbered my devices, and nothing of my sins will pass you by. And you have sealed up my iniquities in a bag and have marked whatever I have passed over unknowingly. How sweet a passage, which strengthens us concerning the resurrection, and how well it seems to agree with the Lord's saying that is read in the Gospel, where he says: Then they will begin to say to the mountains: Fall upon us, and to the hills: Cover us. For at the consummation of the world there will be the wrath of the Lord. Rightly, then, does the holy man prefer to rise again into the judgment rather than into the time of the divine wrath, which is terrible even to the innocent.

At the same time he is understood also to prophesy this, by saying: You will set me a time in which you will make remembrance of me: that he was to be raised up at the Lord's passion, as is shown at the end of this book. And yet he does not cease to lament, and the more he understands that resurrection is set before him, the more he longs to flee this life, seeing himself delivered into the hands of his adversaries, cast forth into the power of the ungodly, he whose very friends had turned into enemies, who, when they ought to have consoled him, heaped ruin upon ruin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 8"
