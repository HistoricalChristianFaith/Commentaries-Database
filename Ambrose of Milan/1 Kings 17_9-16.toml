[[commentary]]
quote='''
Meet was it also that a prophet, for the condemnation of a sacrilegious king, was sent to a widow in Sarephta of Sidonia, who, since she preferred piety to food, merited that she alone should not feel the distress of the general drought. And so the urn of barley meal did not fail when the waters of the torrent failed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 2"
