[[commentary]]
quote='''
As we have heard, so also have we seen in the city of the Lord of powers, in the city of our God; God has founded it for ever. We have heard outside the city, we have seen in the city, for which God is the eternal light, where the day shines without the sun of the world, the moon is not sought; its foundation is not temporal but eternal.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
