[[commentary]]
quote='''
For the wise man, when he seeks that divine thing, releases his soul from the body and sends away its close company, when he pursues that knowledge of the truth which he desires to be shown to him as it were naked and open, and therefore he seeks to strip himself of the nets, as it were, and the mists of this body. For we cannot grasp that supernal truth with these hands or eyes and ears, since the things that are seen are temporal, but the things that are not seen are eternal. Then, we are often deceived by sight and see most things otherwise than they are; we are deceived also by hearing; and therefore let us contemplate not the things that are seen but those that are not seen, if we do not wish to be deceived. When, then, is our soul not deceived, when does it attain the throne of truth, except when it separates itself from this body and is not deceived and mocked by it? For it is mocked by the sight of the eyes, it is mocked by the hearing of the ears; and therefore let it leave the body and forsake it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
