[[commentary]]
quote='''
There is also a more excellent man, of whom it is said: but the spiritual man judges all things, and he himself is judged by no one. This man is more excellent than the rest. Hence David too says: what is man, that you are mindful of him, or the son of man, except that you visit him? Man has been made like to vanity. It is not that man according to the image of God who is a man of vanity; but he who lost it and fell into sin and slipped down into these material things, he himself is the man of vanity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 2"
