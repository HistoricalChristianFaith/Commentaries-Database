[[commentary]]
quote='''
But the things which viewed corporeally are unseemly, when viewed in regard to holy religion become venerable, so that they who blame such things will involve their own souls in the net of blame. Thus Michal reproves David for his dancing and says to him, How glorious was the king of Israel to day, who uncovered himself to day in the eyes of his handmaids! And David answered her, It was before the Lord, which chose me before thy father, and before all his house to appoint me ruler over the people of the Lord, over Israel: therefore will I play before the Lord, and I will be yet more vile thus, and will be base in mine own sight, and of the maid-servants which thou hast spoken of, of them shall I be had in honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252051-60.html'
source_title="Letter 58.6"

[[commentary]]
quote='''
The mightiest of kings danced before the ark of the Lord, and when he was rebuked by his own wife because he had been stripped before the face of the maidens, he answered: Before the Lord I will be stripped yet more, and I will be a trifler before your eyes, that the Lord, he says, may be honoured, who took me into the kingdom in place of your father, teaching that no regard is to be had for royal power where homage is paid to religion. For it is honourable to act for religion's sake, even if that is unbecoming to power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
