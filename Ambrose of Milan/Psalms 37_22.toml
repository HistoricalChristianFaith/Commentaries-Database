[[commentary]]
quote='''
The righteous man, then, is good, and therefore Scripture added: For those who bless him shall possess the land, but those who curse him shall utterly perish. How does the righteous man possess the land, or what land, when Scripture says: Will you alone dwell upon the earth?, and elsewhere: Woe to those who dwell upon the earth, which belongs to rebuke and to cursing? Of what land, then, is the possession blessed? Not of this one, which is hidden in darkness and filled with bitternesses, but of that one which flows with honey and milk, that is, which has the grace of sweetness and the brightness of eternal light. Take the sweetness of good honey, nay, beyond honey: Pain and sorrow and groaning have fled away, because the grace of sweetness will shut out the bitterness of human frailty. And elsewhere: And he will wipe away every tear from their eyes, and death shall be no more, nor mourning. Take also the brightness of milk: And they shall not need a lamp or the light of the sun; for the Lord himself will give light upon them, and they shall reign for ages of ages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
