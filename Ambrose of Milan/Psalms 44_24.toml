[[commentary]]
quote='''
There follows: Why do you turn away your face? We think that God turns his face away from us when we are set in some afflictions, so that darkness is poured over our affection, by which we are hindered and cannot drink in the brightness of truth with our eyes. For if God attends to our understanding and deigns to visit our mind, we are sure that nothing can draw a mist over us. For if the face of man shines more than the other parts of the limbs, and whomever we look upon we either come to know if he is unknown or recognize if he is known, he whom our gaze does not suffer to lie hidden, how much more does the face of God enlighten him upon whom it looks! On this, as with the rest of his sayings, so this too is splendid, from the holy Apostle, who is truly the interpreter of Christ, so that he might pour him into our minds with apter sense and speech. Hence he says: For God, who said that light should shine out of darkness, has shone in our hearts to the enlightenment of the knowledge of the brightness of the Lord in the face of Christ Jesus. We have heard, then, where Christ shines in us. For he is the eternal brightness of souls, whom the Father sent to earth for this purpose, that, enlightened in his face, we who before were held in earthly darkness might be able to behold eternal and heavenly things. Why should I speak of Christ, when even the apostle Peter said to that man lame from his mother's womb: Look upon us? He looked upon Peter and was enlightened by the grace of faith; for he would not have received the remedy of health had he not believed faithfully. Hence, when there was such glory in the apostles, Zacchaeus, hearing that the Lord Jesus was passing by, climbed into a tree, because, being small and little, he could not see him in the crowd. He saw Christ and found light; he saw him, and he who before had seized others' goods gave away his own. Rightly, then, these men say: Why do you turn away your face?

Or perhaps it is said for this reason, that the coming of Christ was delayed for those who longed for it; for he is the face of the Father, he who is the image and glory of God. Certainly, if we do not take this of the sacrament of his incarnation, the saints rightly make use of that saying too: Why do you turn away your face?, that is: even if you turn away your face from us, O Lord, yet the light of your countenance, O Lord, is sealed upon us. We hold it in our hearts and it shines in our inmost affection; for no one can subsist if you turn away your face. For all things wait upon you, that you may give them food in due season; when you give it to them, they will gather it; when you open your hand, all things will be filled with goodness. But when you turn away your face, they will be troubled. You will take away their spirit, and they will fail and return to their dust. You will send forth your spirit, and they will be created, and you will renew the face of the earth. Do you recognize what the food is which God supplies to men? It is the food on which his only-begotten Son, our Lord, feasts according to the will of the Father, as he himself says: My food is to do the will of my Father who is in heaven. This food is saving for us, and all the things of God are saving.

You hear of certain members of God; recognize the powers: his hand is the fullness of goodness, his face is the enlightenment of the mind. And therefore let us always hope from him, direct our prayers and all our endeavours to him, and not despair even if we cannot see him bodily. For neither did Moses despair, to whom it was said: You cannot see my face; for man shall not see my face and live; and he added: Behold, there is a place beside me; you shall stand on the rock; and when my glory passes by, I will put you in a cleft of the rock and cover you with my hand until I pass by; and I will take away my hand, and you shall see my back parts, but my face you shall not be able to see. The face of God, then, is not seen by man, yet there is a place in which God shows himself to man by faith. This place is beside God, and therefore, if we stand on the rock, that is, in the consciousness of this flesh and the firmness of faith, even if we cannot see his fullness, yet as far as we can we shall drink in, as it were, the remnants of his light. For Moses did not see the whole fullness of his divinity which dwells in Christ bodily, but he saw the back parts of Christ; he saw his brightness as a man, he saw the glory of his Passion, through which he unlocked for us the heavenly kingdom.

Aquila, however, put: Why do you hide your face?, and so did the others too; which seems to agree with the words of Moses, who says: Show yourself to me, as if he said: do not hide your face from me, but rather show it to one who longs to see.

And he added: Do you forget, he says, our want and our tribulation? Of what want does the holy prophet say that it has come into God's forgetfulness, or what is this want which he complains has slipped from our God and Lord? No want is at ease, unless perhaps that which is wont to have God as protector and rewarder. For if there is a want to which the kingdom of heaven lies open, these men rightly thought that their want had slipped from the divine mind, since they lamented that their soul was humbled into the dust and said that their belly cleaved to the earth; and those who cleave to the earth seem to be deprived of the divine blessing. Hear, then, what this want is: for blessed are the poor in spirit, for theirs is the kingdom of heaven. If, then, that poverty is blessed to which heaven lies open, let us neglect these earthly riches, let us shun bodily abundance. Let us follow the acts of the apostles, before whose feet each one laid what money he had from the price of his fields, to be distributed to the poor. These holy men, then, had begun to practise this evangelical want long before, and therefore they said: Do you forget our want? This is like that saying of the apostles: Behold, we have left all things and followed you. Good, then, is the poverty which proceeds from devotion and is undertaken by the exercise of the virtues.

And not only their want, but also their tribulation, they lament, has come into God's forgetfulness. Good too are the tribulations which are proper to the righteous, who endure them not for their own deserts but for devotion; in them the righteous man is not crushed but enlarged, as the holy prophet declares, saying: In tribulation you have enlarged me, and the Lord Jesus himself says: In tribulation I called upon the Lord, and he heard me into a broad place. He enlarged the holy apostle Paul when he took from him the light of his eyes; for so he confessed Christ, whom he had denied before. Therefore he merited to be a vessel of election. Indeed, so that you may know that the Lord Jesus enlarged Paul, hear the Apostle himself saying: Our mouth is open to you, O Corinthians, our heart is enlarged. Open, then, your mouth, confess Christ, because he is fullness; where there is fullness, there is breadth also. And like a good master, who wished to have disciples equal to himself, he exhorted us too to be enlarged, saying: Be enlarged, you also.

And when God somewhere enlarges in tribulation, then there will be a breadth of heart like the innumerable sand of the sea. What this breadth is, hear from holy Solomon, as he asks to receive wisdom from God. He asked not for riches, not for nobility, not for power, but for wisdom, and in it he found all things, even those which he did not ask for. Hence Scripture says that the breadth of his heart was like the innumerable sand of the sea. Whence you may obtain this breadth he says, knowing it from himself: In the breadth of your heart write it down. And therefore let him who has wisdom not keep it hidden, nor proclaim it only for a moment, but let him sing it at the going out, and everywhere proclaim with authority what he perceives.

Symmachus, however, put affliction in place of tribulation. But whether it be affliction or tribulation, we need to remain in the Lord and not withdraw from him, since with the Lord as our guardian and standing by us we can bravely endure every contest. But if we neglect the Lord and make ourselves far from the Lord, we make our adversary stronger.
'''
