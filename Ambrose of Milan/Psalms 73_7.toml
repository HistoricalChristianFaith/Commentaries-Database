[[commentary]]
quote='''
The Jews clothed themselves with cursing, of whom it is written: Their iniquity has come forth as if from fat; they have passed into the disposition of the heart. For adipale (fatty) is so called from adeps (fat), that is, rich. For just as the soul that is fed on good things and filled with virtues is filled as if with fat and fatness, as it is written, so iniquity, which proceeds as if from fat, is signified as not thin and slight, but full of vices. Indeed, they did not fall into error by some chance slip, but passed into sacrilege by counsel and disposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 4"
