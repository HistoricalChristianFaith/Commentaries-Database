[[commentary]]
quote='''
In short, the psalmist says that he said: Then in vain have I justified my heart and washed my hands among the innocent, that is: I see them abounding, I see all advantages going favourably for them, but myself crushed and harried by very many temptations. In vain, then, did I give myself to innocence and apply myself to the pursuit of a sober way of life. And he says finely: I have washed my hands among the innocent, so that he might seem not to claim for himself the height of innocence, but to offer diligent pursuit of it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 6"
