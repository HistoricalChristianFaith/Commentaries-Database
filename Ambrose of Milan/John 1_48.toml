[[commentary]]
quote='''
Would that Jesus would cast a glance on me still lying under that barren fig tree, and that my fig tree might also after three years bear fruit. But how can sinners have that kind of hope? If only that gospel dresser of the vineyard, perhaps already bidden to cut down my fig tree, would at least let it alone this year also, until he digs around it and fertilizes it so that he may by some chance lift the helpless out of the dust and lift the poor out of the mire. … The fig tree, that is, the tempting attraction of the pleasures of the world, still overshadows me, low in height, brittle for working, soft for use and barren of fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25201.html'
source_title="Concerning Virginity 1.1.3-4"

[[commentary]]
quote='''
So Nathanael was under the tree, that is, above the root, because he was righteous — for the root is holy — yet Nathanael was under the tree, because he was under the law; Zacchaeus was above the tree, because he was above the law; the one a hidden defender of the Lord, the other a public preacher; the one was still seeking Christ from the law, the other, now above the law, was leaving his own goods and following the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
