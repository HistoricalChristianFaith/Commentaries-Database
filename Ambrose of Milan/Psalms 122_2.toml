[[commentary]]
quote='''
These are the feet that David washes in spirit when he teaches you how to keep them unsoiled, saying, "Our feet have been standing in your courts, O Jerusalem." Certainly, here "feet" is to be understood not as of the body but as of the soul. For how could a person on earth have his physical feet in heaven? Since Jerusalem, as Paul tells you, is in heaven, he also shows you how to stand in heaven when he says, "But our abode is in heaven": 2 the "abode" of your behavior, the "abode" of your deeds, the "abode" of your faith.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:59"

[[commentary]]
quote='''
And so, when once you have washed your feet in the watering of the eternal fountain and cleansed them by the sacrament of the mystery, beware again the filth of bodily desire, lest your muddy acts be soiled with earthly defilements. These are the feet which David washed in the spirit, who teaches you how you may be unable to soil them, saying: Our feet were standing in your courts, Jerusalem (Ps. 121 (122):2). Here, certainly, understand not the feet of the body, but of the mind; for how would an earthly man have the feet of his body in heaven? Jerusalem, as Paul has taught you, is in heaven; and he too has taught you how you can stand in heaven, when he says: But our way of life is in heaven (Phil. 3:20). A way of life in conduct, a way of life in deeds, a way of life in faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
