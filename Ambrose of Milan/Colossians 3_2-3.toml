[[commentary]]
quote='''
The Apostle denies you earthly company, and teaches that you must fly away to heaven on spiritual wings, almost beyond the bounds of nature. Mind, he says, the things that are above, not those upon the earth (Col. 3:2). But because this was impossible for those shut up in this enclosure, as it were, of the body, and because the soul is said to fly back to higher things when bodies have died, being bound while we live by a certain law of our nature, therefore he added: For you are dead, and your life is hidden with Christ in God (ibid. 3). If it is hidden with Christ in God, let it not appear to the world; for Christ died to the world, he lives to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
