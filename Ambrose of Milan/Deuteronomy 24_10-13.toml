[[commentary]]
quote='''
Return therefore the pledges which you hold, since you have found a suitable surety. But still they murmur, maintaining that it is permitted to hold pledges, and they defend themselves by the Law, for they say: It is written in Deuteronomy: If anything is owed to thee by thy neighbor, thou shalt not go to his house to take away a pledge, but thou shalt stand without and the man who owes thee shall bring out his pledge to thee. But if that man be poor thou shalt not sleep in his pledge but thou shalt restore his pledge to him at the going down of the sun, and he shall sleep in his own raiment and bless thee and there shall be mercy for thee before the Lord thy God. And in another place, they say, it is written: Thou shalt not take the nether nor the upper millstone to pledge, for he pledges his life. And in another place: Thou shalt not receive the widow's raiment for a pledge. Whence they argue that certain pledges are forbidden—not all—that is, that of the poor man and the widow, the nether and also the upper millstone it is forbidden to take as pledge.

But since the Lord Himself, through Ezechiel the prophet, proclaims that he is just who has returned a pledge, unjust who has kept it, assuredly he urges that not some special one, but in general every pledge should be returned, since Job says: The writing which I held against anyone, received under oath, I read, putting on my crown, and if I did not tear it up I returned it receiving nothing from the debtor. Since the Lord teaches that nothing ought to be hoped from those to whom we have lent, which we should receive, how, according to law, do they think a pledge should be retained?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 17"

[[commentary]]
quote='''
We have become acquainted with lawful usury, let us know the pledge also which the Law commands should be returned before sunset. What this is, hear the apostle saying: God has given the pledge of the spirit in our hearts. Moreover it is called in threefold manner, pledge, and commitment and trust. They call that a pledge which is received for borrowed money, but a commitment and a trust what we have committed to someone for the purpose of custody. Wherefore the apostle says: I know whom I have believed and I am certain that he is able to keep that which I have committed to him against that day. He likewise showed what the trust was, saying: Keep the good thing committed to thy trust by the Holy Ghost who dwelleth in us. Is the Spirit the guardian of silver or gold given in trust, or is money kept by the Holy Ghost? Therefore a spiritual pledge is kept by the Spirit, lest the fowls of the air come and take it away from our hearts.

Let us seek therefore that Christ may keep in us this pledge which He Himself has given, and may preserve His trust and His commitment; for He has received nothing from us, but Himself has entrusted to us what was not ours. And therefore he suffers detriment to his honor who violates the trust of another. If we ought by no dishonesty to violate the commitment of a man, how much more does it behoove us to preserve in good faith the divine and spiritual trust, lest we undergo grave loss both of reputation and of profit.

This then is the pledge which the Law forbids to take and carry away by force. For thus the Scripture has: If anything is owed to thee by the neighbor, thou shalt not go into his house to take away a pledge, and the man who has what is owing to thee shall bring thee out the pledge. But if that man be poor thou shalt not sleep with his pledge, but thou shalt restore the pledge to him before the going down of the sun, and he shall sleep in his own raiment [and shall bless thee] and there will be mercy for thee.

But you will say to me: Behold the law forbade that the pledge be carried away, not that it be taken, and it commanded that it be returned to the poor man, not to everyone. But indeed concerning corporeal pledges Esdras has also taught us adequately, on the basis of which now, usurers, you cannot go against the declaration of your fathers. For when those who had lent money and had received the pledges of others, were being bidden to restore them, they said: We do restore and we require nothing of them. Virtuous fathers, who decreed that the pledges of the debtors be returned; likewise good usurers who replied that they were returning the pledges and were not requiring the money which they had given! Both the tenor of the command of your fathers and the declaration of the creditors binds you to these things.

There is however another pledge also which the spiritual law forbids to be carried away and, if it has been given, commands should be returned before the going down of the sun, a pledge which the man in debt returns and himself has delivered. For the debtor is everyone who hears the Word of the Kingdom and does not understand it. There cometh the wicked one and snatcheth away that which was sown in his heart. Do not therefore enter into his house that you may receive that pledge. For woe to him who shall scandalize one of these little ones. If by his own stupidity he loses his pledge, you will not have the blame. But if he is poor, return the pledge before the going down of the sun; for the pledge is his raiment. If he seems rich to himself, he is deceiving himself if he gives up his own pledge. But if he is a poor man, who does not have the riches of the spirit, return his garment to him before the going down of the sun.

If there were question of a corporeal pledge, certainly rather should there have been an obligation to return it by day, lest the shame of the naked body be exposed in the light of day; for darkness does not expose the naked man. But if this moved him, that the poor man would not have anything wherewith he could be covered while sleeping, certainly he would have said that either a blanket or a covering ought to be returned. But now in speaking of raiment he means rather the garment which we wear and with which we are clothed. Return therefore to the poor man his garment, that he may sleep in it at night.

Does he not seem to you to signify that poor man who is commanded to go forth with one garment, not to seek another, on being sent by Christ to preach the Gospel? For he is poor in spirit, who can sleep. In the case of the man satiated with riches, there is no one who would allow him to sleep. For the poor man sleeps [the sleep of the resurrection, which the rich man cannot sleep, because he is choked by riches and pleasures. He sleeps] the rest of Christ Who says: I have slept and have taken my rest and have risen up. This is that garment woven from the top in which Christ was clad, which those soldiers as you know were not able to tear apart. For none of them tore the raiment of Christ, but divided it, as it is written: They parted My garments amongst them and upon My vesture they cast a lot. The evangelists parted his garments amongst them, and upon his vesture, that is the preaching of the Gospel, with which our Lord Jesus is likewise clothed today, they cast a lot, certainly that lot which fell upon Matthias, that he should be joined as the twelfth to the number of the apostles after the exclusion of the betrayer's name. Moreover it is well said of the Evangelists that they cast a lot; for a lot depends as it were upon divine consideration. And for the reason that they did not speak by their own power, nor all the same things, but often spoke diverse things which the others had not spoken, we know that the grace of the Holy Ghost bestowed upon them as it were by an allotment what each should say concerning the works of our Lord Jesus, so that they might divide His deeds among them to be described according to His will.

This is the garment also which the apostle indicates, saying: Put ye on the Lord Jesus Christ. This is the garment which covers our uncomely members and clothes more abundant honor in them in Christ. We put on the bowels of mercy in Christ, we put on the glory of the cross which is to the Jews a stumbling block, to the Greeks foolishness. Let those blush who think this should be blushed for, but far be it from me to glory save in the cross of our Lord Jesus. For these our less honorable parts have more abundant honor, because through the suffering of our Lord an everlasting kingdom is prepared for us, for he who has sinned more loves more. Let us therefore be buried with our Lord Jesus that we may deserve to be the sharers of the resurrection. Therefore let us strip off the old man with his deeds, let us put on the new, in whom is remission of sins.

A good cover and garment therefore is the Word of God. With this garment the sons of Noah, receiving a cloak upon their shoulders and going backward, covered the nakedness of their father, that they might not see their father's nakedness, that is, parts of the body which have a certain kind of shame on account of human generation. And therefore he who wished to see received the just reward of a smaller mind, that he should be made a servant, for everyone who commits sin is the servant of sin. Wherefore he remained among the things of earth. Let no one take away this garment of the poor man; or, if he take it, let not the sun go down upon him who has been despoiled before he restore it, lest the sin of the poor man be ascribed to the usurer, and he should begin to suffer not only under his own but under another's sin.

Let this pledge be returned in the night of this world, let him put on this garment in the darkness of this world. For this pledge is of the lot of the Lord, not of that opposite one. For we read in Leviticus that there were two lots, concerning which it is said: The one thou shalt offer to the Lord, the other for an emissary. The emissary has transferred his lot to usurers, the servants of the Lord are in the lot of Christ. Standing in this lot Aaron warded off the plague of the opposite lot, when, standing between the two divisions of the people, he prevented death from creeping from the dead into the lot of the living by the interposition of his own body. A good pledge of this lot is the covering of the Word. Let no one take this garment from you, debtors; you should pledge this garment to no one if you wish never to endure shame, so that you may sleep among the midst of lots, like Aaron, that you may sleep between the two Testaments, that you may sleep the sleep of the resurrection and may be able to restore yourselves. This is the garment, which, even if you have given it as a pledge, holy Solomon in Proverbs urges us must be recovered, saying: Take off thy garments; for an unjust man is passing by.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 20"
