[[commentary]]
quote='''
And he said to them: you give them to eat. But they said: we have no more than five loaves. What is the reason that, although the passion of John is described later on, here he is already shown to be dead by the words of Herod? Is it perhaps this, that after the failing of the Law the gospel food begins to feed the fasting hearts of the peoples? Indeed, after she who took on the type of the Church was healed of the flow of blood, after the apostles were appointed to preach the gospel of the kingdom of God, the nourishment of heavenly grace is imparted. But notice to whom it is imparted. Not to the idle, not to those who sit in the city, as it were in the synagogue or in worldly rank, but to those who seek Christ in the desert places; for those who are not disdainful are themselves received by Christ, and the Word of God speaks with them not of worldly things but of the kingdom of heaven. And if any bear the sores of bodily suffering, to them he gladly grants his medicine.

It followed, then, that those whom he had healed of the pain of their wounds he should free from fasting with spiritual nourishment. And so no one receives the food of Christ unless he has first been healed, and those who are called to the supper are first healed by being called. If one was lame, he received the power of walking so that he might come; if deprived of the light of his eyes, he surely could not enter the house of the Lord unless his light were poured back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
