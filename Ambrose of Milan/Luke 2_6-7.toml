[[commentary]]
quote='''
St. Luke has briefly explained the manner, time, and also the place in which Christ was born in the flesh; the manner, that is, in which the espoused has conceived, a virgin has born offspring.

On thy account then am I weak, in Himself is He strong. On thy account am I poor, in Himself is He rich. Consider not what thou seest, but acknowledge that thou art redeemed. I owe more, O Lord Jesus, to Thy sufferings that I am redeemed, than to Thy works that I am created. It were no advantage to be born, had it not advantaged me to be redeemed also.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And it came to pass, while they were there, the days were fulfilled that she should bring forth. And she brought forth her firstborn son and wrapped him in swaddling clothes and laid him in a manger, because there was no place in that inn.

Briefly Saint Luke has set forth how and at what time and in what place Christ was born according to the flesh. But if you ask about his heavenly generation, read the Gospel of Saint John, who, beginning from heavenly things, came down to earthly ones. There you will find when he was and how he was and what he was, what he had done, what he was doing, and where he was, and whither he came, how he came, at what time he came, for what cause he came. In the beginning he says was the Word: you have when he was; and the Word was with God: you have how he was. You have also what he was: and the Word he says was God; what he had done: all things were made through him; what he was doing: That was the true light, which enlightens every man coming into this world; and where he was: he was in this world; whither he came: he came to his own; how he came: the Word was made flesh. When he came, John bears witness of him, saying: This is he of whom I said: He who comes after me has been made before me, because he was before me. For what cause he came, John himself testifies: Behold the Lamb of God, behold him who takes away the sin of the world. If, then, we have come to know both generations and the one person of both, and have observed the cause for which he came, namely that, taking upon himself the sins of a perishing world, he who could not be conquered might abolish in himself the stain of sin and the death of all, it follows that now too Saint Luke the evangelist should teach us and show the ways of the Lord as he grew according to the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
