[[commentary]]
quote='''
Therefore our Lord teaches generally that all worldly bargains should be far removed from the temple of God; but spiritually He drove away the money-changers, who seek gain from the Lord's money, that is, the divine Scripture, lest they should discern good and evil.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But God wills his temple to be not a merchant's lodging-house but a dwelling of holiness, and he shapes the practice of the priestly ministry not by a saleable office of religion but by free service. Consider, then, what the deeds of the Lord prescribe to you as an example for living.

And he cast out all who were selling and buying in the temple, and overturned the tables of the money-changers and the chairs of those who sold doves. In general, therefore, he taught above that worldly contracts ought to be absent from the temple of God, but in particular he drove out the money-changers. Who are the money-changers but those who seek gain from the Lord's money and do not distinguish good and evil? For the Lord's money is the divine Scripture. For he too distributed denarii to his servants when he was about to set out, and divided talents, and for the healing of the wounded man left two coins with the innkeeper; for by the two Testaments our wounds are cured. But you, like a good money-changer, store up the words of the Lord, pure words, silver tried in the fire, purged by the sevenfold Spirit, and do not by an impious exchange accept a counterfeit image of the king — for even Satan transforms himself into an angel of light — nor mix into your treasure the diminished figure of your prince by the fraud of Arian unbelief, nor tempt the ear of the faithful with the sound of money, so that the jingling of bronze shuts out the hearing of the holy Scriptures, or the desire of possessing is planted in religious affections. So not all the money-changers are to be shut out; for there are good ones too. Indeed, you should have given my money he says to the money-changers, and on coming I would have received it back with interest. But if the coin is of the Scriptures, the interest too is of the Scriptures.

But why he overturned the chairs of those who sold doves I do not understand according to the letter; for the dealers in birds could not claim for themselves the dignity of any honorable seat at the market. For what prerogative of dignity is there in doves? Yet the form of the Lord's baptism, when the Holy Spirit descended in a dove, admonishes us, by the type of merchants of this kind cast out of the temple, that those cannot have fellowship in the Church of God who make a traffic of the grace of the Holy Spirit. Freely he says you have received, freely give. Indeed to Simon, who thought that the gift of sanctifying could be conferred on himself for a price, Peter replied: Your money he says be with you unto destruction, since you think that you can obtain the grace of God with money. You have no part or lot in this faith.

The sellers of sheep and oxen too I take to be those who, as foul auctioneers, hunt for some market out of another's labor or simplicity; or else, because the sheep and oxen are cast out and the doves are ordered to be taken away, the Jewish people appears to be shut out; for Ephraim is like a dove, in that the Lord hated both their successions and their labors. The bronze is poured out so that grace may be gathered; the table of the money-changers is overturned so that the Lord's may be put in its place; the altar is thrown down so that the altars may be raised up.

And he did this not equipped with any band of men or with riches, but with a scourge of cords he struck the crowds, and no one dared to resist. And now he uses a rod, now a scourge — for the rod is upright, the rod of your kingdom — a rod, to correct; a scourge, to persuade. There it is straight. Here it is a moral precept, bent as it were, by which the sinner's conscience is scourged as with a pliant lash. For the terrors of the prophets are one thing, the persuasions of the apostles another: yet in both is the discipline of one Word. And therefore he made a scourge of cords, because the lines have fallen he says to me in splendid places; for my inheritance is splendid to me; for lines is the name of the cords with which surveyors divide the boundaries of fields to be measured out. And therefore as a good surveyor he was marking off the boundaries of the Synagogue, and ordered the profaners of the Church to go out of the temple; for a new measurer of fruitful souls had come, who would measure the kinds of fields, not their extent.

Yet beautifully no measure of possession is enclosed by stretched lines, nor are the limits of faith bounded as though of some defined thing, but by a scourge that ranges freely without measure the borders of the Church are extended; the Jews are banished, not into some prescribed exile, but into an unending one, so that nowhere in the world would a place remain for the synagogue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
