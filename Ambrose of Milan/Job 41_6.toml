[[commentary]]
quote='''
Crush the flesh of the dragon; its flesh is our sins. Therefore God says to you: the nations feast on him, and below he says: dying runs ahead. And the flesh of his body cleaves to him. For as the saints are the body and members of Christ, so sinners, who do not desert sin but cleave to sin, are the body and members of the dragon. Therefore we feast on the body of Christ, but they feast on the body of the dragon. We who strive to cleave to Christ feast on the daily remission and pardon of sins; but they, who daily link sins to sins, feast on a continuation of outrages and crimes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
