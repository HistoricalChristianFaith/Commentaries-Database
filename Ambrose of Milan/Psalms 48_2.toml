[[commentary]]
quote='''
He added: spreading wide the exultation of the whole earth. And truly is he called great who has poured out over the whole world the exultation of this earth, in which before the shoots of intolerable sins sprouted, where there was grief, sadness and groaning. And so the conscience of men, which before mourned, sunk in the whirlpools of its own shameful deeds, now rejoices, released from fear through the pardon of Christ and the remission of all sins. It fits, then, even if we understand it as we have said. But since in some old copies we have found εὐρίζῳ ἀγαλλιάματι πάσης τῆς γῆς, which in Latin means "bonaradice exultatione uniuersae terrae" [with the good-rooted exultation of the whole earth], we notice that the sense is indeed the same, in that the divine gifts of God the Father in us are praised, who has given us an exultation founded on a good root, namely God Jesus, the true and most fruitful vine, from which the heavenly sacraments have flowed, in which there is perpetual and lasting joy, because by them every sin is washed away and the inner conscience is cleansed; and we recognize that the wording also fits, because we who exult in Christ rejoice with a well-rooted exultation. For the joy of the world is temporal, but perpetual is the joy of him who rejoices in the Lord.

Mount Zion, the sides of the north, the city of the great king. God is known in her steps, when he shall take her up. He has plainly expressed why there is exultation of the whole earth: because the Lord Jesus has gathered for himself a Church out of sinners. And so those who before were the sides of the north, that is, the companions and adherents of the devil, to whom it is said: Arise, north wind, and let the south wind come, have become faithful to Christ. For they are the ones of whom it is said: Those who trust in the Lord are like Mount Zion. So they have become Mount Zion through the grace of Christ and the sacrament of baptism. Heavy were the blasts of the intelligible north wind, with which he stirred up the harshest tempests and storms in human affections. He who harassed others began to lose his own. He had overthrown the whole nation of the Jews, he held all the nations subdued under his rule; they were his sides, that is, they breathed in concert with him. As we call the bodyguards and companions of a prince his sides, as a woman is the side of her husband because she is joined to him in a compliant partnership, so those who did his will were the sides of the devil. These, then, are now Mount Zion, who contemplate the eternal God and are intent upon him night and day. See, I pray you, how Paul, when he was persecuting the Church of the Lord, was a side of the north; see now, when he is read in the Church, how he is a mountain of watching, through whom we know and see the glory of Christ. And since the Greek said mountains, that is ὄρη, see how the little servants of Christ are mountains, mountains round about it, in which is the Church of the Lord, which is the city of the great king. At the same time, because the Lord, according to the tract of the sky, suffered ἐν Κρανίῳ [at the Skull], which was a place on the side of the north. And there also is Mount Zion, there the Jerusalem which is on earth.

See whether this too may not seem to be expressed: that the congregation of the people of God, which was joined to the north wind through guilt, has become the Church of Christ through grace, so that it is now called not the synagogue but the Church of Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
