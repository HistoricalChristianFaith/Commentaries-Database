[[commentary]]
quote='''
Asher, his bread is rich, and he will give food to princes. Asher, by Latin interpretation, signifies riches. Who, then, is rich, except where there is the depth of the riches of the wisdom and knowledge of God? Who is rich, except the Lord Jesus, who always abounds and never fails? Poor he came into this world, and he abounded for all; he filled everyone. How great in riches is he who by his poverty made all men rich! But he was poor for our sake, rich with the Father; poor, that he might deliver us from want, as the Apostle teaches, saying: for your sakes he became poor, though he was rich, that by his want you might be made rich. His want enriches, his fringe heals, his hunger satisfies, his death gives life, his burial raises up. This, then, is the rich treasure whose bread is rich. And well is it called rich, for whoever eats it will not be able to hunger. This bread he gave to the apostles, that they might divide it to the people of the believers, and today too he gives it to us, the bread which he himself, as priest, consecrates daily with his own words. This bread, then, has become the food of the saints.

We can also take it of the Lord himself, who gave us his own flesh, as he himself says: I am the bread of life. Your fathers ate manna in the desert and died; but this is the bread which came down from heaven, so that, if anyone eats of it, he may not die. And lest anyone should think that he speaks of this death which comes through the separation of soul and body, and should rightly doubt, since he knows that the holy apostles died by this death, he added: I am the living bread, who came down from heaven. If anyone eats of this, he will live for ever, that is: I did not speak above of temporal life, nor of the death of this life; for even if someone has died by that death, yet if he has received my bread, he will live for ever. For he receives it who proves himself; and he who receives it will not die the sinner's death, because this bread is the remission of sins.

Moses too prophesied most beautifully in his blessings, saying: Blessed of sons is Asher, and he will be acceptable to his brothers, and he will dip his foot in oil. Iron and bronze will be his sandal, and as your days are, so will your strength be. There is no one such as your God is in heaven, your helper, both great and comely, of the firmament, and God of the beginning protecting, and through the strength of mighty arms. And he will cast out the enemy from before your face, saying: perish. And Israel will dwell trusting, alone, upon the land of Jacob in grain and wine, and the heaven will be to you with a cloud of dew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 9"
