[[commentary]]
quote='''
He had committed his money to the care of his kinsman, which during the whole space of his life, in spite of such great poverty, he did not demand. It was only when he saw himself worn out and overcome by old age that he suggested this to his son, not so much desiring to demand what he had entrusted as anxious lest he defraud his heir.

Because therefore he entrusted his money and did not put it out at usury, he observed the duty of a just man; for lending by which usury is sought is evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 2"
