[[commentary]]
quote='''
And therefore the prophet said beautifully: for not by their own sword did they possess the land, and their own arm did not deliver them, but your right hand and your arm and the light of your countenance, because it was well pleasing to you in them. What, then, is the land which is not taken by the arm, not possessed by the sword, unless the land of promise, of which this same prophet said: I believe that I shall see the good things of the Lord in the land of the living? Not undeservedly, then, is its possession so glorious, in which not the adversities of the world hold sway, but the eternal good things of the Lord bear fruit. And therefore it is not acquired by the sword but possessed by meekness, as the Lord Jesus testified, saying: Blessed are the meek, for they shall possess the land. Let no one, then, be unpeaceable, no one arrogant or proud; but let him be meek and humble of heart, claiming nothing for himself but referring all to grace; let him not glory in his own strength, but believe that he is protected by the right hand of God, saying: The right hand of the Lord has wrought power, the right hand of the Lord has exalted me; let him remember too that he has been preserved by the sword of God, and enlightened also by the countenance of almighty God; in all of which Christ is protector, right hand, defender and sword. Hence Simeon also said to Mary: And a sword shall pierce through your own soul too. For the sword of God is the Word, which, sharper than any sword, pierces even to the divisions of the soul and its thoughts, so that no hidden things escape its knowledge. Christ is also the splendour of the Father's countenance, and therefore he says: He who sees me sees the Father also, being the splendour of his glory and the image of his substance. To him, then, all things are rightly to be referred. To him Moses, to him Aaron, to him also the fathers consecrated all that they had done, so as to triumph over their enemies. For it was not in his own confidence that Joshua son of Nun said: Let the sun stand still over Gibeon, but because he presumed on Christ, whom he recognized as the leader of the heavenly host and suppliantly adored. And therefore he merited to root out savage nations and to bring the people of the fathers into the land of promise, because he ascribed nothing to his own works, believing that the works of men are unworthy of so great a reward of heavenly glory, which the Lord has determined to confer on those who believe in him out of his own mercy rather than in consideration of our deeds. Hence Abraham too believed God unhesitatingly, so as to find with him the grace of justification rather than to lay up the wage of his own work; for the gifts of the giver are richer than the wage of the worker. For this reason too the Lord replied to him who had begrudged the equality of the wage: If I am good, why is your eye evil? Our fathers, then, as being near to the patriarchs and their heirs, when planted in the land of promise did not claim this for their own merits. Therefore neither did Moses bring them in, lest this be thought to belong to the Law, and not to grace; for the Law examines merits, grace looks to faith. Hence the Apostle, following the faith of the fathers, says excellently: But neither is he who plants anything, nor he who waters, but God who gives the increase. For not Joshua son of Nun, because he brought them in or because he planted them, but God, who gave the increase to the people, holds the primacy of glory.

Nor let it trouble you that he said above: Your hand utterly destroyed nations, and you planted them. For from this you gather that not everyone who plants or who waters gives the increase, but he who can give the increase can himself plant, as the Lord is said to have planted nations. For he planted who gave the planting its effect, yet in those who have merited to please the Lord through faith in Christ, to whom alone it is said by God the Father: You are my Son, in you I am well pleased. Those, then, who are partakers of Christ obtain from him the grace of pleasing. And he says beautifully: it was well pleasing to you in them, so that the distinction may be seen to be rightly kept. For God is rightly well pleased in the Son, because he is equal to the Father and is found unlike in nothing, because he is well pleased by right of the divine nature and by unity of substance. And rightly the Father is well pleased in the Son, because the Father is honoured in the Son as the Son is in the Father. But in us it was well pleasing to God, because he himself granted us to be able to please him. And Scripture has devoutly taught us that this too was granted specially to man, not arrogantly usurped. For it is fitting that it should be well pleasing to God in those whom he made after his likeness and whom he willed, through his image, to have the prerogative of heavenly grace. In his image, then, God is well pleased; but in those who are according to his image it is well pleasing to God. And in them is his own boon and his own gift, which will be revealed when that which is perfect has come, because, when it has appeared what we are, we shall be like him, as it is written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
