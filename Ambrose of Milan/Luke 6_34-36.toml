[[commentary]]
quote='''
But the Lord in the Gospels thinks we should lend rather to those from whom a return is not to be expected. For He speaks thus: and if you lend to them from whom you hope to receive, what thanks are to you? For sinners lend to sinners for to receive. But love ye your enemies, do good, and lend hoping for nothing, and your reward shall be great in Heaven, and you shall be the sons of the highest: for he is kind to the unthankful and to the evil. Be ye merciful as your Father is also merciful. You notice what name the usurer has received from the Lord, what name also he who has been bound by your usury. Sinners, He says, lend to sinners for to receive. Both are sinners, both the usurer and the debtor. Do you, therefore, He says, love your enemies. You should not discuss what your enemies may deserve, but what you ought to do. Lend to those from whom you do not hope that you will receive what has been given. Here is no loss, but a gain. You give very little, you will receive much: You give on earth and you will be paid in Heaven; you lose your interest, you will have a great reward; you stop being usurers, you will be sons of the Highest, you will be the merciful who prove yourselves to be heirs of the Eternal Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 16"
