[[commentary]]
quote='''
So this soul too desires many kisses of the Word, that she may be enlightened with the light of divine knowledge. For this is the kiss of the Word, namely the light of sacred knowledge; for God the Word kisses us when he enlightens our heart and the very ruling part of man with the spirit of divine knowledge. Endowed with this nuptial pledge of love, the soul, glad and exulting, says: I opened my mouth and drew in the spirit. For a kiss is that by which lovers cleave to one another and, as it were, enjoy the sweetness of an inner grace. Through this kiss the soul cleaves to God the Word, for through it the spirit of the one who kisses is poured over into her, just as those also who kiss each other are not content with a touching of the lips, but seem to pour their spirit into one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
