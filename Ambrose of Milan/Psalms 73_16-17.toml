[[commentary]]
quote='''
And so, because I seemed to myself to have grasped the true judgment and to have attained knowledge of the matter itself, I said to myself: This is toil before me, until I enter into the sanctuary of God and understand at the last, that is: only one toil remains for me, to go into the sanctuary of God, where the Cherubim are, that is, the depth of knowledge, and not to toil among uncertain and empty opinions; for the narration of a fool is like a burden on the way. Therefore let us go into the inner shrine of sacred knowledge and the inner recesses of truth, so that there may be no toil in us; for wisdom leads us away from the sense of toil. In short, there is no toil in Jacob, but the cause of toil is ignorance, since he who does not know that rewards are laid up for the just is not refreshed from his toils, but rather is bowed down and broken by the toil of his own imprudence. Let us go, then, into the sanctuary of God, where the Cherubim are, in whom is the remembrance of sacred knowledge and of that true and eternal light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 7"
