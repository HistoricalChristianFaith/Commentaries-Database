[[commentary]]
quote='''
For all the foregoing, then, a fine remedy is that he is ready for the scourges and offers himself to the Lord, to bear whatever scourges have pleased God. I read indeed that holy David chose the kind of scourge which he would bear with equanimity; but he chose because the necessity of choosing one of three conditions was laid upon him. But where it is not commanded, the little servant of God is ready for everything, whether he undergoes bodily sickness or flight from the face of the enemy or the death of his sons, whom he does not fear to send on ahead, because he can receive them back undaunted. For he is aware that, if he has been punished here with temporal punishment, he can lighten the penalty of perpetual affliction in the future. He asks, then, that his petition be received and that he himself be chastised, so that he may be received; for the Lord chastises indeed every son whom he receives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
