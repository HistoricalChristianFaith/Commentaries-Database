[[commentary]]
quote='''
Follow the rest, and learn the mysteries of the Gospel reading, and in the healing of the two recognize the sacrament of the common salvation. As indeed in Adam all die, so in Christ all are made alive. Who is that man who in the synagogue had the unclean spirit of a demon but the people of the Jews, who, bound as if by a serpent's coils and knotted in the devil's snares, defiled a feigned purity of body with the filth of the inner mind? And well was the man who had an unclean spirit in the synagogue, because he had lost the Holy Spirit. For the devil had entered where Christ had gone out. At the same time it is shown that the nature of the devil is not wicked, but his works are unjust. For him whom by his higher nature he confesses as Lord he denies by his work. And in this appear his wickedness and the depravity of the Jews, that he so poured over the people the blindness of a frenzied mind that the people deny him whom demons confess. O inheritance of the disciples, worse than the master! He tempts the Lord by word, these by deed; he says: cast yourself, these attack him to cast him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
