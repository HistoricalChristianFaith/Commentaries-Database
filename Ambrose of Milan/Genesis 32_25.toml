[[commentary]]
quote='''
Instructed, then, by these disciplines of patience and perseverance, Jacob set out and acquired for himself a union with wisdom, the partner of his purpose, with a rich dowry of prudence, so that with her he might run through the seasons of his life without any stumbling. With the treasure of wisdom added, then, he established for himself a flock of varied sheep, but that rational flock, shining with the diversity of very many virtues. Hence also he cut back the boasting of his flesh, which the numbness of the thigh signifies, without prejudice to the interpretation of the sacred mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
