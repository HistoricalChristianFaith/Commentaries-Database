[[commentary]]
quote='''
First of all, how great a reverence we learn to render to parents, when we read that he who was blessed by his father was blessed, and he who was cursed was cursed! Therefore God granted this grace to parents, that the piety of children might be called forth. The prerogative of parents, then, is the discipline of children. Honour your father, then, that he may bless you. Let the pious man honour his father out of gratitude, the ungrateful out of fear. Even if a father is poor and has no store of riches to leave to his children, he has nevertheless the inheritance of the last blessing, by which he may bestow the wealth of sanctification upon his successors. And it is much more to become blessed than to become rich.

Joseph was eager to receive the blessing. And so he also brought his sons Manasseh and Ephraim, whom Jacob blessed, so that, since he had twelve sons and Paul was to be the thirteenth apostle, chosen as it were later, a thirteenth tribe might be sanctified from his grandsons Manasseh and Ephraim, divided between the two, in order that Paul might not be found outside the number of the fathers' tribes, he who, the eminent preacher of the Old and the New Testament, could readily prove that the inheritance of the fatherly blessing had profited him too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 1"
