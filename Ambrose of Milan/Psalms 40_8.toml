[[commentary]]
quote='''
It is written, moreover, not only at the head, but in the whole compass of the Law, that a man would come to preserve the race of men, who would will all that God willed. Hence you understand that he who is of the same will is of the same divinity. Hence also he came willingly to the sacrifice of the Passion, and rightly foretold: Willingly will I sacrifice to you.

But perhaps you may say: "How did he say in the Gospel: Father, if it is possible, take this cup from me; but not as I will, but as you will?" And there seems to be a difference of will. But we understand that one thing is expressed according to the unity of the divinity, where he says: I and the Father are one, and another thing he spoke according to the affection of man, whom he taught that he ought to be cautious and not presume what he cannot easily fulfil, lest, while he seeks the prize, he fall into sacrilege. Hence he says: When they persecute you in this city, flee into another. Rightly, then, here too, being about to undergo the passion of the body, he began to be sorrowful and to be sad, and, having taken with him Peter and the two sons of Zebedee, he first said: My soul is sorrowful, and afterwards added: Watch and pray, that you may not enter into temptation; the spirit is ready, but the flesh is weak. You see that everywhere he speaks according to man, prays according to man, is sorrowful according to man, said according to man: My Father, if it is possible. What, indeed, is impossible to God? But it is man's part to doubt, God's to confirm. Therefore he took with him the readier ones, as chosen witnesses of his final judgement, who would recognize the sacrament of his words. Finally, the others were sleeping; these alone were watching with faithful mind. Hence also through Jeremiah, when he had not yet taken a body, he himself says: I was led like a lamb, and I did not know. What is there that the wisdom of God does not know, which is always in the secret of the Father? And therefore the Son of God has declared all things, because he himself is the wisdom of God the Father. How did he foreknow that he was to be led like a lamb, and yet says that he did not know where he was being led? Or how, earlier, through the mouth of David himself, does he say: God, my God, why have you forsaken me? How is the Son forsaken by the Father, he who says: And I am not alone, because the Father is with me, and elsewhere: I was delivered up and I did not go forth, and elsewhere: I have risen and am still with you, unless so that you may observe that he expresses the feeling of men, who think themselves forsaken by their Lord when they are in dangers? Finally, hear what follows: Far, he says, from my salvation are the words of my offences, that is: the words of offences are one thing, the sacraments of eternal salvation another. Words do not prejudice power; the divine substance is upheld by its own strength: man is seen, man is heard, God is recognized in his works. And yet of this man it is said: He is both man, and who shall know him? What is "who"? Not that no one does, but that someone rare does, someone wise, as in that saying: Who shall ascend into the mountain of the Lord? Who is wise, and shall understand these things? Finally, elsewhere: The foolish man shall not know, and the stupid shall not understand these things. You, then, when you read the Gospel, as one wise and not foolish, know what you read; let the brightness of eternal wisdom enlighten you. They are words indeed, but they themselves cleanse, and they themselves enlighten, and they themselves strengthen, and they themselves give life. Hence Peter says: Lord, to whom shall we go? You have the words of eternal life, and we will not leave you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
[[commentary]]
quote='''
Finally, so that we might observe that he speaks according to man, a little later he said: Behold, the hour draws near that the Son of Man should be delivered into the hands of sinners, and to Judas as he kissed him he said: Judas, do you betray the Son of Man with a kiss?, that is: do you pour poison into the kiss by which the grace of love is poured in, the kiss which is the token of sacred peace, the kiss by which faithful friendship is made firm, the kiss by which holy faith is sealed? With this kiss, then, do you betray to danger him whom you ought to venerate because of the exchange of the kiss, and do you, a man, betray the Son of Man, who came down from heaven for the salvation of men? For so it is written: The Son of Man who is in heaven, he it is who came down from heaven. Do you betray the Son of Man who made you an apostle out of a sinner, do you betray the Son of Man who came to wash away the sins of all in his own blood? I do not refuse the kiss; see to it yourself, you who have violated the sanctity of the kiss. Or have you not read that the wounds of a friend are more useful than the voluntary kisses of an enemy? And not undeservedly was Judas struck by so great a condescension, a heavier weapon than if he had struck him with a thunderbolt. Finally, he who betrayed the majesty could not bear the patience of the Lord, so much so that the guilt of so great a crime could not be washed away from him. And so he went away and gave back the money, that is, he condemned his avarice, the author of so great an ungodliness, and returned to the synagogue the price of unbelief. The traitor, who could find no place for penitence, is not excused, but the sacrilege of the Jews is made more bitter, for they are convicted even by the words of the traitor. He acknowledged his crime, saying that he had betrayed righteous blood; they both took back the price of the crime and persecuted the prince of righteousness with keener zeal. Therefore, to the perpetual condemnation of all these, the crucified thief is absolved, because he acknowledged Christ in his own punishments, whom these did not acknowledge in his benefits, and he confessed his sin to Christ, who knew how to forgive, because on his cross he beheld with his mind the kingdom of the Lord, which Judas could not see at the banquet of Christ. Therefore the thief's prayer was followed by a heavenly voice of this kind: Amen I say to you, today you shall be with me in paradise. You were dancing for joy, dragon, because you had stolen an apostle from Christ: you have lost more than you took, you who see the thief carried over into paradise. There is no one who can be shut out, when the thief, your servant, has been received and has come to that place from which you yourself were cast down.

We have added these things on account of that verse, because he said: To do your will, my God, I have willed, that is: the will of the divinity is one for me with you, Father, and because the will is one, the substance is one, and the majesty and power of the Trinity are inseparable. But the voice of the flesh is another, and yet it too consented to the will of God, saying: Not what I will, but what you will, and elsewhere: If this cannot pass unless I drink it, your will be done. To fear death is a common affection; Christ took it on so that he might crucify, as indeed he did crucify, the flesh as well; for he wrestled for me, that he might conquer for me. Although the flesh of Christ was strong and not subject to sin, yet he took on sins; he took on infirmities, although he had nothing to grieve for. Finally, hear him saying: Because he grieves for us, until he brings forth judgement in truth. For he did not take on another flesh, but this one, as the Apostle teaches, saying: For this corruptible must put on incorruption, and this mortal immortality. Although he was born of a virgin and of the Holy Spirit, yet he is the Son of Man, because the virgin is human. And therefore what is born of the flesh is flesh, and he who is born of man is called man, the mediator of God and men, the man Christ Jesus.

For this reason he who was incorruptible took on this flesh, that he might make it incorruptible, and he who was immortal, that he might make it immortal. If anyone, then, follows him, he shall put on immortality; if anyone does his will, he shall not die for ever, but Christ will say to him: Today you shall be with me in paradise. What is "today"? That is: you have passed over from the night, you shall be with me in the light; do not fear the darkness, you whom eternal light has taken up. Beautifully, too, he added: you shall be with me in paradise, that is: do not doubt about the flesh; you have seen me too in the flesh. Do not fear lest you also fall from paradise as Adam fell, but hear that you shall be with me, where, with me present, you cannot fall. The flesh had fallen in paradise before it was taken up by Christ. You shall be taken up there where he also is who took it up, who did not lie when he said: I will that where I am they also may be with me. The shepherd will not withdraw from his flocks, although in paradise you, to whom it was said: I saw Satan like lightning falling from heaven, can no longer fear the wolf. Therefore, before the consummation, the adversary is cast down into the fire and is bound with everlasting chains as well, so that you may now fear no snares.

Adam, too, was deceived by the serpent, so that he fell, and was swayed by his wife. Therefore there will now be no marriages in paradise, but all will be without the celebrations of marriages, like the angels in heaven. He had not said to Adam "you shall be with me", because he knew that he would fall, so that he might be redeemed by Christ. Happy ruin, which is repaired for the better! Therefore now the loving shepherd, the good merchant, does not abandon his flock and his own merchandise. There will indeed still be in paradise a fight of the serpent with the angels, until he is cast down; but he who is with Christ will not be able to fear. Adam was not with Christ when he was deceived; for if he had been with Christ and had abided in his commandment, he certainly could not have perished. He did not abide in Christ, because he did not continue in his word. Finally, hear who abides in Christ: If you abide, he says, in me and my words abide in you, you shall ask whatever you will and it shall be done for you, and further on: If you keep my commandments, you shall abide in my love. Do you wish to know that Adam was not with Christ? The Lord said to him: Adam, where are you? He who seeks him as though absent would certainly not say "where are you?", if he knew that he was abiding in him. But let us hear who made him absent: They hid themselves, he says, both, from the face of the Lord. Christ sees all, but he who hides himself is hidden, since he who does not know shall not be known; for the Lord knows those who are his. He wishes all whom he has founded and created to be his own. Would that you, O man, did not flee and hide yourself from Christ! He seeks even those who flee and does not wish the hidden to perish, but calls out, saying: Adam, where are you?, that is: "Man, where are you? I placed you in the light; you have sought the darkness".

Finally, in paradise, where it is always the day of morning, evening came, since all sins are dark. Therefore you have it that they heard the voice of the Lord God walking towards evening in paradise. At the same time recognize the mystery. In the morning you went astray; at evening you are set free. For how can there be evening where Christ is? For although his seat is above the heaven of heavens, yet Christ is in his saints. How, then, can there be evening where God is, since God is light? Finally, a light shone round Saul on the way when Christ met him, whence the persecutor was even blinded as the light of God shone forth. Why, then, was he blinded, unless because he had not acknowledged Christ? For if he had known the arbiter of light, he would not have lost the light of his eyes. Finally, when he acknowledged him, he received it back. It is an indication that he did not know Christ that, when he heard the voice: Saul, Saul, why do you persecute me? he answered: Who are you, Lord? He would not have asked who he was if he had known him. Hence the Lord too speaks as to one who does not know: I am Jesus whom you persecute. It is hard for you to kick against the goad. And he said: Lord, what must I do? See the fitting parts each of them plays. The physician threatens so that he may correct, frightens so that he may cure. The sick man first asks about the person of the physician, whether he is fit, one by whom he may presume he can be healed; when he heard the author of the medicine, he asked for the remedy and found health. Finally, from him as he came near he not only drove out the blindness, but he also received a light that he had not had, so that he saw Christ, whom he had not seen before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"


[[commentary]]
quote='''
But let us look at what follows, repeating, however, the verse which seems to have been treated: Behold, I come; to do your will, my God, I have willed, and your law in the midst of my heart. I have well announced your righteousness in the great Church; behold, I will not restrain my lips. Lord, you have known your righteousness; I have not hidden it in my heart. From the former verse, then, we understand: "Behold, I come: not only shall I do your will, but also your law in the midst of my heart". Others have: in the midst of my belly. For there is also a belly of the mind, which conceives the seeds of thoughts, of which Isaiah said: In the womb we have conceived and brought forth the spirit of salvation. With this womb Paul too brought forth, who says: My little children, with whom I am in travail until Christ be formed in you. Christ, then, is formed not in a bodily belly, but in a certain belly of the soul. With this belly the Apostle begot, as it is written: I have begotten you through the Gospel. Therefore some have: in the midst of the heart, others: in the midst of the belly, so that you may understand the belly of the inner man, which is taken to be in the midst of the heart, in which we keep the prescriptions of the natural law, which is not only kept but also done in our hearts. Hence also it is written that not only the hearers of the law are righteous before God, but the doers of the law also shall be justified. For there are those who by nature do the things that are of the law, as the Gentiles, who do not hear the law and are a law to themselves, who keep the precepts of a law unknown to them. Therefore Christ in this place, as the gatherer of the Gentile people, took on our person, so as to say that he does the law in the midst of his heart. For the people of the nations fulfilled the law which it had not heard, so that it acknowledged Christ, whom the people of the Jews, which had received the law, did not receive nor thought worth knowing, because it is written: The ox has known its owner, and the ass the manger of its lord; but Israel has not known me. This, then, is the belly of believers, in which the Holy Spirit works and which he is wont to fill with spiritual seed, as the Lord Jesus testifies in the Gospel, saying: He who believes in me, as the Scripture says, rivers of living water shall flow from his belly. From that river come these rivers, of which we read: The rush of the river makes glad the city of God. Of those, then, from whom such spiritual rivers flow, it is well said: The rivers have lifted up, O Lord, the rivers have lifted up their voice from the voice of waters, of spiritual waters, which praise God above the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"


