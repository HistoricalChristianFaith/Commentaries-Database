[[commentary]]
quote='''
So great therefore is the Lord's condescension that he testifies that there is in him a zeal to pour devotion into us, to consummate perfection in us, and to hasten his Passion for us. Though he had nothing in himself to grieve over, yet he was straitened by our distresses, and at the time of death he showed a sadness which he had taken on not from fear of his own death but from the delay of our redemption, according to what is written: and how I am straitened until it is perfected? Surely he who is straitened until perfection is secure about the perfection. But also elsewhere: My soul he says is sorrowful unto death. Not because of death, but unto death is the Lord sorrowful, because it was the condition of bodily affection, not the dread of death, that struck him. For he who took up a body had to undergo all things that belong to the body, to hunger, to thirst, to be straitened, to be saddened, but the divinity cannot be changed through these affections. At the same time he shows that in the contest of the Passion the death of the body is a release from anxiety, not a heaping up of pain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
