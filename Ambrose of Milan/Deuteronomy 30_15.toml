[[commentary]]
quote='''
But perhaps someone may assert: 'What is so contrary as life to death? If, then, life is thought a good, how is death not an evil?' And so let us consider what life is, and also what death is. Life is to enjoy the gift of breathing; death, to be deprived of it. Now this gift of breathing is counted by most people among good things. This, then, is life: to enjoy good things; death, on the contrary, is to be stripped of good things. And Scripture says: Behold, I have set before your face life and death, good and evil, calling life a good and death an evil, or else pairing the first-named with each other and the latter with each other. Then, to use an example from the divine reading, man was placed in paradise to eat of the tree of life and of the other trees of paradise, but not to eat of the tree in which was the knowledge of good and evil; and on the day he ate, he would die the death. He did not keep the commandment, and he lost the fruit, and, cast out of paradise, he tasted death. Death, then, is an evil, which is inflicted as the price of condemnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 1"

[[commentary]]
quote='''
There is, then, no slight reason why we ought to flee from here: that we may come from evil things to good, from uncertain things to things trustworthy and full of truth, from death to life. The Lord himself also, by saying: I have set before you good and evil, life and death, showed that the good is life, but eternal life. For if this life is subject to the world and to its malignity, surely that life is good which is not corrupted and changed, which degenerates through no vice, which is acquired by virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
