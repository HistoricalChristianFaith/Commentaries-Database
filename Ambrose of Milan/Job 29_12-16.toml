[[commentary]]
quote='''
Hear clearly what kind of praise befits a rich man: I delivered, he says, the poor man from the hand of the powerful, and I helped the orphan, that had no helper. The blessing of him that was ready to perish came upon me, and the mouth of the widow blessed me. I put on justice; I was an eye to the blind, and a foot to the lame; I was the father of the weak; and below: The stranger did not abide without, but my door was open to every comer. And if also I have sinned foolishly, I have not concealed my fault; nor have I feared a multitude of people so as not to declare it in their presence, if I have suffered the weak to leave my door with empty bosom. He mentioned also that the bill of the debtor, which he had, he returned cancelled, without the recovery of the debt. For why should I repeat these things too, that he says that he wept over every one in sickness and groaned when he saw a man in need, but himself in good things; and that for him rather were there days of evil when he saw that he had abundance, and others were in want? If he says this, who never caused the eye of a widow to weep, who never ate his bread alone without giving to the orphan—whom from his early years he nourished, fed, and instructed with the love of a parent—who never despised the naked, who covered [the dying], who warmed the shoulders of the sick with the skins of his sheep, who oppressed not the ward, who never delighted in riches, who never rejoiced at the fall of his enemies; if he who did this, from his great riches began to be in need, if he derived nothing from such a great patrimony save the one fruit of mercy, what is to become of you, who do not know how to use your patrimony, who in great riches endure days of indigence, because on none do you bestow and to none do you give assistance?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 13"
