[[commentary]]
quote='''
Moses blessed this tribe, saying: Dan is a lion's whelp, and he will escape from Bashan, that is, from confusion. Hence, according to the Greek, from which the Latin was translated, we ought rather to understand that Dan himself became a serpent sitting in the way. Dan is interpreted 'judgment', and therefore this tribe underwent the grave peril of judgment; the serpent that slipped into it is Antichrist, who would wound with his venom one who was running. But nevertheless that tribe itself will be delivered from confusion when it has confessed the rider rising again, who says: whoever has been put to confusion over me before men, I too will put him to confusion before my Father, who is in heaven. But whoever has confessed me before men, I too will confess him before my Father, who is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 7"
