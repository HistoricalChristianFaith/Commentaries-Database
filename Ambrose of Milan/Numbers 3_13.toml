[[commentary]]
quote='''
The Lord has said: On that day in which I shall slay every first-born in the land of Egypt, I shall sanctify to myself whatsoever is first-born in Israel. This does not refer to one occasion or to one crisis, but to all time. Once wickedness is renounced, virtue finds immediate entrance. The departure of evil brings about the introduction of virtue and the same effort that banishes crime leads to an adherence to innocence.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"
