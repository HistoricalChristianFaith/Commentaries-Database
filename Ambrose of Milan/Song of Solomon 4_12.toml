[[commentary]]
quote='''
"A garden enclosed," says He, "is My sister, My spouse, a garden enclosed, a sealed fountain." Christ says this to the Church, which he desires to be a virgin, without spot, without a wrinkle. A fertile garden is virginity, which can bear many fruits of good odour. A garden enclosed, because it is everywhere shut in by the wall of chastity. A sealed fountain, because virginity is the source and origin of modesty, having to keep inviolate the seal of purity, in which source the image of God is reflected, since the purity of simplicity agrees also with chastity of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FEpistle%252063.html'
source_title="Epistle 63.36"


[[commentary]]
quote='''
In gardens of this kind the water of the pure fountain shines, reflecting the features of the image of God, lest its streams mingled with mud from the wallowing places of spiritual wild beasts should be polluted. For this reason, too, that modesty of virgins fenced in by the wall of the Spirit is enclosed lest it should lie open to be plundered. And so as a garden inaccessible from without smells of the violet, is scented with the olive and is resplendent with the rose, that religion may increase in the vine, peace in the olive and the modesty of consecrated virginity in the rose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25201.html'
source_title="Concerning Virginity 1.9.45"

[[commentary]]
quote='''
It is a delight to notice that lilies grow not in the roughness of the mountains and the wild places of the woods, but in the pleasantness of gardens. For there are certain gardens bearing the fruits of diverse virtues, according to what is written: a garden enclosed, my sister, my bride, a garden enclosed, a fountain sealed, because where there is integrity, where chastity, where religion, where the faithful silence of secrets, where the brightness of angels, there are the violets of confessors, the lilies of virgins, the roses of martyrs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Hear him who says what this fountain is: They have forsaken me, the fountain of living water. To this fountain the soul of the prophets ran thirsting, as David also says: My soul has thirsted for the living God, that it might satisfy its thirst with the abundance of divine knowledge and wash away the blood of folly with the watering of spiritual streams. For this is the flow of blood which, as the Law indicates, is uncovered when a man has union with a woman sitting in the days of her blood. The woman is delight, the allurements of the body. So take care that the vigour of your mind is not bent by a kind of union with bodily pleasure and softened, and dissolved into all its embraces, and that it does not open its fountain, which ought to be closed and fenced in by the zeal of attention and the reflection of reason; for a garden indeed enclosed, a fountain sealed. For when the vigour of the mind is relaxed, the senses of bodily delight pour themselves out, exceedingly destructive and rushing headlong into an appetite full of grave danger; these, had the careful guard of a lively mind remained, it would have reined in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 1"

[[commentary]]
quote='''
An enclosed garden is my sister, bride, an enclosed garden, a sealed fountain. Your shoots, etc. Because in gardens of this kind the wave of a pure fountain reflects the image of God impressed by the seals, and the streams are not troubled, spattered with mud from the wallowing-places of spiritual beasts. Hence that modesty, hedged in by the spirit as by a wall, is shut in, lest it lie open to plunder. And so, like a garden inaccessible to thieves, it is fragrant of the vine, it breathes of the olive, it gleams with the rose; so that in the vine religion, in the olive peace, in the rose the modesty of consecrated virginity may grow. This is the fragrance which the patriarch Jacob breathed forth, when he deserved to hear: Behold, the fragrance of my son is like the fragrance of a full field (Gen. 27:27). For although the field of the holy patriarch was full of almost all fruits, yet that one produced crops by a greater labor of virtue, this one flowers. And so gird yourself, virgin, and if you wish a garden of this kind to breathe for you, shut it with the prophetic precepts: Set a guard on your mouth, and a door of enclosure about your lips (Ps. 140 (141):3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
An enclosed garden is my sister, bride, an enclosed garden, a sealed fountain. All the teachers agree that in paradise there is both the tree of life, rooted, and the tree of knowledge, by which one may discern good and evil, and the other trees, full of vigor, full of quickening, breathing and rational. From this it is gathered that the earthly paradise itself can be seen to be, not in any soil, but in our ruling part, by which the soul is animated and quickened through the virtues and the infusion of the Holy Spirit. Indeed, Solomon, in the spirit, clearly declared that paradise is in man. And because he expresses the mysteries either of the soul and the Word or of Christ and the Church, therefore he says of the virgin soul, or of the Church, which he wished to present as a chaste virgin to Christ: An enclosed paradise, my sister, bride, an enclosed paradise, a sealed fountain. "Paradise" is the Greek word, in Latin it is called "garden". Indeed, Susanna was in a paradise, and so it is read in Latin; and Adam was in paradise, and so we read. Let it not trouble you, then, that some Latin manuscripts have "garden", others "paradise". There, then, is the chaste wife, where the virgin also is. Although the virgin, set apart, has her own bars and seals, yet both are in paradise, so that, against the heats of the body and the burning of the flesh, she may be cooled by the shady bowers of the virtues.

So paradise is in our ruling part, growing wooded with the plantings of very many opinions, in which God set, in the chief place, the tree of life, that is, the root of piety. For this is the substance of our life, if we render due worship to our Lord and God. He also set there a seedbed of the knowledge of good and evil; for man alone among the other earthly living creatures has the knowledge of good and evil. There are also other diverse plantings there, whose fruits are the virtues. But because the disposition of man, capable of knowledge, was known by God to incline more quickly toward cunning than toward the height of prudence, and since the quality of his own work could not be hidden from that judge who set fixed bounds in our soul, he willed, as the provident author of our salvation, to banish cunning from paradise, and to pour in the zeal for life and the discipline of piety. And therefore he commanded man that of every tree which is in paradise he should eat, but of the tree of the knowledge of good and evil he should not eat. But because every creature is subject to passion, delight therefore crept into human affections as by the gliding of a serpent.

And so not without reason did holy Moses figure delight under the likeness of a serpent; for it lies prone on its belly like a serpent, not walking on feet nor raised on any legs, but slippery with a winding curve, as it were, of its whole body. Earth is its food, as it is the serpent's, since it knows no heavenly food; for it feeds on bodily things, and is changed into various forms of desires, and bends itself into tortuous windings. It has poison in its teeth, by which every luxurious man disembowels himself, the glutton slays himself, the gourmand destroys himself. How many have wines burst, drunkenness dissolved, indigestion distended! Now I understand for what reason the Lord God breathed into the face of man: for there are all the senses, there the seat and the allurement of delight, in the eyes, ears, nostrils and mouth; so that he might make our senses stronger against delight. This, then, like the serpent, poured cunning into us; for it is not delight, but labor and long meditation, with the grace of God, that give perfect prudence. Yet because the inheritance of the human race has been entangled in the frauds of the serpent, let us follow the cunning of the serpent in this: that we do not throw our head into dangers, but guard it whole above all else; and our head is Christ. Let this remain unharmed, so that the poisons of the serpent cannot hurt us: for wisdom is good with an inheritance, that is, with faith; since there is an inheritance of those who believe in the Lord.

But if the first man, who, set in paradise, used to speak with God, could fall so easily, created from virgin earth, which had been formed and created at the word of God by a fresh birth, not yet clotted with parricidal blood and the blood of others, not yet polluted with crimes and disgrace, while our flesh was not yet condemned by the curse of a guilty inheritance: how much more easily afterward has the way, slippery toward sin, brought a greater precipice upon the human race, since the worse has succeeded the more tolerable through the turns of generation! For if the magnet stone has so great a power of nature that it draws iron to itself and transfuses itself into its form, so that, when many who wish to test it have brought several iron rings to that stone, it holds them all in like manner; then, if you bring another ring to the ring to which the stone has clung, and again set one after another in order, although the power of nature passes from that stone into all of them in order, yet it binds the first with a stronger link, the later ones with a looser: how much more has the condition and nature of the human race slipped from a purer state into a worse, the more wicked the generation it has reached! For if nature is diminished through those kinds of things which are not capable of guilt, how much more is its power dulled through minds and limbs polluted with the stain of crimes! Hence, because innocence had been abolished by the victory of malice, there was none who did good, there was not even one. The Lord came, then, to restore the grace of nature, nay rather to increase it; so that where sin abounded, grace might abound the more.

It is clear, then, that God is the author of man, and that God is one, not many gods, but one who made the world, and one world, not many worlds, as the philosophers say. First, then, he created the world, then the inhabitant of the world, to whom the whole world should be a homeland: for if today, wherever a wise man goes, he is everywhere a citizen, everywhere understands things to be his own, nowhere judges himself a foreigner, nowhere a guest, how much more was that first man an inhabitant of the whole world, and, as it is called in Greek, a cosmopolites (citizen of the world), God's newly made companion in converse, a constant fellow citizen of the saints! Planted together with the virtues, set over all the earthly living creatures, those of the sea and those that fly, he thought the whole world his own possession; and the Lord protected him as his own work, and did not abandon him, as a good parent and author. Indeed, he cherished the one he had created so far as to redeem him when disowned, to receive him back when banished, to raise him up when dead by the passion of his only-begotten Son. God, then, is the author of man; and the good worker loves his work, and the good father does not forsake him whom, like a rich householder, he has also redeemed with the wealth of his own inheritance.

Let us beware, then, lest that woman, that is, the passion of our senses, herself deceived and deluded by delight, make effeminate this man, that is, νοῦν (the mind), and, hemming him in, draw him into her laws and judgment. Let us flee delight as a serpent: it has many arts, and most of all in man. For other living creatures are caught by greed for food; man, the more senses of eyes and ears he has, the greater the dangers. And so beware lest the vigor of your mind, bent by a kind of union with bodily pleasure, be softened and dissolved into all its embraces, and open its fountain, which ought to be closed and hedged in by the zeal of attention and the consideration of reason: For an enclosed garden, a sealed fountain. For when the sense of the mind is relaxed, bodily delights, exceedingly pernicious, pour themselves forth and flow into an appetite full of grave danger; delights which the considered watch of a lively mind, had it remained, would have reined in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
In another way, to repeat a little of what was said above (above, ch. 4): An enclosed garden is my sister, bride, an enclosed garden, a sealed fountain. By this it signifies that the mystery ought to remain sealed with you, so that it be not violated by the works of an evil life and by adultery against chastity; that it be not divulged to those for whom it is not fitting; that it be not scattered among the faithless by chattering talkativeness.

Good, then, must be the guarding of your faith, so that the unstained integrity of life and of silence may persevere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
An enclosed garden is my sister, bride, an enclosed garden, a sealed fountain: so that she may not easily open her mouth, nor unseal it for common talk; for it is not fitting, even concerning divine things themselves, unless you answer when you are addressed by the word of God. What have you to do with others? Speak to Christ alone, converse with Christ alone. For if it is written that women should keep silence in the Church (1 Cor. 14:34), how much more unfitting is it for a virgin's door to stand open, how unfitting for a widow's doors to stand open! Quickly does one who lies in wait for modesty creep in, quickly does he catch a word which you would wish to call back. If Eve's door had been shut, Adam would not have been deceived, nor would she, when questioned, have answered the serpent. Death entered through the window, that is, through Eve's door. Death enters through your door if you speak falsely, if shamefully, if wantonly, lastly, if you speak where you ought not. Let the doors of your lips, then, be shut, and let the porch of your voice remain barred, to be unbarred perhaps only when you have heard the voice of God, when you have heard the word of God. Then myrrh will drip for you, then the grace of baptism will breathe upon you, so that you may die with Christ to the elements of the world and rise again with Christ. Why, he says, as though still living, do you make decrees about this world? Do not touch, do not handle, do not taste, things which tend to corruption by their very use (Col. 2:20 ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
