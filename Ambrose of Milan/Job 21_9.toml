[[commentary]]
quote='''
And he added, saying that they have no fear, there is no scourge from the Lord. But the just man says: For I have been scourged all the day, and he desires to be scourged, that he may be received by the Lord, and he wishes to fear God, because the fear of the Lord is the beginning of wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
