[[commentary]]
quote='''
And therefore he added at once: For he himself is my God, my helper, my defender; I shall be moved no more. These things he says, of course, as a man, because we ought to place our hope in God, so as not to slip easily; and yet in saying I shall be moved no more he shows that he has the marks of divine power. For you have him saying elsewhere: Yet once more I will move the earth. He moved it by the flood, when all flesh perished except the ark of Noah; he moved it when Sodom and Gomorrah were consumed by sacred fire. These are signs of the indignation from on high. But since the Lord chose rather to save the human race than to destroy it, he will be moved no more to indignation, he who came for mercy; he came to redeem us with his blood, not to shed ours; he came to offer himself for us and, like a good merchant, to preserve his merchandise by the passion of his own body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For he himself is my God, my helper, my defender; I shall be moved no more. He who slips is moved, because he glides down from a certain station of his integrity and innocence. For one who has once been set on the rock of Christ ought not to have a slippery footing, but to hold the firm ground of his own standing; hence he is called immovable who keeps his will immovable and pursues some purpose with the intent of a faithful mind. For we read also of the immovable will of God, as you have it in Hebrews: In which God, wishing to show more abundantly to the heirs of the promise the immovability of his will, interposed an oath. Rightly, then, is the will of God immovable, for it is moved by the allurements of no sin; men are movable, slippery for sinning, easily led to stray. Then it was said of the Jews: But those passing by blasphemed him, moving their heads, and the Lord himself says in the psalm: All who saw me scorned me, and spoke with their lips and moved their head. Christ is the head of all; it is better, then, that Christ remain in us than that he be moved by any movement of ours. Hence the Jews, moving their heads, said: Away from the earth with such a one; the Gerasenes asked him to depart from their borders; but the Church held him and did not let him go. Therefore she who held him possesses him; those who moved cannot hold him. And finely does the Evangelist say that those passing by moved their heads: passing by, not standing. We stand in the holy courts; we pass by in the streets. The priest passed by, the Levite went past; he stood who tended the wounds that had been inflicted. And therefore those who passed along the way did not say: The blessing of the Lord be upon you; we bless you from the house of the Lord; for the feet of those who bless are standing, not passing by. Then too it is those passing by, not those who stay, who strip the vineyard whose fence has been broken down; those passing by hiss, as we read in the Lamentations of Jeremiah: All who pass by the way have held their hands over you; they have hissed and moved their head over the daughter of Jerusalem. Therefore the priest could not be crowned, nor could the Levite, because they passed by and went past like a shadow; but Stephen was crowned with martyrdom, because he saw the Lord Jesus standing immovable, not passing by. Immovable in faith, then, Stephen saw Christ immovable, and was moved by no fear of death; Stephen did not move himself, nor did Christ move. The sons of the traitor were moved, of whom it is said: Let his sons be shaken and removed, and let them beg; for he who is moved needs a physician. The sinner is needy, the righteous man is rich, because he lacks no good who always seeks the Lord.

And since the discourse has been drawn from there, because he said: I shall be moved no more, David himself shows that to be moved is to be moved to sin, saying: Who has set my soul unto life and has not allowed my feet to be moved. Hence it is also said to a holy man by the Lord our God: But you, stand here with me, since he who is nearest to God cannot be near to a fall. For every sin is wont, as with an adversary's thrust, to throw the mind down from its place and to move it from its own standing; which seems to be drawn either from an enemy or from wrestling. Anger disturbs, lust inflames, envy goads, avarice tortures, fear casts down, grief afflicts. And to Peter it was said by the Lord Jesus: Come behind, after me. He did not say: "Come behind" (for this he said to the devil alone), but: Come behind, after me; for he who is after Christ is not behind. But since Peter was in error, as the Lord himself says to him: For you do not savour, he says, the things that are of God but those that are of men, therefore come after me, so that you may begin to mind not human things but divine. Therefore this righteous man too, who was to be snatched from the earth, says: I shall be moved no more; to be dissolved, indeed, and to be with Christ is far better. For he will not be able to slip who has begun to be with Christ, because death is for the righteous man the end not of nature but of sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
