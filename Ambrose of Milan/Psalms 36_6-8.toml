[[commentary]]
quote='''
Men and beasts you will save, O Lord, as you have multiplied your mercy, O God; but the sons of men hope under the protection of your wings; they shall be inebriated with the plenty of your house, and you will make them drink the torrent of your pleasure. What is "men and beasts"? Rational and irrational, surely. To the rational, judgements; to the irrational, mercy; the ones are ruled, the others are fed. And therefore he added: But the sons of men hope under the protection of your wings, that is: not the generation of vipers, but the sons of men, who live after the image and likeness of God, are placed not in pastures but at banquets; for some are in the place of pasture, others in the privilege of the sacraments; for the imperfect the juice of milk, for the perfect the table of refreshment, of which he said: You have prepared a table in my sight, on which is the living bread, that is, the Word of God; on which is the oil of sanctification, with which the head of the righteous man is made rich and the inner sense is strengthened, so that the oil of the sinner may be abolished; on which also is that inebriating cup, "how glorious" or "how mighty"; for the Greek said κράτιστον, either "powerful" or "strong" or "mighty"; mighty indeed, since by it outrages are washed away or blotted out. Good, then, is the inebriation of the cup of salvation. But there is another inebriation, from the overflow of the Scriptures, and there is yet another inebriation, through the infusion of the Holy Spirit; indeed those who spoke in different tongues in the Acts of the Apostles seemed to the hearers to be full of new wine. The house, then, is the Church; the plenty of the house, the overflow of graces; the torrent of pleasure, the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
