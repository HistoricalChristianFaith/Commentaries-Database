[[commentary]]
quote='''
For it is a heavy labour while we wait for this mortal thing, of which we ought to strip ourselves, to be swallowed up by life; for it is stripped off with less labour than it is swallowed up. And see whether this is not the difference between the one who strips himself and the one who waits for it to be swallowed up by life: grace strips off, penitence swallows up; loftiness of mind strips off, diligence swallows up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
