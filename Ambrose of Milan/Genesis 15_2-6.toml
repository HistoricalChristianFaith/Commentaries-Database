[[commentary]]
quote='''
Yet the holy and prophetic mind has a greater care for a perpetual posterity; for it desires the offspring of wisdom and the inheritance of faith. Therefore he says: What will you give me? But I am sent away without sons. He desired the offspring of the Church, he sought that succession which would be not servile but free, not according to the flesh but according to grace. And so a divine answer of this kind rang out, by which he was taught and heard: Look up to heaven and count the stars, if you can count them. And he said: So shall your seed be. And Abraham believed God, and it was reckoned to him as righteousness. What did he believe? That is: not only the multitude of the peoples believing in Christ, but also the splendour of heavenly grace and the resurrection of immortal life that was to be bestowed on the offspring of the Church. And what does it mean when it says: But he led him outside? The prophet is led outside, as it were, so that he may go out through the doors of the body and the straits of the enclosing flesh, and see the infusion and, as it were, a kind of descent of the Holy Spirit. We too must go out of these straits of our lodging, cleanse the place of our soul from every defilement, cast out the filth of malevolence, if we wish to receive the spirit of wisdom, because wisdom will not enter into a malevolent soul. And Abraham believed, not enticed by the testimony of gold or of silver, but because he believed with the heart unto righteousness. In that in which his merit was proved, in that the reward was paid in full.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
