[[commentary]]
quote='''
And how was the offspring of Abraham spread abroad except through the inheritance of faith, by which we are likened to heaven, joined with the angels, made equal to the stars? Therefore he says: So shall your seed be. And Abraham, he says, believed God. What did he believe? That Christ would be his heir through taking on a body. That you may know that he believed this, the Lord says: Abraham saw my day and rejoiced. Therefore it was reckoned to him as righteousness, because he did not seek a reason but believed with most ready faith. It is good that faith should go before reason, lest we seem to demand a reason from the Lord our God as from a man. For how unworthy it is that we should believe human testimonies about another, and not believe the oracles of God about himself! Let us imitate Abraham, then, so that we may be heirs of the earth through the righteousness of faith, through which he was made heir of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
