[[commentary]]
quote='''
Who was seen by Moses in the bush, unless the firstborn Son of God, who says: I am the God of your fathers, the God of Abraham, the God of Isaac, the God of Jacob? He showed himself to human sight for this reason, that he was to come so as to be seen by all. The bush burned and was not burnt up for this reason, that he was minded rather to burn this earth, which sprouted thorns and briars for us, through the discipline of continence, than to consume it through the hardship of death. Hence the prophet says: Burn my reins and my heart. He revealed, then, a certain sign of a bodily splendour to come, by which this flesh would shine through the resurrection. For what did the harmless fire signify but the lights of those who rise again? Hence the Apostle presumed to say that, as star differs from star in brightness, so also is the resurrection of the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
