[[commentary]]
quote='''
Likewise, when he said to Simeon and Levi, "I will divide you in Jacob and scatter you in Israel," he revealed that they were to be redeemed in the gathering together of the nations. For when the shepherd has been struck down, the flock that was previously brought together is scattered; thus one who did not belong could enter in and all Israel could be saved. And we ought in particular to assume this as regards the tribe of Levi, for it appears that the Lord Jesus traced his origin from that tribe, as concerns his taking on of the body. Of that tribe are the priests Levi and Nathan, and, in the Gospel which he wrote, St. Luke counted them among the ancestors of the Lord. For the Priest of the Father and Chief of all priests, even as it is written, "You are a priest forever," should have laid claim to succession from a priestly line. On this account also Moses blessed this tribe and said, "Give to Levi the lot of his own approbation, and to the holy man his truth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs"

[[commentary]]
quote='''
Hear that the holy prophet Jacob too calls him a bull, when he revealed the Passion of the Lord, whom the Jews afterwards persecuted: In their fury, he says, they hamstrung the bull. And to make plain that he was speaking of the Jews, he added: I will divide them in Jacob and scatter them in Israel. This is the man who wrestled with Jacob and touched his thigh, at which touch the patriarch's sinew grew numb, signifying that he would come from his line according to the flesh, he who was to be hamstrung by the people of the Jews in the passion of his body. Not understanding this mystery, they decreed that the sons of Israel should not eat the sinew. And therefore they cheated themselves of the redemption of the sacred blood, and renounced the benefits of the saving Passion too, so that they do not merit eternal life, because it is written: Unless you eat the flesh of the Son of Man and drink his blood, you will not have life in yourselves. But he who eats my flesh and drinks my blood will have eternal life. Take another point. What is the sinew but that by which the whole body is bound together? The body of Christ is the Church, which is bound by the bond of charity. What else did the Jews loose in Christ but every bond of charity? Rightly is Peter chosen as priest, who bound himself with a threefold spirit of divine charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
