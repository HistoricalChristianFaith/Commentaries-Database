[[commentary]]
quote='''
After the blessing had been solemnly given, the elder brother arrived. By this it is declared that the kingdom was conferred in predestination on the Church before the synagogue, but that the synagogue came in, so that sin might superabound and, when sin had superabounded, grace too might superabound; at the same time it becomes clear that the candidate for the heavenly kingdom ought to be prompt, so as to snatch the blessing beforehand and lay claim to the privilege of his own commendation. Hence the younger son was not censured by his father but praised, for Isaac says: your brother came with guile and took your blessing. For guile is good where the seizing is blameless; and blameless is the seizing done by devotion, because from the days of John the kingdom of heaven is taken by force, and those who use force seize it; for the fathers celebrated the Passover in haste, they who ate the lamb in haste, not lingering, and holy Joseph by the device of a devoted deceit summoned his brother Benjamin and kept him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 3"
