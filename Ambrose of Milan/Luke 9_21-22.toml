[[commentary]]
quote='''
But our Lord Jesus Christ was at first unwilling to be preached, lest an uproar should arise; as it follows, And he straitly charged them, and commanded them to tell no man any thing. For many reasons He commands His disciples to be silent; to deceive the prince of this world, to reject boasting, to teach humility. Christ then would not boast and dost thou boast who art of ignoble birth? Likewise He did it to prevent rude and as yet imperfect disciples from being oppressed with the wonder of this awful announcement. They are then forbid to preach Him as the Son of God, that they might afterwards preach Him crucified.

Perhaps because the Lord knew that the disciples would believe even the difficult mystery of the Passion and Resurrection, He wished to be Himself the proclaimer of His own Passion and Resurrection.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For the Lord Jesus Christ did not wish at first to be preached, lest any din should arise. He rebukes his disciples, that they should tell no one these things: that the Son of Man must suffer many things and be rejected by the chief priests and the elders and the scribes and be killed and rise again on the third day.

And perhaps he added this because the Lord knew that even the disciples would hardly believe in the Passion and the resurrection. And therefore he preferred to be himself the one who bore witness to his Passion and resurrection, so that faith might arise from the deed, not discord from what was heard. So Christ did not wish to glory, but preferred to seem ignoble, that he might undergo the Passion: and do you, who were born ignoble, glory? Must you not go by the same way by which Christ walked, the way by which he himself walked? This is to know him, this is to imitate him, through ill repute and good repute, that you may glory in the cross, as he himself gloried. So Paul walked, and therefore he glories, saying: but far be it from me to glory except in the cross of our Lord Jesus Christ.

But let us see why according to Matthew we find that the disciples were warned to tell no one that he was the Christ, while here it is written that they were rebuked, that they should tell no one these things: that he was to suffer many things and to rise again. You see that in the one name of Christ are all things. For he is the Christ who was born of a virgin, he it is who did wonders among the people, he who died for our sins and rose from the dead. If you take away one of these, you have taken away your salvation. For even heretics seem to have Christ for themselves; for no one denies the name of Christ, but he denies Christ who does not confess all the things that are Christ's. For many reasons, then, he commands the disciples to be silent: to deceive the prince of the world, to shun boasting, to teach humility, and at the same time lest the disciples, still untrained and imperfect, be overwhelmed by the weight of the greatest preaching.

Now let us consider for what reason he commands even the unclean spirits to be silent. But this too Scripture has opened to us, for God said to the sinner: why do you declare my righteous acts? Lest anyone, while he hears him preaching, follow him in his error; for the devil is a wicked teacher, who often mixes false things with true, so as to cover the testimony of fraud with the appearance of truth.

Let us consider this too: whether he here commanded the disciples for the first time to tell no one that he was the Christ, or whether he had commanded it before as well, when he appointed the twelve apostles, declaring to them: do not go away into the ways of the Gentiles, and do not enter into the cities of the Samaritans; but go to the sheep that have perished of the house of Israel. Cure the sick, cleanse the lepers, cast out demons; and: learn who in it is worthy, and stay there. And so not even here does it seem to have been commanded that they should preach Christ the Son of God.

The order of the discussion, then, is an order of teaching; and therefore we too, when any from the Gentiles are called to the Church, ought so to arrange the sequence of precepts that we first teach that there is one God, author of the world and of all things, in whom we live and are and move, whose offspring too we are, so that he is to be loved by us not only for the gifts of light and life but also for a certain kinship of race; then let us destroy that opinion which there is about idols, that the matter of gold and silver or wood cannot have divine power in itself. When you have persuaded them that there is one God, then by his evidence you will establish that salvation was given us through Christ, beginning from the things which he did in the body and describing them as divine, so that he may be seen to have been more than man: death conquered by the power of one, a dead man raised from the dead; for faith grows little by little, so that when he is seen to have been above man he may be believed to be God. For unless you prove that he could not have done those things without divine power, how can you prove that there was divine power in him?

But perhaps too little authority and credit may be granted to us: read the speech the Apostle delivered before the Athenians; if he had wished from the first to destroy the ceremonies of the idols, the ears of the Gentiles would have spurned his speech. He begins, then, from the one God, the maker of the world, saying: God who made the world and all things that are in it. They could not deny that there is one maker of the world, one God, one creator of all things. He added to this that the Lord of heaven and earth does not deign to dwell in things made with hands; then that it is in no way likely that the power of divinity is shut up by the craft of man within the empty matter of gold and silver, teaching that the remedy for error is the zeal of repentance. Then he came to Christ, and yet he preferred to name him not God but man, saying: in the man by whom he has determined faith for all, raising him from the dead. For he who teaches ought to consider the persons of his hearers, lest he be mocked before he is heard. For when would the Athenians believe that the Word was made flesh and that a virgin conceived of the Spirit, they who mocked because they had heard of the resurrection of the dead? Yet Dionysius the Areopagite believed, and others believed in the man, so that they might believe in God. What difference does it make in what order each one believes? Perfect things are not sought at the beginnings, but from the beginnings one comes to the things that are perfect. With such a precept, then, he instructed the Athenians; such an order must be kept by us among the Gentiles.

But when the apostles spoke to the Jews, they said that he was the Christ who had been promised to us by the prophetic oracles; they did not at first, on their own authority, name him the Son of God, but a man approved, a righteous man, a man raised from the dead, that man of whom it was said in the prophets: you are my Son, today I have begotten you. So do you too, for the things that are hard to believe, call in the authority of the divine word, and point out his coming as promised by the voice of the prophets; teach also, by the testimonies of the Scriptures, the resurrection, known long beforehand, not one usual and common with others, so that in the very assertion of the body raised you may gain a testimony of eternal divinity. For when you have proved that the bodies of others underwent corruption after death, you demonstrate that this one, of whom it is said: you will not give your Holy One to see corruption, had no part in human frailty; you prove that he surpassed the deserts of the human condition, and is to be compared with God rather than with men.

But if a catechumen who is approaching the sacraments of the faithful is to be instructed, he must be told that there is one God, from whom all things, and one Jesus Christ, through whom all things; that we must not speak of two Lords; that the Father indeed is perfect and the Son also is perfect, but that the Father and the Son are of one substance; that the Word of God is eternal, not one which is uttered but one which works, begotten of the Father, not produced by the voice. The apostles, then, are forbidden to preach him as the Son of God, so that they might afterwards preach him crucified. This is the glory of faith, if you truly understand the cross of Christ. Other crosses profit me nothing; the cross of Christ alone is useful to me, and truly useful, through which the world is crucified to me and I to the world. If the world is crucified to me, I know that it is dead: I do not love it; I know that it passes away: I do not covet it; I know that corruption will consume this world: I avoid it as foul, I beware of it as a plague, I leave it as something that will do harm.

But some cannot at once believe that salvation was poured back upon the world through the cross. Establish, then, through the history of the Greeks that this was possible. So at times the Apostle too persuades unbelievers, and he does not shun the verses of the poets, so as to destroy the fables of the poets. For if it is called to mind that the histories of the Greeks assert that legions, and often great peoples, were set free by the offered deaths of certain persons; if they remember that the commander's daughter was summoned to sacrifice so that the armies of the Greeks might be carried across; if we consider that word of ours, that the blood of goats and bulls and the ashes of a heifer, sprinkled, sanctify the defiled to the cleansing of the flesh, as is written to the Hebrews; if a pestilence of regions, contracted through the sins of certain men, is asserted to have been dispelled by the death of some one man — something which either prevailed by reason or gained strength by arrangement, so that the cross of the Lord might be believed the more easily — it will be an easy step for those who cannot deny their own things to confirm ours.

But since no man could be so great as to take away the sins of the whole world, neither Enoch nor Abraham nor Isaac — who, though he offered himself to death, was yet preserved, because he could not abolish all sins; for what man is so great that in him the sins of all should die? — therefore not one from the people, not one from the multitude, but the Son of God was chosen by God the Father, who, since he was above all, could offer himself for all. It was fitting that he should die, so that, being stronger than death, he might set others free, having become free among the dead without help, that is, free without the aid of man or of any creature, free from death; and rightly free, he who repelled the slavery of the desires and knew not the bonds of death.
'''
