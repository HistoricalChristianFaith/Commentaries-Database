[[commentary]]
quote='''
(in Luc. vi. 23.) Otherwise; the first kingdom of heaven was promised to the Saints, in deliverance from the body; the second, that after the resurrection they should be with Christ. For after your resurrection you shall begin to possess the earth delivered from death, and in that possession shall find comfort. Pleasure follows comfort, and Divine mercy pleasure. But on whom God has mercy, him He calls, and he whom He calls, beholds Him that called him. He who beholds God is adopted into the rights of divine birth, and then at length as the son of God is delighted with the riches of the heavenly kingdom. The first then begins, the last is perfected.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For the wise man is not broken by the pains of the body nor troubled by misfortunes, but even in hardships he remains blessed. For bodily adversities neither lessen the gift of the blessed life nor take away anything of its sweetness, because the blessedness of life is not in the pleasure of the body, but in a conscience pure from every stain of sin, and in the mind of him who knows that what is good delights, even if it is harsh, while what is unseemly, even if it is sweet, does not soothe. Therefore the cause of living well is not bodily pleasure, but the prudence of the mind. For it is not the flesh, which is subject to passion, but the mind, which judges, because nothing delights more than honourable counsels and beautiful works; the mind, then, is the interpreter of the blessed life. For prudence, or reason, the arbiter of passion, is better than passion, and that which judges is more excellent than that which is subject to judgement. For it cannot be that what is irrational is better than reason. He, therefore, who follows Jesus has his reward in himself, and in his own disposition his prize and grace. Even if he endures hard things, he is nevertheless blessed in his character, blessed in the very dangers, as the Lord defined it, saying: blessed are those who suffer persecution for the sake of justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 7"
