[[commentary]]
quote='''
Pass over like Moses, so that you may see the God of Abraham, Isaac and Jacob, and see the great sight. This is the great sight. But if you wish to see, loose the shoe from your feet: loose every bond of iniquity, loose the bonds of the world, leave behind the shoe, which is earthly. For this reason Jesus sent out the apostles without shoes, gold and silver, or money, so that they might not carry earthly things with them. For he who seeks the good is praised not for his shoe but for the swiftness and comeliness of his feet, as Scripture says: How beautiful are the feet of those who bring good news of peace, who bring good news of good things! Loose, then, the shoe from your feet, so that they may be beautiful for bringing the good news. Loose, he said, not bind. Loose it, so that you may pass over and find that the ungodly man whom you used to admire on earth is nothing and can do nothing. Pass over, then, that is, flee from the earth, where wickedness is, where avarice is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
