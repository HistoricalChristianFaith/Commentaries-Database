[[commentary]]
quote='''
In this night of the world the garment of corporeal life is first to be taken off as the Lord divested himself in his flesh that for you he might triumph over the dominions and powers of this world.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:55"

[[commentary]]
quote='''
Thus what was impossible for the Law is resolved, if we walk in the spirit; thus we bury the passions, if we do not unfasten the cross of this body, if we do not write out again the bond of sin which was blotted out on the cross of Christ, if we do not put on again the garment of the old man which we have put off. For it is written in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I defile them? The members of the body, then, have been mortified for us: why do its vices sprout?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 5"
