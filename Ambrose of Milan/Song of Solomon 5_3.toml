[[commentary]]
quote='''
In this night of the world the garment of corporeal life is first to be taken off as the Lord divested himself in his flesh that for you he might triumph over the dominions and powers of this world.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:55"

[[commentary]]
quote='''
Thus what was impossible for the Law is resolved, if we walk in the spirit; thus we bury the passions, if we do not unfasten the cross of this body, if we do not write out again the bond of sin which was blotted out on the cross of Christ, if we do not put on again the garment of the old man which we have put off. For it is written in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I defile them? The members of the body, then, have been mortified for us: why do its vices sprout?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 5"

[[commentary]]
quote='''
Rightly naked, then, because she lost her cloak; or perhaps naked because it sometimes belongs to virtue not to have a covered breast, not to have a veiled heart. Accordingly, that veiled one, that is, the synagogue, which had a veil in the reading of the Old Testament, a veil which is not lifted, since it is done away in Christ — that veiled synagogue, I say, Christ despised and spurned; whence even today a veil is laid upon the heart of the Jews. But she who is turned to the Lord with her whole mind is naked and open to view. For when anyone has turned to the Lord, the veil will be taken away, so that, beholding the glory of God, we may be able to see. Accordingly, elsewhere too to be naked is a sign of virtue, for it is written: I have put off my tunic, how shall I put it on? I have washed my feet, how shall I defile them?

What tunic, then, she put off and did not find how she might put it on, let us, if we can, reveal from the Scriptures. For there is a bodily tunic; there are coverings woven of desires; and therefore it is sometimes better to be naked in body than veiled in heart. Hence Paul too admonishes us that it is much better to be stripped than to be clothed over, saying also elsewhere: Stripping off the old man with his deeds, put on the new, who is renewed unto knowledge according to the image of him who created him. So she who has been stripped also has her feet washed, and therefore she who has washed does not know how she could be defiled; for through grace she forgets what she had drawn in through nature. Great, then, and just is this love of the woman washing herself before David's palace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 9"
