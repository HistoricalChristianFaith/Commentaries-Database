[[commentary]]
quote='''
In this night of the world the garment of corporeal life is first to be taken off as the Lord divested himself in his flesh that for you he might triumph over the dominions and powers of this world.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:55"

[[commentary]]
quote='''
Thus what was impossible for the Law is resolved, if we walk in the spirit; thus we bury the passions, if we do not unfasten the cross of this body, if we do not write out again the bond of sin which was blotted out on the cross of Christ, if we do not put on again the garment of the old man which we have put off. For it is written in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I defile them? The members of the body, then, have been mortified for us: why do its vices sprout?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 5"

[[commentary]]
quote='''
Rightly naked, then, because she lost her cloak; or perhaps naked because it sometimes belongs to virtue not to have a covered breast, not to have a veiled heart. Accordingly, that veiled one, that is, the synagogue, which had a veil in the reading of the Old Testament, a veil which is not lifted, since it is done away in Christ — that veiled synagogue, I say, Christ despised and spurned; whence even today a veil is laid upon the heart of the Jews. But she who is turned to the Lord with her whole mind is naked and open to view. For when anyone has turned to the Lord, the veil will be taken away, so that, beholding the glory of God, we may be able to see. Accordingly, elsewhere too to be naked is a sign of virtue, for it is written: I have put off my tunic, how shall I put it on? I have washed my feet, how shall I defile them?

What tunic, then, she put off and did not find how she might put it on, let us, if we can, reveal from the Scriptures. For there is a bodily tunic; there are coverings woven of desires; and therefore it is sometimes better to be naked in body than veiled in heart. Hence Paul too admonishes us that it is much better to be stripped than to be clothed over, saying also elsewhere: Stripping off the old man with his deeds, put on the new, who is renewed unto knowledge according to the image of him who created him. So she who has been stripped also has her feet washed, and therefore she who has washed does not know how she could be defiled; for through grace she forgets what she had drawn in through nature. Great, then, and just is this love of the woman washing herself before David's palace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 9"

[[commentary]]
quote='''
I have put off my tunic; how shall I put it on? For in this night of the world the garment of bodily life must first be put off by you; for the Lord put off the flesh from himself, so that for you he might triumph over the dominions and powers of this world. How shall I put it on? See, O soul devoted to God, what she says. So has she put off the acts of the body and earthly ways that she does not know how she could put them on again, even if she wished. How shall I put it on? That is, with what shame, with what modesty, lastly with what memory? For the habit of good has lost the practice of the old depravity.

The soul, hearing Open to me, having a head full of dew, that is, of worldly temptations, was suddenly troubled, and as though about to rise, she who was bidden to rise, she says, since she was fragrant with aloes and myrrh, the badge of burial: I have put off my tunic; how shall I put it on: I have washed my feet; how shall I soil them? For she fears lest she rise again into temptations, lest she return again to guilt and sin, and begin to soil her goings-out and her progress in the virtues with earthly footsteps.

Certainly in this way she also shows the perfection of her virtue, which has merited so great a love of Christ that he comes to her and knocks at her door, and comes with the Father, and sups with that same soul, and she with him, as John the apostle said in the Apocalypse (Rev. 3:20). For when she had heard above: Be present here from Lebanon, and perceived that she could not be present to Christ in the flesh, but would be present then if she were present in the spirit, she conformed herself to his will, so that she too might be conformed to the image of Christ; she no longer feels the cast-off skin of the flesh; now, as though a spirit, stripping herself of union with the body, now as though forgetful, and as one who, even if she wished, could not remember that union, she says: I have put off my tunic; how shall I put it on? For I have put off that tunic of skin which Adam and Eve received after their fault, the tunic of corruption, the tunic of passions: How shall I put it on? She does not seek to put it on, but signifies that it has been so cast away that it could no longer be a garment for her.

I have washed my feet; how shall I soil them? That is, I washed my footsteps while I was going out and lifting myself up from my dwelling together with the body, from that connection and familiarity of carnal embrace: how shall I soil them, so as to return into the enclosure of the body and that dark prison of its passions? So we bury the passions, if we do not undo the cross of this body; if we do not write again the bond of sin which has been blotted out on the cross of Christ; if we do not put on the garment of the old man which we have put off. For it is written in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? The members of the body, then, have been mortified: why do its vices sprout? Therefore the Law did not prevail, because it did not mortify the flesh; therefore it passed away like a shadow, because it did not discolour; and therefore it overshadowed us from the sun of justice, because it heaped up crimes.

Sometimes to be naked is a sign of virtue, for it is written: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? What tunic, then, she put off, and did not find how she might put it on, let us reveal from the Scriptures, if we can. For there is a certain bodily tunic; there are certain coverings woven of desires; and therefore it is sometimes better to be naked in body than veiled in heart. Hence Paul too admonishes us that to be stripped is much better than to be clothed over, saying elsewhere: Stripping off the old man with his deeds, put on the new, who is renewed unto knowledge, according to the image of him who created him. She, then, who has been stripped and has her feet washed does not know how she could not be soiled; for by grace she forgets what she had drawn in by nature.

I have washed my feet; how shall I soil them? You have learned in the Gospel that to wash the feet is a mystery of faith, a mark of humility, according to what is written: If I, the Lord and master, have washed your feet, how much more ought you to wash one another's feet (John 13:14)! But this pertains to humility. As regards the mystery, however, he who wishes to have a part with Christ ought to wash his feet: For if I do not wash, he says, your feet, you will have no part with me (ibid. 8). When this is said to Peter, what is judged of us? He, then, who has washed his feet has no need to wash them again; and therefore let him take care not to soil them.

And rightly does holy Church say: I have washed my feet; she does not say, how shall I wash them again, but how shall I soil them again? As though forgetful of the old stain, forgetful of the contagion, she admonishes us how in a bodily ministry we ought to wash away the spiritual footprint of our actions. And so, when once you have washed your feet in the watering of the eternal fountain and cleansed them by the sacrament of the mystery, beware again the filth of bodily desire, lest your muddy acts be soiled with earthly defilements. These are the feet which David washed in the spirit, who teaches you how you may be unable to soil them, saying: Our feet were standing in your courts, Jerusalem (Ps. 121 (122):2). Here, certainly, understand not the feet of the body, but of the mind; for how would an earthly man have the feet of his body in heaven? Jerusalem, as Paul has taught you, is in heaven; and he too has taught you how you can stand in heaven, when he says: But our way of life is in heaven (Phil. 3:20). A way of life in conduct, a way of life in deeds, a way of life in faith.

I have done judgment and justice; do not hand me over to those who slander me. Where there is justice, there is mercy. Mercy frees from sin. How then am I handed over to sinners? Like this is that saying in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? I have put off the tunic of the sinner and the covering of the earthly man; why am I judged as a sinner and an earthly man? I have washed my feet, so that no lot of sin might cling to my footstep; why do you give power over me to those who transgress?

Jeremiah says in his Lamentations: Your iniquity has come to an end, daughter of Zion; he will not again drive you out: he has visited your iniquities, daughter of Edom, he has laid bare your sins (Lam. 4:22). Do you notice that iniquity could not come to an end without the visitation of God, nor correction be complete except through the grace of the Lord the Savior? But how iniquity comes to an end, hear the Church saying: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I soil them? The garment of the old man, then, woven with the vices of error and laid aside in the washing of regeneration, she does not know how she could put on; for through zeal for correction forgetfulness of sins had grown into her. So great is the force of a completed amendment that she returns to a kind of age of spiritual childhood, which does not know the ways of error; even if she wished, she could not commit a crime, because she has lost the habit of knowing how to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
