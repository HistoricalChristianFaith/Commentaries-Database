[[commentary]]
quote='''
Since, then, the vain hunger for gold profits nothing, because whatever it has gathered slips away, surely those are to be pitied who have forsaken the just way and have forgotten it, the way to which precious stones are by no means to be compared. It is hard to search out, impassable to the proud, shut to the boastful, level for the humbler, open to the wise. And therefore we ought to seek wisdom, that we may walk in the just way, through which that adversary, who like a ravening and roaring lion ranges through this world, could not pass. But let him who wishes to search out wisdom not seek it in the abyss, like the philosophers, who think that they themselves, of their own accord and by their own ingenuity, can know its depths; let him not look for it in the sea — for where there is a tempest, where there is a storm of wind, wisdom cannot be there — but let him seek it there where there is tranquillity of mind and the peace which is above all understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
