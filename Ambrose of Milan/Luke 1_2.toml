[[commentary]]
quote='''
As they handed down to us he says who from the beginning themselves saw and were ministers of the word. This manner of speaking is not fitting, that we should believe there was a ministering of the word rather than a hearing of it. But since it is not the uttered word that is signified but the substantial Word, that Word which was made flesh and dwelt in us, let us understand not a common word but that heavenly Word, to which the apostles ministered. And yet in Exodus it is read that the people saw the voice of the Lord, and certainly a voice is not seen but heard. For what is a voice but a sound, which is not discerned by the eyes but perceived by the ear? But Moses, with the loftiest insight, wished to declare that the voice of God is seen; for it is seen by the gaze of the inner mind; but in the Gospel it is not a voice that is seen but that which is more excellent than a voice, the Word. Hence Saint John the Evangelist too: That which was he says from the beginning, which we have heard and which we have seen, we have looked upon with our eyes, and our hands have searched concerning the Word of life: and the life appeared, and we have seen and we testify and we announce to you concerning the life which was with the Father and appeared to us. You see then that the Word of God was both seen by the apostles and heard. For they saw the Lord not only according to the body but also according to the Word; for they saw the Word who with Moses and Elijah saw the glory of the Word. For these saw Jesus, who saw him in his glory; others did not see him, who could see only the body; for Jesus is seen not with bodily but with spiritual eyes.

Indeed the Jews did not see him, though they were seeing him. Abraham saw him, for it is written: Abraham saw my day and rejoiced. So Abraham saw him, who certainly did not see the Lord in the body; but he who saw in the spirit saw in the body, whereas he who saw in the body and did not see in the spirit did not see, even in the very body, what he was seeing. Isaiah saw him, and because he saw in the spirit, he saw also in the body. Indeed he had he says no form nor comeliness. The Jews did not see him: blinded indeed was their foolish heart. He himself too testifies that he cannot be seen by the Jews, saying: Blind guides, straining out a gnat but swallowing a camel. Pilate did not see him; those did not see him who were crying out: Crucify, crucify him; for if they had seen, they would never have crucified the Lord of majesty. So he who saw God saw Emmanuel, that is, he saw God with us; but he who did not see God with us could not see him whom the virgin bore. Indeed those who did not believe the Son of God did not believe the Son of the virgin either.

What then is it to see God? I do not want you to ask me: ask the Gospel, ask the Lord himself, nay rather, hear him saying: Philip, he who has seen me has seen the Father also, who sent me. How do you say: Show us the Father? Do you not believe that I am in the Father and the Father is in me? Certainly a body is not seen in a body, nor a spirit seen in a spirit, but only that Father is seen in the Son, or this Son is seen in the Father; for unlike things are not seen in unlike things, but where there is unity of operation and of power, both the Son is seen in the Father and the Father in the Son. The works which I he says do, he also does. In the works Jesus is seen; in the works of the Son the Father too is discerned. He saw Jesus who saw that mystery in Galilee, since no one but the Lord of the world could change the elements. I see Jesus when I read that he smeared the eyes of the blind man with clay and restored his sight; for I recognize him who formed man from clay and breathed into him the spirit of living and the light of seeing. I see Jesus when he forgives sins; for no one can forgive sins but God alone. I see Jesus when he raises Lazarus, and those who saw did not see. I see Jesus, I see the Father also, when I lift my eyes to heaven, turn them to the seas, bend them back to the earth; his invisible things indeed are clearly seen, being understood through the things that are made.

As they handed down to us who from the beginning saw and were ministers of the word. There is a twofold virtue in the perfect man, that there be both intention and action. Both virtues, therefore, the holy evangelist ascribes to the apostles; for he says not only they saw, but also they were ministers of the word. Intention belongs to seeing, ministry to action; but the end of intention is action, the beginning of action is intention. And to use the apostles' own example: it is intention that Peter and Andrew, on hearing the voice of the Lord saying: I will make you fishers of men, left the oar without any delay and followed the Word. But action is not at once present in intention. Not even there is there yet action, but intention, where Peter says: Lord, why can I not follow you now? I will lay down my life for you. For there was the intention of suffering, but there was not yet the action, although there was already action in fasts, in vigils, in contempt of bodily pleasures; for this is the action of a Christian. For intention and action are not present together in all things, but while there is action in one matter, there is still intention in another. For Peter himself too, though he had carried through the enduring of many things with apostolic virtue, yet afterwards, when the Lord said to him: Follow me, took up his cross and followed the Word and underwent the action of suffering. But granted that in Peter, Andrew, John and the other apostles there was an equality both of intention and of action:

yet there is sometimes more in intention than in action, or more in action than in intention, as we see in the Gospel that there was a difference between Saint Mary and Martha. For the one was listening to the word, the other was busy about serving. She stood and said: Lord, do you not care that she has left me to serve alone? Tell her then to help me. And he said to her: Martha, Martha, Mary has chosen the best part, which shall not be taken from her. So in the one the zeal of intention overflowed, in the other the ministry of action; yet each had at hand the zeal of both virtues, since Martha too, had she not heard the word, would not have undertaken the ministry, and her action is a token of intention; and Mary gained so much grace from the perfection of both virtues that she anointed the feet of Jesus and wiped them with her hair and filled the whole house with the fragrance of her faith. There is also sometimes the greatest intention and an empty action, as if someone should apply his mind to medicine and, though he has learned all the precepts of healing, should not carry out its duties; and so it comes about that, because the action is empty, the intention too is empty. There is also in some at times a richer action and a thinner intention, as if someone should receive the sacraments of saving baptism and be unwilling to apply his mind to learning the precepts of the various virtues: it often happens that through neglect of intention he loses the fruit of action. Therefore the fullness of both virtues is to be sought, which the apostles were able to attain, of whom he says: who from the beginning saw and were ministers, so that by their having seen the intention of divine knowledge may be understood, and by their having been ministers their action may be declared.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
