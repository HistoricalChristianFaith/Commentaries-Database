[[commentary]]
quote='''
But the Saviour purposely excuses Himself for not working miracles in His own country, that no one might suppose that love of country is a thing to be lightly esteemed by us. For it follows, But he says, Verily I say unto you, that no prophet is accepted in his own country.

But this is given for an example, that in vain can you expect the aid of Divine mercy, if you grudge to others the fruits of their virtue. The Lord despises the envious, and withdraws the miracles of His power from them that are jealous of His divine blessings in others. For our Lord's Incarnation is an evidence of His divinity, and His invisible things are proved to us by those which are visible. See then what evils envy produces. For envy a country is deemed unworthy of the works of its citizen, which was worthy of the conception of the Son of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Amen I say to you that no prophet is accepted in his own country. Envy is betrayed in no small measure, which, forgetful of the love due to fellow citizens, turns the causes of love into bitter hatreds. At the same time by this example and oracle alike it is declared that you would vainly expect the help of heavenly mercy if you envy the fruits of another's virtue; for the Lord is a despiser of the envious, and from those who persecute the divine benefits in others he turns away the miracles of his power. For the acts of the Lord's flesh are an example of his divinity, and his invisible things are shown to us through the things that are visible.

Not idly, then, does the Savior excuse himself for having worked no miracles of power in his own country, lest perhaps anyone should think that our affection for our country ought to be the cheaper. For he who loved all could not fail to love his fellow citizens; but those who envy have disowned for themselves the love of their country; love indeed does not envy, is not puffed up. Nor yet is his country without a share of divine benefits. For what greater miracle than that Christ was born in it? See, then, what evil envy brings. Because of envy the country is judged unworthy for a citizen to work in it, which was worthy for the Son of God to be born in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
