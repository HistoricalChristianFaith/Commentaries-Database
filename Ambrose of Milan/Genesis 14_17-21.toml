[[commentary]]
quote='''
Of Melchizedek we have spoken fully in the moral treatise, in which the mystery too was by no means passed over or left aside; but in this place it is enough to point out only this: that the mind full of prudence and justice is the more devoted to the worship of God, and pays its tithes in him, in fruits according to what the earth brings forth, and according to a loftier prudence, so that it offers to God all the perfection of its senses and works and claims nothing for itself. For it cannot rule itself unless it is propped up by divine favour. Indeed, when it thinks it has conquered, it is tempted and assailed. This the reading expresses and teaches: that our mind must always keep guard against the passions of the body, as though on watch. For what does it mean when it says: The king it says of Sodom went out to meet Abraham and said: Give me the men, but take the horses for yourself, except that after these victories over luxury a certain force of lust can steal upon the rational mind, to pour irrational passions into it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
