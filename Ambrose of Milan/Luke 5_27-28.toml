[[commentary]]
quote='''
There follows the mystical calling of the tax collector, whom he bids follow not by the step of the body but by the affection of the mind. So he, who formerly turned greedily to his profit, from tolls, hard gains from the toils and dangers of sailors, called by a word leaves his own things, he who used to seize the things of others, and abandoning that mean seat walks after the Lord with the whole step of his mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
