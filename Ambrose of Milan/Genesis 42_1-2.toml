[[commentary]]
quote='''
And Jacob said to his sons: Why are you idle? Behold, I have heard that there is grain in Egypt. Go down there and buy food for us. Jacob did not say this once; daily he says it to all his sons who come rather late to the grace of Christ: Why are you idle? Behold, I have heard that there is grain in Egypt. From this grain is the seed that rises again. He, therefore, who endures hunger ought to ascribe it to his own sloth. Behold, he says, I have heard that there is grain in Egypt. Certainly the young are accustomed to hear things sooner than the old, since, being out of doors, many of them go about. But it is the old man who first hears of this trading — but that old man in whom is the long-lived grey hair of faith; the old man is the first to understand, the old man in whom is a venerable old age, and the age of old age is a spotless life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 8"
