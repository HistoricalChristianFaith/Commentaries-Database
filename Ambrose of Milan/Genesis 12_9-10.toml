[[commentary]]
quote='''
The athlete of the Lord is exercised and hardened by adversities. He went off into the desert: famine befell; he went down into Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"

[[commentary]]
quote='''
And Abraham went away and stayed in the desert. The mind is tested when it is in a kind of desert, where there is no wantonness of desires, no abundance of money, no expense of luxury. Would that I could be in this desert, bereft of every incitement of desires, abandoned by every zeal for sinning, stripped of the swelling of boastfulness! But because either God allows us to be tempted or the tempter assails us, when the mind seems to itself to be in the desert, at rest from every craving for earthly pleasures, it is driven into Egypt, where it can be pricked. For our flesh is the goad of the mind, and its passions are our prickings. That is our Egypt, that is, our flesh; that is affliction. Into it our mind goes down when it thinks of the things that are fleshly, but it goes up when it desires things invisible. And therefore Abraham too is said to have gone down into Egypt, that he might be afflicted. Our mind undergoes this: at times it separates itself from the body, it sets itself apart so as to act alone, desiring to attend to and cleave to incorporeal things; at times, because of the binding together of soul and body, it is defiled unto fleshly pleasures, to which the weak mind is subjected, while the stronger is not held by them. Afflictions, then, are crowns to the strong man, and infirmities to the feeble. Hence he too did not fear afflictions, by which he would rightly be tested, who says: For even when we had come into Macedonia, our flesh had no rest, but we were afflicted in all things: fightings without, fears within.

But famine compelled him to go down into Egypt. For a savage famine of the mind arises when the craving of this flesh overflows, so that it seeks the things that are adverse to salvation. For they reduce us to the straits of the body, when desire for what belongs to another creeps in, when luxury is a delight, and boastfulness dear to the heart. We are all tempted. Even the sober spirit is bent; it goes down into Egypt, that is, into the affliction of the body. Yet it goes down in such a way that it seems to dwell there for a time as a stranger, not to possess it as a citizen. For the just man said: I am a stranger in this land, and elsewhere: Woe is me, that my sojourning is prolonged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 4"
