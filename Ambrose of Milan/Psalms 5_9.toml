[[commentary]]
quote='''
An open sepulchre, then, is the throat of man, in which deadly unbelief and dead words are buried, which through age and some incursion of beasts crumbles and falls apart. There is, then, on the contrary, a tomb in the secret places of men, which the righteous man has hewn out for himself with the penetrating Word in hearts of Gentile hardness, polished by the works of faith and doctrine, that the power of Christ might reach out among the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
