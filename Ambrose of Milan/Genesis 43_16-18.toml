[[commentary]]
quote='''
And Joseph saw them, and Benjamin his brother from the same mother. Now the Hebrews are seen, and seen by Christ, who is the true Joseph, when they come with the type of Paul, and he speaks to them gentle and mild words, so that they may take food together. But above, because they came without Benjamin, he did recognize them, but turned away from them, as it is written: And he spoke harsh things to them, because they themselves did not recognize him by whom they were recognized. It was by the merit of Paul, then, that they made progress, whom the Lord Jesus loved more than the other brothers, as a younger brother born of the same mother. Let the Jews observe whom they denied as Lord: he who, though crucified by their synagogue, yet loves them the more as sprung from the same parent, if even late they recognize the author of their salvation. But, conscious of their own offences, they do not believe that the mercy of Christ is so great that he forgives sin and remits injury. And therefore what they would be was prefigured in the patriarchs. They were being invited to grace, they were being called to the banquet of the saving table, and they suspected that a false charge was being prepared against them, that a trap was being laid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 9"
