[[commentary]]
quote='''
Truly in a moment of time, the kingdoms of this world are described. For here it is not so much the rapid glance of sight which is signified as is declared the frailty of mortal power. For in a moment all this passes by, and oftentimes the glory of this world has vanished before it has arrived. It follows, And he said unto him, I will give thee all this power.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the devil led him again onto a very high mountain and showed him all the kingdoms of the world in a moment of time.

Well are worldly and earthly things shown in a moment of time. For it is not so much the speed of the sight that is indicated as the frailty of a perishable power that is expressed; for in a moment all those things pass away, and often the honor of the world has gone before it has come. For what of the world can be lasting, when the ages themselves are not lasting? We are taught here to despise the gusts of empty ambition, because all worldly dignity lies subject to the devil's power, frail for use and empty for fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
