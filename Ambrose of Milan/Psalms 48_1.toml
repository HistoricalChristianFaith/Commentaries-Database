[[commentary]]
quote='''
Its title is this: A psalm of a song for the sons of Korah, on the second of the sabbath. Good are the sons of Korah, and already approved in the earlier psalms, because with fitting thoughts and reflections suited to the pursuit of the virtues they composed a spiritual psaltery within themselves, and, intent upon the knowledge of the divinity from the wakeful lookout of the mind, they were worthy to draw out the secrets of the heavenly mysteries. And therefore, since they had received the duty and office of the psalms to be sung daily before the ark of the Lord, they seem to have been chosen to receive in particular the psalm of a song on the second of the sabbath, to be sung together. For those to whom it was rightly seen to have been entrusted to sing with their voice the ascent of the Lord rising from the dead, to them surely it was due that they should celebrate by their duty and ministry the very day of the resurrection. For what is the second of the sabbath but the Lord's day, which followed the sabbath? Now the sabbath day was later in the order of days, but earlier by the sanctification of the Law. But when the end of the Law came, who is Christ Jesus — for Christ is the end of the Law unto righteousness for everyone who believes — and by his resurrection sanctified the eighth day, the same day began to be first which is the eighth, and the eighth which is the first, having its precedence from the order of number and its holiness from the resurrection of the Lord. Hence we also read in the Gospel of the δευτερόπρωτον sabbath, which in Latin is called "secundoprimum" [second-first]. For when the Lord's day, on which the Lord rose again, began to excel, the sabbath which had been first began to be reckoned second after the first; for the first rest ceased, and the second succeeded it. Hence the Apostle too, writing to the Hebrews, says: On a later day, therefore, there remains a rest for the people of God. Let us hasten, then, to enter into that rest.

The true rest, then, lies no longer in the ceasing from work but in the time of the resurrection. And so those who kept the solemnity of the sabbath according to the Law called it the one of the sabbath, as though there were one sabbath and not another. We, who have put on a spiritual observance and desire to shape our warfare after the likeness and the rest of God, and to render our service in that heavenly city where there is no copy, no shadow, but truth, say the first of the sabbath, as it is written: But in the evening of the sabbath, which dawns into the first of the sabbath. Nothing is more beautiful, nothing more explicit. Before the resurrection he said 'sabbath'; after the resurrection he called it 'the first of the sabbath'. John the Evangelist also says: On the first of the sabbath Mary Magdalene came in the morning, while it was still dark: darkness for the time, morning for grace. But these spoke more explicitly, according to the Gospel, as though the veil had been drawn back; David, on the other hand, placed under the Law, both kept the moderation of due caution and did not suppress the mystery, so that he declared the Lord's day as the second of the sabbath, whereby he might both reckon the order of the number to be kept for the Jews and recognize the spiritual sacrament as revealed. Let us hear, then, what he says who sings psalms to God on the second of the sabbath.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Great, he says, is the Lord and exceedingly to be praised in the city of our God, in his holy place. Is God not, then, great and to be praised everywhere? He is indeed great and mighty everywhere, but a narrow mind does not grasp the greatness of his divine power and grace. Yet the nearer our knowledge draws to God, the more surpassing his majesty seems to us. Thus Thomas, who before was saying: Unless I see in his hands the print of the nails and put my hand into his side, I will not believe, when he put in his finger and recognized the evident signs of the resurrection, marvelling within himself at the grace of God: My Lord, he says, and my God. Then, therefore, he most fully confessed his divinity and lordship, when he did not doubt that he had risen from the dead. Thus a hymn befits God in Zion, and a vow is paid to him in Jerusalem. What wonder, then, if in the heavenly city and in that supernal and ethereal place his might is proclaimed more mightily?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
