[[commentary]]
quote='''
He says himself, "I am a flower of the field, a lily of the valleys, as a lily among brambles." Consider, then, another place in which the Lord likes to reside, and not only one place but many. He says, "I am a flower of the field," because he often visits the open simplicity of a pure mind;"and the lily of the valleys," for Christ is the bloom of lowliness, not of luxury, voluptuousness, of lasciviousness, but the flower of simplicity and lowliness. "A lily among brambles" as the flower of a good odor is sure to grow in the midst of hard labors and heartfelt sorrow (since God is pleased with a contrite heart).
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:51"

[[commentary]]
quote='''
Nor let anyone think it incongruous that angels are compared to lilies, since Christ himself has called himself a lily, saying: I am the flower of the field and the lily of the valleys. And well is Christ a lily, because where the blood of martyrs is, there is Christ, who is the lofty flower, spotless, harmless, in whom no roughness of thorns gives offense, but grace poured around him shines forth; for roses have thorns, because martyrs have torments. The divinity that cannot be struck has no thorns, for it did not feel torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
And the mind is in its vigour when a flower, too, is seen on the earth. Who is this flower of good fragrance but he who said: I am the flower of the field and the lily of the valleys? Of whom it is also written in Isaiah: A rod shall come forth from the root of Jesse, and a rod shall rise up from the root, and a flower shall come forth from the rod. The root, surely, is the family of the Jews, the rod Mary, the flower of Mary Christ; and when he shines forth in our earth and is fragrant in the field of the soul or blooms in his Church, we can neither fear the cold nor dread the rain, but can await the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"

[[commentary]]
quote='''
I am the flower of the field, and the lily of the valleys, as the lily in the midst of thorns; for the faith of the believing people has gone out into the whole earth, and Christ has set his feet in a broad place; and therefore he beautifully says that he is the flower of the field. Paul too was a flower, who said: We are the good fragrance of Christ to God (2 Cor. 2:15). And truly a flower, who could bring forth things new and old from the treasure of his heart. I am the flower of the field. And well is the Church a flower, which announces the fruit, that is, the Lord Jesus Christ, of whom it was said to Mary: Blessed are you among women, and blessed is the fruit of your womb (Luke 1:42).

In another sense also I show you a flower to be plucked, namely him who said: I am the flower of the field, and the lily of the valleys. Many think this comparison more fitting according to the nature of the flower and the habit of the plant set before us; because lilies require no tending of yearly cultivation, nor, as for the yield of the other fruits, so also for the generation of this flower, does labour come round in its cycle, plied by anxious husbandmen; for in whatever droughts of the field, all that is nourished into the flower is quickened by a certain generative power from itself, and within itself by a sap that is ever green; so that when you see that the stalk of the young leaves has withered, the nature of the flower nevertheless stays green; for its greenness is hidden, not lost. But when it has been called forth by the caresses of spring, it resumes the garment of its shoot, the tresses of its flower, or the adornments of the lily.

It is a delight also to observe that lilies are produced not in the rough places of the mountains and the untilled parts of the woods, but in the pleasantness of gardens. For there are certain gardens bearing the fruit of diverse virtues, according to what is written: An enclosed garden, etc. (Song 4:12), because where there is integrity, where chastity, where religion, where the faithful silence of secrets, there is the brightness of angels, there are the violets of confessors, the lilies of virgins, the roses of martyrs. Well is Christ a lily, because where the blood of martyrs is, there is Christ, who is the sublime flower, spotless, harmless, in whom no roughness of thorns gives offense, but grace poured around him shone forth. For the thorns belong to roses, and they are the torments of martyrs; the unharmed Godhead, which did not feel torments, has no thorns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Otherwise: I am the flower of the field, and the lily of the valleys, as the lily in the midst of thorns. Behold another place in which the Lord is wont to dwell, nay, not in one, but in many: I, he says, am the flower of the field; because he frequents the open simplicity of a pure mind. And the lily of the valleys; for Christ is the flower of humility, not of luxury, not of pleasures and wantonness, but the flower of simplicity, the flower of humility. A flower keeps its fragrance even when cut, increases it when crushed, and does not lose it when plucked; so too the Lord Jesus on that gibbet of the cross neither withered when crushed nor vanished when plucked, and, cut by that piercing of the lance, he bloomed more beautiful with the sacred colour of the blood poured out, himself not knowing how to die, and breathing out on the dead the gift of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
