[[commentary]]
quote='''
He says himself, "I am a flower of the field, a lily of the valleys, as a lily among brambles." Consider, then, another place in which the Lord likes to reside, and not only one place but many. He says, "I am a flower of the field," because he often visits the open simplicity of a pure mind;"and the lily of the valleys," for Christ is the bloom of lowliness, not of luxury, voluptuousness, of lasciviousness, but the flower of simplicity and lowliness. "A lily among brambles" as the flower of a good odor is sure to grow in the midst of hard labors and heartfelt sorrow (since God is pleased with a contrite heart).
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:51"

[[commentary]]
quote='''
Nor let anyone think it incongruous that angels are compared to lilies, since Christ himself has called himself a lily, saying: I am the flower of the field and the lily of the valleys. And well is Christ a lily, because where the blood of martyrs is, there is Christ, who is the lofty flower, spotless, harmless, in whom no roughness of thorns gives offense, but grace poured around him shines forth; for roses have thorns, because martyrs have torments. The divinity that cannot be struck has no thorns, for it did not feel torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
