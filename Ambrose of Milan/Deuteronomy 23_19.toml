[[commentary]]
quote='''
[Scripture] orders money to be returned without usury. It is a mark of kindly feeling to help one who has nothing. It is a sign of a hard nature to extort more than one has given. If one has need of your assistance because he has not enough of his own wherewith to repay a debt, is it not a wicked thing to demand under the guise of kindly feeling a larger sum from him who has not the means to pay off a lesser amount?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FON%2520THE%2520DUTIES%2520OF%2520THE%2520CLERGY%2FBook%25203.html'
source_title="On the Duties of the Clergy 3.3.20"

[[commentary]]
quote='''
In Deuteronomy also it is written: Thou shalt not require from thy brother usury for money and usury for food and usury for any thing, whatever thou hast lent to thy brother. If thou entrust it to the stranger thou shalt require usury of him. But from thy brother thou shalt not require it. You see how great weight there is in the words; do not, it says, require usury from thy brother. That is, do you require usury from him with whom you ought to have all things in common? Your brother is your sharer in nature and your co-heir in grace. Do not ask more from him, from whom it is harsh to require what you have given unless he has whence he may pay it.

And because many, avoiding the precepts of the Law, when they have given money to merchants, do not require usury in money, but through their wares receive as it were the benefits of usury, let them likewise hear what the Law says: thou shalt receive, it says, neither usury for food nor for anything, whatever thou hast lent to thy brother. For that is fraud and circumvention of the Law, not its observance. And do you think you are acting piously because you receive as it were a loan from the merchant? Thereby he commits fraud in the price of his goods from which he pays usury to you. You are the cause of this fraud, you are a partner; whatever he gets by fraud is to your profit. Food too is usury and clothing is usury, and whatever is added to capital is usury. Whatever name you wish to put upon it, it is usury. If it is lawful, [why do you shun the name,] why do you throw a cloak over it? If unlawful, why do you seek gain?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 14"
