[[commentary]]
quote='''
Now if some woman looked on him with wanton eyes, the crime is hers alone who looked wrongly, not his who would not wish to be looked at wrongly; nor is there guilt in his being seen. It was not in the slave's power not to be seen: the husband ought to have guarded against his wife's eyes. If the husband feared nothing about his wife, Joseph held this to be a testimony to chastity, not a licence for carelessness. Yet let men too learn to guard against the eyes of women; even those who do not wish to be loved are passionately loved. And so Joseph was passionately loved, who would scorn the woman who loved him. And Scripture excused him well, saying: The wife of his master cast her eyes upon Joseph, that is: he did not display himself, nor did he catch her off her guard, but she cast her own nets and was caught in her own toils, she spread her own snares and stuck fast in her own bonds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
