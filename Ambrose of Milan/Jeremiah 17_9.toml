[[commentary]]
quote='''
The apostle says, "For God, sending his own Son in the likeness of sinful flesh, and for sin condemned sin in the flesh, that the righteousness of the law might be fulfilled in us." He does not say "in the likeness of flesh," for Christ took on himself the reality, not the likeness, of flesh. Nor does he say in the likeness of sin, for he did not sin but was made sin for us. Yet he came "in the likeness of sinful flesh." That is, he took on him the likeness of sinful flesh, the likeness, because it is written, "He is man, and who shall know him?" He was man in the flesh, according to his human nature that he might be recognized, but in power he was above humanity, that he might not be recognized, so he has our flesh but has not the failings of this flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Repentance%2FBook%25201.html'
source_title="Concerning Repentance 1.3.12"


[[commentary]]
quote='''
Words do not prejudice power; the divine substance is upheld by its own strength: man is seen, man is heard, God is recognized in his works. And yet of this man it is said: He is both man, and who shall know him? What is "who"? Not that no one does, but that someone rare does, someone wise, as in that saying: Who shall ascend into the mountain of the Lord? Who is wise, and shall understand these things? Finally, elsewhere: The foolish man shall not know, and the stupid shall not understand these things. You, then, when you read the Gospel, as one wise and not foolish, know what you read; let the brightness of eternal wisdom enlighten you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
