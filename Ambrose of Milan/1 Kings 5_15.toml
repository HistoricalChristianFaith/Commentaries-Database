[[commentary]]
quote='''
It is written of the temple of God which Solomon built, in which there was a type of the Church, that there were seventy thousand who carried on their shoulders and eighty thousand stonecutters. Let those angels come, let the stonecutters come, let what is superfluous in our stones be hewn away, let the rough places be made smooth; let those also come who carry on their shoulders; for it is written: They shall be carried upon shoulders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
