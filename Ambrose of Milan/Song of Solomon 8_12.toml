[[commentary]]
quote='''
Kept, then, and fenced round with a spiritual defense, this vineyard gives a thousand fruits to Christ, and two hundred fruits to the keepers; and therefore the Church says:

My vine is in my sight: a thousand for Solomon, and two hundred for those who keep the fruit. The perfection and fullness of Christ is the portion of the little ones. You have this mystery in Genesis, where Joseph gave five portions to his younger brother Benjamin, single ones to the other brothers (Gen. 43:34). To the Lord, then, is assigned the portion and prerogative of the five senses, which he himself surely grants to the one whom he loves, as he loved Paul too, to whom he gave the primacy of wisdom for calling the Gentiles. Here let fear depart from sacred virgins, to whom the Church first grants such great defenses, she who, anxious for the success of her tender offspring, herself grows up like a wall with breasts abounding in the manner of towers: until, the onset of the enemy's siege having been broken, she gains peace for her strong youth by the protection of her motherly strength. Whence the Prophet too says: Let there be peace in your strength, and abundance in your towers (Ps. 121 (122):7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
