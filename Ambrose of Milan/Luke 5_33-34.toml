[[commentary]]
quote='''
Or, That fast is not given up whereby the flesh is mortified, and the desires of the body chastened. (For this fast commends us to God.) But we cannot fast who have Christ, and banquet on the flesh and blood of Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
This medicine does not cut off hunger, but supplies food to the soul. There came indeed the Son of Man eating and drinking, and they say: He has a demon; and therefore our mind is not fasting. They fast from whom Christ is absent and who lack the riches of good merits; but he for whom virtue suffices by its own delight, who receives Christ in his own house, holds a great banquet, that is, the spiritual banquet of good works, which the rich people lacks and on which the poor feasts. And therefore, he says, the sons of the bridegroom cannot fast, as long as the bridegroom is with them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
