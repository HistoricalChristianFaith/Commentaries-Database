[[commentary]]
quote='''
And so, showing that she loves not only the outward form of the Word and a certain countenance, but all that is within him, she adds to the grace of the kisses: for better she says are your breasts than wine, and the fragrance of your ointments than all spices. She asked for a kiss; God the Word poured himself wholly into her and laid bare to her his breasts, that is, his doctrines and the teachings of inner wisdom, and was fragrant with the sweet fragrance of his ointments. Captivated by these, she says that the delight of divine knowledge is richer than the gladness of all bodily pleasure. For in the Word there breathes the fragrance of grace and the remission of sins, which, poured out over the whole world, has filled all things as with an ointment emptied out, because the heavy filth of vices has been wiped away from all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
