[[commentary]]
quote='''
But let the discourse return to him from whom it departed. David triumphed in ten thousands, but he erred in twenty thousands and more; and, because he erred, he recognized that he was a man, confessed his guilt, and begged for pardon, saying to the Lord: Lord, do not rebuke me in your anger, nor chastise me in your wrath. Have mercy on me, Lord, for I am weak. If David was weak, are you strong? If Solomon fell, are you immovable? If Paul was the first of sinners, can you be the first of saints? So if these erred, they erred as men, but they acknowledged their sin as just men. If the just received the sentence of a harsher punishment, how do you set before yourself a hope of impunity, when Scripture says: If the just man is scarcely saved, where will the sinner and the ungodly appear?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
