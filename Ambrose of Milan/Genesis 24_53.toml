[[commentary]]
quote='''
When this was obtained, he gave vessels of gold and silver and clothing to Rebecca. When the Church was betrothed, she received vessels of gold and silver, in which the treasure of faith might be; for there are vessels for honour, and there are also vessels for dishonour. Hear what the vessels are: We have a treasure in earthen vessels. Our bodies are earthen vessels, our faith is the treasure. And perhaps even the very bodies that hold the treasure are now golden, because they are full of prudence, and silver, because they seem to shine with the utterances of the heavenly command. And the parents too are honoured with gifts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
