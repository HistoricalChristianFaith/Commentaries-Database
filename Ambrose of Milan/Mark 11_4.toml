[[commentary]]
quote='''
(in Luc. 9, 6) Or else, they found it bound before the door, because whosoever is not in Christ is without, in the way; but he who is in Christ, is not without. He has added in the way, or in a place where two ways meet, where there is no certain possession for any man, nor stall, nor food, nor stable; miserable is his service, whose rights are unfixed; for he who has not the one Master, has many. Strangers bind him that they may possess him, Christ looses him in order to keep him, for He knows that gifts are stronger ties than bonds.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Mark brought in the colt tied before the door, because whoever is without Christ is outside, in the road, but he who is in Christ is not outside. He added in the thoroughfare, where no one has a sure possession, no manger, no food, no stable. Wretched is the servitude whose right is unsettled; for he who does not have one master has many. Strangers tie up so as to possess; this one looses so as to hold; for he knows that gifts are stronger than chains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
