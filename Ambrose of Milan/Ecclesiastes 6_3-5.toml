[[commentary]]
quote='''
For what is there in this life to delight us, full as it is of hardships and anxieties, in which there are countless false accusations and many troubles and many tears of those who are afflicted by troubles, and there is none, he says, to comfort them? And therefore Ecclesiastes praises the dead more than the living, and better, he says, than these two is he who has not yet been born, who has not seen this evil. And elsewhere the same Ecclesiastes declared that one whom his mother cast out in a miscarriage is better than a long-lived man, because he has not seen these evils which happen in this world, nor come into this darkness, nor walked in worldly vanity, and therefore he who has not come into this life will have more rest than he who has come. For what good is there for a man in this life, who lives in a shadow and cannot be filled with his desires? And if he is filled with riches, he loses the fruit of repose, because he is forced to guard what he has sought with wretched greed, so that he possesses the more wretchedly riches that will be of no profit to him. For what is more wretched than to be tormented by guarding riches whose abundance profits nothing?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
