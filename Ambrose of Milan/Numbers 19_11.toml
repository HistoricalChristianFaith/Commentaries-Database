[[commentary]]
quote='''
Hear that this region is that of the dead: If anyone, then, touches a dead man, he will be unclean; and every unjust man is unclean in the sight of the Lord. If anyone, then, touches iniquity, he will be unclean; if anyone lives in pleasures, he is dead, since she who lives in pleasures is dead. And those who are unbelievers go down alive into hell: even if they seem to live with us, yet they are in hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
