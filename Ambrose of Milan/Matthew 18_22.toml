[[commentary]]
quote='''
Now the sabbath is not only of days but also of months, and therefore on the tenth day of the seventh month there is the sabbath of sabbaths; and not only of months but also of years, and not of years only but also of generations, and finally of the world itself, of which the great sabbath is a type, as in the law there is the seventh week, after which the year of jubilee is celebrated. This mystery the Lord willed to reveal to us when he says: Not only seven times, but also seventy times seven, because in the seventh generation, as you have it according to Luke, Enoch was carried off, lest wickedness should change his heart, and in him the sting of sorrow came to rest. But in the seventy-seventh generation the Lord was born of Mary, and taking upon himself the sins of the human race he granted remission of all offenses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
