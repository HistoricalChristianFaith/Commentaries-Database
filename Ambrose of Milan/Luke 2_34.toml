[[commentary]]
quote='''
Behold what abundant grace is extended to all men by the birth of the Lord, and how prophecy is withheld from the unbelievers, not from the righteous. Simeon also prophesies that Christ Jesus has come for the fall and rising again of many.

That is, to distinguish the merits of the just and the unjust, and according to the quality of our deeds, as a true and just Judge, to decree punishment or rewards.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You see the abundant grace of the Lord poured out upon all by his birth, and that prophecy was denied to the unbelieving, not to the just. Behold, Simeon too prophesies that the Lord Jesus Christ has come for the fall and the rising of many, to distinguish the merits of the just and the wicked and, as a true and just judge, to decree either punishments or rewards according to the quality of our deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
