[[commentary]]
quote='''
What need was there, then, for the Law to be promulgated, if it was not going to profit? We already had the law of nature; each one was a law to himself, who had the work of the law written in his heart. That law we did not keep: why was a second one added as well, by whose works the flesh could not be justified? A bond was added, not a release; there was added the recognition of sins, not their remission. We have all sinned, we who could have put forward the excuse of ignorance: the mouth of all has been stopped.

Yet it profited me. I began to confess what I used to deny, I began to recognize my offence and not to cover up my injustice, I began to declare my injustice against myself to the Lord, and you forgave the impieties of my heart. But this too profits me, that we are not justified by the works of the Law. I have, then, nothing for which I could glory in my works, I have nothing for which to boast of myself, and therefore I will glory in Christ. I will not glory because I am just, but I will glory because I have been redeemed. I will glory not because I am empty of sins, but because my sins have been forgiven me. I will not glory because I have been of profit, nor because anyone has been of profit to me, but because Christ is an advocate for me with the Father, because the blood of Christ was shed for me. My guilt has become for me the reward of redemption, through which Christ came to me. For my sake Christ tasted death. Guilt is more fruitful than innocence. Innocence had made me arrogant; guilt has made me submissive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 6"

[[commentary]]
quote='''
Now the law is twofold, natural and written: natural in the heart, written on tablets. All, therefore, are under law, but under the natural law; but it does not belong to all that each one should be a law to himself. He is a law to himself who does of his own accord the things that are of the law and shows the work of the law written in his heart. You have what the good things of the law are, which, however, we ought not only to know or to hear perfunctorily, but also to do; for not the hearers of the law are just before God, but the doers of the law shall be justified; you have learned also what the evil things are. First, nature itself is the teacher of good work. You know that one must not steal, and if your servant has committed a theft against you, you beat him; and if anyone has made advances to your wife, you think he must be prosecuted. What, then, you blame in others, you commit yourself: you who preach that one must not steal, steal; you who say that one must not commit adultery, commit adultery. There followed also the Law which was given through Moses, and through the Law the knowledge of sin. You have received also what you should avoid, and you do the things which you know are forbidden. And what does the Law work, except that the whole world should become subject to God? For it was enacted not only for the Hebrew, but it also called the stranger, since it did not shut out the proselyte. But since the Law was able to stop the mouths of all and was not able to convert the mind, therefore the last remedy of that final city was owed, in which there should be a saving refuge, so that the death of the prince of priests might free us from all dread of death and strip us of fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 3"
