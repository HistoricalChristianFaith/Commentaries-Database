[[commentary]]
quote='''
The Angel, when he announced the hidden mysteries to the Virgin, that he might build up her faith by an example, related to her the conception of a barren woman. When Mary heard it, it was not that she disbelieved the oracle, or was uncertain about the messenger, or doubtful of the example, but rejoicing in the fulfilment of her wish, and consicentious in the observance of her duty, she gladly went forth into the hill country. For what could Mary now, filled with God, (plena Deo) but ascend into the higher parts with haste!

The grace of the Holy Spirit knows not of slow workings. Learn, ye virgins, not to loiter in the streets, nor mix in public talk.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Mary, rising up in those days, went into the hill country with haste, to a city of Judea, and entered the house of Zechariah and greeted Elizabeth.

It is a moral rule for all that those who demand faith should support faith. And so the angel, when he announced hidden things, so that faith might be supported by an example, announced to the virgin Mary the conception of an older and barren woman, so as to assert that everything that pleases God is possible to him. When Mary heard this, not as unbelieving of the oracle, nor as uncertain of the message, nor as doubting the example, but as joyful for her wish, devout for her duty, hastening for joy, she went into the hill country. For whither should she, already full of God, make with haste but to the heights? The grace of the Holy Spirit knows no slow efforts.

Learn you too, holy women, the diligent care you ought to show to kinswomen who are with child. Mary, who before kept alone in the innermost rooms, was held back neither from going in public by virginal modesty, nor from her zeal by the roughness of the mountains, nor from her duty by the length of the journey. Into the hill country with haste the virgin, the virgin mindful of duty, unmindful of hardship, with affection, not her sex, prevailing, left her home and went on her way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
