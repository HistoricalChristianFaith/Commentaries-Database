[[commentary]]
quote='''
Him, then, I would call the more blessed when he was sent into prison, because he was undergoing martyrdom for chastity. For purity is a good gift, but of lesser merit when it carries no danger; but where it is defended even at the peril of one's life, there it is crowned more fully. With his case unheard, with the truth of the matter unexamined, Joseph is sent to prison as one guilty of a crime, but the Lord did not desert him even in prison. Let the innocent not be troubled when they are assailed with false charges, when, with justice overborne, they are thrust into prison. God visits his own even in prison, and so there is more help there where there is more danger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
