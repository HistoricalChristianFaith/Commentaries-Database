[[commentary]]
quote='''
And why should I use the judgments of others? The well fed and luxurious, let us hear what they hope for themselves. For Isaias, the prophet, represents them as saying: Let us eat and drink; for tomorrow we shall die; and justly he exclaimed, Howl ye ships of Carthage, because they have perished and will be no more. This is said of the vision of Tyre, which we know was an extravagant city. And therefore the vision is the ninth, not the seventh or the eighth; because it observes neither the law nor the grace of the Gospel, since it was forbidden to kindle the fires of passion on the Sabbath of the Law, and according to the sequence of the Gospel, the eighth day dawns as the Day of the Resurrection. Moreover the first and the eighth day are the same, because the Lord's day returns to itself. Luxury, therefore, possesses neither faith nor the observance of discipline; luxury is the seedbed and origin of vices. And do not think that I have spoken contrary to the Apostle because he says that avarice is the root of all evils, since luxury is the mother of avarice itself. For when anyone has exhausted his own wealth by dissolute living, afterwards he seeks compensation through avarice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 19"
