[[commentary]]
quote='''
This the Apostle Paul too disclosed, asserting that while we are in the body we sojourn away from the Lord, because, even if faith is in us, by faith, however, we walk, not by sight, that is, not face to face as if present; for we still walk in an enigma, not in truth. Indeed he added: We dare, then, and we trust, rather to sojourn away from the body and to be present with the Lord. "We dare" is a word of the boldness of faith in God, not of rashness; and "we trust", that is: we acquiesce willingly and longingly; not resting the authority of fuller knowledge principally on our own judgement, as it were, we wish what we desire to be true: that we may draw near to the Lord, from whom the distance between things to come and things present seems to separate us. We dare, then, to be present, and therefore, he says, we strive. You recognize the word of one who still wishes to arrive, not of one who has arrived; it is the affection, then, not the effect, that is shown in this word. Indeed, question the very affection of his speech, nay, hear him saying it, or rather hear him doubting, when he says: Therefore we strive, whether absent or present, to please him: absent still, through faith; present, through sight. Hence this too can be understood, that both placed here and there we desire to please our judge, who is also the redeemer of our souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
