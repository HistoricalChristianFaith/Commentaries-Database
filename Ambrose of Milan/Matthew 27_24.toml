[[commentary]]
quote='''
Nor was there lacking one to wash his hands, saying: I am innocent of the blood of this righteous man; in which Pilate did not cleanse himself but defiled and entangled himself, and did not get himself free. For although there is no weight in the judgements of the lost, yet there is a greater bond in their confessions. For the righteous are acquitted not by another's sentence but by their own life; the unrighteous bind themselves more strongly by their own words, they who cannot bind others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
