[[commentary]]
quote='''
David interrogates, as I said, saying to the Lord: As the hart longs for the springs of waters, so my soul longs for you, O God. My soul has thirsted for the living God. When shall I come and appear before the face of God? The holy man burns and cannot contain himself — for the magnificence of the mind is greater than the magnitude of any body — and, secure of his merit, he longs to fly away from earth to heavenly things, as he himself also says elsewhere: Who will give me wings like a dove: and I will fly and be at rest. For here are snares, by which the just man, even if he is not entangled, is nevertheless hindered; here are pains and cares, there joy, where grace is; here, finally, are the chains of the body, which Paul longed to loose, so that, stripped of all hindrances, he might stand free before the Lord. This, then, was what the soul of David thirsted for: that he might see God no longer through faith but face to face, and not only be absent from the body but be released from the body; for to be dissolved and to be with Christ is much better, because to the just man to die is gain. And it is indeed great gain to be without sin, not to be moved by the allurements of offences. For who is clean from filth, when not even the life of one day of man on earth is free from the contagion of offences? By living, therefore, we incur losses of innocence; by death we obtain an end of error. Gain, therefore, is acquired by death, but by the use of life, as for wretched debtors on an interest-bearing bond, the interest is increased unto guilt. And well does the soul thirst which hastens to the spring, not of this water, but of eternal life, of which he said above: For with you is the spring of life, and in your light we shall see light. Rightly, therefore, David hastened to arrive and to appear before the face of God, whose countenance is light, because the Lord enlightens all on whom he looks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 2"
