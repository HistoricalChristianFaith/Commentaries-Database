[[commentary]]
quote='''
Hear what is good: Deep calls on deep at the voice of your cataracts, that is: the Scripture of the Old Testament summons the course of the New Testament to the consummation of sanctification and the fullness of grace, with a certain sound and outpouring of spiritual overflow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
