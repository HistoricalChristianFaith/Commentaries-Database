[[commentary]]
quote='''
Hear what is good: Deep calls on deep at the voice of your cataracts, that is: the Scripture of the Old Testament summons the course of the New Testament to the consummation of sanctification and the fullness of grace, with a certain sound and outpouring of spiritual overflow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Not undeservedly, therefore, did abyss call upon abyss, that this mountain might become small, of which the prophet says: Abyss calls upon abyss at the voice of your cataracts. The Old Testament did not avail for the redemption of this world: it called upon the New Testament and, as it were, summoned it to its aid. The Law cried out, announcing the Gospel. For it was half-full, and therefore it was necessary that he should come who would fulfil the Law. For Christ is the end of the Law unto justice for everyone who believes, he who came to fulfil the Law, not to destroy it. How the Law is an abyss, hear him saying: Your judgments are like a great abyss. At the same time understand from this that both are the testament of one wisdom, which he came to fulfil as his own. And by the cataracts we understand the depths of the words and the force of the heavenly utterance, which have flowed down to us like rain from heaven. Christ, therefore, and the divine Scripture are the remedy of all wearinesses and the one refuge in temptations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 4"
