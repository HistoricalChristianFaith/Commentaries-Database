[[commentary]]
quote='''
Accordingly, when the Lord says: Why did you not put my money on the table? he seeks interest not on our money but on his own.

One says that he hid it in the ground, because by his zeal for pleasure he buried the reason which was given to us after the image and likeness of God, and hid it as in a pit of the flesh. Of the others nothing is said, who like prodigal debtors lost what they had received. In those two are the few who were sent at two times to the tenants of the vineyard; in the rest, all the Jews. This comparison Matthew wished to fit to us also: that, just like the rich man who does not share his money with the poor, so too he who does not share the grace of his teaching with the unlearned, though he could teach, is guilty of no ordinary fault. Since we have spoken of this in the books written On the Faith, it was better to pass over it quickly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
