[[commentary]]
quote='''
And when he was dead, he ordered the third to be set before him. And when he partly tried him with snares and partly wished to strike him down with terror, he answered him: 'I will not do your will, nor will I yield to your command. By that blessed passion and nobility of my brothers, I will not deny our loving brotherhood. Apply whatever tortures you like: by pressing the harder with them you will gain only this by the harshness of the punishments, that you will receive greater testimonies of our brotherhood'. He therefore ordered his tongue to be cut off. But he, crying out: 'You are conquered' he said 'Antiochus, you who order the instrument of the voice to be cut off. You have confessed that you cannot answer reason, and you prove that the scourges of our tongue are greater than your blows. For we do not fear your blows; you cannot endure the scourges of our voice. But these are the scourges of devotion, yours the scourges of unbelief. Yet even when the tongue is taken away, it will scourge you more heavily with its murmur as it falls. Do you think you escape, Antiochus, if you snatch away the voice? God hears even the silent, and hears them more. See, I have opened my mouth, I have loosed my tongue. Cut off the tongue, but you will not cut off constancy, you will not take away virtue, you will not blot out reason, you will not snatch away the testimony of truth, you will not snatch away the cry of the heart. If the tongue is cut off, the blood will cry out, and it will be said to you: The voice of your brother's blood cries to me. For he hears the voice of blood who hears the inner thoughts — 'though darkness covers me and the enclosures of walls surround me' the ungodly man may say, because no witness stands by him — God searches out all things, God sees all things, nor is there any crime that can be hidden from the judge of all, who knows all things before they happen. Why do we deal in words? Wounds are more eloquent: even if the wounds are covered, even if the scar is hidden, faith is not hidden. Yet do not applaud yourself that by taking away the tongue you snatch away the confession of praise. We have already praised God enough by speech; now let us praise him by suffering'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
