[[commentary]]
quote='''
‘Are you not of more value than the sparrow?’ Thus the Lord spoke. If, therefore, at the sight of a tiny bird the sea rises suddenly and as suddenly subsides, and if in the midst of winter’s cruel storms and tempests a tranquillity, permeating all the elements, ‘sweeps the clouds from the sky,’ quickly calming the waves—if this is true, do you realize, you, a man made to the image of God, how much hope you ought to have, if only in your eagerness for a pious life you would imitate that little bird’s trusting confidence. The halcyon is not turned aside from her purpose at the sight of the approaching tempest and of the winds that rage at winter’s onrush—rather, she is impelled all the more. Hence she lays her eggs on the shore where the sand, still wet from the retreating waves, welcomes them. She does not dread the rising waves, which she beholds as they break on the shore with threatening sound.

And that you may not conclude that the halcyon shows slight regard for her eggs, she builds her nest without delay at the very place where she laid her eggs. She broods over her offspring and, while the waves pound the shore, shows no fear for her own safety. Rather, she entrusts herself to the winds and waves, secure in the beneficence of God. That is not all. Many more days still remain to complete the period of growth. During this time she has no fear that the tranquillity of the perfidious sea will be broken. She relies on her own merits, based now on the regular pattern of nature. She does not hide her brood in some secret corner of a house or in a cave. On the contrary, she entrusts them to the bare, cold ground. She does not protect them from the cold, but considers that they will be safer with the comfort of divine warmth, by means of which she may all other things disdain.

Who is there among us who does not cover his little ones with garments and who does not protect and shield them within the walls of his home? Who is there who does not close the windows on all sides to prevent even the slightest breeze to enter? And while we so anxiously attend to clothing and warmth, we are therefore depriving them of the protecting cover of celestial clemency, whereas the halcyon, by casting her brood out naked, has thereby clothed them with vesture that is divine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
Perhaps someone may say: how did the Apostle say: Is God concerned for oxen, when surely an ox is more precious than a sparrow? But care is one thing, knowledge another. Indeed the number of the hairs is understood not in the act of counting but in the ease of knowing; for God does not keep the anxious watch of one who counts with care, but for him to whom all things are known all things are as it were numbered. Yet they are well said to be numbered, because we number the things that we wish to keep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
