[[commentary]]
quote='''
The laurel and the palm are emblems of victory. The heads of victors are crowned with laurel; the palm adorns the victor’s hand. Hence, the Church, too, says: ‘I said: I will go up into the palm tree, I will take hold of the heights thereof.’ Seeing the sublimity of the Word and hoping to be able to ascend to its height and to the summit of knowledge, he says: ‘I will go up into the palm tree,’ that he may abandon all things that are low and strive after things that are higher, to the prize of Christ, in order that he may pluck its fruit and taste it, for sweet is the fruit of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
