[[commentary]]
quote='''
The laurel and the palm are emblems of victory. The heads of victors are crowned with laurel; the palm adorns the victor’s hand. Hence, the Church, too, says: ‘I said: I will go up into the palm tree, I will take hold of the heights thereof.’ Seeing the sublimity of the Word and hoping to be able to ascend to its height and to the summit of knowledge, he says: ‘I will go up into the palm tree,’ that he may abandon all things that are low and strive after things that are higher, to the prize of Christ, in order that he may pluck its fruit and taste it, for sweet is the fruit of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
I will go up into the palm tree, and I will lay hold of its height. Hence know that he has ascended this one too, and has brought her to the place of the palm tree, when he also says to her: How beautiful and sweet you have become, O love, in your delights! Your stature has become like a palm tree (Song 7:6). And she herself says: I said, I will go up to the palm tree. But love itself is also a palm, for it is the fullness of victory; for love is the fullness of the Law. Let us run, then, that we may lay hold; let us run, that we may conquer: he who has conquered goes up into the palm tree and eats its fruits; he who has conquered no longer runs, but sits, as it is written: He who conquers, I will grant him to sit with me on my seat, as I also conquered and sat with my Father on his seat (Rev. 3:21). Hence the philosophers portrayed in their books those chariot contests of souls, and yet they could not reach the palm; because their souls did not know the sweetness and the height of the Word. I will go up, she says, into the palm tree, by conquering the world; that I may hold the height of the Word, which this soul knew, in whom was the turning of the Word; for thus she says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
