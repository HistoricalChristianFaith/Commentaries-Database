[[commentary]]
quote='''
My enemies, he says, live and have been made strong over me, and those who hate me unjustly have been multiplied; those who repay evil for good detracted from me, because I followed close after righteousness. But how much more illustrious is he who died daily, so as to give life to his people, and offered his body to the wounds of death, as he himself says: in deaths often! For an honourable death is the redemption even of a discoloured life, or the firm support of an innocent one, and the issue of death is in the hand of life; and therefore the Apostle preferred to die daily, so as to prove the merit of his life; for it is written: Do not praise a man in his life. For those who live die; those who die will rise again. He, then, is nearer to salvation who dies so as to rise again than he who lives so as to die. And who is it who dies daily but he who carries about the death of the Lord Jesus in his flesh, so that all sins may die to him? David's enemies were indeed made strong and multiplied in this world; but there is no adequate firm support except his who is made strong in Christ. Indeed those are made strong in the world who hate the righteous man unjustly; not, then, a just hatred, but an unjust one, since they hated unjustly.

But see the difference. Later on he says: who hate me gratuitously; here he has: who hate me unjustly. But there it is in the person of Christ, here in his own person; where he speaks in the person of Christ, he is hated gratuitously, where in his own, unjustly. For a man can be not open to some one wound — say, of injustice, intemperance, unchastity — but be open to other wounds; but in Christ there could be no cause by which he could receive the wound of any sin, immune as he was from guilt, untouched by offence and unstained by vice. But there are those who think that both psalms run their course in the person of Christ, who was making satisfaction to the Father for our sins. Here, then, he said that he was attacked against righteousness, there against grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
