[[commentary]]
quote='''
Indeed after these words she is called no longer woman, but now Mary; for the one is the common name of the crowd, the other the special name of a person following Christ. And she is sent to the disciples, though not yet a judge of full faith, yet as a messenger. But she is forbidden to touch, because she had not yet learned, as Paul had, that the fullness of the divinity dwells bodily in Christ; she had not yet emptied out the slipperiness of the world, the uncertainty of the flesh; she had not yet lived the life of Christ. Indeed this one neither worships the Lord nor holds his feet, as that other Mary did, in whom surely there is signified not so much bodily homage as the affection of full faith, because she believes Christ to be both man and God; for it is God who is worshiped, man who is held.

The Lord, then, whose feet Mary too anointed with ointment, does not disdain to be touched by a woman, nor does he scorn her touch, but teaches progress, because not all can touch Christ rising again who touched him while he dwelt in this life and body. Let him who wishes to touch Christ mortify his members and, made like him who was to rise again, put on the heart of mercy, and not hesitate to renounce earthly things.

What, then, is Do not touch me? Do not lay your hand on greater things, but go to my brothers, that is, to the more perfect — for whoever does the will of my Father who is in heaven, he is my brother and sister and mother — because the resurrection cannot easily be grasped except by the more perfect; the prerogative of this faith is kept for those more firmly grounded, but I do not permit women to teach in the church; let them ask their husbands at home. She is sent, therefore, to those who are of the household, and she received the commands prescribed for her.

Nor does it escape notice in this place that some have thought that Christ was unwilling to be touched because he had not yet received back the form which he had commended to the Father, as if she ought not yet to touch him.

I ascend to your Father, my God and your God. Well did he distinguish, because he was speaking to a woman; for we have no nature in common with Christ except that of the human condition. To him he is Father by his own generation, to us by voluntary adoption; to him by nature, to us by grace; to him he is God by the unity of the mystery, to us by heavenly power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
