[[commentary]]
quote='''
Therefore, until he come, a leader shall not fail from Judah, so that until his birth the faith of the royal succession might be kept uncorrupted. For afterwards, as we have shown in the treatise we composed on the Gospel, the succession, adulterated through Herod, lost the prerogative of its dignity. For because they denied the true king, they began to have false ones. So this is what the patriarch says: the inheritance of an inviolate succession, carried down through kings, will be kept among the judges or kings of the Jews, until he come for whom it is laid up, that he may gather the Church of God out of the assembly of all nations and the devotion of the Gentile peoples; that is, it awaits him, what is owed is reserved for him, to him the prerogative of so great a grace is accorded.

And he is the expectation of the nations. He said more than if he had said: The nations await him, because all the hope of the Church rests upon him. Therefore it is said to Moses: Loose the sandal from your feet, lest he, who was being chosen as leader of the people, should be believed to be the Bridegroom of the Church. Therefore Joshua son of Nun loosed his sandal, so that he too might keep the grace of so great an office for the one who was to come. Therefore John says: After me comes a man the strap of whose sandal I am not worthy to loose; therefore he says: He who has the bride is the bridegroom; but the friend of the bridegroom, who stands and hears him, rejoices with joy, that is: He alone is the husband of the Church, he is the expectation of the nations; yielding to him the union of nuptial grace, the prophets loosed their sandals. He is the Bridegroom, I am the Bridegroom's friend: I rejoice because he has come, because I hear the nuptial voice, because I hear now no longer the harsh punishments of sinners, the harsh torments of the Law, but the remission of crimes. The voice of gladness, the sound of joy, the exultation of the wedding feast is what we hear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"
