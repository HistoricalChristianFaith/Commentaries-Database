[[commentary]]
quote='''
And Abraham made a great supper when Isaac his son was weaned. This is no slight or ordinary thing. For Abraham did not lay on a great banquet because the boy had been withdrawn from his nurse's milk, but because Isaac was judged fit for the food of a stronger grace and the nourishment of virtue, no longer to be given milk to drink like the Corinthian, but strengthening the sinews of his mind with the more solid fare of the heavenly commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
