[[commentary]]
quote='''
Therefore it is written: The unrighteous man said, that he might sin against himself. What did he say? I will set my throne above the clouds, and I will be like the Most High. The words have no effect, but they have sin; empty indeed is the pomp of boasting, but, guilty through the spirit of pride, he does not fear to violate the divine majesty with insult. For if any fear of God were in his disposition, he would not with rash daring have believed that he might carry out things full of guile in the sight of God, as though God, who is the searcher of the inmost parts, could not know hidden things. God beholds all things; there is nothing that escapes him, no one who deceives him; to him all things to come are present and things that lie hid are manifest. For if this sun of the world often sends its light into the closed dwellings of houses, how much more does God, supreme and eternal, search out and anticipate by his knowledge even the secret recesses of the human mind and every counsel of the angels! What else, then, does the unrighteous man do but seek for himself iniquity and hatred?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
