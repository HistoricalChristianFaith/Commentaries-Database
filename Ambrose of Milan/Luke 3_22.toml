[[commentary]]
quote='''
Now let us consider the mystery of the Trinity. We say one God, but we confess the Father and we confess the Son. For though it is written: You shall love the Lord your God and him alone shall you serve, the Son denied that he was alone, saying: But I am not alone; for the Father is with me. Nor is he alone now; for the Father testifies that he is present. The Holy Spirit is present; for the Trinity can never be separated from itself. Indeed, heaven was opened, the Holy Spirit descended in bodily form like a dove. How, then, do the heretics say that he is alone in heaven, who is not alone on earth? Let us observe the mystery. Why like a dove? Because the grace of the washing requires simplicity, that we may be simple as doves. The grace of the washing requires peace, which in the ancient type a dove once brought to that ark which alone was untouched by the flood. He taught me whose type that dove was, he who has now deigned to descend in the form of a dove; he taught that in that branch, in that ark, was the type of peace and of the Church, since amid the very floods of the world the Holy Spirit brings fruitful peace to his Church. David too taught it, who, discerning with prophetic spirit the sacrament of baptism, says: Who will give me wings like a dove?

So the Holy Spirit came, but attend to the mystery. He came to Christ; all things indeed were created through him and hold together in him. But see the kindly Lord, who alone submitted himself to injuries, alone did not seek favour. And where did he build the Church? I will ask he says the Father, and he will give you another Paraclete, that he may be with you for ever, the Spirit of truth, whom this world cannot receive, because it does not see him nor know him. Rightly, then, did he show himself in a body, since in the substance of divinity he is not seen.

We have seen the Spirit, but in bodily form; let us see the Father too. But because we cannot see him, let us hear him; for the kindly God is present, he will not forsake his temple. He wishes to build up every soul, he wishes to form it for salvation, he wishes to transfer living stones from earth to heaven. He loves his temple; let us too love him. If we love God, let us keep his precepts; if we love him, let us know him; he who indeed says that he knows him and does not keep his precepts is a liar. For how can he love God who does not love the truth, since God is truth? Let us hear the Father, then; for the Father is invisible. But the Son too is invisible according to his divinity; God indeed no one has ever seen. Since, then, the Son is God, in that in which he is God the Son is not seen; but he willed to show himself in a body, and because the Father did not bear a body, the Father therefore willed to prove to us that he is present in the Son, saying: You are my Son, in you I am well pleased. If you wish to learn that the Son is always present with the Father, read the voice of the Son, saying: If I ascend into heaven, you are there; if I descend into the underworld, you are present. If you seek the testimony of the Father, you have heard it from John. Believe him to whom Christ entrusted himself to be baptized, to whom the Father commended the Son by a heavenly voice, saying: This is my beloved Son, in whom I am well pleased.

Where are the Arians, who are not pleased with the Son in whom the Father was well pleased? It is not I who say this, nor has any man spoken it, nor God through a man, nor through angels nor through archangels, but a voice sent from heaven by the Father himself has sealed it. Then elsewhere the same Father repeats it, saying: This is my beloved Son, in whom I am well pleased; hear him, hear him, that is, when he says: I and the Father are one. He, then, who does not believe the Son does not believe the Father. He is a witness concerning the Son. If there is doubt about the Son, the Father's testimony is not believed. Then, when he says: in whom I am well pleased, he praises in the Son not what is another's, but what is his own. For what is it to say: in whom I am well pleased but that all that the Son has is mine, as the Son said: All that the Father has is mine? For the power of an undivided divinity does not separate between the Father and the Son, but imparts one power to the Father and the Son. Let us believe the Father, whose voice the elements sounded forth; let us believe the Son, to whose voice the elements rendered obedience. The world believed in the elements, let it believe in men; it believed in lifeless things, let it believe in the living; it believed in mute things, let it believe in those who speak; it believed in things that have no sense, let it believe in those who have obtained sense to know God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
