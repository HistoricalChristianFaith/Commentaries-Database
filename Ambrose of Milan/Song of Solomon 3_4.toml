[[commentary]]
quote='''
What is signified by the house of your mother and her chamber except the interior, secret place of your nature? Keep this house, and cleanse its inmost parts so that, once it is an immaculate house unstained by any sordidness of an adulterous conscience, a spiritual house held together by the cornerstone may rise into a holy priesthood, and the Holy Spirit may dwell in it. One who thus seeks Christ, who entreats him, is not abandoned by him. Rather, that one is frequently visited, for he is with us until the end of the world.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 13:78"

[[commentary]]
quote='''
And so she says in the Song of Songs: I held him and I will not let him go, she who was seeking the wisdom of God and embracing the righteousness of God with the arms of charity and, as it were, with the arms of faith and devotion; for this is the embrace of a devout mind.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
There are also many who seek Christ in leisure and do not find him, and they find him in persecutions, and find him quickly. And so, as if after temptations, because he is present in the perils of his faithful, How little a while it was she says, when I passed from them, and I found him. I held him and did not let him go. For everyone who seeks finds, and whoever has found ought to cling to him, so that he may not lose him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
When I had passed from them but a little, I found him, I held him, and did not let him go. He, then, who has passed the watchmen finds the Word. John passed them, who found the Word with the Father. There are also many others who seek Christ in leisure and do not find him; and they seek him in persecutions and find him. And therefore, as if after temptations, because he is present in the dangers of his faithful: When I had passed from them but a little, she says, I found him, and held him, and did not let him go. For everyone who seeks finds; and he who has found ought to cleave, so that he may not be able to lose.

And since through the Gospel we see on earth the heavenly mysteries prefigured, let us come to the Magdalene, let us come to the other Mary. Let us consider how they sought Christ in the nights on the bed of his body, in which he lay dead, when the angel said to them: You seek Jesus who was crucified: he is not here, for he has risen: why then do you seek the living with the dead (Matt. 28:5 ff.)? Why do you seek in the tomb him who is already in heaven? Why do you seek in the bonds of burial him who loosens the bonds of all? The tomb is not his seat, but heaven; therefore one of them said: I sought him, and did not find him (Song 3:1). Yet while they are going to bring word to the apostles, Jesus, pitying them as they sought, meets them, saying: Hail. And they came near and held his feet and worshipped him.

Jesus, then, is held, and he delights to be held so, because he is held by faith. Then, that woman too delighted him who touched him and was healed of the flow of blood, of whom he said: Someone has touched me; for I perceive that power has gone out from me (Luke 8:46). Touch, then, and hold him by faith, and clasp his feet faithfully, that power may go out from him to heal your soul. And if he says: Do not touch me, hold him. For I have not yet ascended to my Father, he said (John 20:17). Once he said: Do not touch me, when he had risen: or perhaps he said it to her who thought he had been taken away by theft, and not raised by his own power. Then, in another book you have it that to those who held his feet and worshipped he said: Do not be afraid (Matt. 28:10).

Hold him, then, you too, O soul, as Mary also held him, and say: I held him, and will not let him go: to whom both were saying: We hold you. Go to the Father, but do not forsake me, lest I fall again; and with Mary, who does not stray but holds the tree of life, snatch up with you the one who clings to your feet. I will ascend with you, do not let me go, lest the serpent pour out his venom again, lest he again be able to bite the woman's footstep, so as to supplant Adam. Let your soul say, then: I hold you, and I will bring you into the house of my mother, and into the secret place of her who conceived me (Song 3:4); that I may know your mysteries, that I may drink in your sacraments.

I held him, and will not leave him, until I bring him into the house of my mother, and into the chamber of her who conceived me. What is the house of my mother and her chamber, if not the inward and secret part of your nature? Keep this house, cleanse the inmost recesses of this house, so that when the house is spotless, and not defiled by the filth of any adulterous conscience, a spiritual house may rise up into a holy priesthood, joined together by the cornerstone, and the Holy Spirit may dwell in it. She who thus seeks Christ, who thus entreats Christ, is not forsaken by him; nay, she is even visited by him often.

Or the house of the mother is perhaps the house in which the discipline of morals shines forth; and that secret place is the one in which are the higher mysteries, in which the honeys of divine grace give forth their fragrance. Is not the remission of sins sweeter than any honey? Is not the resurrection of the dead more pleasing than any flower? Receive, then, Eve, no longer covered with fig leaves, but clothed with the Holy Spirit, and glorious with new grace; for now she does not hide as one stripped, but comes forth as one wrapped in the splendor of a shining garment, because grace clothes her: but neither was Adam naked at first, when innocence clothed him. Seeing her, therefore, cleaving to Christ, and still ascending with him (for he deigns often to meet those who seek him, and to come down to them, that he may lift them up), the daughters of Jerusalem say:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
