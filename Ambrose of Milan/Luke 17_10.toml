[[commentary]]
quote='''
So acknowledge that you are a servant, bound in debt to very many services. Do not set yourself above others because you are called a son of God — grace must be acknowledged, but nature must not be forgotten — nor boast if you have served well, for you did what you ought to do. The sun obeys, the moon complies, the angels serve. The vessel of the Gentiles chosen by the Lord says: I am not worthy he says to be called an apostle, because I persecuted the Church of God. Then elsewhere, showing himself conscious of no fault, he added: But I am not justified by this. Let us too, then, not demand praise from ourselves, nor snatch at the judgment of God beforehand and forestall the sentence of the judge, but reserve it for its own time and its own judge. After this the ungrateful are rebuked, and so at last he comes to treat of the future judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
