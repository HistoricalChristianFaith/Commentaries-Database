[[commentary]]
quote='''
A wicked word, he says, they have set forth against me, that is: they have set before me a speech unlawful and against right and divine law, making bargains over human blood, which Judas most criminally sold, and which the Jews, with no lesser crime, thought fit to buy, most vain men, as if he who sleeps would not add so as to rise again. Let us consider what the addition is.

It is natural to all earthly living creatures and to the birds of the sky and to the fishes of the sea to be born and to die; on man, whom God had made more precious than the other living creatures of the earth, he conferred this grace especially, that when dead he should live again. This is called the addition, for the renewal of the former life. Indeed, when the Lord had decreed to King Hezekiah that he had fulfilled the time of his life, and had bidden him through Isaiah to set his house in order, because he was to die, and he had prayed to the Lord and wept with great weeping, the Lord had pity and sent word to him: behold, I add to your time fifteen years. And elsewhere holy David says: days upon the days of the king you will add, his years. Something, then, has been found that may be added to man; but nothing can be added to God, because it is written: there is no adding or diminishing in him in whom all things are perfect and full. Even though Christ rose again, surely he rose again in that which he had assumed, in which nothing could either be taken from the fullness of his divinity or be added to it. For God is incorporeal and immortal, whose supreme nature and fullness of powers is designated without any addition of flesh. But the flesh in Christ belongs to the dispensation, which he took up by title of compassion and by right of loving-kindness, so that he might redeem it when captive, wash it when defiled, raise it up when dead. And beautifully he says: shall he who sleeps not add so as to rise again? He did not say "it is not added", but "shall he not add so as to rise again", because the Son of God raised himself up, as we said above that he had said to the Jews: destroy this temple, and in three days I will raise it up. The flesh received the addition as taken from man, received from the Virgin, but as God he wrought the addition himself, who rose again by his own power, so as to be the worker of his own resurrection. When you read that the Father raised the Son and that the Son raised himself, recognize that that working was of the divine power, because the Father and the Son have one power, a common working, since the substance of the Trinity is one and the same.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
