[[commentary]]
quote='''
I have information from Adam himself, in fact, about the significance of the leaves. He proceeded to make a covering for himself out of the leaves of the fig tree after he had sinned, whereas he should have had its fruit instead. The just man chooses the fruit; the sinner, the leaves. What is the fruit? We read: The fruit of the spirit is charity, joy, peace, patience, kindness, modesty, continency, love. He who possessed no fruit possessed no joy. The person who violated the command of God did not have faith, and he who ate of the forbidden tree did not have the virtue of continency.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 13"
