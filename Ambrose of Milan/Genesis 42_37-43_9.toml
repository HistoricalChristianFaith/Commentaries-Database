[[commentary]]
quote='''
Yet Benjamin, the youngest, was being held back and still clung to his father's affection. The bonds of the Law held him, his fathers' custom. The famine grew stronger, because he was coming late. Two intercede for him, Reuben and Judah, that is, humility and confession. He uses them as sureties with his father, to them he is entrusted: the one the firstborn, the other the one raised again. The Law belongs to the firstborn, the Gospel to the one raised again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 9"
