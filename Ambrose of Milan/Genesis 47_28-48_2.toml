[[commentary]]
quote='''
But when, having enjoyed the fruit of his recovered son for some time, seventeen years, namely, which in view of the patriarch's great length of life is a time of small portion, he knew that the end of his life was drawing near, he called his son Joseph and bound him by the future heir of his line that he should not be buried in Egypt; and having received his pledge, when a little later he fell sick and his son Joseph had come to him, as if his strength had been restored he sat up on his bed and blessed the twelve patriarchs and prophesied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 8"
