[[commentary]]
quote='''
When, then, did the true one come? Hear him saying: I have announced and have spoken; they are multiplied beyond number. Sacrifice and oblation you did not want, but a body you have perfected for me. Then I said: Behold, I come; at the head of the book it is written of me; to do your will, my God, I have willed. What is more evident than that the true Jesus has come to us with the gift of his Gospel? He himself spoke, and countless peoples of believers were gathered, who before scarcely believed one by one. He himself came in the flesh, and the sacrifice of the Jews ceased, the oblation for sin ceased, because the remitter of sins had come. The remedy of the Law was not needed where the author of the Law stood present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
