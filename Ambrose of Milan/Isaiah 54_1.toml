[[commentary]]
quote='''
From this too it can be gathered that King Abimelech deserved gentler treatment, because Abraham prayed for him and obtained his request. For his wife and his maidservant gave birth, whom the Lord had earlier shut up because of Sarah, Abraham's wife. This equally belongs to the dispensation, so that Sarah's childbearing, granted by the promise of God, might be supported also by this testimony, since you observe that through God's displeasure even fruitful women become barren, and again by the Lord's will barren women are made fruitful, according to what is written: did I not make the barren woman and the woman who bears? says the Lord. And yet this may be taken as said of the mystery of the synagogue and of the Church, because the synagogue ceased to have offspring, being defrauded of the posterity of succession, and the congregation of the nations, which was barren while it did not know God, began to have eternal offspring. Hence it is also read: rejoice, barren one, who do not bear; break forth and cry out, you who are not in labour, for more are the children of the desolate than of her who has a husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
