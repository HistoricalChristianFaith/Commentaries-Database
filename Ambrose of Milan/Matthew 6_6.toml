[[commentary]]
quote='''
That is the prophet's voice which reaches God, the voice which cried to the Lord while Moses was silent, with which Hannah too cried in her prayers, when she did not move the lips of her mouth, and obtained the son whom for a long time before she had not obtained when she cried with the voice of the body. Of this voice the Lord said: but you, when you pray, go into your chamber and, having shut the door, pray to your Father who is in secret; and your Father who sees in secret will repay you. What is "will repay"? It is that which you have entreated, that which you have prayed for. For just as sinners receive from the hand of the Lord their sins double, so on the contrary the righteous receive with effect the very things they asked. Hear how they receive them. Your prayer ascends to God and descends to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
