[[commentary]]
quote='''
Our argument, then, is based on the word of God: ‘Let there be a firmament made amidst the waters and let it divide the waters from the waters.’ And from this arises the question whether He calls the firmament the heaven which He had already created, concerning which it is written: ‘In the beginning God created heaven and earth.’ I am not unaware of the interpretation which some have held on this subject, namely, that as the creation at the hands of God and the foundation of heaven has been before expressly stated by Scripture, so a clearer exposition of the work of creation is here given. Whereas in one place a summary of the work, as it were, is briefly stated, in the other, the nature of the operation is depicted according to the specific aspect of things as they appear at the same moment of creation. But there is something which needs our consideration: there is question of another word for heaven, ‘firmament,’ and there emerges an aspect and condition of more solid character, to which is added the person of a co-operating agent. For it is written: ‘And God divided the waters that were under the firmament from those that were above the firmament.’

And first of all these interpreters wish to destroy the profound impressions which frequent reading of the Scriptures have made in our mind, maintaining that waters cannot exist above the heavens. That heavenly sphere, they say, is round, with the earth in the middle of it; hence, water cannot stay on that circular surface, from which it needs must flow easily away, falling from a higher to a lower position. For how, they say, can water remain on a sphere when the sphere itself revolves?

This is one of those sophistical arguments of the subtlest kind. Grant me an opportunity to reply. If it is not granted, there need be no further room for discussion.

They ask us to concede to them that heaven turns on its axis with a swift motion, while the sphere of the earth remains motionless, so as to conclude that waters cannot stay above the heavens, because the axis of heaven as it revolved would cause these to flow off. They wish, in fact, that we grant them their premise and that our reply be based on their beliefs. In this way they would avoid the question of the existence of length and breadth in that height and depth, a fact which no one can comprehend except Him who is filled ‘with the fullness of the Godhead,’ as the Apostle says. For who can easily set himself up to be a judge of God’s work? There exists, therefore, breadth in the very heights of heaven.

To speak of matters within our knowledge, there are a great many buildings which are round in the exterior but are square-shaped within, and vice-versa. These buildings have level places on top, where water usually collects. We are led to mention these matters in order to draw the attention of these interpreters to the fact that their opinions can be confuted by other opinions closer to the truth and that they may cease measuring such a mighty work of God in terms of human work and merely on an estimate of our own capacities.

We follow the tradition of the Scriptures and we value the work by our esteem of the Author, as to what was said, who said it, and to whom it was said. ‘Let there be a firmament made,’ He said, ‘amidst the waters and let it divide the waters from the waters.’ From this I learn that the firmament is made by a command by which the water was to be separated and the water above be divided from the water below. What is clearer than this?

He who commanded the waters to be separated by the interposition of the firmament lying between them provided also the manner of their remaining in position, once they were divided and separated. The word of God gives nature its power and an enduring quality to its matter, as long as He who established it wishes it to be so, as it is written: ‘He hath established them forever and for ages of ages. He hath made a decree and it shall not pass away.’ And that you may know that He said this concerning these waters which you say cannot exist in the higher parts of the heavens, listen to the words which precede: ‘Praise him, ye heaven of heavens, and let all the waters above the heavens praise the name of the Lord.’

Did He not speak to you in such a way as to answer your objections? ‘For he spoke and they were made. He commanded and they were created. He hath established them forever and for ages of ages. He hath made a decree and it shall not pass away.’ Does He not seem to you to be one who is fitted to give a law to His work? Here speaks to you a God venerable by nature, inestimable in magnitude, in rewards immeasurable, in His works incomprehensible, the depth of whose wisdom who can ever strive to measure? But He speaks to His Son, that is, to His arm; He speaks to His power; He speaks to His wisdom, to His justice. And the Son acts as one who is powerful; He acts as the power of God; He acts as the wisdom of God, as divine justice. When you hear this, why do you marvel if, by the operation of such majesty, water can be held suspended above the celestial firmament?

Reflect on this when dealing with other matters, with what is seen by the eyes of men—reflect on this if you look for an explanation of how the sea divided at the crossing of the Jews. This is not a customary act of nature that water should separate itself from water and that the waters intermingling in the midst of the earth should be divided. The waves became solid, we are told, and like the waters in the firmament they checked their course when they reached their unusual boundaries. Could not the Lord have set free the Hebrew people in a quite different manner? But He wished to show that by taking note of such a spectacle you might come to think that what is not even visible to your eyes ought to inspire belief. The Jordan, too, inverting its course, returned to its source. That water in its course should stand still is considered to be unusual. That it should flow upwards without any external aid is considered to be impossible. But why is it impossible for Him who gave strength to the weak, so that they could say: ‘I can do all things in him who strengthens me.’

Let them tell us whether, when ‘the air thickens into cloud,’ rain is then produced by clouds or whether it is collected in the lap of the clouds? We so frequently see clouds issuing from the mountains. I ask you: Does the water rise from the earth or does the water which is over the heavens fall in copious rain? If water rises, it surely is against nature that the element which is heavier should be borne to a higher place and that it should be carried there by air, although this is a lighter element. Or if water is whirled by the rapid motion of the entire world system, in that case it is absorbed from the lowest sphere and, likewise, it is poured forth from the highest. If it does not cease to be poured forth, as they claim, surely it does not cease to be absorbed, because, if the axis of the heavens is ever in movement, the water, too, is always being absorbed. If water descends, then it is clear that it is continuously above the heavens in a position from which it can flow downwards.

What prevents us, then, from admitting that water is suspended above the heavens? How can they say that the earth, although it is certainly heavier than water, stays suspended and immobile in the middle? Following the same principle, they can admit the water which is above the heavens does not descend because of the rotation of that celestial sphere. Just as the earth is suspended in the void and stays immobile in position, its weight being balanced on every side, in like manner the water, too, is balanced by weights either equal to or greater than that of the earth. For the same reason, the sea does not tend to inundate the land without a special command to do so.

When they state again that the glittering sphere of heaven revolves with its fiery stars, did not Divine Providence necessarily foresee that water more than sufficient to temper the heat of the burning axis should exist within the sphere of heaven and above it? For the reason that fire makes its presence felt everywhere, for the same reason, too, water abounded on the earth, lest it be parched by the heat of the burning sun and of the twinkling stars and thus delicate things be injured at their birth by an unfamiliar warmth. How great a number of springs, rivers, and lakes irrigate the earth, parched, as it is, by some fire within! If, too, that interior fire does not give life to them, how could the trees or grain germinate or seedling burst forth or, when they have sprouted, be brought to maturity? Fire, also, frequently issues forth from rocks and from wood itself when a tree is being cut down. Fire, therefore, is a necessary element in the work of creation in order that things remain in due order and arrangement and that the clemency of the sky may temper the rigidity of water. In like manner even excessive quantities of water are not superfluous, where there is danger of one element being consumed by another; unless the proportion of both elements is a suitable one, then fire may dry up the water, just as water, too, extinguishes fire.

Accordingly, God balanced the universe with weights and measures. He has measured even the drops of rain, as we read in the book of Job. Knowing that either there would be a tendency toward a failure or a dissolution of the universe, if one element preponderated over the other, He controlled for that reason the extent of each, so that fire would not supply more heat, or water more moisture, than would lead to the diminution of either under His guidance, by which the superfluous was drained off and a sufficiency was held in reserve.

Such great streams of mighty rivers still burst forth from the earth. We have the Nile that inundates Egypt with its overflowing waters; the Danube which divides the barbarians of the eastern regions from the Roman people, until it hides itself in the Black Sea; the Rhine which directs its course from a defile in the Alps until it reaches the depths of the ocean—a notable barricade for the Roman empire against savage nations; the Po, a trusty conveyor of maritime produce for the support of Italy; the Rhone, which with its rapid current cuts the waters of the Tyrrhenian sea, thereby adding to the perils of sailors, according to report, because of the struggle for mastery between the river currents and the sea waves; and, rising in the northern regions and combining in the Caucasus Mountains with many other streams, the Phasis River rushes headlong to the sea. It would be tedious to enumerate the names of each and every river which either flows into our sea or empties itself into the ocean. Notwithstanding such an abundance of water in the world, the soil in the southern zone for the most part is still scorched and reduced to dust by excessive heat. The toil of the unhappy farmer is spent in vain, so much so that, when the wells and streams are dried up, he frequently fails to find enough water to sustain life. And there will be a time when He will say to the deep: ‘Be thou desolate and I will dry up all the rivers,’ as through Isaias He announced the future. But before that day established by the divine will shall come, no little conflict among themselves is presented by the specific natures of the elements. Hence, the world is frequently affected by violent inundations or is afflicted by the extremes of heat and aridity.

Be not concerned, therefore, with the extraordinary excess of water in the world; take note, rather, of the force exercised by heat and you will not be incredulous. Fire is able to absorb much, a fact which ought to be clear to us from an experiment. When physicians burn a small candle and attach it to the inside of certain types of vases, narrow in the spout, rather flat on top and hollow within, how does it happen that this heat attracts to itself all the moisture? Who, therefore, doubts that the burning æther, glowing with mighty heat, would cause everything to be consumed by fire if it were not held in check by a law laid down by its Author, so that neither rivers nor lakes nor the seas themselves could subdue its strength? And so, water falling from above gushes forth generally in such storms of rain that rivers and lakes suddenly are filled and the very seas overflow. Hence, we often see the sun, too, veiled in vaporous exhalations. This is clear proof that the sun, in order to temper its heat, has appropriated to itself the element of water.

So great is their zeal in assailing truth that they go as far as to assert that the sun itself is devoid of heat by nature, for the reason that it is white and not ruddy or red as fire is. And so they say it is not fiery by nature and, if it has some heat, they maintain that this is the result of the unusual speed of its revolutions. This theory ought to be accepted, they claim, for the reason that the sun does not seem to consume any moisture, because it does not have a natural heat by means of which moisture is either diminished or very often drained off. Notwithstanding these arguments they do not succeed in their purpose, because it makes no difference whether heat is natural or acquired or proceeds from some other cause, since every fire is a consumer of moisture or of any material such as can be burned by the application of fire. For, if you touch leaves with a spark obtained, not from wood which is already partly burned, but from one produced by the friction of sticks, such a flame increases its strength, just as if you were to light a torch from a fire. But if you should kindle a light from a flame or another lighted object, these two have a fire of the same appearance and character as if the fire were produced, not by nature, but by accident. These men should, from the point of view, at least, of the heat of the sun, take note that God has set different times and places for the sun’s courses, lest, if it should linger always in the same places, it might burn them up with its daily heat. Concerning the reasons for the bitter and salty nature of sea water, the same people relate that so much water is absorbed by heat as it is obtained from the confluent rivers, and that so much water is evaporated each day by the heat as is furnished by the daily inflow from the various rivers. This phenomenon is held to take place by a certain power of selection on the part of the sun, which takes to itself what is pure and light and leaves what is heavy and earthy. As a result, there is left that salty and dry quality in the water, unsuited to man’s consumption and enjoyment.
'''
