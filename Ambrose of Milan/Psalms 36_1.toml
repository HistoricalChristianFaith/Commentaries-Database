[[commentary]]
quote='''
Being about to say in the following psalm what the form of the righteous man is, the prophet first portrayed the form of the unrighteous man. For we cannot know what the form of righteousness is unless we know what the likeness of iniquity is; for they are opposed and contrary to one another. For in the one is the simple bearing of nature, in the other the deceitful craftiness of wickedness; the one displays the images of the virtues, the other holds out the fabrications of the vices. That this order is fitting, reason itself teaches; and, if testimonies are to be taken from opponents, the teachers of philosophy themselves have admitted it, in following it. Who would doubt that David, whom not only Plato's master but not even Plato's grandfathers' grandfathers could have seen, was far earlier than the times of Plato, since the one lived at the beginning of the kingdom of the Jews, which was prolonged through countless courses of years, the other after the times of the captivity, by which the kingdom of his nation had already been dissolved? Therefore he himself, who holds the primacy over all in worldly wisdom, when he said that the form of righteousness could not be grasped unless they had first thought that the chain of unrighteousness should be examined, brought forward the example that those who wish to seek gold first smear themselves with mud. So righteousness is gold, iniquity is mud. That this has been said by our own writers also is not in doubt, since it is written: I will blot them out like the mud of the streets; and truly mud, because it defiles those who have come near it. Let us flee unrighteousness, then, lest we be defiled with the filth of mud, and lest not our outer foot but, what is more grievous, our mind be sunk in its whirlpool. Philosophy indeed says that it seeks gold, but it turns over mud, since it seeks divinity in statues; but the rod breaks the vessels of the potter. We seek gold with which to cleanse our bodies, carrying about the dying of Jesus Christ in our body, that the life of Jesus Christ also may be manifested in our body. Good gold is the blood of Christ, rich for the price, flowing freely to wash away every sin. We have spoken of the order; let us consider the title.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Unto the end, he says, for the servant of the Lord, a psalm of David. In the whole body of the Psalter this is the only title by which he testifies that he wrote a psalm "for the servant of the Lord". Who is this servant of the Lord? Let us see what the course of the psalm signifies, to whom this psalm was spoken. Let us hear whom he addresses: Lord, he says, your mercy is in heaven, and your truth reaches to the clouds; your righteousness is like the mountains of God, your judgements like a great deep. To whom is this said but to the Son of God? For these things belong not to human but to divine power. But what does it mean that the title declared this psalm to be spoken "for the servant of the Lord", when in a later title he preferred to name the prayer of Moses, the man of God, rather than "the servant of the Lord"? What the plan of the prophet was, then, I do not understand, or rather the plan of the Lord the Savior himself, who spoke in the prophet. Truly his judgements are like a great deep, that he should reserve the honour for the servant and ascribe to himself the condition of servitude. I seem to myself to understand; I seem to have drawn something of spiritual grace. This psalm, as we said, was written against unrighteousness, and therefore the unrighteousness of the unbelieving weighs the more heavily, who refused to receive Christ Jesus the Lord, when for their sake he had taken on servitude. For what is so unjust as to have been ungrateful for such great benefits, that those to whom he was giving salvation should shed his blood? Indeed elsewhere, when he was speaking of his Passion, to make the odium of the ungodliness of the Jews more bitter, he speaks thus: Do not turn away your face from your servant; because I am afflicted, hear me speedily. I am poor and in sorrow.

Come, Paul, interpret for us by what reason the Lord of heaven and earth called himself poor, what this poverty is. You certainly called him rich; how is the same one rich and poor? Let us hear the testimony of Paul: You know, he says, the grace of our Lord Jesus Christ, that for your sakes he became poor, though he was rich, that you through his want might be made rich. Come you too, Isaiah, interpret for us how Christ called himself sorrowing, who was wont to heal the pains of wounds. The physician came to cure the sick: what had he himself to grieve over? Let us hear the testimony of Isaiah too: For us, he says, he grieves, and we reckoned him to be in sorrows. He expressed the feeling of a physician, who, even if he himself had no wound to grieve over, yet suffered with the wounded. This, then, is what the Lord reproaches the Jews with in the psalm: "I am poor for your sake, I grieve for you, and you laid ungodly hands on me, saying: Let us take away the righteous man, because he is useless to us. Let us put wood into his bread". Well does he say bread for his flesh; he brought nourishment, they in return for the benefit paid back punishment. It is no wonder, then, if they hunger who denied themselves the nourishment of eternal life. Beautifully too they joined these two: Let us put wood into his bread; the Jews did not know what they were saying, and they spoke a mystery. The cross of Christ has given paradise back to us; this is the wood which the Lord pointed out to Adam, saying of the tree of life, which was in the midst of paradise, that it was to be eaten, but of the tree of the knowledge of good and evil, that it was not to be eaten. Adam went astray, he did not keep the commandments, he tasted what was forbidden; through the tree we began to hunger, until the flesh received its nourishment. Therefore the Lord in Christ joined flesh and wood, that the ancient hunger might cease and the grace of life be restored. Blessed is the wood of the Lord, which crucified the sins of all; blessed the flesh of the Lord, which ministered food to all!

Concerning the poverty and the sorrow of the Lord, then, we have brought forward suitable testimonies, as I think, of the saints, of whom the one saw and spoke, the other was chosen that he might speak. Let us bring forward again, then, the testimonies of these same approved men concerning the servitude of the Lord, or rather his own testimonies, which he himself spoke about himself in both of them. Let us hear, then, what he says: Thus says the Lord, who formed me from the womb as his servant, to gather Jacob and Israel to him. We observe, then, that he took on the form of servitude for the gathering of the people. Hear, O Jew: you both make an insult out of grace and turn to unbelief the very thing on account of which you ought rather to have believed. He came to call you, and you revile him. He said "a servant from the womb". Hear, Arian, from what womb; run back a little above: From the womb, he says, of my mother the Lord called my name. Let us hear what his name is, by which the Father called him: Behold, a virgin shall conceive in the womb and bear a son, and his name shall be called Emmanuel, which is interpreted: God with us. For what other name of Christ is there but "Son of God"? Take another. Gabriel, indeed, had also said to Joseph concerning Mary: She shall bear a son, and you shall call his name Jesus. Take the voice of God: And you, Bethlehem of Judaea, are not the least among the princes of Judah; for out of you shall come forth a prince who shall rule my people. Mark the mystery: from the womb of the virgin the same one came forth both servant and Lord, servant to work, Lord to command, that he might root the kingdom for God in the minds of men; both are one, not one from the Father and another from the virgin, but the same, who before the ages was from the Father, himself afterwards took flesh from the virgin. Therefore he is called both servant and Lord: servant for our sake, but by the unity of the divine substance God from God, Prince from Prince, equal from equal; for he did not beget one degenerate, in whom he declared that he was well pleased.

It is a great thing for you, he says, to be called my servant, that you may establish the tribes of Jacob. Everywhere he keeps the names of his dignity: a great God and a great servant; nor does he lose in the flesh the name of his greatness, of whose greatness there is no end. And rightly secure, when he was in the form of God, as the Apostle says, he did not think it robbery to be equal to God, but emptied himself, taking the form of a servant, made in the likeness of men; and found in appearance as a man, he humbled himself, becoming obedient unto death, even the death of the cross. This, then, is he who is equal as being the Son of God; this one took the form of a servant in the flesh; this one tasted death, whose greatness has no end, because the end of the Law is Christ, unto righteousness for everyone who believes, that we may all believe in him and adore him with inmost affection. Good is the servitude which made all free; good the servitude which acquired the name above every name; good the humility which brought it about that at his name every knee should bend, of things in heaven and on earth and under the earth, and every tongue confess that the Lord Jesus is in the glory of God the Father. Unto this end, then, this psalm is directed, that we too may be servants unto righteousness, not proud unto arrogance; for servitude is the wage of liberty, but arrogance is the wage of death. But now let us take up the course of the psalm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The unrighteous man said, that he might sin against himself. What he said he did not express, and therefore I think it must be understood thus: that whatever the unrighteous man says is sin. For all unrighteousness is sin, since, where the instrument is faulty, how can the song not be faulty? The offspring of degenerate matter is discoloured. Whatever, then, the unrighteous man speaks is iniquity, which turns back upon its own author, like the offspring of the viper, which first tears open its own mother, as the common saying is; so he sins against himself. I think nothing more sublime has been said than this sentence; in those who claimed for themselves the wisdom of the world I have read nothing like it, I have learned nothing like it. Nor is it surprising, since they spoke by human talent, while this the Spirit of God poured in, the Spirit of truth: that the unrighteous man sins against himself, begets wounds for himself, stabs himself through. For as thorns spring up in the hand of the drunkard, as Scripture asserts, so too in the speech of the unrighteous man there spring up things that pierce the speaker. The unrighteous man speaks, and his inner conscience is wounded, because in every word that he speaks he is not free of fraud. For whose punishment is heavier than one's own, since he pays a penalty for every word? The serpent pours its venom into others, the unrighteous man into himself; for whatever he has poured out flows back upon him. The unrighteous man, then, is both useless to others and harmful to himself, but the life of the righteous man is fruitful to others and sweet to himself; for Solomon says: Son, if you are wise for yourself, you will be wise for your neighbours also; but if you turn out evil, you alone will drink up evils.

We observe, then, that righteousness is born for others rather than for itself; it looks to the common advantage, not its own, and counts another's good as its own gain. Blessed and glorious is righteousness, whose good profits all; for the most part it sets out from one and reaches all. Righteous was David, who spared his enemy and preferred to protect his innocence rather than his life, lest he should be avenged to the public harm and, by taking vengeance himself on the man who lay in wait for him, give others an example of attacking a prince, even in evil causes. Righteous was Abel, who thought that the firstfruits of his sheep, which the Lord had given him, should be offered to the Lord; and therefore he pleased God more, because he made no delay and proved his devotion. But this the ungodly man could not bear, the transgressor of righteousness, the root of iniquity, and therefore he killed his brother, because his brother's victim had been more approved by God than his own offering. But the one, slain, spoke to God in the voice of his blood; the other, living, was driven from the face of the Lord, and while punishment from the Lord was still held back, the consciousness of his sins tormented him. The wretch lay hidden, trembling and fearing, and while as yet no slayer was at hand, the very life of the unrighteous man tortured itself. He had received a sign, that no one should kill him, not that he might enjoy the sweetness of life, but that death might not take away his misery, so that he might suffer by fearing his slayer every day. He had indeed obtained that a slayer should be held back, but without any intermission he was himself his own executioner, himself his slayer.

What punishment is greater than to fear what you cannot avoid, and not to escape what you have feared? Hence David, splendidly expressing the most grievous dunning of a sinful conscience, says: For I acknowledge my iniquity, and my sin is ever against me. For the avenging image of our sin is spread before us and does not allow its defendant to be at rest; it brings on a wretched servitude and draws him into its chains, so that he cannot untie himself, since he willingly sold himself, though he was free not to take on the debt of sins and to keep the liberty of innocence. And so while we pray, sin spreads itself before us; when sleep has relaxed the senses of the body, sin returns. Always our error meets us like a wicked exactor, or like a shameless usurer dunning his debtor. Hence the Lord says: He who commits sin is the servant of sin. But the righteous man knows how to loosen the chains of his sins; he does not wait for an accuser but forestalls him, so that by confessing he lightens all his sin, lest the adversary have anything to charge him with. And therefore Scripture says to you: The righteous man is his own accuser at the beginning of his speech; for he snatches the voice from the adversary, and by the confession of his sins binds fast, as it were, certain teeth made ready for the prey of hostile accusation. Judas Iscariot said, so as to sin against himself — what did he say? —: Whomever I kiss, he it is; hold him. This he said, and by his own mouth drove himself into death. How many torturers must we think were in him, that he himself should bear down upon himself as the exactor of so grievous a punishment, and strangle himself with a noose!

The unrighteous man spoke and sinned against himself; the righteous man spoke: Behold, I the shepherd have done evil, and this flock, what has it done? and all his sin was forgiven. The righteous man spoke, then, and profited himself. Cain said: Am I my brother's keeper? and he lied to himself. Ananias said that he had brought the whole price of his sold land, and he lied to himself, who could have offered less without fraud. And therefore he says splendidly: And iniquity has lied to itself. For it lies first to itself when it lies to its own ruin; he sins against himself who robs himself of the sweetness of innocence. For what fruit is sweeter than purity and simplicity of heart, what food more pleasant than that on which the mind of one with a good conscience and the heart of the innocent feast? But iniquity weighs down the conscience as with a talent of lead, as Scripture testifies, and rightly David says: Like a heavy burden they have weighed heavy upon me, and Solomon: As an unripe grape to the teeth and smoke to the eyes, so is iniquity to all who use it. A heavy punishment, which hinders food, clouds the sight, and, what is more, pours a dark mist over the eyes of the inner mind, so that the unrighteous man cannot see what is true. And therefore he sins against himself who robs himself of the things that are precious.

The unrighteous man, then, speaks so as to sin against himself, but the righteous man speaks so as to profit both others and himself; the one speaks for destruction, the other speaks for salvation. Of the righteous and the faithful indeed it has been said: With the heart one believes unto righteousness, but with the mouth confession is made unto salvation. The tongue of the one wounds, but the tongue of the prudent heals. Hence, when David remonstrated with King Saul that, forgetful of the benefit of his safety, he was ungratefully pursuing to the death one by whom he saw that he had so often already been preserved, and was seeking the life of one who had exposed his own life to dangers for the king's safety, he said that the fruit of righteousness was not lost to him, since he had not slain the man who lay in wait for him when the Lord had delivered him into his hands. From the unrighteous iniquity came forth, from serpents venom was poured out; the venom and the weapons of iniquity have perished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
