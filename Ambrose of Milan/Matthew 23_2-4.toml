[[commentary]]
quote='''
What is 'the scribes have sat', unless that the letter is written? Hence the scribes are also called γραμματεῖς in Greek, following the interpretation of the letter, not the understanding of the spirit; but the letter kills. Those, then, who follow the killing letter and echo it in their very name are scribes and Pharisees, that is, those who are divided from the unity of truth; for phares is interpreted 'division'. And the Pharisees divide the words of the Law in this way: they echo them and meditate on them, but do not see the mysteries and sacraments of the spiritual Law. For if the Law is spiritual, surely the precepts of the Law are spiritual and its works are spiritual. Saying, then, what Moses wrote, they bind heavy burdens with the bodily things of the Law — for those things are heavy which are contrary to the yoke of Christ — and through their wayward doctrine they lay heavy burdens on the ears of their hearers, which they themselves will not move even so far as to stir them from the bodily things of the Law to the spiritual words of Scripture. For so it is to be understood that they will not move them with their finger, that is, not even for a tiny point and moment do they carry themselves over to spiritual understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
