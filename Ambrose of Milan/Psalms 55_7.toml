[[commentary]]
quote='''
Whoever, then, wishes to be lifted up by the hand of Christ, let him first fly away himself, let him have his own wings — he who flees the world has wings — and if he does not have his own — lest perhaps he alone should have his own who has the power of flying —, if, I say, he does not have his own, let him receive them from him who has. He, then, who flees the world flies. Behold, he says, I have gone far off in flight and remained in the wilderness. David, then, flew away like a night-raven in the dwelling, like a solitary sparrow in the house. But if you refer it to Christ, he flew away in the passion of his body, so that under the shadow of his wings he might protect the peoples of the nations. He flew away in his Godhead, he remained in body and dwelt in the desert, so that the children of the desolate woman might become more than those of her who had a husband. Let us, then, follow that body, so that we too may rise again; for where the body is, there too are the eagles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
