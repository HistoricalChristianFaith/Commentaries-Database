[[commentary]]
quote='''
Mighty is the Lord who pardons one man for the good deed of another, and while he approves of the one, forgives the other his sins. Why, O man, with thee does not thy fellowman prevail, when with God a servant has both the liberty to intercede in thy behalf, and the power of obtaining what he asks? If thou despairest of the pardon of heavy sins, bring the prayers of others, bring the Church to pray for thee, and at sight of this the Lord may pardon what otherwise He might deny to thee.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Whose faith he says when he saw. Great is the Lord, who for the merit of some pardons others, and while he approves some, remits the errors of others. Why, O man, should your fellow not prevail with you, when with the Lord a servant has both the merit of interceding and the right of obtaining? Learn, you who judge, to pardon; learn, you who are sick, to obtain. If you despair of pardon for grave sins, bring in intercessors, bring in the Church to pray for you, in consideration of which the Lord pardons what he could deny to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Surely it is the creditor's right both to exact and to remit. And therefore the same one remits who has the right of exacting. When, therefore, Christ has said to me in the Gospel: Your sins are remitted to you, do I not understand that the same one is lord of the principal whom I recognize as the arbiter of pardon? Or if the Father lent and the Son remitted, not through unity, as we say, but, as the Arians assert, through a difference of power, did then one God lend and another remit? Whence they run into this, that they do not escape the faithlessness of the Manichaeans. Next, in saying that one God is good, let them notice into what snares of their own madness they fall. If he who lent is good, how is he not good who remitted? Therefore let the Arians have their portion with those with whose assertion they agree. Nor is it surprising if he who has once begun to stray from the truth entangles himself in the knots of another's error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
