[[commentary]]
quote='''
But having finished His teaching, He rightly instructs them to follow the example of His precepts. For straightway the servant of a Gentile centurion is presented to the Lord to be healed. Now the Evangelist, when he said that the servant was about to die, did not err, because he would have died had he not been healed by Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Mystically, by the centurion's servant is signified that the Gentile people who were enthralled by the chain of worldly bondage, and diseased with deadly passions, are to be healed by the mercy of the Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Beautifully, when he has completed the precepts, he teaches us to carry out the form of his precepts; for immediately the servant of a Gentile centurion is presented to the Lord to be cured, in whom the people of the nations, which was held by the bonds of worldly slavery, sick with deadly passions, is portrayed as about to be healed by the Lord's kindness. And in saying that he was about to die the evangelist did not deceive; for he was about to die, had he not been healed by Christ. He fulfilled the precept, then, with heavenly love, he who so loved enemies as to snatch them from death and take them up into the hope of everlasting salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
