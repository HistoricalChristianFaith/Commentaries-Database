[[commentary]]
quote='''
The devil has very many wolves, which he sends against the sheep of Christ. And therefore the intelligible Joseph, to save his sheep, seized the very enemy who was coming to plunder the sheep, the wolf Paul, making of the persecutor a teacher. Of him Jacob speaks, as it is written: Benjamin is a ravening wolf; in the morning he will still eat, and at evening he will divide food to the princes. He was a wolf when he was scattering and devouring the sheep of the Church; but he who had come as a wolf was made a shepherd. He was a wolf while he was Saul, when he entered into houses and dragged men and women off to prison. He was a wolf when, breathing threats and slaughter against the disciples of the Lord, he sought letters from the chief priests, that he might fall upon the little servants of Christ. Him, as he roamed like a wolf in the darkness of night, Jesus blinded by pouring light around him. Therefore Rachel, when she bore Benjamin, called his name son of my sorrow, prophesying that from that tribe Paul would come, who in the time of his persecution would afflict the sons of the Church and torment their mother with heavy sorrow. But yet the same man afterwards, at a later time, divided food to the princes, preaching the word of God to the Gentiles and calling very many to faith, men who, while he disputed, received the grace of the Lord, such as the legate of the proconsul Paulus and Publius the prince.

Beautifully, too, did Moses say, when he blessed the tribe of Benjamin: the beloved of the Lord will dwell trusting, and God will overshadow him all the days, and the beloved of the Lord will rest between his shoulders. He also was made a vessel of election; for he was converted in no other way than by the mercy and love of the Lord. Hence he himself too, ascribing nothing to his own merit but attributing everything to Christ, says: for I am the least of the apostles, who am not worthy to be called an apostle, because I persecuted the Church of God. But by the grace of God I am what I am, and his grace in me was not needy. He dwelt trusting in the house which before he was laying waste; he dwelt in the tabernacles of Christ, he who before had wandered like a wolf in the woods; and God overshadowed him when Christ was seen by him. Although with open eyes he saw nothing, yet he saw Christ. And rightly did he see him present, whom he also heard speaking. That overshadowing is not of blindness, but of grace. Indeed, it is said to Mary: the Holy Spirit will come upon you, and the power of the Most High will overshadow you.

And he will rest between his shoulders, that is, between good acts and precious works. For above, too, you have it that Issachar set his shoulder to labour and became a husbandman. Imitating him, Paul set the young plantings of faith, and therefore, as a good husbandman, he said: I planted, Apollos watered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 12"
