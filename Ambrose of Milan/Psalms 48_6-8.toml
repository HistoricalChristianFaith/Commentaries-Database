[[commentary]]
quote='''
In fact, faith faltered, and the flesh had begun to feel shipwreck. This is not improperly said, because the flesh is the ship of the soul, as it is written: Those who go down to the sea in ships, and elsewhere: There were pains as of a woman in labour. With a vehement spirit you will crush the ships of Tarshish. For our souls, when they are in labour with the Word, bring forth pains; but she who has given birth no longer remembers the sorrow, for joy that a man has been born to her who redeemed the world. The ships of Tarshish, then, that is, intelligible ships, which carried gold and silver to Solomon, are our bodies, which have a treasure in earthen vessels, as the Apostle said: either because here too they are crushed by the hazard of childbirth, according to what was said: Woe to those who are with child and to those who give suck! — for when the soul is shaken, the flesh is tossed — or because they will be stirred up by a vehement spirit poured into them, when, the time being fulfilled, the resurrection must come, according to what is written: Come, spirit, and breathe upon these dead, and they will live. Hence Job himself too says in later passages: For I know that he is eternal and mighty who is to release me, to raise up on the earth my skin, which has borne this. They are crushed, then, because they are raised up for judgment. And crushing is good; for a heart that is crushed and humbled God does not despise, and elsewhere: Heal its crushings. But to Jehoshaphat too it was said: They were crushed ..... to go to Tarshish, because he had joined himself to a sacrilegious man. Crushing, then, signifies both, because both are in the day of judgment, when all who are in the tombs will hear the voice of the Son of God and will come forth, those who have done good to the resurrection of life, those who have done evil to the resurrection of judgment. This David the prophet also signifies, saying: There were pains of a woman in labour. As we have heard, so also have we seen in the city of the Lord of hosts, in the city of our God. For he takes in both the pain to come and the joy: pain from the judgment, joy from the absolution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 5"
