[[commentary]]
quote='''
The bed of the soul, then, is the weak flesh, with whose sickness our soul suffers; and if it has the Lord as its helper, he says to it: rise, take up your bed and go into your house. Strengthened by this word of God, he who was sick rises and takes up the bed on which he was lying and returns to his former state of health. This is to go back into one's house: to dwell in the dwelling of the most robust health. He who dwells there rules; he who rules has the grace of virtue supporting him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
