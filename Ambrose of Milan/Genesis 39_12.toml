[[commentary]]
quote='''
He is excused for going in; he is praised for slipping away, and for not valuing the garments of the body more than the chastity of the soul. He left, as not his own, what the adulteress was holding with her hands, and judged to be another's what could be seized by the touch of an unchaste woman. A great man indeed, who when sold knew nothing of a slavish spirit, when passionately loved did not love in return, when asked did not consent, when seized fled away; who, when he was approached by his master's wife, could be held by his garment but could not be captured in his soul, and did not even endure her words for long, judging it a contagion if he lingered longer, lest the incitements of lust should pass over through the adulteress's hands. And so he stripped off his garment, shook off the crime, and, leaving behind the cast-off clothing by which he was held, he fled, despoiled indeed, but not naked, because he was the better covered by the clothing of modesty; for no one is naked but him whom guilt has made naked. Indeed we have in the earlier passages that Adam, after he deserted the commandments of God by transgression and contracted the debts of grievous sin, was naked. Hence he himself says: I heard your voice in paradise and I was afraid, because I am naked, and I hid myself. For he understood that he was naked, he who had lost the insignia of divine protection. And therefore he lay hidden, because he did not have the garment of faith, which he had surely laid aside by transgressing. You see a great thing. That man was naked who did not lose his tunic; this man was not naked who stripped himself of the garments which he left in the hands of the adulteress. The same Scripture declared the one naked and denied it of the other. And therefore this man despoiled himself rather than made himself naked, since he kept the incorrupt garments of the virtues, despoiling himself of the old man with his deeds, so as to put on the new, who is renewed in knowledge according to the image of the Creator; but that one remained naked, who could not clothe himself again, stripped of the singular covering of virtue. Hence he received a tunic of skin, because as a sinner he could not have a spiritual one. Joseph therefore left his garments and laid bare the shamelessness of the adulteress, which afterwards could not lie hidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
