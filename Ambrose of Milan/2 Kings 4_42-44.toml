[[commentary]]
quote='''
Again, there is no occasion for concern that I might have invited more people than I can possibly provide with food and that the bread of my discourse may not be sufficient for you all. We cannot attain to the perfection of faith exemplified in the case of Eliseus, who was not disturbed by the small amount of bread in his possession. It was his wish and intention to distribute it among all in sufficient amount. Accordingly, he instructed his servant to divide among the people the ten barley loaves. And his servant said: ‘How much is this to set before a hundred men?’ Eliseus replied: ‘Give that they may eat for thus said the Lord; they shall eat and there shall be left.’ And I do not fear that your situation may make you ravenous. You have had your fill, yet you are returning home both hungry and empty, for it is written: ‘The Lord strengtheneth the just and in the days of famine they shall be filled.’

To be unashamed to offer loaves of barley and to give what you have rather than to withhold hospitality is a much more commendable act. While he gave to the people in abundance, Eliseus left nothing for himself. Eliseus, therefore, was not ashamed to serve barley bread, whereas we find it shameful to have understanding of simple created things, which are called by their simple and customary names. When we read of ‘heaven,’ we should understand this to mean what it says. When we read of ‘earth,’ we should understand the fruit-bearing earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
