[[commentary]]
quote='''
We have treated the moral passage, that she did not ply the works of a harlot but chose the gifts of fruitfulness; let us treat the historical and winnow the mystical; for it cannot be without a mystery that she received a ring and a necklace and a staff. Not mean is the person who merits to receive ornament, seal and power: the seal of deeds, the ornament of the breast, the badge of royal freedom. So, to begin with the history: when Tamar was giving birth, you have read that one put forth his hand from her womb first, and the midwife, seizing it, tied scarlet on it, saying: This one will come out first. But when the child drew his hand back into his mother's womb, at once his brother came out. And the midwife said: Why has the hedge been cut through because of you? And she called his name Perez. And after him came out his brother, on whose hand was the scarlet, and she called his name Zerah. You see how many enigmas reveal the mystery: the hand put forth, the scarlet tied, the hand drawn back, the twofold saying of the midwife, that the one would come out first, that the other cut through the hedge.

But why did the one put forth his hand from the womb, while the other went before in the coming forth of birth, unless because through the mystery of the twins a twofold life of the peoples is described, one according to the Law, the other according to faith, one according to the letter, the other according to grace? Grace is prior to the Law, faith prior to the letter. And therefore the type of grace put forth his hand first, because the action of grace went first, which was in Job, Melchizedek, Abraham, Isaac and Jacob, who lived through faith without the Law; Abraham, indeed, believed God, and it was reckoned to him for righteousness. Melchizedek too, going before, showed in a figure the grace of the holy sacrifice; for the holy patriarchs, anticipating the Law, released from the bonds of precepts, shone with the free grace of the Gospel, like to ours.

The younger brother of these is the second order of devotion; for the first is in the patriarchs, the second in the kings and priests. For both lives are according to God. For those too who served a religious and dutiful warfare under the law of Moses are not without share in grace and honour, but the fruit of devotion was earlier in the founders than in the heirs. For Zerah was first, who by interpretation signifies 'the East'; for the light of devotion is the splendour of the true East, of him surely who said: The East is my name, whose ray of light first shone in the patriarchs. For these first put forth the action of their life into this world, and in their hand the figure of our action too went before, as of a fuller body, we who were still held as it were in the womb of generating nature. But the observance of the Law was set in the middle like a hedge thrown across, and in a manner the life of the forefathers seems to have been cut through; of which that midwife in the type — perhaps righteousness, which received us when we were sent forth from the belly of mother nature — is reported to have said: This one will come out first. And truly wonderful was that order of devotion, impressed not by Moses nor by any man nor through man, but by a certain gift of wisdom pouring itself in of its own accord.

So the first discipline of devotion is according to the Gospel, because we believe through the cross and blood of Christ, whose day Abraham saw and rejoiced; whose grace, figured in the type of the Church, Noah foresaw with spiritual knowledge; whose part in the sacrifice Isaac did not refuse; whom Jacob worshipped when he was prevailing; the redness of whose garments Isaiah saw — for the life of the prophets too is according to the Gospel — in whose blood, amid the destruction of the world, that Rahab, a harlot in type, the Church in mystery, showed the future sign of public salvation; the Church which does not refuse union with many strangers, and the more joined to many, the more chaste: an immaculate virgin, without wrinkle, entire in modesty, plebeian in love, a chaste harlot, a barren widow, a fruitful virgin: a chaste harlot, because she is frequented by many lovers with the allurement of love and without the defilement of sin — he, indeed, who cleaves to a harlot is one body — a barren widow, who knows not how to bear when her husband is absent — the husband came and begot this people and this multitude — a fruitful virgin, who bore this multitude with the fruit of love, without the use of lust.

But to return to the history, what do the words of the midwife mean, when she says: This one will come out first, unless it is that he bore the type of him who, later in the birth of the body, being first in virtue and truth, claimed for himself the primacy over all? Hence John too: After me comes a man who was made before me. What does it mean that she tied scarlet on his hand, unless that he was a type of him who by the sign of his cross and the shedding of his blood made human action illustrious? And so, after he drew back his hand, his brother came out as if the hedge had been cut through, he whom the Apostle named as it were the middle wall of the hedge or of the enclosure, and who himself received his name from the cutting; for Perez is division. Hence the Pharisees too were so called, because they separated themselves from association with the many. But it would have been more blessed and much better for the hedge not to be cut through, but to remain one and the same and undivided, which could have happened if the warfare of the life that followed had been consistent with the life which put forth its hand first, that is, showed its action. For it would have been much better if the circumcised people had been willing to imitate the life of the forefathers; for thus there would have been one hedge, one enclosure, one building of those before and those after. But since the weakness of the later life could not fulfil that first action of life, the hedge or enclosure, which had been built according to God, was beyond doubt cut through, and as it were a middle wall was set in between, so that that hedge, that is, the perpetual and continuous building of good morals, was broken. For a hedge is that by which a fruitful field is surrounded and the incursion of the thief kept off, which shuts in what is cultivated and separates off what is waste. An enclosure too shuts in a house. If this remains, the house is safe. Finally I will take away he says its enclosure, and it will be for plunder.

Let us pray that this enclosure of our house may be whole, of the spiritual house which is within us; for it cannot be built up by man, but by the living God, who says: And I put an enclosure around it. Those therefore lost salvation who lost the enclosure. Let the enclosure remain, then; let this hedge remain. Do you wish to know how useful a hedge is? Hedge your ears with thorns and thistles and do not listen to a wicked tongue; for this hedge defends you from guilt.

So the Lord Jesus, who afterwards came into the light according to the flesh, restoring the defence of that old hedge, re-formed us into the action of the forefathers and the ancient simplicity of faith. Hence the prophet too said of him: You will be called the builder of the hedge. For he took away that barrier which divided the unity of mind and body and the course of a simple life, and he himself became our peace, who made both one and loosed the middle wall of the hedge. Which wall the Apostle explains as the enmities in the flesh. These enmities, then, the Lord took away, and he restored peace and made void the law of commandments in decrees, so as to create the two in one new man; in which he signifies not only the outer and the inner man, but also the Jew and the Greek, that Christ might be all and in all. For the Lord took away the superstition of the sabbath, of the bodily sabbath, and as it were loosed the middle wall of the Law, which by the difficulty of its decrees kept us from that devotion which is according to God, because under the law of Moses it was not easy or possible for the Gentiles to serve God, since the empty superstition of the Jews held back the pure disposition of the Gentiles from undertaking the observance. What then? Is the Law useless? Far from it; but useful to unbelievers and necessary to the weak, to restrain the slippery and the straying by the severity of a saving precept and to hem them in by attention to observances. But the Law is good, because it is spiritual. It is not good, then, to him who does not think it spiritual, who, made small and low in mind, could not see that which is above the Law, namely the majesty of Christ. Which surely that Isaiah, lofty in mind, looking as it were over that wall, saw: the glory of God, which is seen on the mountains, not on the hills.

So the Church taught us in the Song of Songs that this wall could not stand in the way of our Lord Jesus Christ, nor of him who has followed Christ, when she said: The voice of my brother; behold, he comes leaping over the mountains, bounding over the hills. My brother is like a roe or a young hart on the mountains of Bethel. Behold, he is here behind our wall, looking out through the windows, looking out through the nets. My brother answered and said to me: Arise, come, my neighbour, my beautiful one, my dove, for behold, the winter has passed, the rain has gone. It has gone its way. Flowers have appeared on the earth, the time of cutting has come, the voice of the turtledove has been heard. The flowers are the apostles, the time of harvest is the fruit of Christ, the voice of the turtledove is the voice of the Church. Rightly, then, the Son of God, after he saw men earthly and not stepping toward the things above, and confined within bodily narrownesses — there was none, indeed, who did good, there was none, not even one — himself deigned to descend to earth, to take away that wall of the Law, that is, a kind of mass and superstition of bodily understanding, which as it were pressed down and overshadowed the hearts of the peoples. Better, then, is the enclosure than the wall. Finally, not good is the whitewashed wall, which was not said idly to the chief of the priests, because he was keeping the hindrances of the middle wall, which the Lord Jesus took away as a hard warfare, so as to pour in a clearer observance of religion, so that now not the one race of the Jews, shut in as it were by a bodily prescription of the Law, but all nations should be called to the worship of God through the Gospel.

The two twins, then, are two twin lives, two twin warfares, such that the former is better than the one that follows. And therefore what is better has been restored. And who would deny that the Gospel excels the Law? Yet the Law is good, if you raise your mind above the letter; the letter, indeed, kills. But what grace would this history have, if we did not see the light of so great a mystery? For the holy Apostle taught us to seek the secret of truth in the simplicity of history and to carry the sense over into certain discussions not intelligible according to the letter, when he wrote: Tell me, you who have read the Law, have you not heard the Law? For it is written that Abraham had two sons, one from the slave woman and one from the free woman; but he who was from the slave woman was born according to the flesh, and he who was from the free woman according to the promise. Which things he says are spoken by allegory. For these are the two testaments; and below: But the Jerusalem which is above is free.

Let us then strive, with loftiness of mind, toward her whom the middle wall could not cut through and divide. For that wall of the old testament has been loosed according to bodily understanding; the slave woman has been cast out, the free woman is kept. Of the free woman we are free; for the Church is free, the synagogue has been cast out — for the people of the Jews was in slavery — removed is the yoke of slavery, which pressed down, as it were, the necks of our soul, so that we could not look beyond the wall of the former life. We have a good and light yoke, which with the reins of peace and the bonds of grace raises rather than bows down those joined to it. This is the Lord whose type went before in Zerah, because from the tribe and from the seed of that Zerah the Lord Jesus was born according to the flesh, not only of a woman but also under the Law, to redeem those who were under the Law at the price of his blood. His figure went before in the hand of that Zerah for this reason: to promise us that he would come who would recall the practice of the old life and restore in the last Adam the freedom he had granted to that first Adam, so that the human race should now be without the law of slavery.
'''
