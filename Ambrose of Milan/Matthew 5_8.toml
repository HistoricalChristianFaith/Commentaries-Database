[[commentary]]
quote='''
(in Luc. vi. 22.) The merciful loses the benefit of his mercy, unless he shows it from a pure heart; for if he seeks to have whereof to boast, he loses the fruit of his deeds; the next that follows therefore is, Blessed are the pure in heart.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And what wonder if in the present world the Lord is not seen except when he wills? In the resurrection itself too it is not easy to see God, except for those who are pure in heart. And so: blessed are the pure in heart; for they shall see God. How many blessed ones he had already numbered, and yet he had not promised them the faculty of seeing God! If then those who are pure in heart shall see God, surely others shall not see him; for neither shall the unworthy see God, nor can he who has not wished to see God see God. Nor is God seen in a place, but with a pure heart; nor is God sought with bodily eyes, nor circumscribed by sight, nor held by touch, nor heard by address, nor perceived by his gait.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
