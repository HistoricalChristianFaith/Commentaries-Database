[[commentary]]
quote='''
Let us keep close to the meaning of the prophetical words. Let us not hold in disdain as unworthy of our consideration the language of the Holy Spirit, who says: ‘Let the earth bring forth alive cattle, beasts and crawling creatures.’ What is the need of further argument, since it is evident that the natural origin of terrestrial creatures is in question? The Word of God permeates every creature in the constitution of the world. Hence, as God had ordained, all kinds of living creatures were quickly produced from the earth. In compliance with a fixed law they all succeed each other from age to age according to their aspect and kind. The lion generates a lion; the tiger, a tiger; the ox, an ox; the swan, a swan; and the eagle, an eagle. What was once enjoined became in nature a habit for all time. Hence the earth has not ceased to offer the homage of her service. The original species of living creatures is reproduced for future ages by successive generations of its kind.

Do you wish to turn the creatures that have been generated to the profit of man? You will all the more accommodate creatures to man’s pleasure if you will not deny to all creatures what is appropriate to their natures. In the first place, nature has designed that every species of cattle, beast, and fish has its belly extended, so that some crawl on their stomachs. You may observe that even those animals that need the support of legs are, by reason of their four-footed motion, part and parcel of the earth and thus lack freedom of action. They have, in fact, no ability to stand erect. They therefore seek their sustenance in the earth, solely pursuing the pleasures of the stomach toward which they incline.

Take care not to be bent over like cattle. See that you do not incline—not so much physically as they do, but morally. Have regard for the conformation of your body and assume in accordance with it the appearance of loftiness and strength. Leave to animals the sole privilege of feeding in a prone position. Why, contrary to your nature, do you bend over unduly in the act of eating? Why do you find delight in what is a violation of nature? Why do you feed on the things of the earth like cattle, intent on food both day and night? Why do you dishonor yourself by surrendering to the allurements of the body, a slave to the whims of appetite? Why do you deprive yourself of the intelligence with which the Creator has endowed you? Why do you put yourself on the level of the beasts? To dissociate yourself from these was the will of God, when He said: ‘Do not become like the horse and the mule who have no understanding.’

If the voracity and intemperance of the horse and his whinny of pleasure directed toward the mare give you delight, you should also find pleasure ‘with bit and bridle to bind fast your jaws.’ If you revel in ferocity, the dominant trait of savage beasts for which reason they are slain, see that you, too, may not become a victim of your own atrocious cruelty.

The donkey is a slothful and stupid animal, an easy prey to all mischance. What is the lesson that this animal conveys? Is it not that we should become more alert and not grow dull from physical and mental inactivity? Why not, rather, take refuge in a faith which tends to lighten our heavy burdens?

The wily fox hides away in pits and caves. Is not this proof that the animal has no purpose? Because of his habit of plundering he deserves our hatred and warrants our aversion for his total lack of caution while laying snares for his victims.

The partridge is cunning in that she steals the eggs of another partridge and fosters them with her own body. But she is unable to profit from this, because she loses the brood as soon as she has hatched it. When these hear the voice of the partridge who has laid the eggs, they leave their adopted nest and, following a natural instinct, go to her whom they recognize as their true and natural mother. In this way they indicate that the function of a nurse is totally different from that of a mother. Thus, she performs her own proper labors in vain and pays the penalty of her own deceit. Hence Jeremias says: ‘The partridge uttered a cry and gathered what she did not lay,’ that is, she gathered the eggs and gave forth a cry as if rejoicing at the effect of her own deceit. But she spends her labor in vain. Her prolonged period of brooding benefits another and not herself.

The Devil imitates this bird in his endeavor to lay claim to the generations of the eternal Creator. If he succeeds in bringing together a group lacking in wisdom and devoid of sound sense, he allures them with corporeal enticements. As soon as the voice of Christ reaches the hearts of the little ones, they depart and take themselves to their mother, who embraces her young with an endearing mother’s love. The Devil did not create the Gentiles, but he gathered them in. When Christ in His Gospel sent forth His message, they eagerly fled so as to be under the protection of the shadow of His wings. He consigned them to the fostering care of Mother Church.

The lion, proud in the fierceness of his nature, will not brook mingling with other wild animals. Like a king, he disdains association with them. He scorns the food of the previous day. He turns away even from the fragmentary remains of his meal. What wild beast would venture to associate with him whose roar of itself inspires such terror that many animals who could outrun him will quail on hearing it, as if struck dumb by some strange force.

Scripture is also not silent about the nature of the leopard. By the varied character of his coat he betrays the variety of his emotions. Jeremias says: ‘If the Ethiopian can change his skin or the leopard his spots.’ This is not said merely of what is external. It refers, also, to changes in the fierce nature of the animal. The Jewish people, whose characters were spoiled because of the gloomy and uneasy fluctuations of their hearts and minds, could not attain the grace of good purpose. Once they had acquired the fierce character of a wild beast, they were unable to return to a better and improved mode of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
There is in the nature of quadrupeds something which the language of the prophetical books exhorts us to imitate. We should follow their example and avoid slothfulness. Neither because of size nor bodily weakness should we desist from our eagerness to carry into effect the lofty aims of a virtuous life.

The ant is a tiny animal, yet she ventures to achieve things beyond her strength. She is not driven to labor as a slave is. Rather, without compulsion and with freedom of foresight, she lays up provision for a future day. Scripture admonishes us to imitate the industry of the ant: ‘Go to the ant, thou sluggard, and consider her ways and be wiser than she.’ She has no land under cultivation. Yet, without a taskmaster to urge her on as she looks after her stock of food, what a harvest has she in store for herself—a harvest gathered from the results of your labors! While you may frequently be in need, she wants for nothing. There are no granaries closed to the ant, no guards impassable, no stores of grain untouchable! The guard sees and dares not prohibit the theft. The owner gazes on his loss and exacts no punishment! Over the plain moves the dark column. The paths are aglow with the concourse of voyagers and particles of grain which cannot be seized by their narrow jaws are heaved along by their shoulders! The owner of the crop beholds all this and blushes to refuse such trifles to co-operative industry such as this!

What shall I say about dogs who have a natural instinct to show gratitude and to serve as watchful guardians of their masters’ safety? Hence Scripture cries out to the ungrateful, the slothful, and the craven: ‘Dumb dogs, not able to bark.’ To dogs, therefore, is given the ability to bark in defense of their masters and their homes. Thus you should learn to use your voice for the sake of Christ, when ravening wolves attack His sheepfold. Have the word ready on your lips, lest, like a silent watch-dog, you may appear because of your unfaithfulness to abandon the post entrusted to you. Such a dog was the friend and companion of an angel. Not without reason did Raphael in the prophetic book cause this dog to accompany the son of Tobias when he went on a journey, in order to drive out Asmodeus and thereby confirm the marriage. The demon is driven out as the result of a grateful recognition and the union is stabilized.

And so, under the symbolism of a dumb animal, the angel Raphael, as director of the young man Tobias whom he had agreed to protect, was able to arouse sentiments of gratitude in him. Who would not feel shame if he did not return thanks to those who are well deserving of it, when he sees that even beasts shun the sin of ingratitude? These animals hold in grateful memory the sustenance they have acquired. Are you not mindful of the salvation you have received?

Although ‘a bear lies in wait,’ as Scripture says—for she is a wild beast full of deceit—when she finds her young at the moment of birth to be formless, she immediately proceeds to lick them with her tongue until they become like her in form and shape. Do you not marvel that a wild animal should show such devotion with her tongue, an animal whose inherent nature is manifested by love for her young? The bear, therefore, forms her young into the likeness of herself. Are you not competent to train your sons, so that they, too, may become like yourselves?

What shall we say about the bear and the art of medicine? She knows, in fact, how to heal herself when suffering from the effects of a serious wound. She lies under a plant called by the Greeks ‘flomus’ and touches it with her open sores, which are thereby healed.

Serpents, too, are able to rid themselves of blindness by eating the fennel plant. Accordingly, when they feel their eyesight becoming weaker, they search for their familiar remedy and are not disappointed in its results.

When tortoises, after eating the entrails of a serpent, feel the poison circulating through their bodies, they have recourse to a plant called marjoram in an effort to find a cure. Even when they lie concealed in their lairs in the marshes, they instinctively seek for a curative antidote. By this assured cure they attest that they know the efficacy of plants. You may observe that foxes, too, heal themselves with resin from a pine tree. By making use of such a remedy they postpone the time of imminent death.

The Lord gave utterance to these words in the book of Jeremias: ‘The turtle and the swallow and the sparrows of the field observed the time of their coming, but my people have not known the judgments of the Lord.’ Swallows know the time of their coming and of their return. These dutiful birds know how to announce the signs of spring by the testimony of their arrival.

Ants also keep watch for the coming of sunny weather. When they notice that their store of food remains soggy because of rain storms, a careful exploration is made of atmospheric conditions to determine when a series of warm days should arrive. Then they release the food supply, which is carried out of their hiding places to be dried by prolonged exposure to the sun. For that reason you will never experience stormy weather during that whole period of time, except when it should, in the interval, happen that the ants have changed their minds and decided to restore their supply of food to their granaries.

Sheep, at the approach of winter, browse on grass with an appetite that is insatiable. They have a presentiment of the coming of inclement weather. For this reason they proceed to fill themselves to satiety before vegetation dies from the effects of bitter frost.

Hedgehogs, commonly called iricei, on sensing the approach of danger, ‘gather themselves behind their shields’ so that anyone who has in mind to harm them may be wounded by their prickly armor. In anticipation of eventualities, these animals are provided with two organs of respiration. For example, then they sense the coming of northerly winds, they close the aperture open to the north. When they note that ‘the clouds have been cleared away by the south wind,’ they turn toward the north so as to avoid the harmful breezes coming from the opposite direction.

Hence, the Prophet rendered praise worthy of the Lord when he said: ‘How great are thy works, O Lord. Thou hast made all things in wisdom.’ The divine wisdom penetrates and fills all things. Far more conviction is gained form the observation of irrational creatures than from the arguments of rational beings. Of more value is the testimony given by nature than is the proof presented by doctrine. What animal does not know how to look after his own safety—by offering resistance where force is necessary, by flight or by watchfulness where speed or cunning is called for? Who has instructed them on the curative powers of herbs? Human beings are often deceived by the appearance of herbs. Frequently, we discover those to be noxious which we had considered to be salutary. How often has death crept into repasts that were delicious! How frequently has death-dealing food penetrated even past the watchers and servants of the palace halls to bring death to kings! Wild beasts, merely by the sense of smell, are able to discern what is beneficial and what is harmful. They feed on the plant without the intervention of lackeys or food-tasters and receive no harm! Nature is a better guide and teacher of what is actual and true. She inspires into our senses the perception of what is sweet and health-giving and needs no director. She, too, instructs us how to avoid the bitterness of that which brings ultimate pain. The sweetness of life is set against the harshness of death.

Nature entrusts to the lioness the care of her whelps. Maternal affection makes gentle the savagery of the beast. Nature checks for the moment the ferocity of the tigress and turns her aside as she is on the point of seizing her prey. The minute she discovers that her young have been taken, she sets out on the track of the despoiler. Although he may have the advantage of a fast horse, he is aware that he may be outdone in speed by the wild beast. In a situation where there is available no means of escape he has to resort to the following stratagem. When he perceives that he is being overtaken, he lets fall a glass ball. The lioness is deceived by her reflection, thinking that she sees there her young. After being retarded by the deceitful image, she once more expends all her strength in her effort to seize the horseman. Spurred on by rage, she comes closer and closer to her fleeing victim. Again he throws out the glass ball, thus slowing down his pursuer. Yet her remembrance of past deceits does not prevent her from complying with her maternal instincts. She keeps turning over the reflected image that deludes her and settles down on it as if to nurse her young. Thus, deceived by her own maternal solicitude, she suffers at once the forfeiture of her vengeance and the loss of her offspring.

We have here the message of the Scriptures which declares: ‘Children, love your fathers; parents, do not provoke your children to anger.’ Nature has implanted in beasts the instinct to love their own brood and hold dear their own progeny. They know nothing of relations-in-law. Here, parents do not become estranged from their offspring by the act of changing their consorts. They know nothing of preferences given to children of a later union to the neglect of those of a former marriage. They are conscious of the value of their pledges and are unacquainted with distinctions in respect to love, to incentives due to hate, and to discriminations in acts that involve wrong-doing. Wild creatures have a nature that is simple and one which has no concern in the perversion of truth. And so the Lord has ordained that those creatures to whom He has bestowed a minimum of reason are endowed with the maximum of feeling.

What wild animal would not willingly face death in defense of her young? What wild beast, although exposed to countless armed men advancing ‘in wedge formation,’ would not protect with her own life’s blood her own progeny? With her body she sets up a wall of stout defense around her little ones, so that they are immune from peril in the midst of ‘a harvest of spears’? What has man to offer—he who pays no heed to what is enjoined on him and is oblivious to the dictates of nature? A son despises his father; a father disinherits his son. An occasion when a man’s own progeny is condemned to death is regarded as an act of justice. A father actually passes judgment on himself by treating his own child as something without real substance. An act in which nature is punished with sterility is considered to have the sanction of authority.

That dogs are devoid of reason is beyond all doubt. Nevertheless, if you consider the keenness of their senses, you can well believe that their sagacity of sense perception has taken on the trappings of reason. Hence, one can easily perceive that they are able to understand, by the training given by nature, what it has taken a few individuals a long period of time to achieve with the aid of the refinements of syllogistic argumentation acquired in the advanced schools of rhetoric. When they discover the tracks of a hare or of a stag at a point where there is a side path or a crossroad leading in several directions, they proceed to make note of the starting point of each of these trails. In silence, they weigh the problems one with the other. By applying their keenness of scent they seem to make the following observation: ‘Our quarry has gone either in this direction or in that,’ they say, ‘or surely he has fled into this clearing. Yet he has not taken this route or that. One direction remains. There is no reason, therefore, to doubt that he has taken this route.’ What men, with the aid of prolonged discussion and meditation, achieve with difficulty nature readily supplies to dogs, who weigh first the false hypothesis and when that is repudiated finally discover what is true.

Is it not true that philosophers spend whole days setting forth problems on sand, ‘tracing with a rod’ each proposition one by one? Since it must be that of three propositions only one is true, these men first eliminate two of these as not in conformity with truth. And so they conclude that the essence of truth is found in the proposition that remains.

Who is as mindful of benefits and as grateful for kindness as the dog? For their masters’ sake they go so far as to leap on robbers and to keep off strangers prowling at night. They are prepared, too, to die in defense of their masters and even to die with them! Dogs have often been the means of convicting people accused of homicide by showing clear evidence of the crime committed. Reliance is made in many cases on their testimony.

It is related that in the early morning in a remote part of the city of Antioch a man who had a dog as a companion was found slain. The killer was a certain soldier bent on robbery. In the dusk of the morning hours he was able to find refuge in another region. The body lay unburied and attracted a crowd of bystanders. The dog bewailed with mournful cries the loss of his master. It happened that the man who committed the murder, in order to assure his innocence and make himself secure by his presence—such is human astuteness—joined the circle of people and with the air of displaying sympathy approached the corpse. At that moment the dog relinquished his whine of distress and assumed the role of avenger. He attacked him and held him prisoner. Raising a pitiful cry after the manner of an epilogue in a speech, the dog brought tears in the eyes of everyone present and inspired trust in his testimony. This man alone of all the men present was seized and held fast. The man thereupon became alarmed. He was unable any longer to deny his guilt. Such a clear indication of his offense could not be made void by pleas of hate, enmity, ill-will, or of injury inflicted. Since he had not succeeded in his master’s defense, the dog in this case undertook a more difficult role, that of avenging him.

What meritorious act do we do for our Creator, on whose bounty we live? We close our eyes to insults against God Himself. Often, too, we set before the enemies of God food which we have received from His very hands.

What animal is more innocent than the lamb? We are accustomed to make an analogy between lambs and our own little children. It often happens that in a large flock a lamb decides to wander over the whole sheepfold, roaming in search of his mother. When she on her part is unable to find her lamb, she attempts to discover his whereabouts by bleating frequently. By this means she hopes to cause him to give an answering cry whereby he could direct back ‘his truant footsteps.’ Although he has wound his way among thousands of sheep, he still recognizes the voice of his parent. He hastens to his mother and finds his way to the familiar sources of his mother’s milk. Notwithstanding the lamb’s eager desire for milk, he passes by other udders heavy with milk. These udders, in fact, may overflow with milk, yet he persists in searching for his mother. The depleted store of his mother’s udders means just full abundance. She, too, can distinguish her offspring among the many thousands of lambs. In outward appearance they are the same. One can find no differences in the sound of their bleating. The mother picks out her own progeny from the rest of the flock. She recognizes her brood by the sole testimony of parental love. Whereas the shepherd may err in making his selection, the lamb cannot make a mistake in recognizing his mother. The shepherd is deceived by appearances, but a sheep is guided by natural affection. To all appearances, each one has the same odor, yet nature provides for them the power of distinguishing a scent which their own progeny, by I know not what peculiar potency, alone gives forth.

Nature has her own customs and her own innate instincts. Scarcely has the infant got his first teeth when he is able to test his own arms. The puppy does not yet have his teeth, yet in defense he acts as if he had. The deer is not yet provided with horns, yet he practices and butts with his head, threatening with weapons with which he is not furnished. A wolf takes away a man’s power of speech by first staring at him. The wolf despises this man over whom he is victorious by reason of his loss of speech. On the other hand, if a wolf perceives that he has been seen first, he loses his fierce character and is unable to run away. A lion is in dread of a cock, especially of one white in color. A she-goat when wounded searches for a plant called dittany and by this means rids herself of arrows. Wild animals, too, have instinctive knowledge of suitable remedies. A sick lion searches for an ape which, when devoured, restores him to health. To a leopard the blood of a wild she-goat serves as an antidote against physical weakness. A sick bear devours ants. A deer chews the branches of an olive tree.

Wild animals know, therefore, what is beneficial to them, whereas you, man, have no knowledge of your remedies. You do not know how to snatch power away from your adversary, so that he, like a wolf taken by surprise, is unable to escape. You are unable by the eye of your mind to outwit his treacherous designs, to obstruct his flow of speech, and dull the edge of his impudent display of rhetoric. If he comes on you by surprise, he will deprive you of your power of speech. If dumbness comes upon you, loosen your foot-gear in order to loosen your tongue. If a wolf should attack you, pick up a rock—and he turns in flight! Christ is your rock. If you find refuge with Christ, the wolf will take flight and not terrify you. This is the rock which Peter, when he hesitated on the water, sought for and found, because he held on to the right hand of Christ.

Why do I need to mention the fact that men are fond of garlic and use as a food a substance which the leopard avoids? Hence, as soon as a person gets ready to prepare garlic, a leopard, who is unable to tolerate it, is apt to leap forth from that region. To think that you use for food and infuse into your vitals a substance whose very odor a ferocious wild beast cannot endure! But it serves as medicine for those in pain. Let it be used as medicine, then, for invalids and not as food for banqueters. You have in mind to procure a drug, but you shun fasting as a restorative, as if you could find another remedy as efficacious as that! A serpent suffers death after tasting the sputum of a man who is fasting. You see, then, what potency there is in fasting, when a man can kill a serpent with his own sputum. If this is true of an earthly being, how much more true is it of the realm of spirit!

How great is the wisdom which the Lord has infused even into little creatures! The turtle-dove covers her nest with onion sprouts to prevent wolves from attacking her fledglings. She knows that wolves usually shun these sprouts. The fox knows how to protect her own young, whereas you are ignorant of the means to do so. Why are you heedless in not making provision against the onslaughts of the iniquitous wolves of the spirit by providing greater security for the life which will follow this?
'''
