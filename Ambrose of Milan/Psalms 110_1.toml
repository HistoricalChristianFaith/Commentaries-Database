[[commentary]]
quote='''
If reasoning does not move you, at least let the plain aspect of the judgment move you! Raise your eyes to the Judge, see who it is that is seated, with whom he is seated, and where. Christ is sitting at the right hand of the Father. If you cannot perceive this with your eyes, hear the words of the prophet: "The Lord said to my Lord, 'Sit on my right hand.' " The Son, therefore, sits at the right hand of the Father. Tell me now, you who hold that the things of God are to be judged as the things of this world are judged, whether you think that he who sits at the right hand is lower? Is it any dishonor to the Father that he sits at the Son's left hand? The Father honors the Son, and you make it to be an insult! The Father would have this invitation to be a sign of love and esteem, and you would make it an overlord's command! Christ has risen from the dead and sits at the right hand of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25202.html'
source_title="Exposition of the Christian Faith 2.12.102"

[[commentary]]
quote='''
And so by one question our Lord Jesus Christ stopped the mouths of all heretics and shut in their sacrileges. For by this question he refuted not only the Jews, but also the Photinians and the Arians and the Sabellians. And therefore, since we now see that the Jews have failed and that execrable faithlessness has been diminished, we must now touch briefly, in the treatise on this question, on some things concerning the Arians, who do not differ much from the Jews, and the Photinians and the Sabellians. Let Photinus, then, be silent, who says that Christ is the son of David, not of God; and let him be silent, condemned by the heavenly voice. For how does he say that Christ is the son of David, when David himself said in the book of Psalms: The Lord said to my Lord: Sit at my right hand, until I put your enemies under your feet? If David he says calls him lord, how is he his son? Not, then, the son of David, but the Son of God is Christ. Let the Sabellian also be silent: when he reads that the Lord said to the Lord, let him understand that he who speaks and he to whom it is spoken are not one and the same — for the Father does not say to himself: Sit at my right hand, nor did he say to himself: I will put your enemies — and let all at length understand that it is the Son who sits at the right hand, and let them keep this distinction between the Father and the Son, so that there is a distinction of Father and Son, in that the Father is one and the Son another; but, because they sit on one throne, enjoy one majesty, and sit not as a mark of distinction in dignity nor by an order of power, but by the union of love, let them understand one power of the Father and of the Son. In this let Arius too fall silent, who presses on in the tracks of an error contrary to Sabellius. Let him hear the Lord saying to the Lord, let him hear that the Son sits at the right hand of the Father, and let him cease to raise a question against the divinity from the speech and order of men. Nor let him argue here that the Father says sit; for we read elsewhere too that the Son sits even without the Father's word, as it is written: and he sits at the right hand of God, and elsewhere: Henceforth you will see the Son of Man sitting at the right hand of God. For he to whom sit is said is the one who is named the Son of Man. He hears as man, he sits as the Son of God. What can be called more pre-eminent than this power, which set even the flesh of man at the right hand of God, and joined that weak thing of the human condition, once the Word had indeed been made flesh, to the eternal divinity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
