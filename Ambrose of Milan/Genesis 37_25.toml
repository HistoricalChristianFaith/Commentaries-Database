[[commentary]]
quote='''
Those, then, buy Christ who bring good fragrances: incense, with which they kindle the altars of a devout mind, whence David too says in Greek: κατευθυνθήτω ἡ προσευχή μου ὡς θυμίαμα ἐνώπιόν σου [Let my prayer be directed as incense before you, Ps 140:2 (141:2)]; and resin too, by which broken pieces of marble are joined together. There is a spiritual resin, to make firm the fracture of your soul, to join what has been torn apart, to bind fast what has been loosened. For this spiritual resin strengthens and sets together certain shattered members of the soul, so that they are joined without hurt. And so Jeremiah seeks it, so as to take care to heal Babylon, if he can, saying: Take resin for her corruption, if in some way she will be healed. We have cared for Babylon, and she is not healed. The synagogue was not healed, because that resin passed over to the Church. Therefore merchants came from Gilead, that is, from the possession or the sojourning of testimony, carrying their wares over to the Church, so that this resin might cure the sins of the Gentiles. Of them it is said: Grow strong, you slackened hands and loosened knees. Sincere faith is resin. Peter applied it when he said to the lame man: In the name of Jesus Christ of Nazareth, rise and walk. And rightly he rose and walked. He had it when he said to the paralytic: Aeneas, the Lord Jesus heals you: rise and spread your bed for yourself. And he rose and spread his bed for himself. He had it when he said to the dead woman: Rise in the name of our Lord Jesus Christ. And the dead woman rose. By the blending of this resin those stones are fitted together from which God is able to raise up children to Abraham. By the medicine of this resin the lame man is set upright, the paralytic is restored, the dead woman is raised up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 3"
