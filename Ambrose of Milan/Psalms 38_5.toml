[[commentary]]
quote='''
Rightly, then, set under iniquities, and, what is worse, his own, he says that there have grown foul and have festered for him his scars from the face of his folly, because the remedy followed too slowly upon one who was lifting the burdens of iniquities. Yet health was restored to holy Job too, who scraped the pus of his sores, covered with sores from his feet to his head; and Lazarus the poor man, who lay at the rich man's gates while the dogs licked his sores, was carried away by the angels from the stench of his scars and placed in Abraham's bosom. There is, then, in holy David hope and a remedy of health, because the wounds of his sins smell not of ointment but of stench, and because he is afflicted and bowed down by them and does not delight in them. Look now at some wanton youth, notably lustful, who spends his life in debaucheries, lying, after the fashion of that rich man, in fine linen and purple and feasting splendidly every day, whose pavements swim with wine, whose ground is covered with flowers and strewn with fish-bones, whose dining-rooms are filled with the scents of various burnt incenses: how he thinks himself blessed and judges that he smells sweet, though he bears grievous and long-standing wounds of his soul and runs with corrupt blood, yet perceives no stench from his scar. He has nostrils blocked with mud and cannot say: the divine spirit which is in my nostrils. Therefore that rich man could not find the remedy of salvation; the poor man found it; in the end the one is in the underworld in torment, the other in rest.

Holy David the prophet, then, also found the remedy of perpetual salvation, he who confessed that the wounds of his soul stank to him and said that his own scars had festered for him from the face of his folly. But there is also a folly which, through the foolishness of preaching, brings salvation to those who believe. The prophet, then, already with the spirit of the Gospel, flees the wisdom of this world, by which God is not known, which covers its wounds and does not reveal them to the Lord. Better, then, the folly which has eyes, to see its sores, than the wisdom which has none. And therefore, admonished by the spiritual regard of his folly, so great a king declares himself afflicted with miseries, so that he may find the remedy of penitence, which Judas, who possessed a field from the wages of iniquity, could not find.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
