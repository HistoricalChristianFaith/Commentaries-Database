[[commentary]]
quote='''
Now that we are discussing flying creatures, it may not be amiss to treat here what is reported by certain eyewitnesses about the Indian worm. It is related that this horned worm is first changed into the form of a plant stalk, then gradually into a chrysalis. This form is not retained, for it seems to take on wings when seen on the wide surface of a leaf. From these leaves the Chinese ‘comb those soft fleeces’ which the wealthy appropriate for their own use. Hence the Lord says: ‘What did you go out to the desert to see? A man clothed in soft garments? Behold, those who wear soft garments are in the houses of kings.’

The chameleon is said also to assume new forms by a deceptive change of color. We know, in fact, from close observation that hares take on a white color in winter and that in summer they return to their original shade.

These matters have been mentioned in order that you may be aroused by the force of such examples as these to a belief in the change which will be ours at the Resurrection. We refer to that change which the Apostle clearly indicates when he says: ‘We shall all indeed rise, but we shall not all be changed.’ And further on he says: ‘And the dead shall rise incorruptible and we shall be changed. For this corruptible body must put on incorruption and this mortal body must put on immortality.’ Many, interpreting the nature and appearance of that transformation which they have not attained, are not without giving it an incongruous explanation, based on an anticipation which they do not merit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
