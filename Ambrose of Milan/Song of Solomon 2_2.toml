[[commentary]]
quote='''
"I am the flower of the field, and the lily of the valleys, as a lily among thorns." This is a plain declaration that virtues are surrounded by the thorns of spiritual wickedness, so that no one can gather the fruit who does not approach with caution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25201.html'
source_title="Concerning Virginity 1.8.43"

[[commentary]]
quote='''
As the lily in the midst of thorns. This is a clear indication that virtue is besieged by the briars of spiritual wickedness, so that no one may carry off its fruit except one who approaches with caution. Take wings, then, O virgin, but wings of the spirit: that you may fly over vices, if you desire to touch Christ, Who dwells on high, and looks upon the lowly things (Ps. 112 (113):5). And his appearance is like the cedar of Lebanon, which sets its crown in the clouds and its root in the earth; for its beginning is from heaven, its latter parts are on earth, and they have put forth fruits close to heaven. Search more diligently for so good a flower, to see whether you may find it somewhere in the valley of your breast; for it often breathes upon the lowly. It loves to be born in gardens, in which Susanna found it while she walked: ready rather to die than to be violated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
