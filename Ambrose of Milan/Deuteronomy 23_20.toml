[[commentary]]
quote='''
But perhaps you may say that it is written to the stranger thou shalt lend, and do not consider what the Gospel says, which is fuller. But meanwhile let us set this aside. Consider the words of the Law itself: To thy brother, it says, thou shalt not lend at usury; thou shalt exact of the stranger. Who then was the stranger except Amalech, except the Amorite, except the enemy? "There," it says, "demand usury." Upon him whom you rightly desire to harm, against whom weapons are lawfully carried, upon him usury is legally imposed. On him whom you cannot easily conquer in war, you can quickly take vengeance with the hundredth. From him exact usury whom it would not be a crime to kill. He fights without a weapon who demands usury; without a sword he revenges himself upon an enemy, who is an interest collector from his foe. Therefore where there is the right of war, there also is the right of usury. For every people which, first, is in the faith, then under Roman law, is your brother: I will declare thy name to my brethren, in the midst of the church will I praise thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 15"
