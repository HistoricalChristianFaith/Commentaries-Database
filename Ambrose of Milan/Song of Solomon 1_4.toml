[[commentary]]
quote='''
Indeed she says: the king has brought me into his chamber. Blessed is every soul that enters the inner places. For, rising up from the body, she becomes more remote from all things, and within herself she searches and seeks whether she can in any way follow after that divine being. And when she has been able to grasp it, having passed beyond the things that are intelligible, she is established in it and is fed by it. Such was Paul, who knew that he had been caught up into paradise, but did not know whether he had been caught up outside the body or caught up in the body. For his soul had risen up from the body and had withdrawn and lifted itself away from the entrails and bonds of the flesh, and, having become a stranger to himself, he held within himself the unspeakable words which he heard, and could not make them public, because he perceived that it is not lawful for a man to speak them. The good soul, then, despises things visible and sensible, and neither stands among them nor lingers and stays in despising them, but ascends to those things that are eternal and invisible and full of wonders, raising herself with the pure perception of a devout mind. For, striving after perfection, she strains toward that good of the Godhead alone, and thinks that nothing else is to be sought, because she holds what is highest. And so a man of this kind, in whom is the beauty of the soul, abounds for himself alone, because he is sufficient for himself. Nor is he ever alone who has the Lord present as his protector.

Indeed, brought into that secret place of the divine one, let us exult she says and rejoice in you. Let us love your breasts beyond wine. For the just man exults not in riches and treasures of gold and silver, not in the fruits of possessions, not in powers, not in banquets, but in God alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Draw us after you; we will run toward the fragrance of your ointments. Having now kissed the Word of God, the holy soul knows no measure and is not satisfied, saying: You are sweet, O Lord, and in your delightfulness teach me your justifications (Ps. 118 (119):68). Having kissed the Word of God, she desires him above all beauty, loves him above all gladness, delights in him above all spices, longs to see him often, to gaze on him frequently, longs to be drawn that she may be able to follow: Your name, she says, is ointment emptied out, therefore we young maidens love you; therefore we strive, but cannot lay hold of you: draw us, that we may be able to run; that by the fragrance of your ointments we may receive the power to follow. She hastens also to see the inner mysteries, the very rest of the Word, the very dwelling of that highest good, and his light and brightness in that bosom and recess of the Father; she hastens to hear his words, and when she has heard them she receives them as above all sweetness.

Let the prophet who tasted it teach you; he says: How sweet are your words to my throat, above honey and the honeycomb to my mouth (Ps. 118 (119):103)! For what else does the soul desire that has once tasted the sweetness of the Word, that has once seen his brightness? Moses, placed on the mountain for forty days receiving the Law, did not seek the food of the body: Elijah, hastening to that rest, asked that his soul might be taken from him: Peter, himself also beholding on the mountain the glory of the Lord's resurrection, did not wish to come down, saying: Lord, it is good for us to be here (Matt. 17:4). How great, then, is that glory of the divine substance, how great the gifts of the Word, into which even the angels long to look!

The soul, therefore, that sees that, does not seek this body, and understands that she ought to have the least familiarity with it; she renounces the world, withdraws herself from the bonds of the flesh, and puts off all the ties of these pleasures. Thus Stephen saw Jesus and did not fear being stoned; indeed, while he was being stoned, he prayed not for himself but for those by whom he was being killed. Paul too, caught up to the third heaven, did not know whether he was in the body or without the body; caught up, I say, into paradise, he no longer felt the use of his own body, and, hearing the words of God, he was ashamed to come down to the infirmities of the body. And so, knowing what he had seen in paradise, or what he had heard, he cried out, saying: Why, as though living of this world, do you still make decrees? Do not touch, do not defile, do not taste, things which all tend to corruption by their very use (Col. 2:20 and 21). For he wished us to be in the figure of this world, not in possession and use, so that we may use this world as though not using it, as passing through, not as settling down; walking as in the image of the world, not in desire of it, that by the swiftest reasoning we may pass beyond the very image of this world. Thus he himself, walking by faith, not by sight, was absent from the body and present with God: and while he was on earth, he lived not among earthly but among heavenly things. Therefore let our soul, which wishes to draw near to God, lift herself from the body, let her always cleave to that highest good, to that good which is divine, which is always, and which was from the beginning, and which was with God (1 John 1), that is, the Word of God: this is that divine one In whom we live, and are, and move (Acts 17:28).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
We will run toward the fragrance of your ointments. This fragrance is breathed forth by the soul that begins to open to Christ, so that she receives first the fragrance of the Lord's burial, and believes that his flesh did not see corruption nor wither with any odour of death, but rose seasoned with the fragrance of that eternal and ever-green flower. For how could he wither even in the flesh whose name is ointment emptied out? He emptied himself that he might be fragrant for you; this ointment always was, but it was with the Father, it was in the Father, it was fragrant only to angels and archangels, as within the vessel of heaven. The Father opened his mouth, saying: Behold, I have set you as a covenant of my race, as a light of the Gentiles, that you may be for salvation to the end of the earth (Isa. 49:6). The Son came down; all things were filled with the new fragrance of the Word; the heart of the Father uttered a good Word; the Son was fragrant, the Holy Spirit breathed it forth and spread it through the hearts of all: For the love of God has been poured out in our hearts through the Holy Spirit (Rom. 5:5). The Son of God himself at first held in his fragrance in the body as in a vessel, awaiting the time, as he says: The Lord gives me a tongue of learning, that I may know when I ought to speak a word. The hour came, he opened his mouth, the ointment went out, when power went out from him. And therefore she hastens to the Word and asks to be drawn, lest perhaps she be left behind; because the Word of God runs, and is not bound. Thus He exults like a giant to run his course (Ps. 18 (19):6). And because His going forth is from the highest heaven, and his meeting even to its highest point (ibid. 7), seeing herself unequal to such great swiftness, she says: Draw us.

Good is the soul that asks not for herself alone but for all: Draw, I say, us; for we have the desire to follow, which the grace of your ointments breathes into us: but because we cannot match your course, Draw us, that, supported by your help, we may be able to tread in your footsteps. For if you draw us, we too will run, and we will catch the spiritual breezes of swiftness. For the burden is laid down by those for whom your hand is a support; and your oil is poured in, by which he was healed who had been wounded by robbers.

But lest it seem shameless to you that she says: Draw us, hear him saying: Come to me, all you who labour and are burdened, and I will refresh you (Matt. 11:28). You see that he gladly draws us, so that we may not remain behind as we follow: but let him who wishes to be drawn run, that he may lay hold, and run forgetting what lies behind and reaching out to what lies ahead, for so he will be able to lay hold of Christ; whence the Apostle too says: So run that you may lay hold. She too wishes to reach the prize, she who desires to lay hold. Prudently, then, she asks to be drawn, because not all are able to follow. Thus, when Peter said: Where are you going? the Word of God answered: You cannot follow me now, but you will follow afterwards (John 13:36; Matt. 14:30). He had entrusted to him the keys of the kingdom of heaven, and yet he judged him unequal to following him. Yet he did not put off this soul, because she did not presume, but asked. Thus,

He has brought me into his chamber. Blessed is the soul that enters the inner recesses of the Word, for, rising up from the body, she becomes more remote from all things; and she searches and seeks that which is above itself, that divine thing, if in any way she can attain it: and when she has been able to lay hold of it, having passed beyond the things that are intelligible, she is established in it and is fed by it. Such was Paul, who knew that he had been caught up into paradise, but did not know whether it was out of the body or in the body. For his soul had risen up from the body, and had withdrawn and lifted herself from the inward parts and bonds of the flesh, and, become a stranger to himself, he kept within himself the ineffable words which he heard and could not divulge, which he perceived it is not lawful for a man to speak. The good soul, then, despises things visible and sensible, and does not stay in them, nor does she linger and rest in looking at these things: but she ascends to those things which are eternal and invisible and full of wonders, lifting herself up with the pure sense of a devout mind. For, striving after perfection, she aims at that sole good of the Godhead, and thinks nothing else is to be sought, because she holds what is highest.

The king has brought me into his chamber. The kiss is a simple thing, but the secrecy of the chamber is full of business; for in this place she testifies that she wishes to know the mysteries more fully, to enter the inner recesses of the heavenly mysteries, and that the treasures of wisdom and knowledge hidden in Christ may be opened to her: and that she may be able to do this, perhaps she says what she said above: Let him kiss me with the kisses of his mouth. It signifies the grace of the Holy Spirit coming upon her, as the Angel said to Mary: The Holy Spirit will come upon you, and the power of the Most High will overshadow you (Luke 1:35). But when the king brought her into his chamber is declared by the time of the passion, the piercing of the side, the shedding of the blood, the ointment of the burial, the mystery of the resurrection; so that she received the kiss as a bride, but the Church was brought into the chamber of Christ no longer as one only betrothed, but also as one wedded: and she has not only entered the bridal chamber, but has also obtained the keys of lawful union. And therefore, as one placed in the bridal chamber, she says: A bundle of the drop is my brother to me, he rests between my breasts.

And if we seek the chamber, he himself teaches us, who says: But you, when you pray, enter into your chamber, and, having shut the door, pray to your Father in secret (Matt. 6:6). The chamber of the Church is the body of Christ. The king brought her into all the inner mysteries, he gave her the keys, that she might open for herself the treasures of knowledge, throw open the doors of the sacraments that were shut before, and know the grace of him who rested, the sleep of him who died, the power of him who rose again. In that chamber the bride found the justices of the Lord Jesus. What are those justices? Surely the sacraments of baptism, as we read, for when John said to him as he came to baptism: I ought to be baptized by you, and do you come to me; Jesus answered: Let it be so now, for thus it is fitting for us to fulfil all justice (Matt. 3:15). In that chamber she learns the justifications of the Lord, she has come to know the counsel of God, than which nothing can be more sublime; for this is the divine thing, that in which the remission of sins takes place.

She seeks to learn from the Lord these things, which men could not teach unless God had first taught them: and after the apostles learned them from Christ, the Church says: The king has brought me into his chamber, that is, into that secret place in which are all the treasures of his learning and knowledge. And therefore it is said to you: When you pray, enter into your chamber (Matt. 6:6). which signifies the secret place of the mind and soul. Into this chamber of justices the bride asked to be brought, when she had run out after the fragrance of the ointment, which always flows and never fails.

The king has brought me into his chamber; the Greek has "into his storeroom" and "into his cellar"; where there are good libations, where good fragrances, sweet honeys, where diverse fruits, where various dishes are, that your meal may be seasoned with very many dishes. Thus, brought into that secret place of that divine bridegroom:

Let us exult, she says, and be glad in you; let us love your breasts above wine; for she exults not in riches and treasures of gold and silver, not in the fruits of possessions, not in powers, not in banquets, but in God alone, saying to him: Let us love your breasts above wine. Yet she drank in such a way that she was not swallowed up by the wine, but by its grace drew in gladness of heart, and did not totter with drunkenness of the body. Thus, drinking this wine, she opened her eyes and saw the straight way, she left the crooked ways, saying: Equity has loved you, that is, winding paths do not follow you: but only the path of justice can reach you, for he who loves justice does not turn away from Christ. For how should an innocent conscience fear the judge of justice and the rewarder of merits?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
