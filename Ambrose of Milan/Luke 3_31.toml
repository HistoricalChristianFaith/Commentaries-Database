[[commentary]]
quote='''
That Matthew thought the generation should be derived through Solomon, but Luke through Nathan, seems to show the one a royal, the other a priestly family of Christ. Which we ought not to take as if the one were truer than the other, but as the one agreeing with the other in equal faith and truth. For he was truly, even according to the flesh, of a royal and a priestly family, a king from kings, a priest from priests. Although the oracle is expressed not of carnal but of heavenly things, since both the king rejoices in the power of God, he to whom judgment is committed by the Father, the King, and he is a priest for ever. According to which it is written: You are a priest for ever according to the order of Melchizedek. So each rightly kept faith: Matthew, to prove the origin led through kings, and Luke, by tracing through priests the series of the line handed down from God into Christ, to declare that origin itself the holier. At the same time, in this the figure of the calf too is signified, in that he thinks the priestly mystery must everywhere be preserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Yet I do not deny, while I defend Tamar and Ruth, that sinners too were counted among the forebears of the Lord's line; and Saint Luke, wishing to avoid mention of them, kept another order of successions and did not think Ahab or Jeconiah or, lastly, the wife of Uriah should be named, so as to declare the series of the priestly line immaculate. But just as his plan has a reason beneath it, so too the plan of Saint Matthew does not shrink from the justice of reason. For since he was proclaiming in the Gospel that the Lord, who was to take up the sins of all, subject to injuries, submitted to the Passion, was begotten according to the flesh, he did not think he should be declared without share even in this devotion, that he should not refuse the injury of a stained origin too; and at the same time, that the Church should not be ashamed to be gathered from sinners, since the Lord was born of sinners. Lastly, that he might begin the benefit of redemption even from his own forebears, lest anyone should think that a stain of origin could be a hindrance to virtue, or insolently boast of the nobility of his line, or, more bashful, blush at the crimes of his parents, since he is given the means of overshadowing his origin by the flower of virtue.

Or is not holy David, though many things of his are figured into a mystery, all the more exalted in this, that he knew himself to be a man and thought that the sin committed above, in carrying off Uriah's wife, must be washed away with the tears of repentance, showing us that no one ought to trust in his own virtue? For we have a great adversary, who cannot be overcome by us without God's favour. And often you will find that there were grave sins in illustrious and blessed men, so that you may know that as men they lay open to temptation, lest for their eminent virtues they be believed to be more than men. For if David, because, lifted up by presumption of virtue, he had said: If I have repaid evil to those who repaid me; and elsewhere: But I said in my abundance: I shall not be moved for ever, recorded that he at once suffered the penalty of this insolence, saying: You turned away your face from me, and I became troubled; if the very founder of the Lord's line incurred offence for insolence, how much more must we other sinners, whom no prerogative of merits supports, fear the rock of insolence, on which the good suffer shipwreck, especially since so great a man is for us the author both of teaching and of example, who thought that a kind of palinode must be sung afterwards to win back the Lord's favour, saying: Lord, my heart is not exalted, nor are my eyes lifted up on high; and: The Lord is at my right hand, that I may not be moved; for he knew that, when he trusted in himself, he fell. Finally he showed that there is nothing else in man except that he knows God; for so you have it: What is man, that you have made yourself known to him, or the son of man, that you take account of him? If, then, David condemns insolence and puts on humility, rightly in the history of Uriah's wife this teaching of striving after humility is drawn in.

And yet, if from her was born that peaceable Solomon, let us see whether perhaps there is a mystery in this, that, when he was removed from the midst who before by his marriage laid claim to the people of the Gentiles, the Church was married to another husband, the true David. For Christ was called David, taken into the name of his forebear, according to what is written: I have found David my servant. To him the Church was married, which, filled with the seed of the Word and with the Spirit of God, brought forth the body of Christ, that is, the Christian people. She, then, is the woman who while her husband lives is bound to the law, and therefore her husband died, so that she would not be an adulteress if she were with another man. The mystery, then, is in the figure, the sin in the history; the fault through man, the sacraments through the Word. Since we have spoken of this history more fully elsewhere, it seems we must pass over it quickly here. And rightly holy David wrote about this history the mystical Psalm 50 (51), because of his marriage with Bathsheba, saying: Wash me abundantly from my unrighteousness and cleanse me from my sin. If the friend of God acknowledges his iniquity and that sin stands in the way of his merits, if, finally, he confesses that he has sinned against God, why should you blush at confessing a crime, since it is the contriving of a crime, not the confession of it, that brings shame?

So, since David did not pass over the history of Bathsheba in his psalms, that he might teach us in it either a mystery or the act of perfect repentance, rightly we see that she was not passed over in the Lord's generations either, since David himself, who took her as his wife, is declared the forerunner of the Lord's generation according to the flesh. His special merit it was, as we have said, to see the rise of the Church in this mystery and to receive the oracle that Christ would be born of his line. For the one thing belongs to the Church, what he said: Behold, we heard of her in Ephrathah, we found her in the fields of the forest; the other belongs specially to the pledge of the Lord's body, which is revealed by a most manifest oracle when it is said: Of the fruit of your womb I will set upon my throne. Yet do not be careless of so great a promise; for it was not given without a condition, but, if you keep the covenant and observe the testimonies of the Lord, which in the Gospel he promises he will speak, to you too access to the eternal throne will lie open. So much for Uriah's wife.

As for Ahab, it is clear enough, whose wife was Jezebel, and as for Jeconiah, Jeremiah is an amply sufficient witness that he was guilty of the greatest offence, and he even took from him the name that he had. And therefore he who in the books of Kings is called Joachim was named Jeconiah by Jeremiah, when he said: Jeconiah has been cast away like a vessel, there is no use in it, wherefore he has been cast out, he and his seed. Earth, earth, hear the word of the Lord: write this man down as disowned, for there will not arise of his seed one sitting on the throne of David, a prince still in Judah. For while he was reigning the Babylonians laid Judaea waste, and never afterwards could anyone of his seed obtain the kingdom in Judaea; for afterwards the people, released from captivity, was under priests and tetrarchs. Hence tetrarchs remained right up to the generation of Christ, and not even they, as far as history teaches, kept the dignity of a royal line.

For it is reported by those who have handed it down to us, whether arguing it, or teaching it simply, or truly establishing it, that Idumaean robbers, having entered Ashkelon, a city of Palestine, carried off among others as a captive from the temple of Apollo, which was near the walls, Antipater, the son of a certain Herod, a temple servant, whom his father could not ransom because of poverty. He, then, steeped in the disciplines and mysteries of the Jews, was joined in friendship to Hyrcanus, king of Judaea, and Hyrcanus sent him on his own behalf as envoy to Pompey; and because he gained the fruit of the embassy, through that favour he aspired to a part of the kingdom. When Antipater was killed out of envy at his good fortune, his son Herod was afterwards, under Antony, by decree of the senate, appointed to reign over the Jews; his son was Herod, and the other tetrarchs. This we thought should be carried over from the histories of the Greeks, so that it may be clear that Herod, akin by no tie to the line of the Jews, sought the kingdom by adulterous fraud. Finally, conscious of his low birth, lest any question should be raised against his descendants from the old record, he burned their writings, thinking that, if he removed the evidence from public view, by no other testimonies could it be made clear that he did not descend from the stock of the patriarchs or of the ancient proselytes. But, as is the way of most human contrivances, he could not prejudice the inquiry and the tracking down of the truth.

Yet lest it may prejudice us, let us see, we who say that Christ is of a true and royal line, and that the Lord's line was carried on through true and noble kings. But when an adulterous offshoot aspired to the kingdom, the order not of power but of generation preserved the succession of his nobility; yet we have not received Christ himself as king according to the honour of this world. How then is it: Of the fruit of your womb I will set upon my throne? How does the angel too say of him that the Lord God will give him the throne of David his father, and he will reign in the house of Jacob? How is he promised to reign and not shown to reign? Or how is it said through the prophet that none of the seed of Jeconiah will reign? For if Christ reigned, and Christ is of the seed of Jeconiah, the prophet has lied, and the oracles too have lied. But there it is not denied that there would be descendants of the seed of Jeconiah, and therefore Christ is of his seed, and that Christ reigned is not against the prophecy; for he did not reign with worldly honour, nor did he sit on the thrones of Jeconiah, but he reigned on the throne of David.

But since Jeconiah himself sat on the throne of David, how is it resolved what was said, that the descendants of Jeconiah will not sit on the throne of David, when the throne of both seems to have been the same? So we too cannot deny that it was the throne of David, and yet Christ did not sit on the same throne of King David that Jeconiah sat on; indeed, no one else of the line of David could sit on his throne but Christ, because in no one else is his seed eternal, but in Christ, as God himself disclosed, saying: Once have I sworn by my holiness, if I lie to David: his seed will remain for ever, and his throne as the sun in my sight. Whom, then, does he speak of here? Surely not Solomon, not Rehoboam, not Nathan, but him of whom alone he can say: I will set his hand in the sea and his right hand in the rivers. He will call me: 'You are my father', and: I will set his seed for ever and ever, and his throne as the days of heaven. Surely Solomon did not sit on this throne, nor Rehoboam, nor Jeconiah. Do you wish to know who sat on it? It is he of whom the angel says to Mary: Behold, you will conceive in the womb and bear a son, and you will call his name Jesus. He will be great and will be called the Son of the Most High, and the Lord God will give him the throne of David his father, and he will reign in the house of Jacob for ever, and of his kingdom there will be no end. If you do not believe the angel, you will at least believe the Lord himself, saying: You say that I am a king. Did he too, then, lie, because he said that he reigned, he who did not reign on earth? How is the Scripture resolved, which says that he reigns and does not establish that he reigns?

We have come to a precipice in the argument; we stick fast in the shallows and toss in a kind of shipwreck of the truth. Let us therefore rouse Christ, let us question him himself, let him himself answer. Let us question the Scriptures. We find that the kingdom of the Lord is not of this world; for he himself said: My kingdom is not of this world. He who says that his kingdom is not of this world shows that it is above the world. So his kingdom both was and was not: it was not in the world, it was above the world. There was, then, another kingdom of the true David, which Christ alone received, and there was another seed of David, which remains for ever, of which Christ alone was begotten, who alone is the true son of David, whose name too he alone received, according to what is written: I have found David my servant, with my holy oil I have anointed him. That this is said not of the prophet David but of the Lord, the words that precede declare; for it is written: I have laid help upon one who is mighty and have exalted one chosen from my people; for Christ alone is mighty, he alone is chosen. For the seed of the saints is greater in faith than in generation; and therefore the Apostle says: For if those who are of faith, these are the sons of Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
