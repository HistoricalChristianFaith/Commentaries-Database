[[commentary]]
quote='''
But what is more evident that he does not seem to bring in natures that perish than that the holy prophet himself added: for the ungodly do not rise again in the judgement? For he did not say: "they do not rise again", but he says: "they rise again indeed, but not in the judgement". And he who rises again certainly exists and abides; but because he has not believed in Christ, he has already been judged, and therefore he does not come into judgement, he for whom the punishment of a judgement already completed is waiting. And of the resurrection there are very many testimonies of the Scriptures, which we did not pass over in the books of the Consolation and of the Resurrection. But concerning what he says: the ungodly do not rise again in the judgement, according to the Gospel the sentence is settled: not all will be judged. The Apostle, however, says: for we must all stand before the judgement seat of Christ, so that each one may receive what is proper to the body, according as he has done, whether good or evil. Many think these are contradictory and do not notice that the Savior spoke of the unbelieving and ungodly, who have not believed in the Lord Jesus. For he says thus: he who believes in me is not judged; but he who does not believe has already been judged, because he has not believed in the name of the only-begotten Son of God. And this is the judgement, that the light has come into this world, and men loved darkness rather than the light; for their works were evil. It is clear, then, of whom it was said, that is: of those who have not believed in the Lord Jesus. The Apostle too, although he said "all", certainly spoke of those who have believed, but are to render an account of their actions on the day of judgement. In fact, he himself says elsewhere that the testimony of our conscience will be revealed at the day of judgement, when our thoughts will either accuse one another, as it is written, or defend, and the secrets of the heart will lie open. And what is more evident than what he says elsewhere: we shall all indeed rise again, but we shall not all be changed? For the righteous will be changed into incorruption, the truth of the body remaining. Daniel too says: the judgement sat, and the books were opened. He shows, then, that there will be a judgement, especially since the same prophet says elsewhere: many who sit in the mound of the earth shall rise up, these to eternal life and these to reproach and eternal confusion; and those who understand shall shine as the brightness of the heaven, and of the righteous many shall shine like the stars.

What is this judgement of judges sitting, and what are the books opened, but our consciences, like books containing the series of our sins? And yet it is mean even to think of this as though it were like a human judgement. Christ's judgement is another thing, where the conscience betrays itself, which cannot lie hidden from the judge of hidden things, where thoughts shine before him who used to say to men while they were still thinking: why do you think evil things in your hearts? When he said it to the Jews, he said it to all, so that no one should think that what he did could be hidden, so that no one should think that, shut in by walls, he could escape the witness of his hidden error. And therefore the Evangelist too testifies, saying: but Jesus knew their thoughts. How, then, does he say: the books were opened? Not, surely, books written in ink, but with the traces of offences and the defilement of shameful deeds. The book of your conscience will be opened, the book of your heart will be opened, our fault will be read out. There is a book there where there is a tablet; rather, there are books inscribed where there are tablets inscribed, which the apostolic teaching inscribes with the Holy Spirit, as we read where Paul says: you are our letter, inscribed not with ink but with the Spirit of the living God, not on tablets of stone but on fleshly tablets of the heart. There are, then, tablets of the heart inscribed by the Holy Spirit; these will be read out; if you have done well, the writing will remain. See that you do not take away the grace of the Holy Spirit, see that you do not erase it and write your shameful deeds in ink, lest the day of judgement come and the judge say: "let the books be read out, let the tablets of his deeds be read out", and say to you: "I wrote your tablets; why did you erase my letters? I too wrote my gifts; how did you erase my favours and write your disgraces? Did you not read that I write? Did I not say to you through the mouth of my prophet: my tongue is the pen of a scribe writing swiftly? And the judgement belongs to the Word".

Many, then, of those sleeping in the mound of the earth will rise, those who have done well to the resurrection of life, those who have done evil to the resurrection of judgement. What Daniel says: to eternal life, this the Savior called to the resurrection of life; likewise what Daniel says: to reproach and confusion, the Savior said: to the resurrection of judgement. Hence it is not expedient for us to come to judgement, and it is not expedient not to come, lest either we seem condemned beforehand or, in this stain of vices, we undergo the weight of so great a judgement. The prophet asks that the Lord may not enter into judgement with his servant; how much more ought we to fear the judgement of the Lord! Suppose that the Lord in his mercy will pardon: how much will be brought to light that I believed lay hidden! What shame, what confusion will there be, when I, who professed to teach others, am myself caught in the very thing for which I rebuked others!

And therefore, since both the Savior has set down two kinds of resurrection and so has John in the Apocalypse, saying: blessed is he who has a part in the first resurrection — for these come to grace without judgement, while those who do not come to the first resurrection but are reserved for the second will be burned until they fulfil the times between the first and the second resurrection, or, if they have not fulfilled them, will remain longer in punishment —, therefore, then, let us pray that we may be found worthy to have a part in the first resurrection. There are those who rose again at the Passion of Christ, and they are plainly blessed, who received the grace of Christ and heard his voice, of which it is written: the hour has come when the dead shall hear the voice of the Son of God, and those who hear shall live, and: they entered into the holy city. I think this signifies rather that Jerusalem above than this one which he left, which he accused, because into this one they entered with their feet, but into that one above by their merits.

But let us beware of this too, that while placed here we rise from the mound of the earth. There are those who, while living, are surrounded by a tomb and filled with the dead, whose throat is a tomb, as they speak words not of life but of death. If here we rise again from the dead, there too we shall rise again; if here we have not been dry bones, but have received the dew of the word, the moisture of the Holy Spirit, there too we shall live; if here Jesus raises us with his loud voice, as he raised Lazarus too, and through his disciples loosens us from the bonds of death and leads us into Bethany, where Lazarus was, that is, into the house of obedience, and admits us to his banquet, there too we shall feast with him always, and there we shall recline with him, and there the ointment will be fragrant for us whose pouring out the traitor alone lamented.

Therefore the ungodly do not rise again in the judgement, that is: into the portion of those who are to undergo judgement, nor do sinners rise in the council of the righteous. You see that the ungodly rise and do not rise in the judgement, since sinners too, though they do not rise in the council of the righteous, yet rise again in the judgement. Hence it appears that those who have believed well and carried out their faith in works as well are not themselves judged, but rise in the council of the righteous; while sinners, who cannot rise among the righteous, will rise in the judgement. You have two orders; there remains a third, that of the ungodly, who, since they have not believed, have already been judged, and therefore do not rise in the judgement, but to punishment; for they loved, indeed, darkness rather than light, and therefore their judgement is punishment, and perhaps the punishment of darkness. And it could indeed be understood that those who have evil works though they believe in Christ, wishing indeed to live rightly but overcome by the enticements of sins, loved darkness more than light, that is: they loved both, but darkness more. But since he had spoken beforehand of those who have not believed, I think it must be taken thus: that they loved darkness and not light; for Christ is the light. As for those, then, who have not believed the light, it is absurd that they should be believed to have loved even a little the light which they did not know; for they have not known, indeed, nor have they understood; they walk in darkness, as it is written.
'''
