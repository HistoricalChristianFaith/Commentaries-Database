[[commentary]]
quote='''
And straightway you have it said to him: knowing you shall know that your seed shall be a sojourner in a land not its own, and they shall be oppressed with servitude, and they shall harm them and humble them, behold, four hundred years. Rightly did a great dark horror come about, because great oracles were being delivered, since a precept was being given concerning the people of the ages. How could the human mind grasp this so easily, above all a mind that was being admonished to be a sojourner in this land? For it was not so much things that were to come that were being declared, as things that we were to do that were being prescribed. For your seed he says shall be a sojourner, whether because all of us men ought to be sojourners in this land — for Abraham is the father of all — or because the true seed of Abraham is a sojourner in this world; for that is the true seed of which it was said: in Isaac shall your seed be. Thus he who acknowledged himself the heir of Abraham says: I am a stranger in this land and a sojourner, as all my fathers were. For he who has been a sojourner here is a citizen in heaven; but he who has thought that the whole substance of his soul must be established in this land, and has exulted in acquiring for himself the inheritance of this land, will be shut out from the kingdom of God. Hence the Apostle says to faithful men, citizens of that Jerusalem which is in heaven, and sons of the Church: So now you are no longer strangers and sojourners, but you are citizens with the saints and members of the household of God. This land, then, is not ours, the land of which the prince of this world can say, showing all the kingdoms of the earth: To you I will give this power, if you fall down and worship me: all things shall be yours which strangers claim for themselves; and they oppress the people of God with servitude, so that they try to harm his servants and to humble the saints of God. Thus the Son of God himself thought that nothing of this world was to be claimed for himself; hence he says: the prince of this world comes, and in me he will find nothing. Different masters, then, wish to hold us in servitude: the devil advances, his angels harass us, the passions and motions of the body disquiet us like enemies of our own house and within. Without, battles; within, fears; without, battles; within, desires. For the substance of the inner body is alien to the purity of the heart, and therefore it assails it, or at least fights back against it. The war, then, is daily, and within the same camp the battle is heavy, until the merciful God judges the devil and his ministers, quenches the passions and subjects them to the diligent mind, and requires our souls from all the authors of our offence and our peril, he who says: the blood of your souls I will require from the hands of all the beasts. And John saw and said that death and hell were cast into the lake of fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
