[[commentary]]
quote='''
Turn aside from evil and do good, and dwell for ages of ages. For the Lord loves judgement and will not forsake his saints; they shall be preserved for ever; but the unrighteous shall be punished, and the seed of the ungodly shall perish. The righteous shall possess the land by inheritance and shall dwell upon it for ever and ever. By these verses the prophet shows that we belong to the Lord, and that he himself is the judge of our thoughts and deeds, regarding the merits of each, who does nothing without judgement, but distinguishes evil and good acts by judgement. One must, then, turn aside from evil and do good. That you may not confuse good and evil, the first thing is that you should be free of crime, the next that you should bring forth the fruit of innocence, so that you may be everlasting. Do not think that your sins escape God; for so very many fall. He himself sees all things and condemns them, and exterminates the seed of the ungodly, the seed, surely, not of bodily generation, but of the inner mind, and the succession of ungodliness. For certainly Job is marked out by the testimony of Scripture as born of the seed of Esau. How, then, did the seed of Esau perish in Job, when he was so great a man that he foresaw the Lord who was to come upon earth and subdue the devil, the whale of this world? This, then, is what is sought, that malice should not be passed on to posterity. This Christ works through the sacrament of baptism, so that each one puts off what he was born and puts on what he was reborn, and becomes the heir not of a family but of grace, so that he may be able to acquire for himself a perpetual dwelling in the eternal habitation. And he who has been found worthy to dwell for ever and ever will himself also honour God for ages of ages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
