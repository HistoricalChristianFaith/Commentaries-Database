[[commentary]]
quote='''
And since we have said that this whole psalm is spoken in the person of the Savior, lest perhaps the Apollinarists say: "See, a body, he said, you have prepared for me, not a soul as well", let them hear him saying in the later part of this psalm: Let them be confounded and put to shame together who seek my soul, to take it away.

These are the things in this psalm that we judged difficult. The rest we have considered plain and easy, and in no need of interpretation, since, if they come up for treatment in another psalm in which they seem to be repeated, we shall pursue them more fittingly, with the favour of the Lord Jesus, to whom be praise, honour, glory, perpetuity, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
