[[commentary]]
quote='''
For this is to flee: to know where you are heading, to lift oneself up from the world, to lift oneself up from the body, lest again someone exalt himself in vain and, puffed up by the mind of their flesh, they do not hold the head, and it be said of them: They fled and did not see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
