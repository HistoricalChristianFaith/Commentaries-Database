[[commentary]]
quote='''
From here the Lord Jesus goes on to other things. For he who had resolved to make the whole man whole ran through the members one by one, so that he might truly say: Are you angry with me, because I made the whole man whole on the sabbath? So in this place he watered with the saving juices of good deeds that hand which Adam stretched out and plucked the fruits of the forbidden tree, that what had withered through crime might be healed by good works. In this Christ refutes the Jews, who by evil interpretations of the Law violated its precepts, thinking that on the sabbath one must rest even from good works, whereas the Law in present things prefigured the form of things to come, in which surely there will be a holiday from evil works, not from good ones. For although worldly works cease, yet to rest in the praise of God is not an idle act of good work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
