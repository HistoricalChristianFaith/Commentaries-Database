[[commentary]]
quote='''
But the meek shall possess the land and shall delight in the multitude of peace. Rightly do they possess the land in whom God himself rests, as he resounded through Isaiah in a divine oracle, saying: Upon whom shall I rest but upon the humble and quiet and the one who trembles at my words? Who are the meek, but those whom no goad of dissension harasses, whom anger does not disturb, nor cruelty exasperate, nor the madness of savagery inflame? And therefore, because, while placed in the body, they loved not wines, not banquets, not riches, but the peace of the Lord, in return for that delight in bodily pleasures, of which they thought they should deprive themselves in order to obtain eternal grace, they shall delight in the multitude of peace which our Lord Jesus bestowed on the human race in his days, as the prophecy, which has not lied, embraced it, declaring: In his days righteousness shall arise, and a multitude of peace, until the moon be taken away. What, then, is the peace by which the people of the whole Church has been multiplied, but that of which the Lord said: My peace I leave to you, my peace I give to you? He gave peace, who calmed the wars of souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
