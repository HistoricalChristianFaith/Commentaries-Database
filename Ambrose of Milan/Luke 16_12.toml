[[commentary]]
quote='''
Riches are foreign to us, because they are something beyond nature, they are not born with us, and they do not pass away with us. But Christ is ours, because He is the life of man. Lastly, He came unto His own.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Hence he says: if you have not been faithful in what is another's, who will give you what is yours? Riches are another's to us, because they are outside nature, and neither are they born with us nor do they pass on with us; but Christ is ours, because he is life. Indeed he came to his own, and his own did not receive him. So no one will give you what is yours, because you have not believed what is yours, you have not received what is yours.

So the Jews seem to be convicted of both fraud and avarice; and therefore those who were not faithful in their possessions — which, since they knew them to be another's, for the fruit of the lands has been given to all by the Lord God for common use, they surely ought to have shared with the poor — did not deserve to receive Christ either, to acquire whom Zacchaeus offered half of his goods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
