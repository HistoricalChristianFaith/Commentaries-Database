[[commentary]]
quote='''
And the father rejoices, because the son had perished and is found, had been dead and has come to life again. He perishes who was; for he cannot perish who was not. And so the Gentiles are not, the Christian is, according to what was said above, that God chose the things that are not, to destroy the things that are. Yet here too the image of the human race can be taken in one man. Adam was, and in him we all were: Adam perished, and in him all perished. Man, then, is re-formed in that man too who had perished, and he who was made after the likeness and image of God is restored by the divine patience and magnanimity. What then does this mean: God chose the things that are not, to destroy the things that are? That is: he chose the people of the Gentiles, which was not, to destroy the people of the Jews.

It can also be seen as said of one who repents, because no one dies except one who once lived. And therefore the Gentiles do not die, but are dead; for he who has not believed in Christ is always dead. And the Gentiles, when they have believed, are made alive through grace, but he who has lapsed comes to life again through repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
