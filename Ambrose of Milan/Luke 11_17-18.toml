[[commentary]]
quote='''
Herein also He shows His own kingdom to be undivided and everlasting. Those then who possess no hope in Christ, but think that He casts out devils through the chief of the devils, their kingdom, He says, is not everlasting. This also has reference to the Jewish people. For how can the kingdom of the Jews be everlasting, when by the people of the law Jesus is denied, who is promised by the law? Thus in part does the faith of the Jewish people impugn itself; the glory of the wicked is divided, by division is destroyed. And therefore the kingdom of the Church shall remain for ever, because its faith is undivided in one body.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Every kingdom divided against itself shall be made desolate. The reason for this saying is that he was said to cast out demons by Beelzebub, the prince of the demons; it was to show that his own kingdom is undivided and everlasting. And rightly he also answered Pilate: my kingdom is not of this world. And therefore those who place their hope not in Christ, but suppose that demons are cast out by the prince of the demons, he declares not to belong to the everlasting kingdom. This concerns the people of the Jews, which in afflictions of this kind summons the help of a demon to cast out a demon. For how can the kingdom, when faith is torn apart, remain, being divided? For since the people of the Jews is under the Law, and Christ too according to the flesh was begotten from the Law, how can the kingdom of the Jews, which is from the Law, be everlasting, when the people itself divides the Law, when Jesus, who is due from the Law, is denied by the people of the Law? Thus in part the faith of the Jewish people fights against itself, and by fighting is divided, and by being divided is dissolved. And therefore the kingdom of the Church will remain for ever, because its faith is undivided, its body is one; for there is one Lord, one faith, one baptism, one God and Father of all, who is above all and through all and in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
