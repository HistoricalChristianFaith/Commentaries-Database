[[commentary]]
quote='''
Yet he seems to join to this prophecy the grace of a blessing as well. For both in saying to the firstborn Reuben: Do not boil over like water he set a bound to the sin, because water is wont rather to cleanse offences and to call our minds back from every heat of the vices; and again, in saying to Simeon and Levi: I will divide you in Jacob and scatter you in Israel he showed that they were to be redeemed by the gathering of the Gentiles; for when the shepherd was struck, that flock which had before been gathered was scattered, so that he who was not might enter in, and thus all Israel might be saved. And we ought to believe this especially on account of the tribe of Levi, because the Lord Jesus is seen to draw his descent from that tribe according to his taking up of the body. From that tribe are the priests Levi and Nathan, whom holy Luke, in the book of the Gospel which he himself wrote, has counted among the Lord's ancestors. For the priest of the Father and the chief of all priests, as it is written: You are a priest for ever, had to claim the succession of a priestly origin.

Hence Moses too blessed this tribe, saying: Give to Levi the lot of his suffrage, and his truth to the holy man. Moses blessed the tribe of Reuben as well, as you have it written: Let Reuben live and not die, and let him be many in number. For he would not have blessed them if he had known them to be unworthy of blessing according to the patriarch's sentence. Certainly, what the one passed over briefly, this one completed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 3"
