[[commentary]]
quote='''
Nor is he commended by the splendour of his family or the support of his kinsfolk or by riches, but by a good disposition. For Elijah was not less blessed than Moses, since the one, in need of food, in a cheap sheepskin, without children, without means, without a companion, and the other, leader of peoples, glad in his offspring, girded with power, laid the foundation of equal merit in different ways, as was declared in the Gospel when they shone with the Lord Jesus in the glory of the resurrection; for he seems to have given an equal reward to them as to equal witnesses of his glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 8"
