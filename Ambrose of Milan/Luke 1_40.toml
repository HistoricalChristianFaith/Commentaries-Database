[[commentary]]
quote='''
You have learned, virgins, the modesty of Mary: learn her humility. The kinswoman came to her relative, the younger to the elder; and not only did she come, she even greeted her first; for it is fitting that the more chaste a virgin is, the more humble she should be. Let her know how to defer to her elders; let her in whom is the profession of chastity be a teacher of humility. There is in this too a ground of devotion, there is also a rule of teaching. For one must observe that the superior comes to the inferior, that the inferior may be helped: Mary to Elizabeth, Christ to John; then also later, to sanctify the baptism of John, the Lord came to baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
