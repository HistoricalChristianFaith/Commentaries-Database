[[commentary]]
quote='''
Hence Peter excellently expressed what faith is, saying: Lord, to whom shall we go? You have the words of eternal life, and we believe. How then do you bid us depart from you? For, captivated by the sweetness of the heavenly words, he did not wish to depart from Christ; but he who denies Christ separates himself, or is separated, from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
