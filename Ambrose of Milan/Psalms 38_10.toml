[[commentary]]
quote='''
The prophet also added this, that, since his heart was troubled, his strength had forsaken him. A great danger, if the heart is harried, with which we believe unto righteousness. But yet, as in great dangers of sickness, if pain is felt and the sense of it is expressed, a remedy of health is shown — for to feel pain is more tolerable than not to feel pain; for it is one thing, the mark of a quickening still remaining, if you feel pain, another, the sign of final death, if there is no sense of pain —, so the heart too shows signs of health when it recognizes the causes of its disturbance. Indeed David's heart was troubled against Nabal, a pestilent man, and he found grace. Abigail came to meet him, to soften the stirring of his indignation and to receive the sanctification of a blessing. But Nabal, with his hard and rigid heart, could not bear his wife's word, and stunned he grew stiff and fell into death.

But what strength forsook the prophet, that of the flesh or that of the mind? If that of the flesh, health is certainly not to be despaired of; for power is made perfect in infirmity. Of this a certain arbiter and fighter in the wrestling of mind and body discoursed at no small length, knowing how to temper the contest of each, so as to restrain the flesh, if he saw it was the stronger, lest it lead the mind captive in the law of sin. And so he held back the flesh, but joined to it the power of the mind; thus he deserved to reach the crown. So, as the prophet says, if the strength of the flesh forsook him, the strength of the mind prevailed. But if we take it that the strength of the mind forsook him, it is no wonder if in most grievous temptations, his heart troubled, a man thinks he is forsaken by the strength of his mind. Let him teach you himself, saying: My strength and my praise is the Lord. It was the Lord, then, he sought, and therefore, so as not to deserve to be forsaken, he thought he must seek him the more often, and wherever he wavered, he thought himself forsaken. So the apostles rouse the sleeping one, lest he sleep to them, not because they believed he had fallen asleep. So Elisha, to use the examples of earlier men: Where, he says, is the God of Elijah?, not that he thought him absent, but because he sought his presence in benefits. So Jeremiah followed him as a physician, saying: Heal me, Lord, and I shall be healed; save me, and I shall be saved. I have not laboured, following after you. So the Church sought him in the Song of Songs and asked the daughters of Jerusalem to rouse love; she sought to find him whom she held by her love and never felt absent. So, then, David too did not complain that he had been forsaken by Christ, but judged that with him present he could not be troubled.

Indeed, that you may know it is rather to be understood of Christ, he added: and the light of my eyes is not with me. What is the true light of all but Christ, of whom John says: He was the true light which enlightens every man coming into this world, because it is he who enlightens both the eyes of the body and the gaze of the mind? Let us ask, then, that he may always pour his light into us and always be with us, as he was with David. And therefore David dared to say: For with you is the fountain of life, and in your light we shall see light. He certainly, as a prophet, had seen the great light; for us let his lamp shine, so that we may not go astray; and the lamp is the word, as the true light is the Word which enlightens the whole world. Indeed, Your word, Lord, is a lamp to my feet; and that lamp the prophet too sought, not a lantern, but a lamp. John found the lamp and showed it, when the persecutor came with a lantern and pointed it out; for a lantern has a light enclosed, not free. The light of the Jews is like a lamp under a bushel or torches under a veil; it can be seen, but is not seen. But we, with unveiled face, behold the eternal glory of the Lord, so as to be re-formed into his image from glory to glory through the Holy Spirit. The crowd of persecutors, then, came with lanterns, and so their eyes could not see the enclosed light; it came with torches, which have more murky smoke than brightness in their light. Indeed it is the custom for the corpses of the dead to burn by torches. The Jews, then, who persecuted the author of salvation, were already bringing burnings upon themselves. They came with arms, signifying that they, who refused the peace of the Lord, would perish by arms at the hands of the Romans, to the destruction of the whole city and temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
