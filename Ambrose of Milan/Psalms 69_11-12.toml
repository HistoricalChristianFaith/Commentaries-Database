[[commentary]]
quote='''
But the Lord too said: I became a parable to them. Those who sat in the gate exercised themselves against me; and he became a parable because, he says, you say: Physician, heal yourself. He became a parable because he rebuked those sitting in the gate; for at the going out we ought to be not idle but exercised. And therefore it is written: See that your flight be not in winter or on the sabbath, that is, not in idleness but in business. The Jews, then, sat sluggish, because those could not stand who did not know the courts of the true Jerusalem; for if they had known, they would have sought that Jerusalem. These, then, sat wearied in the gate. And he did not only say 'they sat', but also that they hated the Lord who reproved them in the gates. For he was in the gate who was about to undergo the passion of his body, through which he would depart from the earth and return to heaven. He was in the gate when he said: Walk while you have the light. What, then, is I became a parable to them, unless that Christ is the end of the Law, and his death solved the riddles of the prophets, and the things which before were unknown to the Jews when they were prophesied were afterwards made manifest by the effect of the Lord's Passion? He became a parable to them, because he offered himself as if worthless, thrusting himself upon them and not fleeing their seditions, and leading them on to the time of his good pleasure, so as to die for all men, that by his blood the race of men might be cleansed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
