[[commentary]]
quote='''
But in the fourth generation they shall return. The history indeed seems to fit the Jews, who passed into Egypt and went out of Egypt. For four hundred and thirty years were their years completed there; but not all of them lived a hundred years and the years beyond, as Moses or Joshua son of Nun did, so that the time of the fourth generation should fit. Hence let us rather seek something mystical, in that the tetrad is apt for all numbers and is a kind of root and foundation of ten, and also the middle of the hebdomad. Thus Psalm 93 (94) is headed "for the fourth day of the week", because this number is the middle of those that come before and after it: for three precede it, first, second, third, and three follow it, fifth, sixth, seventh. He who sings this psalm passes through the life of this world as with fitting numbers, as one square, stable and perfect. In four books the Gospel is full and perfect. There are four mystical living creatures, and also four parts of this world, from which the sons of the Church, gathered together, have spread the most sacred kingdom of Christ, coming from the east and the west, the north and the south. On a fourfold side, then, the holy Church has risen. The decad too rises from this number. For if you join the numbers from one up to four, in this way you will make ten. Count one, add two to it: they make three. Add three to three: they make six. And to six add four: they make ten. The tetrad, then, fills up ten; the decad embraces every number. There are also four ages of man: boyhood, adolescence, youth, maturity. Little by little wisdom rises and is grounded. And so the summit of prudence comes in the fourth order of the ages. And rightly, even if a man was formerly under the king of Egypt, yet at the age of riper counsel he goes out from his power and acknowledges the Law that he must follow. Then the sea of this life becomes passable for him. A like reasoning holds for the things that spring from the soil. When the seed has been sown, it is loosened in the ground and first breaks out into a root, then sprouts; the fruit is formed and afterwards ripens. The trees themselves too first bear fruit, then the fruit itself grows, with the passage of time changes its colour, and in the fourth order, that is, the last, is brought to completion. So then let us too, in this land of affliction, flee from forming bricks, but with groaning and tears call forth the mercy of the Lord, that he may send us Moses and Aaron, that is, the Law and the priest, but that true priest and prince of priests, of whom, though he lived among men, it was said: behold, the spirit before our face, Christ the Lord, and that he may free us from the land of Egypt, so that we may celebrate the Passover of the Lord. Let us also bear the fruit of faith from boyhood itself, increase it in adolescence, colour it in youth, complete it in old age. For already the axe is laid to the roots of the trees, so that he who makes fruit may bear it. Let the reaper also find our crop grown and ripe, so that he may store ripe fruits in his barns, lest winter overtake them unripe, the wind shake them down, the rain spoil them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
