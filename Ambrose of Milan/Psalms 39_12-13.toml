[[commentary]]
quote='''
Then holy David too was hastening to go out from this place of sojourning, saying: I am a stranger with you on the earth, and a sojourner, like all my fathers. And therefore, as a sojourner, he was hastening to that homeland common to all the saints, asking that his sins be forgiven him for the defilement of this stay before he departed from life. For he who has not received forgiveness of sins here will not be there; for he will not be who has not been able to come to eternal life, because eternal life is the forgiveness of sins. And therefore he says: forgive me, that I may be refreshed before I go, and I shall be no more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
