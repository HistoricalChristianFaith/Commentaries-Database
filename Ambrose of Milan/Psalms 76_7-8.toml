[[commentary]]
quote='''
Terrible is the Lord, and one whom none, whether rich or mighty, can resist. From heaven does He hurl His judgment.

It is good that you should now rest and, ceasing from crimes, reverence the power of the Lord. Therefore it was said to the parricide Cain: Thou hast sinned, rest, that he might put a measure to his sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapters 15-16"
