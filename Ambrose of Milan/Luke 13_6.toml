[[commentary]]
quote='''
There was a vineyard of the Lord of hosts, which He gave for a spoil to the Gentiles. And the comparison of the fig tree to the synagogue is well chosen, because as that tree abounds with wide and spreading foliage, and deceives the hopes of its possessor with the vain expectation of promised fruit, so also in the synagogue, while its teachers are unfruitful in good works, yet magnify themselves with words as with abundant leaves, the empty shadow of the law stretches far and wide. This tree also is the only one which puts forth fruit in place of flowers. And the fruit falls, that other fruit may succeed; yet some few of the former remain, and do not fall. For the first people of the synagogue fell off as a useless fruit, in order that out of the fruitfulness of the old religion might arise the new people of the Church; yet they who were the first out of Israel whom a branch of a stronger nature bore, under the shadow of the law and the cross, in the bosom of both, stained with a double juice after the example of a ripening fig, surpassed all others in the grace of most excellent fruits; to whom it is said, You shall sit upon twelve thrones. Some however think the fig tree to be a figure not of the synagogue, but of wickedness and treachery; yet these differ in nothing from what has gone before, except that they choose the genus instead of the species.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A certain man had a fig tree planted in his vineyard. What does it mean that the Lord in his Gospel frequently brings in the parable of the fig? For you have elsewhere that at the Lord's command all the greenness of this leafy tree withered. From which you understand the Creator of all, who can command natures either to wither suddenly or to grow green. Elsewhere he mentions that from the tenderness of this tree and from its leaves the coming of summer is usually inferred, signifying by both that the empty glory which the Jewish people displayed fell like a flower at the coming of the Lord, because it continued unfruitful in works, and that the day of judgment, like the coming of summer, in which the ripe fruits of all lands are stored away, is to be measured by the fullness of the Church, in which the Jews too are to believe.

Here too, then, let us seek some hidden meaning of a higher sense. The fig tree is in the vineyard, and the vineyard was the Lord Sabaoth's, which he gave over to be plundered by the nations. And so he who caused his vineyard to be plundered here also ordered the fig tree to be cut down; and the comparison with this tree is apt for the synagogue, because just as this tree, abounding with flowing leaves, disappoints the hope of its owner by a vain expectation of hoped-for yields, so also in the synagogue, while its teachers, unfruitful in works, yet glory in their words as in abounding leaves, the empty shadow of the Law overflows. And the hope of a false yield, once looked upon, mocks the prayers of the believing people.

There is also something in the nature of the tree by which you may the more believe that the appearance of the synagogue is expressed by comparison with it. For if you inquire carefully, you will find the habit of this nature distinct from the manner of the other trees. For the others bear a flower before the fruit, and by the flower as their herald mark the fruits to come; this alone from the beginning puts forth fruits instead of flowers. In the others the flower is shaken off and the fruits are born; in this the fruits fall so that fruits may succeed. So those first ones, empty of fruit, come forth in place of a flower; thus those that do not know the order of nature, through a kind of premature habit of birth, cannot keep the benefit of nature. For where the bud is wont to push itself out from the middle of the bark, there all the tiniest fruits of this kind burst out. Of these we read in the Song of Songs: the fig tree puts forth its green figs. And so, while the other shrubs whiten in early spring, the fig alone does not know how to grow white with a flower of its own, perhaps because no riper use is found in these fruits. For when others succeed, these are rejected as though degenerate and, weak because of a withering root, are cast off in favor of the renewed ones, to which the sap is more useful. Yet some few remain and do not fall, on which this yield has smiled, that they come forth from between two twigs, a short little shoot breaking out, so that, covered by twin protections, as in the bosom of nature their parent, they grow in by the warmth of a fuller sap. These, called forth by the mild temperature of a gentler breeze and grown riper with longer seasons, when they have put off the wild temper of their former sap, are preferred to the others in appearance and in the grace of ripeness.

Look now at the worship and the minds of the Jews, who, like the first fruits of the ill-bearing synagogue, fell down in the likeness of a dropping green fig, so that the fruits of our race, which will remain beyond the age, might succeed. For the first people of the synagogue, weak as it were with a root of withering works, could not draw up the richness of natural wisdom, and therefore fell like a useless fruit, so that, as from the same shoots of the fruitful tree, the new people of the Church might come forth from the fatness of the ancient religion. So that which was ceased to be, that this which was not might begin. Yet the first were from Israel. Those whom a branch of stronger nature had brought forth, under the shadow of the Law and of the cross, colored in the bosom of both with a twofold sap after the example of the ripening green fig, surpassed the others by the grace of most beautiful fruits, those to whom it is said: you will sit upon twelve thrones judging the twelve tribes of Israel.

Nor is this foreign, that Adam and Eve, those first parents of our race as of our error, who covered themselves with the leaves of this tree, deserved to be exiles from paradise, when, conscious of their transgression, they shunned the presence of the Lord as he walked about, so as to signify what was to come: that in the last times the people of the Jews, at the coming of the Lord Savior, who came to call them, recognizing that it had been stripped of its virtues through the temptations of the devil and dreading the uncovered disgraces of its conscience, would, straying from religion and confounded by its transgression, withdraw from the Lord, covering the shameful parts of its deeds with the veils of flowing words as with leaves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
So those who plucked leaves from the fig tree, not fruits, were cast out of the kingdom of God; for they were a living soul. The second Adam came and sought no longer leaves but fruits; for he was a life-giving spirit. And in the spirit the fruit of virtue is acquired, the Lord is adored. And the Lord sought it, not because he did not know that fruit was lacking to the fig tree, but to show in a figure that the synagogue ought already to have had fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
