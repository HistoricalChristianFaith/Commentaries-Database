[[commentary]]
quote='''
But soon the blessed fruits of Mary's coming and our Lord's presence are made evident. For it follows, And it came to pass, that when Elisabeth heard the salutation of Mary, the babe leaped in her womb. Mark the distinction and propriety of each word. Elisabeth first heard the word, but John first experienced the grace. She heard by the order of nature, he leaped by reason of the mystery. She perceived the coming of Mary, he the coming of the Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Quickly, too, the benefits of Mary's coming and of the Lord's presence are made known; for at once as Elizabeth heard the greeting of Mary, the infant leaped in her womb, and she was filled with the Holy Spirit.

See the distinction, and the propriety of each of the words. Elizabeth was first to hear the voice, but John was first to feel grace: she heard by the order of nature, he leaped by reason of the mystery; she sensed the coming of Mary, he the coming of the Lord; the woman that of the woman, the offspring that of the offspring; the women speak grace, the children work within and set about the mystery of devotion for their mothers' advancement, and by a double miracle the mothers prophesy by the spirit of their little ones. The infant leaped, the mother was filled. The mother was not filled before the son, but when the son had been filled with the Holy Spirit, he filled his mother too. John leaped, and Mary's spirit leaped too. As John leaps, Elizabeth is filled; but Mary, we know, is not filled with the Spirit, but her spirit leaps — for the Incomprehensible was working incomprehensibly in the mother — and the one is filled after conception, the other before conception.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
