[[commentary]]
quote='''
Yet he won who was preferred by the oracle; promptness won over slowness, gentleness over harshness. While the other seeks wild prey in the rough hunt, this one served his loving father the food of gentle manners, this one a homely grace, this one the sweet dishes of tender gentleness and love. Whatever comes readily to hand pleases the mind more than whatever you might think should be offered with affectation. Jacob went to the sheep and brought the offspring of innocence, or the gifts of sacred prophecy, because he believed that no food was sweeter to the patriarch than Christ, who was led like a sheep to slaughter and like a lamb to the sacrifice. He judged this food useful both for the common father and for the people, whose type he bore, since by it there was to be the remission of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 2"
