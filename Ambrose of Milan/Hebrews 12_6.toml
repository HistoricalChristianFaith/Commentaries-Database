[[commentary]]
quote='''
A father loves his son, loves him even when he rebukes him, loves him even when he beats him with a rod; he who indeed spares his rod hates his son. The Lord too chastises us and loves us. And so even when we commit what deserves coercion, he still loves, who even takes back the one who offended; and the Lord chastises every son whom he receives. You too, when you are chastised, love, because you are chastised so that you may be received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
