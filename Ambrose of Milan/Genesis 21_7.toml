[[commentary]]
quote='''
And Sarah said: who will announce to Abraham that Sarah is suckling a child? A moral passage. Women are called to remember their dignity and to suckle their own children. For this is a mother's grace, this the honour by which they may commend themselves to their own husbands. Indeed husbands usually love more those children whom the mothers themselves have suckled at their own breasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
