[[commentary]]
quote='''
In the preceding book we discussed the precepts of the virtues; in the following let us use the examples of illustrious men who, placed in the greatest dangers, did not lose the blessedness of life but rather acquired it. Was not Jacob blessed even when he was leaving his homeland? Nay, plainly blessed, he who took upon himself the hardships of exile in order to soften his brother's anger. For if he is blessed who turns aside from sin, certainly he cannot be denied to be blessed who lightens another's guilt and averts a crime. And so by a voluntary exile he turned aside the fratricide that was prepared, and by that deed he sought safety for himself and bestowed innocence on his brother. Deservedly, therefore, divine grace accompanied him everywhere, so that even when he slept he acquired the gift of the blessed life. For he saw the mysteries of things to come and heard divine oracles. He was a good labourer in his sleep and rich in poverty, he who by the task of a hired man's life procured both an inheritance and a marriage by one and the same service. The same man, an excellent reconciler of brotherly affection, strove with gifts and attentions to shut out all indignation and to turn away the pain of offence, showing that he had not been made less by exile, since he could bestow what he had not received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 1"

[[commentary]]
quote='''
Hence envy arose, and Esau threatened that he would kill his brother after their father's death. But if that should happen, let us learn from Rebekah how we must take precautions, so that envy may not stir up anger, nor anger rush headlong into fratricide. Let Rebekah come, that is, let patience be put on, the good guardian of innocence; let her persuade us to give place to wrath. Let us withdraw somewhat further off, until indignation is softened by time and forgetfulness of the offence steals upon it. And so patience does not dread even exile, but undertakes it readily, not so much that danger to one's life as that an incitement to crime may be avoided. The loving mother too endures that her most beloved son be absent from her, meaning to bestow the more on the one whom she hurt, yet taking thought for both, so that she might keep the one free from fratricide and the other unharmed by the crime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 4"
