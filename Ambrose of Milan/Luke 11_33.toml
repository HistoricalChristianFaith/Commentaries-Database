[[commentary]]
quote='''
Either faith is the light, as it is written, Thy word, O Lord, is a lantern to my feet. (Ps. 119:105.) For the word of God is our faith. But a lantern cannot shine except it has received its quality from something else. Hence also the powers of our mind and senses are enlightened, that the piece of money which had been lost may be found. Let no one then place faith under the law, for the law is bound by certain limits, grace is unlimited; the law obscures, grace makes clear.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
No one lights a lamp and puts it in a hidden place nor under a bushel, but upon a lampstand. So, since in what went before he preferred the Church to the Synagogue, he exhorts us to transfer our faith rather to the Church; for faith is a lamp, according to what is written: your word is a lamp to my feet, O Lord; for the Word of God is our faith, the Word of God is light, faith is a lamp. He was the true light, which enlightens every man coming into this world. But a lamp cannot give light unless it has received its light from elsewhere. This is the lamp which is lit, namely the virtue of our mind and understanding, so that that mina which had been lost may be found. Let no one, then, set his faith under the Law; for the Law is within measure, grace beyond measure: the Law overshadows, grace makes bright. And therefore let no one shut up his faith within the measure of the Law, but let him bring it to the Church, in which shines the grace of the sevenfold Spirit, which that chief of priests illumines with the brightness of the divinity on high, lest the shadow of the Law extinguish it.

Indeed that lamp which the chief of the priests was wont to light in the morning and in the evening by the ancient rite of the Jews has vanished, set as it were under the bushel of the Law; and that city of Jerusalem which is on earth, which killed the prophets, lies hidden, set as it were in a valley of weeping; but that Jerusalem which is in heaven, in which our faith serves as a soldier, set on that highest mountain of all, that is, in Christ, the Church, cannot be hidden by the darkness and ruins of this world, but, shining with the brightness of the eternal Sun, illumines us with the light of spiritual grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
