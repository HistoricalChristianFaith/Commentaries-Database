[[commentary]]
quote='''
From this point on, the celestial precepts present no great difficulty. However, there has been raised by several authors a question which we ought to answer lest simple minds be led astray by erroneous interpretation. Many authors, like Apelles in his thirty-eighth volume, propose the following questions. How is it, for example, that the tree of life has more power for giving life than the breath of God? Again, if man is not made perfect by God and each person acquired by his own effort a more perfect state of virtue for himself, does it not seem that man would gain for himself more than God had bestowed on him? Then they make the objection that, if man had not tasted death, he certainly could not be aware of what he had not tasted. What man had not tasted was something unknown to him. Accordingly, he could not be afraid of that of which he had no knowledge. To no purpose, therefore, did God inflict death as a punishment on men for whom it holds no fear.

We should be aware of the fact, therefore, that where God has planted a tree of life He has also planted a tree of life in the midst of Paradise. It is understood that He planted it in the middle. Therefore, in the middle of Paradise there was both a tree of life and a cause for death. Keep in mind that man did not create life. By carrying out and observing the precepts of God it was possible for man to find life. This was the life mentioned by the Apostle: Your life is hidden with Christ in God. Man, therefore, was, figuratively speaking, either in the shadow of life—because our life on earth is but a shadow—or man had life, as it were, in pledge, for he had been breathed on by God. He had, therefore, a pledge of immortality, but while in the shadow of life he was unable, by the usual channels of sense, to see and attain the hidden life of Christ with God. Although not yet a sinner, he was not possessed of an incorrupt and inviolable nature. Of course, one who afterwards lapsed into sin was far from being as yet in the category of sinner. Hence, he was in the shadow of life, whereas sinners are in the shadow of death. According to Isaias, the people who sinned sat in the shadow of death. For these a light arose, not by the merits of their virtues, but by the grace of God. There is no distinction, therefore, between the breath of God and the food of the tree of life. No man can say that he can acquire more by his own efforts than what is granted him by the generosity of God. Would that we had been able to hold on to what we had received! Our toils avail only to the extent that we take back again what was once conferred on us. The third objection, that one who has not tasted death cannot fear it, finds its solution in our common experience. There is an instinct innate in all living creatures which impels them to dread even what they have not yet experienced as harmful. Why is it that doves, even at the moment of their birth, are terrorized at the sight of a hawk? Why are wolves dreaded by sheep and hawks by chickens? In irrational animals there is a certain innate fear of creatures of a different species to the extent that, even though these animals are irrational, they have a feeling that death is something to be shunned. Such being the case, how true is it that the first man, fully and indubitably endowed with reason, should be conscious of the fact that death is something to be avoided!
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 5"

[[commentary]]
quote='''
There are some, again, who suggest for solution difficulties such as the following. For example, they maintain that refusal to obey an order is not always wrong. If the order is a good one, then the act of obeying is commendable. But if the order is a wicked one, it is not feasible to obey it. Therefore, it is not always wrong to disobey an order, but it is wrong to refuse to obey an order that is good. The tree of the knowledge of good and evil is a creation that is good, since God had knowledge of good and evil. Hence He says: Indeed! The man has become like one of us. If, therefore, possessing the knowledge of good and evil is good and if what God has is a good, it would appear that the prohibition to prevent man from making use of it is not a righteous one. Such is their argument. But, if they were to realize the real significance and force of the word "knowledge" as they should—The Lord knew who belong to him, that is, He knew those surely among whom He dwells and walks, who were made one out of so many—then certainly these people would know that knowledge is not to be interpreted merely as superficial comprehension, but as the carrying out of what ought to be accomplished. Man ought to obey the command. A failure to obey is a violation of duty. The man, therefore, who disobeys falls into error because violation of duty is a sin. Even if these people should agree to a modified meaning of the word "knowledge" and consider that an imperfect comprehension of good and evil was prohibited, in that respect, too, there is a violation of duty in not complying with the command. The Lord God has made it clear that even an imperfect comprehension of good and evil should be prohibited.

Another problem: The man who does not know good and evil differs in no respect from a little child. A judge who is just does not consider a child to be guilty of crime. The just Creator of the world would never have found fault with a child for his lack of knowledge of good and evil, because a child cannot be charged with a violation of a law. In the preceding passage, however, we have said that, once you accept the fact that there is a knowledge that is imperfect, then knowledge of good and evil may be taken in two senses. It is certainly false to hold that the man who does not know good and evil is not different from a child. If it is wrong to maintain that such a man does not differ from a child, then Adam is not to be thought of as a child. If he was not a child, then surely he is liable to sin, inasmuch as he is not a child. If he is subject to sin, then punishment follows the sin, because the man who cannot avoid sin is reckoned to be liable to punishment. It can even happen that the person who has no knowledge of good and evil may not be a child: For before the child knew good and evil, he refused the evil. Again we read: For before the child knew to call his father and mother, he will receive the strength of Damascus and the toils of Samaria. Perfect, therefore, is the man who performs a good deed even if he has not attained the knowledge of good and evil, just as many are a law to themselves even before they know the Law. Was the Apostle before he learned: Thou shalt not lust, quite unaware that concupiscence was a sin? On this point he says: I did not know sin save through the Law. For I had not known lust unless the Law had said, "Thou shalt not lust." Even a child can become by the law of nature perfect in that respect before he knows that concupiscence is a sin or admit the sin of concupiscence. Hence, God willed that man know the nature of evil in a superficial fashion lest, being imperfect, he may be unable to avoid evil. By not obeying a command we are subject to blame. We are thus led to admit our error. Again, if we are referring to a very profound knowledge of good and evil which in itself makes for perfection . . . A little child is not, like a grown-up, immediately to be chastised, because he has not yet reached a capacity to understand.

Again, more criticisms crop up. There is the objection that a person who does not know good and evil is unaware that disobedience to a command is in itself an evil, nor is he aware that that obedience to a command is itself a good. Hence it is argued that the person who is in this respect ignorant is deserving, not of condemnation, but of pardon. What we have already maintained above presents a ready solution to this problem. Man is capable of realizing that the utmost deference should be given to his Maker because of what God had already conferred on him, namely, the fact that God had breathed on him and that he was placed in the Garden of Delight. Wherefore, if he was ignorant of the meaning of good and evil, nevertheless, since the Creator of such mighty things had declared that one should not eat of the tree of good and evil, loyal adherence should be given to Him who gave the command. It was not a question of technical knowledge, but of fidelity. He certainly was aware that God was in a position of pre-eminence and, as such, heed should be paid to His command. Although he did not understand the precise significance of the commands, he was conscious of the fact that deference should be paid to the person of the Commander. This conviction on his part stemmed from nature. He was as yet incapable of discriminating between good and evil. Wherefore the woman answers the serpent: Of the fruit of all the trees in the garden we shall eat, but of the fruit in the middle of the garden, God said, you shall not eat of it. She knew, therefore, that the command must be obeyed. Hence she said: We shall eat of every fruit which the Lord ordered, but God has given an order that one should not eat of the tree in the middle of the Garden, lest he die. Wherefore, she who knew that the command should be obeyed was surely aware that it was wrong not to comply with the command and that she would be justly condemned for her refusal to obey.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 6"

[[commentary]]
quote='''
Still another problem arises. From what source did death come to Adam? Was it from the nature of a tree of this sort or actually from God? If we ascribe this to the nature of the tree, then the fruit of this tree seems to be superior to the vivifying power of the breath of God, since its fruit had drawn into death's toils him on whom the divine breath had bestowed life. If we maintain that God is the responsible cause of death, then we can be held to accuse Him of inconsistency. We seem to accuse Him of being so devoid of beneficence as to be unwilling to pardon when He had the power to do so, or of being powerless if He was unable to forgive. Let us see, therefore, how this question can be resolved. The solution, unless I am mistaken, lies in the fact that, since disobedience was the cause of death, for that very reason, not God, but man himself, was the agent of his own death. If, for example, a physician were to prescribe to a patient what he thought should be avoided, and if the patient felt that these prohibitions were unnecessary, the physician is not responsible for the patient's death. Surely in that case the patient is guilty of causing his own death. Hence, God as a good physician forbade Adam to eat what would be injurious to him.

Another point. To know what is good is better than to be ignorant of it. It is fitting that a person who knows what is good know, also, what is evil, in order that he may know the means to avoid it and, by taking the necessary precautions, that he may act with discretion. Again, it is not sufficient to know merely what is evil, lest, although you know what is evil, you may find yourself deprived of what is good. It is best, therefore, that we know both so that, since we know what is good, we may avoid evil. Again, from the fact that we are aware of evil we may give our preference to the charm of what is good. Moreover, we ought to know both so that our knowledge may be profound and so that we may put in practice what we know, act and acknowledge to be in perfect balance. Besides, Scripture points out that more is expected of him who has general knowledge of both than of him who is ignorant of them. Knowledge of what you cannot achieve or avoid is a grievous thing. Grievous, too, is knowledge which is not put into practice and into operation to its fullest extent. Without knowledge of what is harmful or beneficial to a patient and without the power of being able to utilize to the best advantage that knowledge, a physician is likely to act in such a way as to lose his reputation. Hence, knowledge is not salutary unless it is put into practice in the best possible way.

Still another point. Not without reason was the tree of knowledge of good and evil grown in the middle of the Garden, and the prohibition against it was unnecessary if it was grown for each and every man. This tree was designed for the use of just one man, who received the command that he make use not only of that tree, but of the other trees besides. You can find many, even countless, instances in which a person can, because of ignorance of procedure, suffer real harm. Wealth itself will be found to be unprofitable to a rich man if he refuses to act in a generous fashion toward the poor. He may shut out the needy and deprive them of assistance and, because of his superior powers, he may extort for his own purpose what belongs to another. The very possession of beauty and of physical charm is more likely than deformity to lead one to vice. For that reason, therefore, does anyone desire to have children who are unsightly rather than handsome? Or desire their offspring to be poverty-stricken rather than well-to-do? There are many instances of this sort which are not to be ascribed to the lack of wisdom in the giver, but to the person who misuses the gifts. The fault lies not so much in the person who makes the gifts as in the person who makes use of them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 7"

[[commentary]]
quote='''
Again, let us see why the Lord God said to Adam: Ye shall die the death. What is the difference between saying ye shall die and ye shall die the death? We ought to point out that there is nothing superfluous in the command of God. Here is my solution. Since life and death are contradictory ideas, in unaffected language we say "we live in life" and "die in death." But, if you wish, since life causes life, to double the force of the two concepts, the phrase "he lives a life" is found in legal documents, and, since death causes death, there is the statement: He shall die the death. These expressions are not redundant, for life is related to death and death to life, because everyone living dies while he is alive and lives when he dies. We find, therefore four categories: to live in life, to die in death, to die in life, to live in death. Since such is the case, we should put aside prejudices due to use and custom, for usage prescribes that the act of dying should be said without distinction of him who dies by death and of him who does so by his life. Accordingly, the Lord selects two of these four distinctive phrases so as to say that the living live, with qualifications as to whether well or ill, and the dying die, without a seeming difference between a good death and a bad one. There is no precise difference in fact between the kind of life or death here referred to. It could include that of irrational creatures or of tiny infants.

Putting aside, therefore, conceptions due to common usage, let us reflect on the meaning of "to live in life" and "to die in death" and also "to live in death" and "to die in life." I believe that, in accord with the Scriptures, "to live in life" signifies a wonderful life of happiness and that it seems to point toward an experience of life's natural functions joined and, by participation, mingled with the grace of a blessed life. This concept, "to live in life," means "to live in virtue," to bring about in the life of this body of ours a participation in the life of blessedness. On the other hand, what does "to die in death" mean if not the disintegration of the body at the time of death, when the flesh is devoid of its customary function of carrying on life and the soul is unable to partake in life eternal? There is also the person who "dies in life," that is to say, one who is alive in body but, because of his acts, is dead. These are the people who, as the Prophet says: Go down alive into hell, and she of whom the Apostle speaks: For she is dead while she is still alive. There remains the fourth category, for there are those who "live in death" like the holy martyrs who give up their lives so that they may live. The flesh dies, but what is good does survive. Far from us, therefore, be the thought of living as participants in death. On the contrary, we should face death and thus become sharers in life. The saint does not desire to be a participant in this life of ours when he states: To be dissolved and be with Christ. This has been much better stated by another: Woe to me that my sojourning has been prolonged, in grief certainly that he is limited by the fragility of this life, since he hopes for a share in life eternal. Wherefore I can, on the other hand, state that, although "to live in life" is a good thing, "to live for life" would be of doubtful benefit. One can speak of "living for life," that is, for the life of eternity with its struggle with the life of the body. One can also speak of "living for life" in another sense. Anyone, even a pious person, can have a desire for this corporeal life of ours. We can take the example of one who thinks that he ought to live so virtuously as to arrive by his good actions at a ripe old age. Many people who are in weak health, but who still find life a pleasureable thing, are in this category.

Now that we have examined the meaning of the phrase, "to live for life," let us now turn attention to the significance of the phrases, "to die for death" and "to live for death," for it is possible to conceive of people who "die for death" and who "live for life." For the person who "dies for or to death" is one who so lives as to live for the sake of his own soul, because he is not subject to death. We mean by this one who has been loosed from the bonds of grievous death and one who is not bound by the chains of death eternal. He is dead to death, that is, he is dead to sin. He is dead to punishment for whom living is contrary to punishment, that is, when a person lives for punishment he lives for death. Again, one who dies for punishment dies for death. There is also the case of one who, although placed in this life, dies for life. Such was the situation of the Apostle who said: It is now no longer I that live, but Christ in me. To sin he is dead, but he lives for God, that is, death in him is dead, but living in him is that life which is the Lord Jesus. Good, therefore, is the life of those who live for God and wicked the life of those who live for sin. There is also a middle course of life, as in the case of other living creatures, for which we may cite the Scriptural passage: Let the earth bring forth the living creature in its kind. There is also the life of the dead: The God of Abraham, the God of Isaac and the God of Jacob, because He is not the God of the dead but of the living. There are those who partake somewhat in both lives, that of the living and of the dead, of whom the Apostle speaks: If ye have died with him, ye shall also live with him. The same Apostle has said: For if we have been united with him in the likeness of death, we shall also be in the likeness of his resurrection also. For we know that our old self has been crucified with him, in order that the body of sin may be destroyed, that we may no longer be slaves to sin, for he who is dead is acquitted of sin. Just as we have said that there are many forms of life, so, too, we may discover many forms of death. An evil death is recorded in the words, The soul that sinneth, the same shall die. The usual meaning of death appears when we say that a person lived so many years and was laid among his fathers. There is the meaning of death as we have it in the sacrament of baptism: For we were buried with him by means of baptism into death. Elsewhere we read: For if we have died with Christ, we believe also that we shall live together with him. You see how the word "death" is subject to manifold interpretation, but that this life here is ours to contend with.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 9"
