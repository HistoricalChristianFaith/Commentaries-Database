[[commentary]]
quote='''
Indeed, he did not wait for an answer, but at once blessed him and was troubled by the fruit of his longing. And his inward parts were wrung, because the freedom to embrace the one he had longed for was being put off. Indeed, going into the storeroom he wept, and washed his face, and restrained himself. The stings of a great love quickly pierce the heart, unless the reins of longing are loosened. Joseph was being overcome by affection, held back by his plan: reason was contending with love. He wept, to temper with tears the heat of devoted love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"
