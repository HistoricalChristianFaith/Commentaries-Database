[[commentary]]
quote='''
That we must undergo many troubles in this life, divine Scripture shows in frequent passages, and also that many consolations are at hand, by which a mind capable of vigour and conscious of what is right ought to swallow up whatever belongs to present hardships and to look upon those things that hold unending delight. For consolations outweigh troubles, since they bring both the calming of present things and the hope of things to come. Hence the apostle Paul too: Unworthy are he says the sufferings of this time in comparison with the glory that is to come: unworthy, certainly, as regards the consolation of comparison, not as regards the fruit of redemption.

For whose life on earth is so illustrious that it could equal that heavenly glory? What is more sublime than Paul, who underwent so many dangers and swallowed so much pain and so many weaknesses? In the sufferings which he underwent for the name of Christ he was dying daily, as he himself says, and he reckoned that he suffered nothing unworthy in this time, for the hope and expectation of so great a glory. Elijah endured hunger, plots and the terrors of death, the bitterness of toils: and yet he alone, brought down from heaven to earth by fiery chariots and fiery horses and carried back from earth to heaven, hid all the merit of this warfare and lifted the grace of the devout rider beyond all things human. For what shall I say of Peter? Judging his cross unworthy of the future reward, he asked to be hung with his feet turned upward, so as to add something to his passion, he who did not fear to heap up its torments upon himself.

Hence not without reason holy David, both in the rest of his work and most of all in Psalm 41 (42), testified that he was hastening to that glory, saying: When shall I come and appear before the face of God? In that psalm he has plainly expressed both the troubles of human frailty and the consolations from the Lord. In it he also appeals to God on our behalf, because, forgetful of his work, forgetful of the liberality and grace conferred on man, he has forsaken the one whom he had undertaken to protect and adorn, and has cast him off, weak and shipwrecked, to be worn down by various weaknesses. Holy Job had done the same before him, but David more gently, Job more vehemently. It is my heart's purpose, therefore, to consider the interrogations of both, because in them the pattern of human life is expressed, its cause is pleaded, its prerogative is formed. In their order, then, we must look at them.

So Job, having lost his children and all that was his except his wife, who alone had been kept for him for his temptation, and drenched moreover with a grievous sore, when he saw that his friends had come not to console him but to aggravate and heap up his pain, perceived that power to tempt him had been given by the Lord to the adversary against him. And although he felt that the arrows of the Lord were in his body, by which he said he was pierced, yet like a good athlete who would not yield to pain nor refuse the hardships of the contest, he added: Let the Lord begin to wound me, but in the end let him not destroy me. For what is my strength, that I hold out, or what is my time, that my soul should bear it? Is my strength the strength of stones, or is my flesh of bronze? Or did I not trust in him? But help has departed from me, and his visitation has despised me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapters 1-2"
