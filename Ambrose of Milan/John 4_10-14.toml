[[commentary]]
quote='''
Come, then, Lord Jesus, and open your fountains to us, that we may drink of the water which whoever drinks shall not thirst for ever; or, if we cannot yet draw from your fountain, deign to grant that we may at least draw from the well, from which you promise a drink to that Samaritan woman who was still doubting. And you indeed promise drink from the fountain to all; but to those who doubt, like that Samaritan woman, your fountain is still a deep well. Let us too drink the water of the heavenly secrets, and, since we have been found worthy to come to your fountain, may it be granted to us at least to see an image of the heavenly mysteries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 7"
