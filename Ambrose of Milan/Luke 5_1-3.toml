[[commentary]]
quote='''
And getting into one boat, which was Simon's, he asked them to put out a little from the land.

When the Lord had imparted various kinds of healing to many, the crowd began to be held back neither by time nor by place from its eagerness to be healed. Evening came on, they followed; the lake stood in the way, they pressed on. And therefore he went up into Peter's boat. This is that boat which according to Matthew is still tossed by the waves, according to Luke is filled with fish, so that you may recognize both the beginnings of the Church tossed by the waves and the later times of the Church overflowing; for they are fish who sail through this life. There Christ still sleeps for the disciples, here he gives commands; for he sleeps for the fearful, he keeps watch for the perfect. But how Christ sleeps you have heard; you have learned it in the prophet who says: I sleep, and my heart keeps watch.

And Saint Matthew rightly thought that the sign of eternal power was not to be passed over, where he commands the winds. For it is not human teaching, as you have heard the Jews say: with a word he commands the spirits, but the mark of heavenly majesty. In that the troubled sea is calmed, and the elements obey the command of the divine voice, and insensible things receive the sense of obeying, the mystery of divine grace is revealed. In that the waves of the world grow gentle and the unclean spirit is quieted by a word, the one does not refute the other, but both are celebrated. You have a miracle in the elements, you have a lesson in the mysteries.

So, since Saint Matthew had touched on those things first, Saint Luke chose for himself that boat in which Peter was fishing. This one, which has Peter, is not troubled; that one, which has Judas, is troubled. Although many merits of the disciples sailed there, yet the unbelief of the traitor still tossed it. Peter is in both, but he who is firm by his own merits is troubled by another's. Let us beware, then, of the unbelieving man, let us beware of the traitor, lest through one we many be tossed by the waves. So this boat is not troubled, in which prudence sails, unbelief is absent, faith breathes. For how could that boat be troubled over which he presided in whom is the firmament of the Church? There, then, is trouble, where faith is small.

Here is security, where love is perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
