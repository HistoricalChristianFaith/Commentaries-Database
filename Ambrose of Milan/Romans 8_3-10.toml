[[commentary]]
quote='''
We have died in the flesh, we have been renewed in the spirit. Let us walk in the spirit, because we have received the Spirit of Christ. But if Christ is in us, then let the flesh be dead for us because of sin, but let the spirit live because of justification.

Thus what was impossible for the Law is resolved, if we walk in the spirit; thus we bury the passions, if we do not unfasten the cross of this body, if we do not write out again the bond of sin which was blotted out on the cross of Christ, if we do not put on again the garment of the old man which we have put off. For it is written in the Song of Songs: I have put off my tunic; how shall I put it on? I have washed my feet; how shall I defile them? The members of the body, then, have been mortified for us: why do its vices sprout? For this reason the Law did not prevail, because it did not mortify the flesh; for this reason it passed away like a shadow, because it gave no colour; for this reason too it overshadowed us from the sun of justice, because it heaped up crimes: therefore it also did harm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 5"
