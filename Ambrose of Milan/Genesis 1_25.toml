[[commentary]]
quote='''
But let us return to the creation of different species and reflect on the reason why the Lord formed some beasts, such as lions, tigers, and bears, with shorter necks, whereas other animals, such as elephants and camels, were created with longer necks. Do we not find clear reason for this in the fact that animals which are carnivorous do not need long necks? They bend down their necks and jaws to the earth in the act of feeding. They use them for waylaying a deer or for dismembering an ox or a sheep. On the other hand, the camel, a taller animal, would be unable to feed on the smallest plants unless in the process of feeding he was able to extend his long neck to the ground. Accordingly, to the camel there has been allotted a neck that is longer in proportion to his stature. This is true, also, in the case of such herbivorous animals as the horse and the ox.

The elephant, too, has a prominent trunk; otherwise he would be unable, because of his surpassing size, to reach the ground in order to find pasturage. He therefore makes use of this trunk in his search for food. Through it this monstrous beast imbibes huge quantities of water. This trunk is hollow and capacious. In the effort to satisfy his thirst this huge beast empties entire troughs. Thus he inundates himself within with rivers of water. In fact, his neck is smaller than the massive size of his body demands, so that it may serve a useful function and not be an encumbrance. For the same reason the animal does not bend his knees. In order that such a mighty contrivance be held in balance, there is need that his legs be like columns of a more than ordinary rigid character. The extremities of his feet are slightly curved, but the remaining parts of his legs are rigid throughout from top to bottom. Such a huge beast cannot bend his knees as we do. Naturally, therefore, he does not share with the rest of animals the ability to bend over or lie down. In order that without danger to himself he may sway a little in his sleep, he is supported on both sides by what may be called huge beams, inasmuch as he has no articulated joints in his limbs. For elephants that are tame a type of support has been contrived by men who are expert in this work. For the wild and untamed there is certainly an element of danger in the fact that no provision has been made for such supports.

Elephants actually make use of trees either for scratching their sides or for relaxation in sleep. These trees are sometimes bent or broken by the weight of such a body, which causes the animals to fall headlong. Being unable to raise himself up, he lies there and dies. He may be discovered by his cries of pain, as he exposes the softer parts of his body to wounds and death. Weapons cannot easily penetrate his back and the other harder parts of his body. Hunters in search for ivory prepare the following scheme to trap these animals. From the trees which the elephant makes use of they cut away a small section on the sides opposite those which generally served his purpose. The trees subjected to this pressure cannot sustain the weight of the elephant’s limbs and become the immediate cause of his downfall.

To find fault with these facts is like finding fault with the height of buildings which often threaten to fall headlong and are with difficulty restored. But if we frequently raise these aloft for the sake of artistic beauty or to serve as watch-towers, we ought to approve of this, too, in the case of elephants, because they perform a useful service in time of war. The Persians, for example, a race of fierce warriors, are noted for their expertness in archery and in similar arts. They advance in battle array surrounded by what appear to be moving towers, from which they shoot their weapons. When shot from a higher position these do more execution against the enemy below. In the center of the battlefield the combat seems to be concentrated around a rampart, citadel, or watch-tower, where the entrenched warriors appear to be spectators of the war rather than participants in it. They seem to be so remote from danger behind the protective bastion of the beasts. Who would venture to approach them, when he could be hit by a weapon from above or be annihilated by the onrush of the elephants from below? As a result, the battle line with its battalions drawn up in wedge formation gives way before them. The camping grounds which were laid out in blocks of squares have completely vanished. The elephants attack the enemy with a force that is irresistible. They cannot be held back by any embattled array of soldiers with massed shields. They take on the appearance of mountains moving in the midst of the battle. Conspicuous with their high crests and emitting a loud trumpet sound, they inspire fear in everyone.

What avail are feet or strength of muscles or manual dexterity to those who have to face a moving battlement packed with armed men? What use is his steed to the horseman? Driven by fear at the hugeness of this beast, his horse flees in panic! What can the bowman do against such an onslaught, although the armored soldier may not be affected by a rain of arrows directed from above? Moreover, the beasts’ hides, even when unprotected, are not easily penetrated by a weapon. Protected by this armor, they cut their way through and overwhelm the opposing masses of men without any risk of danger to themselves.

As in the case of huge buildings, we see that elephants, too, are supported by foundations of unusual strength. Otherwise, they would totter in a brief space of time because of lack of comparable sustaining power in their extremities. We are told nowadays that elephants live 300 years or more—a fact that corresponds to the hugeness of their bodies. And so their limbs are all the more sturdy because they are compact, not disjointed as ours are. How frequently it happens that our knees and feet cause us suffering, if we have been standing a long time or have been running at too high speed or after prolonged walking. Limbs that are jointed and articulated are more subject to pain than those which are compact and solid.

And no wonder that elephants, when equipped with arms, are an object of fear. Actually, they always present an armored front, with their tusks acting as a natural spear! Whatever they take hold of they break into pieces with their trunks and whatever they trample on they annihilate—such is the force of their onrush! To provide themselves with food they take possession of whole groves. Like huge dragons they involve with their serpentine folds whatever they waylay. Often, their trunks take on a circular form when in the act of eating or drinking. We have here a proof that nothing created is superfluous. Yet this huge beast is subject to us and complies with our commands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
