[[commentary]]
quote='''
When, then, is our soul not deceived, when does it attain the throne of truth, except when it separates itself from this body and is not deceived and mocked by it? For it is mocked by the sight of the eyes, it is mocked by the hearing of the ears; and therefore let it leave the body and forsake it. Hence the Apostle too cries out: do not touch, do not defile, do not taste, things which all tend to corruption; for the things that serve the indulgence of the body tend to corruption. And therefore, showing that he had found what is true not through indulgence of the body but through the elevation of the soul and humility of heart, he added: but our way of life is in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
