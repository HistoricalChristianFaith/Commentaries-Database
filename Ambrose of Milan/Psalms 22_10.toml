[[commentary]]
quote='''
He and the Father are One, and the Father is his Father by possession of the same nature.… Speaking as the Son, he called God his father, and afterward, speaking as man, named him as God. Everywhere, indeed, we have witness in the Scriptures to show that Christ, in naming God as his God, does so as man. "My God, my God, why have you forsaken me? And again: "From my mother's womb you are my God." In the former place he suffers as a man; in the latter it is a man who is brought forth from his mother's womb. And so when he says, "From my mother's womb you are my God," he means that he who was always his father is his God from the moment when he was brought forth from his mother's womb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25201.html'
source_title="Exposition of the Christian Faith 1.14.91-92"

[[commentary]]
quote='''
But above too we have it written: Upon you I was cast forth from the womb, from my mother's belly, you are my God. It is good even to be cast forth, but upon God. Indeed, this is said in Psalm 21 (22) in the person of Christ, who truly was cast forth from the virgin's womb upon the Father; for earthly things did not receive him as he died. Hence, when he was placed on the cross, as he sent forth his spirit, he said to the Father: Into your hands I commend my spirit.

Let none, then, add Lord, as the psalm-singers do, for I have found it neither in my Latin manuscript nor in the Greek nor in the Gospel, which is clearer still. Indeed, he had said above: Father, forgive them this sin, and therefore he commends his spirit into his hands as to the Father, in whose bosom the Son always is. And yet, even if they add that he said Lord, let them consider that he speaks this as a man placed in death.

Therefore he was cast forth from the womb upon the Father, from his mother's belly, that is: he defined that the womb which cast him forth is his mother's belly. But the Father says: From the womb before the morning star I begot you. Surely the Father did not cast forth the Son, from whom the Son never went out, as he himself says: I was delivered up and did not go out. He did not cast forth him to whom he is joined by the unity of the same substance. It can therefore be read thus too: Upon you I was cast forth from the womb, from my mother's belly, so that there follows: You are my God, do not depart from me. It can also be read thus: From my mother's belly you are my God, since even when placed in the womb I never withdrew from you; I was with you, I who, like Jonah placed in the womb of the whale, was beseeching you for the people. And truly from his mother's belly he was with God, according to what is written: For before the child knew good or evil, he chose what is good and: Before he could call father or mother, he plundered the strength of Damascus and the spoils of Samaria, so that, having called forth the Gentiles, he might win a kingdom for the Father by the worship of loving devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 6"
