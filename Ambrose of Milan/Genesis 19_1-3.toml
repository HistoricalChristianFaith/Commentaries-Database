[[commentary]]
quote='''
Lot was sitting at the gate. The adversities of captivity had amended holy Lot and made him more careful. And so with the advance of age he had learned to imitate his kinsman. And so he sat at the gate, to receive those who arrived. Then he rose up to meet them. The more perfect man ran to meet them; this one rose up and worshipped with his face to the ground and said: behold, lords, turn aside into the house of your servant. And he compelled them to turn in, though they were saying: we will stay in the street. Here the holiness of the just man and the graciousness of the angels are commended. They did not wish their coming to seem too burdensome to their host; he, though he knew among whom he lived, nevertheless exposed his own house to the dangers, in order to take his guests away from them. Certainly, the more slowly they consented, the more fully, by testing him longer, they proved him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
