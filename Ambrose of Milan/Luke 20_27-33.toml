[[commentary]]
quote='''
If a man's brother has died. The Sadducees, that is, the more detestable portion of the Jews, test the Lord in this place. Their folly is openly rebuked, but in the mystical sense their argument is turned back on them: what kind of example of chastity they offered from their own, when according to the letter a woman is compelled to marry even against her will, so that the brother may raise up the seed of the deceased. So the letter kills, as a procuress of vices, but the Spirit is the teacher of chastity.

So let us see whether this woman may not be the synagogue, which had seven husbands, as it is said to the Samaritan woman: for you have had five husbands, because the Samaritan woman follows only the five books of Moses, the synagogue chiefly seven; and from none of them, because of its unbelief, did it receive the seed of a posterity to inherit. And therefore it will not be able to have a share with its husbands in the resurrection, because it turned a spiritual precept upside down according to the sense of the flesh; for it was not some brother according to the flesh who was enjoined to raise up seed for his dead brother, but that brother who from the dead people of the Jews would take to himself as wife the wisdom of divine worship, and from her raise up seed in the apostles, who, like the remnants of the dead Jews, left still unformed in the womb of the synagogue, deserved, according to the election of grace, to be preserved by the admixture of the new seed.

But the synagogue is often shown receiving the robe, which is the mark of marriage, as the author of the faithful; it is often brought in also as repudiated, because it is the mother of the unbelieving. For it the bodily law died, so that the spiritual law might rise again. So the holy people of God, if it has loved the seven books of the Law with a kind of conjugal charity and has obeyed them as it were as a husband's commands, will have in the resurrection a heavenly fellowship, not confounded by the shame of bodily defilement, but enriched with the gifts of divine grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
