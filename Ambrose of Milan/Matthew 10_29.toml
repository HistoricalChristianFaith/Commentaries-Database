[[commentary]]
quote='''
There are also certain markets of our sins. And so, captured by the enticements of various pleasures, we are either sold under sin or redeemed from sin. Christ redeems us, the adversary sells; the one auctions us off to death, the other redeems us to salvation. Hence Matthew fittingly set down two sparrows, signifying the body and the soul, since the flesh too, if, consenting to the law of God and stripping itself of the law of sin, it has passed over in sense by purity into the nature of the soul, is lifted up to heaven on spiritual wings. And so we are taught that nature gave us the grace of flying, pleasure took it away, which weighs down the soul with the foods of evils and bends it into the nature of bodily mass.

And rightly he set down that none of them falls without the will of God; for what falls sinks toward the earth, and what flies is borne up to the height of immortality. But lest anyone should be in doubt about what Matthew said, Luke has plainly resolved it, that the will of God is knowledge; for it is not that whoever falls falls by the will of God, but that he who has collapsed under the weight of his own sins cannot escape God's notice; for Job too is tempted by his will. He gave you an adversary, but he set out a prize. And do not plead your frailty as an excuse: because you have the image, you have received a defense; whence this too profits for salvation, that you know that the devil cannot harm without God's permission, so that you may not fear the power of the devil more than offending the divinity.

Now it is not doubtful that the soul is compared to a sparrow, since you read: our soul has been rescued like a sparrow from the snare of the hunters. And elsewhere: how do you say to my soul: move to the mountains like a sparrow? We read also that man himself is compared to a sparrow, for it is written: but I am like a solitary sparrow in the building, that is, formed out of two sparrows into one sparrow, that is, into the fineness of a spiritual substance, by the joining of both wings in concord. So the sparrow is good to whom nature supplies the power of flight. There is also a bad sparrow, which has abolished the use of flying by the fault of an earthly stain, such as are these sparrows which are sold for two pennies. In one place they are sold for a penny, in another for two pennies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
