[[commentary]]
quote='''
We see, then, why Moses called the Levites first-born and redeemers of others, since they offer to one man the mentality of old age, corresponding to his own mature judgment and usefulness, and to another grant redemption. Hence Moses indicated that the cities of the Levites in the Old Testament served as a refuge, because he who fled to where the living Word of God resides, a place like a city well-protected and defended, that person attained for himself the kind of liberty which endures. If a man was guilty of involuntary homicide and if he took refuge in the cities of the Levites, no one was permitted to slay that person, provided he had his residence in those cities. In a similar way, if a person feels sorrow for a sin which was the result of an imprudent or involuntary act, the Law releases him from every penalty due to his crime, provided he remains in residence among the Levites and has no intention of leaving those instructors who dispense the commands of God.

Do not think it unreasonable that men given to evil reside together with men of good will and that those stained with guilt live side by side with the godly. Those men who have been polluted with the contagion of sin have need of purification. Thus there is a certain agreement of contraries. The Levite who has relinquished the pleasures of this world is an exile from guilt. In the same way, the person who is guilty of homicide is a fugitive from his native land. There is this difference, however, that the latter abandons his people because of fear of the Law, whereas God's minister renounces all contacts with human passions and frees himself from the exigencies of concupiscence by his pursuit of virtue.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"
