[[commentary]]
quote='''
We see, then, why Moses called the Levites first-born and redeemers of others, since they offer to one man the mentality of old age, corresponding to his own mature judgment and usefulness, and to another grant redemption. Hence Moses indicated that the cities of the Levites in the Old Testament served as a refuge, because he who fled to where the living Word of God resides, a place like a city well-protected and defended, that person attained for himself the kind of liberty which endures. If a man was guilty of involuntary homicide and if he took refuge in the cities of the Levites, no one was permitted to slay that person, provided he had his residence in those cities. In a similar way, if a person feels sorrow for a sin which was the result of an imprudent or involuntary act, the Law releases him from every penalty due to his crime, provided he remains in residence among the Levites and has no intention of leaving those instructors who dispense the commands of God.

Do not think it unreasonable that men given to evil reside together with men of good will and that those stained with guilt live side by side with the godly. Those men who have been polluted with the contagion of sin have need of purification. Thus there is a certain agreement of contraries. The Levite who has relinquished the pleasures of this world is an exile from guilt. In the same way, the person who is guilty of homicide is a fugitive from his native land. There is this difference, however, that the latter abandons his people because of fear of the Law, whereas God's minister renounces all contacts with human passions and frees himself from the exigencies of concupiscence by his pursuit of virtue.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"

[[commentary]]
quote='''
Fittingly, therefore, we must first explain why the cities of the Levites were given as a refuge. And it is clear that this was suitably provided, because the Levites are fugitives from this world, so that they may please God; they leave fatherland, parents, children and all kindred, so that they may cleave to the one God. Indeed, to Abraham too it was said: Go out from your land and from your kindred and from your father's house. But perhaps you say: He was not a Levite. But he had Levi in his loins, as we read written in the Letter to the Hebrews. And the Lord speaks to Levites when he speaks to his disciples, that is, to the apostles: If anyone wishes to come after me, let him deny himself and take up his cross and follow me, although it has now been said to all: But you are a chosen race, a royal priesthood, a holy nation, a people for adoption. The fullness has come; the remnants have ceased. For Christ has called all; the way forward lies open to all, so that all may follow; to all the kingdom is set before them, and eternal life.

Therefore he whose portion is God ought to care for nothing but God, lest he be hindered by the duty of some other necessity. For whatever is given to other duties is plucked away from the worship of religion and from this office of ours. For this is the true flight of the priest: the renunciation of his household and a kind of estrangement from those dearest to him, so that he who longs to serve God denies himself to his own. Rightly, then, did the sanction of the eternal Law commend fugitives to fugitives, so that those who have forgotten this world should receive those who, condemning their sins and their works, seek forgetfulness of their former life and desire to wipe out the worldly things they have done. The minister of his holy altar, therefore, is a fugitive from his own. Hence the Lord, as the prince of priests, giving a pattern to the Levites in his Gospel, said: Who is my mother, or who are my brothers? That is: I do not acknowledge a mother, I do not recognize brothers, I do not know my kin. My mother and my brothers are these who hear the word of God and do it. The minister, therefore, knows only the word of God, since he knows those in whom the word of God is at work. And therefore he is an exile from the world: a fugitive from the body, a fugitive from the passions, he renounces all things, so that he may remain alone, as Elijah said: And I am left alone. But he was not alone, with whom Christ was. And the Lord himself was left alone, but I am not he says alone, because the Father is with me.

There is also this reason, that the Levites are ministers of God. And therefore their cities are assigned by the Law to manslayers in flight, because it is their right to carry out the divine commands concerning those who have committed a mortal crime. The Church does not know how to publish laws of her own: she knows that the priest should obey the Lord's command. Hear a Levite saying: I have delivered such a one to Satan for the destruction of the flesh, so that the spirit may be saved in the day of our Lord Jesus Christ. Struck, then, by the Levitical sword, let the sense of the flesh die in us, so that our soul may live. For unless the sense of the flesh has been slain, there can be no fruit of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 2"
