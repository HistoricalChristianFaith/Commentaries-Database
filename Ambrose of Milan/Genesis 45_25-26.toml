[[commentary]]
quote='''
And they went up, he says, from Egypt and came into the land of Canaan to Jacob their father, and told him, saying that Joseph your son lives and he is ruler of the whole land of Egypt. What is the land of Canaan? That which was tottering. What, then, is so evident as that the times of the apostles are signified, in which they entered the tottering synagogues of the Jews and preached the power of the Lord Jesus, as we have it in the Acts of the Apostles, where Peter says: This Jesus, therefore, God raised up, of whom we are witnesses. Exalted, therefore, by the right hand of God, having received from the Father the promise of the Holy Spirit, he has poured out this gift which you see? We surely notice how he says both that he lives and that he is ruler of the whole earth, he who opens his granaries of spiritual grace and gives abundance to all. The apostles said these things, but the Jews did not believe; rather, they laid hands on them and thrust the preachers of salvation into custody.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
