[[commentary]]
quote='''
The divine judgments measure the merit of the righteous by the disposition of the mind, not by any outcome of deeds; for often either a good mind is disfigured by the outcome of a blameworthy deed, or a wicked thought is veiled by the comeliness of some deed. But even what you have done well, if you have thought badly, cannot be approved by the divine judgment; for it is written: Justly shall you pursue what is just. For unless it were possible for you to do what is just unjustly, it would never have been said: Justly shall you pursue what is just. And certainly the Savior himself taught us that what is just can be done unjustly, saying: When you give alms, do not sound a trumpet before you. And: When you pray, you shall not be as the hypocrites. For mercy is good, prayer is good, but it can be done unjustly, if someone gives to a poor man for the sake of boasting, so as to be seen by men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
