[[commentary]]
quote='''
Abraham, ready to receive strangers, faithful towards God, devoted in ministering, quick in his service, saw the Trinity in a type; he added religious duty to hospitality, when beholding Three he worshipped One, and preserving the distinction of the Persons, yet addressed one Lord, he offered to Three the honour of his gift, while acknowledging one Power. It was not learning but grace which spoke in him, and he believed better what he had not learnt than we who have learnt. No one had falsified the representation of the truth, and so he sees Three, but worships the Unity. He brings forth three measures of fine meal, and slays one victim, considering that one sacrifice is sufficient, but a triple gift; one victim, an offering of three.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%20the%20Decease%20of%20His%20Brother%20Saytrus%2FBook%202.html'
source_title="On the Decease of His Brother Satyrus"

[[commentary]]
quote='''
We have spoken of Abraham's devotion and of his faith, of his prudence, justice, charity and frugality: now let us speak also of his hospitality. For it is no mean virtue. Hence the Apostle too taught, by the authority of a twofold writing, that it ought to be present above all in a bishop, so that he may be at hand for those who arrive, and go out to meet them, and watch the roads, and be present to those who do not seek him, and seize those who pass by. Abraham was sitting before the door, sitting at midday. When others were resting, he was watching for the arrival of guests. Rightly did God appear to him at the oak of Mamre, because he was most zealously seeking the fruit of hospitality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
