[[commentary]]
quote='''
In the beginning, surely, was the Word, and he who sees the Word, who is a partaker of the Word, he too surely is, because the Word of God always is, and the speech which is from him is not "is" and "not", but "is", and it abides in him who follows God. But he who does not know the Word is not, because he does not cleave to him who said: I am who I am. But he who cleaves to him is one spirit; and where the Spirit is, there also is life. Therefore Scripture says to you of God: Who gives life to the dead and calls the things that are not as the things that are, that is: he calls the Gentiles, who were not, as his people, who was; for our fathers were, who were the chosen of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
