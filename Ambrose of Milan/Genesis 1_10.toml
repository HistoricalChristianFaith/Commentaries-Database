[[commentary]]
quote='''
God saw, then, that the sea was good. The aspect of this element is beautiful, either when the sea foams with its surging white caps and mountings billows, or when it bedews the rocks with its snowy spray, or even when under a balmy breeze it shimmers, often in this case presenting itself to the beholder from afar in colors of purple, suggesting serene tranquillity. Such is the aspect of the sea when it does not beat the nearby shores with the onrush of its waves, but when the waters greet it, as it were, in a fond embrace of peace. How gentle is the sound, how pleasing the splash of the water, how pleasant and rhythmic the wave-beats! Notwithstanding all this, I am of the opinion that the beauty of such a creation is not to be estimated by the standard of our own eyes, but is to be gauged in the design of the work as a whole by its conformity and agreement with the intention of its Creator.

The sea, therefore, is good; first, because it supplies the moisture necessary for the earth, to which it furnishes, so to speak, a sustaining fluid through the hidden apertures of its veins. The sea is good in its functions as a biding-place for the rivers, as a source of rainfall, as a place for the reception of alluvial deposits, as a carrier of merchandise, thereby linking distant people together. Furthermore, the sea defends us from the perils of warfare; by the sea, the fury of the barbarian is hedged in; the sea provides support in times of necessity, a refuge in times of danger, a delightful place for seekers after pleasure; it is a source of health for the sick, it joins together the separated; to voyagers it is a time-saver, to men in trouble a place of escape, to tax-payers it is an aid, and to the farmer in distress it is a means of livelihood. From the sea we obtain rain for the earth, since water is drawn from the sea which is deprived of its moisture by the sun’s rays. Then, the higher it reaches, the colder it becomes by reason of the shadowy coolness of the clouds. As a result, we have rainfall, which not only relieves the earth of its dryness, but also provides nourishment to the famishing fields.

Why need I enumerate the islands, which often adorn the sea with their jewelled necklaces? Men who hide themselves there seek to escape from the world with all its inducements to intemperate living with a firm purpose to live in continence and thereby avoid the dubious conflicts of this life. The sea, then, is a hiding-place for the temperate, an abode for those who wish to practice continency, a refuge for those in distress, a haven for the secure, a place of tranquillity for the unworldly and a place in this world for the prudent and moderate. Moreover, it provides an incentive to devout living for the faithful, so that they may rival the gentle sound of lapping waters with the songs of the psalms. Thus, the islands voice their approval with their tranquil chorus of blessed waters and with the singing of pious hymns resound.

How is it possible for me to comprehend all the beauty of the sea—a beauty beheld by the Creator? Why say more? What else is that melodic sound of the waves if not the melody of the people? Hence, the sea is often well compared to a church which ‘disgorges a tide’ through all its vestibules at the first array of the approaching congregation; then, as the whole people unite in prayer, there is a hiss of receding waves; the echo of the psalms when sung in responsive harmony by men and women, maidens and children is like the sound of breaking waves. Wherefore, what need I say of this water other than it washes away sin and that the salutary breath of the Holy Spirit is found in it?

May God grant us our prayer: to sail on a swift ship under a favorable breeze and finally reach a haven of safety; that we may not be exposed to spiritual obstacles too great to overcome; that we may not meet with shipwreck to our faith. We pray, also, for a peace profound and, if there be anything that may arouse the storms of this world against us, that we may have as our ever-watchful pilot our Lord Jesus, who by His command can calm the tempest and restore once more the sea’s tranquillity. To Him be honor and glory in perpetuity, both now and forever, and for all ages to come. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
