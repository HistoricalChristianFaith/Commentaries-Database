[[commentary]]
quote='''
David saw the sinner standing against him when Shimei cursed and stoned his king and shouted: Go out, you man of blood. For he would not have been so headlong as neither to be moved by reverence for so great a king nor to fear his armed host, when one man of his host could have killed the reviler; but the devil had made him mad, driving him on to death. Therefore David fought against the author rather than pursuing the minister. For what great thing was it to take vengeance on a feeble man whom another was urging to fury, in whose killing the sinner would have achieved the effect of his will?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
