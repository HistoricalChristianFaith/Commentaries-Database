[[commentary]]
quote='''
Then, because he had already begun in his inclination to turn away from his uncle, the land could not hold them; for no spaces can be enough for those at discord. For the quiet and peaceable even narrow places are abundant; for those of discordant ways even spacious places are cramped. And because I said from the beginning that the mind of man is being formed here, which had not been perfect from the beginning but makes progress by increments and by certain steps, therefore it says: The land could not hold them, that is, one soul did not admit diverse motions naturally fighting against each other. It can happen, however, that at times not all things are perfect in one and the same person, and yet someone may be able to cover his vices or temper his motions, if either the good things are more numerous, with which he may cover the fewer vices, or he bends a sudden agitation by more mature counsel. But if on both sides many discordant and conflicting things come together, the dwelling of discordant virtues and passions in one soul must needs be dissolved. Figuratively, then, following the natural philosophers, it called the soul land. For Solomon too says: Like farmland is the imprudent man; which, if it is fertile with rich crops of grain, can hide the thorns; but if the thorns compete with the ears, there is no possibility of reaping.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
