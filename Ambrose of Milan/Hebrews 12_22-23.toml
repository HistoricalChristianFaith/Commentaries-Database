[[commentary]]
quote='''
Wherefore, listen to what the Apostle says in regard to the first-born: But you have come to Mount Sion and to the city of the living God, the heavenly Jerusalem and to the company of tens of thousands of angels and to the first-born of the churches which were enrolled in heaven. He has set down in order here four things: Mt. Sion, the city of Jerusalem, the company of the angels, and the churches of the first-born. The Lord took, therefore, the Levites from the midst of the people of Israel because He did not wish that they be involved in human cares. Rather, He wished to make them ministers of religion, and He set aside for Himself the first-born who open the womb of the Spirit. Hence they were not from the womb of nature like sinners given over to wrong-doing of all sorts, but are chosen for their avoidance of worldly things. Wherefore they have no part in what belongs to the crown and are not reckoned as part of the populace. They possess the Word of God in their own hearts, as we read in the Gospel: Where two or three are gathered together for my sake, there I am in the midst of them. And elsewhere: In the midst of you there stands one whom you do not know.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 2"
