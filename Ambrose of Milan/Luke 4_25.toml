[[commentary]]
quote='''
In truth I say to you: there were many widows in the days of Elijah. Not because the days were Elijah's, but they were those in which Elijah worked; or because he made day for those who in his works saw the light of spiritual grace and were converted to the Lord. And therefore heaven was opened to those who saw the eternal and divine mysteries, and was closed when there was famine, because there was no abundance of the knowledge of the divinity.

But we have written of this more fully when we wrote about widows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Therefore the Gospel has: In the days of Elijah, when heaven was shut. It was night for the unbelieving, but for Elijah there was light; heaven was shut for the unbelieving, but for Elijah it lay open; there was famine for the unbelieving, but for Elijah plenty. For he could not hunger to whom heavenly things supplied food, nor did he hunger who himself fed others. The righteous man, then, is a day to himself in the darkness, because the light also shines in the darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
