[[commentary]]
quote='''
In truth I say to you: there were many widows in the days of Elijah. Not because the days were Elijah's, but they were those in which Elijah worked; or because he made day for those who in his works saw the light of spiritual grace and were converted to the Lord. And therefore heaven was opened to those who saw the eternal and divine mysteries, and was closed when there was famine, because there was no abundance of the knowledge of the divinity.

But we have written of this more fully when we wrote about widows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
