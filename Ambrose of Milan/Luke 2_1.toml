[[commentary]]
quote='''
Now it came to pass in those days that a decree went out from Caesar Augustus that the whole world should be registered in a census.

As we are about to speak of the birth of the Savior, we do not think it out of place to inquire at what time he was born. For what would a registration of worldly men have to do with the Lord's birth, unless that we may observe this too to be a divine mystery, that while a worldly registration is put forward, a spiritual one is fulfilled, to be made not to the king of the earth but to the King of heaven? This registration of faith is a census of souls; for when the old census of the synagogue had been abolished, a new census of the Church was being prepared, which would not exact torments but take them away, and which spiritually, in the type of the people, was already giving in its names to Christ. Here it is not the extent of lands but that of minds and souls that is assessed; boundaries are not marked out but carried forward; no age is set apart, but every age is enrolled; for no one is exempt from this census, because every age pays its dues to Christ, whom wailing infants confess by martyrdom, to whom those set within the womb bear witness by their leaping. Fear nothing terrible in this census, nothing harsh, nothing sad; faith alone marks each one. Would you hear Christ's census-takers? They are commanded to assess without rods, to seek out the people not by terror but by grace, to put up the sword, not to possess gold. By such census-takers the world was won.

Indeed, that you may know that the census is not Augustus's but Christ's, the whole world is commanded to register. When Christ is born, all register; when the world is shut in, all are in peril. Who, then, could demand the registration of the whole world but he who held dominion over the whole world? For not Augustus's, but the Lord's is the earth and its fullness, the world and all who dwell in it. Augustus did not rule the Goths, he did not rule the Armenians: Christ ruled them. Certainly they received Christ's census-taker, they who brought forth martyrs of Christ. And perhaps it is for this that they defeat us, as present events show, because the very one whom they confessed by the offering of their blood, the Arians called into question as to his generation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
