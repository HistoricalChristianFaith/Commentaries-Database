[[commentary]]
quote='''
And therefore, as to one perfect in all things, whom the flesh could no longer call back from the glory of suffering, a crown is decreed. When you were younger he says you girded yourself and walked where you wished; but when you are old, you will stretch out your hands, and another will gird you and lead you where you do not wish. Good is old age, not weak for use through length of life, but prepared for martyrdom by the maturity of virtue; which represses the wantonness of bodily pleasures and does not indulge desires, turns aside from everything sweet, does not seek after what is fair to see; for the flesh lusts against the spirit, and finds for itself crosswise paths of diverse pleasures by which to walk where it wills. But good is the old age of the mind, which chooses not what it thinks sweet to the body but what is useful to the mind, and is not captured by the willful appetite of the body, but is called back, as though unwilling, by a resisting governance.

So Peter too, although he was ready in mind to undergo martyrdom, yet when the danger came, he bent the constancy of his mind; for the enjoyment of the heavenly gift holds us captive by its sweetness. For who would not choose martyrdom, if he could die gladly? So Peter too seems unwilling, but he prepares to conquer. And what wonder if Peter is unwilling, when the Lord says: Father, if it can be, take this cup from me; yet not my will, but yours be done? Indeed after the testing of his presumption Peter no longer dares to promise perseverance of will, but, as if for his own comfort, seeks the companionship of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
