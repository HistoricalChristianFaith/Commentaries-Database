[[commentary]]
quote='''
And therefore at the banquet his portion was made fivefold greater, because he was to be preferred to those before him not only in prudence of mind but also in the warfare of the body and the grace of chastity.

And they drank and were made drunk together with him. From the beginning of faith a greater prerogative is conferred on Paul, of whom it was said to Ananias: Go, for he is to me a vessel of election, to bear my name before the Gentiles. From the beginning he is inebriated with an inebriation, but a sober one, so that he too might say with the saints: And your inebriating cup, how excellent it is!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapters 10-11"

[[commentary]]
quote='''
The perfection and fullness of Christ is the portion of the little ones. You have this mystery in Genesis, where Joseph gave five portions to his younger brother Benjamin, single ones to the other brothers (Gen. 43:34). To the Lord, then, is assigned the portion and prerogative of the five senses, which he himself surely grants to the one whom he loves, as he loved Paul too, to whom he gave the primacy of wisdom for calling the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
