[[commentary]]
quote='''
And Israel, raising himself up, came to the well of the oath and sacrificed a victim to the God of his father Isaac. Rightly is he raised up who hastens to Christ. Faith goes before devotion. First he raised himself up, afterwards he sacrificed; for he sacrifices well who has searched out the knowledge of the Godhead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
