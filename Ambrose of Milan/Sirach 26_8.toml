[[commentary]]
quote='''
But why should we speak about men, when even women, whom a more solicitous care should urge to the chastity of sobriety, drink unto drunkenness? Then they rising, whom it does not befit to be heard or be seen by strangers even within the privacy of their homes, sally forth in public with unveiled head and brazen face! The Apostle orders women to be silent even in church; he enjoins them to ask their husbands at home. These in the public squares perform, before the gaze of debauched youths, dances shameless even to men, tossing their hair, trailing their tunics, with torn garments, with naked arms, clapping their hands, leaping with their feet, uttering loud cries, inciting the passions of the youths towards themselves by their histrionic movements, impudent eyes, and disgraceful wantonness. A circle of young men look on and a pitiable spectacle takes place. Between the falls of the dancers and the reelings of the spectators, heaven is contaminated with the impure sight; the earth which is beaten with obscene dances is polluted by unseemly dancing.

How shall I speak patiently, pass over piously, bemoan fittingly? Wine has inflicted upon us the loss of so many souls! For if wine and women cause men to depart from God, because both drunkenness and passion are allurements to sin; if singly and separately they do this, what would they do united? Wherefore not without cause does a certain wise man say before us: A drunken woman is great anger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 18"
