[[commentary]]
quote='''
Therefore he added: waiting, I waited for the Lord. Where, then, is this rightly said, except in the Gospel? In it he who was awaited has now come to us; in it the shadow of the Law no longer darkens for us, but the truth shines, because Christ has shone forth, who heard the prayer of his own and brought us out of the pit of misery and out of the mire of the dregs, where, already sunk, we were held fast in the whirlpool of our sins, and our whole man stuck fast, and our mind could not tear itself free, overwhelmed by the stain of manifold wickedness. Thanks, then, to the Lord Jesus, the only-begotten Son of God, our Redeemer, who, to remit all our sins, came down from heaven, to snatch us out of the pit and slime of this world and out of a kind of muddy swamp of the earth, and also out of the body of this death, and to set the inner footsteps of our mind upon his own flesh, so that, strengthened in the Word of God and absolved through the cross of the Lord's body, we may walk no longer in the reproach of disgrace but in the remission of sin. Strengthened, then, and rooted in Christ, he records that the footsteps of his feet were set for him upon the rock. Hence the Apostle says: But they drank from the rock that followed, and the rock was Christ. A rock, in that it follows the thirsty and strengthens those who slip, so that the thirsty may not lack water, nor those who slip a firm support.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
