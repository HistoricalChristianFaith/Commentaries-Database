[[commentary]]
quote='''
Consider that man of whom Sirach says in Ecclesiasticus: Every man who transgresses on his bed, despising and saying in his soul: Who sees me? Darkness surrounds me, and walls. Whom do I fear? Does he not seem to you truly to be a hireling, who ..... has squandered, like that young man in the Gospel who, it is read, ..... the portion of the substance received from his father, and, needy and destitute, to relieve his hunger, began to feed another's flocks, so as to earn his own keep by a wage? But that one was nevertheless at length converted, because he returned to his father and did not suppress his sins but disclosed them; whereas this man, who thinks he is not seen by him who sees all things and supposes that his misdeeds can be hidden by darkness, holds a shade before himself, but in vain believes that he lies hidden, since the eye of the Lord, brighter than the sun, catches out all hidden things, illumines what is dark, penetrates the conscience of the inmost heart and descends into the heights and the depths. Vain, then, is he who thinks he is safe in darkness, since he cannot avoid the light which shines in the darkness, and the darkness does not comprehend it. Like a fugitive, therefore, and a bad hireling, he is caught, and he is recognized before he hides himself, because all things are known to the Lord before he seeks them, not only what has been done but also what is to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 3"
