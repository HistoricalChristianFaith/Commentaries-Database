[[commentary]]
quote='''
But since Jeconiah himself sat on the throne of David, how is it resolved what was said, that the descendants of Jeconiah will not sit on the throne of David, when the throne of both seems to have been the same? So we too cannot deny that it was the throne of David, and yet Christ did not sit on the same throne of King David that Jeconiah sat on; indeed, no one else of the line of David could sit on his throne but Christ, because in no one else is his seed eternal, but in Christ, as God himself disclosed, saying: Once have I sworn by my holiness, if I lie to David: his seed will remain for ever, and his throne as the sun in my sight. Whom, then, does he speak of here? Surely not Solomon, not Rehoboam, not Nathan, but him of whom alone he can say: I will set his hand in the sea and his right hand in the rivers. He will call me: 'You are my father', and: I will set his seed for ever and ever, and his throne as the days of heaven. Surely Solomon did not sit on this throne, nor Rehoboam, nor Jeconiah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
