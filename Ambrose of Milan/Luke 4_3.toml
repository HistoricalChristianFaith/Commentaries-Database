[[commentary]]
quote='''
There are three especial weapons which we are taught the devil is wont to arm himself with, that he may wound the soul of man. One is of the appetite, another of boasting, the third ambition. He began with that wherewith he had already conquered, namely, Adam. Let us then beware of the appetite, let us beware of luxury, for it is a weapon of the devil. But what mean his words, If thou art the Son of God, unless he had known that the Son would come, but supposed Him not to have come from the weakness of His body. He first endeavours to find Him out, then to tempt Him. He professes to trust Him as God, then tries to deceive Him as man.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the devil said to him: if you are the Son of God, tell this stone to become bread. We are taught chiefly three weapons of the devil, with which he is wont to arm himself to wound the mind of man: one of gluttony, another of boasting, the third of ambition. And he began from the point where he had already conquered. And so I begin to conquer in Christ from the point where I was conquered in Adam, if only Christ, the image of the Father, be to me the example of virtue. Let us learn, then, to beware of gluttony, to beware of luxury, because it is a weapon of the devil. A snare is laid when the table of a royal banquet is prepared, which often bends the constancy of the mind. For not only when we hear the words of the devil, but also when we see his plenty, ought we to avoid the snare. You have learned, then, the devil's weapon: take up the shield of faith, the breastplate of abstinence.

But what is the meaning of such an opening of speech: if you are the Son of God, except that he had known that the Son of God was to come? But he did not think that he had come through this weakness of the body. One thing belongs to one who probes, another to one who tempts: he both professes that he believes God and tries to mock the man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
