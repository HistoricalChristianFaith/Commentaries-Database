[[commentary]]
quote='''
But it would not be foreign even to a mystical sense of devotion to take it that he spoke of the angels, who spread their guard before those who fear the Lord, to rescue them from temptations which they cannot bear. How, then, do those stand afar off who have been assigned to help? But they do not separate themselves; rather, he who is pressed by temptations thinks those far away whom he wishes to be nearer to him, and supposes that they are holding back, while they await the time of helping at the nod of their commander, who has ordered his athlete to contend the longer, so that he might conquer the more gloriously. And this seems to fit better with what follows, because when the angels relaxed their protective watch, the enemies lay in wait, seeking to find in his soul something to harm it. For then power for a heavier temptation is permitted them, when a heavier fault of the soul is found. Whence you have in the book of Kingdoms that saying of King Ahab to Elijah, when the prophet rebuked him vehemently and announced death to him: Have you found, he says, me? And Elijah answered: I have found you, because you have done evil in the sight of the Lord. You see, then, that kings must not rashly be wronged, either by the prophets of God or by priests, if there are no graver sins for which they ought to be rebuked. But where the sins are graver, there it seems the priest should not spare, so that they may be corrected by just rebukes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
