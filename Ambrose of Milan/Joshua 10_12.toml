[[commentary]]
quote='''
For it was not in his own confidence that Joshua son of Nun said: Let the sun stand still over Gibeon, but because he presumed on Christ, whom he recognized as the leader of the heavenly host and suppliantly adored. And therefore he merited to root out savage nations and to bring the people of the fathers into the land of promise, because he ascribed nothing to his own works, believing that the works of men are unworthy of so great a reward of heavenly glory, which the Lord has determined to confer on those who believe in him out of his own mercy rather than in consideration of our deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For many men were illustrious, but through one, Jesus son of Nave (Joshua), Let the sun stand still he says over against Gibeon. You see that his power went beyond David's; for David commanded earthly things, not the stars. You see also that the sun is a servant, not a lord, since it even obeyed a human voice. Yet it stood still, because in Jesus it recognized both the type and the name of the one to come. For Jesus son of Nave commanded the heavenly lights not in his own power but by the mystery of Christ; for it was being signified that the Son of God would come into this world, who by divine power would delay the setting of the worldly light, which was going down and already declining into darkness, would restore the light, would bring in brightness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
