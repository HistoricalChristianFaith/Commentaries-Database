[[commentary]]
quote='''
For it was not in his own confidence that Joshua son of Nun said: Let the sun stand still over Gibeon, but because he presumed on Christ, whom he recognized as the leader of the heavenly host and suppliantly adored. And therefore he merited to root out savage nations and to bring the people of the fathers into the land of promise, because he ascribed nothing to his own works, believing that the works of men are unworthy of so great a reward of heavenly glory, which the Lord has determined to confer on those who believe in him out of his own mercy rather than in consideration of our deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
