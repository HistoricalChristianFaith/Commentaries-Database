[[commentary]]
quote='''
But the prophets sung, repeating in spiritual strains their oracles of the common salvation; they wept, soothing with mournful dirges the hard hearts of the Jews. The songs were not sung in the market-place, nor in the streets, but in Jerusalem. For that is the Lord's forum, in which the laws of His heavenly precepts are framed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We have sung to you, and you have not danced; we have lamented, and you have not wept. Although these words may seem not unfitting to the character of children, who through the thoughtlessness of an age not yet of riper gravity indulge in light movement of the body, yet I venture to think they can be referred to a higher sense, in that the Jews seem to have believed neither the psalms at first nor the prophetic laments afterwards: by the psalms they were summoned to rewards, by the laments called back from error. David sang, that we might hang our instruments upon the willows; he himself sang, and danced before the ark of the Lord not for wantonness but for religion. So what is meant is not the leaping of a body swaying with an actor's movements, but the eager agility of the mind and the devout agility of the body. But no amendment followed, neither in the triumphs nor in the downfalls of the Jews, who, summoned by the gifts of divine indulgence, ought to have lifted up the mind, raised the body, forsaken earthly things, sought heavenly ones, and, worn down by the injuries of captivity, ought to have bewailed their sin, because guilt was the author of the injury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Well, then, does he say: we have sung to you, and you have not danced.

For Moses sang, when in the Red Sea the waves stiffened for the passage of the Jews, the water stood round about, and the same water, flowing back, drowned the horses of the Egyptians and their riders. Isaiah sang a song for his beloved vineyard, signifying that the people, once fruitful with fertile virtues, would become harsh with crimes. The Hebrews sang, when their footprints grew moist at the touch of a dewy flame, and while all things within and without were burning, the fire nonetheless licked them alone harmlessly and did not scorch them. Habakkuk too, taught to soothe public sorrow by a song, prophesied that the Lord's Passion would be sweet to the faithful. So the prophets sang, resounding with spiritual melodies the oracles of public salvation; the prophets wept with mournful laments, seeking to soften the hard hearts of the Jews.

Scripture has taught us to sing with gravity, to sing psalms spiritually; it has taught us also to dance wisely, when the Lord says to Ezekiel: clap with your hand and stamp with your foot; for God, the censor of morals, would not demand the actor's movements of a loose body, nor would he command of men unseemly clatterings and womanish clappings, so as to bring so great a prophet down to the mockeries of the stage and the softness of women. The revealed mysteries of the resurrection do not agree with the disgraces of dancing exacted. There is indeed, there is a clapping proper to good deeds and acts, whose sound may go out into the world and the glory of things well done may resound; there is an honorable dancing, in which the mind leaps for joy and the body is lifted up by good works, when we hang our instruments upon the willows.

The prophet, then, is bidden to clap with his hand and stamp with his foot, he is bidden to sing psalms, because he already saw the wedding of the Bridegroom, in which the Church is betrothed and Christ is loved. And good is the wedding, when the soul is wedded to the Word, the flesh to the Spirit. At this wedding the prophet David wished us to make merry; to it he invited us, because he was joining his own descendants in union; and therefore, more joyful than the rest, as though set in the very act of the wedding, he exhorts us to the celebration of the festal gift, saying: rejoice to God our helper, shout for joy to the God of Jacob. Take up a psalm and bring the timbrel, the pleasant psaltery with the harp. Do you not notice a certain act of the prophet dancing? Then elsewhere: I will sing psalms to you, O God, on the harp, Holy One of Israel. My lips shall rejoice when I sing to you, and my soul, which you have redeemed. Do you hear the voices of harpers, do you hear the clatter of dancers? Believe it is a wedding.

Take up the harp, you too, so that the strings of your inward veins, struck by the plectrum of the Spirit, may give back the sound of good work. Take up the psaltery, so that the harmony of your words and deeds may sound in concord. Take up the timbrel, so that the inner spirit may set to measure the instrument of your body, and the sweet pleasantness of your conduct may be expressed by your working deeds. So the prophet sang psalms, when he said: come hither from Lebanon, bride, come hither from Lebanon.

This song the children sang, and they were not heard. What children? Those of whom he says: behold, I and the children whom you have given me. But this song was not sung in the marketplace, not in the streets, but in Jerusalem; for she is the Lord's marketplace, in which the statutes of the heavenly precepts are laid up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
