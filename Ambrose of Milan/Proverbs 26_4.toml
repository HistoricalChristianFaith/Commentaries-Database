[[commentary]]
quote='''
Your flight is a good one if you do not answer the fool according to his folly. Your flight is good if you direct your footsteps away from the countenance of fools. Indeed, one swiftly goes astray with bad guides; but if you wish your flight to be a good one, remove your ways far from their words.
'''
source_url=''
source_title="FLIGHT FROM THE WORLD 9:56"


[[commentary]]
quote='''
[David] used not to answer the enemy that provoked him, the sinner that exasperated him. As he says elsewhere, "As though he were deaf he heard not them that speak vanity and imagine deceit, and as though he were dumb he opened not his mouth to them." Again, in another place, it is said, "Answer not a fool according to his folly, lest thou also be like to him."The first duty then is to have due measure in our speech. In this way a sacrifice of praise is offered up to God. Thus a godly fear is shown when sacred Scriptures are read. Thus parents are honored. I know well that many speak because they know not how to keep silence. But it is not often that any one is silent when speaking does not profit him. A wise person, intending to speak, first carefully considers what he is to say and to whom he is to say it; also where and what time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FON%2520THE%2520DUTIES%2520OF%2520THE%2520CLERGY%2FBook%25201.html'
source_title="On the Duties of the Clergy 1.10.34-35"

[[commentary]]
quote='''
For there is also a glory of confusion, as when you fall among many Gentiles or philosophers, and they cast the cross of Christ in your face, and you cannot answer with a word, and no one listens to you as you relate the words of salvation. It is confusion, but by the voice of him who reproaches and reviles, by the face of the enemy and the persecutor. And therefore do not answer a fool according to his folly; be like a man dumb and silent, and as though not hearing the words of those who insult and revile, not because you cannot answer, but because you ought not to answer. For there is a time for everything, a time to keep silence and a time to speak. You must keep silence when you do not find a ready hearer; you must speak when the Lord grants a tongue of learning, so that your speech may work upon the affections of the hearers. But how should he listen to you who reviles you for this very reason, that he does not wish to hear your wholesome speech, or how should he acquiesce in you who is a persecutor and wishes to lay claim to you for himself, or, as Aquila or Symmachus said, to avenge and punish in you the fact that the inheritance of Christ seems to have been transferred to the Gentiles?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
