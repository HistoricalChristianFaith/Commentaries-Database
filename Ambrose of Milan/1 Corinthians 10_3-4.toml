[[commentary]]
quote='''
In that sacrament is Christ, because it is the body of Christ: it is therefore not bodily food but spiritual. Hence the Apostle too says of its type: That our fathers ate spiritual food and drank spiritual drink (1 Cor. 10:3). For the body of God is a spiritual body; the body of Christ is the body of the divine Spirit; for Christ is spirit, as we read: The Spirit before our face is Christ the Lord (Lam. 4:20). And in the epistle of Peter we have: Christ died for us (1 Pet. 2:21).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
