[[commentary]]
quote='''
Blessed, he says, be the Lord God of Israel, that is, the God of the people that sees God, which believes him to be both its Lord and its God, from age to age; so be it, so be it. In the Hebrew it has amen, amen, as those have asserted who have read the book written in Hebrew letters. The Greek in this place said γενέσθω, γενέσθω, which is "fiat, fiat" [let it be, let it be]. This word has different meanings, so that it is sometimes the word of one commanding, sometimes of one praying, sometimes of one confirming something. It is of one commanding when a superior lays down for an inferior what is to be done or followed. It is of one praying, as in that: let your will be done; for no one commands God, but pours out a prayer. It is of one confirming when a prophet or a priest or some holy man blesses and the people answer: "fiat, fiat". Here, then, it seems to me rather a confirmation of the blessing than a prayer or entreaty, especially because a repetition of the word itself has been made. And the Hebrew word seems indeed to have been changed, but the same sense expressed. For just as, when the priest blesses, the people answer "amen", confirming for themselves the blessing which the priest asks of the Lord for the people, so in the psalm the answer is "fiat, fiat", as if "amen, amen". And amen is clearly shown to be a word of confirmation in the Gospel, where the Lord, confirming his speech, says: amen I say to you. But the force is greater where the word is repeated, which we find quite often in the book of the Gospel according to John, because he spoke most of all of heavenly and deep mysteries, as it is written: amen, amen I say to you, unless one has been reborn of water and the Holy Spirit, he cannot enter into the kingdom of God, and elsewhere: amen, amen I say to you, if you ask anything of the Father in my name, he will give it to you. Two examples are enough; the rest, if anyone seeks, he will find.

"Fiat, fiat" is also a sign of a finished book. For the Psalter is seen to be divided into five books. The first book ends with this psalm, that is, the fortieth. And beautifully the fortieth psalm, reaching as far as the Passion of the Savior, was included to give the book its end, since the Lord's Passion is the end of the Forty Days, so that the second book might begin from the mysteries of renewal, a book which, as belonging to the Forty Days, embraces more perfect sacraments. For it foretells the sacraments of baptism, when it says: as the hart longs for the springs of waters, and the rest of the saints who have come to the heavenly tabernacle, and the descent of the Holy Spirit, when the spiritual grace was poured out in a kind of voice of the heavenly cataracts, because the Spirit was borne along with great power, as we read in the Acts of the Apostles, and the entrance of the renewed man to the altar, and the ascension of the Savior, and the sanctification of the virginal purpose. This book ends in Psalm 71 (72), in which the peaceful kingdom of Christ, spread over the whole world, is announced in prophetic speech, and the remission of sins; where, having first set down the blessing of the Lord, he added: and the whole earth shall be filled with his majesty. So be it, so be it. The third book, too, ends with Psalm 88 (89), and there it has: blessed be the Lord for ever. So be it, so be it. The fourth book ends with Psalm 105 (106), and there it has: blessed be the Lord God of Israel from age to age; and all the people shall say: so be it, so be it. The fifth book runs to the end, where in place of this word the prophet says: let every spirit praise the Lord.

But perhaps it may again trouble someone how I assert five books, when the Psalter is one. But the Gospel too is one, and we cannot deny that there are four books. That the Gospel is one we have also indicated elsewhere, if I am not mistaken, and, if it is asked again, we can easily show it, since the Savior said: amen I say to you, wherever the Gospel shall be preached, and the Apostle: I wonder that you are so soon being transferred to another gospel, which is not another, except that there are some who pervert you, and elsewhere: for I make known to you, brethren, the Gospel; and nowhere do you find this body of four books signified otherwise than as the Gospel. Indeed, because the psalms too are one body, Scripture said: on a ten-stringed psaltery, with a song on the lyre. But again, because there are five books, it said elsewhere: on the vessels of psalms.

Beautifully, then, there are five books and one Psalter, since the outer man is quickened by five senses, and again by five spiritual senses that hidden man of the heart, our inner man, is perfected, who alone is found rich before God, on the testimony of the apostle Peter. He who has, he says, ears to hear, let him hear. You have one sense. And just as there are those who have eyes and do not see, so there are those who, with eyes that do not see, are believed to see more. Whence the prophets too were called "seers", even those who did not see with their eyes. Good too is that odour of which the Apostle said: we are the good odour of Christ to God, whence Job too says: and the divine spirit which is in my nostrils. The same, then, is the odour of Christ and of the Holy Spirit to God, because the odour of the Trinity is one. There is also an inner food, of which the Lord said: my food is to do the will of my Father who is in heaven. There is also an inner touch, by which she touched Christ in the Gospel who for twelve years had suffered a flow of blood and had not received healing from physicians, but received it from Christ. It is the touch of faith by which Christ is touched. Indeed, men did not see it, but Jesus saw it, and testified that he had seen it, saying: someone has touched me; for I too perceived that power had gone out from me. The knowledge of Christ is the bestowal of health. Since, then, it is plain that there are ten senses in man, therefore David, who sang both outwardly and inwardly, outwardly with the body, inwardly with the heart, says in the psalm: on a ten-stringed psaltery I will sing psalms to you.

The psaltery, then, is the man perfected in Christ, in whom, just as the strings of the chords resound by the art of those who play in concert, so the tuneful works of the virtues in accord resound, so that he can say: I will sing psalms to you, O God, on the lyre, Holy One of Israel. My lips shall rejoice when I sing to you, and my soul, which you have redeemed. Paul says of himself: without were fightings, within were fears. This man rejoices both within and without, but that one was still in the contest, this one at rest, because he had known that he had merited the redemption of his soul. He who sings psalms is in gladness; he who wrestles is in anxiety. Yet Paul too knew how to sing psalms, but he was still reserving himself for further advances, until, when he had been more fully approved, he might sing psalms. And therefore he said: I will pray with the spirit, I will pray with the mind also; I will sing psalms with the spirit, I will sing psalms with the mind also.

And since he has shown a twofold office of singing psalms, Scripture has also taught that there is a twofold voice, the prophet saying: with my voice I cried to the Lord, and my voice to God, and he attended to me. What is "my"? For he could have said: "I cried to the Lord". But what voice is ours if not that which is better, which knows not how to err? For from much speaking we incur sin and cannot avoid it. That is the prophet's voice which reaches God, the voice which cried to the Lord while Moses was silent, with which Hannah too cried in her prayers, when she did not move the lips of her mouth, and obtained the son whom for a long time before she had not obtained when she cried with the voice of the body. Of this voice the Lord said: but you, when you pray, go into your chamber and, having shut the door, pray to your Father who is in secret; and your Father who sees in secret will repay you. What is "will repay"? It is that which you have entreated, that which you have prayed for. For just as sinners receive from the hand of the Lord their sins double, so on the contrary the righteous receive with effect the very things they asked. Hear how they receive them. Your prayer ascends to God and descends to you. Whence in the psalm too we read: and my prayer shall return into my bosom, that is, so that it may bring back fruit to the one who asks. Blessed be the Lord God of Israel, who has opened to us such great mysteries, from age to age, that is, from the infinite to the infinite. So be it, so be it.
'''
