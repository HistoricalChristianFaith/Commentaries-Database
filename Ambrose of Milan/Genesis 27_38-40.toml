[[commentary]]
quote='''
And yet the other too by force drew out and obtained a blessing for himself, but such a blessing as agreed and accorded with the former one, namely that he should serve his brother. For he who could not command and rule another had to serve, so that he might be ruled by one more prudent. For it was not the part of the holy patriarch to bind over his son to the degrading condition of slavery; but as a good father, having two sons, one intemperate, the other prudent and sober, in order to take thought for both, he set the sober one over the intemperate and appointed the foolish one to obey the prudent, because the foolish man cannot be a willing disciple of virtue nor persevere in study, since the fool changes like the moon; and rightly he denied him the freedom of his own choice, lest like a ship in the waves without a helmsman he should drift about, but he subjected him to his brother, according to what is written: the imprudent man indeed serves the prudent. Rightly, then, he subjected him, so that under the rule of the one governing him he might improve his own disposition. And therefore he says: you will live by your sword and you will serve your brother; for devotion is the mistress of cruelty, and gentleness surpasses harsh impulses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 3"
