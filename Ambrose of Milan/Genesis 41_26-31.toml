[[commentary]]
quote='''
Now the dream and its interpretation is as follows: Whatever, he says, God does he shows to Pharaoh. The seven good cows are seven years, and the seven good ears are seven years. Pharaoh's dream is one. And the seven lean cows that came up after them are seven years, and the seven lean ears, blighted by the wind, are seven years. There will be famine for seven years. And the word that I spoke, 'Whatever God does he shows to Pharaoh': behold, seven years of great plenty are coming in all the land of Egypt; but seven years of famine will come after these, and they will forget the plenty in all Egypt. And the famine will consume all the land, and the plenty of the land will not be recognized because of the famine that is to come after this; for it will be exceedingly severe. And as for Pharaoh's repeating the dream twice, it is because the word from God will be true and God will hasten to do it.

An old dream, recent events. The earlier things were consumed by the later, and where formerly there was an abundance of plenty, there arose a want of all things. But if anyone had given the ruler counsel of this kind, to keep something of the earlier plenty for the later period of his reign, the remaining time too would have overflowed with a generous abundance for giving. But the immoderate squandering of the earlier age left even the later destitute, and men, plundering everything, were unwilling to call in some Joseph. Although I am no Joseph — for who could claim that? — yet I kept crying out that those fat cows signified not only wantonness but also neglect of reverence for God — for of the unbelievers it was said: Fat bulls have besieged me, and of the people of the Jews it is written: He was made fat and gross and was enlarged, and he forsook God, who made him — and that therefore that dream of worldly overflow could not be perpetual: there would be a time when hard famine would follow upon these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
