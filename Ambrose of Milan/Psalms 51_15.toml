[[commentary]]
quote='''
O Lord, you will open my lips, and my mouth will proclaim your praise. For he who praises the Lord will be saved from his enemies, as it is written. And certainly he had said earlier, in Psalm 49 (50): But to the sinner God said: Why do you declare my justices? Since, then, he had said with his own mouth that God forbade the sinner to declare his justices, surely by himself declaring the justice of God he made it plain that this offense had in no way been imputed to him as sin.

And he added: You will open my lips, and my mouth will proclaim your praise. God closes the mouth of the sinner, so that he may not speak the justices of God; he opens the mouth of the just, so that he may speak. Whose lips, then, he opens, him he absolves from the guilt of sin. And the Lord opens the lips of him who receives the word in the opening of his mouth. Hence the apostle too asks to be helped by the prayers of the people, that a door of the word may be opened to him for speaking the mystery of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 17"
