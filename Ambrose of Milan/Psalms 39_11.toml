[[commentary]]
quote='''
And he added: With rebukes over iniquity you have instructed man, and you have made his soul waste away like a spider. The Greek said ὑπὲρ ἀνομίας, that is, "for iniquity", and put the whole verse κατὰ κοινὸν, which is: "with rebukes for iniquity you have instructed man". Therefore the Wise Man said: Who will give me scourges for my thoughts and a seal for my lips?, that he might scourge his heart with his own thoughts and seal his lips, so as both to diminish old sins and not to renew others by speaking, so that, instructed by his own rebukes, he might put on the exercises of virtue. The soul wastes away when sin is diminished, or, when the soul wastes away, guilt is laid down; it grows fat when sins are heaped up. Hence the Lord says of sinners: My spirit shall not remain in them for ever, because they are flesh, and elsewhere Scripture says: The heart of this people has grown fat. Therefore Jeremiah too saw first a rod of walnut, then a boiling pot, so that the soul of the prophet at his beginning might waste away, that guilt might depart and grace come. But why first the rod, afterwards the pot? Because he who is not corrected by the rod is put into the pot, to burn and waste away. And therefore it is said to the prophet Ezekiel too: Take for yourself a frying pan, and you shall take the iniquities of the house of Israel and shall bring them to an end; and they shall waste away, he says, in their iniquities, and elsewhere in the same book the Lord says: But I will make a great firebrand and will multiply the wood and kindle the fire, that the flesh may melt and the broth be diminished. By these testimonies it is signified that the souls of the unbelieving waste away when fire is applied, so that they lay aside a certain moisture of carnal fatness. The souls of sinners, then, are also put into the frying pan, so that a certain flesh of sin may flow away, which had overgrown the vigour of the soul and mind and, as with a kind of broth, had thus steeped the soul in certain allurements of desires. Certain frying pans, then, await us. Therefore let us here grind down our heart, so that it may become fine and lay aside all hardness and a certain fatness of carnal lard. This those will suffer who have lived in luxury in this life and believed, after the Jewish manner, that they should practise the mockeries of disgrace rather than any works of virtue. For Jacob grew fat and became thick and rose up to play, and that play led him away from the truth of faith into the error of unbelief. Rightly, then, did Paul chastise his body, so as not to nourish the flesh of sin; for by living in luxury we make our members members of sin, but by sobriety members of righteousness. It is not nature, then, but guilt that does wrong.

Nor again let us follow vain and empty things, lest we be judged to weave a spider's web, since sins can have no substance of perpetuity. Hence, when you see some eager to enlarge their resources, to heap up powers, to strive after splendour, you will say that word of Isaiah: These men weave a spider's web in all things of one day, which cannot be lasting, but is quickly torn apart, and all its work is undone; for it is not set upon any solid foundation, but is hung in the void. Nothing slack, nothing soft befits the true soldier of Christ; behold, indeed, those who are clothed in soft garments are in the houses of kings. All the avaricious seem to themselves clever and industrious. What is cleverer, what more diligent than the spider, which always attends to its work day and night and makes a garment at no cost and no expense? But all that it has made is vain. So is every man who does not set his work on the foundation of Christ; vainly, night and day, he too is troubled, since often, like the spider, the ruin of his own work entangles him even in the very effort of his wickedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
