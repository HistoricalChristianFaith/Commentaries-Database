[[commentary]]
quote='''
In short, as soon as the Egyptians saw her, marvelling that she was very beautiful, they brought her in to their king, and treated Abraham well, honouring him as the brother of the woman who had pleased the king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 2"
