[[commentary]]
quote='''
Wait, then, for the Lord, whether as helper or as rewarder, and keep his ways. This is "to wait": to keep the commandments of him for whom you think you must wait. Even if you are crushed, even if you are afflicted, even if you fail through sickness, yet wait for the Lord; hope will not confound you.

The Lord will come and will exalt you, so that you may possess the land by inheritance. It is clear that the land is a higher one, not this earthly one in the valley, but that one of the eternal promise, in which whoever is set is exalted by the Lord.

But you shall see, when sinners perish. For then the reward of the righteous will come, when judgement has been passed on the merits of the ungodly. But sinners do not perish in one way only. They perish for you beforehand, if you do not admire their power, if you do not admire their riches, if it does not move you when you learn that they abound in honours, children, friends. For these things belong to the world, and the world lies under worldly malignity, and the prince of the world favours those who serve him, according to that saying: All things I will give you, if you will fall down and worship me. Why do you seek that these things be given to you, when the ungodly one himself who gives them cannot remain in them long? He himself also passes away: how can the things which he has bestowed not pass away? Do you only keep a steadfast mind, hold to righteousness, let no one move you, and you will see that the ungodly man is nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
