[[commentary]]
quote='''
An ancient story tells of the two neighbors, King Ahab and a poor man, Naboth. Which of these do we consider the poorer, which the richer: the one who had been endowed with a king's measure of wealth, insatiable and unsatisfied with his wealth, who longed for the little vineyard of the poor man; or the other, heartily despising a "king's fortune of much gold" and imperial wealth, who was satisfied with his vineyard? Does he not seem richer and more a king, since he had enough for himself and regulated his desires so that he wanted nothing that belonged to others? But was he not very poor whose gold was of no account, while he considered the other's vines of priceless value? Understand why he was so very poor: because riches amassed unjustly are disgorged, but the root of the righteous remains and flourishes like a palm tree.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252031-40.html'
source_title="Letter 38 (To Simplician), Section 8"

[[commentary]]
quote='''
The story of Naboth is old in time but daily in practice. For who of the rich does not daily covet the goods of others? Who of the wealthy does not strive to drive off the poor man from his little acre and turn out the needy from the boundaries of his ancestral fields? Who is content with his own? What rich man's heart is not set on fire by a neighbor's possession? Not, therefore, was one Achab born, but, what is worse, daily is Achab born and never dies in this world. If one perishes, many others spring up; there are more to steal than there are to suffer loss. Not one poor man, Naboth, was killed: daily is Naboth struck down, daily is a poor man put to death. Alarmed by this fear, the human race is now departing from its lands; the poor man, carrying his latest born, wanders forth with his little ones; his wife follows in tears, as if accompanying her husband to his tomb. Less, however, does she grieve who weeps over the bodies of her dead: for, although she has lost a husband's protection, she has his tomb; although she has not her sons yet she does not mourn for exiles, she does not groan at the hunger of her tender brood, which is worse than death.

How far, O ye rich, do you push your mad desires? Shall ye alone dwell upon the earth? Why do you cast out your consort in nature and claim for yourselves the possession of nature? The earth was made in common for all, both rich and poor. Why do you arrogate to yourselves, ye rich, exclusive right to the soil? Nature, which begets all poor, does not know the rich. For we are neither born with raiment nor are we begotten with gold and silver. Naked it brings men into the light, wanting food, clothing and drink; naked the earth receives whom it has brought forth; it knows not how to include the boundaries of possessions in the tomb. A narrow sod is ample enough for rich and poor alike, and the earth, which did not contain the desire of the rich man living, now contains him entire. Nature, therefore, knows not how to discriminate when we are born, it knows not how, when we die. It creates all alike, all alike it encloses in the bosom of the tomb. Who can distinguish the forms of the dead? Uncover the earth and, if you can, pick out the rich man. Clear away presently the rubbish from the tomb, and if you recognize the poor man, prove it; unless perchance by this alone: that with the rich more things perish.

Silken garments and robes interwoven with gold, in which the rich man's body is enveloped, are losses to the living, not helps to the dead. You receive perfume, O rich man, and you are fetid; you destroy the beauty that belongs to something else and do not secure it for yourself. You leave heirs who sue one another at law. To your heirs you leave rather an hereditary trust than a voluntary advantage, because they fear to diminish and violate what is bequeathed. If the heirs are frugal they guard it; if extravagant, they drain it; and so you condemn good heirs to everlasting solicitude or you leave behind evil ones, [to condemn your doings].

But why do you think that while you are living you abound in all things? O rich man, you know not how poor you are, how needy you seem to yourself who say you are rich! The more you have, the more you demand; and whatever you acquire, yet you are still in need. Avarice is enkindled by gain, not quenched. Covetousness has, as it were, certain steps. The more of these one ascends, the more he hastens to heights from which there is a heavy crash when he must needs fall. More to be endured was he, however, when he had less. In keeping with his wealth his needs were moderate, but with the accession of his patrimony there came an increase of cupidity. He does not want to be ignoble in his wishes; poor, in his desires. He so joins together two intolerable things that he increases the ambitious hope of the rich man and does not put aside the passionate longing of indigence. Therefore Divine Scripture teaches us how miserably he is in want, how abjectly he begs.

Achab was king in Israel and Naboth was a poor man. The former was wealthy in the opulence of his kingdom, the latter possessed a few clods. The poor man coveted none of the rich man's possessions, but the king seemed to himself to be in want because the poor man, his neighbor, had a vineyard. Which then seems poor to you: he who is content with his own or he who covets another's? One surely seems poor because of his fortune; the other, poor because of his desire. A rich disposition does not know how to want, an abundant wealth cannot fill the breast of the miser. The rich man, then, is covetous in his envy of another's possession and there is a complaint of poverty.

But now let us consider the words of Scripture. And it came to pass, it says, after these words. Naboth, the Jezrahelite, had a vineyard [in Jezrahel] near the palace of Achab, king of Samaria. And Achab spoke to Naboth, saying: Give me thy vineyard, and it will be to me for a garden of herbs, because it is nigh to my house, and I will give thee for it another vineyard. But if it shall please thee, I will give thee money for this vineyard, and it will be to me for a garden of herbs. And Naboth said to Achab: May God forbid that I give thee the inheritance of my fathers. And his spirit was troubled, and he slept in his bed, and he veiled his face, and would eat no bread.

The Divine Scripture had related that Eliseus, although he was poor, left his oxen, and ran to Elias, and killed them, and gave to the people, and clave to the prophet. For a condemnation, therefore, of the rich man who is described in that king, have these words been said beforehand, because, while having the benefits of God like that Achab, to whom the Lord gave a kingdom and granted rain at the prayer of the prophet Elias, he has violated the divine commandments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapters 1-2"
