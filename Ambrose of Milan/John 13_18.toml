[[commentary]]
quote='''
The Lord set out for us both points that might move us, saying in the Gospel: he who eats bread with me has lifted up his heel over me. Let us consider whence this expression has been taken: we were, he says, unbelieving, erring, serving desires and pleasures. Let us confess our error, that we may be washed clean. I too, as a boy, saw an athlete who, when he had thrown his adversary, struck him on the forehead with his heel, which was a sign that he was insulting the vanquished. This is what he says: has magnified the supplanting over me, by which word he declared the boastfulness of one who insults. Judas too, then, lifted his heel over Christ when he betrayed him, but he did not lift it with impunity. Adam still lifts the heel which was wounded by the serpent. And surely Christ had washed his feet, he had heard him saying: he who is washed needs only to wash his feet, but is clean all over. But what grace had washed, unbelief had defiled. Judas, then, lifted his heel to the wound. Truly he did not hold the head who lifted his heel over Christ. Adam lifted it over himself, this man over Christ, and therefore the serpent wounded him more grievously than the rest. He lifted his heel who offered the deceitful kiss, by which to supplant his author, and therefore it is written in the prophet: he has enlarged the supplanting over me. Esau too says of his brother: he has now supplanted me twice. He who supplants practises a deceit by which he throws down or wounds his adversary. Therefore Judas too is said to have supplanted, because by his kiss he inflicted a wound, by which he showed the persecutors the sign for seizing the Savior. He supplanted, then, like a serpent, which pours poison from its mouth and wounds the heel with its tooth; for this man too wounded not the divinity of Christ, but the heel, the extremity of the body. Judas also lifted his heel like an insolent and proud wrestler, with which to strike the head of the Savior. But he could not strike the head of Christ, because the head of Christ is God. His own head, indeed, he bound with the knot of a hideous noose, so as to take away from himself the remedy of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
