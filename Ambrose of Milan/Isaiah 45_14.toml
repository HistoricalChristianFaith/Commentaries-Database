[[commentary]]
quote='''
Indeed avarice burdened Egypt, money troubled the merchandise of the Ethiopians, as it is written: Egypt has laboured, and the merchandise of the Ethiopians, and the Sabeans, lofty men, will pass over to you. Egypt laboured before it knew the truth, but it labours no longer, now that it has passed over to Christ. The Sabean men, who before fled, follow willingly, because the bonds of charity hold them, which are stronger than adamant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
