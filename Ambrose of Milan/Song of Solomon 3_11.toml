[[commentary]]
quote='''
When the bride, then, has been led to the bridegroom's place of rest, they sing a nuptial song, telling of love from the daughters of Jerusalem: Go forth and see in King Solomon, in the crown with which his mother crowned him on the day of his espousals. They sing an epithalamium and call the other powers of the heavens, or souls, that they may see the love which Christ has toward the daughters of Jerusalem. Hence he also merited to be crowned by his mother as the son of love, as Paul shows when he says that God has rescued us from the power of darkness and transferred us into the kingdom of the Son of his love. So the Son of love is himself also love, having love not as an accident but always having it in his substance, like the kingdom, of which he says: In this I was born. And so they say: Go forth, that is, go out from the cares and thoughts of the world, go out from bodily straits, go out from the vanities of the world, and see what love the peaceful King has on the day of his espousals, how glorious he is, because he gave resurrection to bodies and joined souls to himself. This is the crown of a great contest, this the splendid gift of Christ's espousals: his blood and passion. For what more could he give who did not spare even himself, but offered his death for us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
Go out and see in King Solomon the crown with which his mother crowned him on the day of his espousals. They sing the epithalamium, and call the other powers of the heavens, or the souls, to see the love which Christ has toward the daughters of Jerusalem. Whence he also deserved to be crowned by his mother as the son of love, as Paul shows, saying: For God has rescued us from the power of darkness, and transferred us into the kingdom of the son of his love (Col. 1:13). The son of love, then, is himself also love: not having love from accidents, but having it by his own substance, like the kingdom of which he says: For this I was born (John 18:37).

And therefore he says, Go out, that is, go forth from the anxieties and thoughts of the world: go forth from the straits of the body: go forth from the vanities of the world, and see how great a love the peaceful king has on the day of his espousals: how glorious he is, because he gave resurrection to bodies and joined souls to himself. This is the crown of a great contest, this the splendid gift of Christ's espousals, his blood and his passion. For who could give more than he who did not spare even himself, and laid down his life unto death for us?

And what is the crown of glory, if not the Church, which crowns her head, Christ? What is the joy of the whole earth, if not the house of the Christian people, the hall of the saints, of whom it is written: Their sound has gone out into all the earth (Ps. 18 (19):5)? Therefore, because the Church is the crown of glory, it is said: Go out, daughters of Zion, and see King Solomon, in the crown with which his mother crowned him on the day of his espousals, and on the day of the joy of his heart.

It is said to the souls that they should go out from the hovels and enclosures of the body, go out beyond the thoughts of the body, go forth from desires, and from cares, and from the other passions of this flesh and of slippery affection: that they should ascend above the world, go out of this world, run to meet Christ, be present and ready, shining with burning torches. The angels of Christ, as it were, speak these words: You cannot see his brightness, his glory, unless you go forth from the cares of human frailty, daughters of Jerusalem. As if they were saying: Why do you seek the living among the dead (Luke 24:5)? Christ is not sought within this world, he who willed that his disciples should be above the world.

What is the crown with which Christ is crowned, if not the crown of glory? Joseph had the crown of chastity, Paul of justice, Peter of faith. There are crowns of the single virtues. Christ alone has the crown of glory, with which the Church crowned him. In this crown are all crowns; for glory is not the portion of one crown, but the reward of all crowns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
