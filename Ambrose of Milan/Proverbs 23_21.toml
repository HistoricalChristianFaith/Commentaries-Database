[[commentary]]
quote='''
Thorns, he says, grow in the hands of a drunkard, since he wounds himself with his own hands; he himself casts ulcers into his own heart. With these thorns he tears the garment of faith which he has received, and he will not be able to guard his own treasure: for every drunkard and fornicator will want and will put on himself the torn garment of folly. And so men in power are forbidden to drink wine, lest when they drink they forget wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 9"
