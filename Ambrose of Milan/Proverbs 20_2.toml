[[commentary]]
quote='''
Slippery in all men and prone to sinning is nature; slippery also, even amid good morals, is the licence of power and the offer of opportunity. For the anger of a king does not differ from the anger of a lion; but he who provokes him and meddles with him sins against his own soul. Let one beware, then, that no one provoke power, lest the soul, entangled in bodily snares, be unable to strip itself of vice. It is no wonder, then, if David too fell through the show of power, but it is much more to be admired that he was called back by the contemplation of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
