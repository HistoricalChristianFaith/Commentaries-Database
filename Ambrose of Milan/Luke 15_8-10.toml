[[commentary]]
quote='''
It is not idle either that that woman rejoices at the drachma found. This is no ordinary drachma, on which is the figure of the prince. And therefore the image of the king is the wealth of the Church. We are sheep: let us pray that he deign to set us beside the water of refreshment; we are sheep, I say: let us seek pasture; we are drachmas: let us have value; we are sons: let us hasten to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
