[[commentary]]
quote='''
Therefore beware lest you bind yourself for another's debt, lest you be said to have sold this also, lest if your debtor gives you any gratitude, as is the custom of friendship, it may seem that you have bought it. Or if you wish to intervene, are moved on being besought by the entreaties of your friend, and blush to refuse, intervene in such a way that if he is not equal to paying the debt, you will know that it must be paid from your own funds. Prepared for this, proceed. For you have read: Thou shouldest not promise beyond thy strength, but if thou hast promised regard thyself as restoring. And below: Receive thy neighbor according to thy strength and watch that thou mayest not fall. That is, you should not bind yourself for a greater amount of security than the strength of your resources is able to bear and pay. For if you surrender what you have, you have lost your wealth, but you have not lost your honor. You do not experience the loss of your reputation, you have redeemed your friend without your own dishonor. In another place also the Proverbs of Solomon warn you of this, saying: In acting as surety be surety for your friends, just as one who binds himself as sponsor for his friends. If however you do not have, listen to what Solomon says: Do not offer thyself as surety blushing at the role, for if thou have not wherewith to restore he will take thy covering from beneath thy body. Therefore a good usurer gets gratitude, a wicked one imprecation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 23"
