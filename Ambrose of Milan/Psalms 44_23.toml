[[commentary]]
quote='''
Meanwhile, however, even in good works the human mind is troubled and shaken by temptations. Yet this too belongs to the righteous: that, when they see themselves tempted, they ask for help, as the apostles in the Gospel, when Christ was sleeping in the boat, dreading the storm of the waves, woke the Lord Jesus, so that he might drive the dread away from them. Do not the holy apostles seem to you to have spoken these verses: Arise; why do you sleep, O Lord? Arise, and do not cast off unto the end? Certainly, even if the letter seems to differ, the sense agrees. Nor, indeed, even when set in the body, did our Lord Jesus Christ so sleep as to be unaware of the storm of the sea, or that the rising tempest of winds escaped his knowledge through the depth of his sleep. He slept in body, but he kept watch in power. And this was the arrangement: that the Son of God, the Word of God, should go up into the boat, and that his disciples should go up with him; and he, not suffering them to be slack and negligent, as though secure in the Lord's presence and favour, composed himself in bodily sleep. By that appearance of sleep, then, the Word of God showed the apostles that he was asleep to this world. Yet his power and providence kept watch, which raised the storm on the sea, so that the boat was almost covered by the rising waves, that it might be known whether the disciples, troubled by the storm, would support themselves by the provision of saving counsel, or would rather pass beyond the remedy. But in those for whom Jesus was not asleep, faith was awake, and therefore, rising, they woke the Lord Jesus, saying: Lord, save us, we are perishing.

See whether what we read of Jonah also differs from the Gospel: he slept in the belly of the ship and snored, and in him a figure of the sacred Passion went before. For as Jonah slept in the ship and snored securely, as if not fearing to be caught, so our Lord Jesus Christ, who fulfilled that figure by the sacrament of his death, slept in the boat in the time of the Gospel; and as Jonah was three days and three nights in the belly of the whale, so the Son of Man was three days and three nights in the heart of the earth in the passion of his body. When he had roused himself from death and released the sleep of his body, so as to rise again for the salvation of all, he visited his disciples. This, then, is the true Jonah, who offered his soul as a redemption for us. For this reason, then, he was taken up and sent into the sea, to be received and devoured by the whale, so that, set within the whale's belly, he might empty its innards. Of what whale this was said, hear Job saying: He who has, he says, to render the great whale captive. Who this is you surely recognize when you read that our Lord Jesus Christ led captivity captive; for when the adversary and enemy was vanquished, we who were captives began to possess freedom through Christ.

Indeed the very prayer of holy Jonah teaches that these are the mysteries of the Lord's Passion: And he said: I cried, he says, to the Lord my God in my tribulation, and he heard me from the belly of the underworld. You see that he said the belly of the underworld, not of the whale. And the Lord went down not into a whale but into the underworld, so that those too who were in the underworld might be loosed from everlasting bonds. Indeed very many even rose again. But what rivers surrounded Jonah, or of what abyss did Jonah say: The uttermost abyss surrounded me, it plunged my head into the clefts of the mountains, I went down into the earth whose bars are everlasting restraints? Surely this does not fit and suit the person of Jonah. But the Son of God went down into the clefts of the mountains when he went down into the tomb. For Joseph, as the Gospel teaches, laid him in his new tomb, which he had hewn in the rock, and rolled a great stone to the door of the tomb. Indeed in another book too: He laid, it says, him in a tomb hewn out, in which no one had yet been laid.

And who is it that sacrificed with the voice of praise and of confession of the Lord, unless the prince of all priests, who both vowed vows for all and paid them? For he alone had power over his own fulfilment. As, then, Jonah was sent into the sea and the sea ceased from its commotion, so our Lord Jesus Christ came into this world, so as to gain the world and by his blood to make peace for all things, whether earthly or heavenly. By his coming, then, he redeemed all men and called them forth to the worship of God by his works; when he raised the dead and healed the sick, he poured the fear of God into human affections. He it is who sacrificed to the Lord a saving sacrifice for us and offered to God victims worthy of our conversion; he it is who slept and awoke.

We must beware, then, lest he fall asleep to sinners; for he seems to fall asleep to those for whom he has not risen again and whom he has cast off unto the end. And who is it that is cast off, unless he who sojourns away from the Lord, because he does not sojourn away from the body? For how can those who are in the flesh please God? And therefore let us not be in the flesh, but in spirit cleave to the Lord Jesus, who in Psalm 88 (89) says that he was cast off for us: But you have cast off for nothing, you have put off your anointed; you have overturned the covenant of your servant. And so, cast off for us, he became a reproach to his neighbours; for he took up the reproach of the cross, so as to clothe us with the glory of his resurrection. He seems cast off as one dead, and drenched with confusion as one crucified; but blessed for ever is he who took away the curse and procured the grace of blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
