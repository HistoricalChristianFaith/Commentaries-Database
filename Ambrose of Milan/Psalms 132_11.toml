[[commentary]]
quote='''
Again, since Scripture has: Of the fruit of your womb I will set upon your throne, the same Son of God surely must be believed to have taken up flesh from Mary, in whom is the fruit of the prophetic womb, so that you may truly recognize the succession of origin and not doubt that he, the Son of God, made afterwards the son of man, namely through the taking up of flesh, sits on the heavenly throne. For Christ did not have any royal throne in this world, so that you should think that another throne was promised to the seed of David, especially since the Lord himself said: My kingdom is not of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 5"
