[[commentary]]
quote='''
The Scriptural passage under discussion is self-explanatory. We realize that we ought not to make any addition to a command even by way of instruction. Any addition or qualification of a command is in the nature of a falsification. The simple, original form of a command should be preserved or the facts should be duly set before us. It frequently happens that a witness adds something of himself to a relation of facts. In this way, by the injection of an untruth, confidence in his testimony is wholly shattered. No addition therefore—not even a good one—is called for. What is, therefore, at first sight objectionable in the addition made by the woman: Neither shall you touch anything of it? God did not say this, but, rather: you must not eat. Still, we have here something which leads to error. There are two possibilities to the addition she made: Either it is superfluous or because of this personal contribution she has made God's command only partly intelligible. John in his writings has made this clear: If anyone shall add to them, God will add unto him the plagues that are written in this book. And if anyone shall take away from these words of the book of this prophecy, God will take away his portion from the tree of life. If this is true in this case, how much truer is it that nothing should be taken away from the commands laid down by God!
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 12"

[[commentary]]
quote='''
So I have said that the apostles composed the creed. If, then, the merchants of these wares and those who contribute money have this law, that if anyone violates his symbola, he is to be held dishonest and infamous, much more must we beware lest anything be taken away from the creed of our forebears; since you have in the book of the Apocalypse of John, which little book is canonical and serves above all for the foundation of the faith (for there he evidently made mention of our almighty Lord Jesus Christ, though in other places too, yet then in that little book itself): If anyone, he says, adds or takes away, he takes judgment and punishment upon himself. If nothing is to be taken away from the writings of a single apostle, how shall we defile the creed which we have received as handed down and composed by the apostles? We ought to take away nothing, to add nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExplanation%2520of%2520the%2520Creed.html'
source_title="Explanation of the Creed"
