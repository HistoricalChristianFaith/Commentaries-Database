[[commentary]]
quote='''
For Peter being well versed in the law, and full of ardent affection, knowing that it was counted righteousness in Phineas that he had killed the sacrilegious persons, struck the High Priest's servant.

The Lord in wiping away the bloody wounds, conveyed thereby a divine mystery, namely, that the servant of the prince of this world, not by the condition of His nature but by guilt, should receive a wound on the ear, for that he had not heard the words of wisdom. Or, by Peter so willingly striking the ear, he taught that he ought not to have a ear outwardly, who had not one in a mystery. But why did Peter do this? Because he especially obtained the power of binding and loosing; therefore by his spiritual sword he takes away the interior ear of him who understandeth not. But the Lord Himself restores the hearing, showing that even they, if they would turn, might be saved, who inflicted the wounds in our Lord's Passion; for that all sin may be washed away in the mysteries of faith.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Nor was the zeal of the disciples lacking. Indeed Peter, learned in the Law, ready in affection, who knew that it had been reckoned to Phinehas for righteousness that he had slain the sacrilegious, struck the servant of the prince. But the Lord turned aside the bloody wounds and set divine mysteries in their place, so that the servant of the prince of the world — that is, a slave of the worldly powers, not by the condition of nature but by guilt — received the wound of his ear, because he had not heard the words of wisdom. Everyone, next, who commits sin is the slave of sin. By your sins he says you have been sold. The sale was because of our sins, but the redemption of sinners because of the goodness of God. Or, if Peter struck the ear deliberately, he taught that they ought not to have an ear in appearance which they did not have in mystery. But the good Lord restores hearing to him too, showing, according to the prophetic words, that even those who were wounded in the Passion of the Lord can be healed if they turn, because every sin is washed away by the mysteries of faith.

So Peter takes off the ear. Why Peter? Because he it is who received the keys of the kingdom of heaven; for he condemns who also absolves, since he has obtained the same power of binding and of loosing. He takes off the ear of the one who hears ill; he takes off with the spiritual sword the inner ear of the one who understands ill.

Let us beware lest anyone's ear be taken off. The Passion of the Lord is read: if we refer the weakness of the bodily Passion to his divinity, the ear is cut off, and cut off by Peter, who did not allow Christ to be reckoned a prophet, but taught that he is to be marked out by a faithful confession as the Son of God. So when we read that Jesus is held, let us beware lest we hear it from anyone and think that he is held according to his divinity, held against his will, held as one weak. He is held indeed and, as John said, bound according to the truth of the body; but woe to those who bind the Word! For they bind him who think Christ only a man; they bind him who do not think him foreknowing, who do not confess him almighty. Evil are the bonds of the Jews, with which they bind not Christ but themselves. He is bound, moreover, not in the house of some devout and righteous man, but in the house of Caiaphas, that is, in an impious house, where it is even prophesied that he will die for all. How mad, then, are they who confess the benefits and persecute the author of the benefits!

They lose the ear, therefore, because they have lost the profit of hearing. Many who think they have it do not have it. In the Church all have it; outside the Church they do not have it. Or perhaps he took away the ear lest, hearing, they should sin the more, since they could not keep what they heard. So too once the Lord confounded the tongues of those building the tower, lest they should hear one another and increase the work of their impiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
