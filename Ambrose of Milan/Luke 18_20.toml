[[commentary]]
quote='''
Honour is concerned not only with paying respect, but also with giving bountifully. For it is honouring to reward deserts. Feed thy father, feed thy mother, and when thou hast fed them thou hast not requited all the pangs and agony thy mother underwent for thee. To the one thou owest all thou hast, to the other all thou art. What a condemnation, should the Church feed those whom thou art able to feed! But it may be said, What I was going to bestow upon my parents, I prefer to give to the Church. God seeks not a gift which will starve thy parents, but the Scripture says as well that parents are to be fed, as that they are to be left for God's sake, should they check the love of a devout mind.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Honor father and mother. Beautifully for me is the beginning of the law read today, when it is the birthday of my priesthood; for each year the priesthood seems to begin as if anew, when it is renewed with the turning age of the times. It is good, too, that it is read: Honor father and mother; for you are parents to me, you who conferred the priesthood on me; you, I say, are children or parents: children one by one, parents all together. For gladly would I call you my children or my parents, you who hear the word of God and do it: children, because it is written: Come, children, hear me; parents, because the Lord himself said: Who is my mother or my brothers? My mother and my brothers are those who hear the word of God and do it.

Well, then, did the law, which had first said: You shall love the Lord your God, and you shall love your neighbor, add: Honor your father and mother. For this is the first step of dutiful love; for God willed these to be your authors. Honor them with services, so that you refrain from insults, because the dutiful love owed to parents must not be wounded even by a look. But it is little not to injure them, for the law has provided that they suffer no wrong — for he who, indeed, curses father or mother shall die the death — but you, honor them, so that you may be good. The benefit of the law is one thing, the duty of dutiful love another. Honor your own, because the Son of God honored his; for you have read: And he was subject to them. If God was subject to his little servants, how much more you to your parents? Christ, then, honored Joseph and Mary, not by the debt of nature but by the duty of dutiful love; he honored also God the Father as no one else could honor him, so as to be obedient unto death: honor, then, your parents, you too.

Now honor consists not only in respect but also in generosity. Honor widows who are truly widows; for it is honor to bestow according to merits. Feed your father, feed your mother. And if you have fed your mother, you have not yet repaid the pains, you have not repaid the torments which she suffered for you; you have not repaid the services with which she carried you, you have not repaid the nourishment which she gave with the tender affection of dutiful love, milking her breasts into your lips; you have not repaid the hunger which she endured for you, lest she should eat anything harmful to you, lest she should drink anything that would harm the milk. For you she fasted, for you she ate; for you she did not take the food she wanted, for you she took the food she did not want; for you she kept vigil, for you she wept: and will you let her be in want? O son, how great a judgment you take upon yourself if you do not feed your parent! You owe what you have to her to whom you owe what you are. How great a judgment, if the Church feeds those whom you will not feed! If any believing man he says or any believing woman has widows, let him provide for them, so that the Church be not burdened, so that it may suffice for those who are truly widows. This is said of strangers: what of parents?

Not idly have we spoken of this just now, for a mother's complaint has touched us; but we preferred to admonish publicly one who is such rather than to restrain him privately. And if he is not betrayed by our voice, let him at least blush at his own feeling. Do not let it come about, son, that the hunger of others feeds your parents; do not let it come about, son, that the fastings of the poor seek food for your parents. If not for grace and salvation, then for shame's sake feed them, son, you at least. Is it not a shame if, as you enter the church, your aged mother stretches out her hands to strangers and, passing over her daughter, begs alms of others, while you pass by with lofty neck and with winks of the eyes, trailing your robe, wearing earrings and bracelets and rings and the rest of which Isaiah speaks? What if she turns her speech against you, demanding back the debt of nature, the price of her nursing, the service your hand owes to the mother who bore you? What will you answer? Will you give to others?

What if they throw it at you: Go, first feed your mother? For even if they are poor, yet they do not seek an impious contribution. Did you not hear above that that rich man reclining in fine linen and purple, from whose table Lazarus gathered crumbs, is tormented with eternal punishments because he did not share his food with a poor man? If not to give to strangers is grave, how much graver to shut out one's parents! But you say that you prefer to give to the Church what you would have given to your parents. God does not seek a gift from the hunger of parents. Hence, when the Jews reproached the disciples of the Lord because they did not wash their hands, the Lord answered: Whoever says: 'Whatever gift is from me will profit you', has not honored his father or mother.

Therefore we have not imprudently turned aside to the obscurity of this sense. For the Jews, while they follow the tradition of men, neglect that of God. The disciples, preferring the tradition of God, neglected that of men, so as not to wash their hands when they ate bread, since he who has been washed all over has no need to wash his hands. Jesus had washed them; they did not seek another washing; for by one baptism Christ did away with all baptisms. So he whom the Church has washed has no need to wash again. The disciples, then, were attentive to the mystery, seeking the cleanness not of their body but of their soul. This the Jews reproached, but they are shrewdly refuted by the Lord, because they observe empty things and despise those that would profit. And therefore he says to them: Why do you say to father or mother, whom the law commands to be honored: Whatever gift is from me will profit you? That is: when a needy father or mother asks the son for something for their expenses, the Jew, because, fearing the law, he seeks an excuse for not giving, is wont to say: A gift, whatever you would gain from me, so that the devout father shrinks from accepting money dedicated to God. But this is the tradition of men who weave excuses for their own avarice; the tradition of God, however, is that you feed your parents first. For if, according to the divine oracle, an insult to a parent is atoned for by death, how much more hunger, which is graver than death!

In this place the Lord curbs insolent boasting. For many, so as to be praised by men, bestow on the Church what they take away from their own, when mercy ought to proceed from the domestic duty of dutiful love. Give, then, first to your parent, give also to the poor, give to that presbyter the earthly things in which you abound, so that you may receive from him the spiritual things which you lack; for he who honors will be honored. See, then, that he, when he receives, gives, and receives not as one in need but as one who will repay with a greater measure. Give to the poor man for his rest, so that you too, sharing your own with the needy, may obtain rest. But as scripture says that parents are to be fed, so too it says that parents are to be left for God's sake, if they hinder the affection of a devoted mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
