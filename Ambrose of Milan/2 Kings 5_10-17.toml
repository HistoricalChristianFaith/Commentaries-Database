[[commentary]]
quote='''
Why is he ordered to plunge himself a mystical number of times? Why is the river Jordan chosen? Are not good he says Abana and Pharpar, rivers of Damascus, rather than the Jordan? But in anger he preferred these; on reflection he chose the Jordan; for anger does not know the mystery, faith knows it. Learn the grace of saving baptism: he who had plunged as a leper emerged a believer. Learn that spiritual sacraments are signified: a remedy for the body is sought, a remedy for the mind is gained. The flesh is washed, the disposition is washed. For I see that the leprosy of the body was cleansed no more than that of the mind, when after baptism, the filth of the old error wiped away, he declares that he will not offer to strange gods the victims which he pledges to the Lord.

Learn also the precepts of a fitting virtue: he proved his faith who refused rewards. Learn from the twofold teaching of words and of deeds what you should follow. You have the Lord's precept, the prophet's example: freely to receive, freely to give, and not to sell the ministry but to offer it; for the grace of God is not assessed at a price, nor is gain sought in the sacraments, but the service of the priest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
