[[commentary]]
quote='''
But let us hear him speaking once more. Those friends who had come to console him were pressing upon him and, like enemies, were urging him hard with bitter words. For there is one kind of solace for those placed in tribulation and bitterness: to be free of guilt, so that they may not seem to bear the adversities they suffer as the price of an offence. This too they were eager to take from the holy man, so that he himself should seem the author of his own tribulation, as one who had incurred the Lord's displeasure by grievous sins and was enduring these things for his ungodly deeds. They described the punishments of the ungodly, who sow vices and reap pains for themselves: that they perish by the command of God and are destroyed by the spirit of his anger, of him who breathes upon those who inhabit houses of clay and they wither, who brings to nothing the thoughts of the crafty, who stops the mouth of the unjust man. These things they asserted, true indeed of the Lord's power, but not befitting the merits of so great a man. To them, therefore, he answered: In truth I know that it is so.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 4"
