[[commentary]]
quote='''
And therefore of him who reads Deuteronomy, he shall read, it says, it all the days of his life, surely not by nights, but by days, because the day shines for one who reads the mysteries of truth and the oracles of divine loving-kindness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
