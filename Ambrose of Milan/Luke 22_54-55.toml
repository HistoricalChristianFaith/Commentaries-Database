[[commentary]]
quote='''
But Peter followed afar off. And rightly did he follow afar off, being already near to denying; for he could not have denied, had he clung close to Christ. But perhaps in this too he ought to be revered by us with the greatest wonder, that he did not leave the Lord, even when he was afraid. Fear belongs to nature, concern to dutiful love. That he fears is foreign to him; that he does not flee is his own. That he follows belongs to devotion; that he denies, to being taken unawares. That he slips is common; that he repents belongs to faith. Already a fire was burning in the house of the chief of the priests; Peter came near to warm himself, because, with the Lord shut in, the warmth of the mind had grown cold even in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
