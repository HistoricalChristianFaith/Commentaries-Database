[[commentary]]
quote='''
What then does this mean: God chose the things that are not, to destroy the things that are? That is: he chose the people of the Gentiles, which was not, to destroy the people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
