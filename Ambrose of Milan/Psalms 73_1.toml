[[commentary]]
quote='''
The interrogation of holy Job has been run through: now let us take up that interrogation which we have found in the Psalms. David himself, indeed, has in many places not kept silent about the vanity of the world, and has frequently asserted that the things thought to be the good things of this world are empty, and above all in Psalm 38 (39), in which he says: Nevertheless all things are vanity, every man living. Although in the image of God a man walks, yet he is troubled in vain; he lays up treasure and does not know for whom he gathers it, and elsewhere: How long shall sinners, O Lord, how long shall sinners glory? For here they have a shadowy glory; when they have departed from the world, they cannot find the fruit of consolation. Yet the same man inserted Psalm 72 (73), in which he himself, under the name of Asaph, bears witness that at first he was on the point of slipping, so that he was gripped by no moderate sorrow when he saw sinners in this world overflowing with riches and abounding in prosperity, while he himself, who had justified his heart, was in afflictions and tribulations; and that he had incurred no slight stumbling at the outset, but afterwards, corrected by the scourges of the Lord and enlightened by the grace of divine knowledge, had learned the sequence of the true teaching.

But nowhere do I find that holy Asaph was harassed by any adversities, whereas holy David endured very many grievous things, full of dangers; for he speaks of his own toils. Hence too the psalm is inscribed, as the title shows, not as being of holy Asaph, but as being for holy Asaph, which is shown more plainly from the Greek psalter, so that David seems to have given to this Asaph too, as to others, the psalm which he himself had written, for him to sing. But since it is written in the title itself that the psalms of David have come to an end — and how have they come to an end, when, after these ten psalms have been run through, the inscription of the titles afterwards includes psalms of David right up to the very end? — therefore, setting aside a definition of this kind, let us consider what the sequence of the psalm is, and let us take our beginning from the first little verse of the prophetic interrogation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 1"

[[commentary]]
quote='''
How good is God to Israel, to the upright of heart! At the very beginning the progress of his amendment shines out. For no one can truly confess that God is good except him who acknowledges his goodness not from the successes of his own fortunes, but from the depth of the heavenly mysteries and the height of the divine ordering; and that goodness must be weighed not by the appearance of present things but by the advantage of things to come. To the just man, therefore, God is always good, and when he is racked by pains of the body and when he is afflicted by the bitterness of punishments, he always says: If we have received good things from the hand of the Lord, why do we not bear the things that are evil? He rejoices that he is crushed here, so that in the future he may find consolation, knowing that he who has received good things in this life has his reward. He will not be able to hope for future rewards who has not wrestled, who has not been exercised in the contest of various battles. But he who, whether justly or unjustly, is afflicted in this world rejoices, either because he pays here the price of his offences, or because he knows that there is a richer grace with the Lord if he suffers bitter things unjustly for His name or for some good work, according as it is written that it is no glory if, when you sin, you are punished and endure it; but if, doing good, you also suffer, this is grace with God. For to this you were called, because Christ too died for you, leaving you an example, that you should follow his footsteps, who did no sin, nor was deceit found in his mouth: who, when he was reviled, did not revile in return; when he suffered, did not threaten. So the just man, even if he is on the rack, is always just, because he justifies God and says that he bears less than his sins deserve; he is always wise; for true and perfect wisdom is not taken away by the tortures of the rack; he does not lose what he is, because he shuts fear out by the zeal and purpose of love: as a wise man he knows how to say that the things we bear in this body are unworthy of the recompense of future glory, and that all the sufferings of this time cannot equal the reward that is to come. So God is always good to this man, who knows at what time he will reap. And therefore, like a good husbandman, here he ploughs his field with a kind of ploughshare of stricter abstinence; here he roots out with a kind of pruning hook of the virtues, which cuts away vices; here he manures, humbling himself even to the ground, knowing that God raises up the needy from the earth and lifts up the poor from the dung; indeed, the apostle Paul, had he not been reckoned as dung, could never have gained Christ for himself; here he guards his fruits, that there he may store them away in safety. So God is always good to him, because he always hopes for the things that are good from God.

Take another point. How good, he says, is God to Israel, to the upright of heart! Is God, then, not good to all? He is indeed good to all, because he is the Saviour of all men, especially of the faithful. And therefore the Lord Jesus came to save what had perished; for he came to take away the sin of the world, to heal our wounds. But because not all seek the remedy, but many shrink from it, lest the force of the ulcer be stung by the medicines, therefore he heals the willing and does not constrain the unwilling. So those who seek the remedy receive health, but those who reject the physician and do not seek him cannot feel the goodness of the physician, which they do not experience. But he who is treated is also healed, and therefore the physician is good to those whom he has healed. So God is good to those whose sins he has forgiven; but he who has an incurable sin in the ulcer of his mind, how can he reckon the physician good whom he shuns? Beautifully, therefore, did the Apostle explain, as we said before, that God is both good to all, who wills all men to be saved, and that the prerogative of the divine goodness is kept especially for the faithful, whom both the will of God and his grace assist. But the psalmist too, in saying: How good is God to Israel, to the upright of heart! referred to the judgment of those who know no other way to think of God than that he is good towards all things and in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 2"
