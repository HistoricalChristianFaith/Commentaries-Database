[[commentary]]
quote='''
For it is not one from the Father and another from Mary; but he who was from the Father took flesh from the Virgin, assumed affection from his mother, so that he himself might take up our infirmities. Hence the prophet says: And he grieves for us. How did he grieve with my grief, if he did not bear my affection? A man, he says, under the stroke and knowing how to bear infirmity.

So as a man he was made weak, as a man he grieved, and we reckoned him to be as a man in sorrows; but as the victor over infirmities, not one conquered by infirmities, he grieved for us, not for himself, and was made weak not on account of his own sins but of ours, so as to heal us by his bruise. What indeed is a man under the stroke and knowing how to bear infirmity, if not that he felt compassion in the stroke? Or how did he know how to bear infirmity, if he had shut out the feeling of infirmity? For what we carry, we sustain as a burden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
