[[commentary]]
quote='''
How does God speak? Is it with the voice of the body? Not at all. He utters oracular words with a voice that is far more significant than is the voice of the body. The prophets heard this voice. It is heard by the faithful, but the wicked do not comprehend it. Wherefore we find the Evangelist in the Gospel listening to the voice of the Father speaking: I have glorified it and will glorify it again. But the Jews did not listen. Hence they said: I had thundered. We have given an instance above wherein God was thought to be walking when He was not. Here is an occasion when He was heard speaking, whereas to some people He spoke not.

But let us take note of what He speaks: Adam, where are you? Even now these words have the healing power of salvation for those who hear the Word of God. Hence it is that the Jews who closed their eyes lest they hear do not deserve to hear even today. It follows that those who conceal themselves have a remedy, for he who hides himself is ashamed and he who is ashamed is converted, as it is written: Let them be much troubled and let them all be turned back speedily. The very fact of His calling a person is a testimony of salvation to him who comes, because the Lord calls those for whom He feels pity. When He says, therefore, where are you? it is not a question of a locality to one who knows what is hidden. God did not have His eyes closed, so that a man in hiding was able to escape His notice. For that reason He said: Adam has become like one of us, because his eyes were opened. He, in fact, opened his eyes, so that he saw his own sin which he was unable to avoid. It happens that after we have sinned, we become, somehow or other, more aware of our crimes. We are then aware of the sin which we did not consider to be such before we actually fell into sin. Certainly we did not then believe that a sin was subject to our disapproval, for, if we had felt guilty, we would not have committed it. God sees the faults of all men and knows their offenses. His eyes penetrate into the secrets of the souls of each and every one of us. What, then, does He mean by Adam, where are you? Does He not mean "in what circumstances" are you; not, "in what place"? It is, therefore, not a question, but a reproof. From what condition of goodness, beatitude, and grace, He means to say, have you fallen into this state of misery? You have forsaken eternal life. You have entombed yourself in the ways of sin and death. Where is that noble confidence and trust of yours? That fear that you show is evidence of your wrongdoing and that hiding place of yours betrays your dereliction. Where are you? does not mean "in what place," but "in what condition." Where have your sins led you, so that you fled the God whom before you sought after? Perhaps you are disturbed by the fact that Adam is the first to be rebuked, although the woman was the first to eat the fruit. But the weaker sex begins by an act of disobedience, whereas the stronger sex is more liable to feelings of shame and forgiveness. The female furnished the occasion for wrongdoing; the male, the opportunity to feel ashamed.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 14"

[[commentary]]
quote='''
But since Adam did not wait for the Lord — for how did he wait, who fled back and feared to present himself? —, therefore neither did the Lord deign to see him; the eyes, indeed, of the Lord are upon the righteous. Him, however, he was so far unwilling to see that he sought him, saying: Adam, where are you? He who is sought is held as absent. It is faith that presents us to God, unbelief that makes the ungodly exiles. And so no one is absent from God except he who has made himself absent, and therefore he says: Be it done to you according to your faith; for he who does not know will not be known. Adam, then, as a sinner, could not keep his place; cast out of paradise, he was banished to a fortified village, that he might do penance. He received a respite, so as not to perish utterly at once, so that Eve might be saved through the bearing of children: the faith of holy Abel, the grace of the prophets, the posterity of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
