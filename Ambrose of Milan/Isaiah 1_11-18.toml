[[commentary]]
quote='''
We have it written in the book of Isaiah, where God says: What to me is the multitude of your sacrifices? says the Lord. I am full, that is: I abound in what is mine, I do not seek what is yours; I do not want holocausts of rams and the fat of lambs and the blood of bulls and of goats, and do not come thus into my sight. And yet Abel had offered a sacrifice from the young of the flock, by which he had pleased God; but he who was waiting for the truth of the sacrifice did not require the type; for the saving passion of the Lord was awaited. For who he says has required these things from your hands? You shall not go on treading my palace. And below: When you stretch out your hands to me, I will turn away my face from you. But wash yourselves, be clean, take away malice from your souls. Judge for the orphan and justify the widow, and come, let us reason together, says the Lord. It is clear, therefore, that the Lord both turned away from man's sacrifices before and was reconciled afterwards, so that he deigned to look upon our sacrifices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 9"
