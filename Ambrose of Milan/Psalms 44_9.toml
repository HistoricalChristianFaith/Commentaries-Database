[[commentary]]
quote='''
But now you have cast us off and confounded us, and you will not go forth, O God, in our powers. Since holy David himself has said in another place: For the Lord will not cast off his people, how does he say in this place: You have cast us off, especially when he says this of the people for whom he recounts no ordinary marks of their own virtue? For it is no ordinary thing to say that storms and various temptations came upon them and they did not forget the Lord their God and did not deal unjustly in his covenant, and the rest that follows. Hence the holy Apostle too interprets it and says that the Lord did not cast off his people, so much so that he set him down as saying: All the day long I have stretched out my hands to an unbelieving and contradicting people. Supported by the authority of this saying, he says: I say then: has God cast off his inheritance? By no means; for I too am an Israelite, of the seed of Abraham, of the tribe of Benjamin. God has not cast off his people whom he foreknew. But it can be said in this place that he did not cast off the people for this reason, that the remnant according to the election of grace has been saved. And he seems indeed not to have cast off the people in the few, yet to have cast off, if not the whole people, still very many of it. Hence he added, setting down the answer of God, that he not only preserved his people in a few, but even left for himself seven thousand men who had not bowed the knee before Baal. Granted that this was said by the Apostle according to the Gospel, since the Lord had passed over to the Gentiles; but let the time of the divine answer be referred to a zeal of faith still fervent, when the grace of the prophets was still overflowing to the people of the Jews. Hence, if in the time of Elijah the Lord denied that his people had been cast off by him, much more in the time of David or of the sons of Korah, when the faith of the chosen people still shone brightly.

Yet let us question holy David himself too, so that we may gather how the Lord did not cast off his people. For since God is one who draws near, not one who withdraws far off, as the Scripture of the Old Testament has it, surely he who draws near does not cast off. For it belongs to the divine mercy to be a cause of death to no one and to think that all are to be redeemed. But see whether it is not he who is cast off who withdraws himself far from the Lord, as David says: For behold, those who withdraw themselves far from you shall perish; you have destroyed all who commit fornication away from you. What is 'commit fornication away from you'? That with the mockeries of their own shamefulness they leave you and depart from you and stray from your precepts. Indeed elsewhere you have it written: But adulterers God judges, destroying them from himself, that is: by estranging them from you, you have destroyed them. He, then, who separates himself from the Lord is himself separated from the Lord, and he who does not know the Lord is not known by the Lord, and he who ignores is ignored, as the Lord himself said: Depart from me, all you workers of iniquity. I do not know you; for he does not deign to know the ministers of injustice and the authors of iniquity. The sinner, then, is not cast off, because he casts himself off. In this sense, then, he says: But now you have cast us off and confounded us.

How God casts off, however, the following verse explains: you will not go forth, it says, O God, in our powers. When God does not help, he seems to cast off; for each one who does not feel the aids of the divinity conferred on him by its assistance thinks himself cast off and deserted. But what does he mean in saying: you will not go forth, O God, and what does it mean that God is sometimes said to go forth or to go out or to arise or to come down? For God, who is above all things, is not moved bodily, nor goes out from some place, nor passes to another, nor truly arises, as though he were lying on some couch or sitting bodily on some seat; but these things are said so that you may understand when, and to whom, he is said to go out, and to whom to arise. For we read in this very psalm: Arise; why do you sleep, O Lord? And we must consider whether he does not sometimes seem to fall asleep because of our blameworthy acts, as we read in the Gospel that, when the apostles were still imperfect, Jesus Christ was asleep to them. But when they were struck with fear and dread of shipwreck, they woke the sleeping Christ. To the unbelieving, then, the Lord Jesus sleeps; to the faithful he keeps watch.

Indeed he who is faithful both enters in to God, and from the negligent God seems to go out and depart. Certainly the Lord draws to himself the imperfect and those still weak, as you have read the young maidens saying: Draw us; let us run after the fragrance of your ointments. But Moses, who was already stronger and chosen by the Lord, is read both to ascend and to enter in to the Lord his God, as it is written: For Moses went up into the mountain, and light surrounded the mountain. And the majesty of the Lord came down upon Mount Sinai, and the cloud covered it six days; and the Lord called Moses on the seventh day from the midst of the cloud. And the appearance of the majesty of the Lord was like a burning fire on the top of the mountain before the sons of Israel. And Moses entered into the midst of the cloud. As, then, Moses here entered into the cloud when he was first called to the mountain by the Lord, so later, being more perfect, when he entered into his tabernacle, the pillar of cloud came down to him and stood at the door of the tabernacle. And all the people, standing, adored, each one at the door of the tabernacle. But the Lord is in the cloud; for he has made darkness his hiding place. And so that you may know that he is speaking of the Lord: And there spoke, it says, the Lord to Moses. As for the record that the tabernacle of Moses was set outside the camp, so that he might meet God, this does not seem to be contrary; for he who seeks God, as it were, enters in to God, and with his whole mind goes in to the knowledge of him.

The righteous man, then, enters in to the Lord, as Moses entered into the cloud; and God is in the cloud. Indeed, behold, the Lord comes on a light cloud, and in the Gospel you have it written: But when you pray, enter into your chamber, and, having shut the door, pray to your Father in secret; and your Father who sees in secret will reward you. Within, then, as in your chamber, is God. Hear also elsewhere that God is within: Behold, he says, the Lord will go forth from his place and will come down and will ascend upon the high places of the earth, and the mountains shall be moved beneath him and the valleys shall melt. Scripture says this, and already then it signified that he would forsake the people of the Jews and pass over to the Gentiles. Indeed we find this expressed in a psalm too, when David says: And he, like a bridegroom going forth from his bridal chamber, exulted like a giant to run the way.

In these ways, then, we have found the going out of God or his going in, as the Lord Jesus too says that he comes to the man who fears him: Behold, he says, I stand at the door and knock; and if anyone hears my voice and opens the door, I will come in to him and will sup with him, and he with me. We have said these things, then, because the prophet says: You have cast us off, and you will not go forth, O God, in our powers.

In like manner let us also take this: that God went forth in the powers of the Jews when Joshua son of Nun adored the leader of the heavenly host, and therefore conquered without iron and destroyed without any siege the city of Jericho, which had very strong walls. For when God went forth in the powers of his servants, victory followed; for the angel went forth at the prayers of Hezekiah and laid low the countless forces of the Assyrians. But sometimes the Lord, as it were, abandons for a time even those whom he wishes to be crowned in the contest, so that they may conquer by faith, and their devotion may not grow slack through favourable and prosperous circumstances. Indeed, those who have fallen through a course of prosperity and the enjoyment of success are often corrected by adversity. Therefore we frequently find the Jews fallen after victory and corrected after servitude, because by prayers and lamentations they made God return to them.

Hence that saying too, which was spoken according to man and the affection of man, does not conflict with this view, when the Lord said: O God, my God, look upon me; why have you forsaken me? Not that the Lord was forsaken, who says elsewhere: For I am not alone, because the Father is with me; but because, according to the flesh and affection of a man who is set in a heavy contest, he seems forsaken by the Lord. Indeed not idly does Scripture say that after the first temptation the devil departed from him until a time, that is, until the contest; for when the great contest of the sacred Passion arrived, the adversary came forward again to his temptations. But man, when he is set, as it were, in uncertainty, thinks that he has been deserted by his God. But just as we take this according to the affection of the flesh, that the man whose advance Christ wrought in his own body seemed to himself forsaken, so too by his divinity he knew that he was never forsaken by the Father, for he himself said: I am in the Father and the Father in me, and indicated that he was not alone.
'''
