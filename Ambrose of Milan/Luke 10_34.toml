[[commentary]]
quote='''
Or, He binds up our wounds by a stricter commandment, as by oil he soothes by the remission of sin, as by wine he pricks to the heart by the denunciation of judgment.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Or, He places us on His beast in that He bears our sins, and is afflicted for us, (Isai. 53:4, LXX) for man hath been made like to the beasts, (Ps. 49:12) therefore He placed us on His beast, that we might not be as horse and mule, (Ps. 32:9.) in order that by taking upon Him our body, He might abolish the weakness of our flesh.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he bound up his wounds, pouring in oil and wine. This Physician has many medicines with which he is wont to heal. His speech is a medicine. One word of his binds up wounds, another soothes with oil, another pours in wine: he binds up wounds with a sterner precept, he soothes with the remission of sin, as with wine he stings by the announcement of judgment.

And he set him he says on his own beast. Hear how he sets you on it. He bears our sins and grieves for us. And the shepherd set the weary sheep on his shoulders. For man was made like a beast of burden, and therefore he set us upon his own beast, so that we might not be as the horse and the mule, so that by taking up our body he might do away with the infirmities of our flesh. Then he brought us to the inn, us who were beasts of burden.

Now an inn is a place into which those wearied by a long journey are wont to turn aside. So the Lord brought him into the inn, he who raises the needy from the earth and lifts the poor from the dunghill, and he took care of him,

lest the sick man should fail to keep the precepts he had received. But this Samaritan had no leisure to stay long on earth: he had to return to the place from which he had come down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
