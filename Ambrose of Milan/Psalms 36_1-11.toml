[[commentary]]
quote='''
See the power of the prophet's distinction. First he set forth the unrighteous man, who either in his heart or in his speech says that he may sin against himself, or sin in himself; for the Greek codex has ἐν αὑτῷ, that is "in himself", but not all of them. And perhaps for this reason, because the fool has said in his heart that there is no God, lest perhaps the unrighteous man too should speak within himself and sin within himself, although to deny God openly is the mark of a madman. But many profess unrighteousness as a matter of praise; for to plunder, to harm even those who have done no injury, to defraud: many think this glorious for themselves. So first he set forth the life of the unrighteous man, afterwards he joined to it the mysteries of divine knowledge, that, fearing God, we may turn aside from iniquity and unrighteousness. He added a prayer, that he may deign to free his righteous ones from the fellowship of the unrighteous, that in those also who are clean of heart the divine righteousness may extend itself like a loving watchwoman, lest the onset of sins, like that of enemies, steal upon us and capture us sleeping. Therefore we must always keep watch, the camp of the Lord must be fortified, because the enemy and adversary comes by night, when the senses are held by sleep and the body is distended with food; we must pray that the righteousness of God may extend itself in us, which makes those set in weakness stronger, so that each one of us may say: When I am weak, then I am powerful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
