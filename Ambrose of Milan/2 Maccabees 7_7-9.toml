[[commentary]]
quote='''
The second came forward and, not unworthy of his brother, fulfilled the duties of a devout confession. And when the skin of his head was being torn off, he answered: 'You take away the skin indeed, but I have a spiritual helmet which you cannot take away'. And truly no one can take this helmet away, as the Apostle afterwards taught in the Church of the Lord: for the head of man is Christ, and we are his members. Rightly did the boy foresee by the divine Spirit this apostolic teaching. The savage beasts were stripping the hide from his head and raging with the ferocity of leopards. But he, as his strength failed: 'How sweet it is' he said 'to die for religion, how pleasant all the bitterness of death for devotion, because the reward of these labours remains! Yours, O king, are the heavier torments; you are tortured more violently by silent torments, because you see yourself conquered in your power.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
