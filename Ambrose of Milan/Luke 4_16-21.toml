[[commentary]]
quote='''
Then he took the book, to show that he himself is the one who spoke in the prophets, and to remove the sacrileges of the unbelieving, who say that there is one God of the Old Testament and another of the New, or who say that the beginning of Christ is from the Virgin; for how did he begin from the Virgin who before the Virgin was speaking: the Spirit of the Lord is upon me? You see the Trinity, coeternal and perfect.

Scripture speaks of Jesus himself as God and man, perfect in both; it speaks also of the Father and of the Holy Spirit. For the Holy Spirit is shown as co-worker when, in bodily form like a dove, he descended upon Christ, when the Son of God was baptized in the river and the Father spoke from heaven. What greater testimony, then, do we seek than that he declared with his own voice that he was the one who spoke in the prophets? He is anointed with spiritual oil and heavenly power, that he might water the poverty of the human condition with the eternal treasure of the resurrection, turn away the captivity of the mind, enlighten the blindness of minds, proclaim the year of the Lord, spread over endless times, a year which knows no return into a round of toil, and which grants men a continuance of fruit and of rest. And he so bent himself to every service that he did not even disdain the office of reader; but we were impious, who, looking at his body, refused to gather faith in his divinity from the miracles of his works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
