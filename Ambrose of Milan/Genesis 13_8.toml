[[commentary]]
quote='''
Let there be no quarrel he says between me and you and between my shepherds and your shepherds, because we are men, brothers. We read that Abraham was the uncle and Lot his nephew: how does he call him brother? But notice that the wise man brings forward the causes of concord. Hence he put first: we are men. And all men are the offspring of one nature, conceived within her womb, and warmed and brought forth from one womb. Hence by a kind of right of kinship we are linked together as brothers, founded by one father and born of one mother, as brothers of the same womb. And therefore, since we are the offspring of a rational nature, we ought to love one another with mutual love as brothers of one womb, not to attack and persecute one another. But much more truly it is referred to the one soul, whose rational part has as kindred, as we said above, the irrational senses, while that which is rational has the fellowship of the virtues. Hence the vices and virtues of man are joined to each other by a kind of brotherly bond, because the former are of the flesh, the latter of the rational soul; and flesh and soul, of which man consists, are allied as by a kind of law of wedlock. Man, then, ought to bind his portions together as by a treaty and compel them to peace. But because there was no one great enough to conquer the flesh, therefore there came our peace, who made both one and, loosing the middle wall of partition, the enmities, in his flesh making void the law of commandments by decrees, that he might create the two in himself, making peace in one new man, that he might reconcile both in one body to God through the cross, slaying the enmities in himself. Rightly, then, did the Apostle call himself an unhappy man, since he suffered within himself so great a war, which he could not extinguish. Then, when he spoke of one small portion of the passions, that is, anger, Solomon: Better he says is a wise man than a strong one, and he who restrains anger is better than he who takes a city. Blessed then is he who has come through this war, and that not as a stranger and sojourner but as a citizen with the saints and a member of the household of God, whom, though placed on earth, earthly things do not shake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 6"
