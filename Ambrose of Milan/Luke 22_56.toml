[[commentary]]
quote='''
What does it mean that a maidservant first betrays him, though men surely could have recognized him more readily, unless that this sex too should be seen to have sinned unto the death of the Lord, so that this sex too might be redeemed through the Passion of the Lord? And therefore a woman first received the mystery of the resurrection and keeps the commandments, to abolish the old error of transgression.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
