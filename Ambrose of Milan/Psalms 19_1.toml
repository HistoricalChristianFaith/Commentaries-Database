[[commentary]]
quote='''
As heaven is lighted with the splendor of the stars, so do people shine with the light of their good works, and their deeds shine before their Father in heaven. The one is the firmament of heaven on high; the other is a similar firmament of which it is said, "On this rock I will build my church." The one is a firmament of the elements, the other of virtues, and this last is more excellent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252041-50.html'
source_title="Letter 43: To Horontianus"

[[commentary]]
quote='''
But the prophet did not call heaven itself a bird; he said that there are birds in heaven. So too David says: The heavens tell the glory of God, that is, the heavenly powers; or else, when the beautiful element is beheld, its maker is proclaimed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
