[[commentary]]
quote='''
And therefore the wise man, who knows the vanity of this world, does not pray for a long enjoyment of this life, but hastens to those eternal things and longs to be released from the toil and pain of this body, as the prophet is known to have desired, saying: Hear, O Lord, my prayer and my supplication, give ear to my tears. Be not silent toward me, for I am a newcomer with you on the earth, and a sojourner, as all my fathers were. A native inhabitant is one thing, a newcomer another, a settler another: a native inhabitant is one who is from the place and inhabits the place of his birth; a newcomer, one who comes from elsewhere; a settler, one who dwells for a time and changes with the turns of the years. This, then, is what David says: "With you I am a stranger while I am on the earth; I am not now a native inhabitant of your paradise". Hence he himself explained this, adding: and a sojourner, as all my fathers were. This the Apostle Paul too disclosed, asserting that while we are in the body we sojourn away from the Lord, because, even if faith is in us, by faith, however, we walk, not by sight, that is, not face to face as if present; for we still walk in an enigma, not in truth. Indeed he added: We dare, then, and we trust, rather to sojourn away from the body and to be present with the Lord. "We dare" is a word of the boldness of faith in God, not of rashness; and "we trust", that is: we acquiesce willingly and longingly; not resting the authority of fuller knowledge principally on our own judgement, as it were, we wish what we desire to be true: that we may draw near to the Lord, from whom the distance between things to come and things present seems to separate us. We dare, then, to be present, and therefore, he says, we strive. You recognize the word of one who still wishes to arrive, not of one who has arrived; it is the affection, then, not the effect, that is shown in this word. Indeed, question the very affection of his speech, nay, hear him saying it, or rather hear him doubting, when he says: Therefore we strive, whether absent or present, to please him: absent still, through faith; present, through sight. Hence this too can be understood, that both placed here and there we desire to please our judge, who is also the redeemer of our souls. For we must stand before him in sight, so that each may obtain the merits of his works by the examination of a fitting lot, either the righteous man in rest or the ungodly in misery. He sheds tears, then, because when a newcomer has come to the earth, he lingers and is separated from his fatherland, detained by a long exile. Consider for me now that Adam cast out of paradise, banished to a stronghold, gazing at the place from which he was cast down, weeping abundantly, because he remembers what he has lost or whence he has fallen. And therefore let us give thanks to God, who has freed us from perpetual exile, opening the door by which we may return to our fatherland. Hence the Apostle made bold to say: So then you are no longer newcomers and sojourners, but you are fellow citizens of the saints and members of the household of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
