[[commentary]]
quote='''
And the lamp of Christ is in the body. This lamp shows you the way. Hence also the holy man says: Your word is a lamp to my feet, a lamp because it has enlightened the souls of all and shown the way in darkness. The Gospel is the way of the lamp; it shines in shadow, that is, in the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 4"
