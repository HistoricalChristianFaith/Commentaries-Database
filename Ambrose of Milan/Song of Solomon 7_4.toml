[[commentary]]
quote='''
Your eyes are pools in Heshbon, at the gates of the daughter of many. Your nostrils are like the tower of Lebanon. What are the pools in Heshbon, if not the abundance in rational thoughts which is at the gates of the Church, to whom a multitude of teaching is rightly accorded? For the daughter of many is the posterity and the effect of very many teachings, whose nostrils are the fragrance of sacrifices, surpassing all flowers.

Your nose is like the tower of Lebanon: it is lofty beyond measure, and therefore it looks out toward the face of Damascus, scenting, that is, the Gentile people, and the faith of that people, by whose grace that people would wipe away the stench of its sins. The face of Damascus, then, is the faith of the Gentiles, overshadowed by no covering, veiled by no garment, bare and free, intent on heaven more than on the earth. This the nostrils of the Church watch and look out upon, gathering what is sweet in it, both of the breath of fragrances and of grace.

And rightly, Her nostrils are like the tower of Lebanon; because in the sacrifices is the sweet fragrance of the Church, in which the victim of good fragrance is the remission of sins. Take, then, these nostrils, O man, that you may distinguish the flowery from the foul-smelling, and then the Lord will give you life. For when he has noticed what you ask of him, that he turn away the eyes of your mind from vanity, he works together with your soul, so that, if she is captivated by some outward beauty, or is not bent because of hardness or weakness, he may bend her with the yoke of the Word and govern her with his reins, so that by the will of God she may be led away from vices and receive the fragrance of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
