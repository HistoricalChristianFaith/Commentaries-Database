[[commentary]]
quote='''
But it must also be explained how the others, that is, Matthew and Mark, introduced two thieves reviling, while Luke, one reviling, the other resisting him. Perhaps this other at first reviled, but was suddenly converted. It may also have been spoken of one, but in the plural number; as in the Hebrews, They wandered in goat-skins, and they were sawn asunder; (Heb. 11:37.) whereas Elijah alone is related to have had a goat-skin, and Isaiah to have been sawn asunder. But mystically, the two thieves represent the two sinful people who were to be crucified by baptism with Christ, (Rom. 6:3.) whose disagreement likewise represents the difference of believers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Quickly, therefore, the Lord forgives, because quickly that man is converted. Whence that too seems to be resolved, that the others bring in two thieves reviling, this one brings in one reviling, one asking. Perhaps this one too reviled at first, but was suddenly converted. Nor is it any wonder if he forgave the guilt of one converted, who granted pardon to those who insulted him. He could also have spoken in the plural of one, as in that saying: The kings of the earth stood by, and the rulers gathered together into one; for in the Acts of the Apostles only King Herod and the ruler Pilate are shown by the voice of Peter to have conspired against Christ. So too you have in Hebrews: They went about in goatskins, they were sawn asunder, and they stopped the jaws of lions, whereas only Elijah is taught to have had a sheepskin, Isaiah to have been sawn asunder, Daniel to have remained untouched by the lions.

How execrable in deed was the iniquity of the Jews, that they should crucify the Redeemer of all as a thief! Yet in the mystery he is a good thief, who lay in wait for the devil to carry off his vessels. In the mystical sense, however, the two thieves signify that two sinful peoples were to be crucified with Christ through baptism, whose disagreement signifies the diversity of those who alike believe. Indeed, one was on the left, the other on the right. The rebuke too reveals the future scandal of the cross even among believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
