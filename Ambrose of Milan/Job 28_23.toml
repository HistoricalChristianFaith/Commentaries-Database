[[commentary]]
quote='''
God alone is the one who knows it. For God he says has well established its way; he knows its place. What the dwelling of wisdom is, hear his disciple saying: The only-begotten Son, who is in the bosom of the Father, he has declared him. For the Son knew the Father, since he himself says: As the Father knows me, I also know the Father. There is an equal measure of knowledge where there is a unity of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
