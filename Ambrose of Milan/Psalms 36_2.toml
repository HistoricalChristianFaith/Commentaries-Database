[[commentary]]
quote='''
For so it is written: There is no fear of God before his eyes, for he has acted deceitfully in his sight, to find his iniquity and hatred. What is "to find"? Everyone, indeed, who seeks finds; so if evil is sought, it is sought in order to be found. But as he is praiseworthy who has found the good that he sought, so he is unpardonable who has laboured to find the evil that he had sought; we ought to spend our labour on good things, not on outrages and crimes. What, then, is it but the height of folly and madness to seek hatred, to find by evil arts iniquity, which no good man has sought?

Let us consider, then, how the wicked seek their iniquity and hatred. Herodias, we know, abounding in the wealth of royal power, was joined in lawful wedlock to the tetrarch Philip. She received Herod, who was on his way to Rome, as her husband's brother, by the right of hospitality and kinship, and, coupling her sins with him, not long after she left her husband and changed the rights of her partnership. Did not she seek iniquity and hatred, who deserted her marriage to find adultery? And because the holy Baptist steadfastly rebuked the unlawful nuptials, saying to Herod: "It is not lawful for you to have her as wife, who left her husband against the law and came together with her husband's brother as though by law", the adulteress was so stirred that she wished to kill him. But knowing that she could not easily bend Herod to the slaying of a righteous man, she devised a way to bring it about. It was Herod's birthday, which he was accustomed to celebrate with excessive luxury, as is the custom of most kings. She adorned her daughter, so that at the king's banquet the royal child should dance. And when she had pleased Herod, which ought to have displeased an uncle, he offered her to ask whatever reward she wished for the shame of her dancing. She consulted her mother, at whose prompting she demanded the head of the Baptist. Herod, overcome, because he had bound himself by an oath to give whatever his own niece asked, ordered John to be killed and his head brought. When it was brought he gave it to the girl, and she carried it to her mother. It is true, then, that iniquity and hatred are sought out, since that woman drew out by the depraved arts of a devised fraud what she could not obtain by an easy request.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
