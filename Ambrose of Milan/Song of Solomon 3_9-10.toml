[[commentary]]
quote='''
King Solomon made himself a couch of the wood of Lebanon; its pillars he made of silver, its reclining-place of gold, its ascent of purple, its back strewn with gems. What is this couch, if not the form of our body? For in the gems air is shown by the appearance of brightness, in the gold fire, water in the silver, earth through the wood; of which four elements the human body consists, in which our soul reclines, if it does not stand, without rest, on the roughness of the mountains or the dryness of the ground, but rests, lifted high above vices, supported by the wood. Whence David too says: May the Lord bring help to him upon the couch of his pain (Ps. 40 (41):4); for how can that be a couch of pain, when that which has no feeling cannot feel pain? But the body is a body of pain, as it is a body of death: Unhappy man that I am! who will deliver me from the body of his death (Rom. 7:24)?

And since we have brought in a little verse in which we made mention of the Lord's body, lest perhaps it should trouble anyone reading that the Lord took up a body of pain, let him remember that he both grieved and wept at the death of Lazarus, and was wounded in his passion, and from the wound came forth blood and water, and he breathed out his spirit (John 11:35). Water for the washing, blood for drink, spirit for the resurrection. For the one Christ is for us hope, faith, love: hope in the resurrection, faith in the washing, love in the sacrament. Yet as he took up a body of pain, so also he turned the bedding in sickness; because he turned it to the benefit of human flesh: for by the passion sickness was undone, death by the resurrection. And yet you ought to mourn for the world, to rejoice in the Lord: sorrowful unto penitence, eager for grace; although the Teacher of the Gentiles has prescribed by a salutary precept that we ought both to weep with those who weep and to rejoice with those who rejoice (Rom. 12:15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
