[[commentary]]
quote='''
Rich then is that Shepherd of whom we all are a hundredth part; and hence it follows, And if he lose one of them, does he not leave &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
How different is the wickedness of the prince of this world! The usurer of money has a mortgage on one's head, he holds one's signature, he reckons his capital, he exacts his hundredth. O what a bitter word from a sweet! The Lord freed the hundredth sheep—that was the hundredth of salvation, this, of death—and the good earth returns fruit a hundred-fold. Woe to those who put bitter for sweet and sweet for bitter! What is bitterer than usury, what sweeter than grace? Ought they not by that very word by which they designate it hundredth, to recall to memory the Redeemer, who came to save the hundredth sheep, not to destroy it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 9"

[[commentary]]
quote='''
Nor does the parable seem to differ from the mystery. For who is the rich man but our Lord Jesus, who says of himself, as was read today, that a certain man, being rich, went into a far country to receive a kingdom and to return? And truly he was rich in the wealth of his majesty and in the fullness of his own divinity, he whom angels and archangels, virtues, powers, principalities, thrones and dominions, Cherubim and Seraphim served with unwearied obedience.

But yet, though he was rich, he left the ninety-nine sheep on the mountains and sought out the one sheep which had remained behind, weary. This sheep the prince of this world, needy and poor in comparison with that rich man, was feeding like a daughter on his own food. Rightly, then, she had grown faint whose sustenance was the food of the world. This sheep had strayed in Adam, enticed by the snares of the serpent.

And it was not a bad sheep, for it was full of the word, being the daughter of the rational hebdomad and the gift of a holy Author; yet it was nourished for a long time not on any precious things but on the cheap resources of a poor man. And so it ate, he says, of his bread and drank of his cup and slept in his bosom. Not good is the food of the Ethiopians; harmful is the golden cup, Babylon, which inebriates the nations; sleep is not useful to those who sleep: I would rather keep watch. And so all the foolish of heart were troubled; they slept their sleep and found nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 5"
