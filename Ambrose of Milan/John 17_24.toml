[[commentary]]
quote='''
We shall go there, where the Lord Jesus has prepared dwelling places for his little servants, that where he is we too may be; for so he willed. What those dwelling places are, hear him saying: In my Father's house there are many dwelling places; what his will is: Again, he says, I come and summon you to myself, that where I am you too may be.

But you say that he was speaking to the disciples alone, that to them alone he promised many dwelling places; so he was preparing them for eleven disciples only. And where then is that saying, that they will come from all parts and recline in the kingdom of God? Why do we doubt the accomplishment of the divine will? But for Christ, to will is to have done. Then he showed both the way and the place, saying: And where I go you know, and my way you know. The place is with the Father, the way is Christ, as he himself says: I am the way and the truth and the life. No one comes to the Father except through me. Let us enter this way, hold fast the truth, follow the life. It is the way that leads, the truth that confirms, the life that is given back through itself. And so that we may know his true will, he added in later words: Father, those whom you have given me, I will that where I am they too may be with me, that they may see my glory, Father. This repetition is a confirmation, like that saying: Abraham, Abraham! and elsewhere: I am, I am he who blots out your iniquities. And it is beautiful that what he promised above, here he asked for. And because he promised first and so asked, and did not ask first and so promise, he promised as the arbiter of the gift, conscious of his power; he asked of the Father as the interpreter of piety. He promised first, so that you may recognize his power; he asked afterwards, so that you may understand his piety. He did not ask first and so promise, lest he should seem to have promised what he had obtained rather than to have fulfilled what he had promised. Nor should you think it superfluous that he asked, since it expresses to you his sharing in the Father's will, in which there is a sign of unity, not an increase of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
