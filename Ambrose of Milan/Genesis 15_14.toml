[[commentary]]
quote='''
And so the just will go out in such a way as to leave nothing of their own in this land, lest their spoils remain with the inhabitants and possessors of this land. They will also depart from this land of Egypt in such a way as to carry off with them the vessels which they took from the Egyptians as a loan, whether of gold, he says, or of silver, to use for a time, and to despoil the Egyptians. These vessels they received by the will of the Lord, and they will carry them off with them, because they are sons of the resurrection, to whom it is said: not a hair of your head shall perish. These vessels the Egyptians gave, vessels that were taken from the land of affliction, and some are of gold, others of silver, because every creature of God is good, and above all that of man, the most excellent on earth, which God honoured by breathing into his face the spirit of life and setting him over all living things. These are those vessels of which the Apostle says: we have a treasure in earthen vessels. This is the garment of the Egyptians with which our soul is clothed, so that it may withdraw from here the richer and be freed from that in which it laboured hard here. For not only does every creature groan and travail, but we also, until the redemption of our body comes. The Lord has care of his work; he has care of a nature that in most respects is ready for reason and benevolence. For neither do we allow trees to be cut down and perish whose bearing has burst forth for us around their first fruits, if in a later age either the wind strips them or the sun scorches them, so that in supplying and furnishing strength the substance of the old soul fails through droughts; but we put off their testing to better breezes. And therefore our God, the rewarder of good will, having regard also to the first bearing and the natural disposition, allows the whole patrimony of our soul to be gathered and reserved, to test it by the mild season of his coming advent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
