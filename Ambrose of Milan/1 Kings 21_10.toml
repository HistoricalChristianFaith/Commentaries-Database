[[commentary]]
quote='''
He hath cursed, it says, God and the king. There is an equality in the persons, I suppose, so that there is an equality in the offense. He hath cursed, it says, God and the king. Lest the term "curse" offend the rich man and he be injured by the very sound of the word, "blessing" is used for "curse." Two witnesses of iniquity are sought out. By two witnesses also was Susanna attacked, and the Synagogue found two witnesses to cast false accusations against Christ, and by two witnesses is the poor man put to death. Therefore they led Naboth out and stoned him. Would that he might even have been permitted to die among his own! To the poor man, the rich grudges burial itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 11"
