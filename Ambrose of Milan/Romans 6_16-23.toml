[[commentary]]
quote='''
Let our will, then, not sell us. The Apostle cries: Do you not know that to whomever you present yourselves as slaves for obedience, you are slaves of him whom you obey, whether of sin unto death or of obedience unto justice? Therefore, if we serve either sin or justice, let us consider on which side the slavery is more tolerable and the fruit richer. But what fruit can there be in death? For the wages of sin is death, and therefore there is no fruit in it, but only a loss of honour, when we blush at the things we have done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 3"
