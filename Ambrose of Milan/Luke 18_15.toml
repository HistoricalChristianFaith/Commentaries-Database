[[commentary]]
quote='''
It may be thought strange by some that the disciples wished to prevent the little children from coming to our Lord, as it is said, when they saw it, they rebuked them. But we must understand in this either a mystery, or the effect of their love to Him. For they did it not from envy or harsh feeling towards the children, but they manifested a holy zeal in their Lord's service, that he might not be pressed by the crowds. Our own interest must be given up where an injury is threatened to God. But we may understand the mystery to be, that they desired the Jewish people to be first saved, of whom they were according to the flesh.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So it may seem hard and harsh to some that the disciples were forbidding the little infants to come to the Lord, unless you understand either the mystery or the affection; for they did not do it from the harshness of a mind envious towards children, but they were offering the services of diligent servitude to the Lord, lest he should be crushed by the crowds. Accordingly it is written elsewhere: Master, the crowds are crushing you; for our own advantage must indeed be rejected where there is injury to the divinity. Let us, then, flee pride and follow childlike simplicity, because truth is the adversary of pride, while simplicity runs together with truth, sublime in its very humility. For God does not dwell in an abject heart, but, as the prophets have handed down to us: The throne of virtue is exalted, that is, in him whose wisdom is raised to the height of truth. Nor, like Cain, let anyone hide the treachery of a murderer under the appearance of a brother, but let him be a brother without and within. So much for the affection. But as to the mystery: it was because they were eager that the people of the Jews, from whom they had been born according to the flesh, should be saved first; yet they also made supplication for the Canaanite woman. They knew, then, the mystery, that the calling of both peoples was due, but perhaps they did not yet know the order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
