[[commentary]]
quote='''
Consider the lilies, how they grow; and below: but if God so clothes the grass, which is today and tomorrow is cast into the oven. A good and moral discourse indeed, in that the Lord's word, by the comparison of the flower and the grass, has called us forth to faith in the bestowal of the divine mercy, either according to the letter, because we can add nothing to the stature of our body, or spiritually, because beyond the measure of our stature we can add nothing without God's favor. For what is so moral for persuasion as that, when you see that even things which are irrational are so clothed by God's providence that they lack nothing of use either for grace or for adornment, you should believe much more that man, who is rational, if he places all his use in God and does not violate faith by a bent for wavering, can never be in want, because he has rightly presumed on the divine favor?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
