[[commentary]]
quote='''
But since the Law was able to stop the mouths of all and was not able to convert the mind, therefore the last remedy of that final city was owed, in which there should be a saving refuge, so that the death of the prince of priests might free us from all dread of death and strip us of fear.

Who is he but the one of whom it has been read: Behold the Lamb of God, behold him who takes away the sin of the world? Whom God has set forth as a propitiator through faith in his blood, for the showing of his justice. And understand that he himself is the great prince of priests. The Father swore concerning him, saying: You are a priest for ever. Rightly for ever, because all the others, being temporal, are under sin, but this one has an inviolable priesthood. All are under death, but this one is ever living, since how could he who is able to save others perish himself? For such a one, he says, befitted (decebat) us. The expression is correct, since among those who have had a choice of words and expressions something of this kind is found, when someone says: a loftier place than befitted the victors. I have not passed this by, so that we may know that the Apostle uses natural words rather than common ones or those formed according to art. Such a one, then, he says, befitted us: a prince, a priest, just, holy, innocent, undefiled, set apart from sinners and made higher than the heavens. This, then, is the Word, which, dwelling above the heavens, enlightens all things. Hence also he is read to have been anointed by nature by God the Father, because the Word is the light which enlightens every man coming into this world. This is the Word of God, in whom is the great priesthood, whose intelligible garments Moses describes in that vestment of the prince of priests, because by his power he has put on the world and, as though clothed with it, shines in all things. He put on also the kinship of the human race by taking up this body, saying to the Lord . . . . and ineffable love, pouring himself into all by the spirit and the fullness of his Godhead, of whose fullness we have all received, so that we may know the love of Christ that surpasses knowledge and be filled unto all the fullness of God. For Christ is the head of all, from whom the whole body is brought forth and joined together by mutual connection, receiving its increase in the building up of itself in love. This, then, is the Word, which surpasses all, which says to Moses at the building of that ark of the testimony: And you shall put into the ark the testimonies, whatever I shall give you, and you shall make the placing of the mercy seat; and below: You shall place the mercy seat upon the ark, above, and you shall put in the testimonies which I shall give, and I will make myself known to you from there and will speak to you from above, that is: from there where he is above the heavens, where he is with the Father, from there I will speak to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 3"
