[[commentary]]
quote='''
Hence Luke rightly added that they spoke of his departure which he was to accomplish in Jerusalem. For the mysteries teach you of his departure. Today too Moses teaches, and today Elijah speaks, and today we can see Moses in greater glory. For who cannot, when even the people of the Jews could see him, indeed did see him? For it saw the face of Moses in glory, but it received a veil, but it did not go up the mountain, and therefore it went astray. He who saw Moses alone could not at the same time see the Word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
