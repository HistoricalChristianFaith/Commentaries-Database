[[commentary]]
quote='''
That Canaanite woman recognized this mystery, to whom it is said: No one takes the children's bread and casts it to the dogs. She recognized that this bread is not the bread which is seen, but that which is understood, and therefore she answered: Yes, Lord; for even the little dogs eat of the crumbs that fall from their masters' table. These crumbs are from that bread. And because the bread is the word, and faith is of the word, the crumbs are as it were certain doctrines of the faith. Hence the Lord answered, to show that it was faithfully spoken: O woman, great is your faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
