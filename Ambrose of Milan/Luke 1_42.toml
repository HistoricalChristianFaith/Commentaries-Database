[[commentary]]
quote='''
She who had hid herself because she conceived a son, began to glory that she carried in her womb a prophet, and she who had before blushed, now gives her blessing; as it follows, And she spake out with a loud voice, Blessed art thou among women. With a loud voice she exclaimed when she perceived the Lord's coming, for she believed it to be a holy birth. But she says, Blessed art thou among women. For none was ever partaker of such grace or could be, since of the one Divine seed, there is one only parent.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are you among women, and blessed is the fruit of your womb. And whence is this to me, that the mother of my Lord should come to me?

The Holy Spirit knows his own speech and never forgets it, and prophecy is fulfilled not only by the wonders of events but also by the propriety of words. Who is this fruit of the womb but he of whom it was said: Behold, the inheritance of the Lord, sons; the reward, the fruit of the womb? That is: the sons are the inheritance of the Lord, who are the reward of that fruit, of him who came forth from the womb of Mary. He is the fruit of the womb, the flower of the root, of whom Isaiah prophesied well, saying: A rod shall come forth from the root of Jesse, and a flower shall rise up from the root; for the root is the family of the Jews, the rod Mary, the flower of Mary Christ, who, like the fruit of a good tree, according to the progress of our virtue now flowers, now bears fruit in us, now is restored by the resurrection of the body living again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
