[[commentary]]
quote='''
And therefore the righteous man said: And now what is my expectation? Is it not the Lord? And my substance is before you. Our hope and patience is Christ; he himself has become our redemption, he himself is our expectation, so that each of us may say: Waiting, I waited for the Lord, and he regarded me. Regard us, then, in your judgement; let your mercy look upon us, so that we who distrust our own merit may be delivered through your mercy, in whose power is the substance of our soul and life. And therefore let us not fear the death of the body, but him who can either save or destroy our soul, whose substance is virtue, which God poured into human breasts after his own likeness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
