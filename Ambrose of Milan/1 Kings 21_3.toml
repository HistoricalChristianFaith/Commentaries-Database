[[commentary]]
quote='''
We have heard the voice of the rich man asking for another's property; let us hear the voice of the poor claiming his own. May God forbid, he says, that I give thee the inheritance of my fathers, as if he thinks the rich man's money a sort of contagion to him, as if he should say: "Keep thy money to thyself, to perish with thee, but I cannot sell the inheritance of my fathers." You have what you may follow, O rich man, if you are wise, so that you may not sell your fields for a night with a prostitute, that you may not transfer your right for the expenses of reveling and the costs of pleasures, and that you may not stake your house at a game of dice, lest you may lose your right of hereditary piety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 3"
