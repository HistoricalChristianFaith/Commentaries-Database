[[commentary]]
quote='''
Not without reason, then, were the pillars of the whole earth moved when the chief priests did not believe; but the old ones were moved so that the new might be established, as he himself deigned to say: I have established its pillars. Hear which pillars he has established: Peter and James and John, who seemed to be pillars, gave me and Barnabas the right hands of fellowship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 5"
