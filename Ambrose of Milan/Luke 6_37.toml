[[commentary]]
quote='''
He added that one must not judge rashly, lest, while you are yourself conscious of your own offence, you be forced to pass sentence on another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
