[[commentary]]
quote='''
Mercy, then, has been spoken of, but virtue has not one form only. There follows next, by the example of Martha and Mary, the active devotion of the one in works, the religious attention of the other's mind to the Word of God; and this, if it accords with faith, is preferred even to works themselves, according to what is written: Mary has chosen for herself the best part, which shall not be taken away from her. Let us too, then, strive to have what no one can take away from us, so that not a perfunctory but a diligent hearing may be given; for even the seeds of the heavenly Word itself are wont to be taken away if they are sown along the way. Let the desire for wisdom drive you, as it did Mary; for this is the greater, this the more perfect work; and let not the care of ministering turn you away from the knowledge of the heavenly Word, nor should you reproach and judge as idle those whom you see devoting themselves to wisdom; for that peaceable Solomon took her to himself to dwell with him.

Yet Martha is not reproved in her good ministry, but Mary is preferred because she chose the better part for herself; for Jesus abounds in many things and bestows many things. And therefore the wiser chose what she perceived to be the principal thing. Indeed the apostles did not think it best to leave the Word of God and serve tables. But both are tasks of wisdom; for Stephen too, full of wisdom, was chosen as a minister. And therefore let him who ministers defer to the teacher, and let the teacher invite and encourage the one who ministers; for the body of the Church is one, though the members are diverse: each needs the other. The eye cannot say to the hand: I have no need of your work, or again the head to the feet, nor can the ear deny that it is of the body; for even if some members are principal, yet others are necessary. Wisdom is in the head, action in the hands; for the eyes of the wise man are in his head, because he is truly wise whose mind is in Christ and whose inner eye is raised to the things above. And therefore the eyes of the wise man are in his head, but those of the fool in his heel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
The mystical things save and free from death, whereas the moral things are ornaments of comeliness, not aids to redemption. That the mystical surpass the moral the Lord himself also teaches in his Gospel, speaking of Mary, who, sitting at the feet of the Lord, was hearing his word, while Martha was busy about serving and complained that her own sister did not help her in the service of the table: Martha, Martha, Mary has chosen for herself the best part, which shall not be taken from her. If she who was serving Christ at table was not compared with her who longed to hear the word, what worker shall we be able to compare with one zealous for eternal knowledge — yet so that neither faith be lacking to the work of the one, nor, as with Mary, work to the knowledge of the other, lest either the leaves be without fruit or the fruit be left uncovered, without its natural protections, and lie open to injury?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
