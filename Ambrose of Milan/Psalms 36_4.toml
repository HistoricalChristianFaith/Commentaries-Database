[[commentary]]
quote='''
Moreover, he has meditated iniquity on his bed, where he ought to have sought the truth. For on our beds our sins ought to prick us, not be committed by our very sinning there, as the prophet says: What you say in your hearts, be pricked for it also on your beds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
He has stood, he says, in every way that is not good, but he did not hate malice. For not undeservedly does he meditate unjust things who stands in the way of error and loves malice, which he ought to hate. He said more in saying "has stood", as though he had long remained on the way of wickedness in a lasting station; for that man is blessed who has not stood in the way of sinners, not he who does not cease to stand in it. And therefore the first precepts of the holy prophet David are to flee ungodliness, not to stand in sin, to meditate in the Law, that you may understand what things are good, and distinguish the just from the unjust. In all things, then, the root of generation must be watched, lest a useless sap infect it from the beginning; and the vices of minds are much more grievous than those of young shrubs. We must beware above all, then, lest the habit of malice grow into the human character and every age that follows degenerate; for a tree, indeed, that is bad bears bad fruit. For if often we do what we do not wish and cannot avoid it, and do what we hate, bound either by some delight in outrage or by the stealthy approach of sin, how can we avoid what we love? We are bound even when unwilling; how can we not be held when willing? Paul scarcely freed himself from errors, wrestling in a daily struggle, so that, stripped of the chains of captivity, he might be saved by the grace of Christ; and do you think that by standing by your sins you can attain to the merit of the heavenly promises? The crown is sought by wrestling, not by wrestling against it; it is gained by zeal, not by opposition. Even for those who contend the support of the divine mercy must be asked, that the crown of righteousness may be bestowed for the merit of their labours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
