[[commentary]]
quote='''
Let them recognize the fact, therefore, that this is the result of divine precept and of celestial operation, for the Lord addresses Job from the clouds, saying, among other things, this, also, about the barrier of the sea: ‘I set my bounds around it and made it bars and doors, and I said: “hitherto thou come and shalt go no further, but on thyself shall be broken thine own waves.”’ Do we not ourselves often see the sea billowing so that its waves rise up ‘like a sheer mountain of water,’ when it breaks its force in foam against the shore, beaten back by what might be called the barriers of the low-lying sandy beach, according to what the Scripture says: ‘Will you not then fear me, saith the Lord, who has set the sand a bound for the sea?’ Thus the violent onslaught of the sea is held in check by the most unstable of all things, ordinary coarse sand of the seashore. The waves recoil and are guided to their prescribed bounds by a command from heaven, and the violent movement of the water is broken by meeting itself. It then departs in receding ripples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
