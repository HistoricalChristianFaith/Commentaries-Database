[[commentary]]
quote='''
For the things that are left here perish, and they cannot profit the dead man. So the deceased had anxiety from them; he could not find rest, he who left behind what he would blush at and did not take with him what he might hold, far unlike the one of whom it is written: Blessed is the man who has filled his desire from these; he will not be put to shame when he speaks to his enemies in the gate. He whose inheritance is the Lord, and whose reward is from the childbearing of the Virgin Mary, is proclaimed at his departure with the praises of wisdom, since he had nothing to blush at, he who coveted nothing of the things that belong to the world, but, having put off the cast-off skin of the old man, wounded the adversary with the dart of continence, so that at the end of this life the adversary could not clamour against him, lamed by the wound and confounded by admiration of his virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
