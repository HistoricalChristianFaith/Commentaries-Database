[[commentary]]
quote='''
The flesh and the soul can also be seen, separated from the smell, touch and taste of luxury, dividing themselves in one house against the vices that assail them, flesh and soul subjecting themselves to the law of God, withdrawing from the law of sin. Although their dissension through the transgression of the first man turned into nature, so that they in no way agreed with equal zeal for virtue, yet through the cross of the Lord Savior, with both the enmities and the law of commandments made void, they came together into the concord of fellowship, after Christ, our peace, coming down from heaven, made both one and broke down the middle wall of partition, the enmities in his flesh, making void the law of commandments in decrees, that he might create the two in one new man, making peace, and reconcile both to God in one body. Who are the two, except the one inner, the other outer? The one looks to the vigor of the soul, the other relates to the sense of the body, although they agree in the harmony of an inseparable affection, when the flesh, subjected to the better, obeys its saving commands; not that it migrates into the nature of the soul, its matter poured over into fineness. But because, having renounced delights and been cleansed from every stain of the vices, it walks the path of heavenly conduct with a disposition of obedience, no longer, as before, fighting against the law of the mind, but freed through the law of the mind and the spirit of life from the law of sin, so that the flesh becomes an appendage of the soul, no longer the procuress of the vices but a kind of emulator and, as it were, handmaid of virtue,

and again, when the soul does not connive at the enticements of the body nor is overcome by delight in carnal pleasures, but the mind, pure and stripped of servitude to this world, entices and draws the senses of the body into its own pleasures, so that through the practice of hearing and reading it feasts on the increase of virtue and is satisfied with the spiritual nourishment of an inner sap, never to know hunger; for reason is the food of the mind and an excellent nourishment of sweetness. It does not burden the members, nor does it turn them into the shameful things of nature, but into ornaments, when the wallowing-place of lusts is changed into a temple of God and the lodging-house of vices begins to be a sanctuary of virtues. This surely happens when the flesh, returned to its nature, recognizes the nurse of its vigor and, laying aside the audacity of contumacy, is joined to the judgment of the governing soul, such as it was when it received the secret places of paradise to dwell in, before, infected with the venom of the pestilent serpent, it came to know a sacrilegious hunger and, through eagerness of gluttony, passed by the memory of the divine precepts which clung to the senses of the soul.

From here sin is said to have flowed, as from the body and the soul as its parents. While the nature of the body is tempted, the soul, in ill health, suffers with it. Had it reined in the appetite of the body, the origin of sin would have been extinguished at its very birth; but the soul, steeped with it as though it had been poured in by a virile motion of the body, its own vigor also corrupted, heavy with burdens not its own, brought it forth. For that more violent and stronger sex is borne along by a kind of powerful impulse, like a virile affection; she strives to hold to a reason gentler rather than more vehement. From these, therefore, the motion of diverse desires grew up.

But when the soul returns to herself, confronted with shame at her misshapen offspring, she abjures her degenerate heirs, disowning the motions, loathing the sin. The flesh too, bankrupted by the principal of heavy labors and wearied by the interest of a miserable injury, when it grieves that it has been pierced by its own desires, which it begot for itself, as by the briars of the world, hastens to put off the old man, so as to take itself away from itself, lest a succession doomed to perish leave its improvident parent destitute. Again, the irrational motion of the desires, enticing her with the allurements of pleasure as with the painted comeliness of some beauty, took her to itself as if for partnership. Thus pleasure, as a kind of daughter-in-law of the body and the soul, marries the motion of depraved desire.

So, as long as an undivided and inseparable consent remained in one house, with the vices conspiring together, there seemed to be no division. But when Christ sent upon the earth the fire with which to burn up the sins of the flesh, or the sword which signifies the edge of drawn power, by which the secrets of the spirit and of the marrow are pierced, then the flesh and the soul, renewed by the mysteries of regeneration, forgetting what they were, begin to be what they were not, and separate themselves from the fellowship of the old vice, though it was dear to them before, and cast out, as it were, the union with a prodigal posterity, so that the parents are divided against the children, while the intemperate motion is disowned by the temperance of the body, and the soul declines partnership in guilt, and no place remains for that pleasure, alien and taken in from outside.

The children also are divided against the parents, while the old vices shun the aged censure of the renewed man, and the more youthful pleasure flees the rule of dutiful love as it would the discipline of a serious household. Nor is it incongruous if we think that these too divide themselves so that they may become better than their parents, especially since he has said in what follows: if anyone comes to me and does not hate father or mother and children and brothers and sisters, even his own soul, he cannot be my disciple. And therefore, according to the simple form of understanding, the son who follows Christ is put before Gentile parents; for religion surpasses the duties of dutiful love.

That too according to a higher interpretation, because sin is born of the flesh and works as if in the womb of the flesh, of which the Apostle says: but if I do what I do not will, it is no longer I that work it, but the sin that dwells in me. When the blood of the Lord, poured out for the life of this world, has abolished the vices, it is turned from offense into grace — for sin abounded, that grace might abound the more — and it comes about that repentance, arising from sin, drives on to conversion of purpose and to the desire of spiritual grace. And so what was for me unto death will be unto salvation. So sin, washed away by the flowing water of the font, is separated from the flesh from which it was begotten, and, while each one desires to redeem his offense, out of the chain of guilt there comes a zeal for discipline.

The concupiscence of evil things also, and a certain more fervent motion of desire, is poured over by the word of God into an appetite for divine charity and love, and in the same nature there comes to be a different discipline, and that appetite of body and soul acquires for itself a pleasure in the heavenly mysteries much better than before. For the mind is nourished by the knowledge of things, and, having learned the promise of things to come, raised higher, it disdains the old works of the soul; the natural man indeed does not perceive the things that are of the Spirit of God, for it is foolishness to him; but the spiritual man judges all things, and he himself is judged by no one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
