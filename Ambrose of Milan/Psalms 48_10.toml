[[commentary]]
quote='''
Hence the prophet said fittingly: According to your name, O God, so also is your praise unto the ends of the earth; your right hand is full of your righteousness. It is no wonder if he who is the right hand of God is full of the righteousness of God. And the same one is the power of God and the righteousness of God, so that, inasmuch as he is full of the righteousness of God, you may know that in him is that fullness of righteousness which the Father has; and inasmuch as he is read to be the power and righteousness and wisdom of God the Father, you may understand that nothing of the divine majesty is divided in him, but may recognize that the Son has received all things from the Father, and that the Son is the radiance of all the Father's glory and the stamp of his substance, who has so expressed the Father that the whole Father is in him, as the whole Son is in the Father.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
