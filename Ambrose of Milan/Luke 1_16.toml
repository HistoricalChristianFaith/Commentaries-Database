[[commentary]]
quote='''
Indeed many he says of the sons of Israel he shall turn to the Lord their God. We need no testimony that Saint John turned the hearts of very many. In this the prophetic and evangelical Scriptures support us — the voice indeed of one crying in the desert: Prepare the way for the Lord, make straight his paths — and the baptisms thronged by the peoples declare that the progress of the converted people was not small, because while John is believed, Christ is believed. For it was not of himself but of the Lord that the forerunner of Christ preached.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
