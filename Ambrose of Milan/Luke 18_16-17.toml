[[commentary]]
quote='''
Let the children come to me and do not forbid them; for of such is the kingdom of God. Yet this age is weak in strength, feeble in understanding, immature in counsel. Age, then, is not preferred to age; otherwise it would harm us to grow up. What need is there of prayers that the maturity of years should follow, if it is to take away from me the merit of the heavenly kingdom? Did God, then, give the progress of life for vices, and not for the growth of virtue? And why did he himself choose apostles not of childish but of more advanced age? And why does he say that children are fit for the kingdom of heaven? Perhaps because they do not know malice, do not know how to defraud, do not dare to strike back, know nothing of searching out wealth, and do not covet honor or ambition. But virtue is not to be ignorant of these things but to despise them, nor is there praise for continence where integrity comes from weakness. So it is not childhood that is meant, but a goodness that emulates childlike simplicity. For virtue is not to be unable to sin, but to be unwilling, and so to hold to perseverance of will that the will imitates infancy, and practice imitates nature. Accordingly the Savior himself expressed this, saying: Unless you are converted and become like this child, you will not enter the kingdom of heaven.

Who, then, is the child to be imitated by the apostles of Christ? Is it one of the little ones? Is this, then, the virtue of the apostles? Who, then, is the child? Is it not perhaps he of whom Isaiah says: A child is born to us, a son is given to us? For he, the child, said to you: Take up your cross and follow me. And that you may recognize the child: When he was reviled, he did not revile in return; when he was struck, he did not strike back; for this is perfect virtue. So in childhood too there is a certain venerable old age of character, and in old age an innocent childhood; for venerable old age is not that of long duration, nor reckoned by the number of years; but men's understanding is gray hair, and an unspotted life is the age of old age. Hence it is also written: Praise the Lord, you children, praise the name of the Lord, because no one but the perfect praises the Lord; for no one, indeed, says Lord Jesus except in the Holy Spirit.

This seems to have been prophesied of the people of the Church, which, though younger, went before the older people of the Jews in the pursuit of virtue. And therefore that saying: Behold I and my children whom you have given me. These are the children who, accompanying the Lord with prophetic cries as he rode upon the colt of an ass, said that the redemption of the Gentiles had come; these are the children, or infants, who sucked with a fuller draught those breasts of Christ that are better than wine; for out of the mouth, indeed, of infants and sucklings you have perfected praise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
