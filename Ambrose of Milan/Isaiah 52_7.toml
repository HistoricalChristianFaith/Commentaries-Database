[[commentary]]
quote='''
Know yourself, therefore, and the beauty of your nature, and go out as one freed from the bonds of the feet, and stretched forth with bare footstep, so that you do not feel the coverings of the flesh: let not bodily bonds entangle the footstep of your mind, so that your foot may appear beautiful. For such are those who are chosen by the Lord to announce the kingdom of heaven, of whom it is said: How beautiful are the feet of those who bring the good news of peace (Isa. 52:7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"


[[commentary]]
quote='''
How beautiful are the feet of those who bring the good news of peace, who bring the good news of good things (Isa. 52:7)! Surely he calls beautiful the advances of the preaching and the discourse of the Gospel, as it is said elsewhere: Pass over the rivers (Isa. 47:2), that is, run across the streams and slippery places of this world with a steady pace of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
