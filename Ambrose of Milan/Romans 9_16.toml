[[commentary]]
quote='''
And it is a splendid mystery that the Law was not full enough to persuade the peoples and to call the nations, or because it was to be closed until the coming of Christ, who, expounding to us the prophetic oracles and bringing forth the testimonies of the old reading, opened, as it were, a kind of mouth of the Law, so that the cry of faith might reach the whole world. Hence Sarai too says mystically: the Lord has shut me up, so that I do not bear. Go in, then, to my handmaid, and you shall have a son from her, so that you may recognize that the Church of God was always in predestination, and the fruitfulness of faith ready to burst forth when the Lord should command, but reserved by the will of the Lord for a fixed time. Thus it is written: in an acceptable time I have heard you, and in the day of salvation I have helped you. We observe, then, that the faith of the Church was hastening, but her fruitfulness was shut up. By this word it is shown that she was awaiting the times of her bearing, because what is shut up is wont to be opened. For what reason it was shut up the Apostle teaches you, saying: for God has shut up all things in unbelief, that he may have mercy on all, so that the grace should be not of him who wills nor of him who runs, but of God who has mercy, lest you should justify yourself, but that you should ascribe all things to God, who called you. Let no one, then, grow sluggish and put forward an excuse for his sloth, so as to believe the later, because it is written that it is not of him who wills, nor of him who runs; for let him consider what has been added: but of him who has mercy he says, of God. Show yourself such, then, by good pursuits and ready faith, that God may have mercy on you and call you, as he called the Church, saying: I was made manifest to those who did not seek me, I appeared to those who did not ask about me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
