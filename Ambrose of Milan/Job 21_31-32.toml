[[commentary]]
quote='''
What can be rendered to him worthy of his deserts? He is brought into the sepulchres and keeps watch in his own tomb. Not even this is a moderate punishment, not to have the rest of death, to be carried not to the land of the living, but to the tombs of the dead. For he who lives is not sought among the dead, but in the bosom of Abraham enjoys eternal life. And therefore those two men in shining garments said to the women: Why do you seek the living with the dead?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
