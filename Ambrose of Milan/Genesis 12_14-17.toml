[[commentary]]
quote='''
Hence the Egyptians, seeing her, who could neither discern nor recognize the beauty of virtue, judging her by common opinion, brought her in to the tyrant, that is, to the proud mind, which did not bear the weight of wisdom and was therefore afflicted. For when the word of virtue has entered a wicked soul, it convicts it, affects it with shame for its guilt and error, and torments it with grief for its fall. For while we are in some lust for sinning, the mind is covered over with certain clouds of folly, and its eyes are darkened by a kind of smoke of iniquity, so that it does not see the ugliness of the things it desires; but when every cloud has passed and the splendour of wisdom has shone out again, heavy torments are exercised in a kind of secret chamber of the guilty conscience. And so our mind is a sterner judge through the guilt of conscience and the judgement of repentance. But if, either sick through guilt or feeble through infirmity, it has not been able to bear and endure the presence of virtue, it sends her away and banishes her from itself, and does not suffer her to be turned over within it and to cleave to its thoughts. And as weaker eyes shrink from the light, so a feeble mind does not bear the brightness of wisdom. Such were the minds of the Gerasenes, who asked the Lord Jesus to pass out of their borders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 4"
