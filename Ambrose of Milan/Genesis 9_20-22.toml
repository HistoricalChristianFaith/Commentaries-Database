[[commentary]]
quote='''
By the eyes, then, lust is roused, but by drunkenness it is set ablaze; and every drunkard and fornicator shall become poor. Nor should you flatter yourself on your power of drinking. Noah was made drunk, and he who was not made drunk by the flood was made drunk by wine. But he did not know the nature of wine, for he had not drunk before: you have learned in him what you ought to beware of. Lot was deceived through sleep; and you, if you do not wish to be deceived, shake off the sleep of your mind, lest a son mock you when drunk or a daughter when asleep. It is not piety that is laughed at there, but drunkenness; nor is it a father who is cheated there, but a sleeper. Do you wish not to be scorched? Do not go near the fire. Do you wish not to be cast headlong? Flee what totters, beware of steep places, turn aside from what is falling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
