[[commentary]]
quote='''
Everyone serves who does not have the authority of a pure conscience; whoever is either broken by fear, or ensnared by pleasure, or led by desires, or exasperated by indignation, or cast down by grief, serves. For every passion is slavish, since he who commits sin is the slave of sin, and, what is worse, he who is subject to vices is the slave of many. He has bound himself over to many masters, so that he is scarcely allowed to get out of slavery. But he who is the arbiter of his own will, the judge of his counsel, the interpreter of his choice, who restrains the appetite of bodily passion, who does well what he does — and acting well he acts rightly, and he who acts rightly acts without fault and blamelessly, having power over his own acts — he surely is free. For he who does all things prudently and as he wills, he alone is free. It is not a chance condition that makes a slave, but shameful folly. Indeed, a prudent servant rules foolish masters, and their own slaves will lend to masters. What will they lend? Not money, certainly, but wisdom, as the Law also says: you will lend to many nations, but you will not borrow. For the Jew lent to the proselyte the oracles of the divine Law; but because he himself could not see the mysteries of the Law and did not know the oracles he had, he who lent the letter to the Gentiles now borrows from them the grace of spiritual teaching, and rightly he has been subjected to slavery, since he who borrows is a slave, as if bound over to the interest of his creditor, while he who imparts the interest of devout teaching is a prince, as the Law says: you will be prince of many nations, but there will be no princes over you from among them. For he is a prince who rules and who holds the principate of wisdom. The Jewish people held it, but since it could not keep what it taught, it must learn what it did not know how to teach.

This, then, is what the patriarch Isaac says: you will serve your brother. But it will be when you have put down and loosed his yoke from your neck, signifying that there would be two peoples, one the son of the bondwoman, the other of the free woman — for the letter serves, grace is free — and that the people which attends to the letter would be a slave so long as it follows the interpreter of spiritual teaching. Then too would come about what the Apostle says: that a remnant may be saved according to the election of grace. You will serve your brother, therefore, but you will feel the benefit of slavery when you begin to obey your brother willingly rather than under compulsion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 3"
