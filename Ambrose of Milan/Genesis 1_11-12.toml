[[commentary]]
quote='''
‘Let the earth,’ He said, ‘bring forth the green herb after its kind.’ All things which are referred to as growing in the earth begin with a seed. When it has emerged a little it becomes a green shoot, then a stalk, and finally bears fruit. There are growing plants which spring from the root, such as trees which are not sown from seed, but grow from the roots of other trees. We see in the case of a reed how at its base there emerges from its side a sort of bulb from which other seeds germinate. There is in the root, therefore, something which has the potency of a seed. There are grafted plants, too, which germinate higher up. Hence, some plants reproduce themselves from the root; others are reproduced in diverse ways. For in every growing thing there is either a seed or something which has the power of a seed. These plants follow their kind, so that what emerges from them is similar to what has been sown or like those from whose roots they germinate. As examples we can point to the fact that wheat produces wheat and that from millet comes millet; again, the pear tree with its white flowers produces pears, and the chestnut trees springs from the root of the chestnut.

‘Let the earth,’ He said, ‘bring forth the green herb after its kind.’ And forthwith the earth in labor brought forth new plants; girding herself with the garments of verdure, she luxuriated in fecundity, and decked in diverse seedlings, she claimed them as her own fitting adornments. We marvel at the speed of that productivity. How many more wonders appear, if you examine each plant, noticing how the seed when laid in the earth decays and, if it did not die, would bear no fruit; but when it decays, by that very act of death, arises to bear fruit in greater abundance. The pliable sod receives, then, a grain of wheat; the scattered seed is controlled by the use of the hoe and mother earth cherishes it in firm embraces to her breast. When that grain decays, there comes the pleasing aspect of the green burgeoning shoot, which immediately reveals its kind from its similarity to its own seed, so that you may discover the nature of the plant even in the very beginning of its growth, and its fruit, too, is made evident to you. Gradually, it grows so as eventually to attain full maturity and height. At the point when the jointed stalk emerges, sheaths for the grain to come are being prepared. Within these the grain is being formed, so that cold may not cause injury to the plant in its tender beginnings, or the heat of the sun burn it, or the cruel violence of the wind and rain beat it to the ground. In addition, the ear of wheat has wonderfully formed rows both pleasing in appearance and made for the protection of the plant, resulting from their naturally interwoven texture which is the creation of divine Providence. Moreover, in order to serve as a support for and to offset the weight of a more abundant number of ears, the stalk itself is enclosed in what may be termed sheaths, so that by its reinforced strength it can sustain manifold grains of wheat and that it may not be bent towards the earth because of its inability to bear its burden. Then, over the ear is erected a rampart in the form of a beard, so that a line of defense may be extended to protect the ear from injury from the attacks of little birds, by which means the wheat grain is keep intact from the devastation of their claws.

What shall I say of the kindness of God in providing things useful for the human race? The earth returned with interest what it had received, even with compound interest! Men often deceive and often defraud the money-lender of his just due. But the earth remains faithful to promises and, if at time it does not pay back, if, perchance, severe cold or extraordinary dry weather or tremendous rain storms bring disaster, the losses of a single year are counterbalanced by the year which follows. And so, when the harvest belies the hopes of the farmer, in no way does the earth forsake him. Again, when she smiles on him, fertile Mother Earth pours forth her offspring, so that she never incurs a loss to her creditors.

When the land, in fact, is completely stocked, how can we, if we are to rely on our tongue, satisfactorily describe the pleasant sights and scents and the joys of the countryman? But we have the testimony of the Scripture, wherein we note that the delights of the countryside are compared to the blessing and grace of the saints, for Isaac, a holy man, says: ‘The smell of my son is the smell of a plentiful field.’

How can I describe the violets with their shades of purple, the lilies of brilliant white, and the roses with their shades of red? How describe the landscape painted with flowers, sometimes of a golden hue or of varied colors or of bright yellow, among which you cannot decide whether their beauty or their fragrant scent gives more delight. Our eyes revel in this pleasant spectacle as that fragrance which fills us with its sweetness is spread far and wide. Whence the Lord has justly said: ‘And with me is the beauty of the field.’ This beauty is with Him because He has created it. What other artist could so depict such charm in each and every object?

‘Consider the lilies of the field,’ what brilliance in their petals, how they appear to arise in packed rows all the way to the top so as to form a goblet! Note how within it gleams like gold, and, furthermore, how around its edge as a defense against any injury a kind of rampart is constructed! If any one were to pluck this flower and take each petal apart, what craftsman’s hand is so expert as to be able to restore the form of the lily? Who is such an effective imitator of nature as to presume to reconstruct this flower, to which the Lord has so borne testimony as to say: ‘Not even Solomon in all his glory was so arrayed like one of these’? A king so rich and wise was deemed inferior to the beauty of this flower!

Why should I enumerate the health-giving juices of herbs or the remedies provided by shrubs and leaves? When a stag is sick, he eats the branches of the olive tree and becomes well. The leaves of the olive, too, cure the locusts of illness. The application of the leaves of a bramble to a serpent bring about his death. Gnats will not trouble you if you anoint yourself with wormwood which has been cooked in oil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
Perhaps someone might say: How does the earth produce seed according to its kind, when often the seed sown degenerates and, although good wheat was sown, the result is a wheat plant of a quality inferior in color and in form? If this ever happens, one should not attribute this deterioration to a change of species, but rather, it seems, to some inferiority or some disease in the seed. It does not cease to be wheat if it has been blighted by frost or mildewed by rain. It has been changed in appearance rather than in kind, and also in color as a result of the corruption it has undergone. Hence, it frequently happens that mildewed grain returns to the appearance of its stock, if it is exposed to the heat of the sun or of fire, or if it is entrusted to careful cultivators, who cherish it by protecting it from inclemencies of climate and foster it in soil that is fertile. In this way, what has suffered degeneration in the parent stock is restored in the next generation. Hence, there is no danger that the precept of God, to which nature has accustomed itself, may become void in future time by a failure of propagation, since today the integrity of the stock is still preserved in the seeds.

We know that cockle and the other alien seeds which often are interspersed among fruits of the earth are called ‘weeds’ in the Gospel. These, however, belong to a special species and have not degenerated into another species by a process of mutation from the seed of the wheat plant. The Lord told us that this is so when He said: ‘The kingdom of heaven is like a man who sowed good seed in his field, but while men were asleep, his enemy came and sowed weeds among the wheat.’ We gather from this that weeds and wheat certainly seem to be distinct both in name and in kind. Hence, the servants, too, said to the householder: ‘Sir, didst thou not sow good seed in thy field? How then does it have weeds? He said to them: “An enemy has done this.”’ One is the seed of the Devil; the other, that of Christ which is sown in accordance with justice. Therefore, the Son of Man sowed one and the Devil sowed the other. For that reason the nature of each is distinct, since the sowers are opposed. Christ sows the kingdom of God, whereas the Devil sows sin. How, therefore, can this kingdom be of one and the same race as sin? ‘This is the kingdom of God,’ He says, ‘as though a man should cast seed into the earth.’

There is a Man who sows the word, of whom it is written: ‘The sower sows the word.’ This Man sowed the word over the earth when He said: ‘Let the earth bring forth the green herb,’ and immediately the seeds came to birth and diverse were the species of things which shone forth in brilliance. At this point the fields in their beautiful green color furnished abundance of food; the yellowing ears of wheat in the fields suggested an image of the billowing sea in the waving of that rich harvest in the breeze. Of itself the earth brought forth profusely all kinds of fruits. Although it could not be ploughed in the absence of a cultivator—for the farmer had not yet been created—the earth, though unplowed, teemed with rich harvests, inasmuch as an indolent husbandman did not have occasion to defraud the earth of its abundance. For each plant attains fertility according to the merits of the labor involved in the cultivation of the fields. Punishment is meted out for our neglect or remissness if the soil be deprived of its rich abundance either by flood or aridity, the fall of hailstones or by some other misfortune. Then, too, the earth everywhere brought forth spontaneously fruits of the soil, because He who is the fullness of the universe had so ordained it. The word of God fructified on the earth and the earth had not, because of any curse, suffered condemnation. The origins and birth of the world are more remote than our sins and more recent than our error, because of which we have been condemned ‘to eat bread in the sweat of our face,’ and without sweat to be incapable of sustaining life.

Even today the fertility of the earth carries into effect its age-old fecundity by exercise of spontaneous growth, for you see how many plants are still grown without being sown. But even in much that is gathered by the labor of our hands there still remains a large part of our produce which, by the kindness of Providence, comes without effort to us while we are at rest. This we are taught by the reading of the Gospel before us, wherein the Lord says: ‘This is the kingdom of God, as though a man should cast seed into the earth, then sleep and rise night and day and the seed should sprout and grow without his knowing it. For of itself the earth bears the crop, first the blade, then the ear, then the full grain in the ear. But when the fruit is ripe, immediately he puts in the sickle because the harvest has come.’ Therefore, while you are asleep, man, and without your knowing it, the earth of itself produces its fruits. You fall asleep and then rise, marveling how the grain has increased in the course of one night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
We have often spoken concerning the green herb; now let us discuss the plant that bears fruit according to its kind, ‘which may have seed in itself.’ ‘He spoke and they were made,’ and immediately the earth was adorned with groves as formerly it had been decked with flowers and with the verdure of the grass of the fields. The trees were assembled; the forests arose and the peaks of the hills were clothed with leaves. Here the pine and there the cypress raised aloft their towering heads; the cedars and the pitch-pines gathered in groups. The fir tree also advanced in procession, a tree which was not satisfied to have its roots in the earth and its head on high, but was destined, while mariners are safe, to undergo perils from wind and wave on the sea. The laurel, too, gave forth its scent as it rose, a shrub never to be denuded of its foliage. There arose, also, the shady evergreen oak, destined to preserve its shimmering even in winter time. For nature maintained in every case through future ages the prerogatives which had been impressed on it at the moment of Creation. Hence, the evergreen oak and the cypress adhere to these prerogatives, so that no wind may despoil them of the adornment of their locks.

Mingling formerly with the flowers of the earth and without thorns, the rose, most beautiful of all flowers, displayed its beauty without guile; afterwards, the thorn fenced around this charming flower, presenting, as it were, an image of human life in which what is pleasing in our activities is often accompanied with the stings of anxieties which everywhere surround us. In fact, the elegance of our life is entrenched and hedged about by certain cares, so that sadness is close neighbor to beauty. Hence, when each one of us find joys either in the pleasing exercise of our reason or in the attainment of more than usual success in life, it is fitting that we should call to mind this sin of ours, by means of which there was imposed upon us by rightful condemnation the mind’s thorns and the spirit’s brambles, when we were happily sojourning amid the delights of paradise. Although you may shine, man, with the splendor of nobility or by reason of your superior power or by the brilliance of your virtue, the thorn is ever close to you, the bramble is ever near you. Ever be mindful of what is beneath you. You blossom into life above a thorn and this beauty does not last for long. In a brief passage of time each and every one of us withers in the flower of his age.

In truth, while you realize that you possess frailty in common with the flowers, you know that you have access to delight in the.use of the vine, from which is produced wine, wherein the heart of man finds cheer. Would that, man, you could imitate the example of this species of plant, so that you may bear fruit for your own joy and delight. In yourself lies the sweetness of your charm, from you does it blossom, in you it sojourns, within you it rests, in your own self you must search for the jubilant quality of your conscience. For that reason He says: ‘Drink water out of thine own cistern and the streams of thine own well.’

First of all, there is nothing more pleasing than the scent of a blossoming vine. Furthermore, the juice when extracted from the flower of this vine produces a drink which is pleasurable and health-giving. Again, who does not marvel at the fact that from the seed of the grape springs forth a vine that climbs even as high as the top of a tree? The vine fondles the tree by embracing and binding it with the tentacles of its hands and arms, clothes it with vine leaves, and crowns it with garlands of grapes. In imitation of our life, the vine first plants deep its living roots; then, because its nature is flexible and likely to fall, it uses its tendrils like arms in order to hold tight whatever it seizes. By this means it raises itself and lifts itself on high.

Similar to this vine are the members of the Church, who are planted with the root of faith and are held in check by the vine-shoots of humility. On this subject the Prophet beautifully says: ‘Thou hast brought a vineyard out of Egypt: thou plantest the roots thereof and it filled the land. The shadow of it covered the hills and the branches thereof the cedars of God. It stretched forth its branches unto the sea and its boughs unto the river.’ And the Lord Himself spoke through Isaias, saying: ‘My beloved had a vineyard on a hill in a fruitful place. And I fenced it in and dug around the vine of Sorech and I built a tower in the midst thereof.’ He fenced it in with a rampart, as it were of heavenly precepts and with the angels standing guard, for ‘the angel of the lord shall encamp round about them that fear him.’ He placed in the Church a tower, so to speak, of Apostles, Prophets, and Doctors, ready to defend the peace of the Church. He dug around it, when He had freed it from the burden of earthly anxieties. For nothing burdens the mind more than solicitude for the world and cupidity either for wealth or for power.

There occurs an example of this in the Gospel, where we can read the story of the woman ‘who had sickness caused by a spirit, and she was bent over, so that she was unable to look upwards.’ Bent over, in fact, was her soul, which inclined to terrestrial rewards and possessed not heavenly grace. Jesus beheld her and addressed her; immediately she laid aside her earthly burdens. These people also were burdened with these cupidities to whom He addressed these words: ‘Come to me, all you who labor and are burdened and I will give you rest.’ And so the soul of that woman breathed once more and stood erect like a vine around which the soil has been dug and cleared.

But the same vine, after the soil has been cleared around it, is raised up and bound, so that it may not bend back towards the ground. Some of the shoots are pruned; others are allowed to grow. Those branches which grow in aimless profusion are pruned; those which the good cultivator reckons to be productive are permitted to grow. What need is there to describe the rows of stakes and the orderly process of binding the vine shoots? These operations teach us truly and clearly that equality should be observed in the Church, so that no man of wealth and high position should exalt himself and that no one who is poor and lowly should despair. Liberty is one and the same for all members of the Church; all men possess justice and favor in an impartial manner.

For that reason the tower is placed in the middle, to serve all around as an example of those countrymen and those fishermen who deserved to hold fast the fort of virtue. By their example our courage is aroused and is not permitted to lie mean and despised on the ground. Rather, each and every one of us has his mind raised aloft to higher things so that he dares to say: ‘But our citizenship is in heaven.’ Hence, to prevent it from being bent and battered by the storms and tempests of the world, the vine holds in the embrace of love, by means of those tendrils and bonds of which we spoke, all that are near and finds rest in being joined with them. That is love, therefore, which binds us with things on high and plants us in heaven. Because ‘he who abides in love, God abides in him.’ Hence the Lord also says: ‘Abide in me and I in you. As the branch cannot bear fruit of itself unless it remain on the vine, so neither can you unless you abide in me. I am the vine, you are the branches.’

It seems clear, therefore, that the example of the vine is designed, as this passage indicates, for the instruction of our lives. It is observed to bud in the mild warmth of early spring and next to produce fruit from the joints of the shoots, from which a grape is formed. This gradually increases in size, but it still retains its bitter taste. When, however, it is ripened and mellowed by the sun, it acquires its sweetness. Meanwhile, the vine is decked in green leaves by which it is protected in no slight manner from frosts and other injuries and is defended from the sun’s heat. Is there any spectacle which is more pleasing or any fruit that is sweeter? What a joy to behold the rows of hanging grapes like so many jewels of a beautiful countryside, to pluck those grapes gleaming in colors of gold or purple!

You may notice that hyacinths and other gems are brilliant in color, how indigo gleams and how beautifully the pearl shines; still, you do not derive a warning from this, man, that your last day on earth should not find your fruit unripened or that the completion of your time of life should show but slight achievement. Unripened fruit is often bitter in taste. It cannot be sweet until it has grown to perfect maturity. A man perfect in this manner will not ordinarily be harmed by the cold of dread death nor by the heat of the sun of iniquity, because a spiritual grace overshadows him, quelling the fires of cupidity for the things of this world and defending him from the lusts and the burning desires of the flesh.

Let them praise you who behold you and let them admire the marshaled bands of the Church like the serried rows of vine branches, let everyone among the faithful gaze upon the gems of the soul, let them find delight in the maturity of prudence, in the splendor of faith, in the charm of Christian affirmation, in the beauty of justice, in the fecundity of pity, so that it may be said of you: ‘Thy wife is a fruitful vine on the sides of thy house,’ for the reason that you imitate by the exercise of your abundant and generous giving the plenteous return of a fruit-bearing vine.

But why do I linger in describing just the vine, when all species of trees have their utility? Some are created to provide fruit; others are granted for our use. Those which are not overproductive of fruit are nevertheless more valuable for the uses they serve. The cedar is suitable for constructing the roof of a house, because its material is of such a kind as to furnish both spacious length for the roof and a quality of lightness for the walls. For the construction of rafters and the adornment of the pediments the most adaptable wood is that of the cypress. Hence, the Church, too, tells us in the Canticles: ‘The beams of our houses are of cedar, our rafters of cypress trees.’ These words point to the beautiful adornments of its pedimental structure, which, as beams do, uphold by their excellent qualities the superstructure of the Church and give charm to its façade.

The laurel and the palm are emblems of victory. The heads of victors are crowned with laurel; the palm adorns the victor’s hand. Hence, the Church, too, says: ‘I said: I will go up into the palm tree, I will take hold of the heights thereof.’ Seeing the sublimity of the Word and hoping to be able to ascend to its height and to the summit of knowledge, he says: ‘I will go up into the palm tree,’ that he may abandon all things that are low and strive after things that are higher, to the prize of Christ, in order that he may pluck its fruit and taste it, for sweet is the fruit of virtue.

Again, what shall we say of the poplar, a tree that provides shade for victorious crowns and for binding vines a flexible shoot. What other mystical meaning has this, if not to stand for the goodness of the bonds of Christ? These bonds do not hurt—they are the bonds of grace and of love, so that every person should glory in his bonds as Paul gloried in them when he said: ‘Paul, a prisoner of Jesus Christ.’ When bound in these same bonds, those of self-denial and of love, he said: ‘Who shall separate us from the love of Jesus Christ?’ When bound also by these same bonds, David has said: ‘On the willows in the midst thereof we hung up our instruments.’

The box-wood tree, because of its light material, trains the child’s hand when it is used for forming the outlines of the letters of the alphabet. Hence Scripture says: ‘Write upon box,’ in order that you may be admonished by the wood itself (which is an evergreen and is never devoid of foliage) never to be deprived of the support of your hope, but rather that the hope of salvation may be generated by faith.

Why should I enumerate the great variety of trees, their particular diversities and beauties? Why speak of the wide-spreading beech tree, the slender fir, the leafy pine tree, the shady evergreen oak, the two-colored poplar, the chestnut that loves the groves and ever tends to sprout again as soon as it is cut down? Why relate how in the trees themselves one can determine whether the tree is old or young? In the younger trees the branches are rather slender; in the older they are strong and gnarled; in the former, the leaves are smoother and are far apart; in the latter the leaves are rougher and more shriveled. There are trees which, because their roots are old and completely dead, are unable, if perchance they are cut down, to reproduce themselves; others show a vigorous youth and a more productive nature; a thorough pruning is conducive to profit rather than to harm, so much so that they shoot forth anew and renew themselves in so many offshoots for generations.

There is another occasion for us to marvel at the fact that there is sex even in fruit and distinction of sex in trees. You may notice how the palm tree which produces dates often reaches towards and bends beneath that tree which country children call the male palm, presenting in this act a spectacle of one eager for an embrace. That palm tree is female and betrays her sex by her appearance of subjection. Hence, cultivators of groves inject into its branches the seed of dates or of male palm trees, by which is infused into that tree what may be called a sense of its function and sweetness of a desired marital embrace. After the performance of this rite it once more rises up and lifts its branches and elevates its foliage into their former state and condition.

There is similar belief regarding the fig tree. For this reason many are said to plant the wild fig tree beside the cultivated and productive tree, because the fruit of the prolific cultivated fig tree, due either to wind or to heat, is said to fall to the ground. Hence, those acquainted with this method remedy this weakness on the part of the productive fig tree by binding it to the fruit of the wild fig, so that the cultivated tree is able to retain its own fruit, which would at any moment be likely to fall if this remedial procedure were not followed.

From this mystery of nature we are admonished not to shun those who have been separated from our faith and from association with us. And so a Gentile who was converted can be all the more a passionate defender of the faith as he was formerly strong in upholding his error. And if one is a convert from heresy, he can be a stout supporter of that new faith to which he has turned after a change in his convictions. Especially will this be true if he has been gifted by nature to give vivid expression to his opinions and if he finds support in his own moral tendencies toward temperance and chastity. Be lavish, therefore, in your attentions to him, in order that you may, like the productive fig tree, strengthen your own virtue as a result of the presence and juxtaposition of that other uncultivated tree. For in this way your moral purpose may not be weakened and the fruit of your zeal and grace will be preserved.

How many examples there are of phenomena wherein a natural hardness can be controlled by careful attention to detail in the art of cultivation. Frequently, pomegranates blossom quickly, but are unable to bear fruit without the careful application of remedial methods in the hands of experts, when, as often happens, the juice disappears within the fruit, although it presents a healthy appearance externally. This phenomenon can not without reason be compared to the Church, to which it is applied in the words of the Canticle: ‘Thy cheeks are as a piece of a pomegranate,’ and further on: ‘If the vineyard flourish, if the pomegranates flourish.’ For the Church presents to our eyes the brilliance of faith and man’s adherence to it—the Church, enhanced by the blood of so many martyrs and by what is more valuable still, by the blood of Christ; at the same time, in the possession of this pomegranate she preserves and includes in one protecting shell plenteous fruit within, involving manifold acts of virtue: the wise man conceals in his heart the good work he performs.

It is said also that fruit growers apply remedial methods of this sort to the almond tree so as to render sweet the bitterness of its fruit. They bore a hole in the root of the tree and insert in the middle of it a shoot of that tree which the Greeks call πεύκη and which we call the pitch-pine. When this is done, the bitter taste of its juice disappears.

Accordingly, if the qualities of plants are changed by the process of agriculture, is it not possible to allay any sort of infirmity of the passions by a striving after knowledge and learning? Let no one, then, who is allured by youthful intemperance despair of his conversion. Wood frequently is turned to better uses; cannot the hearts of men be likewise changed?

We have shown that there exist different species of fruit among trees of diverse nature and likewise that the same kind of tree often produces fruit of a dissimilar character. The male species produces one kind, while the female furnishes us with another—facts which we have already discussed in a preceding chapter in connection with dates.

Who can comprehend the variety, the appearance, and the delightful qualities of fruits, the usefulness of each and every product of the soil, and the peculiar sap which seems appropriate to each one; furthermore, how fruits of a rather bitter taste serve as medicine to heal our ailing stomachs by allaying swelling and rawness within; again, how the unhealthy humors of the body are modified by the sweet quality inherent in fruits?

Hence, that art of medicine is older which can cure by the use of herbs and juices. No condition of health is founded on a firmer basis than that which is acquired by the aid of health-giving nourishment. Wherefore, following the guidance of nature we are led to believe that food is our sole medicine. It is certain that open sores are closed by the use of herbs; our internal ills are cured by herbs. For this reason physicians need to know the efficacy of herbs, for from this source the practice of medicine took its rise.

But to return to a discussion of the ordinary fruit: some there are which are ripened directly by the sun; others reach maturity enclosed in a shell and hull. Apples, pears, and the various species of grape are all exposed naked to the sun. Walnuts and hazelnuts as well as the kernel of the pine-nut, although covered with a shell and hull, are nourished by the heat of the sun. However deeply the kernel of the pine-nut lies buried, it still is nourished by the sun’s heat.

Such, then, is the providence of the Lord that, wherever the fruit is of a softer quality, there the thickness of the leaf presents in defense of the fruit a stouter protective covering, as we see, for example, in the fruit of the fig tree. The more delicate fruits, therefore, need a stronger defense, as the Lord Himself teaches us, speaking through the mouth of Jeremias: ‘Like these good figs, so will I regard the captives of Juda, whom I have sent forth out of this place into the land of the Chaldeans for their good. And I will set my eyes upon them for their good.’ For He surrounded His precious ones, as it were, with a stouter covering of His mercy, lest the tender fruit should perish before its time. And so, too, He says of them in a later passage: ‘My delicate ones have walked rough ways.’ To these He speaks further on: ‘Be constant, my children, and cry to the Lord.’ Against all storms and injuries this is the sole and inviolable protection and impenetrable defense.

Where, therefore, there is tender fruit, there is found a thicker covering and protection furnished by the leaves. On the other hand, where the fruit is sturdier, there the leaves are more delicate, as we see in the case of the apple tree. In the case of the sturdier apple there is not much need for protection to aid it, for the very thickness of the protective shade would serve rather to bring injury to its fruit.

Then, again, the beauty of nature and the profound mysteries of divine wisdom are manifested to us by the leaf of the vine. We note that it is so divided into parts as to present the appearance of three leaves. The middle part is so distinct that it seems to the onlooker to be a separate piece, were it not for the fact that it forms a juncture with the lower parts. This seems to follow a natural principle in that it both admits the sunlight more easily and furnishes shade. Then, the middle part of the leaf extends itself and becomes more narrow at the top as it grows, so that it offers more natural beauty than protection. For this reason it seems to present the form of the prize of a victor at the games, indicating that the grape holds the first place among the other species of hanging fruit. By the silent judgment of nature and, furthermore, by its clear decision the grape comes into being as the natural form and emblem of victory. The vine leaf, therefore, carries its prize with it, inasmuch as it furnishes defense for itself against the inclemencies of the air and the violence of storms, while at the same time it presents no obstacle to the reception of the sun’s heat from which the grape receives warmth and coloring, growth, and increase.

The fig leaf, too, not unlike the vine leaf, is divided into four parts. This fact appears all the more clearly because of its larger leaf, although its extremities have not the pointed character of the vine leaf. Whereas the leaf of the fig is stronger and thicker, that of the vine presents a more elegant form. The thickness of the fig leaf serves to ward off injury due to storms, while its cleft nature permits the fruit to profit from warmth. Again, this species of fruit feels the force of hail storms less, but reaches maturity quicker, because it seems to hide away from injuries and at the same time to lie open to fostering influences.

Why should I describe the different kinds of leaves, how some are round and others, longer; how some are flexible and others, more rigid; how some leaves do not fall readily, no matter how strong the wind, and how others are shaken off even by a slight motion of the wind?

It would be an endless task to inquire into the properties of each and every thing, either to distinguish diversities by presenting clear evidence for such or to reveal by unfailing proof concealed and hidden causes. For example, water is one and the same substance, yet it often changes into various forms. Water assumes a yellow color in sand; it becomes foamy amid rocks. It has a green aspect in the midst of groves and presents various colors in a region of flowers, becoming brighter among lilies and ruddier amid roses. Water in a grassy region is clearer, but more turbid in marshy places. At its source a stream is more limpid, while sea water is darker. We see, therefore, that water assumes the color of the places through which it flows.

In like manner, too, water undergoes changes due to temperature: in heated places it becomes hot, in shady regions it becomes cool; when exposed to the sun, water acquires excess of heat; when snow falls, it assumes a white color in the form of ice. And what a change takes place in its very taste; at one time it is somewhat sharp, at another somewhat bitter; at times it is rather harsh, at times somewhat tart, and then again rather sweet. These variations are due to the qualities of the substance with which water has been mixed. It becomes bitter because of the infusion of immature juices, as when the shells of nuts are pounded and when leaves are disintegrated. Water becomes bitter by the infusion of wormwood, becomes stronger from an admixture of wine and more tart when garlic is added; it becomes heavy or sweet as the result of the addition of poison or honey. In fact, if the mastick tree and the fruit of the turpentine tree or the kernel of nuts are infused with water, the resulting mixture can readily take on the filmy nature of oil.

While water supplies nourishment to all plants, it contributes in diverse ways its useful quality to each. If it waters the roots or rains on them from the clouds, it confers distinct strength to all: the root grows in size, the trunk is enlarged, the branches are extended, the leaves become green, the seeds are nourished, and the fruit is likely to increase in number. And so, although water is the nurse of all things, the sap of some species of tree as a result its activity is made somewhat bitter; another becomes sweeter; still others become either sluggish or quick in action. In their quality of sweetness, too, plants manifest differences one with the other. The vine has one type of sweetness, the olive, another; there is a difference between the cherry and the fig; the apple has a distinctive quality and the date is different from the rest.

Even to the touch waters appear at one time smooth, at another, rough. They often give the impression of having oil on their surfaces. Water differs, too, in weight as frequently as in appearance, for in many places it is considered somewhat heavy; in other places, light. No wonder, therefore, if water, while it presents differences in itself, varies also in respect to the quality of the gum of the trees which is generated by the intake of the same water.

The gum of the cherry tree differs in quality from that which exudes from the mastick tree. Also, it is known that the sweet-smelling woods of the Orient distil a drop of balsam of unlike nature. The twigs of the fennel in Egypt and in Libya exude also by some secret process of nature a distinct kind of gum. Why should I relate to you, without burdening you with my discourse, the fact that amber is something which exudes from a shrub and that the gum hardens to form a solid mass of such precious material? This account is supported by evidence of no inconsiderable value, since leaves or very small fragments of twigs or certain tiny species of insects are often found in amber. The drop of amber while still in a more fluid state seems to have laid hold of these objects and to have retained them when the material had solidified.

But why do I with my indifferent discourse vie with the high and priceless principles of nature, since this discourse springs from the human intellect, whereas divine Providence has created the nature of all things? Hence, the reins of my diffuse discourse should, as it were, be checked, lest I may seem to usurp the wisdom divinely conferred on Solomon in the Scriptures in expounding the ‘diversities of plants and the virtues of roots and all such things as are hid and not foreseen.’ Yet, these things were not revealed by him in a clear light. In my opinion he would very likely have been able to discourse on the various species of plants, yet he would not have been able to expound fully the nature of all created things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
But if the harvests are often more joyous as a result of a plentiful supply of water, if the leguminous plants become green and the manifold beauty of gardens is roused and revivified; if the banks of overflowing rivers become resplendent with their verdant cushions, how much more effective is the Word of God than any water course in causing every plant suddenly to burst into flower! Then the plains hastened to bring forth fruit not entrusted to them, gardens were supplied with all manner of vegetables hitherto unknown, and flowers began to germinate in a marvelous manner. The banks of streams began to vest themselves in myrtle. The trees made haste to rise; quickly they clothed themselves in flower, furnishing sustenance for men and food for animals. Fruit became the common property of all; its enjoyment is offered to all. A twofold gift is presented by trees: at one and the same time we are granted nourishment for our bodies and a means of warding off the sun’s rays in the cool of their shade; the fruit provides food and the leaves give us occasion for enjoyable living.

However, because the providence of the Creator foresaw that man in his greed would claim the fruit especially for himself, He took care that the rest of living creatures would be given their special nourishment. And so food of no inconsiderable amount was provided for them from the leaves and bark of forest trees. What would avail for medical purposes was provided for both equally: that is, the sap, gum, and young shoots of plants. Hence, the Creator has commanded from the beginning to come forth from the bowels of the earth by the might of His providence those plants which we have later by experiment, use, and example found to be useful, for God destined them for the purpose for which they were adapted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
‘Let the earth bring forth,’ God said, and immediately the whole earth was filled with growing vegetation. And to man it was said: ‘Love the Lord thy God,’ yet the love of God is not instilled in the hearts of all. Deafer are the hearts of men than the hardest rock. The earth, in compliance with its Author, furnishes us with fruit which is not owed to us; we deny the debt when we do not give homage to the Author.

Behold the providence of God in little things and, because you are unable to comprehend it, marvel at the fact that He has kept some plants always in foliage while He desired that others undergo changes by being deprived of their vesture. The earth preserves its verdure amid the white snow and the cold hoar frost, and, although hidden in ice, its offspring still preserve no slight trace of their viridity.

Those species of trees, also, which are clothed in evergreen foliage have not inconsiderable differences. The olive and the pine always preserve their vesture. Nevertheless, they change their leaves frequently, displaying them, not as something permanent, but as successive adornments of their tree. The apparently unbroken nature of their garb they thus dissimulate by such an interchange. Again, the palm remains always green by reason of the retentive and enduring qualities of its foliage, not because of any change. For the leaves which it first produced continue to perpetuate themselves without recourse to substitution.

Imitate the palm, man, so that it may be said also to you: ‘Thy stature is like a palm tree.’ Preserve the verdure of your childhood and of that natural innocence of youth which you have received from the beginning, and may you possess the fruits, prepared in due time, of what was planted along the course of the waters—and may there be no fall to your leaf!

To this verdure of grace everflourishing in Christ the Church refers in saying: ‘I sat down under his shadow whom I desired.’ The Apostles received this privileged gift of verdure, whose leaves could never fall, so as to provide shade for the healing of the sick. Their fidelity of heart and the superabundance of their merits provided shade for bodily infirmities. Remain, therefore, planted in the house of the Lord so as to flourish like a palm in His halls, whence the grace of the Church may ascend for you and ‘the odor of thy mouth may be like apples and thy throat like the best wine,’ so that you may be inebriated in Christ.

This verse serves to remind us that we should take up once more our subject wherein it was stated that the vine, too, blossomed forth by the command of God. This vine, we know, was planted by Noe after the flood. We read, in fact, that ‘Noe, a husbandman, began to till the ground and planted a vineyard and drank of his wine and slept.’ Noe, therefore, was not the author of the vine, but of its planting, for he could not have planted it unless he had already found it fully grown. He is just the cultivator, therefore, of the vine. Its Author, God, who knew that wine fostered health and sharpened wits when taken sparingly, but led to vice if used immoderately, has given us this plant in the act of creation. Excess of wine He set aside as an exercise for man’s will to the extent that nature’s parsimony might inculcate in him the lesson of sobriety and that man might ascribe to himself the harm due to excess and the sin of intoxication. In fact, Noe himself was intoxicated and slept under the influence of wine, so we see that he who attained to such glory through the flood exposed himself to unsightliness because of his misuse of wine. But the Lord has retained in the vine the privileges due to His creation, so that He converted its fruit for our salvation and made it possible that remission of our sins should emerge from this plant.

Hence, Isaac spoke reverently when he said: ‘The smell of Jacob is the smell of a plentiful field,’ that is, a natural odor. For what is sweeter than a plentiful field, what is more delightful than the perfume of the vine, what is more pleasing than the blossom of the bean? Hence, before us a certain writer has ingeniously said: ‘The patriarch did not perceive the odor of vine or fig or fruit, but he breathed the perfume of virtue.’ I for my part hold to the following interpretation: the odor of the land, unmixed and pure, infused not with guile, but with the truth of celestial indulgence, stands for the beauty of a prayer which blesses. Hence, what the Lord confers on us from the dew of heaven so as to give strength to the vine, to the olive and to the grain may be reckoned among our most precious benedictions.

To Him be honor, praise, and glory everlasting, from the beginning of time, now, always, and for ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
