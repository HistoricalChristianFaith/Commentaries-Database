[[commentary]]
quote='''
Peter, then, when betrayed, denies — for let us suppose that Peter denied, because the Lord said: You will deny me three times, and I would rather that Peter denied than that the Lord was mistaken —; what did he deny? What he had promised incautiously. He considered his devotion, he did not look to his condition, and he was punished, because he said he would lay down his life, which belongs not to human weakness but to divine power. Since he paid so heavy a fine for an imprudent word, how great is the penalty of unbelief!

Where, though, does Peter deny? Not on the mountain, not in the temple, not in his own house, but in the praetorium of the Jews, in the house of the chief of the priests. There he denies, where truth is not; there he denies, where Christ was seized, where Jesus was bound. Why should he not go astray, whom the doorkeeper let in, and the doorkeeper of the Jews questioned? Wrongly did Eve lead Adam on, wrongly did a woman bring Peter in; but the one falls in paradise, where the fault was not pardonable, the other in the praetorium of the Jews, where innocence was hard. To the one the fall was forbidden, to this one the error was foretold. That fall, once committed, prejudged the case for this one; this error undid that one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
