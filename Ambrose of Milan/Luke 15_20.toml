[[commentary]]
quote='''
He runs then to meet thee, because He hears thee within meditating the secrets of thy heart, and when thou wert yet afar off, He runs lest any one should stop Him. He embraces also, (for in the running there is fore-knowledge, in the embrace mercy,) and as if by a certain impulse of paternal affection, falls upon thy neck, that he may raise up him that is cast down, and bring back again to heaven him that was loaded with sins and bent down to the earth. I had rather then be a son than a sheep. For the sheep is found by the shepherd, the son is honoured by the father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
This within himself; but it is not enough to say it unless you come to the father. Where are you to seek him, where to find him? Rise first, that is, you who before were sitting and sleeping. And therefore the Apostle says: rise, you who sleep, and arise from the dead. Iniquity sits on a talent of lead. But to Moses too it is said: but you, stand here. Christ chose those who stand. Arise therefore, run to the Church; here is the Father, here is the Son, here is the Holy Spirit.

He runs to meet you, he who hears you pondering within the secret places of your mind. And while you are still far off, he sees and runs up. He sees into your heart, he runs up lest anyone hinder you, he embraces you too. In the running to meet there is foreknowledge, in the embrace clemency and, as it were, a kind of affection of fatherly love. He falls upon your neck, to raise you up as you lie, and to turn back toward heaven, in which you may seek your Author, the one burdened with sins and bent down toward earthly things. Christ falls upon your neck, to strip your nape of the yoke of servitude and to hang his sweet yoke upon your neck. Does he not seem to you to have fallen upon John's neck, when John was in the bosom of Jesus, reclining with his neck bent back? And therefore he saw the Word with God, because he was raised up toward things above. He falls upon the neck when he says: come to me, you who labor, and I will refresh you; take my yoke upon you. He falls, then, in this way, if you turn back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
