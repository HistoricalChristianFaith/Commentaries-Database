[[commentary]]
quote='''
Mindful, then, of his gift, which he willed to be immortal for the just, if sin had not crept in, and a grievous sin, which made it not expedient to live long, he says to Abraham: but you shall go to your parents in peace, nourished in a good old age. He allows us to depart from this world, so that by the withdrawal of the soul this body may be dissolved into its own earth and there may be an end of sin, and then that it may be formed anew through the resurrection by the grace of the divine generosity. And therefore he says to Abraham: you shall go to your fathers. Some have thought that the fathers are the elements of which our flesh consists while we live, and into which we are dissolved. But we, who remember that our mother is Jerusalem, which is above, which is free, which is the mother of all of us, as the Apostle says, assert that those are the fathers who went before in merit and in order of life. There was Abel, the devoted victim; there was the devoted and holy Enoch; there was Noah: to them Abraham's passage is promised. For he passes over who, departing from this life, migrates to another life, the life which the mind of the wise and just man lives, who is nourished in peace; for the foolish man is nourished in war and in discords, the just man lives in a good old age. He did not say 'long' but good, because the just man grows old well, but none of the unjust does, though he should live a longer life than the long-lived stags. For to live long is common to the wise and the foolish, but to live well is proper to the wise man, whose old age is venerable, and the age of old age is a spotless life, not a lengthy one he says, nor reckoned by the number of years, nor by grey hairs on the head, but by understanding. He, then, grows old well who has understood well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 9"
