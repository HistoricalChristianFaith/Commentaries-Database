[[commentary]]
quote='''
The moral teacher who gives himself an example to others, when about to enjoin upon others, that he who has not left father and mother, is not worthy of the Son of God, first submits Himself to this precept, not that He denies the claims of filial piety, (for it is His own sentence, He that knoweth not his father and mother shall die the death,) but because He knows that He is more bound to obey His Father's mysteries than the feelings of His mother. Nor however are His parents harshly rejected, but the bonds of the mind are shown to be more sacred than those of the body. Therefore in this place He does not disown His mother, (as some heretics say, eagerly catching at His speech,) since she is also acknowledged from the cross; but the law of heavenly ordinances is preferred to earthly affection.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Therefore he whose portion is God ought to care for nothing but God, lest he be hindered by the duty of some other necessity. For whatever is given to other duties is plucked away from the worship of religion and from this office of ours. For this is the true flight of the priest: the renunciation of his household and a kind of estrangement from those dearest to him, so that he who longs to serve God denies himself to his own. Rightly, then, did the sanction of the eternal Law commend fugitives to fugitives, so that those who have forgotten this world should receive those who, condemning their sins and their works, seek forgetfulness of their former life and desire to wipe out the worldly things they have done. The minister of his holy altar, therefore, is a fugitive from his own. Hence the Lord, as the prince of priests, giving a pattern to the Levites in his Gospel, said: Who is my mother, or who are my brothers? That is: I do not acknowledge a mother, I do not recognize brothers, I do not know my kin. My mother and my brothers are these who hear the word of God and do it. The minister, therefore, knows only the word of God, since he knows those in whom the word of God is at work. And therefore he is an exile from the world: a fugitive from the body, a fugitive from the passions, he renounces all things, so that he may remain alone, as Elijah said: And I am left alone. But he was not alone, with whom Christ was. And the Lord himself was left alone, but I am not he says alone, because the Father is with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 2"
