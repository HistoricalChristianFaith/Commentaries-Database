[[commentary]]
quote='''
The beauty of a good thing pleases the more, if it be shown under various aspects. For those are good things, whereof the texture of the priestly robe was the token, that is to say, either the Law or the church, which latter has made two garments for her spouse, as it is written—the one of action, the other of spirit, weaving together the threads of faith and works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25202.html'
source_title="Exposition of the Christian Faith 2, INTRODUCTION 11"

[[commentary]]
quote='''
The garment of wisdom is of those vestures which wisdom has made for herself from fine linen and purple, that is, the raiment of faith consists of the preaching of heavenly things and of the blood of our Lord's passion. By the fine linen are indicated heavenly things, and under the symbol of purple is declared the Mystery of the Sacred Blood by which the Kingdom of Heaven is conferred. Finally, the preceding words indicate that the garment of wisdom is signified, for he began first saying: Be wise, my son, that thy heart may rejoice, and two verses below he says, for the imprudent passing on suffer loss. Take off thy garment. Take it off, lest you suffer the loss due to your folly, lest that most wicked and common usurer, seeing you stripped of your own garment, should attempt to reveal the confusion of your shame and should persuade you to cover yourself with leaves, and lest seeing yourself naked you should fear to come into the sight of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 20"
