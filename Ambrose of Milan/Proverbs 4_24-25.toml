[[commentary]]
quote='''
Hence we too, if we wish to be among good things after the death of this body, should take care that our soul is not glued to this body, not mixed with it, not clinging to it, not dragged by the body, and does not, as if drunk with its disturbances, stagger and waver; nor should it entrust itself to the body and to its delights so as to commit itself to its senses. For its eye too is error and fraud, because the sight is deceived, and its ear is deception, because the hearing too is mocked, and its taste is deception. Indeed, it was not said idly: Let your eyes see right things and: Let your tongue not speak perverse things. This would not have been said unless they often erred. You saw a harlot, you were captivated by her face and thought her form comely: your eyes erred, they saw perverse things, they reported something other than it was. For if they had seen truly, they would have seen the harlot's ugly feeling, the bristling wantonness, the unseemly shamelessness, the withering lusts, the foul filth, the wounds of the mind, the scars of the conscience. He who has looked he says on a woman to lust after her. You see that he sought what was false who sought not truth but adultery. For he sought to see in order to lust, not in order to know what is true. The eye errs, then, where the feeling errs. Feeling, then, is a deception: a deception of the sight (and therefore it is said to you: Nor be caught by the eyes, that is, let not your soul be caught; for a woman captures the precious souls of men), a deception of the hearing. Indeed, the fornicating woman has often seduced, deceived and mocked a young man's heart with much flattery of speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"
