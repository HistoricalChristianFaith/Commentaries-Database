[[commentary]]
quote='''
In fact, the Magdalene is reproved, who wept for Christ as though he were dead and sought him as though buried in the tomb. Hence Christ says to her: Mary, why do you weep? Whom do you seek? Surely not one who could be taken away? She heard his voice and recognized him and wished to touch him, and the Lord said: Do not touch me, whom you think dead; I am going to the Father. Do you wonder that you did not find in the tomb him whom heavenly things await? Or perhaps she is reproved because nothing but perfect faith touches Christ, as the woman with the issue of blood touched him with full faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
