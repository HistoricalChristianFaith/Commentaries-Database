[[commentary]]
quote='''
But as she had spent all her substance upon physicians, so the Gentile nations had lost all the gifts of nature.

Now hearing that the people of the Jews were sick, she begins to hope for the remedy of their salvation; she knew that the time was arrived when a Physician should come from heaven, she rose to meet Him, more ready from faith, more backward from modesty. For this is the part of modesty and faith to acknowledge weakness, not to despair of pardon. From modesty then she touched the hem of His garment; in faith she came, in piety believed, in wisdom knew herself to be healed; so the holy people of the Gentiles which believed God, blushed at its sins so as to desert them, offered its faith in believing, showed its devotion in asking, put on wisdom in itself feeling its own cure, assumed boldness to confess that it had forestalled what was not its own. Now Christ is touched behind, as it is written, Thou shall walk after the Lord thy God (Deut. 13:4.)

For they believe not who throng Him; they believe who touch. By faith Christ is touched, by faith He is seen. Lastly, to express the faith of her who touched Him, He says, I know that virtue is gone out of me, which is a more palpable sign, that the Divine Nature is not confined within the possibility of man's condition, and the compass of the human body, but eternal virtue overflows beyond the bounds of our mediocrity. For the Gentile people is not released by man's aid, but the gathering of nations is the gift of God, which even by its little faith turns to itself the everlasting mercy. For if we think what our faith is, and understand how great the Son of God is, we see that in comparison of Him we touch only the hem, we cannot reach the upper parts of the garment. If then we also wish to be cured, let us touch by faith the hem of Christ. But he who has touched Him is not hidden. Happy the man who has touched the extreme part of the Word. For who can comprehend the whole?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But why is Christ touched from behind? Is it because it is written: you shall walk after the Lord your God? What, too, is the meaning of this, that the ruler's daughter of twelve years was dying and this woman had suffered from a flow of blood for twelve years, unless it be understood that as long as the synagogue flourished, the Church was afflicted? The failing of the one is the strength of the other, because by their offence, salvation for the Gentiles; and the completion of the one is the beginning of the other, not the beginning of nature but of salvation, because blindness in part has befallen Israel, until the fullness of the Gentiles should come in. Not in time, then, but in the appearance of health the synagogue was older than the Church, because as long as the synagogue believed, the Church did not believe, and through the various sufferings of body and soul lay sick and languishing, with a remedy that could not heal. She heard that the people of the Jews was sick, she began to hope for the remedy of her own salvation, she knew that the time had come when the Physician would be present from heaven; she rose to go to meet the Word, she saw that he was being pressed by the crowds; for those who press do not believe, those who touch believe. By faith Christ is touched, by faith Christ is seen; he is not touched with the body, he is not grasped with the eyes; for he does not see who seeing does not see, nor does he hear who does not understand what he hears, nor does he touch who does not touch with faith. Indeed, to express the faith of the one who touched, he says: someone touched me; for I perceived that power had gone out from me.

This is a mark of clear evidence that wisdom was not shut up within the possibility of the human condition and within the confinement of the body, that the divinity was not constrained; it is not contained by bodily narrowness, it is not held, but the eternal power overflows beyond the bounds of our mediocrity. For the people of the Gentiles is not set free by human help, but the gathering of the nations is the gift of God, and even by a brief faith it bends eternal mercy. Now if we consider how great our faith is, and understand how great the Son of God is, we see that in comparison with him we touch only the fringe, but cannot reach the upper part of his garment. If, then, we too wish to be healed, let us touch the fringe of Christ by faith.

Whoever touches the fringe, whoever touches him from behind, does not escape his notice; for God does not need eyes in order to see, nor does he perceive bodily, but he has in himself the knowledge of all things. Blessed, then, is he who has touched even the last part of the Word; for who can grasp the whole?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
There is also an inner touch, by which she touched Christ in the Gospel who for twelve years had suffered a flow of blood and had not received healing from physicians, but received it from Christ. It is the touch of faith by which Christ is touched. Indeed, men did not see it, but Jesus saw it, and testified that he had seen it, saying: someone has touched me; for I too perceived that power had gone out from me. The knowledge of Christ is the bestowal of health.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
