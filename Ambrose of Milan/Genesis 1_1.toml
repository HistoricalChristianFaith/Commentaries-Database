source_title="The Six Days of Creation"

[[commentary]]
quote='''
In the beginning of time, therefore, God created heaven and earth. Time proceeds from this world, not before the world. And the day is a division of time, not its beginning.

In the course of our account we may affirm that the Lord created day and night, which constitute time changes. And on the second day He created the firmament by which He divided the water which was under the heaven from the water above the heaven. Nevertheless, for our present purposes it is sufficient to assert that in the beginning He created the heaven, from which proceeds the preliminary cause of generation, and created the earth, in which existed the substance of generation.

In fact, with heaven and earth were created those four elements from which are generated everything in the world. The elements are four in number: heaven, fire, water, and earth—elements which are found mingled in all things. You may find fire also in earth, for it frequently arises from stones and iron; you may find it also in the heavens, since it may take fire and the skies may gleam with brilliant stars. In the heavens, too, we can perceive the presence of water, which is either above the heavens or from that high position falls frequently to earth in heavy rainstorms.

We can in many ways demonstrate this, if we observe that these elements are of advantage in the building of a church. But, since it is not profitable to be concerned with this, let us rather turn our attention to those matters which may be fruitful for eternal life.

It is sufficient, therefore, to set forth what we find in the writings of Isaias concerning the nature and the substance of the heavens. In modest and familiar language he described the nature of the heavens when he said that God ‘hath fixed the heavens like smoke,’ desiring to declare it to be not of solid but of subtle nature.

As to its form, what Isaias has said about the firmament of the heavens makes it more than clear that God created ‘heaven like a vault,’ because within the range of heaven all things which move in the sea and land are enclosed. This is the implication, too, of what we read that ‘God stretched out the heavens.’ He stretched it out as you would stretch skins over tents, the dwelling places of the saints, or as a scroll, that the names of many be inscribed therein who merited the grace of Christ by their faith and devotion. To all such it is said: ‘Rejoice in this that your names are written in heaven.’

On the nature and position of the earth there should be no need to enter into discussion at this point with respect to what is to come. It is sufficient for our information to state what the text of the Holy Scriptures establishes, namely, that, ‘he hangeth the earth upon nothing.’

What need is there to discuss whether the earth hangs in the air or rests on the water? From this would arise a controversy as to whether the nature of the air which is slight and yielding is such as to sustain a mass of earth; also, the question would arise, if the earth rested on the waters, would not the earth by its weight fall and sink into the waters? Or would not the waters of the sea give way to the earth and, moved from its accustomed place, would not the sea pour itself over the borders of the land?

There are many, too, who have maintained that the earth, placed in the midst of the air, remains motionless there by its own weight, because it extends itself equally on all sides. As to this subject, let us reflect on what was said by the Lord to His servant Job when He spoke through the clouds: ‘Where wast thou when I laid the foundations of the earth? Tell me if thou hast understanding. Who hath laid the measures thereof, if thou knowest? Or who hath stretched the line upon it? Or upon what are the circles grounded? And further on: ‘I shut up the sea with doors, and I said: Hitherto thou shalt come and shalt go no further, but in thee shall be broken thy waves.’ Does not God clearly show that all things are established by His majesty, not by number, weight, and measures? For the creature has not given the law; rather, he accepts it or abides by that which has been accepted.

The earth is therefore not suspended in the middle of the universe like a balance hung in equilibrium, but the majesty of God holds it together by the law of His own will, so that what is steadfast should prevail over the void and unstable. The Prophet David also bears witness to this when he says: ‘He has founded the earth upon its own bases: it shall not be moved for ever and ever.’ There, certainly, God is asserted to be not merely an artist, but one who is omnipotent, as one who suspended the earth, not from some central point, but from the firmament according to His command, and did not allow it to sway. We ought not to accept the measurement as coming from the center, but as the result of a divine decree, because the measurement is not that of an art, but that of power, of justice and of knowledge. All things do not escape His wisdom as if they were immeasurable, but underlie His knowledge as if they were already measured. When we read: ‘I have established the pillars thereof,’ we cannot believe that the world was supported actually by columns, but rather by that power that props up the substance of the earth and sustains it.

How the disposition of the earth therefore depends upon the power of God, you may learn also where it is written: ‘He looketh upon the earth and maketh it tremble,’ and elsewhere: ‘One again I move the earth.’ Therefore, the earth remains immovable not by its balances, but is moved frequently by the nod and free will of God, as Job, too, says: ‘The Lord shaketh it from its foundations, and the pillars thereof tremble.’ And elsewhere: ‘Hell is naked before him and there is no covering for death. He stretched out the north over the empty space and hangeth the earth upon nothing. He bindeth up the waters in his clouds. The pillars of heaven fled away and are in dread at his rebuke. By his power the seas are calmed, by his wisdom is struck down the sea-monster, and the gates of heaven fear him.’

By the will of God, therefore, the earth remains immovable. ‘The earth standeth for ever,’ according to Ecclesiastes, yet is moved and nods according to the will of God. It does not therefore continue to exist because based on its own foundations. It does not stay stable because of its own props. The Lord established it by the support of His will, because ‘in his hand are all the ends of the earth.’ The simplicity of this faith is worth all the proffered proofs.

Let others hold approvingly that the earth never will fall, because it keeps its position in the midst of the world in accordance with nature. They maintain that it is from necessity that the earth remains in its place and is not inclined in another direction, as long as it does not move contrary to nature but in accordance with it. Let them take occasion to magnify the excellence of their divine Artist and eternal Craftsman. What artist is not indebted to Him? ‘Who gave to women the knowledge of weaving or the understanding of embroidery?’ However, I who am unable to comprehend the excellence of His majesty and His art do not entrust myself to theoretical weights and measures. Rather, I believe that all things depend on His will, which is the foundation of the universe and because of which the world endures up to the present.

For this belief one may find authority also in the words of the Apostle. It is written: ‘For creation was made subject to vanity—not by its own will, but by reason of him who made it subject—in hope,’ because creation itself will also be delivered from its slavery to corruption when the grace of divine reward will shine forth.

Why should I enumerate the theories which philosophers in their discussions have woven concerning the nature and composition of the substance of the heavens?

While some maintain that the heavens are composed of the four elements, others assign the formation of the heavens to what is called a fifth nature of a new body. They conceive this body to be ethereal and unmixed with fire, air, water or earth, whereas the elements of this world have their own special course and customary motion according to nature, the heavier elements sinking downward; the light and rare elements rising upwards. Each of these elements has, in fact, its own proper motion. However, in the circular quality of a sphere these elements are confused and lose the impulse of their course, inasmuch as a sphere is turned around in its orb and hence the elements above change place with the elements beneath and vice-versa. And where these movements have undergone change in accordance with nature, they state that by necessity the quality of the substances therein usually suffers a corresponding change. Well, then, should we defend the theory of an ethereal body, lest the heavens appear subject to corruption?

What is composed of corruptible elements, for example, must of necessity undergo dissolution. This is seen from the fact that these elements are of different nature and cannot have a simple and unalterable motion, since a diverse movement of the elements leads to discord. There cannot be, in fact, one motion appropriate to and in accord with elements that are opposite; what is suitable to the lighter elements does not befit the weightier one. Accordingly, where there is a necessary motion of the heavens upwards, this is weighed down by the terrestrial elements. On the other hand, when there is an impulse to a downward motion, there is fiery opposition from the fiery element, for it is being forced downward contrary to its usual course. Everything which is impelled in a contrary direction does not comply with its nature. Rather, it is quickly dissolved by necessity and is broken up into those parts out of which it seems to be composed, each part returning respectively to its own peculiar place. For this reason, other philosophers, noting that these elements are unstable, have been led to believe that the substance of the heavens and of the stars is ethereal. They introduced what they called a fifth corporeal nature, which they thought was sufficient to give an enduring permanency to the substance of the heavens.

But this opinion could not withstand the words of the Prophet, which the divine majesty of our Lord Jesus Christ, our God, has confirmed in the Gospel. For David has said: ‘In the beginning, O Lord, thou foundest the earth and the heavens are the work of thy hands. They shall perish but thou remainest, and all of them shall grow old as a garment. And as vesture thou shalt change them and they shall be changed. But thou art always the selfsame and thy years shall not fail.’ To such a degree did the Lord confirm this that He said: ‘Heaven and earth will pass away, but my words will not pass away.’

They labor to no purpose who, in order to claim perpetuity for the heavens, have thought it best to introduce the so-called fifth ethereal body, although they can see, as well as I can, that, if an entirely dissimilar part is attached to a body, it usually gives that body a defect rather than otherwise. At the same time, take note that the Prophet David, in mentioning the earth first and after that the heavens, believed that the work of the Lord should be made manifest. When he said: ‘He spoke and they were made,’ it is of no consequence what you assert first, since both were done at the same time, in order to preclude the idea that the heavens may appear to have been given the priority in the divine substance, so as to be considered of more importance by right of primogeniture in the order of created things.

Accordingly, let us leave these men to their contentions, men who contradict themselves by their mutual disputes. Sufficient for our salvation is not disputatious controversy but doctrine—not the cleverness of argumentation, but fidelity of the mind—that we may serve, not a creature, but our Creator, who is God, blessed for all ages.
'''
