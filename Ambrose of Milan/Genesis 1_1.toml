[[commentary]]
quote='''
To such an extent have men’s opinions varied that some, like Plato and his pupils, have established three principles for all things; that is, God, Idea, and Matter. The same philosophers hold that these principles are uncreated, incorruptible, and without a beginning. They maintain that God, acting not as a creator of matter but as a craftsman who reproduced a model, that is, an Idea, made the world out of matter. This matter, which they call ὕλη, is considered to have given the power of creation to all things. The world, too, they regard as incorruptible, not created or made. Still others hold opinions such as those which Aristotle considered worthy of being discussed with his pupils. These postulate two principles, matter and form, and along with these a third principle which is called ‘efficient,’ which Aristotle considered to be sufficient to bring effectively into existence what in his opinion should be initiated.

What, therefore, is more absurd than to link the eternity of the work of creation with the eternity of God the omnipotent? Or to identify the creation itself with God so as to confer divine honors on the sky, the earth, and the sea? From this opinion there proceeds the belief that parts of the world are gods. Yet on the constitution of the world itself there is no small difference of opinion among philosophers.

Pythagoras maintains that there is one world. Others say that the number of worlds is countless, as was stated by Democritus, whose treatment of the natural sciences has been granted the highest authority by the ancients. That the world always was and always will be is the claim of Aristotle. On the other hand, Plato ventures to assert that the world did not always exist, but that it will always exist. A great many writers, however, give us evidence from their works that they believe that the world did not always exist and that it will not exist forever.

How is it possible to arrive at an estimate of the truth amid such warring opinions? Some, indeed, state that the world itself is God, inasmuch as they consider that a divine mind seems to be within it, while others maintain that God is in parts of the world; others still, that He is in both—in which case it would be impossible to determine what is the appearance of God, or what is His number, position, life, or activity. If this evaluation of the world be followed, we have to understand God to be without sense, something which rotates, is round, is aflame, and impelled by certain movements—something driven, not by its own force, but by something external to it.

Under the inspiration of the Holy Spirit, Moses, a holy man, foresaw that these errors would appear among men and perhaps had already appeared. At the opening of his work he speaks thus: ‘In the beginning God created heaven and earth.’ He linked together the beginnings of things, the Creator of the world, and the creation of matter in order that you might understand that God existed before the beginning of the world or that He was Himself the beginning of all things. So in the Gospel, in answer to those who were inquiring of Him ‘Who art thou?’ He replied: ‘I am the beginning, I who speak with you.’ All this was that you might know that He gave to all created things their beginnings and that He is the Creator of the world—not one who imitates matter under the guidance of some Idea, from which He formed His work, not in accordance with His will, but in compliance with a self-proposed model. Fittingly, too, Moses says: ‘In the beginning He created,’ in order that, where He had made clear the effect of the operation already completed, before giving an indication of its having been begun, He might thus express the incomprehensible speed of the work.

Our attention should be drawn to the person who uttered this statement. He was, of course, Moses, a man learned in all the science of the Egyptians. He was rescued from the river by the daughter of Pharao, who cherished him as if he were her own son and desired that he be trained and instructed in all phases of secular learning with aid furnished from the royal treasury. Although he received his name from water, he did not consider as true the hypothesis held by Thales, that all things are derived from water. And although he had been educated in the royal palace, he preferred, because of his love of justice, to undergo voluntary exile rather than, because of his love of justice, to be a servant of sin in the midst of pleasure as a high official at a tyrant’s court. Finally, before he was called to the task of liberating his people, he fell into disgrace, urged on, as he was, by his natural zeal for what is right to the extent of avenging the wrong done to his fellow countrymen. Wherefore, he tore himself away from pleasure and, shunning all the excitement of the royal palace, retired to a secluded spot in Ethiopia. There, removed from all other cares, he gave himself wholly to divine contemplation, in order that he might behold the glory of God face to face. This is in accord with the testimony of Scripture, that ‘there arose no greater prophet in Israel like unto Moses, whom the Lord knew face to face.’ He spoke to God the highest, not in a vision nor in dreams, but mouth to mouth. Plainly and clearly, not by figures nor by riddles, there was bestowed on him the gift of the divine presence.

And so Moses opened his mouth and uttered what the Lord spoke within him, according to the promise He made to him when He directed him to go to King Pharao: ‘Go therefore and I will open thy mouth and instruct thee what thou shouldst speak.’ For, if he had already accepted from God what he should say concerning the liberation of the people, how much more should you accept what He should say concerning heaven? Therefore, ‘not in the persuasive words of wisdom,’ not in philosophical fallacies, ‘but in the demonstration of the Spirit and power,’ he has ventured to say as if he were a witness of the divine work: ‘In the beginning God created heaven and earth.’ He did not look forward to a late and leisurely creation of the world out of a concourse of atoms. He did not await a pupil, so to speak, of matter, who, by contemplating it, could fashion a world. Rather, he thought that God should be declared to be its Author. Being a man full of wisdom, he noticed that the substances and the causes of things visible and invisible were contained in the divine mind. He did not hold, as the philosophers teach, that a stronger conjunction of atoms furnished the cause of their continuous duration. He pointed out that those who give such tiny and unsubstantial first principles to heaven and earth were just weaving a web like a spider’s. How could these be joined together by chance as well as being dissolved in the same planless way, without a firm basis in the divine power of their Ruler? No wonder that they know not their Ruler who know not their God, by whom all things are ruled and governed. Let us follow him who knew both the Author and the Ruler, and let us not be led astray by vain opinions.

‘In the beginning,’ he said. What a good arrangement that he should first assert what these men are accustomed to deny, that they may realize, too, that there was a beginning to the world, lest men be of the opinion that the world was without a beginning. For this reason David, too, in speaking of ‘heaven, earth, and sea,’ says: ‘Thou hast made all things in wisdom.’ He [Moses] gave, therefore, a beginning to the world; he gave also to the creature infirmity, lest we believe him to be without a beginning, uncreated, and still partaking in the divine essence. And fittingly he added: ‘He created,’ lest it be thought there was a delay in creation. Furthermore, men would see also how incomparable the Creator was who completed such a great work in the briefest moment of His creative act, so much so that the effect of His will anticipated the perception of time. No one saw Him in the act of creation; they saw only the created work before them. Where, therefore, was there a delay, since you may read: ‘For He spoke and they were made; He commanded and they were created’? He who in a momentary exercise of His will completed such a majestic work employed no art or skill so that those things which were not were so quickly brought into existence; the will did not outrun the creation nor the creation, the will.

You admire the work, you seek for a Creator who granted a beginning to such a great work, who so speedily made it? He [Moses] gives us the information immediately, saying that ‘God created heaven and earth.’ You have the name of the Creator; you ought not to have any doubts. He it is in whose name Melchisedech blessed Abraham, the forefather of many peoples, saying: ‘Blessed be Abram by the most high God, creator of heaven and earth.’ And Abraham believed God and said: ‘I raise my hand to the Lord God most high, creator of heaven and earth.’ You see that this was not an invention made by man, but an announcement made by God. For God is Melchisedech, that is, ‘He is king of peace and justice, having neither the beginning of days nor end of life.’ No wonder, therefore, that God, who is without end, gave a beginning to all things, so that what was not began to exist. No wonder that God, who contains all things in His power and incomprehensible majesty, created the things that are visible, since He also created those things that are not visible. Who would assert that the visible is more significant than the invisible, ‘for the things that are seen are temporal, but the things that are not seen are eternal’? Who can doubt that God, who spoke by the Prophets, created these things, saying: ‘Who hath measured the waters in the hollow of his hand and weighed the heavens with his palm? Who hath poised with three fingers the bulk of the earth and weighed the mountains in scales and the hills in a balance? Who hath understood the sense of the Lord? Or who hath been his counsellor; or who hath taught him?’ Of Him we also read elsewhere: ‘For he holds the circuit of the earth and made the earth as nothing.’ And Jeremias says: ‘The gods that have not made heaven and earth will perish from the earth and from among those places that are under heaven. He that made the earth by his power and prepared the world by his wisdom and stretched out the heavens at his knowledge and a multitude of waters in the heaven.’ And he added: ‘Man is become a fool for knowledge.’ How can one who pursues the corruptible things of the world and thinks that from these things he can comprehend the truth of divine nature not become a fool as he makes use of the artifices of sophistry?

Since, therefore, so many oracles are heard in which God gives testimony that He made the world, do not then believe that it was without a beginning because the world is said to be, as it were, a sphere in which there would appear to be no beginning. And when it thunders, everything is stirred around about us as if in a whirling movement, so that one cannot easily comprehend either where the vortex begins or where it ends. The reason is this: To perceive by one’s senses the beginning of a circle is considered to be impossible. You cannot discover the beginning of a sphere or from what point the round disk of the moon begins or where it ends in its monthly wanings. Not even if you do not understand it yourself does this phenomenon cease to begin or in any way to come to an end. If you were to draw a circle with ink or pencil or with a compass, you could not easily detect with your eyes or mentally recall after an interval of time the point where you began or where you completed your circle. Yet you are conscious that you made a beginning and also came to an end. The reason is this: What has escaped the senses has not caused the truth to be undermined.

Again, what has a beginning also has an end; it is obvious that which has an end also has a beginning. The Saviour Himself tells us in the Gospel that there is to be an end of the world, saying: ‘For this world as we see it is passing away’; and ‘Heaven and earth will pass away, but my words will not pass away’; and further on: ‘Behold I am with you all days, even unto the consummation of the world.’

How, then, can philosophers maintain that the world is co-eternal with God and make the created equal with the Creator of all things? How can they hold that the material body of the world should be linked with the invisible and unapproachable divine nature?—so much the more, since, according to their own teachings, they cannot deny that an object whose parts are subject to corruption and mutability must as a whole be subject to the same influences which its own separate parts undergo.

Therefore, He who uttered these words, ‘In the beginning God created heaven and earth,’ teaches us that there is a beginning. The term ‘beginning’ has reference either to time or to number or to foundation. We see that this is true in the construction of a house: the foundation is the beginning. We know, too, from the authority of Scripture that one can speak of a beginning of a conversion or of a falling away. The beginning of a work of art lies in the craft itself, which is the source of the individual skills of a series of craftsmen. There is also a beginning to good works. This consists in a most commendable purpose or end, as, for example, acts of charity have their source in deeds which are done to do honor to God, for we are especially urged to come to the aid of our fellow men. The term ‘beginning’ is applied also to the power of God. It is concerned with the category of time when we deal with the question of the time when God made heaven and earth, that is, at the commencement of the world, when it began to come into being, in the words of Wisdom: ‘When he prepared the heaven I was present.’ If we apply the term to number, then it is right that you understand that at first He created heaven and earth; next, hills, regions, and the boundaries of the inhabitable world. Or we may understand that before He created the rest of visible creatures, day, night, fruit-bearing trees, and the various kinds of animals He created heaven and earth. But, if you apply the term to foundation, you will see, if you read the words of Wisdom, that the beginning is the foundation: ‘When he made the foundations of the earth, I was with him forming all things.’

There is also the beginning of good instruction, as it is said: ‘The fear of the Lord is the beginning of wisdom,’ since he who fears the Lord departs from error and directs his ways to the path of virtue. Except a man fear the Lord, he is unable to renounce sin.

In like manner, also, we can understand this statement: ‘This month shall be to you the beginning of months.’ although that statement is to be interpreted merely of time, because there is reference to the Pasch of the Lord, which is celebrated at the beginning of spring. Therefore, He created heaven and earth at the time when the months began, from which time it is fitting that the world took its rise. Then there was the mild temperature of spring, a season suitable for all things.

Consequently, the year, too, has the stamp of a world coming to birth, as the splendor of the springtime shines forth all the more clearly because of the winter’s ice and darkness now past. The shape of the circles of years to come has been given form by the first dawn of the world. Based on that precedent, the succession of years would tend to arise, and at the commencement of each year new seedlings would be produced, as the Lord God has said: ‘Let the earth bring forth the green herb and such as may seed, and the fruit tree, yielding fruit after its kind. And immediately the earth produced the green herb and the fruit-bearing tree.’ By this very fact both the constant mildness of divine Providence and the speed in which the earth germinates favor for us the hypothesis of a vernal period. For, although it was in the power of God to ordain creation at any time whatsoever and for earthly nature to obey, so that amid winter’s ice and frost earth might bear and produce fruits under the fostering hand of His celestial power, He refrained. It was not in His eternal plan that the land held fast in the rigid bonds of frost should suddenly be released to bear fruits and that blooming plants should mingle with frosts unsightly.

Wherefore, in order to show that the creation of the world took place in the spring, Scripture says: ‘This month shall be to you the beginning of months, it is for you the first in the months of the year,’ calling the first month the springtime. It was fitting that the beginning of the year be the beginning of generation and that generation itself be fostered by the gentler breezes. The tender germs of matter would be unable to endure exposure to the bitter cold of winter or to the torrid heat of summer.

At the same time, one may note, since it belongs here by right, that the entrance into this generation and into this way of life seems to have occurred at the time when the regular transition from this generation to regeneration takes place.

The sons of Israel left Egypt in the season of spring and passed through the sea, being baptized in the cloud and in the sea, as the Apostle said. At that time each year the Pasch of Jesus Christ is celebrated, that is to say, the passing over from vices to virtues, from the desires of the flesh to grace and sobriety of mind, from the unleavened bread of malice and wickedness to truth and sincerity. Accordingly, the regenerated are thus addressed: ‘This month shall be to you the beginning of months; it is for you the first in the months of the year.’

The person who is baptized leaves behind and abandons in a spiritual sense that prince of the world, Pharao, when he says: ‘I renounce thee, devil, both thy works and thy power.’ No longer will he serve him, either by the earthly passions of his body or by the errors of a corrupt mind. On this occasion every evil deed of his sinks to the bottom like lead. Protected as he is by good works on his right and his left, he endeavors to cross over the waters of this life with step untainted.

Scripture also says in the book called Numbers: ‘Amalec, the beginning of nations, whose seed will be destroyed.’ And, of course, Amalec is not the first of all nations. Amalec, in fact, is interpreted to mean the king of the wicked and by the wicked it is intended to mean the Gentiles. There is no reason why we should not accept him as one whose seed shall perish. His seed are the wicked and the unfaithful, to whom the Lord says: ‘You are the voice of your father the devil.’

A beginning in a mystical sense is denoted by the statement: ‘I am the first and last, the beginning and the end.’ The words of the Gospel are significant in this connection, especially wherein the Lord, when asked who He was, replied: ‘I am the beginning, I who speak with you.’ In truth, He who is the beginning of all things by virtue of His divinity is also the end, because there is no one after Him. According to the Gospel, the beginning of the ways of God is in His work, so that the race of men might learn by Him to follow the ways of the Lord and to perform the works of God.

Therefore, in this beginning, that is, in Christ, God created heaven and earth, because ‘All things were made through him and without him was made nothing that was made.’ Again: ‘In him all things hold together and he is the firstborn of every creature.’ Moreover, He was before every creature because He is holy. The firstborn indeed are holy, as ‘the firstborn of Israel,’ not in the sense of being before all, but because the firstborn are holier than the rest. The Lord is holy above all creatures for the very reason that He assumed a body. He alone is without sin and without vanity, while all ‘creation was made subject to vanity.’

We can also understand that the statement, ‘In the beginning God created heaven and earth,’ has reference to a period. The beginning of a journey is not yet a completion, nor is the beginning of a building yet the finished house.

Finally, others have interpreted the Greek phrase ἐν κεφαλαίῳ as if in capite, by which is meant that in a brief moment the sum of the operation was completed. Then there are also those who interpret the beginning not in a temporal sense, but as something before time. Hence, they use the Greek word κεφάλαιον in the sense of its Latin equivalent, caput, indicating by this the sum of the work. Heaven and earth, in fact, are the sum of the invisible things which appear not only as the adornment of this world, but also as a testimony of invisible things and as ‘an evidence of things that are not seen,’ according to the prophecy: ‘The heavens show forth the glory of God and the firmament declareth the work of his hands.’ The Apostle, inspired by the above, expresses in other words the same thought when he says: ‘For his invisible attributes are understood through the things that are made.’ We can find it easy to understand, then, that the Creator of Angels, Dominations, and Powers is He who in a moment of His power made this great beauty of the world out of nothing, which did not itself have existence and gave substance to things or causes that did not themselves exist.

This world is an example of the workings of God, because, while we observe the work, the Worker is brought before us. The arts may be considered in various aspects. There are those which are practical. These relate to the movement of the body or to the sound of the voice. When the movement or the sound has passed away, there is nothing that survives or remains for the spectators or the hearers. Other arts are theoretical. These display the vigor of the mind. There are other arts of such a nature that, even when the processes of operation cease, the handiwork remains visible. As an example of this we have buildings or woven material which, even when the craftsman is silent, still exhibit his skill, so that testimony is presented of the craftsman’s own work. In a similar way, this work is a distinctive mark of divine majesty from which the wisdom of God is made manifest. On beholding this, raising the eyes of his mind at the same time to the things invisible, the Psalmist says: ‘How great are thy works, O Lord; Thou hast made all things in wisdom.’

Certainly not without reason do we read that the world was made, for many of the Gentiles who maintain that the world is co-eternal with God, as if it were a shadow of divine power, affirm also that it subsists of itself. Although they admit that the cause of it is God, they assert that the cause does not proceed from His own will and rule. Rather, they make it to be analogous to the shadow in respect to the body. For the shadow stays close to the body and a flash follows the light more by natural association than by exercise of free will.

Therefore, Moses says most commendably that ‘God created heaven and earth.’ He did not say that He made it subsist or that He provided a cause for the world to exist. Rather, He created it as a good man makes what would be of use, as a philosopher propounding his best thoughts, as one all-powerful foreseeing what is to be the most magnificent. Again, how can one imagine a shadow where a body did not exist, since there cannot be a corporeal shadow where a body did not exist, since there cannot be a corporeal shadow of an incorporeal God? Also, how can the brilliance of incorporeal light be corporeal?

If you are seeking after the splendor of God, the Son is the image of the invisible God. As God is, so is the image. God is invisible; then the image also is invisible. It is ‘the brightness of the glory of His Father and an image of His substance.’ ‘In the beginning,’ we are told, ‘God created heaven and earth.’ And the world was therefore created and that which was not began to exist. And the word of God was in the beginning and always was.

The Angels, Dominations, and Powers, although they began to exist at some time, were already in existence when the world was created. For all things ‘were created, things visible and things invisible, whether Thrones or Dominations or Principalities or Powers. All things,’ we are told, ‘have been created through and unto him.’

What is meant by ‘created unto him’? Because He is the heir of the Father, from the fact that inheritance passed from the Father unto Him, as the Father says: ‘Ask of me and I will give thee the Gentiles for thine inheritance.’ This inheritance nevertheless passed to the Son and returns from the Son to the Father. And so in notable fashion the Apostle said in this place that the Son was the Author of all things, one who holds all things by His majesty. Addressing the Romans, he says concerning the Father: ‘For from him and through him and unto him are all things.’ ‘From him’ means the beginning and origin of the substance of the universe, that is, by His will and power. For all things began by His will, because one only is the Father, from whom all things come. By this is meant that He created through Himself, who created from what source He desired. ‘Through him’ means the continuation of the universe; ‘unto him’ means its end.

‘From him,’ therefore, is the material; ‘through him,’ the operation by which the universe is bound and linked together; ‘unto him,’ because as long as He wishes all things remain and endure by His power and the end of all things is directed toward the will of God, by whose free act all things are resolved.
'''
