[[commentary]]
quote='''
What means the Evangelist by describing his stature, and that of none other? It is perhaps because he was young in wickedness, or as yet weak in the faith. For he was not yet prostrate in sin who could climb up. He had not yet seen Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What does it mean that scripture has expressed the stature of no one else but this man: who was little in stature? See whether perhaps he was little in malice, or still little in faith; for he had not yet promised anything when he climbed, he had not yet seen Christ: rightly, then, he was still little. Accordingly John was great, because he saw both Christ and the Spirit like a dove remaining upon Christ, as he himself says: I saw the Spirit descending like a dove and remaining upon him.

And what is the crowd, if not the confusion of an unskilled multitude, which could not see the summit of wisdom? So Zacchaeus, as long as he is in the crowd, does not see Christ; he climbed above the crowd and saw him, that is: having passed beyond the ignorance of the common people, he merited to behold him whom he desired.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
