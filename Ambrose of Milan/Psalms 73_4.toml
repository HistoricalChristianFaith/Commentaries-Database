[[commentary]]
quote='''
And therefore there is no reclining in their death; not declining (declinatio), as most Latin manuscripts have it, but reclining (reclinatio). For when we toil and are bent over some work and stoop, we are accustomed to recline; but sinners, those namely of grave offences, and above all the ungodly, cannot recline, of whom it is said: and bow down their back always. For those who have not cleaved to Christ do not lift themselves up to heavenly things. And therefore they do not rise again with him, those whose death is very evil, as it is written: The death of sinners is very evil. But he who dies with Christ and is buried together with him not only reclines but is also raised up again. To him that saying aptly applies: You have turned all his bed in his weakness, especially if he is a martyr, whose weakness is dissolved by his passion, and his death by resurrection.

We have seen that rich man who, clothed in purple and fine linen, lay at table in this world and feasted splendidly every day, from whose table the poor man Lazarus gathered what fell: how, placed in torments in the underworld, he could not recline, but scarcely lifted up towards Abraham, not his whole self, but only his eyes, asking him to send Lazarus to dip the tip of his finger in water and cool his tongue. So for his death there was no reclining, nor support in his stroke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 3"
