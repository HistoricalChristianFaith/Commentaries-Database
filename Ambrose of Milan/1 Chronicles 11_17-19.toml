[[commentary]]
quote='''
Indeed, whom among men shall we take as better and braver than holy David, who could not take away from himself the desire with which he had longed for the water from the cistern of Bethlehem, cut off by the enemy army, yet could mitigate it? For since we do not find that water was lacking to the others, that is, to so great a number in the army, and since water from the other springs could certainly have been much less lacking to the king, he suffered a certain irrational concupiscence and desired that water which was walled about by the encircling enemy, from where it could not easily have been brought without the greatest danger. And so he says: Who will give me a drink from the cistern that is in Bethlehem at the gate? And when three men were found to break through the enemy's camp and bring the water which he had desired with the greatest longing, recognizing that this same water had cost him the danger of others, he poured it out to the Lord, so that he might not seem to drink the blood of those who had brought it. This is a sign that concupiscence indeed comes before reason, but that reason resists desire. David, then, suffered something human, in that he desired irrationally; but this is praiseworthy, that he cheated an irrational concupiscence with a remedy rationally prepared. While I praise the men who blushed at their king's longing and preferred to put an end to his shame even at the peril of their own safety, I praise him more, who in his own longing blushed at another's danger and likened to blood the water sought at the price of an uncertain lot. At the same time, like a victor with his desire repressed, he poured out the water to the Lord, to show that he was quenching his concupiscence with the consolation of the word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 1"
