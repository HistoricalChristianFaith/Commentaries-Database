[[commentary]]
quote='''
Let us then flee from here, as holy Jacob fled from his fatherland; for he knew that the true fatherland is the one above. Let us flee as harts to the fountains of waters: let our soul too thirst for those for which David thirsted. What is that fountain? Hear him saying: For with you is the fountain of life. Let my soul say to this fountain: When shall I come and appear before your face? For God is the fountain; but let him who desires this fountain pour out his soul upon himself, so that he leaves nothing to the possession of the flesh, but the soul overflows everywhere.

Beautifully did Susanna pour it out, so that the fires of the body, the fears of death, the desires of life could not steam up into it. The soul poured out upon her quenched every carnal desire, every worldly pursuit. It could even have quenched the flames of those monstrous old men and shameless elders, had not a flood of lust overflowed in them. When they threatened her with slander, should consent to adultery be refused, Susanna groaned and said: Distresses are upon me on every side. For if I do this, I shall perish by eternal death; but if not, I shall not flee from your hands. Yet she judged it better to flee the crime rather than the danger. So she wept when the crime was charged against her; she wept when adulterers claimed for themselves judgment over a modest and chaste woman, not lamenting death, but she wept for the slander on her chastity, the injury to religion, and she poured out upon herself not her body but her soul; for she would have poured out her body if she had yielded to carnal things. Finally, when she was condemned to death, she cried out as judge of the accused, arbiter of the slanderers, and by the authority of an innocent conscience she summoned the divine knowledge to her judgment, not stirred by fear of death, but lofty in the power of a censure that convicts. Susanna therefore fled the world and entrusted herself to God, fleeing to that citadel of the eternal city which embraces the whole world, since all things are within God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 9"
