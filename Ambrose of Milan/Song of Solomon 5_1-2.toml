[[commentary]]
quote='''
Hence the Bridegroom says — and the Bridegroom of the soul is God the Word, to whom the soul is united by a kind of lawful covenant of marriage —: I have entered into my garden, my sister, my bride, I have gathered my myrrh with my ointments, I have eaten my bread with my honey, I have drunk my wine with my milk. Eat, my neighbours, and drink, and be inebriated, my brothers. I sleep, and my heart keeps watch. Let us learn what fruits and foods God feasts on, or in what he delights. He delights in this, if someone puts his sin to death, blots out his guilt, buries and abolishes his iniquities. For myrrh is the burial of the dead, and sins are dead, since they can have no sweetness of life. And certain wounds of sins are bathed with the ointments of the divine discourse, and are healed by the stronger food of the Word as by bread and by the sweeter discourse as by honey. That words are foods Solomon teaches elsewhere too, saying: good words are honeycombs. In that garden, then, there are good words: one to restrain guilt, another to rebuke iniquity, another to make arrogance die and, as it were, bury it, when someone who has been rebuked renounces his errors. There is also a stronger word, which strengthens the heart of man with the more solid nourishment of heavenly Scripture. There is also a persuasive word, sweet as honey and yet pricking the conscience of the sinner in its very sweetness. There is also a word of more fervent spirit, which inebriates like wine and gladdens the heart of man; there is also a milky word, pure and white. The Bridegroom tells his neighbours to feast on these foods of sweet and profitable words; and his neighbours are those who follow him and are present at his wedding. Filled with this food and drink — for each one drinks water from his own vessels and from the springs of his own wells — and inebriated, the soul was asleep to the world, awake to God; and therefore, as what follows teaches, God the Word asked that her door be opened to him, that he might fill her by his entering.

From here, then, those Platonic banqueters were transferred, from here that nectar from the prophetic wine and honey, from here that sleep, from here that everlasting life on which he said his gods feast, because Christ is life. And therefore the womb of her soul was filled with the seeds of such words, and she herself went out in the Word. And the soul that goes out from this servitude and raises itself from the body follows the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
