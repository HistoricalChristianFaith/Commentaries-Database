[[commentary]]
quote='''
And the Lord God commanded the man thus: "from every tree of the garden thou shalt eat, but of the tree of the knowledge of good and evil, you shall not eat, for the day you eat of it you shall die." Why did He use the singular thou shalt eat when He bade them eat of every tree, and, again, when He bade them eat of the tree of good and evil, why did He use the plural You shall not eat? This is no trifling question. This problem can, in fact, be solved by the authority of the Scriptures if you study them carefully. Scripture refers to something good and something that should be done. What is good is naturally associated with what should be done. On the other hand, what is base is separate and unrelated to what should be done. And so the Lord, aiming always at oneness, gave orders in accordance with this principle. Hence He achieves oneness who has made both one—He not only made both one, for He bade us to be one body and one Spirit. The first-born of every creature, since He is in union with the faith, is always closely joined to the Father, because the Word was with God. Wherefore He says: I and the Father are one, in order to show His union with the Father in majesty and in dignity. But He bade us to be one and transfused into us by the adoption of grace the likeness of His own nature and His own oneness, saying: Father, that they may be one, even as we are one, I in them and thou in me. When He prescribes a good, therefore, He does it to one person, saying, Thou shalt eat, for the oneness cannot be gainsaid. Where, however, He says that the tree of the knowledge of good and evil should not be tasted, He speaks in effect to several people: You shall not eat. What has been prohibited has general application to several people. But I have another opinion on this matter. I am able to discover the meaning of what we are discussing in the very words of God Himself. Adam alone was bidden to taste of every tree and it was foreseen that he would follow that injunction. In the plural sense, and not in the singular, God sees that the tree of the knowledge of good and evil should not be tasted. He knew that the woman would sin. Thus, by using the plural, God points out that they will not follow the injunction, because, where there are many, there are differences of opinion.

If we look into the sense of the words as expressed in the Septuagint, the meaning is clear. Symmachus, however, takes both expressions in a singular sense. This is explained by the fact that in the Law, God, addressing His people, uses the singular: Hear, O Israel, the Lord thy God is one Lord and Thou shalt love the Lord thy God. I am not influenced by the interpretation of Symmachus, who could not see the oneness of the Father and Son, although at times both he and Asylas admitted it in their discussions. The fact that God addresses in the singular number a people who will later contravene His commands should not lead us to think that I am dissenting from my former statement, inasmuch as the Jewish people, regarded as a single person, violated the injunctions imposed upon them. We have here a law of the Spirit whereby God addresses the people in divine language. In this case we should consider not so much the words as their prophetic import. Wherefore He says: Thou shalt not boil a kid in the milk of his dam.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 5"

[[commentary]]
quote='''
Another problem. Did God know that Adam would violate His commands? Or was He unaware of it? If He did not know, we are faced with a limitation of His divine power. If He knew, yet gave a command which He was aware would be ignored, it is not God's providence to give an unnecessary order. It was in the nature of a superfluous act to give to Adam, the first created being, a command which He knew would not at all be observed. But God does nothing superfluous. Therefore, the words of Scripture do not come from God. This is the objection of those who do not, by interposing these questions, admit the authenticity of the Old Testament. But these people are to be condemned out of their own mouths. Since these same persons concede the authenticity of the New Testament, they must be convinced by evidence to believe in the Old. If they see that God is consistent in His commands and in His deeds, it is clear that they must concede that both Testaments are the work of one Author. The following example should convince them that a command to one who will disobey is not something superfluous or unjust. The Lord Himself chose Judas, one who, He knew, would betray Him. If these men think that he was chosen unwisely, they restrict the power of God. But they cannot hold this opinion, since Scripture declares: For Jesus knew who it was who should betray him. These defamers of the Old Testament should therefore hold their peace.

Possible objections on the part of the Gentiles who do not admit this evidence stand in need of a response. Since the Gentiles demand a rational explanation, here is the reason why the Son of God either gave a command to one who is going to disobey it or has chosen one who is going to betray Him. The Lord Jesus came to save all sinners. He was bound to show concern even for the wicked. Accordingly, He was bound not to disregard one who was to betray Him. He wished that all might take note that in the choice even of His betrayer He was offering a sign for the salvation of all of us. No injury was done to Adam in that he received a command, or to Judas because he was chosen. God did not lay it down as a necessary consequence that one should disobey and the other should betray Him. Both could have abstained from sin if they had guarded what they had received. Hence, although He knew that all the Jews would not believe, He stated: I have not come except to the lost sheep of the house of Israel. The fault is, therefore, not in the one issuing the command; the sin is rather in the one who disobeys. God's intent was this: He wanted to show to everyone that He willed to give freedom to all mankind. I do not mean to maintain that He did not know of the disobedience to come. Rather, I contend that He did know, but that He should not for that reason be subject to reproach for a betrayer who met death. God should not be accused of being the cause why both lapsed. In fact, both stand convicted and condemned, because one received a command not to fall into sin, and the other was enrolled among the Apostles in order that he, as the result of kindness, might change his intention to betray. At some time in the future when the other Apostles would be found wanting, he might well become a source of comfort to all. In effect, there would not exist any sin if there were no prohibition. Without the existence of sin there would be no such thing as wrong-doing or, perhaps, even virtue, which could not have any cause for existence or for pre-eminence without the aid of unrighteousness to offset it. What is sin, if not the violation of divine law and the disobedience to heavenly precepts? Not by the ear, but by the mind, do we form a judgment regarding injunction from above. But with the Word of God before us we are able to formulate opinions on what is good and what is evil. One of these we naturally understand should be, as evil, avoided, and the other we understand has been recommended to us as a good. In this respect we seem to be listening to the very voice of the Lord, whereby some things are forbidden and other things are advised. If a person does not comply with the injunctions which are believed to have been once ordained by God, he is considered to be liable to punishment. The commands of God are impressed in our hearts by the Spirit of the living God. We do not read these orders as if they were recorded in ink on a tablet of stone. Hence, in our own thought we formulate a law: For if the Gentiles who have no law do by nature what the law prescribes, those having no law of this kind are a law unto themselves. They show the work of the law written in their hearts. There is something, therefore, like the Law of God which exists in the hearts of men.

These same people raise another objection. Instead of that command which we said was established in the mind of man, they would maintain that this very impression in our minds by God was itself the prescription of a divine law. The question is raised: Did the Creator of man know that man would fall into sin and so implanted those opinions of what is good and evil in the mind of man or was He unaware that this would happen? If you concede that He did not know of it, you attribute to God something alien to His majesty. If, on the other hand, you maintain that, although God was aware that man would sin, He impressed in man's mind a realization of what is good and evil, so that he would be unable, because of the admixture of evil, to live forever—then in one case you imply that God was not prescient and in the other that He was not beneficent. From this the conclusion is reached that man was not the creation of God. We have already stated that these men maintain that God had not imposed a command. Now they say that man was not created by God, because God did not create evil. Man, on the other hand, had a mental conception of evil, inasmuch as he was enjoined to abstain from evil. In this way they venture to assert that there were two gods: one who is good; the other, the Creator of man. We must follow the lines of their own logic in formulating our reply. If they hold that man was not made by God, because man is a sinner, and if they recoil from conceding this point, lest a good God may not seem to be the creator of sinners (because they do not believe that God is good who made a sinner)—then let them declare whether this artificer of man has in their opinion also been made by God? If, as they state, this artificer of man was created by God, how can it be possible that a God who is good is also the agent of evil? If the creator of a sinner is not good, then more serious implications result if we postulate the maker of him who is the artificer of a sinner. A God who is good is bound to prevent the birth of him who shall have to introduce the substance of sin. But if they maintain that this artificer was not created, then the problem arises as to whether a God who is good could or could not in any way prevent the growth of evil. If such a God cannot do this, then He is powerless. Inasmuch as such inconsistencies follow our line of argumentation and since the heretics get involved here, also, let us attempt a solution of the problem of why God allowed adversity to enter into this world through an artificer who either did or did not spring from Him, although He had the power to prevent it.

Accordingly, while still holding that the God who is good and the one who is the artificer are one and the same, let us make clear what are the provinces of each. We should at the same time try to meet the objections of those who raise such a question as this: How is it possible that a God who is good has permitted not only adversity to enter this world but has allowed it, too, to be in such a state of disorder? In truth, this objection would be valid only if this evil so affected the nature of our soul and the secret places of our hearts that riddance was impossible and if, again, this poison had left such deep wounds in our hearts and souls that medication was of no avail. In fact, this grievance of theirs could be more aptly expressed by stating that, although God is omnipotent, He has permitted man to die. But since God in His pity has reserved for us the means of obtaining remedy for our sins and still has not rid us of all possibilities of contagion, then let us reflect on the following points. Would it be an unjust and unreasonable act if God, fearful, as it were, of man's frailty and mortality, permitted us to be tempted in such wise that, through penitence for our sins, grace compounded would return once more to our hearts? Again, would it be unjust if man, conscious and fearful of his own frailty (since he found that he could so easily deviate from the orderly path of divine commands) and fearful, too, lest he let loose these heavenly mandates which like a helm guide his soul—would it be unjust if man should finally attribute the recovery of the helm to divine pity and by his safe return acquire some grace as well?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 8"

[[commentary]]
quote='''
Now let us investigate the reason why God considered that a command should be given concerning the two classes of trees: the one to be eaten and the other which it was forbidden to eat. Thus, He laid down to man injunctions on the ways of attaining that wonderful and happy life, following which he might not have to suffer death. There are some who think that it was totally inappropriate for the Creator of heaven and earth and of all things to lay down that command and that it was definitely unsuited to the inhabitants of Paradise, because life there was like that of the angels. And so we can conclude that the food provided for eating there was not earthly and corruptible, because those who do not drink or eat will be as the angels in heaven. There is no merit, therefore, in food, because food does not commend us to God. Neither is there great danger therein, because what goes into the mouth does not defile a man, but it is what comes out of the mouth. Undoubtedly, then, it would appear that the precept [is quite unworthy] of such a great Creator unless you take this food to mean prophetic food, because as a great reward the Lord makes this promise to His saints: Behold my servants shall eat and you shall be hungry. This is the food that makes for eternal life. Whoever is deprived of this will suffer death, since the Lord Himself is the living and heavenly Bread which gives life to this world. Hence He speaks: Unless you eat my flesh and drink my blood you shall not have life eternal. The bread was, therefore, meant for a certain person. Instructions were given that it should be eaten by the inhabitants of Paradise. Who is that person? We are told who that person is: Man ate the bread of angels. The bread is good if you do the will of God. Do you wish to know how good that bread was? The Son of God Himself eats of that bread of which He says: My food is to do the will of my father who is in heaven.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 9"

[[commentary]]
quote='''
So paradise is in our ruling part, growing wooded with the plantings of very many opinions, in which God set, in the chief place, the tree of life, that is, the root of piety. For this is the substance of our life, if we render due worship to our Lord and God. He also set there a seedbed of the knowledge of good and evil; for man alone among the other earthly living creatures has the knowledge of good and evil. There are also other diverse plantings there, whose fruits are the virtues. But because the disposition of man, capable of knowledge, was known by God to incline more quickly toward cunning than toward the height of prudence, and since the quality of his own work could not be hidden from that judge who set fixed bounds in our soul, he willed, as the provident author of our salvation, to banish cunning from paradise, and to pour in the zeal for life and the discipline of piety. And therefore he commanded man that of every tree which is in paradise he should eat, but of the tree of the knowledge of good and evil he should not eat. But because every creature is subject to passion, delight therefore crept into human affections as by the gliding of a serpent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
