[[commentary]]
quote='''
There are those who rose again at the Passion of Christ, and they are plainly blessed, who received the grace of Christ and heard his voice, of which it is written: the hour has come when the dead shall hear the voice of the Son of God, and those who hear shall live, and: they entered into the holy city. I think this signifies rather that Jerusalem above than this one which he left, which he accused, because into this one they entered with their feet, but into that one above by their merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
