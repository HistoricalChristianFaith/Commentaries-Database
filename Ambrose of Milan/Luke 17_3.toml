[[commentary]]
quote='''
After the parable of the rich man who is tormented in punishment, Christ added a commandment to give forgiveness to those who turn themselves from their trespasses, lest any one through despair should not be reclaimed from his fault; and hence it is said, Take heed to yourselves.

That there might neither be hard-wrung pardon, nor a too easy forgiveness, neither a harsh upbraiding, to dishearten, nor an overlooking of faults, to invite to sin; therefore it is said in another place, Tell him his fault between him and thee alone. (Mat. 18:15.) For better is a friendly correction, than a quarrelsome accusation. The one strikes shame into a man, the other moves his indignation. He who is admonished will more likely be saved, because he fears to be destroyed. For we more readily give ear to counsel than yield to injury. Fear is a weak preserver of consistency, but shame is an excellent master of duty. For he who fears is restrained, not amended. But He has well said, If he trespass against thee. For it is not the same thing to sin against God and to sin against man.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If your brother sins against you, rebuke him. How well, after the rich man who is tormented in punishments, he added the precept of granting pardon, to those surely who turn back from error, lest despair should fail to call anyone back from his fault! And how moderate he is, so that pardon is neither difficult nor indulgence lax, lest either harsh invective strike anyone down or connivance invite him to fault! So also elsewhere: If your brother sins against you, go and correct him between you and him; for friendly correction profits more than turbulent accusation: the one strikes shame into a man, the other stirs indignation. Let what the one admonished fears may be made public rather be kept secret. For it is good that he who is corrected should think you a friend rather than an enemy; for one more easily assents to counsels than submits to injuries. Hence the Apostle too says: Correct him he says as a brother, that he may blush, do not regard him as an enemy. For fear is a weak guardian of permanence, but shame is a good teacher of duty; for he who fears is restrained, not amended, but in him who is ashamed to do wrong it turns into nature.

He put it beautifully: if he sins against you; for to sin against God and to sin against man is not an equal case. Accordingly the Apostle, who is a true interpreter of the divine oracle, says: A heretic he says after one correction avoid, because unbelief is not as pardonable as a fault. And since error often creeps in through inexperience, he commanded that it be corrected, so that either obstinacy may be avoided or a lapse set right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
