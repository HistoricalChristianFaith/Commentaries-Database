[[commentary]]
quote='''
And by what opinion do you judge David to be the Son of God, or think Solomon to be so? Is it because it is written: O God, give your judgment to the king and your justice to the king's son, and because the title of the psalm says that the seventy-first psalm (72) was composed for Solomon? But observe which Solomon it means. For Solomon is "peaceable": this is what the name means. The psalm is spoken of him whom we truly know to be the lover of peace. But how was Solomon peaceable? The blood of Joab does not show it, whom he ordered to be slain among the altars of the temple; nor the punishment of Adonijah, whom he struck down as guilty of aspiring to royal kinship, and was not called back from his indignation even by his mother's entreaty. And how do you reckon that what is written fits Solomon, the son of David, that he shall endure with the sun and before the moon for ages of ages, when he, having obtained the use of a short life, passed his span of living within narrow bounds? And how is it said of him: He shall have dominion from sea to sea, when he, established within Syria, that is, within the province of a single region, held the bounds of his rule circumscribed, while Christ alone has extended his rule to the ends of the whole world? For he alone is the one of whom the sequence of the psalm rightly prophesied that the kings of the Arabs and Sheba shall bring gifts, and all the kings of the earth shall adore him, all nations shall serve him. For we know him as ruling over all peoples and nations with an uncircumscribed rule, with an unbounded power.

Solomon, then, is not the Son of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
