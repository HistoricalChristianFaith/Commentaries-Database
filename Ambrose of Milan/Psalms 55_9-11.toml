[[commentary]]
quote='''
This injustice especially does the holy David deplore, saying: I have seen iniquity and contradiction in the city and usury and deceit have not departed from its streets. And therefore when he alluded to the treachery of Judas he stated this first, either because beyond the odium of their sacrilege the crime of usury was to fall upon the conspirators in the death of our Lord, or because usury was sufficiently and fully going to avenge such a great sacrilege. Wicked were the usurers who gave money that they might destroy the author of salvation; wicked also those who give that they may destroy an innocent man. And he also who receives money, like the betrayer Judas, hangs himself also with a halter. He considered that Judas himself also should be condemned with this curse, that the usurer should search his substance, because what the proscription of tyrants or the violence of robbers is wont to do, this the wickedness alone of the usurer is accustomed to inflict. The more learned moreover think the devil himself should be compared to a usurer, who destroys the things of the soul and the patrimony of our precious intellect by a kind of lending of iniquity at interest. Thus he catches with gain, he entices with gold, thus he involves us in crime, thus he demands our life in exchange for treasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 4"
