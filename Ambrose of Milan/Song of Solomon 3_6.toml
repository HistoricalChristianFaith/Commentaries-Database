[[commentary]]
quote='''
So the daughters of Jerusalem, seeing her clinging to Christ and still ascending with him — for he deigns often to come to meet those who seek him and to come down to them, so as to lift them up — say: Who is this who comes up from the desert? — this place on earth seems a desert and uncultivated, overgrown with the briars and thorns of our sins —, marvelling, that is, how the soul, which before was left in the underworld, clings to the Word of God and has ascended like a shoot of the vine raising itself to the heights, like smoke born of fire and seeking the heights, and besides how she is fragrant with good fragrances. Now that fragrance breathes the sweetness of devout prayer, which is directed like incense in the sight of God. And in the Apocalypse we read that the smoke of the incense went up with the prayers of the saints, which incense, namely the prayers of the saints, is borne by an angel upon that golden altar which is before the throne, and it is fragrant like a sweet ointment of devout supplication, because it is composed of petition for eternal and invisible things, not for bodily ones; above all, however, she is redolent of myrrh and frankincense, because she is dead to sin and lives to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
Who is this who comes up from the desert? Be like that soul who stirs up in herself the love of Christ, whom the powers of the heavens marvel at as she ascends; because she ascends without stumbling, and ascends from this world with joy and gladness, like a shoot of the vine, and like smoke lifts herself up to the heights, fragrant with the fragrance of a holy resurrection and with the sweetness of faith, as you have it written: Who is this who comes up from the desert, like a shoot of the vine, made fragrant with the smoke of incense, with myrrh and frankincense, from all the powders of ointment. Beautifully he expressed its fineness by the comparison with powder and by the mention of ointment; because in Exodus we read that the incense was fine and compounded of many things, and that this is the prophetic incense, which is the prayer of the saints, that it may be directed in the sight of the Lord, as David too says: Let my prayer be directed as incense in your sight (Ps. 140 (141):2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Who is this who comes up from the desert? This place of earth seems a desert and untilled, overgrown with the briers and thorns of our sins. They marvel, that is, how the soul that before was left in hell cleaves to the Word of God, and has ascended like a shoot of the vine, lifting herself up to the higher things like smoke born of fire, and seeking the heights, and moreover is fragrant with good fragrances. And that fragrance breathes the sweetness of holy prayer, which is directed as incense in the sight of the Lord (Ps. 140 (141):2). And in the Apocalypse we read that The smoke of the incense went up from the prayers of the saints (Rev. 8:4), which incense is borne up through the prayers of his angels, namely upon that golden altar which is before the throne of God. And she is fragrant as the sweet ointment of holy prayer, because it is compounded of petition for things eternal and invisible, not for bodily things: yet above all she breathes of myrrh and frankincense, because she has died to sin and lives to God. Whence also in what follows: I will go my way, she says, to the mountain of myrrh, and to the hill of frankincense. There follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
