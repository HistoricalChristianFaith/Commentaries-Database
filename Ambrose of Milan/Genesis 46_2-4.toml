[[commentary]]
quote='''
And God spoke to Israel in a vision by night, saying: Jacob, Jacob. And he said: What is it? Saying: I am the God of your fathers: do not fear, go down into Egypt; for I will make you into a great nation there. I will go down with you into Egypt, and I will lead you forever. How they do not understand what they themselves read, and deny Moses whom they praise, when they refuse to believe his writings! What is more evident than that in this passage they are invited to pass over to the Church of God, and that those who before were confined within the narrow borders of Judaea should migrate to the people of God, which, gathered from the whole world, from all nations and peoples, has been made into a great nation? Indeed, their sound has gone out into all the earth. Jacob, therefore, is called by his sons; that is, the people of the Jews is invited to grace by Peter, John and Paul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
