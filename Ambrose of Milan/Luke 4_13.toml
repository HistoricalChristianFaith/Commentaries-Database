[[commentary]]
quote='''
He would not have said that all the temptation was ended, had there not been in the three temptations which have been described the materials for every crime; for the causes of temptations are the causes of desire, namely, the delight of the flesh, the pomp of vain-glory, greediness of power.

You see then that the devil is not obstinate on the field, is wont to give way to true virtue; and if he ceases not to hate, he yet dreads to advance, for so he escapes a more frequent defeat. As soon then as he heard the name of God, he retired (it is said) for a season, for afterwards he comes not to tempt, but to fight openly.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when every temptation was finished, the devil departed from him until a time. These three kinds of vices are shown to be the springs of almost all crimes; for Scripture would not have said 'when every temptation was finished' unless in these three lay the matter of all sins, whose seeds are to be guarded against in their very origin. So the end of temptations is the end of desires, because the causes of temptations are the causes of desires. And the causes of desires are the delight of the flesh, the show of glory, the greed for power. How religious it seems not to refuse the company of a Christian woman! But frequent temptation comes from it. If the devil sees men intent on God, he makes suggestions to deceive them; but you, however much you may be confident of your resolve, beware of temptation, knowing nature. These three, if you remember, Paul too prescribed to be guarded against, marking out that there are three kinds of sins, free of which one is to await the crown of righteousness. For neither he says were we in a word of flattery nor in an occasion of avarice, God is witness, nor seeking glory from men; and therefore he conquered the devil, he sought the crown.

You see, then, that the devil himself is not persistent in his zeal, that he is wont to yield to true virtue. And though he does not cease to envy, yet he dreads to press on, because he shrinks from being triumphed over more often. So, when the name of God was heard, he departed he says until a time; for afterwards he came, not to tempt, but to fight openly.

Divine Scripture, then, teaches you that your contest is not against flesh and blood, but against spiritual snares. You see the magnificence of the Christian man, who contends with the rulers of the world, and, though set on earth, fights by strength of mind against the spiritual forces of wickedness which are in the heavenly places. For we do not contend over earthly things, so as to fight on earth; but since spiritual rewards are set before us, the kingdom of God and the inheritance of Christ, spiritual hindrances must first be overcome. A crown is set before us; contests must be undergone. No one can be crowned unless he has conquered; no one can conquer unless he has first contended. Of the crown itself, too, the fruit is greater where the labor is greater; narrow indeed and strait is the way that leads to life, but broad and spacious that which leads to death. And therefore we ought in no way to fear temptation; for it is the cause of victory, the matter of triumphs.

That rich man, who felt no temptation in the world, is in torments in the underworld; that poor man Lazarus, who was so afflicted and worn down by poverty and sickness that his sores were licked by dogs, wretched through the toil of this life, sought the crown of eternal glory; for many are the tribulations, not of anyone at all, but of the righteous. Finally, those whom the Lord loves he often chastises. Peter was tempted so that he denied; he denied so that he wept. And what shall I say of the rest? Job, surely, was approved by God; but though he was approved, yet he was not a victor. His devotion had been approved, yet he did not have the prize of virtue; and therefore he is offered up to be tempted, that he might be rendered more glorious.

In that contest too it matters that you look at the steps. The devil has not one weapon; he multiplies his darts, to conquer either by reward or by weariness. First he wounds through desire, second through dutiful love, third through health; for he fights with the sores of mind and body alike. The very diversity of the temptations, too, matches the diversity of those contending. The rich man is pressed by loss to his avarice, the father by the loss of his sons, the man by pains, the body by sores. How great are these weapons! Hence the Lord did not wish to have anything that he might lose, and therefore he came here poor, so that the devil would have nothing to take away. Do you wish to know how true this is? Hear the Lord himself saying: the prince of this world comes, and in me he will find nothing. He did not wish even to be father of a few, so that he might be father of all — and in vain would he be tempted with sores of the body who despised all the sufferings of the body — and at the same time to show us that a spotless victory was due to him once the enemy of the body was driven off. But the one, as a man, is tempted through his own things, this one through public things; from the one his patrimony is taken away, to this one the kingdom of the world is offered. Nor is the devil wholly without fraud, for he feared to exasperate the Son of God: the one he tempts with injuries, this one with rewards. The one, like a little slave, says: the Lord gave, the Lord has taken away; this one, conscious of his nature and of his dispensation, laughs that his own things are offered to him. And to return to the other: messenger rushes in upon messenger, wounds are redoubled, and yet the strong athlete is not troubled in mind. A woman is brought in, the enticement of the first fraud; this one, born of a virgin, had no woman liable to error. Friends are brought in to crush with wicked counsels the one who resists; but in all that befell him Job never sinned with his lips in the sight of God.

For that he curses the day, saying: let that day perish on which I was born; and below: and let him curse it who cursed that day, who is to crush the great sea-monster, pertains to prophecy, because our Lord Jesus Christ crushed the devil as the sea-monster of this stormy world; and he desires that the day of his carnal generation perish, so that his day may be counted in regeneration. 'Let perish' he says 'the worldly day, that the spiritual day may arise'. So in temptation holy Job spoke mysteries; for he who was conquering the world saw Christ.

Let us, then, not fear temptations, but rather glory in temptations, saying: 'when we are weak, then we are powerful'; for then the crown of righteousness is woven. But that was perhaps suited to Paul; we, however, since there are many crowns, ought to hope for one or another. In the world the laurel is a crown, the shield is a crown. But for you there is set a crown of delights; a crown indeed of delights shall overshadow you. And elsewhere: with the shield of his will he will surround you; with glory also and honor the Lord has crowned him whom he loved. So he who wishes to give a crown suggests temptations; and if ever you are tempted, know that a crown is being prepared. Take away the contests of the martyrs, you have taken away the crowns; take away the tortures, you have taken away the beatitudes.

Is not the temptation of Joseph the consecration of virtue? Is not the injury of prison the crown of chastity? How could he have obtained a share of the kingdom in Egypt had he not been sold by his brothers? That this was done by the will of God, so that the righteous man might be proved, he himself showed, saying: how it should come to pass, as on this day, that a great people should be fed? So we ought not to fear as evils the temptations of the world, by which good rewards are gained, but rather to ask, in consideration of the human condition, that we may undergo such temptations as we can bear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
