[[commentary]]
quote='''
Lift up your soul, lest the bait of snares entice it. The pleasures of the world are a kind of bait and, what is worse, bait of evils, bait of temptations. While you seek pleasure, you run into snares. For 'the eye of a harlot is the snare of a lover'. The eye of a harlot, then, is a snare; the word of a harlot is also a snare, which sweetens your throat for a time and afterwards makes it harsh with the bitterness of a sinful conscience. Another's possession, full of pleasantness, is a snare. The whole road of this life is full of snares. Hence the just man says: In this way in which I walked they have hidden snares for me. In this way he says they have hidden. Therefore walk in that way which says: I am the way and the truth and the life, so that you may say: He has turned back my soul; he has led me upon the paths of justice for his name's sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"
