[[commentary]]
quote='''
Rightly, then, here too he says, exulting: To my hearing you will give joy and gladness, and the humbled bones will exult. You have proved, O Lord Jesus, that your words never pass away; you have proved that saying of the Gospel which you spoke: Many prophets and just men have desired to see what you see and to hear what you hear. Behold, David rejoices by hearing alone that there would be remission of sins, and he prophesies that the humbled bones will exult. Just as all the bones of the just man will say: Lord, who is like you? so the humbled bones will exult, that is, the bones of the just man who humbles his soul. Virtues, then, are called bones; certain movements of the mind or of the soul are called bones, as it were, and these movements are humbled by sins and exult by the gift of heavenly grace.

The peoples of the churches are also called bones, whence you have it said in the psalm: The things that you made in secret are not hidden from my bone. He called the Church and the sacred assemblies of the devout people his bone, for we are members of the body of Christ, of his flesh and of his bones. This, then, is what he says: that the Church of the Lord will know all the divine works and will receive the faith of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 13"
