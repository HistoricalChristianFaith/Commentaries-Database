[[commentary]]
quote='''
And his mother answered and said: No, but he shall be called John. And they said to her: There is no one in your kindred who is called by this name. So they made signs to his father as to what he wished him to be called. And he took a writing tablet and wrote, saying: John is his name. And all marveled. And at once his tongue was loosed and his mouth was opened, and he spoke, blessing God.

Wonderfully did the holy evangelist think it should be set down first that very many thought the infant should be called by his father's name, Zechariah, so that you might observe that it was not that the name of some unworthy person displeased the mother, but that it had been poured into her by the Holy Spirit, which had been foretold to Zechariah beforehand by the angel. And indeed he, being mute, could not make known the name of their son to his wife, but Elizabeth learned through prophecy what she had not learned from her husband. John she says is his name, that is: we do not give a name to him who has already received a name from God. He has his own name, which we have recognized, not one we have chosen. The merits of the saints have this, that they receive their name from God. Thus Jacob is called Israel, because he saw God; thus our Lord Jesus was named before he was born, to whom not an angel but the Father gave the name. For there will be revealed he says my son Jesus with those who will rejoice with him, who have been left in four hundred years. And it will be after these years, and my son Christ will die, and the world will be turned. You see that the angels announce what they have heard, not what they have presumed. Nor wonder if the woman affirmed a name she had not heard, since the Holy Spirit, who had given the charge to the angel, revealed it to her. Nor could she who had prophesied Christ be ignorant of the Lord's forerunner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
