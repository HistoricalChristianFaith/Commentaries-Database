[[commentary]]
quote='''
And therefore the prophet says: His eyes are cheerful from wine and his teeth whiter than milk, signifying the prophets and the apostles. For some, like the eyes of Christ, foresaw and announced his coming, of whom he himself says: Abraham saw my day and was glad, and one of the prophets says: I saw the Lord of Sabaoth; and seeing him they were filled with spiritual gladness: but others, that is the apostles, whom the Lord cleansed from every stain of sins, were made whiter than milk, and no spot darkened them afterwards. For milk is temporal, but the grace of the apostles abides for ever, who, preparing for us those spiritual and heavenly foods, have fattened the inward parts of the inner mind. There are also those who think that the shining commandments of the Lord, which were brought forth from the divine mouth, became for us like milk, nourished by which we come to the nourishment of the heavenly bread. Hence Paul too says: I gave you milk to drink, not food; for you were not yet able. The Corinthian at the beginning of faith is given a drink of milk; those saints whose faith is proclaimed in the whole world are strengthened, like weaned children, with more solid food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"
