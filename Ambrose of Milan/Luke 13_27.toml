[[commentary]]
quote='''
For he recognizes those who are his own, who do his works; but to those who work iniquity the Lord says: depart from me, all you workers of iniquity; I do not know you. Not through ignorance, but because they are unworthy of the knowledge of God, they are not known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
He who knows Christ is known by the Lord; he knows the righteous, he does not know the unrighteous. Therefore he will say to the unrighteous: Depart from me, all you who work iniquity; I do not know you, that is: because you are unworthy of divine knowledge; I do not know you, because you yourselves chose not to know me. Your works do not know me, your deeds do not know me; even if you say that you know me, your sins refute you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
