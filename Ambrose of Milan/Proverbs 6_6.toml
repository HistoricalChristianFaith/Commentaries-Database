[[commentary]]
quote='''
There is in the nature of quadrupeds something which the language of the prophetical books exhorts us to imitate. We should follow their example and avoid slothfulness. Neither because of size nor bodily weakness should we desist from our eagerness to carry into effect the lofty aims of a virtuous life.

The ant is a tiny animal, yet she ventures to achieve things beyond her strength. She is not driven to labor as a slave is. Rather, without compulsion and with freedom of foresight, she lays up provision for a future day. Scripture admonishes us to imitate the industry of the ant: ‘Go to the ant, thou sluggard, and consider her ways and be wiser than she.’ She has no land under cultivation. Yet, without a taskmaster to urge her on as she looks after her stock of food, what a harvest has she in store for herself—a harvest gathered from the results of your labors! While you may frequently be in need, she wants for nothing. There are no granaries closed to the ant, no guards impassable, no stores of grain untouchable! The guard sees and dares not prohibit the theft. The owner gazes on his loss and exacts no punishment! Over the plain moves the dark column. The paths are aglow with the concourse of voyagers and particles of grain which cannot be seized by their narrow jaws are heaved along by their shoulders! The owner of the crop beholds all this and blushes to refuse such trifles to co-operative industry such as this!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
