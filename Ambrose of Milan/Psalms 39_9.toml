[[commentary]]
quote='''
Indeed, this sense is made clear from what follows, because he added: I was dumb and did not open my mouth, because you made me, that is: "You gave me as a reproach to the foolish; therefore I was dumb and did not open my mouth, lest I should incur greater sins. I recognized your will, that I should blush for a time and afterwards be saved by asking pardon". Sometimes, then, even reproach is profitable, since even the destruction of the flesh is itself profitable, as the Apostle testifies, saying: I have handed him over to the destruction of the flesh, that the spirit may be saved in the day of our Lord Jesus Christ. That reproach too is profitable David himself testified, saying to Abishai: Let the Benjaminite curse me, because the Lord has told him to, that he may see my humility and the Lord may repay me good for this curse. And in truth the Lord saw his reproach, that he went weeping and barefoot with his head covered, and removed his reproach. It is clear, then — since he, given over to reproach, fled and was humbled and made satisfaction to the Lord with bare feet, and did not strike back at the man throwing stones, and did not permit vengeance on the one who cursed him, and after this was restored to his kingdom intact —, that reproach too is from the Lord, and that it is more profitable to bear reproach than to repel it. In the end, victory followed. Reproach, then, is profitable. But what is it that he added: because you made me? Does he not say that he was dumb and did not open his mouth because he recognized the Lord's will, and that he therefore bore up patiently, so that satisfaction might be made to the Lord through reproach for his sin?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
