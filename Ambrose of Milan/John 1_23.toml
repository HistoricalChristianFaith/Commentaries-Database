[[commentary]]
quote='''
John the Baptist, not yet born, knew that the president of the human contest and the rewarder of the wrestlers had come, and by leaping in his mother's womb earned the prize of a devout confession. Rightly was he already then designated for the crown, who before all had offered his name for the contest of Christ as a witness of faith and a herald of virtue. A good herald, who roused others to the contest, and truly a good herald, who cried out with so great a voice that at its sound the secrets of heaven resounded. Why say more? He moved the earth, he filled heaven. And therefore he received the name of voice, because a sacred voice went before the Word of God, as he himself taught us, saying: I am the voice of one crying in the desert. The prophet Isaiah said this; John confirmed that it had been said of himself. We have heard what the herald said: Prepare the way of the Lord, make his paths straight. This is the singular voice, and alone so resonant that it was heard by all, so sweet that it soothed the hearts of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
