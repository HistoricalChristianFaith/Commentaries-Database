[[commentary]]
quote='''
Your breasts are more beautiful than wine, and the fragrance of your ointments is above all spices. And below: The fragrance of your garments is like that of Lebanon. See what progress you grant us, virgin! For your first fragrance is above all the spices which were put into the burial of the Savior, and it breathes forth that the dead motions of the body and the delights of the members have perished. Your second fragrance, like the fragrance of Lebanon, exhales the integrity of the Lord's body, the flower of virginal chastity. Let your works, then, build the honeycomb. The fragrance of the garments, too, is the fragrance of our actions. Bring your hands, then, to your nostrils, and explore the fragrance of your actions with an unwearied and ever-watchful eagerness of mind. The fragrance of your right hand will soothe you, and your members will breathe the fragrance of the resurrection, your fingers will drip with myrrh, that is, your spiritual deeds will be fragrant with the grace of true faith. You take pleasure, then, virgin, from your inner body, and you yourself are sweet to yourself, you yourself are pleasant to yourself, you yourself (which often happens to sinners) do not begin to displease yourself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
