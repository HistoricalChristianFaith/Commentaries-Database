[[commentary]]
quote='''
Amen, amen I say to you, today you will be with me in paradise. A most beautiful example of the conversion we should strive after, that pardon is granted so quickly to the thief and grace is more abundant than the prayer; for the Lord always grants more than he is asked. For that man asked that the Lord should remember him when he came into his kingdom, but the Lord says: Amen, amen I say to you, today you will be with me in paradise; for life is to be with Christ, because where Christ is, there is the kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Hear that one of the two thieves saying to the Lord: Remember me, Lord, when you come into your kingdom. The Lord answered: Amen I say to you, today you will be with me in paradise. He was still asking that he remember him when he had come into the kingdom, and the Lord was already granting the heavenly kingdom. How swift a mercy! The prayer of the one asking is slower than the reward of the one rewarding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
