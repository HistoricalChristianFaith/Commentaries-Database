[[commentary]]
quote='''
And therefore he who fornicates sins against his own body, not outside the body: first because the flesh is weakened, which melts away in lusts and does not keep the restraints of chastity; then because the seeds, which ought to serve the procreation of offspring, work defilement of the body, not the fruit of posterity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
There is no doubt, then, that he who abstains from sin flees. Hence the Apostle also cries out: Flee fornication. For the enticements of sins pursue us, lust pursues us: but you, flee it as a raging mistress who, if she has seized you, allows you to rest neither by day nor by night, but harasses, burns and inflames you. Flee avarice, lest it seize you within. Flee faithlessness, lest it entangle you in its nets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"

[[commentary]]
quote='''
Let David have sinned, so that the whole world might not err; let him have sinned for himself, so that he might amend us all; finally, let him have sinned against his own body — for he who indeed commits fornication sins against his own body —, let him have sinned against his own body, so that he might be redeemed in the body of Christ: behold, the one whom we thought scarcely to be defended we now see to be proclaimed. For who is there who would not rather have divine gifts proclaimed in himself than human works? For we reckon, according to the Apostle, that a man is justified by faith without the works of the Law. Let David, then, be justified by faith, who through the Law came to know sin, but by faith believed in the pardon of sin; let David be justified, because in his sin the mysteries of the Church that was to arise shone forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 6"
