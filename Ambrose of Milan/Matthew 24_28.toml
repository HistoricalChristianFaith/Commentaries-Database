[[commentary]]
quote='''
What is ruin? Hear him who says: Where there is ruin, there also are the eagles, that is: where there is ruin, there also is resurrection. Ruin is empty of firmness; resurrection is the fullness of living. And therefore the ruin of that Adam emptied us, but the grace of Christ filled us again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
