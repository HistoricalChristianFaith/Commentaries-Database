[[commentary]]
quote='''
Not without reason, then, is he troubled who sees that he has a wrestling against flesh and blood, and within himself a grievous shipwreck, in his own body a storm which he has no strength to withstand unless heavenly help comes to his support; for no enemy is more grievous to a man than those of his own household. And what is so much of one's own household as a man is to himself, and the weakness of his own flesh? And therefore the prophet hastens and prays with all his affection that Christ may come, the strength of all, who would take upon himself all weaknesses and make both one, and, by removing the wall that kept the inner affection divided so that it could not come together in concord, would dissolve the enmities of mind and flesh fighting against each other. Therefore, because there was a battle for him within himself, and there was one from his neighbours, who, unmindful of law and equity, were preparing snares of fraud and ambushes, and the remedy he had hoped for was being put off, he thought himself cast off, as though he who had promised that he would be the remedy were refusing to come; and, as if called back from the hope of the dawning day into the depths of darkness, he prayed that the light might shine forth to drive back the squalor of this world, that the eternal truth might be present to abolish the deceitful image of this world.

God was at hand to his prayers, he who is wont both to stand by unlooked for and to show himself to those who do not ask for him, as he himself says: I was made manifest to those who did not seek me; and, assenting to his devout prayers, he anticipated the whole sequence of his petitions with swift fulfilment, and suddenly led the holy prophet in the spirit into the Church and into his tabernacles, and set before his eyes the sacred altar, on which the redemption of the whole world was to take place, and the remission of sins for all throughout the whole earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 8"
