[[commentary]]
quote='''
But if the Jew objects this, how does he read: Behold, a virgin shall conceive in the womb and bear a son, and his name shall be called Emmanuel, which is interpreted "God with us?" How does he read: Behold, I who spoke am here? And how does he assert that it is read: Behold, like a panther and like a bear in distress I will meet them? Could the Son of God, then, not take up flesh for the redemption of all, when they themselves cannot deny that for the punishment of our sins God put on a certain disposition of savage cruelty, so that he who by nature is kind and merciful, moved nevertheless by the atrocity of our crimes, assumes against us a certain fierceness of beasts?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 5"
