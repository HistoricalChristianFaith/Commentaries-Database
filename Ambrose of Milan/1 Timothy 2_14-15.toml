[[commentary]]
quote='''
If the woman was to be the first one to sin, the fact that she was the one destined to bring forth redemption must not be excluded from the operations of Divine Providence. Although Adam was not deceived, the woman was deceived and was in sin. Yet woman, we are told, will be saved by childbearing, in the course of which she generated Christ.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 10"
