[[commentary]]
quote='''
And he makes a distinction between the just man and the ungodly. This one, he says, dies in the strength of his simplicity, wholly in abundance and grace, and his inward parts are full of fat, their marrow overflows. But that one finishes the course of this life in bitterness of soul, and, having feasted on nothing good, receives his end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
