[[commentary]]
quote='''
And the men, rising up, looked toward the face of Sodom and Gomorrah. Just as the visitation of the Lord is shown to those who fear him, so too the punishment of sin is laid up for the impious. Abraham was escorting his guests; to the grace of kindness he added his services. But the Sodomites, in place of the duties of devotion, were heaping up the outrages of impiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
