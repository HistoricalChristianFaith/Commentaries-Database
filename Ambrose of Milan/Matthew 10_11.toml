[[commentary]]
quote='''
(in Luc. 9:5.) The Apostles are not to choose carelessly the house into which they enter, that they may have no cause for changing their lodging; the same caution is not enforced upon the entertainer, lest in choosing his guests, his hospitality should be diminished. When ye enter a house, salute it, saying, Peace be to this house.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And not idly, according to Matthew, is it decreed that the house which the apostles enter is to be chosen, so that there may be no cause for changing lodging and violating the bond. Yet the same caution is not enjoined on the one who gives hospitality, lest, while a guest is being chosen, hospitality itself be lessened.

But as, according to the letter, this is a venerable form of precept concerning the sacredness of hospitality, so also concerning the mystery a heavenly meaning smiles on us. For when a house is chosen, a worthy host is sought. Let us see whether perhaps the Church is meant as the one to be preferred, and Christ. For what house is more worthy of the entrance of apostolic preaching than the holy Church? Or who seems more to be preferred to all than Christ, who is wont to wash the feet of his guests, and does not allow whomever he has received into his house to dwell with soiled footsteps, but deigns to cleanse their steps, though stained by their former life, for the rest of their way? He alone, then, is the one whom no one ought to forsake, no one to exchange, to whom it is well said: Lord, to whom shall we go? You have the words of eternal life, and we believe. You see the performer of the heavenly precepts, who, because he did not change his lodging, earned fellowship in heavenly consecration.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
