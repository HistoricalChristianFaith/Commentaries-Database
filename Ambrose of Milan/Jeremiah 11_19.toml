[[commentary]]
quote='''
This, then, is what the Lord reproaches the Jews with in the psalm: "I am poor for your sake, I grieve for you, and you laid ungodly hands on me, saying: Let us take away the righteous man, because he is useless to us. Let us put wood into his bread". Well does he say bread for his flesh; he brought nourishment, they in return for the benefit paid back punishment. It is no wonder, then, if they hunger who denied themselves the nourishment of eternal life. Beautifully too they joined these two: Let us put wood into his bread; the Jews did not know what they were saying, and they spoke a mystery. The cross of Christ has given paradise back to us; this is the wood which the Lord pointed out to Adam, saying of the tree of life, which was in the midst of paradise, that it was to be eaten, but of the tree of the knowledge of good and evil, that it was not to be eaten. Adam went astray, he did not keep the commandments, he tasted what was forbidden; through the tree we began to hunger, until the flesh received its nourishment. Therefore the Lord in Christ joined flesh and wood, that the ancient hunger might cease and the grace of life be restored. Blessed is the wood of the Lord, which crucified the sins of all; blessed the flesh of the Lord, which ministered food to all!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Indeed, though Christ knows all things, he did not know sin; for he knows the things that are his, that is, the things that belong to the virtues, not those that belong to outrages. And therefore Scripture says to you: The Lord knew those who are his, but to the wicked he says: Depart from me, because I do not know you, and through Jeremiah he spoke, saying: As a lamb I was led to be sacrificed, and I did not know. How did he not know what he had foretold would come? But I did not know, he says, their thoughts, their malice; I do not wish to know the things that belong to blood; indeed I will not gather their assemblies from bloods. I blot out their iniquities and do not remember them; I do not wish to know the things I came to remit. I did not know the wood that is to burn, nor the things set in a heap of wood, whether straw or hay, so that the flame may consume them the more quickly as its fuel. I wish to know those things which remain, so that they may receive the fruit of their reward. I wish to know those things which have been built upon the foundation, so that they may be improved, not those on the way, where passers-by plunder them. I wish to know those things which belong to the vine, those sure trees which bear fruit, not those which, gathered into a bundle, are made ready for burning; that is: I am not the arbiter and partner of things that are perishable. Not, then, fellowship in some thing, but criminal fellowship is at fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"


[[commentary]]
quote='''
Hence also through Jeremiah, when he had not yet taken a body, he himself says: I was led like a lamb, and I did not know. What is there that the wisdom of God does not know, which is always in the secret of the Father? And therefore the Son of God has declared all things, because he himself is the wisdom of God the Father. How did he foreknow that he was to be led like a lamb, and yet says that he did not know where he was being led? Or how, earlier, through the mouth of David himself, does he say: God, my God, why have you forsaken me? How is the Son forsaken by the Father, he who says: And I am not alone, because the Father is with me, and elsewhere: I was delivered up and I did not go forth, and elsewhere: I have risen and am still with you, unless so that you may observe that he expresses the feeling of men, who think themselves forsaken by their Lord when they are in dangers?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
