[[commentary]]
quote='''
You of course complain of repeated shipwrecks: who compels you to sail? As if you do not make lands unsafe through the envy of riches, and excite many to piracy! God did not make the sea for navigation, but on account of the beauty of the element. He extended the expanses of sea rather widely that He might enclose the lands by water, lest you might stray too far as a wanderer and exile. But the sea is tossed by the tempest: therefore you ought to fear, not turn it to your use. The innocent element has committed no wrong, human temerity is a source of danger unto itself. Accordingly, he who does not sail knows not how to fear shipwreck. The Lord said: Rule over the fishes of the sea; He did not say: 'Sail out on the waves.' Therefore even the prophet Jonas, who was sent to Nineveh to preach penance, because he wished to sail so that he might flee from the face of God, was tossed by a tempest, and was selected by lot, and was cast into the sea, and was rescued by a whale.

The prophet David, also, said, when he was relating the favor of God toward man: Thou hast subjected all things under his feet, all sheep and oxen, moreover the beasts also of the fields. The birds of the air and the fishes of the sea, that pass through the paths of the sea. He has given to fishes, not to men, to pass through the path of the sea. For food was the sea given to you, not for your peril; use the food, but not for gain. Why do you create peril for yourself from enjoyment? Why do you lay open the depths of the more separate element? Why do you disturb the solitudes of the world? Why, at last, do you, as an impatient sailor, so often hasten to plough and dig up the waves? Why do you tempt the blameless seas, provoke the storms? Oh insatiable avarice of merchants! Even the sea yields to you and the main cannot withstand your unrest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 19"
