[[commentary]]
quote='''
It is not without reason that He is arrayed by Herod in a white robe, as bearing a sign of His immaculate Passion, that the Lamb of God without spot would take upon Himself the sins of the world.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He is clothed by the soldiers in a scarlet cloak and a purple tunic, in the one signifying the palms of the martyrs, in the other the insignia of royal power, because his flesh was to take up for us the blood shed over the whole world, and his Passion was to bring forth a kingdom out of us.

The crown of thorns too, fastened on his head, what else does it show but the gift of the divine work, that from the sinners of the world, as from the thorns of this age, a triumphal glory would be sought for God? Nor are the scourges without meaning, because he himself was scourged, that we might not be scourged; for a man under the stroke, and knowing how to bear infirmities, grieves for us, turning the scourges away from us, who before were fleeing from God, a Lord so patient that he offered his own hands to the bonds of fugitives, his own body to the scourges of fugitives. So, with a detestable disposition of mind, the Jews nevertheless reveal an honored death; for even while piercing they crown, while mocking they worship. Although they do not believe in their heart, they confess him whom they kill. They may have lacked the affection of a good work, yet God did not lack his honor, who is saluted as king, crowned as victor, worshiped as God and Lord.

The reed too, either, according to Matthew, is grasped in his hand, that human frailty may no longer be moved like a reed by the wind, but, strengthened by the works of Christ, may be firmly grounded, and that, with the handwriting that was against us nailed to the cross, the ancient sentence might cease; or, according to Mark, it strikes his head, that our condition, made firm by the touch of the divinity, may be unable to totter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
