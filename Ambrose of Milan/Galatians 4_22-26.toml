[[commentary]]
quote='''
Elsewhere too, that is, to the Galatians, he says that Abraham had two sons, one by the slave woman and one by the free, and he added: But he who was of the slave woman was born according to the flesh, and he who was of the free woman through the promise. Which things are said by way of allegory. What 'by way of allegory' means he set out plainly in what follows, saying that those two generations, the one from the slave woman, the other from the free, are two testaments, the one from Mount Sinai, bearing children into slavery, the mountain on which Moses received the law from the Lord, and the other from Jerusalem, which is free, which has borne sons in Isaac, that is, in the freedom of grace, not in the slavery of the letter; for punishment is decreed for slaves, grace is conferred on the free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"
