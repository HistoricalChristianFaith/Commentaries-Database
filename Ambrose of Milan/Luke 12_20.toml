[[commentary]]
quote='''
We have, then, the reasoning. But these things are human; that is divine which the Lord says: I have power to lay down my soul, and I have power to take it up again. You see, then, that that which is both laid down and taken up again, and is commended into the hands of God the Father, does not die with the body. But perhaps you may say: 'Specially: that is, what is Christ's.' And although he took up the things that are man's, yet, because establishing this too is a matter for another occasion, so as not to waste time, hear him who says: How do you know whether this night your soul be demanded back from you? Did he say: Let your soul die in you? No, but: be demanded back from you. What has been given is demanded back, or they demand it back from you. For the soul is demanded back, not destroyed. What is demanded back remains; what is destroyed does not remain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 10"

[[commentary]]
quote='''
Furthermore, O man, do you not know that the day of death anticipates the bringing forth of the earth, but that mercy shuts out death's assault? They are already nigh who demand your soul, and do you still put off the fruits of your works, do you still mete out to yourself a long time to live? Thou fool, this night do they require thy soul of thee. Well does He say night. At night is the soul of the miser demanded: it begins in darkness and continues in darkness. To the miser it is always night; to the just man, day; to whom it is said: Amen, amen I say to thee, this day thou shalt be with me in paradise. But a fool is changed as the moon. And the just shall shine as the sun, in the kingdom of their Father. Rightly is he charged with folly, who in eating and drinking places his hope. And therefore the time of death is urged by him in accordance with what is said by those who serve their gullets: Let us eat and drink; for tomorrow we shall die. Rightly is he called a fool who ministers things of the body to his soul, because he is storing away, without knowing for whom he is laying up.

And hence it is said to him: And whose shall those things be which thou hast provided? Why do you daily measure, and count, and seal? Why do you balance gold, weigh silver? How much better would it be, were you a generous distributor rather than an anxious custodian! How much more would it avail to your favor to be named the father of many orphans than to have countless staters sealed in your money-bag! For money is left here, favor goes with us to the judge of merit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 8"
