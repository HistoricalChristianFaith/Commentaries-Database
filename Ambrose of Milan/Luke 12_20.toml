[[commentary]]
quote='''
We have, then, the reasoning. But these things are human; that is divine which the Lord says: I have power to lay down my soul, and I have power to take it up again. You see, then, that that which is both laid down and taken up again, and is commended into the hands of God the Father, does not die with the body. But perhaps you may say: 'Specially: that is, what is Christ's.' And although he took up the things that are man's, yet, because establishing this too is a matter for another occasion, so as not to waste time, hear him who says: How do you know whether this night your soul be demanded back from you? Did he say: Let your soul die in you? No, but: be demanded back from you. What has been given is demanded back, or they demand it back from you. For the soul is demanded back, not destroyed. What is demanded back remains; what is destroyed does not remain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 10"
