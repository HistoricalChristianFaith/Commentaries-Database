[[commentary]]
quote='''
These shall be wounded who sanctify themselves, from these the bridegroom is taken away; but from us neither Caiaphas nor Pilate has taken Christ away, nor can we fast, because we have Christ and feast on the flesh and blood of Christ. For how is he seen to fast who does not hunger, how is he seen to fast who does not thirst? And how can he thirst who drinks Christ, since he himself said: Whoever drinks of the water which I shall give him shall not thirst for ever? Indeed what follows will also make clear that this was said of the fasting of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
