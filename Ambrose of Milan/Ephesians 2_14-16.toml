[[commentary]]
quote='''
Although their dissension through the transgression of the first man turned into nature, so that they in no way agreed with equal zeal for virtue, yet through the cross of the Lord Savior, with both the enmities and the law of commandments made void, they came together into the concord of fellowship, after Christ, our peace, coming down from heaven, made both one and broke down the middle wall of partition, the enmities in his flesh, making void the law of commandments in decrees, that he might create the two in one new man, making peace, and reconcile both to God in one body. Who are the two, except the one inner, the other outer? The one looks to the vigor of the soul, the other relates to the sense of the body, although they agree in the harmony of an inseparable affection, when the flesh, subjected to the better, obeys its saving commands; not that it migrates into the nature of the soul, its matter poured over into fineness. But because, having renounced delights and been cleansed from every stain of the vices, it walks the path of heavenly conduct with a disposition of obedience, no longer, as before, fighting against the law of the mind, but freed through the law of the mind and the spirit of life from the law of sin, so that the flesh becomes an appendage of the soul, no longer the procuress of the vices but a kind of emulator and, as it were, handmaid of virtue,

and again, when the soul does not connive at the enticements of the body nor is overcome by delight in carnal pleasures, but the mind, pure and stripped of servitude to this world, entices and draws the senses of the body into its own pleasures, so that through the practice of hearing and reading it feasts on the increase of virtue and is satisfied with the spiritual nourishment of an inner sap, never to know hunger; for reason is the food of the mind and an excellent nourishment of sweetness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
