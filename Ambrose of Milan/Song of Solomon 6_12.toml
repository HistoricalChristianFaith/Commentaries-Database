[[commentary]]
quote='''
In that bitterness, then, the soul did not know herself; for the corruptible body weighs down the soul, and the earthly dwelling is quickly bowed down. Yet she ought always to know herself. But Peter too was tempted, Peter too did not know himself; for if he had known himself, he would not have denied his Author. But Christ knew him; in fact he who also looked back at him knew him — for the Lord knows those who are his — and, as his own, he called him back from his fall with the reins of his mercy, like a good driver. Our driver, then, is Christ.

And so the soul says: It made me the chariot of Aminadab. The soul, then, is a chariot, which bears a good driver. If the soul is a chariot, it has horses, either good or bad. The good horses are the virtues of the soul, the bad horses are the passions of the body. So the good driver restrains and checks the bad horses and urges on the good. The good horses are four: prudence, temperance, fortitude, justice; the bad horses are anger, concupiscence, fear, wickedness. Sometimes the horses themselves are at odds with one another, and either anger pulls forward or fear, and they hinder one another and slow the course. But the good horses fly off and raise themselves from the earth to the heights and lift the soul up, above all if they have the sweet yoke and the light burden of him who says: Take my yoke upon you; for my yoke is sweet and my burden light. He is the driver who knows how to guide his own horses, so that the course of all may be even. If prudence is swifter, justice slower, he prods the more sluggish with his own whip. If temperance is milder, fortitude harsher, he knows how to yoke together those that disagree, lest they break up their chariot. And so one may, in a spectacle seen by the mind, see each soul snatched up to heaven in the highest contest, the horses hurrying to be the first to reach the prize of Christ, that the palm may the sooner be set upon their necks. These horses are subject to the yoke of faith, bound by the bond of love, by the reins of justice, by the halters of sobriety. Beautifully, then, she says: It made me the chariot of Aminadab, that is, of the father of the people. And he who is the father of the people is also the father of Nahshon, that is, of the serpent. Now call to mind who hung on the cross like a serpent for the salvation of all, and you will understand that that soul is peaceful which has God the Father as her guardian and Christ as her charioteer, for this name too is written in our books: Father, father, charioteer of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
In this world also do they fall asleep who are considered worthy of divine rebuke because they mounted horses that they could not curb. We read in another passage—the Church or the soul saying—: He made me the chariots of Aminadab. If, then, the soul is a chariot, see lest the flesh be the horse; but let the driver be the strength of mind which rules the flesh, and which, after the manner of horses as it were, checks its movements with the reins of prudence. They have fallen asleep, therefore, who have mounted the pleasures of the body, governing them with no moderation. Hence he preferred to call them riders rather than horsemen or drivers. For the driver, by training and skill, drives his horses as he wishes, so that he may urge them on in their course, or turn them back when ungovernable, or recall them when wearied, or bring them around gentle according to his will. Therefore when Elias was being taken up and carried in a chariot, as it were, to heaven, Eliseus cried out to him: Father, father, the driver of Israel and the horseman thereof, that is: you, who ruled the people of the Lord with good guidance, have received these chariots through the merit of your constancy and these horses coursing to Heaven, because the Lord has approved of you as a director of the minds of men; and therefore, like a good charioteer, you are being crowned as victor in the contest with the eternal reward. In the prophet Habacuc also, we read a passage addressed to the Lord Himself: Thou shalt ride upon thy horses and thy riding is salvation! for He drove His apostles, whom he directed into divers places, that they might preach the Gospel in the whole world. Thou shalt ride, he says, as to a driver of horses, and not to a rider. For the horseman also mounts, but so as to guide, and not merely to have a seat because, being slothful and lazy in his drowsy mind, he cannot continue his walking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 15"

[[commentary]]
quote='''
And the wheels are the life upon earth by which we live. If the four motions of our soul are lifted up, our life too is lifted up. And so he added: For the spirit he says of life was in the wheels. It is rather the soul, then, that is the chariot, the soul which says in the Song of Songs: You made me the chariots of Aminadab, that is, of our God. So the prophetic description does not agree with the tradition of philosophy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"

[[commentary]]
quote='''
In that bitterness, then, the soul did not know herself, For the corruptible body weighs down the soul, and the earthly dwelling is quickly bowed down (Wisd. 9). Yet she ought always to know herself. But Peter was tempted, and Peter too did not know himself; for had he known himself, he would not have denied his Author. But Christ knew him. Indeed he knew him, because he also looked back at him; for the Lord knows those who are his: and as his own, with the reins of his mercy, like a good driver, he called him back from his fall: our driver, then, is Christ. Hence it also follows:

It made me the chariot of Aminadab: because the soul is joined to the body, and, like a chariot of snorting horses, seeks a charioteer to be her driver. For Aminadab was the father of Nahshon, as we read in Numbers (Num. 1:7), who was prince of the people of Judah, whose figure is referred to Christ, who, the true prince of the people, mounting the soul of the just man as a charioteer mounts a chariot, steers her with the reins of the Word, lest she be swept by the fury of violent horses over steep places and precipices. For her four affections are like four horses: anger, desire, pleasure, fear: when she begins to be driven by these in their fury, she in no way knows herself. For the corruptible body weighs down the soul, and like a chariot of irrational animals sweeps her away against her will, as she rushes forward, as with a kind of headlong force, while her cares roll on, until the passions of the body we have mentioned grow gentle by the power of the Word.

This is the providence of the Word, as of a good charioteer: that the mortal body joined to that soul, which in itself is not subject to death, may not make the driving of her difficult. First, then, let him tame these swift motions of the body, and bridle them with the bond of reason; then let him take care that they do not entangle themselves like horses with uneven motion, so that the wicked one discolors the good, or the slow one hinders it, or the unruly one unsettles it. For the horse of malice snorts, and by tossing itself about harms the chariot, weighs on its yoke-fellow. This one the good charioteer soothes, and sends out onto the plain of truth, and he avoids the windings of deceit. Safe is the course to the higher things, perilous the descent to the lower. Thence, as having served their time well, those who have borne the yoke of the Word are led even to the manger of the Lord, in which the food is not hay, but the bread that came down from heaven. Of this chariot are the wheels of which the Prophet said: And the spirit of life was in the wheels (Ezek. 1:20); because the chariot of the soul, smooth and round, rolls on without any stumbling.

It made me the chariot of Aminadab. The soul, then, is a chariot, which bears a good driver. If the soul is a chariot, she has horses, either good or bad. The good horses are the virtues of the soul; the bad horses are the passions of the body. The good driver, then, restrains and calls back the bad horses, and spurs on the good. The good horses are four: prudence, temperance, fortitude, justice; the bad horses are wrathfulness, concupiscence, fear, iniquity. Sometimes the horses themselves disagree among themselves, and either wrathfulness pulls ahead, or fear: and they hinder one another, and slow the course. But the good horses fly, and lift themselves up from the earth to the higher things, and raise the soul; above all if they have the sweet yoke and the light burden of him who says: Take my yoke upon you; for my yoke is sweet, and my burden light (Matt. 11:29).

He is the driver who knows how to steer his own horses, so that the course of all may be even: prudence holds back the swifter, justice admonishes the more sluggish with her own whip; temperance makes them gentler, fortitude hardier. He knows how to yoke together the discordant, lest perhaps they tear his chariot apart. And so one may see, in a spectacle for the understanding, each soul swept up to heaven in the highest contest, the horses hastening to be the first to reach the prize of Christ, that the palm may be laid first upon their necks. These are the horses subject to the yoke of faith, bound by the bond of love, by the reins of justice, by the restraints of sobriety.

Beautifully, then, she says: It made me the chariot of Aminadab, that is, of the father of the people: and he who is the father of the people is also the father of Nahshon, that is, of serpents. Now call to mind who hung like a serpent on the cross for the salvation of all, and you will understand that that soul is peaceful whose protector is God the Father, and whose charioteer is Christ; for this name too is written in our books: Father, father, charioteer of Israel (2 Kings 2:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
