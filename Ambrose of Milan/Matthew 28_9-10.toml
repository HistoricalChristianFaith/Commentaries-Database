[[commentary]]
quote='''
Let us seek him at the end of the times, and embrace his feet and worship him, so that he may say to us too: Do not fear, that is, do not fear the sins of the world, do not fear the iniquities of the world, do not fear the waves of bodily passions: I am the forgiveness of sins. Do not fear the darkness: I am the light. Do not fear death: I am the life. Whoever comes to me shall not see death for ever, since he himself is the fullness of divinity, and his are honour, glory and everlastingness from the ages, both now and always and for all the ages of ages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
