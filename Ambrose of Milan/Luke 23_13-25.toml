[[commentary]]
quote='''
Here Pilate, who as a judge acquits Christ, is made the minister of His crucifixion. He is sent to Herod, sent back to Pilate, as it follows, Nor yet Herod, for I sent you to him, and behold nothing worthy of death is done unto him. They both refuse to pronounce Him guilty, yet for fear's sake, Pilate gratifies the cruel desires of the Jews.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He is sent to Herod, he is sent back to Pilate. Although neither pronounces him guilty, yet they comply with the zeal of another's cruelty. Pilate indeed washed his hands, but he did not wash away his deeds; for a judge ought to yield neither to ill will nor to fear, so as to hand over innocent blood. His wife warned him, grace shone in the night, the divinity stood out: not even so did he refrain from a sacrilegious sentence.

Likewise in this I think a type was set forth beforehand of all judges who would condemn those whom they judged innocent. Yet the person joined to Pilate shows that the Gentiles are more tolerable than the Jews, and that they can more readily be moved to faith by divine works. But what manner of men were those who crucified the Lord of majesty!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
