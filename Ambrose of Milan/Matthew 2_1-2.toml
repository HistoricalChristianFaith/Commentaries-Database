[[commentary]]
quote='''
(in Luc. iii. 41.) It is said, that some Idumæan robbers coming to Ascalon, brought with them among other prisoners Antipatera. He was instructed in the law and customs of the Jews, and acquired the friendship of Hyrcanus, king of Judæa, who sent him as his deputy to Pompey. He succeeded so well in the object of his mission, that he laid claim to a share of the throne. He was put to death, but his son Herod was under Antony appointed king of Judæa, by a decree of the Senate; so it is clear that Herod sought the throne of Judæa without any connection or claim of birth.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And yet who are these magi but those who, as a certain history teaches, draw their descent from Balaam, by whom it was prophesied: There shall rise a star out of Jacob? These, then, are heirs no less of his faith than of his line. He saw the star in the spirit, they saw it with their eyes and believed. They had seen a new star which had not been seen since the creation of the world, they had seen a new creature, and not only on earth but in heaven too they were seeking the grace of the new man, according to what Moses set down prophetically, that there shall rise a star out of Jacob, and a man shall spring up out of Israel. And they knew this to be the star which signifies man and God. They adored the little one. Surely they would not have adored him, had they believed him only a little one. The magus, then, understands that his arts are coming to an end, and do you not understand that your gifts have come? He confesses what belongs to another, and do you not recognize what was promised to you? He believes against himself, and do you not think you should believe for yourself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
