[[commentary]]
quote='''
Hear this also: that intemperance of this kind dissolves the love of marriage; it makes handmaids proud, matrons wrathful, spouses discordant, concubines insolent, husbands shameless. As soon as the handmaid has conceived by her master, she scorns her mistress as though she were richer by her child-bearing; the mistress grieves that she is despised and accuses her husband as the author of her wrongs. Indeed, Sarai herself had given her husband power over her handmaid, and afterwards she says to him: I receive injury from you. I have now given my handmaid into your bosom. But when she saw that she had conceived, I was scorned she says before her. May God judge between me and you. How great the pain and how grievous the complaint of women is, the reading sets forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
