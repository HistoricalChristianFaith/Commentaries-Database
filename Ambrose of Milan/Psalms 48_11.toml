[[commentary]]
quote='''
And since the prophet saw in the spirit that the praises of Christ were to be proclaimed in all lands, making, as it were by a kind of epilogue, a departure from the discourse he had undertaken, he exhorts us to gladness and to the worship of his name, saying: Let Mount Zion be glad, that is, those who trust in the Lord, as he himself afterwards interpreted it, saying: Those who trust in the Lord are like Mount Zion, and so on. Let the Lord Jesus himself, who is the mountain and height of his Church, which contemplates its Christ with all its affection, be glad in its faith and devotion, which has pleased God, since the unbelieving one has been rejected. This too, then, can be devoutly understood: that he himself, being higher than all, is also the mountain up which he who preaches the faith is bidden to ascend, as Scripture says: Go up into a high mountain, you who bring good tidings to Zion.

Let the souls that confess to you exult, he says. These are the daughters of that Judaea in which God is known. For this Judaea which is in the flesh or in the letter did not acknowledge the Lord; for if it had acknowledged him, it would also have received him. But it did not acknowledge him whom it did not receive, and it fled from his judgements, by which he declared that they sprang not from father Abraham but from the seed of the devil, since every sin is the seed of the enemy. But the daughters of confession do not commit sin; rather they overshadow it, and therefore blessed are they whose sins are covered. And rightly will the daughters of confession exult because of the judgements of the Lord, when they come to know his judgements and his ways, which in this world are unsearchable and untraceable for men; but when they begin to behold the truth face to face, then they will grasp the things that now seem unsearchable and will rejoice in the knowledge of them.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
