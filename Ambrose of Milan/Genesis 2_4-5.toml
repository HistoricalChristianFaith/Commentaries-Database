[[commentary]]
quote='''
He too knew that the day is manifold who wrote: this is the day of the generation of heaven and earth, when they were made; on which day God made heaven and earth and every green thing of the field. For when he had described seven days above, he afterwards embraced in one day all that had been made, showing the whole time of the world in the sight of the Lord as one day, because out of what was formless and dark the form of this world came forth by the brightness of the divine work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
