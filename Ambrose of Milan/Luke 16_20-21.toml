[[commentary]]
quote='''
Nor do we think it foreign to suppose that this discourse concerns faith as well, which Lazarus gathers when it is thrown away from the rich man's table. His sores, according to the letter, the fastidious rich man would surely shudder at, nor amid precious banquets and perfumed guests would he bear the stench of sores licked by dogs, he to whom the smell of the air and nature itself would be an object of disgust; although the insolence and swelling pride of the rich is expressed by fitting indications, in that they are so forgetful of the human condition that, as though set above nature, they take from the miseries of the poor the incentives of their own pleasures, laugh at the needy, insult the destitute, and take away from those on whom it befits them to have pity.

Let him, then, who will, gather both, like Lazarus. I think he is like him who, often beaten by the Jews, for the patience of believers and the calling of the Gentiles, offered the sores of his body to be licked by certain men, as it were by dogs, because it is written: They will return at evening and suffer hunger like dogs. That Canaanite woman recognized this mystery, to whom it is said: No one takes the children's bread and casts it to the dogs. She recognized that this bread is not the bread which is seen, but that which is understood, and therefore she answered: Yes, Lord; for even the little dogs eat of the crumbs that fall from their masters' table. These crumbs are from that bread. And because the bread is the word, and faith is of the word, the crumbs are as it were certain doctrines of the faith. Hence the Lord answered, to show that it was faithfully spoken: O woman, great is your faith.

O happy sores, which shut out perpetual pain! O rich crumbs, which drive away everlasting hunger, which fill the poor man who gathers you with eternal nourishment! The ruler of the synagogue cast you from his table when he rejected the inner mysteries of the prophetic scriptures and of the law; for the crumbs are the words of the scriptures, of which it is said: And you have cast my words behind you. The scribe cast you away, but Paul gathered you up most diligently, gathering a people amid his injuries. They licked his sores who saw him undaunted at the serpent's bite when the serpent was shaken off, and believed. That keeper of the prison licked them, who washed Paul's wounds and believed. Blessed dogs, upon whom the moisture of such sores drips, so that it fills their heart and fattens their throats, whereby they grow accustomed to guard the house, keep the flock, beware of wolves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
