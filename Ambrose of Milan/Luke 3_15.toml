[[commentary]]
quote='''
Now what could be more absurd than that he who was fancied to be in another should not be believed in his own person? He whom they thought to have come by a woman, is not believed to have come by a virgin; while in fact the sign of the Divine coming was placed in the childbearing of a virgin, not of a woman.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And as the people were reckoning and thinking in their hearts about John, whether perhaps he might be the Christ, he answered, saying: I indeed baptize you with water in repentance. So John saw the secrets of the heart. But let us consider whose grace this is. How the secrets of the heart become plain to prophets Paul shows, saying: The secrets of his heart too will be made manifest, and falling on his face he will worship God, declaring that God is truly among you. It is, then, the gift of God, who reveals, not the power of man. Such a one is helped by a divine gift rather than seeing by a natural faculty. And what does this thought of the Jews serve for, except to prove that Christ came according to the Scriptures? For there was one who was awaited, and surely it was the very one who was awaited that came, not one who was not awaited. But what is more foolish than that he who is supposed to be in another is not believed to be in himself? Whom they thought would come through a woman, they do not believe has come through a virgin. What generation according to the flesh was more worthy of God than that the immaculate Son of God should keep the purity of an immaculate generation even in taking up a body? And surely the sign of the divine coming was set in the childbearing of a virgin, not of a married woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
