[[commentary]]
quote='''
Behold, as you enter the city, a man will meet you carrying an amphora of water. It is good to consider where the Lord keeps the Pasch. According to Matthew you have: Go into the city to a certain man. First, mark the majesty of the divinity. He speaks with the disciples and already knows what is going to happen elsewhere. Next, behold his condescension, for it is not the person of a rich or powerful man that is chosen, but a poor man is sought out, and the cramped lodging of a poor man is preferred to the spacious houses of the nobles. Go he says to a certain man. You knew, Lord, his name, whose service you knew; you knew his service, whose meeting you knew; but he is designated without a name, so that he may be reckoned obscure. Nothing here is contrived, where not the person but the cause is expressed. But according to Mark, carrying a flagon of water.

This man, then, is commanded to the apostles to be followed. And how is he the master of the house? That you may recognize that the definition is one of holiness, not of wealth. How is it that he has a room spread in the upper part? That you may notice his great merit, in whom the Lord with his disciples would rest, delighting in his lofty virtues. Would that it might be my lot, then, to carry an amphora of water, my lot to carry a flagon of water, which the master of the house carries, who has a large room spread in the upper part. For what is an amphora but a more perfect measure, having no middling measure? Measure, the Lord says, good, shaken together, running over, they will give to you.

And of water what shall I say? Above the water, before the very birth of the world, the Holy Spirit, as you read, was borne. O water, which washed the world when it was sprinkled with human blood, so that a figure of the present washings might go before! O water, which merited to be the sacrament of Christ, which washes all things and is not washed! You begin first, you complete the perfect mysteries. From you is the beginning, in you the end, or rather you cause us to know no end. Through you the stench of wasting flesh is done away, and entrails perishing with decay are preserved for a long age, when salt is sprinkled on them. Through you a drink is poured into bodies parched with heat, sweet for delight, saving for life, pleasant for enjoyment; you gave a name to the prophets and apostles, you gave a name to the Savior — they are clouds of heaven, they the salt of the world, he is the fountain of life —; you who, pressed by mountains, are not shut in; dashed upon rocks, are not broken; poured into the earth, do not fail; but, welling up from the inmost veins, either, enclosed, you breathe forth the vital spirit, or, spread abroad, you supply fertile moisture, or, poured over, you furnish fitting irrigation, lest the earth, its vital parts dried up and lifeless, should deny its yearly harvests. The substance of all the elements, heaven, air, sea, earth, give you back. You the rock poured forth, struck by the prophet's touch, to water the hearts of thirsting peoples; you, when you burst forth from the side of the Savior, those who struck him saw, and they believed; and therefore you are one of the three witnesses of our regeneration; three, indeed, are the witnesses, the water, the blood and the spirit: the water for the washing, the blood for the price, the spirit for the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
