[[commentary]]
quote='''
But she not only washed, but also called, as we receive it in the same book, where the holy Church says: Come, my brother, let us go out into the field, let us rest in the villages, let us rise early to the vineyards, let us see whether the vines have flowered. So she not only washes, but also summons and invites Christ to come to her, saying: To you I will give my breasts. And not only her own, but she also promises things new and old, as you have it: New and old, my brother, I have kept for you. And as though impatient of love she seeks the support of someone by whom Christ may be asked to come. See her burning, see her longing. Who will give, she says, you, my brother, sucking the breasts of my mother? And she shows for what reason she seeks and with what grace she invites and how she can hold him, and she shows how she awaits him while he lingers outside, and she implores him to enter her house, saying: Finding you outside I will kiss you, I will take you and bring you into the house of my mother and into the secret chamber of her who conceived me. You see how she is naked, she who cannot keep covered the secret of a nature surely undefiled, the secret of an inmost conscience not stamped by any recklessness of vices. For the holy Church and spotless virginity is a garden enclosed, which therefore deserves this grace from Christ, because it sought, desired and found the Word of God, keeping watch before the doors of wisdom, as she herself says: Blessed is the man who hears me, and the man who will keep my ways, keeping watch at my doors daily, guarding the posts of my entrance; my goings out indeed are the goings out of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 9"
