[[commentary]]
quote='''
And their eyes were opened, we are told, and they realized that they were naked. They were naked, it is true, before this time, but they were not devoid of the garments of virtue. They were naked because of the purity of their character and because nature knows nothing of the cincture of deceit. Now, on the other hand, the mind of man is veiled in many folds of deception. When, therefore, they saw that they had been despoiled of the purity and simplicity of their untainted nature, they began to look for objects made by the hand of man wherewith to cover the nakedness of their minds and hearts. They added gratification so as to increase the idle pleasures of this world, sewing, as it were, leaf upon leaf in order to conceal and cover the organ of generation. But how explain the fact that Adam had his bodily eyes closed, whereas he was able to see all living creatures and confer names upon them? Well, just as by way of an inner and deeper knowledge they were able to realize, not that they were without garments, but that the protective covering of virtue was no longer theirs.

So they sewed fig-leaves together and made themselves coverings. We are taught by the content of holy Scripture how we should interpret the meaning of the word "fig" in this passage. Scripture relates that the saints are those who find rest beneath the vine and the fig. Solomon has said: Who plants the fig tree and does not eat the fruit thereof? Yet the owner may come to the fig tree and may be offended by finding there merely leaves and no fruit. I have information from Adam himself, in fact, about the significance of the leaves. He proceeded to make a covering for himself out of the leaves of the fig tree after he had sinned, whereas he should have had its fruit instead. The just man chooses the fruit; the sinner, the leaves. What is the fruit? We read: The fruit of the spirit is charity, joy, peace, patience, kindness, modesty, continency, love. He who possessed no fruit possessed no joy. The person who violated the command of God did not have faith, and he who ate of the forbidden tree did not have the virtue of continency.

Whoever, therefore, violates the command of God has become naked and despoiled, a reproach to himself. He wants to cover himself and hide his genitals with fig leaves, making use, as it were of empty and idle talk which the sinner interweaves word after word with fallacies for the purpose of shielding himself from his awareness of his guilty deed. Desiring to conceal his fault, he throws leaves over himself, at the same time indicating that the Devil is responsible for his crime. He offers allurements of the flesh or the recommendations of another individual as excuses for his wrongdoing. He frequently produces examples from holy Scripture, citing them as instances of how a just man may fall into sin, the sin of adultery: And Abraham lay with his handmaid and David loved a strange woman whom he made his wife. He patches together examples for his purposes from the list of prophetical books of Scripture. He sees the leaves and ignores the fruit.

Do not the Jews seem to you to be patchers of leaves when they interpret in a material manner the words of the spiritual Law? Their interpretation, condemned to eternal aridity, loses all the characteristic greenness of the fruit. There is a correct interpretation, therefore, which points to a fruitful and spiritual fig tree beneath which just men and saints find their rest. Whoever plants this tree in the souls of every man will eat the fruit thereof, as Paul says: I have planted, Apollos watered. But the wrong interpretation will not confer the fruit nor conserve its viridity.

It was a serious matter, therefore, when, following this interpretation, Adam girded himself in that place where it would have been better that he had girded himself with the fruit of chastity. Seeds of generation are said to exist in our loins around which we bind our garments. Hence, Adam did wrong on that occasion when he girded himself with leaves that have no utility, inasmuch as by this act he implied, not the fruit of a future generation, but certain sins which remained until the coming of our Lord and Saviour. But, when the master came, He found the fig tree uncultivated. Elsewhere, when requested that he should order it to be cut down, the owner of the fig tree allowed it to be cultivated. And so we gird ourselves, not with leaves, but with the divine Word, as the Lord Himself says: Let your loins be girt about and your lamps burning. Wherefore He prohibits us to carry money even in our girdles. Our girdles ought not to store up worldly objects, but things of eternal nature.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 13"

[[commentary]]
quote='''
We can also understand this: that Adam and Eve covered themselves with leaves when they sought bodily garments, because the resurrection of the Lord's body was being prophesied, since the flesh, which had formerly been wont to perish like leaves, was not going to perish in Christ and in all the righteous who, according to the Gospel, would shape their life and actions in imitation of the tree of wisdom born of a virgin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
If, then, this cannot accord with belief, let us seek who this naked woman is: namely, the human condition, stripped of all the garments of nature, lacking the mantle of immortality and despoiled of the veil of innocence; for he is naked who is stripped by sin and guilt. Accordingly, that first sinner of our race — and would that he had been the only one —, before he sinned, did not perceive that he was naked; after he sinned, he saw that he was naked, and therefore thought that he must be covered with leaves, because he knew that he was naked. So he became naked to himself after he became answerable for guilt. In him the whole human condition was stripped, and through the succession of nature became liable not only to guilt but also to hardship. So he perceived and saw that he was naked. Hence our whole condition is such that he who thinks himself naked both sees and perceives himself naked. Accordingly, he who covets riches is naked; he who despises them is wealthy. So true is it that each one's own feeling is his hardship, and each one's own virtue is free from injury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"
