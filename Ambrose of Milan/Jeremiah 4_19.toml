[[commentary]]
quote='''
By these words the nature of the serpent seems indeed to be described, but rather every vessel of wickedness is described, every serpent of depravity, who casts himself down upon his belly and shuts his poison up within himself and rolls it about inside in his breast, slippery in his thoughts and walking upon his frauds, entangling himself in his own wiles, always stirring and agitating his poisons when he thinks, trampling also his belly, that is, the seedbed of his heart. Hence David says beautifully: Sinners have been estranged from the womb, they have gone astray from the belly, they have spoken falsehoods. Their fury is after the likeness of the serpent, like the deaf asp that stops its ears, which will not hear the voice of the charmers and of the sorcerer, who are charmed by the wise man. For this reason, too, that seems beautifully said which we read in a prophetic book: I am in pain in my belly, my belly! because wickedness is there where innocence ought to be, and that part labours the more which ought to be the calmer in us, and it is trodden down by the footprints of malice, goaded by its claws, shaken by a certain advance and growth of depravity, there where the generative seed of an eternal posterity lies. This seems indeed to be referred to his grief that the sons whom he had begotten and taken up had perished, but much more to his not having in his belly the seedbed of the word. Therefore he speaks of his belly as of something most precious. For precious is the womb of the mind, in which a fruitful crop of counsels is wont to spring up from the seed of the word, and in which certain members, as it were, of the whole life and of the virtues and disciplines are wont to be formed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
