[[commentary]]
quote='''
A man's riches ought to avail to the ransom of his soul, not to its destruction. And a treasure is a ransom, if a man use it well; on the other hand it is a snare, if a man know not how to use it. What is a man's money to him but a provision for his journey? Much is a burthen, a little is useful. We are wayfarers in this life; many walk, but it is needful that we walk aright, for then is the Lord Jesus with us, as we read, When thou passest through the waters I will be with thee, and through the rivers, they shall not overflow thee; when thou walkest through the fire thou shalt not be burned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%25201-10.html'
source_title="Letters 1-10"

[[commentary]]
quote='''
Be strong for God, rich for God, so that it may be said of you: The ransom of a man's soul is his riches. Abound in the treasure of wisdom, be rich in word and good works, so that you may be fortified. Flee the riches of the sinner, lest he find where he can wound you. Be merciful, so that you may remain unwounded, or may be able to heal yourself if you have been wounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The testimonies of the divine Scriptures abound for us, by which we are taught that there is nothing more precious in man than faith, that no patrimony is so great as to be compared with the price of our salvation and of our soul. By faith Abraham left his country and land and even the kin he saw, and followed him whom he did not see as though he beheld him; Moses too valued the price of his soul above all the riches of Egypt. Why do I speak of sublime men? Rahab the harlot, that foreigner from the world, yet thought that her soul should be redeemed not only by contempt of all she had but even by the perils of her life; she denied the spies of Jesus son of Nave [Joshua] to her fellow citizens when they sought them, and preferred to hide rather than betray men who were enemies of her country, yet envoys of faith. Not the threats of her fellow citizens, not the perils of wars, not the burning of her country, not the dangers of her own people terrified her. Learn, man, learn, Christian, how you ought to follow the true Jesus, when a woman despised all that was hers and followed Jesus in figure because of the likeness of the name. Whence Solomon finely said: A man's riches are the redemption of his soul. Redeem, then, your soul. Money is cheap, but it becomes precious through faith; it is cheap when it is hoarded, precious when it is dispersed; for thus it is written: He has dispersed, he has given to the poor, his righteousness remains for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
We have also many things furnished to us whereby we may redeem our sins. You have money: redeem your sin. The Lord is not venal, but you yourself are venal. You have been sold by your sins; redeem yourself by your works, redeem yourself by your money. Cheap is money, but precious is mercy. For Alms delivereth from [sin]; and in another place: The ransom of a man's life are his riches; and in the Gospel: Make unto yourselves friends of the mammon of iniquity. And poison is frequently tempered by an antidote; that is, poison is expelled by poison; by poison is death repelled, life saved. Do you also, like a good steward, make the aid of mercy from the instrument of avarice, and make the favor of purity from the enticement of corruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 20"
