[[commentary]]
quote='''
‘And the Spirit of God,’ he said, ‘moved over the waters. And God said: Be light made.’ Rightly, therefore, was the Spirit of God sent forth where the divine operation was to begin. He said: ‘Be light made.’ Whence should the voice of God in Scripture begin, if not with light? Whence should the adornment of the world take its beginning, if not from light?

There would be no purpose in the world if it were not seen. In fact, God Himself was in the light, because He ‘dwells in light inaccessible,’ and He ‘was the true light that enlightens every man who comes into this world.’ But He wishes the light to be such as might be perceived by mortal eyes. The person who desires to erect a house as a fitting habitation for the head of a family determines first how it may receive light abundantly before he lays the foundation. This is the first requisite. If this is lacking, the whole house is without beauty and is uninhabitable. It is light which sets off the other beautiful objects in the house.

‘Let light be made,’ He said. When the word ‘light’ is used, it is not intended to mean merely the preparation for performance; rather, it is the splendor of the operation itself in action. The Fabricator of nature uttered the word ‘light’ and also created it. The Word of God is His will; the work of God is nature. He created light and illumined the darkness. ‘And God said, be light made, and light was made.’ He did not speak in order that action should follow; rather, the action was completed with the Word. Hence, David appropriately uttered the statement, ‘He spoke and they were made,’ because the fulfillment of the act accompanied the Word.

God, therefore, is the Author of light and the place and cause of darkness is the world. But the good Author uttered the word ‘light’ so that He might reveal the world by infusing brightness therein and thus make its aspect beautiful. Suddenly, then, the air became bright and darkness shrank in terror from the brilliance of the novel brightness. The brilliance of the light which suddenly permeated the whole universe overwhelmed the darkness and, as it were, plunged it into the abyss. Fittingly, therefore, and appropriately was it said: ‘Light was made.’ For, just as light quickly illuminated the heavens, the earth, and the seas, and in a moment, without our being aware of it, when the land is unveiled at the splendor of dawn, this light is perceived as it encompasses us, in such a manner should its birth be explained. Why do we marvel at the fact that God simply said ‘light’ and flashed forth brilliance on a darkling world, when we know that, if a person immersed in water should emit oil from his mouth, all that which is hidden in the deep is made clearer?

God did not speak as one would utter a sound through the vocal organs or as a movement of the tongue might produce an exhortation from heaven or as a sound of words might strike this air of ours. His purpose was to reveal the knowledge of His will by the effects of His work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
