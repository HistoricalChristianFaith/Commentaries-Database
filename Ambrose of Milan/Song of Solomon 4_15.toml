[[commentary]]
quote='''
There remains for us the well of mystical things, which we also find in the Song of Songs, where Scripture says: a fountain of gardens, a well of living water, and a rushing stream coming down from Lebanon. For if you pursue the depth of the mysteries, it seems to you a well, since mystical wisdom lies as it were in the deep; but if you wish to draw the abundance of love, which is greater and richer than faith and hope, then it is a fountain for you. For love overflows, so that you can both draw it close at hand and water with its abundance your garden, overflowing with spiritual fruits. And because he who has love is beyond the very well of Breadth, therefore he said that where love is, there a great rushing stream comes down from Lebanon. And lest it trouble anyone that he called the same thing both a well and a fountain, let the Gospel too instruct you, in which it is written that Jesus came to a city of Samaria which is called Sychar, near the estate which Jacob gave to his son Joseph. Now Jacob's fountain was there. And being wearied it says he was sitting thus upon the well. Hence we recognize there too that this well is to be referred to mystical teaching, because there that Samaritan woman, that is, the guardian, and the guardian of the heavenly precepts, drew divine mysteries from that well, learning that God is spirit and is worshipped not in a place but in spirit, and that the Messiah is Christ, and that therefore he who is still awaited by the Jews has already come. When she had heard these things, that woman, who bears the figure of the Church, came to know the mysteries of the Law and believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
