[[commentary]]
quote='''
There remains for us the well of mystical things, which we also find in the Song of Songs, where Scripture says: a fountain of gardens, a well of living water, and a rushing stream coming down from Lebanon. For if you pursue the depth of the mysteries, it seems to you a well, since mystical wisdom lies as it were in the deep; but if you wish to draw the abundance of love, which is greater and richer than faith and hope, then it is a fountain for you. For love overflows, so that you can both draw it close at hand and water with its abundance your garden, overflowing with spiritual fruits. And because he who has love is beyond the very well of Breadth, therefore he said that where love is, there a great rushing stream comes down from Lebanon. And lest it trouble anyone that he called the same thing both a well and a fountain, let the Gospel too instruct you, in which it is written that Jesus came to a city of Samaria which is called Sychar, near the estate which Jacob gave to his son Joseph. Now Jacob's fountain was there. And being wearied it says he was sitting thus upon the well. Hence we recognize there too that this well is to be referred to mystical teaching, because there that Samaritan woman, that is, the guardian, and the guardian of the heavenly precepts, drew divine mysteries from that well, learning that God is spirit and is worshipped not in a place but in spirit, and that the Messiah is Christ, and that therefore he who is still awaited by the Jews has already come. When she had heard these things, that woman, who bears the figure of the Church, came to know the mysteries of the Law and believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
A fountain of gardens, a well of living waters, which flow with a rush from Lebanon. You have these in Solomon, because his Proverbs are moral, Ecclesiastes natural, in which he as it were despises the vanities of this world; his Song of Songs is mystical. You have it also in the prophet: Sow for yourselves unto justice, gather the vintage unto the fruit of life, light for yourselves the light of knowledge (Hos. 10:12); for this is the light of knowledge, to have the perfection of love. And therefore it is said: Fear not (John 12:15); for love casts out fear.

But that we may know that Solomon interpreted in this way these three wells which Jacob dug, so as to refer them to moral, natural and mystical doctrine, he placed these wells in each of his books, which he wrote on moral and natural or mystical matters. For in Proverbs too, when he was saying that the appearance of worldly allurement must be shunned, he says: Drink water from your own vessels, and from the springs of your own wells, and let waters overflow for you from your own fountain (Prov. 5:15). And below: Let the fountain of your water be your own, and rejoice with the wife who is from your youth (ibid. 18); because true wisdom is a remedy for us against the temptations of the world. Moral doctrine too it is that washes away with its watering, and wipes off with the stream of its fountain, the image of worldly pleasure smeared with a kind of harlot's paints.

Of natural things too you have the well itself in Ecclesiastes: I made myself pools of water, to water from them a sprouting wood (Eccles. 2:6). Nor let it trouble you that he put pools in place of a well, since Moses too spoke of the well of breadth; because he who has risen above this world with a pious mind is released from all anxiety and straits. Not without reason, then, does Ecclesiastes have pools, he who saw that there is no abundance under the sun: but if anyone wishes to abound, let him abound in Christ.

Of mystical things there remains for us the well too, which we also find in the Song of Songs, where Scripture says: A fountain of gardens, a well of living water, and descending with a rush from Lebanon. For if you pursue the depth of the mysteries, mystical wisdom seems to you a well, as though set in the deep; but if you wish to draw the abundance of love, which is greater and richer than faith and hope, then it is a fountain for you. For love overflows, so that you can both draw it close at hand and water with its abundance your garden, overflowing with spiritual fruits. And because he who has love is himself a well of breadth, therefore he said that where love is, there a great rush descends from Lebanon.

But lest it trouble anyone that he called the same thing both a well and a fountain, let the Gospel too instruct you, in which it is written: That Jesus came to a city of Samaria which is called Sychar, near the estate which Jacob gave to his son Joseph (John 4:5 and 6). Now Jacob's fountain was there: And being wearied, he says, he was sitting thus upon the well. Hence we recognize that there too this well is referred to mystical doctrine, because there that Samaritan woman, that is, the keeper (and the keeper of the heavenly precepts), drew from that well the divine mysteries, learning that God is spirit, and is worshiped not in a place but in spirit; and that the Messiah has come, who is Christ. When she had heard these things, that woman, who bears the figure of the Church, came to know the sacraments of the Law and believed.

A fountain of gardens, a well of living waters, and a rush descending from Lebanon. These rushes the Church has drawn down from Lebanon; by this rush sins are washed away; by this rush of the pure fountain of the Holy Spirit the Bride was present from Lebanon, and from the beginning of faith passed over the world, and passed through to the kingdom. To some spiritual grace is a fountain, to others a well, according to our capacity: to some an enclosed garden, a sealed fountain; to others the fountain of gardens, which is counted in the dowry of the Church; to others a rush descending from Lebanon, and a great rush which never fails. For the breasts do not fail from the rock, nor the snow from Lebanon, nor the water which is borne by a strong wind to the virgin Jerusalem.

The rush descended from Lebanon when, the apostles and many believers being gathered together, suddenly there came a sound from heaven, as though a spirit were borne along with great force, and all were filled with the Holy Spirit, who gave diversities of tongues (Acts 2:1, 3). Good is the rush that knows not how to harm and knows how to fill. If anyone, then, wishes to merit this rush of grace coming upon him from heaven, let him too go down with his eyes into the courses of waters. He who has first poured out this rush will merit that one. She went down with her eyes into these channels of waters who in the Gospel watered the feet of the Lord with tears (Luke 7:38), and therefore by the price of her faith she bought health for her soul and body, now no longer flowing with blood, but with spiritual grace.

So the prophet David went down; therefore he brought back grace out of sin. He went down into the channels of waters, that is, he filled them, and heaped up the streams of the running waters with his tears, or filled empty and void channels with his weeping alone. Or, since it shows certain meanings of moral expression, "he went down into the channels of waters" means he passed through them. And we could say "he passed over them" and "he stepped beyond them": but then the force of the wording is lessened, by which a greater force is expressed in an abundance that descends than in one that ascends. See, I ask you, what words take from usage; let prophetic speech not lose its rush, although usage itself has been accustomed to serve the sense of the writers with greater beauty.

A well of living waters; for a well, if you draw nothing from it, is easily corrupted by sluggish idleness and degenerate neglect; but when it is worked, it grows bright to the sight and sweet to drink. So too a heap of riches, sandy as a mere pile, is beautiful in use, but in idleness is held useless. Draw off something, then, from this well: For water quenches a burning fire, and almsgiving resists sins (Sir. 3:33). But standing water soon breeds worms: let not your treasure stand still, lest your fire stand. It will stand in you, unless you turn it aside by the works of your mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
