[[commentary]]
quote='''
The middle he paved with love, for the daughters of Jerusalem. Who are these daughters? It ought not to be hidden that those who were begotten earlier seem superior, those begotten later weaker. For the births of this world are compared to a woman's womb; since those are stronger who are born in the vigor of youth, weaker those born in the time of old age. For this world has grown weak with the multitude of its generation, like the womb of one who bears, and, as a creation growing old, lays down the strength of its youth, as the vigor of its powers is now withering. These, then, are the daughters of Jerusalem, that is, the more tender and weaker souls: to these he shows himself, that his image may shine in their confession, shine in their love, shine in their works; and, if it can be, that his whole form may be expressed in them.

These daughters of Jerusalem, then, seeing the bride ascending and not resisting, and delighted by the fragrances of her merits, recognizing too that she is the bride of that peaceful Solomon, follow her also with assiduous escort even to the couch of Solomon: because true rest is owed to her in Christ. For Christ is the couch of the saints, on which the hearts of all, wearied by the battles of the world, find rest. On this couch Isaac rested, and blessed his younger son, saying: The elder shall serve the younger: reclining on this couch Jacob blessed the twelve patriarchs: reclining on this couch the daughter of the ruler of the synagogue rose from death: lying on this couch the widow's only son, dead, called by the voice of Christ, loosed the bonds of death. The bride, then, having been brought to the bridegroom's rest, they sing the wedding song, saying to the daughters of Jerusalem:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
