[[commentary]]
quote='''
And so the young man, rushing forward, said: What are you waiting for? And crying out many things, that he could by no means be torn from the fellowship of his brothers, whose deaths were far more blessed than the commands of the king, while he pressed the king with reproaches, he too, tortured with bitter kinds of torments, discharged the duty of this life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
