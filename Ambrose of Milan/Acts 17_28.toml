[[commentary]]
quote='''
Who, then, would doubt the good of death, when that which is restless, that which is shameful, that which is hostile to us, that which is violent, that which is stormy and alluring to every vice, comes to rest and lies still and is shut up like a wild beast in the cage of the tomb; when its madness is left lifeless and the dead framework of the entrails is dissolved into the earth; while that which is akin to the virtues, a friend to disciplines, eager for glory, a follower of the good, subject to God, flies away to that sublime place and abides with that pure, everlasting and immortal good, cleaves to it and is with it, from which it draws its kinship, as someone says: for we are also his offspring? For it is plain that the soul does not die with the body, because it is not from the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 9"

[[commentary]]
quote='''
Lay open, then, that truly good thing of yours, that divine good, in which we both live and are and move. We move as in the way, we are as in the truth, we live as in eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
