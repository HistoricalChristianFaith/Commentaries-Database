[[commentary]]
quote='''
The traitor, then, did not remain with the apostles, he who went outside and whispered with the unbelieving. Divine Scripture used this word, showing that unbelief is without authority, since it fears that what it says will be caught out. But to the faithful man it is said: lift up your voice with strength. See to what the apostle Judas had fallen, he who had been sent to preach the faith to the Gentiles with a proclamation full of authority: to whisper into the ear of his master's plotters what he feared to have heard. Did he not condemn himself by his own judgement? But he blushed that what he did not fear to do should be heard; he blushed, because he was devising evil against the author of his life, of his sanctification and of his honour, and did not repay kindnesses with gratitude, but returned evil for good to a good master, a thing which even men of the world are accustomed to condemn; he blushed to be caught being ungrateful, he blushed to be seen to be avaricious, since he was betraying the salvation of his author for money; he blushed to be seen to be unbelieving. Likewise the Jews also, who in their unbelief suborned false witnesses against the master of the faith, to say that he had preached that the temple of God which Solomon built was to be destroyed, whereas he had signified it of the temple of his body: destroy this temple, and in three days I will raise it up, were truly outside, being shut out from the knowledge of the heavenly Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
