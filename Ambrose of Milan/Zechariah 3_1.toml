[[commentary]]
quote='''
If Adam had been willing to have the Lord at his right hand, he would not have been deceived by the serpent. But because he forgot the commandment of God and fulfilled the will of the serpent, the devil held his hand and made it stretch out to the tree of the knowledge of evil and good, so that he plucked what was forbidden. In him judgment was passed beforehand on all, and the adversary began to stand at the right hand of all. Hence also that form of curse went forth against Judas: And let the devil stand at his right hand. If that curse is heavy, this blessing is very great, by which the bonds of the harsh curse are loosed. Therefore the Lord Jesus set the devil at his own right hand, as we read in the book of Zechariah; for he had taken up the cause and the place of man. He stood, then, there where the inheritance of Adam stood. Like a good athlete he allowed him to stand at his right hand, so that he might drive him back, saying: Get behind, Satan. And so the adversary, cast down from his place, withdrew; and so that the devil might not stand at your right hand, he says: Come, follow me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 10"
