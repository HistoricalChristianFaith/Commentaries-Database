[[commentary]]
quote='''
And therefore holy David, seeing that by this kind of moral dealing of God he was the more weighed down, flees from judgement and asks for mercy, saying: And do not enter into judgement with your servant, for in your sight no living man shall be justified. He confesses that he has been placed in darkness as one dead of the world. Cautiously he said as one dead of the world, not dead. For those who die in Christ are not dead of the world; but those are dead of the world who set their whole life, which they have lived in the world, in destruction and death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
