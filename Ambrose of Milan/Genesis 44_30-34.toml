[[commentary]]
quote='''
Morally, then, they were unwilling to go back without their brother; mystically, to return without Paul; for they declared that, if he were lost, the old age of the parent people would be brought down to sorrow.

And therefore Judah wished to remain with Joseph, that he might not see the evils that befell his father; that is, he already foresaw and wished to guard against the evils that were to come upon the people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 11"
