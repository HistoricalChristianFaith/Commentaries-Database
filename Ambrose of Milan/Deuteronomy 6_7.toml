[[commentary]]
quote='''
Therefore Scripture says to you: You shall speak of them sitting in the house, walking on the way, sleeping, rising up. Let us, then, speak the Lord Jesus, because he himself is wisdom, he himself is the word and the Word of God. For this too is written: Open your mouth to the word of God. He breathes him who sounds forth his discourses and meditates his words. Let us always speak him. When we speak of wisdom, it is he; when we speak of virtue, it is he; when we speak of righteousness, it is he; when we speak of peace, it is he; when we speak of truth and life and redemption, it is he. Open your mouth to the word of God, it is written. You open it, he speaks. Therefore David said: I will hear what the Lord speaks in me, and the Son of God himself says: Open your mouth, and I will fill it. But not all can receive the perfection of wisdom as Solomon did, not all as Daniel did; yet the spirit of wisdom is poured into all according to their capacity, but into all who are faithful. If you believe, you have the spirit of wisdom. Therefore the wise man says: I believed, therefore I have spoken. When you have believed, you will receive the grace of speaking. And he who believes is redeemed, and he who prays is redeemed, if he applies himself devoutly to prayers and is assiduous in prayer, if he anticipates the day, frequents the night, goes to meet the morning hours of the sun, so that he himself is enlightened by Christ before the earth is by the rising of the sun. And he who sings psalms is redeemed, and he who is pricked with compunction is redeemed.

Therefore meditate always, speak the things that are God's, sitting in the house. We can take the house as the Church; we can take the house as the interior within us, so that we speak within ourselves. Judges sit in Jerusalem; seats were set for judgement; a council of judges also sat, and the books were opened. The prophet says: And do all things with counsel. Judge of your deeds with counsel, drink wine with counsel, speak with counsel, so that you may escape sin, lest you fall into it through much speaking. Sitting, speak with yourself as one who judges. On the way speak, so that you may never be idle. You speak on the way if you speak in Christ, because Christ is the way. On the way speak to yourself, speak to Christ. Hear how you should speak to him: I will, he says, that men pray in every place, lifting up pure hands, without anger and disputing. Speak, O man, while sleeping, lest the sleep of death steal upon you. Hear how you should speak while sleeping: If I give sleep to my eyes and slumber to my eyelids, until I find a place for the Lord, a tabernacle for the God of Jacob. Overcome nature by diligence, shut out the sleep of the body. We cannot form our nature, we can form diligence. David was a man; he gave something to sleep too through the night, but he shut out sleep by washing his bed every night and watering his couch with tears. Therefore he was always mindful of his Lord upon his couch and meditated on him, so that he might anticipate the dawn and Christ might shine upon him in the darkness, saying: Rise, you who sleep. This grace is not in all, but diligence can be in very many. Do not, then, wait for Christ to rouse you, but rather rouse Christ. He rouses him who, while sleeping, thinks of him. If you rouse him, he too will rouse you from sleep, will raise you from death, saying to you: Arise from the dead. When, then, you rise up or rise again, speak him, so that you may fulfil what you are commanded. Hear how Christ rouses you. Your soul says: The voice of my brother knocks at the door, and Christ says: Open to me, my sister, my bride. Hear how you may awaken Christ. The soul says: I have adjured you, daughters of Jerusalem, if you should stir up and awaken charity. Charity is Christ. Hear also how you may speak while sleeping: I sleep, and my heart keeps watch. These things in the common sense; now raise your mind a little higher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Speak sitting in the house, in this earthly house of this habitation which is dissolved, in which we are sojourning away from the Lord. For placed in this body, while we wish to be clothed over rather than stripped, we are exiles from Christ and groan heavily. Sitting in this, then, confess your sins, because you have sat and not stood, and have not said: Our feet were standing in the courts of Jerusalem. Speak rather, and do not hide your offences; speak sitting, so that you may hear him say: Rise, after you have sat, you who eat the bread of sorrow. Speak walking on the way, that is, as you take the course of this life. Speak here, lest there you be struck dumb, as he was struck dumb who did not at first believe the angel of Christ, but afterwards, when he had believed, received his voice. Speak sleeping and at rest, buried together in Christ, so that with him you may rise again in newness of life. Speak even when buried in the tomb, as the souls of the saints spoke, seeking vengeance on the author of death: How long, O Lord, holy and true, do you not judge and avenge our blood? Speak lastly when you rise, as he taught who said: I slept and rested and rose again, since the Lord will take me up. And there too, then, the mouth of the righteous man shall meditate wisdom, until he himself arrives at the more sublime secrets of the tabernacle, full of heavenly and sacred joy and gladness, as Scripture has taught us, when David says: These things I remembered, and I poured out my soul upon me, for I shall go into the place of the wonderful tabernacle, even to the house of God, with the voice of exultation and confession, the sound of one feasting. So both sitting in this bodily house, and having gone forth from here and walking on the way when we are caught up, if we deserve it, to meet Christ, and sleeping, we shall speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
