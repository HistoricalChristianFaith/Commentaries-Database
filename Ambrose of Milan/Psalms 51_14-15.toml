[[commentary]]
quote='''
By the tongue, then, we understand the speech that exults in the praises of God. Hence that verse too is understood in this way: My tongue is the pen of a scribe that writes swiftly: the speech poured into the prophet.

But if we take it as said in the person of Christ, see whether the scribe that writes swiftly may not be the Word of God, which runs through and penetrates the inward parts of the soul and inscribes in them the gifts either of nature or of grace, while the tongue is that holy body born of the virgin, by which the serpent's poisons were made void and the works of the gospel, to be celebrated through the whole world, were carried through.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 17"
