[[commentary]]
quote='''
And when they reported back that his son Joseph was alive, he, though broken in body, yet with lively strength of mind, did not wait for his son to come to him, but rather went himself to his son; for with love the measure of rank does not outweigh it. So he felt none of the hindrances of weary old age as he went; for love lightened the toil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 8"
