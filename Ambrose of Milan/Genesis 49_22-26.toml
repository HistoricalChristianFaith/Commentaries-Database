[[commentary]]
quote='''
Let Joseph, then, be understood, so long as there is in him the figure of Christ, to whom it is said: Joseph, my son increased, my younger son; return to me. For it is not Joseph who returns to Jacob, but Christ, raised from the dead, who returns to God the Father, as it is written: His going forth is from the highest heaven, and his meeting even to its height. Yet it may be taken of Joseph: return to me, because the people returns to the land of the Canaanites, among whom the patriarchs had dwelt before. Hence Isaac says to Jacob: You shall not take a wife from the daughters of the Canaanites, and sends him into Mesopotamia, to find himself a wife there. Did the lords of the arrows lie in wait for him? Was it he who, because of the blessing of his mother's womb, was blessed in all the world, and not the Lord Jesus, whom a virgin bore? And therefore he was blessed not only above men but also above angels and archangels and above all the sublimity of the heavenly powers, as Scripture testifies, saying: Blessed is he who comes in the name of the Lord; the Lord is God, and he has shone upon us. For the Lord God himself is King of kings and Lord of lords among the things that are in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
