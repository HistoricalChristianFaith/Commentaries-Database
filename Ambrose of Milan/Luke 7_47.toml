[[commentary]]
quote='''
And therefore no one can love as much as she who loves in many. Not Peter himself, who said to him: Lord, you know that I love you; not Peter himself, who grieved because he was asked: do you love me? For he did not wish what was manifest to be asked about as though it were unknown. So not Peter himself, because the Church loved in Peter; nor Paul himself, because Paul too is a portion of her. And do you too love very much, so that very much may be forgiven you too. Paul sinned much, for he was even a persecutor; but he loved much, for he persevered even to martyrdom. His many sins were forgiven him, because he too loved much, he who did not spare his own blood for the name of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
From this woman, then, we understand what that saying of the Apostle means: sin abounded exceedingly, that grace might abound exceedingly. For if sin had not abounded exceedingly in this woman, grace would not have abounded exceedingly; for she acknowledged her sin and brought grace. And therefore the Law is necessary; for through the Law I have known sin. If there had been no Law, sin would lie hidden. By acknowledging sin I ask for pardon. Through the Law, then, I recognize the kinds of sins and also the crime of transgression; I run to repentance, I obtain grace. The Law, therefore, which sends us on to grace, is the author of good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
