[[commentary]]
quote='''
Therefore do not boast when you fast, do not glory lest fasting profit you nothing; for those things which are done for ostentation will not prolong their fruit into the future, but they consume the reward for present deeds. Elias was in the desert, that no one might see him fast except the ravens alone, when they supplied him with food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 11"
