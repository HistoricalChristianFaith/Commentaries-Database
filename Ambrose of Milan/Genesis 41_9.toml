[[commentary]]
quote='''
Reminded of himself, then, through the king's dream, he says: I remember my sin. This is a late confession indeed, but would that it were a true one! After the sin you confess what you ought to have guarded against before the sin. How quickly you had forgotten Be mindful of me! You know, surely, that these were the words at that time, but you had ears dulled by the pride of power, and drunk with wine you did not hear the words of sobriety. At least now be mindful of me, you who confess your sin late. You who make your request of a slave, why do you deny the Lord? Be drunk now not with wine but with the Holy Spirit. Remember what he suffered with whom you slept your sleep and dreamed your dream. He too was an overseer, and overseer of the king's banquets, those that belonged to the bakers' work. He believed himself exalted because he had the king's bread in his power: he did not know that this power has many windings. He threatened others, though he himself was soon to be handed over to the extreme punishment; and he did not listen to him who, though a slave of the Lord, nevertheless spoke the oracle: that by the command of the very king on whose account he flattered himself so greatly he would lose his head and be left as food for the birds. At least this example ought to have called you back, so that you would not put your trust in faithlessness.

There are other examples too of the pride and fragility of royal ministers, which the history of a later time contains. Doeg too was an overseer, and overseer of the king's animals for the training of mules, that is, of eunuch animals. He too denounced the priest of the Lord and by fraud stirred up the king to endanger the priest, and he too was a Syrian. Am I lying, when both country and deeds agree? Haman too, the king's chamberlain and himself an overseer, while he strove with shameless rashness to invade the churches of the Lord and to despoil and persecute the faithful people, paid for his sacrileges with heavy punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
