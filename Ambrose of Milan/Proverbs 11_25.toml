[[commentary]]
quote='''
She is praised besides because she is faithful, because she is powerful in word, because she is fruitful with various fruits, because she is one, like a dove, having the unity of the Spirit, in which there is the peace that has made both one, and because she is not composed of diverse elements of a divided and warring nature. For what is so diverse as fire and water, air and earth, of which the frame of our body consists? But every soul that is simple is blessed, the soul that imitates him who says: that all may be one, as you, Father, in me and I in you, that they too may be one in us; for this is the consummation and the perfection. Hence he also added: that they may be one, as we also are one, I in them and you in me, that they may be consummated into one. This, then, is the soul that is a dove and perfect, which, being simple and spiritual, is not troubled by the passions of this body, in which there are fightings without, fears within. In fact Scripture teaches us that concord and peace are signified by this word of unity, saying: And the multitude of believers had one soul and one heart, and there was no division among them at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"
