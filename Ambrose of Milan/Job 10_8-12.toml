[[commentary]]
quote='''
Your hands he says have fashioned me: afterwards you turned and struck me. Remember that you made me of clay and will dissolve me into the earth. Did you not milk me like milk, and curdle me like cheese? With skin and flesh you clothed me, with bones and sinews you knit me together; and life and mercy you set in me, and your visitation has protected my spirit. How great is the holy man's lament for our common weakness, how great the authority of his plea, that God made man with his own hands? Guilt is excused under the plea of weakness; grace is commended by the privilege of an eternal working and by the condescension of a heavenly protection. On this passage David too spoke most beautifully, saying: What is man that you are mindful of him, or the son of man, unless that you visit him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
