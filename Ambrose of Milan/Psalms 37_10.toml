[[commentary]]
quote='''
But he who will not be redeemed through these things and holds that he must persevere in sin, of him the prophecy says: And yet a little while, and the sinner shall not be, and you shall seek his place and shall not find it. For how will he be able to exist in the future, since the place of sin cannot be lasting? For this is the earth that opened its mouth to receive the blood of the innocent, and therefore in this earth is the place of sinners. The earth passes away; how will the sinner's place be able to be found? I think that God commanded the firmament to be between water and water for this reason, that he might separate sins from virtues, and that the upper water, which praises the Lord, might remain at rest from error, while the lower might be liable to sin. Thus that one sees God, this one does not see; the water which is above the heavens sees, that which is in the abyss does not see. Hence also it was said: The waters saw you, O God, the waters saw you and were afraid, the abysses were troubled; a multitude of the sound of waters. Rightly are the abysses troubled, over which there is unsightly darkness, and therefore they cannot have peace. Hence the legion of demons asked to be sent into the abyss, and cast itself headlong into the waves with a great tumult, so as to drown the herd of swine which it had found. And so sinners make for the abyss, where the gloom of darkness is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
