[[commentary]]
quote='''
Therefore Jeremiah too saw first a rod of walnut, then a boiling pot, so that the soul of the prophet at his beginning might waste away, that guilt might depart and grace come. But why first the rod, afterwards the pot? Because he who is not corrected by the rod is put into the pot, to burn and waste away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
