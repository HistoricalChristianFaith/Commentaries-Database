[[commentary]]
quote='''
Hence the Lord, by eating with sinners, does not forbid us to enter into a banquet even with Gentiles, saying: Those who are well have no need of a physician, but those who are sick.

A new master has brought a new medicine. This did not sprout from the earth; for all creation was ignorant of this compound. Come, all you who have fallen into the various passions of sins, use the foreign medicine by which the serpent's venom is expelled, which has not only taken away the scar of the passions but has also cut away the cause of the dire wound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
