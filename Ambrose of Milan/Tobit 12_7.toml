[[commentary]]
quote='''
It is good to hide the mystery of the king; for he sins against God who thinks that the mysteries entrusted to him are to be published to the unworthy. There is danger, therefore, not only in saying false things, but even in saying true things, if one imparts them to those to whom one ought not. This fault is fourfold: of flattery, or of avarice, or of boasting, or of incautious talkativeness; for while someone wishes to flatter the one to whom he speaks, he pours out the mystery; some too, from zeal for gain, pursue the wages of betrayal, so as to sell by speaking what should be covered by silence; others, that they may seem to know more and may boast of their knowledge, lay open what they ought to conceal; very many, while they speak without judgment, let slip a word that they cannot call back. Therefore a man is praised who is serious and not idle. There was a man who hid his words, like the apostle Paul, who knows what he should say to each, and when he ought to say what.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
