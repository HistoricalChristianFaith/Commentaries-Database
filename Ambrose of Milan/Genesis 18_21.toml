[[commentary]]
quote='''
I will go down therefore, that I may see whether they will be brought to completion according to their cry that comes to me; and if not, that I may know. The Lord was not ignorant of the sins of Sodom, but he spoke words of this kind for your instruction, so that you might examine more closely the misdeeds of those on whom you judge that vengeance should be taken. I will go down he says that I may see, that is: you too take care to go down, go down with zeal for inquiry, lest there be anything that deceives one who is absent or lies hidden from him, so that you may detect the crime with your own eyes. Those placed far off can be ignorant of many things. But what cry does he mean, unless perhaps that to him from whom nothing is hidden all things cry out, and the crimes of individuals seem to cry out? Thus it is said to Cain: the blood of your brother cries to me, that is, your murder of your kin is not hidden, but cries out. And so God is, as it were, roused by the cries of our outrages, so that he who gladly pardons may at some time take vengeance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
