[[commentary]]
quote='''
Such a man is not fearful in persecution, not softer under torments for fear of exasperating the torturer, but like a strong athlete who strikes back at the one who beats him, if not with the lash of blows, certainly with the lash of words, who despises the torments that many must fear, saying: the arrows of children have become their wounds, who, though he wrestles with the most grievous pain, does not show himself pitiable, but shows, like a light in a lantern, that even amid rough tempests and the most violent blasts the virtue of his soul shines and cannot be extinguished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 8"
