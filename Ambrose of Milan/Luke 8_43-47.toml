[[commentary]]
quote='''
We thought this place needed to be expounded sufficiently in the moral sense, and therefore we do not go back over what has been said. But we wish to touch briefly on the mystical sense. Did it not so come about that the Word of God, when he had come to the Jews, was taken up by the Gentiles, and was believed in grace first by those who had not believed under the Law?

For just as that woman had spent all her substance on physicians, so too the assembly of the Gentiles had lost all the gifts of nature and squandered the patrimony of life: holy, modest, devout, readier in faith, slower through modesty; for this belongs to modesty and faith, to acknowledge infirmity and not to despair of pardon. Modest, then, she touched the fringe; faithful, she approached; devout, she believed; wise, she knew that she had been healed. So the holy people of the Gentiles, which believed God, blushed for sin so as to forsake it, brought faith so as to believe, showed devotion so as to entreat, put on wisdom so as itself to perceive its healing, took confidence so as to confess that it had snatched what belonged to another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
