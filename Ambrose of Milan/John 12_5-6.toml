[[commentary]]
quote='''
Indeed, John the evangelist brings in the saying of Judas Iscariot, that the ointment was valued at three hundred denarii, as you have it: for it could have been sold for three hundred denarii and given to the poor. Now the coins of three hundred declare the sign of the cross; but the Lord seeks not a perfunctory foreknowledge of the mystery, but rather wishes the faith of believers to be buried together in him.

This, however, we understand of the words of the other apostles; but Judas is condemned for avarice, for he preferred money to the Lord's burial, and even if he had some sense of the Passion, he erred in so costly a sale. Christ wishes to be valued cheaply, that he may be bought by all, so that no poor man may be deterred. Freely he says you have received, freely give. The depth of riches seeks not money, but grace. He himself bought us with precious blood; he did not sell us. Of this we would speak more fully, did we not remember that we have treated it ourselves elsewhere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
