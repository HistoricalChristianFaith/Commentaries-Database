[[commentary]]
quote='''
What it means to be presented to the Lord in Jerusalem I would say, had I not said it before in my commentaries on Isaiah; for one circumcised from vices was judged worthy of the Lord's regard, because the eyes of the Lord are upon the just. You see that the whole course of the old Law was a type of what was to come — for circumcision too signifies the cleansing of sins — but since the frailty of human flesh and mind, through a certain headlong desire for sinning, is entangled in inextricable vices, therefore by the eighth day of circumcision the future cleansing of all guilt was prefigured in the age of the resurrection. For this is that saying: for every male opening the womb shall be called holy to the Lord; for by the words of the Law the childbearing of the virgin was promised. And truly holy, because immaculate. Indeed, that he is the one who is marked out by the Law, the words repeated in the same manner by the angel declare: for what shall be born he says shall be called holy, the Son of God. For no union with a man unlocked the secret places of the virginal womb, but the Holy Spirit poured immaculate seed into an inviolable womb; for of all those born of woman the Lord Jesus alone is holy in all things, who by the newness of his immaculate birth did not feel the contagion of earthly corruption, and by his heavenly majesty drove it away.

For if we follow the letter, how is every male holy, when it is no secret that many have been most wicked? Was Ahab holy? Were the false prophets holy, whom the fire, avenger of the wrong done to heaven, consumed at the prayers of Elijah? But he is holy whom the devout prescriptions of the divine Law marked out as the figure of the mystery to come, in that he alone was to open, for the begetting of the peoples of God, the secret womb of the holy Church, a virgin of immaculate fruitfulness. He alone, then, opened the womb for himself. Nor is it any wonder; for he who had said to the prophet: Before I formed you in the womb, I knew you, and in your mother's womb I sanctified you, he, then, who sanctified another's womb, that a prophet might be born, is the one who opened his own mother's womb, that he might come forth immaculate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
