[[commentary]]
quote='''
I have adjured you, daughters of Jerusalem, that you rouse and rouse again love, until it wills. She still seeks one who will rouse it, and she asks that it be roused for her by the daughters of Jerusalem, for whose sake, that is, for the sake of faithful souls, she desires the Bridegroom to be provoked into a richer love of her. And so those Powers who guard the gates of heaven say.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
