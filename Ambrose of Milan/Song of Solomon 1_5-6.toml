[[commentary]]
quote='''
Yet the same soul, knowing that she has been darkened by fellowship with the body, says to other souls, or to the other heavenly powers appointed to the sacred mystery: Do not look at me, because I have been darkened, because the sun has not looked upon me.

I am dark and comely, daughters of Jerusalem. Picture the Lord Jesus reclining at the banquet, John leaning on his breast, the others marvelling that the servant was leaning on the Lord, that that sinful flesh was reclining on the temple of the Word, that that soul, bound in the bonds of the flesh, was searching out the hall of the divine fullness. While the others marvel at these things, then, the soul of John answered: I am dark and comely, daughters of Jerusalem; dark through guilt, comely through grace. The flesh too says, I am dark and comely; dark with the dust of the world, which it gathered in its struggle, comely with the spiritual eye, with which it wiped away the dust and filth of this world: dark through vice, but comely now through the washing, which has washed away every offence: I am dark because I sinned, comely because Christ now loves me; for the one whom he had banished in Eve, he receives back in the virgin, he takes up from Mary.

The Synagogue too says it, whose mysteries seem to most to be expressed in this place; when she saw that she was rejected because of the impiety of the whole people, she yet consoled herself, because she saw not only Christ himself from her own people, but also Peter, John and James cleaving to Christ, because she had the oracles entrusted to her. And therefore she said: I am dark and comely, daughters of Jerusalem: dark through unbelief, comely through the Law: dark through the fall, comely because the sun has loved me, and I was made first the congregation of God. Do not flee from me because I am dark; I am dark for this reason, that the sun of justice, who used before to illumine me, has left me. I have lost the colour of my face, the keenness of my eyes, with which I used to see the sun, has been dulled: I walk in darkness, I who do not know the day of Christ. Yet do not despise me, since he who has left me can look upon me again. He is accustomed to have mercy again, to gather the scattered, to seek out the deserted, to collect the forsaken. All you tribes of Israel, come together, look upon me, comely before my offences; do not look at me, because I have been darkened; that is, do not look only at this, that I have been darkened; the sun has not looked upon me, and therefore I have been darkened. But the sun shines upon the just and the unjust, upon the just for grace, upon the unjust for mercy; to the former granting the reward of merits, to the latter forgiving sins. And it did not shine upon the Gentiles before; now it shines, now he rises for them who used to rise for me; he who forgave them will forgive me also. Do not think, because I have been darkened, that the sun has utterly left me, and no longer looks upon me, no longer seeks me out in my sickness. He has turned his eyes from me, because I did not keep his commandments: he will be reconciled when he sees my repentance for my offences. The sun has not seen me, because I did not receive him when he came, I did not open the windows that the light of life might enter: when I have opened them, he will illumine my eyes, he who came to illumine the whole world, so that even those who do not see may see.

Or the Church from the Gentiles says: Do not look at me because I am dark, because the sun has not looked upon me; because the sun of justice for a long time judged the congregation of the Gentiles, bound as with the winter frosts and ice of Gentile error, unworthy for him to light it up with the serene light of his countenance. Did it not seem to you the stiffness of the winter season, when God was known only in Judea? But now the fullness of summer light shines, when Christ is all and in all. Is not the earth the Lord's, and its fullness (Ps. 23 (24):1)? And truly the whole world is in the Church, because there is not only Jew or Greek, not barbarian or Scythian, not slave or free: but we are all one in Christ (Col. 3:11). The sun shines for all, the day gives light to all. I am black, and comely. She put "black" first, to increase the beauty: she did not say: I am black comely, lest what is black should be thought comely: but she says: I am black by former sin, but comely by confession of sin, and by zeal for amendment, and by love of virtue. Although, then, the syllable Et ("and") is, as the grammarians say, conjunctive, yet it has a distinction by which confusion is distinguished and separated; so that if you say that Ambrosius Bassus is inside, one man is thought of: but if you assert that Ambrosius and Bassus are inside, two are certainly understood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
