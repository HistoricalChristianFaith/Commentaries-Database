[[commentary]]
quote='''
There, too, is that distinction between the serpent who is said to eat the earth and Adam, to whom God said: You shall eat in sadness the herbs of the field. We may note here a certain gradation. When we eat the earth, it seems that we are in a sort of warfare. When we eat the herbs, there is a certain advance. When finally, we eat bread, then our life of trial has reached its terminus. Let us experience a series of advancements in this life as Paul did: It is now no longer I that live, that is, not I who before this ate the earth, not I who ate grass, for all flesh is grass, but Christ lives in me. This signifies that living bread which comes from heaven, and that wisdom, too, is living, together with grace, justice, and resurrection.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
