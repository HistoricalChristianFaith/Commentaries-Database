[[commentary]]
quote='''
Who, then, is the child to be imitated by the apostles of Christ? Is it one of the little ones? Is this, then, the virtue of the apostles? Who, then, is the child? Is it not perhaps he of whom Isaiah says: A child is born to us, a son is given to us? For he, the child, said to you: Take up your cross and follow me. And that you may recognize the child: When he was reviled, he did not revile in return; when he was struck, he did not strike back; for this is perfect virtue. So in childhood too there is a certain venerable old age of character, and in old age an innocent childhood; for venerable old age is not that of long duration, nor reckoned by the number of years; but men's understanding is gray hair, and an unspotted life is the age of old age. Hence it is also written: Praise the Lord, you children, praise the name of the Lord, because no one but the perfect praises the Lord; for no one, indeed, says Lord Jesus except in the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
