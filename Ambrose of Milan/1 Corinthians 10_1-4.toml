[[commentary]]
quote='''
Finally, although all our fathers were baptized in Moses in the cloud and in the sea, yet it is not idly written: That all ate the same spiritual food, and all drank the same spiritual drink (1 Cor. 10:3 and 4); so that a certain greater brightness might come to these teeth of the saints, which we shall recognize to have been cleansed, after the crossing of the Red Sea, when the bitterness of the fountain of myrrh had been tempered by the grace of the wood (Exod. 15:25); then by the drink of twelve fountains; lastly by the watering of the rock that poured forth a spiritual wave: For the Rock was Christ (1 Cor. 10:3 and 4). Therefore they also ate manna (Num. 20:11), so that, washed so many times, they might eat the bread, as it is written, of angels (Ps. 77 (78):25). Now too, in the mysteries of the Gospel, you recognize that the baptized, although washed in the whole body, are nonetheless afterward cleansed by spiritual food and drink; for that is the true brightness of the teeth, where the melodious confession of a mind of good conscience resounds. That is the clean eye, which no beam of grave sins has weighed down, which no mote of light impurities has disturbed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
