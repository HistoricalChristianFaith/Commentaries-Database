[[commentary]]
quote='''
And if you wish to hide your righteousness, God brings it out into the light and does not suffer the judgement to lie hidden by which you chose the things that are good and rejected the things that are wicked. And not only does he make your judgement shine, but shine as the noonday. When this sun pours itself out wholly into splendour, it is noonday; it was noonday when Joseph feasted with his brothers, not having avenged his injury, but having forgotten it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
