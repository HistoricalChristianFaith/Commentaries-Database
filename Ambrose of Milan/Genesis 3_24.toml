[[commentary]]
quote='''
All who desire to return to paradise must be proved by fire; for not idly was it written that, when Adam and Eve had been cast out of their abode in paradise, God placed at the exit of paradise a fiery, turning sword. All must pass through the flames, whether it be John the Evangelist, whom the Lord so loved that he said of him to Peter: If I wish him to remain, what is it to you? You follow me (John 21:22). Of his death some have doubted; of his passing through fire we cannot doubt, because he is in paradise and is not separated from Christ. Or whether it be Peter, who received the keys of the kingdom of heaven, who walked upon the sea, he must say: We have passed through fire and water, and you have brought us out into refreshment (Ps. 65 (66):12). But for John the fiery sword will quickly be turned, because no iniquity is found in him whom equity loved. If there was in him anything of human fault, divine love burned it away: For its wings are like wings of fire. He who has had the fire of love here will not be able to fear the fire of the sword there. To Peter himself, who so many times offered his death for Christ, he says: Pass, recline. But he says: He has tried us with fire, as he himself has tried silver.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
