[[commentary]]
quote='''
On hearing this, the spirit of the covetous king was troubled. And he slept in his bed, and he veiled his face, and would not eat his bread. Rich men sorrow, if they cannot steal the things of others; if the poor man does not yield to their wealth, they cannot conceal the violence of their grief. They desire to sleep, they veil their faces lest they see anything else in the world belonging to another, lest they know there is anything in this world not their own, lest they hear that a neighbor has something near them, lest they hear a poor man refusing them. Theirs are the souls to whom the prophet says: Rise up, ye rich women.

And he would not eat his bread, it says, because he sought another's; for rich men eat rather another's bread than their own, and they live on plunder and pay their expenses by acts of robbery. But certainly he would not eat his bread, willing to punish himself with death because something was denied him.

Compare now the desire of the poor man. He has nothing and knows not how to fast voluntarily except for God. He knows not how to fast except from necessity. You seize indeed all things from the poor, you carry off all, you leave nothing, yet you yourselves, rich men, suffer rather the pains of the poor. They fast when they have not; you, when you have. From yourselves therefore do you exact the penalty before you inflict it upon the poor. Hence because of your passionate desire you suffer the miseries of a wretched poverty; while the poor indeed do not have what they may use, yet you do not use anything yourselves, nor do you allow others to do so. You dig up gold from the veins of metal and again hide it away. How many lives you bury in that gold!

For whom are such things kept, since you have read concerning the miserly rich man: He storeth up treasures, and knoweth not for whom he gathers them? The idle heir is expectant, the fastidious grumbles that you may die late. He scorns increments to his inheritance and hurries to spend it. What therefore is more pitiful, when not even in him for whom you toil do you leave gratitude? For his sake you endure bitter hunger for whole days, fearing the daily losses to your board; for his sake do you institute daily fasts.

I know of a rich man who, in setting out for the country, was wont to count the rather scanty loaves brought from town, so that by the number of the loaves it might be reckoned how many days he was to be afield. He would not open his sealed granary lest any of his store should be diminished. For each day a single loaf was set apart, such as would hardly satisfy a niggard. I have learned also, on genuine evidence, that whenever an egg was put before him, he used to complain that a chick had been killed. On this account do I write this, that you may learn that God's justice is an avenger which by your fasting takes punishment for the tears of the poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapters 3-4"
