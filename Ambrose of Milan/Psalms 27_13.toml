
[[commentary]]
quote='''
There is a certain heavenly land which bears fruit for the heavenly, of which he says: I believe that I shall see the good things of the Lord in the land of the living. This land, with much sweat of men, supplies food for the belly; that land of the Lord's good things bears fruit without any labour, and in it is the lasting possession of the righteous and the inheritance of the devout mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Lay open that good of yours which David, dwelling in the house of the Lord, desired to see, and therefore he said: Who will show us good things? and elsewhere: I believe that I shall see the good things of the Lord in the land of the living. For there are good things where there is perpetual life, life without guilt. Elsewhere too he says: We shall be filled with the good things of your house. He repeated this often so that you might know that the philosophers transferred from here that good which they declare to be the highest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"

[[commentary]]
quote='''
Let us, then, be in the hand of God, so that we may seek the good, that incorruptible and unchangeable good of which the prophet Amos says: Seek good and not evil, that you may live; and so the Lord God almighty will be with you, as you have said: We have hated evil things and have loved good things. Where, then, the good God is, there are the good things which David desired to see and believed that he would see, as he himself says: I believe that I shall see the good things of the Lord in the land of the living. For those are good things which remain forever, which cannot be corrupted by any change of time or age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
