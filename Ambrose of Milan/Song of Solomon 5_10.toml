[[commentary]]
quote='''
"My beloved is white and ruddy." It is fitting, O virgin, that you should fully know him whom you love, and should recognize in him all the mystery of his divine nature and the body which he has assumed. He is white fittingly, for he is the brightness of the Father; and ruddy, for he was born of a Virgin. The color of each nature shines and glows in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25201.html'
source_title="Concerning Virginity 1.9.46"

[[commentary]]
quote='''
My brother, she says, is white and ruddy, chosen out of thousands. For it is fitting, virgin, that you should know fully him whom you love, and recognize in him the whole mystery both of his innate divinity and of the incorporation he took on. He is rightly white, then, because he is the splendor of the Father; ruddy, because he is the offspring of a virgin. The color of both natures shines and glows in him. Remember, however, that the insignia of divinity in him are more ancient than the sacraments of the body; because he did not begin from the Virgin, but he who already was came into the Virgin.

My brother is white and ruddy. White with eternal brightness, ruddy with the appearance of the human color which he took on in the sacrament of the incarnation. And rightly does that very thing which is ruddy smell sweet; because the flesh of Christ is without sin: the faithless, handling it, defiled their hands; the saints, venerating it, became fragrant with the fragrance of piety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Chosen out of thousands. Ten thousands, says Jacob, of Ephraim, and thousands of Manasseh: that is, that he may rule over both Jews and Gentiles, and from both peoples acquire for himself the fullness of the Church. And therefore holy Jacob placed his right hand upon Ephraim, because, as you read, the Church says in the Song of Songs: My brother is white and ruddy, chosen out of ten thousands. Indeed, David too, the ancestor of the maiden Mary, from whose line Christ was born through the Virgin's childbearing, they proclaimed among ten thousands; but Saul among thousands, though they ought rather to have given the first place to the regard due to the king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
