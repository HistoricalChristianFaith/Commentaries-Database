[[commentary]]
quote='''
Hence the Apostle says: Do not get drunk with wine... but be filled with the Holy Spirit; for those who are drunk with wine stagger and stumble, but those who are intoxicated in the Spirit are rooted in Christ. And therefore, the excellent drunkenness, which operates the sobriety of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Sacraments.html'
source_title="On the Sacraments 5.3.17"

[[commentary]]
quote='''
Wherefore the Apostle says: Be ye not drunk with wine, wherein is luxury; but be ye filled with the Holy Spirit. There is, therefore, inebriation from sin; there is also, from grace. And perchance this inebriation from grace belongs to our nature, because, being made to the image and likeness of God, we ought to be filled with the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 16"

[[commentary]]
quote='''
Hence the Apostle too says: Do not be drunk with wine..... but be filled with the Holy Spirit (Eph. 5:18). For he who is made drunk with wine sways and staggers; he who is made drunk with the spirit is rooted in Christ. And therefore it is a glorious drunkenness, which works sobriety of mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
