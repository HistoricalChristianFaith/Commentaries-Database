[[commentary]]
quote='''
But let us hear him again. A mortal he says born of woman is of short life and full of wrath; like a flower he has blossomed and fallen, and he departs like a shadow and does not stay. Is not an account required of this one too, and have you made him enter into judgment in your sight? But who is clean from filth? No one, even if his life upon the earth be of one day. Truly a wretched condition, that he should be forced to render an account of his sin, which he cannot avoid, that he is compelled to enter into judgment, to come into the sight of the almighty Lord, to set forth the causes of his deeds, which he has run through in so many ages of his life, when no one can be clean from sin, so that from the very cradle guilt creeps upon infancy before there is any sense of error. And how wretched this too, that his life is short, its allurement sweet, its tribulation manifold, its wrath daily. Thus in a slight delight there is perpetual bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 7"
