[[commentary]]
quote='''
Again, so great a priest fell into an occasion of offense with his sister Miriam. For while both of them disparaged their brother because he had taken a foreign wife, Miriam at once broke out in the contagion of blotched flesh.

In this place there was the figure of a manifest mystery: that that priestly people of the fathers would in later times disparage the brotherly people, not knowing the sacrament of that Ethiopian woman. For if it had known it, it would not have found fault with what agreed with the ancient mystery. And so when the Jew says that he who has believed from among the Gentiles is common, and wishes to separate him from the law, he has a leprosy which he will not be able to escape, unless the spiritual knowledge of the law has helped him to pardon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 4"
