[[commentary]]
quote='''
By the thigh we understand generation. And the generation of Abraham is Christ. Hence too To Abraham were spoken says the Apostle the promises, and to his seed. He does not say: and to seeds, as of many, but as of one: to your seed, which is Christ, showing that through him there would be a holy sacrament for us, through him sure help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
