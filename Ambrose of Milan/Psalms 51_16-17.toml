[[commentary]]
quote='''
There is added, for making sin void, that he took on humility and made his heart contrite, which the Lord chose as a sacrifice rather than the holocausts for sin which used to be offered according to the law. And so he says earlier: Holocausts also for sin you did not require; then I said: Behold, I come, that is: not thinking it robbery to be equal to God, I come taking the form of a servant, I come in the appearance of the human nature assumed, in the truth of the cross, to prove obedience by the humility of death, that disobedience may be blotted out.

Rightly, then, he says here too: For if you had wished, I would surely have given sacrifice; in holocausts you will not delight. A sacrifice to God is an afflicted spirit; a contrite and humbled heart God does not despise. And as I said above, it is certain that it accords with the mystery that the Lord Jesus himself seems here too to speak in his own person, he who earlier brought out that saying with evident testimony to his own person. For he is the true David, strong of hand, truly humble and gentle, the first and the last, first in eternity, last in humility, through whose obedience the guilt of the human race was blotted out and justice poured back. He, I say, Jesus, the end of the shadow and of the law, came as the master of humility to teach the proud, puffed up in mind and by the swelling of the heart, that they must pass over to gentleness and simplicity.

How, then, can sin be imputed in the type of that mystery, when in the mystery itself there is the remission of sins? Unless perhaps David confessed his iniquity and the sin of that misdeed precisely so that he too might have a share in the remission of sin and the grace of the mystery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 17"
