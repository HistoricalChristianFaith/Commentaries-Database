[[commentary]]
quote='''
Nor did he seek any glory of this world; because he had come to help not in part, but the whole human race, saying: You are angry with me because I made a whole man well on the sabbath (John 7:23); that is, whole: not to enrich him by a bestowal of means, not to heap him with the insignia of honours, not with the increase of worldly glory; for these do not have the fullness of blessedness and grace: but whole, that is, so that it might embrace length of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
