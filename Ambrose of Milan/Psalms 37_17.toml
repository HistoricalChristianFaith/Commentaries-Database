[[commentary]]
quote='''
For the arms, he says, of sinners shall be broken, so that their actions may not be able to bring a hindrance to the righteous man, lest the rod of sinners be left upon the lot of the righteous. And Paul says: May God crush Satan under your feet. For if his arm is crushed, he himself will be crushed entirely, so that his devices may be trodden down like the venom of a serpent.

But the Lord confirms the righteous, when the adversary's arm has been broken; and therefore the righteous man says: And you have confirmed your hand upon me, and Job says: The hand of the Lord has touched me. The Lord, then, put forth his hand upon his servant, and crushed the hand and the arm of the sinner, which he had put forth upon him after receiving power. Thus the devil was deceived by his own speech, who said: Put forth your hand upon him, and let us see whether he does not bless you to your face; for he did not dare to say "curses", but left this to be understood. The Lord put forth his hand and Job was confirmed: he who was believed to curse began to bless; for when the divine hand touches the righteous, it heals, it does not wound. He put forth his hand, and every stain of the leper departed; he touched the eyes of the blind, and when blindness had been driven away, the light of their eyes shone again. Ask, then, always that you may be confirmed, since you too who stand, see that you do not fall. We ought to stand, so that we may be confirmed by the Lord. The world is slippery, we quickly fall; therefore let us ask that the Lord may deign to establish and confirm us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
