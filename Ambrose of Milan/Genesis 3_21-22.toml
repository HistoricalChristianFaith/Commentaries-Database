[[commentary]]
quote='''
And God said: Behold Adam has become as one of us. Mockingly of course, not approvingly, does God speak, that is: "did you think that you should be like us? Because you have wished to be what you were not, you have ceased to be what you were. Accordingly, while you were aspiring to be above yourself, you have begun to be beneath yourself." Therefore He first clothed him in a tunic of skin and spoke thus: "Behold Adam," as if He should say: "Behold thy cloak, behold thy worthy raiment, this clothing becomes thee. They who aspire to divine things are held worthy of such adornment. Behold whither thy sin hath brought thee; behold now in this tunic of skin, thou, as if one of us, hast opened thine eyes. Look about carefully: thou seest thyself naked, whom thou thought'st clothed."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
