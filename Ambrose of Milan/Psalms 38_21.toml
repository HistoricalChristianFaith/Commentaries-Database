[[commentary]]
quote='''
And yet, although he follows close after righteousness, he thinks it belongs not to his own virtue but to heavenly grace, if he is not forsaken by Christ; and so he prays the more earnestly, saying: Do not forsake me, Lord; my God, do not depart from me, that is: men have forsaken me, my friends have attacked one dear to them, my neighbours have not drawn near. They fled me as one dead and abhorred me, because I desired to confess my sins to you, because I offered myself to your scourges to be wounded, because I chose the scars of wounds above the banquets of kings and the boasting of the powerful. Do you alone not forsake me; do you cleave to your little servant, you who raise up the needy from the earth and lift up the poor from the dunghill. Supported by your company, I shall reckon myself more thronged than if peoples were courting me. My scars have indeed festered, but still I desire the scars of your stripes, which are drawn over wounds once healed, so that afterwards no sore appears. Good are the scars of triumphal wounds, in which the victors of this earthly battle glory: how much more illustrious are the wounds which are seen to have been received for faith and the glory of your name! This is the scar which opens heaven, acquires the kingdom, finds immortality. This, then, brothers, is the blessed scar, since blessed are those who have washed their robes in their own blood. So the flesh of death began to be a robe of glory, the flesh in which Paul too, the chosen one of God, was once in peril, had he not asked to be freed from the body of this death, as we read.

And therefore let us who are in this body of death pray that that good physician, beloved of God, may not forsake us, he whom the patriarch David begged not to depart from him. Let us commit ourselves to him, ready to be cured with whatever medicine he wishes. No one tells the physician of his body how he is to be cured. The physician knows what medicines suit each wound, which sore's putrefaction must be cut away with the knife, lest it creep on to the destruction of the whole body. If the physician names the kind of medicine by which the sick man ought to be cured, and he is disdainful of it, the physician departs and leaves the sick man. See one who wishes to be cured acquiescing in the physician in every way; mark the order. First he opens his wounds to the physician and says: "Cure me, but, I ask, not in your wrath, because my infirmities do not bear a harsh medicine." The medicine of Christ is chastening; for the Lord chastens him whom he wishes to convert. Therefore Paul too says to the physician: Rebuke, entreat, reprove. He, then, does not refuse to be cured who asks to be rebuked, but he wishes the punishment to be lightened, so that he may not be rebuked in anger and chastened in the onset of wrath.

And see the progression. First he asks to be rebuked, afterwards, what is greater, to be chastened. Then he not only confesses his sins, but also numbers them and accuses them; for he does not wish his offences to lie hidden. For as fevers, when they are deep within, cannot be soothed, but when they break out, bring hope of ceasing, so the disease of sins burns more fiercely while it is covered, and if it is betrayed by confessions, it evaporates. And therefore the righteous man is his own accuser at the beginning of his speech, before the contagion of the sore creeps inward; for the memory of offences weighs down the conscience, unless medicine is sought. And if the physician delays, the sick man ought to offer himself, so as to be cut the sooner, as David offered himself to the scourges of the Lord, saying: "Repay me my sins double, provided you avenge them here; do not forsake me, do not turn your face away from me, do not disdain and shudder at the stench of my wounds. Job too, your little servant, had been struck with a sore from his feet to his head, and found the remedy of his health, although that wound was one of virtue, this one of error. The wounds stank, which physicians could not cure. You spoke, Lord, the mysteries of your sacraments, you made manifest the poisons of the serpent, and by the medicine of your word alone the wounds of your servant were cured, because you did not forsake him; and do not forsake me, Lord, do not depart from me. Men have forsaken me, because my wounds are foul to them, which I thought should be laid open to your loving-kindness. They say: Go out from us, because you are a sinner; depart, lest you pollute us. But you, Lord, cure and are not polluted, you help and are not contaminated, because you are the God of salvation, Lord, and your hand is accustomed not to destroy but to heal."
'''
