[[commentary]]
quote='''
Wherefore he took three hundred foxes, and in the heat of summer, when the corn was now ripe in the fields, he tied them together two and two by the tails, and fastened a burning firebrand between them, binding it with a firm knot, and by way of avenging his wrong turned them loose among the sheaves which the Philistines had cut. But the foxes, terrified by the fire, scattered flames whichever way they turned, and burnt the harvest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252011-20.html'
source_title="Letter 19: To Vigilius"

[[commentary]]
quote='''
And therefore Samson tied torches to their tails and let them loose into the harvests of the foreigners, because heretics try to burn up the fruits of others, more resonant with barking than polished in speech — for he who denies the Word has no voice either —, free of mouth for the present, but for the future, their end already bound, signifying by the torches of the tail the burning of their own end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
