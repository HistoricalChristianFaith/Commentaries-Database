[[commentary]]
quote='''
Wherefore he took three hundred foxes, and in the heat of summer, when the corn was now ripe in the fields, he tied them together two and two by the tails, and fastened a burning firebrand between them, binding it with a firm knot, and by way of avenging his wrong turned them loose among the sheaves which the Philistines had cut. But the foxes, terrified by the fire, scattered flames whichever way they turned, and burnt the harvest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252011-20.html'
source_title="Letter 19: To Vigilius"

[[commentary]]
quote='''
And therefore Samson tied torches to their tails and let them loose into the harvests of the foreigners, because heretics try to burn up the fruits of others, more resonant with barking than polished in speech — for he who denies the Word has no voice either —, free of mouth for the present, but for the future, their end already bound, signifying by the torches of the tail the burning of their own end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Give me anyone without the slip of a transgression. Samson is read of as the strongest of all, who even strangled a lion with his own hands; but would that he had been able to stifle his love! He set fire to the Philistines' harvests, and he himself burned with the little spark of one woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 4"

[[commentary]]
quote='''
But why do I speak of David alone? Let us summon others too to a treatise of this kind, lest we think that the feebleness was David's, that is, of one man, rather than the weakness of the bodily condition. Samson, mighty and strong, strangled a lion, but he could not strangle his love. He loosed the bonds of his enemies, but he did not loose the knots of his own desires. He burned the harvests of others, and he himself, set alight by the little fire of one woman, lost the harvest of his virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"

[[commentary]]
quote='''
Scripture calls him a man who is in the image and likeness of God: but the sinner it is wont to call not a man, but either a serpent, or a horse neighing after females, or a little fox, or a beast of burden. Of one of these the Lord says: Go, tell that fox (Luke 13:32), that is, of Herod. And elsewhere, when he perceived that he was being questioned deceitfully, he said: Foxes have holes, and the birds of the air nests, where they may rest (Matt. 8:20); because they deceitfully linger in certain lairs of earthly passions.

Hence also Samson tied foxes together in pairs, bound torches to their tails, and let them loose through the harvests of the Philistines (Judg. 15): signifying by this figure that wicked and deceitful men, and above all heretics, have a free tongue for barking, but hampered outcomes, or quarrelsome beginnings, and the end of their deceit consigned to burning. And therefore he let loose three hundred foxes too, because the faithless desire to commend themselves by the preaching of the cross, but cannot hold its mystery; who, with this preaching contrived, false and feigned, try rather to burn the fruits of others: whereas the true cross of the Lord surely does not burn up the merits of others, but makes them fruitful.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
