[[commentary]]
quote='''
The law and the prophets until John, not because the law failed, but because the preaching of the Gospel begins; for the lesser things seem to be fulfilled when the more powerful succeed them. And therefore let us do violence to the kingdom of heaven; for everyone who does violence hastens with vehement zeal, and does not grow slack with a sluggish affection. There is therefore a devout violence of faith; sluggishness is culpable. The Law allowed many things according to nature, so that, being more indulgent to natural desires, it might call us to the pursuit of righteousness; Christ cut into nature, because he cuts away even natural pleasures. And therefore let us do violence to nature, so that it may not sink down to earthly things, but raise itself up to the things above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
