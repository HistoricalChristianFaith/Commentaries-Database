[[commentary]]
quote='''
The law and the prophets until John, not because the law failed, but because the preaching of the Gospel begins; for the lesser things seem to be fulfilled when the more powerful succeed them. And therefore let us do violence to the kingdom of heaven; for everyone who does violence hastens with vehement zeal, and does not grow slack with a sluggish affection. There is therefore a devout violence of faith; sluggishness is culpable. The Law allowed many things according to nature, so that, being more indulgent to natural desires, it might call us to the pursuit of righteousness; Christ cut into nature, because he cuts away even natural pleasures. And therefore let us do violence to nature, so that it may not sink down to earthly things, but raise itself up to the things above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Thus Christ desired the beauty of his Church and prepared to take her to himself as wife. But because she was under the Law — for Peter, John and the other apostolic men were under the Law —, he thought that we must first be released from the bonds of bodily observance. For although the Law is religious, the Law is just, as the person of Uriah is presented, because he was so religious and chaste that on returning from the war he did not know his wife again nor go in to her, yet when Uriah came to know of the union of David, that is, of the humble man, the Law was departing from its conjunction with the synagogue and preparing a place for the future wedding of the Church. Hence John too received the type of the Law, who, although he was of the fathers, announced that the ways of the Lord were being prepared and prophesied the union of the Church, and therefore he is presented as slain, to show the failing of the lawful observance; for the Law and the prophets were until John.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 9"
