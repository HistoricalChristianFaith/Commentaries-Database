[[commentary]]
quote='''
She says it not ignorantly, for she knew it was by the grace and operation of the Holy Spirit that the mother of the prophet should be saluted by the mother of his Lord, to the advancement and growth of her own pledge; but being aware that this was of no human deserving, but a gift of Divine grace, she therefore says, Whence is this to me, that is, By what right of mine, by what that I have done, for what good deeds?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And whence is this to me, that the mother of my Lord should come to me?

She does not say it as one ignorant — for she knows that it is the grace and working of the Holy Spirit that the mother of the prophet should be greeted by the mother of the Lord for the advancement of her offspring — but as one who recognizes that this is the gift not of human merit but of divine grace, so she says: Whence is this to me? That is: how great a good has befallen me, that the mother of my Lord should come to me? I recognize nothing of mine. Whence is this to me? By what righteousness, by what deeds, for what merits? These are not the usual services of women, that the mother of my Lord should come to me. I sense the miracle, I recognize the mystery: the mother of the Lord is fruitful with the Word, full of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
