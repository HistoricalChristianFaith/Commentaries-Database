[[commentary]]
quote='''
This is what must be feared: that someone lose the covering of innocence, that the impious, overstepping the bounds of justice in the onset of a sacrilegious persecution, snatch away the garment of soul and mind. This does not easily happen, unless the voice of his own iniquity has first stripped a man. Hence David too says: If there is iniquity in my hands, may I deservedly fall empty before my enemies: let the enemy pursue my soul and seize it.

None of your enemies, then, can seize your soul unless it has first been made empty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"
