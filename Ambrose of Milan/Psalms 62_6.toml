[[commentary]]
quote='''
This is well referred also to the Lord Jesus Christ, who, when he had descended to the earth, was crucified and buried, did not depart from the Father but remained in the Father: I was delivered up and I did not go forth. Nor did he lay aside what he was, but kept it; nor did he cease to be in the form of God, but continued; the glory of God was not lessened by his taking up a body, but while it remained he won a triumph and did not lose his might. Hence he himself says: From now on you shall see the Son of Man sitting at the right hand of power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
