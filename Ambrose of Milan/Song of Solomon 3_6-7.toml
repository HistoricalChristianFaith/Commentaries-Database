[[commentary]]
quote='''
For Solomon made himself a bed of wood from Lebanon. Its pillars were of silver, its bottom of gold, its back strewn with gems.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25203.html'
source_title="Concerning Virginity 3.5.21"
