[[commentary]]
quote='''
Therefore well does Jeremias think that a man of this kind should be mourned as a superfluous creature. For what is a drunken man but a superfluous creature? And so he speaks as follows: I will weep for thee like the weeping of Jazer, O vine, because the city of Jazer is deserted; and below: there was wine in thy wine presses: early in the morning they have not treaded, and they have not at midday. Jazer is a ποίησις περισσός, a "superfluous creature"—for moderation is natural, whatever is beyond measure is held superfluous—; so is drunkenness which is lamented in the weeping of the prophet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 16"
