[[commentary]]
quote='''
Who she is that ascends, hear him saying of the Church: Who is she that ascends, made white, leaning upon her brother? She is the active one, who in Greek is called ἐναργής, because she shines forth with faith and works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 4"

[[commentary]]
quote='''
This is what the Virtues signify when they say to the soul: Who is this who comes up made white, leaning on her brother? Earlier they had said: Who is this that looks forth like the dawn, beautiful as the moon, chosen as the sun? Here something more was found to add: that she went up leaning on the Word of God. For the more perfect recline upon Christ, as John too reclined on Christ's breast. So, then, she either leaned upon Christ or reclined herself upon him, or surely, since we are speaking of nuptials, she was already being led into the chamber by the bridegroom, as one given over into Christ's right hand.

And because there is now the union of love, the bridegroom speaks tenderly to her and says: Under the apple tree I raised you up. There your mother was in labor with you, there she who bore you was in labor with you. Good is the soul that rests under a tree that is fruitful and of a very good fragrance. For if Nathanael was good, in whom there was no guile, and was seen under a fig tree, surely she is good who was raised up under the apple tree by her bridegroom. It is more to be raised up than to be seen, and more still to be raised up by the bridegroom. For although Nathanael was seen under the tree, yet his soul was not a bride, since he came to Christ secretly, because he feared the Jews. It was not beautiful as the moon, chosen as the sun, since it was in the shade; for a bride marries by day, and confesses publicly. That is why she is under the apple tree, he under the fig, because she spread the fragrance of her confession far and wide, while he had the sweetness of purity and innocence but did not have the fragrance of the spirit.

There he says your mother was in labor with you, there she who bore you was in labor with you; for we are born where we are reborn. And those are travailed with in whom the image of Christ is being formed. Hence that man too says: My little children, with whom I am in labor until Christ be formed in you; for he is in labor who receives in his womb the spirit of salvation and pours it into others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"

[[commentary]]
quote='''
And so it is said of the soul herself: Who is this who comes up whitened? Before she was baptized, she is the one who said: I am black and beautiful, O daughter of Jerusalem. For she was black, disfigured by the dark horror of sins; but after she had been washed through baptism and had obtained the remission of transgressions, she comes up whitened to Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 12"

[[commentary]]
quote='''
Who is this who ascends made white, leaning on her brother? How so? She who has placed her head upon the left hand of wisdom, so as to open her hands to the poor to help the needy; so as to use riches that were shared out or left to her, not seized and plundered; she who, desirous of glory, acquired it also by good works, and did not court it with the empty boasting of worldly rank: for this is to set one's head, and as it were the ruling part of the senses, above the hand of wisdom. That soul, I say, ascends with merits growing white, out of this desert of this life, as most have it, toward that ever-flourishing place of eternal joy.

These are the Powers which also say in the book of Isaiah: Who is this who comes from Edom, the redness of his garments from Bozrah, so beautiful in his robe (Isa. 63:1)? These, I say, are they who marvel that any soul can ascend out of this rugged and rocky desert without the stain of great vices; and therefore they rejoice that one has been found who has not polluted the garments of natural innocence with the ink of worldly folly, but rather has cleansed them with the whiteness of spiritual wisdom and grace. The daughters of Jerusalem marvel, the holy souls of the patriarchs and prophets and of the righteous of old, or the heavenly powers, saying: Who is this who ascends whitened, leaning on her brother? That is, the Church shines with such solemnities, and she who before was dark by day now shines in the nights and glows again. The Lord himself too, delighted by so great a gift of those who sing psalms, says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Who is this who ascends, leaning on her brother? Above they said, Who is this who looks forth like the dawn, beautiful as the moon, chosen as the sun? Here something more has been found to be added, because she had ascended leaning on the Word of God; for the more perfect recline upon Christ, as John too reclined on the breast of Christ. So, then, she too either leaned upon Christ or reclined herself upon him: or certainly, since we are speaking of a wedding, as one already given into the right hand of Christ, she was being led into the bridal chamber for the Bridegroom. And because there is now the bond of love, the bridegroom caresses her and says:

Under the apple tree I raised you up; there your mother was in labor with you, there she who bore you was in labor with you. Good is the soul which rests under a fruitful tree, and one above all of good fragrance. For if Nathanael, a good man in whom there was no guile, was seen under the fig tree, surely good is the soul which has been raised up by her Bridegroom under the apple tree. For it is more to be raised up than to be seen: more still to be raised up by the bridegroom. For although Nathanael was seen under the tree, yet his soul was not a bride; because he came to Christ secretly, because he feared the Jews. She was not beautiful as the moon, chosen as the sun, who was in the shadow; because she who weds as a bride by day confesses publicly. Therefore this one is under the apple tree, that one under the fig; because this one spread the fragrance of her confession farther, that one had the sweetness of the purity of innocence, but did not have the fragrance of the spirit.

There, he says, your mother was in labor with you, there she who bore you was in labor with you; for there we are born, there we are born again. And those are labored over in whom the image of Christ is formed; whence Paul too says: My little children, with whom I am in labor until Christ be formed in you (Gal. 4:19). For he has been in labor who receives in the womb the spirit of salvation and pours it into others. Whence, since Christ was already formed in her, he says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
