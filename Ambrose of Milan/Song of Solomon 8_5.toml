[[commentary]]
quote='''
Who she is that ascends, hear him saying of the Church: Who is she that ascends, made white, leaning upon her brother? She is the active one, who in Greek is called ἐναργής, because she shines forth with faith and works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 4"
