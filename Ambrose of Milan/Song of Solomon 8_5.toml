[[commentary]]
quote='''
Who she is that ascends, hear him saying of the Church: Who is she that ascends, made white, leaning upon her brother? She is the active one, who in Greek is called ἐναργής, because she shines forth with faith and works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 4"

[[commentary]]
quote='''
This is what the Virtues signify when they say to the soul: Who is this who comes up made white, leaning on her brother? Earlier they had said: Who is this that looks forth like the dawn, beautiful as the moon, chosen as the sun? Here something more was found to add: that she went up leaning on the Word of God. For the more perfect recline upon Christ, as John too reclined on Christ's breast. So, then, she either leaned upon Christ or reclined herself upon him, or surely, since we are speaking of nuptials, she was already being led into the chamber by the bridegroom, as one given over into Christ's right hand.

And because there is now the union of love, the bridegroom speaks tenderly to her and says: Under the apple tree I raised you up. There your mother was in labor with you, there she who bore you was in labor with you. Good is the soul that rests under a tree that is fruitful and of a very good fragrance. For if Nathanael was good, in whom there was no guile, and was seen under a fig tree, surely she is good who was raised up under the apple tree by her bridegroom. It is more to be raised up than to be seen, and more still to be raised up by the bridegroom. For although Nathanael was seen under the tree, yet his soul was not a bride, since he came to Christ secretly, because he feared the Jews. It was not beautiful as the moon, chosen as the sun, since it was in the shade; for a bride marries by day, and confesses publicly. That is why she is under the apple tree, he under the fig, because she spread the fragrance of her confession far and wide, while he had the sweetness of purity and innocence but did not have the fragrance of the spirit.

There he says your mother was in labor with you, there she who bore you was in labor with you; for we are born where we are reborn. And those are travailed with in whom the image of Christ is being formed. Hence that man too says: My little children, with whom I am in labor until Christ be formed in you; for he is in labor who receives in his womb the spirit of salvation and pours it into others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
