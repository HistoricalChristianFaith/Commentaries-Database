[[commentary]]
quote='''
And therefore the Bridegroom says to the Bride, as to one now perfect:

Turn away your eyes from me, for they have made me fly away. Do not strain toward me with excessive devotion and faith. You have gone beyond the possibility of nature and of your own condition, for it is hard to gaze straight at light inaccessible. Turn away, he says, your eyes from me: because she cannot bear the fullness of his divinity and the splendor of the true light.

We can, however, also take it thus: Turn away your eyes from me; even if you are perfect, other souls must still be redeemed by me, others supported. For you lift me up by seeing me; but I came down for this reason, that I might lift up all. Even if I have risen, and hold the seat of the Father, yet I will not leave you orphans, as though bereft of a father's protection, but I will strengthen you by my presence. You have this written in the Gospel: Behold, I am with you even to the consummation of the world (Matt. 28:20). Turn away your eyes from me, then, because you lift me up. For the more one strives toward the Lord, the more he lifts up the Lord, and is himself lifted up. Hence he too says: I will exalt you, O Lord, for you have upheld me (Ps. 29 (30):1). For the saint exalts the Lord, the sinner humbles him. He wishes, then, that she turn away her eyes, lest he, gazing on her, because she can now follow to the higher things, be lifted up and abandon the other souls. Therefore also in the Gospel he showed his glory not to all the disciples, but to the more perfect (Matt. 17:1). Picture now some teacher who wishes to open an obscure matter to his hearers: how, even if he himself is powerful in speech and in knowledge, he yet condescends to the ignorance of those who do not understand, and uses simple, plainer and familiar speech, so that he can be understood. If, then, someone among the hearers is quicker of understanding, one who can follow easily, he lifts him up and rouses him. Seeing him, the teacher calls him back, so that he may rather allow the teacher to linger over humbler and plainer things, whereby the others too may be able to follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
