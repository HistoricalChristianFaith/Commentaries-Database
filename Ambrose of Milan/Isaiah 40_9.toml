[[commentary]]
quote='''
All the great, all the lofty go up the mountain; for not to just anyone does the prophet say: Go up onto a high mountain, you who bring good tidings to Zion; lift up your voice in strength, you who bring good tidings to Jerusalem. Not by bodily steps but by loftier deeds may you go up this mountain. Follow Christ, that you yourself may be a mountain; mountains indeed are round about him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
