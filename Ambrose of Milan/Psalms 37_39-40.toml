[[commentary]]
quote='''
But the salvation of the righteous is from the Lord, not from the world, not from an element; heaven and earth shall pass away. I do not entrust my salvation to heaven, because it too passes away, since it was said of the many heavens: They shall perish, but you remain. I entrust it to God alone, who remains, who can forgive sins, that he may be my protector in the time of tribulation, and may help me and free me and rescue me from sinners in the time of his judgement, and may save me, because I have hoped in him. In him alone have I hoped; for he does not wish us to serve both him and another. He who serves him alone is set free, since to him belong praise, glory, perpetuity, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
