[[commentary]]
quote='''
But observe all things carefully, how He both ascends with His Apostles and descends to the multitude; for how could the multitude see Christ but in a lowly place. It follows him not to the lofty places, it ascends not the heights. Lastly, when He descends, He finds the sick, for in the high places there can be no sick.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he came down he says with them and stood on a place of level ground. Note everything carefully, how he both goes up with the apostles and comes down to the crowds; for how would the crowd see Christ except in a low place? It does not follow to the heights, it does not go up to lofty places. Indeed, where he comes down, he finds the sick; for on the heights there can be no sick. So too Matthew teaches that the weak were healed in the lower places; for each one is first healed, so that little by little, as his virtues advance, he may be able to go up to the mountain. And therefore he heals each one in the lower places, that is, he calls him back from lust, turns away the injury of blindness, comes down to our wounds, so that by a certain intercourse with himself and his abundance he may make us partakers of the heavenly nature. And he was healing these indeed, but leaving them in the lower places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
