[[commentary]]
quote='''
And Paul says: For with me it is a very small thing to be judged by you or by man's day. Against slanderers and sinners the righteous man is content with his own judgement, but he reserves the judgement of his merits to Christ. And therefore he added: He who judges me is the Lord. Most beautifully he chose as judge him who is deceived by no fraud, so that neither do hidden things pass him by nor does the slip of a weak condition offend him, for he knows how to pardon frailty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
