[[commentary]]
quote='''
For lovely are the tents of Israel, like shady groves above a river, in which the soul, placed as though in readiness for battle, wages a good warfare, spies out hostile incursions, and seeks victory by the toil of virtue, so that she can be compared to that mare which is Solomon's, swift for running, apt for bearing, since fruitfulness of soul is desired and sought.

This mare, then, is precious, and the chariots of Pharaoh are swift, which some refer to the Church and to the people. But of this mystery we have spoken often elsewhere, and especially in Psalm 118 (119); in this place, however, we have undertaken to speak of the soul. This soul is reckoned like this mare, that is, a soul of prophetic or apostolic virtue, because she is numbered in the flock of those who by the fruitfulness of their preaching filled the spaces of the whole world, and, though set in the body, yet felt no loss in their spiritual course. And therefore she is praised because, with the heavenly precept shining upon her, she is now beautiful, now fair, she who displays in her face the comeliness of chastity and lifts up the ornaments of her neck, on which are the insignia of patience and humility. The true Isaac loved the comeliness, the humility and the patience of such a soul, and therefore eagerly sought her offspring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
