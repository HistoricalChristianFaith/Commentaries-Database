[[commentary]]
quote='''
No slight thing is that which contains the type of His beloved Church, as the Prophet points out when he says: ‘In his days shall justice spring up and abundance of peace till the moon be taken away.’ And in the Canticles the Lord says of His spouse: ‘Who is she that looks forth as the morning rising, fair as the moon, excellent as the sun?’

Deservedly is the moon compared to the Church, who has shone over the entire world and says as she illuminates the darkness of this world: ‘The night is far advanced, the day is at hand.’ Fittingly does she say: ‘She that looks forth,’ as if looking from a higher position on one’s own, in accordance with the statement: ‘The Lord hath looked down from heaven upon the children of men.’ Looking down, then, the Church has, like the moon, her frequent risings and settings. She has grown, however, by her settings and has by their means merited expansion at a time when she is undergoing diminution through persecution and while she is being crowned by the martyrdom of her faithful. This is the real moon which from the perpetual light of her own brother has acquired the light of immortality and grace. Not from her own light does the Church gleam, but from the light of Christ. From the Sun of Justice has her brilliance been obtained, so that it is said: ‘It is now no longer I that live, but Christ lives in me.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
