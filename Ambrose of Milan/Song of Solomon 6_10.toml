[[commentary]]
quote='''
No slight thing is that which contains the type of His beloved Church, as the Prophet points out when he says: ‘In his days shall justice spring up and abundance of peace till the moon be taken away.’ And in the Canticles the Lord says of His spouse: ‘Who is she that looks forth as the morning rising, fair as the moon, excellent as the sun?’

Deservedly is the moon compared to the Church, who has shone over the entire world and says as she illuminates the darkness of this world: ‘The night is far advanced, the day is at hand.’ Fittingly does she say: ‘She that looks forth,’ as if looking from a higher position on one’s own, in accordance with the statement: ‘The Lord hath looked down from heaven upon the children of men.’ Looking down, then, the Church has, like the moon, her frequent risings and settings. She has grown, however, by her settings and has by their means merited expansion at a time when she is undergoing diminution through persecution and while she is being crowned by the martyrdom of her faithful. This is the real moon which from the perpetual light of her own brother has acquired the light of immortality and grace. Not from her own light does the Church gleam, but from the light of Christ. From the Sun of Justice has her brilliance been obtained, so that it is said: ‘It is now no longer I that live, but Christ lives in me.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
But that soul is blessed which no hostile battles of the body overcome. This soul, like a sparrow, flies away when the snare is broken; for the pleasures of the body are the baits of evils. Whoever strains after these entangles his soul in a snare,

but he who refrains from its baits and goes out from its darkness, his soul shines like the dawn, the soul of which it is said: Who is this that looks forth like the dawn, beautiful as the moon? For she looks forth as from a free house, and does not say: Darkness covers me and walls surround me, and who knows whether the Most High sees? But rather she seeks the light: as though set in the upper rooms of her house, that is, of her body, and above the world, she gazes upon divine things and lifts herself up to the eternal, so as to be present with God, now carrying the light of her works around the whole world, as the moon carries its disk.

As for Aquila's rendering, sounding as the sun, it seems that the turning of the heavenly axis and the course of the sun and moon and stars and the concord of the spheres are expressed — and so it seems to some of our own writers too — an idea which, although it has not won belief, does not seem out of place, at least for the charm of its sweetness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"

[[commentary]]
quote='''
But blessed is the soul which no hostile battles of the body overcome. This soul, like a sparrow when the snare is broken, flies away. For bodily pleasures are the baits of evil things: whoever strives toward these entangles his soul in a snare. But he who abstains from its baits, and comes out of its darkness, his soul shines like the dawn, the soul of which it is said:

Who is this who looks forth like the dawn, beautiful as the moon? For she looks forth as from a free house, and does not say: Darkness covers me, and walls surround me, and who knows whether the Most High sees (Sir. 23:26)? But rather she seeks the light, as in the upper parts of her house, that is, of her body: and set above the world, she gazes on divine things and lifts herself up to eternal things, that she may be present to God; now carrying the light of her works around the whole world, as the moon carries her disc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
