[[commentary]]
quote='''
And therefore he added: But the sons of men hope under the protection of your wings, that is: not the generation of vipers, but the sons of men, who live after the image and likeness of God, are placed not in pastures but at banquets; for some are in the place of pasture, others in the privilege of the sacraments; for the imperfect the juice of milk, for the perfect the table of refreshment, of which he said: You have prepared a table in my sight, on which is the living bread, that is, the Word of God; on which is the oil of sanctification, with which the head of the righteous man is made rich and the inner sense is strengthened, so that the oil of the sinner may be abolished; on which also is that inebriating cup, "how glorious" or "how mighty"; for the Greek said κράτιστον, either "powerful" or "strong" or "mighty"; mighty indeed, since by it outrages are washed away or blotted out. Good, then, is the inebriation of the cup of salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The Mystical Table also is obtained by fasting, that Table of which David says: Thou hast prepared a table before me, against them that afflict me. Hunger is acquired at a price, and that cup which inebriates with the sobriety of the heavenly Sacraments is sought by thirst. For the Lord has said: You who thirst go to the water: and whoever of you have no money, go and buy and drink and eat. And elsewhere He says: Behold they who serve me shall eat, but you shall be hungry: behold they who serve me shall drink, and you shall be thirsty. Who are "you" unless you who have drunk before, concerning whom He has said above: You have set a table for demons, and have filled the cup of Fortune? Therefore if holy fasting leads us to that venerable table, if by this hunger we can purchase those things which are eternal, why do we hesitate about the things which are within the sphere of human use, since fasting makes these also more pleasing for us?

Not all hunger, however, makes fasting acceptable, but the hunger which is entered upon through fear of God. Recall to mind: During Lent there is fasting on all days except the Sabbath and Sunday. The Pasch of the Lord closes this fast. Now comes the day of the Resurrection, the "elect" are baptised, they come to the altar, they receive the Sacrament, thirsting they drink through all their veins. Rightly do they say, each being refreshed by spiritual food and spiritual drink: Thou hast prepared a table before me, and thy chalice which inebriateth me, how goodly it is!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"

[[commentary]]
quote='''
And therefore it is said to us: But ye when ye fast anoint your head and wash your face, that ye appear not to men to fast, but to your Father who is in secret: and your Father who seeth in secret will repay ye. What is "anoint your head"? And even voluptuous people say 'let us provide ourselves with wine and ointments.' For they anoint themselves with ointment who seek the charm of a perfumed body: but those ointments are wont to produce the allurement of passion. Different is the ointment of sobriety, of which the Church says to her bridegroom: Thy name is as ointment poured out; different is the oil with which the joints and limbs, as it were, of the soul, become shining. Wherefore David also says: Thou hast anointed my head with oil; that is the oil of gladness with which Jesus Christ was anointed by God the Father, that He might be preëminent above all His fellows. With this He orders our head to be anointed that all feigned sorrow may be covered over with the oil of gladness, lest you may seem to sell your fasting to men, lest you may seem to be sad in the salvation of your soul; for no sorrowful man is crowned, no mournful man triumphs. Anoint therefore thy head, wherein are the senses of the wise man; for the eyes of a wise man are in his head. You are called to the Mysteries and you know it not; you will learn when you come. But recall this: like the precious ointment on the head, that ran down upon the beard; then you will know what it is to anoint your head; how pleasing you are to God, that He should throw open His Sacraments to you, that He should give you spiritual grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"
