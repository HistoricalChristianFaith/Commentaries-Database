[[commentary]]
quote='''
But who is so blessed as always to ascend in his heart? And how can this be done without divine help? In no way at all. Accordingly, the same Scripture says above: Blessed is the man whose help is from you, O Lord: ascents in his heart. Blessed indeed is he whom delight does not call back, whom pleasure does not bend, who does not look back to the things below, which not even Lot's wife herself could escape. Warned by this example, the Apostle, forgetting the things that are behind and reaching out to those that are before, hastened to the prize and deserved to reach it, because he saw before him Christ, by whom he was being called to the crown of justice. But he reached it who denied himself to himself, that he might gain Christ. Accordingly, it was not he himself who lived, but Christ lived in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 1"
