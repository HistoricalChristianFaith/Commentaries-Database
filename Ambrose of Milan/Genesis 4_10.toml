[[commentary]]
quote='''
A fitting reply, therefore, was given by the Lord to one who so foolishly denied committing the crime: The voice of your brother's blood cries to me from the ground. This means: "why are you ignorant of your brother's whereabouts? You were alone with him along with your parents. Among so few people, the presence of your brother should not have escaped your notice. Or are you relying on the fact that your parents are unable to play the part of accuser? I am unwilling to concede that a relationship founded on protection should become based on hazard and that in your case alone nature should revoke her laws. Do you think, then, that your crime would pass unnoticed just because your parents feel it their duty not to accuse you? Rather, you should be condemned all the more severely for taking that stand. Granted that those dear relatives of yours ought not to accuse you or even think of slaying you. But if you do not recognize Me as a witness of the act, there still is the voice of your brother's blood which cries out to Me to bear witness. That voice carries more conviction than if your brother was still living. You were alone. Who else could have slain him? If you accuse your parents, you charge them with the crime of parricide. The person who has no mercy on his parents is capable of killing his own brother. A person who proposes to show that his parents are parricides could well be a parricide himself. It was well said that 'the voice of blood cries out,' not 'the voice of your brother.' In the very throes of death your brother preserves his innocence and his brotherly devotion. Your brother does not bring an accusation, lest it should appear to be one of parricide. It is not his voice that accuses nor is it his mind. Rather, is it the voice of that very blood which you shed. Your brother, therefore, is not your accuser. Your accuser is your own deed of wickedness." At this point the accused person is unable to defend himself, because one who admits that he is guilty cannot rely on the evidence of witnesses. The deed speaks for itself. Moreover, the earth which received the blood also stands as a witness of the deed.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 9"

[[commentary]]
quote='''
If the tongue is cut off, the blood will cry out, and it will be said to you: The voice of your brother's blood cries to me. For he hears the voice of blood who hears the inner thoughts — 'though darkness covers me and the enclosures of walls surround me' the ungodly man may say, because no witness stands by him — God searches out all things, God sees all things, nor is there any crime that can be hidden from the judge of all, who knows all things before they happen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
