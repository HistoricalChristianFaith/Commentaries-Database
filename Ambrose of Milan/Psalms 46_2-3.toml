[[commentary]]
quote='''
There are also some who punctuate thus: and the mountains shall be carried over, so that there follows: in the hearts of the sea its waters have sounded and been troubled, the mountains have been troubled in his strength. Not good are the waters which sound and are troubled and cannot give drink; better are those which pass through, as it is written: Between the midst of the mountains waters shall pass through, and all the beasts of the field shall drink; the wild asses shall take them for their thirst. In fact, when the legion of demons asked and received power to enter into the swine, it both cast itself headlong with a great rush into the sea, and those waters were troubled by the headlong fall of its herd. Elsewhere too the same prophet David put it thus: The waters saw you, O God, the waters saw you and were afraid, that is, the good powers, which are calm through knowledge of the heavenly Word, not terrible with sound and crashing. But what does he say of the evil powers? And the abysses were troubled; a multitude of the sound of waters. The abysses do not see God, and therefore they are always subject to troubling. And he explained what the abysses were: a multitude, he says, of the sound of waters. For that beast too, the antichrist, ascends from the abyss to make war against Elijah and Enoch and John, who for the testimony of the Lord Jesus have been given back to the earth, as we read in the Apocalypse of John. To him a mouth was given speaking great things, so that he might sound forth against God insults full of fury and of sacrilege.

The waters therefore sounded, that is, the unclean spirits, when they were troubled at seeing the works of God, dreading at the coming of the saving Lord that judgement was drawing near to them. The waters sounded and were troubled at the Passion of the Lord. Hence it was also said: Why have the nations raged, and the peoples meditated vain things? And elsewhere Scripture says: Their memory has perished with a noise. The devil seeks noise, Christ silence. In fact, as a lamb before its shearer, so he opened not his mouth, and elsewhere: He shall not cry out nor strive, nor shall anyone hear his voice in the street, until he casts out judgement unto victory. What is this victory but the victory over the serpent? In this strength of the Son of God the mountains were troubled, when the devil and his ministers saw the dead rising again. These are the mountains which are troubled; those are the mountains which are carried over into paradise: those to whom it is said: Today you shall be with me in paradise, and that other, to whom it is said: If I will that he remain until I come, what is that to you? Follow me, and Enoch, who was caught up lest he be changed by the malice of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
