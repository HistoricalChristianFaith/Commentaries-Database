[[commentary]]
quote='''
Divine Scripture teaches us with respect to those whom we commemorate, that not only the characters of the men themselves, but of their parents also, ought to be praised, that they might be distinguished by an inheritance, as it were, handed down to them of unspotted purity. Now not only from his parents, but also from his ancestors, St. John derives his illustrious descent, a descent not exalted by secular power, but venerable from its sanctity. Complete then is that praise which comprehends birth, character, office, actions, and judgments.
The office was that of the Priesthood, as it is said, A certain Priest of the name of Zacharias.

His birth is implied in the mention made of his ancestors. Of the course of Abia, i. e. of high rank among the noblest families.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There was he says in the days of Herod, king of Judaea, a certain priest named Zechariah, of the course of Abijah, and his wife was of the daughters of Aaron, and her name was Elizabeth. And they were both righteous before God, walking in all the commandments and justifications of the Lord without complaint.

Divine Scripture teaches us that not only the character of those who are worthy of praise, but also their parents ought to be praised, so that an inheritance of spotless purity, handed down as it were, may stand out in those whom we wish to praise. For what other intention had the holy evangelist in this place than that Saint John the Baptist should be ennobled by his parents, his miracles, his character, his office, his passion? So too Hannah, the mother of holy Samuel, is praised; so Isaac received from his parents a nobility of devotion, which he left to his descendants. Zechariah, then, was a priest, and not only a priest but also of the course of Abijah, that is, noble among the women of earlier times.

And his wife he says was of the daughters of Aaron. Not only from his parents, then, but also from his forebears the nobility of Saint John is propagated, not lofty by worldly power, but venerable by a succession of religion. For the forerunner of Christ ought to have such forebears, so that he might be seen to proclaim faith in the Lord's coming not as conceived of a sudden, but as received from his forebears and infused by the very right of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
