[[commentary]]
quote='''
For, if God so clothes the grass of the field that we are struck with admiration; if He feeds the birds of the air; ‘if he provides food for the raven, when her young ones cry to God’; if He has given to women skill in the art of weaving; if the spider, who so artfully and delicately ‘hangs on the doorway her loose-woven nets,’ is not left bereft of wisdom; if He has given strength to the horse and sends forth terror from his mane, so that he exults in the field and laughs in the face of kings as he smells the battle afar off and is aroused by the sound of the trumpet—if He has filled with the largesse of His wisdom these manifold irrational creatures as well as the grass and lilies of the field, who can doubt but that He has distributed this gift of foreknowledge also to the sea-urchin?

He has left nothing unexplored, nothing unrevealed. He sees all who nourishes all. He fills all things with wisdom who, as it is written, ‘has made all things in wisdom.’ And so, if He has not neglected the sea-urchin as beyond the range of His visitation; if He has care of it and moulds it so as to enable it to see signs of what is to come—if that is true, has He no care of you and yours? Surely He has, as He testifies in the words of His own holy Scripture: ‘Look at the birds of the air’; if He feeds them, ‘are not you of much more value than they’? For, if God so clothes ‘the grass of the field which flourishes today and tomorrow is thrown into the oven, how much more you, O you of little faith?’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
