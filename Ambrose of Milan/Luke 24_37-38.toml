[[commentary]]
quote='''
Led, then, by so many examples of virtue, we believe that Peter could not have doubted. It is clear too that John believed when he saw the Savior, he who already then believed, after he saw the sepulchre empty of the body. Why then does Luke present them as having been troubled? First of all because the statement about the greater part includes the opinion of the few; next because, although Peter had believed in the resurrection, he could yet be troubled when he saw that the Lord, with his body, poured himself unexpectedly even into places that were enclosed with barred entrances and built walls. Luke, therefore, followed out each thing historically; the one looked to the end, the other to the sequence. For certainly in saying: Then he opened their understanding, that they might understand the things that are written, he himself too professes that the disciples believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
