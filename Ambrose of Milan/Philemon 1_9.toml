[[commentary]]
quote='''
So much for the moral sense; mystically, however, the Lord Jesus saw Paul — the eyes in fact of the Lord are upon the just — and said: Is this your younger brother? He is still called the younger, since he did not yet bear the mature age of grey-haired faith, had not yet grown to the perfect man, to that, as he himself says, measure of the age of the fullness of Christ. Indeed, he is read of as a young man only there, where he was keeping the garments of those who stoned Stephen. And therefore he desired Philemon to be like not his youth but his old age, as he wrote: I beseech you the more, since you are such as Paul, an old man. Therefore he teaches that the younger widows are to be avoided, not on account of their age, but on account of a certain wantonness of the offences of youth and an immaturity of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 10"
