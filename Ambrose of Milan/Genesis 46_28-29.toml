[[commentary]]
quote='''
Judah runs to meet him, that is, the confession of error. The people of the Jews, about to come, sends him ahead as the herald of its coming. Therefore the true Joseph also, that is, the arbiter and interpreter of the Godhead, runs to meet them, because confession now goes before those whom unbelief possessed before. For Christ is the interpreter of the Godhead, because no one has ever seen God, except the only-begotten Son, who is in the bosom of the Father; he has made him known. He will receive in the last times the people of the Jews, now of aged years and weary, not according to its merits but according to the election of his grace, and he will lay his hand upon its eyes to take away its blindness. He has put off its healing for this reason: that the people which before did not think it should believe might believe last, and might lose the prerogative of its earlier election. Hence also the Apostle says: That blindness in part has befallen Israel, until the fullness of the Gentiles should come in, and so all Israel should be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
