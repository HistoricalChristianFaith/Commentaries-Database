[[commentary]]
quote='''
What is worse, this is the vice of many, and especially of the rich who, under this head, fill their larders. If someone thinks a banquet should be celebrated, he sends to the merchant to bring him a little cask of absinthe wine free, he notifies the innkeeper that he needs Picenian or Tyrian wine, the butcher, that he should procure a sow's matrix for him, another, that he should furnish fruit. And so they consider kindness things which are manifestly to another's peril. You drink, and another streams with tears; you feast, and strangle others through your food; you are entertained with music, and another laments with sad wailing; you taste fruits, and another devours a thorn. Do they collect grapes of thorns or figs of thistles? A thorn is usury, a thorn is the hundredth, a thistle is interest, it stings badly. How then can you have fruit of thorns? If this fruit is not derived from thorns, will what is everlasting be derived from them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 14"
