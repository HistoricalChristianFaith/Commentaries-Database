[[commentary]]
quote='''
But let us return to the sequence of the interrogation set before us. Many he says are the crushings he has wrought upon me. He does not let me breathe, he has filled me with bitterness; and because he is mighty in power, no one can resist his judgment. If I am just in heart, my tongue errs. Wrath destroys the great and mighty man. The wicked are in grievous death, but the just are mocked; for they have been given into the hands of the ungodly. Look at each point. To the powerful their own wrath is grievous, to the wicked their wickedness, to the just the weakness of their condition. So nothing is free of danger. The strength and greatness of a man is deceived by its own power, wickedness is afflicted, virtue is mocked. The one, because he can do more, slips; the other, because he can do nothing, is afflicted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
