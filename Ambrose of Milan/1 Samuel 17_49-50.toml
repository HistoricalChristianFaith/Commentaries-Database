[[commentary]]
quote='''
You see, then, by how great nets even the hearts of the saints are caught, and therefore do not wonder if holy David too was caught, a man indeed great, and one who by faith conquered the Philistine, monstrous in body and bristling also with weapons of war. But would that he had conquered himself; would that, as he laid low that adversary, so he could have laid low and overcome his inner adversary! Heavier is the battle of him who fights within than of him who fights without.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
