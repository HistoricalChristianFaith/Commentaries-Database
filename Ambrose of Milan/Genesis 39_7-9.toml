[[commentary]]
quote='''
And she said to him: Sleep with me. The first weapons of an adulteress are those of the eyes, the second those of words; but he who is not captured by the eyes can resist a word. Defence is at hand where the affection is still free. Therefore it is written that he would not. First, then, he overcame her in the encounter of the mind, repelling her onslaught as with the shield of his soul; then he hurled his speech like a spear, so that she might call herself back. And he said to his master's wife. Rightly is she called his master's wife, not his mistress herself, she who could not wrest what she wished to obtain. For how was she a mistress, who had not the power of mastery, who did not keep the discipline of a mistress, who offered slaves the incitements of lust? He was the master who did not take up the torches of the lover, who did not feel the bonds of the seductress, whom no dread of death terrified, who preferred to die free of crime rather than choose partnership with a criminal power. He was free who believed it shameful not to return favour for favour. And so he does not excuse himself like a fearful man, nor take care like one afraid of danger, but as one indebted to his master's kindness and to his own innocence he flees the crime of an ungrateful man, and as a just man he shudders at the stain of sin and the contagion of guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 5"
