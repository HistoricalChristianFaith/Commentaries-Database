[[commentary]]
quote='''
Likenesses of gold, he says, we will make for you, with studs of silver, until the king is at his reclining. For from among those who are of the Law and the prophets, men had before believed only moderately in the glory of the Lord Jesus; and his inheritance, spread through the peoples, the more often it was tested, the more it was proved. For the frequent persecutions of the Church have produced for us the titles of the just, the victories of martyrdom. And so, as good gold, so the Church, when it is burned, feels no loss, but rather its brightness is increased, until Christ comes into his kingdom and reclines his head on the faith of the Church. He, when he had come to the lost sheep of the house of Israel, had nowhere to lay his head: but now faith is fragrant, and therefore the Church says: My nard has given its fragrance; and she says it with confidence, awaiting the reward. The ointment of grace is fragrant, in which the virgin brought forth, and the Lord Jesus took up the sacrament of the incarnation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
