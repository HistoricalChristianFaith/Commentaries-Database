[[commentary]]
quote='''
Let him who cannot fly like an eagle flutter like a sparrow; let him who cannot fly to heaven fly to the mountains; let him first flee the valleys, which are quickly spoiled by moisture, and pass over to the mountains. Abraham's nephew passed over to the mountain of Zoar and was saved; but she who could not ascend, turning back through a woman's feeling, lost her salvation. Draw near to the eternal mountains, says the Lord through the prophet Micah, arise from here, for this is no refreshment for you because of uncleanness. You have been corrupted with corruption, you have suffered persecution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
