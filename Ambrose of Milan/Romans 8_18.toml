[[commentary]]
quote='''
That we must undergo many troubles in this life, divine Scripture shows in frequent passages, and also that many consolations are at hand, by which a mind capable of vigour and conscious of what is right ought to swallow up whatever belongs to present hardships and to look upon those things that hold unending delight. For consolations outweigh troubles, since they bring both the calming of present things and the hope of things to come. Hence the apostle Paul too: Unworthy are he says the sufferings of this time in comparison with the glory that is to come: unworthy, certainly, as regards the consolation of comparison, not as regards the fruit of redemption.

For whose life on earth is so illustrious that it could equal that heavenly glory? What is more sublime than Paul, who underwent so many dangers and swallowed so much pain and so many weaknesses? In the sufferings which he underwent for the name of Christ he was dying daily, as he himself says, and he reckoned that he suffered nothing unworthy in this time, for the hope and expectation of so great a glory. Elijah endured hunger, plots and the terrors of death, the bitterness of toils: and yet he alone, brought down from heaven to earth by fiery chariots and fiery horses and carried back from earth to heaven, hid all the merit of this warfare and lifted the grace of the devout rider beyond all things human. For what shall I say of Peter? Judging his cross unworthy of the future reward, he asked to be hung with his feet turned upward, so as to add something to his passion, he who did not fear to heap up its torments upon himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 1"
