[[commentary]]
quote='''
Believe that the flesh too will rise again. For what need was there for Christ to take flesh? what need was there for Christ to mount the cross? what need was there for Christ to taste death, and undergo burial, and rise again, except for your resurrection? This whole sacrament is that of your resurrection. If Christ has not risen, our faith is vain; but because he has risen, therefore our faith is firm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExplanation%2520of%2520the%2520Creed.html'
source_title="Explanation of the Creed"
