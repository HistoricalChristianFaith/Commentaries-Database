[[commentary]]
quote='''
Do you, then, a debtor for so great a benefit, not pay back deference? He has made you an heir, he has made you a co-heir: an heir of God, a co-heir of Christ; he has poured into you the spirit of adoption. Count these things up, and apply them not so much to the bond of a debt as to the keeping of a gift received. You are a co-heir of Christ, if you suffer with him, if you die with him, if you are buried with Christ. Take up his passions, so that you may deserve to be with him above the passions. See how he has forgiven you your former sins, so as to make the fact that you sinned do you no harm. See how he exhorts you not to lose what you have received. Short is the goal of this labour, and the crown is of everlasting fruit; the suffering is bearable, the reward beyond reckoning. For what distresses you? The lowliness of humble birth? But you will have in the future a glorious nobility of devotion and faith. A slender fortune, a straitened living? But you will have the riches of an eternal recompense, in which you can lack nothing. The loss of children? You will receive back as everlasting those whom you had taken up as temporal. It will be said of you: Blessed is he who has seed in Zion and kinsfolk in Jerusalem. Unworthy it says are the sufferings of this time in view of the glory to come: so Scripture tells you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 6"
