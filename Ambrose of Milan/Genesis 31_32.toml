[[commentary]]
quote='''
But if you are such as Jacob was, you will say to Laban, to him who transforms himself into an angel of light: Search whether you find anything of yours with me. Then he will search and, finding nothing, will go away confounded, because you have hidden and blotted out all the likenesses of the vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
