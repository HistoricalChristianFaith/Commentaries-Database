[[commentary]]
quote='''
Good, then, is the true Isaac, as being full of grace and a fountain of joy. To this fountain Rebecca came, to fill her water jar. For Scripture says that going down to the fountain she filled her water jar and came up. And so either the Church or the soul went down to the fountain of wisdom, to fill her whole vessel and to draw the teachings of pure wisdom, which the Jews would not draw from the flowing fountain. Hear him who says what this fountain is: They have forsaken me, the fountain of living water. To this fountain the soul of the prophets ran thirsting, as David also says: My soul has thirsted for the living God, that it might satisfy its thirst with the abundance of divine knowledge and wash away the blood of folly with the watering of spiritual streams.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 1"
