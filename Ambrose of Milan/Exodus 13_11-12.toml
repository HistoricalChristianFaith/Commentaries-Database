[[commentary]]
quote='''
These are the sort of animals recommended and commanded by the Law, as related in the Scriptures: And when God shall have brought thee into the land of the Chanaanite, as he swore to thy fathers and shall give it to thee. And thou shalt set apart all male animals that openeth the womb for the Lord, and all that is first brought forth of thy cattle and thy flocks. Whatsoever shall be born thee of the male sex, consecrate to the Lord. The firstborn of an ass thou shalt change for a sheep, and if thou doth not change it, thou shalt redeem it. Consider the profound mysteries and the wealth of wisdom imbedded in these words which in their simplicity convey to us an abundance of grace of the spirit! The Chanaanites are people who are restless and uneasy. When you enter into their land and notice how they are devoid of morals as a result of their levity, uneasiness, and instability, then you have an occasion to show your constancy. Do not be disturbed by any trifling argument or flightiness of speech. These are the characteristics of the Chanaanite, inconsistency in language, emotional instability and restless contention. Be calm and present to them a tranquillity and serenity of mind and soul. Be like one who escapes the storms of the sea by casting anchor in a safe harbor.

The attainment of this goal is promised to you by the Lord. You are confirmed in your constancy by His assurance, which may be likened to an oath. But God does not solemnly swear because He has need of a believer's trust or because, deprived of the confirmation of witnesses, He requires the aid of an oath. He does not act as human beings do. We bind ourselves by a solemn oath to swear to tell the whole truth. God's very utterance inspires trust. His speech is a solemn oath. God is to be trusted, but not because of an oath. Rather, the oath is to be trusted because of God. Wherefore, then, does Moses speak of God as if He were in the act of taking an oath? Because we, as mortals, are bound by limitations. We wrap ourselves in the folds of public opinion as a sea-urchin does in his shell. We act like a snail who cannot breathe in the free air of heaven unless he is protected by his shell. We behave in a similar manner because we are cabined and confined in the earthy recesses of human custom. Wherefore, since we tend to believe that to be true which is confirmed by a solemn oath, lest we should falter in our trust, the same action is ascribed to God, who Himself does not take an oath, but is the avenging judge of those who commit acts of perjury. Hence it is written: The Lord has sworn and he will not repent: you are a priest for ever. He has assuredly kept His oath. He has given us a High Priest for ever, in order that you may know that there is a sanction for your oath and that an act of perjury will have its avenger in Him who does not deceive.

Expelling, therefore, all uneasy and disturbing thoughts from your mind and heart, God will give you free and complete ownership, so that you may till the soil in full security. You will be able to reap a harvest therein and not permit the people of Chanaan to gain entrance, that is to say, you will be able to avoid all offensive emotions. You will pluck out by root the vices of the Gentiles. You will overturn their groves by which truth is overshadowed and in which the clear vision of celestial knowledge is obscured by the dread darkness of disputation.

But you cannot attain this condition without the assistance of God. Therefore He said: He shall give it to thee, that is to say, He will give you thoughts that are on the highest plane, counsels that lead to peacefulness, and ideas that bring tranquility. When He has granted these favors, you will set apart all that opens the womb and sacrifice it to the Lord. God, although He has given you everything, does not exact anything from you. He has bestowed much in abundance for the use and support of men. There is no question of God's participations in an act of nature such as eating, drinking, sleeping. These and other functions of the body were granted to you freely by God. They are not in the nature of favors. However, thoughts that are holy are the gifts of God and are inspired by His grace. On the other hand, ordinary natural and human acts do not defile a man, but it is what comes out of the mouth. Deceit, false testimony, and sacrilege are the acts which bring defilement to man.

Let us make clean, therefore, the thoughts within us, so that our offering may not displease. Therein let us search for what opens the womb, that is to say, for what is just and excellent, because we owe to the Lord that which is holy. Yet we are not sanctified by carnal copulation, by conception, and by parturition, whereby the womb of a woman is opened and her virginity destroyed. Although a wife sanctifies a husband and a husband the wife, it frequently happens that a woman's womb is opened without the sanctification of wedlock. Again, it is not a question of sanctification being confined solely to the husband. The wife, too, partakes in it. The natural functions of each sex are distinct in the act of conception. The husband and wife contribute what is right and proper to the sex of each. The wife furnishes the generation of human succession, a function which is outside the province of a husband.

If such, therefore, be our experience in the flesh, let us turn to an examination of what is proper to the soul. There is no question that we have to deal here with something that is without sex, yet it fulfills all the offices of both sexes in that the soul conceives and, as in marriage, gives birth. Nature provides woman with a womb in which a living person is brought to birth in the course of time. Such, too, is that characteristic of the soul which is ready to receive in its womb-like recesses the seeds of our thoughts, to cherish them and to bring them forth as a woman gives birth to a child. This and no other is the meaning of the words of Isaias: We have conceived and brought forth the spirit of salvation. Some of these conceptions are associated with the female sex, such as malice of thought, petulance, sensuality, self-indulgence, immodesty, and other vices of that nature which tend to enervate the traits associated with what is distinctively masculine. These last are the virtues of chastity, patience, wisdom, temperance, fortitude, and justice, which make it possible for our minds and bodies to struggle with zeal and confidence in our pursuit of virtue. These are the conceptions to which the Prophet Isaias referred in the words, We have conceived and brought forth the spirit of salvation, that is to say, the characteristic masculine traits conceived and gave birth to the spirit of salvation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 10"
