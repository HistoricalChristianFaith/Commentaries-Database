[[commentary]]
quote='''
And the angel said: Abraham, Abraham. The divine voice in a way held his hand and forestalled the blow of the brandished right hand. He called not once only, lest he either not hear fully or think the voice a chance one. He called him back in the same way as he had commanded him. He repeated the call as though fearing that he might be forestalled by the zeal of devotion, and that a single call could not hold back the thrust of the one striking. Do not lay your hand on the boy, nor do anything to him; for now I know that you fear your God and have not spared your most beloved son for my sake, that is to say: 'I sought out your affection, I did not exact the deed. I tested your mind, whether you would not spare even your most beloved son for my sake. I do not take away what I myself gave, nor do I begrudge you the heir whom I bestowed on you when you had none.' Nor idly here too did he call him his most beloved son, to show that what he said above, whom you have loved, was said in such a way that you should not suppose he had already ceased to love him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
