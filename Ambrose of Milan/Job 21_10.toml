[[commentary]]
quote='''
Nor does he think it blessedness if his heifer does not miscarry, as fools think. For what is signified by the ox but the toil of rural husbandry, which always comes round again in a circle and never ceases, but, when it seems to be completed, is called back to its beginning? These are they who till Sodom and Gomorrah. So those who till Egypt, and turn over the clods of the earth with a kind of plough of a solid mind, beget toil for themselves and reap sorrows. Therefore their heifer does not miscarry, but gives birth, that their toil may be increased, and all that they have conceived they bring forth without the fear of God. But the just glory far otherwise; for they glory not in an abundance of riches nor in the births of cattle, but in the Lord, saying: From your fear we have conceived in the womb, and have travailed with the spirit of salvation. So it is said of the just that they have brought forth the spirit of salvation, which they received from the fear of God, not from the malice of this world, of which we read: Behold, he has travailed with injustice, and conceived toil, and brought forth iniquity. So the miscarriage is better than the childbearing of worldly men. Indeed, concerning the man who came into this world and endured the vanity and the darkness of this world through a long old age, Ecclesiastes declared that a miscarriage is better than he. For this one has rest rather than that one, because he did not experience the changes of the world, in which, even if someone has lived a thousand years, he could not see what is good. So to have escaped these things is more a grace than to have undergone them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 4"
