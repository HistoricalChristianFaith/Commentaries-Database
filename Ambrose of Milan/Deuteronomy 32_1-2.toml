[[commentary]]
quote='''
Moses himself also, when he had read the Law of the Lord, in order to fix its memory in the hearts of his hearers, spoke through a song, saying: hear, O heaven, and I will speak; let my speech be awaited like the rain, and let my words come down like the dew, like a shower upon the grass and like snow upon the hay.

God, then, delights to be not only praised by a song but also reconciled by it. Hence Moses too made use of a song above all at the time when he was calling heaven and earth to witness, so that the world might listen more eagerly to its salvation sounding in harmony with the strain of heavenly grace, and that, by the sweetness of a sacred delightfulness, the observance of the Law might grow forever into human minds. In fact, before the tables of the Law were confirmed by a song, they were broken and shattered through the indignation of Moses; but once they had been consecrated with such a seal, human anger had no place, because the sanctification of sacred sweetness shut it out. And so the song of the Lord came down from heaven like a softer dew, and watered the faith of men, as the grass is watered, with a kind of shower of spiritual grace. These two songs, therefore, in the books of Moses, like two eyes of the world and two lights of heaven, illuminate the whole body of his work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
