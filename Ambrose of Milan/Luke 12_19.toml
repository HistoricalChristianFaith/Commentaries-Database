[[commentary]]
quote='''
Let this world, then, die to us; let the wisdom of this flesh, which is hostile to God, die to us. Let us subject our soul to Christ alone, so that each one may say: Is not my soul subject to God? Not subject to the world, not subject, he says, to the world. The moneyed man cannot say this, the greedy man cannot say it; but the just and self-controlled man says it. The greedy man, however, says: Soul, you have many good things laid up for many years; rest, eat, drink and feast, because the soul of the greedy man is subject to bodily luxury, whereas the soul of the just man uses the body as an instrument or organ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"

[[commentary]]
quote='''
Thou hast, he says, much goods. The miser does not know how to mention goods, except those which are lucrative. But I agree with him that those things which are pecuniary may be called goods. Why, therefore, do you make evils from goods, since you ought to make goods from evils? For it is written: Make unto you friends of the mammon of iniquity. For him, then, who knows how to use them, they are goods; for him who does not, they are rightly evils. He hath distributed, he hath given to the poor: his justice remaineth forever. What is better than this? They are goods if you bestow them on the poor, wherein you make God your debtor by a kind of pious usury. They are goods if you open the barns of your justice so that you may be the bread of the poor, the life of the needy, the eye of the blind, and the father of orphan children.

You have the means of doing this: why do you fear? I address you with your own words: Thou hast much goods laid up for many years, you can abound both for yourself and for others, you have plenty for all: why do you pull down your barns? I will show you where you may better preserve your grain, where you may enclose it well, so that thieves cannot take it from you. Store it in the hearts of the poor, where no weevil may consume it, and no age destroy. You have as storerooms the bosoms of the needy, you have as storerooms the homes of widows, you have as storerooms the mouths of infants, so that it may be said to you: Out of the mouth of infants and of sucklings thou hast perfected praise. These are the storehouses that remain forever, these are the barns that a future abundance will not pull down. For what will you do again, if more be grown to you in the next year? Again, therefore, you will pull down the barns which you are now getting ready to build, and you will build greater. Now God gives abundance to you that it may either overcome or condemn your avarice; wherefore you cannot have an excuse. Yet you reserve for yourself alone what He has wished to be grown through you for many; nay, you even deprive yourself of it, for rather would you be laying up for yourself, if you were distributing to others. For the fruits of good gifts return to the ones who bestow them, and favor for generosity returns to the author. Therefore it is written: Sow for yourselves in justice. Be a spiritual farmer, sow what will be profitable to you. Good is the sowing in the hearts of widows. If the earth returns to you more abundant fruits than it has received, how much more will the remuneration for mercy return to you many times what you have given!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 7"
