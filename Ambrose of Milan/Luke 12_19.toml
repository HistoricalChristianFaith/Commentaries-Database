[[commentary]]
quote='''
Let this world, then, die to us; let the wisdom of this flesh, which is hostile to God, die to us. Let us subject our soul to Christ alone, so that each one may say: Is not my soul subject to God? Not subject to the world, not subject, he says, to the world. The moneyed man cannot say this, the greedy man cannot say it; but the just and self-controlled man says it. The greedy man, however, says: Soul, you have many good things laid up for many years; rest, eat, drink and feast, because the soul of the greedy man is subject to bodily luxury, whereas the soul of the just man uses the body as an instrument or organ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"
