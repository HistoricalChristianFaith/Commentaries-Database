[[commentary]]
quote='''
Christ is not only God but true God indeed—true God of true God—and I approach the true one inasmuch as he himself is the truth. If, then, we inquire his name, it is "the truth." If we seek to know his natural rank and dignity, he is so truly the very Son of God, that he is indeed God's own Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25201.html'
source_title="Exposition of the Christian Faith 1.17.108"


[[commentary]]
quote='''
If they say that the Father alone is true God, they cannot deny that God the Son alone is the truth. For Christ is the truth. Is the truth then something inferior to him that is true, seeing that according to the use of terms a person is called true from the word truth, as also wise from wisdom, just from justice? We do not consider it so between the Father and the Son. For there is nothing lacking in the Father, because the Father is full of truth. And the Son, because he is the truth, is equal to him who is true.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25205.html'
source_title="Exposition of the Christian Faith 5.2.28"

[[commentary]]
quote='''
The whole road of this life is full of snares. Hence the just man says: In this way in which I walked they have hidden snares for me. In this way he says they have hidden. Therefore walk in that way which says: I am the way and the truth and the life, so that you may say: He has turned back my soul; he has led me upon the paths of justice for his name's sake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"
