[[commentary]]
quote='''
Nor let us fear because we have squandered on earthly pleasures the patrimony of spiritual dignity that we received. As for the treasure which the father bestowed on the son, the treasure which he had, the wealth of faith is never exhausted: though he has given all, he has all, for he does not lose what he has given. Nor should you fear that he may not receive you; God does not indeed delight in the destruction of the living. Already, running to meet you as you come, he will fall upon your neck — the Lord indeed raises up those who are dashed down — he will give you a kiss, which is the pledge of devotion and love, he will order a robe, a ring, shoes to be brought out. You still fear an injury, he restores your dignity; you dread punishment, he offers a kiss; you fear reproach, he prepares a feast. But now let us discuss the parable itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
