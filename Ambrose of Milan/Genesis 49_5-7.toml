[[commentary]]
quote='''
He seemed entangled in the hindrance of the body, and yet with a watchful disposition he ran ahead into future times, saying of the persecutors of the Lord, who were to come forth from the tribe of Simeon and Levi as authors of wickedness: Let my soul not come into their counsel, and let my inward parts not strive to meet them. But who is so strong in power as this man was brave in weakness, who said: Cursed be their fury, because it is proud and rash, and their anger, because it is hardened. I will divide them in Jacob and scatter them in Israel?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
