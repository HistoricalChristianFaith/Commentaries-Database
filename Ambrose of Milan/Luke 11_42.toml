[[commentary]]
quote='''
Or judgment, because they do not bring to examination every thing that they do; charity, because they love not God with their heart. But that He might not make us zealous of the faith, to the neglect of good works, He sums up the perfection of a good man in a few words, these ought ye to have done, and not to leave the other undone.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Briefly, too, he touches on their many vices, who bend all their zeal to paying tithes of the cheaper produce, and have neither any fear of the judgment to come nor any love of God, since works without faith are vain; for they pass over the judgment and the love of God: the judgment, because they do not refer all that they do to the judgment; the love, because they do not love God from the heart.

But lest, on the other hand, he make us zealous for faith and neglectful of works, he sums up the perfection of the faithful man in a brief saying, so that he may be approved both by faith and by works, saying: these things you ought to have done, and not to leave those undone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
