[[commentary]]
quote='''
[The church] mourns in its eyes, that is in its faithful, because it is written, "Your eyes are as doves apart from your reticence," because they see spiritually and know how to keep silent about the mysteries which they have seen.
'''
source_url=''
source_title="CONSOLATION ON THE DEATH OF EMPEROR VALENTINIAN 7"


[[commentary]]
quote='''
But Christ, beholding his church, for whom he himself, as you find in the book of the prophet Zechariah, had put on filthy garments, now clothed in white raiment, seeing, that is, a soul pure and washed in the laver of regeneration, says, "Behold, you are fair, my love, behold you are fair, your eyes are like a dove's," in the likeness of which the Holy Spirit descended from heaven. The eyes are beautiful like those of a dove, because in the likeness of a dove the Holy Spirit descended from heaven.
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 7:37"

[[commentary]]
quote='''
Now the Bridegroom, turning to the praise of the bride, says: How beautiful you are, my friend, how beautiful you are! Your eyes are like doves, apart from your silence. Beautiful in preaching, beautiful in conduct. Her eyes also, he says, are like doves. The eyes are men, namely those adorned with spiritual senses, who are keen to see the mysteries and ready to penetrate the secrets of divine Scripture, shining with rational milk, in whom there is no spotted confusion of any guile, but the pure and spotless simplicity of a simple affection. Therefore he afterward mentioned these doves, washed in the abundance of waters, in milk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Your eyes are like doves, apart from your silence; because she both sees spiritually and knows that there is a time to be silent and a time to speak; so that she may bring forth her speech in due time, lest by untimely speaking she incur sin.

Your eyes are like doves. Here the simplicity and grace of the dove, that is, of the Church, is revealed. See, then, the simplicity of the eye: for he who sees a just man and rejoices himself also wishes to be just; for it is a beautiful thing that one should delight in others in that which he himself wishes to keep in himself, if he can. For it is implanted in good men that the modest man loves the chaste, the wise man the prudent, with dutiful affection, the merciful man the liberal: that they love their own virtues in others. For many, too, the sight of a just man is an admonition to correction, but for the more perfect it is joy. For if there is so great a power in natural things that an animal, when seen, benefits those who have jaundice, so that even the body of that creature when dead is said to benefit those who have fallen into an affliction of this kind, if it has been shown to them, can we doubt that the sight of the just man heals, whose eyes are like doves, simple and modest? So then, a worthless irrational animal has such power that it can heal a man in the brief moment in which it is seen: shall a just man, if only he is looked upon with faith by one who desires to receive benefit from him, confer nothing? How beautiful, then, that you should be seen and be of benefit!

A just man, then, is a good thing. For this reason, indeed, the apostle Paul went up to Jerusalem, to see the just; and he stayed with Peter fifteen days, that he might gain something from living with him (Gal. 1:18). For this reason Paul himself and Barnabas, when they entered Jerusalem, were magnificently received by the Church and the apostles and the elders; but when they wished to go away, they were asked not to depart; and, as we read afterward of Paul, he was escorted with tears. Do not even the very rays of the eyes seem to pour a certain power into those who faithfully desire to see him?

But just as the just man gladdens the heart of the innocent when he is seen, so the wicked are tormented by acquaintance with the just, because they are reproved even by the silent conduct of the saints. Chastity torments the incontinent, liberality avarice, faith impiety. On this point too let us take a like example from a worthless creature. For just as we have said that a dumb animal does good when it is seen, so we perceive that the wolf does harm if it has seen someone first; for those whom the wolf has seen first are said to lose their voice. The basilisk too (this is a harmful serpent), if it sees any animal first, is said to kill it; and it is alleged that he is at once slain who has been seen first by a serpent of this kind. The serpent itself is also said to die if it has been forestalled by the sight of a man. So if there is so great a power either in the eyes of a serpent or in the eyes of a man that, if one sees the other first, he can kill him, is there no power in the eyes of the just man, who is filled with the grace of virtue, especially since faith works so much, that both she who touched the fringe of the Lord was healed, and he on whom the Lord Jesus fixed his gaze at once drew the grace of healing from his eyes (Matt. 9:22)?

But he who sees a just man ought to know what he sees. He does not see him in the body, not in his clothing, not in his patrimony, not in his countenance: but he sees within. He does not, I say, see him, unless he has seen his mind, unless he has attended to his speech, unless he has been able to grasp his meaning, has been able to take up wisdom from his discourse. Then, therefore, he will rejoice, when he has looked into these things, when he has come to know them. So then let us too, wherever we hear of a just man, hasten to see him, like that woman who heard that the Lord Jesus was reclining at table in the house of the Pharisee, and went in, and poured ointment over his feet (Luke 7:37 and 38). Let us be imitators of her, for who would doubt that in that woman there is a figure of the Church? Wherever, then, a just man sits, wherever he reclines, let us hasten to see him. It is a precious thing to see a just man, so that you may see him according to the image of God. What is outside profits nothing; what is within heals. Yet indeed, in him who is outside we often behold him who is within: so that, if we have seen a poor man, we honor in the poor man him after whose likeness he was made, of whom he says: You gave me to eat, for what you gave to one of these, you gave to me (Matt. 25:35 and 40).

Your hair is like a flock of shorn goats, which have been revealed from Mount Gilead. It says "hair" because the power of all the senses is in the head: The eyes indeed of the wise man are in his head (Eccles. 2). Deep, then, is the prudence of teachers, which can reveal those things that are obscure, and open up the depths of meanings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
