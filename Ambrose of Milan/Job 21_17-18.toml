[[commentary]]
quote='''
To this opinion of his, therefore, holy Job answered: do not be secure and careless in supposing that the scourges of the Lord do not come to you in this very world. Even the lamp of the ungodly is put out. It shines for a time; it does not have eternal light. And although the world favours them, because they do the will of him who holds sovereignty in the world, a reversal of fortune is wont to come, and sorrows from the heavenly wrath and indignation, so that they are winnowed like chaff by the wind. The unjust are winnowed like chaff, the just like wheat. Indeed, hear the Lord saying to Peter: Behold, Satan has asked to winnow you like wheat; but I have prayed for you, that your faith may not fail. Those fail who are winnowed like chaff; he does not fail who is after the likeness of that grain which fell and rose again, heaped up with the increase of many fruits. Therefore the prophet says: Woe is me, for I have become like one who gathers stubble in the harvest! So ungodliness is compared to stubble, which is quickly burnt up, and to dust. Therefore, after he had said: They will be like chaff by the wind, he at once added a little verse, saying: or like dust, which the wind has carried away. Indeed, that you may know that the ungodly man quickly crumbles and vanishes like dust, you have it said in the first psalm: Not so the ungodly, not so; that is, not like the just, but like dust, which the wind drives from the face of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
