[[commentary]]
quote='''
Let us consider also what reward he asks from the Lord himself. He does not demand riches like a greedy man, nor a long span of this life like one afraid of death, nor power, but he seeks a worthy heir of his labour. What he says will you give me? But I am sent away without sons, and below: because you have not given me seed, my home-born servant shall be my heir. Let men learn, then, not to spurn marriage nor to join unequal partners to themselves, lest they beget children of such a kind that they cannot have them as heirs; so that, if they are moved by no regard for modesty, they may at least, out of concern for passing on their inheritance, strive for a worthy marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
