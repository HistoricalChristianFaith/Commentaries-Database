[[commentary]]
quote='''
What is our window, if not that through which we see the works of Christ, namely the eye of the soul and the gaze of the mind? And therefore, virgin, let Christ come in through your window, let Christ put in his hand: through your window let the love of the Word come to you, not the love of the body. If, then, the Word of God puts his hand in through your window, see how you prepare your windows, see how you must wipe them clean of all the dust of transgressions. Let the windows of a virgin have nothing foul, nothing adulterous. Away with antimony and the other trifles of affected beauty, away with the allurements of adulterous love. Like this is the closing of the ears, from which no weights are to be hung, in which no wounds are to be pierced, but which have one adornment: to hear what profits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
