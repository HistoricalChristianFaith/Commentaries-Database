[[commentary]]
quote='''
But faith is in one place ground, in another pressed, in another sown. The Lord himself is a grain of mustard. He was untouched by injury, but the people, which had not touched him, did not know him, as one does not know a grain of mustard. He chose to be ground, so that we might say: for we are the good odor of Christ to God; he chose to be pressed, whence Peter too said: the crowds press you; he chose to be sown like a grain, which a man took and cast into his garden. For in a garden Christ was both taken and buried, in a garden he grew, where he also rose again, and he became a tree, as it is written: as the apple tree among the trees of the wood, so is my brother in the midst of the sons.

So you too, sow Christ in your garden — a garden is surely a place full of flowers and of diverse fruits — in which the grace of your work may blossom and the manifold odor of varied virtue breathe forth. There then let Christ be, where the fruit is. Sow the Lord Jesus: he is a grain when he is seized, he is a tree when he rises again, a tree overshadowing the world; he is a grain when he is buried in the earth, he is a tree when he is raised up to heaven.

Press, too, with Christ, and sow faith. Faith is pressed when we believe Christ crucified. Paul pressed faith when he said: and I, coming to you, brothers, came not with eminence of speech or of wisdom, preaching to you the mystery of God; for I did not judge myself to know anything among you except Christ Jesus and him crucified. And because he taught how to press faith, he taught also how to lift it, saying: now indeed we no longer know Christ crucified. And we sow faith when, from the Gospel and the readings of the apostles and prophets, we believe in the Lord's Passion. We sow faith, then, when we cover it, as with softened and worked soil, with the Lord's flesh, so that, as it were by the warmth and pressure of the sacred body, faith may sow itself abroad. For he who has believed that the Son of God was made man believes that he died for us, believes that he rose again for us. I sow faith, then, when I plant his burial among it.

Do you wish to know that Christ is a grain and that Christ was sown? Unless a grain of wheat falling into the earth dies, it remains alone; but if it has died, it will bring much fruit. So we have not erred, since we said what he himself had already said. And he is both a grain of wheat, because he strengthens the heart of man, and a grain of mustard, because he kindles the heart of man. And although both suit all things, yet he seems a grain of wheat when his resurrection is treated; for he is the bread of God who came down from heaven, because the Word of God and the example of the resurrection nourish minds, sharpen hope, strengthen affection; but a grain of mustard, because the discourse about the Lord's Passion is more bitter and sharper, more bitter for weeping, sharper for moving. And so, when we hear and read that the Lord fasted, the Lord thirsted, the Lord wept, the Lord was beaten, the Lord said at the time of the Passion: watch and pray, lest you enter into temptation, then, rebuked as by the juice of a more bitter word, we temper the sweetnesses of bodily pleasures that are sweeter than is right. So he who sows a grain of mustard sows the kingdom of heaven.

Do not despise this grain of mustard; it is indeed the least of all seeds, but when it has grown it becomes greater than all herbs. If Christ is the grain of mustard, how is Christ either least, or how does he grow? Truly not by nature, but by appearance he grows out again. Do you wish to know him as least? We saw him, and he had no form nor comeliness. Learn him as greatest: fair in form above the sons of men. For he who had no form nor comeliness was made more excellent than the angels, beyond all the glory of the prophets, whom weak Israel had eaten like herbs; for of the bread by which hearts are strengthened, it had refused the one and had not received the other.

And Christ is a seed, because he is the seed of Abraham; for the promises were spoken to Abraham and to his seed. He does not say: 'and to seeds', as of many, but as of one: 'and to your seed', which is Christ. And not only is Christ a seed, but even the least of all seeds, because he came not in kingship, not in riches, not in the wisdom of this world. But suddenly, like a tree, he spread out the lofty crown of his power, so that we say: under his shadow I desired and sat down. And often at the same time. I think, he seemed both a tree and a grain. He is a grain when it is said: is not this the son of Joseph the carpenter? But amid these words he suddenly grew, as the Jews themselves testify, since they could not, as it were, reach the branches of a spreading tree, saying: whence has this man this wisdom?

The grain, then, is the figure, the tree is wisdom, in whose leafy branches that night-raven in the dwelling, that solitary sparrow in the building, that man caught up into paradise and to be caught up into the air and the clouds, now rest in a safe seat. There rest also the powers and angels of heaven and all who have deserved to fly up by spiritual deeds. Saint John rested when he reclined on the breast of Jesus; nay rather, he himself too is extended like a branch by the sap of that tree. Peter is a branch, Paul is a branch, forgetting the things that are behind and reaching out to those that are before. Into their bosoms and certain recesses of their discourses we who were far off, that is, we who have been gathered from the nations, whom the storm and whirlwind of spiritual wickedness long tossed through the void of the world, fly, taking up the oars of the virtues, that the shade of the saints may defend us from the heat of this world, flourishing now in the security of a sure anchorage,

because our soul, before bent down by heavy sins like that woman, rescued like a sparrow from the snare of the hunters, has migrated into the branches and the mountains of the Lord. And so we who before were vain with superfluous observances and flitting about with empty levity, now, through faith in Christ, our hands loosed and free from the bonds of the sabbaths, give ourselves to good works, and in our very feasts we have liberty, we shut out intemperance, lest, free from the Law, we be slaves to desires; for the Law bound men to itself, that it might release them from desires. Grace, which took away the lesser servitude, has commanded much weightier things: all things for us are lawful, but not all things are expedient: for it is a grave thing to use a power so as to fall back under a power. Cease to be under the Law, that by virtue you may be above the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
