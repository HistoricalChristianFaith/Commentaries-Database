[[commentary]]
quote='''
The Gospel says to you again: Brood of vipers, who showed you to flee from the wrath to come? And it says this to those who were coming to the baptism of repentance.

So repentance is a good flight; the grace of God is a good flight, in which is the taking up of the one who flees; the desert is a good flight, to which Elijah, Elisha and John the Baptist fled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 6"
