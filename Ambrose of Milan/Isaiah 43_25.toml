[[commentary]]
quote='''
You have blotted it out, indeed, in your hearts and minds, but the Word of God is not blotted out, the Holy Spirit is not blotted out but turns away from impious minds. It is not grace but iniquity that is blotted out; for it is written, "I am he, I am he who blots out your iniquities."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25203.html'
source_title="On the Holy Spirit 3.10.61"

[[commentary]]
quote='''
Turn, then, to God, O nations, and know that the Lord himself is God. He made us, and not we ourselves. Know that we are flesh and dust. Let us, then, leave what we have done and venerate the very author of our being, who gave life, who forgave sins, who alone can say: I am, I am he who blots out your iniquities, and I will not remember. Great indeed and merciful is God, who confers a benefit and does not reproach the gift of the benefit. Do you wonder that he made David a king and the conqueror of many nations? So he is wont to raise up his little servants. Not greedy for gifts nor sparing of benefit nor narrow in grace nor thrifty, but rich in largesse, he increases in reward those whom he has redeemed from sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
