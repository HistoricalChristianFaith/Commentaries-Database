[[commentary]]
quote='''
The just man therefore has what he may lend, he has even silver which he may lend: he lends his words. This is the just man's silver, for the words of the Lord are pure words, silver tried by the fire, purged of earth, refined seven times. This he lends who receives the Law, who meditates upon the Law, who practices the Law; this Peter lent, this Paul lent, to whom it is bidden that they should go to the men of the nations—Peter, to Cornelius the centurion, to whom it is said: Arise and go doubting nothing, for I have sent them, and he arose and went. And below he has said: Are we able to forbid water, that these should not be baptized who have received the Holy Ghost? And he commanded them to be baptized; that is, thou shalt lend to the nations, that you may forgive their sins, remit their debts, but thou shalt not borrow; for the sinner borrows and will not pay for his sins, because he is a sinner. To Paul it is said: Thou shalt lend to the nations, who was sent to the nations. To John it is said: Thou shalt lend to the nations, to James it is said... to all of whom it is said: Go baptize the nations.

It is said to the people of our fathers: If you keep my commandments you will be blessed and you will lend to the nations the Word. Finally what follows shows it is not said of money: Thou shalt be the chief of many nations, for no one shall rule over thee: the Lord thy God shall set thee at the head and not at the tail, and thou shalt then be above and not beneath if thou wilt hear the voice of the Lord thy God. And there follows: But if thou wilt not hear it, cursed shalt thou be in the city and cursed in the field. And below: Cursed the fruit of thy womb. Certainly not money makes blessed, but the knowledge of God, the preaching of the Word, if we lend the grace of the Lord, if we confer upon the poor the words of the Lord, if we observe the heavenly commandments; and on the other hand, it does not make accursed, if money is lacking which may be lent; but if zeal is lacking, if observance of the heavenly ordinances is lacking, you will be accursed.

Finally the mystery of the Church is clearly expressed. For he said first to the follower of the Law: If thou wilt hear the Law and keep it, thou shalt lend to the nations, and this was done by our fathers. Moses lent to the nations, and he gained proselytes; Jesus Nave lent, Gideon lent, Samuel, David, Solomon, Elias, Eliseus lent; and if anyone wished to know the Word, he went to them: The queen of the south came to hear the wisdom of Solomon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapters 18-19"
