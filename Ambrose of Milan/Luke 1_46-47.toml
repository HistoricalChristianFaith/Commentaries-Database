[[commentary]]
quote='''
Whatever soul, then, has been able to be such magnifies the Lord, as the soul of Mary magnified the Lord and her spirit exulted in God the Savior. For the Lord is magnified, as you have read elsewhere too: Magnify the Lord with me, not that anything can be added to the Lord by a human voice, but because he is magnified in us: for Christ is the image of God, and so, if the soul does anything just and devout, it magnifies that image of God to whose likeness it was created; and therefore, while it magnifies it, it becomes more exalted by a certain participation in its greatness, so that it seems to express that image in itself by the splendid color of good deeds and by a certain emulation of virtue. And the soul of Mary magnifies the Lord, and her spirit exults in God, because, devoted in soul and spirit to the Father and the Son, she venerates with devout affection one God, from whom are all things, and one Lord, through whom are all things.

Mary's follows: the better the person, the fuller the prophecy. Nor does it seem idle that Elizabeth prophesies before John's birth and Mary before the Lord's birth; for already the first attempts at human salvation are creeping forward. For as sin began from women, so too good things are begun from women, so that women too, laying aside womanish works, may renounce weakness, and the soul, which has no sex, may, like Mary, who knows no error, imitate chastity with devout zeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
