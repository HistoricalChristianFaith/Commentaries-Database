[[commentary]]
quote='''
You have this in Solomon, for his Proverbs are moral, Ecclesiastes is natural, in which he as it were despises the vanities of this world, and his Song of Songs is mystical. You have it also in the prophet: sow for yourselves unto justice, gather the vintage unto the fruit of life, light for yourselves the light of knowledge. To have the light of knowledge is to have the perfection of love. And therefore it was said: do not fear; for love casts fear out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Yet you reserve for yourself alone what He has wished to be grown through you for many; nay, you even deprive yourself of it, for rather would you be laying up for yourself, if you were distributing to others. For the fruits of good gifts return to the ones who bestow them, and favor for generosity returns to the author. Therefore it is written: Sow for yourselves in justice. Be a spiritual farmer, sow what will be profitable to you. Good is the sowing in the hearts of widows. If the earth returns to you more abundant fruits than it has received, how much more will the remuneration for mercy return to you many times what you have given!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 7"
