[[commentary]]
quote='''
You have this in Solomon, for his Proverbs are moral, Ecclesiastes is natural, in which he as it were despises the vanities of this world, and his Song of Songs is mystical. You have it also in the prophet: sow for yourselves unto justice, gather the vintage unto the fruit of life, light for yourselves the light of knowledge. To have the light of knowledge is to have the perfection of love. And therefore it was said: do not fear; for love casts fear out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
