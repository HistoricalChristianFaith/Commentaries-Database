[[commentary]]
quote='''
However, in agreement with the saints and the faithful we consider this to be the Holy Spirit, so that the operation of the Holy Trinity clearly shines forth in the constitution of the world. Preceded by the statement that ‘In the beginning God created heaven and earth,’ that is, God created it in Christ or the Son of God had, as God, created it or God created it through the Son, since ‘all things were made through him and without him was made nothing that was made.’ There was still to come the plenitude of the operation in the Spirit, as it is written: ‘By the word of the Lord the heavens were established and all the power of them by the spirit of his mouth.’ As we are instructed in the psalm concerning the work of the Word, which is the work of God, and on the power which the Holy Spirit bestowed, so is echoed here the prophetic oracle, namely, that ‘God spoke’ and ‘God created’ and ‘the Spirit of God moved over the waters.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
