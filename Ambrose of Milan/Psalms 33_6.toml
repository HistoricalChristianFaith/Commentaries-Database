[[commentary]]
quote='''
However, in agreement with the saints and the faithful we consider this to be the Holy Spirit, so that the operation of the Holy Trinity clearly shines forth in the constitution of the world. Preceded by the statement that ‘In the beginning God created heaven and earth,’ that is, God created it in Christ or the Son of God had, as God, created it or God created it through the Son, since ‘all things were made through him and without him was made nothing that was made.’ There was still to come the plenitude of the operation in the Spirit, as it is written: ‘By the word of the Lord the heavens were established and all the power of them by the spirit of his mouth.’ As we are instructed in the psalm concerning the work of the Word, which is the work of God, and on the power which the Holy Spirit bestowed, so is echoed here the prophetic oracle, namely, that ‘God spoke’ and ‘God created’ and ‘the Spirit of God moved over the waters.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
For we read that the power of the Father is great, in that he made heaven, and that the Son too is great power, since he made heaven, and not only made it but also made it firm; by the word indeed of the Lord the heavens were made firm. Therefore, if both to have made and to have made firm the heaven belongs to great power, neither can we separate the Holy Spirit from the majesty of great power, because it is written: and by the spirit of his mouth all their power. For when heaven and earth were being made, the Spirit was borne above, of whom he says elsewhere through the prophet David: Send forth your spirit, and they shall be created. Of whom he also said elsewhere: For I shall see the heavens, the works of your fingers. For God did not make heaven and earth with bodily fingers, but by the sevenfold grace of the Spirit, namely by that finger of which you have it in the Gospel: But if I cast out demons by the finger of God. For this finger he elsewhere called the Spirit, as you have it: But if I cast out demons by the Spirit of God. If, then, the Spirit is the finger of God, since the Son is the arm of God, surely the Spirit, working together with the Father and the Son through the unity of operation, made heaven and earth. For the Son called him the finger for this reason, that he might express the unity of the divinity as of one body. And so, if great power founded heaven, surely great wisdom founded heaven, because it is written: In wisdom you have made all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
