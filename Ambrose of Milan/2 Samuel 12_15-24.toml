[[commentary]]
quote='''
We have one mystery. Receive another as well, yet in such a way that you remember that from Bathsheba's first conception a little child was born, who died, and that afterwards Solomon was born: that little child from a stolen conception, but this Solomon from an avowed marriage. It is clear, then, that by David the prophet is understood, and by the prophet the prophetic people; and he who was born first from that people and from the synagogue, the people of the Jews, since he degenerated from his forebears, formed through shameful deeds and conceived through vices, could not attain to the age of resurrection nor grow up into a perfect man, but failed in a meagre smallness of understanding and in a kind of infancy of virtue. But he who was conceived afterwards from a lawful union, the Christian people, he, wise and peaceable — for these things are disclosed by the interpretation of the name Solomon —, attained to the hoary age of a long-lived resurrection and to that heavenly kingdom. Through that people the Law was dissolved; through this one grace was restored.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 7"

[[commentary]]
quote='''
And yet those who broke the Law in the flesh of Christ and thought that it was to be violated were all slain by the fighters at David's order. By this sign is shown what they have taught to be marked out for later times: that of those who killed Christ none escaped; and this is most evidently revealed, that those whom Christ had assumed before his death, as being Jews, perished as little ones and unformed, but those whom he enrolled after his death into the number of sons were preserved for the kingdom. Hence, in keeping with this mystery, it is fitting that the first offspring among the Jews was weak, so that afterwards among the Christians there might come an eternal fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 10"
