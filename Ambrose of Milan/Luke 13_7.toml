[[commentary]]
quote='''
Then from what follows he teaches that he did not come before the time, he who came for three years; for so you have: behold, it is three years since I came seeking fruit on this fig tree and I do not find it. Cut it down therefore; why does it even occupy the ground?

He came to Abraham, he came to Moses, he came to Mary, that is, he came in the seal, he came in the Law, he came in the body. We recognize his coming from his benefits: in one place there is purification, in another sanctification, in another justification. Circumcision purified, the Law sanctified, grace justified: one in all, and all one. For no one can be cleansed except one who fears the Lord. No one deserves to receive the Law unless purified from guilt; no one approaches grace unless he has known the Law. So the people of the Jews could neither be purified, because it had a circumcision not of the mind but of the body, nor be sanctified, because it did not know the power of the Law, following carnal things rather than spiritual — the Law, however, is spiritual — nor be justified, because it did not repent of its sins and therefore did not know grace.

Rightly therefore no fruit was found in the synagogue, and so it is ordered to be cut down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
