[[commentary]]
quote='''
Title: Unto the end, for Jeduthun; a psalm to David himself.

It is the undoubted habit of all of us to hasten to the end, and to wish to know the sum of the things we have read or seen and heard. Hence the title itself does not allow us to be idle, nor to pass over with ears on holiday this sign of a common desire. For above the others (though it shines out in the others too), yet in a psalm of this kind the divine oracle gleams forth. Hence let us consider more carefully what the end is; for the end is called σκοπὸς, and the sum of the matter we wish to set forth. Christ is called the end, because he himself is the end of the law, as it is written: For Christ is the end of the law unto righteousness for everyone who believes. He is called the end also because he himself is the beginning and the end. Therefore the psalms which are entitled Unto the end are either about Christ or of Christ himself: about Christ, when he is announced; of Christ himself, when he announces himself and promises that he will come to the earth, and deigns to reveal to us the coming passion of his own body.

And so they are inscribed in the title to David himself, as though the ministry of the prophetic mouth were assigned to the true David, to the Lord himself, through whom the heavenly power sounded forth by the office of a human voice and the divine sentence rang out.

And rightly for Jeduthun, who was a prophet and used to sing psalms with his six sons, stands as a kind of preface, because leave to prophesy was given to those who, appointed in the ministry of singing psalms, spoke divine oracles with a human voice. And since the Passion of the Lord's body was to be undertaken to abolish the error of the whole world, he set forth, under the name, that is, of this man whose diligence was proven, an instruction of the people the more commended. So let us hear him speaking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Shall not my soul be subject to God? When our Lord Jesus was about to take up the flesh of man, so as to cleanse it himself in himself, what ought he to have abolished first, before all else, if not the contagion of the old sin? For since guilt had crept in through disobedience, when the divine commands were violated, he ought above all to restore obedience, so as to shut out the seedbed of error. For the root-fibre of sin had spread from there, and therefore, like a good physician, he ought first to cut away the roots of the ulcer, so that the lips of the wound might feel the healthful remedy of the medicines. For in vain will you have treated the scar if the contagion creeps on within; nay, the wound is made worse if it is closed outside while the poison seethes within. For what did it profit to have forgiven sin, if the affection for sinning remained? That was not to heal the scar but to close it. So he willed to cleanse the wound, so as to heal the affection, lest any lot of disobedience should remain. He himself took up obedience, so as to pour it over into us. For so it was fitting that, since through the disobedience of one man very many had been made sinners, through the obedience of one, in turn, many should be made righteous.

Hence the fact shows that those err greatly who say that the flesh of man was taken up by Christ but deny the affection, and that they go against the counsel of the Lord Jesus himself, they who take man away from man, since man cannot exist without the affection of man; for flesh without affection is free both of reward and of guilt. Therefore he ought to take up and heal that from which guilt had flowed, so as to close the origin of error and, as it were, the doors of the sin that was bursting forth. From what would I recognize the Lord Jesus as man today, whose flesh I do not see but whose affection I read of; from what, I say, would I recognize him as man, had he not hungered, had he not thirsted, had he not wept, had he not said: My soul is sorrowful even unto death? Then it is written: And he is a man, and who shall know him? But he is known as man through these things, he who through his divine works is reckoned above men. So he himself, though he was God, so far wished to be believed a man that he called himself a man, saying: Why do you seek to kill me, a man who has spoken the truth to you?, and called himself not only a man but also the Son of Man, as he says: Who do men say that I, the Son of Man, am? Hence he was declared to hold the sum of the faith who both recognized the Son of God and did not deny the man. He himself, then, is one and both, inseparable in number, and to be recognized by the distinction of his works, not by a difference of person. For it is not one from the Father and another from Mary; but he who was from the Father took flesh from the Virgin, assumed affection from his mother, so that he himself might take up our infirmities. Hence the prophet says: And he grieves for us. How did he grieve with my grief, if he did not bear my affection? A man, he says, under the stroke and knowing how to bear infirmity.

So as a man he was made weak, as a man he grieved, and we reckoned him to be as a man in sorrows; but as the victor over infirmities, not one conquered by infirmities, he grieved for us, not for himself, and was made weak not on account of his own sins but of ours, so as to heal us by his bruise. What indeed is a man under the stroke and knowing how to bear infirmity, if not that he felt compassion in the stroke? Or how did he know how to bear infirmity, if he had shut out the feeling of infirmity? For what we carry, we sustain as a burden. So he took up our sins in order to carry them; he took them up also in order to cleanse them. Then it is written: And he himself cleansed their sins. Therefore he himself shall possess many as an inheritance and shall divide the spoils of the strong. For there the triumph is greater where the inner mind is cleansed. What he carries, then, belongs to remission; what he cleanses, to correction. So he took up our compassion; he took up also subjection. For that he subjected all things to himself is his own; that he was subjected is ours. And therefore he says: Shall not my soul be subject to God? The soul, he says, is subject, not the divinity; the soul is subjected, not the power of God; for the power of God is subject not to a power but to unity, and enjoys partnership in its power. That is subjected which is very often changed by the frailty of the human condition, not that which cannot be changed. The soul suffers with the flesh, and the flesh with the soul, for they are joined to each other in a kind of common dwelling. That is subjected which is sorrowful, for it is written: My soul is sorrowful even unto death; that is subjected which was taken up, not born of God the Father. And yet this subjection itself is not in the guise of infirmity but in the working of power, rather the arbiter of a temporary dispensation than enslaved to a perpetual servitude. Hence he also says: Shall not my soul be subject to God?

Why did he say "shall be", if the subjection is everlasting? But because the Son of God who was speaking is eternal, while he took up the soul in time, he therefore speaks of the subjection of his soul as future. Through it, then, came obedience, through it humility; and yet these were taken up not to the weakening of his power but for the teaching of discipline. For the Lord Jesus himself, when he was in the form of God, did not think it robbery to be equal with God, but emptied himself, taking the form of a servant, made in the likeness of men; found in appearance as a man, he humbled himself, becoming obedient even unto death, as the Apostle says, wishing to declare a subjection not continual and perpetual but temporal, such as was taken up with the flesh and laid down with the servitude of that body. So too it is written to the Hebrews. For when he had set forth an example, saying: You are a priest for ever after the order of Melchizedek, the same Paul added: Who in the days of his flesh offered prayers and supplications, with a loud cry and tears, to him who was able to free him from death, and, being heard by him from his fear, although he was the Son, learned obedience from the things which he suffered, and being perfected became to those who obey him the cause of eternal salvation, called by God a priest after the order of Melchizedek. Did not the Apostle, then, cry out plainly, saying that that obedience and humility were not of the divinity but of the flesh? For what is learned is temporal. As a man, therefore, he learned obedience from the things which he suffered, so as to be perfected in the flesh and, through the succession of obedience poured over into us, to become the cause of eternal salvation for us, to whom formerly that first Adam, through the inheritance of disobedience, had become the cause of death.

Subjection, then, is the teaching of human virtue, not a lessening of divine power. For if they call the Son less than and unequal to the Father because he was subject to God the Father, is he then also less than his mother because he was subject to his mother? For it is read of Joseph and Mary: And he was subject to them. But dutiful love is not a loss to us all but a gain, the dutiful love through which the Lord Jesus poured faith and grace into us all, so as to make us subject to God the Father with a faithful spirit. And therefore by a new and deep counsel the Apostle says that he himself will be subject to the Father in us, when there is in all men the fullness of faith and a kind of unity of devotion. For now, as long as we disagree in our opinions, we in a manner lessen the kingdom of Christ, because not yet are all things subjected to him whose kingdom is unity; but when all things have been subjected to him, then he himself also shall be subject to him who subjected all things to himself, that God may be all in all, as it is written. For now he is above all by power, but there is need that he be in all by will; and he will so will when he knows that all things in us are full of him and empty of sins. Not yet, then, is he subject to the Father, because not yet is Christ all and in all; but when Christ is all and in all, God will be all and in all. Hence it is gathered that the kingdom of the Father and of the Son and also of the Holy Spirit is one, because he who has received the Son receives also the Father, receives also the Holy Spirit, because the power of the Trinity is one, its grace one, its working one.

And rightly the Lord added: for from him is my salvation, as if he said: "Do not be troubled because I said that my soul would be subject to God. The soul will be subject, which is your portion; but my salvation is from him, that is, because I am always from the Father and in the Father. For I came from the Father into this world, and if you see a man, believe the Son of God; but when the Paraclete comes, whom I shall send you from my Father, the Spirit of truth who proceeds from my Father, he will bear witness of me". Both the Son proceeds from the Father and the Spirit proceeds from him; so concerning the unity of the divinity there is nothing doubtful. And therefore David longed for this salvation of God to be given to us, because it is itself eternal life, if we know both the Father as true God and the Son, who it is certain came for our salvation, but did not think it robbery to be equal with God. He sets aside the assertion of his divinity and displays the office of the human dispensation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
But these are mystical things; let us come to moral ones. For since Christ is attacked not once — he was attacked once in his own body which he took up from the Virgin; he is attacked often in that body which is the Church, for we are the body and members of Christ; he is attacked also in each of his saints and in the innocent who have dedicated themselves to the Lord —

let us remember someone lately attacked by all, abandoned and betrayed by his own; who, lately set on the dais of empire, suddenly destitute of everything, began to be pressed by those very men whose allegiance he had received by inheritance, as they rushed upon him to his ruin, as they brought death upon him, with no helper, with no longer any ally of his own, with no companion. What better could he have said than what he had received from him to whom he had devoted himself: Shall not my soul be subject to God? That is: why do you persecute, why do you rage, why do you insult? You can kill the flesh; the soul you cannot. You can snatch away this life of the body; its merit you cannot extinguish; for it is written: Do not fear those who can kill the flesh but cannot kill the soul; but rather fear him who can destroy both soul and body in Gehenna. Therefore the soul that is subject to God is not subject to human power; for from him it hopes for the fruit of eternal life and the help of perpetual salvation. He, then, to whom I have given myself up will both protect me when slain and raise me up when dead and avenge me when killed. The righteous man was snatched away lest wickedness should change his heart. This death, then, is rather a flight from sin than a loss to the one who dies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Let this world, then, die to us; let the wisdom of this flesh, which is hostile to God, die to us. Let us subject our soul to Christ alone, so that each one may say: Is not my soul subject to God? Not subject to the world, not subject, he says, to the world. The moneyed man cannot say this, the greedy man cannot say it; but the just and self-controlled man says it. The greedy man, however, says: Soul, you have many good things laid up for many years; rest, eat, drink and feast, because the soul of the greedy man is subject to bodily luxury, whereas the soul of the just man uses the body as an instrument or organ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"
