[[commentary]]
quote='''
Hence he also added: Remove my strokes from me. How does this agree with itself? In the preceding psalm he offered himself to the scourges; here he asks that the scourges be removed from him — unless it is because he has already paid off his sins double from the hand of the Lord, by blushing, by bearing reproaches. The compunctions of his heart and of his thoughts are scourges, and so are those of rebukes. Let us see, however, whether he did not say that the substance of his soul is before God for this reason: because the adversary would not attack it unless he had received power from the Lord; for what the Lord has made he also protects. Indeed an angel is round about man, to shield him, lest anyone harm him. The angel does not depart unless ordered by the Lord, so that his athlete may contend. Therefore, as the Lord's substance, he presumes that pardon of his iniquities can be granted him by his creator, and therefore he asks, because he knows his author to be merciful. Next, because he has been given as a reproach, he does not resist, but allows the sinner to stand against him, and he is silent in the consciousness of his substance, which is good and can rein in the ferocity of the body, so that virtue may succeed and guilt be laid aside. Lastly, because he was made by the Lord, he confidently reckons that sin can be forgiven him the more quickly, since he was able to bear the strength of the Lord's hand.

And this, surely, belongs to a good substance, even though he says that he has fainted at the strength of the Lord's hand. A strong hand, just as it strikes hard, so heals quickly; what is strong for the wound is strong also for the remedy. Hence he himself says: I will strike and I will heal, so that he who has escaped healed does not remember the wound. Indeed this hand of the Lord took away everything from holy Job and restored everything, nay, increased everything in heaps, so as to double what had been lost. Nor let it move you that he said he had fainted. There is one who faints and rises stronger; for he upholds, the Lord, all who fall and sets upright all who are dashed down; for whoever is set upright rises with strength. Paul fainted at the strength of this hand; the persecutor fell and the preacher of the Gospel rose up. This is what he says: I have fainted at the strength of your hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
