[[commentary]]
quote='''
God has set before us, as the highest incentive to virtue, the delight of future blessedness; the devil, for his part, devised delight as a vehement spur to error. Adam, the first of the human race, gives proof of both designs. He was placed by the Lord God in the paradise of pleasure, to enjoy everlasting delight, so that his future offspring might be stirred to virtue — for it was not unknown to God that he would give place to error, and that a hope of salvation ought to be set before the rest, by which they might strive to be restored to the seat snatched away from the human race —; and the same Adam was deceived, through the form of the serpent, which prefigured the enticements of delight, by the persuasion of his wife. Having seized the occasion, then, the adversary wrought death for me through delight. And so what had been bestowed by divine grace for life became death for me, and the enemy won man's assent to the fall all the more easily in that he held out a semblance of nature. For his works delighted the Lord, the first beginnings of nature delighted him, and seeing them the Lord said: very good.

The angels praise the Lord, the powers of the heavens sing psalms to him, and before the very beginning of the world the Cherubim and Seraphim, with the sweetness of their melodious voice, say: holy, holy, holy. Countless thousands of angels stand by, and the elders and a great multitude, like the voice of many waters, sing together: alleluia. A more explicit account holds that the very axis of heaven turns with a certain sweetness of perpetual harmony, so that its sound is heard in the farthest parts of the earth, where certain secrets of nature lie. Nor does this seem foreign to the ways of nature, since a voice sent out rebounds from woods or mountains with more pleasing applause, and they give back with sweeter sound what they have received. In the very crags and stones, too, nature has found something to delight: in some the outlook delights, in others their use or their beauty. The very wild beasts and birds are soothed by the delight of a pleasanter place or of a more melodious voice; and to infants at the breast, too, severity is a terror and caresses a pleasure. Delight, therefore, is natural.

Hence also holy David, who perceived from where man had been cast down and by what fraud — for had he kept the grace of that eternal and heavenly delight infused into him by the Lord, and not lost it, captured by worldly enticements, he would never have undergone the injuries of so miserable a hardship —, and so, striving to repair and restore that delight, he established for us, through the office of singing psalms, a likeness of the heavenly way of life.

For although all divine Scripture breathes the grace of God, yet the book of Psalms is especially sweet, since Moses himself, who described the deeds of the ancestors in plain speech, yet when he had led the people of the fathers through the Red Sea amid memorable wonder, seeing King Pharaoh sunk with his forces, raised his genius to greater things, because he had achieved things greater than his own strength, and sang to the Lord a song of triumph. Miriam too, taking up a timbrel, exhorted the other women, saying: let us sing to the Lord, for he has been gloriously honoured; horse and rider he has cast into the sea. Moses himself also, when he had read the Law of the Lord, in order to fix its memory in the hearts of his hearers, spoke through a song, saying: hear, O heaven, and I will speak; let my speech be awaited like the rain, and let my words come down like the dew, like a shower upon the grass and like snow upon the hay.

God, then, delights to be not only praised by a song but also reconciled by it. Hence Moses too made use of a song above all at the time when he was calling heaven and earth to witness, so that the world might listen more eagerly to its salvation sounding in harmony with the strain of heavenly grace, and that, by the sweetness of a sacred delightfulness, the observance of the Law might grow forever into human minds. In fact, before the tables of the Law were confirmed by a song, they were broken and shattered through the indignation of Moses; but once they had been consecrated with such a seal, human anger had no place, because the sanctification of sacred sweetness shut it out. And so the song of the Lord came down from heaven like a softer dew, and watered the faith of men, as the grass is watered, with a kind of shower of spiritual grace. These two songs, therefore, in the books of Moses, like two eyes of the world and two lights of heaven, illuminate the whole body of his work.

But David was chosen by the Lord principally for this office, that what in others seems rare and stands out above the rest of the work should shine in him constant and continuous. We read one song in the book of Judges; the rest is run through in the manner of history, in which the deeds of the ancestors are set out. Isaiah wrote one song, by which to soothe the hearts of his readers; in the rest he thundered with the terrible trumpet of reproof. Not even his enemies, who persecuted him to death on account of his other sayings, could reproach him with the song. Daniel one, Habakkuk one; Solomon himself, the son of David, although he is said to have sung countless songs, yet left only one that the Church has received, the Song of Songs; he also wrote Proverbs. In the others, then, one may notice single songs.

History instructs, the Law teaches, prophecy announces, reproof chastises, moral teaching persuades; in the book of Psalms there is the profit of them all, and a kind of medicine for human salvation. Whoever reads it has the means to cure the wounds of his own passion with a special remedy. Whoever wishes to look into it finds, as in a common gymnasium of souls and a kind of stadium of virtues, different kinds of contests prepared, and may choose for himself the one for which he understands himself best fitted, so as to reach the crown more easily. If anyone is eager to review the deeds of the ancestors and wishes to imitate them, he receives the whole sequence of the fathers' history gathered within a single psalm, so as to acquire a treasury of memory in a compendium of reading. Things that are set out more briefly also seem easier. Of what depth is this too, that within a short space it has marked out the adversities that came from the offences and has added beneath them the prosperity of reconciliation, so that you might learn at once what harm the offence of unbelief did, what a ready faith conferred! If anyone searches out the force of the Law, which lies wholly in the bond of charity — for he who loves his neighbour has fulfilled the Law —, let him read in the psalms with what affection of love he alone exposed himself to grave dangers to drive away the reproach from the whole people; and in this he will recognize a glory of charity not unequal to the triumph of virtue. If anyone dreads the harshness of reproofs, let him hear one saying: O Lord, rebuke me not in your anger, nor reprove me in your fury, and let him learn how he ought to temper the censure of an angry judge. If anyone longs to know an example of patience, let him read in the psalms: if I have repaid those who rendered evils to me, and let him notice that he foresaw the precept of the Gospel by the Spirit and anticipated it by virtue. And so you have that proverbial saying, that a gentle man is the physician of the heart. If anyone, moreover, wishes to be fortified against the assaults of spiritual wickedness, what should he know he must do more than sing psalms? David, while still a youth, used to sing psalms and put to flight the evil spirit of Saul, which had been gripping him before.

But what shall I say of the power of prophecy? What others announced through riddles seems to have been promised to him alone, plainly and openly: that the Lord Jesus would be born of his seed, as the Lord said to him: of the fruit of your womb I will set upon your throne. In the psalms, then, Jesus is not only born for us, but also takes upon himself that saving Passion of the body, rests, rises again, ascends to heaven, sits at the right hand of the Father. What no man would have presumed to say, this prophet alone announced, and afterwards the Lord himself proclaimed in the Gospel.

Moreover, all writers have set in their writings examples of psalms or some sayings of those before them; the psalms have nothing but what is their own. What, then, is more pleasing than a psalm? Hence David himself says beautifully: praise, he says, the Lord, for a psalm is good; to our God let there be pleasant and seemly praise. And truly; for a psalm is the blessing of the people, the praise of God, the commendation of the congregation, the applause of all, the speech of everyone, the voice of the Church, the melodious confession of faith, a devotion full of authority, the gladness of liberty, the cry of joyfulness, the echo of gladness. It softens from anger, it releases from anxiety, it lifts up from grief; it is armour by night, instruction by day, a shield in fear, a feast in holiness, an image of tranquillity, a pledge of peace and concord, bringing forth, after the manner of a lyre, one song out of diverse and unequal voices. The rising of the day re-echoes a psalm, its setting resounds with a psalm.

The Apostle orders women to keep silence in the church; yet a psalm they do well to cry out. It is sweet to every age, it is fitting for either sex. Old men sing it, laying aside the stiffness of old age; sad veterans answer it in the joyfulness of their heart; young men sing it without reproach of wantonness; youths sing it together without the danger of a slippery age and the temptation of pleasure; young women themselves sing psalms without loss of matronly modesty, and little girls, without any lapse of bashfulness, with sober gravity, make a hymn to God in the sweetness of a modulated voice. Childhood longs to hold it fast, infancy rejoices to practise it, though it shrinks from learning other things; it is a kind of play of learning, of greater profit than when discipline is handed on in earnest. What labour there is in the church to obtain silence when the lessons are read! If one person talks, all make a din; when a psalm is read, it is itself the maker of its own silence: all speak and no one makes a din. Kings re-echo a psalm without the haughtiness of power; David rejoiced to be seen in this ministry; a psalm is sung by emperors, shouted with jubilation by the peoples. Each one vies to cry out what profits all. A psalm is sung at home, rehearsed abroad; it is taken in without toil, kept with pleasure. A psalm joins those at variance, unites the discordant, reconciles the offended; for who would not forgive one with whom he has sent up a single voice to God? It is plainly a great bond of unity for the whole number of the people to come together into one choir. The strings of the lyre are unequal, but the symphony is one. On very few strings the fingers of the artist often go astray, but in the people the Spirit, the artist, does not know how to go astray. A psalm is the commerce of nightly work, the wage of daily rest, the instruction of beginners, the strengthening of the perfect, the ministry of angels, the heavenly warfare, the spiritual sacrifice. Even rocks answer a psalm; a psalm is sung, and even stony hearts are softened; we see the very hard weep, the merciless bend.

In a psalm teaching vies with grace; it is sung at once for delight and learned for instruction. For more violent precepts do not last; but what you have taken in with sweetness, once it has been poured into the heart, is not wont to slip away. What is there that does not meet you as you read the psalms? In them I read a song for the beloved and am inflamed with the desire of holy charity; in them I recognize the winepresses of the divine mystery, in them the grace of revelations; I review the testimonies of the resurrection, the gifts of the promise; in them I learn to avoid sin, I unlearn blushing at penitence for my offences. So great a king, so great a prophet has challenged me by his example, that I should strive either to lessen a sin committed or to beware of one not committed.

What, then, is a psalm but the instrument of the virtues, which the venerable prophet, striking it with the plectrum of the Holy Spirit, made to resound on earth with the sweetness of heavenly sound? At the same time, when on strings and chords, that is, on dead remains, modulating the distinctions of diverse sounds, he directed the song of divine praise towards heavenly things, he certainly taught us that first we must die to sin, and only then, in this body, are the diverse works of the virtues to be distinguished, by which the grace of our devotion may reach the Lord, so that no lust of earthly vices might creep in upon those occupied with attention to heavenly things, and at the same time the mind might shine with the sweetness of heavenly grace. Rightly, then, the Lord, praising the minister of so great an office, says: I have found David according to my heart.

They say, too, that the more skilled among those who sing to the lyre sing inwardly, as the stories relate of Aspendius the lyre-player, and that the principles of the melodies and certain closures of the rhythms are in the upper part of the psaltery. David therefore taught us that we must sing inwardly, sing psalms inwardly, as Paul too sang, saying: I will pray with the spirit, I will pray also with the mind; I will sing psalms with the spirit, I will sing psalms also with the mind, and that we must shape our life and actions with our gaze on the things above, lest the delight of sweetness should arouse the passions of the body, by which our soul is not redeemed but weighed down, since the holy prophet has recorded that he sings psalms for the redemption of his soul, saying: I will sing psalms to you, O God, on the lyre, Holy One of Israel. My lips shall rejoice when I sing to you, and my soul, which you have redeemed. But now let us enter upon the beginning of this psalm which has been set before us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Blessed, he says, is the man who has not walked in the counsel of the ungodly. How apt, how timely a beginning! For just as those who have undertaken to put on some solemn contest are accustomed to set out a prize and to vaunt the nobility of the crown, so that those who are to compete may assemble with greater zeal and contend with more eager effort, so our Lord Jesus has set forth the glory of the heavenly kingdom, the grace of perpetual rest, the blessedness of eternal life, as incentives to human virtue. An emperor too, when he goes forth to war, promises the soldier a donative and promotions in rank in the military units, so that the hope of gain may steal away the toils and hide the fear of danger. Like the herald, then, of a great emperor, holy David exhorts the soldiers, calls the athletes, declares the prize, saying: blessed is the man who has not walked in the counsel of the ungodly. He began from the prize, to lighten the weight of the coming contest; he put the reward first, so that each one, leaping in his heart over the anxieties and toils of present things, might strive with eager haste to earn the blessedness of things to come. "Blessed", he says, "is the man". What more could be given to man than that beyond which nothing greater could be ascribed to God by apostolic authority? For blessed God has been called, and the only mighty one, and the King of kings, and the Lord of lords. He who alone is mighty, he the King of kings, he the Lord of lords, yet does not go beyond the power of blessedness; he has granted us a common share in that title which was deemed worthy of divine honour.

Let us consider now for what reason he said "blessed is the man" and not rather "blessed are men", since both sexes are called to grace. Did he exclude women from a share in blessedness because he named the man alone blessed? Far from it, since God did not exclude women from a share in creation either because he made the man first. For God said: let us make man according to our image and according to our likeness, and God made, he says, man; to the image of God he made him, male and female he made them. In the human being [homo] both are signified; in the man [uir] the sex is expressed. But just as both are included when one says human being, so when man is named, the woman too is understood whose husband [uir] he is. Indeed, she shall be called, he says, woman, because she was taken from her husband. There is this too: those whose nature is the same certainly cannot have separate works, and those whose work is equal certainly have an equal reward. In saying man, then, Scripture did not pass over the partner of the union, since in saying human being it did not keep silent about the partner in nature. And so, just as there we read that the human being was made, and yet, though the nature is one, we cannot deny that the principal sex was created first, so here too, when we read man, we recognize from the principal portion the sex as well that is its near equal. Equal, therefore, are the pursuits of virtue, because equal is the prerogative of creation. But why should you discuss sex, where what is demanded of you are contests not of the body but of the soul, which has no sex? Do not, then, distinguish the honour or divide the reward there, where sex is not distinguished. Yet it is not unwise if he is called first to the exercise who was later in the fall. She who began badly ought to follow, not to go before; or at least after the experience let her be more modest. Eve wrongly passed over the order of nature: she ought to have waited for the one who went before her. The serpent cunningly began from the later one; therefore the prophet turns back to the earlier, him, indeed, who would not have fallen had he not followed the later.

In fact, he called us back from the fall before he called us forth to the palm of victory. Blessed, he says, is the man who has not walked in the counsel of the ungodly. See where you are called blessed, O man: not in riches, not in powers and honours, not in nobility of birth or in comeliness and beauty, not in health of body, in which there is nothing good by nature; indeed, not only do they easily change into their opposites, but they even lend their service to fault for him who does not know how to use them. For who is righteous because of money, who humble in positions of power, who merciful because of nobility, who chaste because of comeliness? These things are more enticing to sin than fruitful for progress in virtue.

What, next, does it mean that he preferred to say has not walked and has not stood as of the past, when he could have said: "blessed is the man who does not walk in the counsel of the ungodly, and does not stand in the way of sinners, and does not sit in the chair of pestilence"? See the teaching: for he who is not ungodly or a sinner is not at once blessed, because of the uncertainty of the end. For it was not written idly: praise no one before death. So while anyone is in this life he cannot be praised with a definitive commendation, since he may still lie open to error; but he who has closed his life without offence is rightly reckoned under the name of blessed, as one who enjoys the company of the blessed.

But perhaps you may say: "For what reason, then, did he say elsewhere: blessed is he who understands concerning the needy and the poor? For he did not call blessed him who has understood, but him who understands." It is because those who do good find in the work itself also that by which they are approved, obtaining their reward in the very work, since a good deed is the fruit of a blessed conscience. But those who refrain from evil are not at once blessed if they have avoided fault once or twice, but only if they have been able to escape the contagion of fault through the whole time of their life.

Now this occurs to us: why he preferred to call blessed not the one who has performed some duty of devotion, but the one who has refrained from the counsel of the ungodly. For he who has fulfilled the office of virtue seems more worthy of praise than he who has escaped sin, since neither an ox nor a horse nor a stone is wont to be in sin or to sit in the chair of pestilence. But those things do not have the fruit of blessedness which do not have the sense of virtue; for how do they attain the reward of the Law which do not have the disposition to follow the Law? So I see that the sentence set before us concerns rational beings, that is, us. And for us the beginning of good things is abstinence from sins, since we read: turn aside from evil and do good. For this is the order of discipline, that you should strive from lower things to more perfect ones, lest you be terrified by the mass of greater things, you who ought to be drawn on by a beginning of lighter ones. For Scripture teaches us that the ascent of devotion is like a ladder, on which holy Jacob, a man of exercise, saw the angels of the Lord ascending and descending; he has been set before us so that through him we may learn that we must advance a step of virtue little by little, and that thus we can strive from the lowest things to the highest if we proceed by small advances towards the things that seem higher than human nature. Keep this ladder always set before you. Do not fear, O man, to climb these steps of discipline. The first step is near the earth, the next is like the first. So by equal steps one climbs to the summit. Do not disdain, O man, that first step as if it were the meanest. That first ascent separates you from the earth; you tread on air once you have lifted your foot from the ground. Placed in virtue, you have left the earth by rising; you leave the earth if you turn aside from fault. The beginning of progress towards virtue, then, is to abstain from sin.

And that we may know that this discipline belongs to teaching, hear the Law saying: you shall not commit adultery, you shall not commit murder; for these precepts seemed suited to the imperfect. In fact, the Lord Jesus himself, knowing that the man who asked him by what works he might attain eternal life was imperfect, answered him: you shall not commit adultery, you shall not commit murder, you shall not commit theft, and so on. Then, when he said that he had done all these things, he added the more perfect things, saying: sell all that you have and give to the poor, and you will have treasure in heaven, and he taught that there is so great a distance between turning aside from evils and imitating good things that the man who judged the former easy for himself refused the latter. But because he had not climbed even the former, he could not fit himself for the latter; for if he had loved his neighbour, he could have kept from refusing the poor the help of his patrimony. And therefore climb the first step of the Law, so that you may be able to reach the heavenly summit of the Gospel. Hence I think that the holy prophet, as one placed under the Law and following the manner of the Law in the first psalm, in his own person rather announces what is to be avoided than sets forth what is to be followed, whereas in Psalm 40 (41), which is spoken in the person of the Savior, there is rather an exhortation to virtue than a restraint of error; for it speaks of the Savior's Passion. And therefore the dispenser of the Gospel too, as we may judge when we have heard him say: blessed are the merciful, has crowned mercy both in the psalm of his own Passion and in the Gospel alike. But let us now set about the explanation of the psalm and look into its prophetic power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Blessed, he says, is the man who has not walked in the counsel of the ungodly, and has not stood in the way of sinners, and has not sat in the chair of pestilence. We can say that there are three kinds of sins, which we think are expressed here — of thought, of deed, of persistence — and that he is signified as blessed who has not even thought what is evil. For how can he be blessed who is to be convicted on the day of judgement by his own thoughts accusing him? Even if he has deceived man, fled from a witness, escaped an accuser, yet he will not be able to avoid himself as his own accuser, whom he ought most to fear, since he will have in him both the accuser and the guilty man confessing. Blessed, therefore, is he who has not thought what is evil, and has not committed sin — for sometimes we offend even without thought; for in much speaking we do not escape sin — and has not persisted in sin. Or thus: he who has not thought what belonged to error, or has not stood in that thought, or at least has not persisted in those thoughts which he perceived to be full of error. But whether these fit rightly, the reader will judge. For he who has once thought evil ought neither to stand in it nor to persist in it. But even if he did not persist, he could not be blessed, because he stood in what he wickedly thought; even if he did not stand, yet whether, by the very fact that he thought evil, he has the fruit of blessedness, he must look for some lenient interpreter. Further, since no one can say that he has a clean heart, let it be granted that a thought is pardonable: is the doing of sins pardonable too? Further, if standing is pardonable, is it also full of blessedness because it does not persist in the crime? Then, how could he who has not thought wicked things stand in sin or persist in it? Granting that he is blessed who has rightly kept these three, the order is surely different. For the first is that he should not persist in sin, the second that he should not have stood in it, the third that he should not have thought what belonged to error. For he who has not persisted could still have stood; he who has not stood could have thought; but he who has not even thought is truly blessed.

Hence I thought that another tradition too should not be passed over, by which we may maintain that the three steps are set in right order: that he who wishes to be blessed should not walk in the counsel of the ungodly, that is, should not walk in their thoughts; next, should not stand in the way of sinners; third, should not sit in the chair of pestilence. You, then, who have become a Christian for the Church, or you who are making your way to grace, abstain from the counsels of the ungodly, so that you may say: destroy not my soul with the ungodly, O God, nor my life with men of blood, and do not think the things that are ungodly. What are these but the things devised to the injury of God? For devotion is first towards God, second towards parents. And indeed the enemy often sows various things in our minds, and therefore the prophet cautiously judged that thoughts, rather than unforeseen suggestions, are to be held for a crime. You have abstained, then, from the counsels of the ungodly; rightly, yet you are not at once blessed. Beware also lest you have stood in the way of sinners.

With what careful weighing the words of divine Scripture are set down! For since we are all under sin, it does not demand of you what is beyond nature, that you should commit no sin — for not even an infant of one day is without sin — but that you should not remain in sin in a kind of long-standing station. Not all are ungodly: therefore you are called back from all the thoughts and conspiracies of the ungodly; but all are sinners: therefore you are admonished to cease sinning. If you have been liable to the lapses of a younger age, the advance of maturity ought to amend you. So do not walk into graver things, do not stand in lighter ones. You have this too, said by the Lord in Isaiah: go out from Babylon, fleeing from the Chaldeans, that is: even if you have entered into the confusion of vices, go out. You ought not to have entered; but you went in, the law of the flesh compelling you and taking you captive in the law of sin. Go out, depart even if late, strip yourself of a heavy servitude. You could not help entering into sin through frailty; it is granted to you to go out of sin through sobriety. Go out, then, from Babylon, fleeing from the Chaldeans. Babylon is confusion, which does not keep the order of the virtues; for it is with a mind confused by enticements that we offend. The Chaldeans are those who search out the courses of the stars with the zeal of a vain superstition and sow the errors of ungodly paganism. Flee from them, lest they capture you, lest they bind you in the heavy snare of captivity. Abraham was a Chaldean, but he fled from the Chaldeans, and that before the Law; you have been born already under the Law: flee from the ungodly. He spurned the inheritance of his fathers so as to possess that of faith; you, abandon the succession of the body, acquire the inheritance of devotion.

But if you have not stood in sin, not even so are you blessed: you still have something you ought to be without. Many are the enticements, many the turnings aside from virtue; grievous are the incitements of pleasures, grievous the tinder of avarice, the desire for power, the ambition for honour, which, as with a kind of poison, defile the minds of men and, with a kind of pestilent wasting of vices, their souls. This is the chair of pestilence, on which the scribes and Pharisees sat, who lay heavy burdens on men, but themselves will not move them with a finger. These chairs the Savior cast out of the temple: the chairs of those who boasted of their honour and sought the first places among dignities, of those who used the priesthood or the primacy of honour for gain, of those who, indulging the gullet, by no means kept the guard owed to continence. This is true pestilence; in fact, the sons of Eli were sons of pestilence. In this seat, as it were, of vices Scripture forbids us to bend back our neck and to recline the strength of our whole body. Mark, then, the proper meanings.

Blessed is he who has not stood in the way of sinners and has not sat in the chair of pestilence either. That the course of this life is called a way is not in doubt, since Scripture itself says: in this way in which I was walking they hid a snare for me, and: agree with your adversary quickly, while you are with him on the way. For as long as we run the course of this life, we have a path along which we walk daily until we reach the end; even if we do not seem to go bodily, we advance. For just as those sleeping on ships are driven by the winds into port, and, though at rest they have no sense of sailing, yet the course urges them to the end and drives them on unawares, so, as the span of our life flows away, each one is led to his own end by a hidden course. Hence it is said: rise, you who sleep — for you sleep and your time walks on — and see that, while you sleep long, time does not pass by. Therefore, even if you sleep, let your heart keep watch, let your heart take no holiday; if your heart is not idle, your times are not idle. You are on the way, O man: walk, that you may arrive, lest night overtake you on the way, lest the day of life be spent before you hasten the progress of virtue. You are a wayfarer of this life: all things pass, all things fall behind you, all things you see on this way and pass by. You saw the loveliness of the trees, the greenness of the grass, the clearness of the springs and whatever of this kind delights the eyes; it pleased you to look on: it delighted you to attend a little; while you attend, you have passed by. Again, while you walk, you have come upon a rocky and broken road, the hollows of cliffs, the steeps of mountains, the thickets of woods: you were wearied a little; again you passed by. Such is this life, whose prosperities do not last and whose adversities are not long. So, since you are placed as it were on a way, let neither favourable things lift you up nor adverse things break you, nor pleasing things delay you nor sad things detain you. Hasten always to the end, hasten that you may arrive; but choose your way before you run.

There are two ways, one of the righteous, the other of sinners, one of equity, the other of iniquity, of which the prophet said: and see if there is a way of iniquity in me. Not only is our life a way, but our very life is a way either of virtue or of iniquity. Beware, then, lest avarice set its footsteps in you and you become a way of crime; lest wickedness, lest lust do so and you become a way of iniquity, worn down by shameful deeds journeying along it. You may choose whom to follow, either the righteous or the unrighteous. The way of the righteous is narrower, that of the unrighteous broader; the one, of sobriety, narrower, the other, of drunkenness, broader, so that it can hold those who reel; this one has the enticements of this world, that one has the rewards of things to come. In the one the fruit is more at hand, in the other the hope is slower; for things that are sweet do not put off into a long expectation, but offer a present enjoyment, whereas what is serious is sought with toil, what is scarcely grasped by blessed thought, what eye has not seen nor ear heard, which God has prepared for those who love him. We find it hard to believe what we do not see, and therefore the soul is in turmoil and carries its thoughts this way and that like a kind of eyes. Then various appearances of things meet it and pour themselves over it; if it attends to eternal things, it chooses virtue; if to present things, it prefers pleasure. Grievous and unequal is the contest against the delights of present things. Here there is liberty for the desires; there the injury of servitude, to do what you do not wish and to abstain from what you have desired; here a banquet, there a fast; here intemperance of joys, there perseverance of tears; here dancing, there prayer; here sweet songs, there grievous groans. It is indeed written: the heart of the wise is in the house of mourning, and the heart of fools in the house of feasting. It is better to hear the rebuke of a wise man than a man hearing the song of fools; but few hear these things, fewer follow them. The sweetness of sin, which flows in at the present moment and fattens the disposition of the hearer, attracts men more than the sadness of virtue, which wraps the hope of faith in a kind of bark of bitter toil. Blessed, therefore, and admirable is he who, placed in the choice of such ways, has not been bent by the enticements of pleasure so as to set his step upon shoals and crooked places; to him it is not said: you who have forsaken the straight paths by walking into ways of darkness.

We have learned, then, what the way of sinners is, in which the prophet warns us that we must not stand; and Ecclesiastes too teaches this, who says: do not stand in an evil word, that is: do not persist in evil words, and likewise in deeds that deserve condemnation. How one must stand in good things the same holy prophet enjoins, saying: our feet were standing in your courts, O Jerusalem. In Jerusalem we must stand, from Babylon we must flee. And to Moses it is said: but you, stand with me, to him who fled from Egypt and, standing with the Lord, persevered. And in the Gospel those who stood until the eleventh hour received a reward equal to those who worked, and the virgins who had stood until the coming of the bridegroom were found worthy to go in together to the wedding, while those who went away and came back afterwards are shut out by the authority of the Lord's sentence. We have learned, then, not to stand in the way of sinners, but to stand in the office of virtue, because it is written: but you stand by faith.

Now let us consider what this means: and has not sat in the chair of pestilence. And indeed we state first that it is not simple sitting on a seat of this kind, such as is in common use, that is blamed — for what reproach could it carry to make it a fault? — but since the eyes of the Lord are always upon the faithful of the earth, we ought to stand as though placed in the sight of the emperor and set in some ministry. A soldier on campaign stands, he does not sit; a soldier in arms does not lean back, but rouses and raises himself. And therefore it is said to the soldiers of Christ: behold now, bless the Lord, all you servants of the Lord, who stand in the house of the Lord. But iniquity, on the contrary, sits on a talent of lead, because, fixed in sin, it cannot separate itself from it. For those grown old in error and zealously clinging to shameful deeds are said to sit, who will not rise up nor listen to him who says: rise, after you have sat. In fact, this same prophet says elsewhere: princes sat and spoke against me. Or are we ignorant that the inveterate habit of sinning has such force that it shuts out nature, which, though it can be healed to health, yet, once the passions have been strengthened by time, is found incurable? Let us not, then, remain in vices, but let each one, even if he has been in them, leap away from fault, as it is written of the harlot: do not fix your eye on her, but leap away, do not linger; leap away before the years of youth find you. But, what is graver, very many have not blushed at the luxury of the body even with whitening grey hair, and have prolonged a stained life to the time of old age; for the plague of fault, conceived in the inmost bowels, is embittered as time goes on. Beware, then, of the counsels of the ungodly; let counsels of this kind not penetrate your mind, lest it be said of you: will anyone bind fire in his bosom, and not burn his garments? For he who has once kindled in the bosom of his mind the flame of a burning shameful deed will quickly burn the garments of his body. And as fire leaping onto stubble clings and remains until it consumes all it has seized, so even a tiny spark of sin, if it has been roused by some tinder of vices, rouses a great fire. Do not, then, stand in sin. Lastly, you have set your footstep over the abyss of fault: quickly take your foot away, lest the pollution rise above your sole and, deceived by an easier slip, you settle down upon the mud.

The first vices, then, must be guarded against, lest they creep on afterwards into many graver ones. For just as those who roll about in mud are the more befouled the more they wallow, so he who has once spattered himself with the mud of wickedness, unless he quickly leaps out of it, draws over himself ever more heavily, day by day of a muddy way of life, the filth of his disgrace. And so, from the heavy stench of that foul and shameful abyss a kind of pestilence of souls is contracted, and, the breath of wholesome thoughts being corrupted, the pitiable plague of seething passions rages. Hence a deadly poison pours itself into minds, hence illness creeps upon bodies, sicknesses upon souls. For an evil sickness is the sickness of error, the sickness of avarice, the sickness of insatiable desire. These are riches, as Ecclesiastes says: there is an evil sickness which I have seen under the sun: riches kept to the harm of him who possesses them. Tell me, O Ecclesiastes, for what cause this sickness is evil. He will answer: because greedy hope devours many. The voracity of desire is insatiable; he who covets silver does not know how to be sated with silver. Riches distend, they do not fill. Even if one has been sated with riches, there is no one, he says, who lets him sleep. And indeed all his days are in darkness and mourning and much wrath and sickness and anger. For how can he sleep who keeps anxious guard over gold, who dreads losses, who ponders gains, who reckons interest, who counts his storehouses? Evil, then, is the sickness that takes away the good rest of the mind. An evil sickness is luxury, lust, concupiscence, worldly delight, ambition, which quickly corrupts the health of sobriety. Lastly, all the corruption of this world is pestilence. Do not, then, touch it, do not defile yourselves with it: it is a plague, it contaminates; it is a disease, it pollutes. Do not taste the things which all tend to corruption by their very use, as the Apostle said, who also cries elsewhere: the root of all evils is avarice. It rouses diseases, it implants pains; in fact, those who have sought after it have entangled themselves in many pains. This is the pestilence which often makes men neither hot nor cold but, what is worse than both the hot and the cold, lukewarm, so that those whom he has rejected for their grievous sins are vomited out of the mouth of the Lord Jesus. This is what rouses the sicknesses not of a few but of all. Every head in pain, every heart in sadness. From the feet even to the head are the ulcers of sinners. Every head is in pain when those who are reckoned wise are tormented by the pain of avarice. For the sense of the wise man is in his head; and this can also be referred to those who hold the first place in the Church. Every heart is in sadness when we savour the things of the flesh and bury the keen sight of our heart in bodily pleasures. Hence the Lord says of such men that he has given them a heart of flesh.

From the feet to the head the dread plague of diseases creeps, when they suffer from contagion, when they suffer along with others, if anyone is cheated of the fulfilment of his lust, has not been able to storm a widow's chastity or to seize a field, and the sick all pass their sicknesses on to one another. How often old men groan that they cannot drink for long! How often they grieve that they have ceased to go whoring, though they still have the will to whore! How often, amid the tales of drunkards, virtues are a reproach, sins a praise, uprightness a mockery, continence a laughing-stock, mercy a folly! These are the diseases that pass their evils on to many; corruption spreads from a few to all. They sit in assemblies disparaging the sober, belching their surfeit; they sit in taverns vying in drunkenness, and among them a harlot full of wine, smiling on this one, scorching that one, and inflaming all with the heat of lust. If a modest man passes by, he blushes and is picked at by each of them; if a shameless one, he is praised by the mouth of all, and like a disease he passes into the souls of each; for he who is celebrated for shameful deeds draws very many to the imitation of error. And so, while they imitate another's sin, they make the evil their own. Do not sit among those whom the holy prophet fled; imitate him, fleeing indeed, not sitting, who says: I have not sat in the council of evildoers, and with those who do iniquitous things I will not enter. For what reason you fled them, David, explain to us; point out these parties, so that we too may be able to flee them, lest we be infected with their contagion. They have been corrupted, he says, and have become abominable; there is none who does goodness, there is not even one. Generally, then, this can be referred to all the shameful, and then specially to the mockers of the good, whom Aquila called χλευαστὰς, because these are truly diseases, who by mocking the good work very much error in souls and corrupt minds. How many things he has named from which the blessed man ought to abstain! And he adds still others.
