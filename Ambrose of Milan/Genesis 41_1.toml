[[commentary]]
quote='''
And it came to pass, he says, after two years. Call me a liar about this time of our own eunuch, unless even the day agrees, for after two years he recovered his office and did not remember, but was reminded. For he who did not believe his own dream learned that even kingship itself in this world is a dream. He learned too that the . . . . of kings are dreams, and that their powers are not perpetual. But let grief pass quickly over this passage, lest it grow raw again by the very recollection; it gives me no pleasure even to remember my own words, which at that time either grief poured out or the insult to the Church wrung from me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 6"
