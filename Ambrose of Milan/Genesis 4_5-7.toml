[[commentary]]
quote='''
Now let us reflect on the meaning of the Lord's words, If you offer rightly and you do not divide rightly, thou hast sinned. Hold thy peace. This signifies that God is not appeased by the gifts that are offered, but by the disposition of the giver. Hence Cain, who offered a gift which was denounced, was conscious of the fact that his offering was fraudulent, that his sacrifice was not acceptable to God, and he was downcast. When "the mind is conscious of right," then there is occasion for veritable joy—a joy of the spirit—when one's purpose and deeds are commendable to God. Cain's sadness, therefore, bears testimony to his consciousness of right and is an indication of his failure. Again, because he offered a gift and did not in addition make a just and righteous division of it, for that reason he fell into error.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 6"
