[[commentary]]
quote='''
Considering these things, then, and applying his mind to them, the holy prophet, who had before been troubled, was delighted. Hence he himself says: For my heart was delighted and my reins were relaxed. And I was brought to nothing and did not know, and I became like a beast of burden before you. And I am always with you. 'When I had come to know,' he says, 'that God cares for human affairs and looks upon them, my reins rested,' that is: from the very great weariness of my former imprudence I have rested through the knowledge of the heavenly good and of grace. There are also certain reins of the soul, which are vexed in us through the toil of ignorance: these are relaxed so as to rest by the knowledge of heavenly doctrine, and, supported as it were by a kind of prop of heavenly precepts, they are cherished. 'Then,' he says, 'I understood that I was wearying myself in vain, since I did not know what is true.'

And I became like a beast of burden. He finely added before you; for in comparison with heavenly things, what is man but a beast of burden without reason? For the stars too, though they are bright, vanish at the rising of the sun. And Moses says: I have not been fit since yesterday, since you began to speak with your servant. And I am thin he says of voice and slow of speech. So then man too, in comparison, I will not say with Christ, but with the angels, seems to be a dumb beast of burden. But still let no one despair, because the Lord saves men and beasts of burden. And therefore, because I have learned not from myself but from you, I will cleave to you always, that I may cease to be a beast of burden, and that you may say to me: But you, stand here with me. For, surrounded by the grace of God, he begins to be a man who through imprudence displayed a beastly insensibility and ignorance; for man is proved to be man by this, if he is capable of reason and of grace, and so he rejoices that he has been separated from the dumb animals and admitted into the fellowship of men, which God visits and protects. For what is man, except that the Lord is mindful of him, or that he is visited by the Lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 9"
