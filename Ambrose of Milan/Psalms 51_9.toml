[[commentary]]
quote='''
There follows: Turn away your face from my sins and blot out all my iniquities. It is a customary entreaty that we ask those whom we have injured to forget the offense done to them. So the prophet, after the manner of men, asks the Lord to turn away his face from his sins and, as it were, to take on forgetfulness of his sins. But since he beholds all things and nothing escapes him, he cannot forget as we do, from whom the memory of what we have known slips away after a short space of time. Therefore he rightly says that he should turn away his face, not from himself, lest, forsaken, he should fail, but from his sins, so that his sins may have no strength. For those on whom the Lord looks he enlightens, and in the countenance of the Lord there is loving-kindness and forgiveness. And therefore this same man says: Let my judgment come forth from your countenance; for from the countenance of the Lord pardon, not punishment, proceeds. He is to be asked, then, to look upon us but to turn away his face from our sins, so that he may blot them out. For what he does not look upon he blots out, and the memory of what he has blotted out is buried, as the Lord himself says: I am, I am he who blots out your iniquities, and I will not remember; but do you remember, and let us be judged.

Now sin is either freely forgiven, or blotted out, or covered. It is freely forgiven through grace, blotted out through the blood of the cross, covered through charity. So too with iniquity, which is reckoned the habit of an unjust mind, although John in his epistle said that he who has committed sin has also committed iniquity, as we have it written: Everyone who commits sin commits iniquity also. Sin is iniquity, because in sin itself there is iniquity; yet, as it seems to us, sin is the work of iniquity, while iniquity is the worker of fault and transgression. It is a greater thing, then, that iniquity itself should be blotted out, that the root and seedbed of sins should be cut away. Let the evil root be removed, lest it bear evil fruits; let every inclination to error be abolished; let all the kinds of iniquities be taken away.

And so, just as the discipline of wisdom, entering into the soul, takes away imprudence, and knowledge takes away ignorance, so perfect virtue blots out iniquity, and the remission of sins blots out every sin. Hence the apostle says splendidly that he has freely forgiven us our sins, the Lord Jesus, blotting out the bond of the decree that was against us, and he took it, he says, out of the way, fastening it to the cross. With his blood he blotted out the ink of Eve; he blotted out the obligation of a liable inheritance. Faith, then, lessens sin. Therefore the Lord, when forgiving sins, used to say: Be it done to you according to your faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 13"
