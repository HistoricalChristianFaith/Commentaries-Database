[[commentary]]
quote='''
And not only two women grinding, but also two men working will be in one field, of whom one will be taken, the good sower, who has not sown upon the roads but upon plowed and tilled ground, so that the earth may multiply the fruit pressed down by humility, not scattered by boasting; but the sower of tares will be left, from which a fine flour fit to be rejected is made. Who these different farmers are we can discover, if we observe for what reason the Apostle said that there are two νοῦς, that is, two minds in us; perhaps for this reason, that one belongs to the outer man, who is corrupted, the other to the inner man, who is renewed through the sacraments. And that one is perhaps the worse which is lifted up, vainly puffed up by the mind of his flesh and not holding the head, because it turns aside from the observance of the saving precepts of our Lord Jesus Christ; for he is the head of all, who is the author of all. The other is the more excellent, which loves humility, seeks wisdom, does not neglect mercy: the good sower, namely; for he has scattered, indeed, he has given to the poor, his righteousness remains forever. This one, then, is spiritual, that one carnal. For as from the Apostle's words we understand that the seducer who exalts himself with a swollen spirit is puffed up by the mind of his flesh, so too we show that the holy man is renewed in the spirit of his mind, as the same Apostle says: But be renewed in the spirit of your mind. He shows, therefore, that there are two minds: one, which becomes the mind of the flesh when it is conquered by sin; the other, which, joined to the spirit, forswears the allurements of the flesh.

And not only two minds, but also two laws are in us, both of which the Apostle has explained to us, saying: For I delight in the law of God according to the inner man, but I see another law in my members, warring against the law of my mind and making me captive in the law of sin, which is in my members. There is, then, a law of the inner man, and there is also one of the outer: the former forbids sin, the latter persuades to it; the former condemns error, the latter suggests it; the former instructs the mind, the latter tempts it. There are also two other, more vehement laws in us, one of God, the other of sin, according to the same teacher, who says: So then I myself with the mind serve the law of God, but with the flesh the law of sin. And it is shown that if you speak of the mind alone, you show it to be contrary to the flesh; for when Paul says that he serves the law of God with the mind, he surely shows that the mind in itself, unless it is conquered by the flesh, is good, and created by nature such that it resists error. So when it is conquered, it is the mind of the flesh, having its slipping not from nature but from the flesh, and the conquered passes, as it were, into the name and property of the conqueror; but by nature it is opposed to the flesh. So with the mind we serve God, with the flesh sin. And the mind will be the better if, as a fellow worker with the Holy Spirit, it does not interrupt its devout duty.

These, then, are the ones working in our field: of them the one yields good fruit by diligence, the other loses it by neglect, and this the lawgiver calls blood, saying: The soul of all flesh is its blood. To this many also refer what is written: You shall not eat flesh in blood, lest we should regard the pleasures of the body, bloodied by the wounds of the soul, as a refreshment rather than as the guilt of blood, we who ought to be refreshed by the word of God. There is, then, a food of refreshment, and there is a food of blood; for as the flesh of the Lord is truly food, so his blood is truly our drink. Let us, then, supply the Lord with good food from our works, lest, when he comes again and, as on that fig tree, finds no fruit, he, hungry because of the barrenness of our merits, should turn away his loving purpose, saying to that soul, which he will have found bare of fruits and bloodied with blood: Let no fruit ever be born from you forever. The soul, then, of all flesh is its blood. There is also a more excellent soul, of which God said: All souls are mine; as the soul of the father, so also the soul of the son is mine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
