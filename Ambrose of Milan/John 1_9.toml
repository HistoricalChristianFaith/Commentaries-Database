[[commentary]]
quote='''
What is the true light of all but Christ, of whom John says: He was the true light which enlightens every man coming into this world, because it is he who enlightens both the eyes of the body and the gaze of the mind?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
