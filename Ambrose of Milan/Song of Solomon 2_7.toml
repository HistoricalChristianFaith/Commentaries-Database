[[commentary]]
quote='''
And because his own had not received him, he called the Church and conferred his grace upon her, as the most holy Church herself testifies in the Song of Songs, saying: I have adjured you, daughters of Jerusalem, by the powers and strengths of the field, if you will stir up and stir up again love until it pleases. She asks, therefore, in the odour of the field of which holy Jacob smelled, that is, by that faith, by that devotion, that her bridegroom be stirred up by the daughters of Jerusalem, so that he may hasten to the bride, and that his love be stirred up in her, or even that he himself be stirred up, because love is the bridegroom. For God, as John said, is love. But he did not allow himself to be stirred up by others, since he was hastening of his own accord; going forth from his bridal chamber, he exulted like a giant to run the way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 1"

[[commentary]]
quote='''
I have adjured you, daughters of Jerusalem, by the powers and the strengths of the field, if you rouse and rouse again love until it please. The field is that which the Lord has blessed, not this earthly one, either bristling with woods, or broken by torrents, or useless for vines, or stony with barren gravel, or gaping and dry with drought, or soaked with blood, or untilled with briars and thorns, but that field of which the Lord says: And the beauty of the field is with me (Ps. 49 (50):11). In this field is found that grape which, when pressed, shed blood and washed the world: in this field is that fig tree under which the saints will rest, refreshed by the sweetness of spiritual grace: in this field is that fruitful olive, flowing with the ointment of the Lord's peace: in this field bloom the pomegranates, which cover very many fruits with one defense of faith, and cherish them with a kind of embrace of love.

Since, then, wisdom and honourable brightness are thus perfect, if they have love (for the fullness of the law (Rom. 13:10) is love), she wishes love to be roused and roused again: roused in the Old Testament, roused again in the New. Love is God, as we read; love is Christ (1 John 4:8). He is roused as a lion, and a lion's whelp; that he may come up from the shoot of Judah (Gen. 49:9): he is roused again as one sleeping, as one lying down; because not by a human majesty, but by his own and the Father's, he was raised from the dead. Hence Scripture says: Who shall rouse him? For neither an angel nor a Power could rouse him by a majesty not his own, since he himself roused others. So when she says here: If you rouse and rouse again love, until it please, she speaks of those who can fittingly preach his resurrection, so as to kindle in their hearers the ardour of faith and devotion: or Christ is roused in those who first approach, roused again in those who, after they have approached, have fallen asleep. Christ, then, sleeps for the negligent, and is roused in the saints.

So she rouses and rouses again this love, until she receives his voice and summons his presence: for when sought he not only comes, but even comes leaping. But the bridegroom was already present, to prove that which he says while we are still speaking: Here I am. He is present, because he was roused by the daughters of Judah, as though roused again by the daughters of Jerusalem. The Church hears the sound of his voice and says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
