[[commentary]]
quote='''
I hated the whole of life said Ecclesiastes. He who hated life certainly proclaimed death. Indeed, he praised the dead more than the living, and judged him blessed who has not come into this life nor taken up this empty labour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 7"
