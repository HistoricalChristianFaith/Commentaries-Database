[[commentary]]
quote='''
Not without significance, too, is the fact that woman was made out of the rib of Adam. She was not made of the same earth with which he was formed, in order that we might realize that the physical nature of both man and woman is identical and that there was one source for the propagation of the human race. For that reason, neither was man created together with a woman, nor were two men and two women created at the beginning, but first a man and after that a woman. God willed it that human nature be established as one. Thus, from the very inception of the human stock He eliminated the possibility that many disparate natures should arise.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 10"
