[[commentary]]
quote='''
You see that Mary doubted not but believed, and therefore the fruit of faith followed.

But happy are ye also who have heard and believed, for whatever soul hath believed, both conceives and brings forth the word of God, and knows His works.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For behold, as soon as the voice of your greeting sounded in my ears, the infant leaped with joy in my womb. And blessed are you who believed.

You see that Mary did not doubt but believed, and therefore obtained the fruit of faith. Blessed she says are you who believed. But you too are blessed, who have heard and believed; for every soul that has believed both conceives and brings forth the Word of God and recognizes his works. Let the soul of Mary be in each one, to magnify the Lord; let the spirit of Mary be in each one, to exult in God. If according to the flesh there is one mother of Christ, yet according to faith Christ is the fruit of all; for every soul receives the Word of God, if only, immaculate and free from vices, it guards its chastity with inviolate modesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
