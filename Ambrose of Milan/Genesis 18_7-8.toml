[[commentary]]
quote='''
But Abraham did not serve wine at his feast: he sacrificed a calf and he offered butter and milk even to his angel guests—he recognised the Lord of heaven, the author of the world—, for he could not serve wine. And rightly there the occasion of sin was wanting where there was the remission of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 5"
