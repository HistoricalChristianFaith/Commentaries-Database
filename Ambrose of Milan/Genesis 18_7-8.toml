[[commentary]]
quote='''
But Abraham did not serve wine at his feast: he sacrificed a calf and he offered butter and milk even to his angel guests—he recognised the Lord of heaven, the author of the world—, for he could not serve wine. And rightly there the occasion of sin was wanting where there was the remission of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 5"

[[commentary]]
quote='''
Let the man run to the oxen, let him take a calf and receive the sacrament of the Lord's passion with hastening and unwearied zeal, not slackened by slow idleness; let him hand it to a child, who keeps the innocence of tender age, knows no guile, does not know how to strike, and guards the purity of an uncorrupted body. Of him the Lord Jesus says: Unless you are converted and become like this child, you shall not enter into the kingdom of heaven. To this child and to those like him holy David also assigns the office of divine praise, saying: Praise the Lord, you children.

Nor is it without purpose that he ran to the oxen, took a tender and good calf, and set it before them with milk. Indeed, in Exodus, when he was declaring the Passover of the Lord, Moses says: The lamb shall be for you without blemish, clean, perfect, a year old, a male; you shall take it from the sheep and the kids. And you shall slay it he says the whole multitude of the synagogue, towards evening. Hence here too it is described as midday when hospitality is offered by Abraham to the Lord. But for the supper the calf is sacrificed and eaten with milk, that is, not with blood, but with the purity of faith. A good calf, as being one that would wash away sins; tender, because he acknowledged the yoke of the Law not with a hard neck but with a soft one, and did not refuse the gibbet of the cross. And rightly tender, he of whose head and feet and inward parts nothing was left, and not a bone was broken from him, but he passed wholly into the food of those who feast. Such a one the shadow of the Law prefigured for us; such a one the truth of the Gospel has shown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
