[[commentary]]
quote='''
How shall I adequately speak of Jonas, whom the whale swallowed to grant him life and to return him to his activity as a prophet? The water restored to him the understanding which the earth had taken away. He who grieved when on land began to sing psalms in the belly of the whale. Again, the redemption of both elements is not lost sight of. The salvation of the earth had its forerunner in the sea, because the marvelous act of Jonas stands for that of the Son of Man. As Jesus lay ‘in the heart of the earth,’ so was Jonas in the whale’s belly. There is salvation in both elements. However, the sea furnishes a more significant example of piety, since a fish gave welcome to him whom men had repelled and has preserved, in the person of Jonas, Him whom men have crucified. Peter, too, weakened when on the sea, but he did not fall. What he had admitted on the waters, however, he denied on land. And so, in the former occasion he was accorded a hand-clap as to one who was loyal; in the latter case, because of his forgetfulness, he was met with a look of rebuke.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
