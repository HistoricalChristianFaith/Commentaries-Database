[[commentary]]
quote='''
Then, that we may know that there is a death in this life, and a good death, he exhorts us to carry about the death of Jesus in our body; for he who has the death of Jesus in himself will also have the life of the Lord Jesus in his body. Let death, then, work in us, that life may also work, a good life after death, that is, a good life after victory, a good life when the contest is finished, so that the law of the flesh may no longer know how to fight against the law of the mind, so that we may no longer have any strife with the body of death, but there may be victory in the body of death. And I myself do not know whether this death is not of greater virtue than life. Certainly I am moved by the authority of the Apostle, who says: so death works in us, but life in you. How many peoples' life did the death of one build up! And so he teaches that this death too is to be sought by those placed in this life, that the death of Christ may shine out in our body, and that blessed one by which our outer man is corrupted so that our inner man may be renewed, and our earthly house is dissolved so that a heavenly dwelling may be opened to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
