[[commentary]]
quote='''
Our previous discussion was on the interrogation of the saints: that the human condition is frail and feeble, having firmness of its own nowhere except in the protection of heaven. Today we must take up this point: that the common run of men, and many even of the prudent, are greatly moved when they see the unjust abounding in prosperity, while the just are frequently afflicted in this world. And truly this is a slippery place, in which even the saints could scarcely keep the footing of true opinion. Indeed, David himself was troubled, who had said earlier: You have made manifest to me the hidden things of your wisdom. But afterwards he strengthened himself and searched out the way of perfect reason. Holy Job too wrestled in discourse over that opinion with those three old friends who had come to console him. Let us, then, bring into the open the discussions of both of them. For they are worthy to bring us a teaching for living, since, placed in adversity, they merited to please God the more. Let us, then, hear each in his own order.

Eliphaz, king of the Temanites, Bildad, tyrant of the Sauchaeans, and Zophar, king of the Minaeans, had vehemently rebuked holy Job, on the ground that he was enduring so much punishment because of his sins. For with their weak wit they did not notice that the Lord had given him over to be tempted, so that the athlete of Christ, trained by temptations, might come to the crown with greater glory. So, not seeing so great a mystery of wisdom, from the fear of a narrow heart, lest they seem to accuse of injustice God, who allowed an innocent man to be afflicted with punishments, they turned the desert of the punishments back upon holy Job, saying that all the life of the ungodly is in anxiety, and riches unjustly gathered will be vomited up; that whatever grievous things a man suffers on earth he suffers because of his sins; that even if he is in prosperity, his good fortune cannot be made lasting for him, and it quickly vanishes like a dream, so that his place is not found; that the joy of the ungodly is a heavier ruin, and that therefore holy Job too had been changed from prosperity into adversity and, at the price of his offences, had fallen from the highest to the lowest; that he who asserted that he was innocent was slipping, since the portion of the ungodly man is such that the indignation coming upon him from the Lord snows sorrows upon him and destruction enwraps his house.

Holy Job heard these things and, like a strong athlete, sitting on the dunghill, amid such great weals and the pains of a savage wound, his whole body covered with dreadful sores, he spoke mysteries, and he gave himself not to seeking remedies for his own sickness, but to sacred discourses. And so the words of the sick man were stronger than those of the men who were not sick. For they spoke unjust things, but not according to knowledge: they proclaimed the divine judgments, the punishments of the guilty, the rewards of the saints, but they did not know how to distinguish the guilty from the just. Indeed, the man whom the Lord God pronounced just, they condemned for injustice and accused of iniquity. They did not know, then, what befitted each man. But the holy man Job discerned in the spirit how he ought to speak to each; he was stronger, then, than those who seemed sound and unharmed. And why do I say that he was found stronger than the rest? He was found stronger than himself; for Job sick was stronger than he had been when well, according to what is written: power is made perfect in weaknesses. So Job too, when he was weak, was then the stronger. For he was not sick in mind, though he suffered pain in body, because his soul was not in the flesh, to whose sufferings it did not cling, but in the spirit, with whose strength he had covered himself.

Therefore he spoke, not the groans of the flesh and the weaknesses of the body, but the voices of the spirit, with which to press on, not to give way. And at first indeed more gently, to strike them with shame, because they pressed the just man unjustly, saying that he was enduring punishments smaller than his sins, and, sinners themselves, they did not blush to accuse an innocent man with falsehoods. 'Grant' he says 'that I have erred, and that the one who strays from the way dwells with me, he who pours errors over the minds of men, so that I speak words that I ought not, as you say, and my words go astray and my speech is not brought forth fittingly: why do you leap upon me and revile me, not considering that this temptation has come to me from the Lord, who judged that I should be hedged about with a kind of rampart of troubles? I am exercised by adversities, walled about on every side with toils and dangers: and still you insult me, wishing to crush the one whom you ought to help. Behold, I laugh at reproaches, and I will not speak nor answer your revilings. For it is not you who judge, but he who judges me is the Lord, and yet the time of his judgment has not yet come. What need is there to cry out before the judgment? It is good to be silent while he who judges is awaited, it is good not to return reviling for reviling, lest we too be numbered among the detractors.'

Let us imitate, then, this man, who by his silence refuted those who reviled him. For he showed the virtue of his mind, which insults did not move, and he made manifest the innocence of his conscience, since he did not recognize the charges but laughed at them as foreign to him. But we, as though something were being charged against us, make it more bitter while we wish to clear ourselves: while we desire to avenge ourselves, we confess it, although Scripture says that you should turn away the word of disgrace and take away your garment; for the injurious man passes by. Let us be silent, then, so that he may pass by, lest, provoked, he burn our garment; for it is written: Do not kindle the coals of the sinner, lest perhaps you be burned in the fire of his flame. For this reason, then, the holy man is silent, even if a slave is insolent; even if a poor man reviles, the just man is silent; even if a sinner hurls reproaches, the just man laughs; even if a weak man curses, the just man blesses.

David was silent when Gera the son of Shimei cursed him; Job laughed; Paul blessed, as he himself says: We are cursed, and we bless. For under divine teaching the progress of human virtue increased, since he had already come who would make men stronger out of the weak, and Paul had heard him saying: Bless those who curse you, and pray for those who slander you. What he said in word he also proved by example. Indeed, when he was set on the cross, he said of his persecutors who were reviling him: Father, forgive them, for they do not know what they do, so that he prayed for those who slandered him, whom he himself could forgive. Job, then, laughed, because Christ had not yet come, for whom alone the prerogative of the great virtues was reserved. For he himself is the beginning of virtues, as he said: The Lord created me the beginning of his ways.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapters 1-2"
