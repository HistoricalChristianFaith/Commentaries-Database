[[commentary]]
quote='''
Accordingly, so that we may know that the sequence of the Scriptures agrees with the dispensation set before us, let us learn that the Church was naked, let us learn that she was seeking, hastening and washing herself before the house of Christ, when John was baptizing in the Jordan, saying: I indeed baptize you in water unto repentance, but he who comes after me is mightier than I, whose shoes I am not worthy to carry. He will baptize you in the Holy Spirit. So when the people were being baptized unto repentance, the Church, already near to his house, was surely seeking Christ, that she might attain to grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"

[[commentary]]
quote='''
Therefore it was said to Moses: Loose the sandal (Exod. 3:5). It was said also to Joshua son of Nun (Josh. 5:16). But to Christ it was not said; rather it was written, when the Baptist said: After me comes a man, whose sandals I am not worthy to carry (Matt. 3:11); because those are rightly admonished to loose their sandal who could not be without sin. But he not only did not loose his sandal, but even loosed the sandals of others; because he not only kept his own body free from sins, but also gave pardon for the sins of all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
