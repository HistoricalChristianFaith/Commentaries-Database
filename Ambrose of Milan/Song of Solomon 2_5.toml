[[commentary]]
quote='''
The Word of God inflicts a wound, but it does not produce a sore. There is a wound of righteous love, there are wounds of charity, as she has said, "I am wounded with love." The one who is perfect is wounded with love. Therefore the wounds of the Word are good, and good are the wounds of the lover.
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 14:91"

[[commentary]]
quote='''
Consider each in turn. In moral things there is the flower, the lily among thorns, as he himself says: I am the flower of the field and the lily of the valleys. In moral things, then, there is the flower; in natural things the sun of justice, which in rising and rising again gives light, and in setting casts shadow — beware lest it set for you, for it is written: let not the sun go down upon your anger — in mystical things there is love, because Christ is the fullness of the Law. And therefore the Church, which loves Christ, is wounded by love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Strengthen me, she says, with ointments, pack me round with apples. You have other dwellings, to which the Church comes on in turn with delight. These dwellings are those of the cross of Christ and of his burial, in which the Church was wounded, but with the wound of love; for it is a wound which Christ received, but an ointment which he poured out. It is an apple which hung; this apple the Church tasted, and said: And his fruit is sweet in my throat. And that you may know that the Lord is an apple, you have read above: As an apple tree among the trees of the wood, so is my kinsman. We too confess a wound when we preach Christ crucified, but we are a good fragrance to God; because the cross of Christ is to the Jews a stumbling block, to the Greeks foolishness, but to us the power and wisdom of God. With this wound the Church is wounded when she preaches the death of her Savior, but this wound is one of love. In short, he who does not believe denies; he who loves confesses. The Manichaean denies, the Christian confesses; and therefore it is written: More profitable are the wounds of a friend than the willing kisses of an enemy (Prov. 27:6). Beautifully, then, does the Church say: For I am wounded by love.

Let us bare our limbs to the good wound, let us bare them to the chosen arrow: this arrow is Christ, who says: He has set me as a chosen arrow (Isa. 49:2); it is good, then, to be wounded by this arrow. This advance belongs to no middling dwelling; not all can say that they have been wounded by love. The apostles said it, when they were stoned for Christ and preached Christ; Paul said it, when he was beaten thrice with rods, and day and night argued before the Gentiles that Christ was to be adored; the martyrs say it, who are wounded for Christ; and because they were found worthy to be wounded for his name, they love the more. Coming, then, to this dwelling, to this advance, that she should offer her sons for Christ, that she should receive the wounds of love, the Church, as though finding good nourishment of faith, herself tasted the fruit of piety, and began to exhort the others, saying: Taste and see that the Lord is sweet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
