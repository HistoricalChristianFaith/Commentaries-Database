[[commentary]]
quote='''
Such was Isaac when he was awaiting Rebecca's coming, preparing himself for a spiritual union. For she was coming already endowed with heavenly mysteries; she was coming bearing with her great ornaments for the ears and the hands, because the beauty of the Church stands out in hearing and in works, to whom, we observe, it was rightly said: be unto thousands of thousands, and let your seed possess the cities of the adversaries. Comely, then, is the Church, which has acquired sons from hostile nations. But this can also be applied to the soul, which subdues the passions of the body and turns them to the duties of the virtues, and makes the motions that resist her obedient to her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
