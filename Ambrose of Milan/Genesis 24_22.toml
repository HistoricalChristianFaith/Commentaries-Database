[[commentary]]
quote='''
Such was Isaac when he was awaiting Rebecca's coming, preparing himself for a spiritual union. For she was coming already endowed with heavenly mysteries; she was coming bearing with her great ornaments for the ears and the hands, because the beauty of the Church stands out in hearing and in works, to whom, we observe, it was rightly said: be unto thousands of thousands, and let your seed possess the cities of the adversaries. Comely, then, is the Church, which has acquired sons from hostile nations. But this can also be applied to the soul, which subdues the passions of the body and turns them to the duties of the virtues, and makes the motions that resist her obedient to her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"

[[commentary]]
quote='''
Perhaps, daughters, you who are making your way to the grace of the Lord, on hearing this you too may be roused to have earrings and bracelets, and may say: 'How is it that you forbid this, bishop, that we should have what Rebecca received as a gift, and urge us to be like Rebecca?' But Rebecca did not have such earrings and bracelets as are wont to sow quarrels in the church, which often slip off: she had other earrings, which I wish you may have, other bracelets. Rebecca's earrings are the marks of devout hearing, and Rebecca's bracelets are the ornaments of deeds. She had such earrings as would not weigh down the ear but soothe it, such bracelets as would not load the hand with material gold but lighten it with spiritual action. Therefore she pleased both her brother and her parents in this adornment. You too, take the earrings that Abraham left you, take the bracelets that he sent. Hear the words of the Lord your God, as he himself heard them: carry out his commands, as he hastened to fulfil them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
