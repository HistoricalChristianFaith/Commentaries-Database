[[commentary]]
quote='''
And therefore, well conscious of themselves, they say: All these things have come upon us, and we have not forgotten you, and we have not dealt unjustly in your covenant; and our heart has not turned back, and you have turned aside our paths from your way. The last verse seems not to agree with the preceding ones. For how have these turned aside, upon whom no forgetfulness of the divinity has crept, nor the consciousness of any iniquity, nor any sloth? But if you consider that the righteous man is scarcely saved, you will surely understand that even his footsteps sometimes stagger, and that God seems to be the author of their turning aside, because he too allows the righteous often to be tempted, so that, schooled by temptations, they may be the more proved. And who is so strong as by no means to be moved in temptation, unless the Lord stands by him as his helper? Indeed the prophet David himself was troubled, because he said in his abundance: I shall not be moved for ever. Or who is he whom the place of affliction and the corruption of the earth does not move, since the divine sentence has excepted no one as immune from the toil and weariness of this earth, to which it was said: Cursed is the earth in all your works? Thorns, he says, and thistles it shall bring forth. Indeed Paul himself, the Lord's vessel of election, though absolved from the curse of the old sentence by the Passion of the Lord Jesus, yet most vehemently lamented that he was being led captive in the law of sin, and found no one but Christ by whom he might be freed, when the law of his body and the shadow of death pressed upon him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
