[[commentary]]
quote='''
The following example should convince them that a command to one who will disobey is not something superfluous or unjust. The Lord Himself close Judas, one who, He knew, would betray Him. If these men think that he was chosen unwisely, they restrict the power of God. But they cannot hold this opinion, since Scripture declares: For Jesus knew who it was who should betray him. These defamers of the Old Testament should therefore hold their peace.

Possible objections on the part of the Gentiles who do not admit this evidence stand in need of a response. Since the Gentiles demand a rational explanation, here is the reason why the Son of God either gave a command to one who is going to disobey it or has chosen one who is going to betray Him. The Lord Jesus came to save all sinners. He was bound to show concern even for the wicked. Accordingly, He was bound not to disregard one who was to betray Him. He wished that all might take note that in the choice even of His betrayer He was offering a sign for the salvation of all of us. No injury was done to Adam in that he received a command, or to Judas because he was chosen. God did not lay it down as a necessary consequence that one should disobey and the other should betray Him. Both could have abstained from sin If they had guarded what they had received. Hence, although He knew that all the Jews would not believe, He stated: I have not come except to the lost sheep of the house of Israel. The fault is, therefore, not in the one issuing the command; the sin is rather in the one who disobeys. God's intent was this: He wanted to show to everyone that He willed to give freedom to all mankind. I do not mean to maintain that He did not know of the disobedience to come. Rather, I contend that He did know, but that He should not for that reason be subject to reproach for a betrayer who met death. God should not be accused of being the cause why both lapsed. In fact, both stand convicted and condemned, because one received a command not to fall into sin, and the other was enrolled among the Apostles in order that he, as the result of kindness, might change his intention to betray. At some time in the future when the other Apostles would be found wanting, he might well become a source of comfort to all.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 8"
