[[commentary]]
quote='''
And the Church went on to say:

His left hand is under my head, and his right hand will embrace me. These too are dwellings of the Church as she walks on the royal road; For there are many dwellings with my Father (John 14:2). The Lord Jesus testifies: And behold, I come, and I will fetch you (ibid.). A good dwelling is that of wisdom, and whether at her left hand or at her right, a good dwelling; because it is the royal road. And so the wise messengers say: We will go by the royal road, we will not turn aside to the right or to the left, until we pass your borders (Num. 20:17). This the messengers sent by Moses said to the king of Edom, that is, the earthly one; because all earthly things, whether on the right or on the left, are evil. Folly is an evil dwelling, intemperance an evil dwelling; and therefore the Hebrew passes through these dwellings: he does not turn aside to them, but passes through, that he may come to the left hand of wisdom and the right, and abide in them, where are the riches of simplicity, where glory, where length of life. Length indeed of life is in her right hand, as Solomon says: But in her left hand riches and glory (Prov. 3:16): in the right hand is life, in the left rest. Would that I might rest upon her left hand, and not seek pillows! Woe indeed to those who sew pillows, Ezekiel says (Ezek. 13:18). These dwellings the good leader prepares for his Church, and through the ways of wisdom he directs her journey. In short, the wise man praises her ways: Her ways are good ways, and all her paths are in peace (Prov. 3:17).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
His left hand is under my head, and his right hand will embrace me. The bride says this of Christ, the soul says it of the Word of God: but Christ is one and the same, the Word of God and wisdom. Blessed, then, is the soul which wisdom embraces. Great is the hand of wisdom, great her right hand; it embraces the whole soul; for she is wholly protected who has been betrothed to the Word of God. For the fullness of wisdom is to fear God: the soul, then, that fears God protects herself with full defense. Wisdom puts her left hand under her neck, and her right hand about her in embrace. Each of her arms indeed is stretched out for useful things; yet each hand of wisdom has its own properties: In the right hand is length of life, but in the left riches and glory. Her hand is indeed endowed with good gifts on either side; yet they differ in their gift in this, that they embrace both present and future times; so that the left is the rewarder of present things, the right of things to come.

We can recognize this also from the prophecy of the holy patriarch Israel; for when he had placed his right hand upon Ephraim, and his left upon Manasseh, and Joseph, in consideration of age, wished to change them, so as to place his father's right hand upon the head of Manasseh, the elder son, he would not, and said: I know, son, and this one too shall become a people, and this one shall be exalted, but his younger brother shall be greater than he (Gen. 48:19). In what greater? Surely in this, that he was preferred in the blessing, as Ephraim's descendants say: May God make you as he made Ephraim and Manasseh (ibid. 20): or because his seed is the multitude of the Gentiles, which in this world has chosen labour, believing in the Lord Jesus, that it may have the consolation of things to come. But the seed of Manasseh is the people of forgetfulness, which, having forgotten its own author, is exalted for a time in this world, but hereafter will pay grave penalties; because it has denied its God and Lord.

We have said this in order to prove that the things which are to come are the better. In short, the left hand of wisdom is under the bride's head, but the right is above, which embraces the whole bride. So the former is as it were the support of present rest, on which the soul leans and rests. She has where to lay her head, because the left hand of wisdom is riches and glory. For this time these things soothe, and are in part a comfort, and therefore: The Son of Man had nowhere to lay his head (Matt. 8:20); because though he was rich, he became poor (2 Cor. 8:9). Nor did he seek any glory of this world; because he had come to help not in part, but the whole human race, saying: You are angry with me because I made a whole man well on the sabbath (John 7:23); that is, whole: not to enrich him by a bestowal of means, not to heap him with the insignia of honours, not with the increase of worldly glory; for these do not have the fullness of blessedness and grace: but whole, that is, so that it might embrace length of eternal life. For the life at the right hand of wisdom is not like common life, but is length of life, so that he who receives life from wisdom obtains not a scant life, but perpetuity and the length of eternity.

A good garment is eternity of life. So the bride, supported by pomegranates, that is, by diverse and innumerable fruits, and above all by the fragrances of faith, grace, wisdom and glory, and by the riches of eternal life which are about the left and the right hand of the bridegroom, rouses Christ through holy souls with the applause of congregations giving praise, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
