[[commentary]]
quote='''
Indeed, further on we recognize that zeal for knowledge was a support even to persons of lower rank, the Lord saying: I will be mindful of Rahab and Babylon, to those who know me, that is: I will be mindful of that harlot Rahab and of that confusion among those who know me, or among them themselves, because that harlot recognized me, whom the chosen people did not know. Among those, then, who have known me Rahab will be remembered, that she may obtain the worthy reward of faith. Hence we note that it was said in the Gospel also: Harlots and publicans shall go before you in the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
