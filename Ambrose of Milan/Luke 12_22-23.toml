[[commentary]]
quote='''
Now nothing is more likely to produce conviction in believers that God can give us all things, than the fact, that the ethereal spirit perpetuates the vital union of the soul and body in close fellowship, without our exertion, and the healthgiving use of food does not fail until the last day of death has arrived. Since then the soul is clothed with the body as with a garment, and the body is kept alive by the vigour of the soul, it is absurd to suppose that a supply of food will be wanting to us, who are in possession of the everlasting substance of life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
do not be anxious for your soul, what you shall eat, nor for your body, what you shall put on. The soul is more than food and the body than clothing. For nothing is more moral for producing the faith that all things can be conferred by God on those who believe, than that that airy spirit, without our labor, keeps perpetual the living partnership of soul and body, bound together in one dwelling, and the use of saving nourishment does not fail, except when the last day of dying has come. Since then the soul is clothed with the garment of the body and the body is animated by the vigor of the soul, it is absurd for us to think that an abundance of sustenance will fail us, who obtain the continuous substance of living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
