[[commentary]]
quote='''
We shall go also where holy Abraham spreads open his bosom to receive the poor, as he received Lazarus too, in which bosom rest those who in this world have endured hard and harsh things.

But now, father, again and again stretch out your hands to receive the poor man from here, open your lap, spread out your bosom, so that you may receive more, because very many have believed in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
