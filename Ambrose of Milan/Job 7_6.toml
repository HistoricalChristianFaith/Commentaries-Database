[[commentary]]
quote='''
He perishes, then, in empty hope who thinks that he can hide his crime: that is a tale, not the truth. Indeed, the tale of sinners is hateful, having no fruit but groaning. For the narration of a fool is a burden on the way. For what else is sin but a burden, which weighs down the traveller of this world, pressed down by the heavy load of offence? If he did not wish to lie under the burden, he ought to have listened to the one who says: Come to me, all you who labour and are burdened, and I will refresh you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 3"
