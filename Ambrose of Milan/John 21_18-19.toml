[[commentary]]
quote='''
The very vessel of the Lord's election, writing to Philemon, says: Since you are such a one as Paul the old man, and now also a prisoner of Christ Jesus, I beseech you for my son Onesimus, whom I have begotten in chains. And so, wishing to pay him the greatest honour, he compared him to Paul the elder, not the young man, and he gloried in being an old man there where he was already held in chains. And see the difference: he was signified as a young man in the passion of another, as an old man in his own; there as a young man, because he was keeping the garments of the Jews, here as an old man, where he was putting off the cast skin of his body. Thus Peter too is called an old man there where there is the contest of the passion: When you were younger, he says, you girded yourself and walked where you wished; but when you have grown old, you will stretch out your hands, and another will gird you and lead you where you do not wish. And this he said signifying by what death he would glorify God. Before the contest he is called younger; in the contest, an old man, as one who has fulfilled the whole contest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
