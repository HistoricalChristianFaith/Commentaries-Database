[[commentary]]
quote='''
The sentence imposed on the serpent is not considered a heavy one, since even Adam, whose offense was less serious, was accorded a like sentence.

For it is written: Cursed is the earth in thy works; in sadness shall you eat thereof all the days of your life. The two sentences seem to have a certain similarity, yet in that similarity there is a great difference. There is a difference in the way a person eats of the earth, as the serpent is related to have done and the manner in which this is recorded of the man: In sadness shall you eat. That very phrase in sadness makes the precise difference. Note how important this difference is. It is for my benefit that I should eat the earth in sadness rather than with delight, that is to say, that I should appear to feel a certain sadness in my bodily acts and senses rather than experience pleasure in sin. Many, in fact, because of their manifold iniquities have no awareness of sin. But he who says: I chastise my body and bring it into subjection, feels sadness because of regret for the sins to which we are subject. He himself did not have such serious faults for which he ought to feel sorrow. Hence he teaches us that that kind of sorrow is of value which has, not this world, but God, as its end. It is right, he says, that you become sorrowful, so as to feel repentance in the face of God: For the sorrow that is according to God produces salvation, whereas the sorrow that is according to the world produces death. Take note of those who in the Old Testament were sorrowful in the midst of their bodily labors and who attained grace, while those who found delight in such pleasures continued to be punished. Hence the Hebrews, who groaned in the works of Egypt, attained the grace of the just and those who ate bread with mourning and fear, were supplied with spiritual good. The Egyptians, on the other hand, who, in their service to a detestable king, carried out such works with joy, received no favor.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
