[[commentary]]
quote='''
Therefore God the Word says to your soul, says to your mind: Come hither from Lebanon, O bride, come hither from Lebanon: you shall pass over and pass through. If you pass over worldly things, you will pass through to paradise. Hear one passing over: Remember me, O Lord, when you come into your kingdom; hear again one passing through: Amen, amen, I say to you, today you shall be with me in paradise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The Lord Jesus himself too, delighted by the faith of this soul, by her confession and grace, and having praised her merits, calls her nearer, saying: Come here from Lebanon, bride, come here from Lebanon: you will pass and pass through, from the beginning of faith, from the head of Senir and Hermon, from the dens of lions, from the mountains of leopards, that is: go out from the body and strip yourself wholly; for you cannot be present with me unless you first go abroad from the body, since those who are in the flesh are abroad from the kingdom of God. Come here he says, come here. He did well to repeat it, because whether present or absent you ought to be present with the Lord your God and to please him. Be present when present, be present when absent, even if you are still in the body. For all are present to me whose faith is with me. He is present to me who goes out from the world; he is present to me who thinks of me, looks upon me, hopes in me, to whom I am the portion; he is present to me who has been absent from himself, he is present to me who has denied himself. He is with me who is not within himself, since he who is in the flesh is not in the spirit. He is with me who goes out from himself, he is near me who has been outside himself, he is whole for me who has lost his soul for my sake. And so: Come here, come here, bride: you will pass and pass through, from the beginning of faith. She passes and passes through from the earth, and she passes through who reaches Christ. She passes by the merit of faith and the brightness of works, which shine like Senir and Hermon, that is, the way of the lamp; she passes, having overcome the temptations of the world and conquered the spiritual wickednesses, seeking the crown of the lawful contest, and so she has deserved to be praised with Christ as judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
Come here from Lebanon, come here from Lebanon: you will pass and pass through, from the beginning of faith, from the head of Senir and Hermon, from the dens of lions, from the mountains of leopards. By these signs it is shown that the perfect and irreproachable beauty of the virginal soul, consecrated to the divine altars, not bent toward mortal things amid the encounters and dens of spiritual beasts, but intent on the mysteries of God, has won the beloved, whose breasts are full of gladness; for wine gladdens the heart of man.

And the fragrance, he says, of your garments is like the fragrance of Lebanon. Come from Lebanon, bride, come from Lebanon: you will pass and pass through, from the beginning of faith: you will pass into the world to contend, you will pass through to Christ to triumph over the world. You have heard that he has separated you from the lions and the leopards, that is, from the assaults of the spiritual forces of wickedness; you have heard that the beauty of your virtues pleases him.

Be present here from Lebanon, bride, be present here from Lebanon: you will pass and pass through, from the beginning of faith, from the head of Senir and Hermon, from the caves of lions, from the mountains of leopards; that is, go out from the body, and strip yourself wholly. For you cannot be present with me unless you first sojourn away from the body; since those who are in the flesh sojourn away from the kingdom of God. Be present, he says, be present. Well did he repeat it, because, whether present or absent, you ought to be present to the Lord your God and to please him: be present when present, be present when absent, even if you are still in the body; for all are present to me whose faith is with me. He is present to me who has gone out of the world; he is present to me who thinks of me, gazes on me, hopes in me, to whom I am his portion; he is present to me who has been absent from himself: he is with me who is not within himself, since he who is in the flesh is not in the spirit; he is with me who goes out from himself; he is near me who has been outside himself; he is whole to me who has lost his soul for my sake. And therefore, Be present, be present, bride; you will pass and pass through, from the beginning of faith. She who has come to Christ passes and passes through the others: she passes by the merit of faith and the brightness of works, which shines like Senir and Hermon, that is, the way of the lamp; she passes when the temptations of the world have been conquered and the spiritual forces of wickedness overcome, seeking the crown of the lawful contest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
