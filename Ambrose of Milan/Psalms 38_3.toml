[[commentary]]
quote='''
There is no health, he says, in my flesh from the face of your wrath. Isaiah has explained this place for us: You were angry, and we sinned. Yet what is the face of the Lord's wrath? Is it perhaps this, that the eyes of the Lord are upon those who do evil? For if the eyes of the Lord are upon the righteous, how is the prophet made weak by the face of God's wrath? Whence consider this too, which David himself said later on: For you have rescued me from all tribulations, and your eye has looked upon my enemies. For as it looks upon the good deeds of the righteous, so it also detects the hidden things of sinners. Unless perhaps you refer this to Christ, who was rescued from all by whom he was being crushed, when he stripped himself from the people of the Jews, who crushed him with frequent sacrileges and daily impieties, and called his enemies to grace, those whom the eye of God saw and loved. Since, then, God is loving, there must be no despair at all; even if he is angry, he pardons; even if he strikes, he heals; even if he delivers the flesh to destruction, he saves the spirit. Do not fear, then, the infirmity of the flesh, because the saint, when he is weak, is more powerful.

But what is it that he says: there is no peace for my bones from the face of my sins? What are these bones? Are they of the soul or of the body? But the care for bodily pain would not be so great where the soul too is labouring, since it belongs to a saint to wish the flesh to be scourged for the sake of the soul, as Paul too scourged himself, lest his claim be rejected. There are certain bones of the inner man, just as there are his other members too, the eyes and nostrils of the mind, as Job said: the divine spirit which is in my nostrils. There are, then, bones too, by which a certain framework of charity is formed. Whence Adam too said of the partner of his charity and co-heir of the grace of life: This now is bone of my bones and flesh of my flesh; which the Apostle interpreted, saying: This sacrament is great, but I speak in Christ and in the Church. And who would doubt that the sacrament of Christ and the Church is not carnal but spiritual, since every good man, even in marriage itself, is held not by the beauty of the flesh but by that of virtue, and loves in his wife her character, not her use? Indeed, hear that he speaks not according to the flesh but according to inner virtue: My bone is not hidden, which you made in secret. It is virtue, then, not flesh, which knows the hidden things of God the Father.

There is, then, no peace for the virtues of the soul, when our sins rush together before our eyes and pour themselves over our minds. And this the chosen teacher of the Gentiles interpreted well in the second epistle to the Corinthians, saying: For even when we had come into Macedonia, our flesh had no rest, but we were afflicted in all things; fightings without, fears within. The sins of the Macedonians troubled him; how much more do each one's own sins disturb every one of us, so that there can be no rest for us! Our own guilt is a heavier adversary to us: it disquiets the idle, afflicts the healthy, saddens the glad, unsettles the calm, harries the gentle, rouses the sleeping. We are guilty without an accuser, we are tortured without a torturer, we are bound without chains, we are slaves without a seller. Whence Scripture too says: By your sins you have been sold. These, then, are the sins which are always against us, as the prophet said: They have sold us and they lord it over us. A slave who is sold goes out of his former servitude to pass to another master; we do not lay down the yoke of the former ones, and we are bowed under new sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
