[[commentary]]
quote='''
And someone from the crowd said: Master, tell my brother to divide the inheritance with me. But he said to him: Man, who has appointed me judge or divider over you? This whole passage is arranged to train us to undergo suffering for the confession of the Lord, either through contempt of death or through hope of reward or through the announcement of a lasting punishment for which pardon will never be granted. And since avarice is usually wont to tempt virtue, a precept and an example for abolishing this thing too are added, the Lord saying: who has appointed me judge or divider over you? Well does he decline earthly things who had come down for the sake of divine things, and he does not deign to be judge of lawsuits and arbiter of property, he who has the judgment of the living and the dead and the award of merits. So one must consider not what you ask, but from whom you request it, and you should not think that a mind intent on greater things is to be distracted by lesser ones. Hence not undeservedly is this brother rebuffed, who was eager to occupy the dispenser of heavenly things with corruptible ones, since between brothers it is not a judge in the middle but dutiful love as trustee that ought to divide the patrimony, although it is the patrimony of immortality, not of money, that men should seek; for in vain does he gather wealth who does not know whether he will use it, like that man who, when his full barns were bursting with new harvests, was preparing storehouses for his overflowing fruits, not knowing for whom he was gathering.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
