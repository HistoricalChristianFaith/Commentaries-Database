[[commentary]]
quote='''
There is an old proverb: When the usurer and the debtor meet one another the Lord has oversight over both. The one like a dog is seeking his prey, the other like the exposed quarry turns aside. The one like a lion is seeking whom he may devour, the other like the young ox dreads the onslaught of the robber; the one like a bird of prey seeks to attack the swan with his talons, the other like a goose or a waterfowl prefers either to cast himself down from the cliffs or plunge into the depths rather than to withstand that bird that preys upon the human body. Why do you flee daily? Although the usurer may not overtake you, want, a good runner, as it were, overtakes you. The Lord therefore sees both the usurer and the debtor, he looks upon them as they meet, a witness of the wickedness of the one, the wrong of the other; He condemns the avarice of the former, the folly of the latter. The former numbers every step of the debtor, he lays a snare for his turnings; the latter forthwith hides his head behind the pillars; for the debtor has no dignity. Both very often repeat the calculation of the interest on their fingers. Their care is like, but their feelings unlike. The one rejoices in the increase of the interest, the other is afflicted by the piling up of the debt. The one counts his gains, the other his miseries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 7"
