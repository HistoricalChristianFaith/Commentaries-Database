[[commentary]]
quote='''
Indeed, Joseph himself erred: when he had placed his elder son at his right hand, and at the left hand of the same, that is, of Jacob, had placed his younger son, so that the order of age might keep the order of the blessing, Jacob stretched out his right hand over the younger grandson and his left over the elder grandson, and when his son wished to turn his father's right hand over onto Manasseh the elder, he answered: I know, son, I know: this one too will become a people, and this one will be exalted; but his younger brother will be greater than he. And he added the reason for the preference, saying: his seed will be a multitude of nations. So much better did he see, though the sight of his body was hindered, that he taught the one who could see that he had erred. For who sees better than he who sees Christ? Or who can say that he was hindered in his eyes who saw in Christ the Church shining forth? Is it not clear, then, that weakness cannot hinder blessedness?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
