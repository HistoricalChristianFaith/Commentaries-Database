[[commentary]]
quote='''
The works of God, so carefully wrought, compel me to understand something more in them than I read. The Apostle comes to the help of one perplexed, and what I did not understand — what is meant by: bone of my bones and flesh of my flesh and she shall be called woman, because she was taken from her man — he revealed to me by the divine Spirit, saying: This sacrament is great. What sacrament? That the two shall be in one flesh, and that a man shall leave father and mother and cleave to his wife, and that we are members of his body, of his flesh and of his bones. Who is this man for whose sake the woman leaves her parents? The Church leaves her parents, she who was gathered from the Gentile peoples, to whom it is said prophetically: Forget your people and your father's house. For the sake of what man, unless perhaps him of whom John says: After me comes a man who has been made before me? From whose side, as he slept, God took a rib; for he it is who slept and rested and rose again, because the Lord upheld him. What is his rib but power? For then, when the soldier opened his side, at once there came out water and blood, which was poured out for the life of the world. This life of the world is the rib of Christ, this is the rib of the second Adam; the first indeed Adam unto a living soul, the last Adam unto a life-giving spirit; the last Adam is Christ, the rib of Christ is the life of the Church. We therefore are members of his body, of his flesh and of his bones. And perhaps this is the rib of which he said: I perceive that power has gone out from me; this is the rib which went out from Christ and did not diminish his body; for it is not a bodily rib but a spiritual one, and the Spirit is not himself divided, but divides to each as he wills. This is Eve, the mother of all the living. For if you understand you seek the living among the dead, you understand that those are dead who are without Christ, who are not partakers of life; for this is what it is not to be partakers of Christ, since Christ is life. The mother of the living, then, is the Church, which God built with Christ Jesus himself as the chief cornerstone, in whom the whole structure, joined together, grows into a temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
