[[commentary]]
quote='''
Consider each in turn. In moral things there is the flower, the lily among thorns, as he himself says: I am the flower of the field and the lily of the valleys. In moral things, then, there is the flower; in natural things the sun of justice, which in rising and rising again gives light, and in setting casts shadow — beware lest it set for you, for it is written: let not the sun go down upon your anger — in mystical things there is love, because Christ is the fullness of the Law. And therefore the Church, which loves Christ, is wounded by love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Beautifully, too, the Church is called a lily; for as the lily gleams, so too the works of the saints shine. Most beautifully also is it said: The lily of the valleys; because grace shines out more among the lowly. But this lily is in the midst of thorns, that is, among the Jews and heretics, that is, among the cares of this world, which prick the mind and soul of man. We can also take it otherwise: that as the lily stands out among thorns, so the Church of God shines out above all assemblies.

It is worth considering also that this lily is surrounded with brightness, but that what it has within is red, and this too of good fragrance; because the flesh of Christ, surrounded as it were by the moral brightness of the Godhead, had the protection of heavenly grace. In short, in later passages she says: My brother is white and ruddy (Song 5:10): white with divine brightness, ruddy with the appearance of the human colour which he assumed in the sacrament of the incarnation. And rightly that very part which is red smells sweet, because the flesh of Christ is without sin; the faithless, in handling it, defiled their hands; the saints, in venerating it, became fragrant with the fragrance of piety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
