[[commentary]]
quote='''
Her sons fell, ulcerated by torments; the dead were rolled upon the dead, bodies tumbled upon bodies, heads were cut off upon heads; the place was filled with the corpses of her sons: the mother did not weep, did not lament, did not close the eyes or the mouth of any of the dying, did not wash the wounds, knowing that they were more glorious if they were seen disembowelled and clotted alike with dust and blood, such as victors are wont to return from war, such as they are wont to bring back trophies from their enemies. She judged that no coverings were to be thrown over them, no funeral rites to be performed, except with the company of her own death as well. What lyre could give forth sweeter songs than the dying sons had given forth in such grievous tortures? For the groan of nature broke forth even from the unwilling. You might have seen the corpses of the slain in order like the threads of strings. You might have heard a seven-stringed psaltery resound with triumphal groans. Not so would those enticing songs of the Sirens, as they say, draw the hearer; for they drew him to shipwreck, these to the victory of sacrifice. Nor would the songs of swans so soothe the ears and the soul; for swans die by the lot of nature, these died for love of devotion. Not so do the hoarse murmurs of doves resound in a secret grove as the last words of the dying resounded with the utmost sweetness. Nor does the moon so shine among the stars as the mother shone among her sons, both when she led them down to martyrdom to give them light, and when she lay embracing the victors in the midst of her sons.

O mother, truly stronger than adamant, sweeter than honey, more fragrant than a flower! O indissoluble bond of love! O truly love strong as death, jealousy hard as hell of devotion and faith! No floods of such great sufferings could shut out your love, no rivers of such great bitternesses could overflow it. As the ark in that flood of the world was borne unharmed over the expanses of the whole earth, so you too stood immovable in devotion against the tide of such grievous sufferings, and, though you could have chosen the safety of your sons, you would not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 12"
