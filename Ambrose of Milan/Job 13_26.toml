[[commentary]]
quote='''
Again, adding further, he says: Why have you written evil things against me and laid upon me the sins of my youth? Finely has he seized upon that age for his complaint which is usually the most slippery toward vice. For childhood has innocence, old age prudence, and young manhood itself, the neighbour of youth, has regard for a good name and shame at doing wrong: youth alone is powerless in strength, weak in counsel, hot with vice, scornful of those who admonish it, easily enticed by pleasures. In so great, then, and so rough and stormy a whirlwind of this world, why are such frequent shipwrecks ascribed to an improvident age? Hence David excellently asked the Lord for pardon for the whole of that time, saying: Remember not the offence of my youth and of my ignorance, because then above all the heat of the body boils and is set on fire by the surge of steaming blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 7"
