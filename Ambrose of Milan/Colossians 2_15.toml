[[commentary]]
quote='''
Indeed Joseph's tunic too was bloodied as a figure of the Lord's body; and that saying of the Apostle: stripping off from himself the flesh, he made a show of all principalities and powers, what else does it show but that the body was in place of a garment, which the Lord so put off in the Passion that the divinity remained free and immune from injury?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
