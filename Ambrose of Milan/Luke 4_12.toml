[[commentary]]
quote='''
But the Lord, to prevent the thought that those things which had been prophesied of Him were fulfilled according to the devil's will, and not by the authority of His own divine power, again so foils his cunning, that he who had alleged the testimony of Scripture, should by Scripture himself be overthrown. Hence it follows, And Jesus answering said, It is said, Thou shalt not tempt the Lord thy God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So here too the devil, since he perceived him to be strong, holds out boasting, which deceives even the strong; but the Lord answered him: you shall not tempt the Lord your God. In this you recognize that Christ is both Lord and God, and that the Father and the Son are of one power, according to what is written: I and the Father are one. And therefore, if the devil puts forward 'one', meet him with the fact that it is written 'are', and distinguish 'one', so that you do not divide the power; distinguish 'one', so that you do not separate the Father and the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
