[[commentary]]
quote='''
Issachar desired the good, resting between the lots. And seeing rest, that it is good, and the land, that it is rich, he set his shoulder to labour and became a husbandman. Issachar is called "reward," and therefore he is referred to Christ, who is our reward, because we purchase him for ourselves, for the hope of eternal salvation, not with gold and silver but with faith and devotion. Hence David too says of him: Behold, the inheritance of the Lord, sons, the reward, the fruit of the womb. And Moses says of him: the reward of those who dwell about the sea. This is he who desired the good from the beginning and did not know how to desire what is evil. Of him Isaiah too says: Before the child knows how to call father or mother, he does not trust in wickedness, choosing what is good. He rested between the lots of the Old and the New Testament, or in the midst of the prophets. And therefore he appeared in the middle between Moses and Elijah, to show us that he has rest in their words, through whom very many, renouncing their sins, believe in the living God, or that they themselves are witnesses of his resurrection and of his blessed repose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 6"
