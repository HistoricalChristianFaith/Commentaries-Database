[[commentary]]
quote='''
Indeed, the Sodomites, their mind suffused with that blindness of depravity, could by no means find the door of holy Lot. For how could an ungodly mind see either the going out or the coming in of a holy man?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"
