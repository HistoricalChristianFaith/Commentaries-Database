[[commentary]]
quote='''
And his place, he says, is in peace, where the peaceful disposition is neither agitated by the waves of various desires nor shaken by the storms of avarice nor set on fire with the passion of seeking riches. He is the one who beholds the eternal things and dwells in Sion, breaking all the instruments of spiritual wars and crushing the bows with which the devil is wont to aim his fiery shafts and brand deep passions in the breasts of men. But those shafts cannot harm the just man to whom God is light, and who is so far from the horror of the reeking darkness that in him the adversary cannot have place who is wont to enter even into princes, just as he entered also into the traitor Judas, cutting down, as in a forest of trees, the portals of faith, so that he might have an entrance into his heart and take possession of the tabernacle of the eternal name, that was consecrated by the office of the apostleship which had been conferred upon him. Therefore, like a wicked usurper, he cuts down the portals that he may enter with violence; but the Lord, like a dutiful master, makes his servants to shine and, by their resplendent merits and the clarity of their virtues, illumines the darkness of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 14"
