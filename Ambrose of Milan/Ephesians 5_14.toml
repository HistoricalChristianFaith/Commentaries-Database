[[commentary]]
quote='''
Hear the voice of Jesus raising you up: Rise, you who sleep, and arise from the dead, so that the light of Christ may be poured into you for ever. His light is the Holy Spirit, who shone upon the holy apostles like fire in the dividing of the tongues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
