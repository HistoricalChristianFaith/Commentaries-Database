[[commentary]]
quote='''
But neither must we leave the parents unexcused for having preferred the younger son to the elder. At the same time we must take care that no one, while he looks to their example, makes an unjust judgement among his children, so as to think that one is to be loved and the other set aside. For from this fraternal hatreds are stirred up, and over the increase of paltry money a fratricidal crime is plotted. Let the same measure of love cherish one's offspring. Granted, however, that affection may seize something more for itself toward the more winning or the more like, the pattern of justice ought to be equal toward all. More is bestowed on a beloved child when the love of his brothers is sought for him; but more is taken away from him who is burdened with the envy of an unjust preference. Esau threatened to kill his brother, and neither brotherly kinship nor reverence for his parents called him back from fratricidal fury, and he grieved that the blessing had been snatched from him, though he certainly ought to have proved himself worthy of it by gentleness, not by crime.

But Rebekah too was preferring not son to son, but, as it were, the just to the unjust. For with a devoted mother the mystery outweighed her child: she was not so much preferring him to his brother as offering him to the Lord, knowing that he could keep the gift conferred on him; and in this she was also taking thought for the other, whom she was withdrawing from divine offence, so that he would not be entangled in heavier guilt if he lost the grace of a blessing once received.

Consider, however, a good contest between parents. Let the mother bestow affection, the father judgement. Let the mother incline with tender love toward the younger, let the father keep toward the elder the honour that nature gives. Let him honour more, let her love more. While each cherishes one, let them not both conspire toward one and defraud the other. Let there be equality amid their differing contests, and by unequal zeal let equal favour be bestowed on each through the equal love of the parents. Let the one make up what the other has lessened. Thus with devoted affection the patriarch Isaac and holy Rebekah contended so as to make neither inferior, but both equal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 2"
