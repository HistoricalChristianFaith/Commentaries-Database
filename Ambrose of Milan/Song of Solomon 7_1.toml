[[commentary]]
quote='''
How beautiful your steps have become in sandals, O daughter of Aminadab! The curves of your thighs are like necklaces, the work of a craftsman. There is no doubt that here too the steps signify the progress of the Church, or of the soul. How beautiful are the feet of those who bring the good news of peace, who bring the good news of good things (Isa. 52:7)! Surely he calls beautiful the advances of the preaching and the discourse of the Gospel, as it is said elsewhere: Pass over the rivers (Isa. 47:2), that is, run across the streams and slippery places of this world with a steady pace of the mind. That this is said of the soul's pace David plainly shows, when he declares that his soul would pass over the torrent of iniquities (Ps. 123 (124):5).

But what does it mean when it says that the steps of the Church are beautiful in sandals? We read what was said to Moses: Loose the sandal of your feet (Exod. 3:5): by which he seems to have been admonished not to be held bound by bodily fetters. So in the Song of Songs it signifies a beautiful loveliness of the soul, which uses the flesh as a sandal, and in that very sandal suffers no hindrance, but excels in the beauty of her gait. The soul therefore shoes herself with the grace of the Church, so that she may pass through the course and the passage of this life with beauty. This is done if she does not soil her sandal with the mud of the body, does not sink it in the whirlpool of vices: if she chastises her flesh, so that it may not hold her back in the race and be weighed down by the burden of thick fat. Modesty is a good sandal of the soul; a good step is in the footprint of chastity. But wisdom is the garment of the soul, and so it is written: Honor her, and she will embrace you (Prov. 4:8). Let us therefore use the body as a sandal for the works of a lower virtue: for service, not for command; for compliance, not for delight; for obedience, not for dissent; and let us set our footprint in the way of wisdom, lest some force of the torrent shut in our steps.

Therefore it was said to Moses: Loose the sandal (Exod. 3:5). It was said also to Joshua son of Nun (Josh. 5:16). But to Christ it was not said; rather it was written, when the Baptist said: After me comes a man, whose sandals I am not worthy to carry (Matt. 3:11); because those are rightly admonished to loose their sandal who could not be without sin. But he not only did not loose his sandal, but even loosed the sandals of others; because he not only kept his own body free from sins, but also gave pardon for the sins of all.

Therefore the Church, in imitation of Christ, is beautiful, and in her sandals washed clean of every fault. And perhaps when she speaks wisdom among the perfect, she is beautiful in her upper members; but when men also of a lower rank or learning follow the Word, do not forget the order of the faith, and keep the precepts of the priest, she is beautiful in her sandals. Often the clergy has erred, the priest has changed his opinion, the rich have sided with the earthly king of this world; the people have kept their own faith.

Hence we may also rightly say of the Lord Jesus that, even in those things that are bodily, the Word has beautiful steps, when moral matters are discussed. And perhaps the apostles are sent with bare feet for this reason, that their discourse may not be overshadowed but may shine forth. And so the Church is the daughter of Aminadab, that is, of one who is willing, or well pleasing; because one who is willing, or well pleasing, gathered her, and she is beautiful in sandals. And rightly it is added:

The curves of your thighs are like necklaces, the work of the hands of a craftsman; so that the ornaments of the Church's posterity might be sung. For by the thigh we recognize the emblem of generation, according to that saying: Gird your sword upon your thigh, O most mighty (Ps. 44 (45):4): by which it is signified that the Son of God, when he had emptied himself, girded with the divinity of the Word and shod with human generation, would come forth from the Virgin to give salvation to all. Now the "curves" are said to be precious ornaments that are customarily hung on the necks of matrons. So great an advance of the Church, then, is signified, that it is compared to the most precious ornaments, and to the necklaces of those who triumph; for these are the ornaments of warriors. Hence Symmachus too said epitrachelia, that is, things worn around the neck. Whether, then, it is the generation of Christ from the Virgin or the propagation of the Church, it has adorned the necks of the faithful, in appearance indeed as with necklaces adorned by the hand of a craftsman, but in truth with spiritual insignia of true virtue. In short, this whole description of the members of the Church is full of beauty and praise. For also:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
