[[commentary]]
quote='''
But there is the fear that the judge may be too severe: consider whom you have as judge. Surely the Father has given all judgment to Christ. Will he, then, be able to condemn you, whom he redeemed from death, for whom he offered himself, whose life he knows to be the reward of his own death? Will he not say: What profit is there in my blood, if I condemn the one whom I myself have saved? Then again, you consider the judge; you do not consider the advocate. Can he pronounce a more severe sentence, who does not cease to intercede that the grace of the Father's reconciliation may be bestowed on us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 6"
