[[commentary]]
quote='''
After this there followed the oracle of God, saying: to your seed I will give this land from the river of Egypt as far as the great river Euphrates. He who had shown the glory to come had also to promise the merits of the virtues that were to be conferred; for he himself is both the helper of those who labour and the rewarder of the innocent. Egypt here is the name not of a region but of a river. For so the ancients called the Nile, whether because it had itself given its name to the region or had received it from the region's name. Thus the Greek poet too testifies that it is so, saying: στῆσα δʼ ἐν Αἰγύπτῳ ποταμῷ νέας ἀμφιελίσσας ('I stationed the curved ships in the river Aegyptus'). But it is narrow and mean to think that he pledged earthly things by heavenly signs. And so let us consider whether he did not perhaps promise perfect blessedness and the consummation of good merits. For perfect blessedness seems to consist of these three, the goods of the body and of the soul and the accidental goods, which the Greeks called ἐκτός (external), so that of the body there should be purity, patience or temperance, of the soul prudence and justice. The river Egypt, then, seems to signify bodily things, whence that river itself was also called Gihon, because man was fashioned from the earth; but the Euphrates signifies the things that are of the soul, in that justice is the fount of the other virtues, the one that illuminates the other virtues. For prudence without justice does harm; fortitude too, unless justice tempers it, is an intolerable insolence, nearer to fury than to reason, to domination than to liberty; sobriety and temperance are private goods and of no use to anyone, unless you cultivate devotion with just reverence toward God and with a faithful mind: justice alone it is that embraces all the virtues and commends them all. Accidental goods, too, are business dealings and trades or farming, the fitting gains of labours and of rural works. There are also accidental goods of the body, soundness and the comfort of good health, comeliness, strength, which befall with time and change with age.

You should not think this threefold grace a slight one. For you have perfect perfection in the Gospel. For when the Lord Jesus says to that lawyer: you shall love the Lord your God, he commands that the justice of the soul be kept. For if it is just that parents be honoured, how much more ought honour to be paid to the parent of all? Again, when he says: you shall not kill, you shall not commit adultery, you shall not steal, you shall not bear false witness, he admonishes that the virtues of the body be kept. And in the later passage, when he says: there is no one who leaves house or parents or wife or children for the kingdom of God and does not receive seven times as much in this time; in the world to come he shall possess eternal life, does he not promise an increase of the accidental goods together with the reward of soul and body?

These things, which holy Scripture expresses in simple words, Aristotle and the Peripatetics proclaim and extol in a kind of lofty buskin, and their own people testify that it is also a doctrine of Pythagoras. But which of them equalled Abraham in time, which of them equalled God in authority and wisdom, God by whose oracle Abraham acknowledges the gift of this threefold grace?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
