[[commentary]]
quote='''
You have this too, said by the Lord in Isaiah: go out from Babylon, fleeing from the Chaldeans, that is: even if you have entered into the confusion of vices, go out. You ought not to have entered; but you went in, the law of the flesh compelling you and taking you captive in the law of sin. Go out, depart even if late, strip yourself of a heavy servitude. You could not help entering into sin through frailty; it is granted to you to go out of sin through sobriety. Go out, then, from Babylon, fleeing from the Chaldeans. Babylon is confusion, which does not keep the order of the virtues; for it is with a mind confused by enticements that we offend. The Chaldeans are those who search out the courses of the stars with the zeal of a vain superstition and sow the errors of ungodly paganism. Flee from them, lest they capture you, lest they bind you in the heavy snare of captivity. Abraham was a Chaldean, but he fled from the Chaldeans, and that before the Law; you have been born already under the Law: flee from the ungodly. He spurned the inheritance of his fathers so as to possess that of faith; you, abandon the succession of the body, acquire the inheritance of devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Next, at once, there is another advance of the passing Word, because the soul went out at his word, that is, following his word she went out from the body, raising herself from its dwelling and making herself a stranger to it, that she might be present with God and be a fellow citizen of the saints; for we cannot at the same time be of the household of the flesh and of God. Therefore in this place the soul is said, as I said, to go out when she withdraws herself from the pleasures of the body. Indeed it is written: Go out from Babylon, fleeing from the Chaldaeans. The Hebrew is admonished by the prophetic address to flee, not of course the regions of Babylon, but its ways, since there are Hebrews who are in Babylon and yet show by their ways that they have gone out from Babylon. For those too of whom the prophet says that they sat by the rivers of Babylon were indeed sitting in the region of Babylon, but they were not in its vices and confusion. For how were they in that confusion of vices who wept, doing penance because they had fallen from the ark of devotion and faith and from the merits of their fathers' virtue? But the soul that goes out in the Word seeks the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
Accordingly it is written: Go out from Babylon, fleeing from the Chaldeans (Isa. 48:20). Not, certainly, that the Hebrew should flee the regions of Babylon, but its ways, as he is admonished by the prophet's address; since there are Hebrews who are in Babylon and yet show by their ways that they have gone out of Babylon. For those too of whom the prophet says that they sat upon the rivers of Babylon (Ps. 136 (137):1) sat indeed in the region of Babylon, but were not in its vices and confusion. For how were they in that confusion of vices, who wept, doing penance because they had fallen from the ark of devotion and faith and from the merits of their fathers' virtue?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
