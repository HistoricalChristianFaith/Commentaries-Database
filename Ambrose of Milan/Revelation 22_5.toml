[[commentary]]
quote='''
We shall go there, where there is a paradise of delight, where Adam, who fell among robbers, no longer knows how to weep for his wounds, where the robber himself also rejoices in a share in the heavenly kingdom, where no clouds, no thunders, no lightnings, no storm of winds, nor darkness nor evening nor summer nor winter will vary the changes of the seasons; there will be no cold, no hail, no rains, no use of this sun or of the moon, nor the globes of the stars, but the brightness of God alone will shine. For the Lord will be the light of all, and that true light which enlightens every man will shine for all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
