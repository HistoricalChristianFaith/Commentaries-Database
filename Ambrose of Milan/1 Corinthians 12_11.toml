[[commentary]]
quote='''
The Spirit spoke also in the patriarchs and the prophets, and finally the apostles then began to be more perfect after they had received the Holy Spirit. Thus there is no separation of the divine power and grace, for although "there are varieties of gifts, yet there is the same Spirit."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25202.html'
source_title="On the Holy Spirit 2.12.138"


[[commentary]]
quote='''
It belongs to God's justice that he divides and to his power that he divides according to his will or because he wishes to give to each one what he knows will be of profit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%25201-10.html'
source_title="LETTER VII.7"

[[commentary]]
quote='''
At the same time we must consider this, that the Spirit is not taken away except by the will of the Lord, just as he is not given except by the will of the Lord. And when he is given, he certainly does not work as one compelled, but is distributed according to his own will, as it is written, where the apostle says: But all these things one and the same Spirit works, distributing to each one as he wills. Since, then, he is not taken away except by the will of the Lord, it is clear that the will of the Trinity is one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 14"
