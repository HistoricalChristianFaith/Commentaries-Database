[[commentary]]
quote='''
This tongue of fire, then, David too received, so that, kindled by the ardour of divine knowledge, he might say: Make known to me, O Lord, my end. He is not asking about his death — for that is no end for one who will rise again —, but he asks about that end of which the Apostle said: That is the end, when the Lord Jesus will hand over the kingdom to God and the Father and will make void all principalities and powers, and when death will be destroyed last of all, so that evils may cease and eternal goods succeed. And therefore it was said: Grief, sadness and sighing have fled. This end Paul too was working in men, saying: Or who is it that makes me glad but he who is made sad by me? For by rebuking he stirred up grief, sadness, sighing, so that they might repent, and so deserve an irrevocable pardon and a salvation of which God would not repent. That, then, is the true end, which will be the end not of one but of all. How, then, did he say "my end"? But consider who is speaking. A man, surely: either one of men, sharing the community of substance, or one who is portrayed after the pattern of all and is being trained to the perfection of the consummate man.

Hence he also added that the number of days which is should be made known to him, so that he might know what is lacking to him — lacking, surely, for perfection, not for the life of this body, from which the prophet David longed to be released, saying: Woe is me, that my sojourning is prolonged! I have dwelt with the dwellers of Kedar. Indeed, he wished to know the number of days, not of nights as well. For here there are days and nights, but there days alone, there light perpetual and lasting. And therefore he added: which is. "Which is", he says, not "which passes away"; heaven, indeed, and earth shall pass away, but faith abides, and the day of Christ, because he is the same yesterday and today and for ever. And learn what number he seeks: In my Father's house, he says, there are many mansions. The Lord Jesus, then, gives each one a place, that is, a mansion fitted to the merits of each; each one, indeed, in his own order. He went before, then, to prepare a place for those who believe in him; hence he also says: If I go away and prepare a place for you, I come again to you and will summon you to myself, that where I am you also may be. And where I am going you know, and the way you know. There is, then, a way by which Christ, rising again, ascended. And he indeed ascended above all the heavens to the seat of God, but men, those who deserve it, ascend from the first heaven to the second, and then from the second to the third, and from that, through the divisions, almost to the seventh heaven, and into the very vault and summit of heaven. If, then, there is a number of ways and a number of mansions, surely there is a number of days through which one reaches the height of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
In that lampstand an image shines forth, by which we may understand at the last. For the holy man comes to know at the end, and attains perfect wisdom with the advance of age, saying: Make known to me, O Lord, my end, and what is the number of my days, that I may know what is lacking to me. What is the end, if not that when the kingdom is delivered up to God the Father, when the hidden things of wisdom are revealed? This end of our contest the prophet was seeking, desiring to know what was lacking to his perfection; for the end of our discipline and of our studies is perfection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 7"
