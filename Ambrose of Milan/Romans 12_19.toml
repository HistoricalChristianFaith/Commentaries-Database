[[commentary]]
quote='''
This is written lest another's wrath draw you into sin when you want to offer resistance, when you want to be avenged. You can take the fault from him and from yourself if you decide to yield to the other.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252061-70.html'
source_title="Letter 63.100"

[[commentary]]
quote='''
And see whether by 'on this way' he does not mean that indignation must be guarded against in this course of our whole life, because anger often leads even the innocent into crime; for while we grow angrier than is just and wish to restrain another's sin, we commit graver sins. Therefore the Apostle: Not avenging yourselves, he says, dearly beloved, but give place to wrath; that is, let us turn aside from it, lest it seize us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 13"
