[[commentary]]
quote='''
There follows: may the Lord bring him help upon the bed of his pain; all his bedding you have turned in his weakness. What is the bed of pain but the flesh of weakness? And rightly the bed of pain, because it is the body of death, from which the Apostle prays to be freed, so that he may rise up as from a kind of tomb, in which the soul lies sick and reclines as on a kind of couch. Symmachus said the bed of misery, Aquila the pallet of misery; the Seventy thought it should be said more expressly the bed of pain. These verses, then, are to be used with those who are held for a long time by weakness of body, so that they may have the medicine of God, by which they may deserve to be made whole. The bed of the soul, then, is the weak flesh, with whose sickness our soul suffers; and if it has the Lord as its helper, he says to it: rise, take up your bed and go into your house. Strengthened by this word of God, he who was sick rises and takes up the bed on which he was lying and returns to his former state of health. This is to go back into one's house: to dwell in the dwelling of the most robust health. He who dwells there rules; he who rules has the grace of virtue supporting him. But the Lord also turns all the bedding in the weakness of the one who languishes, to whom he deigns to be present. What is turned changes its state, either from health into sickness or from sickness to health. Here, then, he who is sick turns himself towards the remedy of health.

So, then, the Lord Jesus, although he was wounded for our sins, yet did not remain in that weakness, but turned himself for the better, for the salvation of all. Thus weakness was undone by the Passion, death by the resurrection. As, then, he turned himself for the redemption of the peoples and did not feel the sting of death or the weakness of the wound, so he turns to life him who believes in him, even when gravely sick, so as to free him from death. All the bedding, then, that is, the weakness of all men, he turned in his own weakness. For he took up the weaknesses of all in his own flesh, raised himself upon the cross, and turned the weaknesses of all in the weakness of his own body. Whence Isaiah says: by his bruise we have been healed. Wrestlers have this practice: they put themselves underneath those with whom they are engaged and wrestle, so that they seem able to be overpowered, and suddenly, when they are thought to be overcome and about to be thrown down, they turn themselves by a certain skill so as to throw off the one on top; he falls who was being carried, and he who was carrying is found on top, so that he lays low the one pressing upon him. So in the spiritual wrestling-ground the Lord Jesus, taking up our burdens, put himself underneath in that bout of his Passion and, in the semblance of weakness, so that the adversary might judge him a man like the rest, whom he could easily overpower, he laid aside the arms of divinity and put on the covering of humanity. Sure of victory, the tempter came nearer; he wished to wound him in the rib with the soldier's spear, reckoning that he too, like Adam, could be laid low through a rib. But the Lord Jesus, wounded in the side, brought forth life from the wound, emptied out all sin, cast down the adversary, from whom he snatched the death of the thief, and in that death, in that burial of his body, when he was thought overpowered, thrown down, he turned himself by his own power: the adversary fell, the Lord rose again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Whence David too says: May the Lord bring help to him upon the couch of his pain (Ps. 40 (41):4); for how can that be a couch of pain, when that which has no feeling cannot feel pain? But the body is a body of pain, as it is a body of death: Unhappy man that I am! who will deliver me from the body of his death (Rom. 7:24)?

And since we have brought in a little verse in which we made mention of the Lord's body, lest perhaps it should trouble anyone reading that the Lord took up a body of pain, let him remember that he both grieved and wept at the death of Lazarus, and was wounded in his passion, and from the wound came forth blood and water, and he breathed out his spirit (John 11:35). Water for the washing, blood for drink, spirit for the resurrection. For the one Christ is for us hope, faith, love: hope in the resurrection, faith in the washing, love in the sacrament. Yet as he took up a body of pain, so also he turned the bedding in sickness; because he turned it to the benefit of human flesh: for by the passion sickness was undone, death by the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
