[[commentary]]
quote='''
The parasites standing about, who used previously to despise you, now suddenly salute you, take you home, rouse you to merriment, incite you to spending, saying: Come therefore and let us enjoy the good things that are present and let us speedily use the creatures as in youth. Let us fill ourselves with costly wine and with ointments, and let not the flower of the time pass by us. Let us crown ourselves with roses before they be withered: let no meadow escape our riot: Let us everywhere leave tokens of our joy: For this is our portion and this is our lot. And truly their whole fortune (sors) is made, but you remain bereft (exors) of your possessions.

Not such lots (sortes) has Scripture pointed out to you, not among the midst of such lots does Holy David remind us that we should sleep, saying: If you sleep among the midst of lots; for if you had slept among the midst of those lots, that is, of the Old and the New Testament, the greed for money would never have immersed you in the whirlpool of most wicked usury, but the grace of spiritual faith would have given you silver, and would have formed you in the likeness of gold through the instruction of divine wisdom. But if we have accepted this one testimony of the divine Scripture, and have refused that luxurious banquet, certainly such a man also could have been saved if he had clung to divine wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 5"
