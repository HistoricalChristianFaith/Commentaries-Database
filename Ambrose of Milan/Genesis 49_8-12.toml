[[commentary]]
quote='''
But who is so tuneful in songs as this man in his utterances, who was heard by the whole world, who is heard through all peoples, through all ages? Who, sounding the different notes of the seven tones, was so sweet in his measures as this man, who resounded with the sevenfold grace of the Holy Spirit? Though loosened in his limbs, yet raising himself in soul and lifting himself up in spirit, he looked down with lofty mind on the harmony of his body, as of a lyre, destroyed now that the framework of his limbs was dissolved; he did not seek it again, but let it lie idle on the ground, while he himself soothed himself with an inward song and delighted himself with a prophetic melody, saying: Judah, may your brothers praise you. Your hands are upon the back of your enemies; the sons of your father will worship you. A lion's whelp is Judah: from the shoot you have gone up for me; lying down you have slept like a lion and as a lion's whelp. Who will rouse him? And below: He will wash his robe in wine and his mantle in the blood of the grape. His eyes are cheerful from wine, and his teeth whiter than milk. What song is sweeter, what sound more delightful, than the remission of sins and the resurrection of the dead? This song holy David, that instrument of the divine voice and interpreter of the Lord's word, sang on the spiritual lyre. With these measures of grace he soothed that lofty soul and mind. With this song he eased the rough things of this world, with this sound he softened the hard things of the world, with this psaltery he broke the terror of death, with this sweetness of strings he trampled on the underworld.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 9"
