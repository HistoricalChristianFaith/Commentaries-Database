[[commentary]]
quote='''
Hence it too says in the Song of Songs: I am a wall, and my breasts are like a tower. A good wall, which the Lord has painted, as he himself says: on my hands I have painted your walls, and you are always in my sight. A good soul, which has God as its watchman and is in his hands, like the prophetic soul, which is commended into the hands of the Lord as a spirit, and which is in the sight of God; for the eyes of the Lord are upon the just, as it says itself: I was in his eyes as one who finds peace. She has good towers who has both the word concerning intelligible things and the discipline concerning moral things. And therefore this soul, having the grace of her breasts, enters into the gardens, and finding there the Bridegroom sitting and discoursing with his friends, she says: you who sit in the gardens, make your voice heard to me. To me, she says, not to the friends. Flee, my brother: she urges the Bridegroom to flee, because now she herself too can follow him as he flees earthly things. She tells him to be like the little roe that escapes from the nets; for she too wishes to flee and fly away above the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
