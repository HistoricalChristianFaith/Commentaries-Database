[[commentary]]
quote='''
Pass over, then, that is, flee from the earth, where wickedness is, where avarice is. For this reason David says to you: Turn aside from evil and do good. To turn aside is surely to flee; and evil is on earth, the good is in heaven. Hence he also added: Seek peace and pursue it; peace is in heaven. Indeed, coming from heaven, he said: Peace I give to you, my peace I leave with you. Since, therefore, evils are to be fled and turned aside from, and evils are on earth, iniquities on earth, let us flee earthly things, lest iniquities seize us, as they seized even holy David, as he himself testifies, saying: My iniquities have overtaken me, and I was not able to see, because the eye of the soul is blinded by the smoke of iniquity, so that it does not see the things that are full of light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
