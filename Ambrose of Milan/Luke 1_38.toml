[[commentary]]
quote='''
Behold now the humility, the devotion of the virgin. For it follows, But Mary said, Behold the handmaid of the Lord. She calls herself His handmaid, who is chosen to be His mother, so far was she from being exalted by the sudden promise. At the same time also by calling herself handmaid, she claimed to herself in no other way the prerogative of such great grace than that she might do what was commanded her. For about to bring forth One meek and lowly, she was bound herself to show forth lowliness. As it follows, Be it unto me according to thy word. You have her submission, you see her wish. Behold the handmaid of the Lord, signifies the readiness of duty. Be it unto me according to thy word, the conception of the wish.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then behold she says the handmaid of the Lord; be it done to me according to your word. See her humility, see her devotion. She calls herself the handmaid of the Lord, she who is chosen as his mother, nor was she lifted up by the sudden promise. At the same time, by calling herself handmaid she claimed for herself no prerogative of so great a grace, as one who would do what she was bidden; for, about to bear the meek and humble one, she too had to show humility. Behold the handmaid of the Lord; be it done to me according to your word. You have her obedience, you see her wish; for behold the handmaid of the Lord is the readiness of service, be it done to me according to your word is the conception of the wish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
