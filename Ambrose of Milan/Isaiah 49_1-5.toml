[[commentary]]
quote='''
Let us hear, then, what he says: Thus says the Lord, who formed me from the womb as his servant, to gather Jacob and Israel to him. We observe, then, that he took on the form of servitude for the gathering of the people. Hear, O Jew: you both make an insult out of grace and turn to unbelief the very thing on account of which you ought rather to have believed. He came to call you, and you revile him. He said "a servant from the womb". Hear, Arian, from what womb; run back a little above: From the womb, he says, of my mother the Lord called my name. Let us hear what his name is, by which the Father called him: Behold, a virgin shall conceive in the womb and bear a son, and his name shall be called Emmanuel, which is interpreted: God with us. For what other name of Christ is there but "Son of God"? Take another. Gabriel, indeed, had also said to Joseph concerning Mary: She shall bear a son, and you shall call his name Jesus. Take the voice of God: And you, Bethlehem of Judaea, are not the least among the princes of Judah; for out of you shall come forth a prince who shall rule my people. Mark the mystery: from the womb of the virgin the same one came forth both servant and Lord, servant to work, Lord to command, that he might root the kingdom for God in the minds of men; both are one, not one from the Father and another from the virgin, but the same, who before the ages was from the Father, himself afterwards took flesh from the virgin. Therefore he is called both servant and Lord: servant for our sake, but by the unity of the divine substance God from God, Prince from Prince, equal from equal; for he did not beget one degenerate, in whom he declared that he was well pleased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
