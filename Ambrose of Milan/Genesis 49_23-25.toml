[[commentary]]
quote='''
And so, by raising up his only-begotten Son, he made void the counsel of those who cursed — whence Isaiah too says: vain is the counsel of your spirit — and the reproaches which they aimed as though shooting arrows he loosed, every one. He crushed the might of those who trusted in their own powers and not in God. Hence, he says, Israel prevailed from the God of your father. And my God helped you. Who is it that strengthened Israel and helped the Son, except God the Father alone, who said: Jacob my servant, I will receive him; Israel my chosen, let my soul receive him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"
