[[commentary]]
quote='''
Behold, your mina has gained ten minas. A good order: being about to call the Gentiles and to order the killing of the Jews, who did not want Christ to reign over them, he first set out this comparison, lest it should be said: 'He had given nothing to the people of the Jews by which it could become better', or: 'What is required of one who has received nothing?' This is no ordinary mina, for which above the woman of the Gospel, because she had not found it, lit a lamp, sought it with the light brought near, and rejoiced when it was found.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
