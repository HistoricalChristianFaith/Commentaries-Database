[[commentary]]
quote='''
The finger of God, then, is the Spirit of God; for God is spirit and has nothing bodily in his substance, but is wholly spirit. He, then, casts out the demon by the Spirit of God who casts it out by the finger of God. Hence holy David too says: For I will see your heavens, the works of your fingers, that is: the heavens are the works of your Spirit, as it is also written: By the word of the Lord the heavens were established, and all their power by the spirit of his mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
