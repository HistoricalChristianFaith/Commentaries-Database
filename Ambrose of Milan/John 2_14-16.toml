[[commentary]]
quote='''
The sellers of sheep and oxen too I take to be those who, as foul auctioneers, hunt for some market out of another's labor or simplicity; or else, because the sheep and oxen are cast out and the doves are ordered to be taken away, the Jewish people appears to be shut out; for Ephraim is like a dove, in that the Lord hated both their successions and their labors. The bronze is poured out so that grace may be gathered; the table of the money-changers is overturned so that the Lord's may be put in its place; the altar is thrown down so that the altars may be raised up.

And he did this not equipped with any band of men or with riches, but with a scourge of cords he struck the crowds, and no one dared to resist. And now he uses a rod, now a scourge — for the rod is upright, the rod of your kingdom — a rod, to correct; a scourge, to persuade. There it is straight. Here it is a moral precept, bent as it were, by which the sinner's conscience is scourged as with a pliant lash. For the terrors of the prophets are one thing, the persuasions of the apostles another: yet in both is the discipline of one Word. And therefore he made a scourge of cords, because the lines have fallen he says to me in splendid places; for my inheritance is splendid to me; for lines is the name of the cords with which surveyors divide the boundaries of fields to be measured out. And therefore as a good surveyor he was marking off the boundaries of the Synagogue, and ordered the profaners of the Church to go out of the temple; for a new measurer of fruitful souls had come, who would measure the kinds of fields, not their extent.

Yet beautifully no measure of possession is enclosed by stretched lines, nor are the limits of faith bounded as though of some defined thing, but by a scourge that ranges freely without measure the borders of the Church are extended; the Jews are banished, not into some prescribed exile, but into an unending one, so that nowhere in the world would a place remain for the synagogue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
