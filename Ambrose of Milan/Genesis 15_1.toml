[[commentary]]
quote='''
And therefore, since he did not seek a reward for himself from man, he received it from God, as we read it written that after these words the word of the Lord came to Abraham in a vision, saying: Fear not, Abraham, I will protect you. Your reward shall be very great. The Lord is not slow to reward: he both promises quickly and bestows much, lest through some delay repentance at having despised present goods should steal upon weak spirits; and he repays as it were with a kind of generosity that pays interest, so as to restore more abundantly to him who was not captivated by the offer of present things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"

[[commentary]]
quote='''
To these things he has joined the oracle of the Lord, who says: Do not fear, Abraham; I will protect you. Your reward shall be very great. I ask, why after the outcome of the war? The time for pledging a reward was now. For he would have done something less wonderful had he attacked the enemy in pursuit of God's promise. Sure of victory, he would have gone forth to a triumph, more as one invited than as one eager for glory or ready to avenge the grief of his devotion. The purpose of a devout mind does not seek a reward, but holds as its reward the consciousness of a good deed and the accomplishment of a just work. Let narrow minds be enticed by promises, let them be roused by hoped-for rewards: the good mind, which has taken up the contest without the bond of a heavenly answer, gains for itself the fruit of a twofold praise, so that it lays up the credit both of a most confident fortitude and of a most complete devotion. This is fitting to be judged of holy Abraham, because he both thought it right, in his just griefs, not to disdain the divine favour, and struck down the enemy in contempt of the danger, which he thought it glorious for him to undergo for the avenging of devotion. In this also is proclaimed the justice of God, who bestows recompense on devout minds not out of the necessity of a promise but out of regard for his own equity, judging it fitting that those who serve as soldiers without any recompense of human reward should have a prize laid up in the goodness of him to whom they have judged their souls ought to be devoted; and at the same time because for the glories of war a prize is provided from the profit of the victory itself or from the favour of men, whereas the prize of devotion and frugality, of purity and of the other, as it were private, virtues is paid by God. The things that are manifest to men, men themselves reward; but not all things are manifest: some are manifest, others uncertain, and above all the hidden things of the heart. Hence he too says: The uncertain and hidden things of the heart you have made manifest to me; and of these God is the beholder and searcher. He would not, then, have promised Abraham a great reward, had he not judged his soul pure from all contagion of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 8"
