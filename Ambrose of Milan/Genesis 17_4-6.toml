[[commentary]]
quote='''
Let us return now to the gift of God, than which nothing is fuller. For what is better than wisdom, what worse than vanity, what more baneful than superstition? Therefore, as to one to whom he had promised the fullness of perfection, he says: I will increase you greatly and set you among the nations, and kings shall come from you, because to the one who is faithful the whole world is of riches, and he is increased, not diminished like the fool. Abraham is set among the nations, that is, his faith is transferred to the nations and to the kings of the world, who have believed and subject themselves to the Lord Jesus, to whom it is said: kings shall offer you gifts. Nor is this absurd, because from the race of Abraham there will be not only kings in dignity, but also those kings who are not slaves to sin; nor does malice conquer those over whom death has no reign. We have learned too that the findings of the good mind are royal and princely, a mind which, like Abraham, has no yield of middling offspring, but abounds in royal ones. To it all the earth has been given for a possession, so that it may have dominion over the body and not be captive to the pleasures of the flesh, but that the flesh, as though bound by due service, may serve the mind. But according to the person of Abraham the mystery of the Church is evident, the Church which has possessed the whole world by the inheritance of faith; he is rightly called the chosen father of sound, the father of faith, the father of devout confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
