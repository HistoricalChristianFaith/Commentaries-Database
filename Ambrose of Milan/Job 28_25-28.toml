[[commentary]]
quote='''
The Father, then, who knows all things, the weight of the winds, the measure of the waters, himself saw wisdom and declared it through his prophets, since the Father declared wisdom and searched it out, as the Son too declared the Father, whom nothing escapes, and he said: O man, why do you wish to know the depths of wisdom, which are above you? To fear God is wisdom, and to abstain from evils is discipline.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
