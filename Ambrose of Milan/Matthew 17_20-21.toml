[[commentary]]
quote='''
And to show us plainly a mountain of this kind, elsewhere too, when he had commanded a demon to go out of a man and the apostles asked for what reason they themselves had not been able to cast it out, he says: This kind is not cast out except by prayer and fasting, and he added: If you have faith like a grain of mustard seed, you shall say to this mountain: Pass from here to there, indicating with his hand which mountain it was that perfect faith could move. For perfect faith is compared to a grain of mustard seed, as the Apostle says: If I have all faith so that I move mountains, but have not charity, it profits me nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
