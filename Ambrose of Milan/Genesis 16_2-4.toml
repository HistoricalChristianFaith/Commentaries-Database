[[commentary]]
quote='''
But perhaps someone may say: 'How can you set Abraham before us to be imitated, when he received a son from a handmaid? Or what does it mean that so great a man, whose great works we admire, was liable to this error?' And therefore, lest we should seem, in the manner of sailors, to have steered clear of this place, which most think full of shoals, it is my concern to explain its reason. I do not deny that Abraham received a son from a handmaid, so that you may know that Abraham was not of some higher nature and substance, but one of the number and the frailty of all men. Indeed, he was also called from the region of the Chaldaeans, who, we have learned, were more intent on vain superstition than the rest; and therefore he found greater grace with God, because he renounced what was behind and stretched himself out to what lay before, so as to follow God. For he is set before you for imitation, so that you too may observe that, if you renounce your sins, you can merit the Lord's mercy.

Yet it may trouble some that he was already speaking with God and went in to the handmaid, as it is written that Sarai said to Abraham: Behold, the Lord has shut me up so that I do not bear. Go in, then, to my handmaid, that you may make sons from her. And so it was done. But let us consider first that Abraham lived before the Law of Moses and before the Gospel: adultery did not yet seem to be forbidden. The penalty of a crime dates from the time of the Law, which prohibited the crime, and before the Law there is no condemnation of the guilty, but only from the Law. So Abraham did not offend against the Law, but came before the Law. God in paradise, though he had praised marriage, had not condemned adultery. For he does not will the death of the sinner, and therefore he promises what belongs to reward and does not exact what belongs to punishment. For he prefers to call us forth by gentle things rather than to terrify us by harsher ones. You too sinned when you were a gentile: you have an excuse. You came to the Church, you heard the Law: You shall not commit adultery: now you have no excuse for the fault. Yet since my discourse is with those who have given in their names for the grace of baptism, if anyone has committed so great a crime, let him know that pardon will be granted him, but as to one who has committed a crime; and let him know that for the future he must abstain. Indeed, to that adulteress whom the scribes of the Pharisees brought before him in the Gospel, the Lord forgave what had gone before, but he said: Go, and from now on see that you sin no more. What he says to her, he says to you. You committed adultery as a gentile, you committed it as a catechumen: you are forgiven, it is remitted through baptism; go, and after this see that you sin no more. You have one defence of Abraham.

The second is this: that it was not because he was inflamed by the ardour of some roving lust, not because he was captivated by the beauty of a wanton form, that he set the marriage bed below union with the handmaid, but from the desire to seek posterity and to propagate offspring. Even after the flood the human race was still scarce; it was also a matter of religion, lest anyone should seem not to have paid his debt to nature. Indeed, the daughters of holy Lot also had this reason of seeking posterity, lest the human race should fail. And therefore he cloaked a private fault with the plea of a public duty. Nor is it without purpose that the wife is introduced as the author of the deed, so that the husband may be excused and not be thought to have been carried away by a roving error, and at the same time so that women may learn to love their husbands and not to be agitated by a vain suspicion of a concubine, or to envy their stepchildren if they themselves have not received children. It was the good wife's concern to excuse her barrenness before her husband, and, lest she should be the reason her husband had no children, she urges him to go in to the handmaid. This Leah did, and Rachel afterwards. Learn, woman, to lay aside jealousy, which often drives women into fury.

But I also warn you, men, especially you who are making your way to the grace of the Lord, not to mingle with an adulterous body — he who indeed joins himself to a harlot is one body — and not to give women this occasion of divorce. Let no one flatter himself on the laws of men. Every unlawful intercourse is adultery, and what is not lawful for the woman is not lawful for the man. The same purity is owed by the husband as by the wife. Whatever is committed with one who is not a lawful wife is condemned under the crime of adultery. So you have observed what you ought to beware of, lest anyone show himself unworthy of the sacrament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"

[[commentary]]
quote='''
There is also a third, which the authority of the apostle Paul grants us, who says: 'those things which Abraham did, in receiving offspring from a handmaid, were done as a figure and are spoken according to allegory'. It is allegory when one thing is done and another is figured, as the Apostle himself also teaches, saying: You who wish to be under the Law, have you not read the Law? For it is written that Abraham had two sons, one from the handmaid and one from the free woman. But he who was from the handmaid was born according to the flesh, and he who was from the free woman through the promise. These things are said through allegory; for these are the two covenants, the one from Mount Sinai, bearing children into slavery, which is Hagar, showing that two peoples flow from Abraham's generation: one of the Jews, which is a slave to the syllables of the Law, because it seems to have been begotten from the handmaid into slavery; the other the Christian, which has received the freedom of heavenly grace for the remission of sins. So what you think to be a sin you observe to be a mystery, by which the things that were to come in later times were being revealed. Indeed, he added: But you, brethren, are sons of the promise according to Isaac. And 'therefore' he says 'do not seek the works of the Law', since a man is not justified by the works of the Law except through the faith of Jesus Christ, and so that you may know that he is speaking to Christians: we too have believed in Christ Jesus, that we may be justified by the faith of Christ and not by the works of the Law. We acknowledge, then, that these things which happened in figure were not a crime for them, but they will be for us, if we will not take warning from what was written for our correction; rather let us strive that, since we are sons of the free woman, who is Sarai, we may not be slaves to the snares of the Law, since Abraham kept the free woman and cast out the handmaid.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
