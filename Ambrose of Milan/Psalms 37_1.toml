[[commentary]]
quote='''
All divine Scripture is either natural, or mystical, or moral: natural in Genesis, in which it is set forth how heaven, seas and lands were made and in what manner this world was established; mystical in Leviticus, in which the priestly mystery is contained; moral in Deuteronomy, in which human life is shaped according to the precept of the Law. Hence also the three books of Solomon seem to have been chosen out of very many: Ecclesiastes concerning natural things, the Song of Songs concerning mystical things, Proverbs concerning moral things.

But since the body of all the psalms is one, nothing in them is therefore divided and set apart; rather, as the occasion offered itself, the discipline of instruction of this kind has been carried on with nothing left out. For it most evidently contains the natural, by speaking of angels and powers, of the sun and moon, of the stars and the light, of the heaven of heavens and the water that is above the heavens: for he spoke, and they were made; he commanded, and they were created. He established them for ever and ever; he set a precept, and it shall not pass away. And he spoke of mystical things, when he wrote of hidden things and of the ointment of the sacred anointing and of the completion of the tabernacle. Their grace is manifold, since the Lord spoke in the prophets at sundry times and in divers manners. For he both foretold that the Son of God would come as the prince of priests, and the titles "for the winepresses" declared that he would suffer for us and would cleanse our sins with his blood, and the psalm "of the resurrection" expressed that he would rise again; and another title afterwards, in which "his land was restored", indicated also that the change of all things was to come through the sacraments of faith. And of moral things he wove together a great deal, and showed the various kinds of virtues, and gave precepts for living, by which he healed the sores of our errors, and renewed human ways, and changed our inmost affections, as Psalm 33 (34) teaches, which Saint Peter too fixed in his epistle as a remedy upon our hearts, and also this one, which has been set before us in today's reading. For these above the rest are found to be ethical, but this one, which is inscribed the thirty-sixth, is the more extensive. For although that one is very sweet and clear, this one is yet sweeter, because that one taught me to restrain my tongue from evil, this one to cease from anger and to leave off indignation; that one enjoined me to speak without guile, this one, which has shown the rewards of meekness, has trained me to be meek. What greater remedies are there for the human heart than meekness and simplicity, by which every pain of an injury received is relieved and every stain of crime is shut out?

To these remedies, then, let us put our hand, so that we may cure our own wounds, lest, if we wish to say that we can cure others, it be said to us: Physician, cure yourself. Therefore, as is customary not only among physicians but also among the common people, that few profess medicine, yet very many say that they know some of its remedies, or as the physicians' boys do, let us too carry a remedy to the needy with another's medicine. Let the rich man call in the master, the poor man the assistant. Let him who grasps the height of the perfect take from the master himself; let him who desires plainer things feed in the valley, as a little child who fears the river drinks from the brook, and one who dreads the deep swims along the shore. Beautifully, moreover, does holy David describe in the preceding psalm the life of the unrighteous man, here that of the righteous man; there the unrighteous man is set forth, here the righteous man is instructed; that one sins for himself, this one takes away even the sins of others. And therefore let us consider what the first remedy of righteousness is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Do not, he says, act malignly among the malignant, nor be emulous of those who work iniquity. Let us first learn what it is to emulate, although the force of this word is less in Latin than in Greek; for we read of emulation both in a good sense and in a bad. Thus the Apostle says: It is good to be emulous in a good thing always, and above he himself said: They emulate you not well, but they wish to shut you out, that you may emulate them, and again he himself says: Emulate the better gifts, and to the Romans you have: I say then: Have they so stumbled that they should fall? God forbid; but their offence is salvation for the Gentiles, that they may emulate them, and below: For I say to you Gentiles: as long as I am the apostle of the Gentiles, I will make my ministry illustrious, if by any means I may rouse my flesh to emulation and save some of them, that is: I may stir my flesh; indeed the Greek has παραζηλώσω. For here too it has μὴ παραζήλου ἐν πονηρευομένοις and μηδὲ ζήλου τοὺς ποιοῦντας τὴν ἀνομίαν, that is: do not rouse the malignant to emulation, since they contend not about good but about evil.

What is it to rouse to emulation? Let us make it plain, if we can, by an example. There are certain incontinent women who tempt the hearts of other women's husbands. When they have subjected these to their own habit and disgrace, not content to keep their error secret, they are eager to flaunt their shameful deed before the men's wives, so as to rouse and inflame them to jealousy of themselves, seeking a kind of triumph from the pain and agitation of virtuous minds. These women, not bearing, out of a woman's emulation, the insult to their own marriage-bed, either dissolve the bonds of the wedlock once agreed upon or contend in daily strife; and out of emulation comes discord, out of dissension separation, by which the whole house is thrown into confusion. By the example, then, of a wanton woman, learn, you who read, that it is the part of the most wicked and detestable cunning to stir another's soul by a shameless emulation, and that zeal is one thing, parazeal another. For this is the perverse emulation that steals into the affection of good men, by which the Jew too went astray, who, straying from the true and good discipline of the Gospel, turned aside through emulation for the Law, as the Apostle says of himself, that according to emulation for the Law he persecuted the Church of Christ.

Therefore, although our God was frequently offended by the ungrateful dispositions and complaints of the Jews, yet he by no means abandoned the people once taken up and chosen for himself; but the synagogue, like a forward harlot, began to provoke him to the bitterness of emulation by mingling herself in the sacrileges of transgression. Thus they said to the priest Aaron: Make us gods, that we may worship, and they began to worship the head of a calf. Hence through the great song of Moses the Lord resounded in his mouth, saying: They have roused me to emulation with what is not God, they have provoked me with their idols; and I will rouse them to emulation with what is not a people, with a foolish nation I will provoke them. See how the Lord condemned the synagogue for its harlot's ways, so as to turn their own cunning back upon them, and that they might be struck by their own device, who with grievous sacrileges rejected the Lord their God, by whom they had been taken up, choosing for themselves gods to worship; while he, on the contrary, took to himself a Church out of the profane, whom the people of the Jews would groan to see preferred to themselves, without the Law, without grace, and so that their affection might be roused the more to emulation of them, the baser those were on whom the choice had fallen; for before, the people had nothing by which to be stirred, since it regarded itself alone as chosen by the Lord. But when it noticed that a people of strangers had been admitted from the nations, which claimed for itself the Law of the Lord, the oracles of the prophets, the New Testament of the Lord, then at last it began to be tormented with excessive feeling, after it knew that it had been rejected. Thus, if it sees the ceremonies of the Gentiles, it is not moved; if it hears of the progress of the Church, it is tortured with wretched envy. There is fulfilled, then, in Judaea: And I will rouse them to emulation with what is not a people.

There is added to the distress a heavier torment, that sinners from the Gentiles seem to be preferred to them, who do not even raise up the name of any people or nation. For every gathering of each region has been accustomed to claim a name for itself, as the Egyptians, Ethiopians, Syrians, Jews, Arabs bear the name of their province and their lands. We, gathered from diverse peoples, cannot take to ourselves the name of one people, and therefore, because we had no name on earth, we received one from heaven, that we should be called the people of Christ. But the Gentile thinks this folly, the Jew a reproach. True, then, is what is written, that God avenged the insult done to himself by seeking for himself a Church out of what is not a people, and by preferring it, out of a foolish nation, to that ancient and royal people. What the foolish nation is that has been preferred, hear him say: For God has chosen the foolish things of the world, to confound the wise, and again: If any man among you seems to be wise in this world, let him become a fool, that he may be wise. The Lord, then, repaid the provocation of emulation, he did not inflict it, so that it should be not in the form of imitation but in the punishment of iniquity.

Thus the Latin interpreter, wishing to make a distinction between the emulation of virtue and the emulation of offence, says: Do we emulate the Lord? that is: do we bring upon the Lord the offence of emulation, by eating of the things that have been offered to idols, as the Jews exasperated him by sacrificing to idols? But if among men the intention of rousing emulation gives offence, and frequently the person of the one exasperated is found to be the stronger, which has been accustomed to turn to the harm of the one who incited the emulation, what folly is it to provoke the divine majesty and to assail it with the stumbling-block of emulation, where there is no difficulty in vengeance!

We ought not, therefore, to supply the malignant with the goads of emulation against ourselves, who, even when not provoked, are roused by the stings of envy to do harm, as Cain killed his brother because the other's sacrifice was accepted rather than the one which he himself had thought fit to offer; in which it was not Abel who was emulous, but the envious Cain who pursued the favour of being preferred with a wicked fratricide. For Abel did not wish to overshadow his brother's sacrifice, but to keep the discipline of sacrifice, so that no sloth should delay the firstfruits, nor any usurpation violate them by diverting them to his own uses. Saul too attacked with snares the prophet David, the conqueror of the Philistines and the preserver of his own safety, who had been preferred to him in the talk of young girls; he made ready to kill him by casting a spear, and had almost shed the blood of his innocent son-in-law, had David not eluded the wound by bending his body aside. What malice was there, if the young girls said: Saul among thousands, David among ten thousands? But how fierce the envy of King Saul, who turned an error of speech to the destruction of an innocent man!

Nor, he says, be emulous of those who work iniquity. He has not repeated what he had said, but changed it. For it is one thing to emulate covertly, another to emulate; covert emulation has cunning, emulation simplicity. But yet even simplicity itself ought to be cautious and provident, so that it may know what is to be guarded against; for it was not idly said: Be cunning as serpents and simple as doves. The cunning, then, ought to be spiritual, such as keeps salvation and knows no guile; spiritual ought to be the simplicity. Scripture seems, moreover, to have made the distinction of covert emulation in another place too, when it says: And the zeal of Ephraim shall be taken away, and the enemies of Judah shall perish; Ephraim shall not be the rival of Judah, and Judah shall not vex Ephraim. But elsewhere it has: So you also, since you are emulators of spiritual things, seek to abound for the edification of the Church. He put emulators for the good and for imitators of a good thing, a rival for one who is spiteful and envious.

The first thing, then, is that you should not provoke the malignant to the malignity of emulation; the second, that you should not emulate those who work iniquity. For very often the devout, seeing that some have sought riches and attained honours by fraud and cunning, long with an unseemly emulation to follow their ways, so that they may attain riches and honours by a like art, or may circumvent young girls in contracting marriage. For what does it profit, when riches themselves and all the glory of this world quickly wither like grass and, like the green herbs, perish in the very beauty of their flower? All flesh is grass, and all the glory of man as the flower of grass. Do not, then, greatly strive after what cannot be lasting; do not be a rival and spiteful; do not be contentious and a combatant in zeal. Hence also Aquila said: Do not vie among the malignant, Symmachus: Do not contend. Do not be an imitator of iniquity and fraud either, but be an imitator of the apostolic teaching, of the prophetic grace and of the virtue of the saints, so that you may bear fruit and lay up a harvest of goodness, as Joseph did, who by a multitude of grain shut out the famine of a long barrenness, as Habakkuk did, who, carrying a midday meal to the reapers, was lifted up by an angel and took his way along a path through the air, and, restored to earth amid the fierce roaring of lions, served a sweet banquet to the devout prophet.
'''
