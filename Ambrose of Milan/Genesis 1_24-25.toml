[[commentary]]
quote='''
This is the sixth day, which brings to a close the account of the origin of created things and at the same time terminates the discourse which we have undertaken on the genesis of matter. This day calls for even greater expenditure of toil, because we have reached a critical point: the culmination of the whole debate. We must realize that during the preliminary stages of contests in music, song, or sport, however numerous and important they may be, there is no award of a wreath of victory. This presentation of a wreath for victory is assigned to the last day. On that occasion the expectant decision is reached, together with the shame or the reward which either defeat or victory brings. In such a mighty contest of wisdom as this in which every man, not just a few, acts as judge, how much more is there occasion for anxiety lest we fritter away the toils of the preceding days and suffer mortification in the present. The praetor does not face the same conditions as the singer or the athlete. In the latter case there is a sporting chance of misadventure, in the former, an error may have serious results. If, in one instance, you make an error the spectators are censorious; in the other, the audience.

Stand by me, therefore, as judges of the prize of victory. Enter with me into this mighty and wonderful theater of the whole visible creation. Not slight is the service rendered to strangers by one who watches for their arrival with the intent to conduct them on a tour around the city and to point out to them the more notable monuments. How much more ought you to welcome one who, as I do, conducts you in this assembly by the guiding hand of my discourse through your own native land and who points out to you each and every species and genus, with the desire to show you from all these examples how the Creator of the universe has conferred more abundant benefits on you than on all the rest of His creatures. It is for you, therefore, that the wreath is designed. It is my wish, with your express consent, to award to you today the crown of victory. We do not demand merely the garlands that athletes win which are destined at length to fade, but the lasting judgment of your probity, by which you are able to discern the truth that Divine Providence permeates all creatures. While you share with the rest of creatures your corporeal weakness, you possess above and beyond all other creatures a faculty of the soul which in itself has nothing in common with the rest of created things.

Now let us turn our discussion to the origin of beasts and to the generation of men. I already hear some who murmur and say: how much time are we to spend discussing matters alien to us, while knowing nothing of what really concerns us? How long are we to learn of other living creatures while we do not know ourselves? Let him tell me what is to be for my benefit, that I may know myself. That is a just complaint. The order which Scripture laid down must, however, be retained. We cannot fully know ourselves without first knowing the nature of all living creatures.

‘Let the earth,’ says Scripture, ‘bring forth all kinds of living creatures, quadrupeds and crawling creatures and beasts of the earth and cattle and all manner of reptiles according to their kind. And God made the beasts of the earth and every kind of cattle and every kind of creature that crawls on the ground. And God saw that it was good and God said: let us make man.’ I am not unaware of the fact that certain men treat of the race of beasts and cattle and crawling creatures as symbolical of the heinousness of sin, the stupidity of sinners, and the wickedness of their designs. I adhere, however, to the belief that each and every species is uncompounded by nature.

I am not afraid that someone may in his mind compare me to a presumptuous but poor host who, in his eagerness to be kind, invites many people to dinner. He sets before them nothing but the most common and ordinary food, so that he provokes criticism from his guests for the meanness of his service instead of being the recipient of gratitude for his generosity.

The friends of Eliseus did not accuse him of being a poor host when he placed wild herbs before them. There exists that luxurious and delicately prepared banquet, hardly worthy of our notice, in which pheasants and a species of turtle are placed on the table, while chicken is actually what is served. A chicken is offered, stuffed with oysters or shell-fish. Wine is drunk which from its bouquet seems to be of one kind, but from its taste seems to be of another. Food derived from the sea is stuffed with products of the land and those of the land with what is derived from the sea. We call into question in this way the providence of the Creator who has granted all these things for our sustenance without, however, mingling them one with another. At first sight, such a mixture seems pleasing. Afterward, it turns out to be bitter, for the more luxurious is our mode of living, the more ruinous and intemperate it becomes. Eliseus served bitter herbs which afterwards became sweet. Hence, those who thought that the food was of a deadly nature found it later to be sweet and life-giving.

Again, there is no occasion for concern that I might have invited more people than I can possibly provide with food and that the bread of my discourse may not be sufficient for you all. We cannot attain to the perfection of faith exemplified in the case of Eliseus, who was not disturbed by the small amount of bread in his possession. It was his wish and intention to distribute it among all in sufficient amount. Accordingly, he instructed his servant to divide among the people the ten barley loaves. And his servant said: ‘How much is this to set before a hundred men?’ Eliseus replied: ‘Give that they may eat for thus said the Lord; they shall eat and there shall be left.’ And I do not fear that your situation may make you ravenous. You have had your fill, yet you are returning home both hungry and empty, for it is written: ‘The Lord strengtheneth the just and in the days of famine they shall be filled.’

To be unashamed to offer loaves of barley and to give what you have rather than to withhold hospitality is a much more commendable act. While he gave to the people in abundance, Eliseus left nothing for himself. Eliseus, therefore, was not ashamed to serve barley bread, whereas we find it shameful to have understanding of simple created things, which are called by their simple and customary names. When we read of ‘heaven,’ we should understand this to mean what it says. When we read of ‘earth,’ we should understand the fruit-bearing earth.

What concern has the measurement of the circumference of the earth for me? Geometers estimate it to be 180 stadia. I gladly admit that I do not know that of which I am ignorant or, rather, that I am aware knowledge of this sort would not be of profit to me. Better than knowledge about the extent of the earth is knowledge about the concrete things in it. How can we grasp the dimensions of that which is surrounded by a sea, which is broken up by regions inhabited by barbarians, and by the many areas where the soil is marshy and impossible to traverse?

Scripture points out what is impossible for men, for God declares: ‘Who hath measured the waters in the hollow of his hand and weighed the heavens with his palm and the bulk of the earth in his hand? Who hath weighed the mountains in scales and the rocks and the groves in a balance?’ And further on: ‘Who sitteth upon the globe of the earth, and the inhabitants thereof are as locusts, who stretcheth out the heavens as an arch?’ Who, then, ventures to put his knowledge in the same plane with that of God? Does man presume to offer that in the way of knowledge what God has sealed with his own oracular and majestic pronouncements?

Surely, Moses was skilled in all the wisdom of the Egyptians. Yet he welcomed the Spirit of God. As His minister he preferred the way of truth to that vain and self-styled philosophical system. He laid down for us what he considered suited to our hopes, namely, that God made the earth, that the earth, produced plant life and all kinds of animal life at the command of almighty God and by the operation of the Lord Jesus.

But he did not think that he should discuss how much atmospheric space is occupied by the shadow of the earth, when the sun recedes from us and takes away the light of day that illuminates the lower regions of the world. He did not discuss how the lunar orb is brought into eclipse in this part of the world, since in his account these phenomena were passed over as of no significance to us. Moses saw that there was no place in the words of the Holy Spirit for the vanity of this perishable knowledge which deceives and deludes us in our attempt to explain the unexplainable. He believed that only those things should be recorded which tend to our salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
