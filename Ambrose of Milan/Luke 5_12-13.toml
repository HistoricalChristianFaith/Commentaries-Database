[[commentary]]
quote='''
And it came to pass, when he was in one of the cities, behold, a man full of leprosy; and he, falling on his face, besought him, saying: Lord, if you will, you can make me clean. And stretching out his hand he touched him, saying: I will; be made clean.

Fittingly, where the leper is cleansed, no definite place is named, to show that it was not the one people of some particular city, but the peoples of all, that were healed. Fittingly too, according to Luke, this man is healed in the fourth sign since the Lord came to Capernaum; for if God lit up the fourth day with the sun and made it brighter than the other days, when the elements of the world were beginning to shine, we ought to esteem this work too as brighter. And according to Matthew this man is brought in as the first healed by the Lord after the blessings, so that, since the Lord had said: I have not come to destroy the Law, but to fulfil it, he who was shut out by the Law, presuming that he would be cleansed by the power of the Lord, might judge that the grace which could wash away the leper's stain is not from the Law, but above the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
