[[commentary]]
quote='''
And that you may know that I am urging these things upon you with loving affection, that you may know that it is permitted also to lend well, I will show you what usurer you ought to imitate. A certain creditor, he said, had two debtors: the one owed five hundred pence, and the other fifty. And whereas they had not wherewith to pay, he forgave them both. Which therefore loveth him more? Simon the Pharisee said, I suppose that he to whom he forgave more. And his opinion was praised by the Lord, who said: Thou hast judged rightly. The Pharisee judged rightly who thought evilly, believing that the Lord was ignorant of the woman's sins rather than forgave them. But his opinion is praised that all excuse may be taken from him.

More has been remitted to the Church which has been gathered together from the people of the nations, since she owed more; but the woman also paid more, not to one asking, but to one forgiving. She gave water for the feet of Christ because he cleansed her sins, she kissed his feet, bearing tokens of peace, she poured oil upon his feet, she herself also conferring mercy on the poor—they are the feet of Christ, for among them does Christ walk more innocently—and wiped them with the hair of her head. For whoever has the love of humility humbles himself for Christ. Wherefore, he said, many sins are forgiven her because she hath loved much.

Take note that the Lord both bestows mercy generously, as it were, and dispenses judgment with compassion. He forgave beforehand through grace, but he knew whom he was forgiving. The Jew has nothing to excuse him. He forgave me, as a sinner, more; to him, as ungrateful, he conceded less. He knew however both that he, as ungrateful, could not pay back what he had received, and that the Church, mindful of grace, would pay more because she merited more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 22"
