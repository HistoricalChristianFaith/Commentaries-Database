[[commentary]]
quote='''
Hence also that saying of the Lord: if these are silent, the stones will cry out. Nor indeed is it strange if, against their nature, rocks should echo the praises of the Lord, whom his slayers, harder than crags, proclaim; or perhaps it is because, when the Jews fell silent after the Lord's Passion, living stones, according to Peter, were going to cry out. So, although its own affections fight against it, the crowd nevertheless leads God with praise to his temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
