[[commentary]]
quote='''
(in Luc. c. iv. 3.) He begins with that which had once been the means of his victory, the palate; If thou be the Son of God, command that these stones become loaves. What means such a beginning as this, but that he knew that the Son of God was to come, yet believed not that He was come on account of His fleshly infirmity. His speech is in part that of an enquirer, in part that of a tempter; he professes to believe Him God, he strives to deceive Him as man.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But He fought first that He might conquer, not because He Himself needed a struggle, but that He might first prescribe the manner of warring and afterwards grant the grace of triumphing. Our struggle is fasting. Therefore the Savior fasted, and thus the tempter approached Him. And first he aimed a dart at the throat saying: If thou be the Son of God, say to this stone that it be made bread. He held out food as the bait of his snare, as it were, that he might thus ensnare the bodily appetite; the Lord preferred fasting that He might loose the snares of the tempter, that He might loosen his bonds. Accordingly you thus have written: Man liveth not by bread alone, but by every word of God. By that snare had Adam been tormented; by this solution of the devil's question every man has been made free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 1"
