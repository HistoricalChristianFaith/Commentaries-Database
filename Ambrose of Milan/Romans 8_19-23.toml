[[commentary]]
quote='''
What of this, that your labour is shared with all creation, since for your sake the world itself endures the slavery of corruption, since you have a common partnership with the saints in this labour and expectation? The sun acknowledges its setting, the moon its waning, the lights of the stars their wandering, while the redemption of our whole body is awaited.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 6"

[[commentary]]
quote='''
Come therefore, Lord Jesus, let Thy crown go forth, dismiss the victors to their rest; the vanquished, to penance. Even if Thou destroyest the world, more numerous are Thy invisible works than those which we have seen. He who is of too narrow mind does not see those things, he grieves because Thou destroyest the world; but he who knows how to perceive those things which are invisible, rejoices that Thou comest and freest all. The athletes rejoice who can say: Thy kingdom come, Thy will be done on earth as it is in heaven. The creature of the world, that now sighs deeply and travailleth, will rejoice that it will be delivered from the vanity of the world, because that creature also is subject to vanity, until the adoption of the sons be multiplied and the redemption of the entire body be completed. For good, therefore, He will destroy the whole world. For there will be a new heaven and Night shall be no more. Finally, He will uncover his face, He says, that we all may behold the glory of the Lord with face uncovered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 21"
