[[commentary]]
quote='''
What of this, that your labour is shared with all creation, since for your sake the world itself endures the slavery of corruption, since you have a common partnership with the saints in this labour and expectation? The sun acknowledges its setting, the moon its waning, the lights of the stars their wandering, while the redemption of our whole body is awaited.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 6"
