[[commentary]]
quote='''
Would, Lord Jesus, that you would be willing not to send away these fasting ones with me, but refresh them with a banquet imparted by you, so that, made stronger by your nourishment, they may not fear the weakness of fasting. Would that you would say of us too: I do not wish to send them away fasting! And tell me the reason why you do not wish to send them away fasting: nay, you have already said that if you send anyone away fasting, he faints on the way, that is, he faints either in the course of this life or before he reaches the head of the way, before he comes to the Father and understands that Christ is from the Father, understands that Christ is from heaven, and understands that Christ who descended is himself the one who ascended; lest perhaps, when he has learned that he was born of a virgin, he begin to reckon his power not God's but a man's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
