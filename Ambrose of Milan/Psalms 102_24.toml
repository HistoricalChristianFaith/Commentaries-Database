[[commentary]]
quote='''
Hence holy David, fleeing the blindness of the Jews, says: Do not lead me off at the half of my days. For the day of the Lord is great and illustrious in this way: surely not by length of time, but by the brightness of righteousness or of grace. Half-days, then, are those which are shortened by the darkness of ungodliness and the squalor of unbelief, those in which the sun sets upon the prophets, as it is written. For as the sun of righteousness rises for the righteous, so it sets for unbelievers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
