[[commentary]]
quote='''
The life of the saints is for all others the rule of living, and therefore we receive the sequence of the Scriptures set out more fully, so that, while by reading we come to know Abraham, Isaac and Jacob and the other just men, we may follow with striving steps a path of innocence, as it were, opened up for us by their virtue. Since I have often treated of them, today the history of holy Joseph presents itself. Though there were very many kinds of virtue in him, that of chastity shone forth as especially outstanding. It is right, then, that, since you have learned in Abraham the unwearied devotion of faith, in Isaac the purity of a sincere mind, in Jacob a singular endurance of spirit and of labours, you should turn your mind from that general view of the virtues to the particular kinds of discipline themselves. For although those are broader, these are more distinct, and they penetrate the mind all the more easily the more they are circumscribed and defined.

Let holy Joseph, then, be set before us as a mirror of chastity. For in his conduct, in his actions, purity shines, and a certain radiance of grace, the companion of chastity, gleams. Hence too he was loved by his parents more than the other sons. But this was a cause of envy, which ought not to be passed over in silence.

From here, then, the argument of the whole history proceeded, so that at the same time we may learn that the perfect man is not moved by an injury to avenge his hurt, nor repays evil in return. Hence David too says: if I have repaid evil to those who repaid me. But what would there have been for which Joseph deserved to be preferred to the others, if he had either injured those who injured him or loved those who loved him? For most people do this. But this is wonderful: if you love your enemy, as the Saviour teaches. Rightly, then, is he to be admired who did this before the Gospel: injured, he spared; attacked, he forgave; sold, he did not repay the wrong, but paid back favour for insult, which after the Gospel we have all learned and cannot keep.

Let us learn, then, the envy of the saints too, that we may imitate their patience, and let us know that they were not of a more excellent nature, but of more excellent observance, and that they were not ignorant of vices, but amended them. But if envy scorched even the saints, how much more must we beware lest it set sinners ablaze?

We are taught, then, what the affection of parents and the favour of children ought to be. To love one's children is sweet, and to love them more intensely is sweeter still; but often fatherly love itself, unless it keeps to moderation, harms the children, if either it weakens the beloved one by too much indulgence or, by preferring one, turns the rest away from the affection of brotherhood. More is gained for a son for whom the love of his brothers is gained. This is the more splendid munificence of fathers, this the richer inheritance of sons. Let equal favour join the children whom equal nature has joined. Love knows no gain of money in which there is loss of love. Why do you wonder if quarrels arise between brothers over a farm or a house, when envy blazed up among the sons of holy Jacob over a tunic?

What then? Is Jacob to be blamed because he preferred one to the rest? But neither can we take from parents the freedom to love more those whom they believe to deserve more, nor ought we to cut off in children the eagerness to please more. And so Jacob too loved him more in whom he foresaw the greater marks of virtues, so that he seems not so much, as a father, to have preferred a son as, as a prophet, a mystery; and rightly he made him a tunic of many colours, to signify that he was to be preferred to his brothers by a clothing of diverse virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapters 1-2"
