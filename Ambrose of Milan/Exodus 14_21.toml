[[commentary]]
quote='''
Moses himself, to whom the people of the Jews was entrusted that it might pass over, divided the water. And he indeed divided the elements, because he did not divide the might of the Trinity; he separated the masses of the waters, because he did not separate the Father from the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
