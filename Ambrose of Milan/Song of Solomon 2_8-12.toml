[[commentary]]
quote='''
So the Church taught us in the Song of Songs that this wall could not stand in the way of our Lord Jesus Christ, nor of him who has followed Christ, when she said: The voice of my brother; behold, he comes leaping over the mountains, bounding over the hills. My brother is like a roe or a young hart on the mountains of Bethel. Behold, he is here behind our wall, looking out through the windows, looking out through the nets. My brother answered and said to me: Arise, come, my neighbour, my beautiful one, my dove, for behold, the winter has passed, the rain has gone. It has gone its way. Flowers have appeared on the earth, the time of cutting has come, the voice of the turtledove has been heard. The flowers are the apostles, the time of harvest is the fruit of Christ, the voice of the turtledove is the voice of the Church. Rightly, then, the Son of God, after he saw men earthly and not stepping toward the things above, and confined within bodily narrownesses — there was none, indeed, who did good, there was none, not even one — himself deigned to descend to earth, to take away that wall of the Law, that is, a kind of mass and superstition of bodily understanding, which as it were pressed down and overshadowed the hearts of the peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
The bride saw him and heard the voice of him coming, and suddenly turning she said: Behold, he comes here, leaping upon the mountains, leaping over the hills; for he leaps upon the greater, leaps over the lesser, so as not to suffer hindrances to his devout haste. My kinsman is like she says a roe or a young hart upon the mountains of Bethel. A good hart, whose mountain is the house of God, to which he ran with such speed that he anticipated the vows and desires of the bride. In short, him whom she had seen coming from afar she suddenly knew to be present with her, and hence she says: Behold, he is here behind our wall, looking out through the windows, standing out through the nets. My kinsman answered and said to me: Rise, come, my near one, my beautiful one, my dove, for behold, the winter has passed, the rain has gone: it has departed of itself; flowers have been seen on the earth. The winter is the synagogue, the rain the people of the Jews, who could not see the sun; the flowers are the apostles. And he added: The harvest of the cutting has come, the voice of the turtledove has been heard in our land. That harvest is the faith of the Church; the voice of the turtledove is chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 1"
