[[commentary]]
quote='''
In short, when Moses had been told to divide the settlements for the Jewish people by their several tribes, and to distribute a portion to each tribe, God excepted the tribe of Levi, saying to the sons of Levi: He shall have no portion, nor lot, in the midst of his brothers; for the Lord God is their part (Deut. 10:9): and elsewhere: I the Lord am their portion (Num. 18:20).

An earthly allotment is denied to these, so that, while they claim no worldly portion for themselves, they may become a heavenly possession: or that they may know how to possess this alone, that is, the service of faith and devotion, being much richer than those who spread out the wide extents of their possessions. For however far they extend their boundaries, the land gives out, and the sea encloses their mad desires, and they pay tributes greater than their fruits. But this man, possessing nothing, serves as a soldier for none but God; his portion is above the earth, it does not give out with the earth, it is not enclosed by the sea. He whose portion is God is the possessor of all nature. In place of fields, then, he is enough for himself, having a good fruit which can never perish. In place of houses he is enough for himself, that he may be the dwelling of the Lord and the temple of God, than which nothing can be more precious. For what is more precious than God? Or what does this man lack who can say: May it not befall me to glory except in the cross of our Lord Jesus Christ, through whom the world is crucified to me, and I to the world (Gal. 6:14)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
