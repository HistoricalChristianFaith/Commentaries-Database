[[commentary]]
quote='''
But what wonder, since both the Father and the Son are said to be Spirit. Of this we shall speak more fully when we begin to speak of the unity of the name. Yet since the most suitable place occurs here, that we may not seem to have passed on without a conclusion, let them read that both the Father is called Spirit, as the Lord said in the Gospel, "for God is Spirit," and Christ is called Spirit, for Jeremiah said, "The Spirit before our face, Christ the Lord."So, then, the Father is Spirit and Christ is Spirit, for that which is not a created body is spirit, but the Holy Spirit is not commingled with the Father and the Son but is distinct from the Father and from the Son. For the Holy Spirit did not die. He could not die because he had not taken flesh on himself, and the eternal Godhead was incapable of dying, but Christ died according to the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25201.html'
source_title="On the Holy Spirit 1.9.105-6"


[[commentary]]
quote='''
The body of God is a spiritual body; the body of Christ is the body of the divine Spirit, for the Spirit is Christ, as we read: "The Spirit before our face is Christ the Lord."
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 9:58"

[[commentary]]
quote='''
There is also a third death, when Christ, who is our life, is not known; but to know Christ is eternal life, which is now at hand for the righteous in shadow, but in the future will be face to face; for the Spirit before our face is Christ the Lord, of whom he said: in his shadow we shall live among the nations. In the shadow of his wings David hoped; in his shadow the Church desired and sat down.

If your shadow, Lord Jesus, confers so much, how much, surely, will the truth bring? How shall we live when we are no longer in the shadow but in life itself? For now our life is hidden with Christ in God; but when Christ, our life, appears, then we too he says shall appear with him in glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
