[[commentary]]
quote='''
Hence, mystically, the steward of the house answered them. And understand who he is when you read of Moses, faithful in all his house. For Moses, Peter, Paul and the other saints are stewards of the house, but Christ alone is the Lord. It is written that Moses was faithful in all his house as a servant, for a testimony of the things that had been spoken, but Christ as a son in his own house; which house we are, if we hold fast the freedom and the glory of hope.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 9"
