[[commentary]]
quote='''
Perhaps it may trouble you for what reason Pharaoh was severely afflicted with torments by almighty God, as we read above, though he too did not know that Sarah, whom he had heard to be a sister, was Abraham's wife, whereas Abimelech received no punishment. But you should know that the king of Egypt was a leader of vices, who, the more licence he had, the more outrage he committed, while Abimelech was esteemed by God so faithful that he deserved to hear: and I knew that you did this with a pure heart, a king not of affliction, as the Egyptian was, but of fortification, as the interpretation of Gerar, over whose people he ruled, teaches. There is therefore no doubt that the indignation of the Lord was turned back by his other works, since the Lord is truly the judge of the inner conscience and the interpreter of spirit and mind. Then, he did not, like that Pharaoh when approached by Moses, refuse and despise the command of God, nor did he put off his compliance, but at once called Abraham, gave him back his wife, fined himself with a price because he had seen another's wife, and paid the dowry of modesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
