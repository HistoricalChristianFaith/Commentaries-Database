[[commentary]]
quote='''
We have become acquainted with lawful usury, let us know the pledge also which the Law commands should be returned before sunset. What this is, hear the apostle saying: God has given the pledge of the spirit in our hearts. Moreover it is called in threefold manner, pledge, and commitment and trust. They call that a pledge which is received for borrowed money, but a commitment and a trust what we have committed to someone for the purpose of custody. Wherefore the apostle says: I know whom I have believed and I am certain that he is able to keep that which I have committed to him against that day. He likewise showed what the trust was, saying: Keep the good thing committed to thy trust by the Holy Ghost who dwelleth in us. Is the Spirit the guardian of silver or gold given in trust, or is money kept by the Holy Ghost? Therefore a spiritual pledge is kept by the Spirit, lest the fowls of the air come and take it away from our hearts.

Let us seek therefore that Christ may keep in us this pledge which He Himself has given, and may preserve His trust and His commitment; for He has received nothing from us, but Himself has entrusted to us what was not ours. And therefore he suffers detriment to his honor who violates the trust of another. If we ought by no dishonesty to violate the commitment of a man, how much more does it behoove us to preserve in good faith the divine and spiritual trust, lest we undergo grave loss both of reputation and of profit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 20"
