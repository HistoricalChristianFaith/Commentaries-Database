[[commentary]]
quote='''
For there is a city which does not have the gates of its walls shut, of which it is said: And its gates shall not be shut by day (Rev. 21:25); for there will be no more night in it; the nations will bring glory and honor into it. That, then, is the city Jerusalem which is in heaven, within which you are kept as though already perfect and spotless; for nothing common enters into it. Chastity is not common, modesty is not common, which is written in the book of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
