[[commentary]]
quote='''
And he describes how wretched is the portion of the ungodly: that even if they have many sons, they are without posterity, since they lack a succession of good deserts; for that is the true posterity which is not on earth but in heaven. For men of this kind, then, want is their inheritance and death their succession. When they have heaped up riches, they will beg, because when they are dead they will be in need, since they cannot find rest. No one will pity their widows, but they will remain forsaken and bereft of all the comfort of wedlock. Even if money is gathered like earth, and gold is made ready like clay, their substance will be empty like a spider's web, and all the patrimony of their name will be consumed as by moths. The rich man, sleeping, will add nothing; he has opened his eyes, and he is no more. He remains in sorrows. All the things, then, that are in this world are nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
