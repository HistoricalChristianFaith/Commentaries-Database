[[commentary]]
quote='''
The following is on this account a greater marvel: how all the bodies of water flowed into one body and how that one body was not full to overflowing. Scripture, too, reckoned this among extraordinary happenings by stating: ‘All the rivers run into the sea, yet the sea doth not overflow.’ By the command of God, therefore, two things are accomplished: the waters flow, yet do not overflow. A boundary is set up by which the seas are circumscribed and confined, lest the waters inundate everything by pouring over the earth and lest the earth, devoid of cultivation, may prevent the soil from fulfilling its natural function of producing in abundance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
