[[commentary]]
quote='''
And while he was bestowing these things on us, while he was undergoing these things for us, we were rejecting his price; hence he says: But they thought to reject my price, when, as Judas the traitor brought back the price, the Jews would not put it into the treasury, saying: It is not lawful for us to put it into the treasury, because it is the price of blood. Here the traitor is condemned by his own judgement, he who gave back the price he had received, weak as a witness to the sacred gift but strong as a witness to his own crime; for each man is a heavier accuser of himself, and himself pronounces against himself a sentence without excuse. The rulers of the synagogue condemn themselves by their own judgement; for they confess that what they had given was the price of blood, while they reproach the one who gives it back. For if it was not to be received back, neither was it to be paid. And would that they had either not given it or, since they had given it, had not taken it back! For they spurned what they would not put into the treasury, and with it they bought a field for the burial of sojourners. Rightly, then, the Gentiles, for whom the burial in that field which was bought by the death of Christ has been of profit, are no longer newcomers and sojourners, but have become fellow citizens of the saints and members of the household of God, because they are buried together with the Son of God; but the Jews, who spurned the price of his Passion, sojourn away from Christ. More tolerable than they is the traitor, at least in this, that he confesses his error, while they make their crime worse by excusing it; for confession after a sin is the more modest. Shamelessly, then, they rebuffed him as he confessed the sacrilege they shared, saying: What is that to us? See to it yourself; for what was the traitor saying but this: I have sinned in that I have betrayed righteous blood? What was the crime of the one who betrayed, how could it not be the sin of those who received, since crime was joined to crime, so that they slaughtered the more criminally him whom they had criminally bought?

I ran, he says, in thirst. It is true indeed that our Lord Jesus thirsted. Blessed is the Lord's thirst, because he thirsted for us, and most of all in his Passion; then he said: I thirst. He thirsted then, therefore, when from his side he was pouring out streams of living water to quench the thirst of all. Then it is written: Rivers of living water shall flow from his belly. But in the Greek it is put ambiguously, because ἔδραμον signifies both the singular and the plural number. Therefore, since according to the Greek we can understand both "I ran" and "they ran" (and we have said what "I ran" expresses, that is, I hastened to take up the thirst of all, so as to satisfy all with the abundance of the perpetual fountain; for he to whom I give water shall not thirst, neither here nor in the future, as was said to the Samaritan woman), let us now say what They ran in thirst signifies, that is, they hastened, so that, denying the living fountain in the heat of their unbelief, they might dry up their throats with an eternal drought, as the Lord himself says: They have forsaken me, the fountain of living water, and have made for themselves broken cisterns. Nor is it any wonder if they thirsted who could not hold the water of the eternal fountain, leaking as they were through the cracks of their unbelief. They thirsted, then, because they deprived themselves of the spiritual drink which they had drawn from the rock that followed. Hence Symmachus too says: συνεδόκει, that is, it pleased them in falsehood, when they brought false charges for true. Every falsehood has thirst; truth has an abundance that endures for ever.

And how quickly he proved that they ran in falsehood: With their mouth, he says, they blessed, and with their heart they cursed. Wretched is the thirst of the unbelieving, who held one thing in their heart and spoke another with their mouth. But where the abundance of faith overflows, with the heart one believes unto righteousness, with the mouth confession is made unto salvation. And how they blessed with the mouth and cursed with the heart, the course of the Passion shows, when they said: Let him come down from the cross and we believe him — fools! He rose from death and they did not believe: how would they have believed if he had come down from the cross? —, He hoped in the Lord, let him rescue him; let him deliver him now, since he wills him; for they said these things mocking rather than wishing it, and they asked whether he was the Son of God, speaking peaceable things in words while in their heart they were devising a charge of sacrilege.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
But be it so: they attacked me even unto death, they sought me to kill me, saying: "Let us take away the righteous man, let us take away the merciful man, for he is burdensome to us even to look upon"; but they thought also that my reputation, my chastity, was to be wounded by false slanders. For this is: They thought to reject my price, because our price is chastity, which separates us from the beasts and joins us to the angels; our price is mercy, which, when it is bestowed on the needy, redeems us from death; our price is faith, which has won for Christ all men who were pressed down by Gentile error and servitude; our price is a good reputation, by which the course of each one's merits is reckoned; our price is purity and simplicity, for it is written: A pure man is a precious possession; for nothing is more precious than a simple man. Hence the Apostle says finely: He has abounded, he says, in the riches of his simplicity. For what is richer than simplicity, which, like a good father of a household, abounds enough for itself and, content with its own purity, does not seek what is another's nor gnaw it away, but pours out of itself to others? The innocent man indeed believes every word, nor does he often change himself into various arts, as cunning does, which, to be wary, fears everything and does not trust itself to its own counsels, but turns its own opinions over and over; but simplicity knows nothing of fear. In this way, then, they tried to reject the price of the righteous man; although this too can be understood, that they received his gold with their hands while in their inmost heart they rejected him, holding the plunder, denying their faith.

Hence he also says: I ran in thirst, because he was seeking faith and could not find it, abandoned by his companions, forsaken by his own. So we read in the Gospel that the Lord Jesus both hungered and thirsted, when he hungered for our faith, thirsted for our works, and seemed to seek what belonged to others. Or, to refer it to the thirst of the body, with what indignity he says: I ran in thirst! That is: I was thirsting while others belched my wines, and from that high dais of sublime empire and from royal opulence I was brought down to the extremes of thirst with a kind of plebeian meanness.

And since the Greek has ἔδραμον, which signifies both "I ran" in the singular and "they ran" in the plural, it can also be understood thus: They ran in thirst, those whose throats were parched with an excessive heat to shed my blood. For as there is a thirst of faith, so there is also a thirst of unbelief. The former thirst the righteous man thirsts, who says: My soul has thirsted for you, O God; the latter the unbelieving thirst, whose tongue was parched for thirst; and with this thirst he thirsted who, set amid the dishes and cups of a banquet, was plotting the death of an innocent fellow guest, an Augustus. Did it not seem to you, ungodly man, while you ate and prepared the slaughter, that human bones were crackling under your teeth? While you drank wine and devised the parricide, that in those cups you were pouring the blood of the innocent into yourself? So utterly a stranger were you not only to the imitation but even to divine reading that there did not come to your mind that verse of the psalms: But you, a man of one mind with me, my guide and my acquaintance, who took sweet food together with me, and that other, which the Lord Jesus himself recalls in the Gospel: He who ate bread with me has lifted up his heel against me?

What shall I do to you, Ephraim? What shall I do to you, Judah? You have left us many heirs of your betrayal and fraud; for this can also be turned by apostrophe to Judas the traitor. You betrayed your lord's life, his kingdom. But the Lord Jesus is betrayed once in himself, often in his little servants; for what you did to one of these least, he says, you did to me. You received the purse entrusted to you and the money of the poor, this man the provinces committed to him; you the honour of an apostle, he the dignity of military command, the insignia of office. I count up his honours in order to magnify his crime. Each of you violated the fellowship of a banquet; yet you rose from the banquet to betrayal, this man to murder; that is, you, though in crime, were the more modest, you who denied having believed that death would be inflicted on the Lord whom you were betraying, who gave back the price, lest the wages of parricide should seem to remain with you; this man not only kept the wages of betrayal once received, but even extorted them when they were not offered; this man was not only not deceived by another's lie, but deceived others by his own, and deceived in order to kill. And when the other refused the banquet, seeing that he was to be put to death, this man offered an oath, lest any part of heaping up the crime should be lost to him. Lastly, the money of the earlier traitor was of profit for the burial of sojourners; this man denied his prince a burial intact.

Nor was there lacking one to wash his hands, saying: I am innocent of the blood of this righteous man; in which Pilate did not cleanse himself but defiled and entangled himself, and did not get himself free. For although there is no weight in the judgements of the lost, yet there is a greater bond in their confessions. For the righteous are acquitted not by another's sentence but by their own life; the unrighteous bind themselves more strongly by their own words, they who cannot bind others. Yet, lest this man too should seem to lack his own confession, he swore in order to perjure himself; he washed his hands while touching the Gospel, so that nothing should be lacking to the pattern; he washed his hands with water so as to defile them the more criminally with the blood of an innocent man. Nor was Herod lacking, whom a second Pilate believed he would please if he sent the captured prince to him. What shall I say of this too, that he also was clothed in a white garment for mockery, and afterwards was presented with a royal garment for dying, lest he should seem to have lost the honour that was his due? For although he perished by a crime, yet even in death he kept the right of the power conferred on him, by the service or the assent of the very men by whom it was being denied.

To so great a crime a funeral pageant would have been added, had not he who was lamenting these things without restraint, on learning what was being prepared, moved by a just grief, rebuked the proud victor, saying that such things were customarily inflicted on tyrants, not on kings. So, roused by horror at the outrage, he laid aside the preparations of that most foul crime. Nor, then, was one lacking to ask for the burial, although that Joseph who was called righteous was lacking. But Maximus, far more savage, was denying what Pilate himself could not take away. In this the parricide lacked humanity; yet the innocent man did not lack grace, and, patience being assumed for a time, vengeance has been deferred a little.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
