[[commentary]]
quote='''
For what reason did Christ fill twelve baskets, unless to undo that word about the Jewish people, that his hands served in the basket, that is, the people who formerly gathered clay in baskets now, through the cross of Christ, works the nourishment of heavenly life and heaps up the food of faith where before there was the filth of Gentile unbelief? Nor is this gift for a few, but for all. For through the twelve baskets there overflows, as it were, the strengthening of the faith of each tribe; for bread strengthens the heart of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
