[[commentary]]
quote='''
God has made you a hunter, not a harrier, for He says: ‘Behold I will send you many hunters’—hunters, not of crime, but of absolution therefrom; hunters, certainly not of sin, but of grace. You are a fisher of Christ, for whom it is said: ‘Henceforth thou shalt make men live.’ Spread your nets, direct your eyes, and control your tongue in such a manner that you destroy no one, but bring rescue to those who struggle in the waters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
For on the mountains and on the hills are found the Lord's hunters, who track down those who are caught for life; for so God said through Jeremiah: Behold, I send many fishers and many hunters, and they shall hunt them upon every mountain and upon every hill (Jer. 16:16). There, then, let the people of God be sought and found, in the teaching, grace and discipline of Peter and of Paul; that they may not be in the valley, where weeping is, but on the mountains, from which Christ enlightens each one; and when we read Peter, Christ enlightens; and when we read Paul, Christ enlightens. Paul healed, Christ enlightened; for at the invocation of the name of the Lord Jesus he arose, by whose gift he was healed. Peter raised a dead woman, Christ enlightened; and therefore he says: You give light wonderfully from the everlasting mountains (Ps. 75 (76):5).

We, therefore, who cannot be mountains, let us stand on the mountains or on the hills; so that when the Lord has sent his fishers and hunters to hunt those who are upon every mountain or upon every hill, that is, in the precepts of the law and the prophets, and who have their whole way of life in the knowledge of the New and the Old Testament, they may find us ready, and, sent as reapers at the proper time, may gather us like good ears of grain; for if anyone is found outside the mountain or the hill, he cannot be gathered like a good ear by those who, to make mention of another comparison, will be sent to separate the wheat from the chaff. The Lord, then, has ministers skilled in very many works: the same are fishers, the same are also hunters, and reapers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
