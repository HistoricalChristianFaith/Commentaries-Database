[[commentary]]
quote='''
Like a potter, God wrought the fabric of human flesh. And to Jeremiah it is said: Go down into the potter's house, and there you will hear my words. It often happens to a potter, surely, that while a vessel is being shaped it falls from his hands, and he gathers up the clay again to remake the vessel. In short, Jeremiah too says: I went down and saw how the vessel fell which he was making in his hands. And again he says: He made another vessel as it pleased him. Rightly, therefore, he is called upholder, because he himself upheld us with his hands, he himself formed us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 5"
