[[commentary]]
quote='''
But how could it come to pass, that Him of whom he said, Behold him who taketh away the sins of the world, he should still not believe to be the Son of God? For either it is presumption to attribute to Christ a divine action ignorantly, or it is unbelief to have doubted concerning the Son of God. But some suppose of John himself that he was indeed so great a prophet as to acknowledge Christ, but still as not a doubting, but pious, prophet disbelieved that He would die, whom he believed was about to come. Not therefore in his faith but in his piety, he doubted; as Peter also, when he said, Be it far from thee, Lord; this shall not be unto thee. (Mat 16:22.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And John called two of his disciples and sent them to him, saying: Are you he who is to come, or do we look for another?

The meaning in these simple words is not simple; otherwise what came earlier conflicts with the present. For how is it that John here does not know him whom earlier he recognized when God the Father pointed him out? How did he there acknowledge him whom before he did not know, and here not know him whom he already knew? I did not know him he says, but he who sent me to baptize, he said to me: He upon whom you see the Holy Spirit descending from heaven. And he believed the word, and acknowledged him when he was pointed out, and adored him when he was baptized, and prophesied him as he came. Indeed I he says saw and bore witness that this is the chosen one of God. How then could it be that so great a prophet should so err as still not to believe that he of whom he had said: Behold him who takes away the sins of the world was the Son of God? For either it is insolence to ascribe divine things to one whom you do not know, or it is unbelief to have doubted about the Son of God. So the suspicion of so great an error does not fall upon such a prophet.

So, if the form of the simple meaning conflicts, let us seek a spiritual figure. And since we said above that in John there is a type of the Law, which was the herald of Christ, rightly the Law, which was held bodily shut up in the breasts of the unbelieving as in prisons emptied of eternal light, which the womb fruitful in punishments and the doors of madness confined, cannot carry through the full outcome of its testimony to the Lord's dispensation without the endorsement of the gospel.

The Law indeed prophesied in Exodus the grace of baptism through the cloud and the sea, foretold spiritual food in the lamb, signified the perennial fountain in the rock; it revealed the remission of sins in Leviticus, announced the kingdom of heaven in the psalms, most clearly declared the land of promise in Joshua son of Nun — all these things agree also with the testimony of John —

but yet it is held shut up by the tyrannical powers of this world, so that it may not pour forth the light of the Lord's resurrection. So John sends his disciples to Christ, that they may obtain the supplement of knowledge, because Christ is the fullness of the Law; so that, since words without deeds commonly waver, and faith is shown more fully by the testimony of deeds than by the promises of words, the faith which then wavered in the hearts of the Jews, as though the Law were locked up, might be laid open by the very spectacle of the Lord's cross and by the full testimony of the resurrection.

And perhaps these disciples are the two peoples, one of which believed from the Jews, the other from the Gentiles, which believed because it heard. So these wished to see, because of that word: But blessed are your eyes which see, and your ears which hear. But we too have seen in John, we have looked upon him with our eyes in the apostles, and we have searched with our hands in the fingers of Thomas; that indeed which was from the beginning, which we have heard and which we have seen, we have looked upon with our eyes, and our hands have searched, concerning the word of life: and the life appeared. When did it appear? When we saw. It did not so appear before it was seen. Thanks then to the Lord, who was crucified for our faith, was crucified for our lusts. My mind is crucified in him.

So now too those who review the Old Testament before they know the gospel, and read as it were certain footprints of the Lord's body, think that he is to come, and ask whether he himself is the Christ, the Son of God, who is to come. And when they read of when he spoke with Abraham, or when he showed himself as captain of the heavenly host, they surely say: Are you he who is to come, or do we look for another? But when they have come to the gospel and learned that the blind are given light, the lame walk, the deaf have heard, the lepers have been cleansed, the dead have risen, then they say: We have seen him and have looked upon him with our eyes, and we have put our fingers into the prints of his nails. For we seem to ourselves to have seen him of whom we read, to have beheld him hanging, and to have touched his wounds as the spirit of the Church searches them; for if demons are cast out by the finger of God, faith too is found by the finger of the Church. Or perhaps in a certain working part of our body we all seem to have traced the course of the Lord's Passion; for faith comes through the few to the many. The Law, then, announces that Christ will come; the scripture of the gospel confirms that he has come.

Some also understand it thus of John himself: that he was indeed so great a prophet as to recognize Christ and to announce the remission of sins to come, but yet, not as one in doubt but as a devoted prophet, he did not believe that he whom he had believed was to come was to die. He doubted, then, not in faith but in devotion. Peter too doubted, saying: Be merciful to yourself, Lord! This shall not be. He, the prince of faith, to whom Christ had not yet called himself the Son of God, and yet he had believed, did not believe even Christ about the death of Christ. It is a slip of devoted affection, not of lack of devotion. Indeed elsewhere he refuses to have his feet washed, where he does not recognize the mystery, while he is burdened by the Lord's service. So not even the saints believed that Christ would die; what indeed eye has not seen nor ear heard nor has entered into the heart of man, these things God has prepared for those who love him. So in the religious a slip of love does not hinder faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
