[[commentary]]
quote='''
My kinsman is like a roe or a fawn of the harts upon the mountains of Bethel; for he leaps upon the Church, which is the house of God, because he strengthens the hearts of the faithful. Rightly like a little roe, because the roe feeds on the heights. It is called dorcas from seeing, for the dorcadion is of keener sight. What is more fitting than this for Christ, who saw the Father whom no one has seen: or, if anyone has seen him in Christ, the Son himself revealed him? Rightly like a fawn of the harts: a fawn, as it were a son, in whom the strength of his father's nature has grown, so that hidden things do not escape him, serpents flee from him, poisons do not harm him. In short, the serpent, when he was brought out of his lairs, he who was being driven out of a man, said: Why have you come before the time to torment us? (Matt. 8:29). Let us, then, behold this fawn leaping, so that we may not be able to fear the serpent.

Behold, he stands behind our wall, looking in through the windows, peering through the nets. He comes, then, and first he is behind the wall, that he may dissolve the enmities of soul and body, taking away the wall which seemed to bring a hindrance to concord. Then he peers through the windows: what the windows are, hear the Prophet saying: The windows have been opened from heaven (Isa. 24:18). So it signifies the prophets, through whom the Lord looked upon the human race before he himself came down to earth. And today, if any soul seeks him much, she will merit much mercy; since to him who seeks much, much is owed. If, then, any soul seeks him more zealously, she hears his voice from afar: and although she asks of others, she hears his voice before the very ones of whom she asks. She sees him coming to her leaping, that is, hastening and running and leaping across those who, with feeble heart, cannot take in his power: then peering through the riddles of the prophets, by reading them and holding fast to their words; for she sees him peering, but as it were through a window, not as one yet present. She sees him peering out over the nets. What is this? Unless perhaps it is that those nets are nets for us, they are not nets for him, because that soul is still among the things of sense and of the world, which are wont to catch the mind of man and wrap it in a kind of fold of their own.

Behold, he stands behind our wall, looking in through the windows, peering through the nets. For the Church, or the soul of the just, had seen him leaping like a fawn upon the mountains, and suddenly, looking at him for the first time behind the wall of her house, peering through the windows, peering out through the nets, she exults and rejoices, because she too is loved by the Bridegroom. He, as though himself also wounded by the beauty of love, though at first he was absent from his beloved, was present when asked for kisses (for he is asked when it is said (Song 1:1): Let him kiss me with the kisses of his mouth); then he did not spurn the prayers and caresses of the bride, who offered him the breasts he loved, and kindly brought her into the inner rooms of the house: then, as though playing with a sportive love, because he wished to test the feelings of the one who loved him, often going out that he might be sought by the Bride, often returning that he might be invited to kisses, he stood behind the wall, peered through the windows, peering out over the nets; so that he was neither wholly absent nor entered as it were wholly, and he himself called the bride to himself; that the exchanges of coming to one another might become more pleasing, and they might kindle love with mutual words.

Arise, he says, come, my nearest one, my fair one, my dove; and you, if you have a well-founded wall, not that middle wall which separates the members of one house, but one built upon the foundation of the apostles and prophets, so that its structure, fitted together, grows into a temple, and does not divide its inner parts but protects them. If, then, you have within you the building of God, and your windows are always open toward the East, the Word comes, He stands behind your wall (Song 2:9); the eyes indeed of the Lord are upon the just (Ps. 33 (34):16); he peers through your windows (Song 2:9).

What are these windows? We read of windows of which Jeremiah says: Death has entered through the windows (Jer. 9:21), through which avarice has entered, lust has entered. Your eye is a window. If you have looked upon a woman to lust after her, death has entered through your eye: if you have looked upon a widow's property, or the treasures of a minor, and have stirred up your desires, Death has entered through the window. As, then, death enters through these, so life enters too: if, looking upon the beauty of a consecrated maiden, you venerate the Lord Jesus, because the age of old age, a spotless life, has come into tender years, and you yourself offer your daughter, that she may be consecrated with the holy veil: if you look upon the property of a minor not as an eager usurper, but watch over it with devout affection as a careful parent: through these windows Christ peers, that he may call the bride.

Peering out over the nets: well does it say peering out; because he alone is the one whom the nets of sins have not entangled. We were all within the nets, nay, we are still within the nets; because no one is without sin but Jesus alone, whom, though he knew no sin, the Father made sin for us; for indeed he handed him over to the snares, handed him over to the nets: sending him not in the sin in which all men were, but in the likeness of sinful flesh, that concerning sin he might condemn sin in the flesh. The flesh was sin, in this sense, that it had been condemned by an inherited curse; it was sin as the allurement and handmaid of sin. The Lord Jesus came, and in the flesh subject to sin he waged the warfare of virtue: our members have now become not weapons of lust, but weapons of virtue; for where there were the incentives of lust, there now are the dwellings of chastity. He came, then, to the snares, but willingly: he came to the nets, but secure. All things were full of nets, crammed with snares; hear him who says: In this way in which I walked, the proud hid a snare for me (Ps. 141 (142):4). And in the book of the wisdom of Sirach you are warned to know that you walk in the midst of snares (Sir. 9:20). As many vices, so many nets: as many sins, so many snares.

Inherited bonds were already holding you; Jesus came to the snares to release Adam: he came to set free what had perished. We were all held by nets; no one could rescue another, since he could not rescue himself. Such a one, then, was needed, whom the bonds of human generation, liable to sins, would not hold, whom avarice had not caught, guile had not bound. That one was Jesus alone, who, when he had surrounded himself with the bonds of this flesh, was not caught, was not bound: but, bursting and loosing them, he called the Church the more to himself, Peering through the snares, peering out over the nets; that she too might learn not to be held by bonds. In short, he was not far from bonds to this extent, that he even underwent death for us; yet he was not made the slave of death, but was free among the dead; for he was free who had the power to loose death. In short, let him teach you himself who says: Loose this temple, and in three days I will raise it again (John 2:19). Let us hear, then, what he says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
