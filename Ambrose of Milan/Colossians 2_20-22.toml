[[commentary]]
quote='''
Paul too, caught up to the third heaven, did not know whether he was in the body or without the body; caught up, I say, into paradise, he no longer felt the use of his own body, and, hearing the words of God, he was ashamed to come down to the infirmities of the body. And so, knowing what he had seen in paradise, or what he had heard, he cried out, saying: Why, as though living of this world, do you still make decrees? Do not touch, do not defile, do not taste, things which all tend to corruption by their very use (Col. 2:20 and 21). For he wished us to be in the figure of this world, not in possession and use, so that we may use this world as though not using it, as passing through, not as settling down; walking as in the image of the world, not in desire of it, that by the swiftest reasoning we may pass beyond the very image of this world. Thus he himself, walking by faith, not by sight, was absent from the body and present with God: and while he was on earth, he lived not among earthly but among heavenly things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
