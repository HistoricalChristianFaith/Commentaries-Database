[[commentary]]
quote='''
Hence the Lord said to the Apostles, as if they were on the point of perfecting their work: Watch and pray that you may not enter into temptation. By this He meant that the function of a nature that was perfected along with the grace of abundant virtue should be preserved and that no one, even one who has attained some perfection, ought to feel really secure of himself unless he remains vigilant.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 4"
