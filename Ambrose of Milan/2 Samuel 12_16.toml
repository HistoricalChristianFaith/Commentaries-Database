[[commentary]]
quote='''
We have set out strong arguments, as we think, and have proved that the fabric of this story was in figure; now let us go back to what came before and look into the error as though stripped of its spiritual garments. David sinned, as kings are wont to do, but he did penance, he wept, he groaned, as kings are not wont to do; he confessed his fault, he besought forgiveness, lying on the ground he lamented his misery, he fasted, he prayed, and by making his grief public he handed down the testimony of his confession to everlasting ages. What private persons blush to do, the king did not blush to confess. Those who are bound by the laws dare to deny their sin and disdain to ask for forgiveness, which he sought who was bound by no human laws. That he sinned belongs to our condition; that he made supplication belongs to correction. The fall is common, but the confession is singular. To have fallen into fault, then, is of nature; to have washed it away is of virtue. Who glories, he says, that he has a chaste heart? Not even an infant of one day is declared clean by the testimony of Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 4"

[[commentary]]
quote='''
Holy David, then, committed sin — I shall hold you in no ambiguity — he committed adultery, he devised murder, and he devised it and carried it out. He sinned, as kings are wont to do, but he did penance and wept, which kings are not wont to do. He asked for pardon, not arrogant of his power but conscious of his weakness; prostrate on the ground, he covered himself with sackcloth, forgetful of his rule and mindful of his guilt.

What man of this kind can you find me who, set in power, does not rather love his crimes, proclaim his guilt, defend his sins; who thinks that what is not fitting is not permitted to him; who binds himself by his own laws and recognizes that what is not permitted by justice is not permitted by power either? For power does not loosen justice, but justice loosens power; the king is not loosed from the laws, but by his own example he loosens the laws. Or can it be that he who judges others should himself be free of his own judgment, and admit in himself that for which he binds others?

Good, then, is David, and he who conquered power is much more admirable than he who conquered love. For chastity is sometimes granted to the body, often by error; power is subject to God, and a man more easily restrains himself in love than moderates himself in power. Will you not, then, pardon what is lesser in one in whom you admire greater things?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"
