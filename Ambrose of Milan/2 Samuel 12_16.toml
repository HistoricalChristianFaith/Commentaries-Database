[[commentary]]
quote='''
We have set out strong arguments, as we think, and have proved that the fabric of this story was in figure; now let us go back to what came before and look into the error as though stripped of its spiritual garments. David sinned, as kings are wont to do, but he did penance, he wept, he groaned, as kings are not wont to do; he confessed his fault, he besought forgiveness, lying on the ground he lamented his misery, he fasted, he prayed, and by making his grief public he handed down the testimony of his confession to everlasting ages. What private persons blush to do, the king did not blush to confess. Those who are bound by the laws dare to deny their sin and disdain to ask for forgiveness, which he sought who was bound by no human laws. That he sinned belongs to our condition; that he made supplication belongs to correction. The fall is common, but the confession is singular. To have fallen into fault, then, is of nature; to have washed it away is of virtue. Who glories, he says, that he has a chaste heart? Not even an infant of one day is declared clean by the testimony of Scripture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 4"
