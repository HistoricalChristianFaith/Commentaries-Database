[[commentary]]
quote='''
John, however, put it thus: that Peter, asked by the maidservant whether he was one of the disciples of that man, answered at his first utterance: I am not; for he was not the apostle of a man, he who was Christ's. Indeed Paul too denied that he was the apostle of a man, saying: Paul an apostle, not from men nor through man, but through Jesus Christ and God the Father. But lest he should seem to bring in any ambiguity about the Incarnation, he added: who raised him from the dead, so that you may believe him man too, when you have first believed him God. This he keeps elsewhere also in the same tenor, where he says: For there is one God and one mediator of God and men, the man Christ Jesus. He named him mediator of God, surely, before he named him mediator of men; for it is not enough to believe both, unless the order of faith is kept.

The answer, then, agrees everywhere; for it was fitting that he who said: I do not know the man, when asked whether he was one of the disciples of the man, should say: I am not. And so he did not deny that he was a disciple of Christ, but denied that he was a disciple of a man. And so both Peter and Paul denied the man whom they confessed to be the Son of God. What Peter perceived, Paul expressed; from this one the other too made progress. The error of Peter is the teaching of the righteous, and the stumbling of Peter is the rock of all. Indeed he stumbles upon the waves, but stretches out his right hand to Christ; he falls on the mountain, but is raised by Christ; the same Peter stumbled on the sea, but he walked. The stumbling of Peter is firmer than our firmness. He falls there where no one climbs; he totters there where no one walks. And yet among the waves, though he stumbles, he does not slip; he totters, he does not fall; he is tossed, he is not cast headlong. And if he fell, yet he fell on the mountain; but he fell more happily than others stood, more happily he fell, whom Christ raised up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
