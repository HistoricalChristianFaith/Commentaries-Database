[[commentary]]
quote='''
Set, he says, your hearts on his power, that is, so that you may understand his power, and distribute her steps, that you may tell it to another generation, for this is our God for ever and unto the age of the age. He will rule us unto the ages. The Greek says βάρεις, that is, lofty and towered houses. Hence the prophet, when he was speaking of the city of God and of those who dwell in it: distribute, he says, her steps, that is, her high and lofty dwellings in the heavenly places, whereby he teaches that the order of merits is to be kept; for each one, indeed, in his own order. Hence the Lord too says that he goes and prepares dwellings for his disciples, so that each one may obtain fitting abodes in proportion to his merits, in which he may enjoy that eternal rest.

There are also sublime and lofty precepts, in which are the hidden mysteries of devotion and the contemplations of heavenly discourses. These, he says, distribute, and divide them according to the capacity of each, as much as each can grasp with his own understanding. For Paul did not discuss the same things with all. To some he preached nothing but Christ Jesus and him crucified, not in the persuasiveness of the wisdom of the word, but in the demonstration of the Spirit and of power; but among the perfect he spoke wisdom, because the whole people was not capable of receiving the wisdom which is hidden in a mystery.

Christ hid it for this reason: that the foolish may not understand it, that the prudent may seek it more eagerly and tell it to another generation, one that would be more perfect by the power of the Spirit, since the former generation, through weakness of faith, could not know the sacraments of perfect wisdom, and therefore sought a sign and rejected the truth, although surely there is not a truth of the sign, but a sign of the truth. Hence the Lord answered it: An evil and adulterous generation seeks a sign, and no sign shall be given it but that of Jonah the prophet. And so, to convict the unbelief of the Jews, the example of Jonah is summoned, because the Ninevites believed the sign and thought the preaching of Jonah, who had been in the belly of the whale, must be followed, whereas the Jews did not believe even after the resurrection of the Lord Jesus, who after three days rose from the heart of the earth and lives and reigns through all ages. Amen.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
