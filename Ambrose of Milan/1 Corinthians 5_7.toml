[[commentary]]
quote='''
Good is our Lord Jesus Christ, because he became the sheep of our feasting. Do you ask how he became so? Hear the one who says: Christ our passover has been sacrificed, and consider how our forefathers, in figure, tearing the lamb apart, ate it, signifying the Passion of the Lord Jesus, whose sacrament we feed on daily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
