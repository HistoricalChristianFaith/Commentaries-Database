[[commentary]]
quote='''
Let us look at the rest. Why he says have you cast me off, and why do I go about sorrowful, while the enemy afflicts me, breaks my bones? Those who trouble me have reproached me, while it is said to me daily: Where is your God? Why are you sorrowful, O soul? and the rest. The first interrogation contained the complaint that the good things were being put off, whose fruit was already longed for. The second interrogation was that the coming of Christ, awaited by the prudent, was being delayed, the coming which the Law had announced, which the prophets promised; and the hearts of the just burned the more impatiently, since they had known that he would come for the redemption of all ...... also of all, for whom he would open the way of virtue by the path of the Gospel and show the paths of good works, as he himself said in Proverbs: The Lord created me the beginning of his ways. This, then, is why it was said to him: Where is your God? because Christ had not yet come, but was hoped for. The devil, therefore, was raging, in order to crush those whom he knew would believe in the coming of the Lord, and he afflicted them with various deaths. David, therefore, interrogates, so as to rouse him who delays by a prophetic complaint, to urge him to hasten, to admonish him to come to our aid. We have a likeness of this interrogation also in what comes later, where the same prophet says: Why, O God, have you cast us off to the end? And there he openly and tearfully lamented that he had forgotten his congregation and cast away the rod of his inheritance, and that his enemies had risen up against the people of God, of whom he says: And those who hate you have boasted in the midst of your feast. Perhaps this little verse would seem to point to the Assyrians, who triumphed over the people of the Jews, were it not followed by: They set up their signs as signs, and I did not know them. There are always signs, that is, standards, in war, which are wont to go before those about to fight and to lead the army's column. Every company or legion follows its own signs. And if they have been scattered by the turmoil of battle, they return to where they have seen their own signs to be, however far away they are. Every commander sets up these signs and prescribes that they be followed. But there are also other signs, which the victorious enemy imposes and decrees are to be observed as by captives; but he who is a faithful soldier follows his own signs and does not know foreign ones.

Let us consider more attentively and more earnestly what the foreign signs are. Christ has set his sign on the foreheads of each one; there too the Antichrist sets his signs, so that he may recognize his own. But to him who is a Jew in secret the true confessor says: They set up their signs as signs, and I did not know them. The devil and his ministers set them up, but I did not know them, because I did not consent to his arts, I did not yield to his commands. The Assyrian Nebuchadnezzar set signs upon the youths of the Hebrews and changed their names, and ordered that they should worship his image and withdraw from the solemn rites of their fathers and, setting the law of God aside, follow the rites of the Chaldeans. The king decreed this, but Daniel resolved in his heart to shun the contagion of the royal table. Rightly, then, it befits him to say that he did not know the foreign signs. It had been ordered that the Hebrew youths should worship the king's image; they answered him: We do not worship your image. Fittingly, then, each of them said: They set up their signs as signs, and I did not know them, that is, I did not experience them, I did not receive them by any consent, I did not take them over into myself by any fellowship. Hence also we read of the Son of God that he did not know sin. And elsewhere you have: For he who keeps the commandment does not know a wicked word, since it is perfectly clear that what is meant is not the knowledge of wickedness but a criminal fellowship. David himself also says later: But the malicious who turned away from me I did not know, and he declares where the adversaries wished to set these signs. As on a way he says above the summit. As in a forest of trees they have cut down its gates with axes all together; with the two-edged axe and the adze they have thrown it down. What does this mean, except to show that our faith ought not to be as if on the way, lest the birds of the sky come and take it away, just as that word which you read of in the Gospel ought not to be sown along the ways and paths?

Therefore the adversaries, wishing to uproot the faith of this holy man, since they do not see their signs in his heart, tried to place them as if on the way, that is, in an open thoroughfare; but the heart is at the summit, because the eyes of the wise man are in his head. And they set up signs as in a forest of trees, which are quickly burned up by fire or cut down with axes; for fire goes out from the forest and burns up even the cedars of Lebanon. And they thought this should be done in order to defile the tabernacle of the divine name, which is in us. For just as we are the temple of God, so too are we the tabernacle of God, in which the feasts of the Lord are celebrated. Therefore you, O man, guard your summit, so that you may shatter the heads of the enemies, the crown of the hair of those who walk about — for they walk about in superfluous things, not in holy ones: in the crown of the hair, not in the crown of devotion and faith — and if the spirit of one who has power rises up against you, as you have in Ecclesiastes, do not leave your place. For Christ, who made you after the image of God, has set you higher. Hold, therefore, the higher place of faith and devotion which you received from Christ, so that, having been made higher, you may easily repel the wicked spirit rising from the lower things, that is, from earthly and worldly things, and not receive his signs in your breast. Let him not occupy the porches of your soul nor the entrances of your mind, and, as in a forest of trees, lay waste with his fires what is frail and perishable, or cut down the doors of your heart with his axes. Let there be in us, then, not a forest but a vineyard; let the gate of our mouth and of our heart be shut most carefully, lest the enemy go in. He quickly splits the door if he finds it open; but Christ knocks, he does not throw it down, he who has strengthened, O Jerusalem, the bars of your gates. Christ knocks with his hand, that you may open; the adversary cuts down with axes; and therefore it is written that neither axe nor hammer should enter the house of God. Pride and deceit ought to be outside, not inside; for battles are outside, peace is inside, the peace which is above all understanding. Let your soul not be cut by the iron, but as the soul of Joseph did, so let your soul pass through the iron, lest your ruling part, like a kind of tabernacle of the Word, be torn down at the very beginning of faith and at the entrance of spiritual teaching. For one who is founded by practice and exercise remains immovable and gives no place to him who, transforming himself as it were into an angel of light, tries to climb up to the summit. If he does not see his signs in us, he will not be able to have the authority to resist. Therefore, so that the enemy may not afflict us, may not break our bones, let us not fail to persevere in Christ, so that he may say of us: It is three days now that they persevere with me, and I am not willing to send them away fasting, lest they fail on the way. Blessed is he to whom he himself has given the support of the heart, so that, set on the path of this life, he cannot fail. He does not fail who hopes in the Lord and praises him with inmost affection, since even that horseman whose horse's heel the serpent bit, although he fell backwards, was nevertheless not deceived, because he awaited salvation from the Lord.
'''
