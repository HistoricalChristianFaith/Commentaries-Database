[[commentary]]
quote='''
‘And the earth was void and without forms.’ The good architect lays the foundation first, and afterwards, when the foundation has been laid, plots the various parts of the building, one after the other, and then adds thereto the ornamentation. When the foundation of the earth has been laid and the substance of the heavens stabilized—these two are, as it were, the hinges of the universe—he added: ‘And the earth was void and without form.’ What is the meaning of the word ‘was’? Perhaps that men may not extend their hypothesis to refer to something without end and without beginning and say: See how matter, the so-called ὕλη of the philosophers, did not have a beginning according even to the divine Scriptures. However, to those who hold this belief you will reply that it is written: ‘And Cain was a husbandman.’ And concerning him who was called Jubal, Scripture states: ‘He was father of them who played upon the psalter and the cithern.’ Also: ‘There was a man in the land of Austide whose name was Job.’ Let them cease, therefore, to raise questions on the meaning of the word, especially since Moses had already asserted: ‘God created the earth.’ It ‘was’ therefore from the fact that it was ‘created.’

If they say that it was without beginning, maintaining that not only God, but also ὕλη, had no beginning, let them give a clear answer to the question: Where, indeed, was it? If it was in some place, then the place, too, is asserted to have been without a beginning, in which place was the material of the universe, which according to them had no beginning. But, if it seems absurd to think of a place, then perhaps we ought to imagine a flying earth, which, lacking a foundation, was suspended ‘by the oarage of its wings.’ Whence, therefore, can we lay hold of wings for it, unless, perchance, we were to interpret and apply thereto the words of the Prophet: ‘From the wings of the earth we have heard prodigies,’ and ‘Woe to the land to the oarage of ships.’

But, following this interpretation, in what air did the earth fly? It could not fly without air. Yet air could not yet have existed, because without material for the world no distinction of the elements had been made, since up to this point the elements had not been created. Where, then, was this material supported ‘by the oarage of wings’? It was not in the air, because the air is a body of the world. The Scriptures teach us that air is a body, because ‘when an arrow is shot at a mark,’ aimed at by the bowman, ‘the air presently cometh together again.’

Where, therefore, was the ὕλη [material]? Are you to suppose by some notion that it was God? God, a spirit most pure and incomprehensible, with a nature that is invisible and incorruptible, who ‘dwells in light inaccessible,’ was therefore the place of the material of the world? And was God a part of this world, of which not even the meanest of the servants of God have a part, as we are told in the Scriptures: ‘They are not of this world, even as I am not of the world.’

How, then, have things visible associated themselves with the invisible and how has that which is disorganized been linked with Him who has bestowed order and beauty on all things? Unless, perchance, they believe that the earth was invisible of itself in its substance, because it had been said: ‘And the earth was invisible.’ Or they might hold that the earth was invisible for the reason that when covered by water it could not be seen by mortal eyes, just as much as that which lies in deep water escapes the notice of our sharpest eyes. Nothing, in fact, is invisible to God, but something created in this world has, in this instance, been thought to be invisible to him by one who, too, is created.

Invisible, also, was the earth, because the light which illumined the world did not as yet exist, nor did the sun. The luminaries of the sky were, in fact, created later. But, if the rays of the sun frequently illuminate even that which is covered by water and reveal by the brilliance of its light things immersed in the depths, who would doubt that He can see what is invisible in the deep? Unless, perchance, we are to hold that the earth was invisible, because the earth was not yet visited by the Word and protection of God—the earth which did not yet contain man, for whose sake the Lord looked down upon the earth, as it is written: ‘The Lord hath looked down upon the children of men, to see if there be any that understand and seek God.’ And elsewhere He says: ‘Thou hast caused judgment to be hurled from heaven: the earth trembled and was still.’ And justly is the earth called invisible, because it was without order, not having as yet received from its Creator its appropriate form and beauty.

And perhaps they may say: Why did not God, in accordance with the words, ‘He spoke and they were made,’ grant to the elements at the same time as they arose their appropriate adornments, as if He, at the moment of creation, were unable to cause the heavens immediately to gleam with studded stars and the earth to be clothed with flowers and fruit? That could very well have happened. Yet Scripture points out that things were first created and afterwards put in order, lest it be supposed that they were not actually created and that they had no beginning, just as if the nature of things had been, as it were, generated from the beginning and did not appear to be something added afterwards. ‘And the earth was without form,’ we read, yet these same philosophers accord to it the privileges of immortality which they grant God. What would they say if its beauty shone forth from the beginning? The earth is described as immersed in water, condemned, as it were, to a shipwreck in its own first principles. Yet, some do not believe that the earth was made. What, then, if it lay claim to ornament from the moment of its creation?

Add to this the fact that God willed it that we be imitators of Himself, so that we first make something and afterwards beautify it. We would run the danger of attempting two projects at one time and accomplishing neither. And our faith grows strong step by step. For that reason, God created first and afterwards beautified, in order that we may believe that He who made and He who adorned were one and the same person. Otherwise, we might suppose that one adorned and that another performed the act of creation, whereas the same person achieved both, creating first and afterwards adorning, in order that one act might be believed as a result of the other.

You find in the Gospel clear testimony on this subject. For the Lord, when proposing to raise Lazarus to life, first ordered the Jews to remove the stone from the sepulcher, in order that, on seeing him dead, they might believe afterwards that he had risen from the dead. Next, He called Lazarus by name, and he arose and came forth with his hands and feet bound. Could not He who was able to restore the dead to life also remove the stone? And could not He who was able to restore the dead man to life also set him free from his bonds? Could not He who granted Lazarus power to walk with his feet still bound also render it possible for him to come forth with his fetters already broken? Of course, we see that He wished to point out first that the man was dead, so that they might believe with their own eyes. The next step was to raise him from the dead and the third to bid them unbind with their own hands the mortuary bands. By this process faith might be engendered in the hearts of the incredulous and belief come to life gradually, step by step.

God created first, therefore, heaven and earth, but He did not will them to be perpetual; rather, they subserve the final end of our corruptible nature. Hence, in the book of Isaias He says: ‘Lift up your eyes to heaven and look down on the earth beneath: for the heavens have the compactness of smoke and the earth shall be worn away like a garment.’ This is the earth which before was unformed. The seas were not yet confined within their limits and the earth was inundated by a deep flood. Observe that even now the earth has become unsightly with marshy mire and is not subject to the plough where water has everywhere covered the land. The land was, therefore, unformed, since it was as yet unploughed by the industrious attentions of the farmer, for the cultivator had still to appear. It was unformed because it was devoid of growing plants. The banks of streams lacked their grassy slopes; the land was not shady with groves or productive in fruits of the earth. The overhanging brows of the mountains did not produce shade; flowers did not as yet give forth odors; still unknown were the delights of the vineyard. Correctly, then, was the land called unformed which was devoid of ornament and which did not present to view the linked rows of budding vine shoots. God wished to show us that the world itself would have no attraction unless a husbandman had improved it with varied culture. The very heavens, when seen covered with clouds, often inspire men with dread fear and with sadness of heart. The earth, when saturated with rain, arouses our aversion. Who is not moved to fright by the sight of stormy seas? Most admirable is the aspect of created things. But what would they have been without light, what would they have been without heat and without the gathering together of waters, in which element some have supposed that this universe of ours, when once immersed, had its primal origin. Take away the sun from the earth; take away the round spheres of stars from the sky—every object is then shrouded in dread darkness. Thus it was before the Lord poured light into this world.

And for that reason Scripture says: ‘Darkness was over the abyss.’ There was darkness because the brilliance of light was absent; there was darkness because the air itself was dark. Water itself beneath a cloud is dark because ‘dark are the waters in the clouds of air.’ There was, therefore, darkness over the abyss of waters. I am not of the opinion that by darkness are to be understood the powers of evil, in that their wickedness was brought about by God. The reason is, of course, that evil is not a substance, but an accident and that it is a deviation from the goodness of nature.

Accordingly, a discussion of the question of evil in the constitution of the world should be laid aside for the moment, lest we seem to mingle that which is depraved with the work that is divine and with the beauty of the created. Especially should this be so for the reason that Scripture adds: ‘And the spirit of God moved over the waters.’ Although some consider this spirit as air, others think of it as the vital breath of the air which we take in and emit. However, in agreement with the saints and the faithful we consider this to be the Holy Spirit, so that the operation of the Holy Trinity clearly shines forth in the constitution of the world. Preceded by the statement that ‘In the beginning God created heaven and earth,’ that is, God created it in Christ or the Son of God had, as God, created it or God created it through the Son, since ‘all things were made through him and without him was made nothing that was made.’ There was still to come the plenitude of the operation in the Spirit, as it is written: ‘By the word of the Lord the heavens were established and all the power of them by the spirit of his mouth.’ As we are instructed in the psalm concerning the work of the Word, which is the work of God, and on the power which the Holy Spirit bestowed, so is echoed here the prophetic oracle, namely, that ‘God spoke’ and ‘God created’ and ‘the Spirit of God moved over the waters.’ While adorning the firmament of the heavens, the Spirit fittingly moved over the earth, destined to bear fruit, because by the aid of the Spirit it held the seeds of new birth which were to germinate according to the words of the Prophet: ‘Send forth thy Spirit and they shall be created and thou shalt renew the face of the earth.’ Finally, the Syriac text, which is close to the Hebrew and agrees with it in word for the most part, expresses it in this fashion: ‘And the Spirit of God brooded over the waters,’ that is, gave life, in order to help the birth of new creatures and by cherishing them give them the breath of life. For the Holy Spirit, too, is called Creator, as we read in Job: ‘The divine Spirit which made me.’

If, therefore, the Holy Spirit moved over the waters, there could not exist, just where the Spirit claimed such honor, the darkness of forces which are contrary to it. But if, as some would have it, we are to interpret ‘Spirit’ as ‘air,’ let these people answer the question: How did the Scripture speak of the ‘Spirit of God,’ when it would have been sufficient to mention simply ‘Spirit’?

These would have it, then, that first the four elements were generated by the Lord our God—that is, heaven, earth, sea, and air—for the reason that fire and air are the causes of things, while earth and water furnish the material from which are derived the beauty and form of the world. Where, therefore, could the darkness of the spirits of evil find a place, when the world has vested itself with the beauty of this august figure? Are we to hold that God at the same time created evil? But evil arose from us, and was not made by a Creator God. It is produced by the lightness of our morals; it has no prior right over any created thing, nor has it the dignity of a natural substance. It is a fault due to our mutability and is an error due to our fall. God desires it to be eradicated from the souls of each and everyone. How, then, could He have generated it? The Prophet cries out: ‘Cease to do perversely.’ And holy David has stated it with definiteness: ‘Turn away from evil and do good.’ How, then, can we assign to God the beginning of evil?

But this is the fatal theory of those who thought the Church should be thrown into confusion. From this are derived the sect of Marcio, of Valentinus; hence, too, that deadly pest of the Manichaeans which attempted to bring contagion to the minds of the faithful. Why do we search of ourselves to see in the light of life the darkness of death? Divine Scripture confers salvation on us and is fragrant with the perfume of life, so that he who reads may acquire sweetness and not rush into danger to his own destruction. Read with simplicity, man; I would not encourage you, a misdirected interpreter, to dig up meanings for yourself. The language is simple: ‘God created heaven and earth.’ He created what was not, not what was. And the earth was invisible, because water flowed over it and covered it. Darkness was diffused over it, because there was not yet the light of day, or the rays of the sun which can reveal even what lies hid beneath the waters.

Why, then, do they say that God created evil, although from principles contrary and opposed nothing whatsoever is generated? Light does not generate death nor does light give birth to darkness. And the processes of generation are not like the mutability of human emotions. The latter change from one opposite principle to another according to the various questions at issue. The former are not deflected from one point to its opposite, but, being created either by their authors or by causes of the same nature, they stand in a similar relationship to their Creator.

What, then, are we to say? If evil has no beginning, as if uncreated or not made by God, from what source did nature derive it? Because no rational being has denied that evil exists in a world like this in which accident and death are so frequent. Yet from what we have already said we can gather that evil is not a living substance, but is a deviation of mind and soul away from the path of true virtue, a deviation which frequently steals upon the souls of the unaware. The greater danger is not, therefore, from what is external to us, but from our own selves. Our adversary is within us, within us is the author of error, locked, I say, within our very selves. Look closely on your intentions; explore the disposition of your mind; set up guards to watch over the thoughts of your mind and the cupidities of your heart. You yourself are the cause of your wickedness; you yourself are the leader of your own crimes and the instigator of your own misdeeds. Why do you summon an alien nature to furnish an excuse for your sins?

Would that you did not give rein to yourself; would that you did not rush recklessly on; would that neither by immoderate desires nor through wrath or cupidity you involved yourself in bonds which trap us like so many nets. And surely it is in our power to moderate our desires; to curb our anger; to check our evil passions. It is also within our power to give ourselves up to luxurious living; to add fire to our lusts; to stir up the fires of our anger or lend our ears to one who ministers to them; to be unduly puffed up by pride; to allow ourselves to be carried away by acts of cruelty rather than that we should bend ourselves to humble deeds and find delight in acts of kindliness.

Why, then, man, do you accuse nature? Nature has old age and illness which serve as so many impediments to our lives. But old age becomes sweeter and more useful by its wise counsels and characters. It becomes more ready to face inevitable death with constancy and becomes more heroic in quelling lusts of the flesh. Infirmity of the body, too, is conducive to sobriety of mind. Hence the Apostle says: ‘When I am weak, then am I strong.’ Accordingly, he gloried not in his virtues but in his infirmities. A divine saying also flashes forth from that salutary oracle: ‘Strength is made perfect in weakness.’ We ought to guard ourselves against the ‘sins of youth’ which arise from free acts of our will, and we should avoid the irrational passions of the body. Let us not search outside of ourselves or attribute to others the causes of that of which we ourselves are sole masters. Let us, rather, recognize these causes as belonging to us alone. We ought to attribute to ourselves the choice of an evil which we are unable to do without consent of the will rather than ascribe the same to others. In the courts of the world guilt so is imputed and punishment meted out, not to those compelled to crime by necessity, but to those who have acted voluntarily. It is true that the person who in a rage slays another is subject to the penalty of death. Why, even according to the decree of the divine law itself, a person who inadvertently kills another may expect impunity by accepting the possibility of exile, if he wishes to escape punishment.

This, then, may be stated on the question of what in the real sense of the word seems to be evil. Wrong does not exist except when the mind and conscience are implicated and bound up with the guilt. Moreover, no intelligent person would call poverty, disgrace, or death an evil. He would not list them in the category of evils, because they are not the opposite of those goods held in the highest esteem—goods which seem to fall to our lot either from causes which stem from nature or from the favorable circumstance of our lives.

Not without a purpose have we introduced this digression in order to prove that the phrase ‘darkness and the abyss’ should be taken in literal sense. In fact, the darkness under discussion comes especially from the shadow cast from the heavens, since every body produces a shadow by which it casts a shade either on what is near by or on what is beneath it, and above it casts a shadow on those objects which it seems to cover or include. The firmament of the heavens does include the earth, because, as we have shown above, heaven stretches itself out like a vault. Therefore, darkness was not an original substance, but the mist of darkness accompanied like a shadow the body of the world. Accordingly, at the instant that the world arose at the divine command there was enclosed within it a shadow. Just as if a person in the midst of a plain illumined by the midday sun were, at the spur of the moment, to hedge some spot and cover it with thick leafy branches, would not his hut with its rude, stage-like background become rather all the more obscure within in contrast to the exterior, so brilliantly illuminated? Or why was a place closed on all sides called a cave unless it is that it is a place obscured by darkness and forbidding because of its blackness?

This darkness then was over the abyss of waters. For the Gospel teaches us that the abyss is a mass of deep waters, where, in fact, the demons entreated the Saviour ‘not to command them to depart into the abyss.’ But He who taught that the will of the demons should not be obeyed caused them to enter into the bodies of swine. And the herd of swine rushed down the cliff into the pool, so that the demons did not escape what they rebelled against, but were, as they deserved, submerged in the depths. Unformed, therefore, was the appearance and shape of this world.
'''
