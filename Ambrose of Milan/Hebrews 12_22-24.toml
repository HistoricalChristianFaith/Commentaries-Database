[[commentary]]
quote='''
And the Lord says: Then let those who are in Judaea flee to the mountains, where are Mount Zion and the city of peace, Jerusalem, built not of earthly but of living stones, and ten thousands of angels, the church of the firstborn, the spirits of the perfect, the God of the just, who in his own blood has spoken better than Abel. For the one cried out for vengeance, this one for pardon; the one accused his brother's sin, this one forgave the sin of the world; the one exposed the crime, this one covered it, according to what is written: Blessed are they whose sins are covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"
