[[commentary]]
quote='''
But the ruler of the synagogue, not understanding this, was forbidding anyone to be healed on the sabbath, though the sabbath is a type of the rest to come — and therefore it is a rest from evil work, not from good — and for this reason it was prescribed that, carrying no burden of sins and not empty of good works, we should celebrate the sabbaths that are to come after death. Hence the Lord seems to answer spiritually, when he says: hypocrites, does not each one of you on the sabbath loose his ox or his ass and lead it to water?

For why did he point to no other animal, except to show that, though the rulers of the synagogue opposed it, it would yet come to pass that the Jewish and the Gentile people would lay down the thirst of the body and the heat of this world by the abundance of the Lord's fountain? The ox indeed has known its owner and the she-ass its master's manger. And so that people, which before was fed on the nourishment of cheap hay, which withers before it is plucked up, has received that bread which came down from heaven. And therefore through the calling out of two peoples he says that the Church will be saved, which, when the time of the Law was fulfilled and in the age of the Lord's resurrection, had received the time of its release. How merciful then is the Lord, how kind in both, whether he pities or punishes! In the type of the synagogue he orders the tree to be cut down, in the type of the Church he saves the woman. How sweet the parable, and how easy the solution. He compares bond with bond, so that the charge of the Jews may be refuted by their own action. For while they themselves loose the bonds of animals on the sabbath, they reproach the Lord, who freed men from the bonds of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
