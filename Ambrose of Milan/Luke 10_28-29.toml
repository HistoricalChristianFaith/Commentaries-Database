[[commentary]]
quote='''
Hence the Lord says to the lawyer: do this and you shall live. But he, who did not know his neighbor because he did not believe in Christ, answered: who is my neighbor? So he who does not know Christ does not know the Law either. For how can he know the Law when he is ignorant of the truth, since the Law announces the truth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
