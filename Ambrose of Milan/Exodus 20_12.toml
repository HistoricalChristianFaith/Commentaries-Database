[[commentary]]
quote='''
The formation of the children is then the prerogative of the parents. Therefore honor your father, that he may bless you. Let the godly man honor his father out of gratitude and the ingrate do so on account of fear. Even if the father is poor and does not have plenty of resources to leave to his sons, still he has the heritage of his final blessing with which he may bestow the wealth of sanctification on his descendants. And it is a far greater thing to be blessed than it is to be rich.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="THE PATRIARCHS 1.1"

[[commentary]]
quote='''
Well, then, did the law, which had first said: You shall love the Lord your God, and you shall love your neighbor, add: Honor your father and mother. For this is the first step of dutiful love; for God willed these to be your authors. Honor them with services, so that you refrain from insults, because the dutiful love owed to parents must not be wounded even by a look. But it is little not to injure them, for the law has provided that they suffer no wrong — for he who, indeed, curses father or mother shall die the death — but you, honor them, so that you may be good. The benefit of the law is one thing, the duty of dutiful love another. Honor your own, because the Son of God honored his; for you have read: And he was subject to them. If God was subject to his little servants, how much more you to your parents? Christ, then, honored Joseph and Mary, not by the debt of nature but by the duty of dutiful love; he honored also God the Father as no one else could honor him, so as to be obedient unto death: honor, then, your parents, you too.

Now honor consists not only in respect but also in generosity. Honor widows who are truly widows; for it is honor to bestow according to merits. Feed your father, feed your mother. And if you have fed your mother, you have not yet repaid the pains, you have not repaid the torments which she suffered for you; you have not repaid the services with which she carried you, you have not repaid the nourishment which she gave with the tender affection of dutiful love, milking her breasts into your lips; you have not repaid the hunger which she endured for you, lest she should eat anything harmful to you, lest she should drink anything that would harm the milk. For you she fasted, for you she ate; for you she did not take the food she wanted, for you she took the food she did not want; for you she kept vigil, for you she wept: and will you let her be in want? O son, how great a judgment you take upon yourself if you do not feed your parent! You owe what you have to her to whom you owe what you are. How great a judgment, if the Church feeds those whom you will not feed! If any believing man he says or any believing woman has widows, let him provide for them, so that the Church be not burdened, so that it may suffice for those who are truly widows. This is said of strangers: what of parents?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
