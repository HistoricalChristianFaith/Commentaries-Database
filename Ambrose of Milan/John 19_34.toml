[[commentary]]
quote='''
I ask too why we do not find that he was pierced before his death, but find it after his death, unless perhaps that his death may be shown to have been voluntary rather than of necessity, and that we may know the mystic order, because not the sacraments of the altar before baptism, but baptism first, then the cup. Next, that we may notice that, although the nature of his body was mortal, although its quality was similar, yet its grace was dissimilar. For certainly after death the blood congeals in our bodies, but from that body, incorrupt indeed but dead, the life of all flowed forth; for water and blood came out, the one to wash, the other to redeem. Let us drink, therefore, our price, that by drinking we may be redeemed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
