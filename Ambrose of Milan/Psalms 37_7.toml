[[commentary]]
quote='''
Be subject to the Lord and entreat him. You are admonished not only to be subject to the Lord but also to entreat the Lord, so that you may be able to fulfil your zeal for subjection, as he also said above: Reveal your way to the Lord and hope in him. It befits you not only to reveal your way but also to hope in the Lord. And good subjection is not abject, not base, but glorious and sublime; for he is subject to God who does the will of the Lord. Thus, who does not know that the wisdom of the mind is more excellent than the wisdom of the flesh? Now the wisdom of the mind is subject to the law of God; the wisdom of the flesh is not subject, and the Apostle added: nor indeed can it be. Be subject, then, that is, next to Christ, so that you may fulfil the law. Thus Christ, by doing the will of the Father, fulfilled the law, and therefore he is the end of the law and the fullness of charity, because, loving the Father, he applied his whole effect to his will. Hence the Apostle said, by way of glory: But when all things have been subjected to him, then he himself also will be subject to him who subjected all things to himself, that God may be all in all, and he himself says of himself: Is not my soul subject to God? For from him is my salvation. Thus it was out of dutiful love, not out of weakness, that he was subject to his parents Joseph and Mary. But the greatest glory of Christ is that he pours himself into the hearts of all men and calls all back from the ungodliness of unbelief and from the disposition of heathenism, so as to make them subject to himself. But when he has subjected all things to himself, when the fullness of the Gentiles has entered and all Israel has been saved and in the whole world there is one body in Christ, then he himself also will be subject, offering his gift to God the Father, and as it were the prince of all priests and possessed of the heavenly altars, so that the faith of all may be the sacrifice. This subjection, then, belongs to loving-kindness, in that the Lord Jesus will be subject in the body, whose body and members we are. Be subject, then, O man, to Christ, that is: subject to the wisdom of God, subject to the Word, subject to righteousness, subject to power, because Christ is all these things. Let every man subject himself to God; for he teaches not one but all, that they should subject their heart, subject their soul, subject their flesh, so that God may be all and in all. He, then, is subject who is full of grace and takes up the yoke of Christ and carries out the commandments of the Lord vigorously and without hesitation; but he is without subjection who exalts himself in vain, puffed up by the sense of his own flesh, unused to devotion and turning aside from the observance of devout service, which by the very right of nature we owe to the eternal Author. Lastly, he who is without sin is subject to Christ, since he has been redeemed by the Lord; but he who is in sin cannot be called free, but a slave, whom the heavy chains of sin hold fast.

There follows: Do not be emulous of him who prospers in his way, working iniquity. Here he has clearly made known what he meant above: that the malignant are not to be roused to malignity by emulation, nor are those who work iniquity to be imitated. For it is not iniquity, but the prosperity that comes to those who do unjust things, that often stirs us to think that they should be imitated, so that we may arrive at their successes, saying: Behold, these are sinners, and abounding in the world they have obtained riches. And I said: Then in vain have I justified my heart and washed my hands among the innocent, and I have been scourged all the day. If, then, David was scourged, we ought to beware lest we too be scourged, and it be said to us that riches, honours, powers seem to have been allotted to this generation as the wandering and uncertain works of money and the gains of iniquity, not as any rewards of virtue, and therefore they come like a dream and, when you rise, they vanish with the dream. It is certain that athletes themselves are crowned when they have conquered, not before they conquer. Our wrestling is with the world; conquer the world first before you seek the crown. No one is crowned beforehand unless he has completed the contest. Do those who run the race receive the prize before they have run through the course? How many who were ahead fall at the finish and are cheated of the swiftness of their running! Are you more acceptable to God than Paul? He, the vessel of election, he, the teacher of the Gentiles, never dared to claim a crown for himself in this world. Thus hear him say: I have fought the good contest, I have finished the course, I have kept the faith; as for the rest, there is laid up for me the crown of righteousness, which the Lord will render to me on that day. That Paul who was caught up into the third heaven — who heard the things which it is not lawful for a man to speak, and does not know whether he was caught up in the body or without the body, as he himself has testified —, Paul, then, says that the crown is to be rendered to him on that day: do you insist that it be rendered to you here? Fulfil, then, the time of your contest. Not once only does the athlete wrestle, nor once only does the soldier fight, so as to be able to complete his service; and you too have a wrestling not with one passion only.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
