[[commentary]]
quote='''
Rightly therefore the Lord became a hart, so that the voice of the Lord might prepare for himself such harts, of whom he says: In my name they will cast out demons, they will speak with new tongues, they will take up serpents, and if they drink anything deadly, it will not harm them. For they took up serpents when the holy apostles, by the spirit of their mouth, drew the spiritual wickednesses out of the lurking places of bodies, and did not feel the deadly venoms. In short, when a viper springing out of the brushwood had bitten Paul, the barbarians, seeing the viper hanging from his hand, thought that he would suddenly die. But he stood undaunted, and was neither moved by the wound nor filled with the venom. Hence, seeing him as one not begotten by the condition of man but brought forth, as it were, by the grace of God, they thought him to be above men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 1"
