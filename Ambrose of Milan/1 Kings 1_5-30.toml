[[commentary]]
quote='''
Let us come to other things. He suffered plots from the king; the king sought to extinguish his life, but when by divine disposition the king was delivered into his power, and lay wholly open to the wound as his companions were about to strike, holy David ran to meet them and turned the deadly wound away from the body of the man about to perish, saying: Do not touch the Lord's anointed. Indeed he even avenged the death of his enemy, lamented his end most tearfully, and long put off the kingdom owed to him, which he knew was owed to him on God's authority. By this alone he taught all men that a kingdom must not be seized beforehand, even if it is owed, but must be waited for, that it may be conferred in its own time.

Would that posterity had imitated this man! We would not have endured such bitterness of wars. You charge that he killed one man; you do not consider that he taught how perpetual peace might be preserved for the Roman world. With what heavy devastation have we paid until now, with what public funeral, as it were, of the whole world have we atoned for the murder of a king who was attacked? Alas, harsh punishments! From this the barbarian enemy still insults us, while arms prepared against him are turned against us. So the public strength has fallen, so Roman valour, broken by its own upheavals, has grown old, while what is received in reverent regard for a father's care is seized by public parricide. And David guarded against this so far that, when he learned that his son Adonijah was usurping the kingdom for himself and forming gatherings, he chose not him who was eager to seize it beforehand, but him who would wait.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
