[[commentary]]
quote='''
And first, if an unknown road must be taken, guides of the roads are chosen to go before the column; but these commanders think this an affront to themselves: God, however, went before when the Hebrews made their journey, and indeed spoke to them in the pillar of cloud. And that you may know that he went before: God, it says, went before them: by day in the pillar of cloud, showing them the way; but by night in the pillar of fire, and the pillar of cloud did not fail by day (Exod. 13:21 and 22). The Church, following this pillar which goes before us, which does not fail, lest she herself should fail, was refreshed by its shadow; and therefore she says: In his shadow I desired, and sat down, and his fruit is sweet in my throat (above, v. 3); because she was fed by the Lord, and led into a place of pasture and to the water of refreshment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
