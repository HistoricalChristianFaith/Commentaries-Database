[[commentary]]
quote='''
And therefore, in the first place after this, the man with dropsy is cured, in whom the overflowing flux of the flesh weighed down the duties of the soul and quenched the ardor of the spirit. Next humility is taught, when at that wedding feast the seeking of a higher place is checked, yet gently, so that the kindness of persuasion might shut out the harshness of coercion, reason might advance to the effect of persuasion, and correction might amend the affection. To this, as at the next threshold, kindness is joined, which by the definition of the Lord's sentence is marked out thus, if it is bestowed on the poor and the weak; for to be hospitable to those who will repay is an affection of avarice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
