[[commentary]]
quote='''
For he was suffering the assault not of one demon but of a whole legion; and this legion, when it had seen the Lord and recognized, foreknowing it, that at the time of the Lord's coming it was to be thrust into the abyss, began to beg that it might receive leave to enter into the swine. And first we ought to notice the clemency of the Lord, in that he himself condemns no one first, but each one is the author of his own punishment; the demons are not sent into the swine, but they themselves ask it, because they could not bear the brightness of the heavenly light, just as those whose eyes are sore cannot bear the sun's ray, but choose dark places and forsake bright ones. So let the demons flee the splendor of the eternal light and dread before the time the torments due to them, not divining what is to come but remembering what has been prophesied; for Zechariah said: and it shall be in that day, the Lord will destroy the names of the idols from the earth, and there shall be no more remembrance of them. And I will burn up the unclean spirit from the earth. We are taught, then, by this that they will not abide forever, nor can their malice be perpetual. Now, therefore, fearing that punishment, they say: you have come to destroy us. But because they still desire to exist, as they now withdraw from men, on whose account they know they must undergo punishment, they ask to be sent into the swine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
