[[commentary]]
quote='''
But now let the victor raise up his trophy. The cross is placed upon his shoulders as a trophy, which, whether Simon carried it or he himself, both Christ carried in the man and the man carried in Christ. Nor do the accounts of the evangelists disagree, when the mystery agrees; and it is a good order for our progress, that he himself should first raise the trophy of his cross, then hand it over to the martyrs to be raised. It is not a Jew who carries the cross, but a foreigner and a stranger, and he does not go before but follows, according to what is written: Take up your cross and follow me. For Christ ascended not his own cross, but ours. Nor was that the death of the divinity, but as of a man. Whence he himself says: God, my God, look upon me! Why have you forsaken me?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
