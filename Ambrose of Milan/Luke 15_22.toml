[[commentary]]
quote='''
Or the robe is the cloke of wisdom, by which the Apostle covers the nakedness of the body. But he received the best wisdom; for there is one wisdom which knew not the mystery. The ring is the seal of our unfeigned faith, and the impression of truth; concerning which it follows, And put a ring on his hand.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he orders a robe, a ring, shoes to be brought out. The robe is the cloak of wisdom, with which the apostles cover the nakedness of the body, in that each one wraps himself in it. And therefore they receive the robe, that they may clothe the weakness of the body with the power of spiritual wisdom. For of wisdom it is said: he will wash his robe in wine. So the robe is the spiritual clothing and the wedding garment. What is the ring but the seal of sincere faith and the impress of truth? And the shoe is the preaching of the Gospel. And therefore he received the first wisdom — for there is also another, which does not know the mystery — he received the seal of his words and deeds, and a kind of defense of his good intention and of his course, lest anywhere he strike his foot against a stone and, tripped up by the devil, abandon the office of preaching the Lord. This is the preparation of the Gospel, which directs those who are prepared to the course of heavenly things, so that we walk not in the flesh but in the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
