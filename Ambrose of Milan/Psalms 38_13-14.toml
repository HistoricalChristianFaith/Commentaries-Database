[[commentary]]
quote='''
"Shut out, then, from the odium of accusation, they used deceit, so as to rise up", he says, "against me and insult me, to goad me to some agitation; and I, seeing their deceit, like one deaf, did not hear". Consider the force of the word. He did not say "because I pretended not to hear what they said", but he said "I did not hear", and that by the intention of his mind he shut out the voice of the speaker and did not open his mouth, like one dumb. Blessed is he who can have such great virtue that, provoked, he is not angry, and, stirred, he will not avenge himself. Enemies do this to provoke to wrath: they curse, that we may curse; they accuse, that we may throw back the accusation; they revile, to rouse us to return the insult. Whence Peter finely set down of the Lord Jesus in his epistle that when he was cursed he did not curse, when he suffered he did not threaten. Desiring to shape the ordering of his life to his likeness and image, the righteous man, when accused, is silent; when hurt, forgives; when provoked, lets it pass and does not open his mouth, so as to imitate him who was led like a lamb to the sacrifice and does not open his mouth, and who, though he could have something to answer, prefers to be silent rather than speak. For the Lord Jesus himself truly was silent when he was accused, and when he was struck did not strike back. Indeed, when struck he answered: If I have spoken evil, bear witness of the evil; if well, why do you strike me? See how, as if truly weak and as one who could not avenge himself, he spoke with a kind of childlike affection. So then you too, if you have the means to refute your accuser, will do better to be silent, lest by refuting in return you betray your agitation; for it is better to let an injury pass than to avenge it when you refute. Good is the dumb man who does not know how to speak evil, from whose mouth crime does not know how to come out. This is the truly blessed dumb man, who, when he is silent, speaks within himself: "The Lord gives me a tongue of instruction, when I ought to speak a word." Such things Zechariah spoke within himself when he had become dumb; and truly, because speaking had not profited him, he became dumb so as not to speak, and was heard by Christ so that he might speak. Indeed he wrote what Christ would hear, and received back the voice which Christ granted, and added the grace which he did not have before, to prophesy him whose commands he had not believed before. Why do I speak of the Lord of all powers, when the woman Susanna, not troubled even by the infirmity of her sex, uttered not a word to those by whom she knew she had been consigned to the peril of death? She was accused and was silent, she was led to death and covered herself with silence, so as not to lay bare her modesty. Yet within herself she spoke to God, who heard her the more when she was silent; had she wished to speak, she would perhaps not have been heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And you too, then, who have resolved to make satisfaction for your offences to the Lord your God, purge yourself to him alone with your inner heart, look upon him who can wash away sins. He who has thought that you should be rebuked is helping you. Indeed, when David was being cursed and his captain Abishai wished to avenge his injury, David said to him: Let him alone, that he may curse, since the Lord has spoken to him, so that he may see my humiliation, and the Lord repay me good for this cursing. You see, then, that you are helped by those who revile you, so that the Lord may hear you and remit your sin. For since you ought yourself to be your own accuser, and to embitter your outrages and offer yourself to punishment, how can you wish to deny what is cast up to you? Penitence seeks patience; patience softens great offences. How are you angry with others, you who are yourself guilty before your own conscience? How are you stirred, when you ought to be an object of pity? He who is rebuked, and, what is more, by himself, ought to care for his own wounds, not wound another. No one heals himself by wounding another. Physician, heal yourself. If a physician, how much more ought a guilty man first to heal himself! You confess your sin and you profess yourself another's physician: even if what you throw back belongs to the truth, it does not belong to the time; for to the sinner indeed God said: Why do you recount my righteous deeds? You have claimed the right to rebuke from the Law, you who yourself have stood against the Law. Why do you lose the time for tears? Why, by disputing, do you either hear or speak vain words, when it is written for you: You shall not receive a vain report, when you have read in the Gospel that judgement must be undergone for every idle word? Even if another speaks, be silent; even if another reviles, stop your ear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
