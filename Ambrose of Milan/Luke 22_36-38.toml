[[commentary]]
quote='''
He who has he says a purse, let him take it, and likewise a wallet, and he who has not, let him sell his tunic and buy himself a sword. Why do you command me to buy, you who forbid me to strike? Why do you prescribe that I have what you forbid to be drawn? Unless perhaps so that there may be a defence ready, not a vengeance made necessary, so that you may be seen to have been able to avenge yourself, but to have been unwilling. Yet the Law does not forbid me to strike back, and therefore perhaps, to Peter offering two swords, you say It is enough, as though it had been permitted up to the Gospel, so that in the Law there might be instruction in equity, in the Gospel the perfection of goodness.

To many this seems unjust, but the Lord is not unjust, who, though he could avenge himself, preferred to be sacrificed. There is also a spiritual sword, so that you may sell your patrimony and buy the Word, with which the inner recesses of the mind are clothed. There is also the sword of the Passion, so that you may put off the body and, with the cast-off covering of the sacrificed flesh, the crown of sacred martyrdom may be bought for you — as you can gather from the Lord's beatitudes, for he proclaimed the highest crown of all, if anyone suffers persecution for righteousness. Indeed, so that you may know that he spoke of the Passion, lest he should trouble the minds of the disciples, he brought forward an example from himself, saying:

that this which is written must be fulfilled in me, that he was also reckoned among the unjust. Yet it still troubles us that the disciples brought out two swords: perhaps one of the New, one of the Old Testament, with which we are armed against the snares of the devil. Indeed the Lord says: It is enough, as though nothing were lacking to him whom the teaching of both Testaments has fortified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
