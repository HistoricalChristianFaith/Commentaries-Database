[[commentary]]
quote='''
The root of Jesse the patriarch is the family of the Jews, Mary is the rod, Christ the flower of Mary, who, about to spread the good odor of faith throughout the whole world, budded forth from a virgin womb, as he himself said: "I am the flower of the plain, a lily of the valley."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25202.html'
source_title="On the Holy Spirit 2.5"

[[commentary]]
quote='''
He is the fruit of the womb, the flower of the root, of whom Isaiah prophesied well, saying: A rod shall come forth from the root of Jesse, and a flower shall rise up from the root; for the root is the family of the Jews, the rod Mary, the flower of Mary Christ, who, like the fruit of a good tree, according to the progress of our virtue now flowers, now bears fruit in us, now is restored by the resurrection of the body living again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
The root is the family of the Jews, the rod Mary, the flower of Mary Christ. Rightly a rod, for she is of royal race, of the house and country of David, and her flower is Christ, who abolished the stench of worldly filth and poured in the fragrance of eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"

[[commentary]]
quote='''
And the mind is in its vigour when a flower, too, is seen on the earth. Who is this flower of good fragrance but he who said: I am the flower of the field and the lily of the valleys? Of whom it is also written in Isaiah: A rod shall come forth from the root of Jesse, and a rod shall rise up from the root, and a flower shall come forth from the rod. The root, surely, is the family of the Jews, the rod Mary, the flower of Mary Christ; and when he shines forth in our earth and is fragrant in the field of the soul or blooms in his Church, we can neither fear the cold nor dread the rain, but can await the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"

[[commentary]]
quote='''
Who is this flower of good fragrance, if not he who said: I am the flower of the field and the lily of the valleys (above, verse 1): of whom it is also written in Isaiah: A rod shall come forth from the root of Jesse, and a rod shall ascend from the root, and a flower shall come forth from the rod (Isa. 11:1). The root surely is the family of the Jews, the rod Mary, the flower of Mary Christ: when he shines in our land, and is fragrant in the field of the soul, or blooms in his Church, we can neither fear the cold nor dread the rain, but can await the day of judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
