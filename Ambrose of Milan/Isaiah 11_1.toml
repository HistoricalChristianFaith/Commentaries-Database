[[commentary]]
quote='''
The root of Jesse the patriarch is the family of the Jews, Mary is the rod, Christ the flower of Mary, who, about to spread the good odor of faith throughout the whole world, budded forth from a virgin womb, as he himself said: "I am the flower of the plain, a lily of the valley."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25202.html'
source_title="On the Holy Spirit 2.5"

[[commentary]]
quote='''
And there shall come forth a shoot from the stump of Jesse, and a branch from his roots shall bear fruit. The root is indeed the family of the Jews, the branch is Mary, the flower is Christ of Mary, who when he shines forth in our land and delights the field of the soul, or blossoms in his Church, we cannot fear the cold, nor dread the rain, but await the day of judgment.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html"
source_title="Second Apology for the Prophet David, 8.43"

[[commentary]]
quote='''
He is the fruit of the womb, the flower of the root, of whom Isaiah prophesied well, saying: A rod shall come forth from the root of Jesse, and a flower shall rise up from the root; for the root is the family of the Jews, the rod Mary, the flower of Mary Christ, who, like the fruit of a good tree, according to the progress of our virtue now flowers, now bears fruit in us, now is restored by the resurrection of the body living again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
