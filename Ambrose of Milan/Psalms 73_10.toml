[[commentary]]
quote='''
And would that these too had returned like that one of the two young men: the good Lord would not have denied the remedy. And yet, even if they themselves do not wish to be healed, the Lord reserves the grace of return, so that those in Israel who were driven out through the blindness of their own heart may return through the fullness of the Church, and may not pass empty days of this life, but may have them full of good work and of faith, when the Lord has filled them with spiritual grace. And hear how they return. For blindness he says has befallen Israel in part, until the fullness of the Gentiles should come in, and so all Israel should be saved. But because the mystery had to be fulfilled, that God should shut up all things in unbelief, that is, should refute and convict them — for when two contend, if one is superior, it is said: he has shut up that other — and therefore through his mercy, that the world might be made subject to God, the people did indeed return in its heirs, but it was led astray by the error of a late crime, so as not to believe that God has foreknowledge of hidden things. But the Lord reserved for them the grace of future salvation, that they might be redeemed at some time, saying: Therefore my people will return hither. What is hither? That is, to me, to my equity and my justice, to my worship.

And it will fill up the days of its life. This you will certainly take in this way, that the people is indeed redeemed, the people that has believed. And in this, even if those who have not believed are not redeemed, nevertheless the prerogative of redemption is conferred on the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 5"
