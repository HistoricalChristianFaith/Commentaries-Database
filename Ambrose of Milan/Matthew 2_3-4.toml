[[commentary]]
quote='''
So the magi announce that a king is born: Herod is troubled, gathers the scribes and the chief priests and asks where the Christ is to be born. The magi announce only a king, Herod seeks the Christ; so he confesses the very king about whom he asks. Then, when it is asked where he was to be born, he is surely shown to have been foretold; for one who had not been foretold could not be sought. O senseless Jews, you do not believe that he has come whom you see; you do not believe that he has come whom you say is to come!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
