[[commentary]]
quote='''
Then it follows that Sarai, the wife of Abraham, had been barren. And she had an Egyptian handmaid, whose name was Hagar; and that this pertains to the Church we have shown with apostolic examples in that exposition which we wrote on the moral sense. For the Church seems barren in this world, because she brings forth neither worldly things nor present things, but things to come, that is, not those which are seen, but those which are not seen. Her handmaid is the synagogue, or every heresy, which begets slaves, not free sons. And therefore Hagar means sojourning. For she cherishes the hope of a temporal sojourning; she does not hold the grace of a perpetual possession. And so, lest her handmaid grow insolent through bodily childbirth and claim for herself the right of the Church, it is said there: cast out the handmaid and her son; for the son of the handmaid shall not be heir with my son Isaac.

But there is also a Sarah in each one and a Hagar in each one. Sarah is true virtue, true wisdom; but Hagar is cunning, as it were the handmaid of the more perfect virtue; for one wisdom is spiritual, another is the wisdom of this world. Therefore she is also described as an Egyptian, because philosophical learning abounded in Egypt. Thus Moses too was learned in all the wisdom of the Egyptians, but he cast it away, preferring to the treasures of Egypt reproach for the name of Christ. For if he had judged that wisdom to be of any moment, he would certainly not have said: I pray, Lord, I am not worthy, before yesterday and the day before, nor since you began to speak to your servant; for I am of slender neck and slower tongue. Thus, as to one unlearned, he is answered that he would be taught by the Lord: I will open your mouth and instruct you in what you ought to speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
