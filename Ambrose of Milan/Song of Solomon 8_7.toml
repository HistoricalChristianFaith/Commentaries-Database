[[commentary]]
quote='''
But even if some grievous things were threatening, they ought in no way to separate us from Christ. Why should we not also endure hard and bitter things for him who for us took upon himself things so unworthy of him? And therefore there ought to be love in us, so that no dangers call us back from Christ. For it is written: much water will not be able to shut out love, and rivers will not close in upon it, because the soul of one who loves passes over the torrent. No storm, no deep danger, no terror of death or of punishment lessens the strength of love; for in these things we are proved, in these is the blessed life, even if it be flooded with many dangers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 7"

[[commentary]]
quote='''
Many waters, he says, will not be able to shut out love, and rivers will not flood it. The many waters are those of diverse passions, and the rivers are those of worldly desires stirred up by bodily motions, which nevertheless cannot overthrow the wall of love. And therefore he who is founded in love says: Our soul has passed through the torrent (Ps. 123 (124):5). Could the water of the sea shut out the love of Moses? And, so that according to the letter the course of the psalms may support you: surely, loving God, he believed the way through the seas to be safe for him; but those who did not love God, sunk beneath the waves, suffered the end their sacrilege deserved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
