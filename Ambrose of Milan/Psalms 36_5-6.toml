[[commentary]]
quote='''
Next let us consider what follows: Lord, he says, your mercy is in heaven, and your truth reaches to the clouds; your righteousness is like the mountains of God, your judgements like a great deep. Did not Paul follow this passage when he said: Unhappy man that I am! Who will deliver me from the body of this death? The grace of God through Jesus Christ our Lord? For when the human mind is troubled and the hard and rough things of the contests weary us, the help of the Lord must be asked. And therefore, turning to the Lord, he calls upon him and implores him to stand by those who labour as their helper. Mercy, then, is to be sought from heaven, the truth of God gathered from the oracles of the prophets, who like clouds cover over the mysteries of divine knowledge. For God made darkness his hiding place, so that first you may receive the rain of mystic fruitfulness, and then, steeped in the heavenly dew, recognize the brightness of the light unlocked, so that you can say: Of his fullness we have received. For who can easily comprehend the secrets of God, whose righteousness is like the mountains of God, or, as Aquila has put it, like strong mountains, because his precepts are full of strong power? Hence the Apostle too, seeing that they are lofty, dares and says: O the height of the riches of the wisdom and knowledge of God! How unsearchable are his judgements and how untraceable his ways! For who has known the mind of the Lord? Or who has been his counsellor? So he related the height of the riches of wisdom to the height of the mountains; hear which mountains. For the Son of God himself is a great mountain, and therefore go up into this mountain, you who bring good tidings to Zion, that you may stand rooted and planted in Christ. There is a mountain as the wisdom of God, there is also a mountain as the righteousness of God, there is also a mountain as the knowledge of God, there is a mountain as sanctification, there is a mountain as redemption, there is a mountain as resurrection. Scripture has shown us these mountains, which said: But in him you are in Christ Jesus, who was made for us wisdom from God, and righteousness and sanctification and redemption; or else because the Son of God became an angel to angels, a prophet to prophets, he whose judgements are like a great deep. Hear what is good: Deep calls on deep at the voice of your cataracts, that is: the Scripture of the Old Testament summons the course of the New Testament to the consummation of sanctification and the fullness of grace, with a certain sound and outpouring of spiritual overflow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
