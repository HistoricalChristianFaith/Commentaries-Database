[[commentary]]
quote='''
He beholds three and one he adores. He offers three measures of fine flour. Although God is immeasurable, He nevertheless holds the measure of all things, as it is written: Who hath measured the waters in his hand and weighed the heavens with his palm and the bulk of the earth in the hollow of his hand? The holy patriarch, therefore, offered sacrifice in the secret recesses of his heart to the Trinity made perfect in each of the Persons. This is the spiritual meaning of the measures of fine flour. This is the measure of fine flour mentioned in the Gospel which was ground by the woman who will be taken. One will be taken; the other will be left. The Church will be taken; the Synagogue will be left, or the man of good conscience will be taken and the man of bad conscience, left.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 8"
