
[[commentary]]
quote='''
Nor let the poison of Apollinaris flatter itself because it is read thus: And found in appearance as a man (Phil. 2:7); for the man Jesus is not denied, since elsewhere Paul himself says of him: The mediator of God and men, the man Christ Jesus (1 Tim. 2:5); rather it is confirmed. For it is the use and custom of Scripture to signify in this way, as we also read in the Gospel: And we saw his glory, glory as of the only-begotten from the Father (John 1). As, then, he is said to be as the only-begotten, and it is not denied that he is the only-begotten Son of God, so too he is said to be as a man, and it is not denied that the perfection of man was in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
