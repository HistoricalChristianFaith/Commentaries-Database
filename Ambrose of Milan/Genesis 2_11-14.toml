[[commentary]]
quote='''
There is also another tradition: that there are waters from which Jeremiah forbids us to drink, saying: what have you to do with the way of Egypt, to drink the water of Gihon? There is also the river Tigris, flowing past the Assyrians; there is also the Euphrates, stretching into Babylonia; there is also the Pishon, which in Latin interpretation is called "change of mouth", encircling the land of Havilah, where there is gold, and the gold of that land is good, and the carbuncle stone and the leek-green stone. Rightly is the mouth changed there, so that faith in promises is not kept, but there is deceit in the mouth, where there is good gold; for avarice breaks faith and does not keep simplicity of words, and precious ornaments too change the mind and spirit, so that there is one thing in the breast, another in speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
