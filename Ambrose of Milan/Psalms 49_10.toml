[[commentary]]
quote='''
Let us, then, be taught of God, so that none of us may see destruction on that day when the wise of this world, or the princes of the Jews, will be condemned to perpetual death, when the unwise and the foolish shall perish together. The two are not the same: the foolish is he who has no wisdom and understands foolish things; the unwise he who is wise amiss: The unwise man has said that there is no God; just as the iniquitous man is so called, not because he does not know equity, but because through the wickedness of his heart he commits iniquitous things, so the dishonest man too is so called because he wishes to destroy honesty by his malice, not because he is ignorant of honesty. When, then, the unwise and the foolish themselves perish, they leave their riches to strangers; for they cannot find their own lawful heir of folly and dishonesty. For the lawful ones say: That we are sons of God. And if sons, heirs also; heirs indeed of God, and co-heirs of Christ, provided that we suffer with him, so that we may also be glorified together. The unwise, then, do not have riches, since they do not have an inheritance either. The faithless do not have riches, nor a possession; for to the faithful man the whole world is a possession. They do not have an inheritance, since there is an inheritance only for those who believe in the Lord. But they have their own riches, and so the covetous man says: I have nowhere to gather my fruits; for money is not the true fruit, but the fruit of the covetous. And the Lord says to the covetous man: Go, sell your goods, and come, follow me; for a patrimony is not the perfect good, but these are the goods of the covetous, which consist in some gain. Sell, he says, what you think to be yours, though they are not yours, since they pass to others like a river, and follow me, so that you may know the immortal good. The wise, then, are led into destruction, from whom God has hidden what he has revealed to little ones. The unwise and the foolish will perish together and will be in one and the same place, and they will leave their riches to strangers, since wickedness does not find a lawful successor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
