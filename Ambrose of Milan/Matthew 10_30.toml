[[commentary]]
quote='''
What is he numbered? That is, he chose. Hence that saying too refers not only to God's knowledge but also to the grace of the just, which the Lord Jesus spoke in the Gospel: and all your hairs are numbered. For the Lord knew those who are his, but those who are not his he does not deign to know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
