[[commentary]]
quote='''
There follows: Not so the ungodly, not so, but like the dust which the wind casts forth from the face of the earth, that is: not so as the blessed man, who is blessed because he has not walked in the counsel of the ungodly, because he has not stood in sin, has not sat in the council of the pestilent who wish to pervert those who either believe devoutly or live devoutly; who has had his will in the Law and will meditate in it, or, as Aquila put it, will resound in the Law, so that his life may resound with the precepts of the Law and his conduct echo them, like those whose sound has gone out into all the earth. Perhaps here the sound of men's teaching goes forth, but there, where it will be granted to see face to face, a kind of fuller expression of the word seems to come about. Not, then, as this blessed man who has done these things, who will be like a planted tree, all of whose deeds will prosper, so too will the ungodly man be. Therefore he repeated it — either he who wrote it or he who added it afterwards, as some think — so that the repeated sentence might be the more confirmed, by saying: not so the ungodly, not so; they will be like dust. For they are earthly, and as dust is cast forth from the face of the wind, so these too will be cast forth and scattered by the Holy Spirit, who is wont to breathe like the south wind upon the fertile and fruitful earth of a wholesome soul.

To this wind it is said in the Song of Songs: come, O south wind, so that by the mildness of a softer air the fields of our heart may be loosened, which, bound by the winter frost, refused their lap to the seeds to be received. It is good for us that this wind should breathe, to bring safely into port the ships of Tarshish that carry to the true Solomon the things that seem needful for his temple. But this wind breathes only then, if that heavy wind, the north wind, has ceased to blow. Therefore either the Church or the devout soul says: arise, O north wind, and come, O south wind, that is: you, north wind, withdraw; and come, south wind, breathe upon my garden, so as not to shake off the flowers but to preserve them. The soul full of devotion, then, has a garden, or is itself a garden that bears fruits; the soul that lies open to ungodliness has dust, which is barren of fruit. The Lord indeed made it fruitful, but it gathered for itself the dust of ungodliness.

Why do you boast, O you who are full of ungodliness? Is it because you are powerful in honours and abound in riches? Do you not notice that you are dust, and that you will be dispersed and scattered? I saw, he says, the ungodly man exalted beyond measure and lifted up above the cedars of Lebanon, and I passed by, and behold, he was not. Why do you glory because many servants throng about you, many friends guard your sides, very many horses follow you, whose pedigree you would recount to us, and as it were the lineage of their ancestors? You display your riches because you feed your companions at banquets. Would that you fed the needy, would that you fed not the ministers of jests but the helpers of your prayers! You boast that people give way to you at once as you come forth, and men avoid you as they would a wild beast or a brute. "Are these things not something?" Do you not hear that all these things pass away like a shadow? What good are the consular purple-bordered robes or the triumphal palm-embroidered robes shining with gold? You will go out naked; no one there will recognize a consul. What do countless possessions profit? They are public, not yours; today you hold them, tomorrow another. When you have gone out, another comes in; scarcely have you moved your foot, another has stepped in. How many were there before you, how many will be masters there after you! And do you think this is private? Whom have riches ever redeemed from death, nay rather, whom have riches not driven to death? Whom has his wealth called back from the underworld, whom has power excused from punishment? Ungodliness is dust, as the power of the ungodly is dust; it brings darkness, it cannot give salvation. As soon as a vehement wind has begun to blow, it scatters it and dissolves it, troubles the air, lays bare the ground; like dust it is cast forth, like smoke it fails, like wax it melts.

Hence many have raised no small question, whether divine Scripture seems to assert that nature perishes, especially since elsewhere it says: I will crush them like dust before the face of the wind, and like the mud of the streets I will wipe them out, and elsewhere: behold, all the adversaries shall be confounded and shall be ashamed; for they shall be as though they were not. First, then, I ask whether they think ungodliness is according to nature or contrary to nature. If they assert that it is according to nature, it is certain that their opinion errs. Then let them say whether sin befits nature or not. But it is certain that to sin is to deviate from what is according to nature. What, then, is so absurd as for them to say that to be ungodly seems a lesser thing than to be a sinner, when the bitterest of all is whatever is seen to be done to the injury of God? But if acting ungodly is not contrary to nature, then living ungodly according to nature should neither be counted as sin nor be judged worthy of reproach; for no one is reproached who acts according to nature. Hence it is concluded that ungodliness is contrary to nature. How, then, does Scripture bring in, together with the destruction of a habit, συναπολουμένας φύσεις, that is, natures that will perish, when ungodliness is certainly not natural but contrary to nature? For what you do not have you do not lose, nor can that substance perish which did not exist. For dust too, when stirred, is changed either into the substance of water or into air or into fire, that is: it often seems to pass into another nature. It does not, then, fail into nothing, but passes into something else.

What, then, prevents him too who is crushed like dust by the power and reason of the word from being, not scattered into nothing, but changed for the better, so that from an earthly man he becomes a spiritual one, and from being wiped out like the mud of the streets in such a way that whatever seems rough and filthy is taken away and whatever is smooth and clean remains? And as for what he says of the adversaries of Jerusalem: they are as those who are not, he could certainly have said: "they will not be". But since he said: they shall be confounded and shall be ashamed, you surely understand that they will be, in substance and in the progress of conversion, but they will not be as adversaries, which they were. And so through the failing of their wickedness they will not be; they will be, changed by faith and devotion. In fact, elsewhere too it is said in the person of the sinner: and I will bear the anger of God, because I have sinned, until he justifies my judgement; for God, desiring to convert the sinner, punishes him and burns him in order to cleanse him. Hence he says: and he will lead me out into the light. For fire too burns wax: it melts so as to be purified; and we are proved through fire; and smoke, once all its material has been consumed, is purged away and does not pass beyond its nature. And so the soul too, purged of every stain, fails into what is, not into what is not, as Balaam says: let my soul die in the soul of the righteous, so that its fall and a certain habit of wickedness might die, but it might pass into the conduct and life of the righteous; for God wills all things to be saved. Hence Solomon too said: God did not make death, nor does he rejoice in the destruction of the living. He made the soul that it might be; he created man for incorruption, whom he made to his own image; but men, deviating from the gift of nature, made themselves liable to death, so that, as earthly, they are corrupted. But God drives them through tribulations to penitence, so that through penitence that accidental evil of wickedness may be burned and consumed and may perish, and that place of the soul which was the possession of accidental ungodliness may lie open to receive virtue and grace. And it is certain that the nature of the soul is precious, which, made to the likeness of God, admits the reception of every virtue, inasmuch as it has not been defrauded of a share in the knowledge from above.

Now we think there remains what is on the lips of many: for what reason God, without whose will not even the cheapest sparrow falls and with whom the hairs of the head are numbered, said through Isaiah: if all the nations have been reckoned as a drop from a pitcher and as the tipping of a scale, and shall be reckoned as spittle. Will all the nations, then, perish just as a drop from a pitcher and as spittle perishes and serves no use? But you who know that our God did not hold the nations as nothing to such a degree, he who said to Abraham: in you all the nations shall be blessed, and spoke through David to the Son, saying: I will give you the nations for your inheritance, and further on: all the nations shall serve him; you who have read that he offered his Son for every nation, to save sinners: you ought to consider in this place the force of the divine sentence. For in contemplation of the heavenly creatures, which are many — such as the heaven, which is manifold greater than the earth, so that by most the earth has been reckoned a point in comparison with the heaven; angels, archangels, principalities and powers, thrones, dominions, thousands and ten thousands and innumerable thousands —, in contemplation, then, of these, the nations have been reckoned as a drop from a pitcher to which belongs all the fullness. From that heavenly fullness, then, the nations have been reckoned as a falling drop. For how could they seem very great, when the earth itself, on which the nations are, is the smallest portion of the world, and the nations are, among all the things God has made, like the slight dip of a scale? At the same time, learn through this scale that God founded all things with justice, and that in the nations themselves there is by nature something in which there would seem to be even a slight weight of justice, and that the spittle itself comes forth as an inner portion, as it were, out of the totality of the whole body.

Here, then, it is rather mercy that is proclaimed, since he who came to seek what had perished did not despise that drop as worthless, but lifted up the tipping of the scale, and deigned to give that spittle the substance of a good body, that is: to gather all the nations into the one body of the Church. And among the nations Israel too can be numbered, by no means without a share in his divine justice, since Moses himself said of Israel: behold a wise people, and a great nation holding fast to discipline. And that you may know that the goodness of God has overflowed beyond our merit, the Apostle, interpreting this prophetic passage, says: God has shut up all things in unbelief, that he may have mercy on all, and added: O the depth of the riches of the wisdom and knowledge of God! How unsearchable are his judgements, and how untraceable his ways! For who has known the mind of the Lord? Or who has been his counsellor? Or who has first given to him, and it shall be repaid him? And the prophet, setting this passage first, says: if all the nations have been reckoned as a drop from a pitcher, and the rest, so that you may recognize that this understanding agrees with the Apostle's interpretation.
'''
