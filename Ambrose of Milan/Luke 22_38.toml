[[commentary]]
quote='''
There are also two other swords in the Church, of which it is said: Lord, behold, here are two swords, namely of the ecclesiastical power and of the worldly, to which a false mercy is opposed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
