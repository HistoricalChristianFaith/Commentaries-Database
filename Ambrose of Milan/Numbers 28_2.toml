[[commentary]]
quote='''
We realize, therefore, that above all things our trust in God should commend us to Him. Once we have this trust, let us put all our efforts into making our works perfect. This is indeed a full and perfect sacrifice, as the Lord tells us Himself in speaking of gifts and contributions that are His: You will offer to me my oblation in my festal days, sparing nothing, setting nothing aside, but offering a full, complete, and perfect sacrifice. By festal day is meant the Lord's Day, a time appropriate to acts of perfect virtue. These acts are made perfect if our souls quell the anxieties of this world and the enticements of the flesh in a victorious struggle over pleasure and its attractions. Thus the soul is free from the world and dedicated to God, departing not even in the slightest way from the path of good intentions and casting aside all distractions, whether of pleasure or of toil. The wise man, and no one else, celebrates with due solemnity this festal day. How difficult it is for one to be completely immune from distractions of this sort!
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 2"

[[commentary]]
quote='''
From Him have you received whatever you may offer, to Him belongs what you are paying Him. Presents, He says, are mine, gifts are mine, that is, "the presents which you offer to me are my gifts; I have granted and have given them to you." Therefore the prophet says: "Thou hast no need of my goods; hence I offer Thine own to Thee, since I have nothing which Thou hast not given." It is faith that reconciles gifts, it is humility that commends offerings. By faith Abel offered to God a greater sacrifice. Above the gifts of his brother Cain was the gift of Abel pleasing because he surpassed in faith. Whence is it that the poor man's sacrifice pleases more than that of the rich? It is because the poor man is richer in faith, more wealthy in sobriety. And since he is poor, he is of those of whom it is said: Kings shall offer presents to thee. For not in those who bring presents clad in purple does the Lord Jesus delight, but in those who govern their passions and by the power of their minds have dominion over the lust of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 16"
