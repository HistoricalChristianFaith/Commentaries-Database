[[commentary]]
quote='''
But the perfect soul turns away from matter; it flees and spurns everything immoderate, unstable and malign, and neither looks upon nor draws near to the corruption of that earthly stain: it strains toward divine things, but flees earthly matter. And flight is not to leave the earth, but, while being on earth, to hold fast to justice and sobriety, to renounce vices, not the uses of the elements. Holy David fled from the face of Saul, surely not so as to leave the earth, but to avoid the contagion of a man harsh, heedless and faithless. Yet he fled cleaving to God, as he himself says: my soul has cleaved behind you. He drew himself away and lifted himself up from the vices of this world; he lifted up his soul, as Isaac in the field either withdrew himself or, as others have it, walked about.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
