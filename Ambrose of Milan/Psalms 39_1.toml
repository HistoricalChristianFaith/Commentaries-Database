[[commentary]]
quote='''
Title: Unto the end, for Jeduthun; a song to David himself.

In the preceding psalm the form of penitence was expressed; in this one that follows, the form of patience is marked out. This psalm David wrote and gave to be sung to Jeduthun, a man trained in the Levitical and priestly disciplines, who, most skilled in composing the series of psalms, used to lead the singing before the ark of the Lord. Since, then, it was not Jeduthun who wrote this psalm, but the prophet David, who gave it to Jeduthun, a man skilled in singing, to be sung, the title has therefore been inscribed thus. Indeed, in secular writings too there were some who wrote, and others who were accustomed to sing on the stage either songs or comedies or tragedies. And these indeed sought the Olympic crown, which is why their writings also bear witness at the end to an epinician hymn. But David, who did not seek these garlands of withering crowns, but with devout affection longed for that incorruptible and undefiled reward, the inheritance of heavenly things, wrote a hymn that was not an epinician of victory, but to him who imparted victory to those who believe in him, who is the end of all things that we ask with a devout mind. For whether you seek wisdom, or devote yourself to virtue, or to truth, or to the way and righteousness, or to the resurrection, in all things you must follow Christ, who is the power of God and wisdom, the truth, the way, righteousness, the resurrection. To whom, then, should you strive but to the perfection of all things and the sum of the virtues? And therefore he says to you: Come, follow me, that is, so that you may deserve to attain the consummation of the virtues. Therefore he who follows Christ ought to imitate him according to his ability, so that he may meditate within himself on his precepts and on the examples of his divine deeds.

And therefore David meditated within himself, because he kept in mind that Christ had spoken in him, so that, when some were troublesome to him and tried to provoke him to contention, he might put on patience and decline the zeal for disputing, from which empty clamour and quarrels frequently arise. And so, since many who envied his virtues and believed that he must be drawn away from his purpose of gentleness and from his disposition of humility frequently assailed holy David, and since above all the spiritual wickednesses in the heavenly places themselves, against which the righteous have a grievous wrestling, drove the ministers of their wickedness on to stir him up, the holy prophet resolved to keep silent, lest amid the frequent contests of those clamouring against him and the tumults of dispute some word of offence should slip from him. O silence, strong shield of circumspect defence! O most trustworthy foundation of steadfastness, on which, if anyone can stand, he cannot fear the slipperiness of speech! For many, though made firm even with a steady heart, have yet often fallen, careless, through the error of wavering speech. Seeing, therefore, that he was being tempted by snares of this kind and by the empty clamour of those contending with him, the prophet pondered silently within himself, imposing on himself a law of silence; and when he kept silent before those who insulted him and provoked him to say something — such as the contests and speeches of insolent men usually are: "Answer us, if you presume to be our equal; you see that you too are beaten and have nothing to reply" —, when he seemed almost driven to speak by their reproaches, he called himself back, so as to speak in his heart:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
I said: I will guard my ways, that I may not offend with my tongue; I have set a guard to my mouth, while the sinner stands against me, that is: I resolved, I confirmed, I commanded myself, I spoke to my heart: "I will guard my ways". If I had said it to others, my word ought to stand; how much more steadfast ought that to be which I have appointed for myself! If anyone deceives a stranger, it is unseemly; if a neighbour, it is grievous; how much more grievous, then, if anyone thinks he must cheat himself of what he has promised himself, so that by his own judgement he is reckoned faithless to himself and contemptible! To whom, then, can he seem fit who is worthless to himself? Let us therefore hold to the constancy of our soul, lest our lips, hasty to speak, burst out into offence. Job too overcame his wound by silence and by keeping quiet surpassed his own endurance. The flesh is not well trusted; we would have lived, if Eve had kept silent. Therefore that first sin came forth from the voice, and that most wicked and cunning serpent tempted us first through the voice. And would that either Adam had been deaf or Eve had been dumb: he, so as not to hear his wife's voice; she, so as not to speak to her husband and, through the service of a slippery voice, pour the serpent's poisons into her husband! Cain too, although by his parricide he violated human nature and, ungodly, blotted out the rights of dutiful love, nevertheless through his voice added sacrilege to his crime, in denying to God the death of his murdered brother. Why should I speak of individuals? The very people chosen by the Lord, for whom Moses in silence opened the sea, ungrateful for heavenly benefits, murmured, and by this incurred the divine displeasure. Then it rejected Moses himself, the leader of that pathless and unaccustomed journey, and demanded of his brother Aaron that gods be made for it to worship.

Hence he too, considering such great dangers of the voice, said: I will guard my ways. What, then, are these ways of man which must be greatly guarded, lest they incur some graver offence? So great a prophet admonishes us to consider it more diligently; Solomon his son, the interpreter of his father's mind, admonishes us also to examine it more keenly, who wrote: Three things are impossible for me to understand, and a fourth which I do not know: the track of an eagle flying, and the way of a serpent on a rock, and the paths of a ship sailing on the sea, and the ways of a man in his youth. Three things, then, he said were impossible for him to understand; a fourth, which he, who held among men the seal of wisdom, did not know, namely the course of the ways of a man in his youth. Can the guarding of ways, then, be easy, when the knowledge of them is either inexplicable or difficult? Hence not without reason David himself offered no defence of the sins of his youth, but asked that they be forgotten: The sins, he says, of my youth and of my ignorance remember not. Not without reason, then, did Solomon say that he did not know what his father, in whom there was a greater grace of God, testified that he had been ignorant of. And perhaps he referred the sins of youth to the heat of the flesh, but those of ignorance to the slipping of words, which are mostly poured out not from our judgement but from a certain impulse and rush of speaking; and the prophet, knowing that this is dangerous, says: I believed, therefore I have spoken. Upon the foundation of virtue, then, the voice is safe; without a foundation it is slippery. Therefore, as with the sound of a trumpet, the chosen interpreter of divine Scripture rang out: With the heart one believes unto righteousness, with the mouth confession is made unto salvation. In believers faith is the principal thing; confession belongs to its carrying out.

Let us hear, then, how the holy prophet David resolved to guard his ways, or for what reason: that I may not, he says, offend with my tongue. If the prophet guards against this, do you not guard against it? If he in whom the grace of God spoke feared this, do you not fear, you who do not shun words of error and delight in theatrical talk? Do you not dread it, you for whom it is written in the Gospel that for every idle word you will render an account? If there is danger for an idle word, how much more for a criminal one! Not everything that is idle is also criminal, but everything that is not fruitful is dangerous and fit to be uprooted; for every tree that does not bear fruit is cut down and cast into the fire. When the mind is moved and stirred up by adversaries goading it, clamouring, mocking, accusing, a word of agitation slips out; therefore silence is both safe and seemly, for it keeps caution with dignity. For what are our lips but certain bonds of ours? Indeed, each one is bound by the bonds of his own lips. Therefore the wise man keeps silent in season and considers within himself at what time he ought to speak. Of this Solomon himself says excellently: The lips of the wise are bound with understanding. When, therefore, you see a wise man keeping silent while shameless men mock him, you will say: He has bound his lips with understanding, that is, he keeps silent prudently, so as not to be tied up in the bonds of his own lips. He has set a guard to his mouth, he has hedged his ears with thorns, he has put a bar to the doors of his mouth, he keeps the treasure of his heart and the silver of his speech, so as to bring it forth tested and refined when it is fitting, lest some thief or disturber first break into his heart and drag him captive to those to whom he may sell his crimes.

Judas was meditating on selling Christ, but the great grace of the Lord called him back, and certain soothing charms of fatherly loving-kindness, by which his fury was softened; nor would he have broken out into the crime, had not the adversary plunged himself into his heart, because he thought he was deceiving Christ. Do not doubt, then, when some are troublesome to you as you wish to keep righteousness, that they are ministers of that most wicked sinner who is the author of all crimes. David saw with prophetic eyes, he recognized his figure; therefore he kept silent, so as not to do the will of him who longs to throw the disposition into confusion. He held down his voice, he closed his gates with silence, patience was held before him as a shield in it, and he kept watch with the guard of silence, lest the enemy creep in, lest some wandering and careless word go out from the bars of his mouth. Therefore the patient man who restrains himself is stronger than he who takes cities. The righteous man is himself his own bar, himself his own ever-watchful guard.

When, therefore, he set this as a shield before himself, he spoke in his heart: I have set a guard to my mouth, while the sinner stands against me. The enemy is always present, because he always lies in wait. Even if you do not see him, he is present; even if you do not perceive him, he attacks. If you do not see, believe him who sees: he stands, he says, against me. He who sees his own sin sees also the sinner mocking him in the things he has done; but he who has foreseen the sinner can avoid sin. David saw the sinner standing against him when Shimei cursed and stoned his king and shouted: Go out, you man of blood. For he would not have been so headlong as neither to be moved by reverence for so great a king nor to fear his armed host, when one man of his host could have killed the reviler; but the devil had made him mad, driving him on to death. Therefore David fought against the author rather than pursuing the minister. For what great thing was it to take vengeance on a feeble man whom another was urging to fury, in whose killing the sinner would have achieved the effect of his will? The devil is conquered not by the sword but by the word of God; therefore let the tongue of man be silent, let the word of God speak. Indeed Christ too was silent when he stood before the judgement of Pilate, to give us a pattern of keeping silent, because the tongue of the body is easily led to error, prone to falling. But there are also those who speak while silent, like Moses, who stood astonished and was silent, to whom, as he kept silent, God said: Why do you cry to me? Like Susanna, who was silent in her dangers, and the Lord heard her. Therefore, even if the word of God is in you, you will both keep silent in the word of God and, silent, you will cry out, so that you may be heard by Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Meditate, then, on the things that are Christ's, on which the prophet David meditated within himself, in whom Christ beforehand spoke the things he says in this psalm that he meditated within himself. For thus it is written: But I, when they were troublesome to me in anything, clothed myself with sackcloth and humbled my soul with fasting, and my prayer shall be turned back into my bosom. What is "in anything"? Because it is then above all that either an unseasonable word slips out or the affection is stirred, when we are in some grief or sadness, or the mind grows sick with indignation, or is hampered by some anxieties, or is taken up with disputes. Who, then, are troublesome? Understand it first of the author of sin himself and his angels, then of those who prefer to be his followers rather than Christ's. A wife is driven on, like holy Job's; a friend, as is made plain in that same book; a son, like Absalom; a slave, a freedman and a member of the household, because a man's enemies are even those of his own household, so that one by one they harass him. What remedy, then, against such sicknesses of minds but patience, but silence? And, what is more grievous, he provokes you more who has enjoyed your benefits, and among them he exasperates you more who owes you more, so that you are the more moved by the bitterness of an ungrateful man or by the indignity of some worthless person.

Therefore the righteous man, even if his friend is insolent to him, grieves for his friend, because his friend is slipping so, because he is driven on by the tempter. If he grieves for a friend, much more for a wife, for a son, if he finds them too insolent to him; and if a brother harasses him, as Esau did holy Jacob, he grieves and seeks to reconcile his brother to himself or to flee from his face, as Rebekah urged, lest his brother's wrath should find some occasion of doing harm; and if a neighbour or a member of the household does so, he grieves; and if an attendant or a freedman or a slave, he bears it patiently, and in all these things he keeps silent, so as not to answer the one by whom he sees the man driven on. Someone of the household reviles him, then: he grieves and is silent; a freedman reviles him: he is silent; a slave reviles him: he is silent. Thus is he overcome who spreads a snare for his soul with the bait of the voice. Be silent, then, you too, when an unworthy man reviles you; be silent when a slave, and above all your own, insults you, and say in your heart: I am silent, but you, do not be silent, O Lord, and add: do not depart from me, as the prophet David said, that is: do not leave me alone to those who attack me; for he is not alone to whom God is present. Take the testimony: Behold, he says, the hour comes that you will be scattered each to his own and will leave me alone; but I am not alone, because the Father is with me.

The righteous man, then, is silent before those who are insolent to him; the righteous man prays. Hear the righteous man praying: Instead of loving me they disparaged me, but I prayed. The righteous man blesses those who curse him, as the apostles did, as Paul affirms, saying: We are cursed and we bless. The righteous man loves his enemies. See how he is taught to ascend little by little, step by step, to the increase of the virtues, as the Lord says: Love your enemies. The righteous man prays for those who slander him, because the Lord commanded this too, adding: Do good to those who hate you, pray for those who slander and persecute you. He is righteous in every respect who keeps and observes these things: first, because he is silent and does not answer his enemies; next, because he prays, that is, he is not idle in his affection. And he who prays prays for good things, not for whatever might harm his enemy. It is more, then, to pray than to be silent. The righteous man blesses those who curse him. This is more than praying for himself; for, secure about himself, he blesses one whom he does not fear, or even one whom he feared before. The righteous man loves his enemy. It is more to love than to bless, because the love of the mind is greater than the graciousness of speech. The righteous man does good to him by whose hatred he has been attacked; the righteous man prays for those who slander him. Good is love and good is loving-kindness; both are of God and both are God, because love is God, as John said in his epistle. Therefore both are joined: Love your enemies and pray for those who slander and persecute you. Love is the fullness of the Law, but this too is the fullness of the Gospel, to pray for those who slander and persecute us, so that we ask pardon for their sins, just as holy Job was chosen by divine judgement, so that his prayer might abolish the offence of those kings who slandered the righteous man.

Therefore, if you are weak, pray, and if you are strong, pray; weak, you pray for yourself; strong, you pray for your enemy. Prayer is a good shield for weakness; you pray and the Lord protects you. It is a good shield also for one who triumphs, so that you defend your enemy whom you could strike, lest he be slain by someone and, what is greater, by Christ, who said: Vengeance is mine, I will repay. This is the prayer that is turned back into the bosom of him who prays, bringing back the fruit of the things he wished to obtain, so that the gifts he asked of the Lord return into his soul and mind, as this same prophet taught you later on, saying: So will I bless you in my life, and in your name I will lift up my hands. Let my soul be filled as with fat and fatness. The bosom of the soul is the secret place of its prayer, the inner chambers of the will, and certain innermost receptacles of the vows that return. Hence too the righteous are read to rest in Abraham's bosom, because those who have put on a faith conformed to his and have made their will the same as his in good works rest in his grace, in his rest, in his calm.

But perhaps someone may wonder, since the Lord said through the mouth of David that he humbled his soul with fasting, how David himself says later on: If I was not humbly minded, but exalted my soul. But let him consider that one thing refers to the wisdom of the mind, another to the humility of the heart. The wisdom of the mind is lofty, but the wisdom of the flesh ought not to be puffed up. He humbled his soul, then, with fasting, to teach that the swelling of our flesh must be chastised; the prophet exalted his soul through the sublime grace of God, since also he who exalts himself shall be humbled and he who humbles himself shall be exalted. And not only is the proud man beaten down and the humble man raised up by the due reward of merits, as must be understood first; but because the word of God is sharp on every side, like a sword which is sharp on three sides, I think it can be understood that both he who exalts himself knows how to humble himself, and he who knows how to humble himself knows also how to exalt himself. Indeed Paul shows it, saying: But I have learned to be sufficient in whatever state I am. I know both how to be humbled, I know also how to abound. So David too, by not thinking humbly of Christ, exalted his soul, which the Arians humble and cast down, and by exalting his soul through the vigour of his understanding and the grace of faith he represented the virtue of humility with devout affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
