[[commentary]]
quote='''
Abraham divided, because the land could not hold them he says together, since they were exceedingly rich. It is a vice of the world that the earth cannot hold the rich; for nothing is enough for the greed of the rich. The richer anyone has become, the greedier he is to possess. He desires to extend the boundaries of his field, to shut out his neighbour. Was Abraham anything of this kind? Not at all, although in the beginning he too was less perfect. For whence came perfection before the coming of Christ? He had not yet come who would say: If you wish to be perfect, go, sell all that you have and give to the poor, and come, follow me. Yet, as one not at all avaricious, he offers the choice; as a just man, he cuts off the dissension. Let there not be he says a quarrel between me and you and between my shepherds and your shepherds, because we are men who are brothers. Behold, is not the whole land before you? Depart from me: if you go to the left, I will go to the right, or if you go to the right, I will go to the left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
