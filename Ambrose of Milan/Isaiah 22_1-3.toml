[[commentary]]
quote='''
For not in every house are there vessels of gold and silver, but in most there are wooden ones; nor is every house full; for there are empty ones too, which the prophet knew, who said: What has happened to you now, that you have gone up into empty houses? The city is filled with those crying out. And he added: All your princes have fled, all who were wounded in you and have fallen from faith into unbelief. Sabellius was wounded, Valentinus was wounded, Arius was wounded; for they were found in an empty house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
