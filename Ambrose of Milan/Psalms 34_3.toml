[[commentary]]
quote='''
For the Lord is magnified, as you have read elsewhere too: Magnify the Lord with me, not that anything can be added to the Lord by a human voice, but because he is magnified in us: for Christ is the image of God, and so, if the soul does anything just and devout, it magnifies that image of God to whose likeness it was created; and therefore, while it magnifies it, it becomes more exalted by a certain participation in its greatness, so that it seems to express that image in itself by the splendid color of good deeds and by a certain emulation of virtue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
