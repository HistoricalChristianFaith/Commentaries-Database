[[commentary]]
quote='''
The just man bears witness and disowns a posterity that would not keep its father's affection, and because he foresaw the crime, he shudders at the contagion of their counsel. Into their counsel, he says, let my soul not come, and into their assembly let my inmost parts not strive, for in their anger they slew a man and in their desire they hamstrung a bull. What he says, he says indeed of his sons Simeon and Levi, but under their name he signifies the tribes, which were called by the same name. This most beautiful interpretation the Jews turn aside, and they think that Jacob rebukes his sons for this reason: that on account of the violation of their sister these two, wishing more than the other brothers to take vengeance on the Shechemites, pretended that they wished to enter into friendship with them, and therefore persuaded them that they ought to be circumcised, so that by a common religion peace between them and the fellowship of the kinship to be contracted might be confirmed. But they fell upon them when they had been circumcised, while their wounds were still fresh and their strength feeble, loosened by pain, and on the arrival of the third day they slew them, broken as they were. And perhaps these two were avengers above the rest for this reason too, that they are the founders of the scribes and the priests; for none ought more than the wise and the priests to defend chastity.

But in this too the Jews err. For these men had set before their father the grounds of their grievance, asserting that, though at that youthful age, they had been the vindicators of wounded piety and the avengers of violated chastity. This holy Jacob certainly could not condemn, because they did not suffer their sister to be left unavenged in the position of a harlot, she who had both lost her virginity and had not the consolation of vengeance; especially since he himself so approved the deed that, when he possessed Shechem, he gave it at his death to his most beloved son Joseph, saying to him: I give you Shechem as a special portion above all your brothers, which I took from the hands of the Amorites with my sword and bow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 3"

[[commentary]]
quote='''
It is tribes, then, that are designated by the names of the patriarchs, because from the tribe of Simeon are the scribes, from the tribe of Levi the chief priests, who brought their wickedness to completion in the Lord's passion, filling up the whole measure of their fathers' impiety. They devised a counsel against the Lord Jesus, to kill him, as Isaiah says: Woe to their soul, for they have devised an evil counsel against themselves, saying: Let us bind the just one, for he is useless to us. They slew the prophets and apostles who announced the coming of the saving Lord and proclaimed the glory of his passion and resurrection. They afterwards in their desire, because they longed for earthly crimes and shrank from divine fellowship, from chastity of body, sobriety of mind, contempt of money, the gain of grace, hamstrung the bull, that bull, namely, which puts forth horns and hoofs, which the poor see and rejoice, since by the word of God he has exalted the horn of his people, with which he both drove back the enemies and won the prize of the heavenly crown. This is the bull by which the Church is figured, in the moon, which is fuller at the time when, resting as it were on the horns of a bull, it encloses the space of the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 3"
