[[commentary]]
quote='''
But we need no testimony that St. John turned the hearts of many, for to this point we have the express witness of both prophetic and and evangelical Scriptures. For the voice of one crying in the wilderness, Prepare ye the way of the Lord, and make His paths straight; and his baptisms thronged by the people, declare the rapid progress of conversion. For the forerunner of Christ preached, not himself, but the Lord; and therefore it follows, And he shall go before Him. It was well said, that he shall go before Him, who both in birth and in death was His forerunner.

For never is the spirit without power, nor power without the spirit. And therefore it is said, in the spirit and power; because holy Elijah had great power and grace. Power, so that he turned back the false hearts of the people to faith; power of abstinence, and patience, and the spirit of prophecy. Elijah was in the wilderness, in the wilderness also was John. The one sought not the favour of king Ahab; the other despised that of Herod. The one divided Jordan; the other brought men to the Saving waters; John, the forerunner of our Lord's first coming; Elijah of His latter.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And so he shall go before in the sight of the Lord in the spirit and power of Elijah. These are well joined; for never is the Spirit without power nor power without the Spirit. And so perhaps in the spirit and power of Elijah, because holy Elijah had both great power and grace: power, to turn back the minds of the peoples from unbelief to faith, the power of abstinence and patience, and the spirit of prophesying. In the desert Elijah, in the desert John; that one was fed by ravens, this one on brambles, and, trampling down every allurement of pleasure, he preferred frugality and despised luxury. That one did not seek the favor of King Ahab, this one spurned that of Herod; that one divided the Jordan, this one turned it to the saving washing; this one dwells with the Lord on earth, that one appears with the Lord in glory; this one is the forerunner of the Lord's first coming, that one of the following. That one after three years watered the earth with rains, and this one after three years drenched the drying soil of our body with the shower of faith. Do you ask what the three years are? Behold he says it is three years since I come seeking fruit on this fig tree, and I do not find it; for a mystical number was owed, that salvation might be restored to the peoples: one year in the patriarchs — indeed there was then such a yield of men from the year as there was not afterwards upon the earth — another in Moses and the other prophets, the third in the coming of the Lord Savior. Behold, he says, the acceptable year of the Lord and the day of retribution. And that householder who planted a vineyard sent collectors of the fruit not once but more often. First he sent servants, the second time other servants, but the third time he sent his son.

John came, then, in the spirit and power of Elijah; for the one cannot be without the other, as will also be found in what follows, when it is said: The Holy Spirit shall come upon you, and the power of the Most High shall overshadow you. But perhaps this example may seem to be above us and above the apostles; for that running back of the river's waters to the source of the stream, when the river was divided under Elijah, as Scripture has said: The Jordan was turned back, signifies the mysteries to come of the saving washing, through which those who have been baptized are re-formed as little ones from malice to the first beginnings of their nature. What of the fact that the Lord himself also promised his apostles that the power of the Spirit was to be bestowed, saying: You shall receive power when the Holy Spirit comes upon you? Then in what follows: there came he says suddenly a sound from heaven, as though the Spirit were borne with great force. Well with great force, because by the spirit of his mouth is all their power. And that is the power which the apostles obtained from the Holy Spirit.

Rightly too shall Saint John go before the face of the Lord, who was born a forerunner and died a forerunner. And perhaps this mystery is celebrated even today in this life of ours. For a certain virtue of John runs ahead of our soul when we prepare to believe in Christ, to prepare the ways of our soul for faith and make straight paths for our course out of the winding track of this life, lest we slip in the bend of error, so that every valley of our soul may be filled with the fruits of virtue, and every height of worldly merits may prostrate itself before the Lord in more humble fear, knowing that nothing can be lofty which is frail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
