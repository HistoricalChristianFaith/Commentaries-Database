[[commentary]]
quote='''
But as for his rebuking the disciples because they longed for fire to come down upon those who had not received Christ, it is shown us that vengeance must not always be taken on those who have sinned, since sometimes clemency profits more, you for patience, the fallen for correction. Indeed the Samaritans, from whom fire is warded off in this place, believed the sooner. At the same time learn that he did not wish to be received by those whom he knew had not turned with a simple mind; for had he wished, he would have made the undevout devout. But why they did not receive him the evangelist himself has recorded, saying: because his face was that of one going to Jerusalem. The disciples, however, longed for him to be received within Samaria, but God calls whom he deigns to and makes religious whom he wills. Nor do the disciples sin, who follow the Law; for they knew both that it was reckoned to Phinehas for righteousness that he had slain the sacrilegious, and that at the prayers of Elijah fire came down from heaven, so that the wrong done to the prophet might be avenged. But let him who fears be avenged; he who does not fear does not seek vengeance. At the same time it is shown us that the merits of the prophets were in the apostles, when they presume for themselves, by right of asking it, the same power which the great prophet earned. And rightly do they presume that fire would come down from heaven at their word, since they are sons of thunder.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
