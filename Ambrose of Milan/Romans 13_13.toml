[[commentary]]
quote='''
Hence the Apostle too says: Let us walk honourably as in the day, that is, not in taverns and hovels, not in chambering and impurities, in which the shameless man thinks he is covered by walls so as to be able to escape the knowledge of God, whereas the crimes of all are unveiled before God, and the sins of men cannot be hidden from the divine knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
