[[commentary]]
quote='''
To what shall I reckon the kingdom of God to be like? It is like leaven, which a woman took and hid in flour, until the whole was leavened.

This comparison belongs among the questions to be inquired into, since it spreads so much ambiguity that it has drawn the differing opinions of very many. Fittingly, therefore, we said above that Christ was a grain of wheat, because a spiritual leaven lay beneath for us; and for that reason many think that Christ is the leaven, because it raises up the power it has received. And because leaven, made from flour, surpasses its own kind in force, not in appearance, so Christ too, sprung from the fathers and equal to them in body, yet stood out incomparable in divinity. Let the holy Church, therefore, which is figured in the type of this woman of the Gospel, whose flour we are, hide the Lord Jesus in the inner parts of our mind, until the color of heavenly wisdom covers the secret inmost places of our soul.

And since we read in Matthew that the leaven was hidden in three measures, it seemed fitting that we should believe the Son of God hidden in the Law, covered in the prophets, fulfilled in the preachings of the Gospel, so that he may acquire perfect faith for us out of them all, and, formed by the comparison of the writings in us who are his body, may be fulfilled all in all; for he was the Word of God and the mystery which has been hidden from the ages and from the generations, and nothing can be said that bears more witness to the expression of his everlastingness. For he surely was; for he was in such a way that, hidden from the sacrilegious, made manifest in the saints, predestined before the ages, he was kept for glory. And this is glory, brothers, that we can search out the mystery hidden from the ages in God. Which is surely in God and from God; for God cannot admit an alien nature.

Nor am I in doubt that some think this was said of this world, until it be leavened in the Law, the prophets, the Gospel, so that every tongue may confess the Lord. So let us discuss all things, let us inquire more diligently. No one finds except him who has first sought. Let us build the tower, let us reckon the cost of the Scriptures, let us compare the expenses, lest anyone say even of any one of ours: this man wished to build and could not complete it. He who builds ought to lay a good foundation. Faith is a good foundation, a good foundation that of the apostles and prophets; for our faith rises up out of the two testaments, and he does no wrong who has said that the measure of perfect faith is equal in both, since the Lord himself says: if you believed Moses, you would believe me, because the Lord spoke in Moses too. Well then is the measure perfect in both, because he is perfect in both and the faith of both is one, because the oracle and the response are of one power and sense.

Yet I am glad to follow what the Lord himself taught, that the leaven of the Church is spiritual doctrine; for since it is written: beware of the leaven of the Pharisees, and since the Apostle has said: not in the leaven of malice and wickedness, it is shown that doctrine is leaven. But the leaven of tares is one thing, the leaven of wheat another; hence we also assent to good authors, so as to say that the Church sanctifies with a spiritual leaven the reborn man, who is in body and soul and spirit; for the body and the soul are sanctified, and the spiritual grace itself has received an increase of sanctification, when, through the office of the Church, as of something that leavens, and through the teaching of the Scriptures, which grows together as it were by the comparison and abundance of heavenly words, its use, poured into the whole man and mixed through him, has become ingrained, so that they themselves too become one leaven. This surely happens when these three agree with one another in an even balance of desires and an equal concord of wills breathes upon them.

This, then, is the work of the Church, not hasty nor fortuitous, but brought together by long meditation, that these three may be one, whole from the law of sin. Of this view we have the Apostle as champion, saying: may the Lord himself sanctify you in all things, that your spirit and soul and body may be kept whole without complaint in the day of our Lord Jesus Christ. This indeed does not come about through worldly temptations, unless that woman of the Gospel hides that leaven, to which the kingdom of heaven is compared, in three measures of flour, until the whole is leavened; for there are three measures, as I said, of flesh, soul and spirit, but the spirit, by which all of us set in this body live, is this more truly when the wantonness of the flesh does not overflow and the soul is not bent by bodily errors and the measure of living is kept unharmed in the whole man. But because the equality of the measures hardly persists without the aid of the Church and of doctrine, for this reason that woman, who bears the figure of the Church, mixes the power of spiritual doctrine into them until that whole inner, hidden man of the heart is leavened and rises into the grace of the heavenly bread. For well is the doctrine of Christ called leaven, because Christ is bread, and the Apostle says: for we, many, are one bread, one body.

So it becomes one leaven when the flesh does not lust against the spirit nor the spirit against the flesh, but we mortify the deeds of the flesh, and the soul, conscious that it has received the breath of life from the breathing of God, turns away from the earthly contagions of worldly ties. Hence the Apostle too has bidden us walk not in the flesh but in the spirit, so that, sanctified through the washing of regeneration, putting off the old man with his desires and having put on the new, who is created according to Christ, we may walk not in the oldness of the letter but in the newness of the spirit, so that even at the time of the resurrection an incorrupt communion of body and soul and spirit may remain for us, and that now we may obtain all that we ask. Many think that the Lord also signified this when he says: if two of you agree on earth, concerning anything whatever that you ask, it will be done for you by my Father, who is in heaven.

And so some take the two as the soul and the body, others as the soul and the spirit, so that, if on earth, that is, in the body, the soul and the spirit agree with each other and do not fight one another with diverse desires, all things prayed for may be seen to be capable of being brought to effect. This comes about when both have become one, if, the enmities being removed or dissolved, the two, that is, the soul and the spirit, are founded into one new man, so that we pray with the spirit, and pray also with the mind. Although many take them as the two peoples, from Israel and from the Gentiles, to be gathered into one at the time of the resurrection, so that there may come a perfection to remain forever, and that which is in part may be destroyed, many again take them as husband and wife agreeing with one another in the zeal of charity.

So if in this life the three measures have remained in the same leaven until they are leavened and become one, so that there is no difference between them in their equality and we do not seem compounded of the diversity of three, there will be in the future for those who love Christ an incorrupt communion, and we shall not remain compound; for we who are now compound shall be one and shall be transformed into one substance. For in the resurrection one part will not be inferior to another, as now the weakness of the flesh in us is frail, and the bodily habit of our nature either lies open to wounds or is subject to injuries or, pressed down by the mass of its own burden, cannot lift its step higher and raise it above the earth; but we shall be shaped into the grace of a simple creature, when what was said by John has been fulfilled: Beloved, now we are sons of God, and it has not yet been revealed what we shall be, but we know that when it has been revealed, we shall be like him. So since the nature of God is simple — God is indeed spirit — we too shall be shaped into the same image, so that as is the heavenly, such are the heavenly also. Therefore, as we have borne the image of that earthly one, let us bear also the image of this heavenly one, which our mind ought to put on.
'''
