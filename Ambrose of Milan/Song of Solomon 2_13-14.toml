[[commentary]]
quote='''
And although there is full calm and the mysteries have grown to maturity, yet he says again: arise, secure in the shelter of the rock, that is, safe in the protection of my passion and in the defence of faith; they sucked indeed honey from the rock and oil from the firmest rock. Clothed with this shelter, the souls of the devout are no longer naked, and this is their outer wall. And therefore he says to this soul too: and come, you, my dove, in the shelter of the rock, close to the outer wall, show me your face and let me hear your voice. He urges her to confidence, that she may not be ashamed of the cross of Christ nor of his seal; he urges her to confession; he wishes all snares to be removed, so that the good fragrance of faith may breathe, so that the day may shine, so that the shadow of the hostile night may do no harm, since he who is close to Christ says: the night is far spent, the day has drawn near. There is both the shadow of worldly things, which passes away, and the day of heavenly things, Christ, who shines for his saints. This soul receives good pledges of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
