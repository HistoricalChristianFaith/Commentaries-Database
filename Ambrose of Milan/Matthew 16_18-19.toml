[[commentary]]
quote='''
Peter was behind and was following him when he was being led by the Jews to the house of Caiaphas, the ruler of the synagogue. He is that Peter to whom he said: you are Peter, and upon this rock I will build my Church. Where Peter is, therefore, there is the Church; where the Church is, there is no death, but life eternal. And therefore he added: and the gates of the underworld shall not prevail against it, and to you I will give the keys of the kingdom of heaven. Blessed Peter, against whom the gate of the underworld did not prevail, against whom the gate of heaven did not shut itself, but who on the contrary destroyed the entrance-halls of hell and threw open the heavenly places. Set on earth, therefore, he opened heaven and closed the underworld.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
