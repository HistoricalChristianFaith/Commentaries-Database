[[commentary]]
quote='''
Indeed, greater than a prophet (or more than a prophet) was he in whom the prophets terminate; for many desired to see Him whom he saw, whom he baptized.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But what did you go out to see? A prophet? Yes, I tell you, and more than a prophet is this one. How then did they desire to see John in the desert, who was shut up in prison? Him the Lord sets before us to imitate, who prepared the way for the Lord not only by the order of birth according to the flesh and by the message of faith, but also by a kind of going before in a glorious passion. A greater prophet indeed, in whom is the end of the prophets. A greater prophet, because many desired to see him whom this one prophesied, whom this one beheld, whom this one baptized.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
