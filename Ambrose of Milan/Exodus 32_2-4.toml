[[commentary]]
quote='''
Nor do I think that we must be silent about the priests, lest I seem to cloak our own transgressions. Aaron himself, the high priest, under whose leadership, together with that of Moses, the people of the Hebrews crossed the Red Sea on foot, when he was asked by the people to make them gods whom they might worship, demanded gold and cast it into the fire, and the head of a calf was formed, to which sacrifices were offered. By this sign it became clear that the desire for gold is the material of faithlessness, and that sacrileges are wont to be begotten by the pursuit of avarice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 4"
