[[commentary]]
quote='''
Its title is: Unto the end; for the sons of Korah, a psalm of David.

Hear these things, all nations, perceive with your ears, all you who inhabit the circle of the earth. At the very beginning we recognize the voice of the saving Lord calling the nations to the Church, that they may renounce error, follow the truth and acknowledge the gift of devout worship. But because the hearts of the human succession had been infected with the serpent's poisons, and the conscience, liable to sins, could not call itself back while it despaired of pardon, he promises a remedy, he promises forgiveness freely, by the bounty of his loving-kindness, so that the guilty man may not fear, and the man of good conscience may rejoice that he renders the ministry of service to a good Lord, who knows how to forgive sins and to honour virtues. Then, in the same sequence of calling, the Lord also exhorts us in the Gospel, saying: Come to me, all you who labour and are burdened, and I will refresh you. Take my yoke upon you and learn from me, for I am meek and humble of heart. Next he records that his yoke is sweet and his burden light, since he who has despaired of the medicine will not be able to be healthy. And therefore gentleness is welcome to all, for it heals the wounds of the inner minds.

Being about to come, then, to the sick, about to come as a physician to heal our grievous sores, he sets forth medicines, so that men may hear and run together with faithful diligence to the remedy of salvation. So that woman in the Gospel earned healing who had been suffering from a flow of blood for twelve years. She heard that the physician had come, she hastened to touch him, saying: If I touch his fringe, I shall be saved. She said this within herself, and Christ heard; and she touched the fringe, and power went out from the Savior, which healed the sick woman, strengthened the feeble, stopped the flow, approved her devotion. In like manner, therefore, here too he calls all nations to the fount of wisdom and prudence, he promises redemption to all, so that no one may tremble, no one despair, where no one is excepted, but every soul is invited to grace, that it may be redeemed from guilt without price and obtain the fruit of eternal life.

This is the sense of the psalm, which we shall set out in its order once we have explained the force and character of the words above. For the nations are commanded to hear, and those who inhabit the circle of the earth to perceive with their ears; that circle of the lands, surely, of which he spoke above: The earth is the Lord's and the fullness of it, the circle of the lands and those who dwell in it. He has founded it upon the seas and prepared it upon the rivers. This the Greeks call οἰκουμένην, because it is inhabited by Christ, as he himself said: For I will dwell in them; for he dwells in it to fill what seemed empty. What, then, is the οἰκουμένη but the holy Church, the temple of God and the dwelling-place of Christ? Nor was it unfitting that the Latins, with a word of different sound indeed but of equal sense, named it the circle of the earth, because the life of the saints, who are inhabited by the Spirit, rolls round in a circle like a wheel, without any stumbling in its course.

In tribulations, then, the Church is founded, in tempests and storms, in anxieties and grief; in adversities and in rivers it is prepared. In what rivers? Hear him who says: The rivers have lifted up their voice. Hear also in the Gospel: He who believes in me, as Scripture has said, rivers of living water shall flow from his belly. But this he said of the Spirit, which those who believed in him were receiving. In these rivers, therefore, the Church is prepared, in which the grace of God flows forth. These are the streams which perceive the word of God with the ear and speak, so as to pour the word into the hearts of each one. And therefore Scripture made a distinction by saying: Hear these things, all nations, perceive with your ears, all you who inhabit the circle of the earth. All can hear, yet not all can perceive with their ears, except the elect of God. And therefore the Savior says: He who has ears to hear, let him hear. He means those spiritual ears of the inner man, whose nostrils too we read of, as Job says: The divine spirit which is in my nostrils. Not all men have these ears and these nostrils; for the form of the body is one thing, that of spiritual grace another. He who is spiritual hears all things, judges all things, but the natural man does not perceive the things that are of the Spirit of God; for this one is earth-born, that one heavenly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
