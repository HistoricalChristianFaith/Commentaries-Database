[[commentary]]
quote='''
A most beautiful passage, moreover, for instructing those on whom any task is laid, is that Abraham's servant did not eat the bread set before him until he had carried out his master's command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
