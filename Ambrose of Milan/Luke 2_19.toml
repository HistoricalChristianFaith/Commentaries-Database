[[commentary]]
quote='''
Esteem not the words of the shepherds as mean and despicable. For from the shepherds Mary increases her faith, as it follows: Mary kept all these sayings, and pondered them in her heart. Let us learn the chastity of the sacred Virgin in all things, who no less chaste in her words than in her body, gathered up in her heart the materials of faith.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Mary kept all these words, pondering them in her heart. Let us learn the chastity of the holy virgin in all things, who, no less chaste in speech than in body, pondered in her heart the proofs of faith. If Mary learns from shepherds, why do you refuse to learn from priests? If Mary is silent before the apostolic precepts, why do you after the apostolic precepts desire to teach rather than to learn? Learn that the fault belongs to the person, not to the sex; for the sex is holy. Indeed, Mary did not receive the precept, she set forth the example.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
