[[commentary]]
quote='''
What we are to expect can in some measure be gathered from our knowledge of what has been written: Whoever shall glorify me, him will I glorify and he that despises me shall be despised. God brings to pass what is good, not what is evil, as His words can teach you that He confers glory and disregards punishment. Whosoever shall glorify me, He says, him will I glorify, thus declaring that the glory of the good is the purpose of His work. And concerning him that despises me, He did not say I shall deprive of glory, but that he shall be deprived of glory. He did not avow that injury to them would be the result of His action, but pointed out what was to come.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"
