[[commentary]]
quote='''
Yet I do not think that this dream was shown to one or two, but set before all, in that the seven years of this world, fat and rich with worldly plenty, are swallowed up by those ages that are to come, in which there is perpetual rest and the spiritual observance of the Law, such as that tribe Ephraim, fruitful to the God of the fathers, may keep: a good cow, not distended with a bodily udder, but abounding in spiritual milk and grace, on the beauty of whose neck God says that he sits, as it is written: Ephraim is a heifer taught to love victory. But I passed over the beauty of her neck. Let not the oil of the sinner, then, fatten our head, nor ought false fruits to delight us, lest it be said of us too: You have sown impiety and gathered the vintage of its iniquities. You have eaten false fruit, because you hoped in your chariots. Nor does it trouble me that the dream has lean ears blighted by the wind, because David too was better then, when he was wasting away like a spider; and a troubled spirit is a sacrifice to God, and those come out more excellent whom the evil spirit has exercised in this world with grievous injuries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
