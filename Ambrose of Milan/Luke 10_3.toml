[[commentary]]
quote='''
Now these animals are at variance among themselves, so that the one is devoured by the other, the lambs by the wolves; but the good Shepherd has no fear of wolves for His flock. And therefore the disciples are appointed not to make prey, but to impart grace. For the watchfulness of the good Shepherd causes the wolves to attempt nothing against the lambs; He sends them as lambs amid wolves that that prophecy might be fulfilled, The wolf and the lamb shall feed together. (Isaiah 65:25.)

Or the heretics are compared to wolves. For wolves are beasts who lay in wait near the sheep folds, and prowl about the shepherds' cottages. They dare not enter the abodes of men, they pry out sleeping dogs, absent or slothful shepherds; they seize the sheep by the throat, that they may quickly strangle them; ravenous beasts, with bodies so stiff that they cannot easily turn themselves, but are carried along by their own impetus, and so are often deceived. If they are the first to see a man, it is said, they by a certain natural impulse, tear out his voice; but if a man first sees them, they quake with fear. In like manner the heretics lurk about Christ's sheep folds, howl near the cottages at night time. For night is the time for the treacherous who obscure the light of Christ with the mists of false interpretation. The inns of Christ, however, they dare not enter, and therefore are not healed, as he was in an inn who fell among thieves. They look out for the shepherds' absence, for they can not attack the sheep when the shepherds are by. Owing also to the inflexibility of a hard and obstinate mind, they seldom if ever turn from their error, while Christ the true interpreter of Scripture mocks them, so that they vent forth their violence in vain, and are not able to hurt; and if they overtake any one by the subtle trickery of their disputations, they make him dumb. For he is dumb who confesses not the word of God with the glory which belongs to it. Beware then lest the heretic deprive you of your voice, and lest you detect him not first. For he is creeping on while his treachery is disguised. But if you have discovered his unholy desires, you can not fear the loss of a holy voice. They attack the throat, they wound the vitals while they seek the soul. If also you hear any one called a priest, and you know his robberies, outwardly he is a sheep, inwardly a wolf, who is longing to gratify his rage with the insatiable cruelty of human murder.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So, sending the disciples into his harvest, which, although it was sown by the Word of God, still required the labor of cultivation and a careful service of tending, lest the birds of the air scatter the sown seeds, he says: behold, I send you as lambs among wolves.

These animals are opposed to one another, so that some are devoured by others. But the good shepherd does not know how to fear wolves for his flock, and therefore these disciples are sent not to be a prey but for grace; for the care of the good shepherd brings it about that the wolves can dare nothing against the lambs. He sends lambs, therefore, among wolves, so that that word might be fulfilled: then the wolves and the lambs shall feed together.

And since our recent discourse on the fox turned out not unwelcome, if I have found your judgment faithful in the figure of a very small animal, I presume that with the support of your zeal I may open the deep mysteries that are veiled under the form of wolves. We have set out above that the heretics are signified under the form of foxes, who promise in name that they follow Christ, but forswear him by their zeal for fraud. These the Lord does not receive, but keeps away and forbids from his nest. We must observe what the wolves seem to signify.

They are, of course, beasts that lie in wait for sheepfolds, prowl about the shepherds' huts, do not dare to enter the dwellings of houses, watch for the sleep of the dogs, the absence or sloth of the shepherd, and fly at the throat of the sheep so as to strangle them quickly. Fierce and rapacious, and also by the nature of their body rather stiff, so that they cannot easily turn themselves, they are carried along by a kind of headlong rush of their own and are therefore often tricked. Moreover, if they see a man first, they are said by a certain force of nature to snatch away his voice; but if the man sees them first, he is said to put them to flight. And therefore I must take care lest, if in today's discourse the grace of the spiritual mysteries has not been able to shine forth, the wolves be thought to have seen me first and to have wrung from me the accustomed support of my voice.

Are not the heretics to be compared to these wolves, who lie in wait for the sheepfolds of Christ and growl around the folds by night rather than by day? For it is always night for the unbelieving, who try to cover the light of Christ with the clouds of a perverse interpretation and, as far as in them lies, to darken it. They prowl, then, around the folds, yet they do not dare to enter the inns of Christ, and therefore they are not healed, because Christ does not wish to bring them into his inn, in which that man was cured who, going down from Jerusalem, fell among robbers. Him, when his wounds had been bound up and oil and wine poured in, that Samaritan placed on his own beast, brought to the inn and left to the innkeeper to be healed. They do not, then, receive medicine who do not seek the physician; for if they sought him, they would not disparage him.

They watch for the absence of the shepherd, and therefore they strive either to kill the shepherds of the churches or to drive them into exile, because while the shepherds are present they cannot attack the sheep of Christ. The robbers, then, try to despoil the Lord's flock, being hard and stiff with a kind of bodily bent of mind, and they are by no means wont to turn aside from their error. And therefore the Apostle says: avoid a heretical man after one rebuke, knowing that he who is such is perverted. These Christ, the true interpreter of Scripture, tricks, so that they may pour out their empty rushes to no purpose and may be unable to do harm.

If they forestall anyone with the cunning trickery of their disputation, they strike him dumb; for he is dumb who does not confess the Word of God in the same glory in which he is. Take care, then, lest the heretic take away your voice, if you have not first detected him yourself. For his unbelief creeps on while it lies hidden; but if you have recognized the fabrications of his ungodliness, you will have no cause to fear the loss of your devout voice. Beware, then, the poisons of cunning disputation; they seek the soul, they fly at the throat, they fix a wound in the vital parts. Grievous are the bites of the heretics, who, more grievous and more rapacious than the beasts themselves, know no end of greed and ungodliness.

Nor let it move you that they seem to put forward a human form; even if a man is seen outwardly, within a beast growls. And therefore there is no doubt that they are wolves, according to the divine sentence of the Lord Jesus, who says: beware of false prophets, who come to you in sheep's clothing, but inwardly they are ravening wolves. By their fruits you shall know them. If, then, anyone is moved by appearance, let him question the fruit. You hear someone called a priest, you learn of his plunderings: he has the clothing of a sheep, the deeds of a robber; outwardly a sheep, inwardly he is a wolf, who knows no measure in plundering, who, as though hardened in limb by Scythian frost in the night, bloody of jaws, prowls around seeking whom he may devour. Does he not seem to you a wolf, who, insatiable in the rawness of human slaughter, desired to sate his madness with the death of faithful peoples?

He howls, he does not discourse, who denies the Author of the voice and with sacrilegious speech breaks in with a bestial growl, who does not confess the Lord Jesus as the ruler of eternal life. We heard his howlings when the sword was sent forth throughout the world. He displayed harsh teeth, swollen jaws, and thought that he had taken away from all the voice which he alone had lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
