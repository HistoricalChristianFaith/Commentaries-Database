[[commentary]]
quote='''
After this, you went up to the priest. Consider what followed. Was it not that of which David speaks: "Like the ointment upon the head, which went down to the beard, even Aaron's beard"? This is the ointment of which Solomon, too, says, "Your name is ointment poured out, therefore have the maidens loved you and drawn you." How many souls regenerated this day have loved you, Lord Jesus, and have said, "Draw us after you, we are running after the odor of your garments," that they might drink in the odor of your resurrection.Consider now why this is done, for "the eyes of a wise man are in his head." Therefore the ointment flows down to the beard, that is to say, to the beauty of youth; and therefore, Aaron's beard, that we, too, may become a chosen race, priestly and precious, for we are all anointed with spiritual grace for a share in the kingdom of God and in the priesthood.
'''
source_url='https://www.newadvent.org/fathers/3405.htm'
source_title="On the Mysteries 6:29-30"

[[commentary]]
quote='''
And therefore it is said to us: But ye when ye fast anoint your head and wash your face, that ye appear not to men to fast, but to your Father who is in secret: and your Father who seeth in secret will repay ye. What is "anoint your head"? And even voluptuous people say 'let us provide ourselves with wine and ointments.' For they anoint themselves with ointment who seek the charm of a perfumed body: but those ointments are wont to produce the allurement of passion. Different is the ointment of sobriety, of which the Church says to her bridegroom: Thy name is as ointment poured out; different is the oil with which the joints and limbs, as it were, of the soul, become shining. Wherefore David also says: Thou hast anointed my head with oil; that is the oil of gladness with which Jesus Christ was anointed by God the Father, that He might be preëminent above all His fellows. With this He orders our head to be anointed that all feigned sorrow may be covered over with the oil of gladness, lest you may seem to sell your fasting to men, lest you may seem to be sad in the salvation of your soul; for no sorrowful man is crowned, no mournful man triumphs. Anoint therefore thy head, wherein are the senses of the wise man; for the eyes of a wise man are in his head. You are called to the Mysteries and you know it not; you will learn when you come. But recall this: like the precious ointment on the head, that ran down upon the beard; then you will know what it is to anoint your head; how pleasing you are to God, that He should throw open His Sacraments to you, that He should give you spiritual grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"

[[commentary]]
quote='''
Ointment emptied out, or oil poured out, is your name; that is, this whole world reeked with the unclean impurities of various crimes; now the sweetness of modesty breathes everywhere, the ointment of faith, the flower of integrity. In the Word, too, breathes the fragrance of grace and the remission of sins, which, spread over the whole world, has filled all things as with ointment emptied out, because the heavy filth of vices has been wiped away from all. This ointment was emptied out upon the Jews, and was gathered up by the Gentiles: emptied out in Judea, it gave forth its fragrance in all lands. With this ointment Mary was anointed, and the Virgin conceived, the Virgin brought forth the good fragrance, the Son of God: this ointment was poured out upon the waters and sanctified the waters: with this ointment the three youths were anointed, and the flame bedewed them with moisture; with this ointment Daniel was anointed, and he softened the mouths of the lions and soothed their ferocity. This ointment flows daily and never fails. Take your vessel, virgin, and come near, that you may be filled with this ointment: take the ointment valued at three hundred denarii, but given freely, not sold, that all might have it freely. Virgin, anoint yourself; do not be grieved like Judas because this ointment is poured out, but bury Christ with you in yourself: close your vessel well, lest the ointment flow out: close it with the key of integrity, with modesty in speaking, with abstinence from boasting; she who has this ointment receives Christ: Your name is ointment emptied out.

Therefore the young maidens have loved you. Who are these young maidens but the souls of individuals, who have laid aside the old age of this body, renewed through the Holy Spirit? Your name is ointment poured out, and nothing can be more excellent than the power of its word. For just as ointment shut up in some vessel holds in its fragrance, and that fragrance, so long as it is confined within the narrow limits of that vessel, although it cannot reach many, yet keeps its strength; but when the ointment has been poured out of the vessel in which it was shut, it is said to be spread far and wide: so too the name of Christ, before his coming, was shut up among the people of Israel, as in a vessel, in the minds of the Jews: for Known indeed in Judea is God, in Israel his name is great. (Ps. 75 (76):1). This, then, is the name which the vessels of the Jews held confined within their narrow limits. Great indeed was the name even then, when it was held within the narrow limits of the weak and the few, but it had not yet poured out its greatness through the hearts of the Gentiles and to the ends of the whole world: but after he shone upon the whole world by his coming, he extended that divine name of his through every creature, not filled up by any addition, for fullness knows no increase, but filling what was empty, that his name might be wonderful in all the earth. The pouring out of this name, then, signifies a certain abundant overflowing of graces and a richness of heavenly goods, for whatever is poured out overflows from abundance. Therefore the young maidens have loved you. Prudence is good, she says, but mercy is sweet; for few attain the former, the latter reaches all: on account of this indulgence of yours, she says, souls renewed in spirit love you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
