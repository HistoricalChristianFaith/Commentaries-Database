[[commentary]]
quote='''
Plainly, therefore, while the price of blood is kept apart from the treasuries of the Jews, and the potter's field is bought with the money for which Christ is sold, while that place is dedicated to burying the remains of strangers, both the oracle of prophecy is fulfilled and the mystery of the rising Church is revealed. For the field, according to the divine precepts, is this whole world, and the potter is he who formed us from the clay, of whom you have in the Old Testament that God fashioned man from the clay of the earth, having power at his own will to form through nature and to re-form through grace. For even if we fall in ruin through our own vices, yet through his mercy, when the spirit of the mind has been taken up again, we are re-formed according to the oracles of Jeremiah.

The price of blood is also the price of the Lord's Passion. So by the price of blood the world is bought by Christ; for he came that the world might be saved through him, the world in which there is alike both the work and the right of the author. He came, then, to keep for the grace of perpetuity those buried together with Christ through baptism and dead together with him. But there is not a place of burial for all indiscriminately; for although the world encloses all, it does not keep all. Although the dwelling is common, yet the lawful burial is that of those, namely, who are now through faith of the household of God, but were strangers in the Law. Who are these, unless those of whom it is said: Remember that once you were Gentiles, who were in the flesh alienated from the way of life of Israel and strangers to the promise of the testaments? But these now are no longer sojourners and strangers, since they have merited by right of faith to be fellow citizens of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
