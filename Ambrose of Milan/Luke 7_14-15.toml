[[commentary]]
quote='''
But although the last extremities of death have abolished all hope of life, and the bodies of the dead lie near the tomb, yet at the word of God corpses already on the point of perishing rise again, the voice returns, the son is given back to his mother, he is called back from the tomb, snatched from the sepulchre. What is this tomb of yours but evil morals? Your tomb is unbelief, your sepulchre is your throat; an open sepulchre indeed is their throat, from which dead words are brought forth. From this sepulchre Christ frees you; from this tomb you will rise again, if you hear the word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
