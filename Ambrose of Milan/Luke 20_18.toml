[[commentary]]
quote='''
Everyone indeed who falls upon this stone, he says, will be shattered; but upon whomever it falls, it will cleanse him. Others have: it will winnow him, others: it will crush him. For he who winnows the grain cleanses it of chaff; he who crushes something reduces it to powder, so that the softness of the powder may be of use either in a healthful drink or in the rest of medicine. Hence we gather that we must take care lest anyone, once received by Christ through baptism, stray from his body, that is, be shaken out of the Church; for that is the ruin of perpetual death. But him who comes to believe in Christ, so that his death may find him, his cross take him up, his nail fix him, his blood pour over him, his burial too wrap him round, the grace of his resurrection lift him up, rouse him from sleep, give him life from death, him, I say, he frees from the world, cleanses from sin, heals from his wound, bends from the hardness of ungodliness, softens to the gentleness of devotion, so that with a circumcised heart he may draw in that sweet and incomprehensible Spirit and drink the cup of eternal salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
