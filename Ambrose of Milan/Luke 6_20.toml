[[commentary]]
quote='''
But seeing the crowds, as you have read, he went up the mountain. And when he had sat down, his disciples came up to him. For as he was about to preach the gospel and to bring forth from the treasure of divinity the oracles of the blessings, he begins to be on higher ground. Here, however, although he was standing in a low place, he yet lifted up his eyes. For so also, when he was raising Lazarus, he groaned in spirit; so also he lifted up his head when he forgave the adulterous woman her sins. For what is it to lift up the eyes but to open the inner light?

Indeed Saint Matthew: he opened he says his mouth, that is, the treasures of the wisdom and knowledge of God; with the inner shrines of his temple unbarred, he unlocked his mouth. So you too, open your mouth, but first implore that it may be opened. For if Paul implores help for the opening of his mouth, much more does it befit you to implore it. The prophet also shows you the key of knowledge with which you should open your mouth, saying: Open your mouth to the word of God. The word of God is the key of your mouth; the key of knowledge is the key of your mouth, by which, the chains of silence loosed, the bars of ignorance are unlocked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
