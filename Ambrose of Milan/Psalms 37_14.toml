[[commentary]]
quote='''
He adds more: Behold, he says, sinners have drawn the sword, they have bent their bow, to cast down the poor and the needy. What is the sinner's sword but the contrary of the sword of the Holy Spirit? Scripture has taught me of this sword, the Apostle has taught me, saying that we have the breastplate of righteousness and the shield of faith and the helmet of salvation and the sword of the Spirit, which is the word of God. The word of God, then, is the sword of the Holy Spirit; on the contrary, surely, the sword of the most wicked one is an evil word. With this the apostle Peter struck Ananias and Sapphira, as with a sort of blade of his speech; with this sword Paul snatched away the light of his eyes from Elymas, who opposed his discourses, and poured over him the night of blindness. Consider now for me sinners quarrelling and hurling bitter insolences and bringing forth the reproaches of accusations. If you hear them, will you not say: Sinners have drawn the sword, when foul speech is brought out of a wanton mouth as from a sheath, which ought to have been restrained and put away? Just as the word of God is called a sword, and so too is the sinner's speech, so also the bow which sinners bend is their mind, and the arrow which they shoot is poisoned speech. For as Christ, who is the Word of God, is an arrow, to whom it is said: I have set you as a chosen arrow, which is brought forth from the quiver of God, so there are arrows of the unbelieving, which, shot from a kind of bow of iniquity, wound the unwary innocent man, unless their fiery darts are repelled by the shield of faith, and therefore you ought to be watchful as a soldier in battle, because your fight is not only against flesh and blood, but also against the spiritual wickednesses themselves, which are not seen. Let arms mighty for God abound for you, so that you may easily draw out what weapons you wish, lest the enemy be able to crush you poor and unarmed. Be strong for God, rich for God, so that it may be said of you: The ransom of a man's soul is his riches. Abound in the treasure of wisdom, be rich in word and good works, so that you may be fortified. Flee the riches of the sinner, lest he find where he can wound you. Be merciful, so that you may remain unwounded, or may be able to heal yourself if you have been wounded. There is also the poor man whom the adversaries wish to wound, of that number of whom the Savior said: Blessed are the poor in spirit, for theirs is the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
