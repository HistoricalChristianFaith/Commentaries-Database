[[commentary]]
quote='''
Why do I say "the torrent ceased", when the sea has ceased, as today's reading taught us, the Lord saying: Behold, by my rebuke I will make the sea desolate and make the rivers a desert, and their fish shall dry up, the fish, surely, of the Jews, through the dryness of their unbelief, so that they cannot swim out? The torrent ceased, then, because of the sacrileges of the synagogue, because that people was dry in faith, barren in works, captive to sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
