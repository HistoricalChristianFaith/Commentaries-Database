[[commentary]]
quote='''
Like sheep they shall be led down into hell, death shall feed upon them; and the righteous shall have dominion over them in the morning, and their help shall grow old in hell, away from their glory. Those who did not wish Christ to feed them, death shall feed upon. Who, then, would forsake the good shepherd, who lays down his life for his sheep, since the care of his flock belongs to him? Or who would choose the hireling death, which is paid back as the fitting wage of the worst works? Know at the same time, O man, that Christ is the true shepherd, who feeds his own unto life. Death crept in, which leads strangers to destruction and devours those over whom it can prevail because of their crimes. Though in this life they had a zeal for power and riches, so as to rule over others, yet in the resurrection there will be servitude, when the morning splendour has shone upon the righteous; of this it is a figure that Jacob is set as lord over his brother. A wretched servitude, then, that at the time when others are called into the glory of splendour and light, their glory should grow old and be consumed in the darkness of the underworld; and rightly it is said of them: they have been driven out from their honour and from their glory, since this glory is temporal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
