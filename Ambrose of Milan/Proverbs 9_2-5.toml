[[commentary]]
quote='''
Indeed, Wisdom slew her victims and mixed her wine in the mixing bowl. And so, to give the drink of faith to the foolish Gentiles, she called them together to her mixing bowl, saying: Whoever is foolish, let him turn aside to me; and to those lacking sense she said: Come, eat of my loaves and drink the wine which I have mixed for you. This mixing bowl Plato thought fit to transfer into his books, and to its drink he called forth souls; but he did not know how to fill them, since he was serving a drink not of faith but of faithlessness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"
