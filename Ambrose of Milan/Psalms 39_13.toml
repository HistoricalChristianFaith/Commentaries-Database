[[commentary]]
quote='''
Wishing to receive this before Christ came to earth, David said: Remit to me, that I may be refreshed, before I go, and I shall be no more, that is: Remit to me here, where I have sinned. Unless you remit to me here, I shall not be able to find there the rest of remission; for what has remained bound on earth will remain bound in heaven, what has been loosed on earth will be loosed in heaven. For the prophet and preacher of the Church that was to be gathered foresaw the indulgences of the Lord by the spirit of the Gospel, and the Lord revealed to him what was to be commanded to the apostles; nay, this was the old sentence, that he who had bound himself on earth should depart from the body in chains. Therefore the Lord gave to the apostles what before had belonged to his own judgement, the equity of remitting sins, so that what is to be loosed should not stay bound long. Indeed, hear him saying: To you I will give the keys of the kingdom of heaven, and whatever you bind on earth shall be bound in heaven also, and whatever you loose on earth shall be loosed in heaven also. To you, he says, I will give the keys of the kingdom of heaven, so that you may both loose and bind. This Novatian did not hear; the Church of God heard it; therefore he is in his fall, we in remission; he in impenitence, we in grace. What is said to Peter is said to the apostles. We do not usurp a power, but we serve a command, lest afterwards, when the Lord comes and finds bound those who ought to have been loosed, he be moved against the steward who kept bound the servants whom the Lord had ordered to be loosed, saying that he who knew his lord's will and did not do according to his will shall be beaten with many stripes; but he who did not know and did things worthy of stripes shall be beaten with fewer.

Rightly, then, David asks that it be remitted to him, knowing that this had not been granted to the priests who were after Aaron, but was being kept for the Gospel. He, then, to whom there is no remission is in exile; he remains in the injury of a sojourn away from home. Here, then, pardon must be sought — for here it was said: Blessed are you who weep, for you shall laugh —; here is the place for asking pardon. Let us weep, then, on earth, so that we may deserve indulgence. Unless sin has been remitted here, we shall not have rest; if there is no rest, there will be no eternal life; if there is no eternal life, we shall not be. Therefore he asks that it be remitted to him before he goes, so that he may be. For if it has not been remitted, I shall not be, he says, with those who are, with those who deserve to ascend into paradise. But he who is not will be consumed with those who go down into the pit, he who has been left in chains and prison.

He does not, then, say "I shall not be" definitively, for elsewhere he says: I will sing psalms to you on the harp, O God, the holy one of Israel. My lips shall rejoice when I sing to you, and my soul, which you have redeemed; of redemption, then, he is confident. And elsewhere hear him saying: I will please the Lord in the land of the living; he who is confident of pleasing, then, will be. It can also be understood thus, because he said: I am a newcomer with you on the earth, and a sojourner, as all my fathers were, and therefore: Remit to me, so that I may cease to be a sojourner; remit to me the exile to which I have been banished. If you remit it before I depart hence, I shall no longer be an exile and a sojourner; for when you have remitted it, I shall not be a sojourner, but I shall be a fellow citizen of your saints, I shall be with my fathers, who themselves were also sojourners before but now are already citizens. I shall be a member of the household of God, so that I may not fear punishment but may deserve grace, through our Lord Jesus, with whom to you be praise, honour, glory, perpetuity, with the Holy Spirit, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
