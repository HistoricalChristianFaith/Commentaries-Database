[[commentary]]
quote='''
And Lot lifted up his eyes and chose the well-watered region he says of the Jordan, because it was all watered and was like the paradise of God. Often inherited possessions fall to people, some more profitable, others more pleasant. They should certainly not be cut up into portions; for the worth of each begins to be diminished. But if the parties cannot agree about the more profitable ones, let the pleasant ones be set against the more profitable. The dispositions of men are different; some are delighted by the profitable, others by the pleasant. The weaker man chooses the more pleasant things and disdains the more profitable. Sometimes there is a useful steward or manager of the farm: he is set against a town slave. If the one choosing is foolish, he chooses either a cook or a singer, whom he thinks of more charming grace, and rejects the more useful one. Often too, even where the returns are not unequal, the more prudent man avoids the more pleasant things. They quickly stir up envy, they quickly rouse the mind of the greedy man against themselves. Here, however, Scripture said nothing about one part having been more profitable and the other more pleasant, lest Abraham should seem to have captured the young man's eyes by design. It described the pleasant part; it did not add the more profitable. It was necessary that he make two parts of the whole region. Then, he was dividing things present, not things absent. One region could not hold both. He offered the choice, which could be a mark of the highest justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
