[[commentary]]
quote='''
And since we have learned that the commandment which is death to me is good, let us now discuss how that which, though through the good, has wrought death for me is not death to me. For thus the Apostle put it: Is that which is good, then, death to me? By no means; but sin, that it might appear as sin, wrought death for me through the good. So let us look at each point. The commandment certainly belongs to the Law, and the Law is spiritual: I see its grace, I praise its beauty, I proclaim its form, I admire its precept; but because I am carnal and have been sold under sin, I am drawn unwillingly to guilt. For guilt lords it over me as over a slave. And so I hate the crime and I do it. The mind hates, the flesh desires; yet I am in both, I who with the mind consent to the Law and with the flesh do what I do not will. Good, then, is the commandment, to which I consent, and good is the mind, which chooses what is good. It is good for judging, but often weak for resisting, because the appetite of the body fights against it and drags it captive to the enticements of error.

In this danger there is one remedy: that the grace of God should free him whom the Law could not free. For thus it is written: Unhappy man that I am, who will free me from the body of this death? The grace of God through Jesus Christ our Lord. And so it comes about that, although the sin that lay hidden, that is, my concupiscence, which I did not think was sin, wrought death for me when it was revealed, and sin itself became beyond measure — for it was sin, even if it was not known, but by knowledge it was heaped up and took on, as it were, an increase of error, and the form of the commandment passed over into the nature of an offence — yet it is not death to me, for whom it is ready at hand to take refuge in Christ, through whom we are released from every danger of death. The second proposition, then, is also resolved: that the commandment of the Law is not death to me, even if it works death. For that we are thrown into confusion belongs to our frailty; that we escape belongs to Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 4"
