[[commentary]]
quote='''
And although very many become effeminate by the use of softer garments, yet here other garments seem to be meant, namely, our mortal bodies, by which our souls are clothed. Again, luxurious acts and habits are soft garments, but those whose languid limbs are wasted away in luxuries are shut out of the kingdom of heaven, whom the rulers of this world and of darkness have taken captive. For these are the kings who exercise tyranny over those who are their fellows in their own works.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But what did you go out into the desert to see? A reed shaken by the wind? What did you go out to see? A man clothed in soft garments? Here the Lord's word is not about clothes, although care for softer clothing makes very many effeminate, who, as if they could not bear the weight of wool, sweep silk garments along the ground over their hidden feet, and by habit bring it about that their covering is a burden. But yet he seems here to signify other garments, and, if I am not mistaken, human bodies, with which our soul is clothed. Indeed Joseph's tunic too was bloodied as a figure of the Lord's body; and that saying of the Apostle: stripping off from himself the flesh, he made a show of all principalities and powers, what else does it show but that the body was in place of a garment, which the Lord so put off in the Passion that the divinity remained free and immune from injury? This whole passage, then, by a prophetic example exhorts us to the virtue of undergoing the passion.

Indeed he added: Behold, those who are in costly clothing are in the houses of kings. Soft garments are also luxurious actions and morals, on account of which the Apostle exhorts us that, stripping off the old man with his deeds, we should put on the new, in whom there is not sweet allurement and the play of wantonness, but the practice and fruit of labour, because the heavenly court by no means receives those softened by tender care of the body and by luxury and the desire of wantonness; to it one ascends by the hard steps of laborious virtue. But those whose limbs, made fluid by pleasures, are relaxed, exiles from the heavenly kingdom, grow old within the dwellings of this world, and the rulers of this world and of darkness — for these are the kings who rule by a certain worldly power — have received them as imitators of their own works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
