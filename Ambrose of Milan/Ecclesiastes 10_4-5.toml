[[commentary]]
quote='''
Like this too is that saying of Solomon: If the spirit of him who has power rises up against you, do not leave your place, because care will soften great offences. For diligence and faith hold the higher place, unbelief the lower. Therefore let good diligence rise up to you, which shuts out the snares of the enemy and takes away sin, so that the malice of him who has power cannot harm. In the Songs Ecclesiastes saw this malice under the sun, that is, in this world; whence Scripture also called this place the one under the sun. He saw it, then, under the sun, not above the sun, where the peace of the angels is, or the holiness of the heavenly powers. Or perhaps he meant under the sun of iniquity; for the devil presides over malice, Christ over the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
