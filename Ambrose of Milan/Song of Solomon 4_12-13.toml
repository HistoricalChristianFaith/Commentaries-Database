[[commentary]]
quote='''
For that a garden is better than a fertile field the prophet teaches in the Song of Songs, saying: a garden enclosed is my sister, my bride, a garden enclosed, a fountain sealed; your shoots are a paradise. For that is the pure and spotless virginity of the soul, which is drawn away from faith by no terror of punishments, by no enticements of worldly pleasure, by no love of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
From here Plato composed that garden of his. He called it in one place the garden of Jupiter, in another the garden of the mind; for he called Jupiter both god and the mind of the universe. Into this garden, he says, the soul, which he names Venus, entered, to fill herself with the abundance and riches of the garden, in which Porus lay filled with drink, pouring out nectar. This, then, he composed from the book of the Song of Songs, on the ground that the soul cleaving to God entered into the garden of the mind, in which there was an abundance of various virtues and flowers of words. And who does not know that he thought the abundance of virtues should be transferred from that paradise which we read of in Genesis, having the tree of life and the tree of the knowledge of good and evil and the other trees, and planted in the garden of the mind, which Solomon in the Song of Songs signified as the garden of the soul, or as the soul itself? For thus it is written: a garden enclosed is my sister, my bride, a garden enclosed, a fountain sealed; your sendings forth are a paradise. And below the soul says: arise, north wind, and come, south wind, blow through my garden, let my ointments flow down. Let my brother come down into his garden. How much more beautiful is this, that the soul adorned with the flowers of the virtues is a garden, or has in itself a paradise budding forth! Into this garden it invites the Word of God to come down, so that that soul, watered by the heavenly rain of the Word and by his abundance, may bear fruit. And the Word of God feeds on the virtues of the soul whenever he finds it obedient to him and rich, and he plucks its fruits and delights in them. And when the Word of God has come down into it, the ointments of healthful words flow down from it, and the fragrant breaths of manifold graces breathe out fragrance far and wide.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"

[[commentary]]
quote='''
An enclosed garden is my sister, bride, an enclosed garden, a sealed fountain; your shoots are a paradise of pomegranates, with the fruit of apples, henna. The Bride is praised because she is a garden, having in herself the fragrance of that full field of which Isaac says: The fragrance of my son is as the fragrance of a full field (Gen. 27:27). The good soul, then, breathes forth the fragrances of justice. And perhaps the field is the patriarch, and the garden is the soul of some lesser person, as it were a portion of the field: and An enclosed garden, lest it be invaded by beasts; and A sealed fountain, she who has washed away her own sins by the integrity of the seal and the perseverance of faith. For he who has received from the Church has something to refer to the grace of virginity; because, set in the paradise of delight, she gathers spiritual fruits without labor, so that the souls of the patriarchs, by a kind of rustic labor of their soul, bring her their fruits, whereby she may gather perpetual sweetness: she who is rightly called a sealed fountain, because the image of the invisible God is expressed in her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
