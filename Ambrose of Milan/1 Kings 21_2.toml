[[commentary]]
quote='''
Let us hear, then, what he says: Give to me, he cries. What other is the cry of one in want? What other is the cry of one asking a public alms, if not, Give to me? That is; Give to me, because I want; give to me, because I cannot find any other means of sustenance; give to me, because there is not to me bread for food, money for drink, price for nourishment, substance for raiment; give to me, because the Lord has given to you from which you should bestow; He has not given to me. Give to me, because, unless you give, I cannot have; give to me, because it is written: Give alms. How abject these words, how mean! For they have not the disposition of humility, but the fire of covetousness. But in this very degradation, what effrontery! Give me, he says, thy vineyard. He confesses it is another's, so that he asks what is not due him.

And I will give thee for it, he says, another vineyard. What is his own, the rich man scorns as worthless; what is another's, he covets as most valuable.

But if it shall please thee, I will give thee money. Quickly he checks his mistake by offering money for the vineyard; for he, who desires to occupy all with his possessions, wishes that another possess nothing.

And it will be to me, he says, for a garden of herbs. This, then, was his whole madness; this his whole passion: that a space should be obtained for paltry herbs. Not so much therefore do you yourselves desire to possess, as it were, something useful, but you wish to exclude others. You have a greater concern about the spoils of the poor than about your own gains. You think it a wrong to you, if a poor man have anything which is considered worthy of a rich man's ownership. You believe it your loss, whatever is another's. Why do the injuries done to nature delight you? For all has the world been created, which you few rich men are trying to keep for yourselves. For not merely the possession of the earth, but the very sky, the air, and the sea are claimed for the use of the rich few. How many people can this air feed which you include within your wide-spread possessions? Do the angels have the spaces of heaven so apportioned as you set your boundaries and mark off the earth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapters 2-3"
