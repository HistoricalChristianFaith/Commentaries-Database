[[commentary]]
quote='''
‘Attend to thyself alone,’ says Scripture. In fact, we must distinguish between ‘ourselves,’ ‘ours,’ and ‘what surrounds us.’ ‘Ourselves’ refers to body and soul. ‘Ours’ are the members of our bodies and our senses. ‘What surrounds us’ consists of our money, our slaves, and all that belongs to this life. ‘Attend to thyself,’ therefore, ‘know thyself,’ that is to say—not what muscular arms you have, not how strong you are physically, or how many possessions or power you have. Attend, rather, to your soul and mind, whence all our deliberations emanate and to which the profit of your works is referred. Here only is the fullness of wisdom, the plenitude of piety and justice of which God speaks—for all virtue comes from God: ‘Behold, Jerusalem, I have painted thy walls.’ That soul of yours is painted by God, who holds in Himself the flashing beauty of virtue and the splendor of piety. That soul is well painted in which shines the imprint of divine operation. That soul is well painted in which resides the splendor of grace and the reflection of its paternal nature. Precious is that picture which in its brilliance is in accord with that divine reflection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
To the soul of such a man He says: ‘Behold, Jerusalem, I have painted thy walls.’ He did not say ‘I have painted thy belly’ or ‘thy lower parts,’ but ‘I have painted thy walls,’ thus proclaiming that the strong protection of walls was granted to man. In this way, by keeping careful watch on the walls, man can ward off the dangers involved in a siege. He says, therefore: ‘I have given you neither delights nor the allurements of desire, neither incentives to luxurious living nor eagerness to possess another’s dignities. You have been granted a substantial basis for erecting walls and lofty turrets by means of which you can banish fear of an enemy’s assault and the dread of terrifying raids from legions of soldiers.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
