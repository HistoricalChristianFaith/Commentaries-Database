[[commentary]]
quote='''
Beware then of boasting, beware of the world; he is commanded to strengthen his own brethren, who said, Master, we have left all, and followed thee. (Matt. 19:27.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If Peter is converted at length, for having followed the first call of the Lord, who can say that he himself has been converted quickly? Beware, then, of boasting, beware of the world; for he is commanded to strengthen his brothers who said: We have left all things and followed you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
