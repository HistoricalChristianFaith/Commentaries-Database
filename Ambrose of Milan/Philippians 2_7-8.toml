[[commentary]]
quote='''
He surely took up the truth of this flesh, and therefore he humbled himself even unto death, and the death of the cross. Pay careful attention and consider each point. See that he willingly took up this form of our body and the obedience of your servitude, made in the likeness of men, not in the likeness of flesh, but in the likeness of sinful men; for every man is under sin. Therefore, and being found in appearance as a man — as it is written of him: He is both a man, and who shall know him? a man according to the flesh, but beyond man according to his working —, as a man, he says, he humbled himself, because God came to free those who had been humbled. He humbled himself, then, for our sake. His body, then, is not a body of death, since it is the body of life, nor is his flesh the shadow of death, since it is the brightness of glory, nor is there in him a place of affliction, since in that body there is the grace of consolation for all. He humbled himself so that you might learn what humility is. Indeed hear him saying: Learn from me, for I am meek and humble of heart. He humbled himself so that you might be exalted; for he who humbles himself shall be exalted. But not all who are humbled shall be exalted; for crime humbles many to their ruin. But the Lord was humbled even unto death, so as to be exalted from the gates of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Though he was, then, in the form of a servant, humbled even to death, he was nonetheless in the glory of God. What harm, then, did servitude do him? He is read to have been made a servant because he is read to have been made of the Virgin and created in the flesh; for every creature serves, as the prophet says: For all things serve you. This is the glory of Christ: that he took on servitude in his body, so as to restore freedom to all; he bore our sins, so as to take away the sin of the world; he was made a servant, sin, a curse, so that you might cease to be the servant of sin, so that he might free you from the curse of the divine sentence. He, then, took on your curse: Cursed indeed is everyone who hangs on a tree; he was made a curse on the cross, so that you might be blessed in the kingdom of God; he was dishonored and made cheap, and esteemed as nothing; he said, I have labored in vain; through him Paul merited to say, I have not labored in vain (Phil. 2:16); so that he might confer on his little servants the fruit of good work and the glory of the preaching of the Gospel, through which all might be freed from the burden of labor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
