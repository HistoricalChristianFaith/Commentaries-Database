[[commentary]]
quote='''
He surely took up the truth of this flesh, and therefore he humbled himself even unto death, and the death of the cross. Pay careful attention and consider each point. See that he willingly took up this form of our body and the obedience of your servitude, made in the likeness of men, not in the likeness of flesh, but in the likeness of sinful men; for every man is under sin. Therefore, and being found in appearance as a man — as it is written of him: He is both a man, and who shall know him? a man according to the flesh, but beyond man according to his working —, as a man, he says, he humbled himself, because God came to free those who had been humbled. He humbled himself, then, for our sake. His body, then, is not a body of death, since it is the body of life, nor is his flesh the shadow of death, since it is the brightness of glory, nor is there in him a place of affliction, since in that body there is the grace of consolation for all. He humbled himself so that you might learn what humility is. Indeed hear him saying: Learn from me, for I am meek and humble of heart. He humbled himself so that you might be exalted; for he who humbles himself shall be exalted. But not all who are humbled shall be exalted; for crime humbles many to their ruin. But the Lord was humbled even unto death, so as to be exalted from the gates of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
