[[commentary]]
quote='''
We have discussed, too, the reason why Phison is said to have not only the gold, but also the ruby and the topaz stone, of that goodly land. We propose now to develop the latter topic.

Since Enos in his wisdom yearned to know the name of God, he seems to us to stand for gold that is good. Henoch, who was borne aloft and did not see death, can be likened to a ruby stone of pleasant odor which holy Henoch by his works offered to God, thus exhaling in his active and exemplary life something akin to sweetness. Noe, on the other hand, like the green topaz stone, suggests a color which represents life, since he alone at the time of the Flood preserved in his ark the vital seed of the formation of the world to come.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 3"
