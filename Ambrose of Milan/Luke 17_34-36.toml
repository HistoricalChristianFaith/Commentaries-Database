[[commentary]]
quote='''
On that night there will be two in one bed: one will be taken and the other will be left. He did well to say night, because the Antichrist is the hour of darkness, in that he pours darkness over the hearts of men, when he says that he is the Christ, as false prophets arise who assert that Jesus is dwelling now in the deserts, so as to mock men with the error of a wandering opinion, now in the inner chambers, so that those who hear may be held fast by the name of an exalted power. But Christ, like flashing lightning, scatters the globes of his light through the whole world, and therefore he neither wanders in deserts nor is shut up in any places, because I fill heaven and earth, says the Lord; but he shines with the light of his lightning, so that in that night we may be able to see the glory of the resurrection. What, then, does it mean that he says:

two in one bed, and two women grinding, and two in the field: one will be taken and the other will be left? Is God unjust, that he should separate by the reward of their merits those who are equal in their pursuits and in their fellowship of life, and not distinguished in the quality of their actions? It is not so; but the quality of the reward answers to a man's actions. So the habit of union does not make men's merits equal; for both the father rises against the son and the son against the father in zeal for religion, because not all accomplish what they undertake, but he who perseveres to the end, he will be saved. Then too, the Lord searches out not the outward service but the inner disposition; for if you offer rightly and do not divide rightly, the sacrifice is not acceptable to God. So from one bed — for there is a bed of human infirmity, since it is written: You have turned his whole bed in his infirmity — one is left, the other is taken. He who is taken is caught up to meet Christ in the air; but he who is left is rejected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
