[[commentary]]
quote='''
While she seeks Christ, then, she finds the watchmen, who are in ministry: of them she inquired. But the soul that seeks God passes even the watchmen; for there are mysteries which even the angels long to see. Hence Peter says: They have been announced he says to you through those who preached the gospel to you by the Holy Spirit sent from heaven, into whom the angels long to look. Therefore whoever has passed the watchmen finds the Word. John passed them, who found the Word with the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
They found me, she says, the watchmen who go about the city. While she seeks Christ, then, she finds the watchmen who are in ministry; of them she asks: Have you seen him whom my soul loves? But the soul that seeks God passes even the watchmen. For there are mysteries which even the angels long to see; whence Peter says: They have been announced, he says, to you through those to whom they preached the gospel, by the Holy Spirit sent from heaven, into whom the angels long to look (1 Pet. 1:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
