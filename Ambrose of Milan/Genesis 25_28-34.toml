[[commentary]]
quote='''
How continent he was in his thrift, he who did not seek the food prepared for himself but yielded it without delay to his brother when he asked for it. From him he received the primacy of the blessing: how devoted he was toward his parents, so that he deserved to be preferred to his elder brother by his mother's affection and to be consecrated by the gift of his father's blessing; how scrupulous, that he refused to harm his brother; how modest, that he feared to deceive his father; how respectful, that he could not refuse his mother what he was bidden!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 1"
