[[commentary]]
quote='''
And there shall be signs in the sun and moon and stars. Both the true sequence of the prophecy and the whole account of the mystery is this: that the Jews too will be led captive a second time into Babylonia and Assyria; those who denied Christ will be captives in the whole world, and the Jerusalem which is seen will be trodden down by a hostile army, the Jews falling by the edge of the sword, and all Judea will be made subject to the nations that are to believe, by the edge of the spiritual sword, which is the two-edged word; and diverse signs will take place in the sun and moon and stars.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
