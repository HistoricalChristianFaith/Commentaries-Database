[[commentary]]
quote='''
O how many men have the goods of others made wretched! What hast thou to do to drink the waters of Geon? he says. Why is it, I say, that you should drink the cup of the usurer? "Many", he says, "having borrowed for the time, have both taken counsel for their needs and have returned the money." And how many have strangled themselves because of the interest? You think of the former, you do not count the latter. You remember that some escaped, you do not remember the ones who have perished. You enter into account the money returned, you do not compute the nooses sought, which many, too self-respecting to face disgrace, too weak to face injustice, in seeking their own destruction have preferred to the shame of so odious an indictment, fearing dishonor in life more than the torment of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 7"
