[[commentary]]
quote='''
By the sign of a fan then the Lord is declared to possess the power of discerning merits, since when the corn is winnowed in the threshing floor, the full cars are separated from the empty by the trial of the wind blowing them. Hence it follows, And he shall gather the wheat into his barn. By this comparison, the Lord shows that on the day of judgment He will discern the solid merits and fruits of virtue from the unfruitful lightness of empty boasting and vain deeds, about to place the men of more perfect righteousness in His heavenly mansion. For that is indeed the more perfect fruit which was thought worthy to be like to Him who fell as a grain of wheat, that He might bring forth fruit in abundance. (John 12:24.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He will baptize you in the Holy Spirit and in fire, having his winnowing fan in his hand, and he will cleanse his threshing floor and gather the wheat into his barn, but the chaff he will burn with unquenchable fire. Having his winnowing fan in his hand. By the token of the winnowing fan the Lord is declared to have the right of distinguishing merits, because while the grain is winnowed on the threshing floor, the full are separated from the empty, the fruitful from the worthless, as by a kind of testing of the blowing breeze. Through this comparison, then, the Lord is shown to distinguish on the day of judgment the merits and fruits of solid virtue from the fruitless lightness of empty boasting and of meagre deeds, as he is to place the men of more perfect merit in the heavenly mansion. For he is the more perfect fruit who has deserved to be conformed to him who, like a grain of wheat, fell, that he might bring forth many fruits in us, hateful to the chaff, no friend to empty merits. And so before him a fire will burn that is not harmful by its own nature, since it burns away the evils of wickedness and heaps up the splendor of goodness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
