[[commentary]]
quote='''
Someone will say: for what reason did the one chosen as ancestor of the Lord's lineage commit both adultery and murder? But I say something else: such was the ancestor who had to be chosen for the Lord's body. For what is the incorporation but the remission of sins? And therefore he could not be without a share in sin, so that he might set forth divine grace both by example and by message. Accordingly, it is by that dispensation that Bathsheba and Tamar are reckoned among the ancestors of the Lord's lineage, of whom the one committed adultery, the other committed incest. By that dispensation both Ahab and Jeconiah, as Matthew the evangelist has written, are numbered among the forebears of Christ, so that he who was to redeem all men might begin the benefit from his own forebears; and at the same time, lest he who subjected himself even to the suffering of the body should seem to have sought out the nobility of a spotless origin; for this is the boasting of men, to seek another's glory, not their own; and yet among men themselves the grace of virtue is greater than that of nobility. At the same time an example had to be given, so that all might understand that the disgraces of forebears cannot be a dishonour to their descendants, since each one could abolish the stain of his succession by the merit of his own virtue. Do you see how many, and how grievously criminal, are those whom the sequence of the Lord's generation comprises, from whose origin Christ was not ashamed to be born for your sake? And if you believe these things, they are gifts of the divine mercy in you, and this is the mark of the heavenly power; for sin superabounded, that grace might superabound. Let David, then, not have been exempted from guilt, so that he might be chosen for grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 6"
