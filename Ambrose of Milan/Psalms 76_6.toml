[[commentary]]
quote='''
In this world also do they fall asleep who are considered worthy of divine rebuke because they mounted horses that they could not curb. We read in another passage—the Church or the soul saying—: He made me the chariots of Aminadab. If, then, the soul is a chariot, see lest the flesh be the horse; but let the driver be the strength of mind which rules the flesh, and which, after the manner of horses as it were, checks its movements with the reins of prudence. They have fallen asleep, therefore, who have mounted the pleasures of the body, governing them with no moderation. Hence he preferred to call them riders rather than horsemen or drivers. For the driver, by training and skill, drives his horses as he wishes, so that he may urge them on in their course, or turn them back when ungovernable, or recall them when wearied, or bring them around gentle according to his will. Therefore when Elias was being taken up and carried in a chariot, as it were, to heaven, Eliseus cried out to him: Father, father, the driver of Israel and the horseman thereof, that is: you, who ruled the people of the Lord with good guidance, have received these chariots through the merit of your constancy and these horses coursing to Heaven, because the Lord has approved of you as a director of the minds of men; and therefore, like a good charioteer, you are being crowned as victor in the contest with the eternal reward. In the prophet Habacuc also, we read a passage addressed to the Lord Himself: Thou shalt ride upon thy horses and thy riding is salvation! for He drove His apostles, whom he directed into divers places, that they might preach the Gospel in the whole world. Thou shalt ride, he says, as to a driver of horses, and not to a rider. For the horseman also mounts, but so as to guide, and not merely to have a seat because, being slothful and lazy in his drowsy mind, he cannot continue his walking.

Of the horseman we read: And the horseman will fall backward, looking for the salvation of the Lord. For, since no one is without a fall, even if a horseman be brought down and turned aside by some earthly vices, yet, if he does not cast aside the hope of rising again, relying on the divine mercy he comes to salvation. But as regards the rider, there is a clear proof that he is considered reprehensible, since Moses himself says in the Canticle of Exodus: The horse and the rider he hath thrown into the sea. And in Zacharias the Lord has spoken, saying: I will strike every horse with madness and his rider with foolishness. He did not say the horse only but also the rider, just as you have also in Exodus, the horse and the rider. For where there is a rider who cannot manage his horse, the horse rushes headlong and, through its unbridled fury, is carried to precipices and dangers. Why, therefore, do you put your trust in horses, O rich men? Vain is the horse for safety. Why do you applaud yourselves in chariots? Some trust in chariots, and some in horses, but we shall be exalted in the name of the Lord. They are bound and have fallen; but we are risen, and are set upright. Do not love like amorous horses; do not be excited, O rich men, by the neighing of lust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 15"

[[commentary]]
quote='''
Noe had been uncovered when he was drunk: the filial devotion of his sons covered him. But he had been uncovered through ignorance, not through intemperance; for up to this time wine was not known. In the beginning of the human race drunkenness was unknown. He himself first planted a vineyard; he gave it its nature, he was ignorant of its power. And so wine did not spare even its author. What wonder if, since the Lord Himself has praised His creatures, he also marvelled at them? Hence the pleasantness of the newly found gift delighted him, too strong a creature assailed the unaccustomed limbs of the old man, the new drink confused him. They have all slumbered he says, who mounted on horseback. He mounted the pleasures of the body: and, though a just man, fell asleep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 5"
