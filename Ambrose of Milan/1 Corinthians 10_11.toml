[[commentary]]
quote='''
In sum, by the teaching of the apostle too we have learned that very many of the things that were done in earlier times were done in figure. For when he had said that the fathers in the desert, wounded by serpents, could not be healed otherwise than by Moses' hanging up a brazen serpent, at the sight of which those deadly bites and the harmful infusions of venom were cured, he added: Now these things were done in figure for them, for our correction. In figure the brazen serpent was as it were fastened to a cross, because the true one who was to be crucified was being announced to the human race, he who would make void the venoms of the serpent, the devil; accursed in figure, but in truth he who would blot out the curses of the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"
