[[commentary]]
quote='''
I have read indeed: I was a goatherd, plucking mulberries, and I think the prophet signified to us that he himself, a sinner, was converted from a flock of sinners; although it fits that the future prophet of the Gentiles should seem to have sought fruit among brambles, to have dug out food from brambles, as one who would place the discolored and fetid flocks of the Gentiles, the peoples of the nations, in the pastures of his writings, so that they might grow fat with spiritual refreshment, while he himself would milk spiritual milk from the converted sinner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
