[[commentary]]
quote='''
Take the example of Pharao, a man given to vain empty thoughts. His land of Egypt was afflicted with a plague of frogs. They gave forth a surfeit of sound, meaningless and senseless. Moses said to Pharao: Set me a time when I shall pray for thee and for thy servants and for thy people that the Lord may exterminate the frogs. Pharao, who because of his plight should have besought him to offer prayer, replied: Tomorrow, thus showing himself indifferent to the punishment that the delay would bring, although he was still intent on saving Egypt from the plague. And so, when his prayer was finally granted, he was unmindful of gratitude. Being puffed up in his heart, he forgot God.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 9"
