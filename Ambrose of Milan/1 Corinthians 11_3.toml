[[commentary]]
quote='''
There is also another head, a mystical head. What is that? Hear this: The head of the woman is the man; but the head of man is Christ. Pour ointment upon Christ, pour ointment also upon His Head; His Head is God. That woman, typifying the Church, who poured ointment upon His Head, confessed His Divinity; and she who poured it upon His feet confessed His Passion. Both are praised. Do you also that whereby you may be praised, whereby you may receive the remission of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 10"
