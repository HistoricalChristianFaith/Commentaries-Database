[[commentary]]
quote='''
And yet in Exodus it is read that the people saw the voice of the Lord, and certainly a voice is not seen but heard. For what is a voice but a sound, which is not discerned by the eyes but perceived by the ear? But Moses, with the loftiest insight, wished to declare that the voice of God is seen; for it is seen by the gaze of the inner mind; but in the Gospel it is not a voice that is seen but that which is more excellent than a voice, the Word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
