[[commentary]]
quote='''
And therefore, having the name of God in himself, he says: but you, O Lord, have mercy on me and raise me up, and I will repay them. This he surely does not say as though doubting of the resurrection, he who had it in his power to say: destroy this temple, and in three days I will raise it up, but he gives a pattern to man, that he may hope for mercy from God and resurrection from God. Next, he does not ask to be raised up himself, but asks that Matthias be raised up for him in the place of Judas, so that the apostolic number might be filled. For indeed, since the son of perdition had of necessity to perish, that the Scripture might be fulfilled, it was needful that a son of salvation be put in his place. Take a third sense. He asks that he be raised up, that is, his body; but the body of Christ is the Church. And because Judas was a figure of the unbelieving people of the Jews, which either bought or sold Christ for money — as those do who count money of more value than religion —, he signifies that in return for the destruction of the faithless people the grace of the Church will rise again for him. Whence she too says in the Song of Songs: if you stir up and raise up love, when she was seeking Christ from the young maidens, because Christ is love.

But as to his saying: I will repay them, we understand this, that they will be tormented by the advances of the flourishing Church, and will then know what the punishment of unbelief is, when they observe what the splendour of faith and of grace is. Or, because the Lord is good, who could say: they repaid me evil for good, and the word of repayment is a middle word, used either for good or for evil, he says that he will repay for good, because, although blindness will befall Israel in part, yet, when the fullness of the Gentiles has come in, then all Israel will be saved by the compassion of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
