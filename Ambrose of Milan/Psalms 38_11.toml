[[commentary]]
quote='''
My friends and my neighbours drew near against me and stood, and my neighbours stood afar off; and those who sought my soul used violence, and those who sought out evils for me spoke vanity and meditated deceit all the day. But I, like one deaf, did not hear, and was like one dumb who does not open his mouth; and I became like a man who does not hear and has no rebukes in his mouth. Let those who discuss these things subtly see who they are. To me, especially in this first verse, the Lord's sentence seems to be the one to hold, that in temptations a man's enemies become even those of his own household. This, then, holy David confesses purely and sincerely and with grief. For it is true grief and the confession of the inner heart, when all the things are enumerated by which the secret entrails of the mind are pricked with most bitter affection and exasperated with household gall. The prophet, then, laments that he has been attacked by his friends and neighbours, by whom he surely ought not to have been attacked but helped. This surely agrees with the complaint of holy Job, because he too rebuked those three kings, comforters of evils, who brought greater contests upon him when they had come together to console him for friendship's sake; and this we surely must beware of. For consolation ought to be gentle, not harsh, so as rather to soften grief and calm the fever than to stir up agitation. Surely the medicine of the body itself may teach us, which is accustomed to apply softer medicines to inflamed wounds, by which to relieve pain. And so wounds are first fomented, afterwards cut, lest the very hardness offend and the incision exasperate the wound. How much more, then, it befits us to take care that, when we come to console, we do not speak lightly, not carelessly! For seven days Job was silent, his friends were silent, and they would not have spoken had not Job in his grief burst into speech. For you must seek where to begin, lest your consolation offend in the very speech; even silence itself is medicine, and he who is swift in speech wounds the more. Why do you wonder if he wounds another, when he is often wounded himself, because in much speaking he does not escape sin? Indeed, if the physician waits for the time of healing, so that the aids of medicine may be applied when the sicknesses have been digested, lest the sickness, still bitter and unripe, as they assert, resist the remedies of cure and be unable to feel their benefit, how much more it befits us to explore, so that the healing word may come forth from us opportunely, so as to seem not to kindle mourning but to soothe it! The force of grief presses, the heart of an afflicted woman is crushed, who has lost her husband or sons by an untimely death: why do you hurry, when she will not hear you unless her grief cools down? Often we have seen quarrels stirred up by consolations. You have come to grieve, not to quarrel. The very order of your speech must be sought, lest you incur sin before God while you desire to console a man; lest, when you say: "Hear these things", and many others which profit nothing, the answer come back to you: Hear, comforters of evils; lest in another's mourning you bring in the contest of garrulous disputation; lest you fail to come when you should, lest you come and your speech be too harsh. Indeed, let holy Job teach you what is said of such men: At once the most grievous temptations came upon me; they surrounded me, considering me. My brothers departed from me; they knew strangers rather than me; my friends have become merciless. This, then, is the natural sense of the holy prophet David too: he complains that he was attacked by his friends, abandoned by his neighbours.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
