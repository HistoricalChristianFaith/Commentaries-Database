[[commentary]]
quote='''
When he has instructed the righteous man in moral disciplines, so as to teach you what kind of man he ought to be, or what the form of perfect righteousness is, he wishes his mind to rise to wisdom and to contemplations, and he rouses his attention, so that he may gaze with attentive heart on heavenly things, and turn over the divine oracles within himself, and shape his affection to those things which are pleasing to God; that he may be practised in the law, and that no commandments of the Lord may escape him, and that he may know the movements of the divine sacrament. Thus from here on see the holy prophet rising in his precepts: The mouth of the righteous man shall meditate wisdom, and his tongue shall speak judgement; the law of his God is in his heart. Nor will, he says, the Lord condemn him when he is judged. Wait for the Lord and keep his way, and he will exalt you, so that you may possess the land by inheritance; when sinners perish you shall see. I saw the ungodly man exalted above measure and lifted up beyond the cedars of Lebanon, and I passed by, and behold, he was not; and I sought him, and his place was not found. The things above are moral, these are intelligible. What is the mouth of the righteous man that shall meditate wisdom but that of the inner man? For there are two men in each one, one inner, the other outer. The inner thinks the things that belong to the mind, speaks the things that belong to the mind; the outer, those that belong to the body. Yet the Lord, at his coming, joined both together and made the two into one man, so that they should not fight each other with differing movements, but be united to each other by the unity of their wills. Therefore the mouth of the righteous man shall meditate wisdom. For now even the outer man of the righteous man himself has been carried over into the discipline of the inner man, and, conformed to his nature, performs his offices, so that the flesh meditates what belongs to the inner mind. But lest this seem incredible to you, hear him say that the Lord Jesus has transfigured the body of our lowliness, so that it might be made conformable to the body of his glory. Who would dare to say that the flesh without sin, the flesh taken from the Virgin, the flesh begotten by the Spirit of God coming upon Mary, which in nothing differed from the disciplines of wisdom, was without share in the virtues of the inner man and could not pass over into its uses, when it was beyond man that at its touch the sick were healed, light was poured back into the blind, the dead rose again? Fittingly, then, it is written: The mouth of the righteous man shall meditate wisdom, because the whole man is spiritual, not, surely, earthly. For as is the earthly, such also are the earthly, and as is the heavenly, such also are the heavenly. The earthly man, then, has gone, the heavenly has remained. And therefore the prophet, referring it to the times of redemption, said "shall meditate", although one of several has written "meditates", nor is it foreign to the sense, because to the spirit of the prophets future things stand for present. Others think that mouth is said for mind. Beautifully, moreover, did Solomon expound this to us, saying: The discourse of the righteous man is always wisdom, but the fool changes like the moon, that is: because he often varies and does not persevere in his opinion, and seems as it were in darkness to pour out light but not to hold it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Speak sitting in the house, in this earthly house of this habitation which is dissolved, in which we are sojourning away from the Lord. For placed in this body, while we wish to be clothed over rather than stripped, we are exiles from Christ and groan heavily. Sitting in this, then, confess your sins, because you have sat and not stood, and have not said: Our feet were standing in the courts of Jerusalem. Speak rather, and do not hide your offences; speak sitting, so that you may hear him say: Rise, after you have sat, you who eat the bread of sorrow. Speak walking on the way, that is, as you take the course of this life. Speak here, lest there you be struck dumb, as he was struck dumb who did not at first believe the angel of Christ, but afterwards, when he had believed, received his voice. Speak sleeping and at rest, buried together in Christ, so that with him you may rise again in newness of life. Speak even when buried in the tomb, as the souls of the saints spoke, seeking vengeance on the author of death: How long, O Lord, holy and true, do you not judge and avenge our blood? Speak lastly when you rise, as he taught who said: I slept and rested and rose again, since the Lord will take me up. And there too, then, the mouth of the righteous man shall meditate wisdom, until he himself arrives at the more sublime secrets of the tabernacle, full of heavenly and sacred joy and gladness, as Scripture has taught us, when David says: These things I remembered, and I poured out my soul upon me, for I shall go into the place of the wonderful tabernacle, even to the house of God, with the voice of exultation and confession, the sound of one feasting. So both sitting in this bodily house, and having gone forth from here and walking on the way when we are caught up, if we deserve it, to meet Christ, and sleeping, we shall speak.

Take a third ἀναγωγήν, by which the soul of the righteous man raises itself. For a certain spiritual sleep is to be understood, of which Solomon says: For if you sit, you will sit without fear; if you sleep, you will rest sweetly; and you will not fear the terror that comes upon you, nor the onsets of the ungodly coming upon you. You will rest with sweetness and will not fear terror and the onsets of the ungodly coming upon you, if your tongue speaks the judgement of God and you always have it before your eyes, so that you leave no place for sin and know that the price of an offence will be paid by the requital of punishment. For he himself interpreted this in Psalm 90 (91), saying: You shall not be afraid of the terror of the night, and of the arrow that flies by day, of the business that walks about in darkness, of the onset and the noonday demon. A thousand shall fall at your side and ten thousand at your right hand, but it shall not come near you; yet you shall consider with your eyes and shall see the requital of sinners. For the righteous man, when he speaks the judgement of God, or when he himself speaks the things that are righteous and full of true judgement, does not speak with anger, not from the affliction of a grieving mind, not from pain, not from any passion, but he speaks from truth, he speaks from equity, so that he does not lean by feeling, but weighs what he speaks on a true balance; for he judges what things are to be said or not brought forth. Like this is that saying: The lips of the wise are bound by sense, because all things that they speak are seen to agree with true sense, and by the prudence of their sense they understand what they ought to speak or keep silent, so that they keep back what is to be kept silent by a sort of bar and fastening of the lips, while in those things which ought to be said the bonds of the lips are loosed. Rightly, then, did he set first: The mouth of the righteous man shall meditate wisdom; for long meditation will be able to have full judgement, which the righteous man will speak in due time, when he has seen face to face the things that are perfect; for now we cannot speak true things about the things we do not comprehend. Thus not even Paul presumed to speak, who, caught up into paradise, heard heavenly secrets, but, wishing not to err in what he said, he says: How inscrutable are the judgements of God, and his ways past searching out! But now, released from the body, perhaps he comprehends the kinds of the ways past searching out and his judgements, which are many like the abyss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
