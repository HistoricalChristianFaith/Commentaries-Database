[[commentary]]
quote='''
At that same time the angel Gabriel was sent by the Lord to a city of Galilee named Nazareth, to a virgin betrothed to a man whose name was Joseph, of the house of David; and the virgin's name was Mary.

The divine mysteries are indeed hidden, and, according to the prophetic saying, no one among men can easily know the counsel of God; yet from the other deeds and precepts of the Lord Savior we can understand that this too belonged to a well-weighed counsel, that she who was betrothed to a man was the one chosen in particular to bear the Lord. But why was she not filled before she was betrothed? Perhaps so that it might not be said that she had conceived in adultery. And Scripture rightly set down both, that she was both betrothed and a virgin: a virgin, that she might be seen to have no part in union with a man; betrothed, that she might not be branded with the infamy of violated virginity, since her heavy womb would seem to display the mark of corruption. And the Lord preferred that some should doubt about his birth rather than about his mother's chastity — for he knew that a virgin's modesty is tender and the repute of chastity slippery — and he did not think that faith in his birth should be built up at the cost of wrongs to his mother. So Saint Mary's virginity is kept as inviolable in repute as it was intact in chastity; for the saints must have a good testimony also from those who are outside, and it was not fitting that virgins living under an ill report should be left the cover of an excuse, in that the mother of the Lord too would seem to have been defamed.

And what could have been laid to the charge of the Jews, what to the charge of Herod, if they had seemed to persecute one born of adultery? And how could he himself say: I came not to destroy the Law, but to fulfil it, if he had seemed to begin with a violation of the Law, since the childbearing of an unwedded woman is condemned by the Law? Moreover, a richer witness to her chastity is brought in, the husband, who could both have grieved at the wrong and avenged the disgrace, had he not recognized the sacrament. What of the fact that greater credit, too, is won for Mary's words and the motive for lying is removed? For an unwedded woman with child would have seemed to want to cloak her fault with a lie. An unbetrothed woman had a motive for lying; a betrothed woman had none, since for women childbearing is the reward of marriage and the grace of wedlock.

Not a slight reason, too, is that the virginity of Mary might deceive the prince of the world, who, when he saw her betrothed to a man, could not hold her childbearing in suspicion. That it was the counsel of the Lord himself to deceive the prince of the world, his own words declare, when the apostles are bidden to be silent about Christ, when the healed are forbidden to boast of their cure, when the demons are commanded to be silent about the Son of God. That it was the counsel, as I have said, to deceive the prince of the world, the Apostle too declared, saying: But we speak the wisdom of God hidden in a mystery, which none of the princes of this world knew. For had they known it, they would never have crucified the Lord of majesty; that is: they would never have brought it about that I should be redeemed by the death of the Lord. So he deceived for our sake, he deceived in order to conquer, he deceived the devil, when he was tempted, when he was questioned, when he was called the Son of God, so as nowhere to confess his own divinity. But yet he deceived the prince of the world still more; for the devil, though at one time he doubted, when he said: If you are the Son of God, cast yourself down, yet came to know him, late though it was, and departed from him. The demons too knew him, who said: We know who you are, Jesus, Son of God. Why have you come before the time to torment us? And they knew that he had come because they had foreknowledge that he would come. But that the princes of the world did not know him, by what greater proof can we show than by the Apostle's sentence: For had they known it, they would never have crucified the Lord of majesty? For the malice of demons easily detects even hidden things, but those who are taken up with the vanities of the world cannot know divine things.

The evangelists divided the matter well among themselves, so that Saint Matthew should bring in Joseph being warned by an angel not to put Mary away, and that Luke the evangelist should there bear witness that they had not come together, and here Mary herself should confess it, when she says to the angel: How shall this be, since I know not a man? But Saint Luke himself too declared her a virgin, saying: and the virgin's name was Mary; and the prophet made it plain, who says: Behold, a virgin shall conceive in the womb; and Joseph showed it, who, since he saw with child her whom he had not known, was eager to put her away; and the Lord himself, set upon the cross, made it plain, when he says to his mother: Woman, behold your son, and then says to the disciple: Behold your mother. Both too bore witness, the disciple and the mother, since from that hour the disciple took her to his own. Surely, had they come together, she would never have left her own husband, nor would a just man have suffered her to depart from him. And how would the Lord have commanded a divorce, when it is his own sentence that no one ought to put away his wife except for the cause of fornication?

Saint Matthew beautifully taught what a just man ought to do who has detected the disgrace of his wife: that he ought to keep himself unstained by bloodshed and pure of adultery; he who in fact is joined to a harlot is one body. So everywhere in Joseph the grace and the character of a just man are preserved, so that he may be a witness of standing; for the mouth of the just man knows no lie and his tongue speaks judgment, his judgment speaks the truth. Nor let it trouble you that Scripture often calls her wife; for it is not the taking of virginity but the attestation of the marriage that is declared by the celebration of the nuptials. Indeed, no one puts away a woman he has not taken, and so he who wished to put her away was confessing that she had been taken.

At the same time, what the evangelist says ought not to trouble us: he did not know her until she bore a son; for that is either an idiom of Scripture — as you have elsewhere: even until you grow old, I am. Did God cease to be after their old age? And in the psalm: The Lord said to my Lord: Sit at my right hand, until I make your enemies the footstool of your feet. Will he not sit afterwards? — or else because one who pleads a case thinks it enough to say what belongs to the case, and does not look for what is superfluous; for it is enough for him to establish the case he has taken up and to put off what is incidental. And so he who had undertaken to prove the incorrupt mystery of the Incarnation did not think that the testimony to Mary's virginity needed to be pursued more fully, lest he be thought a defender of the virgin rather than an asserter of the mystery. Certainly, when he showed Joseph to be just, he declared clearly enough that Joseph could not violate the temple of the Holy Spirit, the mother of the Lord, the womb of the mystery.

We have learned the sequence of the truth, we have learned the counsel: let us learn the mystery. Rightly betrothed, yet a virgin, because she is a type of the Church, which is immaculate, yet married. A virgin conceived us of the Spirit, a virgin brings us forth without groaning. And so perhaps Saint Mary was married to one and filled by another, because the individual churches too are filled by the Spirit and by grace, yet are joined to the outward form of a temporal priest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
