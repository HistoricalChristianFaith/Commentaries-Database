[[commentary]]
quote='''
Buy Christ for yourself, then, not with what few have, but with what all have by nature, but few offer through fear. What Christ asks back from you is his own. He gave life to all; he offered his death for all. Pay for your Author what you will pay by law. This is no small contract; not all see it easily. Indeed, those virgins in the Gospel whom the bridegroom shut out at his coming were left outside for this reason, because they did not buy the oil that was for sale. Hence it is said to them: Go rather to those who sell, and buy for yourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
