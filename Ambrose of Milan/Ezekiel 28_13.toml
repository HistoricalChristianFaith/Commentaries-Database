[[commentary]]
quote='''
Hence it follows that the serpent in Paradise was certainly not brought into being without the will of God. In the figure of the serpent we see the Devil. That the Devil existed even in Paradise we are informed by the Prophet Ezechiel, who in discussing the Prince of Tyre says: Thou wast in the pleasures of the paradise of God. We maintain that the Prince of Tyre stands for the Devil.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 2"
