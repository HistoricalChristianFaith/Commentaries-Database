[[commentary]]
quote='''
And laughing, he was silent. He teaches for what reason one must be silent: I will cry out, and there is not yet judgment. 'He himself' he says 'willed that I should suffer these things; shut in as by walls of temptations, I cannot flee until it pleases God to destroy the heights of my temptations. For now, if I cry out, there is not yet judgment. I am still in the contest, still I wrestle, still a contest remains for me; for the crown has not yet come forth; and no one is crowned unless he has contended lawfully'.

A third contest was owed him. He had lost all that was his, that is, his patrimony together with his sons; his flesh was suffering wounds: it remained for him to overcome the temptations of words. No mean contest. Adam was deceived by speech, Samson conquered by a word; for nothing so penetrates the soul as painted speech, and again nothing bites so as harsher speech. Many, when they had overcome the torments applied to them, have not endured the harshness of words. Job toiled, but he endured, and bore the burdens of words alongside those of his wounds. His president of the games saw him; from the cloud and the whirlwind he gave a hand to him in his toil, and declared that his opponents had fallen with a heavy fall, proclaimed him victor, bestowed the crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 3"
