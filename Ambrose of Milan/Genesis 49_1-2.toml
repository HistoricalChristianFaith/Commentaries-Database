[[commentary]]
quote='''
The deeds of the patriarchs, therefore, are mysteries of things to come. Indeed Jacob himself speaks thus to his sons: Gather together, that I may announce to you what will befall you in the last days. Gather together and hear Israel your father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
