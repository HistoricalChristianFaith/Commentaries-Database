[[commentary]]
quote='''
Here their whole character is comprehended in their justice, but it is well said before God, for a man by affecting a popular good-will might seem just to me, but not be just before God, if that justice instead of springing from simpleness of heart, was a mere pretence carried on by flattery. Perfect then is the praise, "that a man is just before God;" for he only is perfect who is approved by Him who cannot be deceived. St. Luke comprehends the action in the commandment, the doing justice in the justification. Hence it follows, walking in all the commandments and justifications of the Lord. For when we obey the command of heaven we walk in the commandments of the Lord, when we observe justice we seem to possess the justification of the Lord. But to be "blameless" we must "provide things honest, not only before God, but also before men"; (Prov. 3:4.) there is no blame when both motive and action are alike good, but a too austere righteousness often provokes censure. A righteous act may also be done unrighteously, as when a man out of ostentation gives largely to the poor, which is not without just cause of blame. It follows, And they had no son, because Elisabeth was barren.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
They were he says both righteous, walking in all the commandments and justifications of the Lord without complaint. What do they reply to this who, holding out consolations for their own sins, think that a man cannot be without frequent sins, and use the little verse, because it is written in Job: No one is clean from filth, not even if his life is of one day; on earth his months are numbered by him? To them it must be answered that they first define what it is for a man to be without sin: whether never to have sinned at all, or to have ceased to sin. For if they think that to be without sin is this, to have ceased to sin, I too agree — all indeed have sinned and lack the glory of God — but if they deny that he who has corrected his old error and transformed himself into such a quality of life that he refrains from sin abstains from offences, I cannot come round to their opinion, since we read that the Lord so loved the Church as to present her to himself glorious, not having spot or wrinkle or any such thing, but that she might be holy and spotless. For since the Church has been gathered from the Gentiles, that is, from sinners, how can she be spotless out of the spotted, unless first by the grace of God, in that she has been washed from offence, and then in that by the quality of not sinning she abstains from offences? Thus she is not spotless from the beginning — for this is impossible for human nature — but through the grace of God and her own quality, because she no longer sins, it comes about that she is seen to be spotless.

Nor was it idly that he said righteous before God, walking in the commandments and justifications of the Lord, by which he includes the Father almighty and the Son. That it is the Son who brought the Law and prescribed the commandments the holy evangelist too declares. And well righteous before God; for not everyone who is righteous before man is righteous before God. Men see in one way, God in another: men in the face, God in the heart. And so it can happen that someone, by an affected popular goodness, seems righteous to me but is not righteous before God, if his righteousness is not formed from simplicity of mind but feigned through flattery; for man will not be able to detect what is hidden in it. Perfect praise, then, is to be righteous before God. Hence the Apostle too: whose praise he says is not from men but from God. Blessed indeed is he who is righteous in the sight of God; blessed he of whom the Lord deigns to say: Behold an Israelite indeed, in whom there is no guile; for he is a true Israelite who sees God and knows that he is seen by God, and lays open to him the secrets of his heart. For he alone is the more perfect who is approved by him who cannot be deceived; the judgments indeed of the Lord are true, but the judgments of men are often deceived, so that they frequently ascribe the credit of righteousness even to the unrighteous, and either persecute the righteous man with hatred or discolor him with lies. But the Lord knows the ways of the spotless, and holds neither the sinner for praiseworthy nor the praiseworthy for a sinner, but judges each by the reckoning of the merits that befit him; for he is the same judge of the mind and of the deed. The divine judgments measure the merit of the righteous by the disposition of the mind, not by any outcome of deeds; for often either a good mind is disfigured by the outcome of a blameworthy deed, or a wicked thought is veiled by the comeliness of some deed. But even what you have done well, if you have thought badly, cannot be approved by the divine judgment; for it is written: Justly shall you pursue what is just. For unless it were possible for you to do what is just unjustly, it would never have been said: Justly shall you pursue what is just. And certainly the Savior himself taught us that what is just can be done unjustly, saying: When you give alms, do not sound a trumpet before you. And: When you pray, you shall not be as the hypocrites. For mercy is good, prayer is good, but it can be done unjustly, if someone gives to a poor man for the sake of boasting, so as to be seen by men.

Hence the holy evangelist says not only righteous before God, and walking in all the commandments and justifications of the Lord, but also walking without complaint. This agrees wonderfully with the prophetic saying which holy Solomon used in Proverbs, saying: Provide good things always before God and before men. So there is no complaint where goodness both of mind and of deed are in accord; and often a harsher righteousness stirs up the complaint of men.

But observe carefully how fitting the very distinction of the words is, and how the order agrees. Walking he says in all the commandments and justifications of the Lord. For first comes the commandment, second is the justification. So when we obey the heavenly commandments, we walk in the commandments of the Lord; when we judge, and judge fittingly, we are seen to hold the justifications of the Lord.

Complete, then, is the praise, which includes lineage, character, office, deed, judgment: lineage in the forebears, character in equity, office in the priesthood, deed in the commandment, judgment in the justification.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
