[[commentary]]
quote='''
Tarshish, then, is the watchtower of grace, an intelligible city, like the higher Zion. To it Jonah was hastening. Of it Scripture said that Jehoshaphat allied himself with King Uzziah, and it so pleased him that they should make ships and that the ships should go to him to Tarshish. But because he joined himself to an ungodly man, therefore a prophet was sent to him to say to him: The Lord has destroyed your work, and your ships have been shattered, and they could not go to Tarshish. By this it is signified that the bodies of those who transgress the commandment of God cannot reach the consummation of grace.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
