[[commentary]]
quote='''
Rightly as was supposed, since in reality He was not, but was supposed to be so, because Mary who was espoused to Joseph was His mother. But we might doubt why the descent of Joseph is described rather than that of Mary, (seeing that Mary brought forth Christ of the Holy Spirit, while Joseph seemed to be out of the line of our Lord's descent,) were we not informed of the custom of the Holy Scripture, which always seeks the origin of the husband, and especially in this case, since in Joseph's descent we also find that of Mary. For Joseph being a just man took a wife really from his own tribe and country, and so at the time of the taxing Joseph went up from the family and country of David to be taxed with Mary his wife. She who gives in the returns from the same family and country, shows herself to be of that family and country. Hence He goes on in the descent of Joseph, and adds, Who was the son of Eli. But let us consider the fact, that St. Matthew makes Jacob, who was the father of Joseph, to be son of Nathan, but Luke says that Joseph (to whom Mary was espoused) was the son of Eli. How then could there be two fathers, (namely, Eli and Jacob,) to one man.

For it is related that Matthas, who was descended from Salomon, begat Jacob as his son, and died leaving his wife living, whom Melchi took unto him as wife, and from her Eli was born. Again, Eli, when his brother Jacob died without children, was joined to his brother's wife, and begot a son Joseph, who according to law is called the son of Jacob, since Eli raised up seed to his deceased brother, according to the order of the ancient law. (Deut. 25:5.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus himself was beginning, about thirty years of age, being thought to be the son of Joseph. Being about to speak of the generations, between which we see that there is some difference in the Gospel according to Matthew and in this one, whose interpretation we have in hand, let us show with all the zeal we can that they did not say discordant things, since it is not credible that holy men could have said things contrary to one another, above all concerning the deeds of the Lord Savior.

And first of all, no one ought to be troubled that it is written thus: being thought to be the son of Joseph. For rightly thought, since he was not so by nature, but he was thought so because Mary, who was betrothed to Joseph her husband, had borne him; for so you have it: Is not this the son of Joseph the carpenter? We have said above for what reason the Lord Savior willed to be born of a virgin, we have said also for what reason of a betrothed woman and why at the time of the census; it seems not out of place also to declare for what reason he had a carpenter for a father. For by this type he shows that his Father is he who, the craftsman of all things, founded the world, according to what is written: In the beginning God made heaven and earth. For although human things are not to be compared with divine, yet the type is complete, in that the Father of Christ works with fire and spirit, and like a good carpenter of the soul hews away our vices all round, quickly putting the axe to unfruitful trees, skilled to cut away what is puny, to keep what is lofty for the roof-tops, to soften the rigid parts of minds with the fire of the spirit, and to shape the whole human race for various uses by the diverse quality of its services.

But why the generation of Joseph rather than of Mary is described, since Mary bore Christ of the Holy Spirit and Joseph seems a stranger to the Lord's generation, we might doubt, did not the custom of the Scriptures instruct us, which always seeks the origin of the man. For so you have it: Perez was the son of Judah, the prince of the tribe. He begot Hezron, and Hezron begot Aram, and Aram begot Amminadab, and Amminadab begot Nahshon, and Nahshon begot Salmon, and Salmon begot Boaz, and Boaz begot Obed, and Obed begot Jesse, and Jesse begot David. For it is the person of the man that is sought, who even in the senate and in the other councils of cities asserts the dignity of the family. And how unseemly, if, the man's origin being left aside, the origin of the woman were sought, so that he who was to be preached to the peoples of the whole world should seem not to have had a father!

But let us show that elsewhere too a genealogy has been run through in a different order, lest here also the evangelists, who have followed the ancient order, should seem to disagree. For so you have it: There was a man of Arath, and his name was Elkanah, son of Hieremiel, son of Heli, son of Ozi. You see that the description of descent is woven together in the ancient manner both from fathers to sons and from sons to fathers; you see that everywhere a family is run through by the generations of men: do not wonder if Matthew ran through the order of generations from Abraham down to Joseph, Luke from Joseph up to Adam and to God. Do not wonder that Joseph's descent has been described. For, born according to the flesh, he had to follow the usage of the flesh, and he who came into the world had to be described after the manner of the world, especially since in the descent of Joseph there is also the descent of Mary. For since Joseph was a righteous man, he surely took a wife from his own tribe and from his own country, nor could a righteous man act against what is prescribed by the Law. For so you have it that the sons of Israel will cleave each one to the inheritance of the tribe of his country and will not pass from tribe to tribe, and every daughter who has an inheritance of the tribes of the sons of Israel shall be wife to one of the people and of the tribe of her father. And so at the time of the census too Joseph went up, of the house and of the country of David, to be enrolled with Mary his wife. She who makes her declaration from the same house and from the same country surely shows that she is of the same tribe and of the same country.

Elizabeth too is introduced as Mary's kinswoman, first because all Jews are kin, as the Apostle also taught, saying: For I wished that I myself were accursed for my brothers, my kinsmen according to the flesh, who are Israelites. Kinswomen, then, because both were Israelites, and at the same time kinswomen because both were of the tribe of Judah. You have learned that Mary was of the tribe of Judah; learn it of Elizabeth. For Mary, rising in those days, went into the hill country with haste, to a city he says of Judaea, and entered the house of Zechariah. For since Moses prescribed that each should dwell according to his tribe, surely, since she lived in a city of Judaea, she was also in the tribe of Judah, especially since there were priests of Elizabeth's family, whose portion is God. At the same time, how beautiful that, since the one bore the forerunner of Christ and the other Christ, and the one conceived of the Holy Spirit while the other, filled with the Holy Spirit, prophesied, they should be seen to have been kinswomen according to the flesh as well, who according to God did not lack the fellowship of a spiritual kinship! But if, according to the holy Apostle, the man is the head of every woman, and according to the divine law the two are in one flesh, how surely could it happen that those who were one flesh and one spirit should seem to have a divided country and tribe? There is this besides, that the angel Gabriel too foretold of the Lord that the Lord will give him the throne of David his father. It is certain, therefore, that Mary too sprang from the line of David. At the same time we learn also that it makes no difference in what order the series of a genealogy is set out, since the road is passable from this side and from that.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
