[[commentary]]
quote='''
And so, that you may observe that God spurns not service but fraud, he who had rejected the deceitful man chooses the innocent, saying: follow me. But he says this to one whose father he already knew to be dead, that father, certainly, of whom it was said to him: forget your father's house. See, then, that the Lord calls even the unwise whom he pities, and to the one asking leave for his father's burial he answered: let the dead bury their dead, but you go and proclaim the kingdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
