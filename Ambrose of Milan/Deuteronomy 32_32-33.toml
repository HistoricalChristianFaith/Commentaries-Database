[[commentary]]
quote='''
Even greater is the power of wine than that of poison. Therefore poison is driven out by wine, not wine by poison. Rightly did God through Moses compare wine not only with poison but also with the venom of dragons, saying: Their wine is the madness of dragons, and the fury of asps, which is incurable. And well did he add incurable; for many are cured from venom left by snakes, no one, from drunkenness. The flesh certainly is wounded by venom, the mind is without harm: drunkenness adds to the death of the body the guilt also of the mind. Moreover, note that the poison of faithlessness also has been expressed in terms of wine. For he says above of the gentiles who knew not God: Their wine is of the vineyard of Sodom, and their vine is the vine of Gomorrah: their grapes are grapes of gall, the clusters of bitterness in them!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 14"
