[[commentary]]
quote='''
And with how great grace are you renewed, O man! You are purified from sin and are not burned, you are cured and do not suffer, you are remade and are not dissolved, you do not receive the sting of death, and you rise again. And do you yet neglect it, do you yet intend to live for the world, and then keep yourself for God? Do you not know that on this account the sacrifice of Cain was displeasing, that he did not offer the first fruits, but he himself, after enjoying the first fruits, tried to offer a gift to God from those remaining; but that Abel, preferred through his offering of the first fruits, merited the mark of piety?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 22"
