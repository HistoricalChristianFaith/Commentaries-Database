[[commentary]]
quote='''
Our God himself also urges him on with his own oracle, and promises him the advance of faith, the fruit of his gift, saying to him: Joseph will put his hand upon your eyes. Surely the holy patriarch was not anxious about who would close his eyes, although even in a simple understanding a moral affection is expressed. For if we desire to embrace often those whom we love, how much more, when we are about to depart from this body, do we delight in the very last touch of our dear ones, and are soothed by this provision for the journey! Yet mystically we may understand that the people of the Jews would afterwards come to know God. For this is the mystery: that the true Joseph will put his hands upon its eyes, so that the people that did not see before may now see. Come to the Gospel, read how that blind man was healed, on whom Jesus laid his hand and took away his blindness. For Christ does not lay his hand on those who are going to die, but on those who are going to live; or if on those who are going to die, rightly so, because we die first, so that we may live again; for we cannot live to God unless we first die to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
