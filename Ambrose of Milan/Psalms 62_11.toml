[[commentary]]
quote='''
Once has God spoken; these two things I have heard. God has spoken once, and many things have been heard, because he did not speak through letters and syllables. He spoke through riddles, he spoke through visions, he spoke through the distributions of graces, he spoke through the spirit of each one; but we speak many things and are scarcely heard. He spoke once in the Law; the same things he spoke again in the Gospel. Or perhaps, as I think, since he spoke in many ways in the prophets, but last of all spoke in his Son, he spoke once when he spoke in the Son, and there were heard also those things which before had not been heard by those to whom he had spoken through the prophets. He spoke once, then, in the New Testament, and the Old Testament, which was not being heard, was heard, because the Lord himself said of the people of the Jews: They shall see and shall not see, they shall hear and shall not hear. They shall hear with the bodily ear, but they shall not hear with the hearing of the mind.

To us, then, that is, to the Church, he has spoken once and two things have been heard, because in her we have heard and understood what those who read did not understand, what those who heard did not hear. For Christ alone opened the human ear to know the mysteries; he alone loosed the seal of the book and unlocked the riddles of the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
