[[commentary]]
quote='''
Imitate her [Mary], holy mothers, who in her only dearly beloved Son set forth so great an example of material virtue; for neither have you sweeter children [than Jesus], nor did the Virgin seek the consolation of being able to bear another son.
'''
source_url='http://www.newadvent.org/fathers/340963.htm'
source_title="Letter 63, Section 111"

[[commentary]]
quote='''
We have said above for what reason the Lord Savior willed to be born of a virgin, we have said also for what reason of a betrothed woman and why at the time of the census; it seems not out of place also to declare for what reason he had a carpenter for a father. For by this type he shows that his Father is he who, the craftsman of all things, founded the world, according to what is written: In the beginning God made heaven and earth. For although human things are not to be compared with divine, yet the type is complete, in that the Father of Christ works with fire and spirit, and like a good carpenter of the soul hews away our vices all round, quickly putting the axe to unfruitful trees, skilled to cut away what is puny, to keep what is lofty for the roof-tops, to soften the rigid parts of minds with the fire of the spirit, and to shape the whole human race for various uses by the diverse quality of its services.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
