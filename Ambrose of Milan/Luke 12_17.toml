[[commentary]]
quote='''
Nay, he does not suffer even himself to be at rest, who is solicitous about his abundance, and who in the fulness of his fruits utters the cry of one in need. What shall I do? he says. Is not this the cry of the poor man who has not the means of sustenance? In his want of everything he glances hither and thither, he searches his house but finds nothing that can be turned to food. He considers that nothing is more miserable than to succumb to hunger and to die through lack of food; he seeks a shortening of his death-agony and searches out more endurable sufferings in dying: he seizes a sword, suspends a noose, kindles a fire, looks for poison. And in doubt as to which to choose among these, he says: What shall I do? Then, recalled by the sweetness of this life, he wishes to revoke his intention, if he can only find a means of living. He beholds all things bare, all things empty, and he says: "What shall I do? Whence shall I have nourishment, whence clothing? I wish to live, if I may only have whereby I can sustain this life; but with what food, with what means of support?"

What shall I do, he says, because I do not have? The rich man cries that he does not have. This is the language of poverty. Abounding in fruits, he complains of his want. I have no room, he says, where to bestow my fruits. You could have imagined him saying: "I have no fruits, whereby I must live." Is he happy who is in danger from his abundance? Nay, he is more miserable in his plenty than the poor man whose peril lies in want. The latter has an excuse for his misery; he, surely, suffers injustice and bears no blame. The former has no one to accuse save himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 6"
