[[commentary]]
quote='''
In Genesis it has: the rider shall fall backward, awaiting salvation from the Lord, that is, so that he may not turn his eyes away from God, may not bend back his own mind, may claim the prerogative of his own resurrection and raise himself up by divine power. But here it has: they went backward and fell to the ground. He who is earthly falls to the earth; he who is heavenly cleaves to heaven. Even if he falls in body, he does not fall in power, but always aims at the things that are above; for he always looks to the Father, so as to fulfil his will concerning us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Hence, when we are running well in the way, let us beware lest somewhere a serpent lurk in the path and undermine the step of the horse, that is, of our body, and suddenly cast down the rider while he sleeps. For if we keep watch, we ought to be on our guard in some measure and to avoid the serpent's bites. Let not, therefore, the sleep of negligence overwhelm us, the sleep of the world; let not the sleep of riches overwhelm us, lest it be said of us too: they have slept their sleep, and all the men of riches have found nothing. But there are also sleeping riders, of whom it is written: they who mounted horses have slumbered. If avarice wounds your breast, if lust inflames it, you are asleep, rider, and therefore you cannot rein in your body, that is, your horse. Keep watch, then, so that even if you have been cast down, that is, if you have died, you may not fall asleep. For those who sleep their sleep find nothing; but you, await salvation from the Lord, look to it as one that is coming, that you may find the grace of the resurrection. Judas was sleeping: in fact he did not hear the words of Christ. Judas was sleeping, and indeed the sleep of riches, since he was seeking a reward from the betrayal. The devil saw him sleeping and overwhelmed by the heavy sleep of avarice: he cast himself into his heart, wounded the horse, cast down the rider, whom he separated from Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 7"

[[commentary]]
quote='''
Of the horseman we read: And the horseman will fall backward, looking for the salvation of the Lord. For, since no one is without a fall, even if a horseman be brought down and turned aside by some earthly vices, yet, if he does not cast aside the hope of rising again, relying on the divine mercy he comes to salvation. But as regards the rider, there is a clear proof that he is considered reprehensible, since Moses himself says in the Canticle of Exodus: The horse and the rider he hath thrown into the sea. And in Zacharias the Lord has spoken, saying: I will strike every horse with madness and his rider with foolishness. He did not say the horse only but also the rider, just as you have also in Exodus, the horse and the rider. For where there is a rider who cannot manage his horse, the horse rushes headlong and, through its unbridled fury, is carried to precipices and dangers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 15"
