[[commentary]]
quote='''
In Genesis it has: the rider shall fall backward, awaiting salvation from the Lord, that is, so that he may not turn his eyes away from God, may not bend back his own mind, may claim the prerogative of his own resurrection and raise himself up by divine power. But here it has: they went backward and fell to the ground. He who is earthly falls to the earth; he who is heavenly cleaves to heaven. Even if he falls in body, he does not fall in power, but always aims at the things that are above; for he always looks to the Father, so as to fulfil his will concerning us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
