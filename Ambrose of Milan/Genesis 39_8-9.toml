[[commentary]]
quote='''
Setting out from this, Joseph both tamed the heat of youth and strengthened by the application of right reason a soul tempted by adulterous enticements. Indeed, although he was strong and vigorous, yet he preferred to support himself by the reasoning of reason, saying to his master's wife: If my master does not know of anything in his house because of me, and has given all that he has into my hands, and nothing has been withheld from me except you, because you are his wife, how then shall I do this evil thing and sin before God? This, then, is the reasoning of right reason, which the Greeks call λογισμόν (reasoning), by which the mind intent on wisdom is made firm. For it is a fine reason: that he ought not to be ungrateful for his master's kindnesses, and that a sin which he would commit with God as witness, from whom he could not hide, could not be hidden.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 2"
