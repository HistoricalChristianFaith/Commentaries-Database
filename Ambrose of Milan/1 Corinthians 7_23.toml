[[commentary]]
quote='''
Hence it is rightly said to the sons of the Church: You were bought with a price; do not become the servants of men. If it is said to you that you should not become a servant of men and lose your own freedom, much more is it said to you that you should not become a servant of sin, and again, that you should not become a servant of the serpent, the enemy and adversary, but serve the Lord alone, who has redeemed you by his own charity, because he himself is the redemption of his little servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
