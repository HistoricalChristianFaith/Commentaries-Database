[[commentary]]
quote='''
Then, he says, the sun shall be darkened and the moon shall not give her light and the stars shall fall. For when very many fall away from religion, bright faith will be darkened by the cloud of unbelief, because for me that heavenly Sun is either diminished or increased by my faith. Just as, when very many look at the rays of the sun of this world, the sun seems either paler or brighter according to the capacity of the one who sees, so the spiritual light is poured into each according to the devotion of the believer. And just as the moon, in her monthly courses or by the interposition of the earth when she is opposite the sun, vanishes, so too the holy Church, when the vices of the flesh stand in the way of the heavenly light, cannot borrow the brightness of the divine light from the rays of Christ. For in persecutions it is mostly love of this life alone that shuts out the light of God.

The stars shall fall: those, surely, who already gleam with the glory of the resurrection, those men holding the word of life as lights in the world, those men of whom it was said to Abraham that as the heaven and the stars shine, so would his seed also. So patriarchs will fall away from men, prophets will fall away, if the bitterness of persecution grows strong. These things must happen until the fullness of the Church is heaped up in all, and the fullness of the virtues in each; for so the good are proved, so the weak are exposed. So the various surges of minds will be so heavy that, for those of evil conscience through the multitude of their sins, the dew of the sacred fountain in us dries up through fear of the judgment to come; for unbelief is dry, faith is dewy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
