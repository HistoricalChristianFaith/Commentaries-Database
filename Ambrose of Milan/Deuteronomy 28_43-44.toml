[[commentary]]
quote='''
Finally the mystery of the Church is clearly expressed. For he said first to the follower of the Law: If thou wilt hear the Law and keep it, thou shalt lend to the nations, and this was done by our fathers. Moses lent to the nations, and he gained proselytes; Jesus Nave lent, Gideon lent, Samuel, David, Solomon, Elias, Eliseus lent; and if anyone wished to know the Word, he went to them: The queen of the south came to hear the wisdom of Solomon.

When the people of the Jews began not to keep the Law, strangers, that is, those from the people of the nations, who believed in the Lord Jesus, began to lend the interpretation of the Scriptures to that ancient people. Timothy, sprung from a Greek father, lent the Word to the Jews when he had received the priestly office, and we today as priests in the Church lend the word to the Jews who have crossed over from the synagogue to the Church; we lend both the old and the new money. For what they had, they have no longer. They have eyes and see not, they have ears, and hear not, they have money and have it not because they are ignorant of its use, they do not know its value, they have not recognized its form and shape. For if they had recognized it, they would never have denied the author of that money, saying: We do not wish this man to rule over us. He, however, having received his kingdom, returning commanded His servants to be called, to whom he had given money, and he praised those who had lent their money, but to him who had kept his master's money idle he said: Thou knewest that I was an austere man: I take up what I laid not down and I reap that which I did not sow. And why then didst thou not give my money into the bank? And I on coming would assuredly have exacted it with usury.

You have heard what kind of money belongs to the good usurer, what money acquires good usury, what money does not disgrace the lender, does not oppress the debtor, what money rust cannot consume nor moth penetrate; what money is not from an earthly treasure, but from the eternal; what money makes the receiver rich and takes nothing from the lender. This money has usury, so that it bears not a hundredth part of that which you gave, but fruit an hundred fold. Open then the bosom of your mind, that you may receive the amount of this money allotted to you; direct the eye of your heart, that you may recognize the image and inscription of this money. Certainly put out this money; set a squared account on the changing table of your mind, which may be strong in virtues; hide it away in the treasure of your heart, from which the wise scribe brings forth the new and the old. You see what kind of money this is, how it joins together the names creditor and debtor, hateful in themselves. I, who was inveighing against lenders, now challenge the debtor. I desire you to be usurers of this money, then, so that those who borrow may voluntarily hasten to you. Through this money you can gain not coin, but the Kingdom; through this money you may seek not curses, but the grace of blessing.

The people of the nations lend this money, who have learned to receive what has been lent, who have learned to distinguish it, who have learned to put it out. You have rejected the needs of spiritual interest, you have begun to be in want. Of you therefore was it said by the Son of God: The sinner shall borrow and shall not pay again. To you it is said: The stranger that liveth with thee shall rise up over thee, but thou shalt go down. For he does not know the highest who is ignorant of Christ; he is always in the lowest who does not rise to Christ; but in the highest, the people who receive the Word. The latter has the whole patrimony of faith, and of the latter the Law says: He shall lend to thee and thou shalt not lend to him: he shall be as the head and thou shalt be the tail, that is, he shall be first, you last and cast down. I will take from Judea the head and tail, the beginning and the end; Christ the beginning, who, on being asked who he was, answered: The beginning who also speak to you. He calls Christ also the end, for He is the end of the Law unto Justice to everyone that believeth. Therefore he who does not believe has neither the beginning nor the end unto justice, but he is himself his own end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 19"
