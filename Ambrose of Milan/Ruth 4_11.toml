[[commentary]]
quote='''
And how fitting it was that mention of her should be inserted into the Lord's lineage is declared by the expression of a higher mystery, by which it was prophesied that Christ would be born of her line in Ephrathah, when it is said: May the Lord grant you to work power in Ephrathah, and may there be a name in Bethlehem. For what is the power, unless that which gathered the peoples of the Gentiles through Christ? And what is the name, unless that by which Bethlehem became the homeland of the Lord, born according to the flesh? Hence it was said by prophecy: And you, Bethlehem of Judah, are not least among the princes of Judah; for from you will come out a prince who will rule my people Israel. We see, then, that history, morals and mystery agree in the mention of the women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
