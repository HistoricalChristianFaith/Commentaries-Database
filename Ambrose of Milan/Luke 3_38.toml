[[commentary]]
quote='''
What could better agree than that the holy generation should commence from the Son of God, and be carried up even to the Son of God; and that he who was created should precede in a figure, in order that he who was born might follow in substance, so that he who was made after the image of God might go before, for whose sake the image of God was to descend. For Luke thought that the origin of Christ should be referred to God, because God is the true progenitor of Christ, or the Father according to the true birth, or the Author of the mystical gift according to baptism and regeneration, and therefore he did not from the first begin to describe His generation, but not till after he had unfolded His baptism, that both by nature and by grace, he might declare Him to be the Son of God. But what more evident sign of His divine generation than that when about to speak of it St. Luke introduces first the Father, saying, Thou art my beloved Son?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Hence Luke too thought that his origin should be referred to God, because God is the true begetter of Christ, either as Father according to true generation, or as author of the mystical gift according to the regeneration of the washing. And therefore he did not begin to describe his generation at the outset, but after he had set forth his baptism, desiring to show that God is the author of all things through baptism, he declared that Christ too flowed from God in the order of succession, weaving all things together, so as to show him Son of God according to nature, according to grace and according to the flesh. And what clearer sign of the divine generation than that, about to speak of the generation, he set first the Father himself speaking: This is my beloved Son, in whom I am well pleased?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
The murderer of his brother is indeed passed over in silence; for it was not reasonable that he should number among the Lord's forebears him who had struck down his brother, since the Lord saved even lowly servants, that he might endow them with the honour of the name of brothers. Nor is it idle that Seth was not passed over, whom Adam received in a later generation, so that, since the peoples are two generations, it might be signified in type that the Lord Jesus Christ was to be numbered in the later rather than in the earlier generation.

Now as for Adam himself, who according to the Apostle received the figure of Christ, what more beautiful could fit than that the most holy generation should begin from the Son of God and be led up to a son of God, and that the one created should go before in figure, so that the one born should follow in truth; that the one made after the image should precede, for whose sake the Image of God would descend? And if we examine the mystery of the first error, he tasted of the tree of the knowledge of good and evil, the devil deceiving, Eve persuading, so that this one, before he knew evil, might choose good for us, and, the Church persuading, might make void the snares of the dread serpent, according to what is written: For before the child knows good or evil, he does not trust in malice, that he may choose what is good; and: Before he knows how to call father or mother, he will receive the power of Damascus and the spoils of Samaria. For this is the child whose cradle the Magi filled with the spoils of the East, because the nation that was unbelieving before Christ, its faith now changed, offered to the Lord triumphal booty from the trophies stripped from the idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
