[[commentary]]
quote='''
In fact, the Lord Jesus himself, knowing that the man who asked him by what works he might attain eternal life was imperfect, answered him: you shall not commit adultery, you shall not commit murder, you shall not commit theft, and so on. Then, when he said that he had done all these things, he added the more perfect things, saying: sell all that you have and give to the poor, and you will have treasure in heaven, and he taught that there is so great a distance between turning aside from evils and imitating good things that the man who judged the former easy for himself refused the latter. But because he had not climbed even the former, he could not fit himself for the latter; for if he had loved his neighbour, he could have kept from refusing the poor the help of his patrimony. And therefore climb the first step of the Law, so that you may be able to reach the heavenly summit of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
