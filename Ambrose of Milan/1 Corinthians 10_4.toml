[[commentary]]
quote='''
This surely referred not to his divinity but to his flesh, which flowed over the hearts of the thirsting people with the perpetual stream of his blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Holy%2520Spirit%2FBook%25201.html'
source_title="On the Holy Spirit 1.2"


[[commentary]]
quote='''
Hence the Apostle says: But they drank from the rock that followed, and the rock was Christ. A rock, in that it follows the thirsty and strengthens those who slip, so that the thirsty may not lack water, nor those who slip a firm support.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
