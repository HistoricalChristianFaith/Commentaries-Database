[[commentary]]
quote='''
But now let him defend himself; for he wrote Psalm 50 (51) with reference to that story. And although he set after it the story of his earlier deeds, such as that of the betrayal by Doeg the Syrian, whose title is in Psalm 51 (52), and that of the Ziphites, which seems to be comprised in the title of Psalm 53 (54), he put first this story, which is the later one, since Doeg betrayed him, and the Ziphites too, before the prophet David took up the kingdom, inasmuch as he was still fleeing King Saul and wandering as an exile through various hiding places, whereas he took Bathsheba when he was already reigning.

Why, then, does the order of the psalms not also square with the order of the deeds? Because he wished not so much order to agree with order as the mystery with the deeds, and therefore he wished to fit the number of remission to this story. For the number fifty is the number of remission, as the Lord himself taught us in the Gospel, saying: There were two debtors to a certain moneylender. One owed five hundred denarii, the other fifty. When they had nothing with which to pay, he forgave them both. Which of them, then, loves him more?

And in the law you have it that the jubilee is the name given to the number of fifty years, a recurrence very greatly to be celebrated, in which debts are cancelled, the liberties of the Hebrews are confirmed, and possessions are restored.

This number we celebrate with joy after the Lord's passion, when the debt of all our guilt has been remitted and the bond cancelled, and we are free from every tie, and we receive the grace of the Holy Spirit coming upon us: on the day of Pentecost fasts cease, praise is spoken to God, alleluia is sung.

Finally, the father too of a girl betrothed to no one who has suffered intercourse by force receives fifty silver didrachmas, and she herself shall remain in the marriage. By this number, then, even vices are turned into grace. Great, therefore, is the psalm by which we are taught how penance is to be done.

Have mercy, he says, on me, O Lord, according to your great mercy; and according to the multitude of your compassions blot out my iniquity. Wash me thoroughly from my injustice and cleanse me from my transgression. For I acknowledge my iniquity, and my transgression is ever against me. Against you alone have I sinned and done evil before you, that you may be justified in your words and may prevail when you are judged. For behold, I was conceived in iniquities, and in transgressions my mother bore me.

Which of us, even if he confesses his transgression, would not think that it should be touched on lightly rather than repeated? Who would repeat it a second time, or a third? See in how many verses so great a prophet makes his sin resound, how no verse is without confession of transgression. He has heaped everything together at once, sounding out his iniquities and his injustice, joining transgressions to sins, and by repeating them often he rightly asks for great mercy, and not only great mercy but also a multitude of compassions. What sin, then, would not such lamentation wash away, what fault would not a prayer of this kind cleanse? He, for one sin, implores a multitude of compassions; we, for many sins, scarcely believe that his mercy should be besought even once.

Then we read that with great power and with his lofty arm he delivered his people from the land of Egypt, when he led them across through the Red Sea, in which there was a figure of baptism. If, then, there was great power in the figure of the sacraments, how much more is there great mercy in their truth. Rightly too is a multitude of compassions asked for there, where there is a multitude of sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 8"

[[commentary]]
quote='''
Have mercy on me, he says, O Lord, according to your great mercy. This joining of words is new, if I am not mistaken, dearest brethren, that mercy should be called great, and I do not remember having readily read it elsewhere. And therefore we ought to consider what great mercy is. For even if we do not readily read of great mercy, yet we read of the great power of God. And therefore, by considering what great power is, we shall be able to conjecture what he wished to designate as great mercy. For we read in holy Jeremiah: Who are you, O Lord? You made heaven and earth in your great power and with your lofty arm. Great power, then, made heaven. What is this great power, the Father's or the Son's? Certainly the Father's is great power — for he himself made heaven and earth through the Son, as you have it: In the beginning God made heaven and earth — but yet the Son too is great power. For when you read that the Son is the power of the Father, as you have Christ the wisdom and power of God, surely, since the Son is the power of the Father, the Son is great power. How, then, is he denied to be almighty whom we confess to be the great power of God? This great power, then, made heaven, because the Son too made heaven, as you have it: All things were made through him. Therefore if both the Father made it and the Son, surely the unity of the deed indicates the unity of operation. The operation of the Father and of the Son, then, does not differ. But if the operation is one, surely the power of the operation is one, and the majesty of the things made is one. So much concerning the Father and the Son.

Why, then, are we silent about the Spirit, especially since divine Scripture does not suffer us to be silent? For the passage gives a most fitting testimony for proving the unity of the Holy Spirit with the Father and the Son, so that we cannot separate his operation either from the work of the Father and the Son. For we read that the power of the Father is great, in that he made heaven, and that the Son too is great power, since he made heaven, and not only made it but also made it firm; by the word indeed of the Lord the heavens were made firm. Therefore, if both to have made and to have made firm the heaven belongs to great power, neither can we separate the Holy Spirit from the majesty of great power, because it is written: and by the spirit of his mouth all their power. For when heaven and earth were being made, the Spirit was borne above, of whom he says elsewhere through the prophet David: Send forth your spirit, and they shall be created. Of whom he also said elsewhere: For I shall see the heavens, the works of your fingers. For God did not make heaven and earth with bodily fingers, but by the sevenfold grace of the Spirit, namely by that finger of which you have it in the Gospel: But if I cast out demons by the finger of God. For this finger he elsewhere called the Spirit, as you have it: But if I cast out demons by the Spirit of God. If, then, the Spirit is the finger of God, since the Son is the arm of God, surely the Spirit, working together with the Father and the Son through the unity of operation, made heaven and earth. For the Son called him the finger for this reason, that he might express the unity of the divinity as of one body. And so, if great power founded heaven, surely great wisdom founded heaven, because it is written: In wisdom you have made all things.

We have learned, then, what great power is: let us now gather what great mercy is. If great power made the heavens, great mercy too must be from heaven, and great justice must be from heaven; justice indeed has looked forth from heaven, and mercy came from heaven. Great, then, was the mercy that was done, because the Word was made flesh and dwelt in us. Therefore great power made the heavens, great power bowed the heavens, as we read: And he bowed the heavens and came down. By this it is shown that the Son of God was never without a share in his divinity, not even when he dwelt among men, since, even if he took up what he was not, yet he did not cease to be what he was. And so, when it is said: And he bowed the heavens and came down, he seems not so much to have come down from heaven as to have come down with heaven itself. For when the Father addressed the Son set on earth, and angels ministered to him, the Son of God seems not so much to have changed his seat as to have moved it. Therefore we have learned that the mercy is great.

And so, if great mercy is to have come down from heaven, we must distinguish and understand what the multitude of compassions is. For thus it follows: And according to the multitude of your compassions blot out my iniquity. For the two verses do not signify the same thing: the former is referred to the incarnation, while this, which follows, seems to be referred to those injuries which the Son of God took up in the flesh, because he fasted, because he hungered, because he wept, because he was scourged, because he was crucified, because he died, because he was buried; for these are the marks of the flesh, not of the divinity. And it was necessary that the multitude of compassions should drive away the multitude of hardships, the contest of the Lord's passion being destined to profit us.

For he was not blotting out his own sins, because he had committed no sin; but because he was made sin, our sins had to be blotted out, as David said: Blot out my iniquity. What is blot out? Let us look at this word; it is not idle. In fact, elsewhere too he says: It is I, it is I who blot out your iniquities, and I will not be mindful. There are surely certain sores of offences deeply impressed on our conscience, and certain weals on our minds and souls, which are overlaid with the sores of our errors. Guilt, then, has its own characters and letters, by which it is betrayed. This we do not invent by our own ingenuity, but we seal it with prophetic authority. It is written, then; and see where it is written. On the breast he says of your heart, that is: the record of guilt is written there, where the form of virtue is also, not on tablets of stone, but on fleshly tablets of the heart. But the things that are good are not written in with ink, but with the Spirit of the living God, while the things that are vicious with an iron stylus and an adamantine nail. The writing is almost such as the penalty of sin is. The one is written with an iron stylus, the other is restrained with an iron rod, as it is written: You shall rule them with a rod of iron. Different is that other one, the straight rod, the rod of your kingdom. The one restrains the guilty with punishment, the other governs the innocent with command. Guilt, then, is written; let us see where. Not outside, but within, in your heart and in your breast. For as the word is near, in your mouth and in your heart, so in unbelievers the figure of sin and the image of error are impressed in the heart itself. Within, then, is guilt; within is virtue. And therefore the Lord, I perceive, he says, that virtue has gone out from me, so that he might show that the things which are good proceed from within, and, on the other hand, that the things which are evil come forth from within. For not what enters, he says, into the mouth defiles a man, but what goes out of the mouth. For from your heart thoughts proceed, and therefore beware lest evil thoughts come forth from your heart which may convict and accuse you at a later time. For God does not need testimonies and proofs to refute you; your own guilt itself accuses and betrays you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"
