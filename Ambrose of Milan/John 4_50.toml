[[commentary]]
quote='''
Indeed elsewhere he says to the nobleman: Go; your son lives, that you may know both the power of divinity and the grace of humility. There he would not go, lest in the nobleman's son he should seem to have deferred rather to riches; here he went himself, lest in the centurion's servant he should seem to have despised the condition of a slave; for we are all, slave and free, one in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
