[[commentary]]
quote='''
How great the cheapness of sins! For death is cheap, but virtue precious. For the adversary knocks us down at a cheaper valuation like captive slaves, but the Lord, a fit appraiser of his own work, has redeemed us at a great price as comely servants whom he made after his own image and likeness, as the holy Apostle said: for you have been bought with a great price. And well great, for it is valued not with bronze but with blood, because Christ died for us, who freed us with precious blood, as Saint Peter also records in his epistle, writing to us: for not with corruptible things, silver or gold he says were you redeemed from your vain manner of life of the tradition of the fathers, but with the precious blood as of a lamb undefiled and spotless, Christ Jesus. And well precious, because it is the blood of a spotless body, because it is the blood of the Son of God, who redeemed us not only from the curse of the Law but also from the perpetual death of ungodliness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Do you not know that the guilt of Adam and Eve made you over to slavery? Do you not know that Christ redeemed you, he did not buy you? You were redeemed not with gold and silver from your vain way of life of your fathers' tradition, but with the precious blood of the Lamb cries the apostle Peter. Therefore you have been redeemed by the Lord, and you are a slave because you were created, you are a slave because you were redeemed, and you owe slavery both to him as your Lord and to him as your redeemer. Nor should you think the status of a freedman under Christ inferior to freedom. In dignity it is equal, in protection more excellent, in grace on a par, more wary against falling, better sheltered against pride. You have received freedom on such terms that you ought to remember the one who set you free, and that you should know that lawful deference must be paid to your patron, lest freedom be revoked from one who is ungrateful. What is more blessed than you, who reign under the Lord and serve as a soldier under a patron?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 3"
