[[commentary]]
quote='''
And there came a guest, he says, to that rich man. Who is this guest if not wretched sin? For guilt entered into this world like a guest, foreign and alien to our nature. And so he offered no victim from his own flocks, but took the poor man's little sheep and killed it. And although its passion availed for the sanctuary of salvation, yet to him it seems to have been an increase of his own fury, and food for guilt, and an incitement to sin. In fact, Judas received bread from Christ and then was the more filled with the devil, because he did not receive it in faith, he who was preparing betrayal for so hospitable a Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 11"
