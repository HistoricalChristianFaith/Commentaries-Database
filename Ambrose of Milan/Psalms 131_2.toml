[[commentary]]
quote='''
But perhaps someone may wonder, since the Lord said through the mouth of David that he humbled his soul with fasting, how David himself says later on: If I was not humbly minded, but exalted my soul. But let him consider that one thing refers to the wisdom of the mind, another to the humility of the heart. The wisdom of the mind is lofty, but the wisdom of the flesh ought not to be puffed up. He humbled his soul, then, with fasting, to teach that the swelling of our flesh must be chastised; the prophet exalted his soul through the sublime grace of God, since also he who exalts himself shall be humbled and he who humbles himself shall be exalted. And not only is the proud man beaten down and the humble man raised up by the due reward of merits, as must be understood first; but because the word of God is sharp on every side, like a sword which is sharp on three sides, I think it can be understood that both he who exalts himself knows how to humble himself, and he who knows how to humble himself knows also how to exalt himself. Indeed Paul shows it, saying: But I have learned to be sufficient in whatever state I am. I know both how to be humbled, I know also how to abound. So David too, by not thinking humbly of Christ, exalted his soul, which the Arians humble and cast down, and by exalting his soul through the vigour of his understanding and the grace of faith he represented the virtue of humility with devout affection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
