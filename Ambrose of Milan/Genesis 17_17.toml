[[commentary]]
quote='''
But what does it mean that he says: Abraham fell on his face and laughed? Here too reverence is signified, because he feared to offend God as if by a free laugh, although the laugh declared the joy of a just man who was rejoicing at such great promises. For this was not the laughter of one who doubted but of one who believed. At the same time, because all things fall before God and are changed and pass away, that substance alone stands ever unchangeable. Or perhaps in this mystery also Abraham prophesied the Lord Jesus, that through the taking up of the Lord's body and through the resurrection the grace of so great an oracle was to be fulfilled. He worships, then, not the element of earth, of which it was said: And worship his footstool, for it is holy. For where the body is, there also are the eagles, which worshipped him who dwelt in the body.

And he said he says in his heart: If a child shall be born to one of a hundred years, and if Sarah at ninety years shall bear. The Greek has set down, in a middle sense, τῇ διανοίᾳ (in the mind), so that we may judge that he spoke to his heart as to one wavering within itself: 'If a child shall be born to a man of a hundred and a woman of ninety shall bear,' that is: the age for begetting has passed; but to God all things are possible, and therefore this too is easy, to call back the years of youth for the old, to pour back their strength, to give fruitfulness to the barren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
