[[commentary]]
quote='''
All, under the influence of wine, seem equal to one another, no one is inferior. The poor man does not yield to the rich, seeing that he does not know that he is poor; nor the weak, to the strong, whose whole strength is in drinking; nor the beggar, to the man of wealth; nor the ignoble, to the illustrious; since drinkers count him king who has vanquished men in drinking. And rightly it is written: Wine taken with drunkenness is equal life to men. But would that you might hear also what follows: Drink it moderately so that thou mayest be sober. You have no charge to bring against wine. It was created from the beginning to make men joyful, and not to make them drunk. There is joy to the soul and the heart if you drink moderately, but a more immoderate drinking arouses to anger and effects many ruins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 12"
