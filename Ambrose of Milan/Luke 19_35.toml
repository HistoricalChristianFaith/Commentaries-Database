[[commentary]]
quote='''
For it pleased not the Lord of the world to be borne upon the ass's back, save that in a hidden mystery by a more inward sitting, the mystical Ruler might take His seat in the secret depths of men's souls, guiding the footsteps of the mind, bridling the wantonness of the heart. His word is a rein, His word is a goad.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Hence also the apostles spread their own garments under Christ, either so that by the preaching of the Gospel they might set forth the glory of the deed — for in the divine Scriptures garments are often virtues — which by their own virtue too might soften somewhat the hardness of the Gentiles, so that with zealous affections they might render the unstumbling service of a blessed carriage. For it was not a delight to the Lord of the world to be carried on the back of an ass for public show, but that by a hidden mystery he might spread a covering over the inner chambers of our mind, and that, as a mystical rider, he might sit in the secret places of souls in an inward seat, infused as it were into a kind of body of the divinity, guiding the steps of the mind, bridling the wantonness of the flesh, so that by the leading of devotion he might tame the accustomed disposition of the Gentile people. Happy those who received such a rider in their inmost reins; happy indeed those whose mouths the rein of the heavenly Word held in, lest they be loosed in much speaking!

What is this rein, brethren? Who will teach me how it either holds in or looses the mouths of men? He showed me the rein who said: that speech may be given me in the opening of my mouth. Speech, then, is a rein, speech is a goad, and therefore it is hard for you to kick against the goad. This one, then, taught us to open the heart, to endure the goad, to draw the yoke. Let another teach us also to bear the reins of the tongue; for the virtue of keeping silent is rarer than that of speaking. Let him teach indeed who, like one dumb, did not open his mouth against deceit, ready for the scourges and not refusing the blows, so that there might be a devout seat for God.

Learn from the household servant of God to carry Christ, since he first carried you, when as shepherd he brought back the straying sheep; learn to spread beneath him the willing back of your mind, learn to be under Christ, so that you may be above the world. Not just anyone easily carries Christ, but he who can say: I am bowed down and humbled exceedingly; I roared from the groaning of my heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"

[[commentary]]
quote='''
Do not, then, despise this little ass; for as there are ravening wolves in the clothing of sheep, so, on the contrary, the hidden man of the heart is within under a beast's form, because under the cast-off skin of the body, which we have in common with the beasts, a mind full of God is quickened. That this pertains to a figure of men Saint John declared more plainly by adding that they took for themselves the hearts of palm trees; for the righteous will flourish like the palm. And therefore at the coming of Christ the standards of righteousness and the insignia of triumphs were already being raised upon the shoulders of men. Why does the crowd marvel at what the mystery is working? Even if it does not know what it marvels at, yet it marvels, because on that colt wisdom sits, power abides, righteousness clings.

Do not despise this she-ass either, which once saw the angel of God whom a man could not see. And it saw, and carried, and spoke, so that you might recognize that in later times, at the coming of the great Angel of God, those Gentiles, asses before, would speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
