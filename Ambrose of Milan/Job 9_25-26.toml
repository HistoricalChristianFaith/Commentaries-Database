[[commentary]]
quote='''
It is a defect of our condition, because our life is swifter than a runner; it has passed by and has seen nothing. Like the track of a ship or of an eagle flying, seeking food, so too the life of man passes by. What we speak we forget, and no mark of our passing is found except what is full of grief and groaning. I am shaken he says in all my limbs. Would that there were a mediator for us, both reproving and judging between the two of us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"
