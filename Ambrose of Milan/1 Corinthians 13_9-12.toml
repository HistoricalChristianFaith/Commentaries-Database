[[commentary]]
quote='''
Since, then, the just have this reward, that they see the face of God and that light which enlightens every man, let us from now on put on such zeal that our soul may draw near to God, our prayer may draw near, our desire may cling to him, and we may not be separated from him. And while we are placed here, let us be united to God by meditating, reading, seeking; let us know him as we can; for here we have known in part, because here all things are imperfect, there perfect; here we are little children, there strong. We see, he says, now through a mirror in an enigma, but then face to face. Then, with unveiled face, it will be granted to behold the glory of God, which now souls wrapped in the dense entrails of this body and overshadowed by certain stains and filth of this flesh cannot see clearly. For who, he says, shall see my face and live? And rightly. For if our eyes cannot bear the rays of the sun, and if anyone gazes too long straight at the sun he is said usually to be blinded; if a creature cannot look upon a creature without injury and hurt to itself, how can one covered with the husk of this body behold without danger to himself the flashing face of the eternal Creator? For who is justified in the sight of God, when even an infant of one day cannot be clean from sin, and no one can glory in the integrity and chastity of his heart?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 11"
