[[commentary]]
quote='''
You see him in the clouds. I do not indeed think that Christ will come in dark gloom and the dreadfulness of rain — for clouds are seen, they veil the sky with a gloomy dread, and how has he set his tabernacle in the sun, if his coming will be rainy? —

But there are clouds which, because it must be so, veil the brightness of the heavenly mystery; there are clouds which are moist with the dew of spiritual grace. Look at the cloud in the Old Testament: In the pillar he says of cloud he spoke to them. Through Moses, surely, he spoke, through Joshua son of Nun, who made the sun stand still so that he might receive the brightness of a fuller light. So Moses and Joshua son of Nun are clouds. See that holy men are clouds, who fly like clouds and as doves with their young. Clouds above me are Isaiah, Ezekiel, who show me through the cherubim and seraphim the holiness of the divine Trinity; all are clouds. In these clouds Christ comes; he comes in a cloud in the Song of Songs, in a serene cloud, shining with the joy of the bridegroom; he comes also in a light cloud, incarnate of the Virgin; for the prophet saw as it were a cloud coming from the east. And well did he call it a light cloud, one which earthly vices did not weigh down. See the cloud upon which the Holy Spirit came and which the power of the Most High overshadowed.

When therefore Christ has appeared in the clouds, the tribes of the earth shall beat themselves; for there is a certain order of crimes and series of sins which is broken off by the coming of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
