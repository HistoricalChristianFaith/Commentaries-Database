[[commentary]]
quote='''
Moreover, that you may know that men were compared to stones, the prophet also compared men to trees, adding that now the axe is laid at the roots of the trees.

The example was changed for this reason, that by that progress in the comparison a certain milder advance of man might be understood. For those who before were unsightly for use, bare of adornment, barren of fruit, without reason for progress, are now figured in the likeness of trees, which, by a kind of rational gift of nature comely for use, lovely to the sight, rich in fruit, rise up with their tops, spread out with their branches, are filled with fruits, are clothed with leaves. And would that we could imitate the habit of fruitful trees and, as our merits grow, founded on the root of long-lasting humility, lofty from the ground, comely to the sight, raise up the full-grown tops of fruitful works, so that the axe of the husbandman of the Gospel may not cut out the root of a wild trunk. Woe indeed is me, if I do not preach the Gospel — but that voice is the Apostle's — woe is me, if I do not weep for my sins; woe is me, if I do not rise at midnight to confess to you; woe is me, if I deal deceitfully with my neighbour; woe, if I do not speak the truth. Already the axe is at the root; let him who can bear the fruit of grace, let him who ought bear that of repentance. The Lord is at hand, to look for fruit, to give life to the fruitful, to find out the barren. It is three years since he came, and he could not find fruit among the Jews: would that he may find it in us! He is about to order the unfruitful to be cut down, lest they take up the ground. But let those who as yet have no fruit strive to bring it forth in the future. That good tiller of the field will intercede for us, the unfertile, for us, the unfruitful, that time may be given, patience granted, if perchance we too may be able to bear some fruit to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
