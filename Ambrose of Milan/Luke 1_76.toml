[[commentary]]
quote='''
In prophesying of the Lord he rightly addresses the prophet, showing that prophecy also is a gift of the Lord, in order that he might not, while enumerating public benefits, seem to be so ungrateful as to be silent of his own. Hence it is said, And thou, child, shalt be called the Prophet of the Highest.

Now perhaps some may think it an absurd extravagance of the mind to address a child of eight days old. But if we keep our eyes fixed upon higher things, we surely can understand that the son might hear the voice of his father, who before he was born heard the salutation of Mary. The Prophet knew that there were certain organs of hearing in a Prophet which were unclosed by the Spirit of God, not by the growth of the body. He possessed the faculty of understanding who was moved by the feeling of exultation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And you, child, shall be called the prophet of the Most High.

Beautifully, when he was prophesying about the Lord, he turned his words to the prophet, so as to show that this too was a benefit of the Lord, lest, while he publicly recounted his own blessings, he should seem, as if ungrateful, to have passed over in silence the benefits he had received, which he recognized in his son. But perhaps some may think it an irrational excess of mind that he addresses an infant eight days old. But if we keep this in mind, we understand indeed that the newborn could hear his father's voice, he who heard Mary's greeting before he was born. The prophet knew that a prophet has other ears, which are opened by the Spirit of God, not by the age of the body; he had the sense to understand who had the affection to leap.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
