[[commentary]]
quote='''
And to Peter it is said: Get behind me, Satan, so that he may be called forth to better things; and in the reckoning he is first who is after Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And to Peter it was said by the Lord Jesus: Come behind, after me. He did not say: "Come behind" (for this he said to the devil alone), but: Come behind, after me; for he who is after Christ is not behind. But since Peter was in error, as the Lord himself says to him: For you do not savour, he says, the things that are of God but those that are of men, therefore come after me, so that you may begin to mind not human things but divine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
