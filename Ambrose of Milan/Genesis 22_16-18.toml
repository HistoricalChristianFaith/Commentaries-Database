[[commentary]]
quote='''
From this too Abraham won the favour of God. Indeed this is the third blessing. For he received three full blessings: one after the victory by which he freed his nephew, when Melchizedek met him, when God said to him: look up into heaven and count the stars, if you can. So shall your seed be. And Abraham believed God, and it was reckoned to him as righteousness; another when Abraham was commanded to be so named and received the seal of circumcision; the third when he did not hesitate to offer his most beloved son to God as a whole burnt offering. This blessing in turn surpassed the earlier ones. For in those he promised that there would be a propagation of Abraham's seed, but in this he says: and in your seed all the nations of the earth shall be blessed, because you have heard my voice. Let us too, then, hear the voice of our God and obey his precepts, if we wish to find grace with him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
