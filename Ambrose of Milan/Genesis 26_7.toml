[[commentary]]
quote='''
Not without reason is she called sister rather than wife, because a gentle and peaceable soul receives the name of a common piety rather than of a particular union, and because she considers herself bound to all rather than to one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
