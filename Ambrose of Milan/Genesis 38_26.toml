[[commentary]]
quote='''
For first, if you turn your mind to the truth, this woman is not so much notorious as righteous; for she did not seek the use of a passing lust, but desired the grace of succession; for it was unseemly to have no children, which was even punished by the authority of the civil laws. Judah had promised her to his son and for a long time had put off the covenant of the agreed marriage. Through the delay of the promise the bridegroom died. Not yet, before the coming of Christ, did the grace of virginity, not yet that of widowhood flourish. Grieving that she had remained without sons, out of zeal for generation she devised a stratagem and forestalled Judah by a plan, so as to offer herself to him adorned, after she learned that his wife had died. You see that the woman's life is everywhere approved, in that she did not snatch another's bed, nor was she adorned as a harlot from a harlot's zeal; for she did not court a wandering lust, but, long cheated of her father-in-law's promises, by turning the stratagem she wished to obtain the fruit of succession from the family she had chosen. Who, indeed, was more chaste? She who waited so long for what was promised, or he who could not bear a love that was offered? She who did not flee the family of her betrothed, or he who took her for a harlot? She who did not yield the border of her body to those who wished it for intercourse, or he who, what he began from the eagerness of error, brought to completion for the grace of succession through the chastity of the woman? She who had no sons and feared that the time of conception was being shut out by the delay of marriage, she who chose the gravity of a riper man, or he who fell in love with the age of a younger woman? Finally he himself confessed, saying: Tamar is justified rather than I, because I did not give her to Selom my son. And so she wished to put to the test the very man who exacted her chastity. Finally she never afterwards knew a man; after that union she put on the garment of widowhood; he, unable to endure for one hour, who had exacted years of chastity from a girl, put away his mourning, changed his garment, cut his hair, forsook the pyre, and as a lover climbed into bed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
