[[commentary]]
quote='''
But I am hastening too quickly to what comes later and running past useful things, since it must first be defined what "blessed" is. For it is written: blessed is the man who has not gone in the counsel of the ungodly, and has not stood in the way of sinners, and has not sat in the chair of pestilence, Scripture signifying by this that he is blessed who has either kept himself from the fellowship of unbelievers — for this is ungodliness, not to acknowledge the author of life and a kind of parent of salvation — or has not remained in sin, or has not persisted in luxury and wantonness; and that he too who meditates on the law of the Lord day and night will be like a tree that will yield its fruit in its season. The former are the merits of the rewards; this is the reward of the merits.

Which of these things that pertain to the merits of blessedness was lacking to holy Jacob, who was so far from the fellowship of the ungodly that from him the faithful people received its name, he being called Israel because he beheld God with the eyes of the inner mind; who abstained from sin, was sober from the drunkenness of all luxury, so that he drank down the hardships of labours and disregarded the ease of leisure? Was it not beautifully and truly said of him that he too will yield his fruit in its season, he of whom it is written: behold, the smell of my son is like the smell of a full field? For he was perfect in every flower of the virtues and was fragrant with the grace of the sacred blessing and of heavenly blessedness. For he himself is the field which the Lord has blessed, not this earthly field, either bristling with woods, or broken by torrents, or marshy with sluggish waters, or barren of grain, or useless for vines, stony with gravel still unfruitful, or gaping and parched with drought, or soaked with blood, or left untilled with briars and thorns, but that field of which the Church says in the Song of Songs: I have adjured you, daughters of Jerusalem, by the powers and the strengths of the field. For this is the field of which the Lord also says: and the beauty of the field is with me. In this field is found that grape which, pressed out, poured forth blood and washed the world; in this field is that fig tree under which the saints will rest, refreshed by the sweetness of spiritual grace; in this field is that fruitful olive tree flowing with the ointment of the Lord's peace; in this field blossom the pomegranates, which cover very many fruits with the one defence of faith and cherish them in a kind of embrace of love.

With these fruits, then, Jacob was fragrant, he who followed God through dangers and believed himself safe everywhere under his guidance. For although the smell of a field is sweet and pleasant, because it is the smell of nature, yet in the holy patriarch it was the grace of the virtues that breathed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 1"

[[commentary]]
quote='''
Nor was Jacob less quick to find than to carry out; when his mother had told him to bring food in to his father, we see that kinds of definition were at his command. For he both found quickly and testified that God was the author of what he had found, in which are signified both the palm of diligence and the richness of natural talent. The first definition, then, lies in discovery. What is found is sought, and what is sought belongs to time, and what belongs to time surely belongs to diligence. But what anticipates the use of time, God pours in, God gives; and what God gives belongs to nature, not to diligence. Natural talent, therefore, is of divine gift, and what is of divine gift is of nature. Natural talent, then, belongs to nature, discovery to diligence: the former is without time, the latter needs time. And so the former is at hand at the moment, the latter is searched out over a space of time; the former is referred to what is above us, the latter to us.

So when his father sought the food of the word — for man does not live by bread alone, but by every word of God; such food Isaac sought, such food Peter hungered for when he saw the mysteries of the Gentile people who were to believe — Esau did not have at hand the food of a spiritual and swifter talent. While he hunts and seeks and prepares to offer a very hard and rustic discourse, Jacob anticipates him with a swift discovery and with a gentle and almost homely answer, serving a sweet word with which to soothe and delight him. Hence his father, in wonder, says: What is this, that you have found so quickly, my son? Jacob answered: What the Lord your God delivered into my hands. The first definition is in the question, the second in the answer. So the father, finding complete everything that belonged either to natural talent or to diligence, concluded with the consummation of a definition, saying: Behold, the smell of my son is as the smell of a full field, which the Lord has blessed. For a field has both the natural talent of fertility and the temporal diligence of cultivation, and rightly is there fullness in that which lacks neither. At the same time, since he added which the Lord has blessed, he seems to have preferred the grace of nature to the labour of cultivation. And Esau confirmed it, saying: Rightly was his name called Jacob; for he has supplanted me now twice and has taken my birthright.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 8"

[[commentary]]
quote='''
An enclosed garden is my sister, my bride, an enclosed garden, a sealed fountain; your shoots are a paradise of pomegranates with the fruit of henna. The bride is praised because she is a garden having in herself the fragrance of that full field of which Isaac says: The fragrance of my son is as the fragrance of a full field. So the good soul is fragrant with the fragrances of righteousness. And perhaps the field is the patriarch, and the garden is the soul of someone lower, a portion, as it were, of the field; and an enclosed garden, lest it be overrun by beasts, and a sealed fountain, she who by the integrity of the seal and by persevering faith has washed away her own sins. For whoever takes it of the Church has something to refer to the grace of virginity, because, placed in the paradise of delight, she gathers spiritual fruits without labour, since the souls of the patriarchs, with a kind of rustic labour, bring her their fruits, whereby she may obtain an everlasting sweetness. She is rightly called a sealed fountain, because the image of the invisible God is impressed in her. They praise also the gifts of the soul, which were sent to the bridegroom, with which she came endowed. Now the dowry of the devout soul is good fragrances, myrrh, aloes, saffron, by which the grace of gardens breathes and the stench of sins is done away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
Nor is it idly that the soul is praised for fruitfulness, not only because she is fruitful in virtues, but also because she has nothing evil in her. For that is comely and beautiful in which there is nothing evil; for what is good is comely, and what is uncomely is evil. Fruitfulness in good works is beautiful. The opposite of beauty, therefore, is barrenness, since in one who is deprived of beauty or comeliness there is indeed evil; and what is evil is barren and unfruitful. Of this what clearer proof is there than nature? For land that is good is fertile and fruitful, but land that is bad is hungry and barren; and land that is fertile is comely. For what is more beautiful than a full field, when the crop waves, when the fruits glow red, or when garlands of grapes hang down, or the olive bends laden with berries, or the tops of the mountains and the low places of the valleys are clothed with green grass? And to use the testimony of Scripture, Jacob was comely, and therefore he was the fragrance of a full field; Esau was hairy and uncomely, and therefore he was a rustic, one who could bear no fruits. Of the Lord himself too, after he had made the fruitfulness of the Church rise up, it was beautifully said: The Lord has reigned, he has put on comeliness, and elsewhere: You have put on confession and beauty. It is clear, then, that what is fruitful is comely, what is unfruitful uncomely. The case of the soul is like that of the soil, for that soul is comely which is fruitful in merits, fruitful in counsels, and that one uncomely which is barren.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"
