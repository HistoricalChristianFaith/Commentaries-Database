[[commentary]]
quote='''
But I am hastening too quickly to what comes later and running past useful things, since it must first be defined what "blessed" is. For it is written: blessed is the man who has not gone in the counsel of the ungodly, and has not stood in the way of sinners, and has not sat in the chair of pestilence, Scripture signifying by this that he is blessed who has either kept himself from the fellowship of unbelievers — for this is ungodliness, not to acknowledge the author of life and a kind of parent of salvation — or has not remained in sin, or has not persisted in luxury and wantonness; and that he too who meditates on the law of the Lord day and night will be like a tree that will yield its fruit in its season. The former are the merits of the rewards; this is the reward of the merits.

Which of these things that pertain to the merits of blessedness was lacking to holy Jacob, who was so far from the fellowship of the ungodly that from him the faithful people received its name, he being called Israel because he beheld God with the eyes of the inner mind; who abstained from sin, was sober from the drunkenness of all luxury, so that he drank down the hardships of labours and disregarded the ease of leisure? Was it not beautifully and truly said of him that he too will yield his fruit in its season, he of whom it is written: behold, the smell of my son is like the smell of a full field? For he was perfect in every flower of the virtues and was fragrant with the grace of the sacred blessing and of heavenly blessedness. For he himself is the field which the Lord has blessed, not this earthly field, either bristling with woods, or broken by torrents, or marshy with sluggish waters, or barren of grain, or useless for vines, stony with gravel still unfruitful, or gaping and parched with drought, or soaked with blood, or left untilled with briars and thorns, but that field of which the Church says in the Song of Songs: I have adjured you, daughters of Jerusalem, by the powers and the strengths of the field. For this is the field of which the Lord also says: and the beauty of the field is with me. In this field is found that grape which, pressed out, poured forth blood and washed the world; in this field is that fig tree under which the saints will rest, refreshed by the sweetness of spiritual grace; in this field is that fruitful olive tree flowing with the ointment of the Lord's peace; in this field blossom the pomegranates, which cover very many fruits with the one defence of faith and cherish them in a kind of embrace of love.

With these fruits, then, Jacob was fragrant, he who followed God through dangers and believed himself safe everywhere under his guidance. For although the smell of a field is sweet and pleasant, because it is the smell of nature, yet in the holy patriarch it was the grace of the virtues that breathed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 1"
