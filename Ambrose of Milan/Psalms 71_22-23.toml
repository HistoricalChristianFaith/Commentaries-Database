[[commentary]]
quote='''
The psaltery, then, is the man perfected in Christ, in whom, just as the strings of the chords resound by the art of those who play in concert, so the tuneful works of the virtues in accord resound, so that he can say: I will sing psalms to you, O God, on the lyre, Holy One of Israel. My lips shall rejoice when I sing to you, and my soul, which you have redeemed. Paul says of himself: without were fightings, within were fears. This man rejoices both within and without, but that one was still in the contest, this one at rest, because he had known that he had merited the redemption of his soul. He who sings psalms is in gladness; he who wrestles is in anxiety. Yet Paul too knew how to sing psalms, but he was still reserving himself for further advances, until, when he had been more fully approved, he might sing psalms. And therefore he said: I will pray with the spirit, I will pray with the mind also; I will sing psalms with the spirit, I will sing psalms with the mind also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
