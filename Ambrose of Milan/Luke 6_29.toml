[[commentary]]
quote='''
But what is so wonderful as to offer the other cheek to the one who strikes? Is not every impulse of the indignant man broken, his anger calmed? Does it not come about through patience that you strike back the striker more fully by his own repentance? So it will be that you both repel the injury and seek favour. And often the greatest causes of love arise, when patience is returned for insolence, kindness for injury. Indeed, as I remember hearing, we think that the haughty brow of philosophy is pressed down by this alone, that it seems to itself to have divided justice into three parts: one toward God, which is called devotion, another toward parents or the rest of the human race, the third toward the dead, so that the due rites of burial may be paid to them. But the Lord Jesus, going beyond the oracle of the Law and the summit of philosophy, extended the office of devotion even to those who have done us harm. For if an enemy who has fought with you with war and arms, on laying down his arms, obtains mercy for his life, and this is commonly granted either from regard for nature or by the very law of war, that life be given to the subdued, how much more must it be granted from the better regard of religion! For since the fact that his own life was assailed does not move the warrior, what ought it to do to the soldier of peace?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
