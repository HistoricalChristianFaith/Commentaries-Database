[[commentary]]
quote='''
When you are admonished, then, to hold your peace, your conscience is aroused and your crimes become flagrant. What, therefore, is the meaning of the words, Let us go into the field? Does it mean that a place devoid of plant life is chosen by Cain for the murder of his brother? What place was more fitting for this murder than one that was barren? Nature, it seems, had purposely denied germinating powers to a place destined for such a crime, because it was not fitting that, contrary to nature, this soil should on the one hand share in the contagion of parricidal blood and at the same time bring forth fruit in accordance with the laws of nature. When Cain said: Let us go forth into the field, his words had meaning. He did not say: "Let us go forth into the Garden where fruit grows plentifully, into a cultivated and productive place." As a matter of fact, we know that parricides cannot obtain for themselves the fruit of their crimes. They expend time and effort in a frightful act of impiety, yet they cannot attain their objective. They shun places that have been blest by nature's benignity. We have the example of Cain, who seems to have been afraid that a land productive of such goodly crops might be an impediment to his ghastly crime. He seems to have feared that the lushness of vegetable life with its variety of germinating fruits might by its mute appeal, even in the act of perpetrating his crime, bring back to him his affection for his own brother. The highwayman shuns daylight, a witness of his crime. The adulterer blushes to see the light of day discover him. In like manner the parricide avoids land that is fertile. How could he bear to behold the common association of plants for productivity who was face to face with one who was bound to him by relationship of blood? Joseph was thrown into a dry pit. Amnon was slain in his own house. Nature, therefore, by withholding her gifts from those places which were to be witnesses of a parricidal act and by her condemnation of innocent soil, makes clear to us the severity of the future punishments of the guilty. The very elements are, therefore, condemned because of the crime of men. Hence David condemned the mountains, in which Jonathan and his father were slain, to be punished with perpetual sterility, saying: Ye mountains of Gelboe, let neither dew nor rain come upon you, mountains of death.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 8"
