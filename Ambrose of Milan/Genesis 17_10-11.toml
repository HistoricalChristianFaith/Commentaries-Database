[[commentary]]
quote='''
He is commanded to be circumcised when he is about to receive the inheritance of the true seed. Is not the circumcision of the flesh plainly a precept of purity, that one should cut away the lust of the flesh and rein in the desires left untamed by luxury and wantonness? For indeed by the word circumcision this is prescribed: that every stench of impurity be wiped away and the incentive of lust be taken away. We have used two defences.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"

[[commentary]]
quote='''
At this point I know that many are troubled. For if circumcision is good, it ought to be kept even today; if it is useless, it ought not to have been commanded, especially by a divine oracle. But since the apostle Paul has said that Abraham received the sign of circumcision, surely a sign is not the thing itself, but belongs to another thing; that is, it is not the truth, but an indication of the truth. Indeed, he himself explained and expressed it, saying: he received the sign of circumcision, a seal of righteousness and of faith. Hence we understand, not unfittingly, that bodily circumcision is the sign of spiritual circumcision. So the sign remained until the truth should come. The Lord Jesus came, who says: I am the way and the truth and the life, because he circumcised not a small part of the body in sign, but the whole man in truth; he took away the sign, he brought in the truth, because after that which is perfect came, that which was in part was done away, and therefore the circumcision of the part ceased when the circumcision of the whole shone forth. For now it is not in part, but the whole man is saved: he is saved in body, he is saved in soul. For it is written: He who wishes to come after me, let him deny himself and take up his cross and follow me. This is the perfection of circumcision, that through the offering of the body the soul is redeemed, of which the Lord himself says: He who loses his soul for my sake shall find it.

There remains now that portion of the question, whether the part ought to have been sent ahead when perfection was to come. This point is easy to resolve, if we consider to whom the part was commanded and for whom perfection was reserved. For the part was commanded according to the Law to the people of the Jews, that stiff-necked people, that weak people, that people which did not know its God. Since, then, it could not bear the part, how could it have kept the perfection? Just as, if you instruct a little boy in letters, you must begin from the single elements of the letters, so that you lead him from single strokes to syllables, and from syllables in order to words and speech; nor can anyone sail the sea fearlessly except one who has first sailed on rivers. Indeed, if you wish to entrust some task, either of making a journey or of lifting a burden, to a boy and to an older person, are the burdens to be made equal, or the labour equal? So then you should know that the perfection of circumcision was reserved for those who, instructed by Christ, seemed fit for stronger things, so that both the faithful might be proved, of whom an innumerable multitude would take up the cross and devote their soul for Christ, and the unbelieving, who reckoned the scant blood of their own circumcision to be saving, might be unable to resist men who thought that salvation was sought in the immolation of the whole body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"

[[commentary]]
quote='''
And because he is called to the perfect, he receives the oracle of perfection. You shall circumcise he says every male of yours, and you shall circumcise your flesh; but perfect circumcision is spiritual. Indeed the reading also teaches this when it says: Circumcise the hardness of your heart. And here many take it thus, so that it means: Circumcise every male of yours, that is, your mind; for nothing is stronger than the mind. Next, because the male is also called holy: Every male that opens the womb shall be called holy to the Lord. And what is holier than the mind, which gives the seeds of good thoughts, by which it opens the womb of the soul shut up by the barrenness of not bearing, so that it may be able to bring forth those invisible generations, namely in that spiritual womb of which Isaiah says: In the womb we have conceived, and we have been in labour with the spirit of salvation? Circumcision of the heart, then, which is intelligible, and circumcision also of the flesh, which is sensible, is commanded: the one in truth, the other in a sign. The circumcision is therefore twofold, because abstinence is required both of the spirit and of the body. Indeed the Egyptians circumcise males in the fourteenth year, and the women among them are said to be circumcised in the same year, because, namely, from that year the passion of the manly impulse begins to burn and the menses of women take their beginning. But the giver of the eternal Law requires the sign of carnal circumcision in males alone, because in the use of intercourse the man is more vehement than the woman, and therefore he wished to break his impulse by the sign of circumcision; or because men believe that they go astray lawfully if they abstain only from adultery, and think that the use of harlots is allowed as if by the law of nature, whereas apart from marriage it is lawful neither for a man nor for a woman to be joined with another. But by a higher interpretation this is laid open: that if the mind is purged and circumcised, stripped of superfluous pleasures and thoughts, it restrains the soul to its own purity and, when the soul has been steeped in pure senses, makes it the bearer of good offspring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 11"
