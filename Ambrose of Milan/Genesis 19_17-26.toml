[[commentary]]
quote='''
So he did not set out, but was led out, and received the command not to look back nor to stop in all that region, but to go up into the mountain. When this is said to him, it is said to all. If then you too wish to escape, do not look back, but before you. Look to where Christ is, who may say to you: go behind me, as he said to Peter: go behind me, so that he might follow Christ and see Christ. Behind is Sodom, full of outrage; behind is Gomorrah, teeming with vices, the region of crimes. Do not touch says the Apostle, do not defile, do not taste the things which all lead to corruption. Flee then from Sodom, leave it quickly, forsake the elements of this world, lest the dangers that threaten entangle you; do not stop as you flee, nor linger in all the region of vices. He who did not look back escaped; she who looked back could not escape.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
