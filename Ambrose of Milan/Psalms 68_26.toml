
[[commentary]]
quote='''
Hence too "the eye of punishments" is not foreign to the Church; because, though John baptized in Aenon, he baptized near Salim, where there was an abundance of waters, and twelve fountains, and seventy palm trees. The Church has these fountains: that is, in the Old Testament the twelve patriarchs, in the New the twelve apostles; and therefore it is said: In the churches bless the Lord God from the fountains of Israel (Ps. 67 (68):27). Whoever attains the most holy mysteries is first bathed in these fountains; for these fountains, flowing from the eternal fountain, have streamed over the whole world. Where these fountains are, there is the ascent of souls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
