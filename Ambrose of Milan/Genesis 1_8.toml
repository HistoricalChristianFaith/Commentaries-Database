[[commentary]]
quote='''
‘And God saw that it was good.’ The Son does what the Father desires. No degeneration of nature is found in Him whose work does not degenerate from the will of the Father. He saw, it is certain, but not with corporeal eyes. He designated that the limit of vision should conform to the plenitude of His grace, by which means His judgment may be made known to us, for we in fact often dispute even on subjects which are divine.

What wonder is it, then, if those men who are able to turn their attention to the work of creation also raise questions on the generation of the Creator Himself. Him they call to judgment; Him they dare refer to as unjust and unworthy of His descent. And so you read both ‘God spoke’ and ‘God created,’ in which both Father and Son are honored with the same name of majesty. ‘And God saw that it was good.’ He spoke as if speaking to one who knew all the wishes of His Father. He saw as if He knew all that His Son had accomplished, acting with Him in community of operation.

‘He saw that it was good.’ He did not, of course, recognize that of which He was ignorant. Rather, His approval was given to what gave Him pleasure. The work did not please Him as something unknown, just as the Father, who was pleased with the Son, was not like one unknown, as it is written: ‘This is my beloved Son, in whom I am well pleased.’ The Son always knows the will of the Father and the Father that of the Son. And the Son listens to the Father and the Father hears the Son through the unity of nature, will, and substance. The Son, therefore, bears witness to this in the Gospel, speaking to the Father: ‘I know that thou always hearest me.’

The Son is ‘the image of the invisible God.’ All that the Father is, the Son sets forth as an image. The Father illumines and makes Him manifest for us all as ‘the brightness of his glory.’ The Son, too, beholds the work of the Father and the Father that of the Son, as the Lord Himself has declared: ‘The Son can do nothing of himself but only what he sees the Father doing.’ He sees, therefore, the Father doing and sees and hears Him in like manner through the hidden power of His invisible nature. Therefore, He says: As I hear, so do I judge, and ‘my judgment is true, because I am not alone, but with me is he who sent me, the Father.’

This is the mystic sense. The moral sense is this: ‘He saw’ for me; ‘He approved’ for me. What God has approved, do not consider worthy of blame, since you recall that the statement, ‘What God has cleansed, do not thou call common,’ has been written for you. Hence, let no one blaspheme what is good before God! If the firmament is good, how much more so is its Creator, even if the Arians would not admit it and the followers of Eunomianus should object, the no less corrupt fruit of a degenerate root!

‘God saw that it was good.’ Artists usually work first on individual parts and afterwards join them together with skill. Those who start to carve out of marble the features or bodies of men or mould them in bronze or wax do not know exactly how the individual components will blend together, nor the beauty which will be the result of the final work. And so they dare not praise fully, but praise only in part.

God, however, as judge of the whole work, foreseeing what is going to happen as something completed, commends that part of His work which is still in its initial stages, being already cognizant of its termination. This is not to be wondered at, since in His case the completion of a thing does not depend on the termination of the actual work. It rests, rather, on the predetermination of His will. He praises each individual part as befitting what is to come. He praises the total work, which is compounded of the elegance of each part. True beauty, in fact, consists of a fitting adjustment in each part and in the whole, so that the charm in each part and the full appropriateness of the form in the completed work are worthy of commendation.

But now let us put an end to the second day, lest, while we are attending to the work of the firmament, we may cause our hearers to languish because of the prolixity of our discourse—in a discourse which, prolonged into a night which is still devoid of the light of a moon and stars, may bring obscurity to those who are returning home. For the luminaries of the heavens have not as yet been created. Our purpose is also to allow our hearers to refresh themselves with food and drink, so that, while their minds have banqueted, the frailty of their flesh may not find cause to complain of a fast lasting even until nightfall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
