[[commentary]]
quote='''
Therefore he brings his well-beloved son to be sacrificed, and offered promptly him whom he had received late; nor is he restrained by being called by the name of father, when his son called him "Father," and he replied, "My son." Dear pledges of love are these names, but the commands of God are loved still more. And so although their hearts felt for each other, their purpose remained firm. The father's hand stretched out the knife over his son, and the father's heart struck the blow that the sentence might not fail of being carried out; he feared lest the stroke should miss, lest his right hand should fail. He felt the movings of fatherly affection, but did not shrink from the work of submission, and hastened his obedience, even when he heard the voice from heaven. Let us then set God before all those whom we love, father, brother, mother, that He may preserve for us those whom we love, as in the case of Abraham we behold rather the liberal Rewarder than the servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Decease of His Brother Satyrus, Book 2, Section 97"

[[commentary]]
quote='''
And Isaac spoke to Abraham his father, saying: father. And he said: what do you wish, son? The father's affection is struck by the words of fatherly love and beaten, as it were, by waves from this side and from that. The son calls his father, the father says: son, so that by the very sound of the words the father may recognize how impossible it is that he could strike the one whose wound he would wish to undergo himself. These names are wont to work the grace of life, not the ministry of death; these words are wont to rouse to fatherly love, not to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 8"
