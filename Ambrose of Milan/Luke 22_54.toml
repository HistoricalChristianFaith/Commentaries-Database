[[commentary]]
quote='''
The wretched men understood not the mystery, nor had reverence unto an outpouring of compassion so merciful, that even His enemies He suffered not to be wounded. For it is said, Then look they him, &c. When we read of Jesus being holden, let us guard against thinking that He is holden with respect to His divine nature, and unwilling through weakness, for He is held captive and bound according to the truth of His bodily nature.

Rightly he followed afar off, soon about to deny, for he could never have denied if he had clung close to Christ. But herein must he be revered, that he forsook not our Lord, even though he was afraid. Fear is the effect of nature, solicitude of tender affection.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when the sign had been given, he says, he is seized by those who had come with clubs. But it was mysteries, not arms, that held the Lord of all. Indeed he spoke, and they fell backward. What need have I of legions of angels, what need of the heavenly host? The voice of the Lord alone terrifies more. This, to show a token of the divine majesty, he chose who reclined on the breast of Christ. So the crowd lays hands on him, though he is willing; chains are bound on. O madmen, O unbelievers! Not thus is wisdom seized, not thus is righteousness held.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
