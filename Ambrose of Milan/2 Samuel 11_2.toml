[[commentary]]
quote='''
Now let us establish what we touched on briefly, that the faculty of commanding is an incentive to sinning, and let us follow the sequence of the history. David would not have adulterated another's right of the marriage-bed and the compact of a covenanted marriage, had he not seen from within his house a woman naked and washing. And therefore it is well written: Do not fall into the beauty of a woman and do not covet a woman, and elsewhere: Beware of the eyes of every shameless woman. Presume nothing of your continence and virtue. For indeed the fornication of a woman shall be known in the lifting up of her eyes and in her eyelids, and therefore flee first the cause of sin; for no one is strong for long, and it is said not to the frail only, but to every man: Let not the desire of beauty conquer you — if you do not wish to be conquered, do not join battle with sins, lest vices be crowned over you — nor be captured by eyes nor carried off by eyelids. A woman seems to you cheap in price, but she is strong for vice, because a woman captures the precious souls of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 3"

[[commentary]]
quote='''
Here, then, David was walking about within his own house. And what house of Christ is it, surely, but that of which he says that with my Father there are many mansions? Set, then, in that palace, he saw the human condition naked and, taking pity, loved it. For it was still naked of virtues, because through the snares of the serpent it had been deprived of the native garments of its nature. For it does not seem likely that a woman would strip in front of the king's house, that a woman would wash herself in front of the king's house, as if there could be no other place more fitting for washing. It does not fit, it does not agree, it does not accord with belief: it is far from the truth, it is repugnant to sense. Such a woman, so wanton, so forward, the king could have shuddered at, not loved. Or could she, if she could not feel shame before the gaze of men, not at least have stood in awe of the king's? Or could not even his servants have kept her away before the king saw her?

If, then, this cannot accord with belief, let us seek who this naked woman is: namely, the human condition, stripped of all the garments of nature, lacking the mantle of immortality and despoiled of the veil of innocence; for he is naked who is stripped by sin and guilt. Accordingly, that first sinner of our race — and would that he had been the only one —, before he sinned, did not perceive that he was naked; after he sinned, he saw that he was naked, and therefore thought that he must be covered with leaves, because he knew that he was naked. So he became naked to himself after he became answerable for guilt. In him the whole human condition was stripped, and through the succession of nature became liable not only to guilt but also to hardship. So he perceived and saw that he was naked. Hence our whole condition is such that he who thinks himself naked both sees and perceives himself naked. Accordingly, he who covets riches is naked; he who despises them is wealthy. So true is it that each one's own feeling is his hardship, and each one's own virtue is free from injury. So Christ first claimed for himself in marriage, through the Law, the human condition, which he later repudiated. Hence he also says: What is the bill of your mother's divorce, by which I put her away? In this way, then, Christ saw his household naked and loved it; for Christ loves a holy soul. Accordingly, Jesus loved Lazarus and Mary; Christ loved his Church, although naked, although still clothed with no adornment of virtues.

Accordingly, so that we may know that the sequence of the Scriptures agrees with the dispensation set before us, let us learn that the Church was naked, let us learn that she was seeking, hastening and washing herself before the house of Christ, when John was baptizing in the Jordan, saying: I indeed baptize you in water unto repentance, but he who comes after me is mightier than I, whose shoes I am not worthy to carry. He will baptize you in the Holy Spirit. So when the people were being baptized unto repentance, the Church, already near to his house, was surely seeking Christ, that she might attain to grace. So the Church was seeking Christ in John, saying: Announce to me him whom my soul has loved, recalling that he himself was the cause of her desire, he himself the cause of her washing, as you have it: I am dark and comely, daughters of Jerusalem, like the tent of Kedar, like the skin of Solomon. You have the reason why she longs to wash herself: because she recalls that she is dark. For, as though to John asking why the great multitude, flocking together, longed to be washed, she answered, saying: I am dark and comely, daughters of Jerusalem. Because she is dark, she desires to be washed; because she is comely, she does not fear to be seen naked. Do not look, she says, at me, for I have been darkened, because the sun has not looked upon me. So we are darkened when we are not seen by Christ, but when we are seen, we grow white. So he saw her, he to whom all things are naked and from whom the inner things of the breast cannot be hidden, because he is the searcher of heart and reins; nothing is covered to him, nothing wrapped up. He saw his Church naked and, as he saw, he loved her. He saw his beloved naked and, as a son of love, he loved her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"
