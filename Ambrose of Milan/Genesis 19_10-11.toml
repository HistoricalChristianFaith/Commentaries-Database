[[commentary]]
quote='''
But the angels struck them with blindness, so that they could not find the door of the house which they longed to open. Here indeed the wonderful power of the angels is declared, in that blindness was poured over the impure and the doors of the house could not be found. But this too is shown, that all lust is blind and does not see what is before it. At the same time, in that holy Lot was drawn back into the house by the hands of his guests, he is shown to have been unmindful of danger and mindful of faith, not to have snatched himself from the danger but to have exposed himself to it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
