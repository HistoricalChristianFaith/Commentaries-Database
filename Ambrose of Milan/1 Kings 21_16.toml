[[commentary]]
quote='''
And it came to pass, it says, when Achab heard that Naboth was dead, he rent his garments, and covered himself with haircloth. And it came to pass after these things, Achab arose, and went down into the vineyard of Naboth the Jezrahelite to take possession of it. Rich men grow angry and calumniate so that they may do injury, if they obtain not what they desire. But when by their calumny they do cause injury, they pretend that they are sorry; yet sad and grief-stricken, as it were, not in heart, but in countenance, they set out for the place of the stolen estate and take possession by their unjust and violent procedure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 11"
