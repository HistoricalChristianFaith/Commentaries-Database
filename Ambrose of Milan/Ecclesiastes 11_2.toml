[[commentary]]
quote='''
The Old Testament too knew this number eight which in Latin we call the Octave, for the preacher says, give a portion to seven and also to eight. The number seven belongs to the Old Testament, the number eight to the New, for then Christ rose, and the day of new salvation shone upon all. This is the day whereof the Prophet says, This is the day which the Lord hath made, let us rejoice and be glad in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252041-50.html'
source_title="Letter XLIV, To Horontianus"


[[commentary]]
quote='''
Now the seventh day denotes the mystery of the Law, the eighth that of the Resurrection, as you have in Ecclesiastes, Give a portion to seven and also to eight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252021-30.html'
source_title="Letter XXVI, To Irenaeus"

[[commentary]]
quote='''
How good a childbearing of faith, how safe this harbour of devotion, how splendid a lamp of the Church, shining with sevenfold light and, with her womb as the eighth, supplying oil to all the lights! Of them it is beautifully said: give a portion to those seven, and indeed to those eight, because in both numbers they attain the fellowship of grace, nourished in the Law, crowned through grace, seven as in the sabbath, eight as in the Gospel, the devout mother having been joined as the completion of the passion, she who in such sons both travailed with and brought forth the perfect form of devotion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 11"
