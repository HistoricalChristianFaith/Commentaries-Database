[[commentary]]
quote='''
He changes his name by the addition of a letter, so that from Abram he is called Abraham; that is, from vain father, as the Latin interpretation has it, he should be called lofty father, chosen father, or from a father he should become the father of a son. He was vain when he did not know God: he was made chosen after he acknowledged God. He was a father when he had offspring from the handmaid, but he was not the father of a son, because he had no son received in lawful wedlock. Sarai bore, and he became the father of a son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
