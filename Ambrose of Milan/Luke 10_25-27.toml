[[commentary]]
quote='''
For he was one of those who think themselves skilled in the law, and who keep the letter of the law, while they know nothing of its spirit. From a part of the law itself our Lord proves them to be ignorant of the law, showing that at the very first the law preached the Father and the Son, and announced the sacraments of the Lord's Incarnation; for it follows, And he answering said, Thou shall love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
To these is joined the reading in which those are exposed who think themselves lawyers, who hold the words of the Law but are ignorant of the force of the Law. And from the very first chapter of the Law he teaches that they are ignorant of the Law, proving that at the very beginning the Law proclaimed both the Father and the Son and announced also the sacrament of the Lord's Incarnation, saying: you shall love the Lord your God and: you shall love your neighbor as yourself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
