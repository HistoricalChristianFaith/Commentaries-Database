[[commentary]]
quote='''
Abraham numbered three hundred and eighteen of his home-born servants . . . . as far as Hobah, which is on the right of Damascus. And the number is a number of life. For in it is life, if we believe in the passion in the name of the Lord Jesus. For this is the interpretation of this name which we have mentioned, Hobah, that is, life. And it is beautifully said to be on the right of Damascus; for the lambs are on the right, but the goats on the left. The trained mind knows whom to take to itself to bring the battle to its end, with what arms to equip them, under what standards to lead them. It does not carry before it images of eagles or dragons, but it advances to battle in the cross of Christ and the name of Jesus, strong in this sign, faithful under this standard. Rightly, then, is it a trained mind, which has received the true wisdom of the just man. But justice is skilled in correction, and by reproving it calls sinners back and curbs the onsets of the passions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 7"
