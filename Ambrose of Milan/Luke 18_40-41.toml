[[commentary]]
quote='''
But lest we seem, as men disdainful of the poor, to have quickly left that blind man and passed over to the rich man, let us wait for him, because the Lord too waited; let us question him, because Christ too questioned him. Let us question because we do not know; he questioned because he knew. Let us question so that we may know how this man was cured; he questioned so that in one man we, the many, might learn how we may merit to see the Lord; for he questioned so that we might believe that no one can be healed unless he confesses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
