[[commentary]]
quote='''
"As an apple tree among the trees of the woods, so is my beloved among young men." And seeing this, the church is glad and rejoices, saying with great delight, "I sat in his shadow, and his fruit was sweet to my taste."
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:52"

[[commentary]]
quote='''
Imitate the palm, man, so that it may be said also to you: ‘Thy stature is like a palm tree.’ Preserve the verdure of your childhood and of that natural innocence of youth which you have received from the beginning, and may you possess the fruits, prepared in due time, of what was planted along the course of the waters—and may there be no fall to your leaf!

To this verdure of grace everflourishing in Christ the Church refers in saying: ‘I sat down under his shadow whom I desired.’ The Apostles received this privileged gift of verdure, whose leaves could never fall, so as to provide shade for the healing of the sick. Their fidelity of heart and the superabundance of their merits provided shade for bodily infirmities. Remain, therefore, planted in the house of the Lord so as to flourish like a palm in His halls, whence the grace of the Church may ascend for you and ‘the odor of thy mouth may be like apples and thy throat like the best wine,’ so that you may be inebriated in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
