[[commentary]]
quote='''
"As an apple tree among the trees of the woods, so is my beloved among young men." And seeing this, the church is glad and rejoices, saying with great delight, "I sat in his shadow, and his fruit was sweet to my taste."
'''
source_url='https://www.newadvent.org/fathers/3407.htm'
source_title="Concerning Virginity 9:52"

[[commentary]]
quote='''
Imitate the palm, man, so that it may be said also to you: ‘Thy stature is like a palm tree.’ Preserve the verdure of your childhood and of that natural innocence of youth which you have received from the beginning, and may you possess the fruits, prepared in due time, of what was planted along the course of the waters—and may there be no fall to your leaf!

To this verdure of grace everflourishing in Christ the Church refers in saying: ‘I sat down under his shadow whom I desired.’ The Apostles received this privileged gift of verdure, whose leaves could never fall, so as to provide shade for the healing of the sick. Their fidelity of heart and the superabundance of their merits provided shade for bodily infirmities. Remain, therefore, planted in the house of the Lord so as to flourish like a palm in His halls, whence the grace of the Church may ascend for you and ‘the odor of thy mouth may be like apples and thy throat like the best wine,’ so that you may be inebriated in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"

[[commentary]]
quote='''
But what do we take about natural things? In his shadow she says I desired, and I sat down, and his fruit was sweet in my throat. For he who passes beyond earthly things, and to whom worldly things are dead, since the world is crucified to him and he to the world, despises and flees all the things that are under the sun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
And what are we to take of natural things? In his shadow, she says, I desired and sat down, and his fruit is sweet in my throat; for he who rises above earthly things, and to whom worldly things are dead (since the world is crucified to him, and he to the world), flees and despises all things that are under the sun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
The Lord Jesus received this fragrance of his fragrant Church, and said: Behold, my nearest one is good. And the Church says to Christ: Behold, you are good, my brother, behold, you are good, like an apple tree among the trees of the wood. A most beautiful comparison! For what could be said more beautiful and more fitting than that she should compare the bridegroom to an apple tree? For a fruit of this kind has so pleasing a fragrance that it surpasses the fragrance of the other fruits. And Christ, fastened to the wood like an apple hanging on the tree, poured out the good fragrance of the world's redemption, which wiped away the heavy stench of sin, and poured forth the ointment of a life-giving drink.

As an apple tree, she says, among the trees of the wood, so is my kinsman in the midst of the sons; because, above the prophets and apostles, he soothed the inmost hearts of men with the sweetness of his words. But not only fragrance, but also sweet food is in the apple: therefore Christ is sweet food.

In his shadow I desired, and sat down; for she had received the law, she followed it, she ran this way: so, resting in the law, she was resting in the shadow of Christ. A good shadow, which defends us from the sun of iniquity! But who doubts that the law of God is the shadow of Christ? What is the law of the feast day, of the new moon, of the sabbaths, if not a shadow of things to come? What is the day according to the law of Moses: That I may see six days, and again the seventh day, and so on through perpetual ages? What is the month according to the law of Moses, so that, knowing the month, I may know the first new moon of the month, and the things truly holy that are to be offered at the new moons? What is the year according to the law of Moses, consisting of those six days of which he says: Six years shall the Hebrew serve, and in the seventh year he shall be set free (Deut. 15:12); so that six years are found in which one works the land, but in the seventh year he leaves it to the proselytes, and the poor, and the beasts of the earth? What is the seventh year, in which all debts are remitted to the Hebrews?

In this shadow rested the faith of the Fathers, the holy devotion of the prophets. Say, then, O religious congregation, or holy soul: In his shadow I desired, and sat down. The jubilee year is a shadow: for who sees its mysteries, so as to know face to face the things which are prescribed by the Law to be fulfilled in the fiftieth year? The feast days according to the Law, from the first month, on the tenth day of the month, up to the fourteenth, and from there up to the twenty-first of the month, are a shadow. What shadow is that festival between the first and the seventh month, in that nameless time? The sanctified freedom on the sabbath is a shadow. A shadow is the feast day of the new moon of the seventh month, and the memorial of trumpets, and the tenth day of the seventh month, the day of propitiation. You see that the monad and the decad are two feast days. Likewise the fifteenth day, the day of Tabernacles for eight days: all these are in shadow. In shadow is the first day proclaimed, and the eighth day proclaimed is in shadow, which are prescribed for the scenopegia according to the Law.

Set before me some believers of the circumcision, learned in the Law, men of careful observance, and now enlightened by the knowledge of the Gospel, fattened with spiritual grace: in them the Church, which sees Christ, which receives the bridegroom, which is fed with his food, says: In his shadow I desired, and sat down, and his fruit is sweet in my throat. What is his sweet fruit, if not the preaching of the Lord's passion? as he himself says: Behold the inheritance of the Lord, sons, the reward, the fruit of the womb (Ps. 126 (127):3). For what fruit can be sweeter in our throat than the remission of sins?

And his fruit is sweet to my palate. It is spiritual manna, that is, the rain of spiritual wisdom, which is poured from heaven upon the gifted and upon those who seek, and bedews the minds of the pious, and sweetens their throats: whoever, then, has understood the infusion of divine wisdom delights in it, and seeks no other food, nor lives by bread alone, but by every word of God. He who is more curious asks what that is which is sweeter than honey: the minister of God answers him: This is the bread which the Lord has given you to eat. Hear what this bread is: The word, he says, which God has ordained. This ordinance of God, then, this nourishment, nourishes the soul of the wise, and enlightens and sweetens it, shining with the flash of truth, and soothing it as with a honeycomb, so with the sweetness of diverse virtues and with the speech of wisdom. Honeycombs indeed of honey are good words, as it is written in Proverbs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Wherever an earthly king wishes to rest his army, he chooses not an ignoble village, not one lacking supplies, not sandy places bare of growing things, but a city noble for its buildings, well stocked and rich in provisions, or a pleasant field, or one green with pastures, or wooded and level places suited for encampments. If, then, the kings of the earth know how to provide comforts for those who follow them, how much more does God, who is good, know how to arrange what will profit those who love him? And first, if an unknown road must be taken, guides of the roads are chosen to go before the column; but these commanders think this an affront to themselves: God, however, went before when the Hebrews made their journey, and indeed spoke to them in the pillar of cloud. And that you may know that he went before: God, it says, went before them: by day in the pillar of cloud, showing them the way; but by night in the pillar of fire, and the pillar of cloud did not fail by day (Exod. 13:21 and 22). The Church, following this pillar which goes before us, which does not fail, lest she herself should fail, was refreshed by its shadow; and therefore she says: In his shadow I desired, and sat down, and his fruit is sweet in my throat (above, v. 3); because she was fed by the Lord, and led into a place of pasture and to the water of refreshment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
