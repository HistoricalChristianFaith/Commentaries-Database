[[commentary]]
quote='''
There is he says hope for a tree; for if it is cut down, it will grow green again, and if its branch has died on the rock, at the scent of water it will flower, and it will make a harvest like a young plant. But a man who has died has gone away, and mortal man, when he falls, is no more. But in its season the sea surges. We have seen the sequence of the prophetic discourse drawn from two lower elements, earth and sea, which are subject to every injury and to frequent storms. How strong an argument of our tribulation has he expressed! Earthly shrubs, he says, and the woods of trees, even when they have died, rise again to living uses. The sea itself, too, is wont to surge by the changes of the seasons. But our flesh is ever seething and is a storm to itself, and never has respite from the motions of tempests and from pitiable shipwrecks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 7"
