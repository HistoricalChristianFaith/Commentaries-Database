[[commentary]]
quote='''
Nor let it move you that they seem to put forward a human form; even if a man is seen outwardly, within a beast growls. And therefore there is no doubt that they are wolves, according to the divine sentence of the Lord Jesus, who says: beware of false prophets, who come to you in sheep's clothing, but inwardly they are ravening wolves. By their fruits you shall know them. If, then, anyone is moved by appearance, let him question the fruit. You hear someone called a priest, you learn of his plunderings: he has the clothing of a sheep, the deeds of a robber; outwardly a sheep, inwardly he is a wolf, who knows no measure in plundering, who, as though hardened in limb by Scythian frost in the night, bloody of jaws, prowls around seeking whom he may devour. Does he not seem to you a wolf, who, insatiable in the rawness of human slaughter, desired to sate his madness with the death of faithful peoples?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
