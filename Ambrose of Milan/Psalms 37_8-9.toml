[[commentary]]
quote='''
Do not, then, listen to him, do not emulate so as to act wickedly, since those who act wickedly shall be exterminated. Those are exterminated who have no roots, like green herbs or grass. Let the weak man eat herbs; but you, plant a vine in your field, set out a vineyard, and if Ahab comes to say to you: Give me your vineyard, that I may plant herbs for myself, do not consent to him, lest by your consent he sow perishable things and cut down eternal ones. Therefore Naboth is held among the saints, because he thought that the inheritance of his forefathers was not to be yielded even to the king, and preferred to be stoned rather than give up his vineyard to be plundered. The inheritance of the forefathers is the true faith. There arose Arians, supported by royal power, who thought that the temple of the Lord ought to be handed over to them, threatening bitter punishments. But far be it that, with a mind serving the Lord, the fear of punishment should weigh more than the pattern of devotion. Unbelief did not prevail, because faith stood firm. There is also a certain vineyard in the hearts of the faithful, of which Isaiah says: A vineyard has been made for the beloved on a fruitful horn. This vineyard the Lord has planted in our hearts, and therefore we read God saying: I planted you a fruitful vine, wholly true. Let no one, then, take away this vineyard from the field of our soul, because that vineyard is blessed. And therefore it was said of the saints: By the fruit of corn, wine and oil they were multiplied. It is good, then, to have within you winepresses overflowing with wine, so that wine may flow for you into your vessel from the vineyard of Sorek, that cup, the one which inebriates, how excellent it is. For Sorek is the vineyard of a new beginning, of a new equity. Hence it is also said to us: Sing to your God a new song; his beginning, magnify his name from the end of the earth. Let this vineyard, then, yield grapes, not iniquity. Therefore the vineyard of the Jews was abandoned, because it wrought iniquity, as it is written, and not judgement. Let us, then, bear fruit in Christ, so that we may be found worthy to be everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
