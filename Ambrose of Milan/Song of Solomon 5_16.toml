[[commentary]]
quote='''
But the Good needs nothing, is sufficient to itself, and gives measure and perfection, and an end as well, to all things; in it all things hold together, and on it all things hang. This is the nature of the Good, which fills the mind.

About this the pure soul is busied; this she looks into within, and she beholds God and abounds in all good things. Hence she also says: His throat is sweetness, and he is wholly desire. For God is the author of all good things, and the things that are his are surely all things. Nowhere is there evil there, and if our mind remains in him, it knows no evil. So the soul that does not remain in God is herself the author of her evils, and therefore she sins; and the soul that sins shall herself die, for, loosed from the golden chains of the virtues, she is carried headlong down the steep and slides to lower things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"
