[[commentary]]
quote='''
But the Good needs nothing, is sufficient to itself, and gives measure and perfection, and an end as well, to all things; in it all things hold together, and on it all things hang. This is the nature of the Good, which fills the mind.

About this the pure soul is busied; this she looks into within, and she beholds God and abounds in all good things. Hence she also says: His throat is sweetness, and he is wholly desire. For God is the author of all good things, and the things that are his are surely all things. Nowhere is there evil there, and if our mind remains in him, it knows no evil. So the soul that does not remain in God is herself the author of her evils, and therefore she sins; and the soul that sins shall herself die, for, loosed from the golden chains of the virtues, she is carried headlong down the steep and slides to lower things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 7"

[[commentary]]
quote='''
His throat is most pleasant, and he is wholly desire. The judgments of the Lord are true, justified in themselves, more to be desired than gold and very precious stone (Ps. 18 (19):10 and 11). What is severe in others is sweet in Christ, is pleasant in Christ, because he himself is pleasant: Finally, taste and see that the Lord is pleasant (Ps. 33 (34):9). Sweet are the judgments to one who confesses, because he himself says: I am, I am he who blots out your iniquities, and I will not remember them: but do you remember, and let us be judged. Tell your iniquities, that you may be justified (Isa. 43:25 and 26). Sweet are the judgments to one who does penance, because he himself has said: There will be joy over one sinner doing penance more than over ninety-nine just who need no penance (Luke 15:7). If, then, the judgments of the Lord are sweet, let us labor to gather the fruits of their pleasantness. Do you wish to know how sweet are the judgments of the Lord? He who believes in him is not judged (John 3:18). Sweet, then, are the judgments to those who believe; but those who do not believe have not been condemned by the judgment of Christ, who came not to judge the world but to save and redeem it; rather they have undergone the judgment of their own impiety, since they would not believe in the remission of sins. For they cannot share in the benefit of him whom they refused to know. Those, then, who have not believed in him are seen to be unworthy of his judgment. For recognize what his judgment is, as he himself says: And this is the judgment, that the light has come into this world (ibid. 19). Sweet, then, because it is light; sweet the judgment, because mercy goes before it; for so it is written: Mercy and judgment I will sing to you, O Lord (Ps. 100 (101):1). Sweet too, and most pleasant, is the throat from which this mercy and this judgment go forth.

And he is wholly desirable. Beautiful in form beyond the sons of men (Ps. 44 (45):3). For he was man according to the flesh, but beyond man according to his divine working. Indeed, when he touched the leper, he seemed a man; but he was beyond man when he cleansed him. And when he wept for Lazarus dead, he wept as a man; but he was above man when he bids the dead man come out with his feet bound. He seemed a man when he hung on the cross; but he was above man when, opening the tombs, he raised the dead. Nor let the poison of Apollinaris flatter itself because it is read thus: And found in appearance as a man (Phil. 2:7); for the man Jesus is not denied, since elsewhere Paul himself says of him: The mediator of God and men, the man Christ Jesus (1 Tim. 2:5); rather it is confirmed. For it is the use and custom of Scripture to signify in this way, as we also read in the Gospel: And we saw his glory, glory as of the only-begotten from the Father (John 1). As, then, he is said to be as the only-begotten, and it is not denied that he is the only-begotten Son of God, so too he is said to be as a man, and it is not denied that the perfection of man was in him.

Though he was, then, in the form of a servant, humbled even to death, he was nonetheless in the glory of God. What harm, then, did servitude do him? He is read to have been made a servant because he is read to have been made of the Virgin and created in the flesh; for every creature serves, as the prophet says: For all things serve you. This is the glory of Christ: that he took on servitude in his body, so as to restore freedom to all; he bore our sins, so as to take away the sin of the world; he was made a servant, sin, a curse, so that you might cease to be the servant of sin, so that he might free you from the curse of the divine sentence. He, then, took on your curse: Cursed indeed is everyone who hangs on a tree; he was made a curse on the cross, so that you might be blessed in the kingdom of God; he was dishonored and made cheap, and esteemed as nothing; he said, I have labored in vain; through him Paul merited to say, I have not labored in vain (Phil. 2:16); so that he might confer on his little servants the fruit of good work and the glory of the preaching of the Gospel, through which all might be freed from the burden of labor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
