[[commentary]]
quote='''
Good, then, is reason, which often both strips off a hostile disposition and sets aside the pain of an injury. Indeed, even in battle it often softens the victor, holds back the sword of one about to strike, and snatches from death the one who begs, because just reason persuades him to spare the subdued. For as to shutting out or softening the pain of an injury, who is a better master than the patriarch Jacob, who, rebuking his own sons Simeon and Levi, said: You have made me hateful, so that I seem cruel. And indeed they had avenged the injury of their sister, who, against the customs of their fathers, had been defiled by the violation of her chastity. Yet Jacob, the teacher of discipline, the guardian of chastity, could not approve the outrage that had been committed, but preferred that the insolent be restrained by reason, knowing that reason could temper indignation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 2"
