[[commentary]]
quote='''
So Abraham was both one of a gentile people and had gone in to the handmaid for the sake of posterity, because his wife, desiring to overshadow her barrenness, had been the author of that deed to her husband. And yet it is not without purpose that immediately after this God, because he approved his other merits or his repentance for this deed, said to him: I am your God. Earn your merit in my sight and be without complaint, as though he had not yet fully earned it, he who despaired of his barren wife's bearing and sought posterity from the handmaid. Be he says without complaint, that is, blameless, so that your wife may not complain of you nor anyone blame your deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"

[[commentary]]
quote='''
Moreover it is said to Abraham: be without reproach, to him to whom was given the holy spirit of wisdom, well-moving, spotless. The soul of the wise man, then, ought day and night to keep its watch set forth in unbroken exercise, never indulging in sleep, intent on God in perpetual vigils, for the comprehension of the things that are and the knowledge of their several causes. But wisdom is also the interpreter of things to come; she knows things past and judges of things to come, she knows the subtleties of words and the solutions of arguments, she knows signs and wonders before they come to pass, and the outcomes of times and of ages. He, then, who has acquired her cannot but be good and perfect, because he both has every virtue and is an image of goodness. Hence the sophists of this world also drew from it a definition of the wise man of this kind, that the wise man is a good man, skilled in speaking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapter 10"
