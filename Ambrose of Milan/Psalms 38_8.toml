[[commentary]]
quote='''
Wearied, then, by these mockeries of the soul, holy David had bent himself down and humbled himself exceedingly, not so as to give place to the iniquities that set themselves above his head, as we have said, or to yield to the enemy; he teaches later on that one must not yield to him, saying: How much evil the enemy has wrought in your saints! And those who hated you boasted in the midst of your feast. They set up their signs as signs, and I did not know, as on the way above the summit. As in a wood of trees they have cut down its doors with axes. When my enemies, he says, were setting the signs of their iniquity above the summit — what is the summit but your head, where the senses are, where Christ is wisdom? — I did not know, that is, I did not acquiesce, I did not consent to them and join the verdict of my thought to theirs. Whence elsewhere too: I did not know an evil word, and the wicked who turned aside from me I did not know. Indeed, though Christ knows all things, he did not know sin; for he knows the things that are his, that is, the things that belong to the virtues, not those that belong to outrages. And therefore Scripture says to you: The Lord knew those who are his, but to the wicked he says: Depart from me, because I do not know you, and through Jeremiah he spoke, saying: As a lamb I was led to be sacrificed, and I did not know. How did he not know what he had foretold would come? But I did not know, he says, their thoughts, their malice; I do not wish to know the things that belong to blood; indeed I will not gather their assemblies from bloods. I blot out their iniquities and do not remember them; I do not wish to know the things I came to remit. I did not know the wood that is to burn, nor the things set in a heap of wood, whether straw or hay, so that the flame may consume them the more quickly as its fuel. I wish to know those things which remain, so that they may receive the fruit of their reward. I wish to know those things which have been built upon the foundation, so that they may be improved, not those on the way, where passers-by plunder them. I wish to know those things which belong to the vine, those sure trees which bear fruit, not those which, gathered into a bundle, are made ready for burning; that is: I am not the arbiter and partner of things that are perishable. Not, then, fellowship in some thing, but criminal fellowship is at fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
[[commentary]]
quote='''
And for what reason did he not know those who boast in unfruitful and fragile things? Because with evil works and the axes of their iniquity they overturn the entrances of the faithful soul, and with cruel deeds they split the vestibules of the devout mind, so that Christ cannot enter through them. But each one ought to guard his gates and doors, so that, when Christ has come and knocked, the ministering powers which go before and run ahead may say: Lift up your gates, you princes, and be lifted up, you eternal gates. Truly princes are those who have ruled themselves well, so that Christ may have entrance into their souls. Like this too is that saying of Solomon: If the spirit of him who has power rises up against you, do not leave your place, because care will soften great offences. For diligence and faith hold the higher place, unbelief the lower. Therefore let good diligence rise up to you, which shuts out the snares of the enemy and takes away sin, so that the malice of him who has power cannot harm. In the Songs Ecclesiastes saw this malice under the sun, that is, in this world; whence Scripture also called this place the one under the sun. He saw it, then, under the sun, not above the sun, where the peace of the angels is, or the holiness of the heavenly powers. Or perhaps he meant under the sun of iniquity; for the devil presides over malice, Christ over the virtues. And so, to overcome the spirit of him who had power, which he received for a time, David bent himself down in prayer, bending his neck like a circle, and humbled himself in his entreaties; for the prayer of one who humbles himself pierces the clouds and passes beyond the heights of the elements, so as to draw near to Christ.

And he roared with the groaning of his heart. He roars who utters only a groan, not words. This, then, is that glorious prayer, when the Spirit intercedes for us with unutterable groanings, as the vessel of election asserted. This is the groaning which God does not despise, he who does not despise the young servant bereft of his father, nor the widow, if she pours out her speech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

