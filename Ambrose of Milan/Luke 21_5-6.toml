[[commentary]]
quote='''
It was spoken then of the temple made with hands, that it should be overthrown. For there is nothing made with hands which age does not impair, or violence throw down, or fire burn. Yet there is also another temple, that is, the synagogue, whose ancient building falls to pieces as the Church rises. There is also a temple in every one, which falls when faith is lacking, and above all when any one falsely shields himself under the name of Christ, that so he may rebel against his inward inclinations.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There shall not be left a stone upon a stone that shall not be destroyed. The passage about the widow came next; since we have already praised her in the book we wrote on widows, we now set it aside. Now this was said truly, according to the matter in hand, of the temple which Solomon built, and that it was first to be overthrown by the enemy at the time of judgment; for there is nothing made by work and hand which either age does not consume, or force overthrow, or fire burn up. Yet there is also another temple, built of fair stones and adorned with gifts, whose overthrow the Lord seems to signify, namely the synagogue of the Jews, whose old structure is dissolved as the Church rises. There is also a temple in each one, which falls when faith fails, and above all if anyone falsely holds out the name of Christ as a screen, so as to storm the inner affection.

There can also be this exposition, which may profit me more. For what does it profit me to know the day of judgment? What does it profit me, conscious of so many sins, if the Lord comes, unless he comes into my mind, returns into my thoughts, unless Christ lives in me, unless Christ speaks in me? So Christ must come to me, his advent must take place for me. Now the second advent of the Lord takes place at the failing of the world, when we can say: To me, however, the world is crucified, and I to the world.

But if such a failing of the world finds this man in the upper parts of the house, so that his way of life is in heaven, then the bodily and visible temple will be destroyed, the bodily law, the bodily Pasch and the visible Pasch, the bodily unleavened bread and the visible unleavened bread — I dare to say, a temporal Christ, such as he was to Paul before he believed — because in him for whom the world fails Christ is eternal. For him there is a spiritual temple, a spiritual law, a spiritual Pasch too, since Christ is slain once; he feasts on unleavened bread not of earthly grain, but of the grain of righteousness. So for him there comes the presence of wisdom, the presence of virtue and of righteousness, the presence of redemption; for Christ, indeed, once died for the sins of the people, but he was to redeem the sins of the people daily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
