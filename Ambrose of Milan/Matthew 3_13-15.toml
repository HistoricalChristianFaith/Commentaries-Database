[[commentary]]
quote='''
He came to John's baptism, but John's baptism held repentance of sins. And therefore John forbids him, saying: 'I ought to be baptized by you, and do you come to me? Why do you come to me, you who have no sin? For he must be baptized who has sin; but why should he who has done no sin seek the washing of repentance?' Let it be he says now — that is: while the Church is being built — it becomes us to fulfil all righteousness. What is righteousness but mercy? He has scattered indeed, he has given to the poor: his righteousness remains for ever. He gave to me, poor as I was, he gave to me, needy as I was, the grace which I did not have before; so his righteousness remains for ever. What is righteousness but that you yourself should be the first to begin what you wish another to do, and should exhort others by your example? What is righteousness but that, because he took up flesh, he should not as God exclude the feeling or the service of the flesh, but as man should conquer the flesh, that he might teach me to conquer? For he taught by what means I can bury, as to its crimes, the filth of the guilty flesh compacted of earthly vices, and renew it in virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
