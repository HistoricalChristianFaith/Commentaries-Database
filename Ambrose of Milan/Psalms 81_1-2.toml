[[commentary]]
quote='''
And good is the wedding, when the soul is wedded to the Word, the flesh to the Spirit. At this wedding the prophet David wished us to make merry; to it he invited us, because he was joining his own descendants in union; and therefore, more joyful than the rest, as though set in the very act of the wedding, he exhorts us to the celebration of the festal gift, saying: rejoice to God our helper, shout for joy to the God of Jacob. Take up a psalm and bring the timbrel, the pleasant psaltery with the harp. Do you not notice a certain act of the prophet dancing? Then elsewhere: I will sing psalms to you, O God, on the harp, Holy One of Israel. My lips shall rejoice when I sing to you, and my soul, which you have redeemed. Do you hear the voices of harpers, do you hear the clatter of dancers? Believe it is a wedding.

Take up the harp, you too, so that the strings of your inward veins, struck by the plectrum of the Spirit, may give back the sound of good work. Take up the psaltery, so that the harmony of your words and deeds may sound in concord. Take up the timbrel, so that the inner spirit may set to measure the instrument of your body, and the sweet pleasantness of your conduct may be expressed by your working deeds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
