[[commentary]]
quote='''
That the dwellings of souls are on high is strongly proved by the testimonies of Scripture, since in the books of Esdras too we read that, when the day of judgement comes, the earth will give back the bodies of the dead, and the dust will give back those that rest in the tombs, the remains of the dead. And the dwellings he says will give back the souls that were entrusted to them, and the Most High will be revealed upon the seat of judgement. These are the habitations of which the Lord says that there are many dwelling places with his Father, which, as he went to the Father, he would prepare for his disciples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 10"
