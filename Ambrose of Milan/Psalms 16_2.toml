[[commentary]]
quote='''
Who has ever given him anything, since "from him, and through him and in him" are all things? The fount of life is that highest Good that bestows the substance of life on all, because it has life abiding in itself. It receives from no one as though it were needy; it lavishes goods on all and borrows from others nothing for itself, for it has no need of us. It says, too, in the person of humankind: "You do not need my goods." What is more lovely than to approach him and cling to him? What pleasure can be greater? What else can he desire who sees and tastes freely of this fount of living water? what realms? what powers? what riches? when he sees how pitiable are the conditions of kings, how changeable the status of their power, how short the span of this life, in how great bondage even sovereigns must live, since they live at the will of others and not their own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetters%252021-30.html'
source_title="Letter 29: To Irenaeus"

[[commentary]]
quote='''
We have heard what intemperance, drunk with bodily desires, has said; let us consider what true virtue does. It seeks nothing but the grace of God; it follows that one and supreme good alone, it is content with that alone, from which we receive all things, while we ourselves confer nothing on it, because it needs nothing, as David says: I said to my Lord: You are my Lord, for you have no need of my goods. For what does he need who abounds in all things and bestows everything on us, and supplies all things without failing?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 4"

[[commentary]]
quote='''
The beauty of the soul is pure virtue, and her comeliness is the truer knowledge of higher things, so that she may see that Good on which all things depend, while it depends on nothing. By it, then, she lives and receives understanding. For that supreme Good is the fountain of life; love and desire for it are kindled in us; to draw near to it and be mingled with it is pleasure; to one who does not see it, it is an object of desire, and in one who sees it, it is present; and therefore he despises all other things and is soothed and delighted by this. This is what supplies substance to all things, while itself, abiding in itself, it gives to others, but receives nothing into itself from others. Of it the prophet says: I said to my Lord: You are my God, since you have no need of my goods. This alone he desired to see, as he himself says elsewhere: One thing I have asked of the Lord, this will I seek: that I may dwell in the house of the Lord all the days of my life, and see the delight of the Lord, and consider his temple. If, then, anyone has been found worthy to see that pure and incorporeal supreme Good, what else would he have to desire?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 8"
