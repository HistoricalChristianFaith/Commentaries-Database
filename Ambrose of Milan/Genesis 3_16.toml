[[commentary]]
quote='''
Because Eve has admitted her crime, she is given a milder and more salutary sentence, which condemned her wrong-doing and did not refuse pardon. She was to serve under her husband's power, first, that she might not be inclined to do wrong, and, secondly, that, being in a position subject to a stronger vessel, she might not dishonor her husband, but on the contrary, might be governed by his counsel. I see clearly here the mystery of Christ and His Church. The Church's turning toward Christ in times to come and a religious servitude submissive to the Word of God—these are conditions far better than the liberty of this world. Hence it is written: Thou shalt fear the Lord thy God and shall serve him only. Servitude, therefore, of this sort is a gift of God. Wherefore, compliance with this servitude is to be reckoned among blessings. We have the example of Isaac granting it as a blessing to his son Esau that he should serve his brothers. Hence he asked for his father's blessing. Although he knew that one blessing had been taken from him, he asked for another: Have you only one blessing, father? By this servitude, therefore, Esau, who had before he sold birthright to satisfy his appetite and who in his zeal for hunting in the field had not the benefits derived from a blessing, had now come to believe that he would fare better in the future if he would pay reverence to his brother as a type of Christ. By this kind of servitude Christian folk grow strong, as we have it expressed in the words of the Lord to His disciples: Whoever wishes to be first among you, let him be the slave of all of you. Hence charity, which is greater than hope and faith, brings this servitude to pass, for it is written: By charity serve one another. This, then, is the mystery mentioned by the Apostle in reference to Christ and the Church. The servitude existed formerly, in fact, but in a condition of disobedience which was to be later made salutary by the generation of children in faith and love and holiness with modesty. What was certainly among the fathers a generation brought into existence in sin shall become salutary in the children, so that what was a stumbling block to the Jews shall in the society of Christians undergo improvement.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 14"
