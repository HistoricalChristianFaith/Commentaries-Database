[[commentary]]
quote='''
And therefore the Church, in order to see this flower, hastened with all eagerness, as she herself testifies, saying: In my bed by night I sought him whom my soul has loved. I sought him and did not find him; I called him, and he did not hear me. I will rise, then, and go into the house, into the market-place and into the streets, and I will seek him whom my soul has loved. I sought him and did not find him. The watchmen who go about the city found me; they struck me and took my cloak from me. You see how she seeks him whom she desires to find, so that she does not fear to be wounded. But these wounds are not to be feared but to be desired, because they are wounds of love, as she herself said: I am wounded with love. Good are the wounds of love. Accordingly, more useful are the wounds of a friend than the voluntary kisses of an enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"
