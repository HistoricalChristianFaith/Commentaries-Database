[[commentary]]
quote='''
Into paradise one ascends, into hell one descends. Let them descend, he says, alive into hell; and therefore Lazarus the poor man was carried up by angels into Abraham's bosom. The luxurious rich man, lifting up his eyes in hell, asks Abraham to send the poor man to touch his tongue with his finger, so that, set in the greatest burning, he might obtain some rest. See that poor man abounding in all good things, whom the blessed rest of the holy patriarch surrounded; see this one empty, who seemed to himself to abound in all things in this world, whose soul was blessed in his lifetime, but who now, helpless, is tormented by death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
