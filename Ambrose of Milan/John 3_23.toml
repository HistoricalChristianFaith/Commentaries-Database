[[commentary]]
quote='''
You have heard read today that John was baptizing in Aenon near Salim. Aenon is called "eye of punishments", Salim "he himself ascending"; this is what the interpretation holds. He, then, who chooses to be baptized foresees the punishments, and so takes refuge in the sacrament of baptism, to lay down every sin, lest he begin to be liable to punishments. And perhaps he who is baptized with the baptism of penitence foresees punishments; but he who is baptized in Christ looks to grace. The baptism of John, then, is the eye of punishments, the baptism of Christ the eye of graces. Yet, although John baptized in Aenon, he baptized near the one ascending; for this interpretation holds this too, that Salim is called "he himself ascending". He, then, who announced his coming was nearest to Christ. For the Son of Man, who descended from heaven, is himself also the one who ascended into heaven, that he might fill all things. But because as is the heavenly, such also are the heavenly, he too ascends into heaven who, laying aside earthly things, is buried together in Christ, so that with Christ he may rise from the death of sin to newness of life and to a share in the inheritance, so as to become, as it is written, an heir of God, a co-heir of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Hence too "the eye of punishments" is not foreign to the Church; because, though John baptized in Aenon, he baptized near Salim, where there was an abundance of waters, and twelve fountains, and seventy palm trees. The Church has these fountains: that is, in the Old Testament the twelve patriarchs, in the New the twelve apostles; and therefore it is said: In the churches bless the Lord God from the fountains of Israel (Ps. 67 (68):27). Whoever attains the most holy mysteries is first bathed in these fountains; for these fountains, flowing from the eternal fountain, have streamed over the whole world. Where these fountains are, there is the ascent of souls. Indeed, they have interpreted Salim as "he himself ascending"; for he truly ascends who lays aside his own sins. By this word, then, the practice of purifying sanctification is expressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
