[[commentary]]
quote='''
The just man indeed notices his own frailty more than the unjust man; and the wise man recognizes, while the foolish man does not recognize. Finally, the wise man is remorseful for his own failings, while the foolish man takes pleasure in them: the just man accuses himself, the unjust man defends himself. The just man wants to preempt the accuser by confessing his sin, while the unjust man desires to conceal his sin: the former at the beginning of his speech reveals his error, the latter wraps the sound of accusation in the verbosity of his speech, so as not to reveal his error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David"

[[commentary]]
quote='''
Let us who are free from sin, purchased, as it were, by the price of Christ's blood, let us not be subject to the slavery of people or of passion. Let us not be ashamed to confess our sin. See how free is the one who could say, "I have not been afraid of a very great multitude, so that I would not confess my sin in the sight of all." One who confesses to the Lord is freed from his slavery: "The just is the accuser of himself in the beginning of his speech." He is not only free but just, for justice is in liberty, and liberty in confession, and as soon as one has confessed he is pardoned.
'''
source_url=''
source_title="LETTER 54"


[[commentary]]
quote='''
Are not those who condemn their sin truer Christians than those who think to defend it? "The just accuses himself in the beginning of his words." He who accuses himself when he sins is just, not he who praises himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252051.html'
source_title="LETTER 51"

[[commentary]]
quote='''
But the righteous man knows how to loosen the chains of his sins; he does not wait for an accuser but forestalls him, so that by confessing he lightens all his sin, lest the adversary have anything to charge him with. And therefore Scripture says to you: The righteous man is his own accuser at the beginning of his speech; for he snatches the voice from the adversary, and by the confession of his sins binds fast, as it were, certain teeth made ready for the prey of hostile accusation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
As, then, conversion comes from sin, so the remedy comes from poison. Hear this remedy: The righteous man at the beginning of his speech is his own accuser. Sin is poison, iniquity is poison; the confession of one's own crime is the remedy for the fall. And therefore it is truly a remedy from poison, if you tell your iniquities, that you may be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For as fevers, when they are deep within, cannot be soothed, but when they break out, bring hope of ceasing, so the disease of sins burns more fiercely while it is covered, and if it is betrayed by confessions, it evaporates. And therefore the righteous man is his own accuser at the beginning of his speech, before the contagion of the sore creeps inward; for the memory of offences weighs down the conscience, unless medicine is sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
