[[commentary]]
quote='''
Let us who are free from sin, purchased, as it were, by the price of Christ's blood, let us not be subject to the slavery of people or of passion. Let us not be ashamed to confess our sin. See how free is the one who could say, "I have not been afraid of a very great multitude, so that I would not confess my sin in the sight of all." One who confesses to the Lord is freed from his slavery: "The just is the accuser of himself in the beginning of his speech." He is not only free but just, for justice is in liberty, and liberty in confession, and as soon as one has confessed he is pardoned.
'''
source_url=''
source_title="LETTER 54"


[[commentary]]
quote='''
Are not those who condemn their sin truer Christians than those who think to defend it? "The just accuses himself in the beginning of his words." He who accuses himself when he sins is just, not he who praises himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252051.html'
source_title="LETTER 51"

[[commentary]]
quote='''
But the righteous man knows how to loosen the chains of his sins; he does not wait for an accuser but forestalls him, so that by confessing he lightens all his sin, lest the adversary have anything to charge him with. And therefore Scripture says to you: The righteous man is his own accuser at the beginning of his speech; for he snatches the voice from the adversary, and by the confession of his sins binds fast, as it were, certain teeth made ready for the prey of hostile accusation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
As, then, conversion comes from sin, so the remedy comes from poison. Hear this remedy: The righteous man at the beginning of his speech is his own accuser. Sin is poison, iniquity is poison; the confession of one's own crime is the remedy for the fall. And therefore it is truly a remedy from poison, if you tell your iniquities, that you may be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
For as fevers, when they are deep within, cannot be soothed, but when they break out, bring hope of ceasing, so the disease of sins burns more fiercely while it is covered, and if it is betrayed by confessions, it evaporates. And therefore the righteous man is his own accuser at the beginning of his speech, before the contagion of the sore creeps inward; for the memory of offences weighs down the conscience, unless medicine is sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
In fact, the wise man is pierced by his own falls, the fool delights in them: the just man is the accuser of himself, the unjust man his defender; the just man wishes to forestall his accuser by confession of sin, the unjust man desires to hide his sin. The former comes forward at the very beginning of his speech to disclose his error; the latter, by the wordiness of his speech, wraps the accusation in sleep, so as not to disclose his error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 6"

[[commentary]]
quote='''
So he who is displeasing to himself finds everything adverse; he himself is his own accuser, he himself his own witness, and he who presses and goads himself finds nowhere to flee. But it belongs to a good mind to feel the wound of sin. For those who are without pain do not feel the bitterness of the wound, which belongs to an incurable sickness; but those who are pricked by some pain, just as they do not lack the sense of pain, so they do not lack progress toward health either. For where there is the sense of pain, there is also the sense of life; for to feel belongs to vital vigour and function. Hence he who does not acknowledge his error is mad, raves, is senseless; but he who acknowledges it surely comes to his senses, does not spurn the remedies of health, restrains himself, repents of his fault, always thinks about it and by thinking condemns himself; and the just man moreover is his own accuser at the beginning of his speech. He who accuses himself is just; he who is just is sober, is sound. The just man does not know how to flatter himself; he does not know how to bend the rigour of judgment even in his own case; he shudders at the remembrance of his own fall and blushes at the error he has committed; he dreads, fears, shrinks from every memory of it, judges it grievous to himself, shuns himself as arbiter and does not dare to entrust himself to himself, because he thinks no one more severe toward him than the one from whom he cannot hide, whom he cannot deceive, whom he can find no way to flee and avoid, unless he deny himself and take up the Lord's cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 9"
