[[commentary]]
quote='''
My days have passed in horror; the joints of my heart are torn apart. And yet nowhere does he disparage the judgment of God; for he knows that deep is the height of the wisdom and knowledge of God, and that his judgments are unsearchable and his ways past finding out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
