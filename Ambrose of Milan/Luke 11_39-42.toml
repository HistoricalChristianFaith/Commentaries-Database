[[commentary]]
quote='''
So the whole of this most beautiful passage from here on is directed to this end: since he invites us to the pursuit of simplicity, he condemns the superfluous and earthly things of the Jews, who, by understanding the things of the Law according to the body, are not undeservedly compared to a glass and a dish because of their own fragility, and who observe the things of which we have no use, but neglect those in which lies the fruit of our hope, and therefore commit a great sin while they despise the better things; and yet the blotting out of that very sin is promised, if mercy follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
