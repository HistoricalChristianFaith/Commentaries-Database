[[commentary]]
quote='''
About mystical things too she says: bring me into the house of wine, set love in order in me. For as a vine embraces its vineyard, so the Lord Jesus, as an eternal vine, embraces his people with certain arms of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
