[[commentary]]
quote='''
About mystical things too she says: bring me into the house of wine, set love in order in me. For as a vine embraces its vineyard, so the Lord Jesus, as an eternal vine, embraces his people with certain arms of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
Of mystical things too she says: Bring me into the house of wine, set love in order in me. For as the vine embraces its vineyard, so the Lord Jesus, as an eternal vine, embraces his people with certain arms of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Bring me into the house of wine. From the provisions prepared, she seeks to go forward to another dwelling, in which she may receive the grace of the mysteries and the sweetness of gladness. From here too, advancing on the true road, she says: Set love in order in me. A good camp, where there is the fullness of love. Love cannot be without faith; for the Church has as it were three sureties, hope, faith, love: when hope has gone before and faith has been founded, love is set in order, and the Church is joined in union.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
