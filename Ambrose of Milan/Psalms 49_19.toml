[[commentary]]
quote='''
He shall go in even to the progeny of his fathers; even for ever he shall not see light. Man, when he was in honour, did not understand; he has been compared to the beasts which have no sense, and has become like them. Therefore, he says, this man shall go in to the progeny of his fathers. Who is the father of the ungodly, the Lord has declared, saying: You are of your father the devil. There are also those fathers of whom it is said: Leave the dead to bury their dead. Therefore, too, the Moabites were forbidden to enter into the church of the Lord unto the third and fourth generation, so that their sons, because of the sins of their fathers, might enter into the generation of those whose deeds and morals they imitated. Hence it is also written: The children of adulterers shall be imperfect. He, then, who follows not that Father who is in heaven, but the one who lives in earthly filth, enters into the progeny of the earthly father. Such, indeed, as is the earthly man, such also are the earthly, so that his life is earthly, there is no rest for him after death, and he does not see light for ever, since he has sought what is temporal. But he who has followed the glory of Christ, who has desired that light which enlightens every man coming into this world, shall find and see the eternal light, since Christ has redeemed him from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
