[[commentary]]
quote='''
But perhaps you may say: "The persecutors too fell backward; for so it is written, that the chief priests, whom Judas the traitor had brought, and the others who had come to seize the Lord Jesus, went backward and fell to the ground". This is what I too say, that he wished to fall upon sinners, not upon the righteous; for the righteous man has no need of a physician, but sinners have. If the shadow of the apostles healed, how much more does the flesh of Christ defend from death those whom it touches! Indeed, he touched a leper and cleansed him without delay. But that you who read may know that he wished to free even his persecutors, question the witness of Christ. For when Peter was inveighing against the Jews because they had killed the prince of life, he showed them the remedy, that they should repent and deserve to have the sin which they had committed remitted to them. Why, then, do you doubt that he fell for this reason, that he might raise up, since he himself said: I will strike and I will heal? Yet see the difference in the words. In Genesis it has: the rider shall fall backward, awaiting salvation from the Lord, that is, so that he may not turn his eyes away from God, may not bend back his own mind, may claim the prerogative of his own resurrection and raise himself up by divine power. But here it has: they went backward and fell to the ground. He who is earthly falls to the earth; he who is heavenly cleaves to heaven. Even if he falls in body, he does not fall in power, but always aims at the things that are above; for he always looks to the Father, so as to fulfil his will concerning us. Would that these too had not gone backward, but had received Christ, as Joseph received him and buried him in a new tomb! He who is faithful does not fall to the earth; he who is unbelieving falls and goes down into the lower parts of the earth, as it is written: let them go down alive into hell. Therefore the persecutor falls upon the earth and into hell; Christ falls upon those who are to rise again, Christ upon the rock, Christ upon the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
