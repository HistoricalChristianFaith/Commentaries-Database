[[commentary]]
quote='''
The serpent itself can benefit you, if you understand, or rather if you do not spurn the physician's precepts. Learn that the one you think should be fled is to be imitated: Be, he says, shrewd as serpents and simple as doves. Guard your head like the serpent; even if you are torn in your whole body, you will revive. Your head is Christ, because he is the head of man; if you keep the faith, even if you die like the serpent, you too will rise again. Imitate the serpent, which puts off its outer self so that the inner may be renewed; imitate the serpent, which vomits out its poison. Blessed are you if you too vomit out your evil thoughts and lay down the poisons of your malice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
