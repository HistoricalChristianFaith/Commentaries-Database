[[commentary]]
quote='''
The serpent itself can benefit you, if you understand, or rather if you do not spurn the physician's precepts. Learn that the one you think should be fled is to be imitated: Be, he says, shrewd as serpents and simple as doves. Guard your head like the serpent; even if you are torn in your whole body, you will revive. Your head is Christ, because he is the head of man; if you keep the faith, even if you die like the serpent, you too will rise again. Imitate the serpent, which puts off its outer self so that the inner may be renewed; imitate the serpent, which vomits out its poison. Blessed are you if you too vomit out your evil thoughts and lay down the poisons of your malice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The deceived, then, are put to exercise, so that they may both pay the price of their credulity and take up the pursuit of virtue and the diligence of caution. Hence he says: Be shrewd as serpents. Why as serpents? So that he too may be stripped of what is his own, and he who wished to strip others may lose what belongs to him, not his poisons but the merits of his nature. Indeed, he is cast down when you have ascended. For it is written: I saw Satan falling like lightning from heaven. Not lightning, he says, but like lightning, because he lost his own light, which he had before he wished to take your light away from you. But perhaps you will cite what we read of the Saviour, that as the lightning flashing from under heaven, so will be the coming of the Son of Man. Rightly is it here too 'like lightning', because he is above the lightning. For the lightning is from under heaven, but the true light is above heaven. So Satan is like lightning, because he lost what he had; but you have received back what you had lost.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
