[[commentary]]
quote='''
We have heard what intemperance, drunk with bodily desires, has said; let us consider what true virtue does. It seeks nothing but the grace of God; it follows that one and supreme good alone, it is content with that alone, from which we receive all things, while we ourselves confer nothing on it, because it needs nothing, as David says: I said to my Lord: You are my Lord, for you have no need of my goods. For what does he need who abounds in all things and bestows everything on us, and supplies all things without failing?

And Jacob set out and slept, which is a sign of a quiet soul, and he saw the angels of God ascending and descending. That is, he foresaw Christ on earth, to whom the throng of angels descends and ascends, to render homage to its own Lord with devout service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 4"
