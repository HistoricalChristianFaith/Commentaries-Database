[[commentary]]
quote='''
He will receive in the last times the people of the Jews, now of aged years and weary, not according to its merits but according to the election of his grace, and he will lay his hand upon its eyes to take away its blindness. He has put off its healing for this reason: that the people which before did not think it should believe might believe last, and might lose the prerogative of its earlier election. Hence also the Apostle says: That blindness in part has befallen Israel, until the fullness of the Gentiles should come in, and so all Israel should be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 14"
