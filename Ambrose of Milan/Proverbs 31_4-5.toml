[[commentary]]
quote='''
And so men in power are forbidden to drink wine, lest when they drink they forget wisdom.

Therefore the men in power were drinking wine unto drunkenness who desired eagerly to yield themselves up to Holofernes, the leader of the army of the king of the Assyrians; but the woman Judith did not drink, fasting all the days of her widowhood except during the solemnities of feast days. Fortified by these arms she went forth and circumvented the entire army of the Assyrians. Through the vigor of her sober counsel she carried off the head of Holofernes, preserved her chastity, regained victory. For she, girt with fasting, watched in the camp of the enemy; he lay buried in wine so that he could not feel the force of the wound. And thus the fasting of one woman overthrew the innumerable armies of drunkards.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 9"
