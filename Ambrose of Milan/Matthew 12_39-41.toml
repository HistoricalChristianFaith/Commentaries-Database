[[commentary]]
quote='''
Hence the Lord answered it: An evil and adulterous generation seeks a sign, and no sign shall be given it but that of Jonah the prophet. And so, to convict the unbelief of the Jews, the example of Jonah is summoned, because the Ninevites believed the sign and thought the preaching of Jonah, who had been in the belly of the whale, must be followed, whereas the Jews did not believe even after the resurrection of the Lord Jesus, who after three days rose from the heart of the earth and lives and reigns through all ages. Amen.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
