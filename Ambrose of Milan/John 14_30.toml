[[commentary]]
quote='''
See that you do not carry the image of the earthly to where the light of heavenly things is. Here, if anyone keeps the images of a tyrant who has already been conquered and perished, he is rightly condemned. How do you bring the image of the enemy and adversary into the city of the true emperor, unless so that he may condemn you? And if you wish to bring in the image of the earthly, the prince of this world will oppose you; he will say: "This image is mine, and the things you offer are mine". What will you do when you are caught, when he says to you: "Mine is avarice, mine is ambition, mine are the riches whose image I recognize in you"? For he is both adversary and defender. But if you are such as Jacob was, you will say to Laban, to him who transforms himself into an angel of light: Search whether you find anything of yours with me. Then he will search and, finding nothing, will go away confounded, because you have hidden and blotted out all the likenesses of the vices. Blessed is he who can say: The prince of this world will come and will find nothing of his in me. For he seeks the things that are his, not those that are Christ's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
