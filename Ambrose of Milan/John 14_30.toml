[[commentary]]
quote='''
See that you do not carry the image of the earthly to where the light of heavenly things is. Here, if anyone keeps the images of a tyrant who has already been conquered and perished, he is rightly condemned. How do you bring the image of the enemy and adversary into the city of the true emperor, unless so that he may condemn you? And if you wish to bring in the image of the earthly, the prince of this world will oppose you; he will say: "This image is mine, and the things you offer are mine". What will you do when you are caught, when he says to you: "Mine is avarice, mine is ambition, mine are the riches whose image I recognize in you"? For he is both adversary and defender. But if you are such as Jacob was, you will say to Laban, to him who transforms himself into an angel of light: Search whether you find anything of yours with me. Then he will search and, finding nothing, will go away confounded, because you have hidden and blotted out all the likenesses of the vices. Blessed is he who can say: The prince of this world will come and will find nothing of his in me. For he seeks the things that are his, not those that are Christ's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
But these things belong to the moral sense; this is the mystical: that Laban, that is, "whitened", came to him, because Satan too transforms himself into an angel of light, and began to seek his own things from him. Jacob answered him: Recognize whether anything is yours with me, that is: I have nothing of yours. Search, if you recognize anything of your vices and crimes. I have taken nothing of your frauds away with me, and I have no partnership at all in deceit; I have fled from everything of yours as from a contagion. And Laban searched and found nothing of his. How blessed the man in whom the enemy found nothing that he could call his own, in whom the devil came upon nothing that he would recognize as his! That seemed impossible in a man, but he bore the type of him who said in the Gospel: The prince of this world will come and will find nothing in me. For whatever is the devil's is nothing, since it can have no permanence and no substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 5"

[[commentary]]
quote='''
The Lord himself also says in the Gospel: for the prince of this world comes, and finds nothing in me. How could he find nothing in him in whom the fullness of the Godhead dwelt, and dwelt bodily, from whom power went out and healed all? How could he find nothing in the solidity of virtue, in the abundance of wisdom, understanding and justice? You yourself said, Lord: I am full; you yourself said: Put your hand into my side, and be not unbelieving but believing. He who did not believe put in his hand and found you Lord and God. So he was not empty; rather it is that prince of this world who is blind and void, who knows how to see only his own things, knows how to find only his own things, and does not know how to recognize the things which are Christ's.

Or if it is as most have it: he does not find nothing in me, that is: he will not find wickedness in me, because wickedness is nothing; he will not find anything dead, because he is not dead. But how will he find anything dead in him who gives life to the dead and calls the things that are not as though they were? He will not find, he says, sin in me, I who have taken away the sin of the world. For how does he have nothing who has all things, and, what is more, has all things which the Father has, as he himself says: All things that the Father has are mine?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 4"

[[commentary]]
quote='''
Hence she too, while she was seeking, fell in with the watchmen who go about the city. They struck me she says and wounded me; the watchmen of the walls took my mantle from me. Well indeed was she coming, as a bride, with a mantle with which to veil her head when the bridegroom came to meet her. Just as Rebecca, on learning that Isaac was coming to meet her, got down from the camel and covered herself with a mantle, so this soul was putting on beforehand the tokens of the nuptial garment, lest perhaps she be cast out as not having a wedding garment, or in order to veil her head because of the angels; but they struck her, so that she might be proved more fully; for souls are exercised by temptations. They took her mantle from her, inquiring whether she brought the true beauty of naked virtue, or because one ought to enter that heavenly city without a covering, bringing no coverings of disguise with oneself. There are also those who inquire lest any soul carry with it the cast-off spoils of fleshly allurement and bodily concupiscence. She is stripped of her mantle when her conscience is laid bare. But there is also one who is stripped to good effect, to whom it is granted to imitate him who says: For the prince of this world is coming, and in me he will find nothing, surely because in him alone he finds nothing who did not commit sin. Blessed too is that soul in whom he finds nothing grave or much, but finds in her the cloak of faith and the discipline of wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 6"

[[commentary]]
quote='''
Who is that usurer of sin, if not the devil, by borrowing sin from whom, Eve indebted the whole human race with the usury of a guilty inheritance? Therefore like a wicked usurer he held the bond which afterward the Lord blotted out with His blood. For what had been written in characters of death had to be destroyed by death. Accordingly the devil is a usurer. Therefore he showed his riches to the Savior saying: All these will I give thee if falling down thou wilt adore me. But in truth the Lord, the payer of the debt, owed nothing to him, Who could say: The prince of this world cometh and hath found nothing of his in me. He owed nothing but He paid for all, just as He Himself testifies, saying: Then did I pay that which I took not away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 9"
