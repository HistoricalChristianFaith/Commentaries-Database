[[commentary]]
quote='''
The Bride is praised also because she is faithful, because she is powerful in word, because she is fruitful with diverse fruits, because she is one dove, having the unity of the spirit, in which there is peace, which makes both one; and because she is not composed of diverse elements of a divided and mutually warring nature. For what is so diverse as fire and water, air and earth, of which the frame of our body consists? But every blessed soul is simple, imitating him who says: That all may be one, as you too, Father, are in me, and I in you, so they too may be one in us (John 17:21); for this is the consummation and perfection, whence he also added: That they may be one, as we too are one: I in them, and you in me, that they may be perfected into one (ibid. 23). This, then, is the one dove, and perfect, which is simple and spiritual, and is not troubled by the passions of this body, in which there are fightings without, fears within. Indeed Scripture teaches us that by this word of unity concord and peace are signified, saying: And the multitude of believers had one heart and one soul, and there was no separation at all among them (Acts 4:32).

Nor is the soul idly praised for fruitfulness: not only because she is fruitful in virtues, but also because she has nothing evil in her; for that is comely and beautiful in which there is nothing evil. For what is good is comely; but what is uncomely, that is evil. Beautiful is the fruitfulness of good works; therefore barrenness is contrary to beauty; since in him who is deprived of beauty or comeliness there is every evil: and what is evil, that is barren and unfruitful. What clearer proof of this is there than the earth? For the earth that is good is fertile and fruitful; but that which is bad is lean and barren; and that which is fertile is also comely. For what is more beautiful than a full field, when the crop waves, when the fruits glow red, or when garlands of grapes hang down, or the olive tree bends laden with berries, or the summits of the mountains and the low places of the valleys are clothed with green grass?

For God is the author of all good things: and the things that are his are surely all good, and nowhere is there evil there; and if our mind abides in him, it knows no evil. The soul, then, that does not abide in God is herself the author of her own evils, and so she sins: The soul, however, that sins, she shall die; for, loosed from the golden chains of the virtues, she is borne headlong down the precipice, and slips to lower things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
