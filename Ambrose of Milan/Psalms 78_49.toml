[[commentary]]
quote='''
Indeed usage has it that we say of anyone punished that he has fallen under the wrath of the laws, not because the laws have wrath, but because he has fallen under the severity of the laws. So too elsewhere he says of the ten plagues of the Egyptians: He sent wrath upon them through evil angels, that is, vengeance; for the law does not know how to be angry, but the minister of the laws does. He, then, who is the author of the laws does not know how to be angry either, he whose will is to terrify, not to punish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
