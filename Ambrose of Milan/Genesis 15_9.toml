[[commentary]]
quote='''
And the Lord God said to him: Take for me a calf three years old, a she-goat three years old, a ram three years old, a turtle-dove and a dove. I would pass over the interpretation of a sacrifice of this kind, did I not notice that a scruple arises from it for some, because a kind of rite of haruspicy seems to be described, in that after the slaughter the animals were divided and set face to face with each other, and Abraham sat down by them. But if we consider the force of the question put before and of the answer that follows, we shall be able to perceive that the teaching of this sacrifice agrees with our hope and faith. For the calf is a ploughing animal, given over to earthly labour. The she-goat is figured in riddles after the likeness of waters, because in Greek αἴξ received its name παρὰ τὸ ἀίσσειν, from what means to be borne along with a rush. For it runs just as water does: we can judge this either from the sound and course of rivers or from the violent waves of the sea. And the ram is compared to the air, because this animal is found to be more useful to the human race than all other animals, since it also furnishes us with the use of clothing, just as the air supplies us with the life-giving substance of this breath. Hence too I think this order was made, that he should first say: Take for me a calf and a she-goat and should name the ram in the third place, because those first ones, that is, the heifer and the she-goat, are compared to the material elements, the lands and the sea, and because they are called feminine, whereas the ram is a male animal, vehement by nature and violent with its horns. And likewise the breath of this air is life-giving, as a male author and cause of things that beget, moving the generative powers of the lands and, as it were, mingling itself with them in a kind of union. So of these three animals one kind is mystically figured with reference to the earth, another to the sea, another to the life-giving air.

This teaching is natural. But a moral one also concurs and is at hand. For in all men there is flesh, sense and word. Our flesh is the heifer: it toils to sow, it toils to gather, it toils to give birth; it is wearied by countless labours. Hence the Greeks too called the heifer δάμαλιν, ἀπὸ τοῦ δαμασθῆναι αὐτήν, because it is tamed by hardships. It performs the labours of male oxen with the plough and the yoke, and it shows forth the labours of females in giving birth and in its abundant udder. Our flesh too is put under the yoke of the necessities of this life, is shaken by frequent pains, and grows old, bowed by a kind of childbearing of many hardships. Now who does not know that the virtue of the soul is the more vehement, the soul to which the bodily substance clings, as though wedded to it, in the course of this life? But our senses, in the manner of she-goats, leap out as with a kind of bound and graze on the steeper places, themselves by the force of their impulse stirring up commotions of the soul and shaking it. They are ready at every occasion, whether at the meeting with a woman's beauty or at the scent of some sweetness; they are moved swiftly by hearing and touch alike, and through them they also bend the constancy of the soul and, as it were, estrange it from its own nature. Hence many think that it is called ἀφορμήν, because ὁρμή means impulse, since the cause of our being bent and estranged arises from a certain impulse of the senses. And it has the appearance of the female sex, as our senses also have; for in Greek too they are called αἰσθήσεις, a feminine word. Like animals that have given birth, they are quickly emptied when they have poured out the offspring of their generation and delight, and when their desires are stirred again they bring back new impulses.

In the ram, however, is found a likeness of our word and speech, because it is vehement, just as our speech too is effective in operation and is a kind of cause of our adornment and covering. The ram is such a cause through the use of clothing, and leads the flock in a certain order, just as a certain order of our life and practice is unfolded by the word. But I think we ought rather to understand that Word which is the Word of God, with which this ram seems to have no slight kinship, because the Word has clothed us with the true covering of his own fleece and brings us into the house of eternal salvation, he who offered himself to be sacrificed for us, who was led as a sheep to the sacrifice, and as a ram before the shearer is voiceless, so he did not open his mouth. From him we have a certain order both of our substance and of the sacred redemption, because through him we were created and redeemed. So there is a twofold cause through the Word, natural and moral: natural because he created, moral because he redeemed. Philosophy too establishes a twofold form of itself in the word, natural and moral — for the rational is the portion of both — natural according to the creation of the world, which it assigns to the word, moral according to justice and consistency of living, whose life and reason come from the word.

For this reason, when eight days had been completed from the virgin Mary's giving birth, they brought our Lord Jesus to Jerusalem, to present him to the Lord according to the Law and to give as an offering a pair of turtle-doves or two young doves, because in the dove there is spiritual grace, and in the turtle-dove the nature of incorrupt generation or the purity of an immaculate body. Rightly, then, are the turtle-dove and the dove commanded to be taken for the sacrifice after the ram, so that you may understand that incorrupt purity and spiritual grace cling to the Word. And by the very fact that he set down birds, we can understand the flights of heavenly merits. For there are the birds of heaven, which come and dwell in the branches of that tree which has sprung up from a grain of mustard seed, to which the kingdom of heaven is compared. And Ezekiel says that the heavens were opened to him, and that among other things he saw also one wheel upon the earth joined to the four living creatures. And below: I heard he says the voice of their wings, like the voice of many waters and like the voice of the Sufficient One, and when they went, like the voice of a word, like the voice of a camp.

From this some have drawn it off into the books of philosophy, on the ground that heaven itself is like a winged thing. Indeed Plato said that heaven is a winged chariot, from what the prophet had said: When the living creatures went, the wheels joined to them went too, and when the living creatures lifted themselves from the earth, the wheels were lifted up. But the prophet did not call heaven itself a bird; he said that there are birds in heaven. So too David says: The heavens tell the glory of God, that is, the heavenly powers; or else, when the beautiful element is beheld, its maker is proclaimed. But the prophet is describing the soul, whose four motions are like horses, λογιστικὸν θυμικὸν ἐπιθυμητικὸν διορατικόν (rational, spirited, desiring, discerning). These are the four living creatures, that is, the man λογικόν, the lion θυμικόν, the calf ἐπιθυμητικόν, the eagle διορατικόν. Therefore reason has been placed first, so that the rest may follow reason. Therefore with the man, on the right, is the lion, that is: with reason, on the right, is the commotion. When these living creatures are lifted up, the wheels too are lifted up. And the wheels are the life upon earth by which we live. If the four motions of our soul are lifted up, our life too is lifted up. And so he added: For the spirit he says of life was in the wheels. It is rather the soul, then, that is the chariot, the soul which says in the Song of Songs: You made me the chariots of Aminadab, that is, of our God. So the prophetic description does not agree with the tradition of philosophy. Indeed the prophet says that he heard the voice of the wings. These wings are the virtues, which with the greatest and a double beating of prudence, fortitude, temperance and justice resound a sweet beauty, the song of life. Plato, however, borrowed the notion that certain sweet sounds of the stars are produced by the revolution of the heavenly sphere, following renown and display rather than truth. For although our Origen too, that is, a man devoted to the Church's ministry, asserts that there is, through the motion of the planet stars, a certain indescribable harmony of that most sweet heavenly sound, yet many of his writings testify that he too indulges the tradition of the philosophers very much. I have written this in order to separate the interpretation of this sacrifice both from the tradition of haruspicy and from that of philosophy. Let others wish to prove their learning; I, following the Apostle, prefer to seem timid rather than learned, for he says: See that no one plunders you through philosophy and empty seduction, according to the tradition of men, according to the element of this world, and not according to Christ.
'''
