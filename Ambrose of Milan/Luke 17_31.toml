[[commentary]]
quote='''
Therefore, since because of the wicked the good must suffer contrition of heart and mind in this age, so that they may receive a richer reward in the future, they are furnished with remedies, so that those who are in Judea should flee to the mountains. What is this Judea? For I know another Judea too, according to the spirit, not according to the letter; for known, indeed, in Judea is God. And what sort of mountains are these, that can check the movement of the future judgment, since it is written: Trembling, moreover, will seize the mountains? Heaven and earth will pass away: how will a portion of the earth remain immune, or be able to protect me, when it does not preserve itself? Where, then, shall I hide myself from the wrath of him who troubles the depth of the sea? If I ascend into heaven, he is there; if I descend into hell, he is present. He who is everywhere, then, cannot be deceived, but he can be appeased.

The day of judgment, then, is at hand. If you do not wish to be seized, fear daily, flee daily. Do you ask how you should flee? Go up onto a mountain, you who bring good tidings to Zion, so that you may stand out on the summit of lofty merits; for God, indeed, is of the mountains and not God of the valleys. Go up to where Christ sits at the right hand of God, whose foundations are on the holy mountains, and mountains are round about him. Paul is your mountain, Peter is your mountain. Set the footstep of your mind upon their faith. Those established in the law of God and in the inheritance of faith the day of judgment finds not for punishment but for glory.

If anyone too is placed on the housetop, that is, has already climbed to the upper parts of his house and to the summit of eminent virtues, let him not fall back to the earthly works of this world. For I know a housetop on which Rahab — a harlot in type, the Church in mystery, joined to the Gentile peoples by fellowship in the sacraments — hid the spies whom Joshua sent; and if they had gone down to the lower parts of the house, they would have been killed by the searchers who had been sent to seize them. The housetop, then, is the office of a sublime mind and the summit of the soul, by which the naked infirmity of the body is covered. Hence it seems to me that that paralytic too, who was let down from the roof by four young men, was holy for this reason, that with the support of four virtues, prudence, fortitude, temperance and justice, he laid himself at the feet of Christ by a certain lofty reasoning. For nothing is more exalted than humility, which, being as it were higher, knows not how to be lifted up, because no one aspires to what he judges to be beneath him.

But since we are dealing with the judgment, let us not step down from the housetop, lest, while we desire to carry off the vessels that are in the house, we be caught. For not in every house are there vessels of gold and silver, but in most there are wooden ones; nor is every house full; for there are empty ones too, which the prophet knew, who said: What has happened to you now, that you have gone up into empty houses? The city is filled with those crying out. And he added: All your princes have fled, all who were wounded in you and have fallen from faith into unbelief. Sabellius was wounded, Valentinus was wounded, Arius was wounded; for they were found in an empty house.

Do you wish to see a full house? Follow Peter, when he was hungry, going up to the upper parts of the house. There he recognized the mystery of the Church that was to be gathered, so that he should not judge unclean the Gentile people whom faith can cleanse from every contagion. Now the vessels are of clay; the vessel, therefore, is the body. And so beware lest from desire of the body you abandon the noble pursuits of the mind. If Peter did not receive the mystery while placed in the lower parts, how will you receive it? He received it because he went up, so that he might preach the Lord and not fear the suffering of the body.

So he who is on the housetop, let him not go down, and he who is in the field, let him not turn back. Whence am I to understand what the field is, unless Jesus himself teaches me, saying: No one who puts his hand to the plow and looks back is fit for the kingdom of heaven? The idle man sits in the farmhouse, the laborious man sows in the field: the weak man at the hearth, the strong man at the plow. Good is the smell of the field; for the smell of Jacob is the smell of a full field. The field is full of flowers, full of various fruits. Plow your field, then, if you wish to be directed to the kingdom of God. Let a fruitful crop of good merits flower for you. Let there be an abundant vine on the sides of your house and young olive shoots round about your table. Let your soul, now conscious of its own fertility, sown with the word of God and plowed also with spiritual tillage, say to Christ: Come, my brother, let us go out into the field; and let him answer: I have entered my garden, my sister, my bride: I have gathered the vintage of my myrrh. For what vintage is better than that of faith, by which the fruit of the resurrection is stored up, by which the fountain of perpetual joy is watered?

So, since you are forbidden to look back, much more are you forbidden to return and take your tunic; for you have learned that to him who asks you for your tunic you ought to let go your cloak as well. So, directed towards the kingdom of God, do not seek after riches and patrimony. I know of another tunic too, written of, concerning which the Apostle exhorts us that, putting off the old man with his deeds, and having put on the new, we should not seek again the tunic of former error. Hence she too says: By night I have put off my tunic; how shall I put it on? That is, you ought not only to renounce sins, but also to abolish all memory of your former conduct. Accordingly Paul, forgetting the things that are behind, put off his guilt, but did not neglect repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
