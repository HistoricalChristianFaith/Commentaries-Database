[[commentary]]
quote='''
Their cows did not miscarry, therefore, but gave birth, so that their labor would be increased and that they would beget everything they conceived without reverence for God. The righteous, however, take delight in an altogether different way. They glory not in the abundance of their wealth or the fruitfulness of their livestock but in the Lord, saying, "We were impregnated with reverence for you, and we brought forth the spirit of salvation."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David 2.4.15"


[[commentary]]
quote='''
Isaiah also, proclaiming the resurrection to the people, says that he is the announcer of the Lord's message, for we read thus: "For the mouth of the Lord has spoken, and they shall speak in that day." And what the mouth of the Lord declared that the people should say is set forth later on, where it is written: "Because of your fear, O Lord, we have been with child and have brought forth the Spirit of your salvation, which you have poured forth upon the earth. They that inhabit the earth shall fall; they shall rise that are in the graves. For the dew which is from you is health for them, but the land of the wicked shall perish. Go, O my people, and enter into your chambers; hide yourselves for a little until the Lord's wrath pass by."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Decease%2520of%2520His%2520Brother%2520Saytrus%2FBook%25202.html'
source_title="On the Death of Satyrus 2.67"

[[commentary]]
quote='''
If such, therefore, be our experience in the flesh, let us turn to an examination of what is proper to the soul. There is no question that we have to deal here with something that is without sex, yet it fulfills all the offices of both sexes in that the soul conceives and, as in marriage, gives birth. Nature provides woman with a womb in which a living person is brought to birth in the course of time. Such, too, is that characteristic of the soul which is ready to receive in its womb-like recesses the seeds of our thoughts, to cherish them and to bring them forth as a woman gives birth to a child. This and no other is the meaning of the words of Isaias: We have conceived and brought forth the spirit of salvation. Some of these conceptions are associated with the female sex, such as malice of thought, petulance, sensuality, self-indulgence, immodesty, and other vices of that nature which tend to enervate the traits associated with what is distinctively masculine. These last are the virtues of chastity, patience, wisdom, temperance, fortitude, and justice, which make it possible for our minds and bodies to struggle with zeal and confidence in our pursuit of virtue. These are the conceptions to which the Prophet Isaias referred in the words, We have conceived and brought forth the spirit of salvation, that is to say, the characteristic masculine traits conceived and gave birth to the spirit of salvation.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 10"
