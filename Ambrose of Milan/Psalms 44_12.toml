[[commentary]]
quote='''
You have sold, he says, your people without price. The contract of buying and selling seems to be a kind of equal one; but yet, if you consider the disposition of the buyer and the seller, each sells what is of less value to himself and buys what pleases him. For, to speak apart from that class of men who carry on a trade in selling slaves, no one readily sells anyone except one who displeases him and whom he thinks unfit for his use, and again each one desires to buy him whom he has judged suited to his advantage or his service. But even those who lay out their own expense in selling slaves and pursue gain surely hold those whom they sell so cheap that they are cheaper to them than money; and often too they prefer to keep rather than to sell those whom they have judged more fit for their trade.

So, then, God too sold the cheaper and bought the better. He sold the people of the Jews, not through the harshness of God but through their own fault, to whom it is rightly said: Behold, for your sins you have been sold, and for your iniquities I have put away your mother. In this way, then, the people of the Jews was sold and the Christian people bought; that one sold by sin, this one bought with blood. Hence Peter says: Not with corruptible things, silver or gold, were you bought, but with precious blood. What is the precious blood, unless that of that spotless lamb, that is, of our Lord Jesus Christ? The people of the Jews, then, is without price, but the Christian people is precious; that one has no price, because it has sin; this one is of price, because its sin has been forgiven. Hence it is rightly said to the sons of the Church: You were bought with a price; do not become the servants of men. If it is said to you that you should not become a servant of men and lose your own freedom, much more is it said to you that you should not become a servant of sin, and again, that you should not become a servant of the serpent, the enemy and adversary, but serve the Lord alone, who has redeemed you by his own charity, because he himself is the redemption of his little servants.

The Lord, then, sells only a bad servant; surely he does not sell a good one. For although Joseph was sold, yet the prophet did not say: 'Joseph was sold by the Lord', but: Joseph was sold for a servant, he whom his own brothers sold, but whom the Lord, in a figure of his own Passion, redeemed from servitude and renewed to grace. So his brothers sold him and received money, but the Lord not only restored him to freedom, but also heaped him with dignity. And that there was in him a figure of the Lord Jesus, Scripture shows, which says: My son, sought with jealousy, return to me, and elsewhere: The firstborn, the beauty of a bull is his, in that God the Father exalted the horn of his anointed.

He, then, who is sold is worthless and without price, as one who rather is not than is. Hence Aquila too said: You have handed over your people, so that it should not be, and Symmachus: You have handed over your people without substance. For those who are rejected by Christ are not; but those are who are chosen by the Lord, since the Lord called the things that are not as though they were, and the peoples of the nations were chosen so that the unbelief of the Jews might be destroyed. That people, then, was handed over to nothingness, because it was sold by its own sin; for guilt has no substance.

Hence I think it was said: and there was no multitude in their exchanges, that is: you have scattered us among the nations for nothing. For you do not receive anything in exchange for handing over the soul of a man; for nothing is more pleasing to you than the conversion of a soul. But if it refuses to be converted, it hands itself over to nothingness, so as to be made the chattel of sin and crime. Therefore you have sold a degenerate people without price and without exchange. Hence in a later passage he says: For there is no exchange for them. Why is there no exchange for them? Because they did not fear, he says, God.

There is a twofold understanding of why the people of error had no exchange. One is that man cannot redeem his soul with silver or gold or possessions. For what exchange will he give for his soul, since those things are temporal or perishable, but the soul endures either for reward or for punishment? But that exchange too which is in the resurrection did not exist in the ungodly, of which the Apostle says: We shall all rise again; we shall not all be changed. It can also be understood thus: that, although a few who were redeemed merited to be changed, like Abraham, Isaac, Jacob and Moses, yet the exchange itself did not reach all. There is also this: that there is no multitude in the exchanges of grave sins, according to what is written, that the sins of some men are manifest, going before them to judgement, and some they also follow after. Those which are grave and manifest go before and are sunk without any doubt, but those which are lighter are often relieved by good works; for blessed are they whose iniquities are forgiven and whose sins are covered. But where iniquity weighs the scale down, it is not called back by any exchange of good works.

And so, even if anyone of the people of the Jews has been redeemed, he was not redeemed because he was valued at a great price, nor because he had a multitude in his exchange, but he was redeemed freely, as the Apostle teaches you, saying: The remnant according to the election of grace has been saved. And where there is grace, it is surely not by the merit of works nor by the justification of virtues, but by the liberality of the giver, by the choice of the redeemer. This Scripture has equally taught you, when the apostle Paul says: But if by grace, it is no longer of works; otherwise grace is no longer grace. What then? What Israel sought, this it has not obtained. Recognize why it did not obtain it: because it desired to justify itself, because it sought to boast of its works, because it did not offer faith nor acknowledge grace. And therefore the election obtained it, which heard him who called and received him who came.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
