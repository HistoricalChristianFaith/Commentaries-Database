[[commentary]]
quote='''
For a certain spiritual sleep is to be understood, of which Solomon says: For if you sit, you will sit without fear; if you sleep, you will rest sweetly; and you will not fear the terror that comes upon you, nor the onsets of the ungodly coming upon you. You will rest with sweetness and will not fear terror and the onsets of the ungodly coming upon you, if your tongue speaks the judgement of God and you always have it before your eyes, so that you leave no place for sin and know that the price of an offence will be paid by the requital of punishment. For he himself interpreted this in Psalm 90 (91), saying: You shall not be afraid of the terror of the night, and of the arrow that flies by day, of the business that walks about in darkness, of the onset and the noonday demon. A thousand shall fall at your side and ten thousand at your right hand, but it shall not come near you; yet you shall consider with your eyes and shall see the requital of sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
