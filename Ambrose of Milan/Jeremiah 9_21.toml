[[commentary]]
quote='''
For who, amid so many passions of this body, amid so many enticements of this world, can keep his footstep safe and undefiled? The eye has looked and turned aside the sense of the mind; the ear has heard and bent its attention; a scent has breathed upon it and hindered thought; the mouth has tasted and brought back crime; touch has made contact and kindled a fire. Death has come in through the window, said the prophet. Your window is your eye. If you look on a woman to lust after her, death has come in; if you hear the words of harlots, death has come in; if luxury takes your senses captive, death has penetrated. And therefore let him who wishes to ascend follow not the glad things of the world, not the pleasant, not the delightful, but things full of grief and weeping; for it is better to go into the house of mourning than into the house of joy. Accordingly, not even Adam would have come down from paradise had he not been deceived by delight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 1"

[[commentary]]
quote='''
We read of windows of which Jeremiah says: Death has entered through the windows (Jer. 9:21), through which avarice has entered, lust has entered. Your eye is a window. If you have looked upon a woman to lust after her, death has entered through your eye: if you have looked upon a widow's property, or the treasures of a minor, and have stirred up your desires, Death has entered through the window. As, then, death enters through these, so life enters too: if, looking upon the beauty of a consecrated maiden, you venerate the Lord Jesus, because the age of old age, a spotless life, has come into tender years, and you yourself offer your daughter, that she may be consecrated with the holy veil: if you look upon the property of a minor not as an eager usurper, but watch over it with devout affection as a careful parent: through these windows Christ peers, that he may call the bride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
