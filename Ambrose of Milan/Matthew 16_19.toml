[[commentary]]
quote='''
Therefore the Lord gave to the apostles what before had belonged to his own judgement, the equity of remitting sins, so that what is to be loosed should not stay bound long. Indeed, hear him saying: To you I will give the keys of the kingdom of heaven, and whatever you bind on earth shall be bound in heaven also, and whatever you loose on earth shall be loosed in heaven also. To you, he says, I will give the keys of the kingdom of heaven, so that you may both loose and bind. This Novatian did not hear; the Church of God heard it; therefore he is in his fall, we in remission; he in impenitence, we in grace. What is said to Peter is said to the apostles. We do not usurp a power, but we serve a command, lest afterwards, when the Lord comes and finds bound those who ought to have been loosed, he be moved against the steward who kept bound the servants whom the Lord had ordered to be loosed, saying that he who knew his lord's will and did not do according to his will shall be beaten with many stripes; but he who did not know and did things worthy of stripes shall be beaten with fewer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
