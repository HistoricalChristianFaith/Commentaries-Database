[[commentary]]
quote='''
Why do you draw your sins after you as with a long rope and as with the yoke strap of the heifer? And this certainly happens when you protract your interest. You hold a poor man as your debtor. Let there be at least some favor in this case where there is no hope of advantage. And I say this in accordance with your greed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 15"
