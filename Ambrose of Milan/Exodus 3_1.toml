[[commentary]]
quote='''
Hence the lawgiver himself claimed this as his right: to pasture the flocks of Jethro (whose name means "superfluous") and to drive them into the desert. This means that he compelled the irrational loquacity of one whose language was common and superfluous to enter into the mysteries of sound doctrine, for shepherds were repugnant to the Egyptians. All who surrender themselves to the passions of this body of ours and indulge in its pleasures are sworn enemies of those who stand for virtue.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 6"
