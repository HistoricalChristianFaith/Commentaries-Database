[[commentary]]
quote='''
By them Benjamin, the youngest, is led down, and he arrives accompanied by good fragrances, carrying with him resin, by which marble stones are joined together, because he too by his own preaching, as with a spiritual resin, was to join together living stones; carrying honey also, by which the harmful matter of a wound is eaten away within, without any harshness of cutting. For such was Paul's preaching: it did away with putrid affection and drained off corrupt humour with the sting of his argument, desiring rather to cauterize than to cut the sick inward parts of the mind. That incense is the emblem of prayer, and cassia and stacte the emblems of burial, the prophet David has taught us, saying: Myrrh and stacte and cassia from your garments. For Paul came to preach the cross of the Lord, the ever-green holm-oak, and nuts, whose shell is harder and fruit more tender — and rightly was the priestly rod of Aaron of nut-wood, and the staff of Jeremiah of the same kind — and double silver too. Who would doubt that these gifts are not idle, since both the life of the patriarch and the word of the apostle are ever green in the hearts of each one, and the speech of the saints, like silver tried by fire, shines with the brightness of wholesome precept? Nor is it undeservedly that they bring back double silver, in whom was prefigured the coming of Paul, who granted double honour to the elders who labour in word and teaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 9"
