[[commentary]]
quote='''
Just as the person who is received by the Devil is excluded from Christ, so on the other hand Zacchaeus, at the moment when he forsook gain, proceeded to welcome Christ. Marveling at the way Zacchaeus climbed a tree to see Him, the Lord was moved to say: Zacchaeus, make haste and come down, for I must stay in your house today. And he made haste and came down, and welcomed him joyfully. By receiving Christ he got rid of avarice. He sent perfidy into exile and renounced deceit. Otherwise, there is no reason for the entrance of Christ unless vice is excluded, because He has no barter with wrong-doing. Hence He ejected the money-changers from the temple, because He did not wish to associate with them. Wherefore, being aware that he could not receive Christ if he followed his old way of life, Zacchaeus ordered his former vices to leave his home in order that Christ might find an entrance therein. While people murmured that Jesus had gone to be a guest of a man who was a sinner, Zacchaeus was right in inviting the Lord to stay: Behold, Lord, I give one-half of my possessions to the poor and if I have defrauded anyone of anything, I restore it twofold. In this way he replied to those who said that a sinner ought not to offer hospitality to Christ. He said, in effect: "I am no longer a publican, no longer the Zacchaeus of old, the thief and the cheat. I restore what I have taken. I, who used to take, am now the giver. I, who formerly despoiled the poor, now make restitution. I, who plundered what belonged to others, now give of my own." Error took to flight, once Christ made entrance. Where the light of eternal light shone, there no longer existed that blindness caused by pleasures of the flesh.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 2, Chapter 4"
