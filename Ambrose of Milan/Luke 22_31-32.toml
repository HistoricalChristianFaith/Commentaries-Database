[[commentary]]
quote='''
For as wheat is winnowed and separated from the chaff and is clean, but if it has not been winnowed it cannot be clean, but stands caked and mixed with chaff, so too man, unless he has been winnowed by temptations, cannot separate from himself whatever is frail, or the chaff. Hence too it was said to Peter: Simon, behold, Satan has demanded to winnow you like wheat; but I have asked my Father that your faith may not fail. See what he says and understand: Peter is winnowed, so that he is driven to deny Christ. He fell into temptations; he spoke certain words as if full of chaff, but he spoke them with his word, so as to be more firmly founded in his affection. Indeed he wept and washed his chaff, and by those temptations he merited that Christ should intercede for him. How much greater is the patronage than the trial of that disturbance! And therefore he gained more than he suffered; for he gained Christ as his patron. But the adversary is driven to tempt the saints of the Lord to his own loss; for while he tempts, he makes them better, so that he who is tempted, who seemed weak in himself, can instruct others too. Indeed Peter is set over the Church after he was tempted by the devil. And therefore the Lord signifies beforehand what it means that afterwards he chose him as shepherd of the Lord's flock. For here he said: But you, when you have turned, confirm your brothers. The holy apostle Peter, then, turned to good fruit and was winnowed like wheat, so as to be himself, with the saints of the Lord, one bread, to be nourishment for us. For while we read the acts of Peter and learn the precepts of Peter, there comes to be for us a nourishment of eternal life and salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
The unjust are winnowed like chaff, the just like wheat. Indeed, hear the Lord saying to Peter: Behold, Satan has asked to winnow you like wheat; but I have prayed for you, that your faith may not fail. Those fail who are winnowed like chaff; he does not fail who is after the likeness of that grain which fell and rose again, heaped up with the increase of many fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 2, Chapter 5"
