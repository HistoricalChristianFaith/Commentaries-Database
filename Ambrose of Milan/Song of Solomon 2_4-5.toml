[[commentary]]
quote='''
Therefore, when she has tasted the fruit of sweetness, she hastens impatiently to more perfect things, saying:

Bring me into the house of wine, set love in order in me, strengthen me with ointments, pack me round with apples; for I am wounded by love. His left hand is under my head, and his right hand will embrace me. I have adjured you, daughters of Jerusalem, by the powers and the strengths of the field, if you rouse and rouse again love, until it please. Rightly she seeks him, rightly she longs for him; because our commander has arranged all things well on this course and journey. First of all he thought that this tabernacle should be strengthened on the foundation of faith. Then, if any dwelling of ours is harsh and arid and steep, this Commander nevertheless sets in order what is disturbed, waters what is arid, makes fruitful what is desert. If there is any bitterness, any temptation, any weakness, our leader both tempers what is bitter and soothes what is anxious; he loosens what is hard and strengthens what is feeble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
