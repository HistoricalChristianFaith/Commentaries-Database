[[commentary]]
quote='''
But since the Seventy put it thus: when he is judged, we think that he had regard to this, that it is written: For the Lord himself will come into judgement. But into what judgement? Hear him say: Against you only have I sinned and done evil before you, that you may be justified in your words and may overcome when you are judged. For this reason, then, the Lord offers himself to be heard, that judgement may be passed on him, so that he may the more overcome. How he offers himself, hear: My people, what have I done to you, or in what have I grieved you, or how have I been troublesome to you? Answer me. For I brought you out of Egypt and freed you from the house of bondage, and elsewhere: I am, I am he who blots out your iniquities, and I will not remember them. But you, remember, and let us be judged.

Grievous is this judgement, when the Lord demands to be judged against man concerning himself. For what would you answer to him who bestowed all things upon you, set you over all, subjected to you the Egyptians to whom you had come as a guest, and afterwards drowned them in the sea when they pursued you? He destroyed and overthrew your enemies, he created and made you; he redeemed you with his blood, and do you hand yourself over to serve his enemy? He forgave you all your sins, and do you commit more grievous ones? He calls you: coming into judgement, what will you answer him, when, unless he forgives you again, you have perished? And therefore holy David, seeing that by this kind of moral dealing of God he was the more weighed down, flees from judgement and asks for mercy, saying: And do not enter into judgement with your servant, for in your sight no living man shall be justified. He confesses that he has been placed in darkness as one dead of the world. Cautiously he said as one dead of the world, not dead. For those who die in Christ are not dead of the world; but those are dead of the world who set their whole life, which they have lived in the world, in destruction and death. And therefore, as one in despair, he flees to the remedy, saying: Hear me quickly, O Lord, for my spirit has failed. For when the offer of such a judgement was set before him, in which truth was to be examined rather than mercy bestowed, he failed.

Yet the Lord is so loving that, although no living man is justified in his sight — for who, however righteous, is not liable to sin, or whose life is such that it is judged worthy of the likeness of God? —, certainly he who has been made after the image and likeness of God ought, as God is without sin, so likewise, being after his image, to be without sin. Of what punishment, then, is he worthy who has lost so great a grace of the Lord's workmanship and the likeness of the divine beauty? But because he is merciful, even if he submits himself to judgement, he yet does not judge the righteous man, but the unrighteous. He spares the righteous man as one who sins through the frailty of his condition; he punishes the unrighteous man as one who loathes the ungrateful. Then, even if you have many works of righteousness, do not be impatient and arrogant, as one who thinks that the rewards of righteousness are to be demanded for yourself in this world, or who complains that some adversities have befallen you undeservedly. For as long as you live, a contest is owed to you, not a reward.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
