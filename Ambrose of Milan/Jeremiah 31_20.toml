[[commentary]]
quote='''
For we reckon the ages of soul and of body alike, not by the reckoning of time but by the quality of virtue, so that he is called a perfect man who is free from the error of childhood and through maturity of mind does not feel the slipperiness of youth, but he is called little who seems to have made as yet no progress in virtue. Hence that saying in Jeremiah, when the Lord had pity on Ephraim weeping and begging pardon for his own sins: From my youth he says Ephraim is a beloved son to me, a child in delights. For had he not been a child in delights, he would never have sinned. And well did he say both, that he was in delights and that he was a child; for he is a child who does not sin. Behold my child, whom I have chosen. Through delights, then, he sinned who had been so formed by the Lord as to be ignorant of error. So if he had not been a child in delights, and if he had advanced into the perfect man by the age of virtue, he would never have fallen, so as to need to ask pardon for his offences, when he ought rather to have hoped for the rewards of merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
