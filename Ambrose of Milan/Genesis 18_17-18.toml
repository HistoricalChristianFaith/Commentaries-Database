[[commentary]]
quote='''
I will not hide he says from Abraham my lad what I am doing. Scripture certainly indicated above that Abraham was of advanced age, since he had come to ninety-nine years: how then does he call him a lad? But since it has portrayed him as forgetful of old age, an untiring watcher, nimble in running, most patient in standing, most eager in escorting, does not the name of lad seem to suit his services? Rightly is he called a lad who knew nothing of the fastidiousness of old age, and who offered the innocence and the readiness to serve of boyhood. And so to the just man is given the grace of blessing and the inheritance of posterity,

while the offence of sins is set forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
