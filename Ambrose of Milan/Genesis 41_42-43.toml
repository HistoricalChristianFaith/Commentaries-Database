[[commentary]]
quote='''
Hence I think that Joseph earned rewards that were rather mystical, because he spoke of mystical things. For what does the ring placed on his finger mean, except that we should understand that the high priesthood of faith was conferred on him, so that he himself might seal others? What does the robe mean, which is the clothing of wisdom, except the primacy of prudence granted him by that heavenly King? The gold necklace seems to express good understanding; the chariot too signifies the lofty summit of his merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 7"
