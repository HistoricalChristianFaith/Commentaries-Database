[[commentary]]
quote='''
There is the incident in the Gospel of the Lord Jesus, saying: Zacchaeus, make haste and come down. And he who attained his wish to see Christ and who further succeeded in being seen and addressed by Christ made haste to descend and welcomed Him with joy. And so the Lord approved of this display of his emotions and was quick to reward him in return, saying: Today salvation has come to this house. The Lord hastened to perform His act of kindness. He did not wait and promise to fulfill it later, but first acted and then spoke of it, for He said: Salvation has come, which was, of course, the act of one who anticipates, not of one who promises. The just man gives an added force to his vow by acting quickly.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 8"
