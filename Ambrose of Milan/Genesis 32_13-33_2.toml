[[commentary]]
quote='''
But the perfect man was thinking of reconciliation with his brother, so as to invite him by humility, win him by kind services, and he thought that he should also buy him with gifts. And so he went to meet his brother with his wives and his children, so that, even if Esau was indignant with Jacob himself, he might be swayed by the courtesies of kinship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 6"
