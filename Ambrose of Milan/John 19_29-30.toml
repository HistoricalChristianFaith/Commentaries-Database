[[commentary]]
quote='''
And the Jews offered vinegar. Well, to consummate all things, the corruption of purity too is drunk, that all things which had been vitiated might be fixed to the cross. So vinegar is drunk; wine with gall is not drunk, not because it is gall, but because bitterness mixed with wine is refused. For certainly he took up the bitternesses of our life according to the condition of the body. Indeed he himself says: They gave gall for my food, and in my thirst they made me drink vinegar. But bitterness ought not to be mixed with purity, that it might be shown that the immortality of those who rise again will be without bitterness, and this immortality, since it had turned sour in the human vessel, is restored in Christ. Therefore vinegar is drunk, that is, the vice of the immortality corrupted through Adam is abolished on the reed, that it might be drawn out of the human body. Let us too pour over into Christ our vices, which have hardened through carelessness of mind and body; let us pour them over through baptism, that we may be crucified in Christ; let us pour them over through repentance, that from him the incorrupt purity of the heavenly wine and blood may be poured back into us.

Indeed, when he had drunk the vinegar, Accomplished he says are all things, because the whole mystery of the mortality he had assumed had been fulfilled, and, all vices having been drained away, the joy of immortality alone remained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
