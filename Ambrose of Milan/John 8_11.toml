[[commentary]]
quote='''
In fact, if you seek authority in the Son, Now you he says are clean because of the word which I have spoken to you. He forgives by a word, he forgives by command, but he forgives with reason, saying: Go, see that after this you do not sin. You have authority, because he pardoned the things of the past; you have judgment, because he gave a rule for the things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 12"

[[commentary]]
quote='''
Yet since my discourse is with those who have given in their names for the grace of baptism, if anyone has committed so great a crime, let him know that pardon will be granted him, but as to one who has committed a crime; and let him know that for the future he must abstain. Indeed, to that adulteress whom the scribes of the Pharisees brought before him in the Gospel, the Lord forgave what had gone before, but he said: Go, and from now on see that you sin no more. What he says to her, he says to you. You committed adultery as a gentile, you committed it as a catechumen: you are forgiven, it is remitted through baptism; go, and after this see that you sin no more.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 4"
