[[commentary]]
quote='''
But who are those robbers but the Angels of night and darkness, among whom he had not fallen, unless by deviating from the divine command he had placed himself in their way.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Or they stripped us of the garments which we have received of spiritual grace, and so are wont to inflict wounds. For if we keep the unspotted garments we have put on, we can not feel the wounds of robbers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A certain man was going down from Jerusalem to Jericho. That we may resolve more plainly the passage set before us, let us recall the ancient history of the city of Jericho. We remember, then, that Jericho, as we read in the book entitled of Joshua son of Nun, was a great city enclosed by walls of masonry, such as could not be breached by iron nor pierced by the ram; that in it lived Rahab the harlot, who received with hospitality the spies whom Joshua sent, laid a plan, answered the citizens when they demanded them that they had gone away, hid them on the roof, and, so that she might rescue herself and her own from the destruction of the city, tied a scarlet cord in the window; and that the impregnable walls of the city itself collapsed at the sound of seven priestly trumpets and the shout of the people in jubilation sounding with them.

See how each keeps his own duty: the spy his watch, the harlot the mystery, the victor his faith, the priest religion. These do not fear danger for the sake of praise; she does not betray those she has taken in, even in dangers; he, anxious to keep faith rather than to conquer, commands the safety of the harlot before the destruction of the city; and the insignia of religion are the weapons of the priest. Further, who would not think this full of wonder, that out of the whole city no one was saved except the one whom the harlot set free?

This is the history of the simple truth. But if it is considered more deeply, it signifies mysteries to be marveled at. For Jericho is a figure of this world, into which Adam, cast out of paradise, that is, from that heavenly Jerusalem, came down by the fall of his transgression, passing, that is, from the living to the underworld, he whom a change not of place but of conduct made an exile from his nature. For far changed from that Adam who enjoyed unharmed blessedness, when he turned aside to the sins of the world, he fell among robbers, among whom he would not have fallen, had he not, straying from the heavenly command, made himself liable to them. Who are these robbers but the angels of night and darkness, who sometimes transform themselves into angels of light but cannot persevere? These first strip off the garments of spiritual grace that we have received, and so they are wont to inflict wounds; for if we keep undefiled the garments we have put on, we cannot feel the blows of the robbers. Take care, then, that you are not stripped first, as Adam was first stripped, deprived of the keeping of the heavenly command and despoiled of the garment of faith, and so received a deadly wound, in which the whole human race would have perished, had not that Samaritan, coming down, healed his bitter wounds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
