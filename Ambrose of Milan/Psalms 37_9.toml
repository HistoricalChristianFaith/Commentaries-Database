[[commentary]]
quote='''
Those who wait for the Lord, indeed, shall possess the land, that land, surely, of the living. There is a certain heavenly land which bears fruit for the heavenly, of which he says: I believe that I shall see the good things of the Lord in the land of the living. This land, with much sweat of men, supplies food for the belly; that land of the Lord's good things bears fruit without any labour, and in it is the lasting possession of the righteous and the inheritance of the devout mind. And well does he say: But those who wait for the Lord shall possess the land by inheritance. For this is the land that does not pass away; for heaven and earth shall pass away, but the words of the Lord shall not pass away. And therefore neither can that intelligible land of paradise pass away, in which are those who keep the words of the Lord. In this land Adam was placed, that he might take the fruit of eternal life; but because he could not keep the words of the Lord, therefore he did not deserve to remain in the possession which he had received. But he who keeps the words of the Lord says with confidence: Waiting, I waited for the Lord, and he looked upon me. But since Adam did not wait for the Lord — for how did he wait, who fled back and feared to present himself? —, therefore neither did the Lord deign to see him; the eyes, indeed, of the Lord are upon the righteous. Him, however, he was so far unwilling to see that he sought him, saying: Adam, where are you? He who is sought is held as absent. It is faith that presents us to God, unbelief that makes the ungodly exiles. And so no one is absent from God except he who has made himself absent, and therefore he says: Be it done to you according to your faith; for he who does not know will not be known. Adam, then, as a sinner, could not keep his place; cast out of paradise, he was banished to a fortified village, that he might do penance. He received a respite, so as not to perish utterly at once, so that Eve might be saved through the bearing of children: the faith of holy Abel, the grace of the prophets, the posterity of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
