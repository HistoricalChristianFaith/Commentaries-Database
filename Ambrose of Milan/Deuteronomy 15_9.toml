[[commentary]]
quote='''
How often in prayer, in which we draw nearest to God, things full of some disgrace or crime are poured over us, by which they may turn us away from our zeal for prayer! How often the enemy tries to insert into our heart something by which he may turn us back from our purpose of holiness and from devout vows! How often he inflames bodily fires, how often he makes the eyes of harlots meet us, with which to tempt the chaste feeling of the just man, so as to strike him unprepared with the unforeseen dart of love! How often he puts into your mind a wicked word and hidden thoughts of the heart! Of this the Law says to you: Take heed to yourself, lest there be a hidden wicked word in your heart, and lest Jesus say to you: 'Why do you think evil things in your heart?' And lest, when you abound in gold and silver and the rich fruits of your fields or in honours, you say: 'My strength has given me these things', and forget the Lord your God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"

[[commentary]]
quote='''
What is it to know oneself, but that each should know that he is a man made in the image and likeness of God, capable of reason, who ought to cultivate his land like a good farmer with a certain plough and pruning-hook of wisdom, so that what is hard may be split, or what is overgrown cut back; who ought to govern the inner portion of himself by the command of the mind? Whence also in the Law it is written: Attend to yourself, lest a hidden word arise in your heart (Deut. 15:9): attend, he says, to yourself; he certainly does not say to your money, not to your possessions, not to the strength of your body, but to your soul and your mind, from which all counsels, deeds and thoughts flow. Attend to yourself, then, there, where you know that you are of greater worth. "Know yourself": this the Gentile men assign to Pythian Apollo, as though he were the author of this saying; whereas they transfer to their own what was taken from ours, and Moses, who wrote the book of Deuteronomy, was far earlier than the philosophers who fashioned these things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
