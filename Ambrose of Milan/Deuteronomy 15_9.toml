[[commentary]]
quote='''
How often in prayer, in which we draw nearest to God, things full of some disgrace or crime are poured over us, by which they may turn us away from our zeal for prayer! How often the enemy tries to insert into our heart something by which he may turn us back from our purpose of holiness and from devout vows! How often he inflames bodily fires, how often he makes the eyes of harlots meet us, with which to tempt the chaste feeling of the just man, so as to strike him unprepared with the unforeseen dart of love! How often he puts into your mind a wicked word and hidden thoughts of the heart! Of this the Law says to you: Take heed to yourself, lest there be a hidden wicked word in your heart, and lest Jesus say to you: 'Why do you think evil things in your heart?' And lest, when you abound in gold and silver and the rich fruits of your fields or in honours, you say: 'My strength has given me these things', and forget the Lord your God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 6"
