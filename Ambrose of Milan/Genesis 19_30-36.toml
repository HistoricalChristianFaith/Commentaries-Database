[[commentary]]
quote='''
We read also that Lot's daughters made their father drunk on that mountain to which they had fled in fear of the fires of Sodom and in which they were dwelling in a cave. Age, sex, solitude, and a place more fitted for the dens of wild beasts than for the dwellings of men, suited and conspired to drunkenness. And so drunkenness was the origin of incest, an offspring worse than its wretched mother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 5"

[[commentary]]
quote='''
The daughters of holy Lot, however, are excused, because they thought that that destruction had been not of the neighbouring region but of the whole world, and that they alone with their father had remained as survivors of all the peoples, and that therefore, lest the race of men should fail, they sought intercourse with their father, so that they might raise up the seed of human generation from their father. So it was not the vice of lust but the remedy of generation, which I do not think should be counted as a crime. For Eve too, taken from the man, upon whose rib the woman was built, bone of his bones and flesh of his flesh, was nevertheless joined to the man for the sake of the succession of the human race. Yet the awareness of the just man is withdrawn from this deed; drunk with wine, he did not know what he was doing. Hence it is no wonder if their opinion deceived the girls, since they thought that the peoples of the whole world had perished. The same excuse would not hold for holy Lot, who had heard from the angels that that place, not the whole world, was to perish.

Truly we learn that drunkenness must be avoided, through which we cannot guard against crimes. For what we guard against when sober, we commit unknowingly through drunkenness. It is a small thing that it inflames lust and kindles the desires of the body; it also undermines the mind itself, takes the spirit captive and wrests away the sense. Those who indulge in too much wine do not know what they are saying; they lie buried. And therefore, if they have done any wrong through wine, before wise judges their deeds are indeed pardoned, but they are branded as the authors of levity. How great is the very ugliness of it, that the strength is loosened and the gait totters!

Many think themselves strong: are they stronger than Lot, are they more continent than Noah? Scripture has certainly not set out the vices of the patriarchs, whom we read were overcome by wine, for any other reason than that you might learn what to beware of. The one lay naked, the other lay open to his daughters' error. And Noah the just was deceived, because the power of wine was still unknown; but in him you have been instructed, so that you might not be ignorant. Lot trusted himself to his daughters and, undone by an old age soaked in wine, committed incest unknowingly: you, drink in such a way that you are not taken captive. Let the patriarchs instruct you, not only by teaching but also by erring. Therefore the example of drunkenness was repeated, so that the lesson of caution might be confirmed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 6"
