[[commentary]]
quote='''
We have treated the moral passage, that she did not ply the works of a harlot but chose the gifts of fruitfulness; let us treat the historical and winnow the mystical; for it cannot be without a mystery that she received a ring and a necklace and a staff. Not mean is the person who merits to receive ornament, seal and power: the seal of deeds, the ornament of the breast, the badge of royal freedom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
