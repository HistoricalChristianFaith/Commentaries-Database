[[commentary]]
quote='''
Taking away wars to the ends of the earth, he will crush the bow and break the weapons and burn the shields with fire. And truly, before the Roman empire was spread abroad, not only did the kings of individual cities fight against one another, but even the Romans themselves were frequently worn down by civil wars. Marius fought against Cinna; on both sides Roman blood was shed. Sulla rose up and stirred up civil wars again against Marius the victor. Lepidus and Sertorius showed themselves rebels against the Roman empire. Caesar pursued Pompey and roused the fury of the Gauls against Roman arms. Having defeated the elder Pompey, he vanquished the younger in the regions of the Spains. Why should I speak of the triumvirs, how from enemies they became friends, and from friends went on again into hostile tumults, and of how the seas too were stained with Roman blood in the war at Actium? Hence it came about that, from weariness of civil wars, the Roman empire was conferred on Julius Augustus, and so the internal battles were calmed. And this served to the end that the apostles might rightly be sent through the whole world, as the Lord Jesus says: Go, teach all nations. To them indeed even kingdoms shut off by barbarian upheavals lay open, as India to Thomas, Persia to Matthew. But yet, so that they might traverse more expanses of the lands, at the rise of the Church he spread the power of the Roman empire over the whole world and, by the gift of peace, settled the minds of those at variance and the divisions of the lands. All men, living under one empire over the lands, learned to confess with faithful speech the empire of the one almighty God.

He took away wars, then, to the ends of the earth, and there is no doubt that this was done. But see whether he has not taken away the wars of weakness, which are in the hearts of those who waver. For whoever has passed beyond earthly things no longer says: Fightings without, fears within, but says: But our citizenship is in heaven. Pass over the world, then, so that you may begin to be above the world; for περᾶσαι is "to pass over" or, to put it more expressly, "to cross the sea". The Lord, then, took away the wars which spiritual wickedness was stirring up against us, and, having vanquished the devil, he left us his peace. He broke the bow from which the fiery darts of the adversary were scattered, and burned the shields of unbelief with fire, so that the shield of faith might remain inviolable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
