[[commentary]]
quote='''
And it could indeed be understood that those who have evil works though they believe in Christ, wishing indeed to live rightly but overcome by the enticements of sins, loved darkness more than light, that is: they loved both, but darkness more. But since he had spoken beforehand of those who have not believed, I think it must be taken thus: that they loved darkness and not light; for Christ is the light. As for those, then, who have not believed the light, it is absurd that they should be believed to have loved even a little the light which they did not know; for they have not known, indeed, nor have they understood; they walk in darkness, as it is written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
