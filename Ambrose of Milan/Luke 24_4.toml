[[commentary]]
quote='''
But how is it that Mark has mentioned one young man sitting in white garments, and Matthew one, but John and Luke relate that there were seen two angels sitting in white garments.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The diversity of the visions signifies the frequency of the angels ministering, according to what the Lord himself had promised, saying: And you will see angels descending and ascending to the Son of Man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
