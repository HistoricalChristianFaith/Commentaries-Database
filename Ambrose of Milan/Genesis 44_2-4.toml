[[commentary]]
quote='''
And the silver cup is put into his sack alone. Benjamin did not know this: Paul was deceived, but he was being called. Someone is sent after him in the morning; for the night of blindness had advanced, the day of faith was drawing near.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 11"
