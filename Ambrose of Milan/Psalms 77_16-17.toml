[[commentary]]
quote='''
Elsewhere too the same prophet David put it thus: The waters saw you, O God, the waters saw you and were afraid, that is, the good powers, which are calm through knowledge of the heavenly Word, not terrible with sound and crashing. But what does he say of the evil powers? And the abysses were troubled; a multitude of the sound of waters. The abysses do not see God, and therefore they are always subject to troubling. And he explained what the abysses were: a multitude, he says, of the sound of waters. For that beast too, the antichrist, ascends from the abyss to make war against Elijah and Enoch and John, who for the testimony of the Lord Jesus have been given back to the earth, as we read in the Apocalypse of John. To him a mouth was given speaking great things, so that he might sound forth against God insults full of fury and of sacrilege.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
