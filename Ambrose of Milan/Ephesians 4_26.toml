[[commentary]]
quote='''
For a physician does not at once apply medicines to a sickness. If the pain is burning, he applies poultices so that the pain may abate; if the fever is raging, he waits for the time of the remedy, and he is accustomed to deny drink itself to the thirsty. He does not say: "Do not have a fever", when the heat of the sick man is burning, but he says: "Wait until the fever ceases, until the disturbance is dispersed". So also the prophet could not say to a man whose flesh is stirred, as by the various passions of diseases, so by those of disturbances: "You shall not be angry", but he says: "Cease from anger and leave off indignation, lest you sin; for anger is a grievous teacher of sin". Another physician too says: Let not the sun go down upon your wrath, lest, while you put it off long, he should come who is accustomed to rouse the heated body from sleep, and goad you, and put thoughts into you, and plunge himself into the secret places of your heart, saying: "Avenge your injury, recognize that you are a man; it belongs to womanly weakness not to take vengeance. So a slave was to despise you, a brother to deceive you, a friend to mock you, and you still do not avenge your insult? You must proscribe him, you must rise against him with the sword and console your pain by the death of your adversary. He was a man who killed his enemy; he is rightly praised, because he avenged himself so that no one else dared to inflict an injury on him". By these goads he is kindled the more, stirred the more, so that what is written is fulfilled: Anger destroys even the wise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Now the most grievous passion of guilt is concupiscence, which reason softens and represses. For it can soften it; it cannot root it out, since the soul that is capable of reason is not the master of its passions but their restrainer. For it cannot be that one who is quick to anger should not be angry, but only that he should temper himself by reason, check his indignation and hold himself back from punishing, as the prophet too teaches us, saying: Be angry and do not sin. He granted what belongs to nature; he forbade what belongs to guilt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 1, Chapter 1"
