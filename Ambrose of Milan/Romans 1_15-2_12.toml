[[commentary]]
quote='''
We have these kinds of virtues, not sketched in outline but clearly expressed, in the Apostle, when he says: So, as far as is in me, I am ready to preach the Gospel to you also who are in Rome. For I am not ashamed of the Gospel; for it is the power of God unto salvation for everyone who believes, to the Jew first and to the Greek. For the justice of God is revealed in him, that is, in him who has believed. Then he added: from faith to faith, as it is written; but the just man lives by faith. In whom, then, is the justice of God revealed, if not in him who is conformed to the image of the Son of God? You have the first precept: after the image of God. The second: that the invisible things of God are understood through the things that have been made, that is, his everlasting power and Godhead are known by his works. This is the operative power. The third concerns the imperial power, because the Word of God is kingly and judicial and full of priestly justice, reserving the reward of good deeds and the requital of evil ones for those who will come to his judgment, of whom the Apostle says: But we know that the judgment of God is according to truth against those who do such things. And so he who has known the truth and justice of God ought not to do the things that are worthy of death. There follows the goodness of God, propitiatory indeed, of which he says: Or do you despise the riches of his goodness and patience and long-suffering, not knowing that the goodness of God leads you to repentance? That is: it ought to lead you. It calls you forth, because God is good, so that you may hope for the pardon of your sins; for he who is ready to forgive does not wish to punish. He has also added legislation, that is, the nomothetic power, so that, if anyone is relaxed by the contemplation of the divine goodness and is provoked more to negligence than to repentance, he may follow the law, since whoever he says have sinned without the law shall also perish without the law, and whoever have sinned in the law shall be judged by the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 3"
