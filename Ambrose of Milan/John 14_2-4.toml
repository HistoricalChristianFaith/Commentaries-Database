[[commentary]]
quote='''
The Lord Jesus, then, gives each one a place, that is, a mansion fitted to the merits of each; each one, indeed, in his own order. He went before, then, to prepare a place for those who believe in him; hence he also says: If I go away and prepare a place for you, I come again to you and will summon you to myself, that where I am you also may be. And where I am going you know, and the way you know. There is, then, a way by which Christ, rising again, ascended. And he indeed ascended above all the heavens to the seat of God, but men, those who deserve it, ascend from the first heaven to the second, and then from the second to the third, and from that, through the divisions, almost to the seventh heaven, and into the very vault and summit of heaven. If, then, there is a number of ways and a number of mansions, surely there is a number of days through which one reaches the height of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
