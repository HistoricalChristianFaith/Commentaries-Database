[[commentary]]
quote='''
The Lord planted paradise for the pleasure of the blessed; there he placed man to work it and keep it; and, that we may know that fasting is not new, there He instituted first the law of fasting; for He knew that through food crime must needs enter. The first punishment is for the transgression of the law of fasting, the command of God saying: Of the tree which is of the knowledge of good and evil ye shall not eat; but on what day ye shall eat of it, ye shall die the death. Moreover to such a degree did no one know how to transgress that [she] had not yet [come into being who] first transgressed the command of abstinence. The law was from the Lord God, the transgression of the law, from the devil; sin was through food, hiding after food: the knowledge of weakness was in food; the virtue of strength, in fasting. Hence as long as they fasted from forbidden things, they did not know that they were naked: after they ate of the forbidden tree, they realized that they had been made naked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 4"
