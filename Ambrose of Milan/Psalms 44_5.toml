[[commentary]]
quote='''
This, then, is he who can say: In you we will toss our enemies. What is 'to toss'? The Lord gave horns to many animals, so that they might defend themselves from the attack of wild beasts. And therefore the ox often resists the lion and tramples the bear; the stag too, though it is timid, yet also protects itself with its horns; the ram too butts the wolf. The animals, then, which have horns are said to toss. But man has no horns: how then does he toss? Hence see what Scripture says: In you, it says, we will toss our enemies. You are our horn, Lord Jesus, and therefore, as we do not presume on our own arm, so we have our defence for tossing not in our own horns, but in Christ. For faith has its own horns, which it borrows from Christ. Indeed not idly do we read in the blessings of Moses: May he who was seen in the bush come upon the head of Joseph and upon his crown, the firstborn glorified among his brothers. The beauty of a bull is his, the horns of the unicorn are his horns; with them he will toss the nations together even to the end of the earth. These are the ten thousands of Ephraim and these the thousands of Manasseh. Who was seen by Moses in the bush, unless the firstborn Son of God, who says: I am the God of your fathers, the God of Abraham, the God of Isaac, the God of Jacob? He showed himself to human sight for this reason, that he was to come so as to be seen by all. The bush burned and was not burnt up for this reason, that he was minded rather to burn this earth, which sprouted thorns and briars for us, through the discipline of continence, than to consume it through the hardship of death. Hence the prophet says: Burn my reins and my heart. He revealed, then, a certain sign of a bodily splendour to come, by which this flesh would shine through the resurrection. For what did the harmless fire signify but the lights of those who rise again? Hence the Apostle presumed to say that, as star differs from star in brightness, so also is the resurrection of the dead. May he, then, he says, come upon the head of the tribe of Joseph, to exalt the head of his people; may he come also upon the crown, to pass over the crown of the hair, so as to cut off the superfluities of sins and to sanctify the ornaments of the virtues.

This is he who is glorified among his brothers, as he himself says: I will declare your name to my brothers. What greater glory is there than to pour the knowledge of the divinity into the hearts of the nations? He it is whom Joseph saw in a vision, in that the sheaves of his brothers adored his sheaf, and the sun and the moon with the stars adored him. That sheaf is taken as the figure of the flesh; for all flesh is grass. He took up this grass of ours, so as to make his own wheat sprout and bring forth the fruit of the resurrection. Do you seek a testimony? Hear him saying of himself: Unless a grain of wheat falls into the ground and dies, it remains alone; but if it dies, it will bring forth much fruit. Indeed, so that you may know that Moses speaks of the Son of God, he says: the firstborn glorified among his brothers. Surely Joseph was not the firstborn among the sons of Jacob, but Reuben; for Joseph came after very many. But he is called the firstborn who was to come to gather together the peoples of the nations.

Hence Scripture says beautifully: The beauty of a bull is his. For as the bull leads the herd, so Christ led the people of the Gentiles to the Church, led them into the pastures, so that it could say: In a place of pasture, there he has set me; by the water of refreshment he has established me. The herds, according to the capacity of our frailty, have followed the beauty of this bull going before them, so as to gain eternal life. This bull bellowed, and death fled. The lion roars, and who does not fear? Truly the bull is the greatest victim, to take testimonies from our adversaries; for what greater victim is there than that which cleansed the sin of the whole world by its own blood? Hear that the holy prophet Jacob too calls him a bull, when he revealed the Passion of the Lord, whom the Jews afterwards persecuted: In their fury, he says, they hamstrung the bull. And to make plain that he was speaking of the Jews, he added: I will divide them in Jacob and scatter them in Israel. This is the man who wrestled with Jacob and touched his thigh, at which touch the patriarch's sinew grew numb, signifying that he would come from his line according to the flesh, he who was to be hamstrung by the people of the Jews in the passion of his body. Not understanding this mystery, they decreed that the sons of Israel should not eat the sinew. And therefore they cheated themselves of the redemption of the sacred blood, and renounced the benefits of the saving Passion too, so that they do not merit eternal life, because it is written: Unless you eat the flesh of the Son of Man and drink his blood, you will not have life in yourselves. But he who eats my flesh and drinks my blood will have eternal life. Take another point. What is the sinew but that by which the whole body is bound together? The body of Christ is the Church, which is bound by the bond of charity. What else did the Jews loose in Christ but every bond of charity? Rightly is Peter chosen as priest, who bound himself with a threefold spirit of divine charity.

Take this further, that Moses signified him. He added: The horns of the unicorn are his horns; with them he will toss the nations. But do not fear because he tosses; for he has said: I will strike and I will heal. Good horns, with which he has enclosed the world; good horns, with which he tossed that lion, our adversary; good horns, by which he has brought it about that we cannot fear the horns of the adversary; for Satan too has his horns, as Daniel testified, saying: I saw also that horn which made war with the saints and prevailed against them, until the Ancient of Days came. This is the Ancient of Days. And who is the one-horned but the only-begotten Son of God and the only Word of God, which was in the beginning with the Father? This Word with its horns put to death and brought to life the peoples of the nations, so that they became the ten thousands of Ephraim even to the ends of the earth, and the thousands of Manasseh, because the people of the nations was to believe in him, which would fill the whole world, and afterwards the people of the Jews too was to believe, turned from forgetfulness to grace; for it forgot its own salvation, since it was to turn to Christ so late. Therefore Saul is among the thousands, David among the ten thousands, because the one is harsh among few, the other gentle among many.

Yet I do not refuse if anyone thinks that The firstborn, the beauty of a bull is his was said as of Joseph, and thinks it should be punctuated so, because he gave horns to his saints too. For he exalted the horns of his people, and Hannah, the mother of the prophet Samuel, says: My heart has exulted in the Lord, my horn is exalted in my God. Joseph too surely had spiritual horns in the Lord. Let Joseph, then, be understood, so long as there is in him the figure of Christ, to whom it is said: Joseph, my son increased, my younger son; return to me. For it is not Joseph who returns to Jacob, but Christ, raised from the dead, who returns to God the Father, as it is written: His going forth is from the highest heaven, and his meeting even to its height. Yet it may be taken of Joseph: return to me, because the people returns to the land of the Canaanites, among whom the patriarchs had dwelt before. Hence Isaac says to Jacob: You shall not take a wife from the daughters of the Canaanites, and sends him into Mesopotamia, to find himself a wife there. Did the lords of the arrows lie in wait for him? Was it he who, because of the blessing of his mother's womb, was blessed in all the world, and not the Lord Jesus, whom a virgin bore? And therefore he was blessed not only above men but also above angels and archangels and above all the sublimity of the heavenly powers, as Scripture testifies, saying: Blessed is he who comes in the name of the Lord; the Lord is God, and he has shone upon us. For the Lord God himself is King of kings and Lord of lords among the things that are in heaven. Because of these horns of the Lord Jesus, David too, singing with the voice of the horn trumpet, was heard by Christ, and Moses taught that the rites of the sacrifices were to be celebrated with the sound of the trumpet, as it is written: Sound the trumpet at the beginning of the month. For whom was this written but for us? For the ancients were wont to reckon the months from the beginning of the moon. But the moon is the Church, which is lifted up by spiritual and evangelical preaching in abundance of peace, as the prophet said. In Christ, then, we will toss our enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
And in his name we will spurn those who rise up against us. What is a name but that by which each one is properly signified, which he does not have in common with others? For the word man is a common term; unless you add what he is called, he cannot be made known. A name, then, is the property of each one, by which he can be understood. Hence I think that Moses too, wishing to know what is proper to God and something special about him which was not common to the heavenly powers, asked: What is your name? Indeed God, knowing his mind, answered not with a name but with the reality, that is, he expressed the thing, not the appellation, saying: I am who am, because nothing is so proper to God as always to be. Let those, then, who deny that Christ is coeternal with the Father see that they deny God, whose property it is always to be and never at any time not to have been. By this knowledge of the divine property, then, Moses wished to spurn those who rose up against him, or, as Aquila or Symmachus said, to trample on those who resist him, like serpents and scorpions, which the Lord also says in the Gospel are to be trodden down with spiritual footsteps, so that they cannot obstruct our way, which leads to the secret places of paradise. We have, then, in ourselves the zeal for divine knowledge, we have the Word of God, which is the name of the Father. This truly is the property of God, that he is the Father of Christ, and therefore he who came to do the will of the Father came in the name of the Father. And therefore he says: I have come in the name of the Father, and you have not received me; if another comes in his own name, him you will receive, signifying that the Jews, who would not believe in Christ, would believe in the antichrist. He, then, who believes in Christ does not hope in his own bow nor in his own sword, but places the hope of victory in his name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
