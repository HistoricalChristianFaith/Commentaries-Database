[[commentary]]
quote='''
But if you wish to see, loose the shoe from your feet: loose every bond of iniquity, loose the bonds of the world, leave behind the shoe, which is earthly. For this reason Jesus sent out the apostles without shoes, gold and silver, or money, so that they might not carry earthly things with them. For he who seeks the good is praised not for his shoe but for the swiftness and comeliness of his feet, as Scripture says: How beautiful are the feet of those who bring good news of peace, who bring good news of good things! Loose, then, the shoe from your feet, so that they may be beautiful for bringing the good news.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 5"

[[commentary]]
quote='''
Know yourself, then, and the beauty of your nature, and go out as one whose feet are freed from bonds and laid bare to a naked footstep, so that you do not feel the coverings of the flesh, so that bodily bonds do not entangle the footstep of your mind, so that your foot may appear beautiful. For such are those who are chosen by the Lord to proclaim the kingdom of heaven, of whom it was said: how beautiful are the feet of those who bring good tidings of peace! Such was Moses, to whom it is said: loose the shoes from your feet, so that, as he was about to call the people to the kingdom of God, he might first lay aside the cast-off garments of the flesh and walk with bare spirit and with the footstep of the mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
