[[commentary]]
quote='''
But Sarah laughed. Consider it a sign of what was to come rather than of unbelief. For she laughed, though she did not yet know what she was laughing at, because she was to bring forth a public joy in Isaac. Therefore she denied that she had laughed, because she did not know; therefore she laughed, because she prophesied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 5"
