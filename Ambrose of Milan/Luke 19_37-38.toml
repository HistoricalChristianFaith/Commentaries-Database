[[commentary]]
quote='''
For it pleased not the Lord of the world to be borne upon the ass's back, save that in a hidden mystery by a more inward sitting, the mystical Ruler might take His seat in the secret depths of men's souls, guiding the footsteps of the mind, bridling the wantonness of the heart. His word is a rein, His word is a goad.

The multitude then acknowledging God, proclaims Him King, repeats the prophecy, and declares that the expected Son of David according to the flesh had come, saying, Blessed be the King that cometh in the name of the Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Beautifully, according to Luke, we read that the crowds praising God met him at the descent of the mount, so that they might signify that the worker of the spiritual mystery had come to them from heaven. The crowd, then, recognizes God, calls him king, repeats the prophecy: Hosanna to the Son of David, that is, it declares that the Redeemer of the house of David, the one awaited, has come, also, according to the flesh, the Son of David — and this was that crowd which was to crucify him after a brief moment. Truly a memorable mark of the divine working, that testimony against themselves is wrung from the unwilling, when they deny in their affections the God whom they confess with their voices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
