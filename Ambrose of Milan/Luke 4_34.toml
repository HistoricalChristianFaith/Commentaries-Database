[[commentary]]
quote='''
It ought not to shock any one that the devil is mentioned in this book as the first to have spoken the name of Jesus of Nazareth. For Christ received not from him that name which an Angel brought down from heaven to the Virgin. The devil is of such effrontery, that he is the first to use a thing among men and bring it as something new to them, that he may strike people with terror at his power. Hence it follows: For I know thee who thou art, the Holy One of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Nor should it disturb anyone that in this book the devil is brought in as the first to have spoken the name of Jesus the Nazarene. For Christ did not receive from him the name which the angel brought from heaven to the Virgin: it is a mark of his impudence that he is the first among men to usurp something and to carry it to men as though new, so as to strike them with terror of his power. Finally, in Genesis too he was the first to name God to man; for so you have it: and he said to the woman: why indeed has God said that you should not eat of every tree? So both were deceived by the devil, and healed by Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
