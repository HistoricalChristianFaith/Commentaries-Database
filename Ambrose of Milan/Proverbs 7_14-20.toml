[[commentary]]
quote='''
She attacks the citadels of men's hearts while uttering such words as these as a war-cry: I have vowed victims for peace, this day I have paid my vows. Therefore I am come out to meet thee, desirous to see thee, and I have found thee. I have woven my bed with cords. I have covered it with tapestry from Egypt. I have perfumed my bed with saffron and my home with cinnamon. Come and let us wrestle with desire. Here in the words of Solomon we behold the very picture of a wanton. What other than worldly pleasure is more characteristic of a prostitute who makes her entrance stealthily into the house, first making tentative explorations with her eyes and then entering quickly, while you concentrate the gaze of your soul outward on the public square, that is, on the streets frequented by passersby and not inward on the mysteries of the Law? She has contrived to trap us in a room devoted to the associations of common life by such solid chains that a person, although held in bondage, finds himself at ease there. As she reclines there she covers her body with coverlets of fraud and deceit so as to allure the souls of young men, alleging the absence of a husband, that is to say, her disregard for the Law. The Law does not exist for sinners, for, if it were present, it would not have been ignored. Hence we read: For my husband is not at home, he is gone a very long journey. He took with him a bag of money. What is the meaning of this, if not that the rich believe that there is nothing that money cannot control and that the Law is something that can be sold for profit?
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Cain%2520and%2520Abel.html"
source_title="On Cain and Abel, Book 1, Chapter 4"
