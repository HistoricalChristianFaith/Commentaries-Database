[[commentary]]
quote='''
When the bride, then, has been led to the bridegroom's place of rest, they sing a nuptial song, telling of love from the daughters of Jerusalem: Go forth and see in King Solomon, in the crown with which his mother crowned him on the day of his espousals. They sing an epithalamium and call the other powers of the heavens, or souls, that they may see the love which Christ has toward the daughters of Jerusalem. Hence he also merited to be crowned by his mother as the son of love, as Paul shows when he says that God has rescued us from the power of darkness and transferred us into the kingdom of the Son of his love. So the Son of love is himself also love, having love not as an accident but always having it in his substance, like the kingdom, of which he says: In this I was born. And so they say: Go forth, that is, go out from the cares and thoughts of the world, go out from bodily straits, go out from the vanities of the world, and see what love the peaceful King has on the day of his espousals, how glorious he is, because he gave resurrection to bodies and joined souls to himself. This is the crown of a great contest, this the splendid gift of Christ's espousals: his blood and passion. For what more could he give who did not spare even himself, but offered his death for us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 5"

[[commentary]]
quote='''
Whence he also deserved to be crowned by his mother as the son of love, as Paul shows, saying: For God has rescued us from the power of darkness, and transferred us into the kingdom of the son of his love (Col. 1:13). The son of love, then, is himself also love: not having love from accidents, but having it by his own substance, like the kingdom of which he says: For this I was born (John 18:37).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
