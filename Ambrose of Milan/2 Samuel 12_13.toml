[[commentary]]
quote='''
How many transgressions each one of us commits hour by hour, and yet each one of the common people does not think that his sin should be confessed! That king, so great and so powerful, did not allow the consciousness of his transgression to remain with him even for a brief moment, but by an early confession and immense grief he rendered his sin to the Lord. Whom could you easily find for me now, a man of rank and wealth, who would not take it ill if he were accused as guilty of some fault? But he, illustrious with royal power, approved by so many divine oracles, when he was rebuked by a private man for having grievously transgressed, did not roar with indignation, but confessed and groaned out the grief of his fault. And so the grief of his inmost feeling moved the Lord, so that Nathan said: Because you have repented, the Lord also has taken away your sin. The swiftness of the pardon, then, made plain that the king's repentance had been profound, since it carried away the offense of so great an error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 2"

[[commentary]]
quote='''
In this case too, consider how the Lord offered himself to be judged by David himself, that he might prevail; for Nathan says: Thus says the Lord God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul, and I gave you all that was your lord's, and his wives I gave into your bosom, and I gave you the very house of Israel; and if these things are few, I will add to you. And why have you held the Lord as nothing, so as to do wickedly in his sight? Confronted by the recounting of these things, when he saw that he, the judge, was the loser, he says: I have sinned against the Lord. Thus he justified the Lord, he who did not dare to deny his sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 10"
