[[commentary]]
quote='''
But the devils could not endure the clearness of the light of heaven, as those who have weak eyes can not bear the sun's rays.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What have we to do with impurities and immodesties; what, with the works of the devil? You have heard in the lesson read to-day what Legion has said: What have I to do with thee, Jesus, Son of the Most High God? Do you also say, if perchance you see the temptations of the devil fighting against you: 'What have I to do with thee, Belial? I am the servant of Christ, redeemed by His blood; I have given up myself entire to Him. What have I to do with thee? I know not thy works, I seek nothing of thine, I possess nothing of thine, I desire nothing of thine.' How much more ought we to be separated from the devil, if he sets himself apart from Christ? And if we have been subject to him in anything, we are no longer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 20"
