[[commentary]]
quote='''
But his will has been in the Law of the Lord, and in his Law he will meditate day and night, that is: blessed is he who does these things with counsel, reason, prudence. For even a little child can abstain from the things mentioned, not through virtue but through inability and ignorance of offending; this can suit even an irrational beast, which has no power of counsel, no sense of error. This, then, is the fourth point, or what follows, in which the definition of the blessed man is distinguished from the beast: that the wise man is subject to the Law by will, not by necessity. For it makes the greatest difference, since in will there is the fruit of reward, in necessity the compliance of a stewardship. For so the Apostle taught us, saying: if I do this willingly, I have a reward; if unwillingly, a stewardship has been entrusted to me. And the fitting order is that first you love the Law, second that you meditate on it. He who loves fulfils the commandments of the Law from his will; he who fears observes them unwillingly. This method of teaching the righteousness of God we have received in the Law as well; for so it is written: hear, O Israel: the Lord your God is one God; and you shall love the Lord your God with all your heart and with all your soul and with all your strength. And these words which I command you today shall be in your heart and in your soul; and you shall show them to your sons and speak of them sitting, and on a journey, and at rest, and when awake; and you shall bind them for a sign on your hand, and they shall be as ornaments before your eyes; and you shall write them on the thresholds in your dwellings and on your doors. And below: and now, Israel, what does the Lord your God ask of you but that you love the Lord your God and walk in all his ways? Wisdom too says: desire, therefore, my words, love them, and you shall have discipline. Bright is wisdom and never fading, and is easily seen by those who love her and is found by those who seek her. Rightly, then, we are taught by the holy prophet to have our will in the Law, our meditation according to the Law. Will in the Law lies not only in zeal but also in deed: first comes will, second operation. In fact, the Lord too, to him who said: if you will, you can make me clean, answered: I will; be made clean, to show that will ought to go before our works. In fact, the Law seeks the willing, because the law of the Lord is irreproachable, converting the soul, and no one is converted except he who is converted by his will. And the willing man hides and steals away the sense of toil.

And therefore he meditates on the Law day and night; in which not so much a continuous application to reading is required as the disposition to keep the Law; for he meditates fully who is a law to himself, attending to the work of the Law written in his heart. Aquila, however, put only the day, not the night as well; which he put not so much in disagreement with the others as with a different reference, since he who meditates on the Law is always in the light and has no night. For he whose works shine certainly cannot walk in darkness, because his righteousness shines forth like the light. Let our life, then, meditate on the Law; let our conduct meditate on it, let our action meditate on it, let our understanding of the heavenly mysteries meditate on it. For the Law is a pattern and shadow of heavenly things, a shadow of good things to come. Let him who recognizes in the Gospel what he believes in the Law meditate in darkness and by day, that is, when placed both in adversity and in prosperity; for the Law commands that we love the Lord. He who loves ought in every state of his to keep the disposition of a lasting charity. A father loves his son, loves him even when he rebukes him, loves him even when he beats him with a rod; he who indeed spares his rod hates his son. The Lord too chastises us and loves us. And so even when we commit what deserves coercion, he still loves, who even takes back the one who offended; and the Lord chastises every son whom he receives. You too, when you are chastised, love, because you are chastised so that you may be received. For what great thing is it if you love the Lord your God at a time when all things abound for you, when you enjoy what you have wished, when you rejoice in honours, wealth, children? Even to a man from whom we have received a benefit we are wont to return thanks. In fact, when Job was praised by the heavenly judgement, the devil replied this: it was no wonder if he was grateful to God, when such abundance of prosperity was at his disposal; but it would be proved if he lost all those things and still performed the office of a devout worshipper. This, then, is the first virtue: that you be not broken by adversities nor lifted up by prosperity. This the Law teaches you: that in affliction you should not relax your effort nor put on despair, and when already victorious should not say: my power and my strength have bestowed these things on me, but should know that all things are to be ascribed to the divine mercy.

Isaiah cries: he who is in distress shall not be confounded until the time. Drink this first. What is "drink this first"? Let us set aside the mystical sense and pursue the moral sense which the letter teaches. Because of their grievous errors he says that grievous crushings and vexations of the people will come, and these had to come first, so that mercy might follow. Drink first, then, tribulation; for through many tribulations we must enter the kingdom of God. Drink, that the sense of tribulation may be poured into the inmost parts of your breast; drink, with the disposition of a patient man, the pain of one who mourns; for when you have turned back and groaned, then you will reconcile the offended Lord to yourself. Drink this first, then, that you may be in pain and distress; gladness quickly pours in error. The people, grown fat and gross, rose up to play and departed from the Lord. It profits you to have a contrite heart; drink this first, that your sacrifice may be accepted by the Lord. Let the Apostle teach you what "drink this first" is, that is, the cup of tribulation; for tribulation works patience. There cannot be patience unless there has first been tribulation; tribulation, he says, works patience, and patience proof, and proof hope; and hope does not confound. First drink tribulation, so that afterwards the cups of so many virtues may be served to you. And that you may know that tribulation is drunk, you heard the prophet say today: you have made us drink the wine of compunction, and further on he says: and you will give them drink in tears by measure. He asks for drink by measure, not beyond measure, lest they be unable to bear it. In fact, with how good a disposition he prayed for this he proved by his own example, who mingled his drink with weeping, so as to incline the Lord's mercy towards himself.

Drink this first, then, that you may drink the second too — for this is the time for us to bring in the mystical sense —: drink first the Old Testament, that you may drink the New Testament too. Unless you have drunk the first, you will not be able to drink the second. Drink the first, that you may soothe your thirst; drink the second, that you may draw your fill of drinking. In the Old Testament there is compunction, in the New gladness. See how the Lord has met the arts of the devil on behalf of his little servants. The devil deceived one by the food of fraud, so as to ensnare all in the one; but Jesus redeemed all by the food of salvation, so as to restore in all that one too who had been deceived. The devil devised the golden cup of Babylon, so that whoever drank more might thirst more, and, because the drink could not please, he enticed them to drink by the value of the gold. He pledged them in his own wine, for which he sought the support of the metal; but the Lord Jesus poured water from the rock, and all drank. Those who drank in the type were satisfied; those who drank in the truth were made drunk. Good is the drunkenness that pours in gladness and does not bring confusion; good the drunkenness that steadies the gait of a sober mind; good the drunkenness that waters the gift of eternal life. Drink, then, this cup, of which the prophet said: and your inebriating cup, how excellent it is! And let it not move you that the cup of Babylon is golden, since you too drink the cup of wisdom, which is more precious than gold and silver. Drink, then, both cups, of the Old and of the New Testament, because in both you drink Christ. Drink Christ, because he is the vine; drink Christ, because he is the rock that gushed out water; drink Christ, because he is the fountain of life; drink Christ, because he is the river whose stream gladdens the city of God; drink Christ, because he is peace; drink Christ, because rivers of living water shall flow from his belly; drink Christ, that you may drink the blood by which you have been redeemed; drink Christ, that you may drink his words: his word is the Old Testament, his word is the New Testament. Divine Scripture is drunk and divine Scripture is devoured when the juice of the eternal Word descends into the veins of the mind and the powers of the soul; in fact, man does not live by bread alone, but by every word of God. Drink this word, but drink it in its order: first in the Old Testament; make haste, that you may drink it in the New Testament too. And as though he himself were hastening, he says: Galilee of the Gentiles and parts of Judaea, people who were walking in darkness, see a great light; you who dwell in the region of death, a light will shine upon you. Drink quickly, then, that a great light may shine upon you: a light not daily, not of the day, not of the sun, not of the moon, but that light which shuts out the shadow of death. For those who are in the shadow of death certainly cannot see the light of the sun or of the day. And as if you were asking whence comes so great a splendour, so great a grace, he answers: for a child is born to us, a son is given to us: a child, because he has sprung from a virgin; a son, because, born of God, he is the author of so great a light. A child is born to us, to us who believe, not to the Jews who have not believed; to us, not to heretics; to us, not to Manichaeans. To us he is born, because the Word was made flesh and dwelt in us; to us he is born who took flesh from a virgin, because as man he was born of Mary. Flesh is born to us, the Word is given; what is ours was born among us, what is above us was given to us.

We have digressed enough, we think, but not idly, so as to teach that even in tribulations we ought to love the Lord and not depart from him, since tribulation often follows upon gladness and gladness upon tribulation. In fact, he who is not broken by tribulation and follows the Law is blessed.
'''
