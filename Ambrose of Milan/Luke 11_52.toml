[[commentary]]
quote='''
Those also are even now condemned under the name of Jews, and made subject to future punishment, who, while usurping to themselves the teaching of divine knowledge, both hinder others, and do not themselves acknowledge that which they profess.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
They are reproved further under the name of the Jews and are declared liable to future punishment, because, while they usurp for themselves the teaching of divine knowledge, they hinder others and do not themselves acknowledge what they profess.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
