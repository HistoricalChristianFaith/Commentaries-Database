[[commentary]]
quote='''
What shall I say of the purpose of the legs, which, without suffering any ill effects, are sufficient to sustain the weight of the whole body? The knee has a certain flexibility, by reason of which the offended master is especially appeased, his ire softened, and his favors induced. This is the gift of the most high Father to His Son: ‘That in the name of the Lord every knee should bend of those in heaven, on earth and under the earth and every tongue should confess that the Lord Jesus is in the glory of God the Father.’

There are two things which above all others give delight to God: humility and faith. The leg expresses the emotion of humility and the submission of constant service. Faith makes the Son equal to the Father and makes evident that the same glory belongs to each.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
