[[commentary]]
quote='''
This, then, is the first ground of true knowledge, that the things that are in the world happen by chance; the second is this, that because of their evasions you have set for them flowing successes of worldly advantages and an abundance of riches, so that they might not plead that, because of poverty and the bitterness of some grief and mourning, they had been less devoted, and had been driven by the necessity of want into the guilt of robbery and into the pursuit of plunder. For they have not been enriched with riches or raised up with honours for tranquillity of life and the enjoyment of gladness, but so that, their complaint being shut out, their tribulation might be heaped up.

And so men of this kind are cast down while they are raised up. For it is not a grace but a ruin, where neither is the enjoyment of the gift kept for long, and the excuse for offending is taken away. For what complaint is of heavier weight than that divine one which you have in the book of the prophet Micah: O my people, what have I done to you, or in what have I grieved you, or how have I been troublesome to you? Answer me. Did I not lead you out of the land of Egypt and free you from the house of bondage? See how the ungodly are cast down while they are lifted up: their complaint is shut out, their punishment is heaped up. For, invited by heavenly benefits, they ought not to have deserted the giver of security and prosperity of life, whom they ought rather to have obeyed. But as the justice of God is great, so also is his vengeance severe. For when has the ungodly man ever been wont to last, of whom you have it written elsewhere too: I saw the ungodly man exalted above measure and lifted up above the cedars of Lebanon, and I passed by, and behold, he was not; and I sought him, and his place was not found? Incredible is the swiftness of his extinction. You see the ungodly man suddenly powerful in this world: while you pass by, he already is not. For how great is a shadow on the earth, how short-lived! Move your footstep, and the shadow has passed. Or if anything here moves you, lift up the footstep of your mind to the things that are to come, and you will find that there the ungodly man will not be, whom here you believed to be; for he who is nothing is not. In short, the Lord has known those who are his; but those who are not, he does not acknowledge, because they themselves have not acknowledged him who is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 7"
