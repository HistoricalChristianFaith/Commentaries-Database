[[commentary]]
quote='''
And that the writer was speaking of baptism is evident from the very words in which it is stated that it is impossible to renew to repentance those who were fallen, inasmuch as we are renewed by means of the laver of baptism, whereby we are born again, as Paul says: "For we are buried with him through baptism into death, that, as Christ rose from the dead through the glory of the Father, so we, too, should walk in newness of life." And in another place: "Be renewed in the spirit of your mind, and put on the new person that is created after God." And elsewhere again: "Your youth shall be renewed like the eagle," because the phoenix after death is born again from its ashes, as we being dead in sin are through the sacrament of baptism born again to God and created anew. So, then, here as elsewhere, he teaches one baptism. "One faith," he says, "one baptism."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Repentance%2FBook%25202.html'
source_title="Concerning Repentance 2.2.8"

[[commentary]]
quote='''
Let us rise from here, that is, from worldly and earthly things. For the Lord said: rise, let us go from here, commanding that each one should rise from the earth, lift up his soul lying on the ground, raise it to the things above, rouse his eagle, that eagle of which it was said: your youth shall be renewed like the eagle's. This was said to the soul. Let our soul, then, like an eagle, seek the heights, fly above the clouds, shine with its plumage renewed, carry its flights into heaven, where it cannot fall into snares. For a bird that comes down from on high, or that cannot raise itself on high, is often either caught in snares or deceived by birdlime or entangled in some ambush or other. So too let our soul beware of coming down to these worldly things. There is a snare in gold, birdlime in silver, a tie in landed property, a nail in love. While we seek gold, we are strangled; while we seek silver, we stick in its birdlime; while we seize on landed property, we are bound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 5"
