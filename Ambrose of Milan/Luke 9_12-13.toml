[[commentary]]
quote='''
Everywhere, then, the order of the mystery is kept: first medicine is given to wounds through the remission of sins, afterwards the nourishment of the heavenly table abounds; although this crowd is not yet refreshed with stronger food, nor are hearts empty of a more solid faith fed with the body and blood of Christ. With milk he says I gave you to drink, not with meat; for you were not yet able. But not even now are you able. The five loaves are after the manner of milk; but the more solid food is the body of Christ, the stronger drink is the blood of the Lord. We do not feast on all things at once from the first, nor drink all things. 'This first' he says 'drink'. There is, then, a first thing for you to drink, there is also a second. There is a first thing for you to eat, there is also a second, there is a third. First there are five loaves, second seven, the third is the very body of Christ.

Let us by no means, then, forsake such a Lord, who deigns to impart nourishment to us according to each one's strength, lest either stronger food overwhelm the weak or meagre nourishment fail to satisfy the strong; for let him who is weak eat herbs. And let him who already seems to escape the snares of infirmity eat of these five loaves and two fishes. Surely, if he is afraid to ask for food, let him himself leave all that is his and hasten to the Word of God. As he begins to hear, he begins to hunger. The apostles begin to see him hungering. Even if they do not yet understand what he hungers for, Christ understands. He knows that he hungers not for worldly food but for the food of Christ. Let him say: I do not wish to send them away fasting, lest they faint on the way: the good Lord requires zeal, he supplies strength.

Would, Lord Jesus, that you would be willing not to send away these fasting ones with me, but refresh them with a banquet imparted by you, so that, made stronger by your nourishment, they may not fear the weakness of fasting. Would that you would say of us too: I do not wish to send them away fasting! And tell me the reason why you do not wish to send them away fasting: nay, you have already said that if you send anyone away fasting, he faints on the way, that is, he faints either in the course of this life or before he reaches the head of the way, before he comes to the Father and understands that Christ is from the Father, understands that Christ is from heaven, and understands that Christ who descended is himself the one who ascended; lest perhaps, when he has learned that he was born of a virgin, he begin to reckon his power not God's but a man's.

So, lest they faint, he says: you give them to eat. But they said: we have no more than five loaves and two fishes, unless we go and buy food for all this crowd. The apostles had not yet understood that the food of the believing people is not for sale. Christ knew, he himself knew that we rather were to be redeemed, but that his banquet was free. So the disciples did not yet have the food that could redeem us. Yet they already had food that could satisfy us, they had food that could strengthen us; for bread strengthens the heart of man. So the Lord has compassion, lest anyone faint on the way. If anyone, then, has fainted, he faints not through the Lord Jesus but through himself, and you have nothing to ascribe to the Lord, who overcomes when he is judged. For what would you say to him who has conferred on you all the supports of virtue? Did he not himself beget you, did he not himself feed you? His food is virtue, his food is fortitude. But if through your own negligence you have lost the virtue you had received, what failed you was not the support of the heavenly nourishment but that of your own mind. Indeed, just as the Lord rains upon the righteous and the unrighteous, so too he feeds the unrighteous and the righteous.

Did not holy Elijah, in the strength of food, when he was already fainting on the way, walk forty days, and was it not an angel who gave that food? But if Jesus has fed you and you have kept the food you received, you will walk not forty days and forty nights, but — I dare to say it, relying on the examples of Scripture — forty years, going out from the borders of Egypt, until you come into a large land, into a land flowing with honey and milk, which the Lord swore he would give to our fathers. It is the power of this land that you must seek, the land which the meek man possesses. I do not mean this land which is dry, but that which is strengthened by the nourishment of Christ, which, set under the rule of the eternal King, is thronged with the sojourning saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
