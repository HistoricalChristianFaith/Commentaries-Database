[[commentary]]
quote='''
For when he had set forth an example, saying: You are a priest for ever after the order of Melchizedek, the same Paul added: Who in the days of his flesh offered prayers and supplications, with a loud cry and tears, to him who was able to free him from death, and, being heard by him from his fear, although he was the Son, learned obedience from the things which he suffered, and being perfected became to those who obey him the cause of eternal salvation, called by God a priest after the order of Melchizedek. Did not the Apostle, then, cry out plainly, saying that that obedience and humility were not of the divinity but of the flesh? For what is learned is temporal. As a man, therefore, he learned obedience from the things which he suffered, so as to be perfected in the flesh and, through the succession of obedience poured over into us, to become the cause of eternal salvation for us, to whom formerly that first Adam, through the inheritance of disobedience, had become the cause of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
