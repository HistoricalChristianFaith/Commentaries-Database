[[commentary]]
quote='''
Good kings are those who can show themselves rulers of their own body, flowing from the very origin and teaching of the patriarch Abraham, who taught that sin can be overcome; therefore he was a true king, for he knew not how to be subject to shameful deeds, he in whom the allurement of guilt and error could not reign. Hence also it was said to such a man by the sons of Heth: You are a king from God among us.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
