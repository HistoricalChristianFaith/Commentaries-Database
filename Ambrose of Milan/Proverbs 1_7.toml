[[commentary]]
quote='''
There is also the beginning of good instruction, as it is said: ‘The fear of the Lord is the beginning of wisdom,’ since he who fears the Lord departs from error and directs his ways to the path of virtue. Except a man fear the Lord, he is unable to renounce sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
