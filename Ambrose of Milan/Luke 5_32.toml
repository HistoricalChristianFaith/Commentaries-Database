[[commentary]]
quote='''
But how does God love righteousness, and David has never seen the righteous man forsaken, if the righteous are excluded, the sinner called; unless you understand that He meant by the righteous those who boast of the law, (Ps. 11:7, Ps. 37:25.) and seek not the grace of the Gospel. Now no one is justified by the law, but redeemed by grace. He therefore calls not those who call themselves righteous, for the claimers to righteousness are not called to grace. For if grace is from repentance, surely he who despises repentance renounces grace.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But He calls those sinners, who considering their guilt, and feeling that they cannot be justified by the law, submit themselves by repentance to the grace of Christ.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
How then has the Lord loved righteous deeds, and David has not seen the righteous forsaken, or what equity is this, if the righteous is left and the sinner is taken up, unless you understand that he calls those righteous who presume on the Law and do not seek the grace of the gospel? But no one is justified by the Law; rather he is redeemed by grace. There is, then, righteousness in the Law, but righteousness is not through the Law; for the Apostle himself too, a Hebrew of Hebrews, according to the Law a Pharisee, according to the righteousness which is in the Law having lived without complaint, he who glories on the ground of the Law: What things were gain to me he says these I counted loss for Christ, that is: he cast away the righteousness and the glory of the Law; for the righteousness of the Law without Christ is empty, because Christ is the fullness of the Law. And therefore, though there is righteousness in the Law, yet righteousness is not through the Law. For if righteousness is through the Law, then Christ died in vain; for Christ died to fulfil righteousness. Indeed, to John, who said: I ought to be baptized by you, and do you come to me? he answered: Let it be so now; for thus it becomes us to fulfil all righteousness. So Christ did not die in vain, but died for us, that the righteous might shine as the sun in the kingdom of their Father. But the Jews are not the righteous, to whom it is said: When you see the righteous entering into the kingdom of heaven. These are the righteous, who do not strike back the one who strikes them, who love their enemy. If we do not take it so, a contradiction is found:

I did not come to call the righteous, but he does not call those who call themselves righteous; for, ignorant indeed of God and seeking to establish their own righteousness, they have not been subject to the righteousness of God. So the usurpers of righteousness are not called to grace; for if grace is from repentance, surely he who disdains repentance renounces grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
