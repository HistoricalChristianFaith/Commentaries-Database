[[commentary]]
quote='''
And let it not trouble you that you have read: some in chariots and some on horses, but we will be magnified in the name of the Lord our God. They have been bound and have fallen. But Elijah did not fall, who entered in a chariot; for where the name of God is, there no one is bound, but all are loosed. In the name of our God the poor man is safe and the rich, the noble and the base-born, the weak and the mighty. Riches do not prejudice faith, if only we know how to use riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
