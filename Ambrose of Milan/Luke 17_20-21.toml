[[commentary]]
quote='''
In that hour he who is on the housetop and his vessels in the house, let him not go down to take them, and he who is in the field, let him likewise not turn back. Remember Lot's wife.

When the Lord was asked by the disciples when the kingdom of God would come, he said: The kingdom of God is within you, that is, through the truth of grace, not through the slavery of fault. So let him who wishes to be free be a servant in the Lord; for in the measure in which we share in the servitude we share also in the kingdom. He said, then: The kingdom of God is within you; but when it would come he would not say, though he did say that the day of judgment would come, so as to strike all with the terror of an imminent judgment and not to bring the security of delay.

And lest he seem to sadden the disciples if he denied them anything, he says in another book: But of the day and the hour no one knows, neither the angels of heaven nor the Son. He did well to set down 'the Son' neutrally; for the same Son of Man is Son of God, so that we may judge it to have been said rather according to the Son of Man, because he knows the end of the times not by the nature of man but by the nature of God. Yet it is not foreign to the faith if you take it of the Son of God. For what is there that the good Father would have hidden from the Son, to whom he gave all things? Or how did he not give the knowledge of the time, who gave the power of the judgment itself? And how can the Son not know what the Father knows, since the Son is in the Father and the Spirit searches even the depths of God, since the Son himself is the depth of the riches of the wisdom and knowledge of God? But why he would not say it, he shows in another place: It is not yours to know the times and years which the Father has set in his own power.

Do you see where he is heading who denies that the Trinity is of one power, so that there should be something the Son does not know? For why would the Father hide it from his own Son? For either from envy we are unwilling to make known to others what we know, or else lest we perhaps be betrayed; but neither does the suspicion of envy fall on the Father nor that of betrayal on the Son. Therefore they are of one knowledge, because they are of one power. Then too, he who knows the signs of the future judgment surely knows the end as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
