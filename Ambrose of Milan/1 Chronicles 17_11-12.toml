[[commentary]]
quote='''
Why, then, did you believe him to be the Son of God? Is it because he built a temple to God? But from this very thing you ought to have believed that he was not Lord and God, because it is written: Unless the Lord build the house for himself, they have laboured in vain who build it. He laboured in vain who built that temple which fire set beneath it burned up. Or is it because it was said to David his father: Not you shall build me a house, but when you have fallen asleep, I will raise up your seed after you? But there too a temple is promised that is not bodily, not material; for God does not dwell in things made by hand, but the temple is the holy Church, which surely is founded not by human but by heavenly power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 4"
