[[commentary]]
quote='''
Then, therefore, he will reflect within himself that when he was in honour he did not understand, and therefore he will be like the beasts, he who ought to have been like the angels through the grace of our Lord Jesus Christ, to whom be honour, glory, perpetuity, from the ages, and now, and always, and unto all the ages of ages. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
