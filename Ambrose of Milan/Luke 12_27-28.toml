[[commentary]]
quote='''
Nor does it seem of light moment, that a flower is either compared to man, or even almost more than to man is preferred to Solomon, to make us conceive the glory expressed, from the brightness of the colour to be that of the heavenly angels; who are truly the flowers of the other world, since by their brightness the world is adorned, and they breathe forth the pure odour of sanctification, who shackled by no cares, employed in no toilsome task, cherish the grace of the Divine bounty towards them, and the gifts of their heavenly nature. Therefore well also is Solomon hero described to be clothed in his own glory, and in another place to he veiled, because the frailty of his bodily nature be clothed as it were by the powers of his mind to the glory of his works. But the Angels, whose diviner nature remains free from bodily injury, are rightly preferred, although he be the greatest man. We should not however despair of God's mercy to us, to whom by the grace of His resurrection He promises the likeness of angels.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But yet, that we may weigh these things more deeply as well, since it does not seem idle that a flower is either compared to a man or indeed, in Solomon, is preferred to what was almost more than men, who merited so much as either to found a temple to God in outward form or to figure the Church of Christ in a mystery, it does not seem foreign to think that by the brightness of the color the glory of the heavenly angels is expressed, who are truly the flowers of this world, because the world is adorned by their brightness, and they breathe forth the good odor of sanctification. Supported by their protection we can say: we are the good odor of Christ to God in those who are being saved; they, hindered by no anxiety, exercised by no practice of labor, preserve in themselves the grace of the divine liberality and the gifts of a heavenly nature. Hence it is well that Solomon is shown here clothed with his glory and elsewhere covered, because he clothed with the glory of works the weakness of bodily nature, covered over as it were by a certain virtue of mind. But the angels, whose more divine nature remains free of bodily injury, are rightly preferred to a very great man, yet in consideration of our injury. Therefore, since through the resurrection men will be as the angels in heaven, the Lord, who granted it to them also, has bidden us too, by the example of the angels, to hope for an increase of heavenly glory, until this mortal be swallowed up by life; it is fitting for this corruptible to put on incorruption and this mortal to put on immortality.

Many also think this comparison more apt according to the nature of the flower and the habit of the plant set before us, because lilies require the cultivation of no yearly practice, nor, as for the yield of the other fruits, so also for the generation of this flower does labor return in its round, driven on by anxious farmers. For in whatever droughts of the field, all that is nourished toward the flower is quickened by a certain generative power, out of itself and within itself, of a sap that always abides. So, when you see the stalk of full-grown leaves dried up, the nature of the flower still lives on; for the greenness is hidden, not lost. But when it has been called forth by the caresses of spring, the clothing of the plant takes up again the tresses of the flower or the adornment of the lily. Since we remember that this passage has been treated more fully elsewhere, it is enough to have touched on it now, lest there be a return to the same things.

It is a delight to notice that lilies grow not in the roughness of the mountains and the wild places of the woods, but in the pleasantness of gardens. For there are certain gardens bearing the fruits of diverse virtues, according to what is written: a garden enclosed, my sister, my bride, a garden enclosed, a fountain sealed, because where there is integrity, where chastity, where religion, where the faithful silence of secrets, where the brightness of angels, there are the violets of confessors, the lilies of virgins, the roses of martyrs. Nor let anyone think it incongruous that angels are compared to lilies, since Christ himself has called himself a lily, saying: I am the flower of the field and the lily of the valleys. And well is Christ a lily, because where the blood of martyrs is, there is Christ, who is the lofty flower, spotless, harmless, in whom no roughness of thorns gives offense, but grace poured around him shines forth; for roses have thorns, because martyrs have torments. The divinity that cannot be struck has no thorns, for it did not feel torments.

So if the lilies, like the angels, are clothed above the glory of men: neither ought we to despair of God's mercy toward us, to whom the Lord promises, through the grace of the resurrection, a form like that of the angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
