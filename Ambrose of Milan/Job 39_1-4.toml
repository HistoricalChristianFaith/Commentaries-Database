[[commentary]]
quote='''
We shall be harts if we follow the voice of Christ, which prepares harts and makes them not fear the bites of serpents, and, if any happen to have been wounded, takes away their pain by loosing the offence. Of these harts the Lord says to Job: Have you guarded the births of the harts? And have you numbered their months full of bearing, and have you loosed their births or reared their sons, so that they do not fear? Hear how the sons of such harts do not fear. Let Isaiah teach you, saying: And a little child will put his hand into the den of asps, and they will not harm him. And so that you may recognize that it seems to signify the sons of the Church, he added: And will you send forth their births? Their sons will break forth and will be multiplied in generation. They will go out and will not return back. For no one putting his hand to the plough and looking back is fit for the kingdom of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 4, Chapter 1"
