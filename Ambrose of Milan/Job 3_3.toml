[[commentary]]
quote='''
But this is not the fault of death but of our weakness, for we are captivated by the pleasure of the body and the delight of this life, and we tremble to complete this course, in which there is more bitterness than pleasure. But not so holy and wise men, who groaned at the long duration of this sojourning, judging it a finer thing to be dissolved and to be with Christ: they even cursed the day of their birth, as one says: let the day perish on which I was born.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 2"
