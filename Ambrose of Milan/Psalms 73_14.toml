[[commentary]]
quote='''
Meanwhile he testifies that such a word did not go out from him with impunity. For he recalls that he was scourged all the day, because he had said that he had justified his heart to the Lord in vain; but after the scourges there followed at once the correction of his perverse opinion. For at once he says, my informer is in the mornings, that is, in what is open and clear; for the light of truth, laying hold of him, did not allow him to think the things that he had said. And so the light of truth poured over my mind refuted and convicted me, because I had not spoken rightly: In vain have I justified my heart. For I spoke those things as one set in darkness, and as I recalled them my heart was pricked, and when my heart was pricked my affection was enlightened, so that there came to be in my heart a flaming fire, which made in me the spiritual beginning of day. And so, when the day had grown light and risen upon me, and as though I were set in many mornings, I understood that I had come to be outside the ordering of the generation of the sons of God, I who, though at first I had believed that the maker of the world, providing for the human race, had made all things for our benefit, whether sad things or those that give little delight, afterwards, troubled by perverse opinions, lost so good a judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 6"
