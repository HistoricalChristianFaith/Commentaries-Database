[[commentary]]
quote='''
As the beloved and his beloved hastened, then, the spiritual union was celebrated, sought by mutual consent. And therefore, as if singing a wedding song, the Spirit exulted in the prophet, saying:

Solomon had a vineyard in Beelamon; he gave his vineyard to those who keep it. The Spirit cries out, then: The congregation of the peoples has been planted, but founded on the root of the eternal vine, and with a meek heart it has placed spiritual hearts under the yoke of the Word. And it has been planted in a multitude of nations. For that this is how Beelamon is to be understood, Symmachus, Aquila and the other translations have taught in the Greek tongue. The old union, which could not bear fruit, has been repudiated; the vineyard has been given to new and faithful husbandmen, who could not only produce fruit but also keep it. One sheep, then, went astray, but, called back, it filled the spaces of the whole world. Error had led away one sheep, but the grace of the Lord gathered a multitude of peoples. Man went astray, but in the Church there is now a wall, and a strong wall. Adam went astray; David is a wall, who did not forget the commandments of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
