[[commentary]]
quote='''
We are athletes, we strive, as it were, in a spiritual stadium. Hence, a good athlete was wont to say: We are made a spectacle of this world: and elsewhere: I so run, not as at an uncertainty: I so fight, not as one beating the air: But I chastise my body; and elsewhere: forgetting the things that are behind, and stretching forth myself to those that are before, I press towards the mark, to the prize. We are athletes, therefore; we must contend lawfully. There are many contests, and he who has been vanquished to-day, retrieves himself on the morrow. The contest is first for the prize, then for the crown. Does an athlete have any time for rest when once he has given his name for the contest? He exercises daily, he anoints himself daily. Even an athlete's diet is given to him, discipline is demanded, continence is observed. And you have given your name for the contest of Christ, you have signed for the competition for the crown; take thought, exercise yourself, anoint yourself with the oil of gladness, cleanse yourself from ointment. Let your food be the food of sobriety, let it have nothing of intemperance, nothing of luxury; let your drink be rather moderate, lest any drunkenness steal upon you; guard the continence of your body, so that you can be fit for the crown; let not your character offend the feelings of the spectator; let not your supporters behold you neglectful of yourself and desert you. The Archangels behold you, and the Powers, and the Dominations, and those ten thousands of ten thousands of angels. Consider how disgraceful it would be to be shamed before such; having entered the stadium, arouse the strength of your soul, bestir your muscles. When you have come into the wrestling place you must take on dust, you must withstand the blazing heat of the summer sun. The heat is severe, but the victory is sweet; the cloud of dust is disagreeable, but the endurance is splendid. No one enters the stadium covered with dust, but the contests send him back covered with dust; there the dust is collected where the palm is offered. No one unsoiled, moreover, is crowned; victory becomes him who is covered with dust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 21"
