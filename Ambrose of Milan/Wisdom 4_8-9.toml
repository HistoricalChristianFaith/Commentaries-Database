[[commentary]]
quote='''
Now Jacob grew old, and he had already grown old in character long before; but in him the tireless liveliness of youth and the tranquillity of old age contended together. For there is both an old age green with grace and a youth grey with counsels, of which Scripture says: for old age is venerable, and the age of old age is a spotless life. Of this life was Jacob, who by good works anticipated the time of long old age, so that he might both pluck its fruit before its time and not fear its last days when their time came. Blessed indeed is the young man too who lives well, but blessed also is the old man who has lived well. For what the young man hopes for, the older man has attained; what the old man has been, this he who is young wishes to be. Surely the one, with a longer course still remaining before him, is tossed by the waves of a restless sea, but the old man is in the anchorage of old age as in a harbour. Jacob, then, was such a man, who held, already locked and sealed with the safe and secure key of grace, goods that young men can scarcely hope for. But what you possess is better than what you still hope for. Jacob, therefore, was an old man to whom young men, struck by the adverse storm of some season, betook themselves as into a harbour; while he himself, placed as on a watchtower of this life, kept watch before them with anxious affection, and long beforehand foresaw remedies for uncertain affairs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 8"
