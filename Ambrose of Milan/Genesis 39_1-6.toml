[[commentary]]
quote='''
But as regards the moral sense, since the Lord our God wills all to be saved, he gave through Joseph too a consolation to those who are in slavery and furnished them a lesson, so that they might learn that even in the lowest condition one's character can be superior, and that no state is without its share of virtue, if each one's mind knows itself: that it is the flesh that is subject to slavery, not the mind, and that many slaves are freer than their masters, if, though placed in slavery, they think they must keep away from slavish works. Every sin is slavish; innocence is free. Hence the Lord too says: Everyone who commits sin is a slave of sin. For how is every greedy man not a slave, who auctions himself off for a paltry little profit of money? He who has heaped up what he will not use fears everything, lest he lose what he has heaped up, bound to guard it at the greater peril the greater the things he has sought. How is he not a beggar to whom what he possesses is little? For even if he seems rich to me, to himself he is in want, nor does he comfort his longings with proofs, since he does not know how to believe what he wishes for. And how is he too not a slave who is subject to lust? First he burns with his own fires and is consumed by the torches of his own breast. To such the prophet rightly says: Walk in the light of your fire and in the flame which you have kindled. He takes on every fear, he lies in wait for the sleep of each one; to gain his desire for one, he becomes the slave of all. He is a slave, then, and in a wretched slavery indeed, who himself makes masters for himself, who himself wishes to have people to fear; for nothing is so peculiar to slavery as always to fear. But that man is always free, in whatever condition of slavery, who is not captured by passion, not held by the chains of avarice, not bound by fear of a charge, who looks on the present untroubled, whom the future does not terrify. Does not this man seem to you to be master in slavery, and that one to be a slave in freedom? Joseph was a slave, Pharaoh was a king: happier was the slavery of the one than the kingship of the other. Indeed all Egypt would have collapsed through famine, had he not subjected his kingdom to the counsel of a slave.

Slaves by birth, then, have something to glory in: Joseph too was a slave. Those who have come from freedom into slavery by some necessity have something to console themselves with. They have something to imitate, so that they may learn that they can change their condition, not their character, and that there is freedom even in home-born slaves, and steadfastness in slavery. Masters too have something to hope for through good slaves. Abraham found a wife for his son through a home-born slave. The Lord blessed the house of the Egyptian because of Joseph, and the blessing of the Lord came upon all his substance, both in the house and in the fields. And he turned over, it says, everything whatever he had into the hands of Joseph. We notice that what masters could not govern, slaves governed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Joseph%2520the%2520Patriarch.html'
source_title="On Joseph the Patriarch, Chapter 4"
