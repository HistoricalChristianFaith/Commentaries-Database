[[commentary]]
quote='''
Why should I add also what we can infer from the very practice of the world, that when we have proved many men in some office, we wish to try the same men, as diligent and energetic, in another function? How many athletes, when they have prevailed in one kind of combat, are called to another kind of contest! What if the Lord your God too, when you have given some proof of your virtue, wishes to prove you in another kind of virtue? Holy Job, running his course without offense, he nevertheless allowed to be tempted by the death of his children and by sores over his whole body, so that in this too he might prove his virtue, whether even under the compulsion of injuries and bitter pains he would lessen the devotion of his affection. Is it not plain that he wished to prove holy David also, noble in faith, most excellent in gentleness, strong of hand, to see how he would cover his vice and amend his fall, so that he might teach us how we can conceal a sin we have committed?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 3"
