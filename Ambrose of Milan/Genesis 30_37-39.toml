[[commentary]]
quote='''
The just man enters as a hireling and is a ruler, he who was gathering for himself, through the ministry of the preaching of the Gospel, a flock shining with the splendour of many and excellent virtues, so that for the sheep that were to drink he set out in the channels a rod of storax and of nut-wood and of plane, in order that, desiring the prefigured mysteries of the most blessed Trinity, they might form offspring by no means discoloured through the conception of a devout mind. Good sheep, which have brought forth offspring of good works not unworthy of the sacred faith! By the storax is signified the incense and the evening sacrifice which is offered to God the Father in the psalm. By the rod of nut-wood the priestly gift is offered to Christ; for this is the rod of Aaron, which, when it was laid up, blossomed, by which the priestly grace of sanctification shone forth. By the plane is signified the richness of spiritual fruit, because the vine is joined to this tree, so that, glad of its fellowship, it may pour itself forth in rich offspring, since the grace of the Spirit, joined to them, has been accustomed to cherish the gifts of the Lord's passion and the remission of all sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 4"
