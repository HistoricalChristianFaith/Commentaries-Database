[[commentary]]
quote='''
The Apostle teaches That we withdraw ourselves from every brother acting disorderly. Let us pierce him with the sword of the Spirit which is the word of God. Let us not respect the person of a brother, of a kinsman, but let us separate every unclean man from the altars of Christ, that he may cleanse and amend his faults, that he may deserve to return to the Sacraments of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 22"
