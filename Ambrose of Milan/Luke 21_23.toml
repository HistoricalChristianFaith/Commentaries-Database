[[commentary]]
quote='''
Woe to those who are with child and who give suck in those days! Is conception, then, criminal? Yet children are the rewards of marriage. And how did the Lord bless Sarah, and she bore? How did Hannah pray and give birth? How did Rachel, blessed, receive sons? Did the prophets err, since the Lord could not err? But the Lord spoke in the prophets too, and therefore neither could they err. How then will anyone be able to make the discord of the writings square?

But since there is war there, let us turn to the spirit of peace; for Peace has said: A woman, when she is in labour, has sorrow, because her hour has come; but when she has given birth, she no longer remembers the sorrow, and he added: and you now indeed have sorrow, but I will see you again, and your heart will rejoice, to show that it belongs to the perfect to rejoice, and to the weak to waver, as men still afraid of uncertain things. But here too he said above: They were eating and drinking, they were marrying and taking wives, binding themselves, that is, to this life and fettering themselves with worldly cares. These surely are the pregnant women to whom woe is spoken, who stretch out the fat of their flesh and in whom the step of the inner mind grows sluggish, barren of virtues and pregnant with vices.

But not even those pregnant women are exempt from condemnation who, set in the labour of good deeds, have not yet yielded any progress in the work they have undertaken. For there are also those who conceive from the fear of God, who say: From your fear we have conceived and been in labour. But not all give birth, not all are perfect, not all can say: We have brought forth the spirit of salvation upon the earth, not all are Marys, to conceive Christ of the Holy Spirit and bring forth the Word. For there are some who cast out the Word as an abortion before they give birth; there are some who have Christ in the womb but have not yet formed him, to whom it is said: My little children, of whom I am in labour again until Christ be formed in you. So those who are still in the womb are being brought forth as imperfect; those are now more perfect to whom it is said: I have begotten you through the Gospel.

There are many fathers through the Gospel, and many mothers, who bring forth Christ. Who then will show me the parents of Christ? He himself has shown them, saying: Who is my mother, or who are my brothers? Whoever does the will of my Father who is in heaven, he is my brother and sister and mother. Do the will of the Father, that you may be the mother of Christ. Many have conceived Christ and not brought him forth. So she who brings forth righteousness brings forth Christ, she who brings forth wisdom brings forth Christ, she who is in labour with the Word is in labour with Christ.

There is also she who was in labour with injustice and brought forth iniquity. Woe to these pregnant women, who, heavy in body, are the slower to escape danger; woe to these, for whom the pain of the birth to come, by which the whole body is shaken, is still entire: for them the signs of the coming judgment are the beginnings of sorrows.

Moses too taught that there is a pregnant woman who, if two men quarrelling trample on her, quickly miscarries. And therefore let the good woman flee strife and follow peace, so that she may complete her childbirth, and let her not wait for the time of nine months: the birth of the Word lies not in the fullness of time but in the fullness of diligence. Made perfect, however, in a short time, the righteous man fulfilled many times. But on the other hand the imperfect soul is quickly trampled and loses the word it has conceived. But woe to him who scandalizes one of these little ones, woe to him who tramples on a pregnant woman! For if he has struck out the pledge while it is still unformed, it is a loss of money; but if it is formed, he shall give soul for soul, eye for eye, tooth for tooth, hand for hand.

But why an eye or a hand, when the aborted child, struck out already formed, has both a hand and an eye? Hence it appears that each one is to be condemned according to the measure in which he did harm. For if anyone, whether a heretic or a schismatic, strikes out a catechumen, as it were, from the womb either of the soul or of the Church in labour, he is punished more lightly; if one of the faithful, more heavily. And therefore one must beware lest by quarrelling with such men you trample on the Church; for avoid foolish, indeed, and undisciplined questions, knowing that they breed quarrels, by which the Church, as if in labour, is harassed by the trampling of the whole body.

So quickly fill your belly, that you may the sooner bring forth your offspring. Hear how you are to fill it and with what: With the fruits he says of his mouth a man has filled his belly, and with the fruits of his lips he shall be satisfied.

Concerning nursing mothers too, that sublime judgment of Solomon and that dispute of the two women taught me that, even if they have already been freed from the pain of childbirth, they still waver in fear for the pledges that are yet to be made strong, because through the drunkenness of the nurse sleep may creep upon her, the mother may overlay her little one, deny her own, seek another's. But even she who did not kill her son is in peril for her own, because she hangs on the uncertainty of the judgment.

So let us too, lest the day either of judgment or of death find us as the parents of imperfect works, make haste to wean our little ones. Isaac, once weaned, was not exposed to his mother's sleep, and therefore Abraham made a great feast when he weaned his son. David, weaned, hopes for the reward of his soul; for he is not the Corinthian who, at the beginning of faith still too weak for stronger food, is given milk to drink, but, strengthened now with solid bread, he had grown up into the fullness of perfect age. So the care of begetting is not enough, unless the power of nursing is at hand.

And so in you too, as in Mary, let the Word of God grow, let it advance in wisdom and age. This comes about if you keep all the words of righteousness in your heart and do not wait for the time of old age, but, betrothed in your first age to a righteous husband, quickly conceive wisdom without corruption of your body, quickly bring it forth, quickly nurse it. See for me Paul, persecuting yesterday, believing today, preaching tomorrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
