[[commentary]]
quote='''
But why do we doubt? The church has believed in his goodness all these ages and has confessed its faith in the saying, "Let him kiss me with the kisses of his mouth; for your breasts are better than wine," and again, "And your throat is like the goodliest wine." Of his goodness, therefore, he nourishes us with the breasts of the law and grace, soothing our sorrows by telling of heavenly things. And do we then deny his goodness, when he is the manifestation of goodness, expressing in his person the likeness of the eternal bounty, even as we showed above that it was written, that he is the spotless reflection and counterpart of that bounty?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25202.html'
source_title="Exposition of the Christian Faith 2.2.32"

[[commentary]]
quote='''
"You gave me no kiss, but she, from the moment she entered, has not ceased to kiss my feet." A kiss is a mark of love. How, then, can a Jew have a kiss, who has not known peace, who has not received peace from Christ when he said, "My peace I give you, my peace I leave unto you"? The synagogue has no kiss, but the church has, for she waited and loved and said, "Let him kiss me with the kiss of his mouth." She wished with his kiss to quench gradually the burning of the long desire that had grown with longing for the Lord's coming; she wished to satisfy her thirst with this boon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252062.html'
source_title="LETTER 62, TO HIS SISTER"

[[commentary]]
quote='''
But the church does not cease to kiss Christ's feet, and she demands not one but many kisses in the Song of Solomon, since like blessed Mary she listens to his every saying, she receives his every word, when the gospel or prophets are read, and she keeps all these words in her heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252062.html'
source_title="LETTER 62, TO HIS SISTER"

[[commentary]]
quote='''
Having embraced the Word of God, [the soul] desires him above every beauty; she loves him above every joy; she is delighted with him above every perfume; she wishes often to see, often to gaze, often to be drawn to him that she may follow. "Your name," she says, "is as oil poured out," and that is why we maidens love you and vie with one another but cannot attain to you. Draw us that we may run after you, that from the odor of ointments we may receive the power to follow you.
'''
source_url=''
source_title="LETTER 79, TO LAYMEN"

[[commentary]]
quote='''
So either the soul of the patriarch, seeing the mystery of Christ, seeing Rebecca coming with vessels of gold and silver like the Church with the people of the nations, and marvelling at the beauty of the Word and of his sacraments, says: let him kiss me with the kisses of his mouth; or Rebecca, seeing the true Isaac, that true joy, the true gladness, desires to kiss him.

What, then, is: let him kiss me with the kisses of his mouth? Consider either the Church, kept in suspense through many ages, since the Lord's coming had long ago been promised to her through the prophets, or the soul which, raising herself from the body, having renounced luxury and delights and fleshly pleasures, and stripped also of care for worldly vanities, has long been yearning for the infusion of the divine presence into herself and for the grace of the saving Word: consider how she is wasted with grief because he comes late, and is afflicted, and so, as one wounded by love, since she cannot bear his delays, turns to the Father and asks him to send her God the Word, and declares the cause of her impatience, saying: let him kiss me with the kisses of his mouth. She seeks not one kiss but many kisses, so that she may satisfy her desire; for she who loves is not content with the stinginess of a single kiss, but demands many, claims many, and in this way is accustomed to commend herself the more to the beloved. Indeed, that woman in the Gospel was approved for this, because she has not ceased he says to kiss my feet. And therefore her many sins are forgiven her, because she loved much. So this soul too desires many kisses of the Word, that she may be enlightened with the light of divine knowledge. For this is the kiss of the Word, namely the light of sacred knowledge; for God the Word kisses us when he enlightens our heart and the very ruling part of man with the spirit of divine knowledge. Endowed with this nuptial pledge of love, the soul, glad and exulting, says: I opened my mouth and drew in the spirit. For a kiss is that by which lovers cleave to one another and, as it were, enjoy the sweetness of an inner grace. Through this kiss the soul cleaves to God the Word, for through it the spirit of the one who kisses is poured over into her, just as those also who kiss each other are not content with a touching of the lips, but seem to pour their spirit into one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"

[[commentary]]
quote='''
Let him kiss me with the kiss of his mouth; for your breasts are excellent above wine, and the fragrance of your ointments is above all spices. Picture, then, a virgin betrothed for a long time and burning with a just love, who has come to know many illustrious works of her beloved through the assurance of trustworthy witnesses; who, with her desires held in suspense, has often been put off, and can now no longer bear the delays; who would have done anything to see her bridegroom: at last, having obtained her wish, and troubled with joy at the bridegroom's unexpected coming, she does not seek the opening courtesies of greeting, nor the exchange of words, but at once demands what she had desired. So, then, the holy Church too, which at the beginning of the world was betrothed in paradise, prefigured in the flood, announced through the Law, called through the prophets, when she had long awaited the redemption of men, the beauty of the Gospel, the coming of the beloved, impatient of delay rushes into kisses, saying: Let him kiss me with the kiss of his mouth; and, delighted by the kisses, she adds: for your breasts are excellent above wine.

And, to speak more morally, I understand for myself that flesh which had been soaked in Adam with the serpent's poison, which was withering in the stench of crimes, which went forth among the daughters of Zion with lofty neck and nodding eyes, trailing their tunics as they walked and playing with their feet, with ringlets of hair and made-up faces and headbands, and, affected with every adornment, all the more unbecoming; and I understand that this same flesh, taught by very many oracles that he would come who, having shut out the serpent's allurements, would pour in the grace of the Holy Spirit, so that all flesh might see the salvation of God and all flesh might come to God, had withered with longing: but, fearing lest, as impatient, as wanton, as luxurious, as querulous, she should displease as she had before, although she was shaken by the waiting for the Lord's coming, which delayed longer than she could now bear: yet not murmuring nor transgressing, but lifting up pure hands in every place, without anger and dispute, in seemly attire, with modesty and sobriety, adorning herself not with braided hair or gold or pearls or costly clothing, but with those things that befit the grace of chastity and of good conduct, she prays, saying: Let him kiss me with the kiss of his mouth; for your breasts are excellent above wine. Already the flesh wished to cleave to Christ, already it hastened to be wedded, that there might be one spirit, and that what had before been the flesh of a harlot might become the flesh of Christ. Let him kiss, she says, me: the Word of God kisses us when the spirit of knowledge illumines our understanding.

Therefore, whether it is the Church, long held in suspense through many ages by the Lord's coming promised to her through the prophets, or the soul which, lifting herself from the body, having renounced luxury and delights and carnal pleasures, having put off also the anxiety of worldly vanities, has long been longing for the infusion of the divine presence and the grace of the saving Word, she is wasted with grief that he comes late, and is afflicted; therefore, as one wounded by love, since she cannot bear his delays, she turns to the Father and asks him to send her God the Word, and declares the cause of her great impatience, saying: Let him kiss me with the kisses of his mouth.

She seeks not one kiss but many kisses, that she may satisfy her desire; for she who loves is not content with the scantiness of a single kiss, but demands very many, claims more, and in this way is accustomed to commend herself the more to her beloved. Thus that woman in the Gospel was approved in this way: Because she has not ceased, says the Lord, to kiss my feet, therefore her many sins are forgiven her, because she loved much (Luke 7:46, 47). So this soul too desires many kisses of the Word, that she may be illumined with the light of divine knowledge; for this is the kiss of the Word, namely the light of sacred knowledge. For God the Word kisses us when the Spirit of divine knowledge illumines our heart and the very governing part of man; endowed by it with the nuptial pledge of love, the soul, glad and exultant, says: I opened my mouth and drew forth the spirit (Ps. 118 (119):131). For a kiss is that by which lovers cleave to one another and, as it were, enjoy the sweetness of inward grace. By this kiss the soul cleaves to the Word of God, in that the spirit of the one who kisses is poured over into her: just as those also who kiss each other are not content with a touch of the lips, but seem to pour their spirit into one another.

Let him kiss me with the kisses of his mouth. Would you apply it to Christ? Nothing is more pleasing. Would you apply it to your soul? Nothing is more delightful. Let him kiss me: he sees that you are clean from all sin, because offences are of the earth; therefore he judges you worthy of the heavenly sacraments, and therefore invites you to the heavenly banquet, that He may kiss you with the kisses of his mouth. Yet, on account of what follows, your soul, or the human condition, or the Church, saw herself cleansed from all sins, worthy to approach the altar of God. For what is the altar but the form of the body of Christ? She saw the wonderful sacraments, and says: Let him kiss me with the kisses of his mouth; that is, let Christ imprint a kiss on me. Why? Because:

Your breasts are better than wine, that is, better are your senses, better your sacraments than wine, than that wine which, although it has sweetness, has gladness, has grace, yet in it is worldly gladness, but in you is spiritual delight. Even then, therefore, Solomon was setting forth the nuptials either of Christ and the Church, or of spirit and flesh and soul. And, as though despising all her own delights and pleasures, longing to cleave to the heavenly commandments, she says: for the precepts of your testaments are excellent above every craving of the flesh and the pleasure of the world; for she remembered that she had formerly fallen in this way in Eve, when she preferred the pleasure of the body to the heavenly commandments. Showing, then, that she loves not only the beauty of the Word and, as it were, his face, but all that is within him, she adds to the grace of the kisses: For your breasts, she says, are good beyond wine, and the fragrance of your ointments is above all spices. She asked for a kiss; God the Word poured himself wholly into her, and bared to her his breasts, that is, his doctrines and the teachings of inward wisdom, and was fragrant with the sweet fragrance of his ointments: captivated by these, she says that the delight of divine knowledge is richer than the gladness of every bodily pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
