[[commentary]]
quote='''
But why do we doubt? The church has believed in his goodness all these ages and has confessed its faith in the saying, "Let him kiss me with the kisses of his mouth; for your breasts are better than wine," and again, "And your throat is like the goodliest wine." Of his goodness, therefore, he nourishes us with the breasts of the law and grace, soothing our sorrows by telling of heavenly things. And do we then deny his goodness, when he is the manifestation of goodness, expressing in his person the likeness of the eternal bounty, even as we showed above that it was written, that he is the spotless reflection and counterpart of that bounty?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FExposition%2520of%2520the%2520Christian%2520Faith%2FBook%25202.html'
source_title="Exposition of the Christian Faith 2.2.32"

[[commentary]]
quote='''
"You gave me no kiss, but she, from the moment she entered, has not ceased to kiss my feet." A kiss is a mark of love. How, then, can a Jew have a kiss, who has not known peace, who has not received peace from Christ when he said, "My peace I give you, my peace I leave unto you"? The synagogue has no kiss, but the church has, for she waited and loved and said, "Let him kiss me with the kiss of his mouth." She wished with his kiss to quench gradually the burning of the long desire that had grown with longing for the Lord's coming; she wished to satisfy her thirst with this boon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252062.html'
source_title="LETTER 62, TO HIS SISTER"

[[commentary]]
quote='''
But the church does not cease to kiss Christ's feet, and she demands not one but many kisses in the Song of Solomon, since like blessed Mary she listens to his every saying, she receives his every word, when the gospel or prophets are read, and she keeps all these words in her heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FLetters%2FLetter%252062.html'
source_title="LETTER 62, TO HIS SISTER"

[[commentary]]
quote='''
Having embraced the Word of God, [the soul] desires him above every beauty; she loves him above every joy; she is delighted with him above every perfume; she wishes often to see, often to gaze, often to be drawn to him that she may follow. "Your name," she says, "is as oil poured out," and that is why we maidens love you and vie with one another but cannot attain to you. Draw us that we may run after you, that from the odor of ointments we may receive the power to follow you.
'''
source_url=''
source_title="LETTER 79, TO LAYMEN"

[[commentary]]
quote='''
So either the soul of the patriarch, seeing the mystery of Christ, seeing Rebecca coming with vessels of gold and silver like the Church with the people of the nations, and marvelling at the beauty of the Word and of his sacraments, says: let him kiss me with the kisses of his mouth; or Rebecca, seeing the true Isaac, that true joy, the true gladness, desires to kiss him.

What, then, is: let him kiss me with the kisses of his mouth? Consider either the Church, kept in suspense through many ages, since the Lord's coming had long ago been promised to her through the prophets, or the soul which, raising herself from the body, having renounced luxury and delights and fleshly pleasures, and stripped also of care for worldly vanities, has long been yearning for the infusion of the divine presence into herself and for the grace of the saving Word: consider how she is wasted with grief because he comes late, and is afflicted, and so, as one wounded by love, since she cannot bear his delays, turns to the Father and asks him to send her God the Word, and declares the cause of her impatience, saying: let him kiss me with the kisses of his mouth. She seeks not one kiss but many kisses, so that she may satisfy her desire; for she who loves is not content with the stinginess of a single kiss, but demands many, claims many, and in this way is accustomed to commend herself the more to the beloved. Indeed, that woman in the Gospel was approved for this, because she has not ceased he says to kiss my feet. And therefore her many sins are forgiven her, because she loved much. So this soul too desires many kisses of the Word, that she may be enlightened with the light of divine knowledge. For this is the kiss of the Word, namely the light of sacred knowledge; for God the Word kisses us when he enlightens our heart and the very ruling part of man with the spirit of divine knowledge. Endowed with this nuptial pledge of love, the soul, glad and exulting, says: I opened my mouth and drew in the spirit. For a kiss is that by which lovers cleave to one another and, as it were, enjoy the sweetness of an inner grace. Through this kiss the soul cleaves to God the Word, for through it the spirit of the one who kisses is poured over into her, just as those also who kiss each other are not content with a touching of the lips, but seem to pour their spirit into one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 3"
