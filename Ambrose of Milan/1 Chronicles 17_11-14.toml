[[commentary]]
quote='''
That all these things fit Christ is marked by evident oracles. Nor could the fruit of the divine power be diverted to the favour of Solomon, who was David's son, whose end is known beyond doubt; for there was an end of Solomon's kingdom and of his peace, as is shown by the readings of Kings. Christ is the one whose kingdom has no end. Then, Solomon ruled over no nations, but Christ gathered the Church from the nations. Lastly, while David was living Solomon was both born and attained the kingdom, but he who is promised is shown to be going to arise after David's death, as you have it: When your days are fulfilled and you sleep with your fathers, I will raise up of your seed one who will be from your womb, and I will prepare his kingdom. He will build me a house, and I will set up his throne for ever. Did Solomon reign for ever, who reigned only forty years? I will be he says to him a father, and he will be to me a son — who is that proper Son of God, but he to whom it was said: You are my Son, today I have begotten you? — And I will not scatter my mercy from him, and I will keep him faithful in my house and in his kingdom for ever? But that Solomon erred so gravely, perhaps for this reason, lest men should err and it be believed that the promise had flowed down to him, we have learned from the series of the divine readings; for he built a temple to the idol Astarte for love of a woman, and the Lord was angry with Solomon. If, then, he both began to reign while David was alive — for so you have it that, when it was announced to David that Solomon was reigning, the king worshipped on his bed and said: Blessed be the Lord God of Israel. Who has given me today of my seed one sitting on my throne, and my eyes see it — if he erred, if he offended, you see that the series of the promise pledged Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
