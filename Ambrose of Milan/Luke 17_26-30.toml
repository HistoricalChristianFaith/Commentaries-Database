[[commentary]]
quote='''
And he rightly asserts that the cause of the flood and of the burning and of the judgment proceeded from our sins, because God did not create evil, but our own deserts found it for themselves.

They were eating, indeed, and drinking, they were taking wives and being given in marriage,

not that marriages are condemned — for neither is food condemned, since in the one lies the support of succession, in the other the support of nature; otherwise we should have to go out of this world — but in all things measure is sought, and whatever, moreover, is more abundant is from evil. Let there be some consent for a time, that we may be free for prayer; let there be, amid the cares of the world and the surfeit of intemperance, some sobriety of religion and some truce of chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
