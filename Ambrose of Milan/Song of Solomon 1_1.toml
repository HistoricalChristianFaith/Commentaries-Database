[[commentary]]
quote='''
Let him kiss me with the kiss of his mouth (Song 1:1): here it is not the incitements of foulness but the mysteries of chastity that are celebrated, where the matter is treated spiritually, and with a kind of loving contemplation, concerning the nuptials and the union of Christ and the Church, of uncreated spirit and created, of flesh and spirit. Let us therefore circumcise our heart: let us seek nothing base, nothing bodily; and everything earthly is base. Let us therefore set down nothing earthly, nothing carnal, nothing worldly, nothing bodily, nothing light and changeable in these heavenly words; for the words indeed of the Lord are chaste words, so that in them the spotless and modest purity of the heavenly mysteries may shine forth through spiritual interpretation. Let us not, by some adulterous notion, mingle earthly things with divine, nor violate that inviolable sacrament of the prophetic vision or of the everlasting oracle by the measure of our own nature. For whether it is a matter of kisses or of such things, whatever is offered to religion is wholly fitting, so that we should blush at no service that advances the worship and observance of Christ: as in that dancing of David before the ark; for that dancing was not the companion of delights and luxury, but meant that each one should lift up an unwearied body, and not let his limbs lie sluggish on the ground or grow numb with slow steps. For this teaching we did not invent, but received; so did the heavenly doctrine establish the order of the mystical song.

Let him kiss me with the kisses of his mouth; for your breasts are good, better than wine, and the fragrance of your ointments is above all spices. Your name is ointment emptied out (ibid.). This whole passage of delights sounds of play, stirs applause, provokes love. Therefore, she says, the maidens have loved you, and have drawn you; let us run after the fragrance of your ointments. The king has brought me into his tabernacle (ibid. 3). She began with kisses so as to come to the tabernacle; and she, impatient for the Lord's labor and for virtue put to exercise, is moved to open the bolts with her hand, to go out into the field, to dwell in the villages; yet in the beginning she runs after the fragrance of the ointment, and when she has come into the tabernacle, she will exchange the ointment for the villages. Finally, see what she comes to.

If it is a wall, she says, let us build upon it towers of silver (Song 8:9). She who was playing with kisses now raises towers, so that, towered with the precious pinnacles of the saints, she may not only frustrate hostile assaults but also build the safe bulwarks of good merits. Even in these temporal marriages the bride is applauded before she is commanded, lest harsh commands give offense before love, fostered by endearments, takes root. The heifer learns to love the sound of a kind of clapping, so that she may not refuse the yoke on her neck; and so she is accustomed to the word of playfulness before the whip of discipline. But once she has put her neck under the yoke, the rein constrains her, the goad urges her, her companions pull, and her yoke-mate encourages her. So too our Virgin had first to play in holy love: to admire the golden supports of the heavenly bed, and at the very entrance of the nuptials to see the doorposts crowned with garlands of leaves, and to drink in the delights of the resounding choir within; lest, made fearful, she should withdraw herself from the Lord's yoke before, being called, she bowed to it. For we must know certain steps of progress and their order, what ought to come first and what after; for to know what you are doing and not to know the order of doing it is not perfect knowledge, since things out of their order commonly give offense. And so, since there are as many opinions as there are men, if anything in our discourse is clear and refined, let all read it; if anything is mellowed, let the more mature approve it; if anything is modest, let it cling to the heart and tinge the cheeks; if anything is flowery, let flowering youth not disapprove of it. We had to stir up the bride's love, for it is written: You shall love the Lord your God (Deut. 6:5): we had to adorn the bride's hair at the wedding with certain curling-irons of speech, for it is written: Clap your hand, and strike with your foot (Ezek. 21:14): we had to strew the everlasting bridal chambers with roses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"

[[commentary]]
quote='''
Life is to be sought before doctrine; for a good life has grace even without doctrine, while doctrine without life has no integrity, For wisdom does not enter into a malevolent soul (Wisd. 1:4): and therefore he says: The wicked will seek me, and will not find me (Prov. 1:28): because the eye of the mind is blinded by wickedness, and, when iniquity darkens it, it cannot find the deep mysteries. First, then, the warfare of life must be practised, and morals corrected. When we have set these in order for their due course, so that there is correction of offence and the grace of purity, then let us come to the study of acquiring knowledge, in its own order and way. First, therefore, come moral things, second mystical: in the former is life, in the latter knowledge; so that, if you seek perfection, there is neither life without knowledge nor knowledge without life, but each supports the other. Following this order of instruction, Solomon wrote the book of Proverbs, in which he set out the moral part more fully, the natural part in Ecclesiastes, the mystical in the Song of Songs: although, if you examine diligently, you will find many mystical things in Proverbs too, and the sweetness of moral things in the Song of Songs. For this is certainly mystical: Wisdom has built herself a house, and set up seven pillars, she has slain her victims, etc. (Prov. 9:1). For in the Song of Songs the mystical shines out in that which is moral, in which the sweetness of endearments and the affection of a lover are expressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
