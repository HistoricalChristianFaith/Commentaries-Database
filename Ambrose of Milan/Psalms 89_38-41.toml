[[commentary]]
quote='''
And therefore let us not be in the flesh, but in spirit cleave to the Lord Jesus, who in Psalm 88 (89) says that he was cast off for us: But you have cast off for nothing, you have put off your anointed; you have overturned the covenant of your servant. And so, cast off for us, he became a reproach to his neighbours; for he took up the reproach of the cross, so as to clothe us with the glory of his resurrection. He seems cast off as one dead, and drenched with confusion as one crucified; but blessed for ever is he who took away the curse and procured the grace of blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
