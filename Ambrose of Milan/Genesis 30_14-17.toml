[[commentary]]
quote='''
We read also that holy Rachel received mandrakes from her sister Leah, so that she would grant her to sleep with holy Jacob that night. Reuben the firstborn had brought the mandrakes to his mother Leah, who, with her bleary eyes, took on the figure of the Synagogue; because she could not see the grace of Christ, the gaze of her weak mind being dulled. By this it is declared that the fruits which the Synagogue had formerly received from the firstborn Son of God, she yielded to the Church. But because, through the union of that night which she had asked for, Leah conceived and bore an heir of her posterity, she fulfilled the mystery; since, when the apostles believed, the remnant of the Jews was saved through the election of grace; and so the Church says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
