[[commentary]]
quote='''
And because the tribes of Judah and Levi were joined by the intermingling of their descent, Matthew therefore describes his family from the tribe of Judah. And the Apostle says: For our Lord sprang from Judah, so that from the tribe of Levi a priestly inheritance, full of holiness, might be reckoned to him, and from the tribe of Judah, from which came David and Solomon and the other kings, the splendour of a royal succession might shine forth, in order that the same one might be shown by the testimony of the Scriptures to be king and priest. And rightly holy Jacob poured himself out over the grace of Judah, saying: Judah, your brothers shall praise you; your hands shall be upon the back of your enemies, the sons of your father shall worship you. Judah is a lion's whelp. From a shoot, my son, you have come up for me. Lying down you slept like a lion and like a whelp: who will rouse him? A judge shall not be lacking from Judah, nor a prince from his thighs, until he comes for whom it is laid up, and he is the expectation of the nations: binding his ass to the vine, and to the haircloth the colt of his ass, he will wash his robe in wine and his mantle in the blood of the grape: his eyes are cheerful from wine and his teeth whiter than milk.

The address seems indeed to be directed to Judah the patriarch, but it is that later Judah, the true confessor, who is expressed, who was born of that tribe, who alone is praised by his brothers, of whom he says: I will declare your name to my brothers, Lord by nature, brother by grace, whose hands, which he stretched out to an unbelieving people, are upon the back of the enemies. For with the same hands and by the same passion he protected his own and subjugated the adverse powers, and made subject to himself all who have no share in faith and piety. Of these the Father says to the Son: And you shall rule in the midst of your enemies. It was their own malice that made them enemies, not Christ's will. In this is the great grace of the Lord. For the spiritual wickednesses which formerly were wont to bend our neck under the yoke of captivity, so that David himself wrote that he in some way felt the hands of those who triumphed over him, saying: Upon my back sinners have wrought, these same are now made subject to Christ's triumph and subjected as it were to his hands, that is, to his deeds and works, and undergo the hardship of a perpetual captivity. He it is, surely, who is worshipped by the sons of his father, when he is worshipped by us, whom he himself has allowed to call upon his Father as our Father, he whose servant it is a virtue to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 4"
