[[commentary]]
quote='''
There come back to memory the words of the holy woman, saying to her sons: 'I bore you, I poured into you the juice of milk: do not lose your nobility'. In this way other mothers are accustomed to call their sons back from martyrdom, not to call them to it. But she placed a mother's affection in this, that she should persuade her sons to a life everlasting rather than temporal. So the devout mother watched the contests of her sons and, though she was shaken by the fellow-suffering of a mother's inward parts, she pressed down her grief by the zeal of devotion; and when Antiochus offered it, though she could have chosen the safety of her sons, she preferred the danger, and, stifling the groans of nature, she wished the punishment of her sons to be increased, so that death might approach the more quickly. We see the mother's prayers turned round upon her sons: that she might leave none of them surviving, but might win them all as co-heirs of a devout death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Jacob%2520and%2520the%2520Blessed%2520Life.html'
source_title="On Jacob and the Blessed Life, Book 2, Chapter 12"
