[[commentary]]
quote='''
There follows: All the day my shame is against me, and the confusion of my face has covered me. What does it mean that this psalm is spoken sometimes in the person of one, sometimes in the person of many? For from the beginning it started with many, as in: O God, with our ears we have heard, and the rest that follows; then he says: You are yourself my king and my God; again: In you we will toss our enemies; and afterwards: I will not hope in my bow, and: In God we shall be praised all the day, and: All the day my shame is against me. What does this change mean, which is frequently repeated in the psalms, as also in Psalm 108 (109) he says: O God, do not keep silent about my praise, for the mouth of the sinner and the mouth of the deceitful is opened against me? This is of one; there follows of many: They have spoken against me with a deceitful tongue, and hatred in return for my love. Then of one: Set a sinner over him. In Psalm 108 (109) one part seems to be referred to the people of the Jews, another to Judas the betrayer: when things are said in the plural, to the people; when in the singular, to Judas. Here too we can say that what is said in the plural is referred to the saints, what in the singular, to our Lord Jesus Christ, because it can be thought that he spoke in the prophet both for many and for himself, and therefore said: My shame is against me, which is called ἐντροπή. Now ἐντροπὴ is when someone wishes to strike shame into another, so as to bend him from his purpose, as in: Let him come down now from the cross, and we believe him. He trusts in God; let him deliver him now. And he says beautifully 'all the day', because the incarnation of our Lord Jesus Christ brought light to the world. It is, then, the day of the incarnation, of which the same Lord says: Walk while you have the light, and: Abraham saw my day. This shame, then, has confusion in it; hence Symmachus too: All the day, he says, my confusion is against me. And what is the confusion of Christ but the cross, in that he hung naked on it? And well 'all the day', because from when he was fixed to the cross until the ninth hour there was darkness, and after the ninth hour the light shone again until evening. This day is the first of the three. Yet the choir of the saints too can speak of itself both in the plural and in the singular. For a choir has, as it were, a single person, but it is a number of many, as in that saying: This people honours me with their lips, but their heart is far from me.

But what is the confusion which covered the Lord Jesus, since sins cause confusion — for it is they which cover the sinner —, whereas he committed no sin? But just as there is a confusion which brings sin, so there is a confusion which abolishes sin, like the confusion of the cross of our Lord Jesus Christ, through which sins are cleansed. Every confusion too is good which you undergo for the name of Christ, and exceedingly glorious, if, for example, in a persecution there is a law that a Christian be scourged, that he lose his rank, that he be deprived of his privilege, that he be led into chains. This confusion surely, even if it has no privilege, has the glory of a devout confession. There is also the confusion of Christ, as he himself says: Whoever shall have been confounded at me before men, I too will be confounded at him before my Father who is in heaven. Good, then, is this confusion; yet to many this confusion of Christ is bitter, that is, to unbelievers, but pleasant to believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
