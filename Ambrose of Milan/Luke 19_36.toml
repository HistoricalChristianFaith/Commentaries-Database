[[commentary]]
quote='''
But if you desire not to be shaken, set a washed footstep upon those garments of the saints. For beware lest you walk with muddy feet; beware lest with sideways steps you abandon the paths of the prophetic ways that have been laid down for you. For so that the advance of the Gentiles who were to come might be safer, those who went before Jesus paved the path with their own clothing as far as the temple of God. So that you might walk without stumbling, the disciples of the Lord, stripping themselves of the garment of their own body, have strewn the way for you by their martyrdom amid the hostility of the crowds. Yet if anyone wishes to take it thus, we do not object: that this colt was already walking upon the garments of the Jews.

But what the broken-off branches mean, which are certainly wont to entangle the steps of those who walk, I should indeed be in doubt, had not the good husbandman of the whole world taught me in the earlier passages that now the axe is laid to the roots of the trees, to cut down the barren ones at the coming of the Lord Savior and to lay low on the ground the empty glory of the unfruitful Gentiles, to be trodden down by the feet of the faithful, so that the nations, by the spirit of a renewed mind, might sprout like the shoots of young trees from old stumps.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
