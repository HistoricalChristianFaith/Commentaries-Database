[[commentary]]
quote='''
Who has given these laws to the turtle dove? A search for a human law-giver will not bring results. No one has ventured to propound laws for these birds. Not even Paul has succeeded in doing so in the question as to whether a widow should remarry or not. He says: ‘I desire therefore that the younger widows marry, bear children, rule their households and give the adversary no occasion for abusing us.’ And elsewhere: ‘It is good for them if they so remain. But if they do not have the self-control, let them marry, for it is better to marry than to burn.’ Paul wishes that women should do that which is customary with the turtle doves. Also, he exhorts the younger widows to marry because our women are unable to maintain the chaste life of these birds. God has therefore infused into the turtle dove this sentiment for the virtuous practice of continency. He alone has the power to prescribe the laws which all are obliged to follow. The turtle dove is not inflamed by the flower of youth, is not tempted by occasional enticements, and cannot break her first pledge, because she knows how to preserve the chastity she promised at the time of her first marriage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
