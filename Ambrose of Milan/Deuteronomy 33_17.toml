[[commentary]]
quote='''
The firstborn of a bull is his beauty, having the horns of a unicorn, with which he will toss the nations. And a good bull he is, as an offering for sins and the victim of the whole world, that he might bring all things to peace. His beauty is holy; for every firstborn is holy, as we have shown elsewhere; hence Levi deserved to be called firstborn not by order of age but by the prerogative of a sacred succession. And truly holy is his beauty, of whom it is written as he rises again: beautiful in form beyond the sons of men, because he is the firstborn from the dead, having the horns of a unicorn. But since he said horns, we must ask how he came to put 'of a unicorn', since the unicorn itself is not found among the kinds of wild beasts, as those skilled in such things say. And therefore we ought rather to take it as the one Word, because the substantial Word of God is one, not many words. Hence Hannah too says: the Lord judges the ends of the earth, and he will give strength to the king and will exalt the horn of his Christ, and Isaiah says: a vineyard was made for the beloved on a horn in a fertile place, since in the only-begotten Son of God the Church flourishes, holding the one Word of God, in whom is the fullness of power and wisdom, by whose fertility the harvest of faith has sprung up. This Word the saints follow.

Ten thousands, he says, of Ephraim and thousands of Manasseh, that is: that he may be lord both of the Jews and of the Gentiles, and from both peoples acquire for himself the fullness of the Church. And therefore holy Jacob placed his right hand upon Ephraim, because you read her saying in the Song of Songs: my kinsman is white and ruddy, chosen out of ten thousands. Indeed, the young women too extolled David, the forefather of Mary, from whose line Christ was born through the Virgin's childbearing, in ten thousands, but Saul in thousands, although out of reverence they ought rather to have given the greater weight to the king. He, then, who has exalted the horn of Christ by confessing his glory himself also receives horns. Hence the saints too are called unicorns in a little verse of the psalm: and the beloved like the son of unicorns. For just as an animal of this kind, when its horns spring up, signifies the advance of a fuller age, so when horns have begun to sprout from a certain head of our soul, they seem to signify the advance of a more perfect virtue, and they grow until they are complete. With this horn the Lord Jesus broke the nations in pieces, that he might crush superstition and restore salvation, as he himself says: I will strike and I will heal. And therefore the prophet, as an imitator of this bull, says: in you we will toss our enemies, that is, destroying every height that exalts itself against the knowledge of God. And therefore, according to the Law, the clean animals have horns; for the Law is spiritual. For those who can drive back the allurements of this world by the word of God and the observance of virtue seem to be armed with horns, as with certain weapons of their head. And rightly, too, the power of wondrous speech is called a trumpet of horn, which kindles the good soldiers of Christ to battle, so that we may carry off spoils from the enemy, the devil. We are, then, in the battle line, and we see very many of our own held captive in the enemy's camp. These we must free from the most heavy yoke of slavery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"

[[commentary]]
quote='''
Ten thousands, says Jacob, of Ephraim, and thousands of Manasseh: that is, that he may rule over both Jews and Gentiles, and from both peoples acquire for himself the fullness of the Church. And therefore holy Jacob placed his right hand upon Ephraim, because, as you read, the Church says in the Song of Songs: My brother is white and ruddy, chosen out of ten thousands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
