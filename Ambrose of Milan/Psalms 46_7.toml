[[commentary]]
quote='''
But after the voice of the Lord resounded in the Gospel, the prophet dares to say: The God of powers is with us. Well does he say: The God of powers is with us, who believed that a virgin conceived in her womb and brought forth. We too dare to say: The God of powers is with us, after Emmanuel, that is, God, began to be with us. Where, then, Emmanuel is, there the God of powers is with us.

Our upholder, the God of Jacob. Let us imitate, then, the patriarch Jacob, his fragrance, his virtue, his labour. For just as we ought to do the works of Abraham, so as to deserve rightly to be called his sons, so also we ought to undergo the exercises and contests of holy Jacob, so that the God of Jacob may be believed to be our God. For if he does not recognize in us the works of Jacob or, since we cannot equal him, the zeal for his work and faith, how will he deign to help us as the God of Jacob?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
