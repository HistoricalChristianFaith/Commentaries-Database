[[commentary]]
quote='''
Isaac dug wells, and very many indeed, which his father had dug and which the foreigners had filled up after the death of Abraham his father. Above the rest, however, he dug these wells: one in the valley of Gerar, and he found there a well of living water, and the shepherds of Gerar quarrelled with the shepherds of Isaac, because they claimed the water of this well for themselves as their own, and he called its name Injustice. And he dug another well, over which a dispute arose, and he gave it the name Enmities. And he dug a third, over which no quarrel broke out among the shepherds, and he called it Breadth. He dug also a well and found no water in it, and he called it the well of the Oath.

Who, reading this, would think that these were earthly rather than spiritual works, that either Abraham or Isaac dug wells, patriarchs, that is, so great, or even Jacob, as we find in the Gospel, men who were as it were fountains of the human race, and especially of devotion and faith? For what is a well of living water but the depth of profound doctrine? Hence also Hagar saw an angel at a well, and Jacob found himself a wife, Rachel, at a well; Moses too laid down beside a well the first claims of his future marriage.

From the well of vision, then, Isaac began to open the wells, and in good order, so that the water of this well might first wash and refresh the rational part of the soul and its eye, so as to make its sight clearer. He dug also several other wells. Hence it is also written: drink water from your own vessels and from the fountains of your wells. The more of them there are, the richer is the overflowing of graces. Yet he dug the well which his father Abraham had dug, over which the shepherds of Gerar, that is, of the wall, quarrelled — for where there is a wall, there is division between those who oppose one another, there is injustice — and therefore he called it Injustice. He dug another too, and, when dissension arose, he called it Enmities. In these the moral teaching seems to shine forth, because, when the partition of the wall was taken away, the enmities in the flesh of man were dissolved and both were made one, in figure through Isaac, in truth through Christ; and rightly was pure water afterwards found in that well, as being moral teaching, useful for drawing. And the well of Breadth, what else does it signify but the teaching about natural things? For which reason it is also called Breadth, because he who has passed beyond these worldly and sensible things is now at rest and secure, without contention, without quarrel. Hence, when the adverse and foreign thoughts have now been overcome — for what is so foreign as all worldly things, which cannot be everlasting? — the wise man can say: the Lord has made room for us and increased us upon the earth, because he has transcended earthly things. Last is the well of the Oath, at which God appeared to him and said to him: do not fear; for I am with you, and blessed him. This teaching is now mystical.

You have this in Solomon, for his Proverbs are moral, Ecclesiastes is natural, in which he as it were despises the vanities of this world, and his Song of Songs is mystical. You have it also in the prophet: sow for yourselves unto justice, gather the vintage unto the fruit of life, light for yourselves the light of knowledge. To have the light of knowledge is to have the perfection of love. And therefore it was said: do not fear; for love casts fear out. And so that we may know that Solomon too interpreted these wells in such a way as to refer them to moral, natural and mystical teaching, he set these wells in each of his books which he wrote on moral, natural or mystical matters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"
