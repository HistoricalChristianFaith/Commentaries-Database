[[commentary]]
quote='''
But not content merely with these limits of virtue, holy Tobias also knew that a reward must be paid to the hired servant. He offered him even a half, [and deservedly] instead of a hired servant he found an angel! And whence do you know that you may not defraud some just man of his hire—this is worse if he be infirm, for woe to him that shall scandalize one of these little ones. How do you know whether there be an angel in him? For we ought not to doubt that there can be an angel in the hired servant, since Christ can be, who is accustomed to be in the least.

Give the hired servant his reward therefore and do not defraud him of the price of his labor, because you too are a hired servant of Christ, and He has sent you to His vineyard, and a heavenly reward is laid up for you. Do not therefore injure the servant working in truth nor the hired servant giving his life, do not despise the needy man who spends his life at his labor and maintains it by his hire. For this is to kill a man, to deny him the succor required for his life. You too are a hired servant on this earth; give his reward to the hired servant, that you too may be able to say to the Lord when you pray: Give a reward to them that uphold thee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 24"
