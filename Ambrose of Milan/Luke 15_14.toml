[[commentary]]
quote='''
There came a famine through that region: a famine not of feasts but of good works and virtues. What fasts are more pitiable? For he who withdraws from the word of God hungers, because man lives not by bread alone but by every word of God. He who withdraws from the fountain thirsts, he who withdraws from the treasure is in want, he who withdraws from wisdom is dulled, he who withdraws from virtue is dissolved. Rightly, therefore, did this one begin to be in want, who abandoned the treasures of the wisdom and knowledge of God and the depth of the heavenly riches. He began, then, to be in want and to suffer famine for this reason, because nothing is enough for prodigal pleasure. He who does not know how to be filled with everlasting food always suffers hunger for himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
