[[commentary]]
quote='''
Luke too seems not to have omitted this, when he adds Zacchaeus, who, little in stature, that is, raised by no dignity of inborn nobility, slight in merits, like the people of the nations, having heard of the coming of the Lord Savior, whom his own had not received, longed to see him. But no one easily sees Jesus, no one set on the earth can see Jesus. And because he had neither prophets nor a kingdom, as a grace of natural beauty, he climbed into the sycamore, trampling, that is, the vanity of the Jews under his foot, and correcting also the errors of an earlier age; and therefore he received Jesus into the hospitality of his inner house. And he did well to climb a tree, so that a good tree might bear good fruits, and that he, cut from the natural wild olive and grafted contrary to nature into the good olive, might be able to bear the fruit of the law; for the root is holy, even if the branches are useless, whose fruitless glory the people of the Gentiles has surpassed by faith in the resurrection, as by a kind of lifting up of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
