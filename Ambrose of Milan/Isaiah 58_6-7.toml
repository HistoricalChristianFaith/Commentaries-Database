[[commentary]]
quote='''
How clearly the custom of the rich is portrayed! They are made sad if they are not seizing the property of others; they renounce food, they fast, not that they may lessen their sin but that they may commit crime. You may see them at such times coming to church, dutiful, humble, and assiduous, in order that they may deserve to obtain the accomplishment of their wickedness. But to them God says: Not this fast have I chosen, not if thou shouldst wind thy head about like a circle and spread also sackcloth and ashes, and not thus will ye call an acceptable fast. Not such a fast have I chosen, says the Lord. Loose every band of injustice, loose the bonds of violent contracts, let them that are broken go free, and tear asunder every unjust writing. Deal thy bread to the hungry, and bring the needy and harborless into thy house. If thou shalt see one naked, cover him, and thou shalt not despise the domestics of thy seed. Then shall thy morning light arise, and thy health shall speedily arise, and thy justice shall go before thee, and the majesty of the Lord shall surround thee. Then shalt thou call, and God shall hear thee; even while thou speakest, He shall say: Here I am.

Do you hear, O rich man, what the Lord God says? You too come to church, not to bestow anything upon a poor man but to take away. You fast, not that the cost of your banquet may profit the needy but that you may obtain spoil from those in want. What will you with your book and paper and seal and writing and bond of the law? You have not heard: Loose every band of injustice, loose the bonds of violent contracts, let them that are broken go free, and tear asunder every unjust writing. You present to me records, I recite to you the law of God; you write with ink, I repeat to you the oracles of the prophets written by the Spirit of God; you fabricate false testimonies, I ask for the testimony of your conscience, which, as your judge, you will not be able to escape or avoid; whose testimony you will not be able to refute on that day on which God will reveal the secrets of men. You say: I will pull down my barns; the Lord says: "Suffer rather whatever is in your barn to be distributed to the poor, suffer those cellars of yours to benefit the needy." You say: I will build greater, and into them will I gather all things that are grown to me; the Lord says: Deal thy bread to the hungry. You say: "I will take his house from the poor man", but the Lord says: Bring the needy and harborless into thy house. How do you wish God to hear you, O rich man, when you do not think that God should be heard? If assent be not given to the rich man's will, a pretext is fabricated; it is reckoned an injustice to God if a rich man's claim is opposed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 10"
