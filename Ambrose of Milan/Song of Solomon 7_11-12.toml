[[commentary]]
quote='''
Come, my brother, let us go out into the field, let us rest in the villages, let us rise early in the vineyards, let us see whether the vine has flowered. Many fields have fruits; but that one is better which abounds both in fruits and in flowers. The field of the Church, then, is fertile in various riches. Here you may see the buds of virginity blooming with flower; there, as in the open spaces of a wood, widowhood strong in its gravity; elsewhere, as the rich crop of the Church, the harvest of marriage filling the granaries of the world, and, as it were, the winepresses of the Lord Jesus overflowing with the produce of the wedded vineyard, in which the fruit of faithful marriage abounds.

The Bride, having obtained the abundance of her desire, speaks to the Bridegroom: Come, my brother, let us go out into the field, let us rest in the villages, let us rise early to the vineyards. You notice how the Bride invites the Word of God to come to the earth and take away the sins of the world. This field was formerly deserted, unkempt with the briars of our sins, bristling with thorns. The village was the one in which Adam, banished, was binding the heirs of his posterity in perpetual exile. Thither, then, the Church leads Christ, to set Adam free. Then, when the exiles had been released, the field of this world began to have fit cultivators: and that which was formerly barren became fertile through the planting of the eternal vine. Yet not even so does she, glad in her spiritual branches, wander off, but she calls Christ to these vineyards, where there are those who sing psalms and pray, where by night and by day an innocent fruit endures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
