[[commentary]]
quote='''
But mark the mystical number of days. For you remember that for forty days the waters of the deep were poured forth, and by sanctifying a fast of that number of days, He brings before us the returning mercies of a calmer sky. By a fast of so many days also, Moses earned for himself the understanding of the law. Our fathers being for so many years settled in the wilderness, obtained the food of Angels.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Forty moreover days: you recognize a mystical number. For you remember that for so many days the waters of the abyss were poured out, and that, when the prophet had been sanctified by a fast of so many days, the clemency of a clearer sky was poured back; by a fast of so many days holy Moses merited the receiving of the Law; for so many years the fathers, settled in the wilderness, obtained the bread of angels and the grace of heavenly nourishment, and did not merit to enter the land of promise before they had fulfilled the time of the mystical number; by a fast of so many days the Lord's entrance into the Gospel lies open to us. Hence if anyone desires to obtain the glory of the Gospel and the fruit of the resurrection, he must not be a transgressor of the mystical fast, which both Moses in the Law and Christ in his Gospel prescribed, by the authority of both Testaments, to be the faithful contest of virtue.

But what does it mean that the Evangelist noted that the Lord was hungry, when we see nothing of the kind expressed of the fast of Moses and of Elijah? Is the endurance of men stronger than God? But he who could not be hungry in forty days showed that he hungered not for the food of the body but for salvation, and at the same time he did so to provoke the adversary, who was already afraid, having been wounded by the fast of forty days. And so the Lord's hunger is a holy deceit, so that the devil, who, fearing greater things, was already on his guard against him, might, lured by the appearance of hunger, tempt him as a man, lest the triumph be hindered. At the same time learn this mystery: that it was the work of the Holy Spirit, that is, the divine judgment, that Christ should offer himself to be tempted by the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
