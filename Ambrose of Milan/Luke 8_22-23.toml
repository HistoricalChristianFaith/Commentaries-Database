[[commentary]]
quote='''
And so he who understood that he had come to earth for the sake of the divine mystery and the gathering of the Church left his parents and went up into the ship. For no one could sail through this world without Christ, since even those with whom the Lord is present are often troubled by the storm of worldly temptations. And the economy is kept in the apostles, so that you may notice that no one can depart from this course of life without temptation, because temptation is the exercise of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
