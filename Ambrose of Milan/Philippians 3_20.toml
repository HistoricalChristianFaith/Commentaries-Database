[[commentary]]
quote='''
He imitates it who strips himself of pleasures and raises and lifts himself up from earthly delights and places himself in that heavenly dwelling in which Paul, while he was still alive, used to live. Otherwise he would not say: but our way of life is in heaven, which can be referred equally to the confident expectation of merit and to meditation. For there was his meditation, there the way of life of his soul, there his understanding, which certainly was not wont to cling within the narrow confines of this flesh. For the wise man, when he seeks that divine thing, releases his soul from the body and sends away its close company, when he pursues that knowledge of the truth which he desires to be shown to him as it were naked and open, and therefore he seeks to strip himself of the nets, as it were, and the mists of this body. For we cannot grasp that supernal truth with these hands or eyes and ears, since the things that are seen are temporal, but the things that are not seen are eternal. Then, we are often deceived by sight and see most things otherwise than they are; we are deceived also by hearing; and therefore let us contemplate not the things that are seen but those that are not seen, if we do not wish to be deceived. When, then, is our soul not deceived, when does it attain the throne of truth, except when it separates itself from this body and is not deceived and mocked by it? For it is mocked by the sight of the eyes, it is mocked by the hearing of the ears; and therefore let it leave the body and forsake it. Hence the Apostle too cries out: do not touch, do not defile, do not taste, things which all tend to corruption; for the things that serve the indulgence of the body tend to corruption. And therefore, showing that he had found what is true not through indulgence of the body but through the elevation of the soul and humility of heart, he added: but our way of life is in heaven. There, then, let a man seek what is true, what is and abides, and let him gather himself into himself and assemble the whole keen edge of his strength, and not entrust and commit himself to others, but know and understand himself, and recognize that what seems to him to be true is to be followed; what he judges is to be chosen by fleshly delight, let him know to be false, let him flee and withdraw from it, because it is full of deceit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 3"
