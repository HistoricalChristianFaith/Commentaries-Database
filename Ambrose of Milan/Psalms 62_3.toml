[[commentary]]
quote='''
And as he said this, he lifted up his eyes and saw the persecutors on one side, the spiritual wickednesses on the other, gathering together, and said: How long will you rush upon a man, slaying all?, that is: "Why do you hasten to blot out the human race? Do you not know that I have come for the redemption of all? I have offered myself for all, so as to protect all by my offering". "A man", then, we take either for the whole multitude of mankind or, if we take it of one, we understand it as said of himself: you rush, but upon a man, because you cannot rush upon God, as you have elsewhere: Why do you seek to kill me, a man? For the divinity could not be subject to death, but the human nature he had taken up could. If, then, you rush upon me and wish to hold me, why do you wish to kill those who are with me? It is enough for you to have him whom you seek. I do not seek a partner in my passion, I who need no helper for the salvation of all. I do not ask for an envoy, I send no messenger ahead, but I myself, the messenger, offered myself to those who were not seeking me, gave myself up to those who were not seizing me, so as to free those who had been seized in the snares of death. You rush, then, as upon a leaning wall and a battered enclosure, not knowing that I came, not to make the wall lean and to batter the enclosure, but to dissolve it. For I came as peace, to make both one, and dissolving the middle wall of the enclosure, which divided flesh and soul so that they could not be of one mind. And therefore the flesh fought against the soul and could not be subject to its rule, because, through the obstacle of the wall set in the way, it could not obey its steering.

The law of the flesh, then, was opposed to the law of the mind. This partition of old enmities the Lord Jesus took away like a wall, and made the meeting of mind and flesh open to passage, so that, coming together into one, they might follow what was healthful to both. The wall, then, is a kind of rising-up of sins; hence Paul says to the high priest of the Jews: God will begin to strike you, you whitewashed wall; for a wall is built of mud and rubble. From this the Egyptians built cities, when the Jews were forced to make bricks. In Egypt mud was prepared, and the people of God wrought sin there; therefore they groaned, therefore they were heard and freed from sin; therefore the law was given and grace promised, so that the law might cut back sin in part, and grace might forgive it all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
Amid these words he suddenly sees the troops of his pursuers and, set in the midst of dangers, anxious not for himself but for those whom he desired to free, he says: How long will you rush upon a man, slaying all? If you seek me, why do you wish to kill others? I offer myself for many, because for all only he could offer himself who is the author of all. So, as an imitator of him whom he followed, he says: If you seek me, let these go, that the word which Jesus spoke might be fulfilled: that I have not lost any of them "except one" (for the Lord's saying includes this in another book), who nevertheless perished by his own will rather than, he says, being punished by my severity. And though I offer myself freely, you rush upon me and bear down on me as upon a leaning wall and a battered enclosure, that is: I, lately the summit of the noble imperial throne and once the strong wall of an empire spread around the whole Roman world, collapse like a leaning wall or a battered enclosure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
