[[commentary]]
quote='''
And so the holy man tearfully laments the seasons of this life. I perish he says and am carried about by the wind; I ask for burial and do not obtain it. I pray in my toil. And what shall I do?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 1, Chapter 9"
