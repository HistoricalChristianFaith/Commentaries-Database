[[commentary]]
quote='''
He who was spoiled by the soldiers, who was wounded by the spear, that he might heal us by the blood of his sacred wounds, will assuredly answer you (for he is meek and lowly of heart, and gentle in aspect): "Arise, O north wind, and come, O south, and blow upon my garden, that my spices may flow out." For from all parts of the world has the perfume of holy religion increased, and the limbs of the consecrated Virgin have glowed. "You are beautiful, O my love, as Tirzah, comely as Jerusalem." So it is not the beauty of the perishable body, which will come to an end with sickness or old age, but the reputation for good deserts, subject to no accidents and never to perish, which is the beauty of virgins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FConcerning%2520Virgins%2FBook%25201.html'
source_title="Concerning Virginity 1.9.47"

[[commentary]]
quote='''
You are well pleasing, my sister, beautiful as Jerusalem, a wonder like ranks set in order. The truth of love is proved by its perpetuity. And so the Bride is praised by the Bridegroom because she has sought him so well and so constantly. And therefore she is now not only called sister, but is also named well pleasing, as it were pleasing to him; because she has pleased the Father: and beautiful as Jerusalem, a wonder like ranks set in order; because she holds all the mysteries of the eternal city, and is a wonder to all who see her; because she is full, as equity is, and perfect: and having borrowed radiance from the light of the Word, while she always strives toward it, she is also terrible, carried up by a certain order to the summit of the virtues.

You are beautiful, he says, my friend, sweet and comely, etc. And truly beautiful is she who strives toward him of whom it is said: Beautiful in form above the sons of men (Ps. 44 (45):3). Hence let us too direct our mind toward him as much as we can, and let us be in him. Let us hold in our mind that which is beautiful, comely, good; so that by his illumination and radiance our soul may become beautiful, and our mind clear. For if our eyes, when they are covered with some mist, feed on the greenness of the fields, and by the sight of a grove or of a shady hill drive away all the unevenness of an ailing gaze, and the pupils themselves and the eyeballs seem to be colored with a certain wholesome beauty: how much more does this eye of the mind, when it gazes on that highest good, and dwells in it, and feeds on it, grow bright and shine forth! Beautiful as Jerusalem. This, then, is not the beauty of a perishable body, which will perish either by disease or by old age, but a beauty subject to no mishaps, never to die to the good repute of her merits; since she is worthy to be compared no longer to human beings, but to the heavenly ones, whose life she lives on earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
