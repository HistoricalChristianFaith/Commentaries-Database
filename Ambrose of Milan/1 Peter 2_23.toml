[[commentary]]
quote='''
Enemies do this to provoke to wrath: they curse, that we may curse; they accuse, that we may throw back the accusation; they revile, to rouse us to return the insult. Whence Peter finely set down of the Lord Jesus in his epistle that when he was cursed he did not curse, when he suffered he did not threaten. Desiring to shape the ordering of his life to his likeness and image, the righteous man, when accused, is silent; when hurt, forgives; when provoked, lets it pass and does not open his mouth, so as to imitate him who was led like a lamb to the sacrifice and does not open his mouth, and who, though he could have something to answer, prefers to be silent rather than speak.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
