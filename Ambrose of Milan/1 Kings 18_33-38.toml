[[commentary]]
quote='''
Moreover if anyone has not been baptized, let him with all the greater security be converted, receiving the remission of his sins . . . as a kind of fire consumes sins, since Christ baptizes in fire and spirit. Hence, you read of this type in the Books of Kings where Elias placed wood upon the altar and told them to pour water thereupon from urns. And he said, Do the same the second time. And they did it the second time. And he said: Do the same also the third time. [And they did it the third time], and when the water dripped about, Elias prayed and fire descended from heaven. You, O man, are upon an altar, you who are purified by water and whose sin is burned out that life may be renewed; for fire consumes wood and stubble. Do not fear the fire through which you are enlightened. Therefore it is said to you: Come ye to him and be enlightened. Take up the yoke of Christ, do not fear because it is a yoke; hasten because it is light. It does not bruise the neck but adorns it. Why do you hesitate, why do you delay? It does not bind the neck with chains, but it unites the mind by grace; it does not constrain by compulsion, . . .

why do you say that it is not yet time? All times are opportune for indulgence. If I should offer you gold you do not say to me: 'To-morrow I shall come,' but you demand it immediately. No one delays, no one excuses: redemption of the soul is promised, and no one hastens. John baptized unto penance and all Judaea followed him: Christ baptizes in Spirit, Christ dispenses His grace, and is met with scorn. Elias showed the type of baptism and opened heaven which had been closed for three years and six months. How much greater are the rewards of truth! Not the descending rain, indeed, opened heaven, but ascending grace; for no one save by water and the Spirit ascends into the Kingdom of Heaven. Faithlessness had closed heaven to man, but faith opened it.

Heaven even before this was open to men. Therefore Henoch was taken up into heaven. Again it was closed; but Elias opened it, who was taken up in a fiery chariot. And you can ascend if you obtain the grace of the Sacrament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Elijah%2520and%2520Fasting.html'
source_title="On Elijah and Fasting, Chapter 22"
