[[commentary]]
quote='''
Then Sarah's chastity is tested again, so that the chastity of all may be required. For Abimelech too had taken her to himself as wife, and God said to him in the night: behold, you shall die because of the woman. We observe that adultery is punished with death by divine judgement. And therefore he added: but she is living with a husband. Indeed every union of a man and a woman that is not celebrated with the lot of lawful marriage has its own guilt. For learn, you who are reaching toward the grace of baptism as candidates, as it were, of the faith, the sober discipline of continence. No one is permitted to know a woman other than his wife. And therefore the right of marriage has been given to you, lest you fall into the snare and sin with another's woman. You are bound to a wife; do not seek release, because it is not lawful for you to take a wife while your wife is living. For to seek another, too, when you have your own, is the crime of adultery, and this the graver because you think that authority for your sin is to be sought from the law. Guilt is more tolerable if it is hidden than if authority is usurped for guilt; and adultery is not only to sin with another's wife, but anything that lacks the right of marriage; yet this passage teaches that the crime is graver where the rights of a celebrated marriage are violated and a wife's modesty is undone. And therefore, when Abimelech pleaded that he had not known she was another's wife, since the husband himself had said that she was his sister, God answered him: and I knew that you did this with a pure heart, and I spared you, that you should not sin against me. For this reason I did not allow you to touch her. We learn that God is, as it were, the guardian and protector of marriage, who does not allow another's bed to be polluted, and that if anyone does so, he sins against God, whose law he violates and whose grace he breaks. And therefore, because he sins against God, he loses fellowship in the heavenly sacrament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 7"
