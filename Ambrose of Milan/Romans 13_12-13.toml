[[commentary]]
quote='''
Hence, ‘let us walk becomingly as in the day’ and ‘let us lay aside the works of darkness.’ We know that night is passed in sleep and forgetfulness so that the body may find rest. Night is not designed for the performance of any task or of any transaction. Let us not be sharers in feasting and drunkenness, in chambering and immodesty. Let us not say: Darkness and walls cover us and who knows if the Most High will see us. But let there be in us a love of light and an esteem of goodness, so that, as if walking in daylight, we may desire that our works shine in the presence of God. To Him be honor, praise, glory, and power, together with our Lord Jesus Christ and with the Holy Spirit, from eternity and now and always, for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
