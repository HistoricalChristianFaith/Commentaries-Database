[[commentary]]
quote='''
Return therefore the pledges which you hold, since you have found a suitable surety. But still they murmur, maintaining that it is permitted to hold pledges, and they defend themselves by the Law, for they say: It is written in Deuteronomy: If anything is owed to thee by thy neighbor, thou shalt not go to his house to take away a pledge, but thou shalt stand without and the man who owes thee shall bring out his pledge to thee. But if that man be poor thou shalt not sleep in his pledge but thou shalt restore his pledge to him at the going down of the sun, and he shall sleep in his own raiment and bless thee and there shall be mercy for thee before the Lord thy God. And in another place, they say, it is written: Thou shalt not take the nether nor the upper millstone to pledge, for he pledges his life. And in another place: Thou shalt not receive the widow's raiment for a pledge. Whence they argue that certain pledges are forbidden—not all—that is, that of the poor man and the widow, the nether and also the upper millstone it is forbidden to take as pledge.

But since the Lord Himself, through Ezechiel the prophet, proclaims that he is just who has returned a pledge, unjust who has kept it, assuredly he urges that not some special one, but in general every pledge should be returned, since Job says: The writing which I held against anyone, received under oath, I read, putting on my crown, and if I did not tear it up I returned it receiving nothing from the debtor. Since the Lord teaches that nothing ought to be hoped from those to whom we have lent, which we should receive, how, according to law, do they think a pledge should be retained?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 17"

[[commentary]]
quote='''
See to this, lest while you are seeking money you should pledge the nether or the upper millstone. It is the millstone with which flour is prepared, with which the one woman who is taken and the other who is left, grinds grain. Perchance she is taken who always grinds the Word of God, who, that she may have flour, prepares a spiritual meal, who purges out the old leaven that there may be new paste, who guards her lower millstone, who interprets the Scriptures, who preserves for herself her upper millstone. She, however, is left who pledges her lower millstone, who when she has ground something carelessly pledges her upper millstone. What is that stone, I ask? I have read: The stone which the builders rejected, the same is become the head of the corner. Wherefore the upper stone? Because it is the very one which helps those grinding. It is the one which says: Search the Scriptures in which you think that you have life everlasting.

Do not, usurer, take this upper millstone as a pledge, lest you should fall upon it. For whosoever shall fall upon that stone shall be crushed and upon whomsoever it shall fall it will grind him to powder. Nor should you take the pledge of the widow. Each is grave and according to the letter, that you should take away from the needy his occupation and means of livelihood, or that you should take the widow's pledge; but it is more grave if you should retain the word of the soul, which is the widow of the Word, so that you should pronounce the sterility of widowhood upon it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Tobit.html'
source_title="On Tobit, Chapter 21"
