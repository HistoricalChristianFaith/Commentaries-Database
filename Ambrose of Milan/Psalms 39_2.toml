[[commentary]]
quote='''
Therefore, then, he said: I was dumb and was humbled and kept silent from good things, because he knew when he ought to humble himself, and knew when he ought to keep silent. He was dumb, so as not himself to clamour in quarrelsome contention with those who rebuked him; he was humbled, to cast down the swelling of the proud, or to teach them by his own example how they ought to humble themselves. He kept silent from good things, because a good conscience, which rests on its own testimony and is its own judge, needs no defence of words. And therefore the righteous man says: Who will contradict me, or who will resist me? And Paul says: For with me it is a very small thing to be judged by you or by man's day. Against slanderers and sinners the righteous man is content with his own judgement, but he reserves the judgement of his merits to Christ. And therefore he added: He who judges me is the Lord. Most beautifully he chose as judge him who is deceived by no fraud, so that neither do hidden things pass him by nor does the slip of a weak condition offend him, for he knows how to pardon frailty. For everything, then, silence is useful. If you acknowledge the sin, be silent, lest by denying it you make it greater; if you do not acknowledge it, be silent, secure of your innocence. Others' words cannot fasten on you a crime that your own conscience does not admit.

There follows: and my grief was renewed. Still placed on a lower step of virtue, he utters these words: that his grief was renewed by the casting up of old sins, which, blotted out, oblivion had seemed already to have covered over, or the compensation of good works had hidden. Indeed later on, as if stronger, he says: They saw me and shook their heads, because they threatened and could not harm; and he added: They will curse, and you will bless. And this he speaks as one stronger, heedless of injury or shame, since the blessing of the Lord abounded to him in place of all things. Therefore in this Psalm 38 (39), as if in a kind of meditation, yet not yet placed in the full perfection of virtue, he says that his grief has been renewed. For the strongest man does not know how to feel the hurt of a scar, nor can he who is stronger fear a wound. In the very contest of boxers, the stronger usually waits to be provoked by some blow of the weaker, so that, being struck, he may rise up the more fiercely; so strengthened is he by great training and endurance that, as though insensible to pain, he cannot feel the wound: struck, he laughs; provoked, he threatens. But the weaker, if he happens to take the striker's blow on the healed-over scar of an old wound, feels the pain renewed. So it is with one who has his former sins cast up at him, which he duly grieved over and wept for, so that by fitting satisfaction he drew a scar over the wound of his sins. If he is perfect, he keeps silent before his revilers, with no grief renewed in him, because, even if he has sinned, he is secure, since the gifts of God are without repentance, and therefore he is not wont to undo and renew what he has once forgiven, since he himself said: I am, I am he who blots out iniquities, and I will not remember them. But if he is imperfect and unmindful of the heavenly precepts, his grief is restored to him as if the scar had been cut open.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
