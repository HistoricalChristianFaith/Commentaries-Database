[[commentary]]
quote='''
What follows also shows how his image is not found, but perishes, since his image is not found in the city of the Lord, that Jerusalem which is above. For the Lord painted us after his image and likeness, as he himself teaches, saying: Behold, Jerusalem, I have painted your walls. If we have acted well, this heavenly image remains in us; if anyone acts badly, this image is blotted out in him, the image, that is, of him who came down from heaven, and the image of the earthly one is in him. Hence the Apostle too says: As we have borne the image of that earthly one, let us bear also the image of this heavenly one. The images of the good, then, endure and shine forth in that city of God. But if anyone has turned aside to graver sins and has not done penance, his image is abolished or cast out, as Adam was cast out and shut out of paradise. But whoever has conducted himself devoutly and honourably enters into the city of God and brings in his image, so that it may shine in that city of God. O Lord, in your city you will bring their images to nothing, because those who have clothed themselves with works of darkness cannot shine in the light. Let us fetch an example from the world. See how in cities the images of good princes endure, while the images of tyrants are blotted out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FInterrogation%2520of%2520Job%2520and%2520David.html'
source_title="Interrogation of Job and David, Book 3, Chapter 8"
