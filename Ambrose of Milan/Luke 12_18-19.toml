[[commentary]]
quote='''
And he added: And into them will I gather all things that are grown to me, and I will say to my soul: Soul, thou hast much goods. The miser is always deeply worried by abundant crops because he thereby fore-sees a cheapness in food-stuffs. For abundance belongs to all, scarcity is lucrative to the miser alone. He is pleased rather by enormous prices than by the abundance of commodities, and he prefers to have what he alone may sell than what he may sell together with all. See him in fear lest his heap of grain overflow, lest, streaming out over the barns, it may pour upon the poor, and an occasion for some good be obtained by those in want. For himself alone he claims the products of the earth, not because he wishes to use them himself, but because he wishes to deny them to others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Naboth%2520the%2520Jezreelite.html'
source_title="On Naboth the Jezreelite, Chapter 7"
