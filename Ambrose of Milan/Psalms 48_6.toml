[[commentary]]
quote='''
And therefore they were shaken by no small feeling, so that out of dread trembling seized them, as they considered what is written, that in the places of the ungodly the righteous groan. Thus see, I pray you, Peter weeping most bitterly because error had stolen upon him and had bent the virtue of his mind through the lapse of bodily frailty, and rightly rebuked by Christ in a low voice because he had dared to lay claim to steadfastness and had not considered that his nature was liable to fall. And he indeed by grace amended his error, but Judas remained in his crime and persisted in groaning. He was righteous when he was joined to the number of the apostles; but since he was tripped up by the devil, he now laments and groans in the places of the ungodly that he has fallen back from grace into punishment. When, therefore, such men fell, as was Judas the betrayer, or Saul, who had been called to the kingdom by the Lord his God, even strong men trembled.

Then, comparing with how great a contest the end is reached, how great are the afflictions of the righteous, how great the anxieties, what an adversary, how great a struggle in long-continued labour, how great the bitternesses of a stricter purpose, what bonds of continence, what scourges of conscience, they were not a little troubled lest anyone should yield either to such great labours of a more austere life or to its pains. For there are pains there, bitter and heavy; that is, in the Church, in that city of the great king, there are pains as of a woman in labour, until Christ be formed in us. For Paul was not without pain when he saw among the foolish Galatians the too slow progress of his teaching, and therefore he said: My little children, of whom I am in labour again, until Christ be formed in you. The Lord too testifies in the Gospel that the pains of a woman in labour are heavy, when he says: A woman, when she is in labour, has sorrow, because her day has come; but when she has borne the child, she no longer remembers the sorrow for joy, because a man is born into this world. Great, then, is the labour for one to acquire Christ for himself, lest without a helmsman he toss like a ship on the sea of this world. Thus the apostles were sad when Christ told them that he would return to the Father, because they thought that, with their guide absent, they would be forsaken. Christ is the joy; he is also the child with whom he is in labour who has received in the womb of his mind the spirit of salvation. He who has brought forth and nourished exults; he who is in labour is shaken and pierced.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"

[[commentary]]
quote='''
It is good that you should both bring him forth and nourish him. You shall not cook a lamb in its mother's milk, lest it be said to you: Woe to those who are with child and to those who give suck. For Christ was born of Mary in such a way that you should acknowledge him, as the ox acknowledged its owner, and know that he himself created you and he himself possessed your forefathers. Do not nourish him as a little child, but know that he is to be adored as true and perfect God from true and perfect God. For so the magus adored him, that he did not cook a lamb in its mother's milk, but venerated him as the eternal God. Thus, to find him, he looked up at the sky; he therefore did not seek on earth him whom a star shining from heaven was pointing out. Therefore Mary was not in labour with him but brought him forth, because she knew that both Lord and Saviour was to be begotten of her, as she herself testifies, saying: My soul magnifies the Lord, and my spirit has rejoiced in God my Saviour. There, then, are pains as of a woman in labour. It is pain to be in labour, it is pain to nourish him whom from the beginning you ought to hold as perfect.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html"
source_title="Commentaries on the Twelve Davidic Psalms"
