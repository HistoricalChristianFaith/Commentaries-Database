[[commentary]]
quote='''
A virgin moreover very beautiful, whose comeliness no age corrupts. Very beautiful, because he too who acquired her for himself is very beautiful beyond the sons of men. Whom no man had known; for her union was with no man, but was owed to Christ alone. Having a pitcher upon her shoulder, because she washes the acts of all: and because she who washed her own consists of the congregation of the Gentiles, therefore you read that she went down to the spring and filled the pitcher and came up. That Samaritan woman came to the spring, as is written in the Gospel, but she did not go down — it seemed to her a well — nor did she fill a pitcher. Indeed she says: I have no pitcher. She had nothing with which to wash her acts. This woman alone went down, she alone knew the true spring, that is, not the spring of water but of eternal life, to which David said: For with you is the spring of life; in your light we shall see light. And therefore she had something to give to the thirsty, because she believed; for she who did not believe said to this Spring, which wished to give her drink: From where have you living water to give me? But this woman had enough to satisfy not only the servant but also the camels, she who is accustomed not only to water the just but also to fill the unjust. Therefore she received the golden earrings and bracelets that Abraham sent, as rewards of her merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 9"
