[[commentary]]
quote='''
The poor man and the rich man should therefore take heed, because there are temptations for the man of poverty as well as for the man of wealth. And so the wise man says: ‘Give me neither beggary nor riches.’ He tells you how this can be attained. Man has enough when he has a sufficiency, because a wealthy man tends to distend his mind with cares and anxieties, just as he gorges his stomach with rich food. For that reason the wise man prays that he may have what is necessary and adequate, saying: ‘Lest perhaps being filled I should be tempted to deny and say, who sees me? Or being compelled by poverty I should steal and forswear the name of the Lord.’
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
