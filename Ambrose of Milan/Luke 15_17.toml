[[commentary]]
quote='''
He rightly returns to himself, because he departed from himself. For he who returns to God restores himself to himself, and he who departs from Christ rejects himself from himself.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Luke%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But coming to himself he said: how many loaves the hired servants of my father have in abundance! Well does he return to himself who withdrew from himself. For he who goes back to the Lord restores himself to himself, and he who withdraws from Christ disowns himself. And who are the hired servants except those who serve for wages, who are of Israel, not pursuing what is good from zeal for uprightness, nor called forth by the grace of virtue, but by zeal for profit? But the son, who has the pledge of the Holy Spirit in his heart, does not seek the petty gains of worldly wages, for he keeps the right of an heir. There are also hired servants who are hired for the vineyard. Good hired servants are Peter, John, James, to whom it is said: come, I will make you fishers of men. These abound not in husks but in loaves. Indeed they gathered twelve baskets of fragments. O Lord Jesus, would that you might take the husks from us and give us loaves — for you are the steward in the Father's house — O that you would deign to hire us too as hired servants, though we come late! For you hire even at the eleventh hour and deign to pay an equal wage, an equal wage of life, not of glory; for not for all is laid up the crown of righteousness, but for him who can say: I have fought the good fight.

I thought that this should not be passed over, because I know that some say that they are keeping the grace of the washing, or repentance, for themselves until death. First, how do you know whether your soul will be required of you this very night? Next, why should you think that everything can be brought to you while you sit idle? Grant that the grace is one, that the wage is one, yet the prize of victory is different, toward which Paul not in vain stretched himself out, who after the wage of grace still pursued that he might lay hold of the prize, because he knew that, even if the wage of grace was equal, the palm yet belongs to few.

And since we have come into the vineyard of the Lord, let us not go away empty; for it is a delight to gather its fruits, to see its hired servants. For what does it mean that the laborers are hired on one day at different hours, except that a thousand years in the eyes of the Lord are as yesterday which has passed, and an hour in the night? What is the night but that which went before, that the day might draw near? And well an hour in the night, because a thousand years are as one day. He knew the force of this day who said: Jesus Christ is the same yesterday and today and for ever. He too knew that the day is manifold who wrote: this is the day of the generation of heaven and earth, when they were made; on which day God made heaven and earth and every green thing of the field. For when he had described seven days above, he afterwards embraced in one day all that had been made, showing the whole time of the world in the sight of the Lord as one day, because out of what was formless and dark the form of this world came forth by the brightness of the divine work. So if the day is the whole time of the world, it surely has its hours also in the ages, or the ages themselves are hours. And the hours of the day are twelve. Hence well, in a mystery, Christ is the day, whose apostles are twelve, who shone with heavenly light, the turns of grace within them being marked out.

So the householder came and at the first hour hired laborers, perhaps those who from the beginning of the world until the flood deserved to be righteous, of whom he says: and I spoke to you before the light and sent to you my servants the prophets before the light. The third hour begins after the flood, embracing the times of Noah and of the rest, who as good laborers are appointed to the vineyard. That is why Noah was made drunk, as at the midday meal. The sixth and the following hours are marked out by the merits of the patriarchs Abraham, Isaac and Jacob. At the ninth, when the age was already declining and the light of virtue was, as it were, growing pale, the Law and the prophets censured the faded morals of men. The eleventh, and what remains of the day, the holy advent brings forth. Hence he himself also says in the Gospel: walk, while you have the light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
