[[commentary]]
quote='''
Let us hasten, then, to life. If anyone touches life, he lives. Indeed, that woman touched it who touched his fringe and was set free from death, to whom it is said: Your faith has saved you. Go in peace. For if he who touches a dead man is unclean, without doubt he who touches the living one is saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FDeath%2520as%2520a%2520Good.html'
source_title="Death as a Good, Chapter 12"
