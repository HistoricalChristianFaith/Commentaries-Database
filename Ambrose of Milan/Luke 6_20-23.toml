[[commentary]]
quote='''
Now let us say how Saint Luke has embraced eight blessings in four. And indeed we know that there are four cardinal virtues: temperance, justice, prudence, fortitude. He who is poor in spirit is not avaricious; he who weeps is not proud, but is meek and peaceable; he who mourns is humbled; he who is just does not deny what he knows was given to all in common for their use; he who shows mercy bestows of his own; he who gives his own does not seek another's, nor lay a snare for his neighbour.

The virtues, then, are joined to one another and linked together, so that he who has one is seen to have several; and one virtue befits the saints, but the reward of the virtue that was the more abundant is the more abundant. How great the hospitality in Abraham, how great the humility, how great the holiness, that he saved his brother's son from the enemy, and how great the abstinence, that he sought nothing from the spoil! But because he excelled in faith, he merited the primacy of faith above the rest. So each has several rewards, because he has several incentives of virtues, but what is more copious in any merit is also more overflowing in the reward.

Blessed then are the poor in spirit. You have temperance, which abstains from sin, tramples on the world, does not seek what allures.

Blessed are those who hunger and thirst; for he who hungers has compassion on the hungry, by having compassion he bestows, by bestowing he becomes righteous, because his righteousness remains for ever. Hence in Matthew we understand a spiritual thirst and hunger, by which the food or the drink of righteousness is desired, because virtue is as it were a kind of material of the virtues, so that the righteous man shows himself equal to his inferiors, shuts out deceit, seeks truth.

Blessed are you who now weep, for you shall laugh. You have prudence, whose part it is to weep for perishing things and to seek those that are eternal, to mourn worldly things which fight against themselves, to seek the God of peace, who chose the foolish things of the world to confound the wise, and who destroys the things that are not, that he may obtain the things that are.

Blessed shall you be when men hate you. You have fortitude, but that which does not merit hatred for a crime, but suffers persecution for faith; for thus one comes to the crown of the passion, if you disregard the favour of men and follow the divine. Indeed, that you may know that the passion is the consummation of fortitude, in the same way he says their fathers did to the prophets, because the Jews persecuted the prophets even to the death of the body. It belongs also to fortitude to conquer anger and restrain indignation, and thereby fortitude strengthens mind and body alike and does not allow them to be disturbed by any fear or grief, by which, as by depraved interpreters, we are mostly struck down.

So temperance has purity of heart and of mind, justice has mercy, prudence peace, fortitude meekness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
