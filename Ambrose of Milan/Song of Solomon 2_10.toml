[[commentary]]
quote='''
Indeed he says to a soul of this kind: arise, come, my nearest one, that is, arise from the delights of the world, arise from earthly things and come to me, you who still labour and are burdened, because you are anxious about the things of the world. Come above the world, come to me, because I have overcome the world. Come near, already beautiful with the beauty of eternal life, already a dove, that is, gentle and meek, already wholly of spiritual grace. Rightly, then, she ought no longer to fear the nets, when it is he who calls the soul to himself who could not be caught by the temptations and nets of the world. For while we men walk in the midst of snares, exposed through our appetite for food to nets and snares alike, he, though placed in the body, did not fear the nets, but stood out above the nets, that is, above the temptations of the world and the passions of the body; indeed, he made others too rise above them. And therefore, wishing to establish this soul as well, he said: arise, come, my nearest one, do not fear the nets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Isaac%2520and%2520the%2520Soul.html'
source_title="On Isaac and the Soul, Chapter 4"

[[commentary]]
quote='''
But so that she might be able to come from Lebanon, he said beforehand: Arise, come, my near one, my beautiful one, my dove, my perfect one. Near, surely, by the desire of faith; beautiful by the comeliness of virtue; a dove by spiritual grace. For the wings indeed of a dove covered with silver signify that eternal power, and the flight of the dove declared the presence of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FSecond%2520Apology%2520for%2520the%2520Prophet%2520David.html'
source_title="Second Apology for the Prophet David, Chapter 8"

[[commentary]]
quote='''
Arise, come, my nearest one; that is, rise from the dead, arise from the bonds by which you were held encircled. Arise, because I have risen again for you: loose the bonds of iniquity, because I have already loosed them for you: come, because the nets are now loosed, the Virgin has given birth, a boy has been born of a virgin; he owes nothing to the inheritance of woman, he is not held as the son of a woman: see the middle wall of partition now loosed, which divided the concord of the inner affections, and stirred up in opposite directions the dissensions of bodily passions. Come, then, secure; I long to see your face, and to hear your voice: come, that you may no longer see me through the nets, but that, face to face, you, the beloved, may possess the countenance of your lover.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520the%2520Song%2520of%2520Songs.html'
source_title="Commentary on the Song of Songs"
