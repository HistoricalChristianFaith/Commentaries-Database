[[commentary]]
quote='''
But now let us also consider his deeds. Who would not let the praise of such great virtues overshadow the odium of one crime? Chosen by divine examination, he at once proved that he was not unworthy of so great a judgment. He went forth into battle and, while the others trembled, he alone, with faith and valour joined together, laid low the Philistine Goliath, terrible for the boasting of his words and the bulk of his monstrous body. The fortitude of one became the victory of all. Let there be compared, if you please, a private crime and the triumph of all, the death of one man and the life of the peoples, of so many whom he freed from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FApology%2520for%2520the%2520Prophet%2520David.html'
source_title="Apology for the Prophet David, Chapter 6"
