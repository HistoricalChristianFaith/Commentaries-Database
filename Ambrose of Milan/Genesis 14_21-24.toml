[[commentary]]
quote='''
And how great is this, that he wished nothing of the spoils of victory to touch him, nor to take what was offered! For the acceptance of a reward diminishes the fruit of a triumph and takes away the grace of a kindness. For it makes the greatest difference whether you have fought for money or for glory: the one is reckoned in the place of a hireling, the other is held worthy of the glory of a preserver. Rightly the holy man refuses to appropriate anything from the spoils, or to accept what is offered, lest he who gave should say, 'I made him rich'; he testifies that this alone is enough for him, what had gone to feed the young men who fought. Someone will say: 'Since he himself conquered, how does he say to the king of Sodom, 'nothing shall I take from you', and this when the spoils were surely in the power of the victor?' He teaches military discipline, that all things be kept for the king. Yet he declares that to those who had been with him, associated perhaps as auxiliaries, a share of the profit should be given as the wage of their labour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 1, Chapter 3"
