[[commentary]]
quote='''
His riches, then, Scripture had set forth. It remained to learn whether Lot too, his nephew, was also rich, as being of the same line; but Scripture asserts that he abounded only in cattle. For it runs thus: And Lot, who walked with Abraham, had sheep and oxen and tents. He did not have silver, because he was not yet just; for the tongue of the just is silver tried by fire. He did not have gold, which he had who saw the back parts of Christ, of whom it is written: and his back parts in the appearance of gold. Abraham saw him, as the Lord testified, saying: Abraham saw my day and was glad. And therefore he deserved to have and possess the appearance of gold.

Now I think that point must by no means be passed over which seems to have troubled even the more learned: for what reason it is written thus: And Lot, who walked with Abraham, as though there were another Lot who did not walk with him, according to what we have received. And very many think the question is not solved. So, in order to satisfy them and not to depart from the rule of Scripture, we say: one person, two matters, in that two things are signified in one and the same man. In number he is one, in name twofold. For Lot means turning aside, as the Latin interpretation has it; and one turns aside both from good and from evil. So when Lot turned aside from evil, that is, from error, shameful deed, crime, he was joined to his uncle; when he turned aside from good, that is, from the just, the innocent, the holy, the devout, he was allied with shameful deeds. Rightly, then, did it say: And Lot, who walked with Abraham, because he had not yet chosen Sodom, he did not dwell with the authors of shameful deeds; for afterwards he began to dwell in Sodom. And therefore, as though changed from himself, he is understood as another, falling away not only from the just man but from himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Abraham.html'
source_title="On Abraham, Book 2, Chapters 5-6"
