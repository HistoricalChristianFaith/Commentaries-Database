[[commentary]]
quote='''
For he took away that barrier which divided the unity of mind and body and the course of a simple life, and he himself became our peace, who made both one and loosed the middle wall of the hedge. Which wall the Apostle explains as the enmities in the flesh. These enmities, then, the Lord took away, and he restored peace and made void the law of commandments in decrees, so as to create the two in one new man; in which he signifies not only the outer and the inner man, but also the Jew and the Greek, that Christ might be all and in all. For the Lord took away the superstition of the sabbath, of the bodily sabbath, and as it were loosed the middle wall of the Law, which by the difficulty of its decrees kept us from that devotion which is according to God, because under the law of Moses it was not easy or possible for the Gentiles to serve God, since the empty superstition of the Jews held back the pure disposition of the Gentiles from undertaking the observance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
