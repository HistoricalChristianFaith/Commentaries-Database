[[commentary]]
quote='''
Who can comprehend the divine mysteries? Their multitude is so great that rightly Paul marvels and rightly has said: O the depth of the riches of the wisdom and knowledge of God! The Gentiles were rejected so that Israel might be chosen; afterwards Israel was blinded on account of the calling of the Gentiles, and the remnant of blinded Israel was saved according to the election of grace, after the fullness of the Gentiles had come in. So the fault of Israel profited the Gentiles, and the faith of the Gentiles set the Israelite people free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
