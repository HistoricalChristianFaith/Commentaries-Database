[[commentary]]
quote='''
What is meant by ‘created unto him’? Because He is the heir of the Father, from the fact that inheritance passed from the Father unto Him, as the Father says: ‘Ask of me and I will give thee the Gentiles for thine inheritance.’ This inheritance nevertheless passed to the Son and returns from the Son to the Father. And so in notable fashion the Apostle said in this place that the Son was the Author of all things, one who holds all things by His majesty. Addressing the Romans, he says concerning the Father: ‘For from him and through him and unto him are all things.’ ‘From him’ means the beginning and origin of the substance of the universe, that is, by His will and power. For all things began by His will, because one only is the Father, from whom all things come. By this is meant that He created through Himself, who created from what source He desired. ‘Through him’ means the continuation of the universe; ‘unto him’ means its end.

‘From him,’ therefore, is the material; ‘through him,’ the operation by which the universe is bound and linked together; ‘unto him,’ because as long as He wishes all things remain and endure by His power and the end of all things is directed toward the will of God, by whose free act all things are resolved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FThe%2520Six%2520Days%2520of%2520Creation.html'
source_title="The Six Days of Creation"
