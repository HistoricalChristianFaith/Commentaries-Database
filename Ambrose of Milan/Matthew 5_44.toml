[[commentary]]
quote='''
The righteous man, then, is silent before those who are insolent to him; the righteous man prays. Hear the righteous man praying: Instead of loving me they disparaged me, but I prayed. The righteous man blesses those who curse him, as the apostles did, as Paul affirms, saying: We are cursed and we bless. The righteous man loves his enemies. See how he is taught to ascend little by little, step by step, to the increase of the virtues, as the Lord says: Love your enemies. The righteous man prays for those who slander him, because the Lord commanded this too, adding: Do good to those who hate you, pray for those who slander and persecute you. He is righteous in every respect who keeps and observes these things: first, because he is silent and does not answer his enemies; next, because he prays, that is, he is not idle in his affection. And he who prays prays for good things, not for whatever might harm his enemy. It is more, then, to pray than to be silent. The righteous man blesses those who curse him. This is more than praying for himself; for, secure about himself, he blesses one whom he does not fear, or even one whom he feared before. The righteous man loves his enemy. It is more to love than to bless, because the love of the mind is greater than the graciousness of speech. The righteous man does good to him by whose hatred he has been attacked; the righteous man prays for those who slander him. Good is love and good is loving-kindness; both are of God and both are God, because love is God, as John said in his epistle. Therefore both are joined: Love your enemies and pray for those who slander and persecute you. Love is the fullness of the Law, but this too is the fullness of the Gospel, to pray for those who slander and persecute us, so that we ask pardon for their sins, just as holy Job was chosen by divine judgement, so that his prayer might abolish the offence of those kings who slandered the righteous man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentaries%2520on%2520the%2520Twelve%2520Davidic%2520Psalms.html'
source_title="Commentaries on the Twelve Davidic Psalms"
