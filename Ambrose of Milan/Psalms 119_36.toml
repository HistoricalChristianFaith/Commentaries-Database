[[commentary]]
quote='''
Therefore, as I am about to speak of what is useful, I will take up those words of the prophet: "Incline my heart to your testimonies and not to covetousness," that the sound of the word useful may not rouse in us the desire for money. Some indeed put it thus: "Incline my heart to your testimonies and not to what is useful," that is, that kind of usefulness that is always on the watch for making gains in business and has been bent and diverted by the habits of people to the pursuit of money. For as a rule most people call useful only what is profitable, but we are speaking of that kind of usefulness that is sought in earthly loss "that we may gain Christ," whose gain is "godliness with contentment." Great, too, is the gain whereby we attain to godliness, which is rich with God, not indeed in fleeting wealth but in eternal gifts, and in which rests no uncertain trial but constant and unending grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FON%2520THE%2520DUTIES%2520OF%2520THE%2520CLERGY%2FBook%25202.html'
source_title="On the Duties of the Clergy 2.6.26"

[[commentary]]
quote='''
Frequent is our discourse about fleeing this world, and would that our disposition were as cautious and careful as the discourse is easy! But what is worse, the enticement of earthly desires frequently creeps in, and an outpouring of vanities takes hold of the mind, so that the very thing you strive to avoid is what you think about and turn over in your mind. This is difficult for a man to guard against, and impossible to put off. Accordingly, the prophet testifies that this is a matter of prayer rather than of accomplishment, when he says: Incline my heart to your testimonies and not to avarice. For our heart and our thoughts are not in our power; poured over us unexpectedly, they confound the mind and the spirit and draw them elsewhere than you had proposed: they call us back to worldly things, put in things of this world, heap on pleasures, weave in enticing things; and at the very time when we are preparing to lift up the mind, we are for the most part cast down to earthly things by the vain thoughts that have been put in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 1"
