[[commentary]]
quote='''
But the Lord, wishing to save sinners, shows himself to be God both by the knowledge of hidden things and by the wonder of his deeds, adding: Which is easier, to say: 'Your sins are forgiven you', or to say: 'Rise and walk'?

In this place he shows the full form of the resurrection, he who, healing the wounds of mind and body, forgives the sins of souls and drives out the weakness of the flesh; for this is for the whole man to be cured. Although therefore it is a great thing to forgive men their sins — who indeed can forgive sins but God alone, who forgives also through those to whom he has given the power of forgiving? — yet it is far more divine to grant resurrection to bodies, since the Lord himself is the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FCommentary%2520on%2520Luke.html'
source_title="Commentary on Luke"
