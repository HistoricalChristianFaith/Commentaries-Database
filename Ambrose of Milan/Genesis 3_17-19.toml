[[commentary]]
quote='''
Again, consider the fact that it is the serpent and not man who is cursed. And the earth is not cursed in itself but is cursed in your work. This is said in reference to the soul. The earth is cursed if your works are earthly, that is, of this world. It is not cursed as a whole. It will merely bring forth thorns and thistles, if it is not diligently cared for by the labor of human hands. If we do not toil over it in labor and sweat we shall not eat bread. The law of the flesh wars against the law of the mind. We must labor and sweat so as to chastise the body and bring it into subjection and sow the seeds of spiritual things. If we sow what is carnal, we shall reap fruit that is carnal. If, however, we sow what is spiritual, we shall reap the fruit of the spirit.
'''
source_url="https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520Paradise.html"
source_title="On Paradise, Chapter 15"

[[commentary]]
quote='''
This is the sentence pronounced against the serpent, of which we spoke above; let us consider also of what kind was the one directed against man.

Cursed is he who is the author of the fault, but this one is not cursed, who was deceived by another's fraud; yet, because he did not keep the commandment of God, he is condemned to the toil of his works — the earth indeed is cursed, but in the works of the sinner — and he is cursed until he is dissolved into the earth. For this reason, then, Jesus took on flesh, so that he might abolish the curse of sinful flesh; and he was made a curse for us, so that blessing might swallow up the curse, integrity sin, pardon the sentence, life death. For he took on death too, so that the sentence might be fulfilled and the judgement satisfied: the curse of sinful flesh until death. Nothing, then, was done against the sentence of God, since the condition of the divine sentence was fulfilled; for the curse was until death, after death grace. We are dead, then, to the world: why do we still contend about the world? We have died with Christ: why do we still seek the business of this life? We carry about the death of Christ in our body, so that the life of Christ too may be made manifest in us. We live, then, no longer that life of ours but the life of Christ, a life of innocence, a life of chastity, a life of simplicity and of all the virtues. We have risen with Christ: let us live in him, let us ascend in him, so that the serpent may not be able to find on earth our heel to wound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FFlight%2520from%2520the%2520World.html'
source_title="Flight from the World, Chapter 7"
