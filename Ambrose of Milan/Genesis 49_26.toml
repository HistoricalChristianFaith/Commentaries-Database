[[commentary]]
quote='''
Hence too he grew strong over all the mountains and the desires of the everlasting hills. For above all those men of lofty merit, patriarchs and prophets and apostles, and even beyond sun, moon and archangels, he shone forth like the light of heaven, as he himself says: the disciple is not above the master, nor the servant above the lord. For which of them was there to whom all things were subject, they to whom he himself gave what they were? In him all his saints are blessed, because he is over the heads of all, the head of all — for the head of the woman is the man, the head of the man is Christ — and over the crowns of all, because he is the surpassing crown of all things; but he is the highest crown of the just, whom he calls brothers, acquired through grace and a certain fellowship of regeneration. Hence too we understand as the brothers of Joseph rather those of whom he says in the psalm: I will declare your name to my brothers, in the midst of the Church I will sing to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Ambrose%2520of%2520Milan%2FOn%2520the%2520Blessings%2520of%2520the%2520Patriarchs.html'
source_title="On the Blessings of the Patriarchs, Chapter 11"
