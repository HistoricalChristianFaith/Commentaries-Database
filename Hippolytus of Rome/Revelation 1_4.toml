[[commentary]]
quote='''
In writing to seven Churches, he writes just as Paul wrote thirteen letters but wrote them to seven Churches. That to the Hebrews he does not judge to be Paul's, but perhaps Clement's.
'''
append_to_author_name=' (as quoted by Dionysius bar Salibi, AD 1171)'
source_url='https://historicalchristian.faith/by_father.php?file=Dionysius%2520bar%2520Salibi%2FCommentary%2520on%2520the%2520Apocalypse.pdf'
source_title="COMMENTARY ON THE APOCALYPSE 1:4"
