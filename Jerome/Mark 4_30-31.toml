[[commentary]]
quote='''
The kingdom of heaven is like a grain of mustard seed, which a man took and sowed in his field; which indeed is the least of all seeds, but when it has grown it is greater than all garden herbs and becomes a tree, so that the birds of the sky come and dwell in its branches. Let it not be irksome to the reader if we set out whole parables. For things that are obscure must be discussed more fully, lest by excessive brevity the sense be wrapped up rather than explained. The kingdom of heaven is the preaching of the Gospel and the knowledge of the Scriptures, which leads to life, and of which it is said to the Jews: The kingdom of God shall be taken from you and given to a nation producing its fruits. Like, therefore, in this manner, is the kingdom to a grain of mustard seed, which a man took and sowed in his field. The man who sows in his field is understood by most to be the Savior, because he sows in the souls of believers; by others, a man himself sowing in his own field, that is, in himself and in his heart. Who is this who sows but our mind and our soul, which, receiving the grain of preaching and fostering the seed with the moisture of faith, makes it sprout in the field of its own breast?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
