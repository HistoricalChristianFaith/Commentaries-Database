[[commentary]]
quote='''
Blessed are the meek, for they shall possess the land. Not the land of Judea, nor the land of this world, not the cursed land bringing forth thorns and thistles, which every most cruel man and warrior possesses more than others, but the land that the psalmist longs for: I believe that I shall see the good things of the Lord in the land of the living. A possessor of this kind, and after his victory a triumphant one, is also described in Psalm 44 (45): And press on, and proceed prosperously, and reign, for the sake of truth and meekness and justice. For no one possesses this earthly land through meekness, but through pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
"Blessed are the meek, for they shall possess the earth." If, therefore, it is said there, Blessed are the meek — that is, the gentle — for they shall possess the earth; and here it is said, And he will exalt the meek in salvation; and these meek shall possess the earth by inheritance: therefore this earth is not below, but is above. For what does he say? He will exalt the meek in salvation. For if these meek were to possess the earth that is below, he would not say, He will exalt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_059.html'
source_title="Homily 59, on Psalm 149"
