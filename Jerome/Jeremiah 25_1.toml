[[commentary]]
quote='''
The word that came to Jeremiah concerning all the people of Judea — or upon all the people of Judah — in the fourth year of Jehoiakim son of Josiah, king of Judah. These things are earlier than the preceding vision; for that one took place under Zedekiah, after Jeconiah had been carried off to Babylon, but these under Jehoiakim, the son of Josiah and father of Jeconiah. For it was not their concern, as I have already said before, to preserve the chronological order of prophecy, which the laws of history require, but to write in whatever way they knew to be useful to those who would hear and read; hence also in the Psalter some wrongly look for the order of the psalms according to the sequence of history, which is not observed in lyric song.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
This is the first year of Nebuchadnezzar, king of Babylon, which is not found in the Seventy; and there follows: which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem, saying. In the fourth year of King Jehoiakim son of Josiah, father of Jeconiah, Nebuchadnezzar took up the rule in Babylon, and so it came about that the year which was the first of Nebuchadnezzar in Babylon was the fourth of King Jehoiakim in Jerusalem. Then, in the eighth year of his reign, he led into captivity Jeconiah with his mother and the princes, who had reigned only three months after the slaying of his father Jehoiakim. Now Jehoiakim was slain in the eleventh year of his reign in Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
