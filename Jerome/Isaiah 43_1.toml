[[commentary]]
quote='''
And now thus says the Lord who creates you, Jacob, and forms you, Israel: Do not fear, for I have redeemed you, and I have called you by your name: you are mine. When you pass through the water , I will be with you, and the rivers will not cover you. When you walk into the fire, you will not be burned, and the flame will not burn in you; for I am the Lord your God, the Holy One of Israel, your Savior; I have given Egypt as your propitiation, Ethiopia and Saba for you. Since you have become honorable in my eyes and glorious, I have loved you, and I will give men for you, and peoples for your life. Do not fear, for I am with you; from the East I will bring your seed, and from the West I will gather you. I will say to the North: Give; and to the South: Do not hold back; bring my sons from afar, and my daughters from the end of the earth. And everyone who calls upon my name, I have created him for my glory, and I have formed him, and I have made him. Bring forth the people that is blind and has eyes, that is deaf and has ears. All the nations are gathered together, and the tribes are assembled. Who among you will declare this, and will make us hear the former things? Let them bring their witnesses and be justified, and let them hear and say: Truly you are my witnesses, says the Lord, and my servant whom I have chosen, that you may know and believe me, and understand that I myself am he. Before me no god was formed, and after me there will be none. I am, I am the Lord, and besides me there is no savior. I have declared, and I have saved; I have made it heard, and there was no stranger among you. You are my witnesses, says the Lord, and I am God, and from the beginning I myself am, and there is none who can deliver from my hand; I will work, and who will turn it back? LXX: And now thus says the Lord who made you, Jacob, and created you, Israel: Do not fear, for I have redeemed you; I have called you by your name, you are mine; and if you pass through water, I am with you, and the rivers will not overwhelm you; and if you pass through fire, you will not be burned; the flame will not consume you; for I am the Lord your God, the Holy One of Israel, your savior. I have made Egypt your exchange, and Ethiopia and Syene for you. Since you have become honorable, and have been glorified in my sight, I also have loved you, and I will give men for you, and princes for your head. Do not fear, for I am with you; from the East I will bring your seed, and from the West I will gather you. I will say to the North: Bring; and to the Southwest: Do not hold back; bring my sons from a far land, and my daughters from the ends of the earth, all who are called by my name; for in my glory I have created him, and I have fashioned him, and I have made him; and I have brought forth the blind people, who have eyes and are blind, and their ears are deaf. All the nations are gathered together, and their princes have assembled. Who will declare these things? or who will declare to you the things that are from the beginning? Let them bring their witnesses, and be justified, and let them hear and speak true things. Be witnesses for me, and I am a witness, says the Lord God, and my child whom I have chosen, that you may know and believe and understand that I am. Before me there was no other god, and after me there will be none. I am God, and besides me there is no Savior. I have declared, and I have saved; I have reproached, and there was no stranger among you. You are my witnesses, and I am the Lord God from the beginning, and there is none who can deliver out of my hands. I will do it, and who will turn it back? The Hebrews interpret these things of the second coming of the Savior, when, after the fullness of the nations, all Israel is to be saved. But we in no way think that the promise is made to those to whom it was said above: Who is blind but my children, and who are deaf but those who rule over them? and the servants of God have been blinded. And again: The people has been laid waste and plundered, and things like these. Finally he adds: He poured out upon him the indignation of his fury, and strong war; and he burned him round about, and he did not know it; and he set him on fire, and he did not understand. Therefore, as we said above that there are two Jacobs and two Israels, one fleshly and the other spiritual, of those who refused to believe in the Savior and of those who received the Son of God, so this too is now to be understood: that the choir of the Apostles is summoned, and the first Church of Christ gathered from the people of the Jews, to understand its Creator and Maker, who is the founder both of its soul and of its body; and not to fear persecutors, because it has been redeemed by the blood of Christ, who has called it by his name and, out of intimacy, calls it in a special way his own people; but to preach without hesitation and to dread no dangers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
