[[commentary]]
quote='''
Either it is a general prayer for the kingdom of the whole world that the reign of the Devil may cease; or for the kingdom in each of us that God may reign there, and that sin may not reign in our mortal body.

But be it noted, that it comes of high confidence, and of an unblemished conscience only, to pray for the kingdom of God, and not to fear the judgment.

Let them be put to shame by this text who falsely affirm that there are daily falls (ruinas) in Heavenb.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Hearing this, the heretics of old slander the Creator as cruel and bloodthirsty, and do not consider that the apostle Paul, who is surely the apostle of the good God — as they themselves would have it —, writes to the Corinthians: If I come again I will not spare, so as to chastise offenders with the rod and draw back the erring to salvation; for those who do not understand what is profitable for them, and often pray for contrary things, it is expedient that they not be heard by the Lord. Hence in the prayer too we say: Your will be done; not our will, which is accustomed to err, but your will, which knows the things to come; and it is sometimes a great happiness not to merit mercy for the present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
