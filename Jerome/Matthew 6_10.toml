[[commentary]]
quote='''
Either it is a general prayer for the kingdom of the whole world that the reign of the Devil may cease; or for the kingdom in each of us that God may reign there, and that sin may not reign in our mortal body.

But be it noted, that it comes of high confidence, and of an unblemished conscience only, to pray for the kingdom of God, and not to fear the judgment.

Let them be put to shame by this text who falsely affirm that there are daily falls (ruinas) in Heavenb.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Hearing this, the heretics of old slander the Creator as cruel and bloodthirsty, and do not consider that the apostle Paul, who is surely the apostle of the good God — as they themselves would have it —, writes to the Corinthians: If I come again I will not spare, so as to chastise offenders with the rod and draw back the erring to salvation; for those who do not understand what is profitable for them, and often pray for contrary things, it is expedient that they not be heard by the Lord. Hence in the prayer too we say: Your will be done; not our will, which is accustomed to err, but your will, which knows the things to come; and it is sometimes a great happiness not to merit mercy for the present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Your kingdom come. He asks either generally for the kingdom of the whole world, that the devil may cease to reign in the world, or that God may reign in each one, and that sin may not reign in the mortal body of men. At the same time this too must be noted, that it belongs to great boldness and a pure conscience to ask for the kingdom of God and not to fear the judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Your will be done, as in heaven, also on earth, that as the angels serve you blamelessly in the heavens, so men may serve you on earth. Let those blush at this sentence who falsely claim that falls take place daily in heaven. For what does likeness to the heavens profit us, if there is sin in heaven too?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
In heaven the decree of God is kept, and on earth it is not kept. He set a decree for the sea, that it should not go beyond its shores: the ocean comes swelling with its waves, and returns into itself, and remembers the decree of God. The whole world serves God, and remembers his decree: and man alone does not remember. Therefore we say also in the Lord's Prayer: Your will be done, as in heaven, so on earth. As in heaven the angels serve you, and the creation serves, so let man too serve.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"

[[commentary]]
quote='''
Hear, O heretic, what is said. In the heavens the truth of God shall be prepared. If souls fell down from heaven on account of the sins they had committed, how then is the truth prepared in the heavens? If daily souls are cast down to earth, how does the Lord teach in the Lord's Prayer and say, "Your will be done, as in heaven, so on earth"? Do we then ask, on the authority of the Lord and Savior, that just as the soul without a body sinned in heaven, so in the body it might sin on earth; and that the soul which, free and in the heavens, could not keep righteousness, should now, confined by the straits of the body, keep it on earth? A strange thing I see: the soul sinned in heaven, and was thrust down to earth, so that what it lost in heaven, it might find on earth. It sinned without a body: how can it be that with a body it might more easily deserve God? Since indeed "the flesh lusts against the spirit, and the spirit against the flesh."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
