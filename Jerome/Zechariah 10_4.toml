[[commentary]]
quote='''
He himself will also be the bow of the Lord's fury, of which he says: I will make my arrows drunk with blood, and again: My arrows shall consume them. Of this bow, and of these arrows, we read in Psalm 7: He has bent his bow and made it ready, and on it he has made ready the instruments of death; he has made his arrows for the burning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
