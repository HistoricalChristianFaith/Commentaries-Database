[[commentary]]
quote='''
He that had received five talents, that is, having received his bodily senses, he doubled his knowledge of heavenly things, from the creature understanding the Creator, from earthly unearthly, from temporal the eternal.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then he who had received five talents went away and traded with them; he gained five more. Having received earthly senses, he doubled for himself the knowledge of heavenly things, understanding the Creator from creatures, the incorporeal from the corporeal, the invisible from the visible, the eternal from the brief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
