[[commentary]]
quote='''
But I was unknown by face to the churches of Judaea which were in Christ Jesus. But they had only heard that he who once persecuted us now preaches the faith which he formerly fought against; and they glorified God in me.

The churches that were in Judaea had known Paul only by report. Of these, most had seen him as a persecutor rather than as an apostle. But Syria and the regions of Cilicia, Arabia and Damascus had perhaps known him by face as well, because the Teacher of the Gentiles was preaching the Gospel of Christ not to the Jews but to the Gentiles. Now the whole of what he is doing is this: to teach that he could never, from being a persecutor, have become glorious among those very people whom he had previously persecuted, unless his preaching had been approved by the judgment even of those who had earlier known him as a wicked man. And he covertly returns to his purpose, confirming that he had spent so short a time in Judaea that he was unknown even by face to the believers. From this he shows that he had not had Peter, not James, not John as his teachers, but Christ, who had revealed the Gospel to him. At the same time it should be noted that above he is said to have fought against the Church, here against the faith: there men, here a thing; so that now it might more fittingly be added: "He preaches the faith which he once fought against." For the words could not have sounded the same way of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
