[[commentary]]
quote='''
And the word of the Lord came to me, saying: Go and cry in the ears of Jerusalem, saying. This is not found in the Seventy, but was added under asterisks from the edition of Theodotion, who translated the Hebrew word 'carath', for which we said 'cry' or 'preach', as 'read'. For by its ambiguity it signifies reading and crying out and preaching. But the ears of Jerusalem we ought to take as the ears of its inhabitants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Thus says the Lord: I have remembered you, pitying your youth and the love of your betrothal, when you followed me in the wilderness, in a land that is not sown. LXX: thus says the Lord: I have remembered the mercy of your youth and the love of your perfection. This is said more fully in Ezekiel, when the Lord joins Jerusalem to himself in marriage and, under the person of a wife, unites her to his embraces, or, to show a more ardent affection, calls her a girl and a young maiden and betrothed; for what we have not yet obtained, we desire the more to obtain. 'When', he says, 'you followed me in the solitude, and in the manner of betrothal gifts and a dowry I distributed to you the ornaments of the law and the necklaces of words'. And all this he refers not to her merit but to his own mercy, through which love too followed. This also, which we have set down: in the wilderness, in a land that is not sown, is not found in the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
