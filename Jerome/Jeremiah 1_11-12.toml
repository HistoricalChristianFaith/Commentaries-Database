[[commentary]]
quote='''
And the word of the Lord came to me, saying: What do you see, Jeremiah? And I said: I see a watching rod, and the Lord said to me: You have seen well, for I will watch over my word, to perform it. For 'watching rod' the LXX translated 'staff of nut-wood'. We must therefore take pains that the Latin reader may briefly understand the Hebrew etymologian [etymology]. 'Saced' is said for 'nut', while 'watch' or 'watchful' or 'to watch' is called 'soced'. Hence also in later passages the watching leopard is set down under this name. So from the word for 'nut', because of the likeness of the word, the name has played upon the sense of 'watchful'. This indeed is written also in Daniel according to Theodotion, where from the trees schinu and prinu, namely the holm oak and the mastic, cutting asunder and sawing asunder is decreed for the adulterous elders. Besides, at the beginning of Genesis too, from 'man', which is called 'is', woman is called 'issa', as it were a kind of virago, because she was taken from man. For 'staff of nut-wood' Aquila and Symmachus translated 'watching rod', but Theodotion 'of almond'. And the rod watches, considering all the sins of the people, so as to strike and rebuke the transgressors. Hence the Apostle too writes to those who sin: what do you wish? Shall I come to you with a rod, or in love and the spirit of gentleness? This is the rod or staff of which David too speaks: your rod and your staff, they have comforted me. And beautifully he put 'have comforted'; for the Lord rebukes to this end, that he may amend. And just as the nut or the almond has a very bitter rind and is enclosed in a very hard shell, so that, when the harsher and hard parts are stripped away, a very sweet fruit is found, so every rebuke and the labor of continence seems bitter indeed for the present, but brings forth very sweet fruits. Hence there is also that old saying: 'the roots of letters are bitter, the fruits sweet'. Some understand the 'watching rod' and 'of nut-wood' as the Lord, of whom Isaiah says: a rod shall come forth from the root of Jesse. Hence too the rod of Aaron, which was thought dead, is related to have blossomed in the resurrection of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
