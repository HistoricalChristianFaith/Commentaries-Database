[[commentary]]
quote='''
When afterwards they see him slain by the breath of Christ's mouth, they will understand that the things foretold of him beforehand are true, and they will say all that follows, with the same understanding with which we have expounded it concerning the devil. As for what he says, all the remaining peoples will despoil you because of the blood of men and the impiety of the land, and of the city and of all who dwell in it, let us understand the remaining peoples as the holy ones who did not serve the Antichrist; by whom the impious one will be despoiled because of the impiety which he exercised against the whole earth, and the laying waste of the city of the Church, and the persecution of all who have dwelt in it. For so great a devastation and so great an impiety will stalk through the churches at the end of things, while the Antichrist rages, and, as the iniquity of many is multiplied, charity will grow so cold, that the Lord, who knows the secrets of the heart and is not ignorant of what is to come, said: Do you think the Son of man, when he comes, will find faith on the earth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
