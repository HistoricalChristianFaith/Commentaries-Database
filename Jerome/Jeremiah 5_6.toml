[[commentary]]
quote='''
Jeremiah also speaks of sinners: A lion from the forest struck them, and a wolf destroyed them even to their houses; and a leopard kept watch over their cities. All who go out from them will be taken. In this, note that no one is taken except one who has gone out from the cities of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"

[[commentary]]
quote='''
Because, then, they did these things, a lion from the forest struck them, namely the Babylonian kingdom; a wolf at evening laid them waste, signifying the Medes and Persians, in place of which in the vision of Daniel a 'bear' is set down, in whose mouth there were three rows; a leopard watching over their cities, prefiguring the onslaught of Alexander and his swift course from the west all the way to India. He calls him a leopard on account of his variegation, and because he fought against the Medes and Persians with very many nations subject to him. And there were, he says, four heads on the beast, and power was given to it. And because he is not prophesying of the future, but is weaving the history of the past or of things now on the very point of coming, for that reason he is silent about the Roman empire, of which perhaps it is said: Everyone who goes out from them will be taken. And he gives the causes why they suffered these things: because their transgressions are multiplied and they persevered in their transgressions. Hence it is said: and their turnings-away are strengthened. What we set down at the beginning, that the Hebrew word 'sacad' signifies 'watchfulness', is shown in the present place; for where we said 'a leopard watching', in the Hebrew is written 'nemer sacad'. According to tropology: those who are thought great in the Church, because they break the yoke and burst the bonds, are for that reason handed over to the disgrace of passions, so that they do the things that are not fitting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
