[[commentary]]
quote='''
Jeremiah also speaks of sinners: A lion from the forest struck them, and a wolf destroyed them even to their houses; and a leopard kept watch over their cities. All who go out from them will be taken. In this, note that no one is taken except one who has gone out from the cities of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"
