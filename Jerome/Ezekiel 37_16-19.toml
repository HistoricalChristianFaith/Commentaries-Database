[[commentary]]
quote='''
And the word of the Lord came to me, saying: And you, son of man, take for yourself one stick and write upon it: Of Judah and of the sons of Israel his companions. And take another stick and write upon it: Of Joseph — the stick of Ephraim — and of the house of Israel and of his companions. And join them one to the other for yourself into one stick; and they shall be in union in your hand. And when the sons of your people say to you, speaking: Will you not show us what you mean by these things? you shall speak to them: Thus says the Lord God: Behold, I will take the stick of Joseph — which is in the hand of Ephraim — and the tribes of Israel which are joined to him, and I will put them together with the stick of Judah and make them one stick, and they shall be one in his hand. And the sticks on which you have written shall be in your hand before their eyes, and you shall say to them: Thus says the Lord God: Behold, I will take the sons of Israel from the midst of the nations to which they have gone, and I will gather them from every side, and I will bring them to their own soil, and I will make them one nation in the land on the mountains of Israel; and one king shall be ruling over all, and they shall no longer be two nations, nor shall they be divided any more into two kingdoms. Nor shall they be defiled any more with their idols and abominations and with all their iniquities, and I will save them out of all their dwelling places in which they sinned, and I will cleanse them, and they shall be my people, and I will be their God. And my servant David shall be king over them, and there shall be one shepherd of them all; they shall walk in my judgments, and they shall keep my commandments and do them. And they shall dwell upon the land which I gave to my servant Jacob, in which your fathers dwelt; and they shall dwell upon it, they and their sons and their sons' sons for ever, and David my servant shall be their prince for ever. And I will strike with them a covenant of peace, it shall be an everlasting pact for them, and I will establish them and multiply them; and I will put my sanctification in the midst of them for ever, and my tabernacle shall be among them; and the nations shall know that I am the Lord, the sanctifier of Israel, when my sanctification shall be in the midst of them for ever. (LXX: "And the word of the Lord came to me, saying: And you, son of man, take to yourself one rod and write upon it: Judah and the sons of Israel who are added to him. And you shall take to yourself a second rod and you shall inscribe it: Joseph — the rod of Ephraim — and all the sons of Israel who are added to him. And you shall join them to each other for yourself into one rod, so as to couple them; and they shall be in your hand. And it shall be, when the sons of Israel say to you, speaking: Will you not show us what these things are to you? you shall say to them: Thus says the Lord, the Lord: Behold, I will take into the tribe of Joseph — through the hand of Ephraim — the tribes of Israel which are joined to him, and I will put them all upon the tribe of Judah and they shall be into one rod, and they shall be one in the hand of Judah. And the rods which you inscribed shall be thus, in your hand in their presence, and you shall say to them: Thus says the Lord, the Lord: Behold, I will take the whole house of Israel from the midst of the nations into which they have entered, and I will gather them from all who are round about it, and I will bring them into the land of Israel, and I will make them into one nation in my land on the mountains of Israel; and one prince shall be over all these as king, and they shall no longer be into two nations, nor shall they be divided any more into two kingdoms. And let them no longer be defiled with their idols and with their stumbling blocks and with all their impieties, and I will rescue them from all their iniquities in which they sinned, and I will cleanse them, and they shall be to me for a people: I will be to them for God. And my servant David shall be prince in their midst, and there shall be one shepherd of all these, for they shall walk in my precepts and keep my judgments and do them. And they shall dwell in their own land which I gave to my servant Jacob, where their fathers dwelt; and they shall dwell in it, they and their sons and their sons' sons for ever, and David my servant shall be their prince for ever. And I will appoint for them a testament of peace, it shall be an everlasting testament with them, and I will give them and multiply them; and I will set my holy things in their midst for ever, and my tabernacle shall be among them, and I will be their God, and they shall be my people; and the nations shall know that I am the Lord who sanctifies them, when my holy things shall be in their midst for ever.") The history of the Kings relates that under Rehoboam the son of Solomon the twelve tribes were divided, and that two, that is, Judah and Benjamin, with the Levites and priests, followed Rehoboam, who reigned in Jerusalem: and his kingdom was called Judah; but that the other ten tribes — who said: We have no part in David, nor inheritance in the son of Jesse — submitted their necks to Jeroboam the son of Nebat, of the tribe of Ephraim, who was the son of Joseph, and served him: and that they were called, from the greater part of the people, by the ancient name Israel; and that for a long time the kingdom of Judah and Israel waged conflicts against each other and obeyed their own kings, and that first the ten tribes were taken captive by the Assyrians, and, after some time, those which were called Judah were led captive by the Chaldeans into Babylon; and that the tribe of Judah was restored to its ancient land after seventy years, but the ten tribes, which were called Israel, serve as captives to this day in the mountains and cities of the Medes. The present prophecy, therefore, promises these things from the mouth of the Lord: that both realms are to be joined together, that is, the kingdom of Judah and the kingdom of Israel, and that the rod of Ephraim, who was begotten of the stock of Joseph, is to be taken up with the remaining tribes which are associated with him, and joined to the rod of Judah, so that they are no longer called Judah and Israel but are called by one name, Judah, and, under the figure of the prophet, who goes before as a type of the Lord Savior, are held not by two hands but by the one hand of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
