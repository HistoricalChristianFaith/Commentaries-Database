[[commentary]]
quote='''
And because he did this to the city which he had built with bloodshed, he afterwards hears what is brought upon him by the Lord. For there follows: Are not these things from the Lord of hosts? That is, the things that are said: Peoples will labor in much fire, and nations in vain; that is, when Babylon has been burned, the peoples will labor in vain and strive for nothing, and the peoples of the Chaldean nation will fail.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
