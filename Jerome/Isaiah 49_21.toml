[[commentary]]
quote='''
But you, unable to utter with your mouth the greatness of your joy, will ponder silently in your heart, and will say: Who has begotten these for me? I was barren and a widow, deserted and captive among the people of the Jews; I had ceased to have sons; for a long time I had not given birth. After Haggai and Zechariah and Malachi I had seen no other Prophets until John the Baptist; and how is it that I, who had been alone and destitute of a husband's help, have now begun to have so many sons? And so that we may know that Zion is built from both peoples upon the rock and foundation of Christ, Paul says to believers: Built upon the foundation of the Apostles and Prophets, Jesus Christ himself being the chief cornerstone. (Eph 2:20.) From this it is plain that the one foundation of the Apostles and Prophets is our Lord Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
