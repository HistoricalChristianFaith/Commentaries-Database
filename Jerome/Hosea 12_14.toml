[[commentary]]
quote='''
Ephraim provoked me to anger in his bitternesses, and his blood will come upon him, and his reproach his Lord will restore to him. LXX: likewise. Since, then, I had bestowed such great things on Ephraim that I brought him back rich and a lord, and the parent of many sons, who had been naked and an exile and alone, Ephraim deserted me, nay, provoked me to anger; and by his bitterness he made me bitter, who am sweet. Hence his blood will come upon him, that is: he himself will be the cause of his own death, according to what David says to the man who announced the death of Saul and related that the king of Israel had been slain by him: Your blood be upon your head. Not by my sentence, but by the blood of Saul will your blood be shed. And what follows: And his reproach the Lord will restore to him, agrees with that sense which Nathan speaks to David: You who have made the enemies blaspheme the name of the Lord, on account of this thing, that is, on account of this sin by which you killed Uriah, that very blasphemy and reproach, by which the Lord was blasphemed through you, will be turned upon your head. The heretics always provoke the merciful God to anger, and by the hardness of their heart they compel him who prefers the repentance of the sinner to his death to punish them; and their blood, by which they have shed both their own blood and that of many, will come upon their head; and the reproaches with which they have blasphemed the Lord, their Lord will restore to them, not that he is their Lord, but because he was once their Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
