[[commentary]]
quote='''
And I turned, and lifted up my eyes, and saw, and behold, a flying scroll. And he said to me: What do you see? And I said: I see a flying scroll; its length twenty cubits, and its breadth ten cubits. And he said to me: This is the curse that goes forth over the face of the whole earth, for every thief, as it is written there, shall be judged, and everyone who swears shall likewise be judged by it. I will bring it forth, says the Lord of hosts, and it shall come to the house of the thief, and to the house of him who swears falsely by my name, and it shall remain in the midst of his house, and shall consume it, and its timbers, and its stones. LXX: And I turned, and lifted up my eyes, and saw a flying sickle. And he said to me: What do you see? And I said: I see a flying sickle, of twenty cubits in length, and ten cubits in breadth. And he said to me: This is the curse that goes forth over the face of the whole earth, for every thief shall by it be punished unto death, and every perjurer shall by it be tormented unto death. And I will bring it forth, says the Lord Almighty, and it shall enter into the house of the thief, and into the house of him who swears falsely by my name, and it shall rest in the midst of his house, and shall consume it, and its timbers, and its stones. Having turned, says the prophet, to another vision, and lifting up my eyes from joyful and happy things to sadder ones, I see a flying scroll, which in Hebrew is called megella, and was rendered by Aquila and Theodotion διφθέρα (hide), by Symmachus κεφαλὶς, that is, a heading, according to what we read in the psalm: At the head of the book it is written of me; or, according to the Seventy, Δρέπανον πετόμενον, that is, a flying sickle. For all that he had seen above had announced the building of the temple, the coming of the Lord Savior, the liberation of the people from Babylon. And so, lest his heart be lifted up, as with the Apostle — to whom was given an angel of Satan to buffet him, lest he exalt himself —, he too sees things that are sad, so that whatever arrogance had grown from the revelation of good things might shrink from the threat of sad ones. And a flying scroll is shown, in which the sins of all are written down, so that each may receive according to his works, whether good or evil, as Daniel says: Thrones were set, and the books were opened. But if we take it as a sickle, as the LXX translated, let us take an example from the Apocalypse of John, in which it is written: And the angel answered, and said to him who sat upon the horse: Put in your sharpest sickle, and reap your vineyard, for its grapes are ripe. Instead of a sickle we read in Deuteronomy of arrows and a sword: I will make my arrows drunk with blood, and my sword shall devour flesh. And because God did not spare the angels who sinned, who by their own fault lost their heavenly dwelling, therefore he himself says through Isaiah: My sword has been made drunk in heaven. For all the sinners of the people shall perish by the sword, not, surely, by a bodily sword — since there are many and various ways to death besides the sword —, but by a spiritual sword, with which those are to be struck who have not repented, and whom the psalmist threatens, crying out: Unless you are converted, he will brandish his sword; he has bent his bow and made it ready, and in it he has prepared the vessels of death. And in Jeremiah we read: How long will you cut, O point, or sword, of the Lord? How long will you not be still? Return into your sheath. This sword is called not only a sickle, which cuts down hay, stubble and thorns, but it is also called the axe of the trees, which will cut down those who have not brought forth fruits worthy of repentance; and of whom John the Baptist cried out: Behold, the axe is laid to the roots of the trees; every tree that does not bear good fruit will be cut down and thrown into the fire. This scroll, in which the sins of all are written down, or this sickle, which cuts down the offences of all, is sent into the vineyard of Sodom, of which it is written: Our enemies are without understanding, for their vine is of the vineyard of Sodom, and their shoot from Gomorrah. Their grape is a grape of gall, and theirs a cluster of bitterness. Their wine is the fury of dragons, and the incurable fury of asps. This sickle has twenty cubits of length and ten of breadth, in which number joyful things are joined with sad. For the Lord rebukes in order to amend; and in the twenty, which is made up of two decades, harsh and sad things are announced; in the ten, that is, one decade, better and prosperous things; for Israel is instructed through all scourges and punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
