[[commentary]]
quote='''
Daughter of my people, gird yourself with sackcloth and sprinkle yourself with ashes; make for yourself the mourning for an only-begotten — or a beloved —, a bitter lament — or a pitiable one —, for suddenly the destroyer will come — or misery — upon us — or upon you — ! Since he had said above: Do not go out into the fields, and do not walk on the road, for the sword of the enemy, terror is all around, and had forbidden flight as well, he teaches what they ought to do: namely, that they be converted to repentance and have this as their firmest and safest armor. Where we have said: make for yourself the mourning for an only-begotten, for 'only-begotten' in the Hebrew is written 'iaid', which means 'solitary' rather than 'only-begotten'. For if it were 'beloved' or 'lovable', as the Seventy translated, 'ididia' would be set down, which is also the name God gave to Solomon. And nothing is more grievous than to lose one son, or an only son. And that which we have translated: for suddenly the destroyer will come or misery upon us, the Seventy rendered upon you, whereas God has spoken far more mercifully, testifying that whatever is to come upon his people comes upon himself as well. 'The destroyer', moreover, properly signifies either Nebuchadnezzar or the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
