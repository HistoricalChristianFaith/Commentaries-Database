[[commentary]]
quote='''
And it shall be in that day, the remnant of Israel, and those who have been saved of the house of Jacob, shall no more lean upon him who strikes them, but shall lean upon the Lord, the Holy One of Israel, in truth. The remnants shall be converted, the remnants, I say, of Jacob, to the mighty Lord. For if your people Israel be as the sand of the sea, a remnant of it shall be converted. The consummation cut short shall overflow with righteousness. For the Lord God of hosts will make a consummation and a cutting short in the midst of all the earth. Where in the Greek it says: The remnants of Jacob shall be converted to the mighty God, for mighty God there is written in the Hebrew EL GIBBOR (אל גבור), two names of the six names by which, as we read above, the little child and son who is given to us was called. And where it is written: The remnants shall be converted, in place of that it is said in the Hebrew in the singular number, what is left shall be converted, that is, τὸ ὑπόλειμμα ἐπιστρέψει; in the Hebrew it is written SAR JASUB (שאר ישוב). And from the occasion of this expression they think that Jasub son of Isaiah went before as a sign of the people that was to be saved out of Israel. So when the light of Israel and the holy one has consumed the forests and briers of Carmel, and the Assyrian king has fled with a few, then the remnant of Israel, who with Hezekiah as their prince, when the other cities of Judea had been taken, were besieged in Jerusalem, will in no way trust in the Assyrian, as they do now under king Ahaz, who sent messengers to the king of the Assyrians, saying: I am your servant; come up and free me from the hand of the king of Syria, and from the hand of the king of Israel, who have risen up against me (2 Kgs 16:7); when he took the gold and silver that was found in the treasuries of the house of the Lord and in the king's house, and sent gifts to the king of the Assyrians, and the Assyrian king hearkened to him, and came to Damascus, and took it, and carried it away, and killed Rezin; but, freed from that very Assyrian, the smiter, who had first been a friend and afterwards proved an enemy, they will lean and rely upon the Lord the Holy One of Israel, not falsely, as they had done under the former kings, but in truth. This we read was done under Hezekiah, so that, forsaking their idols, they were converted to the worship of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
