[[commentary]]
quote='''
Saw, he says, the islands, that is, the nations round about, and were terrified by his power: and the ends of the earth: namely Shem the son of Noah, who at the furthest time of the lands had escaped from the Flood with his father and his brothers, and had been preserved until that time (Gen 14). Him they want to be understood as Melchizedek, and that he came to meet Abraham as he returned from the battle, and received him, and blessed him, and strengthened him with the blessings of God; and that he is the coppersmith who forged Abraham and with the hammer of his art brought him out into better things, and said to him: It is good that you be glued to the fear of the Lord and joined to him. And he strengthened him, or made him solid, with the nails of the Lord's precepts, so that he should not be moved but should abide in his fear,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
