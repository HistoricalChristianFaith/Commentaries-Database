[[commentary]]
quote='''
And you pervert the words of the living God, the Lord of hosts, our God. Thus shalt thou say — or shall you say — to the prophet: What has the Lord answered you and what has the Lord spoken? But if you say: The burden of the Lord — up to here it is not found in the Seventy; and there follows: because of this, thus says the Lord: Because you have said this word: The burden — or the taking up — of the Lord, and I sent to you saying: Do not say the burden — or the taking up — of the Lord, therefore, behold, I will lift — or I will take up — you, carrying you, and I will forsake you and the city which I gave to you and to your fathers, from before my face, and I will give you over to everlasting reproach and eternal ignominy, which shall never be blotted out by oblivion. The Lord commanded that the word of 'burden' and 'weight' and 'taking up' should by no means be spoken among the people, but that of 'answer' and 'word of God'. And because the people had disdained to fulfill this, he interprets the very word upon them and says: 'Since you have said what I did not wish, and this when I often sent prophets and ordered you not to say it, therefore I will fulfill in deed upon you your word of taking up, burden and weight; for I will take you up and lift you and carry you, and dash you down, and make you fall from on high to the ground — and not only you, but your city too, which I gave to your fathers — and I will give', he says, 'over to reproach and everlasting ignominy, which shall never be blotted out by oblivion'. We know that this was done at the time of the Babylonian captivity too; but it is fulfilled more fully and more perfectly after the passion and resurrection of the Savior, when the Lord said: your house shall be left to you desolate, and the sentence will remain until its end. Let us also say it otherwise, at least according to the Seventy: lēmma means not only 'taking up' but also 'gift and present'. Since, therefore, the people always promised itself prosperity, he says that they ought by no means to say this any longer; for they are unworthy of the gifts and presents of God, and are rather to be cast away and wholly abandoned by the help of God. And moreover, things are often shown both by words and by the interpretation of names, as the changed names of Abraham, of Sarah, and of Peter and the sons of Zebedee signify a change of things, and in this same prophet 'Phaschor' is called 'fear' or 'removal' and 'settler' or 'stranger'. It must be noted that the words: of the living God, the Lord of hosts, our God the Latin and Greek codices do not have, and the Hebrews read them in their volumes against themselves, which properly signifies the mystery of the Trinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
