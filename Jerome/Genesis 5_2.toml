[[commentary]]
quote='''
Male and female he made them, and he blessed them, and he called their name Adam, that is, man. And the name of man fits the male as much as the female.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
