[[commentary]]
quote='''
Further, according to the Seventy, who for amen rendered the true God, so that the true God is blessed, and those who swear upon the earth swear by the true God: we do not, according to the error of the Arians, refer this only to the person of God the Father, of whom it is written: That they may know you, the only true God, and Jesus Christ whom you have sent (John 17:3), but to the Son, who is himself also true God, as the evangelist John says: The Son of God has come, and has given us understanding, that we may know the true one, and may be in his true Son Jesus Christ (1 John 5:20). This is the true God and eternal life. For if the Savior says of himself: I am the truth (John 14:6), consequently the true God received his name from truth, so that he is by no means called God after the manner of false gods, but after the manner of the true God the Father, and is himself true God. Otherwise, if he is not true, he will be like an idol, which recoils upon the heads of those who deny that Christ is true God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
