[[commentary]]
quote='''
(Verse 18.) And now, what do you want, on the way of Egypt, to drink the water of Shior? And what do you want on the way of the Assyrians, to drink the water of the river? Concerning Shior, we have interpreted it as turbid, because the Hebrew word signifies that. The common edition has it as Geon. Therefore, because he had previously mentioned the sons of Memphis and Taphnis, who had violated Israel up to the crown: now he more clearly mentions Egypt itself. There is no doubt that the Nile has turbid waters, and it signifies the river of the Assyrians, as Scripture says, that the promised land extends from the river of Egypt to the great river Euphrates. But those who abandon Christ, the source of life, and dig for themselves the pits of heretics who cannot contain the waters of doctrine, must necessarily submit to the lions who reduce their land to a wasteland and destroy all the Churches. They will be polluted even to the top, and drink turbid waters from the streams of the Assyrian river and the North wind, from which evil is kindled upon the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Woe to you, devil, or Antichrist, or perverse doctrine of the heretics, who with your teachings and your turbid potion make drunk the peoples of the deceived, and overturn their former faith, giving them a potion not from Siloam, not from the Jordan, not from the springs of Israel, but from the brook Kidron, and from the river of Egypt, of which Jeremiah says: What have you to do with the way of Egypt, that you should drink the water of Gihon? For this in the Hebrew is written sior, that is, turbid and muddy; for although the rivers of Egypt are believed to go out from the paradise of the Scriptures, yet because they are trampled by the feet of Pharaoh, they have lost their splendor, and, defiled by the Egyptian mud, have been turned into torrents, at having escaped which the holy one rejoices, saying: Our soul has passed through the torrent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
