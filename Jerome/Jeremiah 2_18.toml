[[commentary]]
quote='''
Woe to you, devil, or Antichrist, or perverse doctrine of the heretics, who with your teachings and your turbid potion make drunk the peoples of the deceived, and overturn their former faith, giving them a potion not from Siloam, not from the Jordan, not from the springs of Israel, but from the brook Kidron, and from the river of Egypt, of which Jeremiah says: What have you to do with the way of Egypt, that you should drink the water of Gihon? For this in the Hebrew is written sior, that is, turbid and muddy; for although the rivers of Egypt are believed to go out from the paradise of the Scriptures, yet because they are trampled by the feet of Pharaoh, they have lost their splendor, and, defiled by the Egyptian mud, have been turned into torrents, at having escaped which the holy one rejoices, saying: Our soul has passed through the torrent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
And now what do you want on the way of Egypt, to drink the water of Sior? And what have you to do with the way of the Assyrians, to drink the water of the river? For 'Sior' we translated 'turbid', which is what the Hebrew word signifies; for it the common edition has 'Geon'. Since, then, he had set down above the sons of Memphis and Tahpanhes, who debauched Israel even to the crown of the head, he now names Egypt itself more plainly. And no one doubts that the Nile has turbid waters, and that by the river of the Assyrians he signifies the Euphrates, as Scripture says that the land of promise extends from the torrent of Egypt even to the great river Euphrates. But those who have forsaken Christ, the fountain of life, and have dug for themselves the pits of the heretics, which cannot hold the waters of doctrines, must needs be subjected to the lions, who reduce their land to a wilderness and destroy all the churches, and be polluted even to the crown of the head, and drink turbid waters and the streams of the Assyrian river and of the north, whence evils blaze up upon the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
