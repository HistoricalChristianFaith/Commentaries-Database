[[commentary]]
quote='''
Thus says the Lord: For three crimes of Tyre, and for four, I will not turn him back, because they shut up a perfect captivity in Idumea; and they did not remember the covenant of brothers, and I will send fire upon the wall of Tyre, and it shall devour its houses. LXX: Thus says the Lord: For three impieties of Tyre and for four I will not turn away from her, because they shut up the captivity of Solomon in Idumea, and they did not remember the testament of brothers. And I will send forth fire upon the walls of Tyre, and it shall devour its foundations. The same three and four impieties or crimes which he had imputed to Damascus, to Gaza, and to Azotus, and to Ashkelon, and to Ekron, and to the remaining cities of the Philistines, he heaps upon Tyre as well, and he reproaches it for having shut up a consummate and perfect captivity in Idumea, concerning which we spoke above: And they did not remember the covenant of their brothers. We ask how the Tyrians are brothers of the Jews? He here calls brothers those who are friends and joined by close ties, because Hiram, the prince of Tyre, had friendship with David and Solomon, to such a degree that he, for the building of the temple and of the palace, brought cedar wood on rafts as far as Joppa; and they bestowed grain and oil on the Tyrians, and gave them twenty cities in Bashan as a gift; which he refused to accept, because they were full of grass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
