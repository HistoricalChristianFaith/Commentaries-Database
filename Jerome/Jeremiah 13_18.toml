[[commentary]]
quote='''
Say to the king and to the mistress — or say to the king and to the mighty —: Humble yourselves, sit down, for there has come down — or there has been taken away — from your head the crown of your glory! The cities of the south are shut up, and there is none who opens; all Judea has been carried away — or all Judah has been carried away — with exile complete — or captivity —. The prophet is commanded to speak to King Jeconiah and to his mother, whom he calls lady and mistress or queen, that they should humble themselves and sit in the dust; for they have lost the royal dignity and are to be handed over to the Babylonian king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
