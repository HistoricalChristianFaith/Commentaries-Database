[[commentary]]
quote='''
Lastly, He sets before them His own example, that so should they little weigh His words, His deeds might shame them, whence He adds, As also the Son of Man cometh not to be ministered unto, but to minister.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Even as the Son of Man did not come to be served but to serve. Note what we have often said: that the one who serves is called the Son of Man. And to give his life as a redemption for many, when he took the form of a servant in order to shed his blood for the world. And he did not say to give his life as a redemption for all, but for many, that is, for those who would be willing to believe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
