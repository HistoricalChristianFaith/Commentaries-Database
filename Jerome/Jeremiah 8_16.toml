[[commentary]]
quote='''
From Dan was heard the snorting of his horses, at the sound of the neighings of his fighters — or of his cavalry — the whole land was shaken; and they came and devoured — or and they will come and will devour — the land and its fullness, the city and its inhabitants. So the people did not say, as the Seventy translated above: let us enter the fortified cities, but: the fortified city, so as to signify Jerusalem. And indeed he now also adds: the city and its inhabitants. Nebuchadnezzar is described coming with his army from Dan, through Phoenicia, at which place the river Jordan rises; and what the Seventy give as things to come, the Hebrew, in accordance with the truth of the event, records as already done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
