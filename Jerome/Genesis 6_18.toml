[[commentary]]
quote='''
And when the flood was impending, Noah is commanded: Enter into the ark, you and your sons, and your wife, and the wives of your sons. And afterwards, when the flood was over, it is said to him: Go out, you and your wife, and your sons, and their wives, so that those who had been separated in the ark while the peril hung over them, once restored to the world, might devote themselves to begetting and to children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
