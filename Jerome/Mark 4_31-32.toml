[[commentary]]
quote='''
The preaching of the Gospel is the least of all teachings. For at the first hearing of its doctrine it has no credit of truth, since it preaches a man who is God, Christ dead, and the stumbling block of the cross. Compare a teaching of this kind with the doctrines of the philosophers and with their books, and with the splendor of their eloquence and the composition of their discourses, and you will see how much smaller than the other seeds is the sowing of the Gospel. But those, when they have grown, show nothing pungent, nothing vigorous, nothing vital; the whole of it bubbles up, flabby and withered, into garden herbs and grasses which quickly dry up and collapse. This preaching, however, which seemed small in the beginning, when it has been sown either in the soul of the believer or in the whole world, does not rise up into garden herbs but grows into a tree, so that the birds of the sky, by which we ought to understand either the souls of believers or powers given over to the service of God, come and dwell in its branches. The branches of the Gospel tree that has grown from the grain of mustard seed I take to be the diversities of doctrines, on which each of the birds mentioned above rests. Let us too take up the wings of a dove, so that, flying to higher places, we may dwell in the branches of this tree and make ourselves little nests of teachings, and, fleeing earthly things, hasten toward heavenly ones. Many, reading that the grain of mustard seed is the least of all seeds, and what is said in the Gospel by the disciples, Lord, increase our faith, and the answer given them by the Savior, Amen I say to you: If you had faith like a grain of mustard seed, you would say to this mountain: Move from this place, and it would move, think either that the apostles are asking for a small faith or that the Lord is in doubt about a small faith, whereas the apostle Paul judges faith compared to a grain of mustard seed to be the greatest. For what does he say? If I have such faith that I move mountains, but do not have love, it profits me nothing. Therefore what the Lord said is done by a faith that is compared to a grain of mustard seed, this the Apostle teaches can be done by faith entire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
