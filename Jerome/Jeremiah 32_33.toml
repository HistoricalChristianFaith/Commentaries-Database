[[commentary]]
quote='''
And they turned to me their backs and not their faces. According to what is written elsewhere: and they turned against me a withdrawing shoulder. For he who prays, with neck bowed, is cast prone upon the ground; but he who turns his back shows by the very gesture of his body that he disregards the one who threatens. 'And this', he says, 'they were doing'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
When I taught them at dawn and instructed them, and they would not listen, so as to receive discipline. 'When the darkness of error and all worship of idols had been put to flight, I desired daily to enlighten their hearts, confuted by my sentence, and to teach them what is right'. And to preserve free will, he joins on and says: and they would not listen, so as to receive discipline. There follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
