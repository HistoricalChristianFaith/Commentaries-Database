[[commentary]]
quote='''
And you shall say to them: Thus says the Lord: Shall he who falls not rise again? And he who has turned away, shall he not return — or shall he not turn away — ? After such great evils he calls to repentance those who were able to remain, or before they come. He has threatened these things; he exhorts them to conversion and gives room for repentance. But what is written according to the Hebrew: and he who has turned away, shall he not turn away, signifies this: that he who has turned away from God, if he is willing to be converted to better things, can also turn the fury of God to better things, and withstand what is coming, and escape the blows by prayers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
