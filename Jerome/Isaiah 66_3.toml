[[commentary]]
quote='''
And what follows in the common edition: But the wicked man, is not found in the Hebrew, but it simply joins on and says: He who sacrifices an ox is as one who kills a man. This is also written in another place: I desire mercy, and not sacrifice: the knowledge of God rather than holocaust (Hos 6:6). And through Malachi: All that I hated, you did: covering my altar with tears: is it fitting that I should look upon your sacrifice, and receive anything acceptable from your hands (Mal 2:13)? Let the Jews hear that God does not seek sacrifices, but the mind of those who offer. And he who slaughters, he says, a sheep is as one who brains a dog. Hence it is also written through Moses: You shall not offer the hire of a harlot, nor the price of a dog, in the house of your God. (Deut 23:18). And the dog and the harlot are fittingly joined, because each animal is prone to lust. And at the same time let us consider that he did not say: He who sacrifices a ram is as one who sacrifices a dog; but as one who kills, he says, a dog. This word is not used of sacrifices, but of things that are slaughtered unlawfully. He who offers an oblation and sacrifice is as one who offers swine's blood. This too is itself forbidden by the Law; such are the ceremonies of the Jews (Lev 11, and Deut 14). He who gives frankincense is as a blasphemer, or rather as one who blesses an idol. But this too may be the sense: After my Son, who came meek and poor, sitting upon the colt of an ass, I do not want flesh, I detest victims, I reject the sacrifices of the Jews and the shadows of the Law, because the truth of the Gospel is delightful to me (Zech 9, and Matt 21, and Luke 19, and John 12). But if this is said, that after the lightning of the Gospel the old religion ceases in the cloud, what will they answer who, believing from among the Jews, think that they can offer sacrifices carnally without harm to themselves?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
