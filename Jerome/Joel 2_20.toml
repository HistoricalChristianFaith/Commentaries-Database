[[commentary]]
quote='''
And the Assyrian and Chaldean, who is from the north, I will put far from you, of whom it is written above: A people many and strong, before its face a devouring fire, and behind it a burning flame; like the appearance of horses is their appearance. And I will drive him, he says, into a land of solitude; and his front parts will fall into the eastern sea, and his hinder parts into the last sea, and his stench will go up, that is, the stench of him who is from the north, and his rottenness, because he acted proudly. I have often pointed out that under the figure of locusts is described the onset of the Chaldeans, by which Judea was laid waste. Accordingly he keeps the metaphor in what remains, and speaks according to the situation of the province, so that he seems to speak not of enemies but of locusts. Even in our own times we have seen hosts of locusts cover the land of Judea, which afterwards, by the mercy of the Lord, while the priests and peoples were entreating the Lord between the vestibule and the altar, that is, between the place of the cross and of the resurrection, and were saying: Spare your people, were hurled, as a wind arose, into the first and the last sea. By the first sea, which is near the desert and faces the east, understand that in which Sodom and Gomorrah, Admah and Zeboiim once stood, which is now called the Dead Sea, because no living creatures live there. And the last sea is this one which is toward the west, and which leads to Egypt, on whose shore Gaza, and Ashkelon, Azotus and Joppa, and Caesarea, and the other maritime cities are situated. And when the shores of both seas were filled with heaps of dead locusts, which the waters had vomited up, their rottenness and stench were so noxious that they corrupted even the air, and a pestilence arose among beasts and men alike. Does the learned reader ask where this happened according to the letter in the case of the Chaldeans? Not long after the time when these things were prophesied: for in Isaiah we read that one hundred and eighty-five thousand of the Chaldeans were struck down in one night under King Hezekiah, the angel raging against them. This we have said according to the history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
Him also who is from the north — of whom Jeremiah speaks: From the north evils shall blaze up upon all the inhabitants of the land; of whom Solomon also writes: The north wind is a most harsh wind —; I will put him far from you, he says, and I will drive him into a land pathless and desert, which has no knowledge of God, in which the Holy Spirit does not dwell. And his face will be in the first sea and in the last sea, in those who have opened to him the door of sins, and with whom they have remained to the last moment of life; and his stench and rottenness goes up even upon those who promise great things to themselves, and fall through pride, because human frailty is never safe, and the more we grow in virtues, the more we ought to fear lest we fall from the heights. According to the letter, it is the south wind rather than the north wind that usually brings swarms of locusts, that is, they come not from the cold but from the heat. But since he was speaking of the Assyrians, setting forth the likeness of locusts, he therefore put in the north wind, so that we should understand not a real locust, which usually comes from the south, but under the locust the Assyrians and Chaldeans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
