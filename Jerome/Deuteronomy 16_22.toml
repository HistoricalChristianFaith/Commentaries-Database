[[commentary]]
quote='''
Nor indeed let that be thought contrary to our exposition which the Lord commanded in the Law: "You shall not make for yourself a monument, things which the Lord your God hates"; but to the singular number "a monument" he joined a plural of the neuter gender, saying, "things which the Lord your God hates," that is, you shall not do such works as remain for your condemnation forever. For these things the Lord your God hates. If perchance, through our negligence, he who oversows tares should erect such monuments in the land of promise, the clear-sighted ones (dioratikoi), namely the teachers, command the children of Israel to overthrow them and undermine them and banish them from the land that flows with milk and honey. Such a monument Absalom too built for himself, an empty tomb, which remains to this day for the disgrace and testimony of the parricide. Into such a monument Lot's wife too was turned, because she wished to look not at what lay ahead but behind her back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
