[[commentary]]
quote='''
The pains, then, that seized the tower of the flock are the pains of the underworld and the pains of death, which surrounded indeed and hemmed in even the Savior, but could by no means seize him, as he himself says in Psalm 17 (18): The pains of death surrounded me, and the torrents of iniquity troubled me, and the pains of hell hemmed me in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
