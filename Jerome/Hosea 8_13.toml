[[commentary]]
quote='''
They also made altars for this reason, not to please me, but so that, when many victims had been sacrificed, they might eat their flesh, according to what the Lord says in the Gospel: Amen, amen, I say to you, you seek me, not because you saw signs, but because you ate of the loaves and were filled. For they put all their zeal for victims into devouring the sacrifices, not into pleasing God through them; nor will the Lord accept those which they sacrificed not to him, but to their own belly and gullet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Now he will remember their iniquity and will visit their sins; they will be turned back into Egypt.

And Israel has forgotten his Maker and has built shrines, and Judah has multiplied fortified cities; and I will send fire upon his cities, and it will devour his dwellings. LXX: Now he will remember their iniquities, and will avenge their injustices; they have turned back into Egypt, and Israel has forgotten him who made him, and they have built shrines, and Judah has multiplied walled cities; and I will send forth fire upon his cities, and it will devour his foundations. Between ἀνομίαν, that is, iniquity, and sin there is this difference, that iniquities are before the law, sin is after the law; and for those who persist in their offenses, the Lord will remember their iniquity, which they had committed before the law; but their sins he will not remember, but will take vengeance on them. And he will both remember their old iniquities and visit their former sins for this reason, that they have gone back into Egypt, either asking for help or worshiping the same gods by which they had earlier been led astray, ἄπιν (Apis) and μνεῦιν (Mnevis).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
But according to anagogy, those are called iniquities, that is, both ἀνομίαι and ἀδικίαι (injustices), which we committed before baptism and which have been forgiven us in baptism; but sins are those which we have done after baptism, of which it is also written in the psalm: Blessed are they whose iniquities are forgiven, and whose sins are covered. All of these will be imputed to the heretics, so that both the old iniquities and the new sins are brought back upon them. For those who had gone out of Egypt through the confession of Christ have gone back into Egypt through faithlessness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
What we read according to the LXX translators, ÷ and in Assyria they ate unclean things :, is not found in the Hebrew, and therefore it must be marked beforehand with an obelus. We can, however, say that the Israelites, longing for Egypt, were taken captive by the Assyrians and there ate unclean things, according to Ezekiel, who describes them as having eaten food offered to idols in Chaldea, food so polluted with the filth of idols that it is compared to human dung. The heretics too, whose princes are the Assyrians — of whom we have often spoken — eat unclean things among them, while they are defiled by their filth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
