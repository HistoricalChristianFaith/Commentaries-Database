[[commentary]]
quote='''
And all the people was gathered against Jeremiah in the house of the Lord. And the princes of Judah heard these words, and they went up from the king's house to the house of the Lord and sat in the entrance of the new gate of the Lord. Jeremiah was prophesying the words of the Lord in the temple and had said: I will make this house like Shiloh, and this city a curse to all the nations of the earth, and at once, a riot having been stirred up by the priests and prophets and people, the whole crowd is gathered against the prophet into the temple, where the prophet was and was being held by the hands of the priests and prophets and crowd.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
