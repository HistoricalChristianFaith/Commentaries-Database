[[commentary]]
quote='''
Assur indeed is interpreted "the devil": truly so, because he is both the enemy and the avenger, as is written in the eighth psalm, "That you may destroy the enemy and the defender." He himself makes us sin, and he himself accuses us for punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
