[[commentary]]
quote='''
Thus says the Lord of hosts, the God of Israel: they shall still say this word in the land of Judah and in its cities, when I turn back their captivity: the Lord bless you, beauty of righteousness, holy mountain! And Judah shall dwell in it, and all its cities together, husbandmen and those who drive flocks. LXX: thus said the Lord of powers, the God of Israel: they shall still say this speech in the land of Judah and in its cities, when I bring back its exile: blessed be the Lord upon his righteous holy mountain, and those who dwell in the land of Judea and in every city of it with the husbandman; and he shall be lifted up in the flock. According to the Hebrew it is plain that at the return of Israel, its captivity having been turned back into its own land, the cities of Judah dwell, and it is said to them one by one: the Lord bless you, who is truly the beauty of righteousness and the holy mountain, in which whoever dwells will fear no snares; and Judah will dwell without iniquity in its cities, and there will be husbandmen and a multitude of cattle. This seems to have been fulfilled in part under Zerubbabel and Ezra, but let the fullness of the prophecy be referred to the times of Christ: either to the first coming, when these things were done spiritually, or to the second, when all things are fulfilled — according to us spiritually, according to the Jews and our Judaizers carnally. Further, according to the Seventy this is the sense: 'this speech shall still be spoken in the land of Judah and in its cities, when I turn back its captivity'. What shall be spoken? Blessed be the Lord upon his righteous holy mountain. The mountain which deserves to receive the name 'of righteousness and of holiness' is no other than the Savior; for the rest, it is foolish, with Jewish error, to believe an irrational and insensible mountain 'righteous and holy'. He it is of whom it is also written in what follows: and in every city of it — understood: of the Savior — with the husbandman; no doubt it signifies God, of whom it is written in the Gospel too: I am the vine, you the branches, and my Father is the husbandman; whence also the Apostle says: you are God's husbandry, God's building. And what follows: and he shall be lifted up in the flock, shows this: that in the several flocks the righteous and holy one and husbandman, the Lord himself, is lifted up, and in his servants and believers ascends to the heights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
