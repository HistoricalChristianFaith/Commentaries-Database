[[commentary]]
quote='''
There is also a certain praiseworthy denial, of which the Apostle himself says: "That, denying impiety and worldly desires, we may live purely and justly and piously in this present age, awaiting the blessed hope and the coming of our Savior God" (Titus 2:12). Whoever denies with this denial, and is willing to follow the Savior when he says, "Whoever will come to me, let him deny himself" (Luke 9:23), having put off the old man with his works and put on the new, will follow his God. But how one denies himself must be considered. The chaste man denies the fornicator that he formerly was; the wise man the imprudent, the just man the unjust, the brave man the weak. And, to speak of all in common, we deny ourselves as often as, trampling on our former vices, we cease to be what we were and begin to be what we were not before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
And he who does not take up his cross and follow me is not worthy of me. In another Gospel it is written: He who has not taken up his cross daily. Lest we think that ardor of faith shown once can suffice, the cross must always be carried, so that we may show that we always love Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Then Jesus said to his disciples: If anyone wishes to come after me, let him deny himself and take up his cross and follow me, and the rest. He who puts off the old man with his deeds denies himself, saying: But I live, now not I, but Christ lives in me, and he takes up his cross and is crucified to the world. And he to whom the world is crucified follows the crucified Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
