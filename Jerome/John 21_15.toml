[[commentary]]
quote='''
Others take it simply, that Simon, that is, Peter, is the son of John, according to the question in another place: Simon of John, do you love me? and he answered: Lord, you know, and they hold that it was corrupted by the fault of the copyists, so that Bar Iona was written in place of Bar Iohanna, that is, son of John, one syllable being taken away. And Iohanna is interpreted the grace of the Lord. But both names can be understood mystically, in that the dove signifies the Holy Spirit, and the grace of God the spiritual gift.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
