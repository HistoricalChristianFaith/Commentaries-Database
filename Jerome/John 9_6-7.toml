[[commentary]]
quote='''
We read in the Gospel according to John (John 9) that the Lord sent the man blind from birth, whose eyes he had anointed with clay made from his spittle, to the waters of Siloam, and when the blind man had washed off the clay in them, his blindness was wiped away and he received the clear light of his eyes: which, beyond the greatness of the sign, indicates that the blindness of the Jews and of every unbeliever cannot be healed otherwise than if the darkness of former error is put to flight by the doctrine of the waters of Christ, which flows gently without the din and clamor of words.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
