[[commentary]]
quote='''
Nor is he content with this end of joy, but he will tread down the impious when they are ash. Hence also there is this prayer for the just: And may God crush Satan under your feet swiftly. Abraham spoke to the Lord, perceiving that in comparison with the divine majesty he was ash: I am earth and ash; and therefore he will see the Sun of justice and will rest in the midst of his lots, and, carried by him, will be lifted up to the heavenly places. But he who through pride said: I will set my seat above the stars, I will be like the Most High, will be brought down to the earth, and will be like ash under the feet of the saints, when the day of the Lord who judges has come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
