[[commentary]]
quote='''
These, according to the Seventy, strike the poor man on the head; according to the Hebrew, they crush the heads of the poor upon the dust of the earth, and they are lifted up into such pride that they are unwilling to walk with the humble. And lest this misdeed be thought small, a son and his father went in to one girl, to violate the holy name of God. Whatever, therefore, is done shamefully is referred to an injury against God, who says: Through you my name is blasphemed among the nations. This is what the Apostle also writes to the Corinthians: It is actually reported that there is fornication among you, and such fornication as is not even among the nations, so that someone has his father's wife. And you are puffed up, and have not rather mourned, so that he who has done this deed might be taken away from your midst. It often happens that a father defiles his son's wife, that is, a father-in-law his daughter-in-law; both of which are forbidden in the law: You shall not reveal the shame of your father, and you shall not uncover the shame of your daughter-in-law. And so the letter too has the greatest usefulness, if it is kept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And the heretics strike the heads of the poor, although this is not read in the Hebrew, because they have turned aside the way of the humble. The way of the humble is that which says: I am the way, and the life, and the truth, which calls us to walk along it, and says: Come to me, all you who labor and are burdened, and I will refresh you. But all the chiefs of the heretics swell with pride, of whom the Apostle also speaks: Lest, being puffed up, he fall into the judgment of the devil; who says: I will ascend into heaven, above the stars of heaven I will set my nest, I will be like the Most High. Hence the proud heretics God resists, but to the humble churchmen he gives grace. The son and the father, too, went in to one girl, to violate and profane the holy name of God. That the people of the Jews is our father, we often read, as Paul says: For I do not wish you to be ignorant, brothers, that our fathers were all under the cloud, and all passed through the sea, and all were baptized into Moses in the cloud and in the sea. And in another place: Ask your fathers, and they will declare to you, your elders, and they will tell you. And again: In place of your fathers sons have been born to you. Hence also, in the Church of the nations, it says: The sons of my mother have fought against me. We, therefore, are the sons, and the father is the people of the Jews. We sin and commit a crime when we go in with our parent to the observance of the sabbath, the injury of circumcision, the ceremonies of the abolished law; to whom the Apostle says: Behold, I Paul say to you, that if you are circumcised, Christ will profit you nothing. And again: Those who are justified in the law have fallen from grace. Whoever enters the Church in such a way as to keep the law within the Gospel, he goes in with his father to the girl, and commits debauchery, and violates the name of God. Hence those who say that it does the Jews no harm, after the coming of Christ, if they so believe in God as to keep the precepts of the law as well, defile father and son in one fornication.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
