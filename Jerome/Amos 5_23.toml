[[commentary]]
quote='''
Take away from me the tumult of your songs, and the canticles of your lyre I will not hear. LXX: Remove from me the sound of your songs, and the psalm of your instruments I will not hear. The beautiful canticles of the Levites, with which they praised God, he calls a tumult and a confused sound, because praise is not beautiful in the mouth of a sinner, and they had been accustomed to offer these same things to idols as well. The prayer of the Jews also, and the psalms which they sing in the synagogues, and the composed praise of the heretics, are a tumult to the Lord and, so to speak, the grunting of a swine and the braying of asses, to whose cries the works of Israel are rather compared. But the psalm and the songs, the lyre and the instruments, take either according to the letter in the people of Israel, things which were once done as an image of things to come, or according to the spirit in us and in the heretics: if we direct them with good works, they are heard by the Lord; if with evil works, he shuts his ears and does not deign to hear the canticles of the ungodly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
