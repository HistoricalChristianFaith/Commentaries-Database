[[commentary]]
quote='''
You deaf, hear, and you blind, look, that you may see. Who is blind but my servant? and deaf but he to whom I have sent my messengers? Who is blind but he who has been sold? and who is blind but the servant of the Lord? You who see many things, will you not keep them? you who have open ears, will you not hear? And the Lord willed to sanctify him, and to magnify the law and exalt it. But this is a people plundered and laid waste; all are the snare of young men, and they are hidden in prison houses; they have become a prey, and there is none to rescue; a plunder, and there is none to say: Give back. Who is there among you who will hear this, who will attend and listen for the time to come? Who gave Jacob up to plunder, and Israel to those who lay waste? Was it not the Lord himself, against whom we have sinned? And they would not walk in his ways, and they did not hear his law. And he poured out upon him the indignation of his fury, and strong war; and he burned him round about, and he did not know it; and he set him on fire, and he did not understand. LXX: You deaf, hear, and you blind, look up, that you may see. Who is blind but my children, and deaf but those who rule over them? Who is blind but he who has received; and the servants of God have been blinded. You have often seen, and have not kept watch; your ears are open, and you have not heard. The Lord God willed that he should be justified, and should magnify praise. And I saw, and the people was laid waste and plundered. For there is a snare in the chambers everywhere, and in the houses together, in which they hid them. They became a plunder, and there was none to rescue the prey, and there was none to say: Give back. Who is there among you who will hear these things and know the things to come? Who gave Jacob up to plunder, and Israel to those who lay waste? Was it not God, against whom they sinned? And you would not walk in his ways, nor hear his law. And he brought upon them the anger of his fury, and war prevailed against them, and those who burned them round about; and each one did not know, nor did they lay it to heart. Lest anyone should think that what is said, You deaf, hear, and you blind, look, that you may see, belongs to the people of the nations, which before was deaf and blind (as the Jews strive to prove by a foolish interpretation), the prophetic word itself shows who ought to be understood as the deaf and the blind. Who, he says, is blind but my servant, and deaf but he to whom I have sent my messengers? There is no doubt that he means the Prophets. Who is blind but he who has been sold by his sins? Who is blind but he who formerly was the servant of the Lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
