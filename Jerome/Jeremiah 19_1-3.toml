[[commentary]]
quote='''
Thus says the Lord: Go and take a potter's earthen flask, and some of the elders of the people and of the elders of the priests, and go out to the valley of the son of Hinnom, which is by the entrance of the earthen gate — or Charsith —, and you shall preach — or you shall cry or you shall read — there the words which I shall speak to you, and you shall say: Hear the word of the Lord, O kings of Judah and inhabitants of Jerusalem! For 'potter's flask', which in Hebrew is called 'bocboc', the Seventy translated 'little jar', and for 'earthen gate' Aquila, Symmachus and Theodotion put the Hebrew word itself, 'Harsith', for which the Seventy, according to their custom, added the Greek 'chi' for the aspiration of the letter 'heth', so as to say 'Charsith' for 'Harsith', just as there is 'Chebron' for 'Hebron', and 'Hiericho' for 'Hieriho'. Now divine Scripture wishes the people to be taught not only by the ears but also by the eyes; for, as we have already said, what reaches the mind by sight is retained in the mind more than what reaches it by hearing. Take, he says, a flask — or an earthen little jar — and some of the elders of the people and of the priests, and go out to the valley of the son of Hinnom, of which we spoke above, where there was the shrine of Baal and the grove and wood watered by the springs of Siloam. 'And this valley,' he says, 'is by the gate' which in the Hebrew tongue is called 'Harsith', that is, 'earthen'. 'And you shall preach — or you shall read — there the words which I shall speak with you, so that what I am about to say may be heard there.' And the reason why, as we have already said, 'you shall preach' and 'you shall cry' and 'you shall read' are all set down, is that the Hebrew word 'carath' signifies three things. And he wishes both the kings of Judah and the inhabitants of Jerusalem, that is, both the royal stock and the whole people, to hear what he is about to say, so that those who refuse to hear may be without excuse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
