[[commentary]]
quote='''
For the earth will be filled so that it may know the glory of the Lord, that is, when Babylon has been overthrown, the might of God's power will become manifest to all; like waters covering the sea, so the whole earth will be filled with the glory of the Lord, just as the waters cover the bed and the bottom of the sea. These things, as we have said, are according to the letter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
