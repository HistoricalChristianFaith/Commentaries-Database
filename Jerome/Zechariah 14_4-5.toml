[[commentary]]
quote='''
Let us speak παραφραστικῶς (by paraphrase), so that what is written may become clear: When the Mount of Olivet has been broken open by a great abyss, so that one part of the abyss faces east, the other west, suddenly in that very abyss, sheer and lofty on either side, another abyss will break open, one toward the north, another toward the south, and the chasm will become four-cornered, so that the abyss stretches in four directions, to the four quarters of east and west, of north and south. And you shall flee, he says, to the valley that is between the temple and Zion. For these two mountains, of the temple and of Zion, are called the mountains of God; because that valley of the Mount of Olivet, which is girded on this side and that by sheer mountains, will draw its abyss as far as the mountain of the temple, which is holy. But the earthquake in the days of Uzziah king of Judah is said to belong to that time when Uzziah, who is called by another name Azariah, trying to claim for himself a priesthood not lawful for him, was struck with leprosy on his forehead; of this earthquake we also read at the beginning of Amos: The words of Amos, who was among the shepherds of Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah, and in the days of Jeroboam son of Joash king of Israel, two years before the earthquake. In short, after this wicked king died, at whose impiety the whole earth was shaken, Isaiah saw the great vision which he wove into his book. Let us pass to the spiritual understanding. After the Mount of Olives has been separated toward the east and the west by the calling of the nations and the casting off of the Jews, there will again be another cleft, of north and south. The north will be joined to the west, the south to the eastern quarter; on the left will stand the circumcision, on the right the Christian people. Of these two winds the Church speaks: Arise, O north wind, and come, O south wind, so that, as the north wind, a most cold wind, which is interpreted as the devil, withdraws, the south wind, a warm wind, may come; seeking him, the bride says: Where do you pasture, where do you lie down, at noon? Of him Habakkuk too speaks mystically: God will come from Teman; for which it is written in the Hebrew: God from the south, that is, from the fullest light. Of this light the psalmist elsewhere cries out: You give light wonderfully from the everlasting mountains. But when the division of the two peoples in the whole world has become so great that some are separated toward the east and the south, that is, to the right, others toward the north and the west, that is to say, to the left, then whoever is holy will flee to the valley of the mountains of God, of which we spoke above, of the temple and of Zion, that is to say, the two testaments, for that abyss which had formerly belonged to each mountain will stretch as far as Asael, that is, as far as the house of God, which is near to paradise, and to the heavenly Jerusalem, and to the holy mountain on which the temple is set. And as at that time when, under King Uzziah the leper, a most violent earthquake terrified the hearts of mortals and scattered them, terrified, this way and that. So the separation of the two peoples, and again the fellowship of believers in one faith, will rest between the two mountains in a peaceful seat, for the old and the new instrument will both be joined to each other. But what is said, As far as Asael, that is, as far as the nearest, means this: that the two instruments, of the law and of the Gospel, are indeed joined to each other, but joined in such a way that they are neighbors rather than one; for we have let go many things of the old law, and have taken up many of the new grace. And when this has been accomplished in this manner, then, he says, the Lord my God shall come, and all the saints with him. But if, for what we have said, you shall flee, we wish to follow what the other translators translated, The valley of their mountains shall be stopped up, or shall be filled, we shall say this: that the coming of the Lord and Savior, when the two peoples have been separated from each other, stops up and fills that abyss which divided the two peoples, so that they may walk toward each other on a level road.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
