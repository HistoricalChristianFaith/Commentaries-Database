[[commentary]]
quote='''
As a thief is confounded when he is caught, so are the house of Israel confounded, they and their kings, princes and priests and their prophets. Although the face of thieves is shameless and bold, yet it blushes when it has been caught in theft. And so Israel too, saying to wood: You are my father, and to stone: You have begotten me, so as to call those his parents whom he himself had fashioned, is confounded when he has been caught in his idolatry. And lest we think that he says this of the common people, he sets down kings and princes and priests and their prophets. Let us use this testimony if ever our princes, and those who are reckoned leaders in the Church, are caught in shameful sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
