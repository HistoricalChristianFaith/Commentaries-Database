[[commentary]]
quote='''
But the devil, who was a prince, and fell, did not die. For angelic dignity cannot receive death, but only ruin. Therefore he said, you shall fall like one of the princes. 'How is Lucifer fallen, who rose in the morning?' Behold, both here he fell, and there he fell. He fell for this reason, because he always dwelt among the heavenly things. This is he to whom it is said in Ezekiel: 'You are the unsealing of the likeness.' See what he says, the unsealing of the likeness. He did not say, You are the seal of the likeness: but, the unsealing of the likeness. God had sealed you, and had made you like himself: but you afterwards unsealed yourself. After the likeness and image of God you too were formed. Finally it is said in that same prophecy: 'In the midst of the cherubim you were nourished, among the stones of jasper and carbuncle you were in the paradise of God. And you fell,' he says, 'and were wounded from the mountain of the Lord.' This prince of Tyre: now prince of Tyre from the time when he fell: since Tyre in the Hebrew tongue is called sor, that is tribulation. Therefore this prince too, who at first was in heaven, has now been made prince of Tyre, that is, of the tribulation of this world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_014.html'
source_title="Homily 14, on Psalm 81"
