[[commentary]]
quote='''
Just as it was shown above that there are spiritual eyes after the likeness of the bodily lights, so now it must be understood that the knees of the outer man are one thing and those of the inner man another. For that which is said in Isaiah, Be strengthened, you slack hands and loosened knees (Isa. 35:3), and in another place by the Apostle himself, That in the name, he says, of Jesus every knee should bow, of things in heaven, of things on earth, and of things below (Phil. 2:10), pertains not to the knees of the body but to the subjection of the mind and the bowing of the soul and the obedience of the heart, which levels itself with the ground, as the Psalmist also sings, saying: My soul has cleaved to the pavement (Ps. 118:25). For how could the soul, a spiritual and incorporeal thing, cleave to the pavement, a bodily thing? Granted, indeed, that earthly beings bow the knee in the name of Jesus: can we also affirm that the angels and the other virtues, which abide in the heavenly places, have a bodily form, so that they bow the knee in his name? or that the souls in the underworld, freed from the bonds of the body, will bend a knee which they do not have? Therefore, just as whoever is subject to the Savior is said to bend the knee to him, so he who is the slave of sin, and has the spirit of slavery again in fear, is written to have bent the knee to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
