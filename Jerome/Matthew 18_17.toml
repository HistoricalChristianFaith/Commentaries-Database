[[commentary]]
quote='''
If yet he will not hear them, then it must be told to many, that he may be held in abhorrence; so that he who could not be saved by his own sense of shame, may be saved by public disgrace; whence it follows, If he will not hear them, tell it to the Church.

That He says, As a heathen and a publican, shows that he is to be more abhorred, who under the name of a believer does the deeds of an unbeliever, than those that are openly gentiles. Those He calls publicans, who pursue worldly gain, and levy contributions by trading, cheating, and villainous frauds, and perjuries.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Further, if he will not listen even to them, then it must be told to many, so that they may hold him in detestation, and he who could not be saved by shame may be saved by reproaches. But when it is said: Let him be to you as a heathen and a tax collector, it is shown that he who under the name of a believer does the works of unbelievers deserves greater detestation than those who are openly Gentiles. For according to tropology those are called tax collectors who pursue the gains of the world and exact tolls through trade and frauds and thefts, crimes and perjuries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
