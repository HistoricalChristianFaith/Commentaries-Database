[[commentary]]
quote='''
Now the diversity of the prepositions in the words One God and Father of all, who is above all, and through all, and in all conveys a diverse meaning. For God the Father is above all, because he is the author of all. The Son is through all, because he runs through all things and goes through everything. The Holy Spirit is in all, because nothing exists without him. Nor indeed must we think that the one God is also Father of all in common, so that, that is, the name of Father could be applied to irrational beasts; but just as, if among ten men, five sons and five slaves, we were to say alike, "Of these ten, there is one master and one father," we would surely not call him father of all, nor master of all: so too in what he says, One God and Father of all, it must be understood that he is Father of some and God of others. Zeno too, with his Stoics, supposes something of this kind about creatures and about God. Following him, Virgil says (Aeneid 6): For God goes through all lands and the tracts of the sea, etc.; and: In the beginning, the heaven and the earth and the liquid plains, the shining globe of the moon and the Titanian stars, a spirit within nourishes, and mind, poured through the limbs, moves the whole mass and mingles itself with the great body. Some think that what is written, Above all, and through all, and in all, should be referred to the Father, and the Son, and the Holy Spirit in this way: that above all things is the Father, because he is the author of all; through all, the Son, because all things were created through the Son; in all, the Holy Spirit, for he is given to those who believe, and we are the temple of the Holy Spirit; and the Father and the Son dwell in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
