[[commentary]]
quote='''
As much as to say, When the tender shoots first show themselves in the stem of the fig tree, and the bud bursts into flower, and the bark puts forth leaves, ye perceive the approach of summer and the season of spring and growth; so when ye shall see all these things that are written, do not suppose that the end of the world is immediate, but that certain monitory signs and precursors are showing its approach.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Learn a parable from the fig tree. When its branch has already become tender and the leaves have come out, you know that summer is near, and the rest. Under the example of the tree he taught the coming of the consummation. Just as, he says, when the shoots on the fig tree have become tender, and the bud breaks into flower, and the bark brings forth leaves, you understand the coming of summer and the arrival of the west wind and of spring; so when you see all these things that are written, do not think that the consummation of the world is already present, but that certain preludes and forerunners, as it were, are coming to show that it is near and at the doors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
