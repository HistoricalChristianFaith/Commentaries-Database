[[commentary]]
quote='''
By the acceptable year and the day of retribution understand the whole time of his preaching, during which he lived in the flesh. This the apostle Paul too interprets of the first coming of the Savior, saying: Behold, now is the acceptable time; behold, now is the day of salvation (2 Cor 6:2). Of this we spoke more fully above (cf. Isa 60). But if retribution is taken not in the rewards of the good but in the punishments of sinners, in accordance with its being called the day of vengeance, it must be understood of the Jewish people, upon whom, after his passion, the wrath of God came at once.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
