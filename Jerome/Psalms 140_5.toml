[[commentary]]
quote='''
Beside the path they have set a stumbling-block for me. That is: by bringing forward testimonies from the Scriptures, which seemed to have some semblance of reason, they were trying to deceive me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_050.html'
source_title="Homily 50, on Psalm 139"

[[commentary]]
quote='''
This is what we read in the psalm: Beside the path they have set a stumbling block for me. For unless one has seen the path of God, that is, has heard the name of Christ, he will not enter upon it. Therefore the heretics too, under the name of Christ, have set snares beside the path, so that he who believes that he walks in Christ, of whom we read that he himself is the way, may tread also in the snares of those who have contrived madness in the house of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
