[[commentary]]
quote='''
It is no concern of ours that Christ be formed in the people, that each one, returning to his own home, may have the seed of the word of God, so that when he has conceived it he may say with the prophet: "From fear of you, O Lord, we have conceived and brought forth; we have made children of your salvation upon the earth" (Isa. 26:17, 18). Such people pass over into the apostles, and deserve to hear from the Savior: "Whoever shall do the will of my Father, he is my brother, and sister, and mother" (Matt. 12:50): the diversity of their progress being shown in the different names.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
