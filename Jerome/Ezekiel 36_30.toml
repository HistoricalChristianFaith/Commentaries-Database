[[commentary]]
quote='''
Then the fruit of the tree will be multiplied — that is, of wisdom, of which it is written: She is a tree of life to all who seek her — and the produce of the field — in the likeness of Jacob, whose smell was: Like the smell of a full field which the Lord has blessed —, and they will no longer bear the reproach of famine among the nations, which the unbelief of the Jews suffers even today; but, after they have attained blessedness, they will imitate the Apostle, who says: I am not worthy to be called an apostle, because I persecuted the Church of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And the tree of wisdom will be multiplied in them, and the produce will be brought to fullness in their breast, nor will they any longer be a reproach among the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
