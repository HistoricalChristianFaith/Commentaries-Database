[[commentary]]
quote='''
They will run about, he says, like mighty men, no doubt the locusts: and like men of war they shall climb the wall, so that the height of the walls cannot check the onset of the strong, and they enter by no means through the gates, but over the walls: Each one shall walk in his own ways, and they shall not turn aside from their paths. This we saw lately in this province. For when the hosts of locusts came and filled the air which is between heaven and earth, they flew in such order, by the disposition of God who commanded them, that, like the little tesserae which are fixed in pavements by the hand of the craftsman, they kept their place, and did not swerve even by a point and, so to speak, by a nail's breadth, to another. And to make the metaphor plain, and through the windows, he says, they shall fall, and shall not be destroyed. For nothing is impassable to locusts, since they penetrate fields, and crops, and trees, and cities, and houses, and the secret places of bedchambers. But this is said of locusts so that it may be understood of enemies. And where we have translated they shall fall through the windows, and shall not be destroyed, the LXX rendered weighed down in their arms they shall go, and they shall fall upon their javelins and shall not be consumed, which seems to me by no means to fit the order of the exposition; rather the error arose from this, that the Hebrew word sala they understood as javelins, we as windows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
They will climb the wall and every fortification; and fulfilling the work enjoined on them, they will not turn aside to another part, but will cling to the punishments of the wretched, nor will they be sated with their torments, but each will carry out the punishments entrusted to him against sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
