[[commentary]]
quote='''
When he has been made drunk with the cup of the Lord and lulled to sleep by the undiluted chalice, will not all speak over him by way of comparison, a πρόβλημα (a riddle)? Woe to him who, laying waste the whole world, is not sated with plunder, and does not cease to despoil those already stripped, and rages only to this end, that he may devour, and presses himself down with the burden of iniquity and of spoils as with a very heavy collar. And at the same time consider how elegantly he has called multiplied riches thick clay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
When they see him sent into the abyss and handed over to Tartarus, seeing fulfilled the things which they had read in the prophets in parables and αἰνιγματωδῶς (in riddles), and interpreting them concerning him, they will recount with one harmonious voice: Woe to the devil, who has multiplied for himself what is not his own. Woe to the partridge, which has gathered what it did not bring forth. How long? This is either the voice of those who rebuke, or of those who point to the day of judgment. And weighing down his collar with infinite weight. And beautifully: since he is arrogant and proud — and pride is properly shown in the stretching out of the neck and the raising of the nape —, the collar is very heavy, so as to bend what had been raised up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
Some think that what is said: Woe to those who multiply for themselves the things that are not their own, and the rest, can be taken of rich men, who extend the boundaries of their possessions and, thinking that the things which are not man's are man's, gather to themselves things by which they will suddenly be left. But that earthly possession is not man's, that is, not the rational animal's, the Lord too shows, saying: If you have not been faithful in what is another's, who will give you what is your own? And they expound the whole tenor of the chapter of this person. But I do not know whether they can keep the order of the prophetic question and solution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
