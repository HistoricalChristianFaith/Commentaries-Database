[[commentary]]
quote='''
Ephraim himself was mingled among the peoples; Ephraim has become a loaf baked under the ashes, which is not turned over; strangers devoured his strength, and he did not know it. Yes, and grey hairs were spread over him, and he was unaware of it; and the pride of Israel will be humbled before his face, and they have not returned to the Lord their God, and they have not sought him in all these things. LXX: Ephraim was mingled with his peoples; Ephraim has become a loaf baked under the ashes, which is not turned over. Strangers devoured his strength, but he did not know it; and grey hairs blossomed on him, and he was unaware of it; and the insolence of Israel will be humbled before his face, and they have not returned to the Lord their God; and they have not sought him in all these things. The kingdom of the ten tribes became like all the nations, because they withdrew from the Lord; and, like a loaf baked under the ashes which is not turned over, that is, which does not repent, the Assyrians and the Chaldeans devoured its strength, and whatever strength it could have, they swallowed up. And such was its madness that it did not know it had been devoured; or at least it was unaware of the cause for which it had been handed over to those who devoured it. Finally, right up to old age, that is, right up to the last captivity, it persisted in the error it had begun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
