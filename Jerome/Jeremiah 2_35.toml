[[commentary]]
quote='''
And you said: I am without sin and innocent, and therefore let your fury be turned away from me. Behold, I will contend with you in judgment, because you said: I have not sinned. How exceedingly vile you have become — or since you have greatly despised — repeating your ways! These words must be used against those who will not acknowledge their sins, but in the time of affliction and distress say that they suffer unjustly what they suffer, and provoke the wrath of God the more, since it is another and greater sin not to mourn what they have done, but to put forward vain excuses for their sins. In judgment, he says, I will contend with you because you said: I have not sinned, as though it were something greater than this sin to hold one thing in the conscience and to utter another in speech. Let the new heresy sprung from the old hear that it is the very greatest wrath of God to be unwilling to confess sin humbly, and instead to boast shamelessly of righteousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
