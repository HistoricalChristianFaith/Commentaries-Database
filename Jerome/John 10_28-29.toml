[[commentary]]
quote='''
Hence also the sheep of the Lord which follow him are not seized from his hands, and he himself says: What the Father has given me is greater than all, and no one can seize it from the hand of the Father; from which is seen the one power, might and substance of the Father and the Son: for if no one can seize from the Son's hand what the Father has given, and these same things are in the Father's hand and are not seized from him, it is clearly proved that all things are common to the Father and the Son, and that the Father holds in the Son's hand, just as the things that are the Son's are held in the Father's hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
