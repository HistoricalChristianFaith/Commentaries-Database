[[commentary]]
quote='''
The first day of unleavened bread is the fourteenth day of the first month, when the lamb is killed, the moon is at full, and leaven is put away.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now on the first day of the Unleavened Bread the disciples came to Jesus, saying: Where do you wish us to prepare for you to eat the Passover? The first day of the Unleavened Bread is the fourteenth day of the first month, when the lamb is sacrificed and the moon is at its fullest and leaven is cast out. And among those disciples who came to the Lord asking: Where do you wish us to prepare for you to eat the Passover, I reckon that Judas the betrayer was also present.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
