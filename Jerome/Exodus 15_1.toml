[[commentary]]
quote='''
Our motive in going over all this, dearly beloved brethren, is that we may be on our guard, for fear that, after coming out from Egypt and hastening through the desert for forty days—for forty years, as it were—to reach the land of promise, we should long for the fleshpots of Egypt and be bitten to death by the serpents. We have left Egypt; what have we to do with the food of Egypt? We who have bread from heaven; why do we go in search of earthly foods? We who have left Pharaoh, let us call upon the help of the Lord so that the Egyptian king may be drowned in the baptism of those who believe. Let his horses and their riders perish there; let the raging army of the adversary be destroyed. Let us not murmur against the Lord lest we be struck down by him.
'''
source_url=''
source_title="HOMILY 90"

[[commentary]]
quote='''
We have spoken of the horse. The horse and its rider he has thrown into the sea. We have said who the horses are: let us say who the riders are. I think that the horses are sinful men, and the riders are demons who ride upon them. If ever therefore we see some brother a persecutor: him who is called a brother persecuting us and being an enemy: let us know that he is a horse. And he is a horse: but the rider is the devil, who strikes us with his lance. This one runs, and that one strikes. But the horse itself too is driven by the heels, is pierced, and against its will goes mad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"
