[[commentary]]
quote='''
There follows: and their houses will pass to others through the evil of captivity, their fields and wives together, so that both wife and possession pass to the enemy. Whatever we understand according to the letter of Jerusalem, let us refer according to the spiritual understanding to the Church, if she has offended God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
For I will stretch out my hand over those who inhabit the earth, says the Lord. For from the least even to the greatest, all are devoted to avarice, and from prophet even to priest all practice deceit. And they were healing the breach of the daughter of my people with disgrace, saying: Peace, peace! And there was no peace. What in the Hebrew is said: I will stretch out my hand over sinners or the inhabitants of the earth, among the Seventy is always written 'I will lift up'; and each is the posture of one who strikes, according to what is written: and still the hand of the Lord is stretched out or lifted high. The inhabitants of the earth, moreover, are always in vice; whence in Revelation too it is said quite frequently: Woe to the inhabitants of the earth!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
