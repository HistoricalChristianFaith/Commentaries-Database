[[commentary]]
quote='''
As for the heretics, we do not doubt that, going to the Assyrians according to the error of their mind, they think that they are ascending, not descending. Hence it is said to them through Isaiah: What has happened to you now, that you have all gone up onto empty roofs? The prince of these Assyrians is the great mind. Hence Ephraim has sprouted within himself, judging in his presumption that he has grown. Or he has become a solitary wild ass, so as to enter not the planted fields of the Church but the deserts of the devil. He has loved gifts in return for his error, promising himself rewards, or doing everything for the sake of shameful gain. Or at least he has given gifts and payments to his lovers, the demons, and when he has done this, he will be handed over to the Gentiles. For just as the nations worship bodily images, so these men think to be gods the idols which they have fashioned out of their own heart, and therefore they will be reckoned among the number of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
