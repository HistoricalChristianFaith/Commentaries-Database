[[commentary]]
quote='''
Because the God of Abraham, the Maker of heaven, is the Father of Christ, therefore also is Abraham in the kingdom of heaven, and with him will sit down the nations who have believed in Christ the Son of the Creator.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Many will come from the east and the west and will recline with Abraham and Isaac and Jacob in the kingdom of heaven. Because the God of Abraham, the maker of heaven, is the Father of Christ, therefore Abraham too is in the kingdom of heaven, and with him the nations that have believed in Christ, the Son of the Creator, are to recline. And that sense too is likewise fulfilled of which we spoke above, that in the centurion's faith the precedence of the Gentiles is established, since the peoples who will believe from east and west are mentioned with reference to his belief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
