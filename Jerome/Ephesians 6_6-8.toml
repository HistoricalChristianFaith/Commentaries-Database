[[commentary]]
quote='''
Not serving to the eye, as those do who desire to please men, but so as to turn necessity into will, and to make of slavery a reward; above all when the master of the flesh does not command things different from the Lord of the spirit. For this is what he says: Not serving to the eye, as pleasing men, but as slaves of Christ, doing the will of God. But let the slave have that very faithfulness not forced but spontaneous and from the heart, serving his master as he would Christ, from whom he will receive the reward of faithful slavery, no less than if he had served as a free man of his own will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
