[[commentary]]
quote='''
Otherwise, how can God so hold men as the fish of the sea, and as creeping things that have no prince, when the angels of each one daily see the face of the Father who is in heaven, and the angel of the Lord encamps round about those who fear him, and delivers them? Just as, therefore, among men the providence of God runs even through each individual, so in the other animals we can understand a general dispensation, indeed, and order, and course of things. For example, how the multitude of fish is born and lives in the waters, how creeping things and four-footed beasts arise on the earth, and by what foods they are nourished. But it is absurd to bring down the majesty of God to this, that he should know at each moment how many gnats are born, or how many die, what multitude of bugs and fleas and flies there is on the earth, how many fish swim about in the water, and which of the smaller ought to yield as prey to the larger. Let us not be such foolish flatterers of God that, while we drag his power down even to the lowest things, we do injury to ourselves, saying that there is the same providence for rational as for irrational things. Hence that apocryphal book is to be condemned for its folly, in which it is written that a certain angel named Tyri presides over creeping things, and that in this likeness proper angels have been assigned to the fish too, and the trees, and all the beasts, to guard them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
