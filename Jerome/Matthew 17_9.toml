[[commentary]]
quote='''
And as they came down from the mount, Jesus charged them, saying, Tell no man this vision, until the Son of Man shall rise from the dead. He will not be preached among the people, lest the marvel of the thing should seem incredible, and lest the cross following after so great glory should cause offence.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And as they were coming down from the mountain, Jesus commanded them, saying: Tell the vision to no one until the Son of Man rises from the dead. A foretaste of the kingdom to come and the glory of the one triumphing had been shown on the mountain. He does not wish, therefore, that this be preached among the peoples, lest it both be incredible because of the greatness of the thing and, after such great glory, the cross that followed should cause a stumbling block among untaught minds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
