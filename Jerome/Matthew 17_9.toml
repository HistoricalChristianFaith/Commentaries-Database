[[commentary]]
quote='''
And as they came down from the mount, Jesus charged them, saying, Tell no man this vision, until the Son of Man shall rise from the dead. He will not be preached among the people, lest the marvel of the thing should seem incredible, and lest the cross following after so great glory should cause offence.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"
