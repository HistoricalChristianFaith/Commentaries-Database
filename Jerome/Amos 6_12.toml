[[commentary]]
quote='''
The ruins and rents of these two houses he compares to horses and wild oxen: the former cannot run on rocks; the latter are so untamed that they do not take the yoke on their necks, and, being forest cattle, because of their wildness they refuse to cleave the earth with the ploughshare. But you, though horses and wild oxen cannot change their nature, have changed the nature of God, so as to make the sweet one bitter and to turn the fruit of his righteousness into wormwood, which is a most bitter herb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Horses cannot give chase on rocks. The rock is Christ, who granted to his apostles that they too should be called rocks: You are Peter, and upon this rock I will build my Church. Whoever is on these rocks, the adverse powers, which are called horses, of which we spoke above, will not be able to pursue him, their courses being hindered and they falling on every single rock. Let us come also to the other comparison, according to our custom, discussing the edition of the LXX translators, lest, if we cling wholly to the Hebrew, we should seem to have mocked the diligence of the reader, and, by keeping silent about the common edition, to have set it out to no purpose. Or will they keep silent, he says, among the females: there is no doubt that he means the horses, of which he had said above: Will horses give chase on rocks. These horses, that is, the opposing powers, which go mad for the females, do not dare to approach when they see a manly spirit strengthened by the might of God. But when they see an effeminate mind, enervated by ointments and luxuries and turned to womanish softness, at once they go mad, cannot hold themselves back, and are wild with lust. There follows: For you have turned judgment into fury. He turns judgment into fury who judges in anger; and though the Lord says: You shall not accept a person in judgment, and in another place: You shall not pity the poor man in judgment, and: For the judgment is God's, such a man comes down to judge with an angry mind; indeed, though he does not know the case nor understand the truth of the judgment, he decides beforehand what sentence he ought to pass; the fruit of righteousness too, which is most sweet, he turns into bitterness. What we have said of one virtue, let us understand also of the rest, prudence, fortitude, temperance: whoever is angry will not be able to gather their fruits, and when he does gather them, they will be bitter. Hence it is said in Isaiah: Woe to those who call sweet bitter, and bitter sweet. This is said by those who in judging consider not the cases but the persons, and turn the fruit of Christ's righteousness, which is most sweet, into bitterness. Whoever, therefore, in judging is led either by kinship or by friendship, or, on the other hand, by hostile hatred or by enmities, perverts the judgment of Christ, who is righteousness, and turns his fruit into bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
