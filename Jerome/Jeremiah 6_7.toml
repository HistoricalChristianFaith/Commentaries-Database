[[commentary]]
quote='''
As, therefore, a cistern or pit makes its water cold, so in the midst of Jerusalem the wickedness that is in her has lost all the warmth of life. And this is to be noted, that the saints are called fervent in spirit, whereas evils are cold; whence that also is written, that in the last days, when iniquity has been multiplied, the love of many will grow cold. I think that this too means the same: I have been likened to those who go down into the pit. And let the Latin reader understand this, so that it may suffice to have said it once: that 'lacus' [pit] does not mean 'pool' according to the Greeks, but 'cistern', which in the Syriac and Hebrew tongue is called 'gubba'. In the present passage, however, for 'lacus', which all translated alike, in the Hebrew it is 'bor'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
