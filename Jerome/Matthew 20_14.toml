[[commentary]]
quote='''
Take what is yours and go. The Jew under the law is saved not by grace but by work. For he who does it shall live in it. Hence it is said to him:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
