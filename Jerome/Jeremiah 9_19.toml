[[commentary]]
quote='''
How are we laid waste and confounded exceedingly? Because we have forsaken the land, for our tents have been thrown down — or we have cast away —. This is the voice of those lamenting Zion: how are we laid waste and confounded exceedingly? And at once they answer themselves and set out the causes of the devastation, saying: because we have forsaken the land through our own fault and sin, and our tents have been thrown down, which they once possessed as if passing by. Let the crowds of those who once believed say this too in persecution: that they have been laid waste and confounded for this reason, because they have forsaken the land of the Lord and deserted their tents.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
