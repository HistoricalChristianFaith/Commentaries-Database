[[commentary]]
quote='''
To all the kings of the land of Ausitis. It is called 'Vs' in Hebrew, and the history relates that Job too was from it: there was a certain man in the region of Ausitis, named Job. And yet it should be known that this short verse is not found in the Seventy, and that Theodotion translated 'island' for 'Vs'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And to all the kings of the land of the Philistines and of Ashkelon and of Gaza and of Ekron and to the remnants of Ashdod. In general he set down the Philistines, that is, the land of the Palestinians, and in particular their cities Ashkelon, Gaza, Ekron, Ashdod; Gath alone he passed over in silence, which is contained in the 'remnants'. For this is what is written: and to the remnants of Ashdod; for the region of the city of Gath is neighboring and bordering on Ashdod, which in Hebrew is called Esdod. And Isaiah too writes that the Palestinians were captured and laid waste by the Babylonians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
