[[commentary]]
quote='''
To Pharaoh, king of Egypt, and to his servants and to his princes and to all his people and to all in general. After Jerusalem, Pharaoh, king of Egypt, drinks, and his allies; the princes drank, and the whole people, and everyone who is indeed not an Egyptian but dwells in its regions, whom the Seventy translated symmiktous, that is, 'people of mixed stock', a populace not of the Egyptian region but foreign and immigrant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
