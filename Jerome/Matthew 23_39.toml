[[commentary]]
quote='''
I say unto you, Ye shall not see Me, &c. That is to say, Unless ye shall do penitence, and shall confess that I am He of whom the Prophets have spoken, the Son of the Almighty Father, ye shall not see My face. Thus the Jews have a time allowed for their repentance. Let them confess Him blessed who cometh in the name of the Lord, and they shall then behold Christ's face.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For I say to you: You will not see me henceforth until you say: Blessed is he who comes in the name of the Lord. He speaks to Jerusalem and to the people of the Jews. Now this verse, which the little ones too and the sucklings used at the entry of the Lord Savior into Jerusalem, when they said: Blessed is he who comes in the name of the Lord, Hosanna in the highest; he took from Psalm 117 (118), which was plainly written about the coming of the Lord; and by what he says he wants this understood: Unless you repent and confess that I myself am he of whom the prophets sang, the Son of the almighty Father, you will not see my face. The Jews have a time of repentance given them; let them confess him blessed who comes in the name of the Lord, and they will behold the face of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
