[[commentary]]
quote='''
The sons of Javan: Elisa and Tharsis, Cethim and Dodanim. From these the islands of the nations were divided in their lands, each according to his tongue and his kindred and his nation. From the Ionians, that is, from the Greeks, are born the Eliseans, who are called Aeolians: hence also the fifth tongue of Greece is called Aeolic, which they call πέμπτην διάλεκτον. Tharsis Josephus takes to be the Cilicians, saying that θ, the letter of aspiration, was corrupted by later generations into tau: hence also their metropolis is called the city of Tarsus, made glorious by the apostle Paul. Cethim are the Citians, from whom even today a city of Cyprus is named Citium. Dodanim are the Rhodians: for so the Seventy translators rendered it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
