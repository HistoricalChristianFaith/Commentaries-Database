[[commentary]]
quote='''
And it shall be on that day, says the Lord of hosts, I will destroy the names of the idols from the land, and they shall be remembered no more; and the prophets and the unclean spirit I will take away from the land. LXX: And it shall be on that day, says the Lord Sabaoth, I will destroy the names of the idols from the land, and there shall be no more remembrance of them; and the false prophets and the unclean spirit I will take away from the land. On that day, which he mentions so often, all idols shall be taken away from the land: whether those idols of which the psalmist says: The images of the nations are silver and gold, the works of men's hands, so that there may be no other religion but only that of the Christian name, and of which it is written in the prophet: Howl, you carved images in Jerusalem and in Samaria. For as I have done to Samaria and to her carved images, so will I do to Jerusalem and to her idols; or those idols of which the Apostle speaks: But the Spirit says manifestly that in the last times some shall depart from the faith, giving heed to seducing spirits and doctrines of demons, in the hypocrisy of liars who have their conscience cauterized. For just as idols are made by the hand of a craftsman, so the perverse doctrine of the heretics turns into an idol whatever it has feigned, and causes the antichrist to be worshipped in place of Christ. For false prophets, in the Hebrew prophets is read absolutely, that is, nebim, who themselves also signify false prophets; but besides, the priests of the idols are also called prophets by the heathen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
