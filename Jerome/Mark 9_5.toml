[[commentary]]
quote='''
O Peter, even though you have ascended the mountain, even though you see Jesus transfigured, even though his garments are white; nevertheless, because Christ has not yet suffered for you, you are still unable to know the truth.
'''
source_url=''
source_title="HOMILY 80"

[[commentary]]
quote='''
But Peter answered and said to Jesus: Lord, it is good for us to be here. Because he had climbed up to the mountains, he does not want to go down to earthly things, but to remain always on the heights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
