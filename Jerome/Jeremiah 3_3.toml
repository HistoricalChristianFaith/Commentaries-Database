[[commentary]]
quote='''
No, a widow must take every precaution not to overstep by an inch the bounds of chastity. For if she once oversteps them and breaks through the modesty that becomes a matron, she will soon riot in every kind of excess. So much so that the prophet's words shall be true of her, "You have a whore's forehead, you refuse to be ashamed."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_123.html'
source_title="LETTER 123.9"

[[commentary]]
quote='''
When they go out, they do their best to attract notice and with nods and winks encourage troops of young fellows to follow them. Of each and all of these the prophet's words are true, "You have a whore's forehead. You refuse to be ashamed." Their robes have but a narrow purple stripe, it is true. And their headdress is somewhat loose, so as to leave the hair free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_022.html'
source_title="LETTER 22.13"

[[commentary]]
quote='''
The brow of a harlot woman has become yours, you were unwilling to blush. LXX: the face of a harlot has become yours, you have become without blushing toward all. Because he had said above: I have not sinned, and she had sinned the more by denying her crimes, therefore he now rebukes her as a brazen woman of excessive shamelessness, so that she is not borne with brazen face to one man and another only, but blushes before none. Let us use this word against the conventicle of the heretics, who glory in their errors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
