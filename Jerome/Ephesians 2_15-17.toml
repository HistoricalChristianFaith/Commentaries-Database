[[commentary]]
quote='''
But whoever reads that saying of the Apostle, where he speaks of Christ: Making peace through the blood of his cross, for the things which were on earth and the things which are in the heavens, and the rest that is said in the same place, will not think that we, who are called Israel according to the spirit, were far off, and that the Jews, who are named Israel only in the flesh, were near. And he will adjust this whole understanding to the angels and the heavenly virtues, and to human souls: that Christ in his blood has joined together earthly and heavenly things which were formerly at variance with one another; and that the good shepherd, carrying the sick sheep back to the mountains, has made it be with the rest; and has joined the drachma which had been lost to the drachmas which had been safe (Luke 15); and has drawn the commandments of the Law back to those decrees after whose type and image Moses beheld the things that were to be made in the tabernacle (Exod. 25). And so it comes about that the cross of the Lord has profited not only earth but heaven too; not only men but angels as well; and that every creature has been cleansed by the blood of its Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
