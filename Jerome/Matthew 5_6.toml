[[commentary]]
quote='''
It is not enough that we desire righteousness, unless we also suffer hunger for it, by which expression we may understand that we are never righteous enough, but always hunger after works of righteousness.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are those who hunger and thirst for justice. It is not enough for us to want justice unless we suffer hunger for justice, so that under this example we may understand that we are never just enough, but always hunger for the works of justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
