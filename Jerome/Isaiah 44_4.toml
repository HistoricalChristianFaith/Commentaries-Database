[[commentary]]
quote='''
He also compares those who are born again in baptism to green grass, and to the willow which springs up beside flowing waters and, against the nature of things, bears fruit, though before it was barren, or rather its seed, taken as food, makes people barren. This indeed is read in the first psalm: And he will be like a tree which is planted by the streams of waters, which will give its fruit in its season, and its leaf will not fall. Others understand by the grass and the willows springing up anew a twofold calling: so that the people of the nations is in the grass, and in the willows those of Israel who believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
