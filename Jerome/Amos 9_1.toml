[[commentary]]
quote='''
I saw the Lord standing upon the altar, and he said: Strike the hinge, and let the lintels be shaken; for avarice is at the head of them all, and the last of them I will slay with the sword. There shall be no flight for them; whoever of these flees shall flee and shall not be saved. LXX: I saw the Lord standing upon the altar, and he said: Strike upon the mercy seat, and the porches shall be shaken; and dash apart upon the heads of all, and the rest of them I will slay with the sword. Whoever of them flees shall not flee away; and whoever of them has been saved again shall not be saved. Whoever, with Ezekiel and John the Baptist, has seen the heavens opened, and from whose eyes the veil that was laid over the face of Moses has been taken away, so that there may be fulfilled in him what is written: The commandment of the Lord is bright, enlightening the eyes; he will see the Lord standing upon the altar and commanding the prophet, or, as many think, the angel who has been appointed to render the punishments of sins, to strike the hinges of the temple, or the mercy seat, and that its lintels, or porches, be shaken. And when, he says, the temple has been scattered and destroyed because of the wickedness of men, and my wrath has begun from my sanctuary, let each one know that he cannot escape, since avarice possesses all things; and that his last end is death, and that no defences can come to his aid for escaping the sentence of God. And as for what we read according to the LXX: That he should cut into the heads of all, fittingly are their heads divided who of their own accord divided themselves from him who is the head of all, and said: We have no king but Caesar, who cried out with impious voice: Crucify, crucify such a one, and: His blood be upon us, and upon our children. All these things we can also refer to the heretics, whose altar is struck, and all their initiations and sacrilegious mysteries are shaken, who have had avarice at their heads, the partridge crying out through them, and gathering what it did not bring forth, and making riches without judgment. Hence the Lord will also slay its last things, or remnants, so that the section begun may be completed, and its last end will be foolish. But when the Lord has struck the hinges and brought the sword upon them, there will be no one who can escape and avoid the Lord's impending sword. And at the same time this too must be noted: that, with the Lord standing upon the altar, first the mercy seat, or the hinges of the temple, is struck; then the porches are shaken; thirdly the heads of all are divided; fourthly those who are left are slain with the sword. For unless the Lord has trampled the pride of the heretics under his foot, and struck their perverse and wicked teaching with the spiritual blade, and divided among themselves their masters, who are understood by the heads, and slain them in a good sense, the disciples cannot be made alive, according to that which is written: I will kill and I will make alive; I will strike and I will heal. The masters are killed and struck, so that the disciples may be made alive; the heads are divided, so that the other members may be healed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
