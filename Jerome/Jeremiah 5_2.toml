[[commentary]]
quote='''
And because it could happen that some would be found among the people who feigned the worship of God and swore by the Lord, he forestalls this: that God is in no way delighted by empty words, but by the truth of faith; and he says: 'I do not love them because they swear by me, and they swear in falsehood; but those whose hearts and lips agree'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
