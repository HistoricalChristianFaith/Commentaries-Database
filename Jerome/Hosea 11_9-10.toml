[[commentary]]
quote='''
This which he said, I will not enter the city, and what follows according to the LXX, I will walk after the Lord, some have interpreted so as to say that the people answered the Lord, and that the sense is: Because your heart is turned within you, and you have not dealt with us according to our sins, but imitate your own clemency, and do not punish our offenses, and promise that you, holy and merciful, will dwell in our midst, therefore I too will not enter the city of evil men, nor will I be of the number of sinners; but I will walk after the Lord our God. The Hebrews, however, explain it thus, in the person of God: I will not abandon you, I will not go to another nation; nor will I enter another city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
