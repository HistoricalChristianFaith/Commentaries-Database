[[commentary]]
quote='''
But he was wounded for our iniquities, he was bruised for our crimes. The discipline of our peace was upon him, and by his bruise we have been healed. All we like sheep have gone astray, each one in his own way has turned aside: and the Lord has laid on him the iniquity of us all. He was offered because he himself willed it, and he did not open his mouth. LXX: But he was wounded for our sins, and was weakened for our iniquities. The discipline of our peace was upon him: by his bruise we have been healed. All like sheep have gone astray, man has gone astray in his own way. And the Lord handed him over for our iniquities, and he, because of affliction, did not open his mouth. We, he says, thought him a man of sorrows, or, according to the Seventy, to be in pain, and struck by God, and bearing his own sins. But he was wounded for our iniquities, saying in the psalm: They dug my hands and feet (Ps 21 [22]:18), so that by his wound he might heal our wounds; and he was bruised, or weakened for our crimes, so that, made a curse for us, he might free us from the curse. For cursed is every man who hangs on a tree (Deut 21; Gal 3). Hence the discipline of our peace is upon him. For what we ought to have endured for our crimes, he suffered for us, pacifying through the blood of his cross both the things that are on earth and the things that are in heaven. For he is our peace, who made both one, and broke down the middle wall of partition, dissolving the enmity in his flesh, and by his bruise we have been healed (Eph 2). From this it is plain that, just as his scourged and torn body bore the marks of injury in weals and bruises, so his soul too truly suffered pain for us, lest it be believed that in Christ there was truth in part and falsehood in part (Rom 3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
