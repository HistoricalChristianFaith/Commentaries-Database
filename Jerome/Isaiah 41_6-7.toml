[[commentary]]
quote='''
And when they saw that they themselves were saved, they fulfilled in deed what they had heard above: let them approach, and then let them speak, so that they helped their neighbors and wished to strengthen their brothers in the Lord, and said to them: Depart from idols, despise the ancient images of demons, which a human hand fashioned, which were produced by the beating hammer, which were joined with glue, which were made fast with nails so that they should not be moved, and which, when they stand, cannot walk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
