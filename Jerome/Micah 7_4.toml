[[commentary]]
quote='''
For he who is best among them is like a brier, pricking and holding fast, wounding whoever comes near it and seizing him with a hooked tooth; and he who has been found upright is like a thorn from the hedge, so that pain is found where help was thought to be. This according to the Hebrew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
These the Lord threatens, saying: And I will take away their goods, which they think goods, which seem goods to them. But in the truth of the matter those things will never be called goods which both despoil the giver and kill the receiver; although it is not so much a threat as a blessing to take away evils from them, and for the Lord himself and the divine word to enter into their consciences and, like a moth, to devour whatever is perverse, and to lay waste their plunder and their evil thoughts, and to walk upon the norm and rule of truth, drawing back to what is right those very men who were led by depraved opinions; and to do this in the light of truth, and on that day when those who are holy and chosen from the Church will go up to the watchtower and, in the loftiness of their doctrines and works, will discourse on heavenly things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
The day of your watching, your visitation, comes; now shall be their devastation.

Do not believe a friend, and do not trust in a leader. From her who sleeps in your bosom guard the bars of your mouth, for the son does insult to the father, and the daughter rises up against her mother, the daughter-in-law against her mother-in-law; a man's enemies are his own household. But I will look to the Lord, I will wait for God my Savior; my God will hear me. LXX: Woe, woe, your vengeances have come, now shall be their weeping; do not believe in friends, nor hope in leaders. From her who lies with you, beware lest you believe her, for the son does insult to the father, and the daughter rises against her mother, the daughter-in-law against her mother-in-law; a man's enemies are the men of his own household. But I will gaze upon the Lord, I will wait for God my Savior? My God will hearken to me. Except for the beginning of the section, in the remaining parts both editions agree; and for the present, according to the history, he signifies the day of the watching of Samaria, or of Jerusalem, which she had often expected and feared would come, and her visitation, the captivity, saying: Your laying waste comes; now shall be their devastation, that is, of the inhabitants, or their siege: for mabucha in the Hebrew means rather πολιορκίαν and φρούρησιν, that is, siege and guard, than devastation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
There follows the exposition of the Seventy, who said: Woe, woe, your vengeances have come, that is, the punishments that are to be inflicted for crimes. To me, he says, belongs vengeance, and I will repay, says the Lord. And in another place: The days of your retribution have come. For the Lord executes vengeance for those who cry out to him day and night and say: How long, O Lord, holy and true, do you not judge and avenge our blood on those who dwell on the earth? Therefore the vengeances have come, and now shall be their weeping, that is, the weeping of the vengeances, so that those who laughed before may lament, and, as soon as they go out of the world, may endure torments, such as that rich man, once clad in purple and abounding in delights, endures in hell, where there is weeping and gnashing of teeth. But as for what follows: Now shall be, understand it either of the end of each one's life, or of the consummation of all things and the day of judgment, when general vengeances will come upon all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
