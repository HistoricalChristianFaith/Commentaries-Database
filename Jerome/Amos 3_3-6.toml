[[commentary]]
quote='''
Will two walk together unless they have agreed? Will a lion roar in the forest unless he has prey? Will the lion's whelp give voice from his den unless he has seized something? Will a bird fall into the snare of the earth without a fowler? Will the snare be taken up from the earth before it has caught something? If the trumpet sounds in the city, will the people not be terrified? Will there be evil in the city which the Lord has not done, for the Lord God will not do a thing unless he has revealed his secret to his servants the prophets. The lion will roar, who will not fear? The Lord God has spoken, who will not prophesy? LXX: Will two walk together at all unless they have known each other? Will a lion bellow from his forest, having no prey? Will the lion's whelp give his voice from his den at all unless he has snatched something? Will a bird fall upon the earth without a fowler? Will a snare be set down upon the earth unless it has caught something? If the trumpet sounds in the city, will the people not fear? Will there be evil in a city which the Lord has not done, for the Lord God will not do anything unless he has revealed his instruction to his servants the prophets. The lion will bellow, and who will not fear? The Lord God has spoken, and who will not prophesy? I have read in the commentaries of a certain man, who wished to win assent to a difficult thing, that to the eight crimes, or impieties and sins, first of Damascus, second of Gaza and the other cities of Palestine, third of Tyre, fourth of Idumea, that is, Edom, fifth of the sons of Ammon, sixth of Moab, seventh of Judah, that is, the two tribes, eighth, which is the last, of Israel, that is, the ten tribes, as many threats are now given in return, and that the first answers to the first, that is, Damascus, the second to the second, that is, Gaza, and the rest to the rest. Whether this is true, he who wrote it will know for himself. Another, however, thinks that six examples are set forth, of two walking together on the road, and of a lion roaring in the forest, and of a lion's whelp giving its voice when it has seized something, and of a bird caught by a fowler, and of a snare which is fixed in the ground to catch prey, and of a trumpet sounding in the city, and that to these examples a likeness is given in return: as the things above have a cause and do not happen unless that cause has gone before, so no evil befalls in a city which has not been done at the Lord's command.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
