[[commentary]]
quote='''
Now that Samaria is to be understood of the heresies is proved both in the prophet Hosea and in many other places, and especially by that testimony: Woe to those who despise Zion and who trust in the mountain of Samaria; they have gathered as a vintage the chiefs of the nations; for all heretics despise 'Sion' [Zion], which means 'watchtower' and is referred to the Church, and they trust in the mountain of Samaria, namely in the pride of perverse doctrines which they think sublime, and through these frauds of preaching they gather as a vintage and lay waste the chiefs of the nations, so that, by the marvel of their doctrines, they draw all the powerful among the Gentiles into heretical error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Woe to you who are wealthy in Zion, and trust in the mountain of Samaria; you nobles, heads of the peoples, entering with pomp the house of Israel. LXX: Woe to those who despise Zion, and trust in the mountain of Samaria; they have gathered the vintage of the firstfruits of the nations, and have gone in for themselves. To Zion, as we said above, and to the mountain of Samaria, that is, to the two tribes, which were called Judah, and to the ten, which were called by the name of Israel, the prophet's word is directed; and especially to those who in each people are nobles and princes, and give themselves to delights after the example of that rich man clothed in purple, who rejoiced in feasting and was lifted up into such pride that he did not deign to look at Lazarus, full of sores, before his door, and did not grant him even what was going to be wasted from his table. These are the heads of the peoples, who trust in riches, and are wealthy in Zion, and have confidence in the mountain of Samaria, and enter with pomp the house of Israel, so that the body shows the swelling of the mind, and they seem like the litters carried in processions. But according to the laws of tropology and the LXX translators, Zion is referred to the Church, of which we read it written: You who lift me up from the gates of death, that I may declare all your praises in the gates of the daughter of Zion. But the mountain of Samaria, on account of the pride and boasting in the keeping of God's commandments, is understood of the heretics, who despise the Church, because God chose the weak things of the world, to confound the strong, and the foolish things, to destroy the wisdom of the wise and reject the understanding of the prudent. These have gathered the vintage of the firstfruits of the nations, so that under the Christian name they might bring them into their own winepresses, where the grape is not trodden but ruined, where not new wine is pressed out but poison. And they have gone in for themselves. He said well, for themselves; for they did not go in in the Lord, but went in for themselves. Otherwise, as regards God they have rather gone out, while they withdraw from the Church. And what follows, house of Israel, according to the Seventy is to be read at the beginning of the following section; according to the Hebrews, at the end of this one, which we have expounded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
