[[commentary]]
quote='''
And the Lord said to me, says the prophet, or else the Savior himself, whose are the preceding words, bearing witness that the Father spoke to him: Cast it to the statuary, for which in the Hebrew is read ioser, that is, τὸν πλάστην, whom we can call moulder and potter. And the sense is: Cast my price to the potter, who is the Creator and moulder of all. Nor did he say, put it down, but cast it, so that the wage of the Lord might be weighed by the judgment of the moulder and modeller. And εἰρονικῶς (ironically), seeing his price, that is, the price of the divine majesty, in thirty pieces of silver, and himself betrayed for so cheap a wage: A fine price, he says, at which I was priced by them; and this must be read with more emphasis, with the mockery and derision of the speaker: At so much did my people, once the poor of the flock and chosen by me as sons, judge that I should be bought and sold! And I took, says the Lord through the prophet, as I had been commanded by the Lord, the thirty pieces of silver, and I did not put them down, but cast them into the house of the Lord to the moulder; in the house of the Lord I caused them to be returned by the traitor to the priests and Pharisees, the very man who sold me confessing: I have sinned, betraying just blood. But they, since it was the price of blood, would not put it into the corbona, that is, into the treasury; but with it they bought the potter's field for the burial of strangers. For all of us who were strangers and sojourners from the law, redeemed by his most precious blood, are buried and rest in the house of the potter and Creator of all. For πλάστῃ and moulder I once translated statuary, compelled by the ambiguity of the word, because it signifies statuary and moulder by a single term.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
