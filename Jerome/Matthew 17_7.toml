[[commentary]]
quote='''
And whereas they were laid down, and could not raise themselves again, He approaches them, touches them gently, that by His touch their fear might be banished, and their unnerved limbs gain strength; And Jesus drew near, and touched them. But He further added His word to His hand, And said unto them, Arise, fear not. He first banishes their fear, that He may after impart teaching.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus came and touched them. Because they lay there and could not rise, he himself mercifully approaches and touches them, so that by his touch he may put their fear to flight and their weakened limbs may be made firm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And he said to them: Rise, and do not be afraid. Those whom he had healed with his hand he heals with his command. Do not be afraid. First fear is driven out, so that afterward teaching may be imparted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
