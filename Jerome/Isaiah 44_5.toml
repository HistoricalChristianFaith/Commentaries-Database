[[commentary]]
quote='''
And at the same time he describes the variety of believers: One will say, I am the Lord's, he who trusts that the works of righteousness are in him; another will call (understand: sinners to repentance) in the name of Jacob, so that they too may supplant vices and sins. Another will write with his hand, I am God's; or, as the Seventy translated, he will write on his hand, I am God's, so that he glories in being a soldier in the new service of Christ's warfare. And he will be likened in the name of Israel. For not all from Israel, but a great part from the multitude of the nations will be likened in the name of Israel, so as to receive the Law and the Prophets and all the graces of the Holy Spirit which were promised to the people of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
