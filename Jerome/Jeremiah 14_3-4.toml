[[commentary]]
quote='''
The elders also, who ought themselves to go to draw the waters, send the younger ones, in whom there are no gray hairs of wisdom, and therefore they come to the wells and do not find the waters which, as the history relates, the patriarchs found. They bring back their vessels empty, the younger ones, that is, not because there were no waters, but because they could not find them. They were confounded and afflicted — or they blushed — and covered their heads — because they could not say with the Apostle: 'But we all, with unveiled face, behold the glory of the Lord' — because of the desolation of the land or and the works of the land have failed, through which we advance to the knowledge of God. And the cause is plain: because no rain came upon the land. For the clouds were commanded not to rain a shower upon it. The farmers also, one of whom says: You are God's husbandry, God's building and: We are God's fellow workers, cover their head and are confounded, understanding that without the grace and help of God they strive in vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
