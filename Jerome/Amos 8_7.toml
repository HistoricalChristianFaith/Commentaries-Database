[[commentary]]
quote='''
The Lord has sworn against the pride of Jacob: If I shall have forgotten all their works even to the end. Shall not the earth be moved over this, and every inhabitant of it mourn, and it rise up wholly like a river, and be cast out, and flow away like the brook of Egypt? LXX: The Lord has sworn against the pride of Jacob: If he will forget all your works to the end. And over these things shall not the earth be troubled, and every inhabitant of it mourn, and its consummation rise up like a stream, and go down like the river of Egypt? Scripture quite often records the Lord swearing. First, in Genesis, the angel of the Lord called Abraham a second time from heaven, saying: By myself I have sworn, says the Lord, because you have done this thing, and have not spared your dearest son, blessing I will bless you, and multiplying I will multiply you like the stars of heaven, and like the sand that is on the shore of the sea. And in the hundred and ninth (110th) psalm: The Lord has sworn, and he will not repent; you are a priest forever according to the order of Melchizedek. Discussing this, whoever he is who wrote the epistle to the Hebrews says: Since he had no one greater by whom to swear, he swore by himself. And in this same prophet we read above: The Lord has sworn by his holiness, or by his holy ones, that behold, days will come upon you, and they will take you up with weapons, or with poles, and the rest. He, then, who had earlier sworn by his holiness, or by his holy ones, now swears against the pride of Jacob, so that if they do not believe him when he threatens, they may believe him when he swears, after the likeness of men, who take up an oath when their simple words are not believed. Nor is it surprising if God is said to swear, since he sleeps with those who sleep and keeps watch with those who keep watch, and is said to be angry with those who have stored up wrath for themselves in the day of wrath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
