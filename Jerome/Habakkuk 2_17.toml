[[commentary]]
quote='''
For the iniquity of Lebanon will cover you: your pride, he says, and the overthrow of the temple, and the plundering of the sanctuary will lay you waste and devastate you. And because he had once named Mount Lebanon, under the metaphor of the same mountain he compares the victims and the sacrifices, or certainly the multitude of the peoples which was slain in Jerusalem, to animals or beasts, saying: And the devastation of the animals will crush you. But all this you will suffer because you laid waste Judah, overturned the land of promise, and the city of Jerusalem and all its inhabitants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
