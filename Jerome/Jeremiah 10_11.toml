[[commentary]]
quote='''
Thus therefore you shall say to them: The gods who did not make the heavens and the earth, let them perish from the earth and from those things which are under heaven! These words are to be said to the false gods and to those which have been put together by artifice — for they made neither the heavens nor the earth —, words which the fellow workers of Christ, who are called God's and the Lord's, for the most part frame through the Church's teaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
