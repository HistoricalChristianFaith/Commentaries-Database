[[commentary]]
quote='''
And seeing the hard necessity of death, and that there is no man who lives and does not see death, the most merciful Father remembers the ancient sentence, that in Adam we all die. Or the prophet, understanding his own frailty and the condition of human flesh: Consolation, he says, is hidden from my eyes; and the sense is: I am not able to be consoled; whatever I conceive in my mind cannot soften my grief, as I see names most dear to one another severed by death; hell itself, he says, divides between brothers. Whatever, then, separates brothers is to be called hell; and above all the harlot woman, who, calling the unwise man to herself, says in the wealth of prudence: Touch gladly the hidden loaves, and the sweetness of stolen water; and the unwise man does not know that the earth-born perish with her and run into the depth of hell. For whatever is not permitted is desired the more, and what is sweet through rarity is turned into bitterness through constancy. And honey drips from the lips of the harlot woman, which for a time makes the jaws of the unwise man fat, but at the last is found more bitter than gall, and sharper even than a two-edged sword. Whoever is earth-born, and is not born from heaven, is killed by her embraces and bound with the bands of her couches; and the feet of folly lead down those who make use of her, with death, to hell. Now between death and hell there is this difference: death is that by which the soul is separated from the body; hell is the place in which souls are shut up, whether in refreshment or in punishments, according to the quality of their merits. We have said this to show that death does what the harlot woman does. For death divides brothers, and the woman does this too. Under brothers understand every bond of love, so that mother also is divided from daughter, and father from son, and brother from brother. That death is one thing and hell another, the psalmist also shows, saying: There is no one in death who is mindful of you; but in hell who will confess to you? And in another place: Let death come upon them, and let them go down alive into hell. Where we have translated: I will be your death, O death; I will be your bite, O hell, the LXX rendered: Where is your cause, O death? where is your goad, O hell? In place of which the Apostle put: Death is swallowed up in strife? Where, O death, is your strife? Where, O death, is your sting? And expounding the force of the testimony he added: Now the sting of death is sin, and the power of sin is the law; but thanks be to God, who has given us the victory through our Lord Jesus Christ. Therefore what he interpreted of the resurrection of the Lord, we neither can nor dare interpret otherwise. Death and hell can also be taken as the devil, who was slaughtered by the death of Christ, of whom it is also said in Isaiah: Death, growing strong, has devoured. And afterwards there follows: The Lord has taken away every tear from every face. But the two brothers divided from each other by death some understand, according to the history of that time, as Israel and Judah, so that what was then prefigured in part may now be perceived in the whole, and Israel and Judah are to be freed and redeemed together with the whole human race. In the place where the LXX rendered: where is your cause? and we said: I will be your death, Symmachus translated: I will be your stroke. The Fifth edition and Aquila: where are your words?, for in Hebrew it is written dabarach; they read dabar, that is, word, in place of deber, which is interpreted death, according to what we read in Isaiah: The Lord sent death into Jacob, and it came into Israel, that is, deber, in place of which we translated: The Lord sent a word into Jacob, and it came into Israel, that is, dabar. For sting also, which we rendered bite, Symmachus translated ἀπάντημα, that is, an encounter, and Theodotion and the Fifth edition a stroke and a shutting-in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
