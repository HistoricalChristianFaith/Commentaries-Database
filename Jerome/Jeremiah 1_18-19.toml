[[commentary]]
quote='''
For I have given you today — or behold, I have set you on this day — as a fortified city, as an iron pillar and as a bronze wall over all the land: to the kings of Judah, to its princes and to the priests and to the people of the land. And they shall fight against you and shall not prevail, for I am with you, says the Lord, to deliver you. The divine word describes why the prophet ought not to fear. I, he says, have set or have given you today — that is, in the present life, while it is called today — as a very strong city, not as a single house, nor a tower or some walls, but as a whole city, which, set upon a mountain, cannot be hid, of which it is written: glorious things are spoken of you, city of God, and: I am a strong city, a city which is besieged. And as a pillar, he says, of iron, of which the Apostle writes: the pillar and ground of the truth. Hence Peter and John, who were reputed pillars of the Church, gave to Paul and Barnabas the right hands of fellowship. Nor is this enough, but as a wall, he says, of bronze, which is marred by no rust, nor perishes when beaten by rains, but becomes stronger with age. And you shall be such against kings and princes and people, not of any place whatever, but of the land, who savor earthly things and do not know heavenly things, who bear the image of the earthy and not of the heavenly; these, he says, shall fight against you and shall not prevail. Why, I ask? What is the cause of such great strength, that neither kings nor princes nor priests nor peoples prevail against one man? It follows: for I am with you, says the Lord, to deliver you. If ever the kings of Judah, which means 'confession', and its princes and priests and peoples, that is, bishops and presbyters and deacons, and the base and ignoble common crowd, should wish to rise up against a holy man, let him have firmness of faith and cease to fear, for with the Lord's help he will overcome.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
