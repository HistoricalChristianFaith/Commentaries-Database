[[commentary]]
quote='''
As for what follows: For behold the stone which I have given before Joshua, the lovers of the history understand it of Christ in this way, saying that Christ was to come after Joshua son of Jehozadak. For this, they say, is what before Joshua means, that is, in his sight and before his face, so that it signifies things to come; and he is called a stone for his strength and hardness, with which he crushed all kingdoms, the stone which we also read in Daniel was cut from the mountain without hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Behold, I will engrave its carving, says the Lord of hosts, and I will take away the iniquity of that land in one day.

On that day, says the Lord of hosts, a man shall call his friend under the vineyard and under the fig tree. LXX: Behold, I will dig a pit, says the Lord Almighty, and I will handle all the iniquity of that land in one day. On that day, says the Lord Almighty, each one shall call his neighbour under the vine and under the fig tree. Above he had said: Behold the stone which I have given before Joshua, upon one stone are seven eyes. Now, consistently, he keeps the μεταφορὰν (metaphor) taken from the stone, and says: I will engrave its carving, or I will carve its engraving. For where it is written in Hebrew maphate phethee, Aquila translated διαγλύψω ἄνοιγμα αὐτῆς, that is, I will carve its opening; Theodotion and Symmachus, I will carve its carving. And the sense is: I will cause this stone to be wounded by the nails of the cross and the soldier's lance, and in his passion I will take away the iniquity of the land in one day, the day of which it is written: This is the day which the Lord has made; let us exult and rejoice in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
