[[commentary]]
quote='''
I keep the mouth of the king and the speech of the oath of God. Do not hasten to go away from his face, and do not stand in an evil word, since he will do all that he wishes. As the king has said, having power: and who says to him, what are you doing? He seems indeed to teach, in accord with the Apostle, that kings and powers must be obeyed, especially since the Seventy translators speak in the imperative mood: Keep the mouth of the king; but I think that it is now said of that king of whom David says: Lord, in your strength the king will rejoice. And in another place, so that the one kingdom of the Father and of the Son may be signified, Scripture records: God, give your judgment to the king, and your justice to the king's son. For the Father judges no one, but has given all judgment to the Son. This king, the Son of God, is the Son of the king, the Father. His precepts, therefore, must be kept, his will carried out. And this is what is written in the book of Tobit: It is good to hide the mystery of the king. And he warns above all that we should not discuss why God has commanded each thing, but that whatever the pious mind of man sees to be commanded, it should hasten to fulfill. And let his will be in the law of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
