[[commentary]]
quote='''
The Hebrew used to report that this little verse, in which it is said: Better is a living dog above a dead lion, is expounded otherwise among his people, thus: that one who is still alive and teaching, however unlearned, is more useful than a perfect teacher who is already dead. For example, so that by the dog he understood any one teacher out of many, and by the lion Moses, or any other of the prophets. But since this exposition does not please us, let us press on to greater things; and let us say that that Canaanite woman to whom it was said: Your faith has saved you, is the dog according to the Gospel; and that the dead lion is the people of the circumcision, as the prophet Balaam says: Behold, the people will rise up like a lion's whelp, and like an exulting lion. The living dog, then, is we from the nations; but the dead lion is the people of the Jews, forsaken by the Lord. And better before God is this living dog than that dead lion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
