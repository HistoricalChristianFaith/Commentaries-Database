[[commentary]]
quote='''
Otherwise: Rejoice, young man, O Christian people, and enjoy the good things granted to you by God, and know that in all these you are to be judged by the Lord. And do not think that, because the former branches were broken off and you were grafted into the root of the good olive, you are therefore secure. But put away anger from your heart and pleasures from your body, and, leaving the other vices behind, remember your Creator, before the day of malice comes upon you, the incurable day, in which punishments are prepared for sinners; lest, when you have sinned, the sun of justice set for you at midday and the light of knowledge perish, and the splendor of the moon, that is, of the Church, be withdrawn, and the stars set, of which it is written: Among whom you shine like lights in the world, having the reason of life. And elsewhere: Star differs from star in glory. Before the clouds return after the rain; lest the prophets, who have watered the hearts of believers with their speech as with their rains, after they have perceived that you are unworthy of their shower, return to their seat; that is, to him by whom they were sent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
