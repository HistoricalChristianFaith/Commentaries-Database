[[commentary]]
quote='''
And they said: Come and let us devise devices against Jeremiah! For the law shall not perish from the priest, nor counsel from the wise, nor the word from the prophet; come and let us strike him with the tongue, and let us not heed all his words! This was both then the thought of the Jews against Jeremiah, or against the Lord the Savior, and is today the thought of heretics against his servants: to contrive calumnies and to forestall holy men with accusation, and not to consider what truth those men speak, but what falsehood they themselves may contrive; for they boast that the law of God and counsel and utterance remain in their own priests and wise men and false prophets, though Scripture says: Into a perverse soul wisdom shall not enter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
