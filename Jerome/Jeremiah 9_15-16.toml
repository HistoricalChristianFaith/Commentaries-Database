[[commentary]]
quote='''
Therefore thus says the Lord of hosts, the God of Israel: Behold, I will feed them, this people, with wormwood — or with distresses — and I will give them water of gall for drink, and I will scatter them among the nations which neither they nor their fathers have known, and I will send the sword after them until they are consumed. This can be prophesied both of the near time, when they were taken captive by the Chaldeans, and properly of this present time, when they have been scattered among the nations which neither they nor their fathers had known, and, divided through the whole world, have been fed with wormwood, or with necessities and distresses. And they have received water of gall for drink, which either signifies the greatness of their evils and the everlasting yoke of captivity, or else means that, through ignorance of the law of God, they are going to receive Antichrist instead of Christ. And the sword is sent after them, so that they are consumed even to destruction, or else a sword which divides them and does not allow them to be of one accord in evil, so that they perish in this, that they are evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
