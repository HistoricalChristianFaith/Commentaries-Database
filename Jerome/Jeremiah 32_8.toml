[[commentary]]
quote='''
And Hanamel, the son of my uncle, came to me according to the word of the Lord, to the vestibule — or court — of the prison, and said to me: Possess — or buy — my field, which is in Anathoth, in the land of Benjamin, because the inheritance belongs to you and you are the kinsman, so that you may possess or buy. What the word of the Lord had announced to the prophet as future was at once fulfilled in deed. 'There came', he says, 'to me Hanamel' — 'the grace of God' —, 'the son of my uncle' — that is, 'the son of peace' —; 'and he came into the vestibule of the prison and said to me the things which the Lord had foretold would be said by him'. And this priestly field, whose purchase and possession was being offered to Jeremiah, is in 'Anathoth', in the land of 'Beniamin', of which the first means 'obedience', the second 'son of the right hand'; and consequently he seeks the purchase of that place in which the 'obedience' and the 'power' of the Lord dwelt. For 'kinsman' the Seventy translated presbyteron, that is 'elder', which does not suit this passage.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
