[[commentary]]
quote='''
You therefore, do not fear, my servant Jacob, says the Lord, nor be afraid, Israel, for behold, I will save you from a far-off land, and your seed from the land of their captivity, and Jacob shall return and be at rest and abound in all things, and there shall be none whom he fears, since I am with you, says the Lord, to save you. For I will make a full end among all the nations among which I have scattered you; but you I will not bring to a full end, but I will chastise — or instruct — you in judgment, so that you may not seem to yourself guiltless or and cleansing, I will not cleanse you. This perikopē [passage] is not found in the Seventy, and in very many manuscripts of the common edition it has been added under asterisks from Theodotion. The divine word makes a promise and, more familiarly, calls Jacob and Israel 'his servant', just as Abraham, Isaac and Jacob are called 'servants of God' — Moses too and the other prophets, and the Apostle Paul at the beginning of his epistles glories in this title —, so that both the two and the ten tribes, that is, the twelve, may know that they are to be saved from a far-off land, that the captivity is to be loosed and peace restored, and that they are to be filled with all abundance, according to what is said in the psalm: Let there be peace in your strength and abundance in your towers!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
