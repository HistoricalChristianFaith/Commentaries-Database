[[commentary]]
quote='''
Ephraim has surrounded me in his denial, and the house of Israel in deceit; but Judah went down as a witness with God, and faithful with the saints. LXX: Ephraim has surrounded me in falsehood, and the house of Israel and Judah in impiety; now God has known them, and the holy people of God will be called. The Hebrews hand down a tale of this kind: at the exodus of Israel from Egypt, when on one side the mountain, on another the Red Sea, and on another the army of Pharaoh hemmed them in, and the people were held shut in, while the other tribes despaired of safety and wished either to return to Egypt or to fight, Judah alone faithfully entered the sea, and for this reason he also merited to receive the kingdom. And this, they say, is what is now said: Judah, a witness of the words of God, his supporter and avenger, went down with God into the sea, and among the saints was most faithful, so as to believe the words of God who commanded. That is what they say. Let us follow the sequence of the explanation we began: that Ephraim, the royal tribe, and the house of Israel, the people that served the royal tribe, surrounded him, and surrounded him in denial or falsehood, since they deny the Lord and confess idols. But Judah, that is, the two tribes, which had the temple, the law, the prophets, and kept the precepts of the law, were witnesses, and walking with God, and faithful with the saints. By the saints we can mean either the angels, or the patriarchs and prophets and the others who served at God's command. For in comparison with that time at which these things were said, when Ephraim had gone utterly astray and Israel had been deceived into the worship of idols, Judah alone had remained to be occupied in the worship and testimonies of God, and could go down with him, or be strong with the strong one. For rad means both descent and strength; for which Aquila translated ἐπικράτειαν (mastery). According to ἀναγωγὴν (anagogy), the heretics surround God in falsehood, nay rather in denial. For whatever they speak is denial, nay rather falsehood; and they surround him in deceit, or in the impiety of the house of Israel, while they compose with artful speech everything that they feign, and speak impiety against God. But Judah, that is, the churchman, is not proud, is not puffed up with heretical swelling, but is humbled with God, and with the choir of the saints is faithful and strong, while he builds his house upon the rock, which no storm can shake. The LXX translated very differently: that Ephraim and the house of Israel and Judah surrounded God in falsehood and in impiety, and that God is of such great clemency that he does not cut off from them the hope of salvation, but knows them and is ready to call the people a holy people and the people of God, which is now perverted by impiety. According to tropology also: that the Lord wills both heretics and sinful churchmen to be saved, and all to be called by his name. But he who is truly holy does not surround God in falsehood but in truth, as the psalmist says: You are mighty, O Lord, and your truth is round about you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
