[[commentary]]
quote='''
And, as we said above, they brought to him a second paralytic, lying on a little bed, because he himself was not able to walk in. And Jesus, seeing the faith, not of the one who was being brought but of those who were bringing him, said to the paralytic: Take heart, son, your sins are forgiven you. O wonderful humility! He calls son one who was despised and infirm and loosened in all the joints of his limbs, one whom the priests did not deign to touch. Or else he calls him son for this reason, that his sins are forgiven him. According to tropology, sometimes a soul lying in its own body, with all the powers of its limbs loosened, is brought by a perfect teacher to the Lord to be healed; and if it has been healed by his mercy, it receives so much strength that it at once carries its own little bed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
