[[commentary]]
quote='''
This Jesus was clothed in filthy garments, who, though he had committed no sin, was made sin for us. And he bears our infirmities, and grieves for us, and we reckoned him to be in sorrow, and under a blow, and in anguish. But he was wounded for our iniquities, and was made weak for our sins. And in the apostle Paul we read: Christ redeemed us from the curse of the law, being made a curse for us. It is he who speaks in Psalm 21 (22): Far from my salvation are the words of my offences. And in Psalm 68 (69): O God, you know my foolishness, and my offences are not hidden from you. All these are called filthy garments, and they will be taken away from him when he has blotted out our sins, so that, because he was clothed in filthy garments, we, rising again, may hear in him after baptism: Let your garments be always white; and the whole Church of believers hears through Isaiah: Wash yourselves, be clean. And of her it is prophesied in the Song of Songs: Who is this who comes up made white? Ποδήρην, moreover, take to be his incarnation, which is from the earth and is signified in the feet. By the clean tiara upon his head understand the splendor of the divine majesty, so that one and the same may be seen to be adorned, according to the man, with the ποδήρη, and according to God, with the tiara.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
