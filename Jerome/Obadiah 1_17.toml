[[commentary]]
quote='''
But on Mount Zion there shall be salvation, and there shall be a Holy One, and the house of Jacob shall possess those who had possessed them. And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau stubble, and they shall be kindled among them, and shall devour them, and there shall be no remnant of the house of Esau, for the Lord has spoken. LXX: Upon Mount Zion there shall be salvation, and it shall be holy, and the house of Jacob shall possess those who had possessed them. And the house of Jacob shall be a fire, and the house of Joseph a flame, but the house of Esau stubble, and they shall be kindled against them, and shall devour them, and there shall be no grain-carrier for the house of Esau, for the Lord has spoken. When Idumea has been overthrown and devoured by the hostile nations with which it had earlier made a pact against Jacob, on Mount Zion there shall be a remnant, and there shall be salvation, and there shall be a Holy One; that is, either the Lord himself shall return to the temple which he had abandoned because of their sins, or there shall be, absolutely, what is holy, that is, the holy of holies. And the house of Jacob, under Zerubbabel and Ezra and Nehemiah, shall possess those who had possessed them as an inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"


[[commentary]]
quote='''
Alternatively: When the works of the flesh have been destroyed and the earthly empire laid desolate, there shall be in the Church the salvation of those who have not gone out from their mother. And in her shall dwell the Holy One, of whom it is said in Isaiah: Holy, holy, holy, the Lord God of Sabaoth, because both he who sanctifies and those who are sanctified are all from one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
