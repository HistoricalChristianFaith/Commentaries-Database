[[commentary]]
quote='''
Alternatively: When the works of the flesh have been destroyed and the earthly empire laid desolate, there shall be in the Church the salvation of those who have not gone out from their mother. And in her shall dwell the Holy One, of whom it is said in Isaiah: Holy, holy, holy, the Lord God of Sabaoth, because both he who sanctifies and those who are sanctified are all from one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
