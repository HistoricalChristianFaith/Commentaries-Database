[[commentary]]
quote='''
After His Resurrection, Jesus is seen and worshipped in the mountain in Galilee; though some doubt, their doubting confirms our faith.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the eleven disciples went into Galilee, to the mountain where Jesus had appointed for them. After the resurrection Jesus is seen on a mountain of Galilee and is worshiped there, although some doubt, and their doubt increases our faith. Then he is shown more plainly to Thomas, and he displays both his side wounded by the lance and his hands pierced with the nails.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
