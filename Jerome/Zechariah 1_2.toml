
[[commentary]]
quote='''
The Lord was angry with your fathers in anger, and you shall say to them: Thus says the Lord of hosts: Turn to me, says the Lord of hosts, and I will turn to you, says the Lord of hosts; be not like your fathers, to whom the former prophets cried, saying. LXX: The Lord was angry with your fathers with great wrath, and you shall say to them: Thus says the Lord Almighty: Turn to me, says the Lord of powers, and I will turn to you, says the Lord of powers; and do not become like your fathers, whom the prophets who were before rebuked, saying. The wrath of the Lord does not signify a disturbance in him who is angry, but the deserts and sins of those against whom the wrath of God rages; for the rest, the Lord never takes vengeance in anger, but rebukes in order to amend. Hence the prophet also prays in the psalms: O Lord, do not reprove me in your fury, nor rebuke me in your wrath, and in another place we read: Rebuke us, O Lord, yet not in your fury, but in mercy. So the Lord was angry with the fathers of those who are now being rebuked, not, as the Seventy translators have it, with great wrath, but simply with wrath. For if he had been angry with great wrath, he would never have called the captives to repentance through Daniel and Ezekiel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
