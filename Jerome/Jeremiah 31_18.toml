[[commentary]]
quote='''
Hearing I heard Ephraim going into exile — or lamenting — : you have chastised me and I was instructed like an untamed bullock — or like a calf, and I did not learn — ; convert me, and I shall be converted, for you are the Lord my God. For after you converted me — or I was taken captive —, I repented, and after I knew — or you showed me —, I struck my thigh — or I groaned — ; I was confounded and blushed — or from the day of confusion and I showed you —, because I bore the reproach of my youth. God says what he heard Ephraim saying and lamenting. Now no one doubts that it signifies the ten tribes, over which Jeroboam son of Nebat first ruled, who also made the golden calves in Dan and Bethel, so that the people, seduced by this error, might cease to worship and adore the God of Israel. You have chastised me, he says, and I was chastised. Every correction, which for the present seems to be of sadness, profits for salvation and afterwards brings peaceable fruits. And what he says: like an untamed bullock or a calf, and I did not learn, signifies this: that he was instructed with much toil and with blows, so that he might be turned to repentance, and he did not profit. 'Convert', he says, 'me, and I shall be converted' — therefore even this very thing, that we repent, we cannot accomplish unless we rely on the help of God — ; 'for after you have converted me and I have been converted to you, then I shall know that you are the Lord my God, and not at all my errors and sins. And after you converted me, I repented'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
