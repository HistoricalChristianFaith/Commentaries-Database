[[commentary]]
quote='''
You were running well; who hindered you from obeying the truth?

What the Latin translator has now set down, not to obey the truth (veritati non obedire), which in the Greek is written τῇ ἀληθείᾳ μὴ πείθεσθαι, he rendered in an earlier passage thus: "not to believe the truth" (non credere veritati). This, indeed, we noted in its proper place is not found in the old manuscripts, although the Greek copies too have been confused by this error. But the sense is this: You were worshiping the Father in spirit and truth, and, receiving of the fullness of Christ, you knew that the Law was only given to the people through Moses, and not also made; but grace and truth were not only given but also made through Jesus Christ. Since, therefore, you were running so well, serving the truth rather than images, by what perverse teacher have you been hindered, that you follow the shadow of the Law and abandon the truth of the Gospel? There follows:

Consent to no one. But since we have found this written neither in the Greek books nor in those who have commented on the Apostle, it seems it should be passed over.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
