[[commentary]]
quote='''
The north, of which Jeremiah wrote: From the north evils will blaze up upon all the inhabitants of the earth. And of which Solomon makes mention: The north wind is a harsh wind, but by name it is called the right. And God stretches out his hand, the hand that inflicts punishments, for this reason: that both the north may feel the penalties, and those who are in its land, to which, according to Zechariah, the black horses go, of which it is said: There were black horses, they were going into the land of the north. And fittingly, whoever has moved his feet and withdrawn from the East, of which the same prophet says: Behold a man, the East is his name, and has looked toward the west, goes at once toward the north, which is not the right, but by name is called the right. This indeed is understood bodily as well: whoever stands in the east and turns himself, looking toward the west, has the north on his right; those who have grown cold from its blast call it the right, though it is the right only in name, but in reality and in deed is rather on the left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
