[[commentary]]
quote='''
Beelzebub [Beelzebul]: having flies, or man of flies. At the end of the name, therefore, the letter B is to be read, not L. For a fly is called zebub.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Gospel of John"
