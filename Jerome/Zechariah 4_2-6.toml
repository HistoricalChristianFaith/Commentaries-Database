[[commentary]]
quote='''
And he said to me: What do you see? And I said: I have seen, and behold, a lampstand all of gold, and its lamp upon its head; and its seven lamps upon it, seven and seven pourers for the lamps which were upon its head. And two olive trees upon it, one on the right of the lamp, and one on its left. And I answered, and I say to the angel who was speaking in me, saying: What are these, my lord? And the angel who was speaking in me answered, and said to me: Do you not know what these are? And I said: No, my lord. And he answered, and said to me, saying: This is the word of the Lord to Zerubbabel, saying: Not by an army, nor by strength, but by my spirit, says the Lord of hosts. Who are you, O great mountain, before Zerubbabel? Into a plain! And he shall bring out the chief stone, and shall make equal the grace of its grace. LXX: And he said to me: What do you see? And I said: I have seen, and behold, a lampstand all of gold, and a lamp upon it; and seven lamps upon it, and seven pourers of the lamps which were upon it. And behold, two olive trees upon it, one on the right of the lamp, and one on the left; and I asked, and said to the angel who was speaking in me, saying: What are these, lord? And the angel who was speaking in me answered and said to me: Do you not know what these are? And I said: No, lord. And he answered and said to me, saying: This is the word of the Lord to Zerubbabel, saying: Not by great might, nor by strength, but by my spirit, says the Lord Almighty. Who are you, O great mountain, before the face of Zerubbabel, that you should set right? And I will bring out the stone of inheritance, the equality of grace, its grace. The angel who roused Zechariah, like a man rising from sleep, asks him what he has seen, so that, when he answers and does not know, and inquires what it is that he sees, and says: What are these, my lord?, we may hear from him: This is the word of the Lord to Zerubbabel: Not by an army, nor by strength, but by my spirit, says the Lord. Let us therefore go through the details one by one and say first what the Hebrews think, by whom we have been taught in the Old Testament; then by these, as by steps, let us climb to the heights of the Church. The lampstand of solid gold they interpret as the law, that is, νόμον. The lamp, that is, the flame shining and gleaming on the top of the lampstand, they take as Christ, who is the head of the law and gives light to the whole world. The seven lamps upon the lampstand they take as the seven graces of the Holy Spirit, of which we spoke above, saying that on one stone there are seven eyes. For no one doubts that the law was written at the dictation of the Holy Spirit. And by the seven pourers, in which is the oil that is sent into the lamps that shine upon the lampstand, they would have it understood that these seven graces come down from heaven to men through the law. And the two olive trees upon the lampstand, on the right side and on the left, between which the lamp shines in the middle, they interpret as the law and prophecy. And when the prophet had told his vision, not knowing what he was seeing, he asks the angel who was speaking in him, that is, his mind enlightened by God. For this is our angel, who, understanding wisely, shows us the will of God, and he says: What are these, my lord? But the angel does not explain the vision to the prophet, as he had been asked by him, but questions in turn the one who questions him: Do you not know what these are? And when he answers, I do not know, he himself also answers: This is the word of the Lord to Zerubbabel, saying: Not by an army, nor by strength; but by my spirit, says the Lord. The word of the Lord to Zerubbabel, then, which spoke not by an army, nor by strength, but by my spirit, is itself the interpretation of the vision: that not by an army nor by a multitude of warriors, but by the spirit of God, the people had been brought back and would be brought back more fully, and the adversaries would be laid waste.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
