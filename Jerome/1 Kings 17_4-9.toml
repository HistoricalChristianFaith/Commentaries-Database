[[commentary]]
quote='''
Do you wish to know of yet another torrent? Elijah the holy prophet, when Jezebel was persecuting him, when he received food, and passing on for forty days went into the wilderness: "He was," it says, "in the desert, and drank from the torrent of Chobar." But hearing of the torrent of this world, do not despair: frequently this torrent fails. It seems indeed to be swelling, it seems to have many waters: but it quickly fails, if you endure. As for Elijah, he did indeed drink water in the desert, at that time when he was in sorrow, when he was in distress... He had left Judea: see how great his fear had been: he had left Judea, and had gone on to Mount Sinai. For Jezebel was persecuting him, and therefore he had drunk from the torrent of Chobar. But because he persevered to the end, therefore the water of the torrent failed. And it was said to him by the Lord, when the water of the torrent had failed: "Go," it says, "to the widow in Sarepta of the Sidonians," and the rest. Behold, Elijah too drank from the torrent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_036.html'
source_title="Homily 36, on Psalm 109"
