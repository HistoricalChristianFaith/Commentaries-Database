[[commentary]]
quote='''
And it shall be after these things, I will pour out my spirit upon all flesh, and your sons and your daughters shall prophesy, your old men shall dream dreams, and your young men shall see visions; moreover upon my servants and my handmaids in those days I will pour out my spirit, and I will give wonders in heaven and on earth, blood, and fire, and vapors of smoke. The sun shall be turned into darkness, and the moon into blood, before the great and dreadful day of the Lord comes. And it shall be, everyone who calls upon the name of the Lord shall be saved. LXX: And it shall be after these things, I will pour out of my spirit upon all flesh, and your sons and your daughters shall prophesy, and your old men shall dream dreams, and your young men shall see visions; and upon my servants and upon my handmaids in those days I will pour out of my spirit, and I will give wonders in heaven, and upon the earth blood, fire and vapor of smoke. The sun shall be turned into darkness, and the moon into blood, before the great and illustrious day of the Lord comes. And it shall be, everyone who calls upon the name of the Lord shall be saved. This passage the blessed apostle Peter explained as fulfilled at the time of the Lord's passion, when on the day of Pentecost the Holy Spirit came down upon the believers, and all spoke as the Holy Spirit gave them, so that those who were present marveled and said: Are not all these who are speaking Galileans? And how have we heard our own language in which we were born? Parthians, and Medes, and Elamites, and the rest; but others said: What does this mean? And when others mocked and said: They are full of new wine. Peter, standing with the eleven, lifted up his voice and said: Men of the Jews, and all you who dwell in Jerusalem, let this be known to you, and give ear to my words; for these men are not drunk, as you suppose, since it is the third hour of the day, but this is what was spoken by the prophet Joel. And it shall be after these things, says the Lord: I will pour out of my spirit upon all flesh, and they shall prophesy, and the rest, up to the place which we set out in the section. Since, therefore, Peter records that the prophecy of Joel was fulfilled at the time when the Lord suffered, we ask only this: how the earlier parts and the middle, and what follows up to the end of the volume, can cohere with one another, lest under one text and sequence of discourse a diverse explanation, dissonant with itself, should seem to gush forth? From the beginning, then, up to the place where it is written: Great is the day of the Lord and very terrible, and who shall endure it, it is a threat and a description of what the Lord is going to bring upon the sinful people. But from the place where we read: Turn to me with your whole heart, and in fasting, and in weeping, and in mourning, up to the place where he says: Why do they say among the peoples: Where is their God, it is the exhortation of the Lord, calling to repentance after punishments and torments. Again, from the place which follows: The Lord was jealous for his land and spared his people, and the Lord answering said, up to the place where it is written: And my people shall not be confounded forever, it is a promise of things to come, of the good things which they ought to wait for after they have done penance. And after many things which it would be long to go over now, these too are said in the promise, which at present we are trying to expound: I will pour out of my spirit upon all flesh, and your sons and your daughters shall prophesy, and the rest. I seem to myself to have kept the thread of the discourse from the beginning up to this place. It is a matter of the greatest labor how what follows is to be fitted to what we are now discussing. One says that what was promised generally for the last time has now been fulfilled in part; and that, because the apostles perceived the reward of things to come at the first coming of the Lord, they recorded that certain foretastes and first fruits of the wonders had been fulfilled, so that until what is perfect comes we might perceive what had gone before in part. But another asserts that it was the custom of the apostles, according to what is written of the holy man: He will dispose his words in judgment, that whatever they saw to be useful to their hearers, and not in conflict with the present, they confirmed by testimonies of another time; not that they abused the simplicity and inexperience of their hearers, as the impious Porphyry slanders, but that, according to the apostle Paul, they preached in season, out of season. And following the rule of the prophets, whatever the Jews promise themselves carnally in the last time, they said had been fulfilled spiritually in the first coming of the Lord the Savior; especially since both they and we say that what has been promised is to be fulfilled in Christ; differing only in this, that they contend it is future, we prove it already done; and of this we must speak more fully in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
This passage is most difficult and admits a manifold explanation. Let us, then, under tropology, refer all that has been said to those times to which the apostles Peter and Paul referred it, that is, when the Lord suffered and rose again. For it cannot be that we understand the earlier things of the time of the passion, and those that follow of the day of judgment, especially since there follows: For behold, in those days, and at that time, and this little verse, connecting what comes after with what precedes, says that all things were accomplished at one time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
