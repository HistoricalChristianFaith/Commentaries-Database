[[commentary]]
quote='''
But what is said according to the Seventy: Will you be like a man asleep and like a man who cannot save? sets down a likeness, not the truth of the matter, according to that which is written: Arise, why do you sleep, O Lord?, not that the Lord sleeps, of whom it is said: He who keeps Israel will not slumber nor sleep, but that he seems to sleep to those whom he forsakes. Finally, in what follows too, it is not written: 'a man asleep', who cannot save, but: 'like a man'; in both, anthrōpopathōs [in human terms].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
But you are in us, O Lord, and your name has been invoked upon us; do not forsake us or do not forget us! 'You who among the Jews will be like a stranger and a traveler and a wandering man, forsaking your ancient dwelling, dwell in us, and your name has been invoked upon us, so that we are called Christians; therefore do not forsake us nor forget us, to whom the mouths of all the prophets have sung of your future coming'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
