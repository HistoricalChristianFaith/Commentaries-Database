[[commentary]]
quote='''
Behold, I will creak beneath you, as a cart loaded with hay creaks, and flight shall perish from the swift, and the mighty shall not hold his strength, and the strong shall not save his soul, and he who holds the bow shall not stand, and the swift of foot shall not be saved, and the rider of the horse shall not save his soul, and the strong of heart among the mighty shall flee naked in that day, says the Lord. LXX: Therefore behold, I will roll beneath you as a cart full of stubble is rolled, and flight shall perish from the runner, and the mighty shall not hold his might, and the fighter shall not save his soul, and the archer shall not endure, and the swift of foot shall not be able to be saved, and the horseman shall not save his soul, and his heart is found among the powerful, and he shall flee naked in that day, says the Lord. While I was bestowing benefits on you, and leading you out of the land of Egypt, and killing the Amorite before your face so that you might possess his land, and raising up prophets from your sons and Nazirites from your young men, you were making my Nazirites drunk with wine and saying to the prophets: Do not prophesy. Therefore, just as a cart weighed down with a load of stubble or hay howls far off with creaking and noise, so I, no longer bearing your sins, and handing them over to the fire like stubble, will cry out and say: Flight shall perish from the swift, whom the Hebrews understand as Jeroboam the son of Nebat, who had earlier fled into Egypt. Here, however, let us take not the princes themselves but their houses and their offspring. And the mighty shall not hold his strength — the mighty one they interpret as Baasha, who was most ready for wars —, and the strong shall not save his soul — this one here they take to be Omri —, and he who holds the bow shall not stand, or endure, they think was said of Jehu the son of Nimshi, who struck Joram king of Israel with an arrow. And the swift of foot shall not be saved: they understand Menahem, who, hastening in vain, sent gifts to the king of the Assyrians. And the rider of the horse shall not save his soul: this one they interpret as Pekah the son of Remaliah, who, joined with Aram, that is, the Syrian, laid waste much of Judea under Ahaz its king. And the strong of heart, among the mighty, shall flee naked in that day, says the Lord. Hoshea alone, who was the last king of the ten tribes and tried to call the straying people back to the worship of God, will come out of the fire as if naked. And he calls him naked because under him the ten tribes were taken captive. This is what the Hebrews hold, and as it was handed down to us by them, so we have faithfully set it out for our own people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
