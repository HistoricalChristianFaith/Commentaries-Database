[[commentary]]
quote='''
And the likeness of the living creatures: their appearance as of burning coals of fire, and as the appearance of lamps. This was the vision running about in the midst of the living creatures: the brightness of fire, and lightning going forth from the fire. And the living creatures went and returned in the likeness of flashing lightning. (LXX: "And in the midst of the living creatures a vision, as of burning coals of fire, as the face of lamps running about in the midst of the living creatures; and the brightness of fire, and from the fire there went forth as it were lightning." And what follows: And the living creatures ran and returned as the appearance of 'bezec', was added in the Seventy from the edition of Theodotion; for they, lest the prophet should seem to utter two statements rather contrary to each other, thought that what they supposed to be contrary, that is: And the living creatures ran and returned, should be passed over in silence, lest it cause the reader to stumble; but it is better in the divine books to translate what has been said, even if you do not understand why it was said, than to take away what you do not know; otherwise many other things too, which are ineffable and which the human mind cannot grasp, will be deleted by this license.) We, however, say this: that, just as in Proverbs it is written in the same place: Do not answer a fool according to his folly, lest you become like him, and again there is set down what seems to us to be contrary: Answer a fool according to his folly, lest he seem wise to himself, and both agree according to the difference of times and persons, since the fool is both despised because he does not receive wisdom, and foolish pride is knocked down by another folly, according to what the Apostle also says: I have become foolish; you compelled me, so in this place too we ought to ask why above it was said twice: The living creatures did not turn back when they advanced, and now once: The living creatures ran and returned; and there would be a problem were it not followed by: In the likeness of flashing lightning, which in the Hebrew tongue is called 'bezec', and which Symmachus translated: As the appearance of a ray of lightning. As the sky flashes with frequent fires, and in the twinkling of an eye and in a moment the lightnings dart about and return, not losing their womb and, so to speak, the source and matter of the fire, so these living creatures too, when they proceed with unstumbling foot, hasten toward what lies ahead. But if they see something set against their effort, they do not so much turn back as draw themselves in, to stretch out again and to offer the light which they had hidden for a little while, so that they may give the servants their rations in their season, and not give what is holy to dogs, nor cast pearls before swine; hence Paul too says: I gave you milk to drink, not food, for you were not yet able to take it; and the choosing of Judas and the anointing of Saul do not convict God of ignorance of things to come, but show that he is the judge of things present; hence also the apostles are commanded that, if they perceive a house to be unworthy of their greeting, they should first shake off their running feet, and the peace which they had given to the house should return to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
