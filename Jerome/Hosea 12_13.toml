[[commentary]]
quote='''
And because he had once said both Jacob and Israel, he joins the father and the sons, and recalls the history that follows, when by the prophet Moses the Lord brought Israel out of Egypt, and the twelve tribes which were begotten of Israel were preserved, as the prophet led them out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
