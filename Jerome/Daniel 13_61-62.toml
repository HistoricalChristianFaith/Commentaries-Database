[[commentary]]
quote='''
But what is said in the present passage: whom the king of Babylon fried in the fire, seems to contradict the history of Daniel. For that asserts that they were stoned by the people at Daniel's sentence; but here it is written that the king of Babylon fried them in the fire. Hence by many, indeed by almost all the Hebrews, that very story is not received, being taken as a fable, nor is it read in their synagogues. 'For how,' he says, 'could it be that captives had the power of stoning their princes and prophets?' And they affirm that this is rather the truth, which Jeremiah writes: that the elders were indeed convicted by Daniel, but that sentence was pronounced against them by the king of Babylon, who as victor and lord had authority over the captives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
