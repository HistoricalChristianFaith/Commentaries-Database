[[commentary]]
quote='''
Canaan: in his hand is a deceitful balance; he has loved calumny; and Ephraim said: Yet I have become rich, I have found an idol for myself; all my labors will not find for me the iniquity which I have sinned. LXX: Canaan: in his hand is a balance of iniquity; he has loved to oppress by power; and Ephraim said: Yet I have become rich, I have found rest for myself; all his labors will not be found for him, because of the iniquities in which he has sinned. He had admonished Judah to turn to the Lord his God, and to keep mercy and judgment, and to hope in the Lord always, or to draw near to him continually. Now the discourse turns to Ephraim, that is, to the ten tribes, whom he calls Canaan, according to what Daniel says to the elder, who was certainly of the seed of Judah: Seed of Canaan and not of Judah, beauty has deceived you. And in Ezekiel we read it said to Jerusalem: Your father was an Amorite, and your mother a Hittite. And in Isaiah it is said to the tribe of Judah: Hear the word of the Lord, you princes of Sodom; perceive with your ears the law of our Lord, you people of Gomorrah. In the last little verse of Zechariah too we read: And there will no longer be a Canaanite in the house of the Lord. Now he says that Canaan, that is, Ephraim, has in his hand a deceitful balance, or an unjust one, though Scripture commands: Let your weights be just; and that he not only has an unjust and deceitful balance, but loves calumny and oppresses men by power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Hence this very thing is also referred to the heretics. For Canaan can be interpreted: as if moving. And note that he said: as if moving, not moving. They are moving those whom they have deceived; as if moving, those whom they have tempted. But because these are founded upon the rock, they can be shaken by no whirlwind, nor change the footprint of their feet. In the hand of a Canaan of this sort, that is, in his works, there is a deceitful and unjust balance; for whatever the heretic speaks does not have the justice of God, and is full of deceit and frauds; whence they also love calumny, while they press down the innocent, or oppress them by power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
