[[commentary]]
quote='''
And the Lord swears by himself, since he has no one greater by whom to swear, that he detests all the insolences of the heretics and hates all their regions. For whatever they say is an insult, and worthy of the hatred of God. And he swears that he will take away the city and their meeting-places with those who dwell in them, namely both the people and the teachers, and that, even if ten men remain — men who, had they been in Sodom and Gomorrah, the fire would by no means have come down upon those cities — all will die that death which leads to Tartarus, of which Ezekiel writes: The soul that sins, it shall die.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
