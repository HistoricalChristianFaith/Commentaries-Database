[[commentary]]
quote='''
It follows, Some of them that stood by, &c.; some, not all; whom I suppose to have been Roman soldiers, ignorant of Hebrew, but from the words Eli, Eli, thought that He called upon Elias. But if we prefer to suppose them Jews, they do it after their usual manner, that they may accuse the Lord of weakness in thus invoking Elias.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But some who were standing there and heard it said: This man is calling Elijah. Not all, but some, whom I judge to have been Roman soldiers who did not understand the idiom of the Hebrew language, but from the fact that he said: Heli Heli, thought that Elijah was being invoked by him. But if you would rather understand that it was Jews who said this, they do this too in their usual manner, to defame the Lord with weakness, as one who begs the help of Elijah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
