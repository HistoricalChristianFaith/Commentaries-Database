[[commentary]]
quote='''
It was a tradition of the Pharisees following the Prophet Malachi, that Elias should come before the coming of the Saviour, and bring back the heart of the fathers to the children, and the children to the fathers, and restore all things to their ancient state. The disciples then consider that this transformation which they had seen in the mount was His coming in glory, and therefore it is said, And his disciples asked him, saying, How then say the Scribes that Elias must first come? As though they had said, If you have already come in glory, how is it that your forerunner appears not yet? And this they say chiefly because they see that Elias is departed again.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the disciples asked him, saying: Why then do the scribes say that Elijah must come first? Unless we know the causes why the disciples asked about the name of Elijah, their question seems foolish and out of place. For what has it to do with the things written above, to ask about the coming of Elijah? It is a tradition of the Pharisees, according to the prophet Malachi, who is the last of the twelve, that Elijah will come before the coming of the Savior and turn back the heart of the fathers to the sons and of the sons to the fathers, and restore all things to their ancient state. The disciples therefore suppose that this transformation of glory is the one they had seen on the mountain, and they say: If you have already come in glory, how is it that your forerunner does not appear? especially since they had seen Elijah withdraw. But when they add: The scribes say that Elijah must come first, by saying first they show that, unless Elijah has come, it is not the coming of the Savior according to the Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
