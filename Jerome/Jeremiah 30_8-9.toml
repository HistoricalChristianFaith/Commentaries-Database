[[commentary]]
quote='''
And it shall be in that day, says the Lord of hosts, I will break his yoke from off your neck and I will burst his bonds, and strangers shall no longer rule over him, but they shall serve — or work for — the Lord their God and David their king, whom I will raise up for them. This is the David whom the Gospel also mentions: that he would grant us that, without fear, delivered from the hand of our enemies, we might serve him in holiness and righteousness before him all our days. For just as a first Adam and a second Adam are written of according to the truth of the body, so also the Lord and Savior is David, because according to the flesh he is from David, holy Mary contributing to him wholly whatever was of the stock of David, while she had the origin and conception from the Holy Spirit. And as for his saying: I will break his yoke from off your neck and I will burst his bonds, there is no doubt that under the type of Nebuchadnezzar it must be understood of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
