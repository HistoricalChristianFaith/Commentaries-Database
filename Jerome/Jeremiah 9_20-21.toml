[[commentary]]
quote='''
Hear therefore, O women, the word of the Lord, and let your ear take up the speech of his mouth, and teach your daughters lamentation, and each woman her neighbor wailing, for death has come up through our windows, it has entered our houses, to destroy the little ones from outside, the young men from the streets! In the preceding section he had said: call the mourning women, and let them come, and send to those who are wise, and let them hasten; now he speaks as if to women present, to the condemnation of the priests and teachers and of all the men, so that, since these cease from teaching, the women may hear the word of the Lord and take up the words of his mouth and teach their daughters and their neighbors wailing and the causes of tears, for death, he says, has come up through our windows, it has entered our houses. Although this can also be understood spiritually, in that the death of sins enters through all the senses to the destruction of the soul, yet it can also be understood of the onslaught of the Babylonians: that so great is their strength and speed in fighting that they do not wait to unbar the doors, but climb up through the windows and roofs to lay waste the houses of Jerusalem. And the little ones perish who are outside and go out of Jerusalem, and the young men, to whom John also writes, who do not enter by the strait and narrow way that leads to life, but walk through the streets, of which it is written: how broad and spacious is the way that leads to death!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
