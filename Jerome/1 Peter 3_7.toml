[[commentary]]
quote='''
Although the apostle Peter has commanded that husbands give honor to their wives as to the weaker vessel, it is not, however, to be supposed that a wife, who has a weak vessel of the body, is at once weaker in soul as well. Hence it is now commanded them, so that in them too that saying of the Apostle may be fulfilled: "Power is made perfect in weakness" (2 Cor. 12:9); and it is said that they also are to have all the things that were commanded in common to the old men, namely in that he says, Old women likewise, that is, just as the old men, honorable in all things, sober, chaste, sound in faith, and in love, and in patience; and, for their sex, they are to have this as their own, that they be in holy demeanor, or, as it reads better in the Greek, ἐν καταστήματι ἱεροπρεπεῖς (in a bearing befitting what is sacred), so that their very gait and movement, face, speech and silence may display a certain dignity of sacred seemliness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
