[[commentary]]
quote='''
For even your brothers and the house of your father, they too have fought against you and have cried out after you with full voice; do not believe them when they speak good things to you! 'So far', he says, 'will you be covered by the most grievous floods of the Jordan, and so far will the multitude of horsemen coming against you from afar lay you waste, that your brothers too, the Edomites, and the house of your father, who were begotten of the stock of Lot, Moab and Ammon, will themselves, in the time of necessity and distress, fight against you and insult you. Therefore beware of being willing to believe them and of placing hope in kinship, on account of which they rage against you with greater hatred than enemies do'. This can also be taken of the Savior, that his brothers and the house of his father fought against him and cried out with full voice, saying: Crucify, crucify him; we have no king but Caesar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
