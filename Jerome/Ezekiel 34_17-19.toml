[[commentary]]
quote='''
Now he speaks to the sheep, that is, to the people, and to the flock of both kinds of cattle, that is, of sheep and of goats, and not only to the sheep and goats, but to the rams and he-goats, who are the princes in the flocks; to whom he says: 'Was it not enough for you that you fed on the good pastures of the Scriptures? But on top of that you will trample the remnants of your pastures with your feet, and when you drank the purest water of God's utterances, you fouled the rest of the waters with your feet, so that my people ate the pastures trampled by you and drank the fouled waters, and, through your fault, received corrupted and violated what was good in itself'. This indeed all heretics do, picking at the utterances of the Scriptures and, as far as in them lies, staining them; but churchmen who do not guard the truth of doctrines, but fabricate them from their own heart and have their own presumption for their teacher, are held fast in a like error; who, when they have persuaded the people that what they fabricate is true, and have stirred up applause and shouts in the manner of the theater, become forgetful of their own lack of skill, and, with brow drawn up and with words weighed and balanced, assume for themselves the authority of teachers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
