[[commentary]]
quote='''
Let them restore too the cities and towns, and the farms and villages of the tribe of Judah, which had been plundered and laid waste, as they had been before they were laid waste; and let the royal house, and the renowned and magnificent men of the tribe of Judah, and the inhabitants of Jerusalem in no way glory against the tribe of Judah, that it is ruled by their command and governed by their counsel; but let them know that the victory on both sides is the Lord's. Whether these things according to the history have been done or are yet to come, we leave the truth of the matter to the judgment of the Lord, and to his saints, who have received from him the spirit of wisdom and truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
