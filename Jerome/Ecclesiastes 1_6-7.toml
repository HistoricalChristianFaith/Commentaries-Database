[[commentary]]
quote='''
All things heavenly and earthly, and whatever falls under human understanding, roll on their own wheels; the moon runs through the yearly circuit of the sun in each month; the Morning Star, which is itself the Evening Star, while it gleams ruddy in the east and in the west and tempers the darkness of night with a small light, completes the same course in two years; and the four other stars which are called wandering, and whatever shines in the sky, and the varieties too of crops and trees and herbs, run on their own wheels through the four seasons; and we see nothing that was not before: Circling in circles the spirit goes, and returns into its circuits. All torrents go into the sea, and the sea is not filled. Why? Because they return to their springs from the womb of the abyss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
