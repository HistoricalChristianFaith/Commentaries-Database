[[commentary]]
quote='''
I did not send the prophets, and they ran; I did not speak to them, and they prophesied. If they had stood in my counsel and made my words known to my people, I would surely have turned them from their evil way and from their most wicked thoughts. This sense the Apostle too unfolds to the Romans: and as they did not see fit to have God in knowledge, God handed them over to a reprobate sense, so that they do the things that are not fitting, filled with all iniquity, malice, fornication, wickedness, avarice and the rest. For when false teachers have once handed themselves over to lies and perjuries and to the deaths of those they have deceived, they run, not step by step nor with considered pace, but headlong, to the destruction both of themselves and of those whom they have deceived. Nor does the Lord speak to them, but they themselves speak as if from the mouth of the Lord, of whom it is also said: 'if they had stood in my counsel — that is: if they had been willing to acquiesce in my will — and had made my words known to my people, not flattering them and ruining them with adulation, so as to say: You have no sins, you possess perfect righteousness, holiness and chastity and righteousness are found in you alone; then I would not have handed them over to uncleanness and ignominy, to do the things that are not fitting and to follow their most wicked thoughts'. Let us contemplate the heretics: how, once despairing of salvation, they hand themselves over to gluttony and delights, eat meats, frequent the baths, are fragrant with musk, and, anointed with various unguents, seek beauty of body. For once and for all they do not hope for the things to come, nor do they believe in the resurrection. What they do not disclose in speech, they show in deeds; for if they believed, they would not do these things. And in this place, where it is written: if they had stood in my counsel, Aquila, Symmachus and Theodotion and the Seventy translated similarly, as above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
