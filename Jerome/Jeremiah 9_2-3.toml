[[commentary]]
quote='''
For they are all adulterers, an assembly of transgressors, and they have stretched out their tongue like a bow of falsehood and not of truth; they have grown strong in the land, for they have gone forth from evil to evil, and they have not known me, says the Lord. Sinners pass from evil to evil when they exchange idol for idol and go over from sins to sins, or at any rate pass from the evil of the siege to captivity. And of the saints indeed it is said: they shall go from strength to strength, but of sinners: they have gone forth from evil to evil. And the cause of all their miseries is that they did not know the Lord, and that it is an assembly of men transgressing and arming their tongue like a stretched bow for blasphemy; and they have grown strong in the land, so that they deserve to hear: earth you are and into earth you shall go.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
