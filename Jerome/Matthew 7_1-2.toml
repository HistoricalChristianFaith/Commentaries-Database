[[commentary]]
quote='''
But if He forbids us to judge, how then does Paul judge the Corinthian who had committed uncleanness? Or Peter convict Ananias and Sapphira of falsehood?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do not judge, that you may not be judged. If he forbids judging, by what consistency does Paul in Corinth judge the fornicator, and Peter convict Ananias and Sapphira of lying? But from what follows he shows what he forbade, saying: for as you judge, so will it be judged of you. Thus he did not forbid judging but taught it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
