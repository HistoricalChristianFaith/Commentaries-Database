[[commentary]]
quote='''
But according to the Hebrew, God shows that he never wanted the victims of the Jews; which we read also in Psalm 49 (50): I will not take calves from your house, nor goats from your flocks: for all the wild beasts of the forests are mine, the cattle on the mountains and the oxen. I know all the birds of the sky, and the beauty of the field is with me. If I am hungry, I will not tell you: for the world is mine and the fullness thereof. Shall I eat the flesh of bulls, or shall I drink the blood of goats (Ps 49 [50]ff.)? And having rejected the ceremonies of the old Law, he passes on to the purity of the Gospel, and shows what he desires in their place: Offer to God the sacrifice of praise, and pay your vows to the Most High. And call upon me in the day of trouble, and I will deliver you, and you shall honor me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
