[[commentary]]
quote='''
Lest peasants untaught and illiterate, without the graces of speech, should obtain credit with none when they announced the kingdom of heaven, He gives them power to do the things above mentioned, that the greatness of the miracles might approve the greatness of their promises.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And going, preach, saying that the kingdom of heaven has drawn near; heal the sick, raise the dead, cleanse the lepers, cast out demons; freely you have received, freely give. So that rustic men, without the charm of eloquence, unlearned and unlettered, should not go unbelieved when they promised the kingdoms of heaven, he gives them power: heal the sick, cleanse the lepers, cast out demons, so that the greatness of the signs might prove the greatness of the promises.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
