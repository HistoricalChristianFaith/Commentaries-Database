[[commentary]]
quote='''
That which the Seventy set down: he has provoked the Canaanites, is not found in the Hebrew. Yet it can be interpreted thus, so that we say that Israel had such zeal in the worship of idols that he did not imitate the Canaanites, that is, the heathen, but provoked them to imitate his own error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
