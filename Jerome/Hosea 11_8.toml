[[commentary]]
quote='''
How shall I give you up, Ephraim, shall I protect you, Israel? How shall I give you up like Admah, set you as Zeboiim? My heart is turned within me, my repentance is troubled together. I will not execute the fury of my wrath, I will not turn to destroy Ephraim, because I am God and not man; the Holy One in your midst, and I will not enter the city. LXX: What shall I do to you, Ephraim, shall I protect you, Israel? What shall I do to you? I will set you as Admah and as Zeboiim; my heart is turned in him; my repentance is troubled together. I will not act according to the wrath of my fury. I will not abandon Ephraim to be destroyed, because I am God, and not man; holy in you, and I will not enter the city. In that place where we and the LXX translated: shall I protect you, Israel? in the Hebrew is written amaggenach, which Aquila translated ὅπλῳ κυκλώσω σε, that is: I will surround you with a shield. And while we thought this was to be understood in a good sense and signified protection, from the edition of Symmachus a contrary sense is set before us, for he says ἐκδώσω σε, that is: I will hand you over. From the translation of Theodotion too, not favorable but adverse things are shown: ἀφοπλίσω σε, which signifies: I will strip you, and take from you the ὅπλον, that is, the shield with which I had protected you before; and this sense better suits the Lord when he threatens. What he says, then, is this: since they would not be converted, and Assyria became their king, and the sword will devour cities and princes and people, and a yoke will be laid upon them which will not be taken away from them; and because the sentence seemed harsh, leaving them no room at all for repentance, now God speaks to Israel with a parent's affection: What shall I do to you, Ephraim? how shall I strip you of my help? What shall I do to you? By what art shall I correct you? With what remedy shall I be able to heal you? I will set you as Admah and Zeboiim, which are two of the five cities, as we read in Genesis: Sodom and Gomorrah, Admah and Zeboiim and Bela, which is Zoar, and in the Syrian tongue it is called Zoara. I will therefore set you and turn you into a wilderness, and destroy you down to cinders and ashes, as I destroyed Admah and Zeboiim. And when he had pronounced a harsh, nay a cruel sentence, again he is overcome by mercy through a parent's affection, and softens the severity of the judgment with a father's tenderness. For he says: My heart is turned within me; my repentance is troubled together. As soon as I said that I would set Ephraim and Israel as Admah and Zeboiim, my bowels were moved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
But if we wish to read: How shall I give you up, Ephraim, shall I protect you, Israel? it is to be understood thus: What shall I do to you? Are you worthy of protection, you who have done such things? It must also be noted that where something is said against Judah, that is, the people of God, it is not Admah and Zeboiim that are set down, but Sodom and Gomorrah. For we read in Isaiah: Hear the law of God, you princes of Sodom; and: Give heed to the word of the Lord, you people of Gomorrah. In the Gospel too, of the city which has not received the apostles, when they shake off the dust of their feet, it is said that in the day of judgment it will be more tolerable for the land of Sodom and Gomorrah than for that city. And the prophetic word is directed to Jerusalem: Sodom has been justified by you. We are therefore given ground to suspect that Sodom and Gomorrah were the leaders in sin, and that Admah and Zeboiim followed their example; because the mighty will suffer torments mightily; and the servant who knows the will of his lord and does not do it will be beaten with many stripes. Hence churchmen too, if they are held fast by the same crimes as the heretics, will be subject not to the torments of Admah and Zeboiim, which are the lesser, but to those of Sodom and Gomorrah, which are said to be of greater crimes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
