[[commentary]]
quote='''
Wherefore Solomon prays to God: Give me neither riches nor poverty. But appoint for me what is necessary and sufficient for my living, lest, being full, I become a liar and say: Who sees me? or, being in want, I steal and forswear the name of the Lord (Prov 30:8, 9). And if he prays for this, to have neither riches nor poverty but only the necessaries of living, of which the Apostle also says: Having food and clothing, with these we are content (1 Tim 6), it is clear that riches and want, health and sickness, pleasure and torments, are neither good nor evil, but become good and evil according to the difference of those who bear them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
