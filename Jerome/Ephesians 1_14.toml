[[commentary]]
quote='''
Who is the pledge of our inheritance, unto the redemption of adoption, to the praise of his glory.

Pledge (pignus) the Latin translator has put for earnest (arrhabo). But earnest does not mean the same thing as pledge. For an earnest is given as a kind of testimony and binding toward a future purchase. A pledge, that is, ἐνέχυρον, is put down for money lent, so that when the money has been repaid, the pledge is given back by the creditor to the one who repays the debt. Again, where he says unto the redemption of adoption, the Greek does not have υἱοθεσίαν but περιποίησιν, which we can call acquisition (acquisitio) or possession (possessio); and yet we have not expressed the force of the word. For there are many words that cannot be carried over from Greek into Latin, nor from Hebrew into Greek; and conversely, neither from Latin into Greek nor from Greek into Hebrew. Whoever, then, has received not only the Holy Spirit but the Holy Spirit of promise, will at the same time obtain also the earnest of the inheritance, and that inheritance is everlasting life. And just as from the earnest one judges what the purchase will be like and what the property (for example, from ten solidi, a country estate worth a hundred solidi, and from a hundred solidi, a property worth a thousand solidi), so from the difference in the earnest the greatness of the inheritance that is to follow afterwards is also known. And however holy and perfect someone may be, and though he be thought worthy of blessedness in the judgment of all, yet for the inheritance to come he has now obtained the Spirit as an earnest. But if the earnest is so great, how great will the possession itself be? And just as the earnest that is given to us is not outside us but within us, so the inheritance itself, that is, the kingdom of God which is within us, dwells inwardly in us. For what greater inheritance can there be than to contemplate and to see with the understanding the beauty of Wisdom, and of the Word, and of Truth, and of Light, and to consider the ineffable and magnificent nature of God himself, and to behold the substance of all things which were created after the likeness of God? Now this holy spirit of promise, which is the earnest of our inheritance, is given now to the saints for this reason: that they may be redeemed and joined to God, to the praise of his glory. Not that God needs anyone's praise, but so that the praise of God may profit those who praise him, and that, while through his several works they come to know his majesty and greatness, they may burst out in wondering amazement to praise him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
