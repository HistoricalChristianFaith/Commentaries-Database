[[commentary]]
quote='''
Hence his blood will come upon him, that is: he himself will be the cause of his own death, according to what David says to the man who announced the death of Saul and related that the king of Israel had been slain by him: Your blood be upon your head. Not by my sentence, but by the blood of Saul will your blood be shed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
