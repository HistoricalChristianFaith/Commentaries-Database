[[commentary]]
quote='''
Let us read the books of Varro on antiquities, and of Sinnius Capito, and the Greek Phlegon, and the other most learned men, and we shall see that almost all the islands, and the shores of the whole world, and the lands near the sea were occupied by Greek settlers, who (as we said above) possessed all the maritime places from the Amanus and Taurus mountains as far as the British ocean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
