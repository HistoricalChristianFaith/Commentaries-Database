[[commentary]]
quote='''
As though He had said, Ye bring complaints against my disciples, that on the sabbath they rub ears of corn in their hands, under stress of hunger, and ye yourselves profane the sabbath, slaying victims in the temple, killing bulls, burning holocausts on piles of wood; also, on the testimony of another Gospel (John 7:23.), ye circumcise infants on the sabbath; so that in keeping one law, ye break that concerning the sabbath. But the laws of God are never contrary one to another; wisely therefore, wherein His disciples might be accused of having transgressed them, He shows that therein they followed the examples of Achimelech and David; and this their pretended charge of breaking the sabbath He retorts truly, and not having the plea of necessity, upon those who had brought the accusation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Or have you not read in the law that on the Sabbaths the priests in the temple violate the Sabbath and are without guilt? You slander my disciples, he says, because they rubbed ears of grain as they passed through the crops, and did this under the compulsion of hunger, when you yourselves violate the Sabbath in the temple, slaughtering victims, killing bulls, burning up holocausts with fire upon a pile of wood; and, on the testimony of another Gospel, circumcising little children on the Sabbath, so that, while you desire to keep another law, you destroy the Sabbath. But the laws of God are never contrary to one another. And prudently, where his disciples could be charged with transgression, he says that they followed the examples of David and Ahimelech; but the real violation of the Sabbath, one without the pretext of necessity, he turns back upon the very men who had made the false charge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
