[[commentary]]
quote='''
Thus says the Lord of hosts: If it shall seem difficult in the eyes of the remnant of this people in those days, shall it be difficult in my eyes? says the Lord of hosts. LXX: Thus says the Lord Almighty: If it shall be impossible before the remnant of this people in those days, shall it also be impossible before me? says the Lord Almighty. At each of the words and sentences in which prosperity is promised to Israel, and which, because of the greatness of the things, seem almost incredible, the prophet sets forth: Thus says the Lord Almighty; saying this in other words: Do not think that the things I pledge are mine, and do not disbelieve them as though they came from a man; the promises I unfold are God's. He had said above that old women and old men would sit in the streets and, for the length of their time, would hold staffs in their hands; that the streets would be thronged with a multitude of people; that boys and girls would lead dances as on feast days; and that Jerusalem was to be built up and restored to the state of its former happiness. This seemed incredible to the remnant of the people, who had come from the captivity, as they saw the city utterly abandoned, and the ruins of the walls and the burnt houses displaying the hands of Babylon. Therefore he joins to it: If to you who are the remnant of the captive people what I pledge seems either difficult or impossible, that in those days in which Jerusalem is to be built there should be such happiness, will it be either difficult or impossible in the sight of the Lord, who by my mouth promises that these things shall be? For the things that are impossible with men are possible with God. We have seen these things fulfilled in the churches of Christ in the time of persecution, when the ferocity of the persecutors was roused to such madness that they even destroyed our meeting places and handed the divine books over to the flames, and all the islands, mines and prisons were filled with chained flocks of confessors and martyrs. Who at that time would have believed that churches would be built again by those very men who had destroyed them before? Not that they were the same men, but that the same royal power which formerly sat in ambush with the rich, and, as though by a decree of the senate, tried to extinguish the name of Christ, now at the public expense builds the basilicas of the churches and raises their highest gables, so as not only to adorn ceilings and roofs gleaming with gold, but to clothe the walls with veneers of varied marble; and the divine books which formerly it handed over to burning, it now venerates, gilded and purpled and set off with a variety of gems, for the safekeeping of the Roman state.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
