[[commentary]]
quote='''
The breadth of the gate of the temple, moreover, was of ten cubits — which is a sacred and perfect number, and the one on which, in the seventh month, on the tenth day of the month, there is the fast and the propitiation; and on the tenth day of the first month, which is called Nisan, the lamb is taken for the sacrifice and preparation of the Passover. In the seventh month, therefore, tithes are offered into the granaries of God, or, as Scripture is accustomed to call them, the winepresses; whence the Apostle also says: Be enlarged, you also —, so that, after someone has entered the temple through the ten cubits of the gate, its sides on either part, or, as it is properly said in the Hebrew, its shoulders, are measured, which always refer to works — whence also: Issachar desired the good, resting among the middle lots; and he saw rest, that it is good, and the land, that it is fat: he put his shoulder to labor and became a husbandman; and in the garment of the high priest the shoulder-piece is bound together with the rational, so that works may be completed by reason, and the churchman may say: From your commandments I have understood —, which shoulders of the gate had five cubits each on either side, so that through the earthly senses and the divine, about whose difference we often write, we may enter the innermost recesses of the temple; of which that man, who was the prophet's guide, measured the length of forty cubits and the breadth of twenty cubits, or, as is better, the length and breadth of the gate, because above he had spoken only of its breadth and its shoulders. Now that twenty times forty makes the number eight hundred, which is akin to the number eight, is doubtful to no one — whence also in Ecclesiastes it is commanded: Give a portion to seven, give also to eight —, and I know that I have often discussed the mystery of that number; or else, because it is through the tribulations and straits of this world that we enter into the sanctuary of the Lord, therefore the length of the gate had forty cubits, a number that is always set in labor — whence both Moses and Elijah for forty days do not eat bread and do not drink water, and for forty years the people of Israel is harassed and tested in the wilderness and after many labors enters the land of promise, and the Lord and Savior, according to the frailty of the body he assumed, is tempted for forty days in the wilderness, so that after the victory angels might come and minister to him —. But when, after tribulations and straits, we are able to say that apostolic word: In all things troubled, but not straitened, and the prophetic one: In tribulation you have enlarged me, then a most wide entrance is opened to us, which has a breadth of twenty cubits, so that, having overcome the contests of the world and of earthly things, which itself also is a dual number, we may enter the inner places of the temple, and hear the Lord commanding the disciples: Take courage, I have conquered the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
