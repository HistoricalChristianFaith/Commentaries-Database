[[commentary]]
quote='''
They have denied the Lord and said: He is not — or these things are not — nor will evil come upon us; sword and famine we shall not see. The prophets have come to wind, and an answer — or a word — was not in them. These things therefore will come upon them. Because they have denied the Lord — or they have lied to the Lord — and said: 'He is not, by whose judgment all things come to pass, but all these things have happened by chance; and the things which the voices of the prophets threaten us with will not come, nor shall we see the sword, nor shall we endure the famine of a siege; and whatever the prophets spoke, they spoke to the wind, and all things have passed away void, nor did they have an answer, that is, an oracle, or the word of God was not in them', therefore they will endure what the following discourse describes. Let the Church hear this, when it is negligent and rejects the providence of God: that it will endure both sword and famine, unless it believes that the things which are spoken will come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
