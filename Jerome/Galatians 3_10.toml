[[commentary]]
quote='''
For whoever are of the works of the Law are under the curse. For it is written: Cursed is everyone who does not continue in all the things that are written in the book of the Law, that he may do them.

I have this custom: whenever something is taken by the apostles from the Old Instrument, I go back to the original books and examine carefully how it is written in its own place. And so I found this very passage set down in Deuteronomy by the Seventy translators thus: "Cursed is every man who does not continue in all the words of this Law, that he may do them: and all the people shall say, So be it" (Deut. 27:26). In Aquila, however, thus: "Cursed is he who does not establish the words of this Law, that he may do them: and all the people shall say, Truly". Symmachus: "Cursed is he who does not make firm the words of that Law, that he may do them, and all the people shall say, Amen". Theodotion, moreover, translated it thus: "Cursed is he who does not raise up the words of this Law, to do them, and all the people shall say, Amen". From this we understand that the Apostle, as in other places, set down the sense of the testimony rather than the words; and we hold it uncertain whether the Seventy Translators added "every man" (omnis homo) and "in all" (in omnibus), or whether it was so in the old Hebrew and was afterwards deleted by the Jews. Now what spurs me to this suspicion is this: the word "every" (omnis) and "in all" (in omnibus), as though necessary to his sense for proving that whoever are of the works of the Law are under the curse, the Apostle, a man of Hebrew learning and most learned in the Law, would never have brought forward unless it were found in the Hebrew volumes. For this reason, reading through the Hebrew volumes of the Samaritans, I found that CHOL, which means "every" or "all", is written there and agrees with the Seventy translators. In vain, therefore, did the Jews remove it, so as not to seem to be under the curse if they could not fulfill all the things that are written, since the more ancient letters of another nation too testify that it was set down. Now that no one can fulfill the Law and do all the things that are commanded, the Apostle testifies elsewhere as well, saying: "For what was impossible to the Law, in that it was weak through the flesh, God, sending his Son in the likeness of the flesh of sin, from sin condemned sin in the flesh" (Rom. 8). If this is true, it can be objected to us: Then are Moses too, and Isaiah, and the other prophets, who were under the works of the Law, under the curse? He will not fear to grant this who has read the Apostle saying: "Because Christ redeemed us from the curse of the Law, being made a curse for us"; and to answer that each one of the saints was in his own time made a curse for the people. Nor, in granting this to righteous men as well, will he at once seem to detract from the Savior, as though he had nothing special and excellent in being made a curse for us, since the others too were made a curse for others. For none of them, although he himself was made a curse, freed anyone from the curse, save only the Lord Jesus Christ, who with his precious blood redeemed from the curse of the Law both all of us and them too, I mean Moses and Aaron and all the prophets and patriarchs. And do not think that this is said from my own sense; Scripture is witness: that "Christ by the grace of God", or, as is read in some copies, "without God, died for all" (2 Cor. 5). But if for all, then also for Moses and for all the prophets, none of whom was able to blot out the old handwriting that was written against us and fix it to the cross (Col. 2): "All have sinned, and lack the glory [that is, grace] of God" (Rom. 3:23). Ecclesiastes too confirms this judgment: "There is not a righteous man on earth who does good and does not sin" (Eccles. 7:21). Finally, the Apostle's statement further below also plainly teaches that neither Moses nor any illustrious man among the ancients could be justified before God through the Law. For there follows:
'''
