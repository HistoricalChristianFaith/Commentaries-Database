[[commentary]]
quote='''
Some of the less learned brethren suppose the Lord to have spoken what follows from the Mount of Olives, which is by no means the case; what went before and what follows fixes the place in Galilee. aMount Tabor. we may suppose, or any other high mountain.

He spoke to them sitting and not standing, for they could not have understood Him had He appeared in His own Majesty.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But seeing the crowds he went up onto the mountain, and when he had sat down his disciples came to him. The Lord climbs up to the mountains so as to draw the crowds with him to higher things; but the crowds are not able to go up, and the disciples follow, to whom also he speaks not standing but seated and drawn in. For they could not have understood him shining in his majesty. According to the letter, some of the simpler brothers think that he taught the beatitudes and the rest that follows on the Mount of Olives, which is by no means so. For from what precedes and what follows the place is shown to be in Galilee, and we think it is either Tabor or some other high mountain. In short, after he finished his discourses there follows at once: But when he had entered Capernaum.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
