[[commentary]]
quote='''
And, not to put off with a long discourse the rule for these promises: both in this prophet and in the others, whatever is proclaimed about the building of Jerusalem and of the temple, and about the blessedness of all things, the Jews promise themselves with a vain expectation for the end of time, and they speak of it as to be fulfilled carnally. But we, who follow not the letter that kills but the spirit that gives life, prove that these things are already accomplished in the Church, and are fulfilled daily in individuals, who, falling through sin, are rebuilt through repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
