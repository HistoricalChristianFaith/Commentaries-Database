[[commentary]]
quote='''
For whoever repent and forsake the demons, to whom, like horses, they formerly offered their backs to be sat upon, and with the swiftness of leopards and of wolves at evening have thrown off and dashed down their riders, and have come with an empty and light back to carry him who, meek and poor, mounted the foal of an ass, these, as if hurrying from afar, and not content with running and rushing, will take to flight, and will come like an eagle, to feed on the flesh of the word of God and to satisfy the hunger of so long a time. For in what is said, Καὶ ἐξιππάζονται οἱ ἱππεῖς αὐτοῦ, which we too translated, And its horsemen will be ridden, according to the sense we set out above, Symmachus translated: Its horsemen will be poured out, that is, they will fall and be dashed to the ground. Now they are rightly called wolves of Arabia, that is, of evening and of the west, in whom a most wicked way of life has set, and who, once placed in darkness, abandon the evening with all their stride; and when they have left it, and have flown, ready to eat the flesh of the word of God, then consummation will come upon the wicked, that is, upon the Chaldeans, who resisted the faces of the penitent so that they might not return to their Lord. Wherefore consummation will come upon the wicked, who resist their faces from the opposite side.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
