[[commentary]]
quote='''
With this sense the words of Jeremiah also agree, spoken in the person of the Lord: As something warm in the desert, I found Israel with those slain by the sword (Jer 38:2 LXX; Vulg. 31:2). For when, he says, the whole world lay lifeless, wounded by the swords of idolatry, I found Israel in Abraham to have the warmth of faith, like a physician who after a battle, among the corpses of the dead, where he perceives that someone still has something of life in his beating veins, applies care to his wounds to restore him to health. For what is written ὡς θερμὸν, that is, as something warm, the Latin translator, deceived by the ambiguity of the word, rendered lupine, and in this most of the Greeks also err. And yet it should be known that in the Hebrew, for warmth, THODA (תודה) is written, which means grace: namely, that Israel was saved by the grace of God, and not by the merit of its own works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Thus says the Lord: the people that had remained from the sword found grace in the desert; Israel shall go to its rest. LXX: thus said the Lord: I found warm in the desert with those who had perished by the sword; go, and do not kill Israel! Ridiculously, in this place the Latin codices, through the ambiguity of the Greek word, translated 'lupines' for 'warm'; for the Greek THERMON signifies both, and it is not itself found in the Hebrew. For there is written 'hen', which Aquila, Symmachus and Theodotion translated as charin, that is, 'grace'; the Seventy alone put 'warm', thinking that the last letter was 'm'. For if we read 'hen' with the letter 'n', it means 'grace'; if with 'm', it is interpreted 'heat'. Now the sense according to the Hebrew is this: the people of the Jews, which had remained from the Roman sword, or at any rate had been able to escape the wrath of the Lord's fury, found grace in the desert of the nations, so that amid the crowd of the nations it might be saved in the Church; whence Israel shall go and shall find its rest, which it had always hoped for, which the prophecies of the prophets had promised it. Further, according to the Seventy this is the understanding: the Lord found the apostles and their companions warm and living in the desert of the nations, among those who had been killed by their own unbelief and did not have the warmth of life. Hence it is commanded to the angels and to those who are in the ministry of God that they should not kill all, that Israel should not be utterly destroyed, and it is said to them: 'go, and do not kill Israel; let there be some who live, let there be those who are warm with the ardor of faith, let there be those who escape the cold of unbelief and of death, whom the Lord may find in the desert!'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
