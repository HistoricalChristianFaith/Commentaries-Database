[[commentary]]
quote='''
And I will scatter the counsel of Judah and Jerusalem in this place, and I will overthrow them by the sword before their enemies and by the hand of those who seek their lives, and I will give their corpses as food to the birds of the heaven and to the beasts of the earth, and I will make this city an astonishment and a hissing; everyone who passes by it shall be astonished and shall hiss over all its wounds. And I will feed them with the flesh of their sons and with the flesh of their daughters, and each one shall eat the flesh of his friend in the siege and in the distress in which their enemies, and those who seek their lives, shall shut them in. Although we know that these things also befell the people in the Babylonian captivity, yet they refer more fully to the times of the Savior, when they were besieged by Vespasian and Titus and their city in the times of Hadrian collapsed into everlasting ashes, so that those who had offered their sons to idols should themselves afterwards, driven by the necessity of famine, turn them into use as food, and the flesh of all should be given to the birds of the heaven and to the beasts of the earth, so that those who had abused God's gifts for impiety and had sacrificed their own offspring to idols should make their bellies the tombs of their children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
