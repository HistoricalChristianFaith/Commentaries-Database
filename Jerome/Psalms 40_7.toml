[[commentary]]
quote='''
The lion of the tribe of Judah is the Lord Jesus Christ, who loosed the seals of the book, not, properly, of one book, as many think, the psalms of David, but of all the Scriptures, which were written by one Holy Spirit; and therefore they are called one book. Of this Ezekiel testifies in mystical speech (Ezek 2) that it was written within and without: in the sense and in the letter. Of this the Savior too speaks in the psalms: At the head of the book it is written of me (Ps 39 [40]:8); not of Jeremiah, not of Isaiah, but in all holy Scripture, which is called one book.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
In which was a rolled-up book, and he spread it out before me, and it was written within and without; there were written in it lamentations and song and woe. For 'rolled-up book' the Seventy translated 'the heading of the book', in the hand of the Lord who sits upon the throne, the hand which was sent forth and stretched out; of this book it is also said in the Psalms: In the heading of the book it is written of me — let us understand 'heading' as the beginning —. This book, rolled up and sealed, and written within and without, or before and behind, was of such difficulty that no one could, either in heaven or on earth or under the earth, open it or read it, except only the lion of the tribe of Judah, the root of David and of Jesse; the book which John in the Revelation said he had devoured, not whole but in its heading, that is, in its beginning. For it cannot be that human nature should devour all the treasures of this book.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
In the beginning God made heaven and earth. Most people think, as is written also in the Dispute of Jason and Papiscus, and as Tertullian argues in his book against Praxeas, and as Hilary too affirms in his exposition of a certain psalm, that in the Hebrew it has in the Son God made heaven and earth: but the truth of the matter itself proves this to be false. For both the Seventy translators and Symmachus and Theodotion translated in the beginning, and in the Hebrew it is written bresith, which Aquila renders in the head, and not baben, which is called in the Son. It can therefore be taken of Christ according to the sense rather than according to the translation of the word: he is shown to be the founder of heaven and earth as much on the very front of Genesis, which is the head of all the books, as also in the beginning of John the evangelist. Hence in the Psalter too he says of himself in the head of the book it is written of me, that is, in the beginning of Genesis, and in the Gospel all things were made through him, and without him nothing was made. But this too should be known, that among the Hebrews this book is called bresith, for they have this custom, that they give volumes their names from their beginnings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
