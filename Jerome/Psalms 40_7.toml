[[commentary]]
quote='''
The lion of the tribe of Judah is the Lord Jesus Christ, who loosed the seals of the book, not, properly, of one book, as many think, the psalms of David, but of all the Scriptures, which were written by one Holy Spirit; and therefore they are called one book. Of this Ezekiel testifies in mystical speech (Ezek 2) that it was written within and without: in the sense and in the letter. Of this the Savior too speaks in the psalms: At the head of the book it is written of me (Ps 39 [40]:8); not of Jeremiah, not of Isaiah, but in all holy Scripture, which is called one book.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
