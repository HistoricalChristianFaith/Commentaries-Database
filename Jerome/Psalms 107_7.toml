[[commentary]]
quote='''
"And he led them into the right way." Because "they did not find the way of the city of habitation," therefore "he led them into the right way." So he shows that before they did indeed find ways, but crooked ones and not right. "And he led them into the right way." The Way led them into a way. The Lord himself and Savior led them into the right way. The Way led them into the right way: he made them walk in himself, being himself both the leader and the way. "And he led them into the right way": that by this way, that is, by the Lord the Savior, they might go into the city of habitation, into his Church, which had been founded upon himself, both the rock and the way and the leader.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_033.html'
source_title="Homily 33, on Psalm 106"
