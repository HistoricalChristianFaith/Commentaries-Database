[[commentary]]
quote='''
I will repay you, he says, what you have done to my people, because you have taken my silver and gold, that is, the vessels of the temple, and whatever was most precious and most splendid in it, the golden lampstand and the golden table of the showbread, and the two golden Cherubim, and the mercy seat, and the golden bowls and censers, and have consecrated them to your idols. But history relates that it was rather the Chaldeans who did these things, who placed the vessels of the temple of the Lord in the temple of Bel, from which Belshazzar afterward drinks in the bowls, and at once his kingdom is transferred to the Medes and Persians. But since these things are said to be going to happen after the great and terrible day of the Lord, which the apostles interpret of the resurrection of the Lord, and the Hebrews defer to the future time of judgment, it is rather to be understood of the Romans; for Vespasian and Titus, having built the temple of Peace at Rome, consecrated the vessels of the temple and all its offerings in that shrine, as Greek and Roman history relates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
