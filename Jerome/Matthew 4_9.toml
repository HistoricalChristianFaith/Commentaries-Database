[[commentary]]
quote='''
An arrogant and vain vaunt; for he hath not the power to bestow all kingdoms, since many of the saints have, we know, been made kings by God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
All these I will give you, if falling down you worship me. Arrogant and proud, he says this too out of boastfulness, not because the devil has power in the whole world so as to be able to give all kingdoms, since we know that very many holy men were made kings by God. If falling down, he says, you worship me. So whoever is going to worship the devil has fallen beforehand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
