[[commentary]]
quote='''
And he measured the gate from the roof of a cell — or παραστάδος — to its roof or wall, and found, between roof and roof, twenty-five cubits of breadth, for so much was the space between door and door, or between gate and gate. Let us have said these things briefly, in the spirit of one divining rather than explaining, wishing to sketch, according to the letter, a picture that is obscure and almost invisible; for the rest, we shall set down, briefly and with hesitation, the few things we can conjecture.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Whence there follows: And he measured the gate from the roof of a cell to the roof (or wall) of it, and he found twenty-five cubits of breadth; and the number itself, though it is square, is nevertheless referred to the senses: for if you set five cubits against each other five times, you will produce the number twenty-five, which is between the roof of the cells and the roof; and yet both, set opposite each other, have from their highest parts door opposite door. Let these things not seem trivial to the reader — although they displease even me myself who say them, feeling that I am knocking at a closed door —, but they are to be read with indulgence; otherwise I could simply have confessed my ignorance and cut off every desire of the studious: for as we are far from perfect knowledge, so we judge it a lighter fault to say at least a little than nothing at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
