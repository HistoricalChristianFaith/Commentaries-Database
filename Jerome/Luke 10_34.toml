[[commentary]]
quote='''
These are the remedies of our life, the vine and the olive, wine and oil. In wine, severity; in oil, mercy. Indeed, that man who was going down from Jerusalem to Jericho, who had been wounded, the Samaritan, that is, the guardian, poured into him nothing except wine and oil. Wine, the severity of the precepts, astringent wine; so that whatever there is of bad humor, it may burn out and consume. But since human frailty cannot bear the truth—'for if you should mark iniquities, Lord, Lord, who shall endure it?' for if the Lord should be only just, we cannot live—therefore to his justice, that is, to the wine, the oil of mercy has been added.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_042.html'
source_title="Homily 42, on Psalm 127"
