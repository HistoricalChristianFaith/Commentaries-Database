[[commentary]]
quote='''
But if, on the contrary, this is set against us, how in the Acts of the Apostles, in Stephen's address, it is said to the people that seventy-five souls entered Egypt, the excuse is easy. For holy Luke, who is the writer of that history, sending out the volume of the Acts of the Apostles among the Gentiles, ought not to write anything contrary to that Scripture which had already been published among the Gentiles. And certainly, at that time at least, the authority of the Seventy translators was held in greater repute than Luke, who among the nations was regarded as unknown and lowly and of no great credit. But this is to be observed generally, that wherever the holy apostles or apostolic men speak to the peoples, they mostly make use of those testimonies which had already been published among the Gentiles, although many relate that Luke the evangelist, being a proselyte, did not know Hebrew letters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
