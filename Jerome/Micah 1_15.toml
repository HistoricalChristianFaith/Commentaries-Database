[[commentary]]
quote='''
After this there follows: You who dwell in Lachish, the inheritance will come as far as Adullam. Adullam means testimony of the draught, or of their drawing, which in Greek is expressed more significantly, μαρτυρία ἀντλήσεως αὐτῶν. We read in Proverbs: If you are evil, you alone will draw up evils. She, therefore, who dwells in Lachish, that is, on a most evil road, will come to the testimony of her own draining, which she will drain and drink down according to the measure of her works. Or certainly it should be punctuated so that what is said, you who dwell in Lachish, is referred to what precedes, and the order and sense is: I will bring heirs to you from the Church, you who dwell in Lachish, because you too will be of the inheritance of the Lord, when you have drained and received what you deserve. At the end of this section I beseech the reader not to take necessity for choice, nor to judge a lengthy exposition to be verbosity, and to marvel rather that in places so rough I find anything at all, than that I leave out none of the things that have to be said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
