[[commentary]]
quote='''
The Savior himself also speaks, showing the humility of the dispensation: Whatever he sees the Father doing, these same things the Son also does likewise (John 5:19). Not that the Father made one heaven and one earth, and that after their likeness another heaven and another earth and the other elements were made by Christ; but that whatever the Father works, these same things the Son also works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
