[[commentary]]
quote='''
Some think that this, which is said specifically to the Jews, because their victims are unclean and polluted and the sacrifice is transferred to the nations, ought to be understood of the priests of the church, who offer victims to the Lord negligently. But if we accept this, then the victims must again be transferred from the Church to another religion. And as the gospel succeeded the law, so in turn things that will never be will succeed the gospel. They also refer the defiled table of the Lord to the holy Scriptures, if they are understood otherwise than as they were written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
