[[commentary]]
quote='''
In the same way the wise are named in two senses: both those who are of full and perfect virtue, and those who are beginning and are set on the way of progress. Of the perfect it is said: "I will send wise men to you" (Luke 11:49). Of the unwise: "Rebuke a wise man, and he will love you" (Prov. 9:8). For he who is of full and consummate virtue does not need reproof. According to this sense the other virtues too are to be understood: namely, that brave and prudent, pious, chaste, righteous and temperate are taken sometimes in the full sense, sometimes loosely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
