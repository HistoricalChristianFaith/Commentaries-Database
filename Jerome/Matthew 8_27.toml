[[commentary]]
quote='''
But if any shall contend that it was the disciples who wondered, we shall answer they are rightly spoken of as 'the men,' seeing they had not yet learnt the power of the Saviour.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Moreover the men marveled, saying: What sort of man is this, that the winds and the sea obey him. It was not the disciples but the sailors and the others who were in the ship who marveled. But if anyone should contentiously maintain that those who marveled were the disciples, we shall answer that they were rightly called men, because they did not yet know the power of the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
