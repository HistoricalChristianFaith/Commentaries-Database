[[commentary]]
quote='''
We have acknowledged, O Lord, our impieties, the iniquity of our fathers, because we have sinned against you. 'Both we', he says, 'and our fathers, with the same madness, neglected the precepts of God, and the measure of our forefathers has been filled up in us, so that whatever had been lacking in them was completed by our heap'. Hence it is also said of Judas: Let the iniquity of his fathers return to remembrance in the sight of the Lord, and let not the sin of his mother be blotted out! Let it be over against the Lord always, and let the memory of them perish from the earth!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
