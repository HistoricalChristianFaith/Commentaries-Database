[[commentary]]
quote='''
Thus says the Lord to me: go and stand in the gate — or in the gates — of the sons of the people, through which [gate] — or through which [gates] — the kings of Judah go in and go out, in all the gates of Jerusalem, and you shall say to them: hear the word of the Lord, kings of Judah and all Judah — or Judea — and all the inhabitants of Jerusalem, who go in through these gates! 'Since', he says, 'they scorn to hear your words and do not come to you to inquire what the sentence of God may be, go you to the most frequented place, either of the gates of the temple or of those of the city, through which the kings and all the common people go in and go out, so that they may be compelled by necessity to hear, and you may preach the word of God out of season and in season, and no excuse may remain to them that they did not do it because they did not hear'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
