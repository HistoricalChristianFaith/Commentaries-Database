[[commentary]]
quote='''
And he comforted all who mourn, saying: Blessed are those who mourn, for they shall be comforted (Matt 5:5), so that he might appoint for those who mourn in Zion, and give them glory and a crown instead of ashes. Among these was the apostle Paul too, who mourned for Zion and said: For I have sorrow and continual grief (Rom 9:2); and again: I could wish that I myself were anathema from Christ for my brethren and kinsmen according to the flesh, who are Israelites (ibid., 3). And therefore those who mourned and lamented received the oil of joy instead of ashes, seeing that very many of the Jews had believed and were receiving a most pure robe instead of the garment of mourning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
