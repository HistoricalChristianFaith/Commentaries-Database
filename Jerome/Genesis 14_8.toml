[[commentary]]
quote='''
And it should be known that, for what follows a little after, [Gen 14:8] and they drew up their battle line against them for war in the valley of the salt-pits, in the Hebrew it has in the valley of Sedim: which Aquila translates τῶν πρινεώνων [of the holm-oaks], Theodotion τῶν ἀκτῶν [of the shores], signifying pleasant groves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
