[[commentary]]
quote='''
Woe is me over my crushing, my most grievous wound! LXX: Woe over your crushing, your most grievous wound! According to the Hebrew, Jerusalem herself speaks, because she is grievously afflicted and bears an incurable wound; but according to the Seventy, the prophet speaks to Jerusalem and laments her over her crushing and her own wound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
But I said: Truly this is my infirmity — or my wound — and I will bear it or it has seized me. Jerusalem herself speaks: 'Whatever I suffer, I suffer through my own fault; I understand my wound, which has seized me, or I will bear the wrath of the Lord, because I have sinned against him'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
