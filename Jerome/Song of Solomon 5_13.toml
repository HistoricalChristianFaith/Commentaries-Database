[[commentary]]
quote='''
In the Song of Songs the bride praises her bridegroom: His cheeks are like bowls of spices. By the cheeks is understood speech, which, uttered by the Lord, brings forth various ointments; and so great will be the fragrance of its good odor that the Lord makes himself a scourge woven from the testimonies of the scriptures, and casts out of the temple those who sell and buy, and says to them: It is written, My Father's house shall be called a house of prayer for all nations; but you have made it a house of trade.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
