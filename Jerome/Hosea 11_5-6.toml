[[commentary]]
quote='''
According to the Seventy, Ephraim dwelt in Egypt, saying that he held the holy land and the Church of the Lord Savior; but by vices and sins and the perversity of his faith he always lingered in Egypt. Because, therefore, he dwelt in Egypt, the great mind, the Assyrian, will be his king; for he would not return to the Church, and, having lost power, that is, Christ, who is the power of God and the wisdom of God, he has always lived in languor; and he was weak, subject to all the demons and passions; therefore the sword, that is, spiritual knowledge or the word of a churchman, laying waste and subduing, will always be at work in his cities, which he impiously built against God; and the sword itself will rest in his hands, so that, slain by another, he cannot slay another nor lift his hand against the adversary. Finally they will receive, and will devour, according to their own counsels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
