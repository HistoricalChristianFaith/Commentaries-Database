[[commentary]]
quote='''
Pass over to Calneh, and see, and go from there to Hamath the great, and go down to Gath of the Philistines, and to all the best kingdoms of these, whether their border is wider than your border. You who are set apart for the evil day, and draw near to the throne of iniquity, who sleep on beds of ivory, and wanton on your couches, who eat the lamb from the flock, and calves from the midst of the herd, who sing to the sound of the psaltery: Like David they thought they had instruments of song, drinking wine in bowls, and they are anointed with the best ointment, and they suffered nothing over the breaking of Joseph. LXX: House of Israel, pass over, all of you, and see, into Calneh, and pass on from there into Hamath Rabba, and go down into Gath of the foreigners, the best of all these kingdoms, whether their borders are larger than your borders, you who come to the evil day, who draw near and touch false sabbaths, who sleep on beds of ivory, and abound in delights on your couches, and eat kids from the flocks and suckling calves from the midst of the herds, who clap to the sound of the instruments; they thought them as things standing, and not as things fleeing; who drink strained wine, and are anointed with the first ointments, and suffered nothing over the breaking of Joseph. Pass over, all of you, to Calneh, which is now called Ctesiphon, and pass over, all of you. Who are these all? Surely those of whom he had spoken above: Nobles, heads of the peoples, and you who are wealthy in Zion, and trust in the mountain of Samaria. You therefore, pass over into the city of Persia, and observe carefully, and from there go on to Hamath the great, which is now named Antioch. And he calls it great to distinguish it from the lesser Hamath, which is called Epiphania. Hence even to this day, for those going to Mesopotamia, the first stopping-place is called Emmas, a corrupted word indeed, but one keeping traces of the former name; its region is called Riblah, in which, in the presence of Nebuchadnezzar, the sons of Zedekiah king of Judea were killed, and his eyes were blinded. And go down, he says, to Gath of the Philistines. You who dwell on mount Zion and on the mountain of Samaria, go down to the Philistines, who live in the plains, and to all the best kingdoms of these, which lie under different cities, Gaza and Ashkelon, Azotus, Ekron and Gath, and see whether their border is wider than your border, whether you or they hold the larger provinces; you, I say, you of the people of Israel, who are set apart for the evil day, namely for the day of captivity, and draw near to the throne of iniquity, going to the unjust judge, the Babylonian king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
