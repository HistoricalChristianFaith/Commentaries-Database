[[commentary]]
quote='''
And by another example also he teaches that a just man must not care at all what men say, saying: As your conscience knows that you have spoken about many and have often disparaged others, so you too ought to pardon others when they disparage you. And at the same time he teaches that one must not judge easily, and that he who has a beam in his eye must not speak of another's mote.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
