[[commentary]]
quote='''
On that day what is upon the bridle of the horse shall be holy to the Lord; and the cauldrons in the house of the Lord shall be like bowls before the altar. And every cauldron in Jerusalem and in Judah shall be sanctified to the Lord of hosts. LXX: On that day what is upon the bridle of the horse shall be holy to the Lord Almighty; and the cauldrons that are in the house of the Lord shall be like bowls before the house of the altar. And every cauldron in Jerusalem and in Judah shall be holy to the Lord Almighty. The Hebrew word mesuloth Aquila and Theodotion interpreted as βυθὸν, that is, depth; Symmachus as περίπατον σύσκιον, that is, a shady walk. The Seventy alone translated χάλινον, that is, bridle, and we too have followed them in this place, so as not to seem to bring something new into a well-known question. When I asked a Hebrew what it meant, he told me that we ought not to read mesuloth but mesaloth, which means the trappings of horses and warlike adornment, and that apart from this place the word is found in no volume whatever of the holy scriptures; that a bridle, moreover, is called resen in the Hebrew tongue, and not mesuloth, which the LXX translated; and that the sense is: At the time of the perpetual solemnity and of the kingdom of Jerusalem, when all things are pacified and tranquil, there will be no need at all of cavalry, which is the strongest kind of fighting force, but all the adornment and beauty of the trappings is to be devoted to the worship of the Lord. So they may say. Let us refer the depth of the horses and their σύσκιον walk, shady or dark, to mystical knowledge, which David too, like a most excellent horse, boasted that he had, saying: The uncertain and hidden things of your wisdom you have made manifest to me. And the Apostle: O the depth of the riches of the wisdom and knowledge of God. How inscrutable are his judgments, and untraceable his ways. From this depth the prophet cried to the Lord, and he heard him. In these depths and darkness God set his hiding place; into this darkness and these divine mysteries Moses entered in the thick cloud of Mount Sinai, that he might see God; of them David too spoke in another psalm: The judgments of the Lord are a great abyss. These secrets and these mysteries are holy to the Lord, which John the evangelist knew, who dared to say what perhaps the angels did not know: In the beginning was the Word, and the Word was with God, and the Word was God. And for that reason he is loved by the Lord, because he possessed a most excellent depth; and he had reclined upon the breast of Jesus, whence he had also drawn wisdom. But if we wish to take the bridle, as the LXX translated, as the word of God, let us understand by the bridle him who reins in from vices horses raging with lust, and mules barren and wanton, and restrains them, and does not allow them to rush headlong; of whom it is said: Do not become like the horse and the mule, which have no understanding. With bridle and bit you will bind fast the jaws of those who do not draw near to you. Of this bridle James also speaks: We put bridles into the mouths of horses, and we turn about their whole body, so, that is, that they may walk on a straight road and be able to offer the Lord backs gentle for sitting. Such a bridle and such a word, wrought with a variety of gold and silver, prepares wild horses for the Savior to sit upon, and makes them holy and properly consecrated to his worship. I have heard from someone a thing said with pious intent indeed, but ridiculous: that the nails of the Lord's cross, out of which Constantine Augustus made a bridle for his horse, are called the holy thing of the Lord. Whether this is to be taken so, I leave to the reader's prudence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
