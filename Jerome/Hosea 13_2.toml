[[commentary]]
quote='''
And it is not enough for him to have fallen, unless he turns the tongue which he had received for singing of God into images of idols, and with artful eloquence composes a dogma like the truth, which is nothing else but a contrivance of human depravity. And they instruct their disciples that they too should sacrifice men, that is, steal them from the Church of God and bring them in to the heretics, and kill those whom they have deceived. What follows: For the calves have failed, has this sense: Do not seek those whom you may seduce among the Gentiles, who are called brute animals; but seize those, sacrifice those, who, set within the Church, are reckoned by the name of Christ and are called men, according to that prophetic word: But choice foods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
