[[commentary]]
quote='''
Nor shall they bring forth in trouble, or for a curse, or, as is put more expressly in the Hebrew, εἰς ἀνυπαρξίαν, which in their language is said LABALA (לבהלה), that is, so that they cease to be and have an end of their substance: for which Aquila, Symmachus and Theodotion translated haste: so that they may by no means hasten to believe without reason, but may imitate Nathanael, who was praised by the voice of the Lord: Behold, truly an Israelite, in whom there is no guile (John 1:47), who sought Christ by the authority of the Scriptures and longed to recognize him from the Prophets, saying: Can anything good come out of Nazareth? And the sense is: How do you bring me a Messiah from Galilee and Nazareth, whom I know to have been promised from Bethlehem of Judah?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
