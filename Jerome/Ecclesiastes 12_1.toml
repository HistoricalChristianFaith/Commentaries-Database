[[commentary]]
quote='''
And remember him who created you in the day of your youth, before the days of malice come and the years draw near in which you will say: I have no will in them. Always remember your Maker, and so walk the road of youth that you remember your final death, before the time comes upon you in which every sorrowful thing follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
