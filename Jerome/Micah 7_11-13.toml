[[commentary]]
quote='''
Thus far Jerusalem has spoken, or the prophet in the person of the people; now God is brought in answering Jerusalem: O Jerusalem, the days have come for your walls to be built, which had been destroyed by the Babylonian when he laid you waste. On that day the law shall be far off, or the precept and command, as Symmachus and Theodotion translated, saying ἐπιταγὴν καὶ πρόσταγμα; and the sense is: You will by no means lie subject to the rule of the Babylonians; on that day on which your walls will be built, they will come to you from Asshur, and from the fortified cities; from the fortified cities, I say, as far as the Jordan, across which the people also passed before, and from the Red Sea; and from all the nations as far as the Dead Sea, which is near your land, and to Mount Zion, from the mountains of the Persians and the Medes, into which they had earlier been carried away; and the land will be the remnant of the Chaldeans, and of those who had laid you waste, a desolation, because of its inhabitants, and because of their evil works. This the Jews promise themselves to this day; and in that place in which we have expounded: On that day the law shall be far off, as it seemed to us, and as the more prudent among them discuss it, some lie frivolously and say: On that day on which the walls of Jerusalem have been built by Christ, the holy Scriptures of the Law and the Prophets, which are now held by us, will be taken out of our hands and handed over to the people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And since every end of punishments is the beginning of good things, and pain advances toward health, bricks will be made from her mud, and her daubing will be the shaping of bricks. And on that day she will cast off her old errors, and her cities, which had been badly fortified, will come into enclosure, or into division, and will be divided by the Assyrians; from Tyre too, which is interpreted συνοχὴ, that is, distress, other powers will rise up, and there will be sedition even as far as those who delight in the flux of this age and beget lusts in men. And from sea to sea, and from mountain to mountain, wars will rise up against one another, so that bitterness fights against bitterness, and a loftiness that exalts itself and is to be humbled contends against another height; and then truly it may be fulfilled: Come, let us go down and confound their languages, so that each may not hear the voice of his neighbor; for indeed it is profitable that the most wicked powers should have no concord among themselves. And when Satan has been divided against Satan, then at last his whole kingdom will be destroyed. And what frequently happens in great armies, that when the tyrant has been killed his attendants divide the kingdom among themselves and rise up against one another, and there is civil war among them, this will happen also at the consummation of the world, when the walls of Jerusalem have been built, and Babylon has fallen, and the Assyrians, and the Tyrians, from the river, and from the sea, and from the mountains, that is, all the nations of demons, will fight among themselves; and, their kingdom having been scattered, the kingdom will be the Lord Jesus', and every knee shall bow, of things in heaven, and on earth, and under the earth, and every tongue shall confess that the Lord Jesus is in the glory of God the Father. But that you may know that the end of this sedition is the advance of the virtues, the land of Babylon will then become a ruin with all its inhabitants, and will by no means bear Babylonian fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
