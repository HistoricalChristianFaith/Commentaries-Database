[[commentary]]
quote='''
For which in the book of Numbers I have found it written thus: Thence they shall measure the boundaries toward the eastern quarter from 'the village of Enan' (that is, 'Aser-Enon') as far as Sephama, and from Sephama the boundaries will go down to Rebla, opposite the spring; thence they will come toward the east to the sea of Chinnereth, and they will extend as far as the Jordan, and at the last they will be closed by the sea. Above he had said: And the boundary shall be from the sea up to Eser-Enon, the boundary of Damascus: from the end of the northern quarter, then, that is, from the court of Enan, the boundaries extend according to the book of Numbers as far as Sephama, which the Hebrews name Apamea, and from Apamea the boundaries will go down to Rebla, which is now called Antioch of Syria; and so that you may know that this Rebla signifies the city which is now the most renowned in Coele-Syria, there follows: Opposite the spring, which it is evident signifies Daphne, from which spring the aforesaid city enjoys most abundant waters — this place was planted by the military hand of Gnaeus Pompey, who first subjected Judea to Roman rule, and from him — following the fable of the poets — it received the name of Daphne, on account of the laurels and cypresses, trees which are very frequent in that very place too —. Thence, he says, the boundaries will come toward the eastern quarter to the sea of Chinnereth: as far as the lake of Tiberias; and it is called a sea although it has sweet waters, according to the idiom of the scriptures, which call gatherings of waters seas. And the boundaries, he says, will extend as far as the Jordan, and at the last will be closed by the sea: either by the Dead Sea or, as others think, by the tongue of the Red Sea, on whose shore Aila is situated, where a legion and garrison of the Romans is now stationed. Let this have been said according to the book of Numbers.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
