[[commentary]]
quote='''
This shepherd will rise up in Israel for this reason, because the true shepherd had said: I will no longer feed you. Under another name, both in the prophet Daniel and in the Gospel and in Paul's epistle to the Thessalonians, he is prophesied as the abomination of desolation, who is to sit in the temple of the Lord and make himself out to be God; and through Isaiah too he is called the great mind. And he comes for this, not to heal but to destroy the flock of Israel. For the good shepherd visits the sick animals, seeks out the scattered, brings back those left behind, supports the weary. On the contrary, the bad shepherd does everything the opposite way, and having devoured the flesh of the fat ones, he breaks apart and twists the hooves of the rams and the sheep, so that they may not walk with a straight foot. This shepherd the Jews received, whom the Lord Jesus will slay with the spirit of his mouth and will bring to nothing by the brightness of his coming, so that those who did not believe the truth, lest they should be saved, may believe a lie and be judged, because they consented to iniquity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
