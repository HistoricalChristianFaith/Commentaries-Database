[[commentary]]
quote='''
And I will make her like a wilderness, and set her like a pathless land, and kill her with thirst. LXX: And I will make her as a desert, and set her as a land without water, and slay her in thirst. If she will not be converted to better things, I will do to her what I did in the wilderness, so that, led into captivity, they may fall in a foreign land, suffering thirst for all good things, and be unable to return to their homeland. Or at least let them hear in the Gospel: Your house will be left to you desolate. And the Lord will send them not a famine of bread, nor a thirst for water; but a famine of hearing the word of the Lord. Of which Isaiah also speaks: They will be like a garden that has no water. The heretics who have been cast off by the Lord, if they do not return to their former home, will suffer such want of all things that even what they seem to have, though false, will be reduced to nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
