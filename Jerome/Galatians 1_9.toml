[[commentary]]
quote='''
But in adding as we said before, and now I say again, he shows that at the beginning too, guarding against this very thing, he had pronounced anathema on those who were going to preach otherwise, and that now, after the preaching has been done, he decrees the anathema which he had foretold before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
