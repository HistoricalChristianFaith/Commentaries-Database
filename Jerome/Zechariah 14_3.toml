[[commentary]]
quote='''
And the Lord shall go forth, and shall fight against those nations, as he fought on the day of conflict. And his feet shall stand on that day upon the Mount of Olives, which is opposite Jerusalem to the east; and the Mount of Olives shall be split from the middle of itself to the east and to the west, with a very great chasm. LXX: And the Lord shall go forth, and shall fight against those nations, as on the day of engagement, and on the day of battle. And his feet shall stand on that day upon the Mount of Olives, which is opposite Jerusalem on the eastern side. And the Mount of Olives shall be split, half of it to the east, and half of it to the sea, with an exceedingly great abyss. That God goes forth, and fights against the nations, and that his feet stand upon the Mount of Olives, and the other things that are said ἀνθρωποπάθως (in human fashion) in the holy scriptures and are contained there in a fleshly way, we ought to take in a manner worthy of God. Otherwise, since the Apostle says: Who is the image of the invisible God, and again: To the King of the ages, incorruptible, invisible, God, and it is written in the Gospel: No one has ever seen God; the only-begotten Son, who is in the bosom of the Father, he has made him known, and again: Not that anyone has seen God, except him who is from the Father; just as we take his wrath and repentance and soul and hands, and feet and belly, and eyes and the other members of the body according to the variety of the occasions and of the senses of interpretation, so too what is written, The Lord shall go forth, and shall fight, is to be taken according to what we read in Habakkuk: You went forth for the salvation of your people, for salvation with your Christ, and in Micah: For behold, the Lord shall go forth from his place, and shall come down and tread upon the high places of the earth, and the mountains shall be consumed beneath him, and the valleys shall be split, and in Isaiah too: The Lord of powers shall go forth and crush the war, and shall stir up zeal and shall cry out over his enemies with strength. God therefore goes forth from his place when he is compelled to break off his quiet and gentleness and clemency for the correction of those who sin; though he is sweet by nature, by our fault he παραπικραίνεται, that is, is made bitter, not to himself, but to those who suffer, to whom the torments are bitter. He who elsewhere says through the prophet: I am God, and I do not change, and to whom it is said: But you are the same, and you endure, and in the epistle of James: With whom there is no change, now goes forth and fights as on the day of conflict, when he drowned Pharaoh in the Red Sea and fought for the people of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
