[[commentary]]
quote='''
Hence the Lord too: For judgment, he says, I have come into this world, so that those who do not see may see, and those who see may become blind. The people of the Gentiles did not see, and after faith in Christ began to behold the light of the truth, which speaks through the prophet: The Spirit of the Lord is upon me, because he has anointed me; he has sent me to preach the gospel to the poor, to proclaim release to the captives and to the blind that they may see, and be enlightened with wisdom, of which it is written: A man's wisdom enlightens his face, and in the psalms we read: The Lord enlightens the blind, or makes them wise. For that is rather what σοφοῖ signifies. The Jews saw, and because they would not receive the light, they were covered with eternal blindness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
