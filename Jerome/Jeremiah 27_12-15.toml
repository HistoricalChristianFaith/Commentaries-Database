[[commentary]]
quote='''
And to Zedekiah, king of Judah, I spoke according to all these words, saying: Put your necks under the yoke of the king of Babylon and serve him and his people, and you shall live. Why will you die, you and your people, by sword, famine and pestilence, as the Lord has spoken to the nation that will not serve the king of Babylon? Do not listen to the words of the prophets who say to you: Do not serve the king of Babylon; for they themselves speak a lie to you, for I did not send them, says the Lord, and they prophesy in my name falsely, so that I may drive you out and you perish, both you and the prophets who prophesy to you. After all the nations he passes to Zedekiah, king of Judah, and speaks with the same words with which he threatened the nations; for he who has sinned sins either like or greater than the other nations does not merit the privilege of the Israelite nation. Finally, because the rebellious people disdained to hear, it was consumed by sword, famine and pestilence. And it is to be observed in holy Scripture that instead of 'false prophets' it calls 'prophets' those who prophesy falsely in the name of the Lord. 'And they do this, so that I', he says, 'may drive you out and you perish, both you and the prophets who prophesy to you'; therefore the destruction both of those who are deceived and of those who deceive is alike. This, which we have set down from the Hebrew: under the yoke of the king of Babylon and serve him and his people, and you shall live. Why will you die, you and your people, by sword, famine and pestilence, as the Lord has spoken to the nation that will not serve the king of Babylon? do not listen to the words of the prophets who say to you, is not found in the Seventy; and therefore I admonish the prudent reader to understand how much is lacking, point by point, in the Greek and Latin codices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
