[[commentary]]
quote='''
We, Jews by nature, and not sinners from among the Gentiles.

At this place the heretics creep in, who, inventing certain ridiculous and silly notions, say that a spiritual nature cannot sin, nor an earthly nature do anything righteously. Let us ask them why branches were broken off from the good olive, and why branches from the wild olive were grafted into the root of the good olive, if nothing can either fall from the good or rise from the bad? Or how Paul either persecuted the Church earlier, if he was of a spiritual nature, or was afterward made an Apostle, if he was begotten of earthly dregs. But if they contend that he was not earthly, let us set down his own words: "We were by nature children of wrath, even as the rest" (Eph. 2:3). He is a Jew by nature who is of the race of Abraham and was circumcised by his parents on the eighth day. He is not a Jew by nature who was afterward made one from among the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
