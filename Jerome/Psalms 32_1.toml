[[commentary]]
quote='''
But according to anagogy, those are called iniquities, that is, both ἀνομίαι and ἀδικίαι (injustices), which we committed before baptism and which have been forgiven us in baptism; but sins are those which we have done after baptism, of which it is also written in the psalm: Blessed are they whose iniquities are forgiven, and whose sins are covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
