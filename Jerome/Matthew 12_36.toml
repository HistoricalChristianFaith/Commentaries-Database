[[commentary]]
quote='''
But I say to you that every idle word that men speak, they will render account for it on the day of judgment. This too clings to what precedes, and the sense is: If an idle word, which in no way builds up the hearers, is not without danger to the one who speaks it, and on the day of judgment each one will have to render account of his speech, how much more will you, who slander the works of the Holy Spirit and say that I cast out demons by Beelzebub, the prince of the demons, have to render account of your slander! An idle word is one that is spoken without profit both to the speaker and to the hearer: if, leaving serious matters aside, we speak of frivolous things and tell old tales. But he who rehearses buffooneries, and loosens his mouth in guffaws, and utters anything shameful, he will be held guilty not of an idle word but of a criminal one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
