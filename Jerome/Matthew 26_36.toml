[[commentary]]
quote='''
Gethsemane is interpreted, 'The rich valley;' and there He bade His disciples sit a little while, and wait His return whilst He prayed alone for all.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Jesus came with them to an estate which is called Gethsemane, and he said to his disciples: Sit here while I go over there and pray. Gethsemane is interpreted most fertile valley; there he ordered the disciples to sit for a little while and to wait for his return, while the Lord alone prayed for all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
