[[commentary]]
quote='''
— The sleeping on the right side, that is, of the forty years, is easily reckoned. For after Eliakim, who was surnamed Jehoiakim, his son Jehoiachin, surnamed Jeconiah, reigned three months. While he was reigning, the servants of Nebuchadnezzar king of Babylon went up to Jerusalem, and the city was surrounded with siege-works. And Nebuchadnezzar king of Babylon came to the city, while his servants were attacking it. And Jehoiachin king of Judah went out to the king of Babylon, he and his mother and his servants and his prince and his eunuchs, and the king of Babylon received him in the eighth year of his reign. And he carried out from there all the treasures of the house of the Lord and the treasures of the royal house. And shortly after: And he carried over all Jerusalem and all the princes and all the mighty men of the army, ten thousand, into captivity, and every craftsman and smith; and nothing was left, except the poor of the people of the land. When he had been taken, with a countless multitude of the people and all the wealth of Jerusalem, Zedekiah reigned eleven years, under whom the city was taken and the temple destroyed; and its desolation lasted until the second year of Darius, for seventy years. Now in the thirtieth year of the temple's desolation, Cyrus reigned among the Persians, having overthrown Astyages king of the Medes; and he, according to the prophecy of Isaiah, sent back to Jerusalem about fifty thousand men of the tribe of Judah, and the vessels of the temple which Nebuchadnezzar had carried off, and the rest that the history of Ezra relates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
