[[commentary]]
quote='''
The wise are confounded, terrified and taken, it is not that those who do these things are wise, but he calls them wise so that they may be condemned by their own judgment and, on the contrary, their wisdom may be proved to be folly, as Paul says: you who teach another, do you not teach yourself? And because they have cast away the word of the Lord, therefore there is no wisdom in them. In vain, then, do they boast of knowledge of the law who destroy their teaching by their works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
