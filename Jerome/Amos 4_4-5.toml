[[commentary]]
quote='''
Come to Bethel, and act impiously; to Gilgal, and multiply transgression; and bring your victims in the morning, your tithes on three days. And sacrifice praise from what is leavened, and call for voluntary offerings, and proclaim them. For so you have willed, sons of Israel, says the Lord God. Therefore I also have given you numbness of teeth in all your cities, and want of bread in all your places; and you have not returned to me, says the Lord. LXX: You entered into Bethel, and acted unjustly; in Gilgal you multiplied acting impiously, and you brought in your sacrifices in the morning, your tithes on the third day. And they read the law outside, and called upon confessions. Proclaim that the sons of Israel have loved these things, says the Lord God. And I will give you numbness of teeth in all your cities, and want of bread in all your places; and you have not returned to me, says the Lord. First let us lay the foundations of the history: O wretched Israel, captivity is already near you, already the Assyrian army is pressing upon you; do what you please, act impiously; commit fornication freely with idols, so that the more shameless you have been, the more just my sentence upon your torments may appear. Come, he says, into Bethel, in which you set up the golden calf, and act impiously against God. Come to Gilgal, the place of idolatry, of which I spoke through Hosea: All their wickedness is in Gilgal. And again in the same prophet: In vain were they sacrificing oxen in Gilgal. And when you have come to Gilgal: Multiply transgression. For whatever you do there is transgression against God, to whom you have preferred idols. And bring your victims in the morning, so that there may be no delay in crime. Your tithes on three days, or, as Symmachus translates, your tithes on the third day. The explanation of this passage seems to us to be this: in Leviticus it is commanded in the law that certain sacrifices are not to be kept over to the second day, and that others are not to remain to the third day, and that if they do remain they are unclean. The sense, therefore, is: Slaughter unclean victims every day, and offer defiled sacrifices, and sacrifice praise from what is leavened, which according to the precepts of Moses is not offered to God at all. For 'praise' Aquila translated εὐχαριστίαν, that is, thanksgiving, which in Hebrew is called thoda. And call, he says, for voluntary offerings, which the Hebrews call nadaboth, that is, spontaneous. A freewill sacrifice, moreover, belongs to rejoicing, and in Latin we can call it a banquet. And when you have done this, proclaim your impiety to all, so that you may be seen not only to have done it, but also to have taught others. These things I command, and I speak in the imperative mood, in order to satisfy your will, because so you have acted and so you have willed, sons of Israel, says the Lord God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
