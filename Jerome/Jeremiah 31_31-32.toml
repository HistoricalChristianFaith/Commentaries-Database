[[commentary]]
quote='''
Behold, days are coming, says the Lord, and I will strike — or I will dispose — for the house of Israel and the house of Judah a new covenant — or testament — not according to the covenant — or testament — which I made with your fathers on the day when I took their hand to lead them out of the land of Egypt, a covenant — or testament — which they made void; and I ruled over them — or I neglected them —, says the Lord. And this will be the covenant — or testament — which I will strike with the house of Israel after those days, says the Lord: I will put my law in their inward parts — or in the mind — and in their heart I will write it, and I will be to them for God and they shall be to me for a people. And they shall no longer teach, each one his neighbor and each one his brother, saying: know the Lord, for all shall know me, from the least of them to the greatest, says the Lord, for I will be propitious to their iniquity and of their sin I will be mindful no more. The apostle Paul — or whoever else wrote the epistle — used this testimony to the Hebrews, and all churchmen after him say that all things were fulfilled at the first coming of the Savior, and that the New Testament, that is, the Gospel, succeeded to the Old Testament, and that from it the law of the letter has been exchanged for the law of the spirit, so that all the sacrifices too, and circumcision, and the sabbath, might be fulfilled spiritually. But that we put 'pactum' [covenant] for 'testamento' [testament] belongs to the Hebrew truth, although a testament too is rightly called a covenant, because in it is contained the will and the attestation of those who enter into a covenant. When Israel was led out of the land of Egypt, so great was God's familiarity with that people that he says he took it by the hand and gave a covenant, which they made void; and therefore the Lord neglected them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
