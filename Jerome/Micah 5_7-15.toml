[[commentary]]
quote='''
But the Hebrews dream ravings of this kind: after the seven shepherds, whom they invent and choose at will, and eight princely men have conquered the Assyrians and have fed upon the land of Nimrod with their swords, so that this shall have happened when the Assyrian has first come into the land of Judah, then, they say, when Christ comes, all the remnant of Jacob that has been able to survive among the nations will be in blessing, like dew coming from the Lord and like rain upon the grass, and they will by no means hope in men and in the sons of men, but in God. And they will be in the midst of the nations and peoples bloodthirsty and cruel, avenging themselves on their former masters, like a lion among the beasts of the forests and like a lion's whelp among the flocks of cattle, and there will be no one who can resist their strength. Then your hand, O God, or O Israel, will be exalted over the Assyrians, and all your foes and enemies who now possess you will perish. In that day, namely, when you have been freed from the nations, I will take away your horses and four-horse chariots which are in the midst of your cities. Not that Israel had horses and four-horse chariots then, but the horses and four-horse chariots of the Assyrians which move about in the midst of your cities; and I will destroy all your cities, and the strongholds which you dedicated to idols; and I will take away the magicians and soothsayers from your land, and I will make all your carved images and statues perish, and you shall no longer worship the works of your hands. I will also pluck up and overturn all your groves, and your cities which you had dedicated to idols. And when I have done this to you, and have been so appeased that whatever evil is in you is taken away, then also in my fury and indignation I will avenge you on all the nations which were unwilling to hear my word. Let carnal Israel answer at this place: does it say that these things have happened, or that they are to come? If it recalls them as done, let it produce the history, let it give the authority of the ancient books; let it show that all the nations and the Assyrian were once subject to Israel. But if, mocking itself with vain hope, it thinks that what is said is to come, when Christ comes, what idols will then be taken away from Israel which it does not now worship? What groves will be cut down which it does not have? What cities will be overthrown which were overthrown long ago? What soothsayers will be removed? Though it does not have them, nor boasts of having them, yet for so long a time the daughter of Zion has been abandoned, and sits without an altar and without priests, and while others eat their produce, they themselves, with dry throats, promise themselves a future which they do not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
