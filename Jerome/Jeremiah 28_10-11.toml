[[commentary]]
quote='''
And Hananiah the prophet took the chain — or the fork, which in Hebrew is called 'muthoth', — from the neck of Jeremiah the prophet and broke it. And Hananiah spoke in the sight of all the people, saying: Thus says the Lord: so will I break the yoke of Nebuchadnezzar, king of Babylon, in two years of days, from the neck of all the nations. And Jeremiah went on his way. The Seventy did not translate 'two years'; nor did they call Hananiah 'prophet', lest, that is, they should seem to call a prophet one who was not a prophet — as if many things in the holy Scriptures were not said according to the opinion of the time to which the events reported belong, and not according to what the truth of the matter held; thus Joseph too is called in the Gospel the 'father' of the Lord, and Mary herself, who knew that she had conceived of the Holy Spirit and had answered the angel: how will this be, since I have not known a man?, says to her son: son, why have you done so to us? behold, your father and I, sorrowing, were seeking you. And at the same time the prudence of Jeremiah, and his humility and patience, are to be considered. The false prophet does him injury by deed and, snatching the fork from his neck, breaks it — which he certainly could not have done with an iron one —; this man is silent and conceals his pain; for it had not yet been revealed to him by the Lord what he should say, so that holy Scripture might tacitly show that the prophets by no means speak by their own will alone, but also by the will of the Lord, above all concerning things to come, the knowledge of which belongs to God alone. He went, he says, and withdrew on his way, as though defeated, and fulfilling that prophetic word: I became as a man who does not hear and has no reproofs in his mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
