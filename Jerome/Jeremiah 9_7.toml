[[commentary]]
quote='''
Therefore thus says the Lord of hosts: Behold, I will melt — or I will test by fire — and try them; for what else shall I do in the face of the daughter of my people? Or for I will act in the face of the wickedness of the daughter of my people. Whenever we are subject to distresses, we receive evils from God and are tested by persecutions, so that whatever adulterated matter is in us may be smelted out by the heat of tribulations and miseries: for the silver of the Lord is tested by fire, proved in the earth, purified sevenfold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
