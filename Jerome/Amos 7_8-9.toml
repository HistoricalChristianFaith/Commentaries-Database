[[commentary]]
quote='''
The Lord therefore sets an adamant of this kind in the midst of his people Israel, and no longer passes him by, nor does he leave off, so that the altars, which deserve laughter and derision, are scattered, and he strikes with the sword and overthrows all the mysteries of the heretics and the house of Jeroboam, who first divided the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
