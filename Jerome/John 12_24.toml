[[commentary]]
quote='''
See what this fruit himself says. "Unless a grain of wheat falls into the earth and dies, it cannot bear much fruit." The earth has given its fruit, it has given the grain of wheat: which grain of wheat fell into the earth and died, and therefore brings forth much fruit. It was multiplied in the ear of corn: what had fallen as one thing, rose again with many. For the grain of wheat fell into the earth, and an abundant harvest sprang up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_006.html'
source_title="Homily 6, on Psalm 66"

[[commentary]]
quote='''
And he fills you with the fat of the wheat. Unless, he says, the grain of wheat shall fall, it alone shall be saved; but if it itself shall fall, it makes many to be saved. Our Lord, the grain of wheat, fell into the earth, and multiplied us. But this grain of wheat is very rich; it has marrow, it has fat, it has richness. And he fills you with the fat of the wheat. Happy is he who understands the fat in this wheat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_057.html'
source_title="Homily 57, on Psalm 147"
