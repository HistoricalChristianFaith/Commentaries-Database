[[commentary]]
quote='''
A kind and merciful Lord and Master does not envy His servants and disciples a share in His powers. As Himself had cured every sickness and disease, He imparted the same power to His Apostles. But there is a wide difference between having and imparting, between giving and receiving. Whatever He does He does with the power of a master, whatever they do it is with confession of their own weakness, as they speak, In the name of Jesus rise and walk. (Acts 3:6.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And having called together his twelve disciples, he gave them power over unclean spirits, to cast them out and to heal every sickness and every infirmity. The kind and merciful Lord and Master does not begrudge his servants and disciples his own mighty works, and just as he himself had healed every sickness and every infirmity, so he grants to his apostles too the power to heal every sickness and every infirmity. But there is a great difference between having and granting, between giving and receiving. Whatever he does, he does by the power of the Lord; they, if they do anything, confess their own weakness and the power of the Lord, saying: In the name of Jesus, rise and walk. Note, moreover, that it is in the twelfth place that the power of signs is granted to the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
