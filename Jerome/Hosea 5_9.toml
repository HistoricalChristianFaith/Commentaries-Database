[[commentary]]
quote='''
For this reason, then, I say and command: Blow the horn in Gibeah, and the trumpet in Ramah, and howl in Beth-aven, because the royal house of Ephraim, or Ephraim himself, that is, the dominion of Israel, will now be in desolation, and captivity is close at hand. In the day of the rebuke and punishment of the ten tribes of Israel I have shown my words to be faithful, the words I threatened through the prophets, so that what I had foretold in word I might prove in deed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
