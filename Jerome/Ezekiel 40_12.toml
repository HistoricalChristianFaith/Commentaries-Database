[[commentary]]
quote='''
And the cells, he says (or, as the Seventy put it, 'thau' or 'thee' — turning and changing the Hebrew names in each place as they pleased —), were of six cubits 'on either side', which is said as on this side and on that, and they by no means had the handbreadth, nor the reason added above, which might call our present way of life to the future blessedness, but only six cubits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
