[[commentary]]
quote='''
And lest you think that I am a prophet of evils only: now indeed the foretold captivity will come; but behold, in me speaks the word of God, which comes to all the prophets. When it is silent, the prophet does not speak; and now it says: I will come, and take a human body, I will be born of a virgin. Or thus: Because I came in the humility of the flesh and you did not believe me, I will come at the consummation of the world in my majesty with the angels and the other powers, and then I will gather all of you, Jacob; then I will bring together into one the remnant of Israel, and join them alike with the people of the Gentiles in my sheepfold; then I will hedge you about with a most firm wall, and so great will be the multitude of believers, and the tumult of the flock set among the folds, that the number of the cattle will be overcome by their abundance. And lest perhaps you think, because I said, I will set him like a flock in the sheepfold, and like cattle in the midst of the folds, that I am speaking of sheep, understand that these sheep are men. For there follows: They will be in tumult from the multitude of men. Tumult is the voice of very many, and the shout of an exceedingly great multitude uttered together, so that we may not suppose it to be the voice of one, but the common voice of all, praising the good shepherd, who has leveled every steep place and made it level with his own foot, so that he, the leader of their journey, is himself the door of paradise, and says, I am the gate; and as he divides the way and goes before, being both the way and the gate, the believing flock will pass through him. And this shepherd is king and Lord. Hence there follows: And their king will pass on before them, and the Lord at their head. But if we wish to take all these things of his first coming, and to refer the whole of Jacob and the remnant of Israel to the apostles and to that multitude from the Jews which was saved in the Acts of the Apostles, the expositor's explanation will not be far from the truth. For these the Lord truly gathered into his sheepfold, and set in the midst of the folds, and made a way before them, and led them into the Church, and he was their king before them, and is the Lord at their head forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
