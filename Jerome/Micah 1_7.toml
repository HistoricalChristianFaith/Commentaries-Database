[[commentary]]
quote='''
And all her carved images, and all the riches that various kings had brought together into her, will be cut to pieces and burned with fire and reduced to nothing. For the wealth and the manifold furnishings, which had been gathered, as was thought, from the fornication of idols, will be carried off to another harlot, that is, to Nineveh, so that, just as in their own land they committed fornication with the idols which they made, so they may go to another land of idols and of fornication, that is, to the Assyrians. Thus far concerning Samaria.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
