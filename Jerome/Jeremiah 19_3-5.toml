[[commentary]]
quote='''
Thus says the Lord of hosts, the God of Israel: Behold, I will bring affliction — or evils — upon this place, so that the ears of everyone who hears of it — or of them — shall tingle, because they have forsaken me and have made this place strange and have poured libations in it to strange gods, whom neither they nor their fathers nor the kings of Judah knew; and they have filled this place with the blood of the innocent and have built the high places of the Baals to burn their sons with fire as a burnt offering to the Baals, which I did not command — or think of — nor speak, nor did they come up into my heart. And some foolishly refer this place to the heavenly Jerusalem. So that I need not always give warning of this, let it suffice to have said this once: that an explanation of this kind, nay rather heresy, is to be avoided, which overturns what is plain and tries to bring certain conjuring tricks into the churches of Christ. But no one doubts that they set up the idol of Baal in the temple of God, or else in the shrine which was in the valley of the son of Hinnom, where there were both the grove of Baal and his altar, upon which they sacrificed and burned their sons. These things the Lord neither thought of nor spoke, nor did they come up into his heart; not that God was ignorant of things to come, but that he says he does not know what is unworthy of his knowledge, according to that word of the Gospel: Depart from me, workers of iniquity, I do not know you! For the Lord knows those who are his, and he who does not know shall not be known. Or certainly these things too, like others, are to be taken of God anthrōpopathōs [in human terms]. Now every heretic forsakes God and makes the place strange to God's habitation, the place which he has polluted by his deceit, and pours libations to strange gods, whom neither he himself nor his fathers knew, namely the apostles and apostolic men; and the kings of Judah, that is, the patriarchs of the heretics, fill the place that was once God's with the blood of the deceived and the innocent — for unless a man is foolish and simple, he is not quickly overturned — and they build the high places of the Baals when they claim to be disputing about sublime things, and they burn to the idol their sons, whom they have begotten in heresy. All of which the Lord says he does not know, and that it never came up into his thought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
