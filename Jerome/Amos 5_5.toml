[[commentary]]
quote='''
And do not seek Bethel, in which was the golden calf, and Gilgal, the place of idolatry, of which I have also said above: All their wickedness is in Gilgal. And you shall not pass over to Beersheba. Beautifully he says: you shall not pass over to Beersheba, that is, to the well of the oath, where the tribe of Judah, whenever it went astray, had been accustomed to worship idols. But Israel raged in the worship of images to such a degree that, by no means content with its own idols, it passed over to those of others. Finally, Gilgal, he says, shall be led captive, and Bethel shall be useless, or not subsisting at all, when the idols in it have been overthrown. But of Beersheba he was altogether silent, because when the ten tribes were conquered, the city by the name of Beersheba, which was in the tribe of Judah at that time, was neither taken nor destroyed. And at the same time it must be noticed that the LXX translators in the present place translated the name Beersheba, saying: The well of the oath, and in later passages they set down the name itself: Your God lives, O Dan, and the way of Beersheba lives. And they set down the way of Beersheba because from Israel they went by a long journey to the farthest borders of Judah, which were in Gerar and adjoined the Egyptian wilderness, in order to worship idols. It is, moreover, the place in which Abraham dwelt; and from the fact that he and Abimelech, after seven sheep had been given, swore to a mutual covenant, it was called the well of the oath, or the well of the seventh, because of the number of the seven sheep. For Sabe signifies both. And according to the laws of allegory he commands the house of Israel, that is, those who promise themselves the knowledge of God, not to seek Bethel, and not to enter into Gilgal, and not to pass over, or go up, to the well of the oath, but rather to seek God and live in him. And they seek Bethel, which is interpreted house of God, who say: The temple of the Lord, the temple of the Lord; and they trust in buildings, of which the Lord spoke to the disciples: Days will come in which there will not be left a stone upon a stone that will not be destroyed. And they enter into Gilgal who after the coming of Christ desire to be circumcised again. For in Gilgal the people was circumcised a second time. Hence the place itself also received its name, because the Lord took away from them the reproach of Egypt. And you shall not pass over, he says, to Beersheba, or to the well of the oath, lest you think those to be the borders of Judea which Scripture once, according to the letter, had promised, from Dan to Beersheba. Nor should you say any longer with the prophet: God is known in Judea, his name is great in Israel, but you should hear with the apostles: Their sound has gone out into all the earth, and their words to the ends of the world, because Gilgal also, that is, the circumcision of the flesh, will be led captive by the true circumcision of the heart. And Bethel, which you think the house of God, will not subsist, or, as I think better, returns useless, that is, auen, so that it is by no means called the house of God, but is called the useless house, or the house of the idol. Another interpretation: he seeks Bethel who follows only the letter that kills, and does not seek in the words the sense, which is God; and he enters into Gilgal who strives after greater revelations, promising himself the knowledge of things above; and he passes over, or goes up, to the well from which the Samaritan woman, desiring to draw waters that could not satisfy thirst, did not know him from whose belly proceed rivers of water springing up into eternal life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
