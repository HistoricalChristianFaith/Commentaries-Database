[[commentary]]
quote='''
Why do you strive to show your way good, to seek love? You who moreover have also taught your wickednesses, your ways, and on your wings — or in your hands — has been found the blood of the souls of the poor and innocent. Not in pits did I find them, but in all these or under every oak. 'In vain', he says, 'do you desire to defend yourself by the art of words and to show your works as good, so as to merit love, you who besides have also taught others your ways and been an example of evil works to all. And on your wings indeed — or in your hands — has been found the blood of the innocent, whom you sacrificed to idols, or whose souls you destroyed by the likeness of sacrifices'. 'The poor' we set down from the Hebrew; they are not found in the Seventy. 'But these,' he says, 'poor and innocent ones I did not find slain in pits' — which usually happens through the ambushes of robbers —, 'but in all the things which I have mentioned above, or under the oak' — which in Hebrew is called 'ella,' which indeed also signifies 'these', so that the sense is: 'in all these, or under the oak and terebinth' —, 'under whose shade and leaves, as in pleasant places, you enjoyed the crimes of idolatry'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
