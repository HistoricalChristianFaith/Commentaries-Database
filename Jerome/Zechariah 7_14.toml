[[commentary]]
quote='''
For which reason he also scattered them through all the kingdoms which they do not know, those of the Assyrians and Chaldeans, of the Medes and Persians, and of the other nations which lay subject to these empires and in whose lands they were sown abroad. And all Judea was deserted, because it had no inhabitant, and there was none in it passing through and returning. And the land which was a honeycomb above all lands, and for the greatness of its abundance flowed with milk and honey, they turned into a wilderness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
