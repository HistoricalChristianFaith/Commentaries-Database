[[commentary]]
quote='''
Jehoshaphat too had ships which he sent to Tarshish (1 Kgs 22:49), but they were broken at Ezion-geber. Solomon too had ships which went to Tarshish (1 Kgs 10:22) and returned after three years and brought the king silver and gold, ivory and apes. But because both kings had sinned, the one given to pleasure and a lover of women of foreign nations, the other joining himself with the king of Samaria, both of which things are referred to the pagans and the heretics, in whom there is nothing but the glitter of eloquence, and a sense built up by diabolical art, and dead speech, which is interpreted in the ivory teeth, and a likeness of human reason, which is perceived in the apes; therefore we read in the Psalms, With a violent wind you will shatter the ships of Tarshish (Ps 47 [48]:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
