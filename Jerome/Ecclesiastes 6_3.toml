[[commentary]]
quote='''
But as to what he says in the middle: And indeed he had no tomb; either this signifies that that rich man gives no thought to his own death, and, though he possesses everything, is miserly even in the building of a tomb; or that often, slain by plots on account of those very riches, he is cast away unburied; or, which I think better, that he has done no good deed by which he could win himself a memory among posterity, and not pass through life in silence like cattle, when he had the means by which it could be made plain that he had lived.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
