[[commentary]]
quote='''
Therefore the Lord will make them migrate beyond Damascus, so that they may not drink the blood of the Lord, but may pass over into Babylon and hear through the prophet: Babylon is a golden cup, making all the nations drunk. For Damascus, as we have often said, means drinking blood, or the blood of sackcloth, so that through repentance they may be called forth to drink the blood of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
