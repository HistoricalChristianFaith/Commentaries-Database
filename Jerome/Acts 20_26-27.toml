[[commentary]]
quote='''
Hence he says to them again: Wherefore I testify to you this day that I am clean from the blood of all. For I did not hold back from declaring to you the whole will of God. And in another place: How I held back nothing of what was profitable to you, but declared it, and taught publicly and from house to house (ibid., 20). He had read in Ezekiel (ibid., 26, 27) that the watchman who had not forewarned the people of the coming of the enemy would have the blood of the citizens required at his hands; and therefore he recalled that he had declared the whole will of God and all things that would be useful to them, so that he might be free of their blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
