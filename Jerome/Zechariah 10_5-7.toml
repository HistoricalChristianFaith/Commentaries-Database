[[commentary]]
quote='''
And the riders on horses shall be confounded.

And I will strengthen the house of Judah, and I will save the house of Joseph; and I will bring them back, because I will have mercy on them; and they shall be as they were when I had not cast them off, for I am the Lord their God, and I will hear them. And they shall be like the mighty men of Ephraim, and their heart shall rejoice as from wine; and their sons shall see and shall rejoice; and their heart shall exult in the Lord. LXX: And the riders on horses shall be confounded, and I will strengthen the house of Judah, and I will save the house of Joseph, and I will make them dwell, because I have loved them. And they shall be as when I had not cast them away, for I am the Lord their God, and I will hear them; and they shall be like the warriors of Ephraim, and their heart shall rejoice as in wine, and their sons shall see and shall rejoice, and their heart shall be glad in the Lord. These things too, in keeping with the sense above, they expound in two ways, so that either they say they have already been accomplished under the Maccabees, or they relate that they are to be accomplished under the Christ in the last age. And the sense is: when Judas has been made like a comely horse in battle, and has trodden down his adversaries like mire, and, with the Lord fighting beside him, has overcome, then all the cavalry of Greece will fall, and the house of Judah and the house of Israel — for he calls it the house of Joseph, that is, of the ten tribes — will be saved alike; and I will bring them back from the captivity in which they had been, and they shall be as they were at that time when I had not cast them off; for I am the Lord their God, who will hear them when they pray. And Ephraim, who are now held captive, shall afterwards be set free, and shall come to such joy that you would think them drenched with wine. Their sons also shall behold the triumphs of their fathers, and shall rejoice in the Lord, by whose gift they obtained the victory. Let us look for the history: when did Judah and Israel fight together against the Greeks, or at what time did Ephraim return from the Assyrian captivity, when, according to Ezekiel, the two staffs, that is, Judah and Ephraim, were joined to each other and coupled into one rod?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
