[[commentary]]
quote='''
Again, where in the Hebrew there is Benadad, and it is a single name, the Seventy translated the sons of Ader, deceived by the likeness of the letters res and daleth. In that place too where we said, from the house of pleasure, which in Hebrew is mebbeth eden, and all translated it likewise, the Seventy translated from the men of Charran, taking daleth, the middle letter of the name, for res, and, according to their custom, putting the Greek chi before ain, the first Hebrew letter. Cyrene also, which in Hebrew is called cira, they translated ἐπήκλητον, that is, called or named, because of the likeness of the word, since carae can be said for calling, and they understood the proper name as a common noun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
