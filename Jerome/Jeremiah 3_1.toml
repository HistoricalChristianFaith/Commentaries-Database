[[commentary]]
quote='''
It is commonly said — for which the Seventy translated only it is said — : if a man dismisses his wife, and she, departing from him, marries another man, will he return to her any more? Will she not be polluted and defiled, that woman — or that land — ? And you have committed fornication with many lovers or shepherds. For the word 'rehim', which is written with four letters, 'res, ain, ioth, mem', signifies both 'lovers' and 'shepherds'; and if we read 'rehim', it means 'lovers', if 'rohim', 'shepherds'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Yet return to me, says the Lord or and you used to return to me, says the Lord. In the Hebrew he even receives her as a penitent after her fornication and exhorts her to return to him; but in the Seventy he does not call her to repentance, but rebukes the shamelessness of the harlot, in that after adultery she dares to return to her husband. And as to what he says: and that woman will be defiled, for which in the Hebrew we read 'land', he leaves the example and speaks more plainly of the land of Israel, which is compared to an adulterous woman. Let us use this testimony against those who, abandoning faith in the Lord and entangled in the errors of the heretics, after many fornications and the deception of souls, pretend to return to the former truth, not in order to lay aside the poisons of their breast, but in order to instill them into others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
