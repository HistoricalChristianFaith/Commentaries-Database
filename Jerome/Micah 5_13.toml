[[commentary]]
quote='''
And I will destroy your carved images and your pillars from your midst. Our carved images are those which were made by the speakers, or which we fashion for ourselves. Hence it is commanded in the law that we should not make a carved image for ourselves, and that we should not set up pillars in our land; and you shall no longer worship the works of your hands. Unhappy human condition, full of folly and error! It knows from what sense its doctrines were composed, it is not ignorant that the idol was feigned by itself, and yet in place of God it worships the works of its own hands, and man bows down, so that, deceived, he may deceive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
