[[commentary]]
quote='''
I have expounded, as far as the narrow limits of my slender wit allowed, both the first captivity, by the Assyrians and Babylonians, and the second, by the Romans, because they crucified the Lord, and the third, the spiritual one, by which each one of us fell with Adam from paradise and lives in the captivity of this world; from which, when the Lord comes, he will raise up those who are crushed, and loose those in fetters, and lead back into his own possession those who were once the devil's captives, and the speech of the Psalmist will be fulfilled, who says: Ascending on high, he led captivity captive. According to this exposition, a fourth captivity can also be understood with regard to the Church, from which each one goes out through sin, and afterwards is led back into Jerusalem by Ezra, which means helper, that is, by the word of God. But if anyone, meditating on the law of the Lord day and night, has had greater zeal, greater talent, leisure and grace, and can say something more probable about the present section, I do not envy him, I do not scorn him; rather, I desire to learn from him what I do not know, and I will gladly profess myself his pupil, provided he teaches and does not disparage. For nothing is so easy as for a man at leisure and asleep to dispute about the labors and vigils of others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
