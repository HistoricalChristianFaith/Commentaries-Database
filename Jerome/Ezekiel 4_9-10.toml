[[commentary]]
quote='''
Now the prophet is commanded to show by deed the coming famine and want of the people of Israel: for just as in a scarcity of all things no one looks for varieties and delicacies of food, but for how the belly may be filled, so now the prophet puts wheat and barley, beans, lentils and millet and oats into one vessel, and makes three hundred and ninety loaves to eat one each day; and these loaves weigh twenty shekels each — that is, staters; and a shekel, that is, a stater, has four drachmas; and eight drachmas make a Latin ounce —, so that one loaf is said to weigh ten ounces, by which life is dragged out rather than sustained.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
