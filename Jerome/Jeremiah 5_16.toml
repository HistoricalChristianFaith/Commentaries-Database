[[commentary]]
quote='''
And what follows: its quiver is like an open sepulchre, which is not said in the edition of the Seventy, signifies the Babylonian armament. Nor is there any doubt that the kingdom of the Assyrians, the Babylonians, the Medes and the Persians is most skilled in archery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
