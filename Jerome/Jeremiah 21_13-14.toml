[[commentary]]
quote='''
Behold, I am against you, inhabitant of the solid and level valley, says the Lord, you who say: Who shall strike — or terrify — us, and who shall enter our houses? And I will visit upon you; and what follows: according to the fruit of your pursuits, says the Lord, is not found in the Seventy. And I will kindle, he says, a fire in its forest, and it shall devour everything round about it. For 'inhabitant of the solid and level valley' the Seventy translated: behold, I am against you who dwell in the level valley of Sor, for which Symmachus translated 'rock', Theodotion 'besieged', Aquila's first edition 'solid', the second 'Tyre'; for 'Sor' or 'Sur' in the Hebrew language means 'Tyre' and 'flint' and 'narrowed'. Now he speaks against Jerusalem, which was walled in by siege; or which, in the likeness of Tyre, is so surrounded by the Babylonian army, as by a great sea, that it cannot escape; or else which, like the hardest rock, thinks itself impregnable and strong because of the solidity and size of its walls, and says: 'who will be able to terrify us and who shall enter our houses?', whereas God, on the contrary, says: 'I will visit you; you will not be able to escape my eye. And I will visit you unto destruction and render to you the fruit of your wickedness, and I will kindle a fire in your forest: not the Babylonian, as you think, not the king of the Chaldeans, but my wrath will accomplish all these things.' And he calls Jerusalem and all the region around it a 'forest', because, having no fruit-bearing trees of good works, it has been made ready for burning. And fittingly he calls the 'valley' 'level', because it lies open to the enemies, and not a 'lofty mountain', which can be climbed only with difficulty; in accordance with which it is also said in Isaiah: the vision of the valley of Zion. Whatever is prophesied concerning the royal house and the mother city, let us refer to the ecclesiastical order and to the princes of the churches, those only, that is, who have given themselves over to pride and riches and wantonness. Nor will it be delivered from destruction at once simply because it is the royal house; just as among those who were of the stock of David very few were found who pleased the Lord, such as David himself, Hezekiah and Josiah, and a great part of the princes and of the royal stock provoked the wrath of the Lord against the whole people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
