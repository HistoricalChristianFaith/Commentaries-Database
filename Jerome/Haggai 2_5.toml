[[commentary]]
quote='''
Let it also do the word which the Lord covenanted with them when they were coming out of the land of Egypt. And would that we too may come out of Egypt, so that we may fulfil the word of the covenant which we have received. The Lord God also promises his spirit to those who do works in his house and fulfil the word they have received, saying: And my spirit will be in your midst. Behold the mystery of the Trinity: I am with you, and my Spirit, and the Word, in which I set the covenant when you came out of Egypt. But what he says, in your midst, is to be understood in the sense of what we read written in the Gospel: For he stands in your midst, whom you do not know, who will come after me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Haggai.html'
source_title="Commentary on Haggai"
