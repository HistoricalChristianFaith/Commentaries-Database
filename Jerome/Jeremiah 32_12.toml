[[commentary]]
quote='''
And I gave the book of possession to Baruch, the son of Neriah, the son of Maaseiah, in the eyes of Hanamel, my cousin, and in the eyes of the witnesses who were written in the book of purchase, in the eyes of all the Jews who were sitting in the court of the prison. Although the possession was at once to be abandoned — nay rather, it was being bought for posterity, and bought by one who had no sons, for he had not taken a wife —, yet, obedient to the command of the Lord, he performs everything duly and gives the sealed book of possession to Baruch, the son of Neriah, the son of Maaseiah. 'Baruch' in our language is called 'blessed'; he was the son of 'Neri', which means 'my lamp', as the prophet says: your word is a lamp to my feet and a burning light to my paths; and Neriah, Baruch's father, was in turn the son of 'Maasiae', that is, of 'making' and of 'the work of the Lord'. Let us notice, then, with what great privileges of virtue the disciple Baruch ministered to Jeremiah, as David says: he who walked in the undefiled way, he ministered to me. Hence also Elisha, the minister of Elijah, so pleased God that after the translation of his master he merited to receive even a double spirit. I say this for the admonition of those who use the ministry of wicked men and do not dare to cast off those whom they know to be bound to them by the glue of a bad conscience. And the book is handed to Baruch, a man so great and of such quality, in the sight of Hanamel, who had sold, and of the witnesses, who had signed and whose names were contained in the volume of the purchase, and in the presence, he says, of all the Jews who were sitting in the court of the prison, who, that is, had either come to console the prophet or, out of zeal for the fear of God, desired to hear the words of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
