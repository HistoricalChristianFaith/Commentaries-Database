[[commentary]]
quote='''
Do not rejoice, Israel, do not exult like the peoples, for you have played the harlot away from your God; you have loved a payment upon all the threshing floors of wheat. The threshing floor and the winepress will not feed them, and the wine will deceive them. LXX: Do not be glad, Israel, and do not rejoice like the peoples, for you have played the harlot away from your God; you have loved gifts upon every threshing floor of wheat. The threshing floor and the winepress did not know them, and the wine has deceived them. Those who have departed from God, when they have come into the depth of sins and have despaired of their salvation, will despise everything. Finally Israel too, departing from the law of God and worshiping idols, says that he is one nation out of many nations, rejoicing and congratulating himself that he has departed from the knowledge of God and is a nation mingled with the rest; and therefore he now rebukes them and says: Do not be glad, do not rejoice, and do not think that you are such as the other nations are. For one who does not know God is punished in one way, one who departs from God in another, because the servant who knows the will of his master and does not do it will be beaten with many stripes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
