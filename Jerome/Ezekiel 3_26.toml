[[commentary]]
quote='''
But as for the prophet's tongue cleaving to his palate or throat, and his being made dumb and not having the authority of one who rebukes, the cause is plain: Because it is, he says, a provoking house; and the sense is: So great are their bitternesses and so great their contentions against God that they do not deserve to hear one who rebukes them. From this it is plain that, where there is a multitude of sins, the sinners are unworthy to be corrected by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
