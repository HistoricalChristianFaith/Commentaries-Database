[[commentary]]
quote='''
Learn to do well. Virtue, then, must be learned, and the good of nature alone does not suffice for righteousness unless one is trained by fitting disciplines (1 Pet 2:11). Jesus the son of Sirach too says something of the kind: You have desired wisdom: keep the commandments, and the Lord will give it to you. And in what follows the same Isaiah recalls: Everyone who has not learned righteousness on earth will not do truth (Isa 26:10 LXX). Righteousness, then, must be learned, and the thresholds of the masters of wisdom must be worn down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
