[[commentary]]
quote='''
Because of this humility, while he is the least of all the saints, this grace was given to him among the Gentiles, that he should preach the unsearchable riches of Christ, and teach the dispensation of the mystery hidden from the ages in God, who created all things. If the riches of Christ are unsearchable, how are they preached among the people? If the mystery was hidden from the ages in God, on what principle is it brought forth through Paul to the Gentiles? But "unsearchable" and "hidden" must be understood in two ways: either that the riches were unsearchable before, and now, after the Lord's passion, have been opened; or else that the things which by their nature were unsearchable to man have become known by God's revealing them. For it is one thing to reach a secret by one's own curiosity, which, once it has been found, ceases to be unsearchable; another thing to be wholly unable to grasp it by one's own diligence, but to know it through the grace of God; and this, when you have come to know it and have shown it to others as well, nonetheless remains unsearchable, since for you, as far as lay in you, it was hidden before it was shown. The Psalmist too, speaking to Christ himself, testifies that the riches of Christ are unsearchable, saying: How infinite the multitude of your goodness, which you have hidden for those who fear you (Ps. 30:20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
