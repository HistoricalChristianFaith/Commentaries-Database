[[commentary]]
quote='''
As they disbelieved the resurrection of the body, and supposed that the soul perished with the body, they accordingly invent a fable to display the fondness of the belief of a resurrection. Thus they put forward a base fiction to overthrow the verity of the resurrection.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they questioned him, saying: Teacher, Moses said: If anyone dies not having a son, his brother is to marry his wife and raise up seed for his brother. Now there were among us seven brothers, and the first, having married a wife, died, and the rest. Those who did not believe in the resurrection of bodies, and thought that the soul perished together with the bodies, aptly invent a fable of this kind, to convict of madness those who assert the resurrection of the dead. But it may be that this really happened at some time among their people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
