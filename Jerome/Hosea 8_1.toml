[[commentary]]
quote='''
Let there be a trumpet in your throat, like an eagle over the house of the Lord; because they have transgressed my covenant and violated my law. They called upon me: My God, we know you, Israel. Israel has cast away the good; the enemy will pursue him. They have reigned, and not from me: they have been princes, and I did not know it. Of their silver and gold they have made idols for themselves, that they might perish. LXX: In their bosom like earth, like an eagle over the house of the Lord, because they have transgressed my testament and acted impiously against my law. They called upon me: God, we know you; because Israel has turned away from good things. They pursued the enemy, they reigned for themselves and not through me; they have been princes, and they did not make it known to me; of their silver and their gold they have made idols for themselves, that they might utterly perish. What we have translated: let there be a trumpet in your throat, for which in the Hebrew is written alechcha sophar, Aquila and Symmachus and Theodotion translated likewise. The Seventy alone said: in their bosom like earth, and what this means is uncertain. For some think that bosom is taken in two ways: both as the lower part of a garment, from the genitals to the feet; and as the colpus of the sea, that is, a gulf, for example of the Adriatic and the Ionian and the Propontis; and that the false teachers, who followed the blasphemy of Egypt, keep in their bosom all things that serve lust, and earthly things; or at least that in the harbor and refuge of their voyage they acquire no precious merchandise, but earthly things. But let us, following the Hebrew truth, weave on the sequence of the explanation we began. The prophet is commanded, and it is said to him: Let there be a trumpet in your throat, that is, raise your voice so that it is like a trumpet, that very many may hear, because very many have sinned. And when you have raised your voice, say this with a shout: like an eagle over the house of the Lord; and the sense is: Nebuchadnezzar will come with all his army so swiftly, so quickly, that he will imitate the flight of an eagle hastening to its prey; and he will come not to some other place but to Jerusalem, in which the temple of God stands, to destroy and overturn it. Of this eagle Ezekiel too speaks more fully: of great wings and feathers and talons, which has the course for entering into Lebanon, that is, into the temple of God, according to the prophet Zechariah, in whom it is written: Open your gates, Lebanon, and let fire devour your cedars. But this, O prophet, which I say and command you: Let there be a trumpet in your throat, so that you may cry aloud and say, like an eagle over the house of the Lord, that the king of the Chaldeans is coming, I command for no other reason than that they have transgressed my covenant and abandoned my ceremonies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
