[[commentary]]
quote='''
Jeremiah, of whom we made mention above, agrees in almost the same words, saying: Behold, I have given you small among the nations: contemptible among men; your arrogance has deceived you, and the pride of your heart, you who dwell in the caverns of the rock and strive to lay hold of the height of the hill; when you have exalted your nest like the eagle, from there I will drag you down, says the Lord. In prophetic interpretation we ought to follow our custom, so as first to lay the foundations of history, then, if we can, to raise up lofty towers and the tops of roofs. O Edom, he says, though you are the least among all the nations round about, and small in number in comparison with the other peoples, you are lifted up by pride beyond your strength. And though you dwell in grottoes, nay rather in the caverns of the rocks, lowly and poor, and not possessing the lofty roofs of buildings, you are borne up on high like an eagle, and you swell so much in thought that you believe you dwell among the stars; even if, beyond nature, you could penetrate the heights of heaven, from there I would drag you down and bring you down to the earth, says the Lord God. But that which is added in Jeremiah, And you strive to lay hold of the height of the hill, has opened the riddle, signifying by the hill Mount Zion; and by this he means to be understood either the city of Jerusalem itself or the temple which was founded in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
