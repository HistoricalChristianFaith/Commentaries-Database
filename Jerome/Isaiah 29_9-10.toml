[[commentary]]
quote='''
Be stupefied and wonder: waver and stagger, be drunk, and not with wine; reel, and not with drunkenness. For the Lord has mingled for you a spirit of deep sleep: he will close your eyes; your prophets and your princes, who see visions, he will cover. And the vision of all shall be to you like the words of a sealed book, which, when they give it to one who knows letters, they will say: Read this, and he will answer: I cannot, for it is sealed. And the book shall be given to one who does not know letters, and it shall be said to him: Read; and he will answer: I do not know letters. For spirit of deep sleep the Seventy translated compunction; Theodotion ecstasy of mind; Aquila καταφορὰν, that is, heavy sleep; which in Hebrew is called THARDEMA (תרדמה), and which Scripture records was sent by God upon Adam (Gen 2), when the woman was made from the rib of his side. And Jonah snored in this same sleep in the ship (Jonah 1). And the whole prophecy after the overthrow of Jerusalem and the temple, that is, of Ariel, is against the scribes and Pharisees, who, having the key of knowledge, neither enter themselves nor allow others who wish to enter. And they are commanded to be made drunk with stupor and wonder, or rather, according to the Septuagint, with the dissolution of the whole body and ecstasy of mind, and to reel and waver: staggering not with wine nor strong drink, but with the spirit of deep sleep, or of the Lord's compunction, so that, understanding their evil, they may at some time do penance and say with the prophet: I was turned in my weakness, while the thorn is fastened in me (Ps 31 [32]:4). Know, then, O scribes and Pharisees, who are the princes of the Jews, that the Lord is repaying you in kind. For when you heard the Lord the Savior, you would not understand, and you closed your eyes lest you should see him, and made your ears heavy lest you should hear. Therefore he too will close your eyes, which are the prophets, through whom you used to see the knowledge of God. Or he will close your eyes and those of the prophets, who are your princes. For the Law and the prophets were until John the Baptist (Luke 16): so that while you do not see, those may see of whom the later passage (cf. v. 18) testifies: And in that day the deaf shall hear the words of the book, and the eyes of the blind shall see and exult. For the Lord came for judgment, that the Jews who see might not see, and that those who were blind, namely the people of the nations, might see and contemplate the Lord (John 9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
