[[commentary]]
quote='''
Go and cry — or read — these words toward the north, and you shall say: Return, averse Israel, says the Lord, and I will not turn away — or I will fix — my face from you — or upon you —, for holy — or merciful — am I, says the Lord, and I will not be angry forever. Yet know your iniquity, that you have transgressed against the Lord God — or you have acted impiously — and you have scattered — or poured out — your ways to strangers under every leafy tree, and you have not heard my voice, says the Lord. The Hebrew word 'carath' is understood both as 'call' or 'cry' and as 'read'; hence Aquila and Symmachus translated 'keep crying', the Seventy and Theodotion 'read'. Now the word is directed to the north and against Babylon and the Assyrians, to the ten and to the two tribes, and their return is proclaimed. 'And I will not turn away', he says, 'my face from you, or I will not fix my face against you, so that I may receive you not with the severity of a judge but with a countenance of mercy. For I am holy and merciful, so as no longer to recall your iniquity nor to remember that you withdrew from the Lord and that in his place idols delighted you, and that you committed fornication under every shady and leafy tree'. This indeed may fittingly be said also to the heretics, or to those who are negligent in the Church, who are daily called to repentance by men of the Church, and to whom this can properly be applied: 'and you have not heard my voice.' And every heretic dwells in the north and has lost the warmth of faith, and cannot hear that word of the Apostle: fervent in spirit; and because he has given himself over to pleasures, he has withdrawn from the Lord and scattered his ways among alien doctrines and followed pleasure. For no heresy is built except for the sake of the gullet and the belly, in order to seduce silly women laden with sins, always learning and never arriving at the knowledge of the truth, of whom it is truly said: who devour my people like food of bread, and whom Christ marks as devouring the houses of widows. 'And when,' he says, 'I have had mercy on you, do not think that you are righteous, but always remember your iniquity and know that you have committed fornication against the Lord, and bow down the neck of pride, so that you who offended through arrogance may appease God through humility'. But to that which we said above, and I will not fix my face upon you, that prophetic word is fitting: turn away your face from my sins and blot out all my iniquities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
