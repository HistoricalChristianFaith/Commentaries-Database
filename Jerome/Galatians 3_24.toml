[[commentary]]
quote='''
Therefore the Law was our pedagogue in Christ, that we might be justified by faith. But when faith came, we are no longer under a pedagogue. For you are all sons of God through faith, which is in Christ Jesus.

A pedagogue is assigned to little children, so that a wanton age may be reined in and hearts prone to vices may be held in check, while tender infancy is trained in studies and, restrained by fear of punishment, is prepared for the greater disciplines of philosophy and of governing the commonwealth. Yet the pedagogue is not the master and father, nor does the one who is being trained expect the inheritance and the knowledge of the pedagogue; rather, the pedagogue guards another man's son, and is to withdraw from him once he has arrived at the lawful time for taking up the inheritance. Indeed, the very name of pedagogue signifies this, and it is compounded from the fact that he leads (agat) boys, that is, conducts them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
