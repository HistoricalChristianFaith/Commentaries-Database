[[commentary]]
quote='''
To God himself, therefore, be glory: first in the Church, which is pure, having no spot or wrinkle, and which can receive the glory of God for this reason, that it is the body of Christ. Then in Christ Jesus, because in the body of the man he assumed, whose members are all the believers, the whole divinity dwells bodily. And this glory is not extended only through the present time and ended in the ages to come, but continues, grows and increases unto all generations, and the age of ages, in ineffable eternity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
