[[commentary]]
quote='''
The Gentiles, then, are fellow heirs with Israel, or, as we think better, they are fellow heirs with Christ, so that God is our inheritance, and we are fellow heirs of Christ. This is also written in another place: Heirs of God, and fellow heirs of Christ (Rom. 8:17). Not that some possession is divided among us; but that the Lord himself is our inheritance and possession. The Lord, he says, is your inheritance (Deut. 18:2); and elsewhere: The Lord is my portion and my inheritance (Ps. 15:5).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
