[[commentary]]
quote='''
They said: We will not hear, and when invited to the supper they would not come; therefore it is said: Hear, O nations! This the apostles too followed when they speak in Lycaonia: It was necessary that the word of God be spoken first to you; but since you thrust it away and judge yourselves unworthy of eternal life, behold, we turn to the Gentiles. And know, O congregation: by no means the Jewish one, but that of all nations; or, you who pasture flocks: the bishops and presbyters and the whole order of the Church; or, know the testimony that is in them; for the testimony of God is faithful, giving wisdom to little ones. To them the Lord also speaks: Fear not, little flock, and: Behold, I and my children, whom God has given me. 'Know, therefore, how great things I will do to the people that does not believe.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
