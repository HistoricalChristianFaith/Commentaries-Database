[[commentary]]
quote='''
Properly, however, the word is addressed to the royal house, chiefly on account of whose guilt the city is besieged, so that it may amend its error by repentance and obtain the mercy of the Lord. 'Judge', he says, 'judgment in the morning' — not in the darkness of iniquity, but in the light of righteousness — 'and rescue the one oppressed by violence from the hand of the false accuser, so that you do not respect persons in judgment, but, when the rich oppress the poor, the command of God may prevail more with you than the power of the persecutor! And if', he says, 'you do this, the fire of my fury will by no means be kindled among you, nor will it find material to consume.' And in this place an incredible mercy of God is shown: those of whom he had said above: for I have set my face against this city for evil and not for good; into the hand of the king of Babylon it shall be handed over, and fire shall burn it, he now, while the Lord's sentence is already bearing down upon them, calls to salvation; not that he does not know that the city of Jerusalem is to be captured, but so that free will may be preserved for man, and they may be seen to perish not through ignorance of the future but by their own will; just as the Savior too knew that the people would deny him and that he was to be crucified, inasmuch as he had often foretold this to the apostles, and nevertheless he admonished them, wishing to correct them toward repentance, so that whatever they afterward suffered befell them by their own fault, not by the harshness of the one who threatened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
