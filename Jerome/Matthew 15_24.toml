[[commentary]]
quote='''
He says that He is not sent to the Gentiles, but that He is sent first to Israel, so that when they would not receive the Gospel, the passing over to the Gentiles might have just cause.

And He adds of the house of Israel, with this design, that we might rightly interpret by this place that other parable concerning the stray sheep.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
I was not sent except to the lost sheep of the house of Israel. Not that he was not sent to the Gentiles too, but that he was sent first to Israel, so that, when they did not receive the Gospel, the passing over to the Gentiles might be just. And he said pointedly: to the lost sheep of the house of Israel, so that from this place we may also understand the one straying sheep of the other parable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
