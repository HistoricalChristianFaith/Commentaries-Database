[[commentary]]
quote='''
Then he adds: 'if you make your ways straight, and your thought does not go off after error, and you follow righteousness and do not commit evil, and do not shed innocent blood by scandalizing every simple person, and do not walk after strange gods by worshipping perverse doctrines which you have feigned out of your own heart to your own harm, then either I will dwell with you in this place, which you call the temple of God, and in the land which I gave to your fathers, namely the apostles and apostolic men, or at any rate with a firm standing I will make you dwell from the beginning to the end.' This can also suit those virgins who boast of their chastity and display purity with a shameless face, while their conscience holds something else, and who do not know that definition of virginity given by the Apostle, that she be holy in body and in spirit. For what does purity of body profit when the mind has been debauched, if she does not have the other virtues which the prophetic word has described?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
