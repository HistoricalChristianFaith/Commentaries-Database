[[commentary]]
quote='''
Let each one guard himself from his neighbor, and let him not have confidence in any brother of his, for every brother supplants with supplanting, and every friend walks deceitfully, and a man will mock his brother, and they will not speak the truth; for their tongue has learned to speak falsehood — or for they have taught their tongue to speak falsehood —. They have labored to act wickedly — or they have acted wickedly and have not ceased, so as to be converted —. Your dwelling is in the midst of deceit; in deceit — or usury upon usury and deceit in deceit; — they have refused — or they would not — to know me, says the Lord. This passage is to be used in a time of persecution and distress, when faith is either rare or none, when neither brother nor neighbor is to be trusted and his enemies are those of his household, when, according to the Gospel, the father will hand over the son and the son the father, and two are divided against three and three against two.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
