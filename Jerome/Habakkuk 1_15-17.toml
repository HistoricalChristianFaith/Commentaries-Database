[[commentary]]
quote='''
He lifted up the whole with a hook, he dragged it in his dragnet, and gathered it into his net; over this he will rejoice and exult. Therefore he will sacrifice to his dragnet, and offer sacrifice to his net; because through them his portion has been made fat, and his food choice. For this reason, therefore, he spreads out his dragnet, and never ceases always to slay the nations. LXX: He lifted up the consummation with a hook, and drew it in his net, and gathered it in his dragnets. For this reason he will rejoice and be glad; therefore he will sacrifice to his dragnet, and burn incense to his net, because through them he has made his portion fat, and his foods are choice. Therefore he spreads out his net, and never ceases always to slay the nations. Because above he had named fish, saying: And you will make men like the fish of the sea, and like a creeping thing, which is said more expressively in the Hebrew remes, that is, κινούμενον, namely everything that can be moved, for that reason he keeps the μεταφοράν (metaphor) of fish in the rest, so that, as a fisherman casts a hook, and a net and a dragnet, so that what the hook could not, the net may catch, and what has escaped the net may be surrounded by the wider dragnets, so too the king of Babylon laid waste all things and made the whole race of men his prey. Moreover, what he says: He will rejoice and be glad, and will sacrifice to his dragnet, and offer sacrifice to his net, signifies the idol which he made in the plain of Dura and the image of Bel, to which, as to a great dragnet, he sacrificed the fattest victims, compelling all the nations he had conquered to its worship. For believing that through them, that is, through his idols, he had been made fat, and had his portion, that is, all riches, he subjugated to his rule even all the princes and kings, as great fish, whom he calls choice foods. And because he has once been sated with a most abundant catch, and has filled his dragnet, that is, his army, therefore he never ceases to slay the nations, that is, always to fight and to butcher. Moreover, according to the Seventy, the wicked devil — who oppresses the just, and holds men as the fish of the sea, and lays all things waste as creeping things that have no leader — sent his hook, opposed to that hook by which, through the apostle Peter, the first fish was caught, in whose mouth a stater was found. And Adam stuck to his hook, and he drew him out of paradise with his net, and covered him with his dragnets, with various and manifold snares and deceits. Therefore he will rejoice, and he will think his traps to be more than the command of the Lord. And he will sacrifice not to the hook — which is understood as perverse speech, and set still at the beginning —, but to his net, because in it he caught the fattest victims. And: Through one man very many were made sinners; and in Adam we all died, and all the saints afterwards were cast out of paradise together with him. Hence also his foods are choice, as according to the psalmist: That he may seek his food from God, wishing to overthrow the prophets and apostles. And because he first deceived man, he never ceases daily to slay the whole human race. But it can also be taken of the perverse and manifold doctrine of the heretics, that they too, with their hook, and their net, and their dragnets, catch very many fish and seize many creeping things, and for that reason rejoice, and adore as God their speech, by which they have been able to deceive and persuade, and worship it, and polish it; they serve it with every art, that speech through which they know that so many victims have been slain by them, and so many of the mighty and of the saints have been deceived, whom Scripture now names the fat portion and the choice foods. Therefore, in the likeness of beasts, which, once they have tasted blood, always thirst for it, they spread out their net, and this is all their zeal, to kill not a few, as at the beginning, but more. He has no doubt about the slaughter of many nations who has seen so great a multitude of heresies and perverse doctrines caught by the hook, the net and the dragnets of the devil; and yet the end of their capture is destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
