[[commentary]]
quote='''
But the prudent one in mystic speech (Jer 14), or the whisperer, and, as Theodotion would have it, the enchanter, seems to me to be a man learned and practiced both in the Law and the Prophets and in the Gospel and the Apostles, who can heal each disturbance of the soul by his teaching and bring it back to a settled state of mind: while the fornicator recovers chastity, and the glutton frugality, and the man once greedy gives alms. Sift through all the synagogues of the Jews, and you will be able to find no teacher who enjoins holy things and, despising riches, teaches that poverty is to be pursued. Of such enchanters against serpents and asps, that is, against sinners who have abandoned the righteousness of God, David spoke in the Psalm: Sinners have been estranged from the womb; they have gone astray from the belly, they have spoken falsehoods. Their fury is after the likeness of a serpent: like the deaf asp that stops its ears, which will not hear the voice of the enchanters, nor of the sorcerer who charms wisely (Ps 57 [58]:4ff.). Every word of the Apostle is an enchantment against serpents and asps, which sinners and heretics do not hear, because they shut their ears so as not to hear the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
