[[commentary]]
quote='''
With weeping they shall come — or they shall go out — and in mercy I will lead them back, and I will bring them through torrents of waters in a straight way, and they shall not stumble — or they shall not go astray — in it, for I have become a father to Israel, and Ephraim is my firstborn. If we read according to the Hebrew: with weeping they shall come — for this is what 'iabu' indicates —, we shall say that sometimes weeping is also a sign of excessive joy, according to that saying: I weep for joy. But if according to the Seventy, who said: with weeping they shall go out and in mercy — or in consolation — I will lead them back, we shall set down that sense which is also spoken in the Psalms: going they went and wept, carrying their seeds; but coming they shall come with exultation, carrying their sheaves. For they wept when they were led away captive, and they received the greatest consolation when they were led back by the mercy of the Lord. And the Lord brought them, through the apostles and apostolic men, full of waters and of a most abundant river, in a straight way, namely that of faith, not in the faithlessness of the Jews. And they shall not, he says, stumble in it, because they have ceased to be blind, to whom it was once said: if you were blind, you would not have sin; but now you say, We see; your sin remains. We can also understand the 'straight way' as Christ, in whom whoever walks will not stumble. I have become, he says, a father to Israel, who has been led back, and Ephraim is my firstborn; for where once sin abounded, grace abounded the more. And Scripture testifies that Ephraim is in the type of the people gathered from the nations. For he was the younger son of Joseph and stole away the birthright of Manasseh, who by nature was the firstborn; but in the mystery of the cross, the hands being crossed, he who stood at Jacob's left received the blessing of his right hand, and he who had stood at the right, blessed with the left, was reduced to the second rank. And as Jacob from Esau, so Ephraim snatched the birthright from Manasseh, and the whole people of the ten tribes was called Ephraim, because Jeroboam son of Nebat, from this tribe, was the first to obtain the kingdom in Samaria.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
