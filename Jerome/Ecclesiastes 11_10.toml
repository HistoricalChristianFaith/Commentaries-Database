[[commentary]]
quote='''
And drive anger from your heart and put away malice from your flesh, for youth and folly are vanity. In anger he includes all the perturbations of the mind; by the malice of the flesh he signifies all the pleasures of the body. Enjoy, therefore, he says, the goods of this world in such a way that you do not sin either by desire or by the flesh. Leave the old vices by which in your youth you served vanity and folly, for youth is coupled with foolishness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
