[[commentary]]
quote='''
They also clap with their hands to the voice and sound of the instruments, so that all their works look for pleasure, and they do nothing except what they provide for the belly and for lust. Nor let the prudent reader at once object to us this, and how it is written: Let the rivers clap with their hands, and: All nations, clap your hands, and: Shout for joy to God our helper. For there they are said to clap not to the sound of instruments, but to have one accord in the praise of God. After the voice of the instruments he added: They thought them as things standing, and not as things fleeing. For the things of the world and all bodies, according to Epicurus, flow and pass away moment by moment, and nothing stands firm in its own state, but all things either grow or decrease, and, in the manner of the waters of torrents, slide headlong. Hence we also read in secular literature: "But meanwhile time flies, flies beyond recall." And in another place: "Alas, Postumus, Postumus, the fleeting years slip by." For nothing is more fleeting than the world and the things of the world. While we hold them we lose them, and through infancy, boyhood, youth, and manhood, and the age that grows heavy, and ripe age, and the last years of old age, the seven stages into which Philo divides human life, we are changed, and we run, and unawares we arrive at the boundaries of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
This most beautiful sense, in which it is said: They thought them as things standing, and not as things fleeing, is not found in the Hebrew, but in its place is written: Like David they thought they had instruments of song. Hence it seems to me to have been added by the translators, who in the description of luxury brought forth a maxim of this kind against vices and pleasures, so that they did not translate what was written, but added from their own what seemed good to them, or rather changed it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
