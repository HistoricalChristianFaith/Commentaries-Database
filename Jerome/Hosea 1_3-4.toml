[[commentary]]
quote='''
And he went and took Gomer daughter of Diblaim; and she conceived and bore him a son. And the Lord said to him: Call his name Jezreel, for yet a little while and I will visit the blood of Jezreel upon the house of Jehu; and I will cause the kingdom of the house of Israel to cease. LXX: And he went, and took Gomer daughter of Diblaim; and she conceived and bore a son. And the Lord said to him: Call his name Jezreel, because yet a little while and I will avenge the blood of Jezreel upon the house of Judah; and I will cause the kingdom of the house of Israel to cease. The prophets make their promises about the coming of Christ and the calling of the Gentiles many ages later in such a way as not to neglect the present time, lest they seem not to teach an assembly called together for another purpose about the things that are at hand, but to trifle about things uncertain and future. And so this Gomer too, daughter of Diblaim, who is taken as wife by Hosea, and conceives by him, and bears him a son named Jezreel, which is interpreted seed of God, in vengeance for whose blood he overturns the kingdom of Jehu (or, as an error has wrongly prevailed, of Judah), is to be referred to the calling of the nations in such a way as to fit that time in which she is recorded to have borne a son. And not to keep the reader's eagerness waiting with a long treatment: these two women, of whom one is called Gomer and is a harlot, and bears three children, first Jezreel, second, a girl, who is called: Without Mercy, and third a male, who is himself also called: Not My People; and the other woman, who is hired for fifteen pieces of silver, and a cor, and half a cor of barley, and is called an adulteress, are referred to Israel and to Judah, that is, to the ten tribes which were in Samaria under king Jeroboam, who was of Ephraim, and to Judah, which reigned in Jerusalem from the stock of David. These are the two women who in Zechariah are said to have the wings of a hoopoe, or of a kite, or of a heron, and to go into the land of Shinar, where Babylon was founded. These women Oholah and Oholibah signify under the name of two sisters; these are shown in the two rods which Ezekiel joins into one rod. And because we are writing commentaries, not broad volumes, reserving for each section its own explanation in its place, let us now discuss only the present section.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
