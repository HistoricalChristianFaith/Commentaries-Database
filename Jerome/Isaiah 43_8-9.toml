[[commentary]]
quote='''
And what follows, Bring forth the people that is blind and has eyes, that is deaf and has ears, many think is said of the people of the nations, who through the teaching of the Apostles began to hear and to see. But let us understand this too of scattered Israel, which was called through the Apostles and believed first; to whom Paul also says: It was necessary that the word of God be preached first to you (Acts 13:46). And the Lord himself in the Gospel: Go to the lost sheep of the house of Israel (Matt 10:6). Then follows: All the nations are gathered together, and the tribes are assembled, that is, together with the people that believed from among the Jews, so that the calling may be twofold, of the circumcision and of the uncircumcision. And what is said, Bring forth, is a word addressed to the Son. Or, according to the Seventy, the Father speaks of the Son, that he has brought forth his blind and deaf people, and joined them to the nations, and made of them many princes of the Church. And the prophet marvels that no one among the nations could foreknow these things, nor know the counsels of God, but only his people, which had received the Law and had the prophets: For God is known in Judea; in Israel his name is great (Ps 75 [76]:1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
