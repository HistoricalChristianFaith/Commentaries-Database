[[commentary]]
quote='''
And for this reason he pronounced anathema both on himself, whom they accused of doing one thing in Judea and teaching another among the Gentiles, and on an angel, who was admittedly greater even than the apostles who preceded him: so that the authority of Peter and John might not be thought great, since neither he himself, who had taught them before, nor an angel was permitted to preach otherwise than they had once learned. So he named himself and the angel expressly, but the others without a name: If anyone, he says, has preached the gospel to you, so that by a general term he might do no injury to his predecessors, and yet might covertly point to their names.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
