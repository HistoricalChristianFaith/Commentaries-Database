[[commentary]]
quote='''
Finally it is said to the Scribes and to the Pharisees: You are those who justify yourselves before men: but God knows your hearts (Luke 16:15). In this it is to be considered that he did not say Father, according to the blasphemies of the heretics, lest he should seem to exclude the Son, but God, which is common to the Father and the Son. In the beginning indeed was the Word, and the Word was with God, and the Word was God: he was in the beginning with God (John 1:1, 2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
