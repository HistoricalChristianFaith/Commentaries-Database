[[commentary]]
quote='''
But Sodom your sister was not heard in your mouth in the day of your pride, before your wickedness was uncovered, as at this time, to the reproach of the daughters of Syria, and of all the Palestinian daughters round about you, who surround you on every side. Your crime and your disgrace you have borne, says the Lord God. (LXX: "If Sodom your sister had not been for hearing in your mouth in the days of your pride, before your wickednesses were uncovered, as now is the case with the daughters of Syria, and if this had not been, what would have been done to you, and to all round about you, the daughters of the foreigners who surround you on every side? Your impieties and your iniquities, you, bear them.") Symmachus translated this passage thus: Because Sodom your sister was not in hearing through your mouth in the day of your pride, before your disgrace was uncovered, as in the time of the reproach of the daughters of Syria, and of all the Palestinian daughters who are round about you, who surround you on every side. Your crime and your wickedness you will bear; Theodotion in this way: And Sodom your sister was not in the hearing of your mouth in the day of your pride, before your wickedness was uncovered, as the time of the reproach of the daughters of Syria, and of all the daughters of the foreigners round about her, who abhor you on every side. Your fornication and your abominations you have borne, says Adonai the Lord; our translation agrees with the edition of Aquila. All these I have set down so that from the comparison of them all we may be able to find a trace of some sense; and meanwhile, without prejudice to others, the order of the reading seems to us to be rendered thus: 'In the days of your pride, when you were sinning, you did not remember the overthrow of Sodom your sister, before your wickedness lay open, which at this time has been uncovered to such a degree that you became a reproach to all the cities of Syria and Palestine which are round about you; since, therefore, you surpassed your sister in crime, and were not frightened by her example so as not to suffer like things and to hold back your foot, but now your disgrace has been uncovered, hear the sentence of God: either 'bear' — according to the Seventy —, or 'you have borne' — according to Aquila and Theodotion, or 'you are going to bear' — according to Symmachus — your crime and disgrace, so that, after you have endured the punishment for sacrilege, you may obtain pardon, not from your covenant but from my clemency'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
