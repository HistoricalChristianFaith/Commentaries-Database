[[commentary]]
quote='''
And the remnant of Jacob shall be in the midst of many peoples, like dew from the Lord, and like drops upon the grass, which does not wait for man, and does not tarry for the sons of men. And the remnant of Jacob shall be among the nations, in the midst of many peoples, like a lion among the beasts of the forests, and like a lion's whelp among the flocks of cattle, which, when it has passed through and trampled and seized, there is none to rescue. Your hand shall be exalted over your foes, and all your enemies shall perish. And it shall come to pass in that day, says the Lord, I will take away your horses from your midst, and I will destroy your four-horse chariots, and I will ruin the cities of your land, and I will pull down all your strongholds, and I will take away sorceries from your hand, and there shall be no divinations in you. And I will make your carved images perish, and your statues from your midst, and you shall no longer worship the works of your hands. And I will pluck up your groves from your midst, and I will crush your cities, and I will execute vengeance in fury and in indignation on all the nations which have not heard. LXX: And the remnant of Jacob shall be among the nations, in the midst of many peoples, like dew falling from the Lord, and like lambs upon the grass, so that no one may be gathered nor be among the sons of men. And the remnant of Jacob shall be among the nations, in the midst of many peoples, like a lion among the beasts, in the forest, and like a lion's whelp among the flocks of cattle; as if it should pass through and, dividing, seize, and there be none to rescue. Your hand shall be lifted up over those who afflict you, and all your enemies shall perish. And it shall come to pass in that day, says the Lord, I will kill your horses from your midst, and I will destroy your chariots, and I will overturn the cities of your land, and I will take away all your strongholds. And I will take away your sorceries from your hands, and those who speak shall not be in you; and I will destroy your carved images, and your statues from your midst, and you shall no longer worship the works of your hands; and I will cut down the groves from your midst, and I will demolish your cities, and I will execute vengeance in anger and in fury on the nations, because they have not heard. When we have been delivered from Asshur, when he comes upon our land and goes up upon our borders, and delivered by the Lord, who raised up against him seven shepherds and eight bites of men, the remnant of Jacob, by which we understand the apostles and the first Church, the one from the Jews, shall be in the midst of many peoples like dew falling from the Lord. For the hearts of the peoples were burning with the fiery darts of the devil, and all the nations, committing adultery away from God, had hearts like an oven kindled with fire. Hence the dew falling from the Lord became the healing of the sick. And what we read concerning Hananiah, Azariah and Mishael, that the spirit of a whistling dew extinguished the furnace of fire, let us understand of all generally: that in the midst of all the nations the teaching of the apostles was like dew from the Lord. But what follows: And like lambs upon the grass, so that no one may be gathered nor be among the sons of men, let us take of those of the nations who were unwilling to believe, that the apostles and the remnant of Jacob are over them, like lambs cropping the grass and mowing down the herbage with their teeth. And they will do this so that those who were unwilling to be angels by receiving the spiritual dew may by no means be gathered among men, nor be reckoned in the rational part, but that it may be said of them: They are not in the labor of men, and they will not be scourged with men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
