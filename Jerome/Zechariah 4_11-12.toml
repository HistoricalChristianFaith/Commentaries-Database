[[commentary]]
quote='''
Of the two olive trees which were on the right of the lamp and on the left we have read above. And so the prophet, now asking about them, does not deserve to hear, because he does not retain the former things; or else because what was said there more obscurely he desires to hear here more plainly; or at any rate his obstinacy is refuted by the angel's silence, because he insists that he knows greater things; although the Hebrews maintain that he heard nothing when he asked about the olive trees for this reason, that he did not ask well, and did not inquire into the whole of what he ought to have known. In short, afterwards he inquires more fully, adding the ears or branches of the olive trees, about which he had been silent above. For there he said: What are these two olive trees? Here he asks: What are the two ears of the olive trees? Μεταφορικῶς (metaphorically), because the trees are upright in the manner of ears of grain, and as ears are covered with their beards, so these are covered with a kind of palisade of branches and leaves, and rise up on high.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
