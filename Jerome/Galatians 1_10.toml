[[commentary]]
quote='''
For do I now persuade men, or God? Or do I seek to please men? If I were still pleasing men, I would not be the slave of Christ.

Let us not suppose that we are being taught by the Apostle to despise the judgments of men after his example, since in another place he said: "Knowing therefore the fear of the Lord, we persuade men; but to God we are manifest" (2 Cor. 5:11); and this: "Be without offense to the Jews, and to the Gentiles, and to the Church of God, just as I also please all men in all things, not seeking what is useful to me, but what is useful to many, that they may be saved" (1 Cor. 10). But if it can be that we please God and men alike, men too must be pleased. If, however, we do not please men otherwise than by displeasing God, we ought to please God rather than men. Besides, he himself also adds why he pleases all men in all things: "Not seeking", he says, "what is useful to me, but what is useful to many, that they may be saved". Now he who, out of that love which does not seek the things that are its own but the things that are another's, pleases all men that they may be saved, certainly pleases God first, to whom the salvation of men is a care. Moreover, the word that has been specially added here, now, also implies that men are either to be pleased or to be displeased according to the time: so that he who now does not please on account of the truth of the Gospel may once have pleased for the salvation of very many. Paul had at one time pleased the Jews, when, being a zealot for the ancestral traditions, he had formerly lived in the law without reproach; and he had so much ardor and faith in the ceremonies of the forefathers that he was a partaker in the killing of Stephen, and went on to Damascus to bind those who had fallen away from the law (Acts 9). But after he was transferred from a persecutor into a vessel of election and began to preach the faith which he had once fought against, he began likewise to displease the Jews whom he had pleased before. This, then, is what he says: Do I seek to please the Jews, by displeasing whom I have pleased God? For if I were pleasing them, I would still not be the slave of Christ. For I would be upholding the law and destroying the grace of the Gospel. But now, for this reason, I am not induced even into a pretense of observing the law: because I am not able to please God and the Jews alike; for whoever pleases them displeases God. The very word to persuade, too, is taken from human usage, when someone tries to implant in others as well what he himself holds and has once imbibed; and it is read in very many places of the Scriptures, among which is this: "The persuasion is not from him who called you" (Gal. 5:8). And also in the Acts of the Apostles: "So many Jews came to him at his lodging, to whom he expounded, testifying to them the kingdom of God, and persuading them concerning Jesus from the Law of Moses and the Prophets until evening". Now all this was because it had been disseminated concerning him that he secretly kept the Law, and that at Jerusalem he had entered into fellowship with those who were Judaizing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
