[[commentary]]
quote='''
That he may grant you, according to the riches of his glory, to be strengthened with power through his spirit in the inner man; that Christ may dwell through faith in your hearts; rooted and grounded in love; that you may be able to comprehend with all the saints what is the breadth, and length, and depth, and height; to know also the surpassing love of knowledge of Christ, that you may be filled in all the fullness of God.

Therefore, he says, I bow my knees to the Father, after whose likeness all fatherhood in heaven and on earth is named, praying and beseeching him to grant you the power of his glory, that is, to have a share in his majesty; and to strengthen and confirm you through the Holy Spirit, because there is no strength without the Holy Spirit; and to strengthen and confirm you in the inner man. For we seek not the strength of the body but that of the soul, and we desire that not the outer but the inner man be strengthened, so that after Christ has dwelt in the inner man, he may dwell in the ruling part of that inner man itself, that is, in our hearts: by no means running about through all its members, but dwelling in its rational part, and setting there his dwelling and his seat. All this, however, will come about through faith, if we believe in him. Therefore he says: that Christ may dwell through faith in your hearts. And this dwelling, which is built through the beginning of faith, has its roots and foundation in love, so that, since we are God's husbandry, God's building (1 Cor. 3), all things may grow up and be built up in love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
