
[[commentary]]
quote='''
And when he has raised it, he himself also shall bear glory, that is, the second crown, which in Hebrew is hod, and is written by one ἐπιδοξότης, by another εὐπρέπεια, by another ἀρετὴ, by another δόξα; which mean either renown, or beauty, or virtue, or glory. And they think Zerubbabel is signified, who, rising suddenly from a lowly man and a captive to be leader of the Jewish people, built the temple of the Lord, and sat upon his throne, and ruled with the power of a prince; but the high priest too, he says, Joshua son of Jehozadak, shall sit on the priestly throne, and with minds and counsels joined they shall govern the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
