[[commentary]]
quote='''
Therefore thus says the Lord: if you turn, I will turn you, and you will stand before my face; and if you separate the precious from the vile, you will be as my mouth; they will turn to you, and you will not turn to them. And I will give you to this people for a wall of bronze, strong, and they will fight against you and will not prevail, because I am with you to save you and deliver you, says the Lord. And I will free you from the hand of the most wicked and redeem you from the hand of the strong or of the pestilent. It is clear that it was by no means Jerusalem but the prophet who said the preceding words. To him the Lord answers: 'If you turn the people from their sins, I too will turn you from tribulation into gladness, and you will stand before my face, as the angels stand in the sight of God, daily seeing his face, and if you separate the precious from the vile, you will be as my mouth. And do not think', he says, 'that there is no reward for a good work; if by your words you set apart any of my saints from the number of sinners, you will be as my mouth and will be joined to my precepts. For they ought to be your imitators, and not you theirs. And do not shrink back and say: Why has my pain become perpetual, and my wound strong or desperate, so that I despair of being able to be healed? For I will give you as a wall of bronze, and most strong, so that you may resist the adversary with all your strength and have me as your helper, and I will free you from the hand of the most wicked or the pestilent, and redeem you either by my blood or at present by my help'. Let us consider how great a reward the word of a teacher has, if it has been able to free anyone from error and lead him out of the number of sinners!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
