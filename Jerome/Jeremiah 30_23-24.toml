[[commentary]]
quote='''
Behold, the whirlwind of the Lord, fury going forth, a storm rushing down, shall come to rest upon the head of the wicked. The Lord will not turn back the anger of his indignation until he does and fulfills the purpose of his heart; in the last of days you will understand these things. The whirlwind of the Lord's fury and the rushing storm and tempest will rest upon the head of the wicked, whether of the demons or of those who blasphemed the Son of God; and he will not turn back the anger of his indignation until he does and fulfills the purpose of his heart, and until Jerusalem is surrounded by an army and utterly destroyed. Now just as a craftsman cannot be understood except when the work is completed, nor the diligence of medicine except after health has been attained, so, when the overthrow of Jerusalem and the casting off of the former people have come about, then believers will understand that the rejection of the Jews is the occasion of our salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
