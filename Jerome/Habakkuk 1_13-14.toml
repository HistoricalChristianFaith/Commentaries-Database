[[commentary]]
quote='''
Your eyes are pure, so that you may not see evil, and you will not be able to look upon iniquity. Why do you not look upon those who do iniquitous things, and are silent while the wicked devours one more just than himself. And you will make men like the fish of the sea, and like a creeping thing that has no prince? LXX: The eye is pure, so that it may not see evils, and you will not be able to look upon sorrow. Why do you look upon the despisers, will you be silent when the wicked has devoured one more just than himself? And you will make men like the fish of the sea, and like creeping things that have no leader. Jeremiah too says something of this kind to God: You are just, O Lord, I confess; yet I will speak judgments to you: Why is it that the way of the wicked prospers; that all abound who transgress and do wrong? You planted them and they have taken root, they have begotten sons and have borne fruit; you are near to their mouth, and far from their reins. Therefore Habakkuk also, in the same thought: Pure, he says, O Lord, are your eyes, and I know that you do not willingly look upon what is evil and unjust, nor can anyone doubt your justice. Yet why do you suffer the Babylonians to vaunt themselves with such great cruelty, and Israel, the just, to be oppressed by the wicked Nebuchadnezzar? Not that the one who is oppressed is perfectly just, but that he is more just than the one who oppresses him. And just as fish that have no prince, and irrational beasts, and the multitude of creeping things, being without providence, are subject to the stronger, and whoever is more powerful in strength rules over the other, so among men, a rational animal, made in your likeness, reason will have no force, nor merits, but bodily strength and irrational might.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
