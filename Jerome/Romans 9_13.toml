[[commentary]]
quote='''
This is what the Apostle too argues about, writing: Jacob I loved, but Esau I hated; and he loves Jacob because he supplants and overcomes what is fleshly and earthly, and deserves to receive its blessings; for first we live according to the flesh and afterwards according to the spirit. First the vices, then the virtues by which the vices are undermined, because the heart of man is set on malice from boyhood, and mature age condemns the errors of youth; hence David too: The offenses, he says, of my youth and my ignorances do not remember. And yet it must be known that Jacob receives the first blessing, Esau the second, and at the last it is said of him: You shall be the servant of your brother, so that, after the flesh has been made subject to the spirit and joined to it, it may cease to be flesh, and Idumaea may pass over into Judea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
