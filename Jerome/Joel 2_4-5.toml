[[commentary]]
quote='''
Their appearance is like that of fierce horses, and like horsemen they will run about hither and thither. Not that the Babylonians are compared to horsemen, but that the locusts, by a figure for the enemies, are said to run about hither and thither like horsemen: As the sound, he says, of four-horse chariots and of carts, so will be the sound of the locusts. They will leap upon the tops of the mountains, so as to climb all the lofty places; and as a flame quickly consumes stubble, so the sound and the terror of their voice will lay waste all things. And what he adds: Like a strong people prepared for battle, he refers again to the locusts, so that he seems to speak not as of enemies but as of locusts; and yet while we read of locusts, let us think of the Babylonians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
