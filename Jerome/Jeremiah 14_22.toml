[[commentary]]
quote='''
Are there among the graven images of the nations any that rain, or can the heavens give showers? Are you not the Lord God, whom we have awaited? For you have made all these things. After many and varied discourses he returns to the title of the prophecy, in which it is written: the word of the Lord which came to Jeremiah concerning the words of the drought. So what he says is this: 'Since the images of demons cannot rain, nor can the heavens of themselves give their shower, therefore you, O Lord our God, whom we have always awaited, to whom we have turned our hopes and vows, you give your rain! For all things are yours, and whatever is good cannot be given without you, whose it is'. Let us say this also against the heretics, who cannot bestow the rain of doctrines, and who, though they promise that they are heavens and boast that it is written of them: The heavens declare the glory of God, nevertheless cannot give the showers of doctrine. For it is God alone who instructs his people and bestows the diversities of grace on those who await him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
