[[commentary]]
quote='''
Beyond these things he adds also that he wished to know the causes and natures of things, and the disposition and prudence of God; that he wished to know why each thing was made, or how; so that what David hopes he will see after the dissolution of body and soul, on his return to the heavens, saying: I will see the heavens, the works of your fingers, this Solomon now strove to find in the present, so that the human mind, walled in by the enclosure of the body, might comprehend the truth known to God alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
