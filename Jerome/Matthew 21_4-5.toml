[[commentary]]
quote='''
The evangelists write that this prophecy was fulfilled when the Lord entered Jerusalem, sitting upon a she-ass and the foal of a she-ass, and a crowd of children with branches of palms came to meet him, crying: Blessed is he who comes in the name of the Lord, hosanna in the highest; and when the Pharisees rebuked him for not checking the shouting children, he answered: Have you not read: Out of the mouth of infants and sucklings you have perfected praise?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
