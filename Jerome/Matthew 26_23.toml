[[commentary]]
quote='''
O wonderful endurance of the Lord, He had said before, One of you shall betray me. The traitor perseveres in his wickedness; He designates him more particularly, yet not by name. For Judas, while the rest were sorrowful, and withdrew their hands, and bid away the food from their mouths, with the same hardihood and recklessness which led him to betray Him, reached forth his hand into the dish with his Master, passing off his audacity as a good conscience.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he answered and said: He who dips his hand with me in the dish, he will betray me. O the wonderful patience of the Lord! First he had said: One of you is going to betray me. The betrayer persists in evil; he reproves him more plainly, and yet he does not point out his name specifically. Judas, while the others were saddened and drew back their hands and forbade food to their mouths, with the same rashness and shamelessness with which he was going to betray him, even puts his hand into the dish with his master, so that by his boldness he might feign a good conscience.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
