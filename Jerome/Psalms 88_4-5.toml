[[commentary]]
quote='''
This can also be understood more deeply, as the Lord says of himself: I am reckoned with those who go down into the pit: I have become like a man without help, free among the dead (Ps 87 [88]:4). For he was truly reckoned among sinners and the unrighteous, so that he might go down to the underworld, which in many places of the Scriptures is called the pit, and set free those bound in prison.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
