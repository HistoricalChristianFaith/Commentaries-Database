[[commentary]]
quote='''
God casts off the calves of the heretics and of Samaria, who say that they keep the precepts of the law; which calves cling to the ground and work in the earth, not in the spirit, nor lift their eyes to heaven; and therefore the fury of the Lord is kindled against them, and he wonders what this great perversity is, that they will not abandon the idols which they have fashioned for themselves, and love heretical filth instead of the cleanness of the Church. These calves Israel, who pretends that he sees God, did not receive from the other nations; but he himself forged for himself out of the holy Scriptures the depravity of his understanding, and he is the craftsman of his own god, which will quickly perish and will imitate spiders' webs, which are broken at a light touch.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
