[[commentary]]
quote='''
"My beloved is white and ruddy": white in virginity, ruddy in martyrdom. And because he is white and ruddy, therefore it is immediately added, "His mouth is most sweet, yea, he is altogether lovely."
'''
source_url='https://www.newadvent.org/fathers/30091.htm'
source_title="Against Jovinianus 1.31"

[[commentary]]
quote='''
Of him the bride too says in the Song of Songs: My kinsman is white and ruddy, chosen out of thousands (Song 5:10). White in the fullness and purity of his virtues, ruddy in his passion, of which we shall read later: Who is this who comes up from Edom, tawny are his garments from Bozrah; chosen out of thousands in the resurrection, so that he who was the firstborn of all creation might become the firstborn from the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
