[[commentary]]
quote='''
And the word of the Lord came to Jeremiah, saying: Behold, I am the Lord, the God of all flesh; shall for me difficult — or impossible — be — or be hidden from me — any word? Therefore thus says the Lord: Behold, I will deliver this city into the hand of the Chaldeans and into the hand of the king of Babylon, and he shall take it. And the Chaldeans shall come — and shall enter — fighting — or the Chaldeans shall come — against this city, and they shall set it on fire and burn it, and the houses on whose roofs they sacrificed to Baal and poured out libations to strange gods to provoke me. To sad things he joins glad ones, and after the overthrow of Jerusalem he promises a return to the captive people. And first he sets out the causes of the offense and of the righteous fury of God, so that the greater the guilt of the sinners, the more ample the clemency of the Creator toward the sinners. I, he says, am the Lord, the God of all flesh; not of all the nations, nor of the people of Israel, nor indeed, as he is often accustomed to say of the saints, 'the God of Abraham, the God of Isaac, the God of Jacob,' but the God, he says, of all flesh, so that he may be believed to have made both the rational and the brute animals himself. For there are those who acknowledge the providence of the Creator as far as rational creatures, but assert that the brutes either perish or live by chance happenings; and the prophetic word declares that there is nothing that escapes the providence and knowledge of God, because some things were created for their own sake, others for the use of men. Shall it be difficult for me — or impossible, or at any rate shall it be hidden from me — any word? We have also said above: the things that are impossible with men are possible with God; and here and in many other places we must take 'word' for 'things'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
