
[[commentary]]
quote='''
And the crowns, or the crown, are set upon Joshua son of Jehozadak, the high priest, because, as we advance and return to better things, the Lord is crowned through each of our virtues; or rather, as we are crowned through the virtues of repentance, the Savior receives a crown in each one, according to what Paul also says: For the rest, there is laid up for me a crown of justice, which the Lord, the just judge, will render to me; and not to me only, but also to all who love the coming of our Lord Savior Jesus Christ. Whence the father of the Lord Savior also took his name from the crown of justice. For Jehozadak is interpreted Lord of justice, because he renders to each according to his works. Of this crown James too speaks in his epistle: Blessed is the man who endures temptation, for when he has been proved he will receive the crown of life, which God has promised to those who love him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
