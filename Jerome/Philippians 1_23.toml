[[commentary]]
quote='''
Let the groaning of the fettered enter into your sight. This is what those who follow the teachings of Origen are accustomed to say: The groaning of the fettered — that is, of the angels, they say, who have been fettered in bodies. For just as, if fetters are put on the feet, they weigh down the body and do not allow it to run; so also our bodies enclose souls — that is, angels — and weigh them down upon the earth. And with what words do they prove this? "Unhappy man that I am, who shall deliver me from the body of this death?" And that which he says, "I desire to be dissolved and to be with Christ" — to return and to be with Christ. See, he says, what the apostle says. Whoever says "I desire to return" says it precisely of that place where he had been before. Let the groaning of the fettered enter into your sight. But I, in plain rustic simplicity and in the simplicity of the Church, answer you thus — for so the apostles answered, so they spoke, not with rhetorical and diabolical words: "For it is better to return and to be with Christ." For so it stands in the Greek; it does not have "to be dissolved" but "to return." To return, and to be with Christ. Where Adam my father was, there I too long to be; from where he was cast out, I desire to return. In Adam we have all been cast out of paradise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_012.html'
source_title="Homily 12, on Psalm 78"
