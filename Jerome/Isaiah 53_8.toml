[[commentary]]
quote='''
And as for what follows, From distress and from judgment he was taken away, or as the Seventy translated, in humiliation his judgment was taken away: it signifies either that from tribulation and judgment he ascended victorious to the Father; or that he, the judge of all, did not find the truth of judgment, but without any fault was condemned by the sedition of the Jews and the voice of Pilate. Hence the Prophet marvels that the God of all handed himself over to suffering. Of which Paul speaks: For if they had believed, they would never have crucified the Lord of glory (1 Cor 2:8). There follows: Who shall declare his generation? This is understood in two ways: for either it is to be taken of his divinity, that it is impossible to know the mysteries of the divine birth, of which he himself speaks in Proverbs, Before all the hills he begot me (Prov 8:25), according to what we read elsewhere, Who has known the mind of the Lord, or who has been his counselor (Rom 11:34)? that is, no one; or of the Virgin's giving birth, that it can be explained only with difficulty. Indeed, when it was said to Mary by the Angel, You shall conceive and bear a son, she answered: How shall this be to me, since I do not know a man? To whom the Angel in turn: The Holy Spirit, he says, shall come upon you, and the power of the Most High shall overshadow you (Luke 1:31, 34, 35); so that the mysteries of this birth are told only by the Angel or by the Evangelist. Its narrator is most rare, according to that saying: Who is wise, and he will understand these things? understanding, and he will know them (Hos 14:10)? But if a prudent reader answers in silent thought: And how is it written, No one knows the Son but the Father, and no one knows the Father but the Son, and he to whom the Son wills to reveal him? and he who knows the Father and the Son can surely also declare the mystery of the generation: let him hear that it is one thing to know and another to utter, because often what we conceive in the mind we cannot unfold in speech. Therefore the saints too can know the mystery of the divine birth in the body by faith rather than tell it. Otherwise the Apostle too, caught up into the third heaven and into paradise, heard words which a human tongue can by no means utter (2 Cor 12). But the Spirit too intercedes for us with unutterable groanings. Of him, then, whose generation either no one or hardly anyone can declare, the life was taken away from the earth, so that he might live not on earth but in heaven. Or he was cut off from the land of the living, so that there might be fulfilled of him what is written in the Apocalypse of John: I am the first and the last: I who was living, and was dead: and behold, I live for ever (Rev 1:18); so that after the life he lived on earth, dead to the earth, he might live in heaven for ever. And what is joined to this, For the crime of my people he struck them, or, according to the Seventy, by the iniquities of my people he was led to death, has a double sense. For either by his death he struck the persecutors and the criminals of his people; or because of the greatness of the sins of the people which he always held as his own peculiar people, he was led to death, so that by his death he might call them back to life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
