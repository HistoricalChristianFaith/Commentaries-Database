[[commentary]]
quote='''
And they shall come, he says, — no doubt delivered from the hand of the powerful — and shall praise their deliverer on Mount Zion, that is, in the Church, and shall flow together to the good things of the Lord, the abundance of all things, which is perceived not in the fruits and foods of this flesh, but in the variety of the virtues. Over grain, he says, and wine and oil — from which the bread of the Lord is made, and the type of his blood is fulfilled, and the blessing of sanctification is shown, Scripture saying: God, your God, has anointed you with the oil of gladness above your fellows — and the young of flocks, who are the simple in the Church, and of herds, which are horned and toss the adversaries. But that we may know that these blessings do not pertain at all to the body but to the soul, there follows: and their soul shall be like a watered garden or like a fruit-bearing tree, which is planted beside the streams of waters, and the paradise of the Lord in delights. And no more, he says, shall they hunger; not at all with that hunger of which it is written: blessed are those who hunger and thirst for righteousness, but with that which is changed by satiety and shuts out the want of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
