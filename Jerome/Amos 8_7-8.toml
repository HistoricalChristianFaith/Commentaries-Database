[[commentary]]
quote='''
And he swears that he will not forget their works even to the end; for the proud God resists, but gives grace to the humble; but that he holds in memory all the sins they have committed, and brings them even to the end and the time of judgment. Hence the penitent pray: Do not remember our former iniquities; especially since against the proud the earth itself is moved, or troubled, and mourns, not the tenant and the stranger, but its inhabitant; and its consummation rises up like a river, and goes down like the stream of Egypt, so that he who repents rises with the climbing river, but he who persists in his offenses goes down like the river of Egypt and, entering the sea, is swallowed up. And by this he shows that the pride of Jacob, against which the Lord swears, is to be devoured by eternal punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
