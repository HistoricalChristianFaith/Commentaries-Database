[[commentary]]
quote='''
Beelzebub is the idol of Accaron who is called in the book of Kings, the God of flies; 'Bel,' signifying idol; (2 Kings 1:3.) 'zebub,' a fly. The Prince of the dæmons He calls by the name of the foulest of idols, which is so called because of the uncleanness of the fly, which destroys the sweetness of ointment.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If they have called the householder Beelzebub, how much more those of his household. Beelzebub is the idol of Ekron, which in the book of Kings is called the idol of the fly. Beel is the same as Bel or Baal; zebub means fly. Therefore they called the prince of demons by the name of that most filthy idol, who is called fly because of the uncleanness that destroys the sweetness of the oil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
