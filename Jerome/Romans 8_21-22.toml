[[commentary]]
quote='''
The sun therefore and the moon and the stars are for our sake, they serve us. The apostle too says that the very creation groans together and is in travail for the deliverance of the sons of God. But when the sons of God shall have been taken up, then the creation itself also is set free from this servitude. Let someone say: How does the sun serve, and how is it set free? how the moon? how the stars? The sun is set free, that it may not look upon the Jews, nor upon the pagans, nor upon those who blaspheme their Lord. It sees parricides, it sees murderers: and yet it serves the command of him who ordered it. For he makes his sun to rise upon the just and the wicked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
