[[commentary]]
quote='''
The Apostle Paul used this testimony in the second Epistle to the Corinthians, saying: In an acceptable time I have heard you: and in the day of salvation I have helped you. Behold, now is the acceptable time, etc. (2 Cor 6:2). If, then, the vessel of election refers what is said to the understanding of the first coming, let us too follow the footsteps of his exposition, and, like little children, press our letters upon the lines our teacher has traced. The pleasing and acceptable time, and the day of salvation, is the passion and resurrection of the Savior, when he prayed on the cross: My God, my God, why have you forsaken me (Matt 27:46)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
