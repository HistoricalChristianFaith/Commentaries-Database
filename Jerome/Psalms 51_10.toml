[[commentary]]
quote='''
This David too prays for in the fiftieth psalm, saying: Create a clean heart in me, O God (Ps. 50:11). And certainly he had had a clean heart before his sin, when the Lord said of him: I have found David the son of Jesse after my own heart (Acts 13:22); but as there creation means renewal, so also in us and in Christ, through individual works and advances, creation and founding can be understood: so that daily in believers (who, variously according to their different merits, are called mountains, and valleys, and hills, and plains) Christ is created, born and founded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
