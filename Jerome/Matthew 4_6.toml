[[commentary]]
quote='''
In the several temptations the single aim of the Devil is to find if He be the Son of God, but he is so answered as at last to depart in doubt; He says, Cast thyself, because the voice of the Devil, which is always calling men downwards, has power to persuade them, but may not compel them to fall.

This verse we read in the ninetieth Psalm (Ps. 91:11.), but that is a prophecy not of Christ, but of some holy man, so the Devil interprets Scripture amiss.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If you are the Son of God, throw yourself down. In all the temptations the devil works at this: to find out whether he is the Son of God. But the Lord so tempers his answer as to leave him in doubt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Throw yourself down. The voice of the devil, by which he always desires that all should fall down; Throw yourself, he says; he can persuade, he cannot cast down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
He has commanded his angels concerning you, that they bear you up in their hands, lest perhaps you strike your foot against a stone. This we read in Psalm 90 (91). But there the prophecy is not about Christ but about a holy man. So the devil interprets the Scriptures badly. Surely, if he really knew it was written of the Savior, he ought also to have quoted what follows in the same psalm against himself: You shall walk upon the asp and the basilisk, and you shall trample the lion and the dragon. Of the help of the angels he speaks as though to a weak man; of his own trampling, like a shifty evader, he is silent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
For he has given his angels charge concerning you, to guard you in all your ways. This passage the devil interpreted concerning the Lord. For at the time when he tempted the Lord, "If," he says, "you are the Son of God, cast yourself down. For it is written concerning you, that he has given his angels charge concerning you, to guard you in all your ways. In their hands they shall bear you up, lest perhaps you dash your foot against a stone." The devil said nothing more than this: For he has given his angels charge concerning you, that in their hands they may bear you up, lest perhaps you dash your foot against a stone. He left out the middle part. For here it is said, For he has given his angels charge concerning you, to guard you in all your ways. This he did not say, To guard you in all your ways: for he knew it was against himself. For the Lord could have answered him: If the Lord guards me in all my ways, then I am guarded from you too. He was silent, therefore, about what he knew was against himself, and set down what was in his favor. Truly the devil, like a devil, interprets concerning the Savior what is not concerning the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_020.html'
source_title="Homily 20, on Psalm 90"

[[commentary]]
quote='''
For He has given His angels charge concerning you, that they may keep you in all your ways. In their hands they shall carry you, lest ever you dash your foot against a stone. If ever the heretics interpret certain things from the Scriptures against us, we ought not to be disturbed: because the devil too used this testimony against the Lord and Savior, saying, "If you are the Son of God, cast yourself down; for it is written that He has given His angels charge concerning you," and the rest. The devil interprets the Scriptures like a devil: for he was applying this psalm to the person of the Lord, which is spoken not of the Lord, but of any just man. But I grant you, O devil, that it be written concerning the Lord Himself, "in their hands the angels shall carry you": why did you not say what follows, "Upon the asp and the basilisk you shall tread"? O the cunning of the crafty, shape-shifting enemy! What seemed to pertain to the frailty of the Savior and to the temptation of the man, he spoke; but what he understood to be against himself, with his ancient craftiness he kept silent. You err, O devil, and by your deceit you ensnare your very self. In this place your lie profits the Church: although you did this in order to tempt, you have shown that the children of God, all the just, are carried by the hands of the angels—that is, by their help—at the command and bidding of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_068.html'
source_title="Homily 68, on Psalm 90 (Alternate Series)"
