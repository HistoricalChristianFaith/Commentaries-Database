[[commentary]]
quote='''
Thus much prefaced, the Lord brings forward a parable, to convict them of their irreligion, and show them that the kingdom of God should be transferred to the Gentiles.

He speaks to the Gentile people first, through their knowledge of the law of nature; Go and work in my vineyard; i. e. What you would not have done to you, that do not you to others. (Tobit 4:16.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"
