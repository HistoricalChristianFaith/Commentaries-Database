[[commentary]]
quote='''
Since, then, he taught first what the old women ought to be, and after the things they have in common with the old men set out also the things proper to them, that they be full of an honorable and holy demeanor and of all seemliness: not accusers, not disparaging others, not with their senses seized by wine; now, accordingly, he hands them the reins of teaching, so that, when they are such, they may have freedom to teach, namely to teach the things that are good. For although in another place he has said, "But I do not permit women to teach" (1 Tim. 2:12), it must be understood thus: that teaching directed at men is taken from them. For the rest, let them teach the young women as their daughters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
