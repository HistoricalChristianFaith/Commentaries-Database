[[commentary]]
quote='''
And what follows: And I will give her her vinedressers from the same place. He who had set forth beforehand the caressing and the wilderness in the likeness of the past history of those who went out of Egypt, in which Moses and Aaron arose as princes from the same nation of the Jews, now too promises that he will give her vinedressers from the same place. That the vineyard is understood as Israel, all the scripture of both the Old and the New Testament bears witness: The vineyard of the Lord of Sabaoth is the house of Israel. And: You transferred a vineyard out of Egypt. And in the Gospel: The householder let out his vineyard and did not receive the fruits. And when his son had been killed, at the last he let it out to other vinedressers. This, then, is what the prophetic word promises: that the princes of this vineyard, going out from the nations and from the captivity of enemies, or of vices, should be of the very race of the Jews, that is, the apostles; and that the place of tumult and valley of troubles — for this is what Achor is interpreted — should be changed into a door of hope, or to open up hope and patience, in that she has suffered punishments and torments for this reason, that through them she might come to prosperity. But that the valley of Achor, in which Achan was killed for the theft of the things that had been consecrated to God, is interpreted 'confusion' and 'tumult', and not, as some think, διαστροφὴ, that is, perversity, Joshua himself interprets when he speaks to Achan: Because you have troubled us, may the Lord trouble you on this day. Hence that place was called Emec Achor, that is, the valley of confusion. And at the same time we understand this too: that at the beginning of the holy land, near Jericho, when the people came out of the wilderness, beside the streams of the Jordan, in Israel's first victory, grief was changed into joy, and hope was opened there, where there had been despair. So that, once those have been punished who sinned against Christ and committed sacrilege, those of them may be saved who have detested the blaspheming Jews and, as far as was in their power, have slain them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
And she will sing there according to the days of her youth, and according to the days of her coming up from the land of Egypt. LXX: And she will be humbled according to the days of her infancy and according to the days of the coming up from the land of Egypt. In the place where we put she will sing, and the LXX translated she will be humbled, in the Hebrew is written anatha, which Symmachus interpreted 'she will be afflicted', Theodotion 'she will answer', Aquila 'she will obey', that is, ὑπακούσει; we take it rather from the Hebrew κατὰ λέξιν (word for word), that is, 'she will lead the singing'; so that, since he had once set down the being tossed about and the leading out into the wilderness, and the vinedressers from the same place, and the valley of Achor, touching in brief speech on the whole history of those who went out of Egypt and journeyed to the holy land, he might even now keep the likeness of the history. So that, just as at that time, when they were going out of the land of Egypt, after Pharaoh had been drowned in the Red Sea, Miriam took up a timbrel and, leading the singing for the others, exulted and said: Let us sing to the Lord, for he has been gloriously magnified; horse and rider he has cast into the sea, so now too, according to the days of her youth, or of her adolescence, when she went out of the land of Egypt, she may sing and rejoice, and sing together of the kingdom of Christ and her own salvation among the choirs of the Church. And notice that when we go out of Egypt and pass over to better things, we are said to go up, because Jerusalem is set in the mountains; and he who had wished to go down from it into Jericho was wounded. But to those who seek the help of Egypt, that is, of this world, it is said: Woe to those who go down into Egypt for help. The interpretation of Aquila and Theodotion, of whom the one put ὑπακούσει, that is, 'will hear', the other ἀποκριθήσεται, that is, 'will answer', is on our side, in that while some lead the singing, others answer, singing together. But she will be humbled and she will be afflicted, which the LXX and Symmachus translated, does not suit a time of gladness, unless perhaps she will imitate Paul, who, after he was called as an apostle, bewails his former sins and says that he is unworthy of the calling of an apostle, because he persecuted the Church of God; so that the humiliation and the affliction are to be taken as the awareness of a past wound, not as pain at present evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
