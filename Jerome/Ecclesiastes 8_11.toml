[[commentary]]
quote='''
This happens, however, because no one dares to contradict sinners, nor does God at once avenge the crime, but he puts off the punishment while he waits for repentance. But sinners, because they have not at once been rebuked and corrected, think that there will be no judgment at all, and persist in crime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
