[[commentary]]
quote='''
And to Shemaiah the Nehelamite you shall say; and what follows: Thus says the Lord of hosts, the God of Israel: Because you have sent books in your own name to all the people that is in Jerusalem, is not found in the Seventy; and again they added of their own: I did not send you in my name, and consequently, in order: and to Zephaniah son of Maaseiah, the priest, and again from the Hebrew: and to all the priests; and then the story is woven on: The Lord has made you priest in place of Jehoiada the priest, that you may be leader — or instructor and overseer — in the house of the Lord over every man who is possessed and prophesies, that you may put him in the stocks and in prison — or in custody and in the cataract, for which Symmachus put mochlon [a bar], and Aquila put the Hebrew word itself, 'sinac' —. And now why have you not rebuked Jeremiah the Anathothite, who prophesies to you? For on this account he sent to us in Babylon, saying: It is long; build houses and dwell, and plant gardens and eat their fruit! So Zephaniah the priest read this book in the ears of Jeremiah the prophet. Shemaiah, from the place 'Nehellami', which means 'torrent', had been led to Babylon with King Jeconiah and was prophesying falsely to the people that they would quickly return to Jerusalem. That he was a false prophet the following words of Jeremiah show: thus says the Lord to Shemaiah the Nehelamite: because Shemaiah has prophesied to you and I did not send him. Since, therefore, Jeremiah had sent a letter to those who were in Babylon, saying: build houses and dwell; plant gardens and eat their fruit; take wives and beget sons! And after other things had added: let not your prophets who are in your midst, and your diviners, lead you on! And then: for these prophesy falsely to you in my name, and I did not send them, says the Lord, Shemaiah, understanding that it had been written against him under the common name of the false prophets, sends a letter to Jerusalem, to Zephaniah son of Maaseiah, the priest, and to the rest of the priests, against Jeremiah, asking why he was not rebuked by Zephaniah the priest, whose office it is to discern between prophets, which speak by the Holy Spirit and which by the contrary one, and why he was not ordered to be shut up in prison, that he might pay the penalty of his lie and cease to trip up the people any further. Jehoiada was the priest who handed the rule to Joash after the killing of Athaliah and killed the priest of Baal. This, then, is what he writes: 'why do you not imitate Jehoiada the priest and kill Jeremiah the false prophet? For the Lord has appointed you in place of Jehoiada, that you may have care of the temple and especially discern who speak by the Holy Spirit and who by a demonic one' — and the Apostle too records that the discernings of spirits belong to the Lord's grace —; 'why,' he says, 'have you not rebuked Jeremiah the Anathothite?' What he himself deserved as a false prophet he turns back upon the prophet, and he forestalls the truth with a lie. Hence too the sons of darkness are thought more prudent than the sons of light in this generation, and while we act patiently and wait for the salvation of the wretched, the heretics forestall us and call us by their own name, the blind leading the blind into the pit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
