[[commentary]]
quote='''
If thieves had come in to you, if robbers by night, how would you have kept silent? Would they not have stolen what was enough for them? If grape-gatherers had come in to you, would they not at least have left you a cluster? How have they searched out Esau, tracked down his hidden things? LXX: If thieves had come in to you, or robbers by night, where would you have been cast away? Would they not have stolen what was enough for them? And if grape-gatherers had come in to you, would they not have left a cluster? How has Esau been searched through, and his hidden things been found out? Jeremiah likewise, though with the order changed: If grape-gatherers had come upon you, would they not have left a cluster? If thieves in the night, they would surely have seized what was enough for them. But I have uncovered Esau, I have revealed his hidden things, and he shall not be able to hide. What he says is this: If thieves and robbers, who are accustomed by night to dig through houses and to seize what is in the houses, had come in to you, and, hidden by the darkness, had gone round the corners of your house, they would surely have carried off what they thought could be enough for them, and would have left something in your dwelling, either through being sated or through not knowing of it. If grape-gatherers had come into your vineyard, and wished either to lay it waste as enemies or, hired by you, to harvest it, however diligent their vintage had been, they would still have left among the branches clusters hidden by the vines and leaves. But the enemies who came to you at the Lord's command — and he means the Babylonians and the army of Nebuchadnezzar — have tracked down everything, all your secrets, and have ranged through the caverns and the holes of the grottoes in which you dwell. And indeed, that we may say something also about the nature of the place, the whole southern region of the Idumeans, from Eleutheropolis as far as Petra and Aila — for this is the possession of Esau — has little dwellings in caves; and because of the excessive heat of the sun, since it is a southern province, it uses underground huts. I have uncovered, he says, Esau, that is, what was pressed down under the earth I have brought into the open, and all the things that you were shutting up have been laid open, and, since I searched out your substance together with the enemies, no secret places could hide it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
