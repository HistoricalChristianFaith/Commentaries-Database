[[commentary]]
quote='''
In another Gospel, (John 18:10.) Peter is represented as having done this, and with his usual hastiness; and that the servant's name was Malchus, and that the ear was the right ear. In passing we may say, that Malchus, i. e. one who should have been king of the Jews, was made the slave of the ungodliness and the greediness of the Priests, and lost his right ear so that he might hear only the worthlessness of the letter in his left.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And behold, one of those who were with Jesus, stretching out his hand, drew his sword, and striking the servant of the chief priest cut off his ear. In another Gospel it is written that Peter did this, with the same ardor of mind as in everything else. The servant of the chief priest, too, is called Malchus; and the ear that is cut off is the right one. It should be said in passing that Malchus, that is, king, the people of the Jews, once became the servant of the impiety and greed of the priests, and lost its right ear, so as to hear the whole meanness of the letter with the left; but the Lord, in those of the Jews who were willing to believe, restored the right ear and made the servant a royal and priestly race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
