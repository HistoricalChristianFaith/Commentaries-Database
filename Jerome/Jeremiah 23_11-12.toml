[[commentary]]
quote='''
For prophet and priest are polluted, and in my house I have found their evil, says the Lord. Therefore their way shall be like a slippery place in darkness; they shall be driven on and shall fall in it, for I will bring — or I will inflict — evils upon them, the year of their visitation, says the Lord. When evils are found in the Church of God, and especially in its princes, let us know that this has been fulfilled: prophet and priest are polluted; in my house I have found their evils, says the Lord. Now the house of Christ is the Church, of which Paul too writes to Timothy: that you may know how you ought to conduct yourself in the house of God, which is the Church of the living God, the pillar and foundation of the truth. In the prophet understand the teacher, in the priest the dignity of the ministry; and if they have consented with a depraved mind, their way will be into a slippery place and into darkness, and they will not have the Lord saying: I have come as light into the world, that everyone who believes in me may not remain in darkness. Whence the holy man, fleeing all darkness, says: the light of your countenance, O Lord, has been signed upon us; you have given gladness in my heart. But when they are in darkness and on the slippery way, that is, in heretical error, at every motion they will be driven on and will fall. And the Lord inflicts evils upon them: not that they are evils in such a way that the Lord inflicts evils, but they are evils to those who undergo the punishments; otherwise the same things are both evils and goods: evils with respect to those whom they torment, goods with respect to those whom they amend. And this must be noted, that the year of the Lord's visitation is called the correction and torment of sinners, according to that which is written: I will visit their iniquities with the rod and their sins with stripes; but my mercy I will not scatter from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
