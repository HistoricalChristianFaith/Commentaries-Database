[[commentary]]
quote='''
It should be noted, that the required texts are taken from the book of Deuteronomy only, that He might show the sacraments of the second Law.

The Devil and Peter are not, as many suppose, condemned to the same sentence. To Peter it is said, Get thee behind me, Satan; i. e. follow thou behind Me who art contrary to My will. But here it is, Go, Satan, and is not added 'behind Me,' that we may understand into the fire prepared for thee and thy angels.

When the Devil says to the Saviour, If thou wilt fall down and worship me, he is answered by the contrary declaration, that it more becomes him to worship Jesus as his Lord and God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Jesus said to him: Go, Satan; it is written: You shall worship the Lord your God and him alone shall you serve. Satan and the apostle Peter are not, as most think, condemned by the same sentence. For to Peter it is said: Go behind me, Satan, that is, follow me, you who are contrary to my will; but here he hears: go, Satan, and behind is not said to him, so that it is understood: go into the eternal fire that has been prepared for you and your angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
You shall worship the Lord your God. The devil, saying to the Savior: If falling down you worship me, hears on the contrary that it is rather he himself who ought to worship him as his Lord and God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
