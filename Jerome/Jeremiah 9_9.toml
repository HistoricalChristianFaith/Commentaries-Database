[[commentary]]
quote='''
As for the following verses, in which he says: shall I not visit upon these things, says the Lord, or on such a nation shall my soul not take vengeance? He makes frequent use of them in this prophet, so that, when he has enumerated the evil works one by one, he infers that he does justly what he does.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
