[[commentary]]
quote='''
Go up to Lebanon and cry out, and in Bashan give your voice, and cry to those passing by, for all your lovers are crushed! I spoke to you; in your abundance you said: I will not hear! This is your way from your youth, that you have not heard my voice. The wind shall feed all your shepherds — or lovers — and your lovers — or friends — shall go into captivity; and then you shall be confounded and shall blush for all your wickedness. You who sit in Lebanon and nest in the cedars, how you groaned when pains came upon you like the pains of a woman in labor! By metaphoran of Lebanon and Bashan, regions and mountains beyond the Jordan, the word is directed to Jerusalem, because she trusted in Egypt in vain; or to Jehoiakim himself, who at that time was reigning in Jerusalem and had been set up as king by the Egyptians, because he hopes in vain for the help of the Egyptians, and because they too are to be overcome by the Babylonian king and led into captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And where we said: cry to those passing by, and in the Hebrew is written 'meabarim', the Seventy and Theodotion translated 'across the sea', Symmachus 'from opposite', to signify that the voice of the prophet must reach from Jerusalem as far as Mount Lebanon and Bashan.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
