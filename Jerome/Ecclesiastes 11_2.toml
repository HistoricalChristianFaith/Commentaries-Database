[[commentary]]
quote='''
The seven shepherds I take to be all the patriarchs and prophets and holy men who served the hebdomad, that is, the old instrument. But the eight bites of men, or eight principal men, and, as Symmachus rendered it, christs, are all those of the New Testament who, from the apostles down to this age, have bitten the Assyrian and torn him with their teeth. Hence also in Ecclesiastes the command is given: That we should give portions to seven, let us give also to eight. And in the temple of Ezekiel, which is interpreted as the Church and the heavenly Jerusalem, one goes up by seven and by eight steps. And in the psalter there are fifteen steps, by which, through the hebdomad and the ogdoad, we climb to sing praises to God. On the eighth day the spiritual circumcision is celebrated, and in the temple of the Jews the sabbath is destroyed, and some psalms are inscribed for the eighth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
The days of our years in themselves are seventy years. Seventy years are seven decades, and eighty years are eight decades. See, then, how the seventh and the eighth number is proclaimed. And just as we said, You have been made a refuge for us from generation to generation, both in the old and in the new testament: therefore now too he sets down both the seventh and the eighth number. This he says also in Ecclesiastes: "Give a portion to seven, and give a portion to eight." Therefore there are also fifteen Psalms of Degrees, that is, seven and eight: which fifteen together lead us to the kingdom of heaven. And indeed, after the seventh Psalm of Degrees has been completed, what does Scripture call that psalm itself? "A psalm," it says, "of Solomon," who had built the old house. And what does it say? "Unless the Lord builds the house, in vain have they labored who built it." What then does Solomon himself say, who is prefixed in the very title? I built the temple: but unless the eighth number builds, the house is built in vain. We read also in the Gospel according to Matthew: Blessed are the poor, blessed are the meek, blessed are those who hunger and thirst, and the rest, and there are eight beatitudes. Therefore our Lord enclosed the Gospel in the number eight. Indeed nowhere do we find eight beatitudes together except in the Gospel. In the number eight, that is, on the day of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_019.html'
source_title="Homily 19, on Psalm 89"

[[commentary]]
quote='''
Give a portion to seven and also to eight, for you do not know what evil is to come upon the earth. In Ezekiel too seven and eight steps are read of for the ascent to the temple. And after that ethical psalm, that is, the hundred and eighteenth (119th), come the fifteen psalms of the steps, through which we are first instructed in the law, and then, the number seven being completed, we afterwards climb through the ogdoad to the Gospel. We are commanded, therefore, to believe in both Testaments, the Old, that is, as well as the New, with equal reverence. The Jews gave a portion to seven, believing in the sabbath, but they did not give one to eight, denying the resurrection of the Lord's day. Conversely the heretics, Marcion and Mani and all who tear the old law to pieces with rabid mouth, give a portion to eight, accepting the Gospel; but they do not grant the same to the number seven, spurning the old law. Let us therefore believe both Testaments. For we cannot even now grasp with the mind the torments they deserve and the deserved punishment that is laid up for those who dwell on the earth, the Jews and the heretics, who each deny one of the two. The Hebrews understand this passage thus: Keep both the sabbath and circumcision, lest, if perhaps you do not do this, an unexpected evil come upon you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
