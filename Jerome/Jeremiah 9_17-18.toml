[[commentary]]
quote='''
Thus says the Lord of hosts: Consider — or understand — and call the mourning women, and let them come, and send to those who are wise, and let them hasten — or let them speak —, let them make haste and take up a lamentation over us — or over you — and let our eyes — or your — bring down tears and our eyelids — or your — flow with waters, for a voice of lamentation has been heard from Zion or in Zion. On account of the coming captivity and overthrow of Jerusalem he bids the mourning women be called, who in times of grief are accustomed, with a tearful voice and beating their arms with their hands, to provoke the people to tears; for this custom remains to this day in Judea, that women with hair loosened and breasts bared, with a measured chant, stir everyone to weeping. And God joins himself to them with the feeling of one who suffers with them, or the prophet does, so as to say that whatever the people endures, he himself endures and feels. But as for what he adds: for a voice of lamentation has been heard from Zion, what this voice is follows at once.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
