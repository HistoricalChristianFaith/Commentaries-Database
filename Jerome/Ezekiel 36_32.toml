[[commentary]]
quote='''
Now the Lord will bestow all these things, not for the sake of those who perished by their own error, but for the sake of his holy name; hence he challenges the house of Israel to be confounded and to blush for its former vices, and to understand its Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
