[[commentary]]
quote='''
For they themselves have gone up to Assyria, a wild ass alone by himself. Ephraim have given gifts to lovers; moreover they have hired the nations for pay; now I will gather them, and they will rest a little while from the burden of the king and of the princes. LXX: For they themselves have gone up to the Assyrians; Ephraim has sprouted within himself, they have loved gifts; therefore they will be handed over among the Gentiles; now I will receive them, and they will rest a little, that they may anoint kings and princes. Israel, he says, has been devoured, and has become like a useless, or unclean, vessel, of which no potsherd remains in which water could be drawn, or some small bit of fire. And because he has become an unclean vessel, therefore they have gone up to the Assyrians, imitating the solitary wild ass; not at all as sheep fed by the Lord, but wickedly abusing their freedom, and led away into captivity; and the prophet bewails them and says: Ephraim have given gifts to the Assyrians and have hired their lovers for pay; of whom Ezekiel writes: To all harlots payments are given, but you have given payments to your lovers, and the contrary has happened in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
