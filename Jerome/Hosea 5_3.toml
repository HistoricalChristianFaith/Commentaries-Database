[[commentary]]
quote='''
I, he says, know Ephraim, that is, Jeroboam, by whom the people was seduced, and all the kings who followed him both in rank and in crime; and Israel is not hidden from me, that is, the people of the ten tribes, because when the king played the harlot, Israel was defiled. The king first began to play the harlot away from the worship of God, desiring to adore golden calves, and the people willingly followed, and they accomplished an equal impiety with equal zeal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
