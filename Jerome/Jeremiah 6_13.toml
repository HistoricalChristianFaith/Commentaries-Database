[[commentary]]
quote='''
From the least even to the greatest, all are devoted to avarice, according to that saying of the Apostle: the root of all evils is avarice. And from prophet even to priest all practice deceit: the one by prophesying a lie, the other by perversely interpreting the law of God; for the prophet also says in another place: Seek the law from the priests.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
