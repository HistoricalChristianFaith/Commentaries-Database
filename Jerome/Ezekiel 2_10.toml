[[commentary]]
quote='''
And he spread it out before the prophet and offered it to be read and known, the book which in Isaiah is said to be sealed to a people that does not believe — for to this day a veil has been laid upon the Old Testament for the Jews —. And it was written before and behind, concerning things to come and things past; or certainly without, in the letter of the history, and within, in the spiritual understanding, of which the psalmist also says: All the glory, he says, of the king's daughter is from within. And there were written in it, both within and without, lamentations and song and woe: lamentations over those who are called to repentance, as Samuel and the apostle Paul bewailed and mourned Saul and the Corinthians, whom they longed to save; song over those who are worthy of God's testimony and to whom the psalmist gives the command: Sing to the Lord a new song; and woe over those who are utterly despaired of and who, when they have come into the depth of sins, despise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
But as far as concerns the spiritual understanding, the prophet takes up a lament over every Israel which used to discern God with the mind and afterwards ceased to serve him, according to that which is commanded to Ezekiel, that he should devour the book in which there was written, both within and without, lamentation, and song, and woe. Understand by within the Song of Solomon that follows, who says: The king has brought me into his chamber. And the forty-fourth (45th) psalm, in which it is written: All the glory of the king's daughter is within. But without is whatever is read in the letter, and is seen in the bark, and is not held in the marrow of the spirit. And so, both according to the letter and according to tropology, in all the books of the prophets a lament is written over those who repent after sins; a song over those who, stained by no filth of sins, are worthy of canticle and praise; woe over those who do not repent, but according to the hardness of their heart treasure up for themselves wrath in the day of wrath.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
