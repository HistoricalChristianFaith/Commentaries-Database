[[commentary]]
quote='''
Her widows have been multiplied to me above the sand of the sea; I have brought upon them, upon the mother of the young man, a destroyer at noon; I have sent terror suddenly upon the cities. God desires to save sinners by various remedies, so that those who had despised him when he coaxed them may fear him when he threatens. The widows were multiplied above the sand of the sea when their husbands had been slain; the mothers, having lost their children, felt the destroyer not at night and through ambushes, but in broad daylight, to show the open force of a stronger adversary. 'I have sent', he says, 'upon the cities' — no doubt those of Judah and of the sinful people — 'terror suddenly, so that, the more sudden the evil was, the more difficult escape would be'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
