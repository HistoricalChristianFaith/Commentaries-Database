[[commentary]]
quote='''
For you have plundered many nations, and have stripped the Jewish people of the adornment and the garments which I had given it; therefore all the remaining peoples, who have not bowed their neck to your rule, will despoil you and make you naked. For you too have slain very many nations and have shed their blood. But also the impiety of the land, that is, of the land of the Jews, and of the city of Jerusalem, and of all its inhabitants, who said against their Creator: Crucify, crucify him; his blood be upon us and upon our children, will return upon your head and will be the causes of your despoiling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
