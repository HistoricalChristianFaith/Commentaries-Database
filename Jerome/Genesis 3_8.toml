[[commentary]]
quote='''
(Verse 8) And they heard the voice of the Lord God walking in paradise at evening. In many Latin manuscripts, instead of 'at evening,' it has 'in the afternoon' because we cannot translate the Greek word 'δειλινὸν' word for word. In Hebrew it is written 'Larue Aiom,' which Aquila interpreted as 'in the wind of the day,' that is, in the wind of the day. But Symmachus interpreted it as 'through the spirit of the day.' Moreover, Theodotion clearly showed in the spirit the cooling of the day, so that after the heat of noon had passed, he displayed the refreshing breath of the breeze.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
There are different postures: for either we sit, or we stand, or we walk, or we lie down. Unhappy is he for whom God lies down: for he lies down with the one lying down. Just as he weeps with the one weeping and laughs with the one laughing, so he lies down with the one lying down. Just as he thirsts with the one thirsting, and hungers with the one hungering, and is naked with the one naked, so too he lies down with the one lying down. He, then, who is wounded and lies down—he too is in a manner said to lie down with him. But he who walks—he also walks with him. He who walks seems indeed to be better than he who lies down; yet he has not yet come to the happiness of him who stands. Finally, when Adam hid himself from the face of God, God was walking to him after midday. Let someone say: If Adam had offended, and had been cast out of paradise, then whoever has God walking to him is in perfect unhappiness. And I say: If Adam had been utterly slain, and no place of repentance had been given to him, God would have lain down for him. But now, because a place of repentance is given to him, therefore God walks to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_026.html'
source_title="Homily 26, on Psalm 98"
