[[commentary]]
quote='''
And returning they came to the fountain of judgment, this is Cades. This is said by anticipation, because it was afterwards so called. And it signifies a place near Petra, which is named the fountain of judgment because there God judged the people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
And they struck all the country of the Amalekites, and the Amorite dwelling in Asason thamar. This is the town which is now called Engaddi, fertile in balsam and palms. Moreover, Asason thamar in our language sounds as the city of palms. For thamar means palm.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
