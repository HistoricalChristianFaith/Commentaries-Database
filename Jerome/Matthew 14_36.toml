[[commentary]]
quote='''
Or, by the hem of the garment understand His least commandment, which whosoever transgresses, shall be called least in the kingdom of heaven; or, again, His assumption of the body, by which we come to the Word of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they brought to him all who were ill, and they begged him that they might touch even the fringe of his garment; and whoever touched it were made whole. Let those who are ill touch, not the body of Jesus, nor his whole garment, but the outermost fringe; and whoever touch it will be healed. Understand the fringe of his garment as the least commandment, for whoever transgresses it shall be called least in the kingdom of heaven; or as the assumption of the body, through which we come to the Word of God and afterwards enjoy his majesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
