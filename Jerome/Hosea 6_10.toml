[[commentary]]
quote='''
In the house of Israel I have seen a horrible thing; there Israel has been defiled by the fornication of Ephraim; but you also, Judah, set a harvest for yourself, when I shall turn back the captivity of my people. LXX: In the house of Israel I have seen horrible things, there the fornication of Ephraim; Israel and Judah have been defiled; begin your vintage when I shall turn back the captivity of my people. Of this crime and terrible horror Jeremiah too speaks: The heaven was astounded at this, and the earth shuddered exceedingly. For what is more horrible than that the ten tribes suddenly went over to the worship of idols? Hence it is said to their metropolis: Take away your calf, Samaria, in which Ephraim first played the harlot, that is, Jeroboam of the tribe of Ephraim; and while he played the harlot, Israel was defiled, namely the people of Samaria, which for the most part held the common name of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
