[[commentary]]
quote='''
The 'wheels' themselves, too, are called in the Hebrew tongue 'gelgel', which Symmachus translated 'whirling' and Aquila 'wheel'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Do you want to know how the ends of the earth see God? We read in Ezekiel: 'And those wheels,' he says, 'which are turned, were called gelgel,' which means 'revelation, revelation.' For GEL means 'revelation,' GELGEL 'revelation, revelation.' Those wheels then hear 'revelation, revelation': because the wheel touches the earth as it were only at some small point, and the whole of it hastens toward heaven. Therefore it is said also in another place: 'Holy stones are rolled upon the earth.' And what is said in Ezekiel? 'Wherever,' he says, 'the spirit went, thither the wheels also followed.' Let us too follow the Holy Spirit, and let us be called wheels. And what is said there? 'And they went not,' he says, 'backward, but always went forward.' And at the same time consider what he says. 'They did not turn back,' he says, 'but always went forward.' For they forgot the things that were past, and reached out toward the things before them. 'And they were full,' he says, 'of eyes.' For all of those wheels were full of the light of God. It is not the time now to discuss the wheels and the cherubim and the living creatures in Ezekiel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_025.html'
source_title="Homily 25, on Psalm 97"
