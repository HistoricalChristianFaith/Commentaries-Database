[[commentary]]
quote='''
And in what he added: seek the peace of the city or of the land, and again: for in its peace there will be peace for you, that saying of the Apostle is confirmed in which he enjoins: I beseech therefore, first of all, that supplications, prayers, intercessions, thanksgivings be made for all men, for kings and all who are in high station, that we may lead a quiet and tranquil life in all piety and chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
