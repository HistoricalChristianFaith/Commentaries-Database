[[commentary]]
quote='''
It must also be known that the Jews and the heirs of their error refer both this section which we have now expounded and the one like it in Isaiah to the thousand-year reign of Christ and of the saints; and that what is said: All peoples shall walk, each in the name of the Lord his God, they interpret in this way: that each nation is to be tormented with its idol and sent into the fire of eternal punishment. But they are refuted by what follows: this is said not of the end of the ages but of the first coming of Christ, in which the remnant of her that halts is gathered, and the nations are saved first. Isaiah, then, set down a testimony of this kind: The word that came to Isaiah son of Amoz concerning Judah and Jerusalem: for in the last days the mountain of the Lord shall be manifest, and the house of God upon the summit of the mountains, and it shall be exalted above the hills, and all nations shall come to it. And many nations shall go, and shall say: Come, let us go up into the mountain of the Lord, and into the house of the God of Jacob, and he will announce to us our way, and we will walk in it; for out of Zion shall go forth the law, and the word of the Lord from Jerusalem. And he shall judge among many nations, and reprove a very great people, and they shall beat their swords into plows, and their hunting-spears into sickles, and nation shall not take up sword against nation, and they shall not learn to make war any more. Significantly it is said here that the word of God, going forth from Jerusalem, judges among many nations, and properly reproves the people of the Jews. For us, as sinners, he will judge according to the measure of our works; but them, as impious men and deniers, he will not judge, but will reprove them as condemned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
