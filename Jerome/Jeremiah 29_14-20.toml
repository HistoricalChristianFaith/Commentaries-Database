[[commentary]]
quote='''
And in this place a delirious interpreter dreams of the ruin of the heavenly Jerusalem and supposes that the prophecy is directed to those who dwell in the Babylonian region of this world, that they did well to descend of their own accord into these bodies and in the land of the Chaldeans to build houses, plant orchards, take wives, beget sons, and by good works to be restored after seventy years to their former place and to the heavenly Jerusalem; but that those who were unwilling by their own will to descend to earthly things would suffer these things which the Lord threatens against Zedekiah and his people, who were unwilling to imitate their brothers or to come into Babylon: that he sends upon them the sword and famine and plague, that is, the want of all things, and makes them like very bad figs, which utterly cannot be eaten, and pursues them with an everlasting sword and gives them over to vexation to all the kingdoms of the earth, so that, namely, they become not men at all but demons, aerial powers, and are, before all the angels who preside over the several provinces, for a curse and for astonishment and for hissing and for a reproach to all the nations. And that they would suffer this for the reason that they were unwilling to hear, in the heavenly Jerusalem, the words of the prophets, who exhorted them to descend to earthly things and take up the body of humiliation, and, having done penance, after the true sabbath-rest to possess their former place. So much he may say; and when his disciples and the dung of the Grunnian household hear it, they think they are hearing divine mysteries, and us, who despise these things, they hold as brute animals and call pēlousiōtas [men of mud], because, set in the mud of this body, we cannot perceive heavenly things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
