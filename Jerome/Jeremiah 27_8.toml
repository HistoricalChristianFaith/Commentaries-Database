[[commentary]]
quote='''
But the nation and kingdom which will not serve Nebuchadnezzar, king of Babylon, and whoever will not bend his neck under the yoke of the king of Babylon, with sword and famine and pestilence I will visit upon that nation, says the Lord, until I consume them by his hand. Not only does the Lord subject sinful nations to Nebuchadnezzar, but the Apostle too speaks of sinners: whom I have handed over to Satan, that they may learn not to blaspheme; and in another place: I have handed over such a one to Satan for the destruction of the flesh, that the spirit may be saved. He also warns that the powers must be obeyed not only because of wrath, but also because of conscience, lest we be condemned by them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
