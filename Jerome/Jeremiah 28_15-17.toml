[[commentary]]
quote='''
And Jeremiah the prophet said to Hananiah the prophet: Hear, Hananiah: the Lord has not sent you, and you have made this people trust in a lie. Therefore thus says the Lord: behold, I will send away — or cast out — you from the face of the earth; this year you will die. And what follows: because you have spoken against the Lord. And Hananiah the prophet died in that year, in the seventh month, is not found in the Seventy, in place of which they put only: and he died in the seventh month. Here too in the Seventy Hananiah is not called 'prophet', though — according to the Hebrew — holy Scripture calls him 'prophet', even if, where Jeremiah rebukes him, saying: hear, Hananiah, the Lord has not sent you, he left out 'prophet'; for how could he call him 'prophet' whom he denied had been sent by the Lord? But the truth and order of the history are kept, as we said above, not according to what was, but according to what was thought at that time. 'You have deceived,' he says, 'the people with a lie, so that they would not acquiesce in God's sentence; know, therefore, that you will die this year!' If, when we die, we are freed from the prisons of our bodies, according to that testimony which the heretics interpret wrongly: bring my soul out of prison, how is death now inflicted on the false prophet as a punishment? And this too must be noted, that Jeremiah, having suffered injury from the false prophet, is silent while the word of the Lord had not yet come to him, but afterwards, sent by the Lord, boldly rebukes the liar and announces his approaching death. And as to his dying in the 'seventh' month: those who are always accustomed to interpret this number as showing 'rest' will perhaps falsely claim that he died in the 'seventh' month for this reason, that he might be freed from the evils of the body, according to the saying they bring forward as written: 'death is rest to a man'. But we know that the bodies of believers are temples of God, if indeed the Holy Spirit dwells in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
