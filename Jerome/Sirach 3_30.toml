[[commentary]]
quote='''
The poor confer a great benefit on us. Our sins, which we can no longer wash away in any other way, almsgiving extinguishes. For what is written? 'As water extinguishes fire, so almsgiving extinguishes sins.' Almsgiving accomplishes the same as baptism. As baptism forgives us our sins, so almsgiving too forgives us our sins. As water extinguishes fire, so almsgiving extinguishes sins. For the fires of gehenna are prepared for sins: but almsgiving extinguishes them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_046.html'
source_title="Homily 46, on Psalm 133"
