[[commentary]]
quote='''
We read in Psalm 44 (45), which pertains especially to the union of the bridegroom and the bride, that is, to God the Savior and to the mysteries of the Church, that it is said among other things: The daughters of Tyre with gifts, the rich among the people shall entreat your face (Ps 44 [45]:13). And the bridegroom himself speaks again to the Tyrian bride: Hear, O daughter, and see, and incline your ear; and forget your people and your father's house, for the king shall desire your beauty (ibid. 11, 12). Hence in the description of her beauty too it is added: The queen stood at your right hand, in a vesture of gold, surrounded with variety (ibid. 10). And again: All the glory of the king's daughter is within (ibid. 14). And if the king desired the beauty of the penitent Tyrian woman, who has the ornaments of various virtues, how much more shall her hire and her trade belong not to those who remain in Tyre but to those who dwell in the sight of the Lord!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
