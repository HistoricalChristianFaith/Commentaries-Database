[[commentary]]
quote='''
The vine shall give its fruit, the vine that says in the Gospel: I am the vine, you are the branches. Every branch that abides in me, the Father cleanses, that it may bear greater fruit. And when its branches have been cleansed, that is, its shoots and layers, and with budding eyes have begun to promise the hope of fruits to come, so that what is written may be fulfilled: The flowering vines have given forth their fragrance, then the sun of justice has colored the hanging clusters, so that, sent into the winepresses of Psalms 8 and 83 (84), which are entitled for the winepresses, they may be trodden by the foot of the Lord, who comes up from Bozrah, that he may pour out the wine that gladdens the heart of man. The earth too shall give its shoot, not the dry and stony earth full of thorns, but the good earth which yields fruit a hundredfold and sixtyfold and thirtyfold, so that those who have sown in tears may reap in joy. But the heavens too shall give their dew, the heavens of which it is written in Psalm 18 (19): The heavens tell the glory of God, and the firmament proclaims the works of his hands. Of these heavens it is said in the song of Deuteronomy: Rejoice, O heavens, with him, that is, with the Lord and Savior, whom he foreknew and predestined to be conformed to the image of his Son; it is he who speaks with Moses: Let my speech be awaited like the rain, and let my words come down like the dew. For those who were dead in sins shall rise again, and those who lay in whitewashed sepulchres, which are full of dead men's bones, shall be raised up, and those who dwell in the earth shall rejoice. And what the cause of the joy is, the following words show: For the dew which is from you is their healing. And all these things, namely peace and the fruit of the vines, and the abundance of the lands, which has grown up from the dew of the heavens, the remnant of my people shall possess, of whom Isaiah speaks: Unless the Lord Sabaoth had left us a seed, we should have been as Sodom, and we should have been like Gomorrah. For the remnant according to the election of grace has been saved, not by works, otherwise grace would not be grace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
