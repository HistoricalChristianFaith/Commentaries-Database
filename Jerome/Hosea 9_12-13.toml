[[commentary]]
quote='''
Ephraim has flown away like a bird; their glory from birth and from the womb and from conception. And even if they rear their sons, I will make them childless among men. But woe to them also when I depart from them. Ephraim, as I saw, was Tyre, founded in beauty; and Ephraim will lead out his sons to the slayer. LXX: Ephraim has flown away like a bird; their glory in birth and in travail and conception; for even if they have reared their sons, they will be without sons among men, for woe to them also; my flesh is from them. Ephraim, as I saw, has offered his sons for a capture; and Ephraim, to lead out his sons to slaughter. In this place the translators greatly disagree among themselves. For in the place where we said: woe to them when I depart from them, the Seventy and Theodotion translated: woe to them, my flesh is from them; and seeking the reason why there is such great variety, I seem to myself to have found this: My flesh is said in the Hebrew tongue basari; again, if we say: my departure, or my turning aside, it is said basori. The Seventy and Theodotion, therefore, in place of what is my departure and my turning aside, rendered: my flesh. Again, where we have put: Ephraim, as I saw, was Tyre, the Seventy translated θήραν, that is, a hunt, or a capture; Aquila and Symmachus and Theodotion, the hardest rock, that is, flint, which in the Hebrew tongue is called sur; and if we read Sor, it means Tyre. But the Seventy translators, thinking because of the similarity of the letters res and daleth that it was not res but daleth, read sud, that is, a hunt, or a capture; whence Bethsaida too is called the house of hunters. We have spoken of the diversity of the translators; let us return to the sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
