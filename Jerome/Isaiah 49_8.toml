[[commentary]]
quote='''
Thus says the Lord: In a pleasing time I have heard you, and in the day of salvation I have helped you. And I have kept you, and given you as a covenant of the people, that you might raise up the land, and possess the scattered inheritances: that you might say to those who are bound: Go forth; and to those who are in darkness: Be revealed. In the ways they shall feed, and in all the plains shall be their pastures. They shall not hunger nor thirst, and the heat and the sun shall not strike them: for he who has compassion on them shall rule them, and shall give them drink at the springs of waters. And I will make all my mountains a way, and my paths shall be raised up. Behold, these shall come from afar, and behold, those from the North and the sea, and these from the land of the South. Praise, O heavens, and exult, O earth: shout praise for joy, O mountains, for the Lord has comforted his people, and will have mercy on his poor. LXX: Thus says the Lord: In an acceptable time I have heard you, and in the day of salvation I have helped you. And I have formed you, and given you as a covenant of the nations, that you might establish the land, and possess the deserted inheritances. And that you might say to those who are in bonds, Go forth, and to those who are in darkness, Be revealed: in all the ways they shall feed, and in all the paths shall be their pastures. They shall not hunger nor thirst, nor shall the heat nor the sun strike them; but he who has mercy on them shall comfort them, and shall lead them by the springs of waters. And I will make every mountain a way, and every path a pasture for them. Behold, these shall come from afar, these from the North and the sea: and others from the land of the Persians. Rejoice, O heavens, and let the earth exult, let the mountains break forth into gladness: for God has had mercy on his people, and has comforted the lowly of his people. The Apostle Paul used this testimony in the second Epistle to the Corinthians, saying: In an acceptable time I have heard you: and in the day of salvation I have helped you. Behold, now is the acceptable time, etc. (2 Cor 6:2). If, then, the vessel of election refers what is said to the understanding of the first coming, let us too follow the footsteps of his exposition, and, like little children, press our letters upon the lines our teacher has traced. The pleasing and acceptable time, and the day of salvation, is the passion and resurrection of the Savior, when he prayed on the cross: My God, my God, why have you forsaken me (Matt 27:46)?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
