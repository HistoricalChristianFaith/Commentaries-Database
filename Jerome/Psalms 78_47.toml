[[commentary]]
quote='''
For if they had remained in what they had begun, so as to be like the paradise of God, and had not ended in evil, so as to be like the land of Egypt, their planting would surely have remained. Something of the kind is sounded also by that verse concerning the Egyptians in the psalms: He killed their vineyards with hail, and their mulberry trees with frost. For as a most merciful God he killed and overturned every Egyptian planting, and the shrubs which, rooted in Egypt, bear blood-red fruits, so that those who planted badly may not drink, and may not eat fruit from them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
