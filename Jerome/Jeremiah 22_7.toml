[[commentary]]
quote='''
Let the royal house of our city, too, hear this, and its princes and cedars, which lift their crown up to the clouds and say in their pride: 'Who will not see us?', that they will quickly be consumed by the flame of the Lord if they are unwilling to submit to his precepts. But the sanctification of the slayer and of his weapons is one thing, that of the priests and of those who minister to the Lord another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
