[[commentary]]
quote='''
But to reveal his Son in me is not the same as if he were to say to reveal his Son to me. For to whom something is revealed, to him that can be revealed which was not in him before. But in whom something is revealed, that is revealed which was in him before and afterwards has been revealed. Similar is that saying in the Gospel: "He stands in the midst of you, whom you do not know" (John 1:26). And elsewhere: "That was the true light, which enlightens every man coming into the world" (ibid., 9). From this it becomes clear that the knowledge of God is present in all by nature, and that no one is born without Christ and without having in himself the seeds of wisdom and of righteousness and of the other virtues. Hence many, without faith and the Gospel of Christ, do some things either wisely or in a holy manner, such as obeying their parents, stretching out a hand to the needy, not oppressing their neighbors, not plundering what belongs to others; and they become all the more liable to the judgment of God, because, having in themselves the beginnings of the virtues and the seeds of God, they do not believe in him without whom they cannot exist. The Son of God revealed in Paul can also be understood otherwise: that, through his preaching, he was recognized by the Gentiles, who had not known him before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
Immediately I did not acquiesce in flesh and blood.

Or, as it stands better in the Greek: "I did not confer with flesh and blood". I know that most people think this was said of the apostles. For Porphyry too raises the objection that after the revelation of Christ he did not deign to go to men and confer in discourse with them, lest, that is to say, after being taught by God he should be instructed by flesh and blood. But far be it from me to think Peter, John and James flesh and blood, which cannot possess the kingdom of God (1 Cor. 15:50). If the spiritual apostles are flesh and blood, what are we to think of the earthy (χοϊκοῖς)? Plainly, Paul did not confer with flesh and blood after the revelation of Christ, because he did not wish to cast pearls before swine, nor to give what is holy to dogs (Matt. 7). See what is written of sinners: "My spirit shall not remain in these men, because they are flesh" (Gen. 6:3). With such as were flesh and blood, which also did not reveal the Son of God to Peter (Matt. 16), the Apostle did not confer the Gospel that had been revealed to him, but little by little he turned them from flesh and blood into spirit, and only then did he entrust to them the hidden mysteries of the Gospel. Someone may say: If he did not immediately confer the Gospel with flesh and blood, yet it is understood by implication that he conferred with blood and flesh afterward; and this sense, by which the apostles are excused from being flesh and blood, will not be able to stand, since he who at the beginning did not confer with flesh and blood nonetheless afterward, as I said, conferred with flesh and blood. This placing of the word before constrains us to divide the sentence so that we do not join at once (statim), or immediately (continuo), with flesh and blood, but make it cling to what precedes, and it is read: "But when it pleased him who set me apart from my mother's womb"; and then: "To reveal his Son in me"; and finally: "That I might preach him among the Gentiles immediately"; so that "I did not confer with flesh and blood" begins from its own opening. And we should rather judge that the sense stands thus: that he who had been sent immediately after the revelation of Christ to announce the Gospel to the Gentiles did not stand still, nor drag out the time with certain delays by going to the apostles and conferring the Lord's revelation with men, but went away into Arabia, and having returned again to Damascus, preached the Gospel after three years, and only then, coming to Jerusalem, saw Peter, John and James.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
