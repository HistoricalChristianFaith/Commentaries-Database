[[commentary]]
quote='''
He it is who also speaks in Genesis: The cry of Sodom and Gomorrah has been multiplied, and their sins are exceedingly great; I will go down, therefore, and see whether they are fulfilling it according to their cry which has come to me; and if not, that I may know. What he said is this: If they persist in their fury, punishment will not be lacking to the sinners; if they cease from their madness, they will become most worthy of my knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
