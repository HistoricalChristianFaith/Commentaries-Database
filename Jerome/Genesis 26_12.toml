[[commentary]]
quote='''
(Chapter 26, verse 12) And Isaac sowed in that land, and in that year he reaped a hundredfold. Although Isaac sowed in a foreign land, I do not think that such fertility of barley would have been to him. Therefore, I think the Hebrew version is better, and even Aquila translated it: And he reaped in that year a hundredfold estimated, that is, ἑκατὸν εἰκασμένον. Although the same letters are used for both estimation and barley, the estimations are read as Saarim (), and the barleys as Sorim. But Scripture, however, seems to me to have shown in it the multiplication of all virtues, in that it has increased a hundredfold the type of fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
And the full and perfect number is in the number of ten decades, which also multiplies the sowing of Isaac with a hundredfold crop; but because he was on earth and could still say: I am a sojourner and a stranger, as all my fathers were, he is related to have sown barley and reaped a hundredfold crop: for the grain of wheat had not yet died in the earth, to bear many fruits and to satisfy the Jewish people's hunger for hearing the word of God with that bread which came down from heaven; but how the hundred cubits were not only toward the eastern gate but also toward the gate of the north, the following testimony will show.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
