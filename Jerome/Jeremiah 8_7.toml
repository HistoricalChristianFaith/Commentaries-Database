[[commentary]]
quote='''
The kite in the heaven has known its time; the turtledove and the swallow and the stork have kept the time of their coming; but my people has not known the judgment of the Lord. For 'kite', which Symmachus translated, the Seventy and Theodotion put the Hebrew word itself, 'asida', Aquila 'herodiona' [heron]. And again for 'swallow' Symmachus translated 'cicada', which in Hebrew is called 'sis'. And for what we have put as 'stork', both Aquila and Symmachus translated 'agur', just as it is written in the Hebrew, for which the Seventy translated 'sparrows of the field'. And it is one and the same sense which is also set down at the beginning of Isaiah: the ox has known its owner and the ass the manger of its master, but Israel has not known me and my people has not understood; namely, that even small birds know their seasons and know when, hastening to warm places, they ought to escape the harshness of winter, and again at the beginning of spring come back to their accustomed regions. And here we ought to take 'heaven' for 'the air', which is above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
