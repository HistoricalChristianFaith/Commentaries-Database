[[commentary]]
quote='''
It should be noted, that none of the holy women are taken into the Saviour's genealogy, but rather such as Scripture has condemned, that He who came for sinners being born of sinners might so put away the sins of all; thus Ruth the Moabitess follows among the rest.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Judah begot Perez and Zerah of Tamar. It is to be noted that in the genealogy of the Savior none of the holy women is taken up, but those whom Scripture rebukes, so that he who had come for the sake of sinners, being born of sinful women, might blot out the sins of all. Hence in what follows too Ruth the Moabitess is set down, and Bathsheba the wife of Uriah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
