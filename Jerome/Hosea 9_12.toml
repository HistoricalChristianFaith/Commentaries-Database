[[commentary]]
quote='''
Whence the Lord says that even if they rear their sons and gather together a multitude of children, they will be handed over to death; and then a true woe will fall upon them, when God has departed from them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
