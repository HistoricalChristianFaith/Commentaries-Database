[[commentary]]
quote='''
That I may raise up the oath which I swore to your fathers, that I would give them a land flowing with milk and honey, as it is this day. The fathers are seen to receive when the sons receive, and the promise to Abraham is fulfilled in his posterity. A land moreover streaming with milk and honey we ought to take hyperbolically, for an abundance of all things, as in that line: let honey flow for them, and let the rough bramble bear amomum, and again: and he held back the wine running everywhere in streams; or else, tropologically, let us understand the land streaming with milk and honey as the Church of Christ, in which, as little ones and sucklings, we are brought up through faith, so that we may be able to take solid food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And I answered and said: Amen, O Lord, for which LXX: So be it, O Lord — for this is what 'amen' signifies — is what they translated. The Lord had said: I swore to your fathers that I would give them a land streaming with milk and honey, as is proved today by the facts themselves. The prophet, loving his people, takes up the voice of the Lord and longs that what has been given may be true and may endure forever. Hence he says: 'Truly, O Lord, you have fulfilled what you promised; or So be it, O Lord, that is: may what you have given remain always!'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
