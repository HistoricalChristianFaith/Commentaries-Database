[[commentary]]
quote='''
Thus says the Lord: guard your souls, and do not carry weights on the sabbath day, nor bring them in through the gates of Jerusalem! And do not cast out loads from your houses on the sabbath day, and you shall do no work, and sanctify the sabbath day, as I commanded your fathers! And they did not hear, nor did they incline their ear, and they hardened their neck — and what is not found in the Hebrew: above their fathers —, that they might not hear me and might not receive instruction. And it shall be, he says, if you hear me, says the Lord, so as not to bring in loads through the gates of this city on the sabbath day, and if you sanctify the sabbath day, so as not to do any work on it, there will enter through the gates of this city kings and princes sitting upon the throne of David and mounting in chariots and on horses, they and their princes, the men of Judah and the inhabitants of Jerusalem, and this city will be inhabited forever. And they will come from the cities of Judah and from round about Jerusalem and from the land of Benjamin and from the plains and from the hill country and from the south, bringing burnt offering and victims — or incense offerings — and sacrifice — or manna — and frankincense, and they will bring in an offering — or praise — into the house of the Lord. But if you will not hear me, to sanctify the sabbath day and not to carry a load and not to bring it in through the gates of Jerusalem on the sabbath day, I will kindle a fire in its gates, and it will devour the houses of Jerusalem and will not be extinguished. Lest I should tear in pieces the precept of the sabbath renewed through Jeremiah, I have chosen to set it out whole, so that we may know everything together. He guards his soul who does not carry the weights of sins on the day of 'rest' and of sabbath, nor bring them in through the gates of Jerusalem, which we ought to take as the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
