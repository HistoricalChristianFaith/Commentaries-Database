[[commentary]]
quote='''
The fourteenth place among the works of the flesh is held by drunkenness. For drunkards shall not possess the kingdom of God. And the Lord to the disciples: "Take heed", he says, "lest perhaps your hearts be weighed down with wine and debauchery" (Luke 21:34). By wine a man's senses are overturned, his feet stumble, his mind wavers, lust is kindled. Hence the Apostle cries out: "And wine, in which is licentiousness" (Eph. 5:18). Each one has the power of his own opinion. I follow the Apostle: that in wine there is licentiousness, in wine drunkenness. And that drunkenness and licentiousness are numbered among the works of the flesh, not even he who is overcome by these same passions can deny. And although some think I deserve blame in that book which I wrote on preserving virginity, because I said that young girls ought to flee wine like poison, I shall not repent of the opinion. For there it was rather the work of wine than a creature of God that was condemned by us; and we took away license from a virgin glowing with the natural heat of her age, lest under the pretext of drinking a little she should drink more and perish. Otherwise, we knew both that wine is consecrated into the blood of Christ and that Timothy was commanded to drink wine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
