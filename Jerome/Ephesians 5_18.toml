[[commentary]]
quote='''
The fourteenth place among the works of the flesh is held by drunkenness. For drunkards shall not possess the kingdom of God. And the Lord to the disciples: "Take heed", he says, "lest perhaps your hearts be weighed down with wine and debauchery" (Luke 21:34). By wine a man's senses are overturned, his feet stumble, his mind wavers, lust is kindled. Hence the Apostle cries out: "And wine, in which is licentiousness" (Eph. 5:18). Each one has the power of his own opinion. I follow the Apostle: that in wine there is licentiousness, in wine drunkenness. And that drunkenness and licentiousness are numbered among the works of the flesh, not even he who is overcome by these same passions can deny. And although some think I deserve blame in that book which I wrote on preserving virginity, because I said that young girls ought to flee wine like poison, I shall not repent of the opinion. For there it was rather the work of wine than a creature of God that was condemned by us; and we took away license from a virgin glowing with the natural heat of her age, lest under the pretext of drinking a little she should drink more and perish. Otherwise, we knew both that wine is consecrated into the blood of Christ and that Timothy was commanded to drink wine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
And do not be drunk with wine, in which is debauchery: but be filled with the spirit.

Just as we cannot serve two masters, God and mammon (Matt. 6), so we cannot be filled with the spirit and with wine alike. For he who is filled with the spirit has prudence, and gentleness, modesty, chastity. He who is filled with wine has folly, rage, insolence, lust. This, indeed, I reckon is signified in one word by debauchery (luxuria). If certain people understood this, they would never have accused me of rashness and heresy because I said, concerning the preservation of virginity, that wine must be shunned by young people, and that oil must not be poured upon the flame, nor the natural heat of the flesh increased by the kindling of pleasure. But the wine in which is debauchery can also be taken as that of which it is said in the song of Moses: Their wine is the rage of dragons, and the incurable rage of asps (Deut. 32:33), which all who are drunk with the thought of this age drink, and they rave, and vomit, and fall headlong. And, as in the fable of the Lapiths and Centaurs, they are borne to mutual destruction. Contrary to this wine is that wine which the Lord promises he will drink with us in his kingdom (Mark 14). We have often noted that the name spirit, without any addition, is used in a good sense; and this indeed seems to need observing here as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
