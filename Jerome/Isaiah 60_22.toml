[[commentary]]
quote='''
Then he who was a little one will become thousands, hearing from the Lord: Have authority over five or ten cities (Luke 19:17, 19), so that he is called a χιλίαρχος. And he who had said with the Apostle, To me, the least of all the saints, this grace was given (Eph 3:8), will be prince of a great nation in the heavens, when at the appointed time the Lord sends his angels, and they gather to him all the saints from the height of heaven to its summit (Matt 24): not only from Israel but also from the people of the nations, signifying whom he said: And I have other sheep which are not of this fold, and them also I must gather, that there may be one flock and one shepherd (John 10:16). And he will do this suddenly, so that when everything has been despaired of, then they may be gathered into a very mighty nation. And although we see these things being fulfilled in part daily in the Church, yet they will be more fully fulfilled at the consummation of the world and at the second coming of the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
