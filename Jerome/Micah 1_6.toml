[[commentary]]
quote='''
And I will make Samaria like a heap of stones in the field when a vineyard is planted, and I will pull down her stones into the valley, and I will lay bare her foundations, and all her carved images shall be cut to pieces, and all her wages shall be burned with fire, and all her idols I will lay waste; for they were gathered from the wages of a harlot, and to the wages of a harlot they shall return. For this I will lament and howl, I will go stripped and naked, I will make a lamentation like that of the dragons, and a mourning like that of the ostriches, for her wound is desperate, for it has come even to Judah, and has touched the gate of my people, even to Jerusalem. LXX: And I will make Samaria a watch-hut for fruit in the field, and a planting of a vineyard; and I will pull down her stones into the abyss, and I will lay bare her foundations, and all her carved images shall fall to pieces, and all her wages they shall burn with fire, and all her idols I will lay waste, for from the wages of fornication she gathered, and from the wages of fornication she destroyed. Because of this she shall lament and mourn, she shall go barefoot and naked, she shall make a lamentation like that of the dragons, and a mourning like that of the daughters of the Sirens; for her wound has prevailed, for it has come even to Judah, and has touched even to the gate of my people, even into Jerusalem. According to the order of the sins comes the order of the punishments. Samaria sinned first, and fashioned idols, and worshipped calves in place of the Lord; let her therefore also be the first to perish. I will destroy her when the Assyrians come, and I will make her like a heap of stones when a vineyard is planted, so that she is reduced to mounds. And I will pull down her stones into the valley. For she was situated in the mountains, where Sebaste now is, in which the bones of Saint John the Baptist are also laid to rest. And I will lay bare her foundations. For so great will the ruin be, and so great the overthrow of the city, that not only will the walls and buildings fall, but the foundations too will be laid bare down to the last stone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
