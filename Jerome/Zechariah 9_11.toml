[[commentary]]
quote='''
You also, by the blood of your testament, have sent forth your prisoners from the pit in which there is no water; turn to the stronghold, you prisoners of hope; today also, announcing, I will render double to you. LXX: And you, by the blood of the testament, have sent forth your prisoners from the pit that has no water; you shall sit in the stronghold, prisoners of the congregation, and for one day of your sojourning I will render double to you. After the word of the prophet, or rather God the Father Almighty himself, had announced to Zion and Jerusalem that their king was coming to them, meek and mounted upon a she-ass, a beast of burden, and upon the foal of an ass, and that his power would be from sea to sea, and from the rivers to the ends of the earth, he makes an apostrophe to Christ himself, of whom the prophecy speaks, and says: You also, by the blood of your testament, or covenant, have sent forth your prisoners from the pit in which there is no water. This is understood as follows: By the blood of your passion you have, in your clemency, set free those who were held bound in the prison of hell, in which there is no mercy. In short, after the Lord rose again, those who were held by the bonds of Adam's sins, or, as some would have it, of ingrained error, and of death, rose with him and appeared in the holy city. Of this blood of the testament he himself also spoke to the disciples, pointing to his future passion: Take and drink of this, all of you; for this is the cup of the new testament in my blood. In prefiguration of this pit which has no waters, Joseph was sent into one by his brothers, and Daniel and Jeremiah by the Chaldeans and by the people of the Jews. Benaiah too, in the time of snow and cold, went down into a pit to kill a lion there. Jeremiah, however, is plunged not into the water of the pit but into the mud and mire of the pit, which could suffocate a thirsty man rather than refresh him. Hence it is also written in the psalm: I am stuck fast in the mire of the deep, and there is no substance. In this pit of hell there abode also that rich man once clothed in purple, whose boastful tongue was burned by the fires of punishment, and who was so far from having any refreshment of waters that he begged for the refreshment of the tip of the poor man's finger dipped in water.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
