[[commentary]]
quote='''
I did not sit in the council of those who make merry, and I gloried; — or I was afraid — before the face of your hand I sat alone, because you filled me with bitterness. Why has my pain become perpetual — or why are those who sadden me strengthened — and my desperate wound refused to be healed — or my wound is strong; whence shall I be healed —? It has become to me as a lie of faithless waters or as lying water that has no faithfulness. The Hebrews think that these words are spoken in the person of Jerusalem: that she sat alone and was filled with bitterness, and her pain became perpetual, and that, as waters pass away, so the words of the prophets, by which they promised themselves prosperity, passed away falsely. It is better, however, that we take these words to be spoken in the person of the prophet, in the words of a holy man, who did not sit in the council or the secret gathering of those who make merry, because he feared the hand of God impending over him, or rather gloried that he had no fellowship with the wicked. Alone, he says, I sat, according to what is written: I have not sat with the council of vanity, and with those who do iniquitous things I will not go in. I have hated the church of the malignant, and with the impious I will not sit; and in another place: I am solitary, until I pass over. 'Before the face', he says, 'of your hand I sat alone, while I fear you, while I always await your hand impending over me. In the council of those who make merry I refused to sit, but I swallowed down my bitterness, so that I might prepare joy for myself in the future. Nor did I have intervals in my pain, but I was weighed down by continual misery, so that I expected no remedies. For those who saddened me prevailed, and my wound became strong. But in this I had consolation, that it was like lying and passing water. For as passing waters are seen while they flow, and glide away, so also every assault of the enemies has passed away, with you helping me'. Would that the Lord might grant to us too not to sit in the council of those who make merry and of those who do not think of the things to come, nor to yield to adversities, but always to dread the sentence of God and to say with the prophet: I sat alone, because I am filled with bitterness! 'Let it rejoice, then, in the present time — by no means the council of the wise, but the hidden and secret company of those who make merry; for me let it be good to cleave to God, to put my hope in the Lord, to be sated with reproaches and to await the sentence of my judge, which, when the end has come, will show in deed that all sorrow and bitterness have receded like flowing waters.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
