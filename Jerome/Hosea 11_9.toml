[[commentary]]
quote='''
In the same book, it is written, "I am God and not man, the holy one in the midst of thee, and I will not enter into the city," into the den, to be sure, of vices. He himself is the only one who does not enter into the city that Cain built in the name of his son, Enoch. All of this is chanted daily by the lips of the priests: ho monos anamartētos, which in our language is translated as qui solus est sine peccato.
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="AGAINST THE PELAGIANS 2:23"

[[commentary]]
quote='''
I repented of destroying for ever my people of old; therefore I will not act according to the fury of my anger, nor will I be changed from my clemency so as to destroy Ephraim. For I do not strike in order to destroy for ever, but in order to amend. My cruelty is the occasion of repentance and of mercy. God, indeed, am I, and not man. Man punishes for this end, that he may destroy; God chastises for this end, that he may amend. The Holy One in your midst, and I will not enter the city, that is: I am not one of those who dwell in cities, who live by human laws, who think cruelty to be justice, for whom the highest law is the highest malice; but my law and my justice is to save those who have been corrected. We can also say otherwise: since Cain the parricide first built a city in the name of his son Enoch, the Lord does not enter a city of this kind, which was built by crime and blood and parricide.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
