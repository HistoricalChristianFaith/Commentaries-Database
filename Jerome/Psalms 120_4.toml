[[commentary]]
quote='''
But if anyone is a sinner, and groans that he dwells in the tents of Kedar, there are sent to him sharp arrows of the mighty, with desolating coals, so that first he may be pricked by the words of God and say: I was turned about in misery while the thorn is fixed in me. And after he has been pricked, then let the desolating coal be sent to him through the Seraphim, that is, the burning word of God, to burn out not only the lips, which alone Isaiah had unclean, but also all the parts of his members, and to bring him back to a solitude of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
