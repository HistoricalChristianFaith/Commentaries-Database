[[commentary]]
quote='''
Dison [Dishon]: strong nipple, or he will tread on her. But this is said in the Syriac language. In Hebrew, however, it is interpreted fatness, or ash (that is, embers) of burnt offerings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
