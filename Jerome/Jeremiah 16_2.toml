[[commentary]]
quote='''
Elijah lived a virgin life; so also did Elisha and many of the sons of the prophets. To Jeremiah the command came: "You will not take a wife." He had been sanctified in his mother's womb, and now he was forbidden to take a wife because the captivity was near. The apostle gives the same counsel in different words: "I think, therefore, that this is good by reason of the present distress, namely, that it is good for a person to be as he is." What is this distress that does away with the joys of wedlock? The apostle tells us, in a later verse: "The time is short. It remains that those who have wives be as though they had none."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_022.html'
source_title="LETTER 22.21"
[[commentary]]
quote='''
And the word of the Lord came to me, saying: Do not take a wife, and let there be no sons and daughters for you in this place! For thus says the Lord concerning the sons and daughters who are begotten in this place, and concerning their mothers who bore them, and concerning their fathers, of whose stock they were born in this land: They shall die by the deaths of sicknesses; they shall not be lamented and they shall not be buried; they shall be as dung upon the face of the earth, and they shall be consumed by the sword and by famine, and their corpses shall be food for the birds of heaven and for the beasts of the earth. If, at the time of the impending captivity, the prophet is forbidden to marry a wife, so that he may not have tribulation of the flesh and, on top of his own grief, be tormented also by the miseries of his wife and children, how much more does the Apostle command, because the time has been shortened and the consummation is at hand, that even those who have wives should be as though they had none! Hence superfluous is the reproach of the new heretic against our teaching that second and third marriages do not derive from law but from indulgence. For it is one thing to do what is good in itself, another to be granted something lest you do worse. For he himself also states the reasons why he wishes young widows to marry, adding: for some of them have already turned back after Satan. And at the same time this teacher of continence and perpetual chastity, who blasphemously makes himself equal to God, praises third and fourth marriages, which I would call not so much marriages as consolations of miseries and the last plank of the shipwrecked; unless perhaps he grants indulgence to his Amazons, so that they may wage the wars of lust right up to decrepit old age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
