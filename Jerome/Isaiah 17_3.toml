[[commentary]]
quote='''
And help will cease from Ephraim: by no means will the ten tribes have help in it against Judah. And the kingdom from Damascus: ἀπὸ κοινοῦ [from the common or popular edition] will cease is understood. But when he says that the kingdom ceases and rests, he does not signify a perpetual devastation, but takes away for the present the power by which it formerly reigned in all Syria. And the remnant of Syria will be like the glory of the sons of Israel, says the Lord of hosts. As, he says, the ten tribes were destroyed when the Assyrian ravaged them, and all their glory was led into captivity, so the few who remain in Damascus will imitate them, and will have the glory of their allied nation. Take glory as said by irony, for ignominy. And all this will happen because the Lord has spoken, whose words cannot be made void.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Then the help of God shall cease from Ephraim, by whom in this place are understood the Scribes and Pharisees, according to the prophecy of Hosea, who names Ephraim those who are opposed to the people of God (Hos 5 and 8). And the kingdom shall cease from Damascus, so that sin, and the prince of sin, the devil, may no longer reign in Damascus, which formerly loved blood; but the remnant of Syria, that is, those from the nations who have believed, are to be as the children of Israel formerly were, the kingdom of God having been taken from them and given to the nations which bring forth its fruit, as the Lord God of hosts has spoken through all his prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
