[[commentary]]
quote='''
After the generals of the Persians had made their inquiry through those whom they had sent, and the embassy of the inquirers to the priests and prophets had been carried out, the word of the Lord came to the prophet, commanding him to speak to the common people and to the priests, telling them what they ought to answer the envoys. When you fasted and mourned in the fifth month, that of the captivity of Jerusalem, and in the seventh month, when Gedaliah was slain by Ishmael, through the seventy years of the desolation of the temple and of the overthrow of Jerusalem, was it of any profit to me that you fasted? And on the other hand, whenever you eat and drink, is it not for yourselves that you both eat and drink? For God is not appeased by these things, but by good works, and if we do his commandments, because food does not commend us to God. Neither, if we do not eat, shall we lack; nor, if we eat, shall we abound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
