[[commentary]]
quote='''
I looked at the earth, and behold, it was empty and nothing, and at the heavens, and there was no light in them. I saw the mountains, and behold, they were moving, and all the hills were troubled. I gazed, and there was no man, and the bird of the sky had departed. I looked, and behold, Carmel was deserted, and all its cities were destroyed before the face of the Lord and before the face of the wrath of his fury. The prophet sees in the spirit the things that are to come, so that the people, hearing, may be terrified and, having done repentance, may by no means suffer what it dreads. The earth is empty, its inhabitant destroyed; the heavens have no light, since the people does not see for the greatness of its terror; the mountains themselves and the hills have unsafe hiding places, and by hyperbolēn [hyperbole] they seem to move and be troubled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
