[[commentary]]
quote='''
And it is to be noted, that He spake not all things to them in parables, but many things, for had He spoken all things in parables, the people would have departed without benefit. He mingles things plain with things dark, that by those things which they understand they may be incited to get knowledge of the things they understand not. The multitude also is not of one opinion, but of divers wills in divers matters, whence He speaks to them in many parables, that each according to their several dispositions may receive some portion of His teaching.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
By this sower is typified the Son of God, who sows among the people the word of the Father.

Or, He was within while He was yet in the house, and spake sacraments to His disciples. He went therefore forth from the house, that He might sow seed among the multitudes.

Note that this is the first parable that has been given with its interpretation, and we must beware where the Lord expounds His own teachings, that we do not presume to understand any thing either more or less, or any way otherwise than as so expounded by Him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he spoke many things to them in parables, saying. The crowd is not of one mind but of wills differing in each person. Hence he speaks to it in many parables, so that according to their various wills they might receive different teachings. And it should be noted that he did not speak all things to them in parables, but many. For if he had said everything in parables, the people would have gone away without profit. He mixes the plain with the obscure, so that through the things they understand they may be roused to a knowledge of the things they do not understand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Behold, he who sows went out to sow. He was within, he was staying at home, he was speaking mysteries to the disciples. So he who sows the word of God went out of his house to sow among the crowds. Now it is signified that this sower who sows is the Son of God and of the Father, sowing the word among the peoples. And at the same time note that this is the first parable that has been set down with its own interpretation; and we must beware, wherever the Lord expounds his own sayings and, when asked by the disciples, discourses within, lest we wish to understand anything else, or anything more or less, than has been expounded by him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
