[[commentary]]
quote='''
Judas acts in every thing to remove all suspicion of his treachery.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And being greatly saddened they began each to say: Is it I, Lord? And surely the eleven apostles knew that they were planning nothing of the kind against the Lord; but they trust the master more than themselves, and, fearing their own frailty, they sorrowfully ask about a sin of which they had no consciousness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
