[[commentary]]
quote='''
That too which is written at the end of these verses: For he does not know what has been done; and what will be after him, who will announce it to him? we have now translated word for word from the Hebrew speech, so that we may know that there is another sense: namely, that we can neither know the things that have passed, nor understand the things that are to come as they will be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
