[[commentary]]
quote='''
The sons of Rehema: Saba and Dadan. Here Saba is written with the letter sin, but above with samech, from whom we said the Sabaeans were named. So here Saba means Arabia. For in the seventy-first psalm, where we have the kings of the Arabs and of Saba shall offer gifts, in the Hebrew it is written the kings of Saba and Saba: the first name with sin, the second with samech.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
