[[commentary]]
quote='''
Judea has mourned — or Judah — and its gates have fallen — or have been made empty — and have been darkened — or have been made dark — upon the earth, and the cry of Jerusalem has gone up. Its elders sent their lesser ones — or younger ones — to the water; they came to draw — or to the wells — and did not find water; they brought back their vessels empty. They were confounded and afflicted — or they blushed — and covered their heads; because of the desolation of the land — or and the works of the land, because they have failed —, because no rain came — or there was no rain — upon the land, the farmers were confounded, they covered their heads. In the time of drought, when the multitude suffers a famine of hearing and learning the word of God, Judea mourns, 'boasting' that it formerly had the worship of God and the 'confession' of the true faith; and its gates are either emptied or fall, which we ought to refer to the senses, through which instruction is conceived by the soul. Then all things are darkened and wrapped in darkness, and in Jerusalem it is by no means reason and the word of teaching that reign, but clamor and confusion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
