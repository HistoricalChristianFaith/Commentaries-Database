[[commentary]]
quote='''
And the number of the sons of Israel will be like the sand of the sea, which is without measure and will not be numbered. And it will be in the place where it will be said to them: You are not my people, it will be said to them: Sons of the living God. And the sons of Judah and the sons of Israel will be gathered together; and they will set over themselves one head and will go up from the land, for great is the day of Jezreel. LXX: And the number of the sons of Israel will be as the sand of the sea, which will not be measured nor can be numbered. And it will be in the place where it was said to them: You are not my people, they will be called sons of the living God. And the sons of Judah and the sons of Israel will be gathered together; and they will set over themselves one rule, and will go up from the land, for great is the day of Jezreel. We have read of the casting off of the ten tribes, and of Israel, not to be measured and no longer the people of God, condemned by perpetual indignation. Now we learn how the sons of Judah and the sons of Israel are gathered together, and set over themselves one head or rule; and go up from the land, and in the place where it was formerly said: Not my people, are called sons of the living God; and that this happens because great is the day of Jezreel. To one who is in doubt and wavering among various opinions there comes to mind that passage of Paul the Apostle writing to the Romans: What if God, wishing to show his wrath and to make known his power, endured with much patience the vessels of wrath fitted for destruction, so that he might show the riches of his glory upon the vessels of mercy which he prepared for glory; us whom he also called, not only from the Jews but also from the Gentiles, as he says in Hosea: I called not my people, my people, and: Not Obtained Mercy, Obtained Mercy. And it will be in the place where it was said to them: Not my people are you, there they will be called sons of the living God. But Isaiah cries out on behalf of Israel: If the number of the sons of Israel be as the sand of the sea, a remnant will be saved. For he is completing and cutting short the word in equity, because the Lord will make a shortened word upon the earth. And as Isaiah foretold: Unless the Lord Sabaoth had left us a seed, we would have become like Sodom, and we would have been like Gomorrah. What then shall we say? That the Gentiles, who did not pursue righteousness, have laid hold of righteousness, but the righteousness that is from faith; but Israel, pursuing a law of righteousness, has not attained to the law of righteousness. Therefore the blessed Apostle, taking up the testimony of the prophet Hosea and expounding it of the calling of the Gentiles and of the faith of those of the Jews who were willing to believe, has cut away for us every difficulty of interpretation, asserting that it was fulfilled in the times of Christ; namely, that in Israel the twelve tribes are chosen, that is, the whole people of the Jews, and in Judah those of the Gentiles who confess the rule of the Lord. But if someone who is a stranger to the faith of Christ and does not accept the authority of the New Testament, but is of the number of the circumcision, replies that the sons of Judah and the sons of Israel denote the two tribes and the ten, of which we have often spoken, then, yielding even on this point, we will show that it does no harm to our faith. But after the number of the sons of Israel has been scattered like the sand of the sea throughout the whole world, and the multitude of the people has surpassed all reckoning, then Israel, who is a captive even today, and who was formerly called Without Mercy and Not My People, will have leave to enter into concord with the two tribes, that is, Judah and Benjamin, a great part of which believed in Christ, so that faith may join those who are separated in body, and they may set over themselves one head and prince; of whom Ezekiel wrote: And one prince in their midst, David my servant, and the dead will be raised as from hell, namely Judah and Israel, who were dead in unbelief. And all these things will come to pass because great is the day of the seed of God, which is interpreted as Christ. From this it is plain that the blood of Naboth the Jezreelite went before as a type precisely so that the truth might be fulfilled in Christ. For it is in him and not in the other that great is the day of Jezreel, of which it is said: This is the day which the Lord has made: let us exult and rejoice in it. Of the third interpretation which we have undertaken, explaining Israel as the heretics and Judah as the men of the Church, this is the sense: that after the Lord has come in his glory to reign, those who were formerly called not his people will be called sons of the living God, when they have been united to Judah, that is, to the Church of God, and have had one head, Christ, and have gone up from the land, that is, from earthly senses and the lowliness of the letter, and have taken up the great day of the seed of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
