[[commentary]]
quote='''
He is reproved by the Lord, because He supposed that to be spoken parabolically, which was indeed spoken plainly. Which teaches us that that hearer is to be blamed who would take dark sayings as clear, or clear sayings as obscure.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Peter answered and said to him: Explain this parable to us. And he said: Are you also still without understanding? What had been said openly and lay plain to the hearing, the apostle Peter thinks was spoken in a parable, and in a plain matter he seeks a mystical understanding; and he is rebuked by the Lord for thinking that something was said in parable which he had spoken plainly. From this we observe that a hearer is at fault who wishes to understand either obscure things plainly or things plainly said obscurely.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
