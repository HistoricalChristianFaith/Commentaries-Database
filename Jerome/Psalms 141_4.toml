[[commentary]]
quote='''
We read in the prophet David: To make excuses in sins, because many put forward, as it were, just pretexts for their sins, so that what they commit by will they may seem to sin by necessity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
