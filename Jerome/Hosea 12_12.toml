[[commentary]]
quote='''
Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept watch. But by a prophet the Lord brought Israel out of Egypt, and by a prophet he was preserved. LXX: And Jacob withdrew into the plain of Syria, and Israel served for a wife, and for a wife he guarded; and by a prophet the Lord brought Israel out of Egypt, and by a prophet he was preserved. It seems that, without reason and without prophetic order, after the idol of Gilead and Gilgal and the altars like heaps of stones, he suddenly chose to narrate the history of Genesis concerning Jacob; which is at once resolved by one who remembers having read above concerning Jacob: In the womb he supplanted his brother, and in his strength he was made upright with the angel; and he prevailed over the angel and was strengthened; he wept and besought him: in Bethel he found him, and there he spoke with us. This Jacob, therefore, was not strengthened by the angel in vain; but because he fought the whole night and overcame his adversary, so that from this he might learn not to fear his brother, for fear of whom he was fleeing into Syria to Laban his mother's brother; and he served seven years for a wife, Rachel; and for Leah he guarded the sheep of his father-in-law Laban for the same span of years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
