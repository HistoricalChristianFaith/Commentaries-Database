[[commentary]]
quote='''
And it came to pass, when the cankerworm that had come after the locust had finished eating the grass of the land, and the prophet understood what he was seeing, he turns to prayer and says: O Lord God, be merciful, I beseech you. I do not wish my words to be fulfilled in the overthrow of my people; I do not wish to have been chosen from the number of the shepherds for this, that I should announce the ruin of the ten tribes. For who will be able to raise up Jacob, except you alone? When you strike him down, there is no one to raise him up. Jacob is very small, and destroyed by the frequent incursions of enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And when it has consumed the hay and the stubble of our land, whoever are saints among the people will pray for pardon and will say: O Lord God, be merciful. For who else will be able to raise up Jacob? Which of the physicians can heal the αἱμοῤῥοῦσαν (the woman with the issue of blood), except you alone, at the touch of whose fringe health at once returns? For Jacob is very small, or of small number, because no traces of virtues, or only a few, have remained in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
