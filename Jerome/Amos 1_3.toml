[[commentary]]
quote='''
You must slay the allurements to vice while they are still only thoughts and dash the little ones of the daughter of Babylon against the stones where the serpent can leave no trail. Be wary and lay claim to the Lord's promise: "Let them not have dominion over me: then shall I be upright and I shall be innocent from the great transgression." For elsewhere also the Scripture testifies, "I will visit the iniquity of the fathers upon the children unto the third and fourth generation." That is to say, God will not punish us at once for our thoughts and resolves but will send retribution upon their offspring or upon the evil deeds and habits of sin, which arise out of the offspring. As he says by the mouth of Amos, "For three transgressions of such and such a city and for four I will not turn away the punishment thereof."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_008.html'
source_title="LETTER 8"

[[commentary]]
quote='''
Thus says the Lord: For three crimes of Damascus, and for four, I will not turn him back, because they threshed Gilead with iron carts. LXX: And the Lord said: For three impieties of Damascus, and for four, I will not turn away from them, because they sawed with iron saws the women with child in Gilead. For the threshing sledges, which in Hebrew are called arsoth, and were translated by Theodotion iron wheels, which we have rendered iron carts, the Seventy translated iron saws. It is, moreover, a kind of cart which rolls on iron, toothed wheels underneath, so that, when the grain has been shaken out, it may crush the stubble on the threshing floors and break up the chaff into fodder for the beasts of burden, because of the scarcity of hay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
We have spoken briefly about the causes of the different translation; now let us pass on to the sense of what has been said. First the word of God is directed against Damascus, in which Hazael reigned, who, at the time when Amos was prophesying, was pressing hard upon Israel, that is, the ten tribes, so much so that, after Ahab king of Israel had been overcome at Ramoth-gilead, he slaughtered and crushed the whole region which was called Gilead, and which had fallen as an inheritance to the half-tribe of Manasseh, like threshing sledges threshing grain on the threshing floors. This the prophet Elisha speaks of more fully in the volume of Kings, where we read it written: And he stood with him, and was troubled until his face was flushed; and the man of God wept. Hazael said to him: Why does my lord weep? And he answered: Because I know what evils you are going to do to the sons of Israel: you will set their fortified cities on fire, and you will kill their young men with the sword, and you will dash the little ones, and you will rip up the women with child. And Hazael said: For what am I, your servant, a dog, that I should do this great thing? And Elisha said: The Lord has shown me that you will be king of Syria. But as for what follows in the prophet:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And what is said at the beginning: For three crimes of Damascus, and for four, I will not turn him back, and according to the Seventy: Shall I not turn away from him?, that is, from the people of Damascus, or Aram, that is, the Syrian, can have this sense according to the history: If he had persecuted my people once, or a second time, I would grant pardon; but now, since he has shown himself cruel a third and a fourth time, so that he crushed the captive multitude with iron carts, ought I not to chastise him with blows? Ought I not to turn the face of my clemency away from him? But according to tropology we can say this: the first sin is to have thought what is evil; the second, to have consented to perverse thoughts; the third, to have carried out in deed what you have resolved in your mind; the fourth, not to repent after the sin, and to be pleased with oneself in one's own offence. This all the heretics do, who not only think and do evil, but by their doctrine deceive all the simple, and, after the manner of the people of Damascus, which is interpreted drinking blood, drink the blood of those whom they have deceived. For sins of this kind, says the Lord, is it not right that I should chastise them with blows and turn my face away from them? So that those who do not see the truth of my dogmas may be overwhelmed with darkness by the turning away of my face. For they have crushed, or cut asunder, with iron carts the women with child of Gilead. These are the women with child of whom the Lord speaks in the Gospel: Woe to those who are with child, and to those who give suck in those days. The women with child are the souls of believers, who at the beginning of faith can say: From fear of you, Lord, we have conceived and been in labour; and if they have not been cut up and pierced with iron by the carts and the iron and toothed wheels, of which the psalmist says: The sons of men, their teeth are weapons and arrows, they can also say what follows: And we have brought forth; we have made the spirit of your salvation upon the earth. And consider at the same time that they cannot cut up men of mature age, but only those who are still in the womb, or who cannot take solid food and are still nourished with the milk of infancy. These women with child, moreover, are of Gilead, which is interpreted transfer or migration of the testimony. For they have migrated from the Church into heresy, and have transferred the testimonies of God which they had received before to foreign borders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
This is what the prophet also says: 'For three and four sins I will not turn her back, says the Lord.' And he says this eight times. Now Amos speaks this, that is: you thought, I pardoned: you did it, I pardoned: you did not do penance, I pardoned: were you obliged even to teach evils? This is what is said, For three and four sins I will not be angry with you, says the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_001.html'
source_title="Homily 1, on Psalm 1"
