[[commentary]]
quote='''
The divine word also promises that he will show wonders to his people and to the sheep of his inheritance: Then, he says, the nations shall see, and shall be confounded in all their strength, because they had once laid waste and prevailed against the people of God; and their confusion will bring them progress, when they have understood their own evils. For they will put their hands upon their mouth, and their evil works will take from them all freedom of speaking. But just as the hands of the impious nations close their mouths, so the hands of the just will open their mouths, as they receive from good work the faculty of speaking with God. Their ears too will grow deaf, because malice has not only blinded the gaze of the eyes but has also made the ears grow deaf; for they would not hear the voice of the charmers, and of the sorcerer who charms wisely. And according to Isaiah: With their ears they heard heavily, although it is much less to hear heavily than not to hear at all, and to become deaf so as not to hear the word of truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
