[[commentary]]
quote='''
In commentaries and expositions, whose custom it is to set down the differing opinions of interpreters, I am accustomed to insert language of this kind: 'Some say this, others assert that, certain ones think thus.' For this both wretched Grunnius himself and, many years later, the disciple of Jovinian and of him have slandered and still slander me, saying that I set down my own opinions under others' names, which I do for the sake of kindness, so as not to seem to tear anyone apart by name. Since, then, kindness has been turned into slander, I now say both to him who is dead and to this one who lives and tries to restore his heresy, that their master Origen refers this passage to Christ: that he was torn like a ring from the hand of God the Father and sent into the land of captivity, into the valley of tears, and handed over to the cross; and that his mother too — no doubt the synagogue — was taken and cast out. And in recalling these things he is not afraid to understand what follows also: Land, land, land, hear the word of the Lord! Thus says the Lord: write this man abominated or barren, and the rest, of the Lord of majesty. And he writes this, lest his disciples dare deny it, in the fifth book of the Stromateis.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
