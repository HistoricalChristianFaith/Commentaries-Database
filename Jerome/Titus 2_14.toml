[[commentary]]
quote='''
Often considering with myself what the word περιούσιον might mean, and asking the wise men of this age whether they had perhaps read it anywhere, I could never find anyone to explain to me what it signified. Therefore I was compelled to have recourse to the old instrument, from which I supposed the Apostle too had taken what he had said. For a Hebrew of the Hebrews, and as to the law a Pharisee, he was surely setting down in his Epistle what he knew he had read in the Old Testament. So in Deuteronomy I found: "For you are a holy people to the Lord your God, and it has pleased the Lord your God in you that you should be to him a people περιούσιον out of all the peoples that are upon the face of the earth" (Deut. 7:6). And in the hundred and thirty-fourth Psalm, where we have, "Sing psalms to his name, for it is sweet: for the Lord has chosen Jacob for himself, Israel for a possession (in possessione) for himself" (Ps. 134:3–4): for what is "for a possession" (in possessione), in the Greek it is written εἰς περιουσιασμὸν, which Aquila and the Fifth Edition indeed expressed as εἰς περιούσιον. But the Seventy and Theodotion, translating περιουσιασμὸν, made a change of syllable, not of sense. Symmachus, then, for what is περιούσιον in the Greek, SGOLLA (סגלה) in the Hebrew, expressed ἐξαίρετον, that is, "choice" (egregium), or "special" (præcipuum); for which word, using the Latin language in another volume, he rendered "peculiar" (peculiarem). Rightly, then, did Christ Jesus, our great God and Savior, redeem us with his blood, to make the Christian people peculiar to himself, a people that could then be peculiar if it proved an emulator of good works. Hence also what is written in the Gospel according to the Latin translators, "Give us this day our daily (quotidianum) bread" (Matt. 6:11), is better rendered in the Greek "our bread ἐπιούσιον", that is, "special", "choice", "peculiar": namely him who, coming down from heaven, says, "I am the bread that came down from heaven" (John 6:51). Far be it, indeed, that we, who are forbidden to take thought for the morrow, should be commanded in the Lord's prayer to ask for that bread which in a little while is to be digested and cast out into the drain. Nor is there much difference between ἐπιούσιον and περιούσιον: for only the preposition has been changed, not the word. Some think that the bread in the Lord's prayer is called ἐπιούσιον because it is above all οὐσίας, that is, above all substances. If this is accepted, it does not differ much from the sense we have set out. For whatever is choice and special is outside all things and above all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
