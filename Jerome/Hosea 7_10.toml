[[commentary]]
quote='''
Hence the pride of Israel will be humbled, not after a long time, but now and in the present; for this is what he means by before his face; and it was being humbled because it had lifted itself up and trusted not in God but in the size of its army, and because God resists the proud, but gives grace to the humble; for pride, that is, gaon, the Seventy, after their custom, translated ὕβριν, that is, outrage. And because he had said above: Ephraim has become a loaf baked under the ashes which is not turned over, and this seemed ambiguous and did not make clear enough what he meant, he now puts it more plainly: They have not returned to the Lord their God; and they have not sought him in all these things. For if they had returned to the Lord their God, they would surely have heard God speaking through Jeremiah: Return to me, and I will return to you. And though they had done so much, they did not seek him whom they had lost through their own fault.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
And though the pride of the heretics is humbled, or the insolence which they daily offer to churchmen, they do not return to the Lord; but in all these things they by no means seek him, because they have been heated like an oven, and they have not sought him; they have devoured their judges, and the kings fell together; nor is there anyone who cries to the Lord. All these things they suffered so that they might seek the Lord, whom they refused to seek.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
