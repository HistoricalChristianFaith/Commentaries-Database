[[commentary]]
quote='''
The third punishment of those whom discord has separated is that they lose the wings by which they were formerly borne on high, and fall headlong from heaven to earth, and are held by the fowler, who is better called ἰξευτὴς, because with clinging birdlime he catches free birds which of their own will come down to earthly things. Of these it is written in Proverbs: Not unjustly are nets spread for birds. For just is the ruin of sinners, who, though they had the wings of a dove and ought to have flown through the air, were pressed down to earthly things by the weight of their sins, and through their own vice stuck fast to the birdlime. Of this we read in the Apostle: He who cleaves to a harlot becomes one body with her. The fourth punishment of those in discord is that they are caught in the snare, which is set not in heaven but on the earth; the saint glories in having escaped it, and says: Our soul, like a sparrow, has been snatched from the snare of the hunters; the snare is broken, and we are set free. This is the broken snare of which the Apostle speaks to believers: God will crush Satan under your feet swiftly. And again we read in David: Beside the path they have set a stumbling block for me. For they cannot deceive any of the simple among believers unless they put forward the name of Christ, so that, while we think we are finding Christ, we go on to the Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
