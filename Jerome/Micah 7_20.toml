[[commentary]]
quote='''
He will give truth to Jacob, and mercy to Abraham, so that to the people that is a supplanter, and new, and always set in wrestling, he may render his truth in Christ, and to the multitude of the nations — for Abraham is called the father of many nations — he may grant mercy, as he swore to those who were the fathers of our faith according to the days of old, that out of the whole multitude of men he would save some in truth, others in mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
