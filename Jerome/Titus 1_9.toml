[[commentary]]
quote='''
To Titus he gives commandment that among a bishop's other virtues [which he briefly describes] he should be careful to seek a knowledge of the Scriptures. A bishop, he says, must hold fast "the faithful word as he has been taught that he may be able by sound doctrine both to exhort and to convince the gainsayers." In fact, want of education in a clergyman prevents him from doing good to any one but himself. Even if the virtue of his life may build up Christ's church, he does it an injury as great by failing to resist those who are trying to pull it down.
'''
source_url='https://www.newadvent.org/fathers/1102053.htm'
source_title="LETTERS 53.3"

[[commentary]]
quote='''
Finally, let him hold fast the faithful word which is according to doctrine, so that, just as the word of God is faithful and worthy of all acceptance, so he too may show himself such that everything he says is deemed worthy of faith, and his words are the rule of truth. Let him be able also to comfort those who are tossed by the whirlwinds of this age, and through sound doctrine to destroy weak precepts. Now doctrine is called sound to distinguish it from languid and weak doctrine. Let him also be such as to refute those who contradict: the heretics or the Jews, and the wise men of this age. And indeed the earlier qualities which he set down among the virtues of a bishop pertain to life. But this which he says, That he may be able to comfort in sound doctrine, and to refute those who contradict, is to be referred to knowledge. For if a bishop has only a holy life, by living so he can benefit himself. But if he is learned in doctrine and speech, he can instruct himself and the others; and not only instruct and teach his own, but also beat back the adversaries, who, unless they are refuted and convicted, can easily pervert the hearts of the simple. This passage tells against those who, giving themselves to sloth and leisure and sleep, think it a sin to read the Scriptures, and despise as garrulous and useless those who meditate on the Law of the Lord day and night, not noticing that the Apostle, after the catalogue of the bishop's manner of life, likewise commanded doctrine too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
