[[commentary]]
quote='''
Will you not know? Will you not hear? Has it not been announced to you from the beginning? Have you not understood the foundations of the earth? He who sits upon the circle of the earth, and its inhabitants are like locusts; who stretches out the heavens like nothing, and spreads them out like a tent to dwell in; who makes the searchers of secrets as though they were not; he has made the judges of the earth as void. Indeed, their stock was neither planted, nor sown, nor rooted in the earth: suddenly he blew upon them and they withered, and the whirlwind will carry them off like stubble. And to whom have you likened me and made me equal? says the Holy One. Lift up your eyes on high, and see who has created these things: who brings out their host by number, and calls them all by name. Because of the greatness of his might and strength and power, not one was left behind. LXX: Will you not know? Will you not hear? Has it not been announced to you from the beginning? Have you not known the foundations of the earth? He who holds the circle of the earth, and its inhabitants as locusts; who has set up the heaven as a vault, and stretched it out as a tent to dwell in; who makes princes reign as nothing, and has made the earth as nothing. For they shall not be planted, nor sown, nor shall their root be made firm in the earth. He blew upon them, and they were dried up, and the tempest will take them up like stubble. Now therefore to whom have you likened me? Shall I be made equal to them? said the Holy One. Lift up your eyes on high, and see who has shown all these things. He who brings out his array by number, he will call them all by name, from much glory and in the strength of might: nothing is hidden from you. From the beginning, he says, I taught you by the natural law, and afterward through Moses I testified by the written Law that idols were nothing, and that the Creator of the world was himself God, who had founded so great a mass of earth upon the seas and set it upon the rivers, so that the heaviest element hangs over thin waters at the will of God, who like a king sits upon the circle of the earth: from which some contend that it is like a point and a globe; and its inhabitants are like locusts. For if we consider the various nations in the whole world, from Ocean to Ocean, that is, from the Indian sea to the British, and from the Atlantic to the frozen North, where the waters congeal and beautiful amber grows solid, we see the whole race of men in between dwelling like locusts. Why then is earth and ashes proud? Since the heaven, or rather, to use the authority of the Scriptures, the heavens, are stretched out like a vault; or, as it stands in the Hebrew, like DOC, of which we spoke above, for which the Seventy there translated spittle: and the one word they rendered now spittle, now vault, that is, arch; and since he stretches out their so great breadth above like a tent and a pavilion, so as to cover men like a roof and make them dwell as in a most spacious house: why should we wonder if the small bodies of men are counted like locusts and tiny creatures? Again, those who in this place too contend that the heaven hangs over the earth as a ἡμικύκλιον, and that the heaven is in the likeness of a sphere, misuse the word vault, as though the middle part of a sphere covered the earth: whereas in the Hebrew we have read not vault but DOC, that is, the finest dust. For which the spittle that is spat upon the ground, and is mixed with dust, and perishes, shows that the whole greatness of bodies is to be counted as nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
