[[commentary]]
quote='''
The Jews, then, promise themselves, or rather dream, that in the last time they will be gathered by the Lord and brought back to Jerusalem. And not content with this happiness, they assert that God himself will deliver the sons and daughters of the Romans into their hands, so that the Jews may sell them, not to the Persians and Ethiopians and the other nations that are near, but to the Sabeans, a most distant nation, because the Lord has spoken and avenges the injury of his people. So say they and our Judaizers, who promise themselves a thousand-year kingdom within the borders of Judea, and a golden Jerusalem, and the blood of victims, and sons and grandsons and incredible delights, and gates adorned with a variety of gems. But let us say that the Lord both raised up after his coming, and raises up daily, and will raise up those whom manifold error had led out of their borders. And he says beautifully, I will raise up, as of those lying down and fallen, so that those who lay in heresy may stand in the Church, repaying the heretics what they had done: so that he may deliver their sons and daughters, whom they had instructed both in mystical and in carnal things, into the hands of the sons of Judah, into the hands of those who have stood forth as princes of the Churches, and are equipped with the armor of the Apostle, and have the shield and spear of the Old and New Instrument; so that, when they have taken them, they may sell their sons and daughters to the Sabeans, and make them captives, that they may be far from their own borders; and, converted to better things, may begin to be subject to the dogmas of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
