[[commentary]]
quote='''
But if they are separated by discord, at once the roaring lion will attack them, of whom the apostle Peter also says: Your adversary the devil, like a roaring lion, goes about seeking whom he may devour. This roaring lion does not move about in sown fields, not in vineyards, not in olive groves, nor among the fruit-bearing trees, which praise God, but where there are forests and untilled ground and wild beasts dwell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
For it is said in the epistle of St. Peter: 'Our adversary the devil goes about like a roaring lion seeking whom he may devour.' The devil does not quickly fight against anyone by great faults, but by small ones; so that he may somehow or other enter, and lord it over the man, and afterward drive him into greater faults. Not through fornication, not through avarice, but through lesser faults does he enter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
