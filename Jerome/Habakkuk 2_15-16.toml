[[commentary]]
quote='''
Now these things are said through the metaphor of a drunken man, disgraced by nakedness, because Nebuchadnezzar made all men drunk with the cup of his fury, and saw them all stripped and captive, and those who had once been glorious were reduced to the utmost slavery; for this is what he says: He is filled with shame instead of glory, so that we supply "the friend" and "the neighbor", or the partner in the kingdom, who drank your cup, O Nebuchadnezzar. Hence, because you have made very many drunk, you also drink from the cup of the Lord and fall into a stupor; you will be surrounded by the punishments of the right hand of the Lord, and with the shame of your vomit you will discharge all that you had swallowed, and from lofty glory you will be brought down to the utmost evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
I heard at Lydda one of the Hebrews, who was called a wise man among them and a δευτερώτης (a teacher of the traditions), telling a tale of this sort: Zedekiah, he said, blinded by King Nebuchadnezzar at Riblah, that is, Antioch, and mocked in various ways, was led to Babylon. There, when one day Nebuchadnezzar was celebrating the festivities of a banquet, he ordered a potion to be given to him which, once drained, would loosen the drinker's belly into a flux; and Zedekiah, suddenly brought in before the faces of the banqueters and compelled by the force of his belly, was befouled with excrement; and this, he said, is what Scripture now says here: Woe to him who gives drink to his friend, putting in his gall and making him drunk, that he may look upon his nakedness, and shame instead of glory; namely, that he who had been a most powerful king was brought by him to such disgrace. Hence God also threatens him that he himself will drink a potion of this sort, and suffer everything that Zedekiah suffered. How ridiculous this is, you know without my saying it. For if what follows: Drink, you also, and fall into a stupor, and the cup of the right hand of the Lord will surround you, and the vomit of shame will be upon your glory, they understand not of a cup but of the evils which Nebuchadnezzar is to drink, then that cup too with which drink was offered to Zedekiah must be understood as evils, and not, as they will have it, as a καθαρτικὸν (a purgative). But if they say that it really happened, and that a potion of this sort was mixed, as I related above, then this cup too which Nebuchadnezzar is to drink must be reckoned full of a καθαρτικῷ, so that God Sabaoth and the Lord Almighty, for a great vengeance, offers Nebuchadnezzar a καθαρτικὸν to drink, and makes him befouled with his own excrement. So much against the Jewish tradition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
