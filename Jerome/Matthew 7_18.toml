[[commentary]]
quote='''
We would ask those heretics who affirm that there are two natures directly opposed to each other, if they admit that a good tree cannot bring forth evil fruit, how it was possible for Moses, a good tree, to sin as he did at the water of contradiction? Or for Peter to deny his Lord in the Passion, saying, I know not the man? Or how, on the other hand, could Moses' father-in-law, an evil tree, inasmuch as he believed not in the God of Israel, give good counsel?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
(Verse 18 and following) A good tree cannot bear bad fruit, nor can a bad tree bear good fruit. Let us ask the heretics who claim that there are two contradictory natures, if according to their understanding, a good tree can never bear bad fruit, then how did Moses, a good tree, sin by striking the rock (Deut. 32)? And how did David, after killing Uriah, sleep with Bathsheba (2 Sam. 11)? And how did Peter, during the Passion of the Lord, deny Him, saying: 'I do not know the man' (Matt. 26:72)? Or what connection is there between Jethro, the father-in-law of Moses, a bad tree who did not believe in the God of Israel, giving good advice to Moses (Exod. 18)? And how did Achior, in speaking to Holofernes, say something useful (Judith 5)? And as the comedian said (which the Apostle confirmed): 'Evil company corrupts good morals' (1 Cor. 5). And when they do not find what to answer, let us infer that Judas (John 13) , once a good tree, bore bad fruits after betraying (or handing over) the Savior; and that Saul (Philippians 3) , a bad tree at the time he persecuted the Church of Christ, bore good fruits afterwards, when he was transformed from a persecutor into a vessel of election (Acts 9) . Therefore, a good tree does not bear bad fruits as long as it perseveres in the pursuit of goodness; and a bad tree remains in the fruits of sin as long as it does not convert to repentance. For no one remains in what he was, he begins to be what he has not yet begun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
That saying too which is spoken by the Savior, "A good tree cannot bring forth evil fruits, nor an evil tree bring forth good fruits" (Matt. 7:18), I think was pronounced not so much about men as about the fruits of the flesh and of the spirit: because neither can the spirit ever commit those vices which have been enumerated among the works of the flesh, nor can the flesh abound in these fruits which arise from the spirit. It can happen, however, through the negligence of the one who possesses it, that the spirit which dwells in a man does not have its fruits; and, on the contrary, that the flesh, its works having been put to death, ceases to sin. Yet they do not go so far that the tree of the spirit, when neglected, bears the works of the flesh, and the tree of the flesh, when cultivated, puts forth spiritual fruits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
However the proper sense of the names stands, this is to be said: that evil things are turned into good, and virtues spring up in place of vices, that is, righteousness in place of iniquity, fortitude in place of rashness, temperance in place of luxury, prudence in place of folly. Let us give examples of our forebears: Matthew and Zacchaeus and the publicans were saliunca, and στοιβή, and useless stalks, and κονύζη of bitter taste and most loathsome smell, saying: My scars have rotted and are corrupted, because of my folly (Ps 37 [38]:6). These, suddenly changed into Apostles, became cypress and fir and myrtle, of the best fragrance and needful for various works. Paul too, the persecutor of the Church, when he heard from the Lord, Saul, Saul, why do you persecute me? It is hard to kick against the goad (Acts 9:4, 5), was a nettle, having the stings of persecution. But when he preached the Gospel in the whole world and could say, We are the good odor of Christ (2 Cor 2:15), he is rightly called a cypress and a myrtle. Harlots and publicans go before the Pharisees into the kingdom of God, and the thief passes from the cross into paradise (Matt 21). Therefore what is said in the Gospel, A good tree cannot bear evil fruits (Luke 6:43; Matt 7:18), by no means refers to a property of nature, as the heretics would have it, but to the choice of the mind. Finally it is added: Either make the tree good, and its fruits good. From this it is clear that each one by his own will makes his soul a good or an evil tree, whose fruits vary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
