[[commentary]]
quote='''
If winepresses of this kind have made us drunk, we shall dwell in Jerusalem, in which there shall be no more anathema, that is to say curse and abomination. Hence the Apostle also says: If anyone does not love the Lord, let him be anathema. And in another place: No one speaking in the Spirit of God says anathema to Jesus. And for the salvation of his brothers he longs to be anathema, wishing to imitate his Lord, who, though he himself was not a curse, was made a curse for us. And when every anathema has been taken away, Jerusalem shall dwell secure and confident, expressing in itself that saying: He who trusts in the Lord is blessed, and: It is better to trust in the Lord than to trust in man; of which security and confidence the prophet Jeremiah makes mention: Blessed shall be the man who trusts in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
