[[commentary]]
quote='''
The heretics are never satisfied with their error, nor do they cease from the foulness of fornication, and daily, by not keeping the law and the holy Scriptures, they forsake the Lord, they rave and become drunk; and having lost the judgment of the mind, they worship idols which they have fashioned from their own heart, and are possessed by the spirit of fornication.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
