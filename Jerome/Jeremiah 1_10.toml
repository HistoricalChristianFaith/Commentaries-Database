[[commentary]]
quote='''
And in the beginning of Jeremiah too something of the kind is written: Behold, I have put my words into your mouth; behold, I have set you today over nations and kingdoms, to root up and to undermine, and to destroy, and to build, and to plant. A very bad building is destroyed so that afterwards a good building may be put up; a wicked planting is rooted up so that a planting may be set in its place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"

[[commentary]]
quote='''
Behold, I have set you today over the nations and over the kingdoms, to pluck up and to destroy and to ruin and to scatter and to build and to plant. This, which we have added from the Hebrew, 'scatter' or 'put down', is not found in the LXX. And it must be considered that two joyful things follow four sad ones. For good things could not be built unless evil things had been destroyed, nor the best things planted unless the worst were rooted out. For every planting which the heavenly Father has not planted shall be rooted out, and the building which does not have its foundation upon the rock but has been raised upon the sand is undermined and destroyed by the word of God. And that which Jesus will consume with the spirit of his mouth and will destroy by the coming of his presence, namely every sacrilegious and perverse doctrine, he will ruin forever. Further, the things which are lifted up against the knowledge of God and trust in their own wisdom, which is foolishness with God, he will scatter and put down, so that lowly things may be built in their place, and in the place of the former things, which have been destroyed and plucked up, the things which accord with the truth of the Church may be raised and planted, and that may be fulfilled which the Apostle says: you are God's building, God's husbandry. Many understand this place of the person of Christ. For 'Jeremiah' means 'the exalted one of the Lord', who destroyed the kingdoms of the devil, which the devil had shown him on the height of the mountain, and who brought to ruin the adverse powers, blotting out on the cross the handwriting of errors. Of these the psalm too, after the truth of the history, speaks tropikōs [figuratively]: why have the nations raged and the peoples meditated vain things? The kings of the earth stood up, and the princes gathered together into one. In place of these, plucked up, destroyed, ruined and dragged down to lower things, the Church of God is built and planted. But concerning the person of Jeremiah there is no doubt; for we read in what follows that he takes in his hand a cup full of unmixed wine and is commanded to give drink to all the nations round about.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
