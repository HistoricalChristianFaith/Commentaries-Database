[[commentary]]
quote='''
And those who formerly fought for Esau and Idumea with the art of dialectic, and were in the garrisons of Theman, which means consummation, will cease to fight for their former masters. Or else: those who previously promised themselves the light of knowledge, and thought that they were at noonday, will fear and be terrified, as a churchman gets the better of their sophisms, so much so that no one remains who could do battle, whether with the counsel of a king or with the strength of a fighter, for the pride of the heretics and their false doctrine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
