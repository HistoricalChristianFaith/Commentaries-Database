[[commentary]]
quote='''
Will you not then fear me, says the Lord, and will you not grieve before my face — or fear — ? I who set the sand as a boundary for the sea, an everlasting precept, which it will not pass. And they will be moved and will not be able — or it will be troubled and will not be able — and its waves will swell — or will sound — and will not pass over it. But to this people there has come to be an unbelieving and provoking heart, and they have withdrawn and gone away, and they have not said in their heart: Let us fear the Lord our God, who gives us the early and the late rain in its season, keeping for us the fullness of the yearly harvest! He recounts his benefits in order to convict the ungrateful. 'Me,' he says, 'you will not fear, I who have bestowed such great things on you? I do not ask for the love of the perfect, but for the fear of beginners, I who set the sand as a boundary for the sea, I who by my precept have reined in at the shores so mighty an element and the immense masses of the deeps, according to that which is written: He set a precept, and it will not pass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
