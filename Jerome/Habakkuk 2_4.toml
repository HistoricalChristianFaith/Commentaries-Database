[[commentary]]
quote='''
But since in the Law no one is justified before God, it is manifest that the righteous lives by faith. But the Law is not of faith, but he who has done these things shall live in them.

The example by which it is proved that the righteous lives by faith, and not by works, he took from Habakkuk, which the Seventy translators rendered thus: "But the righteous lives by my faith" (Hab. 2:4). Aquila and Theodotion: "But the righteous lives by his faith", that is, God's. It must therefore be considered that he did not say "a human being" or "a man lives by faith", lest he should give occasion for despising the works of the virtues; but the righteous lives by faith: so that whoever was faithful and was to live through faith could not otherwise come to faith, or live in it, unless he had first been righteous, and had ascended by purity of life as by certain steps to faith. It can therefore happen that someone is righteous, and yet does not live, being without faith in Christ. If a scruple is stirred in the reader, let him take up the words of Paul, in which he says of himself: "As to the righteousness which is in the Law, without reproach" (Phil. 3:6). Paul therefore was at that time righteous in the Law, but could not yet live, because he did not have within himself Christ, who says: "I am the life" (John 11:25). Believing in him afterwards, he began also to live. Let us too make something similar to what is said, the righteous lives by faith; and let us say: the chaste lives by faith, the wise lives by faith, the brave lives by faith, and from the remaining parts of the virtues let us bring forward a like sentence against those who, not believing in Christ, think themselves brave and wise, temperate or righteous: so that they may know that no one lives without Christ, without whom every virtue is in vice. The present testimony can also be read thus: that the righteous by faith, so that there is then added, lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
[[commentary]]
quote='''
But if anyone is unbelieving of this pledge of mine, and while I say: Coming he will come, and will not tarry, begins to doubt and to waver silently within himself, thinking that what delays for a time will not come, this man will displease my soul, according to that saying: Your new moons and sabbaths my soul hates. But that God spoke of his soul, we ought to take for mind and thought, so that the meaning is: he will displease my sense. And just as he will displease who, when I promise, doubts that what I pledge will come, so the just man who believes my promise will live in his faith. With these lines, as it were, the picture of this chapter has been sketched.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
But if your faith doubts, and you think that what I pledge will not come to pass, you will have it as a great punishment that you will displease my soul. But the just man, who believes my words and does not doubt the things I promise, will have as reward life everlasting. Nor ought you at once to charge, either in my slaying you or in my giving life to him, that there is respect of persons with me; for he himself is the cause of his own giving of life, who lives by his faith, just as you, by having withdrawn yourself and refused to believe, have displeased my soul. And in these words there is plainly a prophecy of the coming of Christ. Hence the question that was put forward is also solved: that until he comes, iniquity rules in the world, and judgment does not come to its end, and the true Nebuchadnezzar catches men with his net and dragnet like little fish, and the rational animal like a creeping thing that has no prince.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
Moreover, why the Apostle, writing to the Romans, made use rather of the testimony of the LXX, But the just shall live by my faith, and not of what is found in the Hebrew, the reason is plain. For he was writing to Romans, who did not know the Hebrew Scriptures; nor was he concerned about the words, since the sense was safe, and the present argument suffered no harm from it. Otherwise, wherever the sense is different, and it is written one way in the Hebrew and another in the LXX, note that he uses those testimonies which he had learned from Gamaliel, the teacher of the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
