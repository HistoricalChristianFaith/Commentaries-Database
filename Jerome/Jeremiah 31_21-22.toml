[[commentary]]
quote='''
Set up for yourself watchtowers, put for yourself bitternesses, direct your heart into the straight way in which you walked; return, virgin Israel, return to these your cities! How long will you be dissolved in delights, wandering daughter? for the Lord has created a new thing upon the earth: a woman shall encompass a man. LXX: set up for yourself lookouts, make punishment, give your heart to your shoulders; the way in which you walked, return, virgin Israel, return to your cities mourning! How long will you turn away, despised daughter? for the Lord has created you as salvation for a new planting; in your salvation men shall go about. Where we said: how long will you be dissolved in delights?, Symmachus put: how long will you sink into the deep? Now I have set out each edition in full, in order to show that a most obscure passage, one containing the mysteries of the Church, was either unknown to or omitted by the Seventy — or whoever else translated this prophet. The Hebrew word 'sionim' is rendered either as 'lookouts' or as 'watchtowers', as Aquila and Symmachus translated. Hence I wonder what the common edition meant by putting 'Sion' in place of 'sionim', that is, 'lookouts', and so confusing the reader's understanding that he would think that after Ephraim the word of God had suddenly been addressed to Zion and to the tribe of Judah, although the discourse is continuously to Ephraim, to whom he also spoke above: hearing I heard Ephraim, and: Ephraim is an honorable son to me or a delicate child, and to whom he now also speaks: 'set up for yourself watchtowers or lookouts, to announce to you beforehand that so great a happiness of all things is coming.' And what follows, 'bitternesses', which in Hebrew are called 'themrurim', for which Symmachus translated 'changes', indicates this: that she ought to weep, either for her ancient sins or from the greatness of her joy, and to be converted to God with her whole mind, and to set or direct her heart into the way by which she set out; for by that way she will return. And what the Seventy said in place of this: give your heart to your shoulders, signifies that she ought to join her thoughts to works, or to contemplate the shoulders of those carrying her, bringing her back from captivity; which Isaiah sets out more fully in the camels and chariots and litters, asserting that they are to be brought back. 'Return', he says, 'virgin Israel, return to your cities, which you deserted when they were captive! How long will you be dissolved in negligence and wander in deep error? Look at what I am about to say, and attend diligently to whence so great a blessedness is to be hoped for by you; hear what you had never known before! The Lord has created a new thing upon the earth: without the seed of a man, without any intercourse and conception, a woman shall encompass a man in the bosom of her womb, who, according to the increments of age indeed, through wailings and infancy will be seen to advance in wisdom and age, but a perfect man will be contained in a woman's belly for the usual months.' Hence both Symmachus and Aquila translated in accordance with our edition. But what the common edition meant in this place I could say, and could find some sense, were it not sacrilege to argue about the words of God with human sense. Theodotion, however, himself also agreeing with the common edition, translated: the Lord has created a new salvation, in salvation man shall go about, putting the singular for the plural; and at the same time this too is to be noted, that the nativity of the Savior and the conception of God is called 'creation'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
