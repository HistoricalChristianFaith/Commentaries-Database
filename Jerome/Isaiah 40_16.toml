[[commentary]]
quote='''
And at the same time, to draw men away little by little from idolatry, he takes away the ceremonies of victims, and teaches that all the wood of Lebanon and the herds that graze on it could not suffice for his burnt offerings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
