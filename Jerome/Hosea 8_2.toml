[[commentary]]
quote='''
Hence in the time of necessity and distress, when the captivity comes, they will call upon me and say: My God, we know you, Israel; we who are called Israel know you and acknowledge you, and we keep the ancient name of Jacob, who pleased you, so that we are called Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
