[[commentary]]
quote='''
What more? All, like an oven, were heated with the fire of idolatry, and devoured their judges, so that even one who could have been good by nature and could have remembered the religion of the Lord, seeing both princes and people subject to the calves and thinking them gods, is himself also devoured by the crime. Finally, all the kings of Israel fell, and walked in the ways of Jeroboam son of Nebat, who made Israel sin, and none was found who abandoned the idols and returned to God. These things we have spoken according to the tradition of the Hebrews, more boldly than knowingly, leaving the credit for what is said to its authors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Their hearts are heated by various passions: anger, love, avarice; and they devour their judges, either whatever virtues they may be able to have in their mind, or the senses by which they distinguish evil from good. Or else it must be said that the leaders of the heretics are devoured by their own peoples, so that they themselves are devoured by the assent of those whose houses they devour for the sake of base gain. All the princes of the heretics have fallen; although they cry to the Lord, there is none who calls on his name. For everyone who calls on the name of the Lord will be saved. Moses and Aaron among his priests, and Samuel among those who call on his name; they called on the Lord, and he heard them, he who does not hear the kings and princes of the heretics, because there is none among them who cries to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
