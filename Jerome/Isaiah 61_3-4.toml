[[commentary]]
quote='''
And in her they will be called the mighty ones of righteousness, the planting of the Lord for glorifying. And they will build the places deserted from of old, and raise up the ancient ruins, and restore the cities deserted and scattered from generation to generation. And strangers will stand and feed your flocks, and the sons of foreigners will be your farmers and vinedressers. LXX: And they will be called generations of righteousness, the planting of the Lord for glory. And they will build the everlasting desert places; those that had formerly been made desolate will be raised up, and they will renew the deserted cities, desolate for generations; and foreigners will come and feed your sheep, and ploughmen and vinedressers of other nations. After both the Apostles and apostolic men have received, instead of ashes and a spirit of sorrow, the oil of joy and the mantle, or, according to the Seventy, the robe of glory and praise, then they will be called generations of righteousness, the glorious planting of the Lord; or, according to the Hebrew ELE (אילי), with both syllables lengthened, mighty ones, and of the righteousness of God, or the planting of the Lord for glorifying; so that, when they have been glorified, or have themselves glorified the Lord, they may build the cities deserted from of old, and raise up the ancient ruins, both of the people of the Jews and of all the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
