[[commentary]]
quote='''
Under these names the people of God was once divided; and the adverse nations, that is, the princes of this world and the rulers of darkness, not only divided the people of God among themselves, but put boys into the brothel, to compel them to change their male nature, of whom the Apostle speaks: For this reason God gave them up to passions of disgrace; for their women exchanged the natural use for that use which is against nature. And likewise the males also, having left the natural use of the woman, were inflamed in their desire toward one another, males working shamefulness on males, and receiving in themselves the recompense of their error which was due. And not content to have done this, they sold a girl for wine, that they might drink, and put gluttony before lust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
