[[commentary]]
quote='''
In the Gospel which the Nazarenes and Ebionites use, (vid. note, p. 433.) and which we have lately translated into Greek out of the Hebrew, and which many regard as the genuine Matthew, this man who has the withered hand is described as a builder, and he makes his prayer in these words, 'I was a builder, and gained my living by the labour of my hands; I pray thee, Jesus, to restore me to health, that I may not disgracefully beg my bread.'

Until the coming of the Lord the Saviour, there was the withered hand in the Synagogue of the Jews, and the works of the Lord were not done in it; but when He came upon earth, the right hand was restored in the Apostles who believed, and given back to its former occupation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then he said to the man: Stretch out your hand. And he stretched it out, and it was restored to health like the other. In the Gospel which the Nazarenes and the Ebionites use, which we recently translated from the Hebrew language into Greek, and which is called by most the authentic Matthew, this man who has the withered hand is described as a mason, begging for help in words of this kind: I was a mason, seeking my living with my hands; I beg you, Jesus, to restore my health to me, so that I may not shamefully beg for food. Until the coming of the Savior the withered hand was in the synagogue of the Jews, and the works of God were not done in it; after he came upon earth, the right hand was given back in the apostles who believed and was restored to its former work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
