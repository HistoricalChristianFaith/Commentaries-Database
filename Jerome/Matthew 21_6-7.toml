[[commentary]]
quote='''
But it seems that the Lord could not in so short a distance have sate upon both animals; seeing then that the history has either an impossibility or a meanness, we are sent to higher things, that is, to the figurative sense.

The Apostles clothes which are laid upon the beasts may be understood either as the teaching of virtues, or discernment of Scriptures, or verities of ecclesiastical dogmas, with which, unless the soul be furnished and instructed, it deserves not to have the Lord take His seat there.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the disciples went and did as Jesus had commanded them, and they brought the ass and the colt and put their garments upon them and made him sit on top. This colt and this ass, on which the apostles spread their garments so that Jesus may sit more softly, were naked before the coming of the Savior, and, with many claiming dominion over them, they shivered without covering; but after they had received the apostolic garments and had been made more beautiful, they had the Lord as their rider. Now the apostolic garment can be understood either as the teaching of the virtues or as the exposition of the Scriptures, or as the varieties of the doctrines of the Church; unless the soul has been instructed and adorned with these, it does not deserve to have the Lord as its rider.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
