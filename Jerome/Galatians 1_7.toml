[[commentary]]
quote='''
"But you have been transferred," he says, "to another Gospel, which is not another": because everything that is false does not subsist, and what is contrary to the truth is not, as in that verse: "Give not, O Lord, your scepter to those who are not" (Esther 14:11). And God called the things which were not, so as to make to be that which was not. Now if this is said of those who believed in the same God and had the same Scriptures, that they were transferred to another Gospel which is not a Gospel, what ought we to think of Marcion and the other heretics, who reject the Creator and feign a Christ of another God? They do not slip and fall in the interpretation of the law and the letter, or in the struggle of flesh and spirit, but they are at variance with the whole order of the Church. And he says finely: Unless there are some who trouble you, and wish to overturn the Gospel of Christ. "They wish," he says, "to change, to overturn, to disturb the Gospel of Christ": but they are not able. For its nature is such that it cannot be other than what is true. Everyone who interprets the Gospel in another spirit and mind than it was written troubles believers and overturns the Gospel of Christ, so as to put behind the back what is in front, and to turn into the front what is behind the back. If anyone follows only the letter, he puts the hinder parts in front. If anyone acquiesces in the interpretations of the Jews, he casts behind his back the things which by their own nature were set in front.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
