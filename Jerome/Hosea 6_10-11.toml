[[commentary]]
quote='''
But in the house of the heretics we see a horrible thing daily, the teachers first playing the harlot, and the people who are led on by them being defiled. Judah too, that is, the Church, is commanded that it too should prepare for itself, because of its sins, a harvest, or a vintage, when the time of judgment comes. But it is pardoned, and the Lord promises it forgiveness, because whom he loves he rebukes, and he chastises every son whom he receives, so that, tested and purged, he may store him in his treasuries. Some refer what is said: Judah, begin your vintage, or, set a harvest for yourself, to the good sense, so that, Israel having been punished, this one receives the fruits of its works, according to what is written: Those who sow in tears will reap in joy. To us the former sense is more pleasing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
