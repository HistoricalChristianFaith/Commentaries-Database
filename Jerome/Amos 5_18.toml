[[commentary]]
quote='''
But no one doubts that all our writers understand the day of darkness as the day of judgment, of which Zephaniah also writes: Near is the great day of the Lord, it is near and exceedingly swift: the voice of the day of the Lord is bitter and hard. And Isaiah: Behold, the incurable day of the Lord is coming, of fury and wrath, to make the whole world a desert, and to destroy the sinners out of it. And at the same time the confidence of the proud is shaken off, who, in order to appear just before men, are accustomed to await the day of judgment and to say: Would that the Lord might come, would that it were granted us to be dissolved and to be with Christ, imitating the Pharisee who spoke in the Gospel: God, I thank you that I am not like other men, robbers, unjust, adulterers, or like this publican. I fast twice in the week, I give tithes of all that I possess. For by this very fact, that they desire the day of the Lord and do not dread it, they are judged worthy of punishment, because no man is without sin, and the stars are unclean before him. And he has shut up all things under sin, that he may have mercy on all. Since therefore no one can pass judgment on the judgment of God, and we are to render an account even for an idle word, and Job daily offered sacrifices for his sons, lest perhaps they should think something perverse against the Lord, what rashness it is to hear with the Corinthians: Without us you reign, and would that you did reign, that we also might reign with you. Certainly, even if their own conscience did not sting them, they ought to have imitated Paul, who says: Who is made to stumble, and I do not burn? And they ought to have been anxious for all, lest, as lovers of themselves, they should desire the torments of others so that they themselves might reign, as if someone wished his own country to be captured and his city overthrown, so that he alone might enjoy the friendship of the victors. We are accustomed to say in straits and tribulations: Would that I might depart from the body and be freed from the miseries of this age, not knowing that so long as we dwell in this flesh we have a place for repentance; but if we have departed, we shall hear that word of the prophet: But in hell who will confess to you? This is the sadness of the world, which leads to death, by which the Apostle does not wish him to perish who had committed fornication with his father's wife; by which also the unhappy Judas perished, who, swallowed up by excessive sadness, joined murder to betrayal, and a murder worse than all murders, so that where he thought there was a remedy, and the death of hanging an end of his evils, there he found the lion and the bear and the snake.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
