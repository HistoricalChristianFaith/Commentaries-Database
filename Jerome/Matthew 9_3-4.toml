[[commentary]]
quote='''
We read in prophecy, I am he that blolleth out thy transgressions; (Is. 43:25.) so the Scribes regarding Him as a man, and not understanding the words of God, charged Him with blasphemy. But He seeing their thoughts thus showed Himself to be God, Who alone knoweth the heart; and thus, as it were, said, By the same power and prerogative by which I see your thoughts, I can forgive men their sins. Learn from your own experience what the paralytic has obtained. When Jesus perceived their thoughts, he said, Why think ye evil in your hearts?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And behold, some of the scribes said within themselves: This man blasphemes. We read in the prophet, God saying: I am he who blots out your iniquities. Consistently, therefore, the scribes, because they thought him a man and understood the words of God, accuse him of blasphemy. But the Lord, seeing their thoughts, shows himself to be God, who can know the hidden things of the heart, and, as it were keeping silent, he speaks: By the same majesty and power by which I look upon your thoughts, I can also forgive men their offenses; understand from yourselves what the paralytic obtains.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
