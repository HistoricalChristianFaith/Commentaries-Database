[[commentary]]
quote='''
Thus says the Lord: For three crimes of Judah, and for four I will not turn him back, because he has cast away the law of the Lord, and has not kept his commandments; for their idols have deceived them, after which their fathers had gone, and I will send fire into Judah and it shall devour the houses of Jerusalem. LXX: Thus says the Lord: For three impieties of the sons of Judah, and for four I will not turn away from them, because they have rejected the law of the Lord, and have not kept his precepts; and they have been deceived in their vanities, which their fathers followed, and I will send forth fire into Judah, and it shall devour the foundations of Jerusalem. To the other cities and nations mentioned above, Damascus, Gaza and Azotus and Ashkelon and Ekron, and the remaining towns of the Philistines, to Tyre also and Idumea, and to the sons of Ammon and Moab, he does not reproach that they cast away the law of God and despised his commandments; for they did not have the written law, but the natural one. Hence he says that they violated their own bowels and the bowels of mercy, and crushed the pregnant women of Gilead with iron carts, and carried off the captivity of Solomon, or the perfect captivity, and shut it up in Idumea, and did not remember the covenant of their fathers, and pursued their brother with the sword; and that they burst forth into such, I will not say cruelty, but rage, that they burned the bones of the king of Idumea, and would not allow death to be the last of all evils. But Judah, in which, at the time when these things were being said, there were the religion of God and the temple and the ceremonies, and which had received the law, and the precepts, and the judgments, and the testimonies, and the commandments — on the difference among which there is a fuller discussion in the eighteenth (19th) psalm and in the hundred and eighteenth (119th) —, is rebuked and convicted by the Lord; and he is going to receive fitting punishments, because he cast away his law and did not keep his commandments. And because he cast these away and despised them, his idols deceived him in due order and course. For he could not have been deceived by idols before, unless he had rejected the law of the Lord and had not done his commandments. These are the idols after which their fathers went in Egypt, fashioning images of the Egyptian ox, and adoring Baal-peor, and worshipping Ashtaroth and the Baalim.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Whatever we have said about Judah is referred to the Church, in which there is the true confession, and the peace of the Lord, and the vision of truth. And in this it is reproved, that it has despised the law of God and has not done his commandments, and that each one, adoring his own vices and sins, has begun to have as God that by which he has been overcome, as the apostle Peter says: For by what one is overcome, of this he is also the slave. The miser worships gold, the glutton his belly, the lustful man his member and Baal-peor; the wanton woman, who, living in pleasures, is dead, adores venereal pleasures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
