[[commentary]]
quote='''
Took him, not because the Lord was weak, but the enemy proud; he imputed to a necessity what the Saviour did willingly.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then the devil took him up into the holy city. This taking up that is spoken of does not come from any weakness of the Lord, but from the pride of the enemy, who thinks the Savior's will is necessity. From this passage, moreover, it is understood what that is which is written in another place: They went into the holy city and appeared to many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
He set him on the pinnacle of the temple, so that the one he had tempted by hunger he might tempt also by vainglory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
