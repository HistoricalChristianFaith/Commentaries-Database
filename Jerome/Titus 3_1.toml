[[commentary]]
quote='''
Remind them to be subject to rulers and authorities, to obey; to be ready for every good work; to blaspheme no one, not to be quarrelsome; to be modest, showing all gentleness toward all men. Something of the kind is written to the Romans as well: "Let every soul be subject to the higher authorities. For there is no authority except from God" (Rom. 13:1). This precept, both here and there, I think was issued for this reason: that at that time the doctrine of Judas the Galilean was still flourishing and had very many followers. Mention of him is made also in the Acts of the Apostles, where Scripture relates: "For before these days Theudas rose up, saying that he was someone great; and about three thousand men joined him" (Acts 5:36); and, "after him rose up Judas the Galilean in the days of the census". Among other things he put forward this as if it were plausible from the Law: that no one ought to be called Lord except God alone, and that those who brought tithes to the temple should not pay tribute to Caesar. This heresy had grown so much that it troubled a great part even of the Pharisees and of the people, so that this question was brought even to our Lord: "Is it lawful to give tribute to Caesar, or not" (Matt. 22:17)? Answering them prudently and cautiously, the Lord says: "Render the things that are Caesar's to Caesar, and the things that are God's to God" (ibid. 21). In agreement with this answer, the apostle Paul teaches that believers ought to be subject to principalities and authorities. For Ἀρχαὶ, which is read in the Greek, sounds more like "principalities" (principatus) than "rulers" (principes), and signifies the authority itself, not the men who are in authority. But because he had said, "Remind them to be subject to principalities and authorities", an occasion for denial could be given to those who dread torments: they might claim, according to the Apostle's saying, that they were subject to principalities and authorities and were doing what these commanded; therefore he added: To obey for every good work. If what the emperor and the governor command is good, comply with the will of the one who commands. But if it is evil and savors of what is against God, answer him with that saying from the Acts of the apostles: "One must obey God rather than men" (Acts 5:29). Let us understand this same thing of servants toward their masters, of wives toward their husbands, and of children toward their parents: that they ought to be subject to masters, husbands and parents only in those things that do not go against the commandments of God. What follows, To be ready, is to be read in two ways: either so that "to be ready for every good work" is understood; or else, joining what he says, to obey for every good work, with what precedes and ending it there, to be ready is, as it were, another precept of its own and a special one, in keeping with what is written in Leviticus: "The goat that is sent away, bearing the curses of the people, is to be handed over into the hands of a ready man" (Lev. 16:21). If, then, anyone is ready to hold the ἀποπομπαῖον (the scapegoat), and lead it out into the desert, and there destroy it, and, so far as in him lies, banish it by the lot of the curse, he, when he has obeyed, will also be ready for every good work. To be ready can also be taken in another way: that they should picture to themselves beforehand in their minds everything that can happen, so that when it does happen they suffer nothing as if it were new, but all things have been prepared for them in advance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
