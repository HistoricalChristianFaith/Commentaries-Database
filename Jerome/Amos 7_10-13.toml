[[commentary]]
quote='''
All that we have interpreted concerning Amaziah, and Jeroboam, and Israel, and Amos must be referred τροπολογικῶς (tropologically) to the heretics, whose priest Amaziah is accustomed at times to send to Jeroboam, the heretical king and patron of heretics, and to accuse holy men and heralds of the faith before him, and to order the teachers not to preach in Israel, lest they act against the king's will, because Bethel, that is, the house of God, and the false Church is the sanctuary of the king and the house of the kingdom. For they are accustomed to say: The emperor is in communion with us; and if anyone resists them, they at once bring the slanderous charge: So you act against the emperor? You despise the commands of the Augustus? And yet let us consider that many Christian kings who have persecuted the Church of God, and tried to establish the Arian impiety in the whole world, outdo Jeroboam king of Israel in wickedness. For he despised the commands of the false priest, and would give no answer to his prompting. But these, with their many Amaziahs as their priests, by hunger and want, by prisons and exiles, have put to death the prophet Amos and the priests of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
