[[commentary]]
quote='''
As much as to say, You have said to me, Thou art Christ, the Son of the living God, therefore I say unto thee, not in a mere speech, and that goes not on into operation; but I say unto thee, and for Me to speak is to make it sor, that thou art Peter. For as from Christ proceeded that light to the Apostles, whereby they were called the light of the world, and those other names which were imposed upon them by the Lord, so upon Simon who believed in Christ the Rock, He bestowed the name of Peter (Rock.)

And pursuing the metaphor of the rock, it is rightly said to him as follows: And upon this rock I will build my Church.

I suppose the gates of hell to mean vice and sin, or at least the doctrines of heretics by which men are ensnared and drawn into hell.

Let none think that this is said of death, implying that the Apostles should not be subject to the condition of death, when we see their martyrdoms so illustrious.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And I say to you. What is it that he says: And I say to you? Because you said to me: You are the Christ, the Son of the living God, and I say to you, not with an empty word that has no effect, but I say to you because for me to have said is to have done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
That you are Peter, and upon this rock I will build my Church. Just as he himself gave light to the apostles, so that they were called the light of the world, and the other names which they obtained from the Lord; so too on Simon, who believed in the rock Christ, he bestowed the name of Peter, and according to the metaphor of the rock it is rightly said to him: I will build my Church upon you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And the gates of hell shall not prevail against it. I think the gates of hell are vices and sins, or at any rate the doctrines of heretics, by which men are enticed and led to Tartarus. So let no one think it is said of death, as if the apostles were not subject to the condition of death, when he sees their martyrdoms shining.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
