[[commentary]]
quote='''
Many, reading that the grain of mustard seed is the least of all seeds, and what is said in the Gospel by the disciples, Lord, increase our faith, and the answer given them by the Savior, Amen I say to you: If you had faith like a grain of mustard seed, you would say to this mountain: Move from this place, and it would move, think either that the apostles are asking for a small faith or that the Lord is in doubt about a small faith, whereas the apostle Paul judges faith compared to a grain of mustard seed to be the greatest. For what does he say? If I have such faith that I move mountains, but do not have love, it profits me nothing. Therefore what the Lord said is done by a faith that is compared to a grain of mustard seed, this the Apostle teaches can be done by faith entire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
