[[commentary]]
quote='''
And since these are to be utterly destroyed at the coming of my child whom I have chosen, therefore know with all the eagerness of your mind that, as a cloud and darkness and mist is either dissolved by the heat of the sun or thinned out by a sweeping wind, so I will cause your iniquities to be dissolved, and all the sins with which you had before offended me. Only return to me and do penance, for you are to be redeemed with precious blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
