[[commentary]]
quote='''
Otherwise; To prophesy, to work wonders, to cast out dæmons by divine power, is often not of his deserts who performs the works, but either the invocation of Christ's name has this force; or it is suffered for the condemnation of those that invoke, or for the benefit of those that see and hear, that however they despise the men who work the wonders, they may give honour to God. So Saul and Balaam and Caiaphas prophesied; the sons of Seæva in the Acts of the Apostles were seen to cast out dæmons; and Judas with the soul of a traitor is related to have wrought many signs among the other Apostles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Many will say to me on that day: Lord, Lord, did we not prophesy in your name, and in your name cast out demons, and in your name do many mighty works? And then I will confess to them: I never knew you; depart from me, you who work iniquity. To prophesy and to do mighty works and to cast out demons is sometimes not a matter of the merit of him who performs them, but either the invocation of the name of Christ does this, or it is granted for the condemnation of those who invoke it, or for the benefit of those who see and hear, so that, though men may despise those who do the signs, they may yet honor God, at whose invocation such great miracles are done. For Saul and Balaam and Caiaphas prophesied not knowing what they said, and Pharaoh and Nebuchadnezzar learn the future through dreams, and in the Acts of the Apostles the sons of Sceva seemed to cast out demons, and Judas the apostle, with the mind of a traitor, is related to have done many signs among the other apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
