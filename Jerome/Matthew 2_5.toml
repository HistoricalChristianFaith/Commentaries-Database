[[commentary]]
quote='''
(Epist. 57.) The Jews are here blamed for ignorance; for whereas the prophecy says, Thou Bethlehem Ephrata; they said, 'Bethlehem in the land of Judah.'
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they said to him: In Bethlehem of Judea. This is an error of the copyists; for we think that it was first published by the evangelist as we read in the Hebrew itself: of Judah, not of Judea. For what Bethlehem is there of other nations, that Judea should be put here to distinguish it from that? But of Judah is written for this reason, that there is also another Bethlehem in Galilee. Read the book of Joshua son of Nun. Finally, in the very testimony that is taken from the prophecy of Micah, it reads thus: And you, Bethlehem, land of Judah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
