[[commentary]]
quote='''
And the protection under which you thought you would be safe, a mighty tempest and a multitude of waters shall destroy, so that the friendship and covenant you had with death and with hell, that is, with the devil, shall perish forever. And the scourge, or tempest, of which you had said: When the overflowing scourge passes through, it shall not come upon us, shall come, and you shall be trodden down by it, that is, you shall suffer all the torments which, in your despairing mind, you thought you would never suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
