[[commentary]]
quote='''
And he who stretched out the heavens and spread them out, so that either the multitudes of Angels might dwell above or men might abide beneath, and made, as it were, a great house for rational creatures, he himself according to the character of the times appoints princes, or searchers of secrets, so that they are as though they were not; and he has made the judges of the earth as void. For which the Seventy translated: and has made the earth as nothing; since also at the beginning of Genesis, where it is written: But the earth was invisible and unformed (Gen 1:2), the others translated: But the earth was void and nothing. How many kings Greek and Barbarian and Roman history recounts! Where is that countless army of Xerxes? Where the multitude of Israel in the desert? Where the incredible power of kings? Why should I speak of ancient things? Present examples teach us that princes are as nothing, and that the judges of the earth are counted as void.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
