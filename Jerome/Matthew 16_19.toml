[[commentary]]
quote='''
Bishops and Presbyters; not understanding this passage, assume to themselves something of the lofty pretensions of the Pharisees, and suppose that they may either condemn the innocent, or absolve the guilty; whereas what will be enquired into before the Lord will be not the sentence of the Priests, but the life of him that is being judged. We read in Leviticus of the lepers, how they are commanded to show themselves to the Priests, and if they have the leprosy, then they are made unclean by the Priest; not that the Priest makes them leprous and unclean, but that the Priest has knowledge of what is leprosy and what is not leprosy, and can discern who is clean, and who is unclean. In the same way then as there the Priest makes the leper unclean, here the Bishop or Presbyter binds or looses not those who are without sin, or guilt, but in discharge of his function when he has heard the varieties of their sins, he knows who is to be bound, and who loosed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And to you I will give the keys of the kingdom of heaven, and whatever you bind upon earth shall be bound also in heaven, and whatever you loose upon earth shall be loosed also in heaven. Not understanding this place, bishops and presbyters assume to themselves something of the haughtiness of the Pharisees, so as either to condemn the innocent or to think that they loose the guilty, when with God it is not the sentence of the priests but the life of the accused that is examined. We read in Leviticus about lepers, where they are commanded to show themselves to the priests, and, if they have leprosy, then they are made unclean by the priest; not that the priests make them lepers and unclean, but that they have knowledge of the leper and the non-leper and can discern who is clean or who unclean. Just as, then, there the priest makes the leper unclean, so here too the bishop and presbyter binds or looses, not those who are innocent or guilty, but, according to his office, when he has heard the varieties of sins, he knows who is to be bound, who loosed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
