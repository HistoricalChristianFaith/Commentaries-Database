[[commentary]]
quote='''
And the valley of the salt-pits (as is written in this same book), in which there were formerly wells of bitumen, after the wrath of God and the rain of sulphur was turned into the Dead Sea, which by the Greeks is called λίμνη, ἀσφαλτῖτις (that is, the lake of bitumen).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
