[[commentary]]
quote='''
This may be always observed, both in the Old and New Testament, that when there is an appearance of any majestic person, the first thing done is to banish fear, that the mind being tranquillized may receive the things that are said.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Jesus said to them: Do not be afraid. In both the Old and the New Testament this must always be observed: that whenever some more august vision has appeared, fear is first driven out, so that, the mind being thus calmed, the things that are said may be heard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Go, tell my brothers to go into Galilee; there they will see me. To those brothers of whom he also said in another place: I will announce your name to my brothers, who see the Savior not at all in Judea but in the multitude of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
