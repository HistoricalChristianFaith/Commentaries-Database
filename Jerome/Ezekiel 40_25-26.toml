[[commentary]]
quote='''
And round about, through the windows, all things were full of light — for the several προβλήματα [questions] have their own limits —, and through them its own light enters the soul of the one who sees, especially if the length of his life has been prolonged by the mystery of the fiftieth year, that is, of the jubilee, and he has been able to come to the breadth of the more divine sense; in which breadth and streets wisdom acts confidently and cries aloud with a lofty voice. He enters by seven steps so as to come to the vestibule, and through the palms of his purpose and effort to hold the everlasting victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
