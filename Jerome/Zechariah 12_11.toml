[[commentary]]
quote='''
On that day there shall be a great mourning in Jerusalem, like the mourning of Adadremmon in the plain of Megiddo. And the land shall mourn, families and families apart; the families of the house of David apart, and the women — or wives —, of them apart — for the Hebrew word nese, that is, γυναῖκες, signifies both —, the families of the house of Nathan apart, and their women apart, the families of the house of Levi apart and their women apart, the families of Shimei apart and their women apart. All the remaining families, families and families apart and their women apart. LXX: On that day there shall be a great mourning in Jerusalem, like the mourning for the pomegranate that is cut down in the plain, and the land shall mourn by tribes and tribes; the tribe of David apart and their women apart, the tribe of the house of Judah apart and their women apart, the tribe of the house of Nathan apart and their women apart, the tribe of the house of Levi apart and their women apart, the tribe of Simeon apart and their women apart; all the remaining tribes apart and their women apart. Adadremmon, for which the LXX translated ῥοῶνος (of the pomegranate grove), is a city near Jezreel which was once called by this name, and today is called Maximianopolis, in the plain of Megiddo, in which Josiah, the just king, was wounded by the Pharaoh surnamed Necho; over him Jeremiah wrote Lamentations, which are read in the Church, and that he wrote them the book of Chronicles testifies. Just as, therefore, at that time, after the sinful kings, all the hope of the people was in Josiah, and when he was slain a great mourning was stirred up in the city, as we read in the Hebrew: The spirit of our mouth, Christ the Lord, was taken in our sins, to whom we said: In your shadow we shall live among the nations. Although others, according to the spiritual understanding, refer this to the Lord Jesus; so, when the Savior has been crucified, the mourning shall be renewed in Jerusalem, as once it was in the city of Adadremmon, in the plain of Megiddo.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Let us say also that according to the LXX it is called ῥοῶν, not a single tree of pomegranates, that is, of the Punic apple, but a place planted with these trees, of which, according to the spiritual understanding, the bridegroom says in the Song of Songs: I went down to see in the produce of the torrent whether the vine had flowered, whether the pomegranates had flowered. For the Savior went down to the torrent of this world and its turbid waters, from which Elijah too, in a type of him, is described as having drunk, so that after the flowers of the vine and of the pomegranate he might receive the fruit of both, and, making his Church drunk, might hear from her: You shall give me to drink of the perfumer's wine, of the wine of my pomegranates. A drink of this kind not only drives away the heats of the stomach, but is also said to heal a corrupted belly and to benefit the other inner organs. For nothing is more beautiful than this fruit; in its redness it signifies the modesty of the Church, in the order of its seeds the ranks and members of the whole body distributed through their several offices. When the Savior has not found fruit in a vine and pomegranates of this kind, he will say: Every branch that does not bear fruit the Father will take away; and every one that bears fruit he will prune, that it may bring more fruit. And in another place John the Baptist cries out: Already the axe is laid to the roots of the trees. Every tree that does not make good fruit shall be cut down and cast into the fire. At the cutting down of the vines or of the pomegranates, when on the day of judgment all titles of dignity shall be laid down and that which is written shall have been fulfilled: Behold the man and his works; and when the chaff has been separated from the wheat, there shall be a great mourning not in another place but in Jerusalem. For the blow and the judgment shall begin from the saints, and kings and priests and prophets and teachers shall beat their breasts with their hands when they see that the most beautiful pomegranates have been cut down, and him whom they had pierced reigning in the majesty of the Father and his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
