[[commentary]]
quote='''
Whatever we have interpreted according to ἀναγωγὴν (anagogy) of the coming of the Lord the Savior and of the conversion of the true Israel, this can be referred as much to heretics and Jews as to the Gentiles and to every perverse dogma, so that when they have repented they may obtain pardon. If, therefore, the fullness of the promise was fulfilled at the coming of the Savior, and is fulfilled daily in the Church, we must believe that it will be fulfilled more fully when, perfection having come, what is now in part will be done away. We must note what we have often said: that the salvation of Israel and of the return to God, and the redemption from captivity, are to be taken not carnally, as the Jews think, but spiritually, as is most truly proved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
