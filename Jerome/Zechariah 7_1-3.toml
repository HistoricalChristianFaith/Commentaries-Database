[[commentary]]
quote='''
And it came to pass in the fourth year of King Darius, the word of the Lord came to Zechariah, on the fourth of the ninth month, which is Chislev. And Sharezer and Regem-melech, and the men who were with him, sent to the house of God, to entreat the face of the Lord, to speak to the priests of the house of the Lord of hosts and to the prophets, saying: Must I weep in the fifth month, or ought I to sanctify myself, as I have done now for many years? And the word of the Lord of hosts came to me, saying: Speak to all the people of the land and to the priests, saying: When you fasted and mourned in the fifth and the seventh through these seventy years, did you fast a fast to me? And when you ate and drank? Did you not eat for yourselves and drink for your own selves? Are these not the words which the Lord spoke by the hand of the former prophets, when Jerusalem was still inhabited and was wealthy, she and her cities round about her, and it was inhabited toward the south and in the plains? LXX: And it came to pass in the fourth year under King Darius, the word of the Lord came to Zechariah, on the fourth day of the ninth month, which is Chislev. And Sharezer and Arabesser the king, and his men, sent to Bethel to entreat the Lord, saying to the priests of the house of the Lord Almighty and to the prophets, saying: Sanctification has come in here in the fifth month, as they have done now for many years; and the word of the Lord of powers came to me, saying: Say to all the people of the land and to the priests, saying: If you fast and mourn in the fifths and in the sevenths, and behold, seventy years, did you fast a fast to me? and if you eat or drink, is it not you who eat, and you who drink? Are not these the words which the Lord spoke by the hands of the prophets who were before, when Jerusalem was inhabited and was abundant, and her cities round about, and the hill country and the plains were inhabited? In the fourth year of King Darius, in the ninth month, which is called Chislev, and on the fourth day of the same month, Sharezer and Regem-melech and the others who were with them, who the Hebrews maintain were Persians, generals of King Darius who feared God, sent to the house of the Lord, that is, to the temple which had already been restored by Zerubbabel and by Joshua, so that, since they had already heard that the temple had been built, they might ask of the priests of the house of the Lord and of the prophets whether they ought to weep and fast according to the former custom, or to change mourning into gladness. And the sense of those inquiring is this: In the fifth month, which among the Romans is called July, Jerusalem was overthrown by Nebuchadnezzar; for which reason, because of the desolation of the temple, we have fasted and mourned until now, and have consoled our grief with weeping and fasts. Now, since it is said that the temple has been built, and we see that the cause of sadness by no means remains, answer, we beg you, whether we ought to do this, or to exchange grief for joy? And at the same time it must be considered that weeping and fasting are called sanctification. Hence in Joel too the priests are commanded to sanctify a fast and to proclaim a healing. For abstinence and fasting heal the wounds of the offender, and sanctify all whom they have healed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
