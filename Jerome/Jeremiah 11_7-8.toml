[[commentary]]
quote='''
For, testifying, I testified to your fathers in the day in which I brought them out of the land of Egypt, even to this day; rising early I testified and said: Hear my voice! And they did not hear nor incline their ear, but each one went away in the perversity of his evil heart; and I brought upon them all the words of this pact, which I commanded them to do. Up to this point it is not found in the LXX, and what follows: and they did not do it, was placed by them and joined to the end of the preceding passage, in which it is written: Hear the words of this pact and do them! And they did not do it. But what it means to rise early and frequently press the words of God upon them through the prophets, and to bring them out of Egypt, and often to admonish them and to say: Hear my voice, and that they went away after the perversity of their heart, and that afterwards he renders to them what they deserve to receive, we have already said before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
