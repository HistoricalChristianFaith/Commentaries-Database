[[commentary]]
quote='''
If we choose to take the two women as the peoples of the heretics and of the Jews — both of whom go out from the face of the Lord, and are borne by an unsteady spirit, and have the wings of the kite, the heron and the hoopoe, since, after the manner of the partridge, they are forever gathering riches, and not with judgment, and hasten to snatch from the Church, and delight in contentions and quarrels, and drag to destruction whomever they have deceived, and wallow in the mire of lusts and in everlasting filth —, these women lift up the most heavy weight of impiety, and build their house in confusion, and serve the Babylonian king, so that the peoples of the heretics and of the Jews may dwell there, where the idolaters abide, serving wood and stones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
