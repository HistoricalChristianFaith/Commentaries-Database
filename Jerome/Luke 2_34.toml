[[commentary]]
quote='''
He, then, who by falling had turned aside from the Lord and was of a most wicked building, rightly falls while he whom God strengthened is prophesying; but he who obeyed the precepts of God and was sustained and supported by his help rightly remains in command of the people — we read in Exodus that, when Pharaoh king of Egypt had died, the sons of Israel groaned from the works of clay, of straw and of brick, and cried out to the Lord, upon whom, while he lived, they could not call; Isaiah also, when Uzziah the leprous king had died, saw the Lord sitting upon a throne high and lifted up, and the Seraphim standing around him, and, understanding that he had unclean lips and dwelt among a people having unclean lips, he merits that a coal be sent from the altar and purge his unclean lips; here, however, as the strength of God prophesies, the prince who had turned aside from the service of the Lord falls, so that he may be raised up by Christ: for if the Lord is the resurrection, the devil is the fall; in which it is asked how it is said of the Savior: Behold, this one is set for the fall and the resurrection of many in Israel: for the fall of those who stood most wickedly, and the resurrection of such as had fallen —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
