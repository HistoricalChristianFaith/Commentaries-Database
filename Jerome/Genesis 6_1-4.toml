[[commentary]]
quote='''
The book of Genesis also relates (Chapter 6) that after men began to become many, a number that is always associated with vice, and daughters were born to them, they were taken, not by Angels, but by the sons of God, from whom the giants were born: or, as it is written in the Hebrew, ἐπιπίπτοντες, that is, those who fall upon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
