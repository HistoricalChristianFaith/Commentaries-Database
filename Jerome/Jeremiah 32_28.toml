[[commentary]]
quote='''
But what does it mean that the word came: therefore thus says the Lord? For what had gone before, that he should put a causal conjunction, saying: therefore thus says the Lord? 'Because', he says, 'it is my care to rule all things, to order everything and to render to each according to his ways, therefore I will deliver this city into the hand of the Chaldeans and into the hand of the king of Babylon, and they shall take it'; for first it is surrounded by an army and is taken in Nebuchadnezzar's absence, and Zedekiah is led to Riblah and there is handed over to the king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
