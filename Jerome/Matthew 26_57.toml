[[commentary]]
quote='''
But Josephus writesu, that this Caiaphas had purchased the priesthood of a single year, notwithstanding that Moses, at God's command, had directed that High Priests should succeed hereditarily, and that in the Priests likewise succession by birth should be followed up. No wonder then that an unrighteous High Priest should judge unrighteously.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But they, holding Jesus, led him to Caiaphas the chief priest, where the scribes and the elders had gathered. Moses, at God's command, had ordered that the high priests should succeed their fathers and that a line of descent should be woven among the priests. Josephus relates that this Caiaphas bought the high priesthood for one year only from Herod for a price. It is no wonder, then, if an unjust high priest judges unjustly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
