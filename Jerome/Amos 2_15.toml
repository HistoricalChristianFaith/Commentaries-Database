[[commentary]]
quote='''
The heretics too have archers, who, bending the bow in vain, will not be able to withstand the arrow of the Lord, who speaks through Isaiah: But I am like a chosen arrow in the quiver of the Lord. These are the archers of whom David also sings: Behold, sinners have bent the bow, they have made ready their arrows in the quiver, to shoot in the dark at the upright of heart. And the swift of foot, he says, shall not be saved: he who, because of the sharpness of his wit, runs about through the testimonies of the Scriptures and strives to crush the truth with the eloquence of orators or the sophisms of dialecticians; and in this he is tripped and falls, because he trusts not in the Lord but in his own feet. The rider of the horse, too, shall not save his soul, he who does not know what was said through the prophet: The horse is deceitful for salvation. And he does not know that it is written: All who mounted horses have slumbered. This man will not save his soul, but as he perishes he will hear: Some in chariots, and some on horses, but we will call upon the name of the Lord our God. They were hindered and have fallen, but we have risen and stand upright.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
