[[commentary]]
quote='''
And not only shall Jerusalem be taken, when all the nations have been roused against it in battle, but also the houses of those who dwell in Jerusalem shall be laid waste, and the women shall be violated, to the grief of their masters and husbands, who will be able to prevent neither the pillaging of their houses nor the rape of their wives by the enemy, according to what we read elsewhere: Those who are gathered in the midst of you shall fall by the sword, and they shall dash your sons to pieces in your sight, and they shall plunder your houses, and they shall have your wives; nothing crueller and nothing more wretched than this can be found, that from fear of their own death they dare to defend neither the safety of their sons nor the chastity of their wives. Amos the prophet too says this very thing, threatening Amaziah the impious priest: Your wife shall play the harlot in the city, and your sons and daughters shall fall by the sword, and your ground shall be measured with a line. And all these things shall befall the people of the Jews: For the nations raged, and the peoples meditated vain things. The kings of the earth stood by and the princes came together as one against the Lord and against his Christ. And he laughed at them and derided them, and troubled them in his fury, so much so that the Apostle too, seeing that the years which had been given them for repentance were now completed, and that those who killed the Lord and persecuted the prophets and the apostles nevertheless persisted in denial, said: Wrath has come upon them to the end. Josephus, who wrote the Jewish history, relates most fully that they endured all these things, and things much greater than we read in the prophets; so too Cornelius Tacitus, who set down in thirty volumes the lives of the Caesars after Augustus up to the death of Domitian. But how half of the city was taken and the rest of the people remained in the city is proved both at that time and at others: the northern and lower part of the city was taken, but the mountain of the temple, and Zion, on which the citadel was, remained intact. The Jews say that these things are to be fulfilled under Gog, others that they were in part accomplished in the times of the Macedonians and the Egyptians and of various nations. We, leaving the variety of the times to the judgment of the Lord, let us explain what is written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
