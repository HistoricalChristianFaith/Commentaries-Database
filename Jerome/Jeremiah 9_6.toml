[[commentary]]
quote='''
And as for what follows: your dwelling is in the midst of deceit, in deceit, the word is properly directed to the prophet, that he dwells in the midst of a lying people — or, as the Seventy translated: usury upon usury and deceit upon deceit — and that they daily increase their crimes and by no means repent of their former deed, but heap new crimes upon past ones; doing these things, they act with all eagerness so as not to know the Lord, who commanded that these things should not be done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
