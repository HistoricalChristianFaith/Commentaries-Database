[[commentary]]
quote='''
Shepherd your people with your rod, the flock of your inheritance, dwelling alone in the forest in the midst of Carmel; they shall feed on Bashan and Gilead according to the days of old, according to the days of your going out from the land of Egypt; I will show him wonders. The nations shall see, and shall be confounded at all their strength. They shall put their hands upon their mouth; their ears shall be deaf. They shall lick the dust like serpents, like the creeping things of the earth; they shall be troubled out of their dwellings. They shall dread the Lord our God, and they shall fear you. LXX: Shepherd your people with your rod, the sheep of your inheritance, dwelling alone in the forest; in the midst of Carmel they shall feed on Bashan and Gilead according to the former days, and according to the days of your going out from the land of Egypt; I will show them wonders. The nations shall see, and shall be confounded in all their strength; they shall put their hands upon their mouth; their ears shall be deaf. They shall lick the ground like serpents that drag the earth; they shall be troubled in their enclosures; at the Lord our God they shall dread, and they shall be in fear of you. As to what is said, Shepherd your people with your rod: God the Father is speaking to the Son, that is, to our Lord Jesus Christ, that, since he is the good shepherd and lays down his life for his sheep, he should shepherd his people with his rod, and the sheep of his inheritance. And lest we think that the peoples are the same as the sheep, we read in another place: But we are your people, and the sheep of your pasture. "People" refers to all who are rational, but "sheep" to those who, not yet using reason, are content with simplicity alone, and are called of the inheritance of God. But the people as much as the sheep need the shepherd's rod, of which the Apostle too speaks: What do you wish? Shall I come to you with a rod, or in charity and the spirit of meekness? For this reason, I think, because the people of Israel was stiff-necked and was always sighing for the meats of Egypt, Moses used, not only against the Egyptians, whom he struck with ten plagues, but also against the people in the wilderness, the rod of the law, a rod that strikes and breaks all the earthen and fragile vessels; but from the apostles of the Lord the Savior, who spoke wisdom among the perfect, the rod was struck out of their hands, because perfect love casts out fear. But if anyone objects to us how it can now be said to Christ, that is, to the good shepherd, who is certainly greater and better than the apostles, that he should use a rod, when it is a mark of greater progress to have no rod than to correct peoples and sheep with a rod, we shall answer them according to what the Lord promises his apostles, that they would do greater signs among the peoples than he himself had done. And because the Lord was still speaking to carnal Israel, and not yet to the one who could perfectly know the mysteries, for that reason it was said of him that he should shepherd his people and his flock with the rod, but that the rod was struck out of the hands of the apostles, and the severity of the law tempered by the clemency of the Gospel. Moreover, these peoples and these sheep will be struck, and will be shepherded with the rod, for this reason, that they had dwelt alone in the forest. This we can indeed take also of those who, separating themselves from the Church, give themselves up to the banquets and friendships of the Gentiles, and also of those who out of hatred of the human race seek a solitary life, such as we read that Timon was at Athens; not that the solitary and prophetic life which Elijah and John had is to be condemned, but because, if someone, despising the rest, is himself proud and dwells in the forest of vices, he must be corrected with the rod. He who dwells alone and does not dwell in the forest is in the praise of virtues; but he who is alone and does not do the works of justice, and enjoys only the pleasure of quiet, and does not toil in the work and labor of Christ, nor seek his food with his own hands, as the Apostle commands, and is lifted up into pride, he dwells in the forest and moves among the fruitless trees. But yet, because he is the good shepherd, and his rod strikes for this purpose, to amend, the prophetic word promises better things, and says: In the midst of Carmel they shall feed on Bashan and Gilead, according to the days of eternity, and according to the days of your going out from Egypt. Carmel means knowledge of circumcision, Bashan confusion, and Gilead transmigration of testimony. Therefore the people of God, and the sheep of his pasture, which before were fed apart from the Lord's flock and outside his Church, and moved about in the forest of errors, will afterwards be transferred to the knowledge of the true circumcision, and will serve God in the spirit, and will glory in the Lord, and will not trust in the flesh, and will be the true circumcision, and not the concision. And when they have been fed with the spiritual circumcision, understanding their former sins, they will be confounded in their vices, and will blush, and will be in the confusion that leads to life; for there is also another confusion that leads to death, in which Og, king of Bashan, once dwelt, since Bashan means confusion; and from this worst confusion the Lord also promises that he will free his people: The Lord said: From Bashan I will turn back, I will turn back from the depths of the sea. And when we have known the true circumcision, and have been confounded over our sins, then we shall be in Gilead, which means transmigration of testimony, in the Church of Christ, into which the testimonies of the law and the utterances of the prophets have passed over; and this will be done for us according to the days of old, according to the days when we went out from the land of Egypt, of which Moses says: Remember the days of eternity, not the days of this age, which are called evil, but the everlasting days. And he remembers the days of eternity who does not look at present things, and has risen with Christ, and sits with him in the heavenly places, already anticipating in mind that he has been freed from the days of the present age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
