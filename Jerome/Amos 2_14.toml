[[commentary]]
quote='''
There follows: And the mighty shall not hold his strength; not that he is mighty, but that he boasts of being mighty. Or he is the one who trusts in his own strength and not in the mercy of God, according to what is written: I will destroy the wisdom of the wise, and the understanding of the prudent I will reject; not that true wisdom can perish and the understanding of the truth be rejected, but that the wisdom of those perishes who seem wise in their own eyes and trust in their own learning. The strong one too, or the fighter, who will not save his soul, is he who by no means possesses the armour of the Apostle: having a shield, but not of faith; girded about the loins, but not in truth; clothed with a breastplate, but not of righteousness; bearing a sword, but not of salvation. A fighter of this sort does not sanctify the battle, nor can he fight the wars of the Lord, since he struggles against the truth on behalf of falsehood. Such a fighter cannot say: Blessed be the Lord my God, who teaches my hands for battle and my fingers for war. My mercy and my refuge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
