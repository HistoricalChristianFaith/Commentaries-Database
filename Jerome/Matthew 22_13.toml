[[commentary]]
quote='''
By a metaphor taken from the body, there shall be weeping and gnashing of teeth, is shown the greatness of the torments. The binding of the hands and feet also, and the weeping of eyes, and the gnashing of teeth, understand as proving the truth of the resurrection of the body.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then the king said to the attendants: With his feet and hands bound, cast him into the outer darkness; there will be weeping and gnashing of teeth. The bound hands and feet, and the weeping of the eyes and the gnashing of teeth, understand either as proving the truth of the resurrection, or else the hands and feet are bound for this reason, that they may cease to work evil and to run to shed blood. In the weeping of the eyes, too, and the gnashing of teeth, the greatness of the torments is shown through a metaphor drawn from the members of the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
