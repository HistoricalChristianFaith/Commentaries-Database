[[commentary]]
quote='''
And this indeed we sometimes see done also by perverse teachers and rulers, who without the fear of God lord it over the clergy, of whom Jeremiah speaks: Their clergy will not profit them; who think that gain is godliness, and, sitting in the temple as money-changers, set out doves, not in cages but in chairs, as though they were teachers, selling the gifts of the Holy Spirit; who make the measure smaller and greater, so that to the poor they speak either little or nothing, but to the rich, and to those from whom they pursue gain, they speak in the manner of public orators at very great length. And for money they crush and trample the heads of the poor, and thrust into greedy throats, not the grain of the Lord, which strengthens the heart of man, but refuse and the vilest dust; selling even these things that are of no value, although the Lord commanded the apostles: Freely you have received, freely give.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
