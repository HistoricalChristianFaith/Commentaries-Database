[[commentary]]
quote='''
And I will send fire into the house of Hazael, and it will devour the houses of Ben-hadad. And I will break the bar of Damascus, and I will destroy the inhabitant from the plain of the idol. LXX: And I will send forth fire into the house of Hazael, and it will devour the foundations of the son of Ader. And I will break the bars of Damascus, and I will destroy the inhabitants from the plain of ὢν. He gives us to understand that Hazael, in the reigns of Uzziah and Jeroboam, had already died in Syria, and that his son Ben-hadad had succeeded him in the kingdom, from whom afterwards all the kings of Aram, that is, of Syria and Damascus, held the name Ben-hadad. Hence he fittingly did not say: I will send fire into Hazael, but into the house of Hazael, that is, into his royal house, over which his son Ben-hadad presided at that time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But the Lord will send fire into the house of Hazael, which they themselves call Hazael, that is, vision of God; a fire to consume the wood and stubble in them, and to devour the foundations of the son of Ader. For we ought to speak according to the Seventy as well, lest we seem to have set them out to no purpose: Ader is interpreted εὐπρέπεια, which we can call comeliness, because all the discourse of the heretics, being elegant and well composed and having the beauty of worldly eloquence, deceives its hearers the more easily.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
