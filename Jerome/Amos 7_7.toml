[[commentary]]
quote='''
These things the Lord showed me: And behold, the Lord standing upon a plastered wall, and in his hand a mason's trowel. And the Lord said to me: What do you see, Amos? And I said: A mason's trowel. And the Lord said: Behold, I will set a trowel in the midst of my people Israel. I will not again overlay it, and the high places of the idol shall be demolished, and the sanctuaries of Israel shall be made desolate; and I will rise up against the house of Jeroboam with the sword. LXX: Thus the Lord showed me: And behold, a man was standing upon a wall of adamant, and in his hand adamant. And the Lord said to me: What do you see, Amos? And I said: Adamant. And the Lord said to me: Behold, I will cast adamant into the midst of my people Israel. I will by no means again pass him by, and the altars of laughter shall be scattered, and the sacrifices of Israel shall be made desolate, and I will rise up against the house of Jeroboam with the sword. Before we discuss the adamant, which Symmachus and the LXX gave for what is written in the Hebrew as enach, it must be said briefly that Aquila rendered this word γάνωσιν and Theodotion τηκόμενον, of which the one means tinning and the other melting, so that that frying pan which we read of in Ezekiel, in which is signified the frying of the people hemmed in by siege, may be shown, through the word tinning, also in the ten tribes and in the reign of Jeroboam — who was the grandson of Jehu, under whom this prophecy is seen —. The Lord, then, is seen standing upon a wall tinned, or plastered, and in his hand tinning, or a mason's trowel, with which walls are usually overlaid, and receive not only beauty but also strength against the harm of the rains and the very frequent storms.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
We have said as best we could what has been handed down to us by the Hebrews according to the truth of the history; let us pass to anagogy, setting down a few words from Xenocrates, who wrote on the natures of stones and gems: "Adamant is a stone of its own name, which in Latin we can call untamable, because it yields to no material, not even to iron. For if it is placed on an anvil and struck with a heavy blow of the hammer, the anvil and the hammer receive damage before the adamant is broken. And though fire tames all things and consumes all metals, it renders the adamant harder, so that the force of excessive heat does not blunt even the smallest corner of it. I have seen also in gold an adamant the size of a millet grain, and though the gold around it is worn away by long use and great age, the adamant alone is not worn down, and it cannot be diminished by any file, but on the contrary wears down the file, and furrows with lines whatever it touches. This stone, most hard and untamable, is dissolved by the blood of goats alone, and put into hot blood, it loses its strength. It is small and unsightly, having the colour of rust and the brilliance of crystal. And four kinds of adamant are described: the first is Indian, the second Arabian, the third Macedonian, the fourth Cyprian, possessing more or less hardness according to the character of the regions. It is said also, like electrum, to detect poisons and to resist the arts of sorcerers". Such is the Lord and Savior, who, though he was in the form of God, did not think it robbery to be equal to God, but emptied himself, taking the form of a servant, made in the likeness of men, and found in bearing as a man; humbling himself, made obedient unto death, and the death of the cross. Of whom Isaiah writes: He has no form nor comeliness; we saw him, and there was no beauty, despised and the last of men, a man of sorrows, and knowing how to bear infirmity. He stands upon the wall of adamant, that is, upon his saints and apostles, to whom he granted that they too should be called adamants, and, overcome by no one, should say: Who will separate us from the love of Christ? Tribulation, or distress, or persecution, or famine, or nakedness, or peril, or the sword? And again: I am sure that neither death nor life, nor angels, nor principalities, nor things present, nor things to come, nor strength, nor height, nor depth, nor any other creature will be able to separate us from the love of God which is in Christ Jesus our Lord. Peter too was a most strong adamant: the gates of hell did not prevail against him. This man and Lord, who stands upon the wall of adamant, has in his hand the adamant, which, unless it is held by the hand of God and fortified by his help, loses all its strength, as the Lord says in the Gospel: No one can snatch out of the hand of my Father. And he is so robust that it is said to him: If you pass through fire, the flame will not burn you; and the more he is beaten by temptations, the stronger he becomes, and for the name of the Savior he rejoices amid the scourges. And though he can be overcome by no one, he is dissolved by the heat of deadly lust alone. For this is said to be the nature of the blood of goats and of the goat himself, that he is most hot for lust, and that what fire cannot tame, his blood alone dissolves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
