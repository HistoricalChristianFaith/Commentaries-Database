[[commentary]]
quote='''
And when the Lord, the trowel ceasing, has withdrawn his protection and, so to speak, the clothing of the wall, then the high places of the idols, which in Hebrew are called bamoth, will be demolished, and the sanctuaries of the ten tribes will be made desolate, so that Dan and Bethel are destroyed, in which the golden calves were worshipped.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
