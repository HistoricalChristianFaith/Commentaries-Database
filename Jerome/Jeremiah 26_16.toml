[[commentary]]
quote='''
And the princes and all the people said to the priests and the prophets: There is no judgment of death for this man, because he has spoken to us in the name of the Lord our God. The people, which had earlier been tripped up by the priests and false prophets, joins the princes of the city and speaks for Jeremiah, saying that he is by no means guilty of death, but has prophesied in the name of the Lord and from his mouth; for the untaught crowd, once it has received a reason, quickly changes its opinion. But the resentment of the accusers, especially of the priests and false prophets, cannot be changed; and therefore, while they accuse and persevere in the accusation, the people is changed, because he had given them hope of the Lord's pardon, if they made their ways good and heard the voice of the Lord their God, so that the Lord too would bend his sentence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
