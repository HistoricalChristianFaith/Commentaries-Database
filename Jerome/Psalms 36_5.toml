[[commentary]]
quote='''
I think these are the clouds of which it is said in another place: "Your truth reaches even to the clouds" — that truth of the Lord which says in the Gospel: "I am the way and the truth and the life." The truth of God is Christ. The truth of the Lord reaches even to the clouds. The clouds are the apostles and the prophets; to these it was commanded that they should not rain rain upon Israel. For from the time — according to the history, as it is written in the book of Judges — that the fleece was dried up, the rain has run out over the whole world. What is said is this: Israel was dried up, and the rain ran out over the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_024.html'
source_title="Homily 24, on Psalm 96"

[[commentary]]
quote='''
Who covers the heaven with clouds. This heaven, which we behold, cannot be covered with clouds. But there is another heaven, and there are other clouds. And your truth reaches even to the clouds. Then does the truth of God reach even to those clouds, which are quickly dissolved when the wind blows? The truth of God is Christ. I am the way and the life and the truth. Is then the truth of Christ in these clouds, which have not in themselves the substance of truth? Can it then be that truth is there, where the wind has power to scatter? I will command, he says, the clouds not to rain rain upon them—that is, upon the people of the Jews. The clouds are the prophets: the Lord commanded them not to rain rain upon Israel. The prophetic word has been turned toward us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"

[[commentary]]
quote='''
We have our own clouds, the prophets and the apostles; whence also elsewhere it is said, "Your truth reaches even to the clouds." If his truth reaches even to the clouds of this air, how is it said elsewhere, "Truth has arisen from the earth"? Therefore what it says is this: "Your truth reaches even to the clouds." It certainly signifies the prophets and apostles: which clouds, unless they have been dashed together among themselves, cannot give their splendor; but if in one course they come to thunder together, lightnings fall in the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_073.html'
source_title="Homily 73, on Psalm 96 (Alternate Series)"
