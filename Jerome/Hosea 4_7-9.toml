[[commentary]]
quote='''
Concerning the heretics the understanding is easy: that the more numerous they are, the more they sin against God and glory in their peoples; and therefore they deceive the unhappy, so as to eat the sins of the people, and through sweet words to devour the houses of widows. For when they see some people sinning, they say: God seeks nothing else but the truth of faith; if you guard it, he does not care what you do. For by saying these things they lift up their souls in their iniquities, so that they not only do not repent nor are humbled, but rejoice in their crimes and walk with neck held high. Hence both the people and the priest, both those who have been taught and those who taught, will be bound by an equal judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
