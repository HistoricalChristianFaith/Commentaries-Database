[[commentary]]
quote='''
When the shades of night were dispersed, and He was returning to the city, the Lord was an hungred, thus showing the reality of His human body.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now in the morning, returning to the city, he was hungry, and seeing a single fig tree beside the road, he came to it and found nothing on it but leaves only. And he said to it: Let fruit never grow from you forever. And the fig tree withered at once. And the disciples, seeing it, marveled, saying: How did it wither at once? When the darkness of night had been dispelled and the morning light was shining, and midday was near, in which the Lord was to illumine the world with his passion, as he was returning to the city he was hungry, either showing the reality of human flesh, or hungering for the salvation of believers and burning at the unbelief of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
