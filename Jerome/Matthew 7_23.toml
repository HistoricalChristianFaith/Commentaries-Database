[[commentary]]
quote='''
Emphatically, Then will I confess, for for long time He had forebore to say it.

Note that He says, I never knew you, as being against some that say that all men have always been among rational creatures.

He says not, Who have worked, but, who work iniquity, that He should not seem to take away repentance. Ye, that is, who up to the present hour when the judgment is come, though ye have not the opportunity, yet retain the desire of sinning.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then I will confess to them. He said expressively: I will confess, because for a long time before he had refrained from saying: I do not know you. The Lord does not know those who perish. But note why he added: I never knew you, if, as some hold, all men have always dwelt among the rational creatures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Withdraw from me, you who work iniquity. He did not say: you who have worked iniquity, lest he seem to take away repentance, but you who work, that is, you who up to the present hour, when the time of judgment has come, although you no longer have the opportunity of sinning, still have the inclination.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
