[[commentary]]
quote='''
And if any of the princes seemed to judge what was right, he rather sold his sentence, and judged for gifts. The priests also did not teach the people unless they had received a price; and whereas it is said to the saints: Freely you have received, freely give, they, bringing forth the answer of God when money had been received, sold the grace of the Lord for avaricious hire. And after these evils, not understanding their sin, as though they were buying back the love of God with crimes, they kept declaring that they were judges and priests and prophets of God, and in accordance with their impenitent heart they said: The Lord is in our midst, and no evils will come upon us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And although the prophet Malachi calls priests angels, and their mouth is the oracle of the Lord, they do not judge without the taking of gifts, though they read: Gifts blind the eyes even of the wise, and like a bridle in the mouth turn away reproof. And although it is said to the apostles: Do not possess gold and silver, nor let there be copper in your belts; and money, even when earned by labor, is to be shaken out of the hands of a holy man, they sell the words of the Lord and trade in doves in the temple. But the prophets of Jerusalem also divined for money, not knowing that prophecy is one thing and divination another; for divination is never taken in a good sense in the Scriptures. There shall be, he says, no augury in Jacob, nor divination in Israel. They seemed to themselves indeed to be prophets, but because they took money, their prophecy became divination. The apostle Peter: Silver, he says, and gold I have not; he certainly could have sold to Simon Magus what he was asking for, or rather, he could have pretended to be selling it, for the Holy Spirit can be neither sold nor bought; but he condemned the money offered, together with the one offering it. Now you may see that the prophets of Jerusalem do not have prophecy in their mouth, and rest upon the Lord, and say: No evils will come upon us, on whose account God's watchtower is cut by the enemy's plow; and the place once of peace becomes full of ruins, and the temple of the Lord is turned into briars and thorns, and is a dwelling of beasts. Nor let anyone be troubled by what we read in the first book of Kings (1 Samuel): that Saul, wishing to go to Samuel, said to his servant that he could not go to him because he did not have a price to offer for the prophecy, and that the servant answered: Behold, there is found in my hand the fourth part of a shekel of silver, and I will give it to the man of God, and he will tell us our way; for it is not written that Samuel accepted it, or that they offered it to him; on the contrary, they are fed by the prophet and invited to a meal. But suppose that he did accept it: it should be reckoned rather as offerings for the tabernacle than as payment for prophecy. For a shekel contains twenty obols, and the fourth part of a shekel is five obols. So our priests too, if they wish to sell prophecy, and to set out in their chairs the doves which the Lord overturned with a whip, let them accept five obols, not the prices of country estates. The same thing is heard also in the third book of Kingdoms (1 Kings): that the wife of Jeroboam, when her son was sick, goes to Ahijah the man of God and brings him loaves and raisins and a little jar of honey. For it is told what she brought with her, and yet it is not written that the prophet accepted it, since indeed he both rebuked her and foretold the mourning to come; although it may be that those who had been accustomed to go to soothsayers (for there were many diviners and soothsayers in Israel) thought, by a bad custom, the same thing also of the prophets, and wished to offer to holy men what they had been accustomed to offer to diviners, and that Scripture only related what they wished; yet it did not add either that they dared to offer it or that the prophets accepted it. The Apostle Paul: Those who serve the altar, he says, both partake of the altar and live. It is permitted to you, O priest, to live from the altar, not to live in luxury. The mouth of the ox that treads out the grain is not muzzled. We know these things, and yet the Apostle does not abuse this license; and having food and clothing he is content; night and day he labors with his own hands, so as not to be a burden to anyone. And he swears in his epistles that he has conducted himself holily and without avarice in the gospel of Christ, and he asserts this very thing not only of himself but also of his disciples, that he sent no one who either demanded anything from the churches or was willing to accept it. And if in some epistles he gives thanks, and calls the gifts of the senders the benevolence of God, he gathers them not so much for himself as for the poor among the saints who were in Jerusalem. Now the holy poor were those in Jerusalem who first believed in Christ from among the Jews and, cast out by their parents and kinsmen and relations by marriage, had lost both their possessions and all their household goods, which the priests of the temple and the people laid waste. If the poor are such, let them accept. But if, under the pretext of the poor, a few houses are enriched, and we eat gold in glass and earthenware vessels, then either let us change our clothes along with our treasures, or let the poor habit not seek the riches of senators. Little does it profit not to have a little linen cloth about the neck for wiping away sweat. What does it help to be μονοχίτωνας (wearing a single tunic), and to display poverty in our dress, when the whole crowd of the poor sighs for our purse?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
