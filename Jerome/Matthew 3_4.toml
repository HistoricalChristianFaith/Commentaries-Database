[[commentary]]
quote='''
His raiment of camel's hair, not of wool—the one the mark of austerity in dress, the other of a delicate luxury.

Food moreover suited to a dweller in the desert, no choice viands, but such as satisfied the necessities of the body.

His girdle of skin, which Elias also bare, is the mark of mortification.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Now John himself had a garment of the hair of camels and a leather girdle about his loins. Of hair, he says, he had, not of wool. One thing is the mark of austere clothing, another of softer luxury. And the leather girdle with which Elijah too was girded is a σύμβολον (symbol) of mortification. Moreover, what follows,

His food was locusts and wild honey, is fitting for a dweller in the wilderness, so that he might satisfy not the delights of food but the necessity of human flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
