[[commentary]]
quote='''
And the Lord God shall be seen over them, and his javelin shall go forth like lightning; and the Lord God shall sound the trumpet, and shall go in the whirlwind of the south. The Lord of hosts shall protect them. LXX: And the Lord God shall appear over them; and his arrow shall go forth like lightning; and the Lord God Almighty shall sound with the trumpet, and shall go in the commotion of his terror. The Lord Almighty shall protect them. This place too they refer to the times of the Maccabees: that when these fought against Antiochus and conquered, the fight and the victory were the Lord's, who went forth mighty to battle, and his power appeared like lightning, and, when the adversaries had been conquered and scattered as by a whirlwind, he protected the people of the Jews. We, however, shall refer everything to the understanding of the Savior, of whom it was said above: I have stretched Judah for myself as a bow. When he has been stretched, and the heretics and the Gentiles have been slain by the sons of Zion, the glory of the Lord will appear, and his javelin will go forth like lightning; of which lightning we read in Habakkuk too: In the light of your arrows they shall go, in the splendor of your flashing spear. This lightning and splendor is called by another name the trumpet and its blast, so that, when the holy cry has sounded, he who before had deaf ears may say: The instruction of the Lord has opened my ears, and has given me an ear to hear. And what follows: And he shall go in the whirlwind of the south, or, he shall go in the commotion of his threatening. He threatens and says that he will inflict punishments for this reason, that he may have mercy on those who repent. In short, he adds and says: The Lord Almighty shall protect them, those whom he had first terrified by his threatening. Let us read the history of the Ninevites.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
