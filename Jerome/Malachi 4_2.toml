[[commentary]]
quote='''
"This is the day the Lord has made; let us be glad and rejoice in it." The Lord has made all days, of course, but other days may belong as well to the Jews, and heretics too; they may even belong to the heathens. The Lord's day, however, the day of the resurrection, the day of Christians, is our day. It is called the Lord's day because on this day the Lord ascended to the Father as victor. But when the heathen call it the day of the sun, we are most happy to acknowledge their title, for today has risen "the Sun of justice with its healing wings." Does the sun really have wings? Let the Jews answer, and those who, like them, accept only a literal interpretation of holy Writ. We say, whoever has been under the wings of this sun who has said in the Gospel, "How often would I have gathered the children together, as a hen gathers her young under her wings, but thou would not," shall be safe from the devil hawk, safe under the great wings of that mighty eagle in Ezekiel, and all the wounds of his sins shall be healed.
'''
source_url=''
source_title="HOMILY (94) ON EASTER SUNDAY"

[[commentary]]
quote='''
On the contrary, it is said what will befall those who fear the name of God: And for you who fear my name the Sun of justice will rise. He will judge all things truly, and will allow neither good things nor evil, neither virtues nor vices, to lie hidden. And healing will be in his wings, so that he may carry on his shoulders those healed through repentance, according to that which is written in Deuteronomy: Spreading out his wings he took them up, and carried them on his shoulders. Then those who are now shut up in the world as in a prison will go forth, and they will leap like calves from the herd, or like calves freed from their bonds. Hence the Apostle too says: I desire to be dissolved and to be with Christ, so that he may go forth and leap like a calf freed from its bonds, and like a victim of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
