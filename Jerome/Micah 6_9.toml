[[commentary]]
quote='''
The voice of the Lord cries to the city, and there will be salvation for those who fear your name. LXX: The voice of the Lord will cry to the city, and he will save those who fear his name. In the Hebrew this is the beginning of the next section, but with the Seventy translators it is the end of the preceding one; and it has this sense: Your God asks nothing else of you, O man, except that you do judgment, and love mercy, and be ready to walk with your God. For the voice of the Lord is heard in his city, the Church, and resounds daily in the holy Scriptures, so that not only those who love mercy, but also those who are lower and still fear the name of the Lord, may be saved by his teaching and clemency. But if it is the beginning of the following section, let us refer it, according to the history, as said to Samaria, the metropolis of the ten tribes, which was captured while Micah was prophesying, and let us say: The Lord rebukes Samaria and threatens her with the blows that are to come, so that the people of Judah, or those who fear the name of the Lord, hearing that others suffer punishments, may themselves be seized with fear and obtain salvation. For when the pestilent man is scourged, not only the wise man but even the fool will become more prudent. And you will refer this very thing to sinners in general and to the just, so that the torment of some may become an example to the rest. This indeed the Lord also explains in the Gospel concerning those on whom the tower in Siloam had fallen: that they were not the only sinners in the whole people, but that their punishment was meant to provoke the rest to repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
