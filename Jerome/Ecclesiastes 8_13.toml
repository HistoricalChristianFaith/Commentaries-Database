[[commentary]]
quote='''
And let it not be good for the impious man, and let him not prolong his days like a shadow, who does not fear before the face of God. He calls down evil on those who do not have the fear of God, and wishes that they not be put off long from punishment, but, taken away at once by death, receive the torments they deserve. The Apostle too says something similar: Would that those who trouble you were cut off. And elsewhere: Alexander the coppersmith showed me many evils: the Lord will repay him according to his works. How these things are said mercifully must be inquired into. So much according to the truth of the Hebrew sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
