[[commentary]]
quote='''
But now, because he says, You have been corrupted with corruption, he seems to me to have said it to distinguish it from a salutary corruption, of which the Apostle also speaks: And though our man who is outside is corrupted, yet he who is inside is renewed from day to day. He who always carries the dying of Jesus in his body, and corrupts the outer man, and subjects the flesh to the rule of the soul, is indeed corrupted, but not with corruption, because his corruption is salutary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
