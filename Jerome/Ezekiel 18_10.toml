[[commentary]]
quote='''
But if he begets a son who is a robber, shedding blood, and does one of these things (or, as the Seventy translated, and does sins, does not walk in the way of his righteous father), and who does not do all these things, but eats on the mountains, and pollutes his neighbor's wife, grieves the needy and the poor (or oppresses), seizes plunder, does not return the pledge, and lifts up his eyes to idols, commits abomination, gives at usury and takes more: shall he live? He shall not live; since he has done all these detestable things, he shall die by death, his blood shall be upon him. For 'robber' in the Hebrew is written 'pharis', which the second edition of Aquila translated 'sinner', Symmachus 'transgressor', the Seventy and Theodotion 'pestilent'. Just as a pestilence creates diseases and is wont to lay waste far and wide the regions on which it has settled, so the pestilent man ravages everything.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
