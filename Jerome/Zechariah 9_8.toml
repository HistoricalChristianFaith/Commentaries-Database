[[commentary]]
quote='''
And I will surround, he says, my house, that is, the Church, with those who fight as soldiers for me, that is, with those who serve me in various mysteries, and at my command run hither and thither, going and coming back. Or: I will surround my house with the protection of the angels, of whom it is also written in another place: The angel of the Lord shall send round about those who fear him, and shall deliver them, so that there may be no one who goes and returns, that is, who plots ambushes against my people. Nor shall the exactor pass over it any more, of whom Isaiah says: The exactor has ceased, or else ἐξελαύνων, that is, one who leads out of doors, and drags the bound into captivity, for with his eyes, which we can understand as the prophets and all the saints, the Lord saw the calling of the nations and the security of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
