[[commentary]]
quote='''
Therefore, behold, the days are coming, says the Lord, and this place shall no longer be called Topheth and the valley of the son of Hinnom, but the valley of slaughter. LXX: Therefore, behold, the days are coming, says the Lord, and this place shall no longer be called ruin and polyandrion of the son of Hinnom, but polyandrion of slaughter. What the valley of the son of Hinnom is, which in Hebrew is called 'gehennom', whence they think 'gehennam' [Gehenna] too was named, we have said above. But I wonder what the Seventy meant by putting diaptōsin, that is, 'ruin', for 'Topheth', and polyandrion, which signifies 'a multitude of men', for 'valley', unless perhaps because there the people fell and a multitude of men was slain, either spiritually in the error of idolatry or, according to the letter, by the Babylonian army, as is read more plainly in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
