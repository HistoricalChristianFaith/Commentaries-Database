[[commentary]]
quote='''
And while the peoples hasten, very many nations also shall go to the mountain, namely the whole world believing in him, and they shall say, calling one another to the standard of the gibbet: Come, let us go up into the mountain of the Lord. There is need of an ascent for anyone to be able to reach Christ, to the house of the God of Jacob, the Church, which is the house of God, the pillar and foundation of the truth. Moreover, that Jacob signifies the Savior we have also said above: Jacob my servant, I will receive him. And they will say this also to those to whom they had spoken: Come, let us go up into the mountain of the Lord and into the house of the God of Jacob, and they will add: That they may show us his way; understand this either of the angels who preside over the churches, or of the holy Scriptures, which show beforehand the way of the Lord, and him who says: I am the way. And let us walk in his paths, namely in the apostles, through whom we have believed in Christ. For out of Zion went forth the spiritual law, passed over to the Gentiles, the word of the Lord from Jerusalem, who will judge among many peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
