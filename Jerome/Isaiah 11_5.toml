[[commentary]]
quote='''
And when the wicked has been struck, the Lord is girded with righteousness and truth and faith. For he himself was made for us by God wisdom, and righteousness, and sanctification and redemption (1 Cor 1), he who also says in the Gospel: I am the light, and the way, and the truth (John 8:12; 14:6). And of the Psalms it is said: Truth has sprung from the earth: and righteousness has looked down from heaven (Ps 84 [85]:12). Hence the Apostle too exhorts the Ephesians: Stand, therefore, having your loins girded about with truth, and clothed with the breastplate of righteousness (Eph 6:14). But if faith is read in place of truth, this must be said: that the girdle of the Lord, with which Jeremiah was girded (Jer 13), is the faith of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
