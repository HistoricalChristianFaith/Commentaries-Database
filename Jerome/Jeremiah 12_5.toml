[[commentary]]
quote='''
If, running with footmen, you have grown weary, how will you be able to contend with horses? If in a land of peace you have been confident, what will you do in the pride — or roaring — of the Jordan? 'If', he says, 'the frequent captivity inflicted by the neighboring nations has worn you out, by the Moabites and Ammonites, the Philistines and Edomites, what will you do in the face of the long captivity which is to lead you all the way to Chaldea?' And he compares footmen with horsemen, because in truth and according to the history all Persia and all Chaldea and the army of those regions delight in cavalry. But these nations which I have mentioned above, because of the difficulty of their terrain, are suited not so much to battle as to brigandage. And he keeps the metaphoran [metaphor] and says: 'If, running with footmen, you have failed from weariness, what will you do if you wish to match your running to horses? And if in your own land you had some confidence, what will you do when you have crossed the Jordan and endured its whirlpools?'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
