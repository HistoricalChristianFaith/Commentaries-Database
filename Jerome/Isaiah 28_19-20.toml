[[commentary]]
quote='''
Further, as for what is read in the Seventy: Learn to hear, you who are afflicted: we cannot fight, and we ourselves are too weak to be gathered together, what sense it has, and how it is connected with what goes before, I am entirely ignorant. Unless perhaps the divine word is speaking to the princes of the people and exhorting them to have hope in God and not in death and hell, and to learn to hear the oracles of the prophets; and they answer that, for the weakness of their strength, they cannot fight against the opposing powers, nor be gathered together among the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
