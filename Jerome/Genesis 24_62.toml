[[commentary]]
quote='''
And he dwelt in the land of the south: and Isaac went out to exercise himself in the field toward evening. The land of the south signifies Gerar, from which he had once been led away by his father to be sacrificed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
