[[commentary]]
quote='''
If Gilead is an idol, then in vain were they sacrificing to oxen in Gilgal; for their altars too are like heaps upon the furrows of the field. LXX: If Gilead is not, then the princes sacrificing in Gilgala were false, and their altars like tortoises upon the desert of the field. Where we have translated 'to oxen', which in Hebrew are called surim, the LXX translated 'princes', who are called sarim, deceived by the likeness and ambiguity of the word. Again, where we have put 'heaps', which in Hebrew are called gallim and properly signify θῖνας, that is, mounds gathered together out of sand, which, chiefly in the desert and on the shores, are either increased or diminished as the wind blows, the LXX translated 'tortoises', for which Symmachus rendered 'heaps of stones', Theodotion 'hills'. And indeed, if you look at θῖνας, they have the likeness of great tortoises in a desert field, or on banks and shores, rising a little above the ground. What he says, then, is this: if in Gilead, of which it is written: Gilead, a city of those who work an idol, supplanted with blood, the gods are false and the religion perverse, and it is beyond the Jordan where two tribes dwell, Reuben and Gad, and the half tribe of Manasseh, then Gilgal too, of which we read in this same prophet: All their wickedness is in Gilgala, which is behind Beth-aven; whoever worship idols do not sacrifice oxen to the gods, but offer sacrifices to oxen, imitating the error of Samaria. For at the time when these things were prophesied, Gilead was in the kingdom of the ten tribes, and Gilgal under the rule of the two tribes, which were called Judah. Therefore both the ten tribes and the two were deceived by an equal error of idolatry, and their altars are like heaps and mounds gathered together of stones, or of sand. And since both these and those will have been led away into captivity, their once-altars, without worshippers, will have the likeness of tortoises or of mounds. But since Gilead is interpreted 'transference of testimony', and Gilgal 'wallowing place', we can say this: that the princes of the heretics transfer the testimonies of the truth into a lie, and whatever they worship is an idol, and their sacrifices have the likeness either of heaps gathered of stones or of tortoises. For just as θίνες and heaps are gathered here and there from stones and sand, so the heretics too compose images out of worldly wisdom and the subtleties of men, by fraud and falsehood. And when they have done this, they move with slow steps in one place, and cannot occupy the whole world. The tortoise, slow-footed and burdened, nay, weighed down by its own weight, does not so much walk as move, signifying the most grievous sins of the heretics, who sacrifice to their own errors in the mire and wallowing place of mud, adoring the works of their own hands, and, like oxen, toiling at everything for earthly crops.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
