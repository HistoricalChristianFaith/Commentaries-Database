[[commentary]]
quote='''
But because there follows: Lay bare your shame, the millstone too is understood figuratively by the Hebrews, namely that, after the manner of a harlot, she lies open to the lust of the victors. And what is written in the book of Judges about Samson (Judg 16), that he was condemned by the Philistines to the mill, they wish to signify this: that, being the strongest of men, he was compelled, for the sake of offspring, to do this with foreign women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
