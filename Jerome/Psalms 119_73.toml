[[commentary]]
quote='''
And observe carefully that he did not say, we are his shaping (figuratio) and moulding (plasmatio): but, we are his workmanship (factura). For moulding draws its origin from the mud of the earth, while workmanship took its beginning according to the likeness and image of God. And these, set down together in the hundred and eighteenth psalm as well, signify different things: Your hands made me and moulded me (Ps. 118:73). Workmanship holds the first place; then moulding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
