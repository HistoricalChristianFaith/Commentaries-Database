[[commentary]]
quote='''
So much according to the Hebrew understanding; but the Seventy translators in this place do not cohere with themselves at all. For to what was set first, In the Church of the Lord do not weep, what consequence is there, that there should be added, for he will not cast off the reproaches which he speaks: The house of Jacob has provoked the Spirit of the Lord? And also what follows: If these are his devices, are not his words good with him, and have they walked upright? What bearing on the later part have the words that are said: And formerly my people stood out as an adversary against its own peace; they flayed off its skin, to take away the crushing of war? It seems to me, however, that in a place so very difficult the sense can be rendered or expressed thus, if only the prudent reader will acquiesce in our reasoning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
