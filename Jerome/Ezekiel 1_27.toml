[[commentary]]
quote='''
Nor is he well pleased with the legs of a man. See what he says: he did not say, in the head of a man: he did not say, in the hands of a man: but, in the legs, which are below. Nor is he well pleased with the legs of a man. The legs here, like the thighs also, are always taken for lusts. Finally in Ezekiel too God is seen from the loins upward as amber (electrum), from the loins downward as fiery. Whatever is above, that is gold: whatever is below, that is prepared for Gehenna.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"
