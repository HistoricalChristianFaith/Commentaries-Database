[[commentary]]
quote='''
As for what follows: Joshua was clothed in filthy garments, they interpret it in three ways: either on account of the unlawful marriage, or on account of the sins of the people, or because of the squalor of the captivity. Now the angel before whose face Joshua was standing commanded the other angels, in the person of the Lord, to take away from him the filthy garments of which we spoke above. When they had fulfilled the command in deed, the same angel speaks again to Joshua: Behold, I have taken away your iniquity from you; these are the filthy garments; and I have clothed you with changes of raiment; that is, I have joined an Israelite wife to you; for which the Seventy translated ποδήρη, which we can call an ankle-length tunic, because it flows down to the ankles and feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
