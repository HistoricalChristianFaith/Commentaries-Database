[[commentary]]
quote='''
We can say this very thing of the heretics as well, who plunder the poor man, or strike his head with a clenched hand: for this is what κατεκονδύλιζον means in Greek, according to what we read above, striking the poor upon the head. For the heretics strike none but the poor man, who cannot withstand the threat, and not in his other members, but in the ruling part of the heart and in the truth of faith. The poor, I think, are those who, content with a simple faith, are unable to answer the malice of the heretics. But whatever good work they have also prepared as gifts for God, unless they resist the adversaries, they will lose in the time of battle and contest; and these adversaries, by the composition and structure of words, build houses for themselves so that they may remain safe and secure. But they shall not dwell in them, when these have been destroyed and overturned by churchmen. And they not only build houses, but also plant most lovely and desirable vineyards, so as to counterfeit the mysteries of Christ; but they shall not drink wine from them, except that which is the incurable fury of dragons. For the Lord waited for these vineyards to bring forth fruit, and they brought forth not grapes but thorns or wild grapes, not judgment but a cry, with which they blaspheme against their God with insane mouth. And therefore they shall not dwell in their houses, and shall not drink the wine of the vineyards which they had planted, because the Lord has known their many impieties.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
