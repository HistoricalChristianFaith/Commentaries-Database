[[commentary]]
quote='''
Be therefore imitators of God, as most dear sons. Whoever understands how it was said: Be perfect, as your heavenly Father also is perfect (Matt. 5:48), will know how it is now said too: Be imitators of God (1 Cor. 4:16). And writing to the Corinthians he says: Be imitators of me, as I also am of Christ (1 Cor. 11:1). For they could not at once become imitators of Christ; but it was a great thing for them if they could become imitators of an imitator. To the Ephesians, however, as to those whom he had already taught such great mysteries, he does not say, Be imitators of me, nor, imitators of Christ, but, imitators of God. Not that it is a lesser thing to be an imitator of Christ than of God (for Christ is indeed God), but that it is one thing to imitate according to man, another according to God. For even if we once knew Christ according to the flesh, now we no longer know him according to the flesh. The Savior himself also speaks, showing the humility of the dispensation: Whatever he sees the Father doing, these same things the Son also does likewise (John 5:19). Not that the Father made one heaven and one earth, and that after their likeness another heaven and another earth and the other elements were made by Christ; but that whatever the Father works, these same things the Son also works. In what respect we can become like God he has attested above, saying: granting to you, as God also in Christ has granted to you. For I do not think that man can imitate God also in all the other things whatever that God has done; but, for example, that as he is merciful, and rains upon the good and the evil, and the rest, so we too should pour out our goodness upon all men. When we have done this, we shall be sons beloved, whether of Paul himself or, as I think better, of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
