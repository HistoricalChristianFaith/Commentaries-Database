[[commentary]]
quote='''
And the cells, that is, the rooms which had been built in the vestibules after the eastern gate, looked toward the eastern way; and so that we may know how many cells there were, it is added: three on this side and three on that, looking, namely, toward the north and toward the south and toward the eastern way; and there was one measure of the fronts on either side.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
The cells too, and rooms, which were toward the way of the eastern gate, in place of which the Seventy write 'aeleu', were three on this side and three on that, of one measure, that is, of one reed which had six cubits and one handbreadth, of which it was spoken above, and the 'aelam' one reed in length and one reed in breadth, and between the cells five cubits; so, lest we should think that there were only two cells, he set three on either side, to show the number six, which is shown also in the water jars of the Gospel, in which the waters were changed into wines; and daily the Jewish waters are turned into wine, which makes glad the heart of man, and becomes sweeter with the blood of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
