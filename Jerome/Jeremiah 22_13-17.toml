[[commentary]]
quote='''
We can, however, take this passage according to anagōgēn [the higher, spiritual sense] against the heretics, who build for themselves a house not great and most broad with the abundance of the Church, but a little one. And they build not with righteousness and judgment, desiring to plunder what belongs to others; whence it is said: You have built yourself a little house, upper rooms open to the wind, which are carried about by every wind of doctrine, and set off with windows; for they have no lasting building and no solid firmness. And raftered, he says, with cedar: they seem indeed to have the most beautiful rafters, but in the rains and the storm of persecutions they quickly rot and collapse. And daubed with red ochre: for they too promise the passion and the blood of the Lord, but they do not reign forever, because they contend with and provoke to anger 'araz', that is, 'cedar', their father. For every heretic is born in the Church, but is cast out of the Church, and contends and fights against his parent. And as for what he adds: They shall not eat and they shall not drink, 'the body and blood of the Savior' is understood; and the rest that is like these. And he says that all their error comes down from this, that they have not known God and do not have upright eyes, but their heart is bent on avarice, to plunder what belongs to others and to shed the blood of those they have deceived; for this is to commit murder. Obscure matters must be discussed more fully.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
