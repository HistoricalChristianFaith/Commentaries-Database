[[commentary]]
quote='''
Hear the word of the Lord, O nations, and declare it to the islands that are far off, and say: he who scattered Israel will gather him and will keep him as a shepherd his flock, for the Lord has redeemed Jacob and has delivered him from the hand of one more powerful — or stronger —. And they shall come and shall praise on Mount Zion and shall flow together to the good things of the Lord, over grain and wine and oil and the young of flocks and of herds. Their soul shall be like a watered garden — or like a fruit-bearing tree — and they shall hunger no more. Then the virgin shall rejoice in the dance — or virgins — and young men and old together, and I will turn their mourning into joy and will console them and make them glad from their sorrow, and I will inebriate the soul of the priests with fatness — or of the sons of Levi — and my people shall be filled with my good things, says the Lord. The calling of the nations is clearly shown, Scripture saying: hear the word of the Lord, O nations, and declare it to the islands that are far off, and say! What do they declare to the islands that are situated far off? That the Lord, who scattered Israel, himself will gather him — it was not at all, then, of the power of the adversaries that they were scattered, but of the Lord's will — and will keep him as a shepherd his flock — for the good shepherd lays down his life for his sheep —, for the Lord has redeemed Jacob at the price of his own blood and has delivered him from the hand of one more powerful or stronger. By this it is shown that the adversary powers are stronger than the nature of human frailty, and, as to the strength that is in each, that they are stronger by nature, but we stronger by faith, if only we deserve to be delivered by him who can bind the strong man and plunder his house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
