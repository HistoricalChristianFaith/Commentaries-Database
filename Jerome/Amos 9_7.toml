[[commentary]]
quote='''
Are you not like the sons of the Ethiopians to me, sons of Israel, says the Lord? Did I not make Israel go up from the land of Egypt, and the Philistines from Cappadocia, and the Syrians from Cyrene? Behold, the eyes of the Lord God are upon the sinning kingdom, and I will crush it from the face of the earth; nevertheless, crushing, I will not crush the house of Jacob, says the Lord. LXX: Are you not like the sons of the Ethiopians to me, sons of Israel, says the Lord? Did I not bring Israel out of the land of Egypt, and the foreigners from Cappadocia, and the Syrians from the pit? Behold, the eyes of the Lord God are upon the kingdom of sinners, and I will take it away from the face of the earth. Nevertheless I will not take away the house of Jacob to the end, says the Lord. For Cyrene, Aquila and the Fifth edition put the Hebrew word itself, cir; the Seventy 'pit', that is, βόθρον; Theodotion 'wall'; Symmachus 'Cyrene', whom we too have followed in this place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But everyone who is Israel, who once saw God with his mind and was brought out of Egypt, if, desiring the vices of Egypt and the pleasures of the world, he returns not only into Egypt but into Ethiopia, in which whoever is, according to Jeremiah, cannot change his skin, is saved by the coming of Christ, and there is fulfilled in him what is written: Ethiopia shall hasten its hands to God. And when he has worshipped him, it will be said of him: Before him the Ethiopians shall fall down. And when they have fallen down, and have brought victims to the Lord from there, from beyond the rivers of Ethiopia, they will be able to say: I am black and beautiful, because the sun has discolored me. For bodies that languish in shade and idleness cannot bear the temptations and the heats of the world; but those which are made ready for wrestling and for contests, dried by the sun, overcome the injuries of the world and obtain the blessing of the Holy Spirit, who says to the righteous man: The sun shall not burn you by day, nor the moon by night. The Ethiopians, therefore, are turned into sons of God if they repent, and the sons of God pass over into Ethiopians if they come into the depth of sins. For God himself, the Creator of all, turns Cappadocians into Philistines, and those who dwelt in the cold of faith and lay exposed to the North, the harshest wind, he made to fall drinking, and, laying aside their pride, to feel the judgment of the Lord. The Syrians also, that is, the lofty and sublime, who are called Aram, he transferred from Cyrene, the weak wall, or the place which overhung the most bitter sea and was near the Syrtes; and what, according to the LXX, was held in the pit, he changed for the good, so as to make them lofty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
