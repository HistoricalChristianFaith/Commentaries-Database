[[commentary]]
quote='''
Judge your mother, judge, since she is not my wife and I am not her husband; let her put away her fornications from her face, and her adulteries from between her breasts, lest perhaps I strip her naked and set her as on the day of her birth. LXX: Be judged with your mother, be judged, because she is not my wife and I am not her husband; and I will put away her fornication from my face, and her adulteries from between her breasts, so that I may strip her naked, and restore her as on the day of her birth. Up to this point the discourse has been directed to the people of Israel, that is, to the ten tribes. Now another section begins, and the sons, that is, the people, are commanded to enter into judgment against their mother, who bore them, who, made a wife from a harlot, did not abandon her former ways, and again played the harlot with her lovers. And see the clemency of the husband. She has already been repudiated, already cast off; he has already said to her: She is not my wife and I am not her husband; yet he commands the sons to speak, not at all to the wife of their father whom he has put away, but to their mother, who bore them. And let them speak calling her to repentance, so that she may put away her fornications from her face, and her adulteries from between her breasts. A fornicatress is one who couples with many. An adulteress is one who, deserting one husband, is joined to another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
