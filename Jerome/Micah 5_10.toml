[[commentary]]
quote='''
After this there follows: And it shall come to pass in that day, when your hand has been lifted up over your foes, O Israel, and all your enemies have perished, I will kill your horses from your midst, that is, from the ruling part of your heart, the wanton impulses that rush forth like horses when their bonds are broken, and your chariots, in which you pleased yourself in your vices, and, joining sins to sins, were carried along as if triumphing in four-horse chariots.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
