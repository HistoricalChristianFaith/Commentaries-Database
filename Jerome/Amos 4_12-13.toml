[[commentary]]
quote='''
Therefore I will do these things to you, Israel; but after I have done these things to you, prepare to meet your God, Israel; for behold, he who forms the mountains, and creates the wind, and announces to man his speech, who makes the morning mist, and treads upon the heights of the earth, the Lord God of hosts is his name. LXX: Therefore thus will I do to you, Israel; nevertheless, because I will do thus to you, prepare to call upon your God, Israel. For behold, he who establishes the thunder, and creates the spirit, and announces to men his Christ, making the morning and the mist, and ascending upon the heights of the earth, the Lord God Almighty is his name. Where we translated 'after', in the Hebrew is written eceb, and Aquila translated ὕστερον, that is, afterwards, and Theodotion 'at the last', and the Seventy 'nevertheless'; in the Hebrew it can be read thus: Therefore I will do these things to you, Israel, afterwards, that is, a long time after, and in the last ages, so that the verse begins again from another beginning: And since I am about to do this to you, prepare to meet your God, Israel. And again, in the place where the Seventy translated: Prepare to call upon your God, and we, following Theodotion, have put: Prepare to meet your God, Symmachus and the Fifth edition translated: Prepare to oppose your God, which in Hebrew is said hechin lacerath Eloiah. For 'mountains' also, which in Hebrew are called arim, the Seventy alone rendered βροντήν, that is, thunder. And why they said 'spirit' and we 'wind', which in Hebrew is called rua, the reason is plain: because by this word both wind and spirit are named. And as for what follows: Announcing to man his speech, while all translate it as we have rendered it, the Seventy alone translated: Announcing to men his Christ, deceived by the likeness and ambiguity of the word. For if we read 'his Christ', which in Hebrew is said Messio, it is written with these letters, mem, sin, iod, heth, and uau, which is what the LXX supposed. But if it is as in the Hebrew, according to Aquila τήν ὁμιλίαν αὐτοῦ, according to Symmachus τὸ φώνημα αὐτοῦ, according to Theodotion τὸν λόγον αὐτοῦ, according to the Fifth edition τήν ἀδολεσχίαν αὐτοῦ, all of which they translate as meaning that it is 'his speech', it will be written with these letters, mem, he, which is read ma, that is, 'that' or 'what'. Then sin, iod, heth, which we read sia, that is, speech. And the O, which is written with the single letter uau, signifies αὐτοῦ, that is, 'his'; and all mixed together it is read masio, having, compared with the word above, one letter more, he, the second letter. We have spoken of the variety of interpretation, which will be tiresome to the careless and welcome to the studious; now let us pass on to the sense of what is written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
