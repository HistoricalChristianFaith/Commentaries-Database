[[commentary]]
quote='''
Wherein He calls the Apostles to breaking of bread, that the greatness of the miracle might be more evident by their testimony that they had none.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
They answered him: We have nothing here but five loaves and two fishes. In another evangelist we read: There is a certain boy here who has five loaves, and he seems to me to signify Moses; the two fishes we understand either as both Testaments, or because an even number refers to the law. So the apostles, before the passion of the Savior and the flashing forth of the lightning-bright Gospel, had nothing but five loaves and two little fishes, which moved about in salt waters and in bitter waves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
