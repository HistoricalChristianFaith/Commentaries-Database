[[commentary]]
quote='''
It is a grave displeasure, after you have sinned, not to merit the wrath of the Lord. Israel had played the harlot away from the Lord his God and been led astray by a spirit of fornication; therefore his daughters and brides also play the harlot and are left in their crime without any punishment, so that what the sons and the wife had done to their true parent and husband, they may feel in their own children and wives, and from their own pain understand the pain of God, who is so angry that he does not strike the offenders at all. The Apostle too, writing to the Romans, testifies to this in mystical speech: For, saying that they were wise, they became fools; and they changed the glory of the incorruptible God into the likeness of the image of corruptible man, and of birds, and of four-footed beasts, and of serpents. And because they had played the harlot with idols, they are struck with such a sentence: For this reason God gave them up to the desires of their heart, to uncleanness, so that they dishonor their bodies among themselves, who exchanged the truth of God for a lie; and they worshipped and served the creature rather than the Creator, who is blessed for ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
