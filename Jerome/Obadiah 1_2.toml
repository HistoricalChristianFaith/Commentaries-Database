[[commentary]]
quote='''
If we have learned the history, let us follow the spiritual understanding. Although you seem to yourself to be great, O heretic, and despise the fewness of the Church, yet you are small among the nations, and contemptible, and not only contemptible, but, with ἐπιτάσει (intensification), exceedingly contemptible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
