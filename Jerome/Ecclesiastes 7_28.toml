[[commentary]]
quote='''
But this too, he says, my soul sought: whether an upright woman is to be found. And while I found scarcely a few good among men, so that one out of a thousand could be found, a good woman I could not find at all. For they all led me not to virtue but to luxury. And because the heart of man is diligently set on malice from youth, and almost all have offended God, in this ruin of the human race woman is readier for the fall. Of her the pagan poet too says: "... a fickle and changeable thing is woman, always". And the Apostle: Always, he says, learning and never coming to the knowledge of the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
