[[commentary]]
quote='''
I linger long in the land of the midday sun, for it was there and then that the spouse found her bridegroom at rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_108.html'
source_title="LETTER 108.12"

[[commentary]]
quote='''
What then does he say, Of the noonday demon? Because Abraham received the angels at noon, and Joseph invited his brothers to a meal at noon. For both Abraham and Joseph were holy, and therefore their banquet was in clear light and full sun, therefore they feed at noon. And I too, if I have full knowledge of the Scriptures, although it be the third hour, nevertheless I feed you at noon. Indeed even the bride in the Song of Songs says: "Where do you feed, she says, where do you lie down at noon?" You see that the bridegroom does not feed, does not recline at the third hour, but at noon. Where do you feed, where do you lie down, where do I find you, where do you take your delight, where can I find you, O my bridegroom? Do you wish to find me? At noon, in perfect knowledge, in good works, in clear light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_020.html'
source_title="Homily 20, on Psalm 90"

[[commentary]]
quote='''
From the onslaught and the noonday demon. We read in Genesis that Joseph fed his brothers at noon; and in the Song of Songs it is written: "Where do you lie down, where do you feed? At noon." Therefore, just as the saints have a noon and a light where they may feed and lie down, so too the devil, transfigured into an angel of light, has his ministers transfigured, as it were ministers of righteousness. Therefore when you see a heretic preaching, and saying, "This says Moses, this is written in the prophets, this in the Gospels," does it not seem to you—if you are ignorant of the treachery of his mind—that you are hearing an angel of the Savior speaking? But the simple think there is a certain noonday demon who at noon can more readily assail men. We, however, shall interpret the chiefs of the heretics as the noonday demons, who, feigning themselves angels of light, preach the doctrines of darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_068.html'
source_title="Homily 68, on Psalm 90 (Alternate Series)"
