[[commentary]]
quote='''
Howl — or shout for joy —, you shepherds, and cry out, and sprinkle yourselves with ashes, you nobles of the flock — or lament, you rams of the sheep —, for your days are fulfilled, that you should be slain, and your scatterings, and you shall fall like precious vessels — or like choice rams —. And flight shall perish from the shepherds, and deliverance from the nobles — or rams — of the flock. It should be noted that only in this place have the Seventy put 'jubilation' in a bad sense, for which the other translators rendered 'howling', as it is written in the Hebrew. Between the shepherds and the rams, or nobles, of the flock there is this difference: the shepherds pertain to rational beings, while the rams and nobles refer to the rich, who themselves too are called part of the flock. And as for what he adds: your days are fulfilled, that you should be slain, their days will be fulfilled then, when their sins have been fulfilled, and they will be scattered and will fall like precious vessels, so that once broken they cannot be restored, and the more precious they were before, the greater the loss in their breaking; or like choice rams, so that they may be a fat victim for those eager to devour them. Flight, he says, shall perish from the shepherds, when they have not shown repentance. Indeed, it is said to the Pharisees: brood of vipers, who showed you how to flee from the wrath to come? And in the Psalms we read: flight has perished from me. And deliverance, he says, from the nobles of the flock, or rams; apo koinou [in common, i.e. shared by both clauses] 'shall perish' is understood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
