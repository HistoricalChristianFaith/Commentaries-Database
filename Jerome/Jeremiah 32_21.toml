[[commentary]]
quote='''
And you brought your people Israel out of the land of Egypt: he rightly said 'your people'; for at the time when it was brought out, it was serving the commands of the Lord. 'And you brought them out with signs and portents, by which Egypt was struck, and with a strong hand and with an outstretched arm and with great terror', when the Red Sea gave a way to the people of Israel as they crossed and overwhelmed the army of Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
