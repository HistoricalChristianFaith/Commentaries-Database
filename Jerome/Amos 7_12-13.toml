[[commentary]]
quote='''
Moreover Jeroboam, despising the utterly empty messages of Amaziah, would give no answer to what he had sent him; whereupon Amaziah takes upon himself the authority of the priestly eminence, and speaks to Amos: You who see, go, flee into the land of Judah. The prophets, as we have often said, were formerly called seers, because they beheld with the eyes of the heart the things they said were to come. The prudent reader may ask why he calls him a seer, and by the prophetic name, the man whom he compels to leave the land of Israel. To him the answer must be either that he says it in mockery, κατὰ ἀντίφρασιν (by antiphrasis), since everything Amos says is a lie, or that he saw there were many among the people who listened to him gladly; for which reason he also reported to the king: Amos is making gatherings against you; he does not dare to do him an open injury, lest he seem to offend those who listen to him. Go, he says, into the land of Judah, in which you were born, where madmen are gladly listened to, and eat your bread there, or live there, or at any rate practise your art there, by which you may find yourself food, and prophesy there, because you have many there whom you are used to leading astray; but in Bethel, in which I am priest, you shall not prophesy any more, because it is the sanctuary of the king and the house of the kingdom. And this he says as a false priest, flattering the royal eminence, so that he does not say: It is the sanctuary of our God, and the house of the idol, but the sanctuary of the king and the house of the kingdom; for all who worship false gods have this custom, to ascribe their own pride to kings, so that what they themselves do may seem to have been done by the king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
