[[commentary]]
quote='''
Therefore this false prophet too will by no means take up the prophetic habit, lest under another's clothing and covering he deceive all the simple, but rather he will cleave the earth with the ploughshare and, given over to farming, will prove himself a man, and subject to the sentence of God, who spoke to Adam: Cursed is the ground in your work; in toil you shall eat of it all the days of your life; thorns and thistles it shall bring forth for you, and you shall eat the plants of the earth; and in the sweat of your face you shall eat bread.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
