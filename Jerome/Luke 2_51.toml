[[commentary]]
quote='''
The Savior too was subject to his parents (Luke 2), but when he was still twelve years old and differed in nothing from a slave, though Lord of all; for he had not yet reached the full age of a man that could take up the inheritance. But it is also written of him elsewhere: "For when all things have been subjected to him, then the Son himself will be subjected to him who subjected all things to himself, that God may be all in all" (1 Cor. 15:28). And all things will be subjected to him when he has said, "The Lord to my Lord: Sit at my right hand, until I make your enemies the footstool of your feet" (Ps. 109:1). In slaves who are subject, the Lord is subject. And just as he is said to be a curse for us, though he is not a curse but true blessing, so for us he is written either as subject or as not subject, according as we are either subject to God or not subject.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
