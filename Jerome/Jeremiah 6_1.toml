[[commentary]]
quote='''
Be strengthened, sons of Benjamin, in the midst of Jerusalem, and in Tekoa sound the trumpet, and over Beth-haccherem raise a signal — or a standard —, for evil has been seen — or has appeared — from the north, and great destruction! No one is unaware that Jerusalem is situated in the tribe of Benjamin. That Tekoa too is a small village situated on a mountain, twelve miles distant from Jerusalem, we see daily with our own eyes. Between these is another village, which in the Syriac and Hebrew tongue is named Bethacarma, and it too is set on a mountain. What he says, therefore, is this: 'Since from the north Nebuchadnezzar is now on the very point of coming and captivity is near and threatening, O inhabitants of Jerusalem, seize your arms and sound the trumpet in Tekoa and in Beth-haccherem raise the standard', he says, 'so that you may be able to resist your enemies!' Beniamin means 'son of the right hand', Thecua 'trumpet', Bethaccarem 'estate of the vineyard'. Let us refer all these things to the Church, so that, if she has transgressed and the onslaught of persecution has come, she may prepare herself to resist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
