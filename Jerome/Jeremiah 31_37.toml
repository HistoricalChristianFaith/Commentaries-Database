[[commentary]]
quote='''
Thus says the Lord: if the heavens above can be measured and the foundations of the earth beneath searched out, I too will cast off the whole seed of Israel for all that they have done, says the Lord. LXX: thus says the Lord: if the heaven is raised higher and if the floor of the earth is lowered beneath, I too will not reject the race of Israel, says the Lord, for all that they have done. In this place the Hebrew differs much from the common edition. Let us speak first according to the Hebrew: 'if the heavens above can be measured and their height known, or the foundations of the earth searched out and their extremities comprehended by reason, I too', he says, 'will cast off the whole seed of Israel for all that they have done, says the Lord. But as that is impossible, that we should know the summits of the heavens and the foundations of the earth, so this too will be impossible, that I should cast off the whole seed of Israel. But if I cast off the whole seed of Israel, then the summit of the heavens and the extremities of the lands will be measured'. This syllogism is woven in the Gospel too, when an impossible thing is compared with an impossible one: a camel will more easily enter through the eye of a needle than a rich man into the kingdoms of heaven. For as that cannot happen, so neither will this be able to happen; but if this happens, then that too will happen which was thought impossible. Those err, then, who expound this place otherwise, citing also that testimony, that the Son could have asked the Father and brought twelve legions of angels to his aid. The Seventy translated the contrary of this sense, saying: if the heaven is exalted higher and the floor of the earth lowered beneath, I too, he says, will not reject the seed of Israel, says the Lord, for all that they have done. If this is so, the nation of Israel will be rejected; for as the heaven cannot be higher than what it is, nor the earth lower than what it is, so too the race of Israel will by no means be able to be approved. If we see the Jews glorying in this testimony according to the Hebrew, let us agree with them that the whole seed of Israel has not been cast off; for not all have been cast off, but only those who were unbelieving.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
