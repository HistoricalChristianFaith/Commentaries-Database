[[commentary]]
quote='''
At the outer side too, according to the Seventy, there was a skillfully made channel which carried outside the ashes of the holocausts and the putrid matter of the flesh, or: there were two tables; and at the other side of the vestibule of the same gate two tables, that is, four on each side.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
