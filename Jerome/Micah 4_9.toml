[[commentary]]
quote='''
There follows: And now why are you drawn together in grief? Or, as it is written in the LXX: And now why have you known evils, you to whom, he says, the Lord is to come, and the first power and the kingdom? Why now are you drawn together in grief, or why have you known evils? At once it is answered and said: Because there is no king for you, and your counselor has perished, because pain has seized you like a woman in labor. Or surely, though you have all these, by your own fault you do not deserve the help either of the king or of the counselor. As for his saying: Why have you known evils, it is to be taken in this sense: that everyone who deserves and suffers evils is said to know evils and to be ignorant of good things. According to what is written also in the first book of Kingdoms (1 Samuel): The sons of Eli, sons of pestilence, did not know God. And elsewhere: He who keeps the commandment shall not know an evil word. And to sinners: Depart from me, says the Lord, you who work iniquity, for I do not know you. On the contrary, of the Lord: Him who had not known sin he made sin for us, God the Father being understood. But the King and angel of great counsel is understood to be the Savior, who perished for an unbelieving people, which pains seized like a woman in labor; for Israel, thinking that it held dominion, was suddenly laid waste. And as a woman giving birth cannot escape pain, so it could not avoid or put off the impending captivity and the army surrounding the city. Let us read the Scriptures, and we shall never find that holy women, except Rachel, gave birth with pain; and she, because she was on the road, and in the hippodrome, that is, the course of the horses that are sold in Egypt, bore a son of pain, whom his father afterwards called son of the right hand. Eve, cast out of paradise and hearing: In pains you shall bring forth, is described as having given birth in pain. The wife of Phinehas, bent over and not raising herself, like that woman in the Gospel whom the devil had bound, gave birth after she had learned that the ark of God was taken and of the ruin of the people. But Sarah, because she was holy and the ways of women had ceased in her, says when Isaac was born: God has made laughter for me, for whoever hears will rejoice with me. The pains, then, that seized the tower of the flock are the pains of the underworld and the pains of death, which surrounded indeed and hemmed in even the Savior, but could by no means seize him, as he himself says in Psalm 17 (18): The pains of death surrounded me, and the torrents of iniquity troubled me, and the pains of hell hemmed me in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
