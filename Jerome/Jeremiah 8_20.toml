[[commentary]]
quote='''
The harvest is past, the summer is ended; and we are not saved. Again the people speaks, which was shut up in Jerusalem by a long siege, saying that the seasons have changed and the circle of the year has rolled round, and all their hope has been made void and has passed away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
