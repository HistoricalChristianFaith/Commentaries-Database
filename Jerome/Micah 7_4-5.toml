[[commentary]]
quote='''
Now we must discuss it according to the earlier interpretation, in which we spoke of the heretics: Hear, O tribe, and who has adorned the city? Is it fire and the house of the wicked? And again, of the Church: Woe is me, for I have become like one who gathers stubble in the harvest. And once more: Woe is me, O soul, the reverent man has perished from the earth, and there is none among men to correct. And thereafter: The prince asks, and the judge has spoken peaceful words, by the desire of his soul. Hence a double curse follows: Woe, woe, your vengeances have come; now shall be their lamentation, and let us say that it is written of the heretics: Do not believe in friends, O simple peoples, and in depraved leaders who promise that they are friends and princes of the heresies; for they seek not your salvation but their own gains, and they trample the deceived flock under their feet; and in her who sleeps with you beware of believing anything; I can understand her to be nothing other than the flesh, so that we may not readily believe the blandishments of the flesh, lest the hardness of the mind and its manly constancy, subdued, should grow soft by her allurements.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
