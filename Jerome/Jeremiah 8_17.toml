[[commentary]]
quote='''
For behold, I will send among you serpents, basilisks — or most wicked or, as the Seventy translated, deadly —, for which there is no charm; and they shall bite you, says the Lord, incurably, with the pain of your failing heart. Who those are who come from Dan, and whose snorting was heard, and who reduced the whole land to a wilderness, the same prophetic word shows under another figure, calling them 'serpents', 'most wicked' or 'deadly', and, as Aquila translated, 'basilisks', which are called in Hebrew 'sapphonim'; for which I do not understand what his second edition meant by saying 'watchmen', unless perhaps because of the similarity of the word. For which there is no, he says, charm. For in vain do they pour out prayers to God against the ancient serpent, the twisting snake, who have scorned the commandments of God. Let us use this passage against those who, scorning the sayings of the Savior, are handed over to the adverse powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
