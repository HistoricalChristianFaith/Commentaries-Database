[[commentary]]
quote='''
In the second book of Kingdoms too, when David overcame the Moabites, the Scripture records two cords set apart for putting to death, and two for keeping alive. But what it means that of the Moabites some are set apart for death, others for life, Orpah shows, and Ruth: of whom the one, turned back to the idols and to her ancient homeland, is destined for death; the other, following her mother-in-law—whose name means "sweet"—says, "Your people is my people, and your God is my God."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
