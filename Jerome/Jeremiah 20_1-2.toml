[[commentary]]
quote='''
And Pashhur son of Immer, the priest, who had been appointed prince in the house of the Lord, heard Jeremiah prophesying these words. And Pashhur struck Jeremiah the prophet and put him in the stocks that were in the upper gate of Benjamin in the house of the Lord. For 'Phassur' the Seventy translated 'Phaschor', which means 'blackness of mouth'; and for the 'stocks' which we have given, the Seventy and Theodotion translated 'cataracten' [a trapdoor], Symmachus basanistērion or streblōtērion, both of which signify 'tortures'; we, however, said 'neruum' [stocks] according to common usage, a kind of torture that we also read of in the Acts of the Apostles, when the apostles Paul and Silas were given into the custody of the prison. Now this man was the high priest of the temple, and, the dignity of the priesthood having been given to him, he abuses it perversely, not to teach and to correct by word, but to terrify by torments. Hence both the Savior and the apostle Paul are beaten at the command of the high priest. Nor is it any wonder if even today the servants of God are beaten by Phaschor, are sent into prison, are kept in dreadful custody; for this power is given by God, so that the faith of the prophets may be shown. Yet he who beats is not the greater, but he who is beaten is the stronger. And the prophet patiently accepts the judgment of God and does not cry out against the blows, but considers the one who commands them. 'Emmer' means 'word', from which 'blackness' is often begotten, not by the fault of the parent, but by the wickedness of the one who degenerates. And the 'torture' by which the prophet is tormented is seen in the 'right' part, which is what 'Beniamin' means, and in the 'lofty' gate, which indicates not truth but the unjust power of the high priest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
