[[commentary]]
quote='''
Behold, we come to you; for you are the Lord our God. Truly the hills were liars, and the multitude — or strength — of the mountains; truly in the Lord our God is the salvation of Israel. Let the penitent say this, leaving behind all pride and the multitude or height of the mountains and hills through which he grew proud against God, and, prostrate in humility, let him speak: truly in the Lord our God is the salvation of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
