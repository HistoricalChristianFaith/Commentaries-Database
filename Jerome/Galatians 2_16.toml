[[commentary]]
quote='''
But knowing that a man is not justified by the works of the Law, except through faith in Jesus Christ: we too have believed in Christ Jesus, that we may be justified in faith in Christ, and not by the works of the Law.

Some say: if what Paul affirms is true, that no one is justified by the works of the Law but by faith in Jesus Christ, then the patriarchs and prophets and the saints who lived before the coming of Christ were imperfect. We must remind them that those are here said not to have attained righteousness who believe that they can be justified by works alone; but that the saints who lived in ancient times were justified by faith in Christ. For indeed Abraham saw the day of Christ, and rejoiced. And Moses esteemed the reproach of Christ greater riches than the treasure of the Egyptians; for he looked to the reward. And Isaiah saw the glory of Christ (Isa. 6), as John the Evangelist records; and Jude speaks of all in general: "I would remind you," he says, "since you once knew all things, that Jesus, saving the people out of the land of Egypt, afterward destroyed those who did not believe" (Jude 5). Hence it is not so much the works of the Law that are condemned as those who trust that they can be justified by works alone, since the Savior too says to his disciples: "Unless your righteousness abounds more than that of the Scribes and Pharisees, you shall not enter into the kingdom of heaven" (Matt. 5:20). At this point we must gather how many precepts there are in the Law which no one is able to fulfill. And on the other hand it must be said that some things of the Law are done even by those who do not know it; but that those who do them are not justified, for this reason, that they are done without faith in Christ: for example, not to lie with a man as one lies with a woman, not to commit adultery, not to steal, but rather to honor father and mother, and to do the other things that have been commanded. But if they bring forward to us examples from holy men, that, being versed in the Law, they performed the things that belonged to the Law, we shall say: Because the Law is not laid down for the righteous, but for the unjust and the insubordinate, for the ungodly and sinners, for the defiled and unclean (1 Tim. 1). And that one who has been taught by God has no need to be taught even about love, as Paul says: "But concerning love I have no need to write to you: for you yourselves are taught by God to love one another" (1 Thess. 4:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
