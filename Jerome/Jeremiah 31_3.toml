[[commentary]]
quote='''
From afar the Lord appeared to me — or to him — : and with an everlasting love I have loved you; therefore I have drawn you, having pity. And again I will build you and you shall be built, virgin Israel. Again you shall be adorned with your timbrels — or you shall take up your timbrels — and you shall go forth in the dance of those who make merry. Again you shall plant vineyards on the mountains of Samaria; plant plantings and gather the vintage! for there shall be a day on which the watchmen on Mount Ephraim shall cry: arise, and let us go up into Zion to the Lord our God! Because Israel had offended the Lord and had said: we have no king but Caesar, and: come, let us kill him, and the inheritance will be ours, and had withdrawn far from God, therefore the Lord after a long time appeared to him — not in the time of Zerubbabel and Ezra, after they were taken captive again —, but with an everlasting love, which will be blotted out by no end, he loved him, and drew him, having pity; for he was saved not at all by merit, but by clemency.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
