[[commentary]]
quote='''
It is superfluous for us to wish to interpret this little verse, since the holy Apostle argued about it most fully to the Hebrews. For this Melchizedech himself is without father, without mother, without lineage. And there he interprets most diligently why "without father, without mother, without lineage"; and it has been said by all churchmen that he is called "without father" according to the flesh, and "without mother" according to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_036.html'
source_title="Homily 36, on Psalm 109"
