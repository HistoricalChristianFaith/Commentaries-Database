[[commentary]]
quote='''
We can use this testimony against bishops who have received power in the Church and rather give scandal to those whom they ought to have taught and urged on to better things. These are often praised in the Church after death, and are publicly proclaimed blessed, whether by their successors or by the peoples, for things they had done not commendably. And so this too is vain: for because they are not spoken of as they acted, and are not at once rebuked in their sin (for no one dares to accuse a superior), therefore, as if holy and blessed and walking in the commandments of the Lord, they add sins to sins. An accusation against a bishop is difficult. For even if he has sinned, it is not believed; and if he has been convicted, he is not punished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
