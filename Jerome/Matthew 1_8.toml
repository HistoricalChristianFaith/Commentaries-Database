[[commentary]]
quote='''
In the fourth book of Kings we read, that Ochozias was the son of Joram. On his death, Josabeth, sister of Ochozias and daughter of Joram, took Joash, her brother's son, and preserved him from the slaughter of the royal seed by Athalias. To Joash succeeded his son Amasias; after him his son Azarias, who is called Ozias; after him his son Joatham. Thus you see according to historical truth there were three intervening kings, who are omitted by the Evangelist. Joram, moreover, begot not Ozias, but Ochozias, and the rest as we have related. But because it was the purpose of the Evangelist to make each of the three periods consist of fourteen generations, and because Joram had connected himself with Jezebel's most impious race, therefore his posterity to the third generation is omitted in tracing the lineage of the holy birth.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Joram begot Uzziah, and Uzziah begot Jotham. In the fourth book of Kings we read that Ahaziah was begotten of Joram; and when he died, Jehosheba, the daughter of King Joram, the sister of Ahaziah, took Joash, her brother's son, and rescued him from the slaughter that was being carried out by Athaliah; to him succeeded in the kingdom his son Amaziah, after whom reigned his son Azariah, who is also called Uzziah, and to him succeeded Jotham his son. You see, therefore, that according to the faith of history there were three kings in between whom the Gospel has passed over here; for Joram did not beget Uzziah but Ahaziah and the rest whom we have enumerated. But because it was the evangelist's purpose to set three sets of fourteen in different states of the times, and because Joram had mingled himself with the family of the most impious Jezebel, therefore his memory is taken away down to the third generation, lest it be set in the order of the holy nativity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
