[[commentary]]
quote='''
That which, according to the Seventy translators, is asked in the volume of Kings, what is meant when Elisha says (2 Kgs 2:14), Where is the God of Elijah APHPHO (אפא), is set down more plainly in the present place: where the Seventy translated now, the Hebrew has APHPHO, which we have translated now also; and Aquila, wishing to preserve the Hebrew idiom, set down καίπερτοι, a conjunction which the Latin tongue cannot render.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
