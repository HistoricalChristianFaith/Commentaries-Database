[[commentary]]
quote='''
I know that I have read in the commentaries of a certain man expounding the beginning of John the Evangelist, All things were made through him, and without him was made nothing, that he referred what is said, nothing, to wickedness; and again that he interpreted wickedness itself as the devil, and by this step, as it were, understood the very nothing that was made without Christ to be the devil. If, then, wickedness, or the devil, is nothing, and those who have been corrupted with corruption fled with no one, that is, nothing, pursuing, the devil pursued them in the guise of nothing. But if this seems to anyone too forced, and argued against the simplicity of Scripture by an artifice of eloquence rather than by true interpretation, let him follow either the former exposition or one he has found himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
