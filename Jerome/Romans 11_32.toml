[[commentary]]
quote='''
This is complete righteousness in man, not to impute any virtue that he can attain to himself but rather to the Lord, the giver.
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.13"

[[commentary]]
quote='''
The blessed apostle Paul explains this place more fully to the Romans, and we should be doing something superfluous if we wished to comprise in a brief discourse what he pursued through almost the whole epistle. For he says, after many things: God has shut up all things in unbelief, that he may have mercy on all (Rom 11:32). And marveling at the mysteries of the Lord he added: O depth of the riches of the wisdom and knowledge of God, how inscrutable are his judgments, and how untraceable his ways. And again, disputing about the unbelief of the Jews, he says: Have they so sinned that they should fall? God forbid; but by their offense salvation came to the Gentiles, to provoke them to emulation (Rom 11:11). And a little after: For if their casting away is the reconciliation of the world, what will their taking up be? Is it not life from the dead? And again: For I would not have you ignorant, brothers, of this mystery, lest you be wise in yourselves, that blindness has come in part upon Israel, until the fullness of the Gentiles comes in, and then all Israel should be saved. And a little after (Rom 11:25): As concerning the Gospel they are enemies for your sakes, but as concerning the election they are beloved for the sake of the fathers: for the gifts and the calling of God are without repentance. For as you, he says, once did not believe God, but now have obtained mercy because of their unbelief: so these too have now not believed in your mercy, that they too may obtain mercy. For God has shut up all things under sin, that he may have mercy on all. It is therefore not the cruelty of God but his mercy that one nation should perish so that all may be saved; that a part of the Jews should not see, so that the whole world may behold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
