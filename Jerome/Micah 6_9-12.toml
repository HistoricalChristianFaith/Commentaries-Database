[[commentary]]
quote='''
Let us therefore return to the beginning of the section. And, discussing it first according to the letter, let us, with the help of your prayers, strive to attain the spiritual sense. Hear, ten tribes of Samaria, what the Lord solemnly declares to you: Still there is fire, that is, iniquity, in the house of the ungodly Omri, and the treasures of ungodliness persist in the royal house. Do you wish to hear, one by one, the evils of which your city is full? Learn: a scant measure that provokes the wrath of God, a deceitful balance and differing weights, and men who sell their wares by one weight and buy by another. And if indeed the poor were doing this, their want could have defended the crime by necessity. But as it is, her rich men are full not so much of riches as of iniquity, because all riches, while they despoil others, are begotten by iniquity. Lying follows the amassing of riches, and the hand accustomed to storing up treasures possesses a deceitful tongue. Truth begets poverty, lying begets riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Thus far we have set out what seemed right to us according to the Hebrew; now, returning to the translation of the LXX translators, let us discuss each point as best we can. The Samaritan tribe, which cut itself off from the people of God, is called to hear. And it is told: In vain you fashion idols, you put together golden calves with a craftsman's hand, and in imitation of Jerusalem you wish to build another metropolis; for who will be able to adorn the city? Can fire, which is kindled by the flaming darts of the devil, and the house of the wicked man, which according to its hardness and impenitent heart treasures up for itself wrath on the day of wrath, and of the revelation of the just judgment of God? And injury increases iniquity, so that it not only plunders from the house of God, which is the Church, but also lays waste what belongs to others with pride and haughtiness. Can he be justified who, without balance and weight, fraudulently gathers his riches from the testimonies of the Scriptures, riches which are treasures of iniquity? For although the Lord commands: There shall not be in your bag a great weight and a lesser, these men, for the sake of shameful gain, always respect persons in judgment, and in the same case judge rich and poor now one way, now another, not according to the matter but according to the difference of their means; and the inhabitants of their city, which they think they are adorning with depraved doctrines and perverse teaching, speak lies, and set their mouth on high, and despise the simplicity of the people of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
