[[commentary]]
quote='''
Behold, the days are coming, says the Lord, and I will raise up for David a righteous branch — or a righteous Rising — and a king shall reign and shall be wise — or shall understand — and shall do judgment and righteousness in the land. In those days Judah shall be saved and Israel shall dwell confidently, and this is the name by which they shall call him — or he shall call him — : the Lord our righteous one or our righteousness, which in Hebrew is said 'sadecenu'. This, which has been wrongly added in the Seventy: in the prophets, must be cut away entirely; for another chapter follows, which has been passed over by them, and when it is finished the title is: to the prophets or against the prophets, of which we shall speak in its own place. So, the shepherds of the synagogue having been cast off, namely the scribes and Pharisees, and the remnant out of Israel having been saved, and the apostles of the Gospel having been set in the place of the former princes, there is brought in the shepherd of shepherds and prince of princes and king of kings and lord of lords, namely Christ our Savior, who is properly the 'righteous branch' or 'righteous Rising', of whom we read: in his days righteousness shall rise and in another place: behold a man, the Rising is his name, and beneath him it shall rise, and he shall build a temple to the Lord, so that, as in Isaiah he is called 'Emmanuhel', that is, 'God with us', so in Jeremiah he receives the name 'our righteousness'; whence the Apostle too says: who was made for us wisdom from God, and righteousness and sanctification and redemption. Opposed to him, the Antichrist and the devil who dwells in him is called in Zechariah the 'foolish shepherd'. And he shall do, he says, judgment and righteousness in the land; for the Father judges no one, but has given all judgment to the Son. In those days both the two and the ten tribes, Judah and Israel, shall be saved alike, and out of two rods, according to Ezekiel, one rod shall be made; and its name, if according to the Seventy the Lord shall have called him, shall be Iosedec, that is, the righteous Lord; if according to the Hebrew, who said: they shall call his name, it shall be said: the Lord our righteousness; for this is what adonai sadecenu means, for which Symmachus translated: O Lord, justify us!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
