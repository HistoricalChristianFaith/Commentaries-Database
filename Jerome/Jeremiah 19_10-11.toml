[[commentary]]
quote='''
And you shall break the flask before the eyes of the men who will go — or will go out — with you, and you shall say to them: Thus says the Lord of hosts: So will I break this people and this city, as a potter's vessel is broken, which cannot be restored any more. This is plainly said not of the Babylonian but of the Roman captivity; for after the Babylonians both the city was restored and the people was brought back into Judea and restored to its former abundance. But after the captivity which happened under Vespasian and Titus, and afterwards under Hadrian, the ruins of Jerusalem will remain until the consummation of the age, although the Jews think that a golden and jeweled Jerusalem is to be restored to them, and again victims and sacrifices and the marriages of the saints and the kingdom of the Lord the Savior on earth. Although we do not follow these things, yet we cannot condemn them, because many churchmen and martyrs have said them, so that each one may abound in his own sense and all things may be reserved to the judgment of the Lord. And just as an earthen vessel of clay, once it has been broken, cannot be re-formed into its old appearance, so too the people of the Jews and Jerusalem, overthrown, will not have their former state. Indeed, the very name of the city today is void, and it is called Aelia after Aelius Hadrian, and together with its former habitation it has also lost its former name, to strike down the pride of its inhabitants. And the names of the holy Cross and of the Resurrection signify not a city but a place, and not the greatness of the riches of old, through which the people of the Jews perished, but the glory of holiness, which our poor little Bethlehem possesses, having not gold and jewels, but the bread which was born in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
