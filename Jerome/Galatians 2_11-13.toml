[[commentary]]
quote='''
But when Peter had come to Antioch, I withstood him to his face, because he was reprehensible. For before certain men came from James, he used to eat with the Gentiles. But when they had come, he withdrew and separated himself, fearing those who were of the circumcision; and the other Jews also consented to his pretense, so that even Barnabas was led by them into that pretense.

From the fact that Peter, before certain men came from Jerusalem to Antioch, used to eat with the Gentiles, it is shown that he had not forgotten the precept: to call no man common and unclean. But because, on account of those who still thought that the Law must be observed, he had withdrawn himself a little from table-fellowship with the Gentiles (so that even the rest who were of the Jews did likewise, and Barnabas, who was preaching the Gospel among the Gentiles together with Paul, was compelled to do this), those at Antioch who had believed from among the Gentiles and had not been circumcised were being driven to cross over to the burdens of the Law, not understanding the dispensation of Peter, by which he wished the Jews to be saved, but thinking that this was how the principle of the Gospel stood. And so, when the apostle Paul saw that the grace of Christ was in peril, the old warrior used a new art of fighting, so that he himself might correct the dispensation of Peter, by which Peter wished the Jews to be saved, by a new dispensation of contradiction, and might withstand him to his face: not censuring his purpose, but contradicting him as it were in public, so that, through the fact that Paul resisted him and censured him, those who had believed from among the Gentiles might be preserved. But if anyone thinks that Paul truly withstood the apostle Peter, and for the truth of the Gospel fearlessly did injury to his predecessor, his view will not stand against the fact that Paul himself also became a Jew to the Jews, in order to win the Jews; and Paul will be held guilty of the same pretense, when he shaved his head at Cenchreae and, having made himself bald, offered an offering in Jerusalem (Acts 18), and circumcised Timothy (ibid., 16), and practiced the barefoot rites, which certainly belong most manifestly to the ceremonies of the Jews. If, therefore, he who had been sent to preach to the Gentiles did not think it beside the point to say: "Be without offense to the Jews and to the Church of God" (1 Cor. 10:32); just as I too please all men in all things, not seeking what is profitable to me, but what is profitable to many, that they may be saved; and if he did some things that were contrary to the freedom of the Gospel, so as not to cause the Jews to stumble: by what authority, with what face does he dare to reprehend in Peter, who was the apostle of the circumcision, what he himself, the apostle of the Gentiles, is charged with having committed? But, as we have already said before, he withstood Peter and the others before the public face, so that the hypocrisy of observing the Law, which was harming those who had believed from among the Gentiles, might be corrected by the hypocrisy of rebuke, and both peoples might be saved, while those who praise circumcision follow Peter, and those who are unwilling to be circumcised proclaim the freedom of Paul. As for his saying he was reprehensible, he therefore moderated the abstinence from food, so that we may understand that Peter was reprehensible not so much to Paul as to those brothers with whom he had formerly eaten and from whom he afterwards separated himself. That pretense is useful, and to be adopted at the right time, let the example of Jehu, king of Israel, teach us: he could not have killed the priests of Baal unless he had feigned that he wished to worship the idol, saying: "Gather to me all the priests of Baal: for if Ahab served Baal in a few things, I will serve him in many" (2 Kings 10:18). And David, when he changed his face before Abimelech, and he dismissed him, and he went away (1 Sam. 21). Nor is it surprising that men, although righteous, should nevertheless pretend some things for a time, for their own salvation and that of others, since even our Lord himself, having no sin, nor the flesh of sin, took on the pretense of sinful flesh, so that, condemning sin in the flesh, he might make us in himself the righteousness of God. Paul had certainly read in the Gospel the Lord commanding: "But if your brother sins against you, go and rebuke him between you and him alone. If he hears you, you have gained your brother" (Matt. 18:15). And how, when the Lord had commanded that this be done even concerning the least of the brothers, did he dare to censure the greatest of the apostles to his public face so impudently, so resolutely, unless it had pleased Peter too to be censured in this way, and Paul was not doing injury to him of whom he had said before: "I came to Jerusalem to see Peter, and stayed with him fifteen days: but other of the apostles I saw none"? And again: "For he who worked in Peter for the apostleship of the circumcision". And below: "Peter and James and John, who seemed to be pillars", and the rest that he declaims in his praise. Several times, when as a young man at Rome I was declaiming controversies and exercising myself for real contests with fictitious lawsuits, I used to run to the tribunals of the judges, and I saw the most eloquent of the orators contending with one another with such bitterness that, often leaving the cases aside, they turned to insults of their own and bit one another with a jesting tooth. If they do this so as to incur no suspicion of collusion in the eyes of the defendants, and deceive the people standing around, what do we think such great pillars of the Church, Peter and Paul, such great vessels of wisdom, ought to have done between the disagreeing Jews and Gentiles, except that their pretended contention should become the peace of the believers, and the faith of the Church should be brought into harmony by a holy quarrel between them? There are those who do not think that Cephas, whom Paul here writes that he withstood to his face, is the apostle Peter, but another of the seventy disciples called by this name. And they say that Peter could by no means have withdrawn himself from table-fellowship with the Gentiles, since he had even baptized the centurion Cornelius; and, when he had gone up to Jerusalem, as those who were of the Circumcision disputed against him and said: "Why did you go in to men who have the foreskin, and eat with them" (Acts 11:3)? he concluded his response, after the narration of the vision, with this ending: "If therefore God gave them the same grace as he gave us also, who believed in the Lord Jesus Christ, who was I, that I could forbid God? When they heard these things they were silent, and glorified God, saying: Then God has given repentance unto life to the Gentiles also"; especially since Luke, the writer of the history, makes no mention of this dissension, nor ever says that Peter was at Antioch with Paul; and that room would be given to Porphyry in his blasphemy if Peter is believed to have erred, or Paul to have impudently refuted the prince of the apostles. To these we must reply, first, that we do not know the name of some other Cephas, except him who in the Gospel, and in the other Epistles of Paul, and in this one too, is written now Cephas, now Peter. Not that Peter signifies one thing and Cephas another, but that what we in Latin and Greek call petra, "rock", the Hebrews and Syrians, because of the nearness of their languages to one another, call Cephas. Next, that the whole argument of the epistle, in what is said obliquely about Peter, James and John, is opposed to this understanding. Nor is it surprising if Luke kept silent about this matter, since by the historian's license he also passed over many other things which Paul recounts that he endured; and it is not at once a contradiction if one writer thought something worth relating for some reason, while another left it out among other things. Finally, we have received that Peter was the first bishop of the Church of Antioch, and was translated from there to Rome, which Luke omitted entirely. Lastly, if on account of Porphyry's blasphemy another Cephas must be invented by us, so that Peter may not be thought to have erred, countless things will have to be erased from the divine Scriptures which he attacks because he does not understand them. But against Porphyry too we shall fight in another work, if Christ commands; now let us pursue the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
