[[commentary]]
quote='''
And I took for myself two staffs: one I called Beauty, and the other I called Cords; and I fed the flock.

And I cut off three shepherds in one month, and my soul was straitened over them, since their soul also varied against me. And I said: I will not feed you; what dies, let it die, and what is cut off, let it be cut off, and let the rest devour each one the flesh of his neighbor. LXX: And I will take for myself two staffs: one I called Beauty, and the other I called Cord; and I will feed the sheep. And I will take away three shepherds in one month, and my soul will grow heavy upon them, since their souls also were roaring against me. And I said: I will not feed them; what dies, let it die, and what fails, let it fail, and let the rest devour each one the flesh of his neighbor. Above he had said: For this, O poor of the flock; and, a break being made by ἀποσιωπήσει (by aposiopesis), there was understood: Give heed, because the gates of Lebanon are opened, and the oaks of Bashan, the firs and the cedars are cut down; and he had added, threatening: I will no longer spare the inhabitants of the land, says the Lord. And he seemed to say this of the Jewish people alone, because, having killed the prophets, they had also laid hands on the Son of God, and with rash voice had cried out: His blood be upon us, and upon our children. Now the Creator and Lord of the universe sets forth the mysteries of his world, and says that he had two staffs, one of which he called Beauty, the other Cords, and that with the two staffs he fed the flock bound together; and also that he cut off three shepherds in one month, and that his soul was straitened, or indignant, or — as the Seventy translated —, my soul will grow heavy upon them; there is no doubt that he means the shepherds whom he cut off in one month. And he gives the reason why he was so indignant with the shepherds as to cut them off in one month: Since their soul also, he says, varied against me. And the sense is: They did not love me with a full heart, nor did the hireling shepherds love the true shepherd: For the good shepherd lays down his life for his sheep. Wherefore I too, in indignation, pronounced sentence, and to those very shepherds whom I had cut off in my indignation, or else, the shepherds being cut off, to the flock left behind, I said: I will not feed you; but what has chosen death, let it die by its own will, and let them devour one another and tear one another apart in mutual slaughter. We have said this παραφραστικῶς (by paraphrase), to pave the path for the explanation to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
