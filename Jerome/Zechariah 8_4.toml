[[commentary]]
quote='''
But if we refer it to the Church, of which it is said: Glorious things are spoken of you, city of God, and: The rush of the river gladdens the city of God; the Most High has sanctified his tabernacle; God in the midst of her shall not be moved, who can doubt that the streets of the Church are the virtues, in which wisdom acts confidently and is proclaimed on the tops of the walls? Hence the psalmist too cries out to the Lord: Your commandment is exceedingly broad. Seeking the Lord and Savior in these streets, the bride says in the Song of Songs: I will rise and go about the city, in the market and in its streets, until I find him whom my soul has loved. So there shall dwell, or sit, old men and old women, of whom it is written — if, however, anyone is pleased to receive the book —: Honorable old age is not that of long time, nor is it reckoned by the number of years. But grey hairs are men's prudence, and a spotless life is old age; of such the Lord also speaks to Moses: Appoint with you seventy elders, whom you yourself know to be elders; for which reason, too, before Abraham no one was called an old man, of whom we read it written: Abraham, failing, died, nourished in a good old age, an old man and full of days. For grey hairs are the glory of old men, of which it is said: A man's grey hairs are his wisdom. These, for the multitude of their days, shall hold rods and staffs in their hands, and shall say to their disciples: What do you wish? Shall I come to you with a rod, or in a spirit of gentleness and meekness? For he who brings forth wisdom from his lips strikes the senseless man with a rod. And on the contrary: He who spares his staff hates his son, but he who loves him corrects him diligently. And not only old men but old women too shall sit in the streets of Jerusalem, whom Paul describes with apostolic mouth: Honor, he says, widows who are truly widows, and in another place: Let a widow be chosen not less than sixty years of age, who has been the wife of one husband, having testimony in good works; if she has brought up children, if she has received guests, if she has washed the feet of the saints, if she has ministered to those placed in tribulations, if she has pursued every good work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
