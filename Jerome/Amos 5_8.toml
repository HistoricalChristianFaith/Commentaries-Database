[[commentary]]
quote='''
But what this righteousness is, the following verse shows: Him who makes Arcturus and Orion, and turns darkness into morning, and changes day into night. He of whom he had said above: Forming the mountains, and creating the wind, and announcing to man his speech, making the morning mist, and stepping upon the high places of the earth: the Lord God of hosts is his name, he it is who is the Creator of Arcturus, which in Hebrew is called Chima, and by Symmachus and Theodotion is rendered εἰς πλειάδα (the Pleiades), which is commonly called Boötes. And as for what follows, Orion, which in Hebrew is called Chasil, Symmachus translated it absolutely as stars, Theodotion as the evening star. But the Hebrew who instructed us in the holy Scriptures thinks that Chasil means splendour, and signifies in general the shining stars. But when we hear Arcturus and Orion, we ought not to follow the fables of the poets and the ridiculous and monstrous lies with which they try to defame even heaven and to set the reward of debauchery among the stars, saying: "He scans Arcturus and the rainy Hyades and the twin Triones, and Orion armed with gold"; but we ought to know that the Hebrew names, which among them are called otherwise, have been carried over into our language by the terms of the Gentile fables, since we cannot understand what is said except through those terms which we have learned by use and drunk in with error. Hence also in the book of Kings the Greeks translated the Hebrew Raphaim as titans, which is a most celebrated fable among the heathen, from which they write γιγαντομαχίας (battles of the giants) in praise of the gods; and the Typhoean shafts, and Mount Etna placed upon Enceladus, at whose movement Trinacria trembles. But this God, the Creator of all things, who makes Arcturus and Orion, changes night into day and day into night, and filters the most bitter waters of the sea, suspended by the heat of the upper air, and distils them into the sweet taste of the rains, like a medicinal cupping-glass, which by the heat of its upper round draws moisture and blood upward; from which we learn whence the rains come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But in saying: Making all things and transforming them, they comprehend Arcturus and Orion in one word, neglecting to carry over the proper sense of the names into the Greek language. And God transforms all things when he makes heavenly things from earthly, and bestows on men the likeness of angels; when the moon will glow with the brightness of the sun, and the sun will have sevenfold light; when man, animal and weak and corruptible, is transformed into one spiritual and strong and incorrupt, changing his glory, not his nature; when those who understand will shine like the splendour of the firmament, and what is written will be fulfilled: One is the glory of the sun, another the glory of the moon, another the glory of the stars. For star differs from star in brightness; so also is the resurrection of the dead; when every creature will be set free from the slavery of corruption into the liberty of the glory of the sons of God. This God who transforms all things also changes the shadow of death into light, when those who sat in darkness and the shadow of death saw a great light, and those who were sons of night and of darkness became sons of light and sons of the day. This is the God who also turns the day into darkness, the day of those who said: Crucify, crucify him, take such a one from the earth; when from the sixth hour, as a type of Jewish blindness, the day was turned into night. And not only according to the letter but also according to a higher understanding, the light which rose for them in the law and the prophets was turned into darkness, since they do not know what they read, what they hear, so that there is fulfilled concerning them what is written: Let their eyes be darkened, lest they see, and bend their back always. This God calls to himself the water of the sea and pours it out upon the face of the earth, making righteous men out of sinners. To expound this, for the sake of brevity let us set down only one example. Paul the Apostle, like a violent whirlwind and a savage tempest and the flood of a swelling sea, was persecuting the Church of God and striving to crush it. Being called by God, he was poured out upon the face of the whole earth, to preach the Gospel from Jerusalem as far as Illyricum, and to build not upon another's foundation, where there had already been preaching, but to press on as far as the Spains, and to run from the Red Sea, nay rather from ocean to ocean, imitating his Lord and the sun of righteousness, of whom we read: His going forth is from the highest heaven, and his course to its highest point, so that the earth gave out before him sooner than his zeal for preaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
