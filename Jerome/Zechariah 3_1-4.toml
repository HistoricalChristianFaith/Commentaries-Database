[[commentary]]
quote='''
It is written in Zechariah: "And he showed me Jesus the great priest standing before the angel of the Lord, and Satan stood at his right hand, to fight with him." If, then, the devil stands at the right hand of the Lord, how does he now say of Judas, And let the devil stand at his right hand? But see what he says. The devil stood at the right hand of Jesus to oppose him: that is, he wished to be an adversary to his right hand. But here he does not say that he wishes to fight, but that he had already conquered Judas. There the devil desires to fight against the right hand; but here he has gained mastery over the right hand of Judas. But this too must be considered. At that time he stood at the Lord's right hand to oppose him, when Jesus had filthy garments. For so it is written there as well: "And Jesus had filthy garments." As long as the Lord Jesus has filthy garments, so long does the devil stand at his right hand: as long as he bears our sins, in our sins the devil opposes him. But when it is said in Zechariah, "Take away his filthy garments and clothe him with the changes of raiment," immediately Jesus says to the devil, "The Lord rebuke you, Satan, may he rebuke you who has chosen Jerusalem."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_035.html'
source_title="Homily 35, on Psalm 108"
