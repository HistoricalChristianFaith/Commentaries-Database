[[commentary]]
quote='''
There is an evil which I have seen under the sun, as it were ignorance going forth from the face of the powerful one: that a fool is set in great heights and the rich sit in a low place. I have seen slaves on horses and princes walking like slaves upon the earth. In place of what we have put: As it were ignorance going forth from the face of the powerful one, Aquila and Theodotion and the Seventy translated: As it were something not voluntary, that is, ὡς ἀκούσιον, from the face of the prince. Joining on to this, Symmachus says: A fool set in great height; but the rich sitting humble. And so he records that he has observed this iniquity too in the world, which makes the judgment of God seem unjust: that, whether through ignorance or apart from his will, it happens that, either in the powers of the world or in the government of the Church, those who are rich in speech and wisdom, rich also in good works, often sit without honor, while any imprudent man holds the government in the Church. And this happens from the countenance of him who has power in the world, while he presses down all men of power and learning and does not allow them to appear among the peoples, but makes those whom he knows to be imprudent greater in the churches, so that the blind are led by the blind into the pit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
