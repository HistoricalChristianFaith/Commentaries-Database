[[commentary]]
quote='''
And this will come about because they will enjoy the presence of the Lord, when the hostile nations which had captured them will perish and these will be set free from among the nations. And he teaches that they were handed over by no means to punishment but to instruction, so that they might be judged as his own, not destroyed as strangers; for he who does not believe has already been judged, that is, judged beforehand unto destruction. And what he added: so that you may not seem to yourself guiltless, or according to Symmachus: and cleansing, I will not cleanse you, or according to Aquila: when I have instructed you through judgment, I will by no means make you innocent, signifies that the whole world stands in need of the mercy of God, and that no one, however holy he may be, goes to the judge secure; against the new heresy sprung from the old, which supposes that in this age and in this mortal flesh, before this corruptible puts on incorruption and this mortal puts on immortality, there is perfection in anyone, and that the righteous man can fulfill all the virtues at once.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
