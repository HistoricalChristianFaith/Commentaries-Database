[[commentary]]
quote='''
The Spirit of the Lord God is upon me, because the Lord has anointed me; he has sent me to bring good news to the meek, to heal the broken in heart, and to preach indulgence to the captives, and opening to those who are shut in; and to proclaim a year of favor to the Lord, and a day of vengeance to our God; to comfort all who mourn; to appoint for those who mourn in Zion, and to give them a crown instead of ashes, the oil of joy instead of mourning, a mantle of praise instead of a spirit of sorrow. LXX: The Spirit of the Lord is upon me, because he has anointed me; he has sent me to preach the gospel to the poor, to heal the broken in heart, to preach remission to the captives and sight to the blind, to call an acceptable year to the Lord, and a day of retribution, to comfort all who mourn, to give to those who mourn in Zion, to give them glory instead of ashes, the anointing of gladness to those who mourn, a garment of glory instead of a spirit of sorrow. He who said above, I the Lord will gather them in time, or, according to the Hebrew, I the Lord will do this suddenly in its time, says next, The Spirit of the Lord God is upon me: not that the Lord God has a Lord God, but that, according to the dispensation of the flesh he assumed, he speaks the things that are lowly. To him the Psalmist had already said: You have loved righteousness and hated iniquity; therefore God, your God, has anointed you with the oil of exultation above your fellows (Ps 44 [45]:8). For when fellows are named, understand the nature of the flesh, since God has no fellows of his substance. And because the anointing was spiritual, and by no means of a human body, as it was among the priests of the Jews, he is therefore said to have been anointed above his fellows, that is, the other saints. His anointing was fulfilled at the time when he was baptized in the Jordan, and the Holy Spirit came down upon him in the form of a dove and remained on him (John 1). Of him this same Prophet also said: A rod will come forth from the root of Jesse, and a flower will rise up from its root, and the spirit of God will rest upon him, the spirit of wisdom and understanding, the spirit of counsel and strength, the spirit of knowledge and godliness (Isa 11:1, 2). Hence the Savior too, after he was baptized in the Jordan, when he had come to Nazareth, where he had been brought up, entered their synagogue on the sabbath day, according to custom; and when he had stood up to read, the book of the prophet Isaiah was given to him, and on opening it he found written: The Spirit of the Lord is upon me, because he has anointed me; he has sent me to preach the gospel to the poor, to preach remission to the captives and sight to the blind, to set the broken at liberty, to preach the acceptable year of the Lord. Then he rolled up the book, gave it back to the attendant, and sat down; and the eyes of all who were in the synagogue were fixed on him, and he began to say to them: Today this Scripture has been fulfilled in your ears; and all bore witness to him, and marveled at the words of grace that came forth from his mouth. If, then, the prophecy was fulfilled at that time, how do some refer what is said here to the times of the consummation? Unless perhaps we can say this: that what was then fulfilled in part is to be fulfilled more fully when the whole people of God will be righteous. For now we know in part and we prophesy in part; but when that which is perfect has come, the things that are in part will be done away (1 Cor 13). He was anointed, then, with the Holy Spirit to bring good news to the poor, or the meek, saying to them in the Gospel: Blessed are the poor in spirit, for theirs is the kingdom of heaven (Matt 5:3). And: Blessed are the gentle, for they shall possess the land (ibid., 4). And he was sent to heal those who are broken in heart (Luke 4), and who say: A broken and humbled heart God does not despise (Ps 50 [51]:19). Or, according to Symmachus and Theodotion, to bind up the wounds of sinners, to preach remission to the captives, sight to the blind, or opening to those who are shut in, which Symmachus translated more plainly, release to those in chains. Of whom, or rather to whom, it is said above: Behold, I have set you as a light of the nations, to open the eyes of the blind, to lead out the bound from their chains, and from the prison house those who sit in darkness (Isa 42:6, 7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
