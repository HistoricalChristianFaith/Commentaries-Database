[[commentary]]
quote='''
Do not give us over to reproach for your name's sake, nor bring upon us the dishonor of the throne of your glory! Remember, do not make void your covenant with us! Let us consider the throne of God's glory to be not only the temple of Judea, which has often been destroyed, but every saint, in whom, according to that which is written: You have dashed his throne to the ground, it is dashed down and destroyed when he has offended God by a multitude of sins; but nevertheless he who has perished by his own fault is upheld by the clemency of the Lord, which is exchanged for the severity of the sentence if the Lord makes void his pact, by which he has promised that we shall be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
