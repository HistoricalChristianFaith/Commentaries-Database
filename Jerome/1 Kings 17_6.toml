[[commentary]]
quote='''
Do you wish to know yet another mystery about ravens? Elijah, which is interpreted "God the Lord": Elijah—that is, our Lord and Savior—suffers persecution from the Jews; and is fed by ravens, the people of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"
