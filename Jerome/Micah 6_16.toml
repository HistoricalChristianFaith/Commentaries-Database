[[commentary]]
quote='''
Hear, O tribes, and who will approve it?

Still there is fire in the house of the ungodly, treasures of ungodliness, and a scant measure full of wrath. Shall I justify an ungodly balance and the deceitful weights of the bag? By which her rich men were filled with iniquity, and those who dwell in her spoke lies, and their tongue is deceitful in their mouth. And I therefore have begun to strike you with ruin for your sins. You shall eat and not be satisfied, and your humiliation is in the midst of you; and you shall lay hold and shall not save; and those whom you save I will give to the sword. You shall sow and not reap, you shall tread the olive and not be anointed with oil, and the must, and not drink wine. And you have kept the precepts of Omri and every work of the house of Ahab; and you have walked in their wills, that I might give you up to ruin, and those who dwell in her to hissing, and you shall bear the reproach of my people. LXX: Hear, O tribe, and who will adorn the city? Is it fire, and the house of the wicked man treasuring up wicked treasures, and iniquities with injury? Shall the wicked man be justified in the balance, and deceitful weights in the bag, from which they have filled up the riches of their ungodliness, and those who dwell in her have spoken wicked things, and their tongue is exalted in their mouth. And I have tormented you with ruin on account of your sins; you shall eat, and not be satisfied; and I will cast you out into yourself, and you shall lay hold, and shall not save; and whoever shall be saved shall be handed over to the sword; you shall sow and not reap; you shall press the olive and not be anointed with oil; and the grape, and not drink wine; and the statutes of my people shall be scattered, and all the works of the house of Ahab; and you have walked in their counsels, that I might hand you over to ruin, and its inhabitants to hissing, and you shall receive the reproaches of the peoples. In this section the LXX disagree greatly with the Hebrew truth, and most of all at the beginning: Hear, O tribe, and who will adorn the city? And the statutes of my people shall be scattered. In place of which we have put, for the sake of the coherence of the discourse: And you have kept the precepts of Omri, although in the Hebrew too it is written: And the precepts of Omri have been kept, and all the works of the house of Ahab. For if Ammi had been written in the Hebrew, the LXX would rightly have translated it 'of my people'; but as it is, since Amri is written, with the letter res added, it denotes not the name of the people but the father of Ahab, of whom the history of Kings relates, and no one is in doubt that it is an error. In short, after the father's name the son is placed, and it is said: And all the works of the house of Ahab.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
But because you kept all the ceremonies of idolatry which Omri, the ungodly king, had established, and observed every work of the house of Ahab and Jezebel in place of my law, I was driven by your crime to give you and your inhabitants up to hissing, and that you should bear the reproach of my people, while, taken captive by the Assyrians, you are conquered as if you were the people of God, and on your account my name is blasphemed among the nations. It should be noted in the present passage that where we read: And you shall bear the reproach of my people, or, as the LXX translated: You shall receive the reproaches of the peoples, Ammi is written in the Hebrew for 'of my people'. If, then, Ammi means 'of my people', no one doubts that above, for Amri, 'my people' was wrongly translated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And the statutes of my people, or of Omri, shall be destroyed, and all the works of the house of Ahab, of those who stood forth as patriarchs and princes in the heresies. These we can refer either to the contrary powers or to the heresiarchs, such as were Marcion and Basilides, and recently Arius and Eunomius. And you walked in their wills, namely those of Omri and Ahab. And he says well, in their wills. For the teaching of wicked masters is not the teaching of God, but the inventions of their heart. And I will hand you over to ruin, so that you perish in so far as you are heretical. And your inhabitants to hissing, either so that you may follow the hissing of the good shepherd, according to Zechariah, who says: I will hiss for them and gather them, because I have redeemed them. Or surely to the hissing of the dragon, that is, to the destruction of the flesh, that the spirit may be saved, and that, being corrected, they may learn not to blaspheme. And they will suffer all this so that they may understand their error, that they have borne the reproaches and sins of all nations and of many peoples. I know that some have referred to the Church what we have interpreted of the heresies. But how the name of Omri and Ahab, princes of Samaria, can be referred to Jerusalem and Judah, under whose names the Church is interpreted, I do not well understand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
