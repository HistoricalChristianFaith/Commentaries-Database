[[commentary]]
quote='''
I know that some interpret the man who owed the ten thousand talents to be the devil, and by his wife and children who were to be sold when he persevered in his wickedness, understand foolishness, and hurtful thoughts. For as wisdom is called the wife of the righteous man, so the wife of the unrighteous and the sinner is called foolishness. But how the Lord remits to the devil ten thousand talents, and how he would not remit ten denarii to us his fellow-servants, of this there is no ecclesiastical interpretation, nor is it to be admitted by thoughtful men.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
There was brought to him one who owed ten thousand talents. I know that some interpret this man who owed ten thousand talents as the devil; by his wife and children, who are to be sold while he persists in malice, they would have folly and evil thoughts understood; for just as the wife of the righteous man is said to be wisdom, so, they say, the wife of the unrighteous man and sinner is called folly. But how the Lord should forgive him ten thousand talents and he not forgive us, his fellow servants, a hundred denarii, is neither the interpretation of the Church nor one to be accepted by prudent men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
