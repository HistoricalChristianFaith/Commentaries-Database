[[commentary]]
quote='''
But now let us return to our own. God threatens that he will roll a cart weighed down with hay or stubble beneath them, so that, since they have no grain to be stored up in barns, their hay and stubble may be burned up in the fire. This is the hay of which the prophet says: Let them become like the hay of the buildings, which withers before it is plucked up. And: All flesh is hay. And the stubble is that over whose burning the prophet laments so mournfully, saying: Woe is me. For I have become like one who gathers stubble in the harvest, and like grapes at the vintage, when there is no cluster to eat, the first-ripe. Woe is me. O soul, for the reverent man has perished from the earth, and there is none among men who does what is right: all are judged in blood, and the rest. This is the hay and stubble of which the Apostle also speaks: Wood, hay, stubble, each one's work will become manifest, because in the day of the Lord it will be revealed in fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
