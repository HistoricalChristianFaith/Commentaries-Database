[[commentary]]
quote='''
The word that came to Jeremiah from the Lord, when King Zedekiah sent to him Pashhur son of Malchiah, and Zephaniah son of Maaseiah, the priest, saying: Inquire of the Lord for us, for Nebuchadnezzar, king of Babylon, is fighting against us; if perhaps the Lord will do for us according to all his wonders, and he will withdraw from us. Above, the high priest Phassur or Phaschor, who struck Jeremiah, had Immer as his father, but this Phassur is the son of Malchiah; this is said so that no one may think him the same man. Now King Zedekiah sends to the prophet without wishing either the people or the princes to know, so that by a secret message through envoys he may learn what sentence the Lord holds concerning the city of Jerusalem and the people of the Jews. And what he adds: for Nebuchadnezzar, king of Babylon, is fighting against us, shows that Zedekiah asks this of the prophet when Jerusalem was already besieged. And it must be noted that in the prophets, and above all in Ezekiel and Jeremiah, the order of kings and of times is by no means kept, but, in reverse order, what according to the history happened later is related first, and what was done first is related later; for it is one thing to write history, another to write prophecy. Thus in the present place Zedekiah, who was captured with the city of Jerusalem, is written of as sending to Jeremiah, and that at the time when Jerusalem was being besieged; and afterward is narrated the history of Jehoiakim his brother, who was king before him, and of Jehoiachin, that is, Jeconiah, who was the son of Jehoiakim, concerning whom we shall speak in what follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
