[[commentary]]
quote='''
Do not fear, O land: exult and be glad, for the Lord has magnified himself in acting; do not fear, animals of the region, for the beautiful places of the desert have sprouted, for the tree has borne its fruit, the fig tree and the vine have given their power; and sons of Zion: exult and be glad in the Lord your God, for he has given you a teacher of righteousness, and he will make the morning rain come down to you, and the late rain in the beginning; and the threshing floors shall be filled with grain, and the presses shall overflow with wine and oil, and I will restore to you the years which the locust, the cankerworm, and the blight, and the caterpillar have eaten. My great strength which I sent among you; and you shall eat, feeding, and be filled, and you shall praise the name of the Lord your God, who has done wonders with you, and my people shall not be confounded for evermore; and you shall know that I am in the midst of Israel, and I am the Lord your God, and there is none besides, and my people shall not be confounded forever. LXX: Take courage, O land, rejoice and be glad, for the Lord has magnified himself in acting; take courage, cattle of the field, for the plains of the solitude have sprouted, for the tree has borne its fruit, the fig tree and the vine have given their strength; and sons of Zion, rejoice and be glad in the Lord your God, for he has given you foods of righteousness, and has rained on you the early and the late rain, as from the beginning, and the threshing floors shall be filled with wheat, and the presses shall overflow with wine and oil. And I will repay you for the years in which the locust, and the cankerworm and the blight, and the caterpillar have eaten. My great strength which I sent among you, and you shall feed, eating, and be filled; and you shall praise the name of the Lord your God, who has done wonders with you, and my people shall not be confounded forever, and you shall know that I am in the midst of Israel, and I am the Lord your God, and there is none besides me, and my people shall not be confounded forever. For all that he had threatened above, he now promises the contrary. Above he had said: Fire has eaten the beautiful places of the desert, and flame has kindled all the trees of the region, and the beasts of the field, like a threshing floor thirsting for rain, have looked up to you, because the springs of waters are dried up, and fire has devoured the beautiful places of the desert. Now he softens sadness with glad things, and turns tears into laughter. Do not, he says, fear, animals of the region, for the beautiful places of the desert have sprouted, for the tree has borne its fruit, the fig tree and the vine have given their power; and so great will be the abundance of all things that I will not merely give you grain, wine and oil with which to be filled, but the threshing floors will be filled with grain, and the presses will overflow with wine and oil, so that you may be able not only to eat yourselves, but also to supply others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
