[[commentary]]
quote='''
'And since I,' he says, 'am going to do these things of my own accord and to restore you at a fixed time, you are deceived in vain and think that you have prophets in Babylon who promise you false things; so know, then, that you ought by no means to hope for a return now, but to build houses, plant orchards, take wives and beget sons and multiply in number and await the promised time. Hear what the Lord says to Zedekiah, who now reigns in Jerusalem, and to all the inhabitants of his city, that is, to your brothers, who were unwilling to obey my sentence and to migrate to Babylon with you: that they can by no means escape captivity, but will die by sword and famine and plague, and that he will make them like bad figs', which Theodotion and Aquila's first edition translated 'sudrinas', the second 'very bad', Symmachus 'last'; in Hebrew they are called 'suarim' [vile], but by the fault of copyists, in place of the middle syllable or letter 'alpha', the Greek 'delta' has crept in, so that 'sudrim' is read in place of 'suarim'. And just as the basket or hamper which had good figs is said to have had 'first-ripe' ones, so the other basket, which had bad figs, is written to have had 'last' figs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
