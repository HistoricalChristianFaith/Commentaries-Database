[[commentary]]
quote='''
The Hebrews refer these things to the coming of Christ, whom they hope is yet to come. We show that they are already accomplished, because both from Egypt and from the Assyrians, that is, from the east and the west, and from the north and the south, they have come, and daily they come, who sit at table with Abraham, Isaac and Jacob. And we can call sons of the sea, or of the waters, those who have been caught in the Lord's dragnet and drawn out of the sea of this world. And when they have been taken from death into life, they will be settled in their houses, which the Gospel calls barns, in which the chosen grain, separated from the chaff, is stored. It is said to be the nature of lions that when they growl and roar, all living creatures tremble, and, their step fixed, cannot move: so great is the terror, so great the dread. And so the Lord too, when he roars and thunders like a lion and utters his voice, all the birds and every winged creature will shudder, and they will go to their nests, that is, to their houses, in which the Lord will dwell with them. Let us also say it another way: when the true lion growls, the false lion, who according to the apostle Peter is our adversary, will at once fall silent, and every perverse dogma will be unable to open its mouth; and those who had before been taken captive by him, set free by the roar of the lion and its terrible threat, will follow the Lord their God. Then the sons of the sea, or of the waters, will fear, who had been begotten in the bitterness and in the salt waters of the heretics; and taking wings, they will fly like birds out of Egypt, and like a dove from the land of the Assyrians, and they will say: Who will give me wings like a dove, and I will fly and be at rest? So that those who had labored among the heretics may rest in the Church, and dwell in their houses, from which they had been led away by error. We know that Egypt, that is, Mesraim, is interpreted tribulation and distress; the Assyrians also, directing, or, as we judge better, rebuking. From these, therefore, the heretics will be set free when they begin to dwell in their houses and say to their evil parents: Your house will be left to you deserted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
