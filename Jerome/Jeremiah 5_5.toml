[[commentary]]
quote='''
And behold, these all the more together have broken the yoke, have burst the bonds. Therefore a lion from the forest struck them, a wolf at evening laid them waste, a leopard watching over their cities. Everyone who goes out from them will be taken, because their transgressions are multiplied, their turnings-away are strengthened. 'Those whom I thought to be teachers were found to be worse than the disciples; and the greater the authority among the rich, the greater the insolence of their sins'. For they broke the yoke of the law, as the Apostle says: Now therefore why do you tempt God, to put a yoke upon the neck of the disciples, which neither our fathers nor we have been able to bear? But through the grace of the Lord Jesus we believe that we are saved, in the same way as they also; and they burst the bonds of the precepts of God, and not of the Pharisees, of whom it is said in the second Psalm: Let us burst their bonds asunder, and cast away their yoke from us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
