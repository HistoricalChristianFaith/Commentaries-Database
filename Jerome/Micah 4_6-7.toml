[[commentary]]
quote='''
In that day, in which the sun of justice will shine, she who had before been crushed will be gathered, and she who had been driven out will be received; and the crushed one will be gathered for this, that she may be made a remnant, and the forsaken one a strong nation. Unless indeed the Lord of Sabaoth had left us a seed, we would have been as Sodom, and we would have been made like Gomorrah. But according to the Hebrew it is beautifully put: I will gather, he says, her that halts, and her who had walked badly, and to whom Elijah had said: How long do you halt? Whose foot, which had caused stumbling, had been cut off. Her whom I had cast out, and to whom I had given a bill of divorce, I will gather; and her whom I had afflicted with various captivities, or had handed over to the devil and his angels. And lest the careful reader at once object to us: How do you assert that she who halts has been gathered, and that she who had been cast out has been collected, when the Jews remain in unbelief? Let him hear that this is said of the first Church of Christ, which believed from among the Jews, to which the apostles too belonged, concerning which Luke writes in the Acts of the Apostles that in one day three thousand believed, and elsewhere five thousand, and of whom James says to Paul: You see, brother Paul, how many thousands there are of the Jews who believe, and all these are zealots of the law. But consider also the prophetic precision: he did not say, I will make her that halts wholly saved, but I will make her that halts a remnant, so that the remnant and the elect may be saved, and her that had labored a mighty nation, namely the Christian name, which not the sword, not fires, not torments shall overcome. Look at the faith and the passion of the martyrs, and you will not doubt about the mighty nation. And the Lord shall reign over them, that is, over many nations, and over the halting remnant, in Mount Zion, in the Church, in the watchtower, in the contemplation of the virtues, from the present age and even into the future. But if anyone wishes to understand what is said: I will gather her who was crushed, and the one cast out I will receive, and the rest, of the human soul, that before the coming of Christ it served various passions and vices, and like a straying and sickly sheep was torn by the bites of wolves, he will not err, provided he knows that she who had been crushed and afflicted will afterwards be under the reign of the Lord, and will live in Zion, and is to be carried back on the shoulders of the good shepherd to her former mountain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
