[[commentary]]
quote='''
The Lord when He sends forth His disciples to preach, teaches them that dangers are not to be feared, that natural affection is to be postponed to religion—gold He had above taken from them, brass He had shaken out of their purses—hard then surely the condition of the preachers! Whence their living? Whence their food and necessaries? Therefore He tempers the rigour of His precepts by the following promises, that in entertaining the Apostles each believer may consider that he entertains the Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Whoever receives you receives me, and whoever receives me receives him who sent me. A most beautiful order. He sends them to preach, teaches that dangers are not to be feared, subordinates affection to religion; he had taken away gold above, he had shaken bronze out of the belt. Hard is the condition of the evangelists. Whence, then, their expenses, whence the necessities of food? He tempers the austerity of the commands with the hope of the promises: Whoever receives, he says, you receives me, and whoever receives me receives him who sent me, so that in receiving the apostles each of the believers might think that he had received Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
