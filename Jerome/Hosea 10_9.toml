[[commentary]]
quote='''
The Seventy interpreted Gibeah as hills. From the days of the hills, then, Israel has sinned, when it abandoned the mountains of the Church and went down to the hills, or heretical slopes, thinking itself more learned than the Church is and to have found something more sublime: there they stood, that is, they persisted in error. And what follows, The battle will not overtake them on the hill, some have interpreted thus: because they have begotten sons of iniquity, and, withdrawing from the Church, have begun to be on the hills, when persecution comes the battle will not overtake them, since the devil is unwilling to attack his own. Others thus: Since from the days of the hills Israel has sinned, and stood there and could walk no further, must it not be overtaken by battle on the hills? Ought not churchmen to fight against it, to destroy them over the sons of iniquity? If they are overtaken and overcome, they will no longer be able to beget.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
