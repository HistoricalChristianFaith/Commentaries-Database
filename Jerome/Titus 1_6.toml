[[commentary]]
quote='''
"A bishop then must be blameless." The same thing that he says to Titus, "if any be blameless." All the virtues are comprehended in this one word; thus he seems to require an impossible perfection. For if every sin, every idle word, is deserving of blame, who is there in this world that is sinless and blameless? Still he who is chosen to be shepherd of the church must be one compared with whom other men are rightly regarded as but a flock of sheep.
'''
source_url='https://www.newadvent.org/fathers/1102069.htm'
source_title="LETTERS 69.8"

[[commentary]]
quote='''
"One that rules well his own house." That is, not by increasing riches, not by providing regal banquets, not by having a pile of finely wrought plates, not by slowly steaming pheasants so that the heat may reach the bones without melting the flesh upon them. No, he does this rather by first requiring of his own household the conduct which he has to inculcate in others.
'''
source_url='https://www.newadvent.org/fathers/1102069.htm'
source_title="LETTERS 69.9"

[[commentary]]
quote='''
If anyone is without crime, the husband of one wife, having faithful children, not under accusation of licentiousness, or not submissive. First, then, let him be without crime, which I think is named by another word to Timothy, "irreproachable" (1 Tim. 3): not that he be without any crime only at the time when he is to be ordained, having washed away past stains by a new manner of life, but that from the time he was reborn in Christ he be gnawed by no consciousness of sin. For how can the head of the Church remove evil from its midst, if he has fallen into a like offense? Or with what freedom can he reprove a sinner, when he silently answers himself that he has committed the same things that he reproves? Thus whoever desires the episcopate desires a good work. "A work", he says, not an honor, not glory. "But he must also have a good testimony from those who are outside, so that he may not fall into reproach and into the snare of the devil". Now what he says, the husband of one wife, we ought to understand thus: not that we should think every once-married man better than a twice-married man, but that he can exhort to monogamy and continence who holds out his own example in teaching. For suppose that someone in early youth has lost his wife and, overcome by the necessity of the flesh, has taken a second wife, whom he too has at once lost, and from then on has lived continently; and that another has stayed married into old age, and, enjoying the use of a wife, which most people consider happiness, has never ceased from the work of the flesh: which of the two seems to you to be better, more chaste, more continent? Surely the one who was unfortunate even in his second marriage, and afterwards lived chastely and holily, and not the one who was not separated from his wife's embrace even in old age. Let not anyone, then, who is chosen as a once-married man applaud himself as being better than every twice-married man, since in him it is rather good fortune than will that has been chosen. Some take this passage thus: It was the custom of the Jews, they say, to have two wives or more, which we also read of Abraham and Jacob in the old Law; and they will have this now to be the precept, that he who is to be chosen bishop should not have two wives together at one time. Many, more superstitiously than truly, think that even those who, when they were Gentiles, had one wife, and when she was lost married another after the baptism of Christ, are not to be chosen for the priesthood: whereas, surely, if this is to be observed, those ought rather to be kept from the episcopate who, having before indulged a roving lust among harlots, took one wife after being regenerated; and it is much more detestable to have fornicated with many than to be found a twice-married man, since in the one there is the misfortune of marriage, in the other a wantonness prone to sin. Montanus, and those who follow the schism of Novatus, have presumed to claim for themselves the name of purity, and think that second marriages should be barred from the communion of the Church: whereas the Apostle, in commanding this of bishops and presbyters, surely relaxed it in the case of the rest: not that he exhorts to second marriages, but that he makes allowance for the necessity of the flesh. Tertullian too wrote a heretical book On Monogamy, which no one who has read the Apostle will fail to recognize as contrary to the Apostle. And indeed, for a bishop, or presbyter, to be without crime and to have one wife lies within our power. But what follows, To have faithful children, not under accusation of licentiousness, and not submissive, is outside our will. For suppose that parents have brought up their children well and from an early age have always instructed them in the Lord's precepts: if these afterwards give themselves to licentiousness and, overcome by vices, give the reins to lust, will the blame flow back upon the parents, and will the sins of the sons stain the holiness of the father? If anyone instructed his sons well, among these I think was Isaac too, who surely must be believed to have brought up his son Esau well. Yet Esau, a fornicator and profane, sold his birthright for one meal (Gen. 25). Samuel also, who was such that he called upon the Lord and the Lord heard him, and obtained winter rain at the time of harvest, had sons who turned aside after avarice and took gifts, and proved such unjust judges that the people, unable to bear it, demanded a king for themselves in the likeness of the other nations (1 Sam. 12). If, therefore, there were an election of priests, both Isaac because of Esau and Samuel because of his sons would be thought unworthy of the priesthood. And since the sins of the parents are not imputed to the sons, now that the saying, "The parents ate the sour grape, and the teeth of the sons were set on edge" (Ezek. 18:2), is no longer in force, shall the vices of the sons tell against the parents? First, then, it must be said that the name of the priesthood is so holy that even things set outside us are reckoned to us: not that we are not to be made bishops because of our own vices, but that we are to be kept from this rank because of the incontinence of our sons. For with what freedom can we reprove other people's sons and teach what is right, when the one who has been reproved can at once throw at us: First teach your own sons? Or with what face do I reprove a stranger who fornicates, when my own conscience answers me: Then disinherit your fornicating son; cast off your sons who are slaves to vices? But when a worthless son lives with you in one house, do you dare to take the mote from another's eye, not seeing the beam in your own (Matt. 7 and Luke 6)? So the just man is not polluted by the vices of his sons; but freedom is reserved by the Apostle for the leader of the Church, in that he should be such a one as does not fear to rebuke strangers because of the vices of his children. Next, this too must be brought against those who swell with pride over the episcopate and think they have obtained not a stewardship of Christ but a command: that those who have not been ordained bishops are not at once worse than all these, nor should they think themselves the more approved from the fact that they were chosen; but let them understand that certain men have been removed from the priesthood for this reason, that the vices of their children hindered them. But if the sins of the sons debar a just man from the episcopate, how much more will each one, considering himself and knowing that the mighty shall suffer torments mightily (Wisd. 6), draw back from this, which is not so much an honor as a burden, and not seek to occupy the place of others who are more worthy! Lastly this must be said: that in the Scriptures by sons are understood λογισμοὺς, that is, thoughts, and by daughters πράξεις, that is, works; and that he is now commanded to be made bishop who has both his thoughts and his works in his power, and believes truly in Christ, and is stained by no blot of creeping vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
