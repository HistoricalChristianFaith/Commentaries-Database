[[commentary]]
quote='''
Let the false prophet therefore hear, let the priest understand what he himself also deserves to hear through him: thus says the Lord: Behold, I will visit upon Shemaiah. This the Lord speaks, not the prophet: that he will visit upon Shemaiah the Nehelamite, not for remedy but for the punishment of the liar, according to that which is written: I will visit their iniquities with the rod, and their sins with scourges. Nor does he visit upon the false prophet alone, but also upon his seed, all the disciples whom he deceived by his error. There shall not be, he says, a man sitting in the midst of this people. Let the worst stock be blotted out of the assembly of the saints, and let him not sit in the midst of those at rest, who could not stand with those who stand, nor heard that saying: if he had stood in my substance. And whereas the Lord promises the perfection of all virtues when the sevenfold time is ended, he will not see the good which he claimed for himself in the present time. Now all this will come about because he has spoken transgression against the Lord, in saying that, the captivity of sins being already loosed, they would return to Jerusalem; such men the Apostle threatens: already you are filled, already you have become rich, without us you have reigned; and would that you did reign, that we also might reign with you!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
