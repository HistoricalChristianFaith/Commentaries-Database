[[commentary]]
quote='''
Why do you wish to contend with me in judgment? You have all forsaken me, says the Lord. Human perversity is prone to excuse itself, so that whatever men suffer deservedly they appear to suffer unjustly, and they refer their own fault to the judgment of God. 'In vain', therefore, he says, 'do you put forward complaints and plead that the judge is unjust, since what you suffer comes from your impiety.' And what follows: and you have all acted unjustly against me, was likewise added by the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
