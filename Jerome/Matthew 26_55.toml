[[commentary]]
quote='''
It is folly then to seek with swords and staves Him who offers Himself to your hands, and with a traitor to hunt out, as though lurking under cover of night, one who is daily teaching in the temple.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
At that hour Jesus said: You have come out as against a robber with swords and clubs to arrest me? Daily I sat among you teaching in the temple, and you did not seize me. It is foolish, he says, to seek with swords and clubs one who hands himself over of his own accord into your hands, and to track down at night through a betrayer, as if he were hiding and avoiding your eyes, one who teaches daily in the temple. But you gather against me in darkness for this reason, that your power is in darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
