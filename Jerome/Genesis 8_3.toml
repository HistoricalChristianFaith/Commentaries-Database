[[commentary]]
quote='''
And for what follows, [Gen 8:3] the water ceased upon the earth and so on, it is written and the waters returned from the earth, going and returning. Note that, according to Ecclesiastes, all the waters and torrents return through hidden veins to their mother the abyss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
