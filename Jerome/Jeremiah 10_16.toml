[[commentary]]
quote='''
Not like these is the portion of Jacob, that is, of those who supplanted the Jews and daily destroy the heretics. But the portion of the saints is God, of whom the prophet says: The Lord is my portion. For he who formed all things, he it is, who made and molded all things, both in mind and in body, and Israel is the rod of his inheritance. Everyone who is 'upright in God' or 'discerns God with the mind' is the scepter of his inheritance, whose name is 'the Lord almighty' or 'of powers'; for this is what 'the Lord of hosts' means, which in the Hebrew is written 'the Lord sabaoth'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
