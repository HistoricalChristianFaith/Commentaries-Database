[[commentary]]
quote='''
The Father indeed has given all judgment to the Son. And he will rebuke strong nations even afar off. For the Lord catches the wise in their craftiness and has known the thoughts of the wise, that they are vain. And he discerns among the peoples who are worthy of salvation and who unworthy, and at his coming all eagerness for war will be turned to peace. Swords will be changed into plows, spears will be forged into sickles, nation will cease to war against nation. No one will learn to fight, the need of fighting being laid aside. And so great will be the rest that not only in the cities but in the hamlets too and in the fields each one will be secure; and this will come to pass because the mouth of the Lord has spoken. And first, according to the letter: before a child was born to us, whose government is upon his shoulder, the whole world was full of blood; peoples fought against peoples, kings against kings, nations against nations. In short, even the Roman Republic itself was torn by civil wars, with Cinna and Octavius and Carbo fighting; Sulla and Marius, Antony and Catiline, Caesar and Gnaeus Pompey, Augustus and Brutus, and the same Augustus and Antony, in whose battles all the kingdoms shed blood. But after Rome, with a view to the rule of Christ, obtained a single rule, the world was made open to the journeys of the apostles, and the gates of cities were opened to them, and for the preaching of the one God a single rule was established. This saying too: They shall beat their swords into plows, and their spears into sickles, can also be taken tropologically, so that we say that at the faith of Christ anger and unbridled abuse have been laid aside, so that each one puts his hand to the plow and does not look back behind him, and, breaking the darts and spears of insults, desires to reap spiritual fruits, so that, others having labored, we may enter into their labors, and it may be said of us: But coming they shall come with exultation, carrying their sheaves. Now no one fights against another, for we read: Blessed are the peacemakers. No one learns to contend to the subversion of the hearers, but he sets silence on his mouth, and is silent, because the time is evil. And each shall rest under his vine, to press the wine that gladdens the heart of man, under that vine whose husbandman is the Father, and under his fig tree, plucking the sweet fruits of the Holy Spirit, love, joy, peace and the rest. And all these things will come to pass, according to both expositions, because the words of the Lord are true, and for him to have said is to have done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
