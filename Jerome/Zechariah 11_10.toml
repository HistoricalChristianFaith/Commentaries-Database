[[commentary]]
quote='''
And I took my staff which was called Beauty, and I cut it off, to make void my covenant which I had struck with all peoples. And it was made void on that day, and thus the poor of the flock who keep watch for me knew that it is the word of the Lord. LXX: And I will take my fair staff, and I will cast it away, to scatter my testament which I disposed toward all peoples; and it shall be scattered on that day, and the Canaanites shall know, the sheep that are kept for me, that it is the word of the Lord. After the calling of Israel, and the taking up of the second staff, which was called Cord, the Lord took the first staff, the nations of the whole world, which were called beautiful, and cut them off from his worship, because they venerated idols, and all have turned aside, together they have become useless. And setting out more plainly what this staff was, he added: To make void my covenant which I had struck with all peoples. For as soon as Israel was taken up, the crowd of the nations was cast away; and as soon as the daughter of the ruler of the synagogue was born — who later in the Gospel, when she was twelve years old, is related to have fallen sick and died —, the αἱμοῤῥοῦσα (the woman with a flow of blood) began to flow with blood and to be tormented by a perpetual infirmity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
