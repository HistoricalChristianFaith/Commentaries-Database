[[commentary]]
quote='''
The vine shall give its fruit, the vine that says in the Gospel: I am the vine, you are the branches. Every branch that abides in me, the Father cleanses, that it may bear greater fruit. And when its branches have been cleansed, that is, its shoots and layers, and with budding eyes have begun to promise the hope of fruits to come, so that what is written may be fulfilled: The flowering vines have given forth their fragrance, then the sun of justice has colored the hanging clusters, so that, sent into the winepresses of Psalms 8 and 83 (84), which are entitled for the winepresses, they may be trodden by the foot of the Lord, who comes up from Bozrah, that he may pour out the wine that gladdens the heart of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
