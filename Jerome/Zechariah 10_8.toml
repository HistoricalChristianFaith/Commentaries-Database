[[commentary]]
quote='''
According to ἀναγωγὴν (anagogy), the Lord signals and whistles to those who had before been captives to sins, and speaks to them: Come to me, all you who labor and are burdened, and you shall find rest for your souls. Take my yoke upon you, and learn from me, for I am meek and humble of heart. For my yoke is sweet, and my burden is light. What is more merciful than this signal and whistle, by which the scattered people is gathered? And they are gathered because the Lord has redeemed them, not with corruptible silver and gold, from their vain manner of life, but with the precious blood, as of a spotless lamb, the Lord Jesus. Hence he speaks in the psalm: My exultation, deliver me from those who surround me, and again: You have redeemed me, O Lord God of truth. And he will multiply them as they had been multiplied before, so that what was promised to Abraham might be fulfilled: I will multiply him and I will bless him, and he shall be blessed, so that he may become the father of many nations. But we ought not to take as sons of Abraham those to whom the Lord says: If you were sons of Abraham, you would do the works of your father, but those of whom the Apostle says: As many as are of faith, they are the sons of Abraham. Of this multiplication Isaiah too testifies in mystical speech, saying: He who is little shall become thousands, and he who is small, a great nation. But let us not take the multiplication and blessing of children carnally: otherwise Elijah and Elisha and Jeremiah and John the Baptist, than whom there was none greater among those born of women, lacked this blessing; rather, let us take it of that blessing by which multitudes of the nations are called to the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
