[[commentary]]
quote='''
Are not two sparrows sold for an as? And one of them will not fall upon the ground without your Father. But even the hairs of your head are numbered. Do not fear, therefore; you are worth more than many sparrows. The Lord's discourse holds together, and what follows hangs upon what went before. Prudent reader, always beware of a superstitious understanding, so that you do not adjust the Scriptures to your own sense, but join your sense to the Scriptures and understand what follows. He had said above: Do not fear those who kill the body but cannot kill the soul, now he says, in consequence: Are not two sparrows sold for an as, and one of them will not fall upon the ground without your Father; and the sense is: if small and cheap animals do not die without God as their author, and there is providence in all things, and those among them that are to perish do not perish without the will of God, you who are eternal ought not to fear that you live without the providence of God. This sense was also stated above: Look at the birds of the sky, for they neither sow nor reap nor gather into their barns, and your heavenly Father feeds them; are you not worth more than they? and then: Consider the lilies of the field, how they grow, and the rest. But if God so clothes the grass of the field, which is today and tomorrow is thrown into the oven, how much more you, O you of very little faith? Some, in a forced way, interpret the two sparrows as the soul and the body; and the five sparrows according to Luke, which are sold for two asses, they refer to the senses. But how that understanding can be fitted to the whole body of the Gospel discourse is a matter of no small difficulty: But even the hairs of your head are all numbered; do not fear, therefore; you are better than many sparrows. More plainly is expressed the earlier sense of our exposition, that they ought not to fear those who can kill the body and cannot kill the soul, since, if even small animals do not die without God's knowledge, how much more a man who is supported by apostolic dignity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
