[[commentary]]
quote='''
Woe to them, because they have withdrawn from me; they will be laid waste, because they have transgressed against me. I redeemed them, and they have spoken lies against me, and they have not cried to me in their heart, but they howled on their beds. LXX: Woe to them, because they have withdrawn from me; they are manifest, because they have acted impiously against me; but I redeemed them; yet they have spoken a lie against me, and their hearts have not cried to me, but they howled on their beds. While I was spreading my net to catch them, and to bring them down from their pride like a bird of the sky, and to strike them in the hearing of their distress, they withdrew and leapt away from me; for this is what ἀπεπήδησαν means, which the Seventy used in their translation. And therefore they will be laid waste, because they have transgressed against me. Where we said: they will be laid waste, in the Hebrew is written sod laem, that is, devastation to them. Symmachus translated it destruction; Theodotion, misery. Moreover, in the common edition we read it in two ways; for some manuscripts have δῆλοί εἰσιν, that is: they are manifest; others δείλαιοί εἰσιν, that is: they are fearful or wretched. They will be laid waste, therefore, and will be wretched, and always fearing and dreading, because they transgressed against God, worshiping the golden calves and abandoning him who redeemed them from Egyptian slavery and led them out with a lofty arm. But they spoke lies against the Lord, saying of the idols: These are your gods, Israel, who led you out of the land of Egypt, and they did not cry to the Lord in their heart, but wallowed in the fornications of idolatry. Or, because lust and luxury follow the worship of demons, those who worshiped demons consequently wallowed like pigs in the mire of lusts. And he fittingly calls the songs of those who serve idols not hymns to God but howling. Concerning the heretics the interpretation is easy: they have everlasting woe, because they have withdrawn from God; and they are wretched, because they have abandoned their Creator, who redeemed them with his own blood; and they themselves speak lies against him, composing the impious dogmas of falsehood; and they do not cry out in their hearts, but always howl in their conventicles, which he fittingly calls beds, and the lairs of wild beasts. Such men cannot say: Every night I will wash my bed, with my tears I will water my couch; but they wallow in the filth of lusts, they give themselves to debauchery, and whatever they say, and think they are saying in praise of God, is the howling of wolves and the din of raving Bacchantes. Rarely does a heretic love chastity, and whoever pretend to love purity, like Mani and Marcion, and Arius and Tatian, and the restorers of the old heresy, promise honey with a poisoned mouth. For the rest, according to the Apostle, the things they do in secret it is shameful even to speak of.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
