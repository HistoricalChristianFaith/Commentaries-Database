[[commentary]]
quote='''
Go and eat your bread in gladness, and drink your wine with a good heart, since your works have already pleased God. At all times let your garments be white, and let oil not fail from your head. Up to the place in which he says: Like fishes which are held in a most evil capture; like birds which are caught in a snare: so will the sons of men be caught in a most evil time, when it falls upon them suddenly. Before we discuss them one by one, everything must be briefly drawn together, so that it may appear in what single sense they are all spoken. In the preceding passage he had said beforehand that after men have died they fall away from the heart of the living, and no one has either love or hatred toward them, according to that saying of the poet: "No contest with the vanquished and those bereft of air"; and that under the sun they can do nothing further. Now, therefore, he brings in, as it were, human error and the habit by which men urge one another to enjoy the goods of this world, and, in the manner of the rhetoricians and poets, he makes a προσωποποιΐαν (personification), saying: O man, since after death there is nothing, and death itself is nothing, hear my counsel: while you live in this short life, enjoy pleasure, make use of feasts, drown your cares in wine, and understand that these things have been given you by God for use. Go about adorned in white garments, let your head breathe of perfumes; whichever of women pleases you, rejoice in her embrace, and run through this vain and brief life with a vain and brief pleasure. For beyond these things you will have nothing more to enjoy; whatever can delight you, seize it in haste, lest it perish. For you ought not to fear trifling fictions, that among the dead below you must render an account of each of your works, whether good or evil. For there is no wisdom in death; there is no sensation after the dissolution of this life. Let some Epicurus say these things, he says, and Aristippus, and the Cyrenaics, and the rest of the philosophers' cattle. But I, going over it carefully with myself, find, not, as some wrongly suppose, that all things are done by chance and that a changeable fortune plays in human affairs, but that all things come about by the judgment of God. For neither should one who is swift of foot think the race his own if he runs; nor should the strong man trust in his own strength; nor should the wise man suppose that riches and wealth are gathered by prudence; nor the eloquent and learned man that through eloquence and learning he can find favor with the people; but that all things come about by God's disposing. And unless he rules all things by his own will and builds the house, they have labored in vain who build it. Unless he guards the city, they watch in vain who guard it. There is not, therefore, as those men think, one event and an uncertain state of this life, because, when they do not expect it, they will be carried off by a sudden death and come to judgment. And as fishes are caught by the hook and by nets, and birds that are free through the air are bound by a snare while they do not know it, so men will be led away to eternal punishments according to their desert, when death and judgment come suddenly upon those who thought that all things were tossed about in an uncertain state. This much according to the sense in which we wished briefly to take in the whole.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
