[[commentary]]
quote='''
He who was within two days to celebrate the passover, to be delivered to the cross, and mocked by men, fitly now holds out the glory of His triumph, that He may overbalance the offences that were to follow by the promise of reward. And it is to be noted, that He who shall be seen in majesty is the Son of Man.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But when the Son of Man comes in his majesty, and all the angels with him, then he will sit upon the seat of his majesty, and all the nations will be gathered before him, and he will separate them from one another as a shepherd separates the sheep from the goats, and he will set the sheep on his right, but the goats on his left. About to keep the Passover after two days, and to be handed over to the cross, and to be mocked by men, and to be given vinegar and gall to drink, he rightly promises the glory of one in triumph, so that he might offset the stumbling blocks that were to follow with the reward of the promise. And it is to be noted that he who is to be seen in majesty is the Son of Man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
