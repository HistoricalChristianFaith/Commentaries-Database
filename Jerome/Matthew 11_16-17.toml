[[commentary]]
quote='''
But to what shall I liken this generation? It is like children sitting in the forum, who call out to their companions and say: We sang to you, and you did not dance; we lamented to you, and you did not mourn. For John came neither eating nor drinking, and they say: He has a demon. The Son of Man came eating and drinking, and they say: Look, a gluttonous man and a drinker of wine, a friend of tax collectors and sinners. And wisdom has been justified by her children. To children sitting in the forum and calling out and saying to their companions: We sang to you, and you did not dance; we lamented, and you did not mourn, the generation of the Jews is compared, as Scripture says: What shall I reckon this generation to be like? It is like children sitting in the forum, and the rest. We are not, therefore, granted a free understanding and an allegorical interpretation that ranges at will, but whatever we are going to say about the children must be referred to the likeness of the generation. These children who sit in the forum are those of whom Isaiah speaks: Behold, I and my children whom God has given me; and in Psalm 18 (19): The testimony of God is faithful, giving wisdom to little ones; and elsewhere: Out of the mouth of infants and sucklings you have perfected praise. These children, then, sat in the forum, or ἐν ἀγορᾷ, as it is said more expressively in Greek, where many things are for sale. And because the people of the Jews would not listen, they did not merely speak to it but cried out with full throats: We sang to you, and you did not dance: we urged you to do good works to our song and to dance to our pipe, as David too danced before the ark of the Lord, and you would not; we have lamented, and we urged you to repentance, and you would not do even this, spurning both kinds of preaching, both the exhortation to virtues and the repentance after sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
