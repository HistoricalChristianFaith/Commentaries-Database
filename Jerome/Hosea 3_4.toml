[[commentary]]
quote='''
For many days the sons of Israel will sit without a king, and without a prince, and without sacrifice, and without altar, and without ephod, and without teraphim. And after this the sons of Israel will return and will seek the Lord their God and David their king; and they will tremble before the Lord and before his goodness in the last of days. LXX: For many days the sons of Israel will sit without a king, without a prince, without sacrifice, without altar, without priesthood, without manifestations, — which in Greek are called δῆλοι —. And after this the sons of Israel will return, and will seek the Lord their God, and David their king; and they will be astonished before the Lord, and at his good things on the last day. For ephod and teraphim the Seventy translated ἱερατείαν, that is, priesthood, and δήλους, that is, manifestations. Now it should be known, as we have often said, that ephod signifies a priestly garment, which in Exodus and Leviticus is called by the LXX ἐπωμὶς, that is, the shoulder-piece, and by Aquila ἐπένδυμα, that is, the over-garment. Teraphim, however, properly means μορφώματα, that is, figures and images, which we can say, in the present passage at least, are the cherubim and seraphim or the other things which were ordered to be made for the adornment of the temple. But since the Seventy translated δήλους, for which Aquila rendered φωτισμούς (illuminations), and these very things are in the λογείῳ, that is, in the rational, we understand this: that in the breast and heart of the high priest there ought to be ἀλήθεια and φωτισμοί, that is, truth and teaching, so that he may not only know the right faith, but may also be able to bring forth with his mouth what he knows. This the apostle Paul also writes to Titus, teaching what kind of man should be ordained bishop: For a bishop must be without crime, as the steward of God; not proud, not quick to anger, not given to wine, not a striker and not greedy for shameful gain; but hospitable, kind, sober, just, holy, continent, embracing the faithful word which is according to doctrine, so that he may be able both to exhort in sound doctrine and to refute those who contradict. Ephod and teraphim we also read of in the book of Judges, which the Levite had made for himself, who afterwards set out with six hundred armed men of the tribe of Dan. From the passion of the Lord the Savior up to the present day, almost the four hundredth year is being completed, and how much time remains until the day of judgment neither the angels know nor the Son. He says that he does not know for this reason, because it is not expedient for us to learn. These, then, are the many days in which the unhappy Synagogue and adulterous woman is fed on barley, and has sat huddled, because she cannot stand with Christ. Without a king, of whom the Father spoke: I have raised up a king with justice. And he himself says in the psalm: But I have been appointed king by him over Zion, his holy mountain. Without a prince: either the Lord the Savior himself, or at least the high priest, of whom it is written: You shall not curse the prince of your people. And without sacrifice, and without altar. For since the temple was overthrown, and Jerusalem was burnt, the Jewish nation can carry on neither sacrifice nor priesthood. And without ephod and without teraphim, that is, the instruments of the priestly dress. Of this king Jacob too speaks in the blessing of the patriarch Judah: A prince shall not fail from Judah, nor a leader from his thighs, until he comes for whom it is laid up; and he will be the expectation of the nations. Therefore, after the prince failed from Judah, and the leader from his thighs, and Herod, a foreigner and a proselyte, took the rule, we understand that he has come for whom the kingdom was laid up, and he will be the expectation of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
