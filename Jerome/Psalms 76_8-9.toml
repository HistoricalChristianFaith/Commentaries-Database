[[commentary]]
quote='''
Whoever, then, is humble and quiet and trembles at the words of God, him the Lord looks upon; and of him may be understood what is prophesied under the name of the earth: The earth trembled and was quiet, when God arose to judgment (Ps 75 [76]:9, 10). For its inhabitants, for whom the earth is named μετωνυμικῶς, considering the judgment of God, keep quiet from evil works; and sitting at home, rest in an eternal sabbath, so as not to stir themselves to the servile work of sin, as the builders of the tower once moved their feet from the East and left the rising of the true light. Nor did they hear what is said to Cain: You have sinned, be quiet (Gen 4). But according to the Proverbs of Solomon: He who hears God shall dwell confidently, and shall rest without fear from every evil (Prov 1:33).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
