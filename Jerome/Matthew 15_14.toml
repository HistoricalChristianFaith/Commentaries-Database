[[commentary]]
quote='''
This is also the same as that Apostolic injunction, A heretic after the first and second admonition reject, knowing that such a one is perverse. (Tit. 3:10, 11.) To the same end the Saviour commands evil teachers to be left to their own will, knowing that it is hardly that they can be brought to the truth.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let them alone; they are blind, leaders of the blind. This is what the Apostle had commanded: Avoid a heretical man after a first and a second correction, knowing that such a one is perverted and condemned by himself. In this sense the Savior too commands that the worst teachers be left to their own choice, knowing that they can hardly be drawn to the truth, that they are blind and drag a blind people into error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
