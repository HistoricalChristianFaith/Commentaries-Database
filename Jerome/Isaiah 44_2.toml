[[commentary]]
quote='''
Thus says the Lord, your maker and former, who helped you from the womb (Gen 25), so that while still in your mother's womb you seized your brother's heel; or who at the beginning of the newborn Church preserved you from the persecutors. Do not fear their cruelty, Jacob my servant, and Most Upright, whom I have chosen. He calls Israel by another name; for the Hebrew word ISURUN (ישרון) the others translated εὐθύτατον, or εὐθῆ, that is, most upright and upright; the Seventy alone most beloved, adding Israel of their own. For properly, according to the Hebrews and the faithfulness of the letters, ISRAEL (ישראל) means upright of God; whereas a man seeing God lies not in the letters but in the sound of the word. Hence also the book of Genesis is called εὐθεῖς, that is, of the righteous: Abraham, Isaac and Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
