[[commentary]]
quote='''
Israel is holy to the Lord, the firstfruits of his crops; all who devour him shall transgress; evils shall come upon them, says the Lord. When he calls Israel the firstfruits of the Lord's crops, he shows that the people gathered from the nations comes after the firstfruits, according to that which is written in another place: Remember your congregation, which you have possessed from the beginning. But firstfruits are owed to the priests and not to enemies. What follows: all who devour him shall transgress; evils shall come upon them, says the Lord, has this sense: just as those who devour the firstfruits, being in no way of priestly stock, are guilty of a crime, so those who defile Israel will be subjected to evils, according to that which the holy man says in Psalm 26 (27): While the harmful draw near against me to eat my flesh, those who trouble me, my enemies themselves have become weak and have fallen. For they will not be immune from punishment on the ground that they carry out God's sentence, and evils will come upon them; for it must needs be that offences come, but woe to him through whom offences come!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
