[[commentary]]
quote='''
For thus says the Lord of hosts, the God of Israel: Let not your prophets who are in your midst, and your diviners, lead you astray, and do not attend to your dreams which you dream, for these prophesy falsehoods to you in my name, and I did not send them, says the Lord. That there were prophets, nay rather false prophets, and diviners and dreamers in Babylon among those whom Nebuchadnezzar had led away with Jeconiah and his mother, the prophet Ezekiel testifies, writing against those whom Jeremiah too commands are not to be believed. But at the time when this letter was being sent, Ezekiel had not yet begun to prophesy in Babylon; for this word is sent at the beginning of King Zedekiah, while Ezekiel began to prophesy in the fifth year of the exile of Jeconiah, which was the same year of Zedekiah's reign. Further, according to tropology, we ought to take as false prophets those who take the words of the Scriptures otherwise than the Holy Spirit sounds them, and as diviners those who pronounce the conjectures of their own mind and the uncertainties of things to come as though true, without the authority of the divine words; and as dreamers, those who do not hear that which is written: give no sleep to your eyes nor slumber to your eyelids, of whom Jude the Apostle too speaks: likewise these also, dreaming, defile the flesh, but despise dominion, whose mind is by no means awake, but, weighed down by the slumber of arrogance and error, is surrounded by the horror of night; to whom the Apostle Paul also speaks: rise, you who sleep, and arise from the dead, and Christ will enlighten you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
