[[commentary]]
quote='''
Amen I say to you: They have received their reward, not God's reward but their own; for they were praised by men, for whose sake they practiced the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
