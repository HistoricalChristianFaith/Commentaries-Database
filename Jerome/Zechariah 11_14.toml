[[commentary]]
quote='''
And I cut off my second staff, which was called Cord, so that I might dissolve the brotherhood between Judah and Israel. LXX: And I cast away the second staff, which was called Cord, so that I might scatter the covenant that was between Judah and Israel. In this place too I know that I have read a long explanation by a certain writer, or rather inextricable tangles, who brings forward from the book of Ezekiel the two staffs joined into one fellowship, and fits to this passage everything that is to be understood spiritually about the concord of Judah and Ephraim. But let us follow the order we have begun. After the Lord was crucified by the Jews and valued at thirty pieces of silver, and the price of his blood availed for the burial of the Gentiles, who were strangers to the law and the commandments of God, at once the Lord, no longer putting off his sentence, says: I cut off my second staff, which was properly mine, which clung to me in such a way that in Jeremiah it was called a loincloth and a girdle and a waistband, or, to use the everyday word, a hip-band; this second staff, once called Cord and my portion, was therefore cast away by me, so that I might dissolve the pact and the brotherhood and the concord that had been between Judah and Israel, and separate the brothers from one another. So that, in the number of the apostles and of those who repented, the name Judah should again be given, as to one who also confesses his God; while those should be called Israel and Ephraim and Joseph who, persisting in hardness of heart, said: We have no king but Caesar. Hence he did not add: So that I might make void the pact, or covenant, which I had with Judah and Israel — for to this day he stretches out his hand to the repentant —, but also that he might divide from one another, out of the one people, some who believe and others who do not believe, saying: Do not think that I came to send peace on the earth; I did not come to send peace, but a sword. For I came to separate a man against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law, and a man's enemies are those of his own household.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
