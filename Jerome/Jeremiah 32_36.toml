[[commentary]]
quote='''
And now, because of these things, thus says the Lord, the God of Israel, to this city, of which you say that it is delivered into the hand of the king of Babylon by the sword and by famine and by pestilence. Just as to those who hoped for help and trusted in the strength of the walls it is prophesied that Jerusalem is to be overthrown and the people on the very point of being captured, and before the captivity to perish by sword and famine and pestilence, so to those who despair and, after the overthrow of the city, expect no salvation, he promises his help, so that confidence and pride may merit a just sentence, and despair and humility the help of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
