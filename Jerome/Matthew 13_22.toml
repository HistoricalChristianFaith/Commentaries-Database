[[commentary]]
quote='''
of which He proceeds to speak, That which is sown among thorns. To me He seems here to express figuratively that which was said literally to Adam; Amidst briers and thorns thou shalt eat thy bread, (Gen. 3:18) that he that has given himself up to the delights and the cares of this world, eats heavenly bread and the true food among thorns.

And it is elegantly added, The deceitfulness of riches choke the word; for riches are treacherous, promising one thing and doing another. The tenure of them is slippery as they are borne hither and thither, and with uncertain step forsake those that have them, or revive those that have them not. Whence the Lord asserts, that rich men hardly enter into the kingdom of heaven, because their riches choke the word of God, and relax the strength of their virtues.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he who sows among thorns, this is he who hears the word, and the care of this world and the deceitfulness of riches chokes the word, and it is made fruitless. It seems to me that what is said to Adam according to the letter, Among thorns and thistles you shall eat your bread, also signifies mystically that whoever gives himself to the pleasures of the world and the cares of this world eats the heavenly bread and the true food among thorns. And he aptly added: the deceitfulness of riches chokes the word. For riches are alluring, doing one thing and promising another. Their possession is slippery, since they are carried about hither and thither, and with unsteady step they either desert those who have them or stuff those who do not have them. Hence the Lord also asserts that the rich enter the kingdom of heaven with difficulty, since riches choke the word of God and soften the rigor of the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
