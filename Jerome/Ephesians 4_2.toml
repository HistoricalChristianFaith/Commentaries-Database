[[commentary]]
quote='''
With all humility and meekness, with patience.

He who knows that he is earth and ashes, and is soon to be dissolved into dust, will never be lifted up by pride. And he who, having beheld the eternity of God, considers the span of human life, brief and almost like a point, will always have his death before his eyes, and will be humble and lowly. For the corruptible body weighs down the soul, and this earthly tabernacle oppresses the mind that is anxious about many things (Wisd. 9:15). Wherefore let us say with all humility: Lord, my heart is not exalted, nor are my eyes lifted up (Ps. 130:1). But all humility lies not so much in speech as in the mind, so that our conscience may know that we are humble, and we may never think that we either know or understand or are anything. Meekness too is that which is disturbed by no passion, and above all is not broken by anger and rage. Whoever has it will attain the beatitude which was promised by the voice of the Lord, that he may possess the land, that is, rule his own body and be master of it as of a subject; and let this be his first inheritance, to live in the flesh not carnally. Some, with wrinkled brow, lowered eyebrow and words weighed on the scales, claim for themselves the authority of teachers and judges; not because they themselves know anything worthy of their arrogance, but because they see that all the simpler of the brethren are ignorant of certain things in comparison with themselves.

Bearing with one another in love. If anyone understands what bearing with one another in love means, he will not think that this command fits holy men, but those who are placed at the beginnings of the virtues. For the saints will not have anything to bear with in one another, but those will who, being men, are still overcome by some passion. Nor is it any wonder if the Ephesians hear these things, since in a multitude of believers there are some who still must bear with one another. This very thing also seems to me to be signified by what is written to the Galatians: Bear one another's burdens (Gal. 6:2). We can, then, also interpret both testimonies in another way, so as to say that those fulfil both the bearing of one another's burdens and the bearing with one another in love who are rich and relieve the want of the poor. If anyone renders service to a sick brother, he bears with him in love. If anyone, passing a blessed life in celibacy, has helped another who has both a wife and children and can scarcely feed himself, and has comforted him in whatever way he can, he will be praised for having carried another's burden. There is someone who, seeing his mother or his widowed sister wasting away with want, cannot help: if anyone has stretched out a hand to him, he has sustained him in love. But whether we follow the former sense or the latter, he who does not have love, and despises the words of the Apostle admonishing, But we who are stronger ought to bear the infirmities of the weaker, and not to please ourselves (Rom. 15:1), consoles neither the sinning brother nor the needy one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
