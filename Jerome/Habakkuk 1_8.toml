[[commentary]]
quote='''
The horses also and the horsemen, who will come from afar, will be so quick to pursue and to lay everything waste that they will surpass leopards and evening wolves. For wolves are said to be fiercer as night draws near, roused to madness by hunger the whole day. The horsemen, then, will fly, not to fight, since no one will resist, but to range about like the eagle, to which everything among flying creatures is subject, hastening to devour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
