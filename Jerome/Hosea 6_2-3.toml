[[commentary]]
quote='''
The Lord therefore strikes and cures us; for whom the Lord loves he rebukes, and he chastises every son whom he receives; not only does he cure, but he makes alive after two days, and on the third day, rising again from hell, he raises up with himself the whole race of men. And when he has cured those who were struck, and made alive those who were cured, and raised up those who were made alive, then we shall live in his sight, we who, while he was absent, lay dead. And we shall live in his sight; we shall know him and follow him with all zeal, that we may know the Lord, by whose rising on the third day we have risen. By these words is explained what we have often already pointed out, that both Israel and Judah, that is, the ten and the two tribes, will then have one shepherd, and David as king, when they have believed in the Lord who rises again; and that the Jews vainly promise themselves dreams of a thousand years, since the salvation of all has been promised on the third day, on which the Lord rose again from hell. The Hebrews interpret the second day as the coming of their Christ, and the third day as the judgment, when they are to be saved. Granting this, let them answer us what the first day is, that is, the first coming of the Savior. And when they cannot answer, let us conclude that the first day is, according to what they themselves would have, the coming of the Savior in humility, the second in glory, the third in the guise of one who judges. But those who accept the second and the third testify that they have lost the first, because a second and a third cannot be so called without a first.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
