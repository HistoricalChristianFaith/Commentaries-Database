[[commentary]]
quote='''
Behold, I will gather them from all the lands to which I drove them out in my fury and in my wrath and in great indignation, and I will bring them back to this place and make them dwell confidently, and they shall be to me a people and I will be to them a God. And I will give them one heart and one way, that they may fear me all their days, and that it may be well with them and with their sons after them. And I will strike with them an everlasting covenant — or I will appoint an eternal testament — and I will not cease to do them good, and I will put my fear in their heart, that they may not depart from me. And I will rejoice over them when I have done them good — or and I will visit them, to do them good —, and I will plant them in this land in truth — or in faith — with my whole heart and with my whole soul. Many think that this was fulfilled in the time of Zerubbabel, son of Shealtiel, and of Jeshua, son of Jehozadak, the great priest, when Haggai and Zechariah prophesied under Ezra the priest, when the temple too was built and the walls were raised round about under Nehemiah, so that those whom he had previously cast out of Jerusalem in fury and wrath and in great indignation and scattered over the whole world, he afterwards brought back and made to dwell confidently, and they were the people of God and the Lord was their God, and the rest that Scripture goes on to relate. But how this can be fitted to that time: I will make them dwell confidently, and I will strike with them an everlasting covenant or I will appoint for them an eternal testament, cannot be proved at all, since we have read, and the sacred history relates, that they were often taken captive not only by the neighboring nations but also by the Persians and Macedonians and Egyptians and Romans, and are in servitude to this day. Everything, therefore, that we see fulfilled in our time, the time of faith, must be referred to the coming of the Savior; and the election — according to the Apostle — of the remnant has been saved, and they dwell confidently in Christ, and one heart has been given them, according to what is written: and of the multitude of believers there was one heart and soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
