[[commentary]]
quote='''
If you are willing and will hear, you shall eat the good things of the land; if you are not willing and will not hear (or, as it has in the Hebrew) and provoke me to anger, the sword shall devour you. For the mouth of the Lord has spoken. He preserves free will, so that in either direction there may be punishment or reward, not from God's prejudgment but from the merits of each. And I think those are called the good things of the land of which we read in the psalm: I believe that I shall see the good things of the Lord in the land of the living (Ps 26 [27]:13); and: Blessed are the meek, for they shall possess the land (Matt 5:3). Or certainly, because he was speaking to the Jews, who could not yet grasp spiritual things, he promises them the good things of the present age, so that, enticed at least by present things, they might do what was commanded. And because they would not hear, but on the contrary provoked the Holy One of Israel to anger, therefore the sword devoured them, that is, the Roman army destroyed them. And all these things, he says, will come to pass, For the mouth of the Lord has spoken; whose sentence, while men's sins remain, cannot be changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
