[[commentary]]
quote='''
And he fittingly added: Beyond measure I persecuted the Church of God, so that from this too admiration might arise, because it was not just anyone of those who persecuted the Church lightly, but he who outdid the rest in persecution, who was converted to the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
And how fine is the observation and the weight of the words: You have heard, he says, of my conduct formerly in Judaism: conduct, not grace; formerly, not now; in Judaism, not in the law of God. That beyond measure I persecuted the Church of God, and laid waste to it. He did not persecute as the others did, but beyond measure. Nor was a persecution, however vehement, enough for him: but like some brigand and robber he ravaged the Church. Nor does he say the Church of Christ, as he then thought, Christ whom he held in contempt, whom he persecuted; but, as he now believes, the Church of God: signifying either that Christ himself is God, or that the Church belongs to the same God who was once the giver of the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
