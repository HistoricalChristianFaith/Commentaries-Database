[[commentary]]
quote='''
Who will give me in the wilderness a lodging place of wayfarers? And I will forsake my people and withdraw from them. LXX: who would give me in the wilderness a last dwelling, that I may leave my people and withdraw from them? 'It is better,' he says, 'to dwell in the farthest wilderness than to abide among such great crimes of men'. Hence the Savior also said in the Gospel: how long shall I bear with you? And in another place it is written: at that time he who understands shall sit and be silent, for it is a most evil time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
