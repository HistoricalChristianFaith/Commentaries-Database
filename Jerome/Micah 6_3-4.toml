[[commentary]]
quote='''
God, therefore, speaks to the people of Israel, and summons them to judgment, and grants them leave to dispute against him. My people, what have I done to you that I ought not to have done? Or how have I grieved you? although this is not found in the Hebrew. But a father grieves the son he has scourged, and the shepherd visits the iniquities of the sheep with the rod. In what have I been troublesome to you? Or, as is written more expressively in the Hebrew, with what toil have I oppressed you? Or will you interpret my benefits as an insult, and, longing for the melons and the meats of Egypt, will you grieve that you were brought out of the land of Egypt and freed from the house of bondage by my help, because I gave you as leaders Moses my friend, and Aaron my priest, and Miriam my prophetess?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
But we who long to contemplate the glory of the Lord with unveiled face, and truly have Abraham as our father, let us hear God, when we have sinned, disputing against us and reproving us by the greatness of his benefits. For we once served Pharaoh, and made mud and bricks for the Egyptian people, and he redeemed us who gave himself as a redemption for all, so that we who had been redeemed by the Lord, whom he redeemed from the hand of the enemies and whom he gathered from the regions, might say: For his mercy is forever. He also sent before our face Moses, the spiritual law, and Aaron, the great priest, not bearing the typical ephod and the truth, but having on his forehead the seal of holiness which God the Father sealed. And he sent Miriam, the prophecy of the prophets; and not only did he grant us this, but he also freed us from the hands of the enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
