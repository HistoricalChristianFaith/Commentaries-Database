[[commentary]]
quote='''
For righteousness' sake He adds expressly, for many suffer persecution for their sins, and are not therefore righteous. Likewise consider how the eighth beatitude of the true circumcision is terminated by martyrdom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are those who suffer persecution for the sake of justice. He added pointedly: for the sake of justice. For many suffer persecution for their own sins and are not just. And at the same time consider that the eighth beatitude, that of the true circumcision, ends in martyrdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
