[[commentary]]
quote='''
With their flocks and with their herds they will go to seek the Lord and will not find; he has been taken away from them; they have transgressed against the Lord, for they have begotten strange sons; now a month will devour them with their portions. LXX: With sheep and calves they will go to seek the Lord and will not find him; he has turned aside from them, because they have forsaken the Lord; because they have begotten strange sons for themselves, now rust will devour them, and their lots. Not only Israel and Ephraim will go with flocks and herds to seek the Lord, but Judah also, of whom it is written above: Judah also will fall with them; all of them having this one contest, that they strive to appease with victims him whom they have offended by their transgressions; and they do not find him whom they seek, because he too has departed from those who depart from him. Especially since he says elsewhere also: Shall I eat the flesh of bulls, or drink the blood of goats? And again: I will not accept calves from your house, nor goats from your flocks. And in Isaiah: Burnt offerings of rams, and the fat of lambs, and the blood of goats and bulls I do not want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
