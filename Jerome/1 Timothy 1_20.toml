[[commentary]]
quote='''
The Apostle says: "Whom I have handed over to Satan, that they may learn not to blaspheme." The devil is, as it were, the Lord's torturer-examiner. Those who do not walk rightly toward God are handed over to the devil. Why? That they may perish forever? And where then is the clemency of God? where is the merciful father? where is he who makes his sun rise over the just and sinners, and rains upon sinners and the just? What he says is this: I hand over, he says, sinners to the devil, that, being tormented by him, they may be converted to me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_034.html'
source_title="Homily 34, on Psalm 107"
