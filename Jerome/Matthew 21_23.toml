[[commentary]]
quote='''
Or in these words they urge the same cavil as above, when they said, He casteth out demons through Beelzebub the Prince of the demons. (Mat. 12:24.) For when they say, By what authority doest thou these things? they doubt concerning the power of God, and would have it understood that the things He does are of the Devil. But when they add, Who gave thee this authority? they most clearly deny the Son of God, whom they suppose to work miracles, not by His own, but by others' strength.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when he had come into the temple, the chief priests and the elders of the people came to him as he was teaching, saying: By what power do you do these things, and who gave you this power? In different words they build up the same slander as above, when they said: By Beelzebub, the prince of demons, this man casts out demons. For when they say: By what power do you do these things, they doubt the power of God and want it to be understood that what he does is the devil's; and adding further: who gave you this power, they most plainly deny the Son of God, whom they think does signs not by his own powers but by another's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
