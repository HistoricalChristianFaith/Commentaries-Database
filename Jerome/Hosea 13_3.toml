[[commentary]]
quote='''
Therefore they will be like a morning cloud, and like the morning dew passing away, like dust snatched by the whirlwind from the threshing floor, and like smoke from the chimney. LXX: likewise; changing only this, which is at the end: and like vapor from locusts, or from tears, because in most manuscripts we find ἀκρίδων (of locusts) set down, in others δακρύων (of tears). Because, he says, they sacrificed men in place of calves, and adored calves, therefore they will be like a morning cloud, and like the dew passing away in the morning, like dust snatched by the whirlwind from the threshing floor, and like smoke from the chimney. All these are seen for a time and suddenly vanish, according to what he had said: Samaria has made her king pass away like foam upon the face of the water. And again: As the morning passes, the king of Israel will pass away. And that a cloud or dew passes swiftly, and dust from the threshing floor, and smoke from the chimney, no one doubts, according to what is written: As smoke fails, let them fail. But we ask why the LXX, for 'chimney', which Theodotion translated καπνοδόχην, rendered 'locusts'? Among the Hebrews 'locust' and 'chimney' are written with the same letters, aleph, res, beth, he. If it is read arbe, it means locust; if orobba, chimney; for which Aquila translated καταράκτην, Symmachus 'opening'. Now a cataract is properly the name for an opening made in a wall, through which the smoke goes out. But if someone contentious and unwilling to accept the Hebrew truth should seek the sense of 'locust', let him hear that Ephraim is compared to ἀτμῷ, that is, to a vapor, or a breath and a breathing, which comes out of the mouth of a locust so thin that it is not perceived; but if, on the contrary, he objects, why did he not liken Ephraim, who was to perish, to other things which are smaller, for example to the flea, which has all its members, head, eyes, feet, belly and the rest, which, though we do not see them with our eyes, we nevertheless perceive by sense, so much so that the mouth and teeth of the flea, which we do not see with our eyes, we feel by its bites. He must be answered that he compared the glory of those who were to perish to the vapor of the locust, or to a most thin breath, for this reason: because the locust is harmful, and so hostile to mortals that it causes famine and lays waste the tilled crops, so much so that it strips the bark from trees and vines as well, as we read more fully in the prophet Joel. And to this locust, and to the morning cloud and the dew and the dust, the heretics are compared, of whom it is also said in the catholic epistle: These are clouds without water. For they have the appearance of prophets and of apostolic clouds, to which the truth of God comes; but they do not have waters, that is, the grace of the Holy Spirit, as the Lord says in the Gospel: He who believes in me, as the scripture says, out of his belly shall flow rivers of living water. But this, he says, he said of the Spirit which those who believed in him were to receive. But concerning the tears, which in the Greek tongue have some likeness to the locusts, δακρύων καὶ ἀκρίδων, the error is manifest, since some supposed 'tears' in place of 'locusts'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
