[[commentary]]
quote='''
A certain one interprets this passage thus: On the right and on the left we read of powers and strengths of God, which the Greeks call δυνάμεις. On the right the Seraphim and Cherubim, and all the angelic powers; on the left the contrary strengths, of which it is written: He sent upon them the wrath of his indignation, fury and wrath, and tribulation, a sending by evil angels; of which Micaiah too speaks in the book of Kings: I saw the Lord God of Israel sitting on his throne, and all the host of heaven stood beside him on his right and on his left. I think that it was a left-hand spirit which went forth, and stood before the Lord, and said: I will deceive Ahab, and I will go forth, and I will be a lying spirit in the mouth of all his prophets. To this left-hand and contrary power, which was apt for deceiving, and practiced in ruin, and had deceived many before, God says: You shall deceive and prevail; go forth and do so. That spirit also which choked Saul, of which his servants said to him: Behold, an evil spirit of God has stupefied you, was from the left-hand parts, which minister to the Lord for punishing those who have deserved to be tormented for their sins. For not only are men ministers and avengers of his wrath upon those who do evil, and not without cause do they bear the sword, but also the contrary strengths, which are called the fury and the wrath of God, which the prophet, deprecating them, says: O Lord, do not rebuke me in your fury, nor chasten me in your wrath. To such, so to speak, inquisitors and torturers the Apostle handed over sinners for the destruction of the flesh, that the spirit might be saved; among whom is Satan too, to whom he handed over others that they might learn not to blaspheme. So much on why the caterpillar was called the power of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
