[[commentary]]
quote='''
Let us say also that according to the LXX it is called ῥοῶν, not a single tree of pomegranates, that is, of the Punic apple, but a place planted with these trees, of which, according to the spiritual understanding, the bridegroom says in the Song of Songs: I went down to see in the produce of the torrent whether the vine had flowered, whether the pomegranates had flowered. For the Savior went down to the torrent of this world and its turbid waters, from which Elijah too, in a type of him, is described as having drunk, so that after the flowers of the vine and of the pomegranate he might receive the fruit of both, and, making his Church drunk, might hear from her: You shall give me to drink of the perfumer's wine, of the wine of my pomegranates. A drink of this kind not only drives away the heats of the stomach, but is also said to heal a corrupted belly and to benefit the other inner organs. For nothing is more beautiful than this fruit; in its redness it signifies the modesty of the Church, in the order of its seeds the ranks and members of the whole body distributed through their several offices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
