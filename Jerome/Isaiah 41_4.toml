[[commentary]]
quote='''
Who, he says, has wrought and done these things? Who raised up the righteous one, or righteousness? Who delivered nations and kings to him? Who subjected all things to his sword and bow? Surely he who from the beginning of the world foretold that these things would come, who is the Founder of all. And because he had said, with the feeling of one inquiring, Who raised up the righteous one from the East, and so on, while all were silent he answered himself: I am the Lord, I am the first and the last. It is he who speaks also in the Apocalypse of John: I am the alpha and the ω, the beginning and the end (Rev 1:8; and 22:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
