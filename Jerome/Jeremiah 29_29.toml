[[commentary]]
quote='''
When Zephaniah the priest had received this letter, which was written specifically in his name, he read it to Jeremiah, in a way insulting him and rebuking him by the very reading, as to why he dared to write such things to Babylon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
