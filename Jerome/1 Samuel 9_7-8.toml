[[commentary]]
quote='''
Nor let anyone be troubled by what we read in the first book of Kings (1 Samuel): that Saul, wishing to go to Samuel, said to his servant that he could not go to him because he did not have a price to offer for the prophecy, and that the servant answered: Behold, there is found in my hand the fourth part of a shekel of silver, and I will give it to the man of God, and he will tell us our way; for it is not written that Samuel accepted it, or that they offered it to him; on the contrary, they are fed by the prophet and invited to a meal. But suppose that he did accept it: it should be reckoned rather as offerings for the tabernacle than as payment for prophecy. For a shekel contains twenty obols, and the fourth part of a shekel is five obols. So our priests too, if they wish to sell prophecy, and to set out in their chairs the doves which the Lord overturned with a whip, let them accept five obols, not the prices of country estates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
