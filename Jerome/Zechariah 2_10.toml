[[commentary]]
quote='''
But rightly, after the captivity, is the daughter of Zion called forth to joy, of whom it is also said in the psalm: When the Lord turns back the captivity of his people, Jacob shall exult, and Israel shall be glad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
