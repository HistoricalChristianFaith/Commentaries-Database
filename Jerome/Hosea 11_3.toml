[[commentary]]
quote='''
And I was like a foster-father to Ephraim, I carried them in my arms, and they did not know that I was healing them. With the cords of Adam I will draw them, with the bonds of love. And I will be to them as one who lifts the yoke upon their jaws, and I inclined toward him that he might eat. LXX: And I bound Ephraim together, I took him up upon my arm; and they did not know that I was healing them in the corruption of men; I stretched them out in the bonds of my love. And I will be to them as a man giving slaps upon his jaws; and I will look upon him, prevailing over him. The Hebrew and the edition of the Seventy translators differ greatly from each other. Let us try, therefore, to weave the history according to the Hebrews, and ἀναγωγὴν (anagogy) according to the LXX. He who had said above: Israel was a child, and I loved him, and out of Egypt I called my son, and afterwards added what wickedness he committed: They sacrificed to the Baalim and offered sacrifice to images, now relates with what love he loved Israel, according to what we read in Deuteronomy: The Lord your God carried you, as a man is wont to carry his little son, in all the way by which you walked, until you came to this place. And in another place: He spread out his wings and took him up, and carried him on his shoulders. I, he says, who was a father, became a foster-father, and I myself carried my little one in my arms, lest he be harmed in the wilderness; and lest he be terrified either by heat or by darkness, by day I was a cloud, by night a pillar of fire; so that those whom I had protected I might enlighten and heal with my light; and when they had sinned and made for themselves the head of a calf, I gave room for repentance, and they did not know that I was healing them, and closing over the wound of idolatry in the space of forty years, and restoring them to their former health.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Let us pass to the spiritual understanding, according to the Seventy translators only; lest, if we wish to expound both, according to the history and according to ἀναγωγὴν, we stretch out the size of the book. While they sacrificed to the Baalim which they had fashioned from their own heart, and, when I called, fled from my face, — for so it stands in the Seventy —, I, the most merciful Lord, bound the feet of Ephraim, that they might not flee farther from me; for this is what συνεπόδισα signifies. And I bound them with the testimonies of the Scriptures and the disputation of the teachers of the Church, so that he might hold them, bound through patience, in his arms, while they did not understand that the patience of God was the occasion of their salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
