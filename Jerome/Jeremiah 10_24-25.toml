[[commentary]]
quote='''
Chasten me, O Lord, but yet in judgment and not in your fury, lest perhaps you bring me to nothing! Pour out your indignation upon the nations which have not known you, and upon the provinces — or generations — which have not called upon your name, for they have devoured Jacob and consumed his place, and his beauty — or pastures — they have scattered or reduced to desolation. We read this passage in the Psalm: O Lord, rebuke me not in your fury, nor chasten me in your wrath! And the sense is: 'We deserve indeed all that we endure, and we deserve much greater things than we suffer; yet this I beseech, that you chasten me as a father, not as an adversary, that you amend me as a son and do not punish me as an enemy; for you chastise every son whom you receive, and through every pain and scourge you amend Jerusalem. But the enemies, who have not known you, and the provinces or regions, which have not called upon your name, ought by no means to feel your judgment, but your indignation. For you handed us over that we might be amended. But they made their yoke heavy; they did not spare the old man and they afflicted the little ones; they ate us up and utterly devoured us, and reduced Jerusalem to such desolation that they scattered everything of both public and private buildings and killed your people'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
