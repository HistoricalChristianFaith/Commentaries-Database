[[commentary]]
quote='''
And I commanded Baruch before them, saying: Thus says the Lord of hosts, the God of Israel: Take these books, this sealed book of purchase and this book which is open, and put them in an earthen vessel, that they may last many days. For thus says the Lord of hosts, the God of Israel: Houses and fields and vineyards shall yet be possessed in this land. With all those whom the preceding discourse has named present and looking on, Baruch, the minister and disciple, is commanded — not by the words of his teacher, but by the order of God who commands — to take the books, one sealed, the other open — a custom of purchases still kept to this day, so that what the seals hold shut up within, the open volume displays to those who wish to read it —, both of them in an earthen vessel, that they may last many days. Firm, therefore, and to endure long afterwards was the possession that was guarded with such great care, lest the books of the purchase, if placed outside, should lie open to plunder, or, if buried in the ground, should be dissolved by the moisture of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
