[[commentary]]
quote='''
This He speaks of the present generation, not of all the Patriarchs and Prophets of past ages.

Or perhaps in the person of the centurion the faith of the Gentiles is preferred to that of Israel; whence He proceeds, But I say unto you, Many shall come from the east and from the west.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus, hearing it, marveled. He marveled because he saw that the centurion understood his majesty. For both the infirmities of bodies and the opposing powers, to which a man is often given over to be disabled, had to be driven out, both by the word of the Lord and by the ministries of angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Amen I say to you: I have not found such faith in Israel. He speaks of those present, not of all the patriarchs and prophets of the past, unless perhaps in the centurion the faith of the Gentiles is set above Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
