[[commentary]]
quote='''
From this we understand that even the moral precepts (which most people think are plain, from the fact that in the eighteenth psalm (v. 9) it is said: The commandment of the Lord is bright, enlightening the eyes) need a prudent and circumspect exposition, because that bright precept enlightens the eyes of those who, having abandoned unwisdom, have given themselves over to the pursuits of wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
