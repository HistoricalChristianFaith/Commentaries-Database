[[commentary]]
quote='''
At all times let your garments be white, and let oil not be lacking from your head. Have, he says, a clean body, and be merciful. Or thus: let there be no time in which you do not have white garments; beware of ever putting on polluted clothes. For the sinful people is described as having mourned in dark garments. But you, put on light, and not the curse that is written over Judas: Let him be clothed with cursing as with a garment. Put on bowels of mercy, kindness, humility, meekness, patience. And when you have stripped off the old man with his works, put on the new, who is renewed from day to day. As for his saying: And let oil not be lacking from your head, it must be known that the nature of oil is this: it both feeds light and relieves the labor of the weary. There is a spiritual oil, the oil of exultation, of which it is written: Therefore God, your God, has anointed you with the oil of exultation above your fellows. With this oil our face is to be made cheerful. With this the head of one who fasts is to be anointed, an oil which sinners cannot have, to whom it is said: There is no plaster to apply, nor oil, nor bandages. For they have a contrary oil, which the just man detests, saying: Let not the oil of the sinner fatten my head. This oil the heretics have, and with it they long to drench the heads of those they deceive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
