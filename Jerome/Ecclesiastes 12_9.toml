[[commentary]]
quote='''
And further, because Ecclesiastes became wise, he still taught the people knowledge, and made them hear; and searching he composed proverbs. Ecclesiastes sought much, to find words of will and to write rightly words of truth. The wisdom by which Solomon surpassed the whole race of men he now also professes at the end of his little work: that he was not content with the instruction of the old law, but of his own accord plunged himself into deep questions, and, to teach the people, composed proverbs and parables that have one thing in the marrow and promise another on the surface. For that proverbs do not sound what is written we are taught in the Gospels too, since the Lord spoke to the people in parables and proverbs, but privately solved them for the apostles. From this it is manifest that the book of Proverbs too does not, as the simple suppose, contain plain precepts, but, as gold is sought in the earth, the kernel in the nut, the fruit hidden in the bristly husks of chestnuts, so in them the divine sense must be searched out more deeply.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
