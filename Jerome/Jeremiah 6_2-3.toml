[[commentary]]
quote='''
I have likened the daughter of Zion to a beautiful and delicate woman. To her shepherds will come with their flocks; they have pitched — or they will pitch — their tents against her round about; each one will pasture those who are under his hand. Sanctify — or Prepare — war against her; arise, and let us go up at noon! The beauty of Jerusalem is described, which is Zion itself, so that the one name denotes the whole city, the other the citadel of the city. For Sion means 'citadel', that is, watchtower, and she is compared to a beautiful woman; and as lovers come together to the one, so shepherds are said to come together to the other. And quite elegantly in the Hebrew the word that is written with four letters, 'res, ain, iod, mem', if it is read 'reim', means 'lovers', if 'roim', 'shepherds', so that either, according to the metaphoran [metaphor] of a beautiful woman, lovers are understood, or, according to the overthrow of the city, shepherds: of whom the former hasten to defile a harlot, the latter to besiege and overturn a city. In the shepherds and their flocks let us perceive the princes and the army of the Chaldeans. And they will pitch their tents round about in the siege of the city, and each one will pasture those who are under his hand, that is, his own squadrons and companies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
