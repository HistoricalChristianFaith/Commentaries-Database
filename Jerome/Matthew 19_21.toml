[[commentary]]
quote='''
(cont. Vigilant. 15.) That Vigilantius asserts that they who retain the use of their property, and from time to time divide their incomes among the poor, do better than they who sell their possessions and lavish them in one act of charity, to him, not I, but God shall make answer, If thou wilt be perfect, Go and sell. That which you so extol, is but the second or third grade; which we indeed admit, only remembering that what is first is to be set before what is third or second.

For many who leave their riches do not therefore follow the Lord; and it is not sufficient for perfection that they despise money, unless they also follow the Saviour, that unless having forsaken evil, they also do what is good. For it is easier to contemn the hoard than quit the propensityb; therefore it follows, And come and follow me; for he follows the Lord who is his imitator, and who walks in his steps.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jesus said to him: If you wish to be perfect, go, sell what you have and give to the poor, and you will have treasure in heaven; and come, follow me. It is in our power whether we wish to be perfect. Yet whoever wishes to be perfect ought to sell what he has, and not to sell in part, as Ananias and Sapphira did, but to sell all, and when he has sold it, to give everything to the poor, and so to prepare for himself a treasure in the kingdom of heaven. Nor is this enough for perfection unless, after despising riches, he follows the Savior, that is, leaving evil things behind, does good. For a purse is more easily despised than the will. Many who leave riches behind do not follow the Lord. But he follows the Lord who is his imitator and walks in his footsteps. For he who says he believes in Christ ought himself also to walk as he walked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
