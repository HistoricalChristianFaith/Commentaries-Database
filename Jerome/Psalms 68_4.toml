[[commentary]]
quote='''
Sing to God, sing a psalm to his name. "Sing" — in Scripture this always signifies contemplation (theoria): that is, consider the mysteries and the meaning of divine Scripture. But "to make melody" (psallere) Scripture signifies as a good work: for example, that the hearing should furnish its own work, and likewise the mouth, and the eyes, and the hands, and all the members should as it were agree, and thus strike the psaltery in the virtues. Make a way for him who ascends above the sunset: the Lord is his name. If the sun of iniquity does not set for us, the sun of righteousness cannot rise for us, whose healing is in his wings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_007.html'
source_title="Homily 7, on Psalm 67"

[[commentary]]
quote='''
And what follows: As far as the torrent of the west, we shall interpret from the sixty-seventh (68th) psalm, in which it is written: Sing to the Lord, sing a psalm to his name; make a way for him who ascends above the sunset. The Lord is his name. For unless evil works have set in us, Christ will not ascend above us. And when they have set, and we have Christ as our charioteer, then, as we advance and go on to better things, it will be commanded us in the same psalm: Sing to God, sing psalms to the Lord, who ascends above the heaven of heaven toward the east. Hence also in the mysteries we first renounce him who is in the west, and who dies to us together with our sins, and so, turned toward the east, we enter into a covenant with the sun of righteousness and promise that we will serve him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
