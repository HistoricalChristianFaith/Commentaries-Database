[[commentary]]
quote='''
Who is a God like you? You who take away iniquity, and pass over the sin of the remnant of your inheritance. He will not send his fury any more, because he is one who wills mercy. He will return and have mercy on us; he will put away our iniquities, and will cast all our sins into the depth of the sea. You will give truth in Jacob, mercy to Abraham, which you swore to our fathers from the days of old. LXX: Who, O God, is like you? Taking away iniquities, and passing over injustices for those who are left of your inheritance? He did not hold his anger as a testimony, because he is one who wills mercies. He will return, and will have mercy on us, he will sink our sins; and all our sins shall be cast into the depth of the sea. He will give truth to Jacob, mercy to Abraham, as you swore to our fathers according to the former days. The prophet, understanding that the multitude of the nations was troubled in its enclosure for this reason, that it might be astonished and fear God, and that the Lord rages for this reason, that he may take away sins and give salvation, praises the Lord and marvels, and says: Who is a God like you? Taking away iniquities, and passing over injustices, so that, just as the destroyer in Egypt passed over the people of Israel and did not lay it waste — and was it not from this passing-over that the phasa, that is, the pascha, received its name? — so you may spare the nations, in no way imputing to them their iniquities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Moreover, where we translated, He will not send his fury any more, for "any more" Symmachus rendered "forever", Theodotion "to the end", the Seventy and the Fifth Edition "as a testimony", for which laed is set in the Hebrew; and it can be understood as "any more" as well as "forever" and "testimony".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
