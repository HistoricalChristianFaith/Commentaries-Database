[[commentary]]
quote='''
Therefore I will give their women — or wives — to strangers, their fields to heirs, because from the least to the greatest all are devoted to avarice, from the prophet to the priest all practice falsehood — or iniquity —. And they healed the breaking of the daughter of my people to ignominy, saying: Peace, peace, when there was not peace. They received the wages of their works, so that those who cast away the word of the Lord were themselves cast away by him. 'Their wives,' he says, 'and their possessions I will hand over to the enemy. And lest my sentence be thought cruel, let the hearer recognize the causes: from the least to the greatest all are devoted to avarice — for avarice is the root of all evils —, from the prophet to the priest. Those who ought to restrain others when they sin are the first to be given over to crimes, and all either do iniquitous things, while they plunder the goods of others, or at any rate practice falsehood, so that there is no truth in their mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
