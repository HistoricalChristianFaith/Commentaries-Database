[[commentary]]
quote='''
What will you do on the solemn day, on the day of the festival of the Lord? For behold, they have set out from the devastation; Egypt will gather them, Memphis will bury them; the nettle will inherit the desirable things of their silver, the bur will be in their tents. LXX: What will you do on the day of assembly and on the day of the solemnity of the Lord? Therefore behold, they will go from the misery of Egypt, and Memphis will receive them, and Michmash will bury them; destruction will possess their silver, thorns will be in their tents. When the day of captivity comes, he says, and the most savage enemy falls upon you, what is my solemnity? What victim do I hold as propitious? That he avenges me on my enemies, and puts a limit to wrong, and scourges the impious sons. What then will you do on the day of the festival of the Lord? Answer. And while they are silent, he answers himself, or rather he beholds with divine eyes what they are going to do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
