[[commentary]]
quote='''
For who can either eat or, when there is need, spare, without God? He commanded that what is holy is not to be thrown to dogs, and teaches how food is to be given to fellow servants in due season, and, according to another sense, when honey is found, to eat only as much as suffices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
