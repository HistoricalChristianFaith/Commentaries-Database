[[commentary]]
quote='''
Someone may suppose that Paul is speaking simply: If anyone corrupts the temple of God, God will corrupt him: For the temple of God is holy, which you are. But perhaps there too something lies hidden which seems concealed from us. If we are the temple of God, according to what is written: For the temple of God is holy, which you are (1 Cor. 3:17), then he who corrupts the temple of God is one, and that which is corrupted is another. We must ask who he is who corrupts the temple of God. If you find the enemies of Jerusalem corrupting and violating the temple built of stones, you will see likewise everyone who corrupts and violates the temple of God, whom God will corrupt and violate, avenging the corruption of his temple. Nevertheless, the temple too which offered itself (it is indeed living and capable of sensation) to the snares of the corrupter will pay the penalty, by this very fact that, having been corrupted and violated, it has lost the spirit of incorruption.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
