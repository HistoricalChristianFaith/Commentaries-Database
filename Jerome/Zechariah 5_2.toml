[[commentary]]
quote='''
I have read that the twenty cubits of length and the ten of breadth refer to the age of the Lord Savior, that is, they make the number thirty, because the Father judges no one, but has given all judgment to the Son, and by him the world is to be judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
