[[commentary]]
quote='''
When He was doing works of mercy, and bidding to His marriage-feast, He was called a man; (homini regi) now when He comes to vengeance, the man is dropped, and He is called only a King.

By His armies we understand the Romans under Vespasian and Titus, who having slaughtered the inhabitants of Judæa, laid in ashes the faithless city.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But when the king heard, he was angry. Of him he had said above: The kingdom of heaven has become like a man, a king, when he was inviting to the wedding and doing works of clemency, the name of man was set beside him; now, when he comes to vengeance, 'man' is passed over in silence and he is called only 'king'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And having sent his armies, he destroyed those murderers and burned their city. By the armies let us understand either the avenging angels, of whom it is written in the psalms: An infliction by most evil angels, or the Romans under the leadership of Vespasian and Titus, who, having slain the peoples of Judea, burned the transgressing city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
