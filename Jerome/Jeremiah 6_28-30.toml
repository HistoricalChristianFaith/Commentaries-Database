[[commentary]]
quote='''
For as lead is mixed with metals that are adulterated and debased, so that the foreign matter may be separated, and, if perhaps it has not been purified, all the lead is consumed and reduced to nothing, so all the eloquence of teaching and the prophetic word perishes in those who scorn to hear. Let us speak also of those who, like deaf asps, stop their ears so as not to hear the voices of the charmers. For in vain has the silversmith smelted or the smelter; for their wickednesses have not been consumed. Hence they are called not 'silver' but 'reprobate silver', for the Lord has cast them off. And the princes are those who withdraw from the Lord, or the disobedient, who walk perversely and deceitfully.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
