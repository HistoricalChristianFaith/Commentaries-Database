[[commentary]]
quote='''
Like a shepherd he will feed his flock. He who afterward is to come in majesty first takes the form of a shepherd, and says of himself: I am the good shepherd, and I know my sheep, and mine know me, and I lay down my life for my sheep (John 10:14, 15). Of him the Father speaks in Zechariah: I will strike the shepherd, and the sheep will be scattered (Zech 13:7). In his arm, he says, he will gather the lambs; not the bulls and rams and he-goats and great sheep, whom he threatens through Ezekiel (Ezek 34) because they feed on the milk and are clothed with the wool and crush the weak of the flock, but the lambs, still tender and of an unformed infancy in Christ, who have lately been reborn in baptism, of whom the Lord himself spoke to Peter: Feed my lambs (John 21:15). Hence also in the same Ezekiel it is written: I will raise up over them one shepherd, and he shall feed them, my servant David; and he shall be their shepherd, and I the Lord will be their God, and David a prince in their midst. I the Lord have spoken, and I will make with David a covenant of peace (Ezek 34:23-25). In this it is to be considered that, long after the time of David, the gluttonous shepherds being rejected, he says he will raise up our Lord, who is of the stock of David, to gather the lambs and cherish them in his bosom, and himself to carry on his shoulder the young of the sheep, or the ewes with young; as we read in the Gospel that he carried back to the fold on his shoulders the sheep that had strayed and stayed behind from its accustomed flock (Luke 15). We can call the ewes with young the Apostles and apostolic men and all the teachers of the Church, who are in labor with the salvation of very many, and say with the Apostle: My little children, with whom I am again in labor until Christ be formed in you (Gal 4:19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
