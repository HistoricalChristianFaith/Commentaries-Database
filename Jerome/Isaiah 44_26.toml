[[commentary]]
quote='''
He will also fulfill in deed the word of his child, or servant, of whom we spoke above, and the counsel of his messengers, namely of the Apostles and all the teachers, who will announce the will of their master to the nations. He, then, who is to do such great things, whose power I have described in a brief discourse, now says also to Jerusalem, which was to be destroyed by the Babylonians, before it is destroyed, that it will again be inhabited by peoples; and to the cities of Judea, that they will be restored; he who will also raise up its solitudes, so that all may be filled with inhabitants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
