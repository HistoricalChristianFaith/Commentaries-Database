[[commentary]]
quote='''
But the Lord does the contrary; for all their secrets and hidden mysteries, and those of the patriarchs of Esau — for by these I understand those who first invented heresies —, he brings into the open through his saints and through churchmen and teachers; and his first victory is that the hidden things that were covered lie open. Whence it is also said with wonder: How has Esau been searched through, have his hidden things been found out? See how Marcion and Valentinus and all the heretics, having their conscience seared, applaud themselves in doctrines of demons, and, as if initiating simple souls into certain divine mysteries, deceive them with artful speech. But when discourse has brought into the open the thirty aeons, and teams of four, and ogdoads and dodecads, and the twofold god, and the monstrous Abraxas, then the prudence of Esau will be shown to be folly, and his secrets will be tracked down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
