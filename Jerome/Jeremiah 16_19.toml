[[commentary]]
quote='''
O Lord, my strength and my might and my refuge in the day of tribulation or of evils! All the strength of men without the power of God, which is Christ, is reckoned feeble and of no account; hence one must flee to God and say: Lord, you have become a refuge for us from generation to generation; and in another place: he who dwells in the help of the Most High shall abide in the protection of the God of heaven. And the day of tribulation or of evils is to be understood as that of which the Apostle also says: that he might rescue us from the present evil age, and: redeeming the time, because the days are evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
[[commentary]]
quote='''
To you the nations shall come from the ends of the earth and shall say: Truly our fathers possessed a lie, vanity, which did not profit them. LXX: to you the nations shall come from the ends of the earth and shall say: How false are the idols our fathers possessed, and there is no profit in them! After Israel has been cast out and carried away by the fishers and hunters, the multitude of the nations is accordingly called to faith and confesses that it, or its fathers, had been engaged in their former error. And those who say: 'how false are the idols our fathers possessed, in which there is no profit!' confess that the things to which they are passing over are true and supported by every protection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
