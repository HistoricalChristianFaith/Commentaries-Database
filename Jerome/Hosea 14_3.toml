[[commentary]]
quote='''
Those who say that they will render the calves of the lips, and will sing the praises of God with unceasing voice, also promise something else: that they will by no means have hope in the Assyrians, nor upon Egyptian horses, because a horse is deceptive for safety, and that they will no longer worship the works of their hands, the golden calves which they cast in Dan and Bethel; and therefore they say: By no means will we say to the work of our hands: our gods, for you will have mercy on the orphan who is in you; that is, on the people of Israel, of whom you had said: Israel is my firstborn son. And: I have begotten sons and exalted them, but they have despised me. And in another place: Foreign sons have lied to me. Now he is called an orphan because he has lost God as his father. A certain writer has explained the orphan as him who has withdrawn from an evil father, the devil, and who is therefore lifted up by the mercy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
