[[commentary]]
quote='''
The Aradii are those who possessed the island of Aradus, separated from the coast of Phoenicia by a narrow strait. The Samaraei are Emesa, a famous city of Syria Coele. Amath is called, up to our own time, by the Syrians as well as by the Hebrews just as it was called among the ancients; the Macedonians, who reigned in the east after Alexander, named it Epiphania. Some think that Antioch was so called. Others, though not truly, yet consoling their opinion with a name that resembles, as it were, the true one, think that the first station from Antioch for those going to Edessa is called Emas, and that it is the same place that was called Emath among the ancients.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Samaraeum [Zemarite]: my wool, or my joined one. But better: guard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
