[[commentary]]
quote='''
Noah too became drunk, but he had truly become drunk. Joseph was drunk, Noah too became drunk, and he became drunk in his own house. See the mystery. Let us first see what it signifies in mystery, and afterward let us discuss what it signifies in its plain sense. After the flood of this world Noah drank, and became drunk in his own house, and his thighs were uncovered, and his shame appeared. And the elder brother came and mocked; but the younger brother covered him. All this is said of the Savior, since he had drunk his passion on the cross. 'Father, if it is possible, let this cup pass from me.' He drank, and became drunk, and his thighs were uncovered: that is, the ignominy of the cross. The elder brother came, the people of the Jews, and mocked; and the younger, the people from the nations, covered the ignominy. Therefore 'cursed be Canaan, he shall be a servant to his brother.' Behold, that curse persists to this very day. We, the younger people, command the elder people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_013.html'
source_title="Homily 13, on Psalm 80"
