[[commentary]]
quote='''
This Scribe of the Law who knew but the perishing letter, would not have been turned away had his address been, 'Lord, I will follow Thee.' But because he esteemed the Saviour only as one of many masters, and was a 1man of the letter (which is better expressed in Greek, γραμματεὺς) not a spiritual hearer, therefore he had no place where Jesus might lay His head. It is suggested to us that he sought to follow the Lord, because of His great miracles, for the sake of the gain to be derived from them; and was therefore rejected; seeking the same thing as did Simon Magus when he would have given Peter money.

Why do you seek to follow Me for the sake of the riches and gain of this world, when My poverty is such that I have neither lodging nor home of My own?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And a scribe came up and said to him: Master, I will follow you wherever you go. And Jesus says to him: Foxes have holes and the birds of the air nests, but the Son of Man has nowhere to lay his head. This scribe of the law, who knew only the letter that kills, if he had said: Lord, I will follow you wherever you go, would not have been rejected by the Lord; but because he reckoned him one master among many, and was a man of letters (which is more expressively said in Greek γραμματεύς, and not a spiritual hearer), therefore Jesus has no place where he can lay his head. It is shown to us, moreover, that the scribe was rejected for this reason too, that, seeing the greatness of the signs, he wished to follow the Savior in order to seek gain from the miracles of his works, desiring the very thing that Simon Magus too had wished to buy from Peter. Such faith, then, is justly condemned by the Lord's sentence, and it is said to him: Why do you desire to follow me for riches and the gains of the world, when I am of such poverty that I do not even have a little lodging and do not use a roof of my own?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
