[[commentary]]
quote='''
It is clear from all this that there are two kinds of perfections in holy Scripture, and two kinds of justices and two kinds of fears. The first kind of perfection, and its comparable truth, and perfect justice and fear, which is the beginning of wisdom, are compatible with the virtues of God; but the second kind of perfection, which befits not only human beings but also every living creature, and our weakness, according to what is said in the Psalms: "In your sight no one living shall be justified," is the kind of justice that is called perfect, not in comparison with God but according to the knowledge of God. Job, Zachariah and Elizabeth are called just, according to this latter type of perfection, which can change on occasions into injustice, and not according to the former type, which can never change, of which it is said, "I am God, and I change not."
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.15"

[[commentary]]
quote='''
Atticus: From this it is clear that people are called righteous and said to be without fault; but that, if negligence comes over them, they may fall. [It is also clear] that a person always occupies a middle place, so that he may slip from the height of virtue into vice or may rise from vice to virtue. He is never safe but must dread shipwreck even in fair weather. Therefore, a person cannot be without sin. Solomon says, "There is not a righteous person on earth that does good and sins not." Likewise in the book of Kings [2 Chronicles]: "There is no one that sins not." So, also, the blessed David says, "Who can understand his errors? Cleanse me from hidden faults, and keep back your servant from presumptuous sins." And again, "Enter not into judgment with your servant, for in your sight shall no one living be justified." Holy Scripture is full of passages to the same effect.
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.12"

[[commentary]]
quote='''
And enter not into judgment with your servant. See, he has shown most plainly that he awaits the mercy of Christ, saying: And enter not into judgment with your servant. Here it is as though someone judges between God and the prophet, just as it is also written in the fiftieth psalm: 'That you may be justified in your words, and prevail when you are judged.' And God enters into judgment for this reason, that he may punish justly. Something of this sort was done also by Cyrus, king of the Persians and Medes, to the king of the Armenians, when he had violated his friendship. He conquered him, and took him captive; and he made that man's own kinsmen, and his wife, and his sons judge between them, so that he might justly either show mercy or punish. For in your sight shall no living man be justified. 'The God of Abraham, and the God of Isaac, and the God of Jacob: the God of the living, and not of the dead.' Therefore not even the patriarchs themselves will be justified in the sight of God. 'For the stars are not clean in his sight.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_053.html'
source_title="Homily 53, on Psalm 142"

[[commentary]]
quote='''
The question is how anyone can be holy and spotless before God, when the prophet testifies, saying: Every one living shall not be justified in your sight. For either the Ephesians are holy and spotless before God, and what is said is false: Every one living shall not be justified in your sight. Or, if no one is justified in the sight of God, what went before is false, that they are holy and spotless in the sight of God. To this a twofold answer must be given. For Paul does not say: He chose us before the foundation of the world when we were holy and spotless; but: he chose us that we might be holy and spotless, that is, that we who were not holy and spotless before might be so afterwards. This can also be said of sinners converted to better things, and that sentence will stand: Every one living shall not be justified in your sight, that is, in his whole life, in all the time that he has lived in this world. Understood this way, it also tells against him who says that the souls were chosen before the world came to be because of their holiness and their having no fault of sins. For, as we have already said above, Paul and those who are like him are not chosen because they were holy and spotless; but they are chosen and predestined so that in their subsequent life, through works and virtues, they may become holy and spotless. Then it must also be understood in this way: that he did not say: Any one living shall not be justified in your sight; but every one living, that is, not all will be justified, but some will be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
