[[commentary]]
quote='''
And what follows, So has Bethel done to you from the face of the malice of your wickednesses, is properly fitted to the leaders of the heretics: that Bethel has done this to them, the one they themselves call Bethel, that is, the house of God, and a false Church; so that the sense is: So will your Church do to you, which you call the house of God; but from the time it is held by you, it must be called Beth-aven, that is, house of the idol, because of the multitude of your wickednesses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
As the morning passes, the king of Israel has passed away; because Israel was a child, and I loved him, and out of Egypt I called my son; they called them, so they went away from their face. They sacrificed to the Baalim and offered sacrifice to images. LXX: In the morning they were cast away, the king of Israel was cast away; because Israel was a little child, and I loved him, and out of Egypt I called his sons. As I called them, so they themselves went away from my face. They sacrificed to the Baalim and burned incense to carved images. He sets out the same sense under different figures. He who had said above: Samaria has made her king pass away like foam upon the face of the water, because foam and bubbles floating on the surface of the waters are quickly dissolved, now puts the same thing under another likeness. For as the rising of the dawn, the first light and the beginning of the day, which is called morning, passes quickly between the nearness of night and of the sun, so that the night ends and the day grows bright, so the king of Israel, that is, of the ten tribes, will swiftly pass away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
