[[commentary]]
quote='''
To you I will sacrifice a victim of praise. After martyrdom, where does he sacrifice? In the land of the living. I will sacrifice, he says, to you a sacrifice. What kind of sacrifice? Surely not a goat, or a calf? Those were Jewish things, and they have passed away. I will sacrifice to you a victim of praise. This is the praise of the martyrs. For just as the martyrs praise the Lord purely in the land of the living, so too the monks, who day and night sing psalms to the Lord, ought to have the same purity as the martyrs: since indeed they too are martyrs. For what the angels do in the heavens, this the monks do on earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_040.html'
source_title="Homily 40, on Psalm 115"
