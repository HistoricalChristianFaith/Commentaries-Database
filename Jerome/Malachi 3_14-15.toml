[[commentary]]
quote='''
To them the Lord answered: You have said: Vain is he who serves God, and what profit is it that we have kept his commandments? In the present age they demand a wage for the service of God; therefore they do not receive it. And that we have walked sorrowful before the Lord, according to that which is written in the psalms: All the day long I went about sorrowful; therefore we call the arrogant blessed, who are proud against God and hurl impious words of blasphemies. Since they have been built up, and after their crimes and blasphemies enjoy all prosperity, they have tempted God, or resisted God, and have been saved. They think that salvation is the happiness of the present age. And for that reason they are deceived by errors. This we can also understand of the heretics Marcion and Valentinus, and the others who do not receive the Old Testament and speak against the Creator of the world, that they make progress in their impiety and have many companions in crime. Scandalized at them, those who persevere in the Church, and not knowing the causes of God's judgement, weave together the words of the prophet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
