[[commentary]]
quote='''
His house is this world, which is set in evil, not by the majesty of the Creator, but by the greatness of the sinner. The strong man is bound and chained in tartarus, bruised by the Lord's foot. Yet ought we not therefore to be careless; for here the conqueror Himself pronounces our adversary to be strong.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Or how can anyone enter the house of the strong man and plunder his vessels, unless he first binds the strong man, and then he will plunder his house? We must not be complacent: our adversary is shown to be strong even by the words of the victor; his house is the world, which is set in the evil one, not by the dignity of the Creator but by the greatness of the offender; his vessels we once were. The strong man has been bound and fastened down in Tartarus and crushed by the foot of the Lord, and, the seats of the tyrant having been plundered, captivity has been led captive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
