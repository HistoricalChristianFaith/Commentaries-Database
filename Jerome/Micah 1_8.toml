[[commentary]]
quote='''
Because of this, when their field has been turned into a watch-hut for fruit and prepared for vineyards, and the stones with which the city had been built have been pulled down into the depth, and their foundations have been laid bare, and all the carved images cut to pieces and burned, and the wages which they promised themselves with vain hope, and whatever they seemed to worship as God, reduced to nothing, because they had procured every reward for themselves from the fornication of the soul, then, understanding their former error and returning to themselves, they will lament over the things at which they used to laugh, and they will mourn over the things in which, committing fornication, they formerly in some way rejoiced. And they will put off from their feet whatever deadly thing they had, and they will be barefoot, because the ground on which they are to stand is a holy place, and they will cast away all the garments of their fornication; and they will be naked, so that they may be clothed with the garment of Christ, and they will make a lamentation like that of the dragons. For the dragons too will one day lament, when they see the greatest dragon captured and hanging on the fisherman's hook, and the sea made desolate. And they will mourn like the daughters of the Sirens, for the songs of the heretics are sweet, and deceive the peoples with a pleasant voice. Nor can anyone pass by their songs unless he has stopped his ear and escaped as if deaf.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
