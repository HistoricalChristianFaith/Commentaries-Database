[[commentary]]
quote='''
This answer does indeed seem to have some weight; but it is at once crushed by the authority of the Scripture that follows. For it is written: "But Abraham said to God: Let this Ishmael live in your sight" (ibid., 17:18 ff.); and God answered him thus: "Behold, Sarah your wife shall bear you a son, and you shall call his name Isaac, and I will establish my testament with him, for an everlasting testament, and with his seed after him. But concerning Ishmael: Behold, I have heard you, and behold, I have blessed him, and I will increase him, and I will multiply him exceedingly. He shall beget twelve nations, and I will make him a great nation; but my testament I will establish with Isaac, whom Sarah shall bear to you at this time, in the coming year". From these words it is evident, by the very speech of God as well, that Ishmael was begotten according to promise. But this too is resolved thus: the promise is properly fulfilled in the giving of the testament, and it is one thing to bless, to increase, to multiply exceedingly, which is written of Ishmael, and another to make an heir through a testament, which is said of Isaac: "I will establish my testament with him, for an everlasting testament, and with his seed after him". And in what follows: "But my testament I will establish with Isaac, whom Sarah shall bear to you" (Gen. 17:19). And just as gifts are one thing and the substance another, legacies one thing and the inheritance another (for we read that gifts were handed over to the sons of Abraham's concubines, but to the son of Sarah was left the inheritance of the whole substance), so, as we have said, blessing and legacies are one thing, the testament another. And this too can be said: that concerning Ishmael either the angel or God spoke after he had been conceived, whereas concerning Isaac God made the promise before he was conceived in Sarah's womb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
