[[commentary]]
quote='''
Do not speak, speaking; it will not drip upon these, confusion will not overtake them, says the house of Jacob. Is the Spirit of the Lord cut short, or are such his thoughts? Are not my words good with him who walks uprightly? And on the contrary my people has risen up as an adversary; you have taken away the cloak from over the tunic, and those who were passing by in simplicity you have turned into war. LXX: In the Church of the Lord do not weep with tears, nor let them lament over these things? For he will not cast off the reproaches, which he speaks: The house of Jacob has provoked the Spirit of the Lord, if these are his devices; are not his words good with him, and have they walked upright? And formerly my people stood out with enmities against its own peace; they flayed off its skin, to take away hope, the crushing of war. Do not speak, he says, speaking, for which Aquila translated: Do not drip, dripping; at times by a Hebrew idiom calling eloquence a dripping, from the fact that it flows and reaches the ears of those who hear, in the likeness of descending rain. Do not deceive yourselves, O house of Jacob, and say to one another for mutual consolation: God is good, the captivity which we fear will not come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
