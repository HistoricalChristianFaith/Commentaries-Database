[[commentary]]
quote='''
The Lord asks them not as though He did not know what they would answer, but that they might be condemned by their own answer.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Something of the kind the Prophet Nathan, sent to David, says too (2 Sam 12), and he questions him through a parable, so that while judging of another he may pronounce sentence on himself. So here too the people is questioned as though about a vineyard, so that it may answer against itself. This place the Savior carries out more fully in the Gospel (Matt 21), and what is passed over here, he puts as a question to the Scribes and Pharisees. For in Isaiah nothing is said of the husbandmen, nor is it indicated what they are to suffer, but the discourse is only of the vineyard; there, however, as though the vineyard were one thing and the husbandmen another, he speaks of the people and of the teachers in such a way that he destroys the wicked wickedly and lets out the vineyard to other husbandmen, signifying the apostles and those who were to succeed the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
When therefore the lord of the vineyard comes, what will he do to those tenants, and the rest. The Lord asks them, not because he does not know what they will answer, but so that they may be condemned by their own answer. Now the vineyard has been let out to us, and let out on this condition: that we render the Lord the fruit in its seasons and know at each time what we ought either to say or to do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
