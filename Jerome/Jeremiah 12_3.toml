[[commentary]]
quote='''
And you, O Lord, have known me, you have seen me and have tested my heart with you. Gather them like a flock to be victims, and sanctify them in the day of slaughter! 'It is no stumbling-block', he says, 'that the wicked, or all the heretics, flourish for a time; for you, O Lord, have known me and have seen me and have tested my heart with you'. Whom does God the Father know as he knows his Son? For no one knows the Son except the Father, and no one knows the Father except the Son, and he to whom the Son wills to reveal him. 'Although', he says, 'the heretics prosper, although they beget sons and bear fruit, and you are near to their mouth and far from their reins, that is, from their conscience, yet it is no small consolation that like cattle they are being fattened to be victims. You gather them into the city of Jerusalem, or into their own conventicles, so that like victims they may be slaughtered unto death, and may then be sanctified when they have been slain by the sword of the Church; for the slaying of the heretics is the salvation of those who had been deceived'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
