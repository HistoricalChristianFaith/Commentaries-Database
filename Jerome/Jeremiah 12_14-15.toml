[[commentary]]
quote='''
And as to what he adds: against all my most wicked neighbors: according to the letter, the neighbors of the holy land are the Edomites, the Philistines, Moab and Ammon; but according to tropology, they are all the heretics, who are reckoned under the name of Christ and are neighbors rather than inhabitants of the holy land, who touch the inheritance of God and lay it waste; and it is said of them that they are removed from the midst of the land and that the house of Judah is taken out of their midst. These, when they have been plucked up and freed from the jaws of the heretics, will obtain the mercy of God and will be brought back into their inheritance and into their land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
