[[commentary]]
quote='''
But, after God has had mercy on them, they will remember their most evil ways, and they will know where they have been, and they will be displeasing to themselves in their iniquities'; which the Lord says he does, not for their sake, but for the sake of his own clemency.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
