[[commentary]]
quote='''
My God, set them like a wheel. Let them not be stable, but forever uncertain: that they may have no seat, and be forever rolled about unstably. For just as a wheel is not of itself stable, so also the heretics do not stand firm in their opinion, but forever change their doctrines.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
