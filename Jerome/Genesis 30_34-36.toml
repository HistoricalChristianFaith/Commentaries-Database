[[commentary]]
quote='''
Laban gladly seized the option given him and, doing as Jacob asked, set a journey of three days between Jacob and his own sons, so that no trickery might arise from the nearness of the flocks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
