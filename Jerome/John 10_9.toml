[[commentary]]
quote='''
For the Lord himself is both king and shepherd, both the way and the gate, and he says: I am the gate: whoever enters through me will be saved; he will go in and go out, and will find pasture. Of this gate it is prophesied elsewhere too: This is the gate of the Lord, the just will enter by it. But whoever has entered ought not to remain in the state in which he entered; let him go out to the pastures, so that in entering there is the beginning, and in going out and finding pasture, the perfection of the virtues. He who enters is still in the world, and understands the Creator from the creatures. But he who goes out transcends the whole creation, and, counting as nothing all things that can be seen, will find pasture above the heavens, and will feed on the word of God, and will say: The Lord shepherds me, and I shall lack nothing. This is said so that we might understand the testimony of the Gospel, He will go in and go out, and will find pasture, and what is now said through the prophet, And they passed through the gate, and went out by it; yet this passing through and going out cannot be granted without Christ our king, who is king and Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
