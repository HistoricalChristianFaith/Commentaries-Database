[[commentary]]
quote='''
And his 'son' and 'son's son' — according to the Hebrew — he calls Belshazzar and Evil-merodach, of whom Daniel writes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Until the time of his land and of himself comes. Fittingly, lest the empire of Nebuchadnezzar be thought perpetual, he says that he himself too is to be taken by the Medes and Persians; for this is what it signifies: until the time of his land and of himself comes. But this too is not found in the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And many nations and great kings shall serve him. He did not say 'all' — for this is properly due to the empire of Christ —, although according to Symmachus one does not read: many nations and great kings shall serve him, but: many nations and great kings shall subject him to servitude, so that he himself too, whom all the nations had served before, serves the Medes and Persians. This, which we have set down from the Hebrew: I have given him, that they may serve him, and all the nations shall serve him and his son and his son's son, until the time of his land and of himself comes and many nations and great kings subject him to servitude, is not read, as we have already said, in the edition of the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
