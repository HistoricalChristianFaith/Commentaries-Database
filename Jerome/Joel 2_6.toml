[[commentary]]
quote='''
So great will the terror be that all the nations round about will shudder both in mind and in body, or rather will be tormented; and from the greatness of their dread the faces of all will be turned into the likeness of a pot, which, burned by the fire, shows the blackness and soot of a foul appearance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
So great will be the fear of all, so great the consciousness of sins, that no one will shine or have the splendor of joy, but like a scorched pot his face will be turned into darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
