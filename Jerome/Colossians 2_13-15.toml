[[commentary]]
quote='''
For he bore our sins in his body (1 Pet 2), fastening them to the wood of the cross, that he might blot out the handwriting which we had made to the devil and his angels, written by the hands of the soul, that is, by its works. Of these the apostle Paul speaks: And you, when you were dead in sins and in the desires of the flesh, he made alive with Christ, forgiving us all sins. And blotting out the handwriting that was against us, which was contrary to us, he took it out of the way, fastening it to the cross: despoiling the principalities, he put the powers to shame, triumphing over them confidently (Eph 1:2; Col 2:14, 15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
