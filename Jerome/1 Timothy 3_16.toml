[[commentary]]
quote='''
He appeared in the flesh, was justified in the spirit. Of him Judas the traitor too confesses: I have sinned, betraying righteous blood (Matt 27:4). And Pilate's wife: Have nothing to do with that righteous man: for I have suffered many things today in dreams because of him. And it is to be noted that he was not justified so that from being unrighteous he might become righteous; but the righteous one is justified, not so that he might begin to be what he was not, but so that what he was might appear to all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
