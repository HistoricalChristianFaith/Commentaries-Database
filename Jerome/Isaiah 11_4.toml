[[commentary]]
quote='''
But he judged in righteousness the poor in spirit, whose is the kingdom of God; and he reproved with equity the meek and humble of the earth, saying to the Apostles: Are you also still without understanding? And again: Do you not yet know nor understand? And to Peter in particular: O you of little faith, why did you doubt (Mark 8:17)? Or certainly, on behalf of the humble and meek he reproved others, who were trying to oppress them (Matt 14:31). He also struck all earthly works with the rod, or, as the Seventy translated, with the word of his mouth, saying in the Gospel: Do not think that I have come to send peace upon the earth: for I have not come to send peace, but a sword. And with the spirit of his lips he shall slay the wicked (Matt 10:34; Luke 12:51): of whom we read in Psalm 9: You have rebuked the nations, and the wicked has perished: you have blotted out their name for ever and for ever and ever (Ps 9:6). And Paul the Apostle writes: Whom the Lord Jesus will slay with the spirit of his mouth (2 Thess 2:8; Eph 6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
