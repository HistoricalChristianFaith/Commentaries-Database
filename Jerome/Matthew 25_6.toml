[[commentary]]
quote='''
The Jews have a tradition that Christ will come at midnight, in like manner as in that visitation of Egypt, when the Paschal feast is celebrated, and the destroyer comes, and the Lord passes over our dwellings, and the door posts of each man's countenance are hallowed by the blood of the Lamb. Hence, I suppose, has continued among us that apostolic tradition, that on the vigil of Easter the people should not be dismissed before midnight, in expectation of Christ's coming; but when that hour has past over, they may celebrate the feast in security; whence also the Psalmist says, At midnight did I rise to praise thee. (Ps. 119:62.)

Suddenly thus, as on a stormy night, and when all think themselves secure, at the hour when sleep is the deepest, the coming of Christ shall be proclaimed by the shout of Angels, and the trumpets of the Powers that go before Him. This is meant when it says, Lo, the bridegroom cometh, go ye out to meet him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But at midnight a cry arose: Behold, the bridegroom comes; go out to meet him. For suddenly, as in the dead of night, when all are unconcerned and sleep is at its heaviest, the coming of Christ will resound through the cry of the angels and the trumpets of the powers that go before him. Let us say something that may perhaps be useful to the reader. It is a tradition of the Jews that Christ will come at midnight, after the likeness of the time in Egypt, when the Passover was celebrated and the destroyer came and the Lord passed over the tents and the doorposts of our foreheads were consecrated with the blood of the lamb. Hence I think the apostolic tradition too has persisted, that on the day of the vigil of the Passover it is not permitted to dismiss the people, who are awaiting the coming of Christ, before the middle of the night; and that after that time has passed, confidence being presumed, all keep the day as a feast. Hence the psalmist too said: At midnight I rose to give thanks to you over the judgments of your justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
