[[commentary]]
quote='''
"That they might place their hope in God." That they might now no longer believe in idols, but believe in God. "And not forget the works of God." That they might see the order of creation, and from the creation understand the Creator. "And seek out his commandments." Let them not despise them like the Jews, but seek them out like Christians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
