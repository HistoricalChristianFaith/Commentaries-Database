[[commentary]]
quote='''
For thus says the Lord: As I have brought upon this people all this great evil, so I will bring upon them all the good that I speak to them. And fields shall be possessed in this land, of which you say that it is desolate because neither man nor beast has remained, and that it has been given into the hand of the Chaldeans. Fields shall be bought with money and shall be written in a book, a seal shall be impressed, and a witness shall be called in the land of Benjamin and round about Jerusalem, in the cities of Judah and in the cities of the hill country and in the cities of the plain — or sephela — and in the cities of the nageb — that is: which are toward the south —, because I will turn their captivity, says the Lord. Although according to the letter these things went before in type after the return from the Chaldeans, when at the command of King Cyrus the people returned to Judea, yet spiritually they are fulfilled more truly and more fully in Christ and in the apostles. Then both men and beasts were brought back into the Church, according to what is written: men and beasts you will save, O Lord, all who are rational and all who are simple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
