
[[commentary]]
quote='''
So when the prophet asks what the things he saw meant to signify, the angel who spoke in him answers, and relates that they are the four winds of heaven, that is, the four quarters of the world, which the Greeks call κλίματα, which stand by and obey the will of the Lord. For these four kingdoms of which we have spoken did nothing apart from the will of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
