[[commentary]]
quote='''
And our Lord, when he was on earth, did not exalt us. Someone may say: You speak rashly, since he himself says in the Gospel: "When I have been lifted up, I will draw all things to myself." See what he says: When I have been lifted up into the heavens, then I will draw all things to myself. This sense is indeed pious, but I understand something else. When I have been lifted up, when I have been crucified, then I will draw all to myself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_034.html'
source_title="Homily 34, on Psalm 107"
