[[commentary]]
quote='''
And handed over to Babylonian slavery, she will by no means be able to celebrate the three solemnities of Passover and Pentecost and Tabernacles, nor to keep the joy of the new moon, that is, of the calends, nor of the sabbath, nor all the festivals, which he comprises under one name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
