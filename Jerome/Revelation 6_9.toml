[[commentary]]
quote='''
John in the Apocalypse saw the altar of the Lord, beneath which were the souls of the righteous. For he says thus: "I saw beneath the altar of the Lord the souls of those slain for the word of the Lord and the testimony of Jesus." They were beneath the altar of God, because they had been offered up in martyrdom for Christ; for the victim of the Lord and Savior deserved to be beneath the altar in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_063.html'
source_title="Homily 63, on Psalm 83 (Alternate Series)"
