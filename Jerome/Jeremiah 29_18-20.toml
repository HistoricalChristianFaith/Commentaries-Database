[[commentary]]
quote='''
'And I will pursue,' he says, 'them, who now dwell in the city of Jerusalem, with sword, famine and pestilence, so that, first by the siege, and then at once, those who have been able to remain and escape may be scattered into all lands and be an example of curse, astonishment and hissing and reproach to all among whom I shall cast them out, because they did not hear my words, says the Lord, which I spoke to them through my servants, rising up by night and sending, and I never ceased admonishing them to imitate you, who now in exile enjoy a secure leisure until the Lord's promise is fulfilled. But you, who obeyed my sentence and handed yourselves over to the Babylonian king, hear what I am about to say'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
