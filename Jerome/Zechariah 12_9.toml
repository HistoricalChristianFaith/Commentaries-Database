[[commentary]]
quote='''
And it shall be on that day: I will seek to crush all the nations that come against Jerusalem. And I will pour out upon the house of David and upon the inhabitants of Jerusalem the spirit of grace and of prayers. LXX: And it shall be on that day: I will seek to take away all the nations that come against Jerusalem; and I will pour out upon the house of David and upon the inhabitants of Jerusalem the spirit of grace and of mercy. On that day when the Lord shall shield the inhabitants of Jerusalem, the Lord will seek to crush all the nations that come against Jerusalem. But he will crush them not unto perdition but unto amendment, so that they may cease to wage war against Jerusalem and begin to be of Jerusalem. For if he created all things out of nothing, he did not make them in order to destroy what he had created, but so that the things that were created might be saved by his mercy. Hence also in the Wisdom that bears the name of Solomon — if, however, anyone is pleased to accept the book — we find it written: He created all things that they might be, and the generations of the world are healthful; and there shall be no deadly poison in them. For just as the Lord came to seek what had perished, and saved the human race, so too he destroyed the nations in this respect, that they were hostile nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
