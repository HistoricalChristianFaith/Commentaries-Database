[[commentary]]
quote='''
They also clap with their hands to the voice and sound of the instruments, so that all their works look for pleasure, and they do nothing except what they provide for the belly and for lust. Nor let the prudent reader at once object to us this, and how it is written: Let the rivers clap with their hands, and: All nations, clap your hands, and: Shout for joy to God our helper. For there they are said to clap not to the sound of instruments, but to have one accord in the praise of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
