[[commentary]]
quote='''
And lest we should think there is one court toward the southern part, it is said of a second court: And the gate of the inner court on the southern way; and he measured from gate to gate on the southern way a hundred cubits, so that after the mysteries of the week and of the old Testament he might come to the good land and to the grace of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
