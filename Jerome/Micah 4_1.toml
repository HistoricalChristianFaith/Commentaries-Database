[[commentary]]
quote='''
And it shall be in the last of days, there shall be the mountain of the house of the Lord, prepared on the top of the mountains, and lofty above the hills; and peoples shall flow to it; and many nations shall hasten, and they shall say: Come, let us go up to the mountain of the Lord, and to the house of the God of Jacob, and he will teach us of his ways, and we will walk in his paths, for out of Zion shall go forth the law, and the word of the Lord from Jerusalem; and he shall judge among many peoples, and rebuke strong nations even afar off; and they shall beat their swords into plowshares, and their spears into mattocks; nation shall not take up sword against nation, and they shall not learn to make war any more; and a man shall sit under his vine and under his fig tree, and there shall be none to make him afraid, for the mouth of the Lord of hosts has spoken; for all peoples shall walk, each in the name of his god; but we will walk in the name of the Lord our God forever and beyond. In that day, says the Lord, I will gather her that halts, and her whom I had cast out I will gather, and her whom I had afflicted; and I will make her that halts a remnant, and her that had labored a mighty nation, and the Lord shall reign over them in Mount Zion from this time forth and even forever. LXX: And it shall be in the last of days, the mountain of the Lord manifest, prepared upon the top of the mountains; and it shall be lifted up above the hills, and peoples shall hasten to it, and many nations shall go and say: Come, let us go up to the mountain of the Lord and to the house of the God of Jacob, and he will show us his way, and we will walk in his paths; for out of Zion shall go forth the law, and the word of the Lord from Jerusalem, and he shall judge among many peoples, and reprove strong nations even afar off, and they shall beat their swords into plows and their spears into sickles; and nation shall no more take up sword against nation, and they shall by no means learn to make war; and each shall rest under his vine, and each under his fig tree, and there shall be none to make him afraid, for the mouth of the Lord Almighty has spoken these things; for all peoples shall go, each his own way. But we will go in the name of the Lord our God forever and beyond. In that day, says the Lord, I will gather her that is crushed, and her that had been cast out I will receive, and those whom I had driven back; and I will make the crushed one a remnant, and the one driven back a strong nation, and the Lord shall reign over them in Mount Zion, from this time forth and even unto the age. Because the princes of the Jews abhorred judgment, and had perverted all that was right, and had built Zion with blood and Jerusalem with iniquity, and had not only done these things but had also judged for bribes, and the priests of Jerusalem had given answers for hire, and her prophets had divined for money, and on their account Zion had become like a plowed field, and Jerusalem had fallen into heaps of stones, and the mountain of the temple of God, made desolate, into the high places of the forests: therefore now, their house being forsaken and deserted, when the Son of God, going out of the temple, said: Arise, let us go hence, and: Your house shall be left to you deserted. The angels too, as Josephus relates, said: Let us pass over from these seats, and in place of Mount Zion the mountain of the Lord has been lifted up, of which it is said to the prince of Tyre. And you were wounded on the mountain of the Lord. But this mountain of the Lord was shown in the last of days, when the kingdom of heaven drew near. For indeed at the consummation of the ages, for the rejection of sins, our Savior appeared through his own victim, and came at the eleventh hour to hire laborers. And when his passion was accomplished, John says: It is the last hour; for in six thousand years, if five hundred years are allotted to each hour of the day, the time of the faith of the Gentiles will consequently be called the last hour. And manifest, he says, shall be the mountain of the Lord, prepared upon the tops of the mountains. He will be manifest who before had been hidden, and prepared not only on the mountains but upon the tops of the mountains, Moses and the prophets, who prophesied of him. For although all that they wrote is holy, yet in comparison with the prophecy in which they prophesied of the coming of the Savior, the rest is lowly, and by no means reaches up to the tops of the mountains. And it shall be exalted, he says, above the hills. He appeared indeed as a man, and took the form of a servant, humbled even unto death, and the death of the cross; but the Father exalted him, and gave him the name which is above every name; and the whole life of men, compared with his manner of life, is called plains and valleys. To this mountain, therefore, which is prepared upon the tops of the mountains and exalted above the hills, all peoples shall hasten, or, as it stands in the Hebrew, shall flow; that is, innumerable crowds shall gather after the manner of rivers. Now the peoples shall hasten when there believed in him alike Parthians and Medes, Elamites, and dwellers in Mesopotamia, Judea and Cappadocia, Pontus and Asia, Phrygia and Pamphylia, Egypt and the parts of Libya which is near Cyrene, and visitors from Rome, Jews and proselytes, Cretans and Arabians. Do not those seem to you to have hastened to the mountain to whom it was said: Follow me, and I will make you fishers of men; and at once they followed the Savior? And again Scripture relates of James and John that, leaving the boat and their father and the waves of the world, they hastened to the mountain. And Matthew the publican, on hearing: Follow me, at once ran. That passage too in the Gospel, when great crowds followed him from Galilee and the Decapolis and Jerusalem, and Judea and beyond the Jordan, and he healed them, proves that the peoples were hastening.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
