[[commentary]]
quote='''
Furthermore, even if you live many years and have all good things, or have performed good works, and know that you are always on the point of dying, and the coming of darkness is always before your eyes: you will despise present things as fleeting, fragile and perishable. Symmachus rendered the end of this sentence thus: If a man lives many years and has been glad in all of them, he ought to remember also the days of darkness, for they will be many, in all of which there will come a ceasing to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
