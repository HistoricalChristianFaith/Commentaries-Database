[[commentary]]
quote='''
"Peter, and John, and James, who seemed to be pillars" (Acts 10, 13, 17). Three times above we read concerning the apostles: "But privately to those who seemed." And: "By those who seemed to be something." And: "For those who seemed to be something conferred nothing on me." And so I was anxiously asking what it might be that he meant by "those who seemed"; but now he has freed me from every scruple by adding, who seemed to be pillars. The apostles, therefore, are the pillars of the Church, and especially Peter, James and John, two of whom were found worthy to go up the mountain with the Lord, and one of whom in the Apocalypse introduces the Savior speaking: "Whoever conquers, I will make him a pillar in the temple of my God" (Rev. 3:12), teaching that all believers who conquer the adversary can become pillars of the Church. And Paul, writing to Timothy, says: "That you may know how you ought to conduct yourself in the house of God, which is the Church of the living God, the pillar and foundation of the truth" (1 Tim. 3:15). By these and other passages we are instructed that in the Scriptures the apostles and all believers, as well as the Church itself, are called a pillar, and that it makes no difference whether something is said of the body or of the members, since the body too is divided into members, and the members belong to the body. So Peter and James and John, who seemed to be pillars, gave to Paul and Barnabas the right hands of fellowship; but to Titus, who was with them, they did not give their right hands. For he had not yet come to such a measure that the merchandise of Christ could be entrusted to him on equal terms with his elders, and that he could hold the same place in the trade that Barnabas held, and Paul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
