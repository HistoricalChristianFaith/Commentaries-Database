[[commentary]]
quote='''
The word that came to Jeremiah from the Lord in the tenth year of Zedekiah, king of Judah; that is the eighteenth year of Nebuchadnezzar. Then the army of the king of Babylon was besieging Jerusalem, and Jeremiah the prophet was shut up in the court of the prison, which was in the house of the king of Judah. For Zedekiah, king of Judah, had shut him up, saying: Why do you prophesy, saying: Thus says the Lord? Not only the words but also the deeds of the prophets are an example to us for virtue. Jeremiah could have announced prosperity and enjoyed the friendship of King Zedekiah, but he preferred to obey God rather than men, and him who can kill both soul and body in Gehenna rather than him who could have power only over the body. And this must be considered: it was the tenth year of Zedekiah's reign, Jerusalem was already besieged and consumed by sword, famine and pestilence, captivity was near, and yet Zedekiah persists in his opinion; and something of his clemency is shown in that he ordered him to be shut up not in the prison but in the vestibule of the prison, in free custody, that is, so that he could not escape, as though all Jerusalem, enclosed by its fortifications, were not a common prison for its inhabitants. That is the eighteenth year of the reign of Nebuchadnezzar, who began to rule in the fourth year of King Jehoiakim. And the whole cause of the king's anger is this: that he speaks in the name of the Lord the things that had been commanded him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
