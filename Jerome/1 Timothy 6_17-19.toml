[[commentary]]
quote='''
He also bears a brother's need who helps a poor man weighed down by the burden of want, and makes himself friends of the mammon of iniquity (Luke 16); and him Christ addresses after the resurrection: "Come to me, you blessed of my Father, possess the kingdom prepared for you from the foundation of the world. For I was hungry, and you gave me to eat; I was thirsty, and you gave me to drink" (Matt. 25:34, 35). In accordance with this sense Paul also, teaching Timothy in another Epistle, added: "Command the rich of this age not to be high-minded" (that is to say, "not to be proud"), "nor to hope in the uncertainty of riches, but in God, who furnishes all things abundantly for enjoyment; to do good, to be rich in good works, to give readily, to share, to lay up for themselves a good foundation for the future, that they may lay hold of the true life" (1 Tim. 6:17-19). Whoever has laid hold of the true life, that is, of him who says: "I am the life" (John 14:6), has fulfilled the law of Christ, which tends toward life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
