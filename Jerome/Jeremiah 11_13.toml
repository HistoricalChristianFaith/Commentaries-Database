[[commentary]]
quote='''
For according to the number of your cities were your gods, O Judah, and according to the number of the ways of Jerusalem you have set up altars of confusion for pouring libations to the Baals. Let us read the books of Kings and of Chronicles, and we shall find that Judah and Jerusalem did far worse things than Israel, so that as many cities as they had, so many kinds of idols they also had, and as many as were the streets and street-corners in the city of Jerusalem, so many altars they had, to their own confusion, on which they sacrificed victims to the idols of the Baals.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
