[[commentary]]
quote='''
For we too were once foolish, disobedient, erring, serving various desires and pleasures, living in malice and in envy, hateful, hating one another. But when the goodness and kindness of our Savior God shone forth, not from works of righteousness which we did, but according to his mercy he saved us, through the washing of regeneration and of the renewal of the Holy Spirit, whom he poured out upon us richly through Jesus Christ our Savior, that, justified by his grace, we may become heirs according to the hope of eternal life. Someone may ask how Paul was foolish, unbelieving, erring, and serving various desires and pleasures, in malice and in envy, hateful and hating, before the goodness and clemency of our Savior saved him through the washing of the second regeneration: not from the works of righteousness which he had done, but out of his mercy, the Holy Spirit having been poured out abundantly and generously upon the apostles and believers through Jesus Christ, so that, having obtained the inheritance of grace, they might possess the hope of life forever. And indeed we read that, according to the righteousness which is in the Law, he was without reproach, circumcised on the eighth day (Phil. 3:5): a Hebrew of the Hebrews, according to the Law a Pharisee, of the tribe of Benjamin, educated at the feet of Gamaliel, and instructed in the sacred Letters from infancy (Acts 22). To this the answer is that the Jews who were versed in the Law before the coming of the Savior and his passion and resurrection had righteousness, if not full, yet in some part: as Simeon too did, and Anna the prophetess, who was found serving in the temple of God. But after the people cried out together, "Crucify, crucify him; we have no king but Caesar" (John 19:15), and, "His blood be upon us and upon our children" (Matt. 27:25), and the kingdom of God was taken from them and given to a nation producing its fruits: from that time whoever did not believe in Christ was foolish, wandering, unbelieving, and serving various pleasures. Or does it not seem to us that Paul was foolish when he had a zeal for God, but not according to knowledge, and persecuted the Church, and kept the garments of those who were stoning Stephen? when he blazed up, goaded into such hatred against the Savior, that he received letters from the priests and went to Damascus to bind those who had believed in Christ? Or could he have any virtues without the power of God, Christ Jesus, or quench the raging flame of pleasures, when he was not a temple of God? And what greater malice and envy can there be than to take up letters against people who are absent, and everywhere to lay waste the disciples of Christ; to be unwilling to be saved oneself, and to envy others who could be saved; to hate Christians and consequently to earn the hatred of all? And what greater error, and disobedience, and madness is there than, after the day has breathed and the shadows have passed away, to wish to keep the abolished Law and to say, "Do not handle, do not touch, do not taste", and, when solid and manly food has appeared, to desire to be given the milk of infancy to drink?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
Others understand this place in such a way as to think it said not of Paul and the apostles, but, under the person of the apostles, of others: so that, just as he spoke in his own person and in that of Apollos and of Cephas about the dissension and schism which he was rebuking among the Corinthians, so also in the present place, naming himself and the apostles, he showed what all who had believed in Christ were like before the regeneration of the life-giving washing. At the same time his humility too is to be admired: that he who despised all the humility and righteousness of the Law as refuse and offscourings rightly recalls that without Christ he had served all vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
