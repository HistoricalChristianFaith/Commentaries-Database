[[commentary]]
quote='''
And I said: alas, alas, alas, Lord God — for which the Seventy translated: O Lord God —, have you then deceived this people and Jerusalem, saying: you shall have peace? And behold, the sword has reached even to the soul. Because he had said above: at that time they shall call Jerusalem the throne of God, and all the nations shall be gathered to it in the name of the Lord in Jerusalem, and now he says: the heart of the king shall perish, and the heart of the princes, and the priests shall be astounded, and the prophets shall be dismayed, the prophet is troubled and thinks that God has lied to him, and does not understand that the former was promised for long ages after, while this would come about in the near time, in accordance with which the Apostle too says: has God rejected his people? Far from it. And the sword reaches even to the soul when nothing living is left in the soul. At the same time he shows this too: that unless the sword goes before, to cut away and purge the vices of the soul, peace and the promise do not follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
