[[commentary]]
quote='''
Is it not so, sons of Israel, says the Lord.

And you will give the Nazirites wine to drink, and you were commanding the prophets, saying: Do not prophesy. LXX: likewise. While I was bestowing such great benefits on you, so as to kill your adversaries and hand their land over to you, and to choose prophets and Nazirites from your sons and young men and consecrate them to my worship. Can you say that I did not do these things, and deny my clemency toward you, through which you live?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
