[[commentary]]
quote='''
Out of the whole world he chose twelve apostles: out of the twelve one departed, eleven remained. The cross came, ten fled: one Peter remained, one with the One. And that one fled, and would that he had fled: and he denies. Therefore let us say, the whole human race perished. Since it had perished, therefore the Lord, being crucified, said: I have trodden the winepress alone, and of the nations there was not a man with me. At that time the psalm was fulfilled: Save me, O Lord, for the holy one has failed. There is none who does good, there is none, even to one. He who had promised, saying If it be necessary for me to die, or to go into prison, I will not deny you, denied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
