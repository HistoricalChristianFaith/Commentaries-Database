[[commentary]]
quote='''
What worthy thing shall I offer to the Lord? Shall I bend the knee to God most high? Shall I offer him burnt offerings, and yearling calves? Can the Lord be appeased with thousands of rams, or with many thousands of fat he-goats? Shall I give my firstborn for my crime, the fruit of my womb for the sin of my soul? LXX: With what shall I lay hold of the Lord? Shall I receive my God most high? Shall I lay hold of him with burnt offerings, with yearling calves? Will the Lord accept, with thousands of rams, or with ten thousands of fat he-goats? If I give my firstborn for impiety: the fruits of my womb for the sin of my soul. God had summoned the people to judgment; the people, knowing its sin, does not wish to contend, but to entreat, and yet even in its very prayers it has no confidence. For there is nothing worthy that can be offered to God for sin, and no humility can wash out the stains of offenses, because it is impossible for the blood of bulls and of calves, and burnt offerings full of marrow, and the gore of rams and of fat he-goats, to wash away the filth of the soul. Shall I, he says, give my firstborn for my crime, as the king of Moab is described as having done? Or the fruit of my womb for the sin of my soul, as Jephthah did, offering his daughter for the rashness of a vow? We, therefore, who are of the people of God, knowing that there shall not be justified in the sight of him anyone living, and saying: I have become a beast before you, repenting for our sins, hesitate and say: With what shall I lay hold of the Lord? Shall I receive my Lord most high? How shall I be able to hold him as he flees? With how great purity shall I be able to prepare a lodging for the Trinity? Or shall I lay hold of him with burnt offerings, so as to offer my whole self to him as a burnt offering, or with yearling calves, so that, leaving milk and coming to solid food, I may be made worthy of the acceptable year of the Lord? If I offer a thousand rams, if ten thousand he-goats, and, understanding them spiritually, display in myself all the victims of Leviticus, and a thousand fall at my side, and ten thousand at my left, yet I shall be able to give nothing worthy with which to lay hold of God or receive him. If I give my firstborn for impiety, and the fruit of my womb for the sin of my soul, I shall indeed give whatever is first in me, but for my sin and impiety I shall offer nothing worthy to God. Hence David also prays and says: Wash me more and more from my iniquity, and cleanse me from my sin. For I know my iniquities, and my offense is ever against me. For the sin of the soul blood alone is worthily offered, and the blood that is worthily offered is not that of calves, not of rams, not of he-goats, but one's own, as the prophet says and asks: What shall I render to the Lord for all that he has rendered to me? And afterwards answers: I will take the cup of salvation, and I will call upon the name of the Lord. Precious in the sight of the Lord is the death of his saints. Yet even this very blood we do not give, but give back. And what is there alike? When the Just One has died for sinners, the Son of God for men, shall we, sinners and men, die for the confession of his name?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
