[[commentary]]
quote='''
Concerning David too (although many judge that it was prophesied of our Lord, which we also do not deny), the Holy Spirit sings, as a type of the one to come: "Remember, O Lord, David, and all his gentleness" (Ps. 131:1). Whose gentleness shone forth more than all toward Saul, Absalom and Shimei (1 Sam. 24; 2 Sam. 15)? When the one wished to kill him; the other, plotting a revolution, strove to cheat him of his rule; the other, throwing stones at him and tossing up dust, shouted and said: "Go out, go out, you wicked man" (ibid., 16:7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
