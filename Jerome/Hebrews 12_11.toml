[[commentary]]
quote='''
Vengeance will fall upon these, who did not keep the Lord's charges, and say in their hearts: The Lord will not do good, and he will not do evil; not that God does evil, but that punishment seems evil to him who suffers it. Otherwise the physician's scalpel too will be evil, because it cuts open wounds and amputates putrid flesh; and a father will be evil when he beats his son to correct him from his vices, and a teacher evil when he rebukes his pupil to instruct him: For all discipline for the present seems to be not of joy, but of sorrow; but afterwards it will yield the peaceful fruit to those who have been trained by it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
