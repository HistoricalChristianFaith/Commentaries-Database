[[commentary]]
quote='''
For we, the living, know the Father, and the Son, and the Holy Spirit; but they, the dead, know nothing, nor do they await any promise and reward, but their memory is at an end. Neither do they themselves remember what they ought to have known, nor does the Lord any longer remember them. The love also with which they once loved God has perished, and the hatred of which they used to speak boldly: Did I not hate those who hate you, O Lord, and pine away over your enemies? And their zeal too, according to which Phinehas was zealous and the knees of Mattathias trembled. And it is plain that their portion too is not in the world. For they cannot say: The Lord is my portion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
