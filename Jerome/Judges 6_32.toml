[[commentary]]
quote='''
And where the Seventy put Jareb, we, following Symmachus, have translated "avenger"; for Aquila and Theodotion rendered "judge". That Jareb signifies avenger and judge, the name of Gideon shows: when the worshipers of Baal demanded him for punishment, because he had overthrown the grove and the altars of Baal, his father answered: Let Baal avenge himself, or let Baal judge him; and he was called, it says, Jerubbaal, that is: let Baal avenge himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
