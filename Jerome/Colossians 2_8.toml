[[commentary]]
quote='''
On the contrary, it can be objected to us that Paul the apostle, writing to the Colossians, has named other things the elements of the world: "See", he says, "that no one plunder you through philosophy and empty deceit, according to the tradition of men, according to the elements of the world, and not according to Christ" (Col. 2:8). But from what he added, "according to the tradition of men, and empty deceit", he shows that the same elements are not named to the Colossians and to the Galatians. For from these elements, after the fullness of time has come, we are redeemed, and, advancing to greater things, we receive the adoption of sons. But of those nothing of the kind is said as something that follows; rather, the elements are taken simply for letters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
