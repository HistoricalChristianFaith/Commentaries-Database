[[commentary]]
quote='''
Praise and rejoice, daughter of Zion, for behold, I come, and I will dwell in the midst of you, says the Lord. And many nations shall be joined to the Lord on that day, and they shall be my people, and I will dwell in the midst of you, and you shall know that the Lord of hosts has sent me to you. And the Lord shall possess Judah as his portion in the sanctified land, and he shall yet choose Jerusalem. LXX: Rejoice and be glad, daughter of Zion, for behold, I will come, and I will dwell in the midst of you, says the Lord. And many nations shall flee for refuge to the Lord on that day, and they shall be his people, and they shall dwell in the midst of you, and you shall know that the Lord Almighty has sent me to you, and the Lord shall possess Judah as his portion in the holy land, and he shall yet choose Jerusalem. These words too are to be understood as spoken in the person of the Lord: that he exhorts his people, restored from captivity to its former seat, to be glad and rejoice because the Lord himself is coming and will dwell in its midst; and that many nations are to believe in him, of whom it is said: Ask of me, and I will give you the nations as your inheritance, and the ends of the earth as your possession; and that he dwells in its midst, saying to the disciples: Behold, I am with you all days, even to the consummation of the age; and that the Lord possesses Judah as his portion, Judah that confesses and believes in his name, and possesses it nowhere else than in the holy land, which is interpreted as the Church; and that he yet chooses Jerusalem, which he had abandoned to temptation in the persecutions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
