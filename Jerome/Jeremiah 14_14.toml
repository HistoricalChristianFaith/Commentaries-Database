[[commentary]]
quote='''
Since, then, the prophets, nay rather the false prophets, promised false things, the Lord therefore spoke through Jeremiah: 'Do not listen to the words of the false prophets, who were not sent by me but came of their own will! Hence they are by no means to be called prophets but diviners, they who speak seduction to the people'. For it is much better to amend sins through fear of punishments than, through hope of prosperity, to fall under the divine sentence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
