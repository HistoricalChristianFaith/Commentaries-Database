[[commentary]]
quote='''
The vanity of the mind and the darkness of the mind are divided in two ways: into the business of this age, and into worldly wisdom: when we are either held fast in the things that belong to this world and quickly pass away, or come to know things that will be of no profit. Does it not seem to you that he walks in the vanity of mind and darkness of mind who is tormented day and night in the art of dialectic; who, as a searcher of nature, lifts his eyes beyond heaven, and plunges beyond the depth of the earth and of the abyss into a kind of void; who builds an iambus; who studiously sorts out and heaps up in his heart so great a forest of meters; and (to pass over the other part) who seeks riches by fair means and foul; who flatters kings, hunts for other men's inheritances, and gathers wealth without knowing to whom he will leave it in a moment?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Let those who introduce different natures know that the Gentiles walk in the vanity of their mind with darkened minds for this reason: because they have given themselves over to ignorance and blindness. For no one is called ignorant and blind except one who is able to know and to see. Nor do we say that a stone is blind, or that a brute animal is ignorant: because it is not required of it, nor is it of its nature, that it should know and see. But if it was in the nature of the Gentiles to understand and see the life of God, then it is not the differing nature of the earthy and the spiritual, but the will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
