[[commentary]]
quote='''
For the fool will speak foolish things, for which in the Hebrew it is written: NABAL NABALA IDABBER (נבל נבלה ידבר). We say this in order to explain the words of Abigail, who says of Nabal the Carmelite: According to his name he is foolish (1 Sam 25:25).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
