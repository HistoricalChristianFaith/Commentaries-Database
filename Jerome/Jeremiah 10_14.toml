[[commentary]]
quote='''
The psalmist writes, "Such knowledge is too wonderful for me. It is high; I cannot attain unto it." In another: "When I thought how I might know this, it was too painful for me until I went into the sanctuary of God and considered their latter end." And later in the same psalm, "I was as a beast before you; nevertheless I am continually with you." And Jeremiah says, "Every person is become brutish and without knowledge."
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.15"

[[commentary]]
quote='''
Every man has become foolish from knowledge. Though it be Paul, though Peter, though Moses and Abraham, in comparison with God all their wisdom will be counted as nothing; whence also the foolishness of God is wiser than men. Every craftsman is confounded in his carved image, he who has fashioned images out of his own heart, and what he has cast is false. But if every man is foolish from knowledge, everything that he has made is foolish and false. And there is no spirit in them. It should be noted that in this passage too 'wind' and 'spirit' are called by one name among the Hebrews, 'ruha'; but he means the spirit of sanctification, which cannot be found in the minds of heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
