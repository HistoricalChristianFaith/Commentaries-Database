[[commentary]]
quote='''
On that day the Lord shall shield the inhabitants of Jerusalem, and he who has stumbled among them on that day shall be as David. And the house of David as God, as the angel of the Lord in their sight. LXX: And it shall be on that day, the Lord shall shield the inhabitants of Jerusalem; and he who is weak among them on that day shall be as the house of David; and the house of David as the house of God, and the angel of the Lord in their sight. When Judah obtains the victory, and the Lord restores its tents as they had been from the beginning, so that the royal house may in no way glory against the people, on that day and at that time the Lord — by whose help Judah shall devour its adversaries on the right and on the left — shall shield also the besieged of Jerusalem, and all things shall be changed into such great happiness and blessedness that he who was thought the most worthless shall be as the royal house; and he who was of the royal house shall be as of the house of God, that is, as a messenger of the Lord and of angelic dignity in the sight of those who shall have been saved again at that time. According to anagogy: the Lord shall shield the inhabitants of the Church, when the peace of the churches has been restored after a most grievous persecution, when she shall also be adorned by the interpretation of her own name. For Jerusalem is rendered as vision of peace. And those who have fought as soldiers for the Church and have confessed the Lord in persecution shall be so blessed that he who was least, and who, as a man, has stumbled in some sin and word, shall be placed in the rank of the teachers; and the teachers who have kept their own station shall be as the house of God and as the angel of the Lord, because this is what we labor for with all zeal, set on earth and sweating in varied toil: that we may be transformed into angelic glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
