[[commentary]]
quote='''
The same thing is signified also by that daughter of Abraham in the Gospel, a noble soul, whom Satan had bound and bent over, and who could not be raised up on high before the coming of the Lord, nor look up at her Creator. Hence the Savior says: This woman, he says, a daughter of Abraham, whom Satan had bound, ought she not to have been loosed from this bond on the sabbath day?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
