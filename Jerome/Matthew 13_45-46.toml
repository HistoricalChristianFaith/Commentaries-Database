[[commentary]]
quote='''
We must not pass over without scruple that the Apostle prayed for some that grace and peace might be multiplied to them, whereas now, to Titus, peace and grace are set down without multiplication. Noah, a just man, alone preserved when the world was shipwrecked, is said to have found not many graces but one grace in the sight of God. And Moses to the Lord: "If I have found," he says, "grace with you" (Exod. 33:13). And wherever else grace is set down in the person of the saints, seek and you will find that they found not graces, but grace. That merchant in the Gospel who had many pearls at last found one precious one, which alone he bought with the many pearls (Matt. 13). For it belongs to the perfect to buy one pearl and one treasure in exchange for all their pearls and their whole substance; but to beginners, and those still set upon the road, to have not just one and only one, but many pearls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
