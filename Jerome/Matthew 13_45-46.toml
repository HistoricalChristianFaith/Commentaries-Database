[[commentary]]
quote='''
We must not pass over without scruple that the Apostle prayed for some that grace and peace might be multiplied to them, whereas now, to Titus, peace and grace are set down without multiplication. Noah, a just man, alone preserved when the world was shipwrecked, is said to have found not many graces but one grace in the sight of God. And Moses to the Lord: "If I have found," he says, "grace with you" (Exod. 33:13). And wherever else grace is set down in the person of the saints, seek and you will find that they found not graces, but grace. That merchant in the Gospel who had many pearls at last found one precious one, which alone he bought with the many pearls (Matt. 13). For it belongs to the perfect to buy one pearl and one treasure in exchange for all their pearls and their whole substance; but to beginners, and those still set upon the road, to have not just one and only one, but many pearls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
Again, the kingdom of heaven is like a merchant man seeking good pearls; and having found one most precious pearl, he went away and sold all that he had and bought it. The same thing as is said above, in other words. The good pearls that the instructor seeks are the Law and the Prophets. Hear, Marcion; hear, Manichee: the good pearls are the Law and the Prophets and the knowledge of the Old Testament, but the one most precious pearl is the knowledge of the Savior and the mystery of his passion and the secret of his resurrection. When the merchant man, like the apostle Paul, has found it, he despises all the mysteries of the Law and the Prophets and the former observances in which he had lived blamelessly, as refuse and rubbish, so that he may gain Christ. Not that the finding of a new pearl is the condemnation of the old pearls, but that in comparison with it every other gem is of less worth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
