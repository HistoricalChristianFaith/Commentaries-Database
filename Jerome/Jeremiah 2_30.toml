[[commentary]]
quote='''
In vain have I struck your sons; they did not receive discipline, for which the Seventy set down: you did not receive. And the sense in the Hebrew is: 'They themselves, who were struck, were unwilling to receive discipline,' but in the Seventy: 'I struck your sons for this reason, that by their death you might be instructed. And lest perhaps you should say: You were unwilling to correct us when we sinned, learn from the blows dealt your sons that I desired to cure you with a harsher remedy.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Your sword has devoured your prophets. 'Not my prophets but yours, and by no means my sword but yours, has devoured them, the sword which you suffered for your sins'. But the Seventy do not have 'your', but translated simply: the sword has devoured your prophets, 'so that it may be shown to be either the enemy's sword or my sword, by which I have pierced your sins.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
