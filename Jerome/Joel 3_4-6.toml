[[commentary]]
quote='''
They refer this against Tyre and Sidon so as to maintain that the vengeance for the blood of Christ and the overthrow of Jerusalem, which happened by the judgment of God, happened of itself. But let us, following the tropology we have begun, interpret Tyre and Sidon and the Philistines as those who hem in and afflict and persecute the people of God — for this is what Tyre sounds in our language —, and hunt him to death, which the name of Sidon indicates, and, drinking blood, fall down, or wallow in the mire, which is what the Philistines and Galilee signify. Swiftly and quickly the Lord will repay them what they deserve, because they have persecuted him. And his silver and gold, namely the words of the Scriptures, and the νοήματα, that is, the meanings, and everything that was beautiful in the Church, they have made the slaves of their errors. The heretic, whomever he has deceived and made to worship his own images, sells the sons of Judah and the sons of Jerusalem to the Greeks, or Gentiles, and makes them from Christians into heathens, to banish them from their borders, in which they had been begotten in Christ, so that they dwell no longer in Judea and in the confession of the truth, but in the error of the Gentiles. All these things we can also refer to the day of judgment, the vengeance not differing, although in time they seem to differ from the things above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
