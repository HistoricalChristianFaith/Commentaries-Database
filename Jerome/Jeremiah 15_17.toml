[[commentary]]
quote='''
Jeremiah was in captivity; but there were also many multitudes. And what does he say? I sat alone, because I was filled with bitterness. How were you alone in the city? But therefore alone, because I had no companion of my purpose.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
