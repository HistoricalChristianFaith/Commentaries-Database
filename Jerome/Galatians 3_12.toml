[[commentary]]
quote='''
But in what he says, The Law is not of faith, but he who has done these things shall live in them, it is most manifestly shown that it is not life simply that is meant, but that life which is referred to something. For the righteous lives by faith: and there is not added "in these" or "in them". But he who lives in the Law, who has done these things, lives in them, that is, in the things which he did, which he thought good: having as the reward of his labor only those works which he did, whether length of life (as the Jews think) or escape from the penalty by which the transgressor of the Law is put to death. But let us not think that to live in them are the words of the Apostle, but of the prophet Ezekiel, who says: "And I led them out into the desert, and I gave them my precepts, and showed them my ordinances, which a man shall do, and shall live in them" (Ezek. 20:10, 11). And when he had said that those who had walked in the precepts and ordinances live, he added: "And I gave them precepts not good, and ordinances in which they should not live in them" (ibid., 25). How much care in the words! Where he said: "I gave them precepts and ordinances in which they should live in them", he did not add "good". But where he put "in which they should not live in them", he added: "And I gave them precepts not good, and ordinances in which they shall not live in them". But these things more fully in Ezekiel: now let us return to the order of the Epistle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
