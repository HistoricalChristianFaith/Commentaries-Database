[[commentary]]
quote='''
And this Samaria of such a kind will lament and mourn for this reason: because, wounded by the arrow of the Lord and receiving the wound of the word, she will recognize her error. And not only did she herself sin, but she also wished to bring her iniquity and her error into the gates of Judah. Hence it is said of her: It has come even to Judah, and has touched even to the gates of my people, even to Jerusalem. She touched the gates, he says, by which we understand the ears. But she could not enter the middle of the city; for if she had entered, she would have made Jerusalem a Samaria. Whenever we see some in the Church scandalized at the discourses of the heretics, and asking how to answer their questions, and yet not withdrawing from the Church, let us say: Samaria, or the wound of Samaria, has come even to the confessing people, even to the ears of the people of God, and even to the ears of Jerusalem. For what is said, it has touched even to the gates of my people, is to be understood ἀπὸ κοινοῦ (in common), so that this is understood as well: it has touched even to the gates of Jerusalem. Thus far against Samaria and against Jerusalem; let us look also at the rest that follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
