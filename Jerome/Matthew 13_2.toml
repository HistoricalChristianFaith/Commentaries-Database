[[commentary]]
quote='''
Jesus is in the midst of the waves; He is beaten to and fro by the waves, and, secure in His majesty, causes His vessel to come nigh the land, that the people not being in danger, not being surrounded by temptations which they could not endure, might stand on the shore with a firm step, to hear what was said.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So that, going up into a little boat, he sat, and the whole crowd stood on the shore. Jesus is in the midst of the waves; he is beaten by the sea on this side and on that, and, secure in his majesty, he makes his little boat draw near to the land; but the people, in no way enduring danger nor surrounded by temptations which they could not bear, stand on the shore with a fixed step to hear what is said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
