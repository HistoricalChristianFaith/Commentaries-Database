[[commentary]]
quote='''
I have heard what the prophets said who prophesy a lie in my name and say: I have dreamed, I have dreamed — or I have seen a dream —. How long is this in the heart of the prophets who prophesy a lie and prophesy the seductions — or the wishes — of their own heart? Who wish — or think — to make my people forget my name because of their dreams, which each one tells to his neighbor, as their fathers forgot my name because of Baal or in Baal. Since the preceding title is against the prophets or to the prophets, whom we clearly understand to be false prophets — and there are many kinds of prophesying, one of which is by dreams, such as was in Daniel —, therefore the prophetic discourse is directed also at those who believe in dreams and think that all they see is divine revelation, which is properly opened to the saints and servants of God. And if we read that Pharaoh and Nebuchadnezzar, ungodly kings, saw dreams which were true, it was not of the merit of those who saw them, but so that on their occasion the holy men Joseph and Daniel might become renowned, and the hard and untamable hearts of the tyrants might feel the majesty of the Lord by their own conscience. There are even today dreamers in the Church, and especially in our flock, who vaunt their errors as the prophecy of the Lord and frequently thrust upon us: I have dreamed, I have dreamed; whom the Lord rebukes, saying: 'How long is this in the heart of the prophets who prophesy a lie and prophesy the seductions of their own heart? And they do this in order that, as the ancient people which went out of Egypt forgot the name of God, so their descendants too may forget me'. But prophesying of this kind is not in the name of the Lord, but in the name of Baal, which is properly the idol of the Sidonians, or the Babylonian one, and is called by a kindred name Bel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
