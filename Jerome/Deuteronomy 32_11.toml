[[commentary]]
quote='''
Like an eagle, the Lord spreads his wings over us, his nestlings. There the Lord is compared with the eagle guarding its young. The simile therefore is appropriate that God protects us as a father and as a hen guarding her chicks lest they be snatched away by a hawk. Nevertheless a different interpretation is also permissible. "With his pinions he will cover you": he will be lifted up on the cross; he will stretch forth his hands to shelter us. "And under his wings you shall take refuge."
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 20"


[[commentary]]
quote='''
The song in Deuteronomy says that he bore the people of Israel upon his shoulders and like the eagle guarded them. This same versicle may be interpreted also of the Savior because on the cross he gave us the shelter of his wings. "Under his wings you shall take refuge." "All the day long I stretched out my hand to a people unbelieving and contradicting." The hands of the Lord lifted up to heaven were not begging for help but were sheltering us, his miserable creatures. 
'''
source_url=''
source_title="Homily 68"

[[commentary]]
quote='''
And Deuteronomy, in which something of the kind resounds: As the eagle protects her nest, and has longed for her young: spreading her wings, she has taken them up and carried them on her shoulders (Deut 32:11). Those who have written on the natures of living creatures say that in all wild beasts, beasts of burden, cattle and birds there is an inborn affection toward their offspring and young, but that the love of eagles is the greatest, which place their nests in high and inaccessible places, lest a snake harm the brood. And that an amethyst stone is found among its young, by which all poisons are overcome. If this is true, the affection of God toward his creatures is rightly compared to eagles, who protects his children with every guard, lest the dragon and ancient snake, the devil and Satan, creep up on the new brood, so that at the name of the stone which is laid in the foundations of Zion all the snares of the adversaries may be broken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
