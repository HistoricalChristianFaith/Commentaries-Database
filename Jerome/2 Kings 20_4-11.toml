[[commentary]]
quote='''
Here, as in a prophecy, the history is related in reversed order, which in the volume of Kings is read in better sequence. While Hezekiah was weeping with a great weeping, before Isaiah had gone out of the middle part of the court, the word of the Lord came to him, saying: Go back and say to Hezekiah, the leader of my people: I have heard your prayer and seen your tear: Behold, I have healed you. And Hezekiah said to Isaiah: What will be the sign that the Lord will heal me (2 Kgs 20:4 and 5)? To him the Prophet answered: This shall be the sign from the Lord that the Lord will do the word which he has spoken: Do you wish the shadow to advance so many lines, or to go back as many steps? And Hezekiah said to him: It is easy for the shadow to increase by ten lines, and I do not wish this to be done; but that it go back ten steps. And when, at Isaiah's calling upon the power of the Lord, the sign had been accomplished, Isaiah commanded that a lump of fresh figs be brought: and when they had brought it and laid it upon his wound, he was cured. The Prophet returns to the king at the Lord's command, so that he who had struck might himself heal; and Hezekiah is called the leader of his people, and son of David, whose works he followed, for he had done what was right according to all that David his father did: and his prayer is heard and his tears are seen, because he had walked before the Lord in truth and with a perfect heart, and had wept with a great weeping, and had done what was pleasing in his eyes. Fifteen years are added to his life, which he had not asked for, and besides, the security of the kingdom during his lifetime is promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
