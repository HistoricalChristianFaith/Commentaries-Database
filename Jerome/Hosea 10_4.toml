[[commentary]]
quote='''
Say what you will, sigh after your old errors, promise yourselves prosperity, which will be turned into its opposite; you will strike a covenant, not at all with God, but with a lie. And after the covenant, which the Seventy translated testament, there will spring up for you not a fruitful crop of grain, not even barley, the food of beasts of burden, not various pulses, not vines that sweat out their fruit into must; the trees will not put forth fruits that change the moisture of the earth into various flavors; but bitterness will spring up for you, or rather the judgment of bitterness, or ἄγρωστις, which in Latin we render as grass. For it is a kind of plant like a reed, which at each of its joints sends a shoot upward and a root downward, and these shoots and twigs in turn are the seedbeds of another plant, and so in a short time, unless it is dug out to its deepest roots, it makes whole fields like thickets of briars. Indeed, even if some dry part of it, provided it has a joint, falls upon cultivated ground, it fills everything with grass. We have said these things according to the LXX translators; but in the Hebrew ros is written, which is translated as bitterness, that is, the judgment of bitterness, of which the Lord also speaks in the Gospel: For judgment I came into this world; and of others it is written that they will receive greater judgment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
