[[commentary]]
quote='''
We have also a treasure in these earthen vessels. Many interpret this of the body and the Holy Spirit: that is, "we have a treasure in earthen vessels." That understanding indeed exists too. But this one is much better, since we have a most precious treasure in earthen vessels, that is, in the rustic words of the Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
