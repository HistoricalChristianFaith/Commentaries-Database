[[commentary]]
quote='''
And lest he seem to speak only of the ten tribes, he added: The hinges of the temple shall creak, or the ceilings, in that day, says the Lord. This, however, is to be taken ὑπερβολικῶς (hyperbolically): so heavy a weight of evils will press down that even the very hinges of the gates and the lofty ceilings will howl and feel an incredible devastation, when many will die and, the inhabitants being captured or killed, silence will be cast in every place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And the hinges of the temple howled, or the ceilings of the temple, collapsing upon the slain people. And in every place silence has been cast, the Jews having Moses and the prophets, but not having the Word of God; reading the letter and losing the spirit, when their table was made into a snare, and into a recompense, and into a ruin; and their eyes were darkened, so that they should not see; and their ears were stopped, so that they should not hear; and their back was bowed down, so that they should not look up to heaven, but, with that woman of the Gospel who had a spirit of infirmity, should always be bent toward the earth. And the wrath of God was poured out upon them, and the fury of his wrath seized them, so that their habitation became desolate, and there was no inhabitant in their tents; when this was fulfilled: Behold, the days are coming, says the Lord, and I will send a famine upon the land; not a famine of bread, nor a thirst for water, but of hearing the word of the Lord; about which, if we reach that point, we must speak more fully later on. We, then, seeing that God did not spare the natural branches, let us fear to suffer the same things, and let us avoid the fowler's snares, and say to the Lord: Do not be silent, nor hold yourself back, O God, and do not keep silence from me, and I shall become like those who go down into the pit. Over the whole world the silence of the Jews has been cast: wherever they are, they mutter rather than speak; and though their blasphemy against the Lord the Savior reaches even to heaven, all interpretation of the Scriptures is mute and silent, and does not set its ears to hearing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
