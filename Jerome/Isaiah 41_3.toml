[[commentary]]
quote='''
He will pursue them, namely the kings and princes of the several nations; and he will pass through in peace, calling all to peace, so that they may be reconciled to God. The path will not appear in his feet, that is, he will not feel the labor of the way, nor any weariness of human weakness, but will drink of the brook in the way, and therefore will lift up his head (Ps 109 [110]).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
