[[commentary]]
quote='''
Thus says the Lord: For three crimes of the sons of Ammon and for four I will not turn him back, because he ripped up the pregnant women of Gilead, to enlarge his border; and I will kindle fire on the wall of Rabbah, and it shall devour its houses with howling in the day of battle, and with a whirlwind in the day of commotion; and Melchom shall go into captivity, he and his princes together, says the Lord. LXX: Thus says the Lord: For three impieties of the sons of Ammon and for four I will not turn away from them, because he cut up the pregnant women of the Gileadites, that he might enlarge his borders; and I will kindle fire upon the walls of Rabbah, and it shall devour the foundations with shouting in the day of battle, and it shall be shaken in the day of its consummation; and the kings shall go into captivity, their priests and their princes together, says the Lord. The divine word rebukes the sons of Ammon, who were begotten of the stock of Lot, and dwell in Arabia, where Philadelphia now is, because under Saul, king of Judea, Nahash the Ammonite, their prince, laid waste Jabesh-gilead, and ripped up its pregnant women, that he might enlarge his borders and subject all Gilead to his rule.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
