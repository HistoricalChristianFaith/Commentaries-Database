[[commentary]]
quote='''
Therefore I also, hearing of your faith in the Lord Jesus, and toward all the saints, do not cease giving thanks for you, making remembrance of you in my prayers: that the God of our Lord Jesus Christ, the Father of glory, may give you the spirit of wisdom and of revelation in the knowledge of him, the eyes of your heart enlightened.

Although a translation rendered word for word could excuse the Apostle to the diligent reader, in that the whole connection of the sentence seems to teem with faults and a solecism results, yet in the Greek too it sounds like a fault. Hence we also, answering rather the Greek detractors, will try to adjust the order of the reading according to the sense, so that we say: Hearing of your faith in the Lord Jesus, and toward all his saints, and seeing the difference of your faith toward the Lord and toward all his saints, I do not cease to give thanks and to make remembrance of you in my prayers, that the God of our Lord Jesus Christ, but the Father of glory, may give you the spirit of wisdom and of revelation. And what follows, the eyes of your heart enlightened, can be rendered thus by hyperbaton: Therefore I also, hearing of your faith in the Lord Jesus in the knowledge of him, the eyes of your heart enlightened, and toward all the saints, do not cease, giving thanks for you, to make remembrance of you in my prayers, that the God of our Lord Jesus Christ, the Father of glory, may give you the spirit of wisdom and of revelation unto knowledge; that you may know what is the hope of your calling, etc.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
