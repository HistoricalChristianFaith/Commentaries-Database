[[commentary]]
quote='''
The Saviour bade them go, not as yielding to their request, but that by the death of the swine, an occasion of man's salvation might be offered. But they went out, (to wit, out of the men,) and went into the swine; and, lo, the whole herd rushed violently headlong into the sea, and perished in the waters. Let Manichæus blush; if the souls of men and of beasts be of one substance, and one origin, how should two thousand swine have perished for the sake of the salvation of two men?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If you cast us out, send us into the herd of swine. And he said to them: Go. The Savior did not say: Go, as granting the demons what they asked, but so that through the killing of the swine an occasion of salvation might be offered to men. For the herdsmen, seeing these things, at once report them to the city. Let the Manichee blush. If the souls of men and of beasts are of the same substance and from the same author, how are two thousand swine drowned for the salvation of one man?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
