[[commentary]]
quote='''
Behold the voice of the crying of the daughter of my people from a land far off! He describes the weeping and wailing of the city of Jerusalem when the enemy had entered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Is the Lord not in Zion, or is her king not in her? Either the Lord himself is the king, or else 'Lord' refers to the Father, 'king' to the Son, according to that which is written under the name of Solomon: O God, give your judgment to the king, and your righteousness to the son of the king. But why the voice of crying is in Jerusalem and the crying itself comes from a land far off, the cause is manifest: because the Lord is not in her and her king has withdrawn from her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Why then have they provoked me to anger with their graven images and with foreign vanities? 'But the Lord has withdrawn from them,' he says, 'because they provoked me, who was their Lord and king, to anger by the worship of idols'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
