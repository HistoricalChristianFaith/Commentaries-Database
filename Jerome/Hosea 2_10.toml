[[commentary]]
quote='''
So then, once the garment and the linen have been set free, so that they might no longer cover the disgrace of the fornicating woman, all the shame of Jerusalem, or the folly through which she worked shame, will be uncovered in the sight of her lovers, so that those who desired her veiled may despise her exposed. And when she has been handed over to her lovers the Assyrians, or to the demons whom both she herself and the Assyrians serve, no one, he says, will be able to snatch her from my hand; for the weakness of the demons is proved in this, that those whom they had received abounding in all things they cannot free when they are crushed by evils.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
