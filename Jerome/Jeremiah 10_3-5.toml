[[commentary]]
quote='''
For he has cut wood from the forest, the work of the craftsman's hands with the adze; with silver and gold he has adorned it, with nails and hammers he has fastened it, that it may not come apart — or may not be moved —. They are fashioned after the likeness of a palm tree and will not speak; carried, they will be lifted, because they cannot walk. Do not therefore fear them, for they can do neither evil nor good. A description of the idols which the nations venerate. He has cut wood, he says, from the forest — the material of idols, then, is cheap and perishable — the work of the craftsman's hands — since the craftsman is mortal, mortal therefore are those things too which he fashions —; with silver and gold he has adorned it, so that by the gleam of both materials he may deceive the simple. And this error has passed down even to us, so that we think religion lies in riches. With nails and hammers he has fastened it, that it may not come apart or that it may not be moved. How great is the power of idols, which cannot stand by themselves unless they are fastened with nails and hammers? Fashioned after the likeness of a palm tree, they have the beauty of metals and are adorned by the art of painting, but they possess no usefulness that would yield any fruit to the craftsman. And they will not speak — for they have nothing living in them, those of whom it is written: they have a mouth and will not speak; they have ears and will not hear —; carried, they will be lifted. Stronger is he who carries than the things which are carried; nay rather, in him there is sense, in this a shape without sense. Do not therefore fear them, for they can do neither good nor evil. For many of the Gentiles are accustomed to worship some demons so that they may do no harm, and to entreat others so that they may grant benefits; whence also that line of Vergil: a black beast to Winter, a white one to the favoring Zephyrs. Whatever we have said of idols can be referred to all the doctrines which are contrary to the truth. For they too promise mighty things and fashion out of their own heart an image of vain worship; they boast great things, and to deceive all the simple they hold fast the gaze of the unskilled with thoughts golden, as it were, and with speech gleaming with the splendor of silver, and they are raised aloft by their inventors; in them there is no usefulness, and their worship belongs properly to the nations and to those who do not know God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
