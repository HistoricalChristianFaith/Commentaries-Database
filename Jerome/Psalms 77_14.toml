[[commentary]]
quote='''
You are the God who does wonders. He did not say, who has done; but, who does. Daily God does wonders, and works — both the Son, and the Holy Spirit. You are the God who does wonders. Yesterday a robber, today a Christian: yesterday a fornicator, today continent: yesterday you were seizing what belonged to others, now you hand over what is your own.

You have made known your power among the peoples. "Christ the power of God and the wisdom of God": "the mystery which had been hidden from the ages"; now you have made known your power among the peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="Homily 10, on Psalm 76"
