[[commentary]]
quote='''
The Prophet Jeremiah, for whom this prologue is written, was seen among the Hebrews to be certainly more rustic in style than Isaiah and Hosea and certain other prophets, but equal in meanings, which the same Spirit obviously prophesied. Furthermore, his simplicity of speech happened from the place in which he was born. For he was from Anathoth, which is up to today a village three miles distant from Jerusalem, a priest from priests and sanctified in his mother's womb, dedicating with her virginity a man of the Gospel to the Church of Christ. This boy began to prophesy the captivity of the city and Judea both not only by the Spirit, but also with eyes of flesh. The Assyrians had already transferred the ten tribes of Israel, and now colonies of gentiles had taken possession of their lands. For this reason he prophesied only in Judah and Benjamin, and he lamented the ruins of his city in a fourfold alphabet, which we have presented in the measure of the meter and in verses. Besides this, the order of visions, which is entirely confused among the Greeks and Latins, we have corrected to the original truth. And the Book of Baruch, his scribe, which is neither read nor found among the Hebrews, we have omitted, standing ready, because of these things, for all the curses from the jealous, to whom it is necessary for me to respond through a separate short work. And I suffer because you think this. Otherwise, for the benefit of the wicked, it was more proper to set a limit for their rage by my silence, rather than any new things written to provoke daily the insanity of the envious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FBiblical%2520Prefaces%2FJeremiah.html'
source_title="Prologue to Jeremiah"

[[commentary]]
quote='''
After the explanations of the twelve prophets, of Isaiah, of Daniel and of Ezekiel, I at last set my hand to Jeremiah, brother Eusebius, dedicating to you my short commentaries on him, so that you may join the man of the Gospel to Matthew the evangelist, whom I expounded many years ago, at your urging, in a compressed sense. And because the volume is very long and in most places is woven of a plain history, I advise your prudence of this: do not look in this work for a broad explanation, especially on those things which have already been said in the other prophets as well and which are clear to the understanding of themselves. And so I shall try to write by the hand of secretaries in such a way that nothing is lacking in the sense, though much is lacking in the words. I shall prepare for you the warp and the weft and the leashes; you yourself must make the most beautiful garment, so that you may be able not only to listen to us but also to teach others. But the little book of Baruch, which is commonly joined to the edition of the Seventy and is not found among the Hebrews, and the pseudepigraphon [falsely ascribed] letter of Jeremiah, I judged should by no means be expounded; rather, I judged that I should set in order the arrangement of Jeremiah, confused by the error of copyists, and should fill up from the Hebrew sources the many things that are lacking, so that you may hold a prophet new out of the old, and true in place of the corrupt and falsified, making light of the rage of the detractors, who cavil not only at the words but even at the syllables of our words, thinking that they know something in this, if they disparage the works of others. Just as lately an unlearned slanderer burst out, who thinks my commentaries on the letter of Paul to the Ephesians deserve censure, and, snoring in his excessive madness, does not understand the laws of commentaries, in which many opinions of various men are set down, with the names of the authors either suppressed or expressed, so that it is the reader's judgment to decide which he ought chiefly to choose; although in the first book of that same work I said in the preface that I would speak things either my own or another's, and that the commentaries themselves belong as much to the ancient writers as to us. Not seeing this, his forerunner Grunnius long ago strove to carp at it, and I answered him in two books. What this man brings forth as if his own has also already been cleared away when another was slandering, to pass over the volumes against Jovinian, in which he grieves that virginity has been preferred to marriage, and marriage to a second marriage, and a second marriage to many marriages. Nor does the utter dolt, weighed down with the porridge of the Scots, remember that we said in that very work: I do not condemn the twice married, nay, not even the thrice married, and, if it can be so, the eight times married; I will add something more: I receive even a fornicator who repents; whatever is equally lawful must be weighed in an equal scale. Let him read the apology for that same work, which many years ago Rome received with joy against his master, and then he will perceive that he blasphemes with another's voice, and that he is so unskilled that he does not even have curses of his own, but uses against us the rage even of enemies long since buried. But now the work proposed must be undertaken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
