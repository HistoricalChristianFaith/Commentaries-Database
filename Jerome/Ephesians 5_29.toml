[[commentary]]
quote='''
He who loves his wife loves himself: for no one ever held his own flesh in hatred, but nourishes and cherishes it, just as Christ also does the Church.

As far as the simple understanding is concerned, now that holy love between husband and wife has been enjoined, we are commanded to nourish and cherish our spouses, that is, to provide them with food and clothing and the things that are necessary. But it can be objected against us that the statement of the Apostle is not true when he says: For no one ever hates his own flesh, since those who suffer from the jaundice, and consumption, and cancer, and catarrhs prefer death to life and hate their own bodies. Let the passage, therefore, rather be referred to a figurative understanding, and let us say that the soul loves that flesh which is to see the salvation of God, and nourishes and cherishes it, instructing it with disciplines, and fattening it with heavenly bread, and watering it with the blood of Christ, so that, refreshed and sleek, it may be able to follow its husband with free course and not be weighed down by any weakness and burden. Beautifully, too, in the likeness of Christ, who nourishes and cherishes the Church and says to Jerusalem: How often would I have gathered your children, as a hen gathers her chicks under her wings, and you would not? souls also cherish their bodies, so that this corruptible may put on incorruption and, borne up by the lightness of wings, may be raised more easily into the air. Let us therefore cherish, we husbands our wives and we souls our bodies, so that both wives are changed into men and bodies into souls. And let there be no difference of sexes at all: but just as among the angels there is not male and female, so let us too, who are to be like the angels, even now begin to be what has been promised to us in the heavenly places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
