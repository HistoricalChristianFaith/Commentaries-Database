[[commentary]]
quote='''
Wash yourselves, be clean. In place of the former victims and burnt offerings and fat of fatlings and blood of bulls and goats, and in place of incense and new moons, sabbath, feast day and fasts, calends and other solemnities, the religion of the Gospel pleases me: that you be baptized in my blood through the washing of regeneration, which alone can forgive sins. For unless one is born again of water and the spirit, he will not enter the kingdom of heaven (John 3:5). The Lord himself too, ascending to the Father: Go, he says, teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit (Matt 28:19).

Take away the evil of your thoughts from my eyes. As John the Baptist said: Brood of vipers, who showed you to flee from the wrath to come? Bear therefore fruits worthy of repentance (Matt 3:7; Luke 3:7): so that he who has obtained the baptism of Christ should take away evil from his heart, and cease to act perversely, and afterwards learn to do good, according to what is commanded elsewhere: Turn away from evil, and do good (Ps 36 [37]:27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
