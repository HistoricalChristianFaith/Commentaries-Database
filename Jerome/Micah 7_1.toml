[[commentary]]
quote='''
Woe is me, for I have become like one who gathers the clusters of the vintage in autumn. There is no cluster to eat; my soul desired the first-ripe figs. The holy man has perished from the land, and there is no upright one among men. All lie in wait for blood, a man hunts his brother to death. The evil of their hands they call good; the prince demands, and the judge is for requiting, and the great man has spoken the desire of his soul, and they have troubled it. He who is best among them is like a brier, and he who is upright like a thorn from the hedge. LXX: Woe is me, for I have become like one who gathers stubble in the harvest, and like clusters in the vintage, when there is no cluster to eat the first-ripe; which my soul has suffered. Woe is me, O soul, for the reverent man has perished from the land, and there is none among men to correct; all are judged in blood, each one afflicts his neighbor with affliction, they prepare their hands for evil; the prince demands, and the judge has spoken peaceful words, it is the desire of his soul. And I will take away their goods like a devouring moth, and walking upon a rule in the day of your watching. Having foretold the captivity both of the ten tribes and of the two — for the word of the Lord came to Micah of Moresheth concerning Samaria and Jerusalem — the prophet laments that no just man from the people is found in the land who could withstand the wrath of God and set himself in the midst like a wall. In vain, he says, have I spoken; in vain have I wished to seek, as it were, the last clusters of the city already stripped of its vintage and ruined, and, since there is no cluster to eat, at least to take as food the unripe figs, which the Hebrews call bechchora, that is, the green fruit of the fig; as if he were saying: Finding no bread, because of the greatness of the famine I sought out refuse and bran.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Moreover, according to the Seventy, who disagree in certain points and at the end of the section translated altogether differently, the sense seems to me to be of this kind. The prophetic word, or the apostolic, laments over the human race in general, that the word has cast the seed of doctrines in vain, and that, instead of crops and grain, the late reaper has found scarcely empty stubble and hollow stalks, and has not been able to find even small clusters in the vineyard, and the rest up to the end of the section. For if he is blessed who speaks into the ears of one who listens, and the ear of the hearer is the desire of the wise man, and an understanding hearer is the joy of the speaker, on the contrary a bad pupil is the teacher's grief; and the words of Jeremiah also agree with this complaint: I have not profited, nor has anyone profited me. There are some who think this is said in the person of the Savior, complaining that in so great a multitude of believers, and in the whole world of the human race, he scarcely finds works worthy of his blood, he who also says in Psalm 29 (30): What profit is there in my blood, while I go down into corruption? Others, however, assert that it by no means befits his person to say: Woe is me, for I have become like one who gathers stubble in the harvest, he who said in the Gospel: Lift up your eyes and see the regions, for they are already white for reaping. And elsewhere: The harvest indeed is great, but the laborers are few. Those, then, who wish it to be understood in the person of the Savior say that it is no wonder if he says: Woe is me, he who both wept over Jerusalem and shed tears at the death of Lazarus. But that too, I have become like one who gathers stubble in the harvest, they refer to the consummation of the age, which they also meaningfully interpret as the harvest; and they say that this prophecy can be fulfilled at that time when, iniquity having multiplied, the love of many will have grown cold, and the Son of Man, when he comes, will find faith rare upon the earth; for then, like stubble after the harvest and like clusters after the vintage, scarcely will any be found among them who have kept the faith amid the devastation of all; and they think that this utterance, spoken in the person of the man who was assumed, is confirmed by what follows: Woe is me, O soul, the soul of which he was speaking: My soul is sorrowful, even unto death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
