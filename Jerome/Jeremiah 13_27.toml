[[commentary]]
quote='''
Upon the hills in the field I have seen your abominations. Woe to you, Jerusalem! You will not be cleansed — or because you have not been cleansed — after me; how long yet? 'Not only in the midst of the city of Jerusalem but on every hill and in all regions I have seen your idols'; hence it is said to her: 'Woe to you, Jerusalem, because you have not been cleansed after me, so that, though you boasted that you followed my footsteps and paraded the confession of my name, yet you have never been purified, because you have forgotten me and hoped in falsehoods'. Hence he rebukes her and says: How long yet? And the sense is: 'How long shall I wait for you? How long shall I bear it? How long will you forget me to the end and despise my precepts?' He commits fornication on the hills and in the fields and is never cleansed, who, with neck erect through pride, is not humbled under the mighty hand of God but trusts in his own crimes and vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
