[[commentary]]
quote='''
This passage does not contradict the command which He gave afterwards, Go and teach all nations; for this was before His resurrection, that was after. And it behoved the coming of Christ to be preached to the Jews first, that they might not have any just plea, or say that they were rejected of the Lord, who sent the Apostles to the Gentiles and Samaritans.

Figuratively; Herein we who bear the name of Christ are commanded not to walk in the way of the Gentiles, or the error of the heretics, but as we are separate in religion, that we be also separate in our life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do not walk into the way of the Gentiles, and do not enter into the cities of the Samaritans, but go rather to the sheep of the house of Israel that have perished. This passage is not contrary to that command which is given later: Going, teach all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, because this was commanded before the resurrection, that after the resurrection. And it was necessary that the first coming of Christ be announced to the Jews, lest they should have a just excuse, saying that they had rejected the Lord because he sent his apostles to the Gentiles and the Samaritans. But according to tropology we, who are reckoned by the name of Christ, are commanded not to walk in the way of the Gentiles and in the error of the heretics, so that those whose religion is separated may be separated in life as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
