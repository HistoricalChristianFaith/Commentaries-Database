[[commentary]]
quote='''
That this is not my opinion but the faith of holy Scripture, the words of Chronicles testify, which say after other things: This is Hezekiah who stopped the upper spring of the waters of Gihon, and turned them down to the west of the city of David. In all his works he accomplished prosperously what he wished; but in the embassy of the princes of Babylon, who had been sent to him to inquire about the portent that had happened on the earth, God left him, that he might be tested, and that all that was in his heart might be made known (2 Chr 32:30, 31). And he was left to temptation for this reason, because after so great a victory, and the sun's going back, and the congratulation of a most powerful kingdom, his heart was lifted up. Indeed, in the same volume it is written: Many brought victims and sacrifices to the Lord in Jerusalem, and gifts to Hezekiah king of Judah: and he was exalted before all the nations. In those days he was sick unto death, and he prayed to the Lord; and he heard him and gave him a sign; but he did not make return according to the benefits he had received: for his heart was lifted up, and there was wrath against him, and against Judah and Jerusalem (2 Chr 32:23, 24). And again holy Scripture says that the lifting up of his heart was softened by penance, adding: And afterward he was humbled because his heart had been lifted up, both he and the inhabitants of Jerusalem: and therefore the wrath of the Lord did not come upon them in the days of Hezekiah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
