[[commentary]]
quote='''
Lift up your eyes straight ahead and see where you have not been prostrated; you sat in the ways waiting for them like a robber in the wilderness or like a deserted crow. In place of 'robber' and 'crow' in the Hebrew 'arabe' is written, which can also signify 'Arabs', a nation given to brigandage, which to this day raids the borders of Palestine and besets the roads for those going down from Jerusalem to Jericho, a thing the Lord too recalls in the Gospel. 'Lift up, therefore, your eyes, O Jerusalem, and look around this way and that, and see where you have not been by fornication prostrated. For just as robbers are accustomed, toward evening and in deserted places, to lay ambushes for travelers, so you, like the harlot of Proverbs, sat in the ways toward evening, to kill by your intercourse the souls of those who commit fornication; on account of which the whole land is polluted with your fornications'. And significantly, according to anagōgēn [the higher, spiritual sense], those who promise that they will abandon heretical errors are commanded to lift their eyes straight ahead. For unless they begin to see what is straight, they cannot condemn their former crookedness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
