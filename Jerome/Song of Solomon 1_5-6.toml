[[commentary]]
quote='''
And when they have fallen down, and have brought victims to the Lord from there, from beyond the rivers of Ethiopia, they will be able to say: I am black and beautiful, because the sun has discolored me. For bodies that languish in shade and idleness cannot bear the temptations and the heats of the world; but those which are made ready for wrestling and for contests, dried by the sun, overcome the injuries of the world and obtain the blessing of the Holy Spirit, who says to the righteous man: The sun shall not burn you by day, nor the moon by night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
