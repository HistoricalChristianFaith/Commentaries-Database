[[commentary]]
quote='''
This truth, then, the knowledge of which is according to piety, is set in the hope of eternal life, because it at once bestows the reward of immortality on him who has come to know it. Without piety, however, the knowledge of truth delights for the present, but does not have the eternity of rewards, which God, who does not lie, promised before eternal ages, and manifested in his own times in Christ Jesus. But to whom did he promise beforehand, and afterwards make it plain, if not to his own Wisdom, which was always with the Father, when it rejoiced at the completed world and was glad over the sons of men; and did he not promise that whoever would believe in it would have eternal life? Before he laid the foundations of the world, before he poured out the seas, set up the mountains, hung up the sky, and made the earth firm with its mass cast down, God, in whom there is no lie, promised these things. Not because he could lie and is unwilling to break out into words of falsehood, but because he who is the father of truth has no lie in himself, according to that saying: "But let God be true, and every man a liar" (Rom. 3:4). Now God is called "who does not lie" for this reason: for he promises certain things with an oath in the prophets, so that we, made more secure, may hope the more that the things foretold will come to be, and, believing with our whole mind, may be prepared to attain the things that are to come.

It seems not beside the point to touch briefly on why God alone is called true, and every man a liar, by the voice of the Apostle. And unless I am mistaken, just as he alone is said to have immortality, although he has made both angels and many rational creatures to whom he has given immortality, so too he alone is said to be true: not that the others are not also immortal and lovers of truth, but that he alone is, by nature, both immortal and true. The others, however, obtain immortality and truth from his bounty, and it is one thing to be true, to have something through oneself; another to have what you have in the power of the giver. But neither do I think this should be passed over in silence: how God, who does not lie, pledged eternal life before eternal ages, from the time the world was made, according to the history of Genesis, and the times were established through the succession of nights and days, of months and years alike. In this course and wheel of the world, times glide by and come, and either are to be or have been. Hence certain of the philosophers think that there is no present time, but only past or future, because everything we say, do or think either passes while it is being done, or, if it has not yet been done, we await it. Before these times of the world, then, we must believe there was a certain eternity of ages, in which the Father was always with the Son and the Holy Spirit; and, so to speak, the one time of God is all eternity; nay rather, the times are innumerable, since he is himself infinite who, before times, exceeds all time. But not yet a thousand years of our world are fulfilled: and how many eternities before, how many times, how many origins of ages must we think there were, in which angels, thrones, dominions and the other powers served God, and, without the successions and measures of times, subsisted at God's command! Before all these times, then, which speech cannot utter, nor mind comprehend, nor silent thought dare to touch, God the Father promised to his Wisdom his Word, and that his very Wisdom and the life of those who were going to believe would come into the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
