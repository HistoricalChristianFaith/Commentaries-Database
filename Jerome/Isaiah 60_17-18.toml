[[commentary]]
quote='''
I will make, he says, your princes in peace, and your bishops in righteousness. For which it is written in the Hebrew: I will make your visitation peace, and your overseers righteousness. Here is the admirable majesty of holy Scripture, that it named the future princes of the Church bishops, all of whose visitation is in peace, and the title of whose dignity is in righteousness: so that they do not respect persons in judgment, and nothing unjust is heard in the land of the Church, nor destruction and unhappiness in her borders. For wherever there is iniquity, and righteousness is not kept, and peace is lost, all these things follow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
