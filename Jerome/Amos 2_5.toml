[[commentary]]
quote='''
Hence the Lord threatens that he will send fire into Judah also, to devour the houses and the foundations of Jerusalem, not of that Jerusalem in which the vision of peace abides, but of those which have arisen in various cities under the name of Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Hence the Lord will send fire into Judah, and it will devour the most wicked houses and the vicious foundations, which have destroyed the glory of Jerusalem; and at the same time we learn that the Creator of all has care not only of Judah and Israel but of all the nations; and that, according to the Apostle, those who have sinned without the law perish without the law, and those who have committed offences under the law are judged by the law of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
