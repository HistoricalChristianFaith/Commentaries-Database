[[commentary]]
quote='''
And again the word is directed to those very ones who were prisoners and who were to be set free by the mercy of Christ: Turn to the stronghold, you prisoners of hope. And the sense is: You who are now prisoners and are held in a harsh and terrible hell, you who hope for the loosing of your bonds at the coming of Christ, turn to the stronghold, or, you shall sit in the stronghold, of which it is written: The fear of the Lord is the bulwark of the holy one, so that you may say: Be to me a God, a protector, and a fortified place, that you may save me; and so that the prophet may also say of you: Behold, a strong city, and our salvation shall set a wall and an outer wall. But this stronghold, to which God exhorts the prisoners of hope, or the hoping prisoners of the Church, we ought to take as nothing other than the dwelling of paradise, into which the thief was the first to enter with the Lord; and for this reason they are called forth to the stronghold through Zechariah, because already then, and from that time, the Lord was promising that for a brief tribulation they would receive eternal rewards. Or, as is read in the LXX: For one day of your sojourning, I will render double to you. For in comparison with eternity, all that we suffer in the world must be called one day, a day not of dwelling but of sojourning, because we are strangers and sojourners, as all our fathers were. For what is at present momentary and light in our tribulation works in us, beyond measure, in sublimity, a weight of eternal glory, while we look not at the things that are seen, but at those that are not seen. For the things that are seen are temporal, but those that are not seen are eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
