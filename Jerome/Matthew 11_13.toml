[[commentary]]
quote='''
Not that He cuts off all Prophets after John; for we read in the Acts of the Apostles that Agabus prophesied, and also four virgins daughters of Philip; but He means that the Law and the Prophets whom we have written, whatever they have prophesied, they have prophesied of the Lord. That He says, Prophesied until John, shows that this was now the time of Christ's coming; and that whom they had foretold should come, Him John showed to be already come.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For all the prophets and the law prophesied until John. Not that he excludes prophets after John (for we read in the Acts of the Apostles that both Agabus prophesied and the four virgin daughters of Philip), but that the law and the prophets whom we read in writing, whatever they prophesied, foretold of the Lord. When therefore it is said: All the prophets and the law prophesied until John, the time of Christ is shown, in that the one whom they said was to come, John showed had come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
