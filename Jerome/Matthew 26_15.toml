[[commentary]]
quote='''
The wretched Judas would fain replace, by the sale of his Master, that loss which he supposed he had incurred by the ointment. And he does not demand any fixed sum, lest his treachery should see in a gainful thing, but as though delivering up a worthless slave, he left it to those who bought, to determine how much they would give.

Joseph was not sold as many, following the LXX (Gen. 37:28.), think for twenty pieces of gold, but as the Hebrew text has for twenty pieces of silver, for it could not be that the servant should be more valuable than his Master.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he said to them: What will you give me, and I will hand him over to you? But they fixed for him thirty pieces of silver. Unhappy Judas! The loss which he believed he had suffered from the pouring out of the ointment he wishes to make good with the price of his master. And yet he does not demand a fixed sum, so that the betrayal might at least seem profitable, but, as though handing over a cheap slave, he left it in the power of the buyers to give as much as they wished. Who fixed for him thirty pieces of silver. Joseph was not sold, as many think, for twenty pieces of gold, according to the LXX translators, but, according to the Hebrew truth, for twenty pieces of silver. For the servant could not be more precious than the master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
