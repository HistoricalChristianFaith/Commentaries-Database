
[[commentary]]
quote='''
And although he was angry with them, it is to you that the Lord of hosts speaks, for which Sabaoth is set down in the Hebrew, which the Seventy sometimes translated 'Almighty', sometimes 'of powers'. And he says: Turn to me, and I will turn to you, according to what we read: Draw near to the Lord, and he will draw near to you. To which this is the contrary: You have withdrawn from me, and I have withdrawn from you. Now he commands those who have returned from Babylon to return to the Lord, so that the Lord too may return to them, lest the sons begin to suffer what their fathers once suffered, to whom the prophets of that time likewise spoke. It is to be noted that in a few short verses and brief sentences, in Haggai and Zechariah, says the Lord of hosts is always added, so that they may know that it is God who commands, both against the command of the king and against the enemies raging round about; and that by this confidence they may be roused to the building of the temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
