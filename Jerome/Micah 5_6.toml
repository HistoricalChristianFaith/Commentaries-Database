[[commentary]]
quote='''
These seven shepherds, then, and eight bites of men, shall feed Asshur with the sword. For the word of God, living and effective, and sharper than any two-edged sword, was sent by him who came to send a sword upon the earth, so that two might be divided against three. And the land of Nimrod, which means temptation descending, they shall feed in its pit; for the land of the giant and hunter, and of him who is proud against the Lord, is not on the mountains but in pits. He fell like lightning from heaven, and is always busy among the beasts; and because he is a hunter, he roams the fruitless trees and the forests. So far, then, as I can recall in my memory, I have never read of a hunter in a good sense. Ishmael and Esau were hunters, and they went before as a type of the Jewish people: one of them is the son of the Egyptian woman, walking according to the flesh and living according to the flesh; the other lost his birthright for a dish of lentils, and, envying his brother's blessings, drives him off into Mesopotamia. The land of Nimrod, then, is reduced into its own pits: He who indeed digs a pit shall fall into it, and he who opened a cistern and dug it out shall fall into the pit which he made, and his pain shall return upon his head, and his iniquity shall come down upon his crown. And when the Assyrian had been pierced through by the seven shepherds and the eight bites, Christ delivered us from the hand of Asshur, who had come upon our land and desired to tread the borders of Israel. But as for what Symmachus says, And they shall feed the land of Asshur with the sword, and the country of Nimrod within its gates, this is to be understood: that the strong man is bound in his own house and the adversary is wounded. And according to Aquila and the Fifth Edition, that he is pierced through by the daggers and lances of the seven shepherds and of the eight christs of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
