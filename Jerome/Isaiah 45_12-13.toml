[[commentary]]
quote='''
For I am God, who did not create the earth for emptiness, that it should be deserted and squalid, but that men should dwell in it. I stretched out, or made firm, the heavens, that they might be the dwelling place of the angels. And I distinguished them with the variety of the stars, and commanded each in what order to run, and to complete the different spans of days and months and years. I, then, who made heaven and earth, what great thing is it if I have created one king to keep my commands, and if I direct all his ways? For he will order that my city Jerusalem be built, and that the captives return to Judea. Not for a price, nor for gifts, but because of my will, says the Lord God of hosts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"


[[commentary]]
quote='''
But if I made the earth to be inhabited by men, and stretched out the heavens above, and adorned them with the variety of the stars, so that worshipers of God might dwell on the earth, what wonder is it if I have sent my Son, a righteous king, into the world, or raised him up from the underworld, all of whose ways are straight? For he committed no sin, nor was guile found in his mouth (1 Pet 2:22). He it is who is to build my city upon the rock, against which the gates of hell shall not prevail (Matt 16); and which, set on a mountain, cannot be hidden (ibid., 5); and to let go free all who were formerly bound with demonic chains, not for a price nor for gifts: for we have been saved freely, the Apostles hearing and doing: Freely you have received, freely give (Matt 10:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
