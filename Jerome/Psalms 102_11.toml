[[commentary]]
quote='''
My days have declined like a shadow. If my days, how much more my nights? that is, if the light, how much more the darkness? And I have withered like grass. For as grass, so man passes away, and is dried up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_028.html'
source_title="Homily 28, on Psalm 101"

[[commentary]]
quote='''
Not that those who live a long time prolong their days, but those who make them great by the greatness of good works. Hence Jacob too, confessing himself a sinner, as it were, says: Few and evil are my days. And confessing in the psalm: My days, he says, have declined like a shadow, and I have withered like grass. Not that he sought a long life in the present, in which all that we live is brief, a shadow and an image: For man walks about in an image; but that he fears for the future, lest the length of his life, where true life is, be shortened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
