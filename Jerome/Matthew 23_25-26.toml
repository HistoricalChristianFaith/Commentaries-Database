[[commentary]]
quote='''
In different words, but to the same purport as before, He reproves the hypocrisy and dissimulation of the Pharisees, that they showed one face to men abroad, but wore another at home. He means not here, that their scrupulousness respecting the cup and the platter was of any importance, but that they affected it to pass off their sanctity upon men; which is clear from His adding, but inwardly ye are full of ravening and uncleanness.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Woe to you, scribes and Pharisees, hypocrites, because you clean what is outside of the cup and the dish, but inside you are full of plunder and uncleanness. Blind Pharisee, first clean what is inside of the cup and the dish, so that what is outside may become clean. In different words, with the same sense as above, he convicts the Pharisees of pretense and falsehood, because they show one thing to men outside and do another at home; not that their superstition dwelt in the cup and the dish, but that outside they showed men holiness in dress, in speech, in phylacteries, in fringes, in the length of their prayers and in other things of this kind, while inwardly they were full of the filth of vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
