[[commentary]]
quote='''
Judah, your brothers shall praise you. Because Judah means confession or praise, it is consequently written Judah, your brothers shall confess you or [Gen 49:9] your brothers shall praise you. The sons of your father shall worship you. A lion's whelp is Judah; from the shoot, my son, you have gone up. Lying down like a lion and like a lion's whelp: who shall rouse him? Although it is a great mystery concerning Christ, yet according to the letter it is prophesied that kings would be born from Judah through the stock of David and that all the tribes would worship him. For he does not say the sons of your mother, but the sons of your father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
