[[commentary]]
quote='''
Seek judgment, relieve the oppressed, judge for the orphan, defend the widow: and come, and reprove me, says the Lord. The commandments of the Gospel succeed to the victims of the Jews, and therefore provision is made for orphans and widows, so that, secure about the protection of their wives and children, martyrs may go forth to battle. And when, he says, you have done these things, reprove me if I do not render the rewards I have promised. And when he says, Seek judgment, he shows that it is not for all to judge rightly, but for those who are prudent. So too Solomon, in a vision in a dream, asked this of the Lord, that having received wisdom he might judge the people justly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
