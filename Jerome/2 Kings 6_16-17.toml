[[commentary]]
quote='''
We have spoken of the bad horses; let us speak also of the good horses. At that time when they came against Elisha to seize him, the servant went out and saw the army of the Assyrians round about, and Elisha said: "Fear not, for there are more with us than with them." And there it is written: "Lord, open the eyes of thy servant, that he may see." And when his eyes were opened, the servant saw the chariots and horses. These were the helpers. See, then, what he says, chariots and horses. There was no man upon them, but there were only chariots and horses. This is what he means to say: the multitude of angels. They themselves were both chariots and horses: but the rider was the Lord. Therefore he says in the canticle of Habakkuk: "And thy riding is salvation." This is said to God. O that we too might be the horses of God, and that God might deign to ride upon us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_009.html'
source_title="Homily 9, on Psalm 75"
