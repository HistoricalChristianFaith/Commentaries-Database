[[commentary]]
quote='''
But according to the letter, the Lord, being about to suffer among the peoples and to bear the stumbling block of the cross, had to strengthen the minds of the disciples by anticipating it with a sign. Hence the disciples too marvel, saying: How did it wither at once? The Savior, then, could have withered his enemies too by the same power, had he not been awaiting their salvation through repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
