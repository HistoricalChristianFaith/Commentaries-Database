[[commentary]]
quote='''
Hear, O Joshua, high priest, you and your friends who dwell before you, for they are men who portend. For behold, I will bring my servant the Rising, for behold the stone which I have given before Joshua: upon one stone are seven eyes. LXX: Hear then, O Joshua, high priest, and your neighbours who sit before your face, for the men τερατοσκόποι, that is, of portents, are beholders, for behold, I will bring my servant the Rising, for the stone which I have given before the face of Joshua, upon one stone are seven eyes. Our writers are hard pressed in this place by the Jews, on the ground that, following the sequence and texture of the discourse, they ought rather to understand Joshua (Iesus, the same name as Jesus) the priest, son of Jehozadak, than the Lord Savior. For if the word is addressed to the Lord, and to Christ it is said: Hear, O Joshua, high priest, who is the one of whom it is added: Behold, I will bring my servant the Rising, who by another name is called the stone, and has been given before Joshua, and upon this stone are seven eyes? Our writers, on the contrary, strive to maintain that Christ is called, according to different understandings, both Jesus the high priest, and the Rising, and the stone. But how they could explain that this is said of him, to him, as though of another, is most difficult. Those, then, who want the high priest to be Joshua son of Jehozadak interpret his friends who dwell, or sit, before him, and who are men who portend, as his disciples and the prophets. For the prophets were set as a sign of things to come. What is it, then, that Joshua and his friends are made to hear: I will bring my servant the Rising, and the rest? Because above God had promised Joshua son of Jehozadak, the high priest, that if he walked in his ways and kept his precepts, he himself would judge his house and keep his courts, and that he would give him ministers of angelic dignity, now he tells him and his friends that full happiness and perfect blessedness will come then, when the Rising comes, of whom it is written: Behold a man, the Rising is his name. And in Malachi: For you who fear my name the sun of justice shall rise, and healing in its wings. And in Numbers: A star shall rise out of Jacob, and a man out of Israel. In the Gospel too we read most plainly of Christ: In which the Rising from on high will visit us. To give light to those who sit in darkness and in the shadow of death, to guide our feet into the way of peace. He himself is called the Rising and the cornerstone, because he joins both peoples together and unites two walls into one house. To those who do not believe he is a stone of stumbling, of whom it is also said in the psalms: The stone which the builders rejected, this has become the head of the corner. This was done by the Lord. Upon this stone are seven eyes, of which Isaiah speaks: A rod shall come forth from the root of Jesse, and a flower shall rise up from his root, and the spirit of God shall rest upon him, the spirit of wisdom and understanding, the spirit of counsel and fortitude, the spirit of knowledge and piety; and the spirit of the fear of God shall fill him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
