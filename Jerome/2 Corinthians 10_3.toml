[[commentary]]
quote='''
Notice carefully that he who follows the Scriptures according to the letter is said to be made perfect in the flesh. Wherefore that which is written to the Corinthians: "Living in the flesh, we do not wage war according to the flesh" (2 Cor. 10:3), can better be understood thus, that those are said to wage war in the flesh who expound the Old Testament in a lowly manner. But those who follow the spiritual understanding may indeed be in the flesh, because they have the same letter as the Jews, yet they do not wage war according to the flesh, since they pass over from the flesh to the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
