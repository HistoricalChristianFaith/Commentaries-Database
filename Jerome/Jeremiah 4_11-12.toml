[[commentary]]
quote='''
At that time it shall be said to this people and to Jerusalem: a burning wind — or of error — in the ways that are in the desert, the ways of the daughter of my people, not for winnowing and cleansing. A full spirit shall come to me from these. When the sword has reached even to the soul and the threshing floor has been finished, then the burning wind will come from the desert, which will not cleanse and winnow it, so that, with the chaff scattered here and there, the grain may be laid up in the granaries; but a full spirit will come, not to the people at all, but to me, so that my wheat may be scattered. 'Wind' and 'spirit' are called among the Hebrews by the same name, 'ruha', and according to the nature of each passage we should take it either as 'wind' or as 'spirit'. Others expound this passage thus: that after the threshing floor has been cleansed, the remnant will be saved, whence it is also written: a spirit of fullness shall come to me, as the evangelist says: 'we have all received of his fullness, and we shall obtain the grace of the Holy Spirit'. But according to the history take the burning wind as Nebuchadnezzar, who consumes all things; according to tropology, as the adverse power, which, coming from the desert and from the wilderness, where there is no lodging of God, tries to overthrow his Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
