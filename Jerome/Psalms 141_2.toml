[[commentary]]
quote='''
For there shall come out of Zion one to rescue and to overturn iniquities from Jacob, when from the east and the west incense is offered to the name of the Lord in every place, and a pure sacrifice, by no means in the victims of the Old Testament, but in the holiness of evangelical purity; of which incense we read elsewhere too: Let my prayer be directed as incense in your sight. And what this incense is, the words that follow show: The lifting up of my hands an evening sacrifice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
