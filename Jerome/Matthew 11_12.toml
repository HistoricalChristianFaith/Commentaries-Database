[[commentary]]
quote='''
Because John the Baptist was the first who preached repentance to the people, saying, Repent ye, for the kingdom of heaven is at hand: rightly therefore from that day forth it may be said, that the kingdom of heaven suffereth violence, and the violent take it by force. For great indeed is the violence, when we who are born of earth, seek an abode in heaven, and obtain by excellence what we have not by nature.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
From the days of John the Baptist until now the kingdom of heaven suffers violence. If John, as we said above, was the first to announce repentance to the peoples, saying: Repent, for the kingdom of heaven has drawn near, it follows that from his days the kingdom of heaven suffers violence, and the violent plunder it. For it is great violence that we, born on earth, should seek the seat of heaven and possess by virtue what we did not hold by nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
