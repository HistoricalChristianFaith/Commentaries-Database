[[commentary]]
quote='''
Therefore thus says the Lord concerning the prophets who prophesy in my name, whom I did not send, saying: Sword and famine shall not be in this land: by sword and famine those prophets shall be consumed. And the peoples to whom they have prophesied shall be cast out in the streets of Jerusalem because of famine and sword, and there shall be none to bury them, they and their wives, their sons and their daughters, and I will pour out upon them their own evil or their own evils. Let the false prophets beware, who by promising prosperity trip up the people of God, lest they themselves perish and the deceived people be destroyed by a like ruin, and they lie in the streets of Jerusalem and, trampling on the precepts of the Lord, perish by famine and sword, and there be none to bury them nor to cover their disgrace with the dust of repentance. For the prophets themselves and the people, and their wives, and sons and daughters, and their whole generation will be on the dunghill without any undertaker. How many lie in the streets of Jerusalem! How many do we see unburied receiving their own evils, which they suffer as the Lord pours them out!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
