[[commentary]]
quote='''
You have reckoned many threshing floors and winepresses as the payment for your fornication, so that you might enjoy an abundance of all things; therefore the threshing floor and the winepress will not produce wheat and wine, and the winepress will deceive them, or will deny its wine, with which they thought they would be made drunk. We read that under Ahab king of Israel, and Elijah the prophet, there was a most severe famine in Samaria, so that mothers fed on the corpses of their own sons. At that time, according to the letter, the threshing floor and the winepress did not feed them, and the wine deceived them, and they wasted away in want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
