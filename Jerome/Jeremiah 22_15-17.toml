[[commentary]]
quote='''
'Will you', says the divine word, 'be able to reign forever, since you desire to compare yourself to the lofty cedar, that is, to your father Josiah, a righteous king? Your father', he says, 'both ate and drank and enjoyed royal wealth; and yet he did not offend God in this, that he had riches, but pleased him in this, that he did judgment and righteousness, and therefore it was well with him, and will be, both in the present age and in the one to come. He judged', he says, 'the cause of the poor and needy, and to the refreshment of those whom he heard, and properly to his own good. And all these things turned out prosperously for him because he knew me, says the Lord. But your eyes, O Jehoiakim, turn aside to avarice, and, so that you may shed innocent blood, to slander and to the course of evil work.' But what sense the words have according to the Seventy I cannot understand; for while the rest agree with one another to some extent, as for what is added: Will you reign, since you contend with Achaz your father?, in place of which in the Hebrew is written 'araz', and this word means 'cedar', it is plain that it has no sense; and so too what follows: They shall not eat and they shall not drink, and the rest, which are so scattered and confused among themselves that without the truth of the Hebrew reading they have no intelligible meaning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
