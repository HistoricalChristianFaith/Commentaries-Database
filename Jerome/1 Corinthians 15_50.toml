[[commentary]]
quote='''
And again, where we rendered: And their whole 'body', with 'of the wheels' understood, in the Hebrew it is written: And all their 'fleshes', and necks and hands and wings and rims; note that flesh is spoken of in the heavenly powers, so that, when we read: Flesh and blood shall not possess the kingdom of God, nor corruption incorruption, we may know that not the substance of the flesh but its works are condemned: for 'basar', which is written in this place, signifies not 'body' but 'flesh'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Let us not despise the flesh, but let us despise the works of the flesh. Let us not despise the flesh, which reigns with Christ in heaven. 'Flesh and blood shall not possess the kingdom of God': not flesh and blood, but the works of the flesh. Flesh and blood shall not possess the kingdom of God. And how do they reign in Christ? and how do we sit with Christ in the heavenly places?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"

[[commentary]]
quote='''
But someone may say: How does the apostle say that "flesh and blood shall not obtain the kingdom of God"? Do you wish to know how it is written? Listen to the Lord speaking in Genesis: "My spirit shall not remain in man forever, because he is flesh." Why? For what is this? You made the flesh, and do you accuse and condemn the flesh? But what God says is this: my spirit shall not remain in these men, because they do not live according to the spirit, but according to the vices and will of the flesh. Let the apostle too give his testimony: "Whoever are in the flesh cannot please God." If all who are in the flesh cannot please God, how did Paul himself, who is speaking, please God? How did Peter or the rest of the apostles and the saints please him, whom we cannot deny to have been in the flesh? Just as the same apostle again says: "But you are not in the flesh, but in the spirit." They were in the flesh: and how does he say, You are not in the flesh? Because you do not live according to the flesh, because "our citizenship is in heaven." For we who in this age "are pilgrims away from the Lord" do indeed walk on the earth, but we hasten toward the things of heaven: because here we have no home of our own, but are strangers and pilgrims, just as all our fathers were.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_063.html'
source_title="Homily 63, on Psalm 83 (Alternate Series)"
