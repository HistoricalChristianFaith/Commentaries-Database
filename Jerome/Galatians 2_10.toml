[[commentary]]
quote='''
Only that we should be mindful of the poor, which I also was anxious to do, this very thing.

The holy poor, whose care is enjoined especially by the apostles upon Paul and Barnabas, are those who, believing from among the Jews, brought the prices of their possessions to the feet of the apostles to be bestowed upon the needy, or because they were held in detestation and as an abomination by their fellow tribesmen, their kinsmen and their parents, as deserters of the Law and as believers in a crucified man. With how much labor the holy apostle Paul toiled in ministering to these, his Epistles are witnesses, as he writes to the Corinthians and to the Thessalonians, and to all the churches of the Gentiles, that they should prepare this gift, to be carried to Jerusalem by themselves or by others who pleased them. Hence he now says confidently, which I also was anxious to do, this very thing. But the poor can also be taken in another sense, those of whom it is said in the Gospel: "Blessed are the poor in spirit: for theirs is the kingdom of heaven" (Matt. 5:3). Such men indeed deserve to be in the memory of the apostles. And also those poor of whom it is written in Solomon: "The ransom of a man's soul is his own riches" (Prov. 13:8). But the poor man does not bear the threat. For he cannot hear the future terror of punishments, poor in faith, poor in grace, not having spiritual riches, nor the knowledge of the Scriptures, which are compared to gold and silver and precious stone. Since, therefore, it is not the healthy who need a physician, but those who are sick, for this reason it was agreed with the apostles also, in the giving of right hands, that they should not spurn the poor, should not despise sinners, but should always be mindful of them, just as Paul was mindful of that Corinthian whom, after he had grieved him for a time in the first Epistle, so that, the body laboring through penitence, he might be saved in spirit (1 Cor. 5), in the second he calls back to the Church, lest he be swallowed up by excessive grief. And he asks all of them to confirm their love toward him, and to forgive the brother, just as he himself had forgiven each one of them in the face of Christ, fulfilling the pact which he had made at Jerusalem, that he would always remember the poor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
