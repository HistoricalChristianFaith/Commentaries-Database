[[commentary]]
quote='''
Behold, you trust in words of falsehood — or lying words —, which will not profit you: to steal, to kill, to commit adultery, to swear falsely, to pour libations to the Baals, and to go after strange gods whom you do not know. And you came and stood before me in this house, in which my name has been called upon, and you said: We are delivered — or we have ceased — because we have done all these abominations. The sins that follow show that they have confidence in the temple in vain. For what does it profit to cross boldly the threshold of the house of God, to stand with neck held high, and to have not only the heart but also the hands polluted with theft, murder, adultery, perjury, sacrilege, and the worship of those gods whom you do not know? No one doubts that this happens spiritually in the Church, when people, considering the prosperity of the present time, do not take account of their sins and think that they are hidden from God, because punishment does not follow at once; nay rather, they break out into such madness that they think themselves delivered because after their evil works they have even withdrawn from the worship of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
