[[commentary]]
quote='''
For the word of the Lord has become to me a reproach and a derision all the day. And I said: I will not remember him — or I will not name the Lord — nor will I speak any more in his name. And there came to be in my heart as it were a burning fire, shut up in my bones, and I fainted — or I was dissolved — not enduring to bear it; for I heard the insults — or the reproach — of many, and terror round about — or of those gathered from every side —: Persecute, and let us persecute him! 'When I cried out and said that the Babylonian army was already coming and that the sword of the enemy would plunder everything, the word of the Lord was turned for me into a reproach and a derision, since they think the delay of the prophecy is a lie; for which reason I resolved in my mind that I would no longer speak words to the people of God nor name his name. When, overcome by shame, I had resolved this modestly indeed, but foolishly, there came to be', he says, 'in my heart as it were a burning fire, shut up in my bones, and I fainted or I was dissolved on every side, so that I cannot bear it.' For the divine word, conceived in the mind and not brought forth by the mouth, burns in the breast; hence Paul too says: if I preach the Gospel, there is no glory for me; for necessity lies upon me; for woe is me if I do not preach the Gospel. For if I do this willingly, I have a reward; but if unwillingly, a stewardship has been entrusted to me. And at Athens, seeing the city given over to idolatry, he was stirred in spirit and burned with his whole mind; and a little later in the same book we read: and when Silas and Timothy had come from Macedonia, Paul was pressing on with the word, testifying to the Jews that Jesus is the Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
