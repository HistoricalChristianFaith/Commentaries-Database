[[commentary]]
quote='''
Something of this kind the Lord too said in the Gospel against the Pharisees, who reproached him for not rebuking the children who acclaimed him: Hosanna in the highest to the son of David, blessed is he who comes in the name of the Lord; Hosanna in the highest. Have you not read, he says, that it is written: Out of the mouth of infants and sucklings you have perfected praise? And if these are silent, the stones will cry out. For although very many think it is to be understood thus, if the Jews are silent, the multitude of the nations will confess me, yet this is the more expressive and truer understanding: even if men were silent, and the envious tongue would not speak of the multitude of my signs, yet the stones themselves, and the foundations of the walls, and the structure of the walls will be able to proclaim aloud my greatness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
