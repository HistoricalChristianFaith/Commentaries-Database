[[commentary]]
quote='''
For they have transgressed against the Lord, because, playing the harlot with idols, they have begotten sons not to God but to demons. Others think that what is meant here is what is said in Ezra, a long time afterwards, when they took foreign wives, begetting children from them, and afterwards were compelled to put them away. But here it is better to take as strange sons those who were begotten in the error of idols, or those whom they led through the fire and consecrated to idols. Since, therefore, they have done this, not long afterwards, not after endless spans of years, nor, as I was formerly accustomed, foretelling things to come long after, but now and at this present time the Assyrian and the Chaldean will come; and they will devour them with their portions, or lots, that is, with the possessions which they received in the division of the land by the measure of the line. Where we said: a month will devour them, the Seventy translated rust; whereas rust, that is, ἐρυσίβη, is certainly called hasil, as they themselves also said in the prophet Joel: What the locust left, the rust has eaten, that is, hasil. But month is called hodes; accordingly Aquila translated new moons, that is, Kalends; Symmachus and Theodotion month; and the sense is: month by month the enemy will come and will lay everything waste. Let us read the books of Kings and Chronicles, and we shall find that under King Pekah, who reigned over the ten tribes, Tiglath-pileser king of the Assyrians came and carried a great part of the people of Samaria away to the Assyrians; at which time among the Greeks it was the second year of the first Olympiad; and among the Latins — Rome not yet founded — Amulius was reigning at Alba in his twentieth year, he whom Romulus afterwards drove from the kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
