[[commentary]]
quote='''
And this whole passage, from where he says: Before the sun is darkened, and the moon and the stars, up to the place in which Scripture records: And the dust will be turned into its earth as it was, and the spirit will return to God, who gave it, they explain of the state of their own condition. Since these things, as we said above, are long-winded and prolix, they will be touched on by us briefly and in passing. Rejoice, therefore, in your youth, O Israel, and do this or that, of which we have already spoken, before the captivity comes, and your honor and glory depart from you, and your judges and your holy ones, whom they want to be understood by the sun, the moon and the stars, are taken away; before Nebuchadnezzar comes, or Titus the son of Vespasian, summoned by the prophets, and their prophecies are fulfilled. In the day in which the angels who preside over the temple will withdraw, and all the strongest men in your army will be troubled, and the discourses of the teachers will be idle, and the prophets, who used to receive from heaven the light of their visions, will be darkened. When the doors of the temple will be shut, and Jerusalem will be humbled, and the Chaldean will come, called forth by the cries of Jeremiah as by the song of a bird, and the daughters of song, the choirs of those singing psalms in the temple, will fall silent. At that time when the enemies themselves too, coming to Jerusalem, will dread the greatness of God, and, wavering on the way, will fear the destruction of Sennacherib. For they think this is said: And they will fear from on high and will dread on the way. In those days the almond will flower, that staff and rod which Jeremiah saw at the beginning of his prophecy, and the locust will grow fat, Nebuchadnezzar with his army, and the caper will be scattered, the friendship of God with Israel. But what the caper means will be explained more fully when we begin to speak of each point. And all this will befall Israel because man is about to go away into the house of his eternity, and God, his protection, is about to return to the heavenly places; and as he departs into his tabernacle, they will go about in the street weeping and lamenting, and hemmed in by the siege of their enemies. Rejoice, therefore, Israel, in your youth, before the silver cord is broken, that is, while your glory is with you, before the golden band runs back. That is, before the ark of the covenant is taken away; before the pitcher is crushed at the fountain and the wheel is rolled up over the cistern; that is, while the precepts of the law are in the holy of holies, and the grace of the Holy Spirit is there, and before you return to Babylon, from which you went forth in the loins of Abraham, and begin to be crushed in Mesopotamia, from which you once set out. And let all the grace of prophecy with which you had once been inspired return to its giver. These things the Jews expound to this day, and they draw the understanding of this passage to their own person.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
