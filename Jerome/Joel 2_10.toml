[[commentary]]
quote='''
Before the face of locusts of this kind the earth trembled, and the heavens were moved, which we should take as said hyperbolically: not that the force of locusts or of enemies is so great that it could move the heavens and shake the earth, but that to those who suffer adversity, from the greatness of their terror, the heaven seems to fall and the earth to heave. Finally, because of the multitude of locusts covering the sky, the sun and the moon will be turned into darkness, and the stars will withdraw their splendor, while the cloud of locusts placed in between does not let the light reach the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
Before the face of this people, which is many and strong, the earth trembled, and the heavens were moved. For heaven and earth shall pass away, but the word of the Lord abides forever. Moreover the sun and the moon will not be able to look upon such great punishments of the wretched, and they will mourn, not having the righteousness of their office, and instead of clear light they will be covered with dreadful darkness; the stars too will withdraw their brightness, while even those who are holy will not see the presence of the Lord without dread.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
