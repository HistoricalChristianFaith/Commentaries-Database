[[commentary]]
quote='''
Whence did the devil fall? because he committed theft? because he committed murder? because he committed adultery? These indeed are evils: but the devil did not fall on account of these, but he fell on account of his tongue. For what did he say? 'I will ascend into heaven, above the stars of heaven I will set my throne, and I will be like the Most High.' So then let not monks suppose that they ought to be secure, and say, Meanwhile we do not commit great crimes in the monastery: I do not commit adultery, I do not commit theft, I do not commit murder, I do not commit parricide, and the rest of the great vices. In the tongue too there are great vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"
