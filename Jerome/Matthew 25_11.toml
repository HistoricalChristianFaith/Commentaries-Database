[[commentary]]
quote='''
Their worthy confession calling Him, Lord, Lord, is a mark of faith. But what avails it to confess with the mouth Him whom you deny with your works?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Last of all the other virgins also come, saying: Lord, Lord, open to us. Excellent indeed is the confession in calling him Lord, and its repetition is a sign of faith. But what does it profit to call with the voice on him whom you deny by your works?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
