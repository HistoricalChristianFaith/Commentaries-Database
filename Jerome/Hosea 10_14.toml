[[commentary]]
quote='''
And so a tumult will rise up among your people, which in Hebrew is called Saon, that is, the noise and roaring of a howling army; and at their shouting all your fortresses will be laid waste; and the places you thought fortified and safe will lie open to the enemy and will be laid waste just as Salmana, the prince of the Midianites, was laid waste and crushed, who was killed by the house of Jerubbaal. There is no doubt that he means Gideon, who, from the fact that he destroyed the temple of Baal and cut down the grove, and Baal could not avenge himself, obtained the surname Jerubbaal, that is, let Baal avenge himself; so that, as Salmana killed the sons in front of their mothers, the mothers themselves also being killed afterwards, so too your sons, O Ephraim, may be killed in your presence, you who are yourself also to be slaughtered. We ask where it is written that Salmana killed the mother upon her sons; we read in the book of Judges, where Gideon speaks to the prince of Midian: As your sword has made many mothers childless, so your mother will be without sons among women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
