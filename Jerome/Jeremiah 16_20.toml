[[commentary]]
quote='''
Shall a man make gods for himself, and they are not gods? This too the nations say, who have come to the Savior from the ends of the earth, rebuking the ignorance both of themselves and of their ancestors, by which they thought that gods are made by man, when it belongs to God to make men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
