[[commentary]]
quote='''
But the Holy Spirit is put, not on the Word of God, but on the Only-Begotten, who came forth from the bosom of the Father; on Him, that is, of whom it is said, Behold my servant. And what He will do by Him He adds, And he shall declare judgment to the Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Behold my servant whom I have chosen, my beloved, and the rest. This is said through the prophet Isaiah in the person of the Father: I will put my Spirit upon him. The Spirit is put not upon the Word of God and upon the Only-begotten who came forth from the bosom of the Father, but upon him of whom it was said: Behold my servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
