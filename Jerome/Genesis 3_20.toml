[[commentary]]
quote='''
And Adam called the name of his wife Life, because she is the mother of all the living. Why Eve was called Life he shows by this, that she is the mother of all the living. For Eve means life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Eua [Eve]: calamity, or woe, or life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
