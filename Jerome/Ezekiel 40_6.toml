[[commentary]]
quote='''
Though there were very many gates, he would not enter by the other gates, but by the one which looked toward the eastern quarter; and because the place was not level — for the wall round about, and the house of God itself, had been built on higher ground —, he therefore goes in, or rather climbs up, by steps — which the Seventy alone name as 'seven', whereas both in the Hebrew and in the other translators we read only 'steps', without a number —; and having entered the gate, he at once measured the threshold of the gate — which the Seventy name 'thee', in place of which in the Hebrew is written 'seph' [threshold]; and I think the diligent and studious reader should be reminded of this, if indeed he is led by knowledge of the Scriptures and not by the empty declamations of orators: that he should know that almost all the Hebrew words and names which have been set down in the Greek and Latin translation have been corrupted by excessive age and depraved by the fault of the scribes, and that, as ever more uncorrected copies are written from uncorrected ones, out of Hebrew words Sarmatian words have been made, or rather words of no nation, since they have ceased to be Hebrew and have not begun to be foreign —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
