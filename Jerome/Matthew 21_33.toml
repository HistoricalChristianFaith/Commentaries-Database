[[commentary]]
quote='''
He hath planted a vine of which Isaiah speaks, The vine of the Lord of Hosts is the house of Israel. (Isa. 5:7.) And hedged it round about; i. e. either the wall of the city, or the guardianship of Angels.

A winepress, that is to say, An altar; or those winepresses after which the three Psalms, the 8th, the 80th, and the 83d are entitled, that is to say, the martyrs.

And built a tower therein, that is, the Temple, of which it is said by Micah, And thou, O cloudy tower of the daughter of Sion. (Mic. 4:8.)

Not a change of place, for God, by whom all things are filled, cannot be absent from any place; but He seems to be absent from the vineyard, that He may leave the vine-dressers a freedom of acting.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Hear another parable: There was a man, a householder, who planted a vineyard and set a hedge around it and dug a winepress in it and built a tower, and he let it out to farmers and went abroad. This is what the Lord signified with a saying taken from a proverb: It is hard to kick against the goad. The chief priests and the elders of the people, who had asked the Lord: By what power do you do these things, and who gave you this power, and had wished to catch Wisdom in a word, are overcome by their own art and hear in parables what they did not deserve to hear openly. This man, the householder, is the same who had two sons, and who in another parable hired workers for his vineyard; who planted the vineyard of which Isaiah too speaks most fully in a song, bringing in at the end: The vineyard of the Lord of hosts is the house of Israel; and in the psalm: A vineyard, he says, you transplanted from Egypt; you cast out the nations and planted it. And he set a hedge around it, either the wall of the city or the help of the angels. And dug a winepress in it, either the altar or those winepresses with which three psalms are marked in their title, the eighth, the eightieth (81st) and the eighty-third (84th). And built a tower, no doubt the temple, of which it is said through Micah: And you, cloudy tower of the daughter of Zion. And he let it out to farmers, whom elsewhere he called the workers of the vineyard, who had been hired at the first, third, sixth and ninth and eleventh hour. And went abroad, not by change of place, for from where can God be absent, by whom all things are filled, and who says through Jeremiah: I am a God who draws near, and not from afar, says the Lord? But he seems to go away from the vineyard so as to leave the vinedressers free choice in their working.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
