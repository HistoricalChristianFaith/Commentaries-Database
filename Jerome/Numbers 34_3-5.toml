[[commentary]]
quote='''
For which in the book of Numbers it is written thus: It will begin from the wilderness of Sin, which is beside Edom, and will have as boundaries toward the east the sea. And they will go around the southern quarter by the Ascent of the Scorpion, so that they pass Senna and come into the south as far as Kadesh-barnea, whence the borders will go out to a village named Addar, and will extend as far as Asemona. And the boundary will go around from Asemona as far as the torrent of Egypt, and will be ended by the shore of the Great Sea. Which briefly signifies this — lest on the occasion of Ezekiel we seem to pass over to a very broad exposition of Numbers —: that the boundary goes around from the wilderness of Sin, which is beside Edom, and from the Red Sea, and, through the Ascent of the Scorpion and through Senna and Kadesh-barnea and the court of Addar and Asemona, reaches as far as the torrent of Egypt, which flows into the sea beside the city of Rhinocorura; but this boundary of the southern quarter, that is, the meridional, begins from Tamar — which is a city in the wilderness, which Solomon too built with wondrous works, and today it is named Palmyra, and in the Hebrew tongue it is called 'thamar', which in our language means 'palm' — up to the waters of contradiction of Kadesh, which beyond doubt is in the desert, and the torrent entering the Great Sea, this sea which stretches along the shores of Egypt and Palestine, and this is the southern quarter toward the south.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
