[[commentary]]
quote='''
The burden of Duma. He calls to me out of Seir: Watchman, what of the night? Watchman, what of the night? And the watchman said: The morning comes, and the night: if you seek, seek; turn, come. For Duma the Seventy put Idumaea. But Duma is not the whole province of Edom, but a certain region of it which lies toward the south, and is twenty miles distant from the city of Palestine which today is called Eleutheropolis: near it are the mountains of Seir, which took their name from their founder; for Seir means shaggy and hairy, which Esau was. In the prophet Obadiah we have discussed this nation more fully: there it was necessary to go over the ancient history, and to draw in as testimony the same Visions of Ezekiel and Jeremiah, and especially the prophecy against Mount Seir (Ezek 25 and 35; Jer 49); and that saying from the Psalms: Into Edom I will stretch out my shoe; and elsewhere: The tents of the Edomites and the Ishmaelites, Moab and the Hagarenes, Gebal and Ammon and Amalek (Ps 59 [60]:10; Ps 82 [83]:7-8). Amos also says: For three crimes of Edom, and for four, I will not turn him back, because he pursued his brother with the sword, and violated his mercy (Amos 1:11), or, as Symmachus translated, his bowels: because he dared to fight against kindred peoples, and to be at variance with them in hostile hatred. Now the region of Esau was in the region of Duma, that is, in the mountains of Seir. We believe that this, as a metropolis, in keeping with the order of the preceding Visions, was conquered by the Assyrians or by Nebuchadnezzar, and that, mindful of its former stock, since it was begotten of the line of Abraham and Isaac, it implored the help of God, and under the compulsion of necessity begged for his clemency. Now, therefore, the Lord recounts: He who is besieged in Seir and surrounded by enemies implores my help, and says: O watchman of Israel, who guard your people with an everlasting watch, and, as it were in the night, keep vigil while they sleep, lest the enemy break in, why do you not protect us also, who are of his seed, with like clemency? To them I reply, the watchman and keeper of whom it is written: He who guards Israel will not slumber nor sleep (Ps 120 [121]:4). Morning comes for my people, and night for the nation of the Edomites; to them I will give light, you I will leave in darkness. Or certainly thus: the light has come, the night being past; if you call upon my help, and are of the stock of my servant Abraham, do not seek me only in your necessities, but turn to me with your whole mind. Come, and I will receive you as penitents. Let this be said according to the history. For the rest, because of the similarity of the letter, and because RES and DALETH differ little from each other, some of the Hebrews read Roma for Duma, wishing the prophecy to be directed against the Roman empire, by the frivolous persuasion by which they always think that the Romans are pointed out under the name of Edom: but Duma means silence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
The Lord therefore speaks to the choir of the Apostles and commands it: Call to me those who are of Seir, so that the multitude of the nations may serve me, which, after the likeness of Esau, has nothing in itself soft and smooth and sleek, but is shaggy, wild, intractable. And you, O Apostles, after you have called the nations to me out of Seir, guard the ramparts of the Church, lest the enemy break in easily; lest the lion, roaring and going about, seeking an entrance by which he may get in, tear and scatter the flock shut up in the Church. And the multitude of the Church answered: Not only in prosperity but in adversity, that is, both by day and by night, I will keep your commandments, O God. To her God says: If you truly seek me, show by your works that you seek me; and let it not suffice you to have sought once, but seek always him whom you have found; and to hold him more perfectly, forget your people and your father's house, and, having forsaken the error of the Gentiles, abide with me in the Church. This we would say according to the Seventy, who put in the title the vision of Idumea, that is, of the earthly, to show that those are called who formerly served earthly works. Further, according to Aquila, who set down Dumah, that is, silence, or likeness, we can understand it thus: that the multitude of the nations is roused to the likeness of the people of Israel, and that where formerly there was silence of the law of God, there the cry of confession should be, and the wild olive be grafted into the good olive. We read also in the parable of the Gospel that servants were sent to call good and bad, and to fill the householder's banquet with whomsoever they found, because the first guests refused to come (Matt 22). The Church too can relate that the Lord cries aloud to her out of Seir, that is, out of earthly places, and calls her forth to salvation; and she may say to the Lord himself: O watchman, why, rising by night, do you dwell in darkness? Why are you, without sin, in the flesh of sin? For what reason did you will to take a human body? The watchman answered, that is, the Samaritan, who in the Gospel carried the wounded man on his shoulders to the inn (Luke 10): The morning comes, and the night. And the sense is: For the multitude of the nations the sun of righteousness has risen, and for the Jews darkness has come; according to what is said by the Lord: For the judgment of this world I have come, that those who do not see may see, and those who see may become blind (John 9:39). And the watchman himself, who had said, The morning comes, and the night, speaks to the multitude of the nations: If you seek me, seek more earnestly. Turn to me, you returning sons, and I will heal your bruises; and come to me. The passages are difficult, and since according to the history they are by no means plain, we are compelled to follow various opinions according to the ἀναγωγὴν.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
