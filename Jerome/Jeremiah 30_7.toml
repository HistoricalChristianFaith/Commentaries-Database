[[commentary]]
quote='''
Woe, for great is that day, nor is there any like it, and it is the time of the tribulation of Jacob! and from it he shall be saved. He foretells the time of misery in order to bring in the time of joy. 'Although,' he says, 'such great evils have gone before that the pain of all the men is compared to the pain of a woman giving birth, yet the time of the tribulation of Jacob, that is, of the people of God, will be changed into prosperity, and from it too he shall be saved' — 'time' is understood —, 'of which the discourse had spoken'. But by 'Jacob' understand the twelve tribes, which were saved by no means under Zerubbabel, as some falsely suppose, but by the calling of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
