[[commentary]]
quote='''
But fruits are not only in the body, but also in the soul. And when the body indeed serves the Lord, the soul also serves, and the body also serves God. "In a land untrodden and waterless, so did I appear to you in the sanctuary." "How manifoldly to you," he says, "does my flesh." See what he says: "How manifoldly to you does my flesh." How manifoldly? Let us not read πῶς ἁπλῶς (how simply), but ποσαπλῶς (in how many ways), that is, manifoldly. In many kinds does my flesh serve you: in fastings, in sleepings-on-the-ground (chameuniai), in tribulation, in distress, in hunger, in thirst, in cold. "How manifoldly to you does my flesh." What then serves the Lord manifoldly? "In a land untrodden and waterless." See what he says: untrodden, deserted, and waterless. See that this flesh cannot serve the Lord manifoldly except in a deserted land, in a deserted and waterless one, when the flesh is dry, when we are made as it were a wineskin in the frost, when all the moisture is dried up and burned away, when our flesh seeks not lust, but food. Our flesh, when it is parched, and is waterless, and has no moistures, seeks not wantonness, but seeks food. But when our land, which before had been dry, is watered with the water and rains of delights, it must needs bring forth and sprout, and he who is holy bears good fruits; but he who is a sinner, at once his land generates thorns. Why I say all this, the prudent hearer understands: because fastings profit much the Christian soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_033.html'
source_title="Homily 33, on Psalm 106"
