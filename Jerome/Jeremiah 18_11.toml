[[commentary]]
quote='''
Now therefore say to the man of Judah and to the inhabitant of Jerusalem, saying: These things — or thus — says the Lord: Behold, I am fashioning evil against you and devising a device against you; let each one turn back from his evil way, and make straight your ways and your pursuits! And they said: We have despaired — or we will be strong —; for we will walk after our own thoughts, and each one of us will do the depravity — or what has pleased his evil heart —. Therefore thus says the Lord: Ask among the nations: who has heard such horrible things as the virgin of Israel has done exceedingly? The Lord fulfills the parable which he had taught both by sight and by words, and says: 'Behold, I am fashioning evil against you, as a potter fashions clay' — evil, however, in the sense of Isaiah, who says: making peace and creating evil, not that it is evil in itself, but that it seems to be evil to those who suffer it — 'and devising a device against you' — that is, to pass sentence according to desert —; 'change your works and make straight your ways, so that the punishment too may be changed into prosperity!'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
