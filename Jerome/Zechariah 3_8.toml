[[commentary]]
quote='''
Those who want the high priest and his friends to be understood as the Lord Savior and his disciples take the men τερατοσκόπους, men who portend, in this way: they refer them to the apostles, who perceived his mystical signs and recognized the future from the present; while in the man who was blind from birth they interpret the restored eyes as concerning the people of the Gentiles, and in the woman with the flow of blood they explain the Church as set free from the works of blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
