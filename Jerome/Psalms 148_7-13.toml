[[commentary]]
quote='''
Praise the Lord from the earth. Since the angels have praised, the heaven has praised: let the earth also praise. Let us see which things of the earth praise first. Dragons and all deeps: fire, hail, snow, ice, the spirit of storms, which do his word: mountains and all hills, fruit-bearing trees, and all cedars: beasts, and all cattle, serpents and feathered fowl. After such great things, what is said? After the dragons, after the serpents, after the fire, after the hail, after the beasts and all the cattle? O man, you who seem to yourself so great, it is said of you: and not of the simple man, but of those men who are the greatest among men. Kings of the earth, and all peoples: princes, and all judges of the earth. Then there follows: Let young men and maidens, old men with younger ones praise the name of the Lord: for the name of him alone is exalted. And the rest that follows. Oh, how many mysteries are contained in these words!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
