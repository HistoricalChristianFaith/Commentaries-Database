[[commentary]]
quote='''
"For the Father does not judge anyone, but has given all judgment to the Son." But hearing this, do not be scandalized and say that the one who receives from the one who gives is lesser; but see what he says in the Gospel: "For the Father does not judge anyone, but has given all judgment to the Son: because he is the Son of man." He renders the reasons why he received judgment: because he is the Son of man. You hear "Son of man," and do you doubt why he received it?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_008.html'
source_title="Homily 8, on Psalm 74"
