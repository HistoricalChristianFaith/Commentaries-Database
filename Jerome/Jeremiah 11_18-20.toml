[[commentary]]
quote='''
But you, O Lord, have shown me and I have known; then you showed me their pursuits. And I was like a gentle lamb that is carried to be a victim, and I did not know that they had devised counsels against me: Let us put wood into his bread and crush him from the land of the living, and let his name be remembered no more! But you, O Lord of Sabaoth, who judge justly and test the reins and the heart, let me see your vengeance on them! For to you I have revealed my cause. This is the consensus of all the churches, that they understand these words to be spoken by Christ under the person of Jeremiah: that the Father showed him how he ought to speak, and showed him the pursuits of the Jews, and that he himself, like a lamb led to be a victim, did not open his mouth and did not know — 'sin' is understood, according to what is said by the Apostle: who, though he had not known sin, was made sin for us —, and that they said: Let us put wood into his bread — namely the cross into the body of the Savior; for he it is who says: I am the bread that came down from heaven, — and let us root him out — or crush him — from the land of the living! For this crime they devised in their mind, to blot out his name forever. But on the contrary, according to the mystery of the body he had assumed, the Son speaks to the Father and calls down his judgment, while he praises his righteousness and invokes God as the inspector of reins and heart, that he himself may render to the people what it deserves, and he says: let me see your vengeance on them — namely on those who persist in crime, and not on those who turn to repentance; of these he says on the cross: Father, forgive them; for they do not know what they do —, and he reveals to the Father and lays open his cause, that he was crucified through no fault of his own but by the crime of the people, saying: Behold, the prince of this world comes and finds nothing in me. The Jews and our Judaizers understand these words to be spoken in the person of Jeremiah, and they maintain that he endured these things from the people because of his prophecy of things to come and because of the impending evils of the captivity. But I do not know how they can prove that Jeremiah was crucified, since Scripture does not record it, unless perhaps they devised it and did not do it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
