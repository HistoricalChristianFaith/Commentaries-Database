[[commentary]]
quote='''
For the word of God is living and effective, and sharper than any two-edged sword, and piercing even to the joints of the soul, and of the bones, and of the marrows; which cuts through spirits and divides them, making much progress through the prayer and supplication of those who at all times entreat the Lord in the spirit, according to that text: I will pray with the spirit, I will pray also with the mind (1 Cor. 14:15); and making progress to this end, that through vigils and insistent prayer the Apostle may be enriched in the word and doctrine of God, and that all this wealth may serve the salvation of others, so as to benefit those very ones too who make supplication for him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
