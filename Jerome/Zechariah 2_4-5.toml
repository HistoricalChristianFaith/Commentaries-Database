[[commentary]]
quote='''
But we, according to the spiritual sense, interpret all these things of the Church, which is inhabited without a wall, or, as the Seventy translated, κατάκαρπος, that is, with an abundance of all fruits, and has a multitude of men and cattle, and the Lord is fire round about her, and he himself dwells in glory in her midst. This is the city of which we read elsewhere: Glorious things are spoken of you, city of God, and again: Great is the Lord and exceedingly to be praised, in the city of our God, in his holy mountain. Whoever dwells in her can say: But I am like a fruitful olive tree in the house of God, and: The Lord rules me, and I shall lack nothing; in a place of pasture, there he has set me. By the water of refreshment he has brought me up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
All these things the Jews think will come carnally under the ἠλειμμένῳ (anointed one), whom they promise themselves with the vainest hope: that Jerusalem will have such great blessedness that, because of the multitude of men and of all cattle, it cannot have a wall; but the defense of the Lord himself will be its wall, and it will enjoy the glory of him who dwells in its midst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
