[[commentary]]
quote='''
Because of this the earth will mourn, and everyone who dwells in it will languish; with the beast of the field and with the bird of the sky; and even the fish of the sea will be gathered up. LXX: Therefore the earth will mourn and will be diminished with all who inhabit it: with the beasts of the field, with the serpents of the earth, and with the fowls of the sky, and the fish of the sea will fail. Because there is no truth, and there is no mercy, and there is no knowledge of God upon the earth; but, over against these, cursing and lying, and murder and theft and adultery have flooded in, and blood has touched blood. Therefore the earth will mourn with its inhabitants, and will languish, so that it has no beasts of the field and birds of the sky, and the fish of the sea will fail. For when the captivity of the ten tribes has come, once the inhabitant has been taken away, the beasts too and the birds of the sky and the fish of the sea will fail, and even the mute elements will feel the wrath of the Lord. Whoever does not believe that this happened to the people of Israel, let him look at Illyricum, let him look at the Thracian provinces, Macedonia and the Pannonias, and all the land that stretches from the Propontis and the Bosphorus to the Julian Alps, and he will find it proved that, together with men, all the living creatures also fail which were formerly nourished by the Creator for the uses of men. But if we wish, as some think, to interpret the beasts as savage men, and the birds of the sky as those who are lifted up into pride and despise all human things, and the fish as those who are irrational, and so dull that they have no understanding at all, and do not see the free air and the sky; then this is the act of a Lord not so much angry as merciful, that the things which are evil should be taken away from the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
