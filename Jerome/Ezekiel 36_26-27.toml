[[commentary]]
quote='''
And I will give them,' he says, 'a new heart, which they had lost through sin, and I will renew a right spirit in their hearts, and I will take away the heart of stone, namely the unbelieving heart, and give a heart of flesh, soft and tender, which may receive the precepts of God, so that they walk in my precepts and do the judgments which they had formerly neglected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
