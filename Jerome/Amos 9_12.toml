[[commentary]]
quote='''
But if we choose to read according to the LXX: That the rest of men may seek me, and all the Gentiles upon whom my name has been invoked, we ought to take as the rest of men those who believed from the Jewish people, and who, like little stones, did not fall through the sieve, nor were cast out with the dust and the chaff and the filth. For a remnant will be saved at the beginning of the faith, and at the end of the world, so that when the fullness of the Gentiles has come in, then all Israel may be saved. And the name of the Lord which is invoked upon the remnant and upon all the Gentiles is that of which the Savior says: Father, I have revealed your name to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
