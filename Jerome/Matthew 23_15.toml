[[commentary]]
quote='''
Or otherwise; The Scribes and Pharisees compassed the whole world to make proselytes of the Gentiles, that is, to mix the uncircumcised stranger with the people of God.

Or, because before while he was a Gentile he erred in ignorance, and was only a child of hell; but seeing the vices of his masters, and understanding that they destroyed in their actions what they taught in words, he returns to his vomit, and becoming a Gentile, he is worthy of greater punishment as one that has deserted his cause.

He is called a child of hell in the same way as one is said to be a child of perdition, and a child of this world; every man is called the son of him whose works he does.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Woe to you, scribes and Pharisees, hypocrites, because you go around sea and dry land to make one proselyte, and when he has been made, you make him a son of Gehenna twice as much as yourselves. We do not keep what we have sought with the same zeal with which we seek it. The scribes and Pharisees, traversing the whole world for the sake of trade and various gains, to be captured as much from their disciples as through a show of holiness, made it their zeal to make a proselyte from the Gentiles, that is, to mingle a stranger, an uncircumcised man, with the people of God. But he who before, while he was a heathen, went astray in simplicity and was a son of Gehenna once, seeing the vices of his teachers and understanding that they destroy by deed what they taught by words, returns to his vomit and, having become a Gentile, will be worthy of greater punishment as a transgressor. He is called a son of Gehenna in the way one is called a son of perdition and a son of this world. For each one is called the son of him whose works he does.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
