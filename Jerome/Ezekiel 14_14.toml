[[commentary]]
quote='''
— It is asked, since Abraham and Isaac and Jacob, Moses too and the other patriarchs and prophets, were righteous, why mention is made of these alone; which is easily resolved: for Noah could not put off the flood impending over the world, because all the earth had polluted the ways of the Lord, but he had his sons preserved, who perhaps were of the same virtue, and also for the sake of a seedbed of the human race; Daniel too softened by no weeping the captivity impending over the people of the Jews; and Job as well, not on account of sins but for the sake of testing, delivered neither his house nor his sons. Others, however, say that because these three men alone beheld both prosperity and adversity and prosperity again, they are for that reason named together, and that this is secretly signified: that, just as they saw both good things and evil and again joyful things, so also the people of Israel, which had first enjoyed good things and afterward bore the yoke of captivity, if it does penance, returns to its former happiness. —
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
