[[commentary]]
quote='''
We must enquire how they could come to Him at that time when Jesus was sitting in the ship; we may understand that they had at the first entered into the ship, and standing there, made this enquiry of Him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the disciples came and said to him. It must be asked how the disciples come to him when Jesus is sitting in the ship, unless perhaps we are given to understand that some time before they had gone up into the ship with him and, standing there, had inquired about the interpretation of the parable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
