[[commentary]]
quote='''
But if the judgment of the Lord is with the nations, the merits of the nations too are diverse. This serves to expound that passage, as some would have it: he who does not believe is already judged. He is judged indeed in that he did not believe; but those very ones who do not believe will be afflicted with punishments that differ among themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
