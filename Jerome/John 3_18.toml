[[commentary]]
quote='''
But if the judgment of the Lord is with the nations, the merits of the nations too are diverse. This serves to expound that passage, as some would have it: he who does not believe is already judged. He is judged indeed in that he did not believe; but those very ones who do not believe will be afflicted with punishments that differ among themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
We read in the Gospel according to John: 'Whoever believes in me shall not be judged; whoever does not believe in me is already judged.' Who then is to be judged, if both he who believes shall not be judged, and he who does not believe is already judged? Who shall be judged on the day of judgment? Let us seek, then, a middle one between the believer and the unbeliever, who is to be judged. He who believes shall not be judged. He who believes does not sin, he who truly believes does not sin, he who has true faith does not sin. Indeed when we sin, our mind wavers in faith; at that time when we sin, when we grow angry, when we disparage, when we commit murders, when we fornicate, where is faith? Therefore what he says, He who believes in me, shall not be judged; for he has no need to be judged, he is already blessed. But he who does not believe, is already judged; for he is already prejudged unto punishment. Who then is judged? He who believes indeed, but is overcome by sins: he who has good things, has also evil things: he who at the time when he believes does well, and at the time when he does not believe does ill.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_001.html'
source_title="Homily 1, on Psalm 1"
