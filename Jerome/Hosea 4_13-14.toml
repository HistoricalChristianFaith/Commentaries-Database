[[commentary]]
quote='''
It is a grave displeasure, after you have sinned, not to merit the wrath of the Lord. Israel had played the harlot away from the Lord his God and been led astray by a spirit of fornication; therefore his daughters and brides also play the harlot and are left in their crime without any punishment, so that what the sons and the wife had done to their true parent and husband, they may feel in their own children and wives, and from their own pain understand the pain of God, who is so angry that he does not strike the offenders at all. The Apostle too, writing to the Romans, testifies to this in mystical speech: For, saying that they were wise, they became fools; and they changed the glory of the incorruptible God into the likeness of the image of corruptible man, and of birds, and of four-footed beasts, and of serpents. And because they had played the harlot with idols, they are struck with such a sentence: For this reason God gave them up to the desires of their heart, to uncleanness, so that they dishonor their bodies among themselves, who exchanged the truth of God for a lie; and they worshipped and served the creature rather than the Creator, who is blessed for ever. Amen. But that we may know that visitation is brought by God, as upon the wounded and the sick, for this purpose, that as by cautery and most bitter potions they may recover health and be free of diseases, let us hear God speaking through the prophet: I will visit their iniquities with the rod, and their sins with stripes; but my mercy I will not scatter from him. He, therefore, who is loved is corrected; he who is neglected is left to his sins. And so great was the number of fornicators in Israel that the vengeance was one that despaired of amendment. For what is more shameful than for men to be joined to the worship of harlots, and with the effeminate to offer the victims of their own lust? But what he adds: the people that does not understand will be beaten; for which the Seventy translated: And the people that understands clung to the harlot; this signifies that Israel is beaten in captivity and afflicted with various blows, so that through pain it may receive discipline. Concerning the heretics the understanding is easy: their daughters and brides play the harlot, that is, the souls which they have begotten in error and betrothed to their own dogmas. Men of this kind are unworthy of God's correction, since all their worship is fornication, and the shameful are mingled with the shameful; and therefore they will be beaten, so that at some time through blows they may understand what God they should seek. When you see a sinner abounding in riches, boasting of his power, rejoicing in health, delighting in his wife, surrounded by a crown of children, and that which is written being fulfilled: They are not in the labor of men, and with men they will not be scourged, say that in him the prophet's threat has been fulfilled: I will not visit upon your daughters when they have played the harlot and upon your brides when they have committed adultery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
