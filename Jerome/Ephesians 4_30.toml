[[commentary]]
quote='''
As for what follows: Her prophets πνευματοφόροι, that is, bearing the spirit, men who are despisers, let it disturb no one that, interpreting this of teachers, we call the same men both prophets and despisers, since the Apostle too commands: Do not grieve the Holy Spirit of God, in whom you were sealed in the day of redemption. And David says in Psalm 50 (51): Do not take your Holy Spirit from me. For unless the Holy Spirit, when grieved, were accustomed to flee his former lodging and to abandon his dwelling, Paul would never have commanded what I said above, nor would David after his adultery have dreaded lest he lose what he had received; of which it is also written to the Hebrews: How much worse punishments do you think he deserves who has trampled on the Son of God, and has held unclean the blood of the covenant, in which he was sanctified, and has done insult to the spirit of grace?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"

[[commentary]]
quote='''
And do not grieve the Holy Spirit of God, in whom you were sealed in the day of redemption.

The grief of the Holy Spirit is to be understood in the same way as the anger of God and his sleep, and the other passions spoken of after the likeness of human beings. Not that the Spirit is saddened, or that the Godhead feels any disturbance; but that from our own words we may learn the affections of God: that he grieves as often as we sin, and weeps over sinners. For the Savior too, when he was set in the body, wept over Jerusalem (Luke 19), and in the prophet he laments the whole race of men, saying: Woe is me, O soul, for he who returns has perished from the earth. And there is none among men to set things right: all are judged in blood (Mic. 7). And in Ezekiel, recounting the deeds of the once holy city, he says: In all these things you grieved me (Ezek. 16:43). But we have been sealed with the Holy Spirit of God, so that both our spirit and our soul may be stamped with the seal of God, and we may receive again that image and likeness after which we were made in the beginning. This seal of the Holy Spirit, according to the Savior's utterance, is sealed with God doing the stamping. For him, he says, God the Father has sealed (John 6:27). Therefore everyone is sealed by the Father with the Holy Spirit who, from the fact that he has believed God, has set his seal that God is true. And he is sealed for this reason: that he may keep the seal and show it in the day of redemption pure and unalloyed and in no part mutilated, and on that account be able to be numbered with those who have been redeemed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
