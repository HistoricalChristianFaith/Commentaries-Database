[[commentary]]
quote='''
That we have been "sealed" with the Holy Spirit means that both our spirit and our soul are impressed with God's own seal, signifying that we belong to him. By this we receive in ourselves that image and likeness in which we were created at the outset.… You are sealed so that you may be preserved to the end. You may show that seal on the day of redemption, pure and unblemished and not damaged in any part. You are thereby ready to be counted with those who are redeemed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians 4:30"

[[commentary]]
quote='''
As for what follows: Her prophets πνευματοφόροι, that is, bearing the spirit, men who are despisers, let it disturb no one that, interpreting this of teachers, we call the same men both prophets and despisers, since the Apostle too commands: Do not grieve the Holy Spirit of God, in whom you were sealed in the day of redemption. And David says in Psalm 50 (51): Do not take your Holy Spirit from me. For unless the Holy Spirit, when grieved, were accustomed to flee his former lodging and to abandon his dwelling, Paul would never have commanded what I said above, nor would David after his adultery have dreaded lest he lose what he had received; of which it is also written to the Hebrews: How much worse punishments do you think he deserves who has trampled on the Son of God, and has held unclean the blood of the covenant, in which he was sanctified, and has done insult to the spirit of grace?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
