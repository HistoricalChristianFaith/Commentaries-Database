[[commentary]]
quote='''
And he shall stand and feed in the strength of the Lord, in the loftiness of the name of the Lord his God, and they shall be converted, for now he shall be magnified to the ends of the earth. LXX: And he shall stand and see, and the Lord shall feed his flock in strength, and they shall be in the glory of the name of the Lord their God, for now they shall be magnified to the ends of the earth. After the sun of justice has gone forth from the height of the heavens and has come to their ends, and she who brings forth has brought forth, and the remnant of his brothers has been converted to the sons of Israel, then the Lord himself, who before was walking, and, together with those who were set on the road, did not yet have a fixed step, will stand and feed them in the strength of the Lord, so that they can say: The Lord feeds me, and I shall lack nothing; in a place of pasture, there he has set me; by the waters of refreshment he has nourished me; he has converted my soul. And he feeds them not only in the strength of the Lord, but also in the loftiness of the name of the Lord his God, when he says to the Father: Holy Father, keep in your name those whom you have given me, that they may be one, even as we are. When I was with them, I kept them in your name; those whom you have given me I have guarded, and none of them has perished. And they shall be converted, or, as Symmachus has better rendered it, they shall dwell; for the Hebrew word iasubu signifies both. And they shall dwell in the Church of the Lord, because Christ has been magnified to the end of the earth. Or, according to the LXX, because they themselves shall be magnified with their shepherd to the uttermost part of the earth, so that into all the earth there may go out their sound, and their words to the ends of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
