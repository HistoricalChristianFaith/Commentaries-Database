[[commentary]]
quote='''
Behold, I will give this city into the hand of the king of Babylon, and he shall take it. And Zedekiah, king of Judah, shall not escape from the hand of the Chaldeans, but shall be delivered into the hand of the king of Babylon, and his mouth shall speak with his mouth, and his eyes shall see his eyes. And he shall lead Zedekiah into Babylon, and there he shall be until I visit him, says the Lord. But if you fight against the Chaldeans, you shall have nothing prosperous. This was the cause of the king's anger: that he preferred truth to a lie, and said that both the city of Jerusalem and King Zedekiah were to be taken; and, what is more grievous, that he would see the face of the Babylonian king and, humbled and captive, would speak with the madness of a most violent king. For it is a heavier terror to see the one you fear, and to undergo the rebuke of words before the torment of punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
