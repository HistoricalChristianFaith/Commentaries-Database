[[commentary]]
quote='''
Therefore, before God led us out of the land of Egypt, out of the iron furnace, he destroyed before our face the Amorite, who is called bitter, or λαλητὸς, that is, speaking, or famous and celebrated in frequent talk. Now this Amorite and king of the Amorites is called Sihon, an unfruitful and barren tree, not because it bears no fruit, but because it brings forth bad fruit, of which it is said: Every tree that does not bear good fruit will be cut down and cast into the fire. And of the false prophets we read: Who come in the clothing of sheep, and inwardly are ravening wolves; by their fruits you will know them, by their bad fruits, that is. Whether, then, it bears no fruit, or bears fruit but not good fruit, it is called an unfruitful tree. This Sihon, of whom it is written: Already the axe is laid to the roots of the trees, because he was an unfruitful tree, was cut down when the Lord struck him; his height is compared to the height of the cedars, of which we read: I saw the wicked man exalted on high and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not; and I sought him, and his place was not found. And he fittingly says that he passed by, because from him who passes over from the world, and can say: Passing over, I will see this great vision, the cedar is taken away, and the place of pride cannot be found. His strength too, like that of the oak, a tree most hard and most strong. From its name Philo, the most eloquent man of the Hebrews, thinks that Esau was called δρύινον, that is, oaken and made of hard oak, although Esau can also be understood as ποίημα, that is, a thing made, so as to be referred to evil works. Of this strong and sturdy one he speaks in the Gospel: When a strong man armed guards his court, the things he possesses are in peace; but if one stronger than he comes upon him and overcomes him, he will take away all his armour, in which he trusted, and will distribute his spoils. And the Lord granted us that he should crush from above the fruits of this Amorite Sihon, whose name we said means an unfruitful tree, because they were bad, and take them away, lest anyone, thinking them good, should eat and perish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
