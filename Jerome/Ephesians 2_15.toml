[[commentary]]
quote='''
The law of commandments too has been overturned in decrees: after circumcision, and the sabbath rest which remains for the people of God, and the Passover, and Pentecost, and not appearing empty in the sight of God, came to be understood more deeply than they sound, and we, withdrawing from the letter that kills, began to follow the spirit that gives life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
And as to his saying: That he might create the two in himself into one new man, which seems rather to fit the earlier sense concerning Jews and Gentiles: he would fit it to his own understanding thus, saying that man, made according to the image and likeness of God, will after the reconciliation receive back the same form which the angels have even now and which he himself lost. And he says that the new man is the one who is renewed daily and is to dwell in a new world, when there will be a new heaven and a new earth (Isa. 65), and is to drink the new cup of Jesus in the kingdom of God (Mark 14), and to sing a new song (Ps. 32:3 and 97:1), and will rejoice in the reading of the Old and the New Testament. That too which is written elsewhere: Behold, I make new things, which shall now spring forth (Isa. 43:19), he will take in such a way as to judge that the beginning of the renewal takes place in the present age; but he will think that the perfect and consummated newness cannot yet be fulfilled in this age. And just as now we see through a mirror in an enigma, but then face to face (1 Cor. 13), so too he will think that the restoration of the new man is to be fulfilled fully and perfectly then, when heavenly and earthly things have been joined together and we have drawn near to the Father in one spirit, and mind, and the same judgment. Something like this Paul hints to every prudent reader in another Epistle too (if anyone, that is, accepts it), saying: All these, receiving the testimony of faith, did not obtain the promise, God providing something better for us: that they should not be made perfect without us (Heb. 11:39, 40). For this reason also the whole creation groans together with us who groan in this tabernacle, and suffers pain together with us who from the fear of God have conceived in the womb and are in pain, and we await the revelation of the sons of God: that it may be set free from the vanity of the servitude to which it is now subjected, and there may be one shepherd and one flock; and the Prayer of the Lord may be fulfilled, who says: Your will be done as in heaven and on earth (Matt. 6:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
