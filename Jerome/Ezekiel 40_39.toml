[[commentary]]
quote='''
And two tables were set on each side, so that first the holocaust may be sacrificed, which the sacred fire consumes wholly, then the offering for sin, and lastly that for ignorance: for what we have committed either knowingly or in ignorance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
