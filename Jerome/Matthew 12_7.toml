[[commentary]]
quote='''
What I will have mercy, and not sacrifice, signifies, we have explained above. The words, Ye mould never have condemned the innocent, are to be referred to the Apostles, and the meaning is, If ye allow the mercy of Achimelech, in that he refreshed David when in danger of famishing, why do ye condemn My disciples?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But if you knew what this is: I desire mercy and not sacrifice, you would never have condemned the innocent. What I desire mercy and not sacrifice, means, we have said above; but what follows, you would never have condemned the innocent, is to be understood of the apostles, and the sense is: If you approve the mercy of Ahimelech, because he refreshed David, who was in peril from hunger, and his young men, why do you condemn my disciples, who have done nothing of the kind?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
