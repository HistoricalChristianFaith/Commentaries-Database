[[commentary]]
quote='''
And he so questions them and challenges them to answer, as to teach by questioning what they do not know: Who raised up the righteous one from the East, or righteousness? For he is not the God of the Jews only, but also of the nations, who called Christ the Lord, the Savior, who was made for us wisdom from God, righteousness and sanctification and redemption (1 Cor 1); in whom, according to the same Apostle, the righteousness of God is revealed (ibid.). And he called him to follow him in all things and to do the works of the Father, and to fulfill that which he says: O God, I have willed to do your will (Ps 39 [40]:9). In his sight kings and nations will bow their necks, and to his sword and arrows the adverse powers will be made subject like stubble and dust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
