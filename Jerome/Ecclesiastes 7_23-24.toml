[[commentary]]
quote='''
Your thoughts have been made exceedingly deep. Whatever I may think, I cannot find it out. "Your judgments are an abyss." "O the depth of the riches of the wisdom and knowledge of God." I too will say with Ecclesiastes: "I said, I will become wise: and it was made far from me, much farther than it was; and it is deep — who can find it out?" What Ecclesiastes says is this: Before I put my thought to the work, I did not see the magnificence of God. I said, I will become wise, that is, I said, I ought to seek out the reasons of the individual causes; and it was made far from me, much farther than it was, that is, the wisdom which before, not searching, I was ignorant of, afterwards I began to seek, and I could not find it out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_021.html'
source_title="Homily 21, on Psalm 91"

[[commentary]]
quote='''
All these things I have tried in wisdom, and I said: I will become wise; and she became farther from me than she was; and a deep depth, who will find it? He says that, as the books of Kingdoms also testify, he sought wisdom beyond all men and tried to reach her end, but that the more he sought, the less he found, and was sunk in the midst of gloom, surrounded by the darkness of ignorance. Besides, one who has been learned in the Scriptures, the more he begins to know, the greater the obscurity that daily arises for him in them. Otherwise: The contemplation of wisdom in this life is seen in a mirror and in an image; when, then, I reflect that in the future her knowledge is to be revealed face to face, then I shall clearly recognize that I am now far removed from her knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
