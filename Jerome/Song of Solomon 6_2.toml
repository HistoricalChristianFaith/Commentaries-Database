[[commentary]]
quote='''
Let us turn the Jewish cauldrons, in which the flesh of the victims was cooked, into bowls of spices before the altar of the Lord, of which the bride says to the bridegroom: My kinsman has gone down into my garden, to the bowls of spices, to feed in the gardens and to gather lilies. The garden and paradise into which the bridegroom goes down to the bride is the reading of the holy scriptures, from which he plucks lilies and violets and roses and various spices, to fill the bowls of believing souls and to pour out libations to the Lord from them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
