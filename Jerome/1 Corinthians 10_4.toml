[[commentary]]
quote='''
For the Lord redeemed his servant Jacob with his most precious blood, and led him through the desert of the world, and split water from the rock. Concerning which the Apostle too says: And the rock was Christ (1 Cor 10:4). And the divine word is split, and divided into many parts, so that what we cannot receive whole we may take in parts. And lest this preaching should be thought to be spoken to all the seed of Jacob, and not only to those who were to believe through the Apostles, there is added and joined: There is no peace for the wicked, says the Lord: that is, to those who remained in their former error; who did not deserve to drink from the rock. Whose side, to speak in a new way, wounded by the lance, flowed with water and blood (John 19), consecrating for us baptism and martyrdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
