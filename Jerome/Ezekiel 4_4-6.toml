[[commentary]]
quote='''
And you shall sleep on your left side, and you shall place the iniquities of the house of Israel upon it by the number of the days in which you sleep upon it, and you shall take up their iniquity. But I have given you the years of their iniquity by the number of days, three hundred and ninety days, and you shall bear the iniquity of the house of Israel. And when you have completed these, you shall sleep on your right side a second time, and you shall take up the iniquity of the house of Judah for forty days; a day for a year, a day, I say, for a year I have given you. We ask what the three hundred and ninety years are, which are reckoned in place of as many days, during which the prophet slept on his left side, bound and constrained so that he would not move onto his other side, showing the captivity and miseries of the ten tribes, that is, of Israel; and what the other forty years are, during which he lay on his right side for Judah and its iniquities, or, as Holy Scripture relates, slept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
— Just as, therefore, in Israel, that is, in the ten tribes, from Pekah king of Israel, under whom Shalmaneser laid waste much of the Israelite people, to the fortieth year of Ahasuerus, when the persecution of the whole Jewish people was eased, we reckon three hundred and ninety years, so from the first year of Jeconiah, when a great part of Jerusalem was carried over to Babylon, to the first year of Cyrus king of the Persians, which was the thirtieth year of the temple's desolation, forty years are reckoned; under him the captivity of the Jews was relaxed and liberty given back to the people. — Some, joining the three hundred and ninety years of Israel and the forty of Judah, make four hundred and thirty years, and hold that they are fulfilled from the baptism of the Savior to the consummation of the world. Others, however, and above all the Jews, want the four hundred and thirty years, during which the people is set in tribulation and distress and under the yoke of captivity, to be reckoned from the second year of Vespasian, when Jerusalem was taken by the Romans and the temple overthrown; and that then the people will return to its former state, so that, as the sons of Israel were in Egypt four hundred and thirty years, so the last captivity too may be ended in the same number; and that it is written in Exodus: Now the dwelling of the sons of Israel, in which they dwelt in the land of Egypt, was four hundred and thirty years, and again: It came to pass after four hundred and thirty years, all the army of the Lord went out by night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
