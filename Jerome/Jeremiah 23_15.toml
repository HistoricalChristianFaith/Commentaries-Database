[[commentary]]
quote='''
Therefore thus says the Lord of hosts to the prophets: Behold, I will feed them with wormwood — or with pains, and according to Symmachus with bitterness — and I will give them gall to drink — or bitter water —, for from the prophets of Jerusalem pollution has gone forth into all the land. Let us use this testimony against those who send out into the world letters full of lies and fraud and perjury, so as both to pollute the ears of the hearers and to injure the reputation of the simple: that what is written is fulfilled in them: from the prophets of Jerusalem pollution has gone forth into all the land; for it is not enough for them to devour their own iniquity and to injure their neighbors, but those whom they have once hated they try to defame throughout the whole world, and to sow blasphemies everywhere.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
