[[commentary]]
quote='''
Armageddon: rising up of the roof, or rising up into the former things. But better: a mountain from the brigands, or a round mountain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Apocalypse of John"
