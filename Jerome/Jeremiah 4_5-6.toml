[[commentary]]
quote='''
Declare in Judah and make it heard in Jerusalem; speak, sound the trumpet in the land, cry aloud, say: gather together, and let us enter the fortified cities. Let 'Iudas' hear this, let 'Hierusalem' hear this, in which is the 'confession' of faith, and in which the 'peace' of Christ dwells, and to which it was said through Isaiah: go up onto a high mountain, you who bring good tidings to Zion; lift up your voice, you who bring good tidings to Jerusalem; let it cry aloud and give command thus: 'let us enter the fortified cities — the wars of the heretics are rising: let the fortifications of Christ hold us — ; raise the standard of the cross on the watchtower and on the height of the Church; be strong, you who fear, do not stand still, but run to the help of Christ; for evil,' he says, 'I bring from the north, and great destruction, the true Nebuchadnezzar, who is permitted by me to exist in this world for this very reason, that your strength and victory may be proved'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
