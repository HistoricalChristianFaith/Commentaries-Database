[[commentary]]
quote='''
For I have inebriated the weary soul — or for I have inebriated every thirsting soul — and every hungering soul I have satisfied — or I have filled —, therefore I awoke and saw, and my sleep was sweet to me. The change of persons makes the understanding of the prophets obscure. The Lord had said: they shall still say this word in the land of Judah and in its cities, when I turn back their captivity. And what shall they say? No doubt this, which follows: the Lord bless you, beauty of righteousness, holy mountain, and the rest. And again, while they say these things, the Lord answers: for I have inebriated the weary soul — or thirsting — and every hungering soul I have satisfied. And while he says these things, the people that had come from captivity answers: therefore I awoke and saw, and my sleep was sweet to me. For the Lord inebriates the weary or thirsting soul, and says in the Gospel: whoever thirsts, let him come to me and drink, and: whoever believes in me, as the Scripture says, out of his belly shall flow rivers of living water; and he satisfies every hungering and thirsting soul, of which thirst and hunger the same testifies in the Gospel: blessed are those who hunger and thirst for righteousness, for they shall be satisfied. And it is to be noted that 'inebriation' in this place is put in a good sense, of which in the Canticle too it is said: eat, friends, drink and be inebriated, dearest ones! With this inebriation Joseph too was inebriated with his brothers at midday.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
