[[commentary]]
quote='''
Then the virgin shall rejoice in the dance — of whom the Apostle writes: for I have betrothed you to one husband, to present a chaste virgin to Christ — and the young men — to whom John speaks: I write to you, young men, because you have overcome the evil one — and the old, to whom the same testifies in mystical speech: I write to you, fathers, because you have known him who is from the beginning. And I will turn, he says, their mourning into joy — so that the resurrection may gladden those whom the cross had terrified — and I will console them and make them glad from their sorrow — according to what the Lord says: blessed are those who mourn, for they shall be consoled — and I will inebriate the soul of the priests, who have the knowledge of God, from whose mouth they ask the law of the Lord, who believe in him to whom the prophet sings: you are a priest forever according to the order of Melchizedek. But what follows according to the Seventy: of the sons of Levi, is not found in the Hebrew, and it is clear that here it is not at all said of those priests who are sons of Levi, but of those in whose type Melchizedek went before. And the 'inebriation' of the priests is proved in the apostles too, when they were fervent in faith and were said to be full of new wine; whence also the place in which the Lord was seized is called 'Gessemani', which in our language sounds 'valley of fatness'. And when the priests have been made fat with the teaching of the Lord and, inebriated at the banquet of Joseph, have said: your cup that inebriates, how excellent it is!, then this too will come about which the Lord now promises: and my people shall be filled with my good things. All these things are now granted in part; but then they will be given in full, when we see face to face and the body of our lowliness has been changed by the glory of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
