[[commentary]]
quote='''
To-morrow in Scripture signifies time future, as Jacob in Genesis says, To-morrow shall my righteousness hear me. (Gen. 30:33.) And in the phantasm of Samuel the Pythoness says to Saul, To-morrow shalt thou be with me. (1 Sam. 28:19.) He yields therefore unto them that they should care for things present, though He forbids them to take thought for things to come. For sufficient for us is the thought of time present; let us leave to God the future which is uncertain. And this is that He says, The morrow shall he anxious for itself; that is, it shall bring its own anxiety with it. For sufficient for the day is the evil thereof. By evil He means here not that which is contrary to virtue, but toil, and affliction, and the hardships of life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do not be anxious about tomorrow. So he who forbids us to think of the future has granted that we ought to be anxious about the present. Hence the Apostle too: Night, he says, and day laboring with our hands, so as not to burden any of you. In the Scriptures tomorrow is understood as the time to come, as Jacob says: And my justice will hear me tomorrow; and in the apparition of Samuel the pythoness says to Saul: Tomorrow you will be with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Sufficient for the day is its own evil. Here he has set down evil not as the contrary of virtue, but as the toil and affliction and straits of the world, just as Sarah too afflicted Hagar her maidservant; which is expressively said in Greek ἐκάκωσεν αὐτήν (she did her evil, i.e. ill-treated her). So the thought of the present time is enough for us; let us leave aside the care of things to come, which is uncertain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
