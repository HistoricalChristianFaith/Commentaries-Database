[[commentary]]
quote='''
And into Babylon, he says, he shall lead Zedekiah, and there he shall be, for which the Seventy translated: and he shall enter Babylon; of which the one signifies being dragged unwilling, the other going of one's own will. And there, he says, he shall be: he puts an ambiguous word, so as not to seem to prophesy tortures and miseries. And what follows: until I visit him, says the Lord. And if you fight against the Chaldeans, you shall have nothing prosperous, is not in the Seventy. And he prudently tempered the sentence, which can be referred to a good and to a bad sense; for 'visitation', as I have often said, signifies both 'consolation' and 'punishment'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
