[[commentary]]
quote='''
These are the coals which, as a remedy for the tongue and for lying, laying waste vices and sins, the prophet, when questioned, longs for: What shall be given to you, and what shall be added to you against a deceitful tongue? The sharp arrows of the mighty, with desolating coals; and we shall be able to find many things of this kind in the holy Scriptures, of which we have often spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
