[[commentary]]
quote='''
These are the coals which, as a remedy for the tongue and for lying, laying waste vices and sins, the prophet, when questioned, longs for: What shall be given to you, and what shall be added to you against a deceitful tongue? The sharp arrows of the mighty, with desolating coals; and we shall be able to find many things of this kind in the holy Scriptures, of which we have often spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And in the psalm the deceitful tongue, full of lies, is said to need purging by the fire of coals: What shall be given you, or what shall be added to you, against a deceitful tongue? The sharp arrows of the mighty, with desolating coals. Of these coals of the altar, the desolating coal is taken up with the tongs of the two testaments, and purges the unclean lips of Isaiah, so that he can prophesy the word of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
