[[commentary]]
quote='''
Alternatively: All the things written above you shall suffer, O bloody, earthly, cruel Edom, because by a false and deadly doctrine, one that speaks impiety against God, you have slain your brother Jacob. We read in Solomon: There are those who speak and slay with the sword. And in another place: The venom of asps is under their lips, and: Their tongue is a sharp sword. Confusion therefore shall cover you, and you shall say: The confusion of my face has covered me, and you shall perish, not for a short time, but for ever. For, as far as lay in you, you struck your brother with an everlasting wound.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
