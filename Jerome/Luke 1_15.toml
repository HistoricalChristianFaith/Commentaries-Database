[[commentary]]
quote='''
Drunkenness, moreover, can come about as much from wine as from the other kinds of drink that are prepared in various ways; whence it is also said of the saint: "He shall not drink wine and strong drink (siceram)" (Luke 1:15). Sicera means "drunkenness". And lest anyone who does not drink wine should think that something else might be drunk by him, the pretext is excluded, since everything that can make drunk is taken away together with wine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
