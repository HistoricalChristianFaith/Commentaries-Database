[[commentary]]
quote='''
Tyre means tribulation, or one who hems in; and every perverse doctrine strives to seize the truth, and to shut it up in earthly senses, and it did not remember the covenant of its brothers, that we ought to ascend from the letter to the spirit, from earthly things to heavenly ones; and that it is a precept for us to write out the sacred Scripture in our heart threefold. But God will send fire upon all the fortifications of Tyre, which will devour not only its walls but also its foundations. Concerning the captivity of Solomon, in place of which the Hebrew has consummate and perfect, we have spoken above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
