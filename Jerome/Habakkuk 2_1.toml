[[commentary]]
quote='''
I will stand upon my watch, and fix my step upon the fortification, and I will look out, to see what is said to me and what I may answer to the one who reproves me. LXX: I will stand upon my watch, and I will go up upon the rock, and I will look out, to see what he speaks in me, and what I may answer to my correction. Symmachus has followed it out more plainly: Like a watchman I will stand upon the lookout, and I will stand as one shut in, and I will look out, to see what is said to me, and what I may answer, and gainsay against the one who reproves me. For fortification and rock, in place of which Symmachus translated shut in, there is put in the Hebrew masur, which Theodotion translated circuit, Aquila and the Fifth Edition compass. To the first complaint the Lord had answered: Look among the nations and see, and wonder and be astonished. To which the prophet, as though doing penance for what he had said before, had indeed moderated his question, saying: O Lord my God, my Holy One, and we shall not die. But nonetheless, with veneration and praises of God, he had questioned him: Your eyes are pure, so that you do not see evil, and you do not know how to look upon iniquity. Why do you not look upon those who do iniquitous things, and are silent, while the wicked devours one more just than himself? And what the devouring of the just would be, he has set out in its parts: that men would become like the fish of the sea, and like creeping things; and that with his hook, and dragnet, and net all would be dragged to destruction, and there would be no end of their slaughter. Therefore, because he is a prophet, and asks for this reason, and says he is in doubt so that what was answered to him might be answered to all: I will stand, he says, upon my lookout, that is, upon the height of my prophecy, and I will see what follows after the captivity of the people and the overthrow of the city and temple, and thereafter. Or certainly thus: I will guard my heart with all diligence, and I will stand upon Christ the rock. And with this circuit and compass I will be fenced as with a wall, so that the roaring lion may not be able to break in upon me, and I will see what God answers me after my second question, and, after he has answered me and rebuked me for having complained wrongly, what I too ought to answer him. But elegantly and with wonderful sense he describes human impatience, which we are always accustomed to show in disputes, so that before anyone on the opposing side answers us, and we know in what he has reproved us, we are made ready to answer. From this it is shown that the answer is not of reason but of contentiousness. For if it were reason, the answer ought to have been awaited, and so he should see whether he ought to reply, or to assent to a reasonable answer. But this too is to be noted from what he had said: To see what he speaks in me, that the prophetic vision and the utterance of God come to the prophets not from without, but within, and answer to the inner man. Whence Zechariah also: And the angel, he says, who spoke in me. And in the psalms: I will hear what the Lord speaks in me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
