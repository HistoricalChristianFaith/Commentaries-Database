[[commentary]]
quote='''
God says to Abraham: 'Go forth from your land and from your kindred.' He came into Palestine, was in Abramium, was in Gerara a long time. When a son, Isaac, had been born to him, and he had received the promise 'That in your seed all the nations shall be blessed,' he took Isaac, and offered him to God, and a voice from heaven was heard, Spare your son. And immediately it is written there, at the time when he had offered his son, what does God say to Abraham? 'Now I have known that you fear the Lord your God.' You who had spoken for so long a time, have you now come to know Abraham? But because great faith had been shown in offering his son, therefore now for the first time God began to know him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_001.html'
source_title="Homily 1, on Psalm 1"
