[[commentary]]
quote='''
From of old you have broken my yoke — or your —, you have burst my bonds — or your — and said: I will not serve. For on every lofty hill and under every leafy tree you lay prostrate as a harlot or there you poured yourself out in fornication. He speaks to Israel as to a harlot, because she broke the marriage covenant and said: I will not serve — 'the Lord' or 'the husband' is understood —, but on every lofty hill and under every leafy tree lay prostrate to idolatry; for pleasant and lofty places are always dedicated to idols. This can also be said to him who, a Christian from the beginning and in part instructed in the sacred letters, afterwards, through desire for secular literature, which is signified in the hills, and for the pleasant things of eloquence, which are shown in the leafy trees, prostrates himself to demons, who, under the pretext of learning and lofty knowledge, pollute the souls of believers and make them spread their feet for every passer-by.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
