[[commentary]]
quote='''
And though they have promised these things, their counsel will not be able to come to completion; but it will be a counsel of confusion and ignominy for their house, after the very end of things has shown to be false what had been promised, when it is proved to be a counsel of confusion, not of salvation. This teacher of perversity, as we have said, has consumed many peoples, and the more he had in his company, the more he sinned against his own soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
