[[commentary]]
quote='''
And this one shall be peace: when the Assyrian comes into our land, and when he treads in our houses. LXX: And this shall be peace: when the Assyrian comes upon your land, and when he goes up upon your country. When the devil, who is interpreted εὐθύνων, that is, reproving and rebuking, comes upon the land and country of believers, and of those whom the Lord will feed in strength and in the loftiness of the name of the Lord his God, and treads them down with various tribulations, and like a proud man goes up upon the houses of our souls, that is, our bodies, and presses them down, and yet nothing separates us from the love of Christ; then the peace of Christ, or Christ himself, will be in us, and it will be said of the saint: The enemy shall gain nothing over him. Let us set out an example, so that what we are saying may become plainer. The Assyrian once came upon the land of Paul and went up upon his country, when he was in labors beyond measure, in blows more abundantly, in prisons exceedingly, in deaths often, when he received from the Jews five times forty lashes less one, was beaten with rods three times, was stoned once, suffered shipwreck three times, was a night and a day in the depth of the sea, in perils from robbers, in perils among false brothers, in perils from my own race, in perils from the Gentiles; but in all these he conquered because of him who had loved him. And therefore he was filled with peace, because he had been filled with insults. The Jews contend that all these things will come to pass according to the letter at the coming of the Christ whom they feign for themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Then, therefore, there will be peace, when the remnant of Christ's brothers has been converted to the sons of Israel, and the Assyrian has come into our land, and, helped by the Lord, we have swiftly crushed under our feet him who desired to tread our houses. For the Lord himself says: We shall raise up against him seven shepherds, and eight principal ones of men, or bites of men. And we shall raise up, I and my Son and the Holy Spirit, according to what is written in Genesis: Let us make man after our image and likeness. And at the beginning of Obadiah: Arise, and let us go up against her to battle. The seven shepherds I take to be all the patriarchs and prophets and holy men who served the hebdomad, that is, the old instrument. But the eight bites of men, or eight principal men, and, as Symmachus rendered it, christs, are all those of the New Testament who, from the apostles down to this age, have bitten the Assyrian and torn him with their teeth. Hence also in Ecclesiastes the command is given: That we should give portions to seven, let us give also to eight. And in the temple of Ezekiel, which is interpreted as the Church and the heavenly Jerusalem, one goes up by seven and by eight steps. And in the psalter there are fifteen steps, by which, through the hebdomad and the ogdoad, we climb to sing praises to God. On the eighth day the spiritual circumcision is celebrated, and in the temple of the Jews the sabbath is destroyed, and some psalms are inscribed for the eighth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
