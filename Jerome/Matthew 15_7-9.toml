[[commentary]]
quote='''
The Lord used this testimony against the Pharisees in the Gospel of Matthew, saying: Why do you also transgress the commandment of God for the sake of your traditions (Matt 15:3). And again: Hypocrites, well did Isaiah prophesy of you, saying: This people honors me with its lips, but its heart is far from me. And in vain do they worship me, teaching the doctrines and precepts of men (ibid., 6-9). In this we ought to note what we have often pointed out: that the Evangelists and Apostles did not translate word for word, nor follow the authority of the Seventy translators, whose edition was already being read at that time, but, as Hebrews and men instructed in the Law, used their own words without loss to the sense. The people of the Jews draws near to God with its mouth and lips, because it boasts that it holds to the worship of the one God and rejects idols; but its heart is far from him, because it does not receive the Lord Jesus Christ. For he who does not receive the Son does not receive the Father. And at the same time let us learn how a person draws near to God, or becomes far from him. He speaks through Jeremiah too: I am a God who draws near, and not from afar, says the Lord (Jer 23:23 LXX). We draw near to God with the mind, not with the body; as we read of Moses too: Moses alone drew near to God; but the others did not draw near (Exod 24:2). For he prayed to God in spirit and in truth, and approached him with understanding and spirit. But these, of whom it is written that they are taken from the womb and instructed from boyhood to old age, and meditate day and night on the Law of God, do not draw near to God, because they accept the traditions of the Pharisees and scribes, which make them far from God; and they are whitened sepulchres, which outwardly appear beautiful but within are full of dead men's bones: they chose Barabbas and rejected the Lord (Matt 23:27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
