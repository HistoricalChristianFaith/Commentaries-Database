[[commentary]]
quote='''
Not that Peter was of a different speech or nation, but a Hebrew as his accusers were; but every province and every district has its peculiarities, and he could not disguise his native pronunciation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Surely you too are one of them, for your speech also makes you plain. Not that Peter was of another language or of a foreign nation, for all of them were Hebrews, both those who accused and he who was accused, but because each province and region had its own peculiarities and could not avoid its native sound of speech. Hence too the Ephraimites in the book of Judges cannot say the σύνθημα (the password).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
