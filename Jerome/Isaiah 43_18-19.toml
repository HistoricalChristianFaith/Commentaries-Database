[[commentary]]
quote='''
Therefore I command you this: that among my signs and wonders, by which Babylon, the mightiest city, was overthrown, and by which a way was opened for my people in the Red Sea and in the Jordan, you should in no way remember the old things, since in the Gospel I am going to do far greater things, in comparison with which past things ought to be passed over in silence. For no longer will I find a way in the Red Sea, but in the desert of the whole world. Nor will one river or fountain burst forth from the rock, but many rivers, to refresh not bodies, as before, but thirsting souls; and that will be fulfilled which we read above: You will drink waters from the fountains of the Savior (cf. Isa 12:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
