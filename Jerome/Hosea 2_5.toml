[[commentary]]
quote='''
Is not this the mark of a hard brow and of a harlot's shamelessness, to glory in one's own crime and say: I will follow my lovers; I will go to the idols which have supplied me with what is necessary both for food and for clothing? All the things which the prophetic word describes the Jews received spiritually from the Lord. And because they denied the Son of God, choosing for themselves Barabbas, the author of robbery and sedition, and crucifying the Son of God, therefore to this day they follow demons, and ascribe the benefits of God to those who have destroyed the souls of their worshippers. The heretics have bread and waters: their bread is the bread of mourning, and their waters are muddy, waters which choke and kill the baptized. They have also wool from scabby sheep, and flax that remains in its blackness, and oil, of which the prophet says: Let not the oil of the sinner fatten my head, and the drink of the waters of Egypt, of which Jeremiah cries out: What have you to do with the way of Egypt, to drink the water of Gihon? And: What have you to do with the way of the Assyrians, to drink the waters of the rivers? We run through all these things briefly, so as to pass on to the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
