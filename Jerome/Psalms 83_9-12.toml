[[commentary]]
quote='''
This history the eighty-second (83rd) psalm also recalls, where it records that among the other leaders of Midian there was also Salmana, saying: Do to them, O Lord, — no doubt meaning those who have entered into a pact or covenant against God —, as to Midian and to Sisera. And after the rest: Make, he says, their princes like Oreb and Zeeb, and Zebah and Salmana, all their princes who said: Let us possess the sanctuary of God by inheritance. For in this psalm too the leaders of the heretics are described, who have tried to claim the altar of God for themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
