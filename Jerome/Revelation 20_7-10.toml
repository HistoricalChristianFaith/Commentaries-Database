[[commentary]]
quote='''
Accordingly the Jews and our own Judaizers think that Gog is the Scythian nations, savage and innumerable, which stretch beyond the Caucasus mountain and the Maeotic marsh and near the Caspian Sea as far as India — and that these are to be stirred up by the devil after the reign of a thousand years —, and that they are to come into the land of Israel to fight against the saints, with many nations gathered together with them: first Meshech, whom Josephus interprets as the Cappadocians; then Tubal, whom the same man supposes to be the Iberians or Spaniards, and the Hebrews the Italians, having with them in their army Persians, Ethiopians and Libyans; also Gomer and Togarmah, whom they interpret as the Galatians and Phrygians; also the Sabaeans and Dedan and the Carthaginians, or Tarshish; and that this is what John too sets down in his Revelation: And when the thousand years are finished, Satan will be loosed from his prison, and he will go out to seduce the nations in the four corners of the earth, Gog and Magog, to gather them for war: whose number is as the sand of the sea. And they went up over the breadth of the earth, and surrounded the camp of the saints and the beloved city. And fire came down from God out of heaven and devoured them; and the devil who seduced them was cast into the lake of fire and sulphur, where the beast and the false prophet were, and they will be tormented day and night for ages of ages; not understanding that the whole volume of John, which is headed with the title of Revelation, is mystical, and that we need revelation so that we may be able to say with the prophet: Unveil my eyes, and I will consider the wonders of your law. Others, however, abandoning the earthly sense and the Jewish and old-wives' fables, which are harmful and drag down into the depths those who acquiesce in them, climb up too far to the heights and invent much worse trifles, so that they describe the wars of the devil and of all his army in the heavenly Jerusalem, and under the ἐτυμολογίαις [etymologies] of the individual nations interpret the spiritual forces of wickedness in the heavenly places. Leaving all these things to the reader's judgment, we shall try not so much to condemn the views of others as to affirm the Church's explanation. 'Gog' is called in the Greek tongue δῶμα, in the Latin 'roof'; 'Magog', moreover, means 'from the roof' — so all pride, and the knowledge falsely so called which raises itself against the knowledge of the truth, is shown by these names —; these are the roofs of which Isaiah too speaks in the vision against the valley of Zion: What has happened to you now, that you all go up onto the empty roofs?; and by 'roof' we shall interpret the princes of the heretics, and by 'from the roof' those who have taken up their doctrines; and fittingly, after the many mystical prophecies in this volume, the last prophecy is against Gog and Magog — for if It is the time of judgment, according to Peter, that it should begin from the house of God, and according to this same Ezekiel, who says: And begin from my saints, and: The last enemy, death, is destroyed, in Isaiah too the first word is directed against Judea, in which is the confession of the Lord, and the last against the four-footed beasts which are in the desert; rightly here too the last word is directed against Gog and Magog, who assail the city of God, which the rush of the river makes glad, and which says in Isaiah: I am a strong city which is besieged, and of which it is written in the Gospel: A city set on a mountain cannot be hidden, and more fully in the psalm: Jerusalem, which is built as a city whose sharing of it is in the selfsame. Mountains are round about it, and the Lord is round about his people —. Moreover, as to the fact that in the army of Gog or Magog, who according to the Seventy, Symmachus and Theodotion is prince of Ros, Meshech and Tubal, Aquila translates the first nation, 'Ros', as 'head', and we too have followed him — so that the sense is: The prince of the head of Meshech and Tubal; and in truth neither in Genesis, nor in any other place of Scripture, nor even in Josephus, who in the first book of the Antiquities sets out the names of all the Hebrew nations, have we been able to find this nation, from which it is clear that 'Ros' signifies not 'a nation' but 'head'; this too must be briefly noted, that in Ezekiel Gog is said to be the prince of the land of Magog, whereas Revelation records that both Gog and Magog are nations which go out from the four corners of the earth; and that just as from Jacob, who was afterwards called Israel, the whole people of the Hebrews received the name Israel, and from Aram Syria, from Mesraim Egypt, whose names are written in Genesis, so too from the prince Gog all who are subject to him are called Magog —; 'Mosoch', however, means 'madness', and 'Thubal' 'whole' or 'all things': so the 'prince' and 'head of proud madness and of all evils' — according to what is written: The world is set in the evil one — are called 'Gog' and 'Magog' — nations which, hostile and adverse to the saints, go out from the corners of the earth, abandoning the straight line and the arrangement of the camps of God which is related in Numbers, and not knowing that testimony: Many will come from the east and the west and the north and the south, and will recline with Abraham, Isaac and Jacob in the kingdom of God, and in another place: I will say to the north: Bring; and to the south-west wind: Do not hinder, bring my sons from a distant land and my daughters from the end of the earth, all who are called by my name; but not such are the corners of the earth from which Gog and Magog go out: beside such corners the harlot stands in Proverbs, who hastens to deceive the foolish young men passing by through the streets, that is, through the broad and spacious way which leads to death: the scribes and Pharisees too pray at the corners of the streets so as to be seen by men, who have received their reward —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
