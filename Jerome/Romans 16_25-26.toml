[[commentary]]
quote='''
Those who hold that the prophets did not understand what they said, and spoke as if in ecstasy, along with the present testimony also drag in, to confirm their dogma, the passage found in many manuscripts of the Epistle to the Romans, reading: Now to him who is able to strengthen you according to my Gospel and the preaching of Jesus Christ, according to the revelation of the mystery kept silent in eternal times, but now made manifest through the prophetic Scriptures and the coming of our Lord Jesus Christ, and the rest. To them we must answer briefly that in past times the mystery of Christ was kept silent, not among those who promised that it would come, but among all the nations, to which it was afterwards made manifest. And we must likewise note that the mystery of our faith cannot be revealed except through the prophetic Scriptures and the coming of Christ. Let those, then, who do not understand the prophets and do not wish to know them, claiming that they are content with the Gospel alone, know that they are ignorant of the mystery of Christ, which in eternal times was unknown to all the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
