[[commentary]]
quote='''
They have turned to me the back and not the face. Those who cast the words of God behind them themselves turn their back against him and not their face. For when a master gives instruction, it is a sign of one who obeys if he listens with his head bowed before him; but if he turns his back, it is a sign of one who despises, as it is written in another place: and they turned to me a withdrawing shoulder. 'So far', says God, 'have they despised my precepts that they would not even hear, but showed the swelling of their mind by the gesture of their body'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And in the time of their affliction they will say: Arise and deliver us. Those who did not perceive God through benefits, let them perceive him through torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
