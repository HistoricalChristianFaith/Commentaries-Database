[[commentary]]
quote='''
The angel who was speaking in the prophet, having gone out from him and speaking as it were face to face, bids him lift up his eyes and see the sins of the people of Israel heaped up into a full measure, and the offences of all filled up; and that this is their eye, which in Hebrew is called enam, and is written with ain, iod, nun, mem. Or their iniquity, which, if it were written with the letter uau, would rightly be read onam, as the LXX rendered; and this error has often crept into the common edition, that because the letters uau and iod are of the same shape but differ in size, one is read for the other. This jar or measure is their eye in the whole earth, that is, the showing of sins, so that those whose vices lay hidden, scattered, might be heaped up into one and laid open to the eyes of all, and Israel might go forth from its place, and it might be shown to all the nations what Israel had been in its own land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
