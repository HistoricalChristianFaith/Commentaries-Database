[[commentary]]
quote='''
And lest he should seem to condemn the common nature of men, and to make God the author of evil, as the maker of such as cannot avoid evil, he shrewdly took precaution and said that we were created good by God; but that because we have been left to our free will, by our own fault we slip toward worse things, while we seek greater things and think various thoughts beyond our strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
