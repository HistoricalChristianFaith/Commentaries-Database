[[commentary]]
quote='''
And because the heretics are always wont to promise prosperity and to open the kingdoms of heaven to sinners, so as to say: 'The kingdoms of heaven are prepared for you; you can imitate the majesty of God, so as to be without sin; for you have received the power of free will and the knowledge of the law, through which you may attain what you will', and they deceive the wretched with blandishments, and especially silly women laden with sins, who are carried about by every wind of doctrine, always learning and never coming to the knowledge of the truth, and they deceive all their hearers with adulation, therefore the Lord, comparing his own words with the chaff of the heretics, says: 'are not my words like fire, says the Lord, and like a hammer breaking the rock? For my word', he says, 'announces future punishments, to deter men from sinning', and he threatens the chaff of sinners with burning, so that the hearts of the heretics, hard and untamable like flint, may be broken by the hammer of his word, as he takes away the heart of stone to put in its place a heart of flesh, namely a soft one, and one that can receive and feel the precepts of God. Something of the kind the Lord says through Ezekiel too: that the false prophets with their blandishments daub a wall without mortar, which afterward is overthrown by a violent rain and by the truth of judgment, and the false prophetesses sew pillows under every elbow of the hand, to make sinners rest and never soften the wrath of God with tears. For 'hammer' the Seventy translated 'axe', namely the one of which John the Baptist speaks: already the axe is laid at the roots of the trees. This axe cuts down the unfruitful trees and this hammer breaks the hardest stones. Whence too Nahum the prophet says: his fury — no doubt God's — shall consume principalities, and the rocks shall be broken by him. This against the heretics. But of churchmen it is written that hammer and axe were not heard in the house of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
