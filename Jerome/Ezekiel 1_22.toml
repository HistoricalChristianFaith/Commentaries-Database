[[commentary]]
quote='''
And over the head of the living creatures the likeness of a firmament, as the appearance of dreadful crystal, and stretched out over their heads above. Under the firmament, moreover, their wings straight, one toward the other. Each one veiled its body with two wings, and the other was likewise veiled. And I heard the sound of the wings, as the sound of many waters, as the sound of the sublime God. When they walked, there was as it were the sound of a multitude, like the sound of a camp, and when they stood, their wings were let down. For when a voice came from above the firmament that was over their head, they stood and lowered their wings. And above the firmament that was overhanging their head, as the appearance of a sapphire stone, the likeness of a throne, and above the likeness of the throne a likeness as the appearance of a man above. (Where we put: Their wings straight, and: As the sound — or voice — of the sublime God, the Seventy translated: Their wings stretched out and flying, and: As the voice of the strong one, which in the Hebrew is called 'saddai'. And many things, both in this and in other chapters, were passed over by them, which I have refrained from setting down because of their length. As for what we have translated more plainly: One toward the other; each one veiled its body with two wings, and the other was likewise veiled, in place of which in the Hebrew is written: 'Of a woman toward her sister; a man veiled his body with two wings, and a man was likewise veiled', he put man after woman in the same person for this reason, lest we should suppose sex among heavenly beings, since in one and the same, according to the Hebrew idiom, the same is called both man and woman.) Now above the four living creatures and as many wheels is seen the likeness of the firmament, which we call heaven, having the appearance of crystal, which is most pure and is said to congeal from clean and shining waters through excessive cold, so much so that water bound by frost is also called in the Greek tongue 'crystallus' [ice]; and it was fitting that in the higher regions there should be an exceptional purity which protects all things, that is, the rational and wise powers, and the course of the four seasons, and the regions of the world, and the order of all things, and the preaching of the Gospel, which is understood in part and veiled in part.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
