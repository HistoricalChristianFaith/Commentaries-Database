[[commentary]]
quote='''
But He so frames His answer as to evade their snare. He brings in the testimony of Holy Writ, and the law of nature, and opposing God's first sentence to this second, He answered and said unto them, Have ye not read, that he which made them at the beginning made them male and female? This is written in the beginning of Genesis. This teaches that second marriages are to be avoided, for He said not male and females, which was what was sought by the putting away of the first, but, male and female, implying only one tie of wedlock.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Have you not read that he who made them from the beginning made them male and female? This is written at the beginning of Genesis. But by saying male and female, he shows that second marriages are to be avoided. For he does not say: male and females, which is what was sought by the repudiation of the former wives, but male and female, so that the partnership of a single marriage might be bound together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
