[[commentary]]
quote='''
And you, tower of the flock, cloudy one of the daughter of Zion, even unto you it shall come; and the first power shall come, the kingdom of the daughter of Jerusalem. Now why are you drawn together in grief? Is there no king for you, or has your counselor perished, because pain has seized you like a woman in labor. LXX: And you, tower of the flock, murky daughter of Zion, to you it shall come, and the first principality shall enter, the kingdom from Babylon of the daughter of Jerusalem. And now why have you known evils? Was there no king for you, or has your counsel perished, because pains have seized you like a woman giving birth? The tower of the flock, cloudy or squalid, which in Hebrew is called ophel, we ought to take as no other than that of which Isaiah says: And I built a tower in the midst of it, that is, of the vineyard. Now the vineyard of the Lord is the house of Israel. As long as this tower has a winepress, that is, the altar, and a wall round about, namely the help of the angels, and the devil, the boar, does not enter the vineyard, it is not squalid, it is not dark, but, having received its name from the Lord who shines upon it, it is called a city which, set on a mountain, cannot be hidden. The tower, then, once of the flock and of the people of God, because the most wicked tenants killed the son of the householder, is now squalid and abandoned, and under the name Ariel cries out from the earth in Isaiah. And this tower belongs to the daughter of Zion, or, as Symmachus rendered it into Greek: She herself is the daughter of Zion, and even unto her shall come God, or the first power, which power is the kingdom of the daughter of Jerusalem. Now there came to this tower the first power, or the first principality, he who had said: I am alpha and Ω, the beginning and the end, the first and the last. And he who, in the person of the man he had assumed, says in Proverbs: The Lord created me in the beginning of his ways for his works, or, as it is written in the Hebrew: The Lord possessed me: for canani means not he created me, but he possessed me and held me. And the first power came, and the kingdom of the daughter of Jerusalem, so that after the first there might be a second as well; for just as he himself says with confidence: I am the light of the world, so he also grants to his disciples that they too should be called the light of the world, and he says to them: You are the light of the world. And calling himself the true vine in the Gospel, he says of believers through Jeremiah: But I planted you a fruitful vine, wholly true. And though he is the living bread coming down from heaven, he granted to his disciples that they should be called bread. Hence the apostle Paul too says with confidence: For we all are one bread. In this way, then, the first power and the kingdom enters into Jerusalem, so as to make those who believe in her a power and a kingdom. But as for what is read in some books: And the first principality shall enter, the kingdom of the daughter of Zion, from Babylon, let us know that it has been added, since it is found neither in the Hebrew nor among the other translators. And it seems to me indeed that it was thinking of the Babylonian captivity, because the people, going out from there, came to Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
