[[commentary]]
quote='''
After this it is asked how what follows can be understood: above every principality, and power, and virtue, and dominion, and every name that is named, not only in this age but also in the age to come. And indeed concerning the right and left hands, and concerning the sitting, we have already spoken. Now we must ask where the Apostle found these four names written, I mean principality, and power, virtue, and dominion, and from where he brought them forth into the open. For it is not right to think that one who had been instructed in the divine reading said anything that is not found in the holy books. I think, therefore, that either he brought forth into the open from the traditions of the Hebrews things that are secret, or at least, since he understood that the law is spiritual, he took in a loftier sense the things that are written as though according to history, and recognized in what is related in Numbers and in the books of Kingdoms about kings and princes, and also leaders, tribunes and centurions, an image of other princes and kingdoms: namely, that in the heavenly places there are principalities, there are powers, there are dominions and virtues, and the other names of ministries, which neither we can name, nor, I think, was Paul himself able to enumerate, set as he was in a heavy little body. Now if there are principalities, and powers, and virtues, and dominions, they must also have those who are subject to them, and who fear them, and who serve them, and who are strengthened by their fortitude. These distributions of offices will exist not only at present but also in the age to come, so that through the several advances, and honors, and ascents, and also descents, someone may either grow or decrease, and come to be under one power, virtue, principality and dominion after another. We little men, soon to be dissolved into ash and dust, if by the consent of men we are raised up to be kings, have such diversities and multitudes of ministers as we can more easily perceive than describe: for example, that the Prefect on the civil side has judges, provinces and his own staff; again, that the military is divided into so many counts, generals, tribunes and a manifold army; and do we think that God, the Lord of lords and King of those who reign, is content with a single ministry only?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
