[[commentary]]
quote='''
But if we choose to read a fowler's vessel instead of a hook for fruit, this must be said: that as a fowler, with birdlime or nets, draws down to the earth birds that fly through the air and range on high, so the Lord, through Sennacherib or Nebuchadnezzar, whom we now understand as the fowlers, seized, bound, carried away and killed his people, who were formerly free and lofty through their observance of the law. For not unjustly are nets spread for birds. And this is to be referred not only to the time of the Babylonian captivity, but also to the coming of the Lord the Savior, when they said: Away with such a one from the earth; crucify him, crucify him; and they lost the wings of the dove. And the end came upon them, and the final captivity, and God spared them no longer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
