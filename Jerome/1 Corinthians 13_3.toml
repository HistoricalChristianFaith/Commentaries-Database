[[commentary]]
quote='''
Chastity itself too, in marriage, in widowhood, in virgins, often seeks human applause; and, what I have long been afraid to say, yet it must be said, martyrdom itself, if it is undergone so that we may be held in admiration and praise by the brothers: the blood has been shed in vain. Let the Apostle speak, let the vessel of election speak: "If I hand over my body that I may glory, but have not love, it profits me nothing" (1 Cor. 13:3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
I know that in the Latin codices, in the testimony we set down above, "If I hand over my body that I may glory", they have "that I may burn" (ardeam) in place of "that I may glory" (glorier); but because of the similarity of the word, by which among the Greeks "I may burn" and "I may glory", that is, καυθήσομαι and καυχήσομαι, are distinguished by part of a single letter, the error has grown up among our people. But among the Greeks themselves, too, the copies differ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
