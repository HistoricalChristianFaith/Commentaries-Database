[[commentary]]
quote='''
'And when I have done them good', he says, 'I will rejoice and be glad', namely, that his creature has been saved; whence also there is joy among the angels in heaven over one sinner who repents. And I will plant them, he says, in this land in truth or — as the Seventy translated — in faith, so as to signify properly the Christian people, whose religion is faith. With my whole heart and with my whole soul: if these are the words of the Lord the Savior, the heart and soul are rightly believed to be his, who says in the Gospel: 'I have power to lay down my soul, and I have power to take it up again'; but if we take it as spoken in the person of God the Father, it must be understood according to that saying: your new moons and sabbaths and feast days my soul hates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
