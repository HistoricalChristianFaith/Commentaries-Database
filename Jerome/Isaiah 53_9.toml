[[commentary]]
quote='''
He gave the ungodly for his burial, and the rich man for his death; or the worst men for his burial, and the rich for his death: signifying both peoples, so that in the evil and the worst, who before had no knowledge of God (Rom 9), the multitude of the nations is shown; in the rich, to whom belonged the Testament and the Lawgiving and the Prophets, the Jewish people is pointed out. Therefore the Lord suffered and was buried for this reason, that he might gather to himself a Church from both peoples. Or this must be said: that the Scribes and Pharisees, and Sadducees, the priests and high priests, who formerly reigned among the people and abounded in excessive wealth, God handed over to the Romans after the Lord's passion, and subjected to everlasting servitude. He for whose burial and death the ungodly and the rich were handed over did no iniquity, nor was deceit found in his mouth. This can be understood of no man at all, that he sinned neither in deed nor in word, as Scripture says, No one is clean from filth, not even if his life has been of a single day, and, all like sheep have gone astray, each one has turned aside in his own way (Job 25), except of him who bore our sins, and suffers pain for us, and was wounded for our iniquities, and afflicted for our crimes, by whose bruise we have been healed. Expounding this testimony about him, Peter the prince of the Apostles also says: For to this you were called, because Christ also suffered for us, leaving you an example, that you should follow in his steps; who did no sin, nor was deceit found in his mouth; who when he was cursed did not curse, and when he suffered did not threaten (1 Pet 2:21ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
