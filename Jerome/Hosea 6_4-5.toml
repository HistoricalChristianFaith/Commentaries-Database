[[commentary]]
quote='''
We perceive these same things to have been said also to the heretics, and to the true Judah, who is to suffer the like: that the Lord calls them to mercy and desires that they return to salvation. But they pursue the delights and refreshments of this age, like a cloud and dew that quickly passes away; to whom it is said in the Gospel: Fool, this night they require your soul of you; and the things you have prepared, whose will they be? And that rich man clothed in purple, who despised Lazarus lying before his gates, learned that all he had enjoyed had passed away like a cloud and dew. But God always slays the prophets of the heretics, when he threatens them with eternal punishments, and takes them away from the true life, and leaves them to the death of their crimes. But let us love that cloud which is everlasting, and which protects us from the heat of this world, sitting upon which the Lord came into Egypt and broke all the images of the Egyptians. Let us love that dew of which Moses speaks: Let my words come down like the dew. And of which Isaiah says: The dead will rise again, and those who are in the tombs will be raised up; for the dew that is from you is their health. There are some who think that the prophets who were slain are holy men, because on account of a sinful people even prophets were slain and handed over to their enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
