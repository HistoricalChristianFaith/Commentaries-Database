[[commentary]]
quote='''
Then was fulfilled what was spoken through the prophet Jeremiah, saying: A voice was heard in Ramah, weeping and great wailing, Rachel weeping for her sons, and she would not be consoled, because they are not. Of Rachel was born Benjamin, in whose tribe Bethlehem does not lie. It is asked, therefore, how Rachel weeps for the sons of Judah, that is, of Bethlehem, as if they were her own. We shall answer briefly: because she was buried near Bethlehem in Ephrathah (from the inner lodging of her little body she received the name of mother); or else because Judah and Benjamin were two joined tribes, and Herod had commanded that the boys be killed not only in Bethlehem but in all its borders round about; by occasion of Bethlehem we understand that many of Benjamin also were slain. And she weeps for her sons and does not receive consolation according to a twofold understanding: either because she thought them dead for ever, or because she would not be consoled for those whom she knew would live. And as for the saying: in Ramah, let us not think it is the name of the place which is near Gibeah; but Ramah is interpreted height, so that the sense is: A voice was heard on high, that is, spread far and wide.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Thus says the Lord: a voice of lamentation was heard on high, of weeping and mourning, of Rachel bewailing her sons, and she would not be consoled over her sons, because they are not. LXX: thus said the Lord: a voice was heard in Ramah, lamentation and weeping and mourning, of Rachel bewailing her sons, and she would not be quieted, because they are not. Matthew took the testimony neither according to the Hebrew nor according to the Seventy; for we read in him, after the description of the slaughter of the infants: then was fulfilled what was spoken through Jeremiah the prophet, saying: a voice was heard in Ramah, wailing and much howling, of Rachel weeping for her sons, and she would not be consoled, because they are not. From this it is clear that the evangelists and apostles did not at all follow anyone's translation from the Hebrew, but, as Hebrews from Hebrews, expressed in their own words what they read in Hebrew. Rachel, the mother of Joseph, when she was coming to Bethlehem, was suddenly seized with the pain of childbirth and bore a son, whom the midwife, because she was dying in giving birth, called Benoni, that is, son of my sorrow; but his father Jacob changed the name and called him Benjamin, that is, son of the right hand. It is asked, then, how Matthew the evangelist transferred the testimony of the prophet to the killing of the little ones, when it is clearly written of the ten tribes, whose chief was of Ephrathah, and it is not at all in the tribe of Ephraim, but in the tribe of Judah. For this same place is also Bethlehem, diōnymos [double-named], whence also the names of both agree; 'Bethleem' is called 'house of bread', 'Ephratha' karpophoria, which we can call 'fruitfulness'. Since, then, Rachel was buried in Ephrathah, that is, in Bethlehem — as both holy Scripture and the inscription of her tomb testify to this day —, she is said to weep for the children who were killed near her and in her own regions. Some of the Jews interpret this place thus: that, when Jerusalem was taken under Vespasian, countless thousands of captives were sent to Rome by this road, by Gaza and Alexandria; others, that in the last captivity under Hadrian, when the city of Jerusalem too was overthrown, a numberless people of various ages and of both sexes was sold at the market of the Terebinth; and that for this reason it is abhorrent to the Jews to visit that most frequented market. Let them say what they will; we shall say that the evangelist Matthew rightly took the testimony for the place in which Rachel was buried and wept for the sons of the neighboring villages round about as if they were her own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
