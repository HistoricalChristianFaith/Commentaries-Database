[[commentary]]
quote='''
Then those who feared God spoke, each one with his neighbour. LXX: These things those who fear the Lord spoke, each one to his neighbour. According to the Hebrews it is to be understood thus: while those men were blaspheming about the judgement of God, those who fear God spoke to one another, saying that the recompense of the good or the evil is not in the present and brief age, but in the future and eternal one; and that man cannot know the judgements of God, and dispute about his equity and justice, and the other things that a just man ought to speak with a just man. Nor did he say what they spoke, but from the fact that he added: Then those who feared God spoke, each one with his neighbour, we ought to understand that those who feared God spoke the things that are contained in the voices of all the Scriptures. According to the LXX, however, it is to be read εἰρωνικῶς (ironically), and with a lowered voice, so that we say: These things those who fear the Lord spoke, each one to his neighbour; that is, those who boast in vain and say, what profit is it that we have kept his commandments, and have walked sorrowful before the Lord? For if they feared the Lord, they would not say such things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"

[[commentary]]
quote='''
And the Lord attended and heard, and a book of remembrance was written before him for those who fear the Lord, and think upon his name.

And they shall be mine, says the Lord of hosts, on the day that I make, for a special possession, and I will spare them, as a man spares his son who serves him. And you shall turn, and you shall see what difference there is between the just and the impious, and between him who serves God and him who does not serve him. LXX: And the Lord attended and heard; and he wrote a book of remembrance in his sight for those who fear the Lord, and who revere his name. And they shall be mine, says the Lord Almighty, on the day that I make, for an acquisition, and I will choose them as a man chooses his son who serves him; and you turn, and you shall see what difference there is between the just and the unjust, and between him who serves God and him who does not serve him. While the just and those who fear the Lord were saying these things, each with his neighbour, men who were willing neither to hear nor to speak words of blasphemy, the Lord attended and heard, and a book of remembrance was written before him for those who fear and think upon his name, so that when the day of judgement comes, he may render both punishments to the blasphemers and rewards to those who fear him. Now the book was written of which we read in Daniel: Thrones were set, and the books were opened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
