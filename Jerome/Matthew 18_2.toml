[[commentary]]
quote='''
Jesus seeing their thoughts would heal their ambitious strivings, by arousing an emulation in lowliness; whence it follows, And Jesus calling a little child, set him in the midst of them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus, calling a little child, set him in their midst. Either simply any little child, so that he might seek out that age and show the likeness of innocence; or else he set himself in their midst as the little child, he who had come not to be served but to serve, so that he might give them an example of humility. Others interpret the little child as the Holy Spirit, whom he placed in the hearts of the disciples so that they might exchange pride for humility.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
