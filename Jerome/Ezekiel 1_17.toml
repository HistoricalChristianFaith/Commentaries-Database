[[commentary]]
quote='''
They went on the four sides and were not dragged, nor did they turn backward; for how could it happen that they turned back, when they were following the living creatures, which always stretched themselves toward what lay ahead?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
