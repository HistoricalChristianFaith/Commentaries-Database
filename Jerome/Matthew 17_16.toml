[[commentary]]
quote='''
In saying, And I brought him to thy disciples, and they could not heal him, he covertly accuses the Apostles, whereas that a cure is impossible is sometimes the effect not of want of power in those that undertake it, but of want of faith in those that are to be healed...
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But as to his saying: I brought him to your disciples, and they could not cure him, he covertly accuses the apostles, although the impossibility of curing is sometimes to be referred not to the weakness of those who cure but to the faith of those who are to be cured, as the Lord says: Be it done to you according to your faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
