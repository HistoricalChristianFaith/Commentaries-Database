[[commentary]]
quote='''
Let us read the Apocalypse of John, let us also read Isaiah, where the city of Jerusalem is built, and its twelve gates are said to be constructed of precious stones, and the city itself descends from heaven, and its walls are said to be of gold, and its streets are said to be paved with emerald, and each of the gates is said to be constructed of a single precious stone. These are all the riches of the Lord, and does the Lord love these the way men do too? He forbids us from avarice, and does he himself build a city out of avarice? Therefore the Lord loves the gates of Zion, those twelve gates of Zion: it is clear that he wrote of the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_018.html'
source_title="Homily 18, on Psalm 86"
