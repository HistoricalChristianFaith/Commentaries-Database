[[commentary]]
quote='''
Blow the horn in Gibeah, the trumpet in Ramah; howl in Beth-aven, behind your back, Benjamin; Ephraim will be in desolation in the day of rebuke; among the tribes of Israel I have shown faithfulness. LXX: Blow the trumpet upon the hills, sound upon the high places, proclaim in the house of ὤν; Benjamin has fallen out of his mind, Ephraim has become a desolation in the days of rebuke; among the tribes of Israel I have shown faithful things. The months one by one, or the rust, will devour Ephraim and Israel and Judah with their portions. Therefore I command you who hear to sound not with a loud voice but with a clear horn; for clear hearing is needed, so that all who are round about may hear. Blow the horn in Gibeah, whose etymology the Seventy translated as hills; and the trumpet in Ramah, which is interpreted high places; now these are two cities in the tribe of Benjamin, neighbors to one another, that is, Gibeah, in which Saul was born, and Ramah, which is next to Gibeah, situated at the seventh milestone from Jerusalem, and which the king of Israel tried to seize, in order to shut off the going out and the coming in of the tribe of Judah. In Gibeah, therefore, and in Ramah, sound out with a clear horn and trumpet; of these the horn is a shepherd's instrument and is made of curved horn; hence it is properly called in Hebrew sophar, in Greek κερατίνη. The trumpet, however, is made of bronze or of silver, and sounds in wars and at solemn festivals. Over Beth-aven, which was once called Bethel, and is in the tribe of Ephraim, where the golden calf was, there is need not of blaring and sounding but of howling, because captivity is near. And he said beautifully that Beth-aven is behind the back of Benjamin; for where the tribe of Benjamin ends, not far off, in the tribe of Ephraim, this city was founded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Where we translated behind your back, Benjamin, the Seventy rendered Benjamin has been moved in mind, always fitting ἔκστασιν, that is, ecstasy of mind, to Benjamin, the churchman. Hence also in the sixty-seventh (68th) psalm it is said: There is Benjamin, a youth, in ecstasy of mind. And in the blessings of Jacob, under the person of Benjamin, of which tribe the apostle Paul was, we read it written: Benjamin is a ravening wolf; in the morning he will eat the prey, and at evening he will give food. For he who in the beginning persecuted the Church afterwards bestowed the nourishment of the Gospel on believers throughout the whole world. Hence also Saul, who was of the tribe of Benjamin, prophesied in ecstasy of mind all day until evening among the band of the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
