[[commentary]]
quote='''
And do not go after strange gods, to serve them and worship them, nor provoke me to anger in the works of your hands, and I will not afflict you; and you have not listened to me. 'And these things', he says, 'I was urging together with the earlier ones: that you should not serve strange gods and worship them, and that you should not, by doing these things, provoke me to anger because of the works of your hands, so that I should do what I did not wish and afflict you; and you have not listened to me'. And what follows: says the Lord, so that you provoked me to anger in the works of your hands, to your own harm, is not found in the Seventy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
