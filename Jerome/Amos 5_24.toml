[[commentary]]
quote='''
And judgment shall be revealed as water, and justice as a mighty torrent. LXX: And judgment shall roll as water, and justice as an impassable torrent. As water, if it slides down a slope, lays bare what it had covered before and makes it lie open to the eyes of all, so the judgment and justice of God, which he once judged concerning his own people, will lie open to all and will be borne along like a most mighty torrent. Whatever it seizes, it drags with it, and it suffers nothing to withstand it. But according to the Seventy the judgment of the worst men rolls about like water, because it does not stand in one opinion but is carried about by every wind of doctrine, disapproving what it had approved, and thinking what it had praised before to be worth nothing. Their justifications are compared not to rivers and the purest springs, but to muddy and miry torrents, which have no waters of their own but waters gathered from rocks and brambles and crags. Whoever wishes to cross them will at once be swept headlong, and, his feet overturned, he will not be able to say: He set my feet upon a rock; for he treads upon sands, which have no foundation, and when he has been in peril he will say, according to the Hebrews: The torrent has passed over my soul. On the contrary, we read of the just, whose judgment does not roll like water and whose justice is not borne along like an impassable torrent: The thoughts of the just are judgments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
