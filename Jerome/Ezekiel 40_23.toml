[[commentary]]
quote='''
Nor is there only one gate of the north, which above is called the outer gate, but another which has the likeness of the eastern gate, as the Seventy said more plainly: And the inner gate of the court looking toward the gate of the north, as was the gate which looked toward the east; and he measured from the outer gate of the north to the inner gate of the same north a hundred cubits, so that by these as by steps, withdrawing from the outer gate, we may be able to come to the inner one, concerning the mystery of which number it has been spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
