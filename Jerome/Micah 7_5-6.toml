[[commentary]]
quote='''
Thus far it is commanded that we should not readily believe friends, leaders, wives. And a reason is given that does not quite answer to the proposition; for he says: For the son dishonors the father, the daughter rises against the mother, the daughter-in-law against her mother-in-law, and a man's enemies are his own household. For what has it to do with a friend, a leader, a wife, if son and daughter and daughter-in-law rise up against father and mother and mother-in-law? It seems to me, therefore, that it can be joined with what precedes in this way. Do not believe friends, and leaders, and wives, who can change and are only for a time, since even son and daughter, forgetting their upbringing and their infancy, rise up against the authors of their life and of their bodies, and do insult to those whom it is a crime to hurt even by a look. But this exposition by no means fits the daughter-in-law rising up against her mother-in-law, and the man whose enemies are his own household. Terence in the Hecyra: What is this? All mothers-in-law hate their daughters-in-law; and although this is ambiguous, yet it is almost natural that the daughter-in-law should hate the mother-in-law, and the mother-in-law the daughter-in-law. So much for what the prophetic word may have described concerning the consummation and end of the world: what kind of generation is to precede the coming of the Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
