[[commentary]]
quote='''
And the tree of life, he says, will give — of which it is written in Genesis —, and the tree of wisdom — of which it is said: It is a tree of life to all who take it up —: it will give its fruit when the earth too has given its fruit, or the trees of the regions, the very great multitude of the saints; and the earth will give its shoot: for Truth indeed has sprung from the earth; and they will be in their own land without fear, or in hope of peace, in the land of the living — the land of the meek, of which it is written: Blessed are the gentle, for they shall possess the land —, so that through the felicity of all things they may know that he himself is the Lord, when he has broken the chains or the iron ring of their yoke, by which they were pressed down as by a most heavy rule, and has rescued them from the hand of those ruling over them, or of those afflicting them with servitude: For each one is the slave of him by whom he is overcome.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
