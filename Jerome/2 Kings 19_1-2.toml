[[commentary]]
quote='''
For which in the volume of Kings one reads: He himself was covered with sackcloth and entered the house of the Lord, and he sent Eliakim the overseer of the house, and Shebna the scribe, and the elders of the priests covered with sackcloth, to Isaiah the prophet, the son of Amos (2 Kgs 19:1, 2). Here, because Isaiah was writing the history about himself, he did not call himself a Prophet but the son of a Prophet; there, however, because the writer of the history was another, he writes that he himself was a Prophet. This we read also of Matthew the Evangelist: that Matthew himself called himself a publican (Matt 9), while the other Evangelists were silent about the name of publican and set down only the apostolic dignity; and that in the pairings of the Apostles he is second in his own list and first in the others'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
