[[commentary]]
quote='''
But who this Lord is who is seen, we learn more fully in the evangelist John and in the Acts of the Apostles. Of whom John says: These things Isaiah said when he saw his glory, and spoke of him (John 12:41), meaning without doubt Christ. Again Paul in the Acts of the Apostles, where at Rome he speaks to the Jews: Well, he says, did the Holy Spirit speak through Isaiah the prophet to our fathers, saying: Go to this people and say: With the ear you shall hear and shall not understand, and seeing you shall see and shall not perceive; for the heart of this people has been made gross, and with their ears they have heard heavily; and they have shut their eyes, lest perhaps they should see with their eyes, and hear with their ears, and understand with their heart, and turn, and I should heal them (Acts 28:26-27). Now the Son was seen in the bearing of one who reigns, and the Holy Spirit spoke, on account of the fellowship of majesty and the unity of substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
