[[commentary]]
quote='''
The holy man has perished from the land, and there is no upright one among men; everywhere ambushes, everywhere fraud, innocent blood is shed, for avarice and lust brotherhood is disregarded; and they not only do evil things but also defend them, and, exchanging the names, they say that what is evil is good. The princes themselves do not receive gifts from those who offer them, but compel their subjects to give, and demand them. And the judge is for requiting, judging another in the same way as he himself is judged by another, so that they may grant one another's crimes mutual favor and defend themselves in another's crime. Whoever is great and, as it were, most learned in the law speaks not God's will but his own. And they have troubled it, either the city or the truth, or the land, of which it is said above: The holy man has perished from the land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
The one returning has perished from the land, either because the Antichrist kills the saints, or because all fall away at the greatness of the stumbling-blocks. And there is none among men to correct; all are judged in blood, not in light and small sins, but in the greatest and in those that concern blood. Not neighborliness, not friendship, not kinship will hold back the crime; all will raise their hands to evil, so that even he who has not been able to do evil nevertheless sins by his will while he prepares his hands. The prince himself asks, and the judge speaks peaceful words; for he receives gifts, the desire of his soul. Since this is plain, and I am wary of the ill will of princes and judges, I leave it to the reader's understanding and will add only this: Gifts blind the eyes even of the wise; they also give life to a soul to which they ought not to have given life, and kill the soul that lives by its own merit and virtues, and they do this for the sake of gifts which they shamelessly demand and more shamefully receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
