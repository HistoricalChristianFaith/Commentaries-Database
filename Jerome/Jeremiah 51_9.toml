[[commentary]]
quote='''
finally the angels — who were the guardians of the Jews at that time when the foolish multitude cried out and said: His blood be upon us and upon our children, and the veil of the temple was torn and all the mysteries of the Hebrews were laid open — answered the Lord who commanded them, and said: We have treated Babylon and she is not healed; let us leave her, namely the city of confusion and of vices — whence Josephus too relates in his History that, after the Lord was crucified and the veil of the temple was torn, or the lintel of the temple broke and fell, a voice of the heavenly powers was heard in the inner shrines of the temple: Let us pass over from these seats —.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
