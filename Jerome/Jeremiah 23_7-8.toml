[[commentary]]
quote='''
Therefore, behold, the days are coming, says the Lord, and they shall no longer say: The Lord lives, who brought the children of Israel out of the land of Egypt, but: The Lord lives, who brought out and brought back the seed of the house of Israel from the land of the north and from all the lands to which I had driven them out there, and they shall dwell in their own land. This whole chapter is not found in the Seventy; and its sense is this: that the people of God is no longer to be freed from Egypt through Moses, but through Jesus Christ from the whole circle of the earth, into which it had been scattered. This is fulfilled in part even now in the world, and will be fulfilled wholly when from the east and the west, the north and the south they shall come and recline with Abraham, Isaac and Jacob, so that, after the fullness of the nations has come in, then all Israel may be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
