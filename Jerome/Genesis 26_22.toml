[[commentary]]
quote='''
And they dug another well: and they did not strive with them, and he called its name Breadth. In place of 'breadth' in the Hebrew it has rooboth, which proves what we said above, he built the city of Nineveh and rooboth, that is, its streets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Rooboth [Rehoboth]: inclining, or streets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
