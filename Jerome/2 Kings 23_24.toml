[[commentary]]
quote='''
Therafim [teraphim]: burnings. But better: images, or figures, which the Greeks call μορφώματα [forms].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, Interpretations from the Fourth Book of Kings (2 Kings)"
