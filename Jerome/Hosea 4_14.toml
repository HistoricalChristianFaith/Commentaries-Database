[[commentary]]
quote='''
Therefore your daughters will play the harlot, and your brides will be adulteresses.

I will not visit upon your daughters when they have played the harlot, and upon your brides when they have committed adultery; since they themselves consorted with harlots and sacrificed with the effeminate; and the people that does not understand will be beaten. LXX: Therefore your daughters will play the harlot and your brides will commit adultery, and I will not visit upon your daughters when they have played the harlot and upon your brides when they have committed adultery; because they themselves also mingled with harlots and offered victims with the initiated; and the people that understands clung to the harlot. The word cadesoth, which Aquila translated ἐνηλλαγμένων, Symmachus ἑταιρίδων, the Seventy τετελεσμένων, Theodotion κεχωρισμένων, we have rendered 'effeminate', so as to lay open the sense of the word to the ears of our own people. These are they who today at Rome, serving the mother not of the gods but of demons, are called Galli, because the Romans, in honor of Attis — whom the harlot goddess had made a eunuch —, made over men of this nation, cut off from lust, as her priests. And the men of the nation of the Gauls are unmanned for this reason: that those who had captured the city of Rome may be struck with this disgrace. Idolatry of this kind existed in Israel, the women especially worshipping Baal-peor for the size of his obscene member, whom we can call Priapus. Hence also King Asa took away the high places from the people, and priests of this kind, and deposed his mother from her august rule, as Scripture testifies, saying: And Asa did what was right in the sight of the Lord, as David his father, and he took away the effeminate from the land, and he purged all the filth of the idols which his fathers had made. Moreover he also removed Maacah his mother, so that she should not be chief in the rites of Priapus and in his grove which she had consecrated; and he overturned its cave, and broke the most foul image, and burned it in the brook Kidron. But the high places he did not take away; nevertheless the heart of Asa was perfect before God all his days. But it must be known that in the present passage he calls cadesoth the harlots, ἱερείας, that is, priestesses, made over to Priapus. In other places, however, we read cadesim for men cut off from lust, as Isaiah says: And mockers will rule over them, for which in the Hebrew is written: And cadesim will rule over them, which we have rendered 'effeminate'. But Aquila, translating ἐνηλλαγμένους, that is, changed, wished to show this: that they had changed their nature and from men had become women. Symmachus called them ἐταιρίδας, properly harlots. The Seventy, τετελεσμένους, that is, consecrated and initiated, to show that they were worshippers of idols. Theodotion, κεχωρισμένους, that is, separated from the people, men who seemed to themselves to have something more than the common crowd. We have discussed the word briefly; now let us return to the sense of the section.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
