[[commentary]]
quote='''
Moreover, since the prophet Zechariah exhorts Zion and Jerusalem to a similar gladness, and Matthew says that this very prophecy was fulfilled in the first coming of Christ, we are compelled by necessity, or rather led by the very order of truth, to hope for what is said in Zephaniah not as future but as done. For it is written in Zechariah: Rejoice greatly, daughter of Zion; proclaim, daughter of Jerusalem. Behold, your king comes to you, just and a savior, himself humble and mounted upon a beast of burden and a new colt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
[[commentary]]
quote='''
Exult greatly, daughter of Zion; shout for joy, daughter of Jerusalem. Behold, your king will come to you, just and a savior, himself poor and riding upon a she-ass, and upon a colt, the foal of a she-ass. And I will destroy the chariot from Ephraim, and the horse from Jerusalem, and the bow of war shall be scattered, and he shall speak peace to the nations, and his power shall be from sea to sea, and from the rivers to the ends of the earth. LXX: Rejoice exceedingly, daughter of Zion; proclaim, daughter of Jerusalem: Behold, your king will come to you, just and saving, himself meek and riding upon a beast of burden and a new colt; and he will destroy the chariots from Ephraim, and the horse from Jerusalem, and he will destroy the bows of the fighters and the multitude, and peace from the nations, and he shall rule over the waters as far as the sea, and the rivers, the outlets of the earth. The evangelists write that this prophecy was fulfilled when the Lord entered Jerusalem, sitting upon a she-ass and the foal of a she-ass, and a crowd of children with branches of palms came to meet him, crying: Blessed is he who comes in the name of the Lord, hosanna in the highest; and when the Pharisees rebuked him for not checking the shouting children, he answered: Have you not read: Out of the mouth of infants and sucklings you have perfected praise? Zion therefore exults and Jerusalem shouts for joy, one and the same city — for Zion is the citadel of Jerusalem —, because her king comes to her, who was promised by the oracles of all the prophets. Just, and himself the Savior, that is, Jesus, as the angel interpreted it, speaking to the virgin: And he shall be called Jesus, because he himself shall save his people from their sins. Poor also, or, as the LXX translated, meek, he who, though he was rich, became poor for our sakes; and he says in the Gospel: Learn from me, for I am meek and humble of heart. And riding upon a she-ass, a beast of burden, or upon a new colt, that is, upon both peoples, of the circumcision and of the foreskin, of which the former had borne the most heavy yoke of the law; as it is written in the Acts of the Apostles: Neither we nor our fathers were able to bear the heavy yoke of the law. Hence Paul also writes to the Galatians, who wished to be circumcised: Stand fast, and do not be held again by the yoke of slavery. But the new colt, the multitude of the Gentiles, having no bridle of the law, nor guided by anyone, but always dashed down and broken among the precipices and in the abysses of idolatry, learned by the Lord's sitting upon it to walk and to enter upon the right way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
