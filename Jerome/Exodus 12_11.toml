[[commentary]]
quote='''
As a figure of these shoes, those shoes in Exodus also went before, which those eating the Passover, and those who are ready to make a journey, are commanded to have. Thus, he says, shall you eat it: your loins girded, and your shoes on your feet, and your staffs in your hands; and you shall eat it in haste: for it is the Passover of the Lord (Exod. 12:11). For to eat in haste and with shod feet is a sign of preparation, so that, strengthened by the paschal food, they may be able to cross the wide and terrible desert. Whoever, therefore, is still walking, let him be shod; but whoever, the Jordan already crossed, has entered the land of promise, let him bare his foot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
