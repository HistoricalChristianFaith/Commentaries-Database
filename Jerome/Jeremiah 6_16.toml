[[commentary]]
quote='''
When you eat your meals, remember that you must immediately afterwards pray and read. Have a fixed number of lines of Holy Scripture, and render it as your task to your Lord. On no account resign yourself to sleep until you have filled the basket of your breast with a thread of this weaving. After the Holy Scriptures you should read the writings of learned people, of those at any rate whose faith is well known. You need not go into the mire to seek for gold. You have many pearls. Buy the one pearl with these. Stand, as Jeremiah says, in more ways than one so that you may come on the true way that leads to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_054.html'
source_title="LETTER 54.11"

[[commentary]]
quote='''
Thus says the Lord: Stand upon the ways and see, and ask about the ancient paths, which is the good way, and walk in it! And you will find refreshment — or purification — for your souls. And they said: We will not walk — or We will not go —. And I set watchmen over you: hear the voice of the trumpet! And they said: We will not hear. Therefore hear — or they heard —, O nations, and know, O congregation — or you who pasture flocks, or according to Symmachus: and know the testimony that is in them —, how great things I will do to them! Hear, O earth! The parable of the Gospel, if it is understood, will furnish the understanding of this passage; in it the good merchant is said to sell all his pearls, so that with their price he may buy the one most precious pearl: namely, that through the patriarchs and prophets we come to him who says: I am the way. We must therefore stand in the prophets, and contemplate most diligently, and ask about the ancient or everlasting paths — which are worn by the footsteps of many saints, which in Greek are more expressively called triboi —, which is the good way in the Gospel, and walk in it; and that way, when it has been found, affords refreshment or purification to the souls of believers. But they, on the contrary, answered: We will not walk in the way of the Gospel, the prophet saying this properly of the faithlessness of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
There are many ways, and many ways lead to one way. Indeed, it is also said in Jeremiah: 'Stand in the ways of the Lord, and ask for the eternal paths of the Lord, and you will find the way, and you will walk in it.' See what it says, Stand in the ways, and ask for the eternal paths of the Lord, and you will find the one way, and walk in it. See how through many ways we come to one way. This is also said in the gospel in other words, under another meaning of the parable, concerning that merchant who had many pearls, who sold them, and bought one most precious pearl. What it says is this: Stand in the ways, that is, have very many pearls. Stand in the ways, and ask for the eternal paths of the Lord. Beautifully it says eternal, lest we should think that at the coming of Christ the law and the prophets were brought to an end. But see what it says. Stand in the ways, in the law and the prophets. Stand in the ways; do not so believe in the one way that you abandon the many ways; but stand in the ways, and ask for the eternal paths of the Lord. Ask the paths of the Lord, what Jeremiah said, Isaiah, Ezekiel, what the rest of the prophets said. Ask the paths. It is better said in Greek τρίβους (tribous): for a path (semita) is so called from the fact that it is worn (trita) by the heel of those walking. And what is said is this: Ask the paths, that is τρίβους (tribous), which the foot of the Lord wore down: seeing that the Lord too walked in them. But when you have asked for the eternal paths of the Lord, and through those paths you have found the one way, which says 'I am the way and the life and the truth,' walk in it. See the mysteries of the scriptures: see in the simple words of the scriptures very many sacred meanings, in the ways and paths, in the law and the prophets. It did not say, walk, but, stand: do not abandon the law nor the prophets. Yet when you have found those ways, through these ways walk in this one way.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_042.html'
source_title="Homily 42, on Psalm 127"
