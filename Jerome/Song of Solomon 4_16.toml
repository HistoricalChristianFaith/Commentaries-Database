[[commentary]]
quote='''
Of these two winds the Church speaks: Arise, O north wind, and come, O south wind, so that, as the north wind, a most cold wind, which is interpreted as the devil, withdraws, the south wind, a warm wind, may come; seeking him, the bride says: Where do you pasture, where do you lie down, at noon?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
