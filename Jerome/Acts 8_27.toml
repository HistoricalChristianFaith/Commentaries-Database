[[commentary]]
quote='''
We read also in Jeremiah that Ebed-melech the Ethiopian eunuch pleased God; and in the Acts of the Apostles that the Ethiopian eunuch of Queen Candace had such zeal for the Scriptures and the law of God that he read in his carriage, and came to Jerusalem to worship the Lord in his temple. Hence such faith is crowned with a worthy reward, and Philip the evangelist is sent to him, and at once he is taught, believes, is baptized and is saved. And he is not set down only as a eunuch, but with the addition of man: a eunuch, a man, an Ethiopian. For because he was a eunuch of Christ, and had made himself a eunuch for the sake of the kingdom of heaven, for that reason he had not lost the name of man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
