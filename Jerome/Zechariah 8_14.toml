[[commentary]]
quote='''
What is written, I did not have mercy, or I did not repent, the heretics slander, as though the Lord were either cruel or changeable, if he either does not repent or repents. For if he has repented, they say that he is changeable; if he has not repented, they assert that he is cruel. Yet God repented that he had anointed Saul as king. And among the Ninevites, to whom he had announced through the prophet: Yet three days, and Nineveh shall be overthrown, because they did repentance, he himself too is said to have changed his sentence, not through the fault of an improvident mind, but from the difference in what they do, badly or well. For if they do evil, he threatens; if they have blotted out their former sins, he has mercy; God is not changed, who is one and the same and cannot be changed, but when they have changed from evil to good works, he himself also changes his own decree. He it is who also speaks in Genesis: The cry of Sodom and Gomorrah has been multiplied, and their sins are exceedingly great; I will go down, therefore, and see whether they are fulfilling it according to their cry which has come to me; and if not, that I may know. What he said is this: If they persist in their fury, punishment will not be lacking to the sinners; if they cease from their madness, they will become most worthy of my knowledge. For the Lord knows those who are his. And the Apostle writes to the Galatians: But then, not knowing God. And although God knows all, and nothing past, nor present, nor future is hidden from him, in the Gospel he says that he does not know the wicked: Depart from me, workers of iniquity, I do not know you. Therefore let us take both the knowledge and the repentance, and the wrath and indignation, and all the affections of God, not according to the defect of human speech, but according to the sense of the divine majesty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
