[[commentary]]
quote='''
That is to say, I need not the aid of the Apostles, though all the twelve should fight for me, seeing I could have twelve legions of the Angelic army. The complement of a legion among the ancients was six thousand men; twelve legions then are seventy-two thousand Angels, being as many as the divisions of the human race and languaget.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Or do you think that I cannot ask my Father, and he will furnish me now with more than twelve legions of angels? How then will the Scriptures be fulfilled, that thus it must be done? I do not need the help of twelve apostles, even if they all were to defend me, I who can have twelve legions of the angelic army. Among the ancients one legion was made up of six thousand men. For the shortness of the time we cannot set out the number in full; let it be enough to have stated the type alone: that from twelve legions come seventy-two thousand angels (the number of the nations into which the language of men was divided).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
