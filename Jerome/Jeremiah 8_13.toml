[[commentary]]
quote='''
Gathering I will gather them, says the Lord; there is no grape on the vines and there are no figs on the fig tree; the leaf has fallen, and I have given them things that have passed by. What the time of visitation is, in which the transgressors shall collapse, he teaches more plainly, saying: 'Gathering I will gather them' — no doubt in Jerusalem —, 'so that they may be besieged by the Chaldeans for a long time and endure the evils of famine. When,' he says, 'the seasons pass, and autumn follows summer, and in winter the leaves of the trees fall, you will see everything from afar and from them you will take no food. There is no indeed grape on the vines for you, who do not take the fruit of the vines, and there are no figs on the fig tree for the besieged people, who sees the fruits of its own trees plundered by the enemy. The leaves,' he says, 'will fall when summer and autumn are past. For I have given them things which they would see pass by, so that with the greater grief they would lose the abundance of all things, which they were not permitted to touch'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
