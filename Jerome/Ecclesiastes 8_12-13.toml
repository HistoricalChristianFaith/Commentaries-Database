[[commentary]]
quote='''
But if someone follows the Seventy translators, who, as if beginning from another sense, said: And I recognize that it will be good for those who fear God, that they may fear before his face, and it will not be good for the impious man, and he will not prolong his days in a shadow, who is not fearing before the face of God. He will be able to say this: Those things too will happen of which I treated a little before; yet I recognize most clearly that it will be well with those who fear before the face of God: For the face of God is upon those who do evil. And it will not be well with the impious man; for he does not fear before the face of God, and he will not prolong his days in a shadow, that is, the days of his life, which are like a shadow to the living. Not that those who live a long time prolong their days, but those who make them great by the greatness of good works. Hence Jacob too, confessing himself a sinner, as it were, says: Few and evil are my days. And confessing in the psalm: My days, he says, have declined like a shadow, and I have withered like grass. Not that he sought a long life in the present, in which all that we live is brief, a shadow and an image: For man walks about in an image; but that he fears for the future, lest the length of his life, where true life is, be shortened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
