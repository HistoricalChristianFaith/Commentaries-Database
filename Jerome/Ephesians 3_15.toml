[[commentary]]
quote='''
Further, what follows, to the Father from whom all fatherhood in the heavens and on earth is named, is to be read not as it has been added in the Latin manuscripts, to the Father of our Lord Jesus Christ, but simply to the Father, so that the name of God the Father may be fitted not to our Lord Jesus Christ but to all rational creatures. We must ask, therefore, how all fatherhood in the heavens and on earth has been named from God the Father. And at the same time, before anything is discussed, it must be noted that he did not say, from whom all fatherhood in the heavens and on earth was born, or was created, but, from whom all fatherhood in the heavens and on earth is named. For it is one thing to merit the title of fatherhood, another to have a share in the nature. Fatherhood (paternitas), which in Greek is called πατριὰ, in Hebrew MESPHATH (משפחת), that is, kindred or family, we read also in Numbers: Take, he says, the sum of the whole synagogue of Israel, according to kindreds and peoples, according to the houses of the fatherhoods, according to the number of their names (Num. 1:2). And a little after (v. 16): These are the chosen ones of the synagogue, the princes of the tribes, according to their fatherhoods, the leaders of Israel. And again concerning the tribe of Levi: And the Lord spoke to Moses in the desert of Sinai, saying: Number the sons of Levi according to the houses of their fatherhoods, according to their peoples, according to their kindreds: every male from one month and upward, consider them (Num. 3:15). These things concern the people of Israel and the priestly and Levitical tribe. But, turning it over by myself to find where I may have read the word fatherhoods used of the Gentiles, for the present I find nothing else but the testimony of the twenty-first psalm, in which it is written: And all the families (patriæ) of the nations shall worship in his sight (Ps. 21:28); and of the twenty-eighth: Bring to the Lord, you families (patriæ) of the nations; bring to the Lord the sons of rams (Ps. 28:1). Just as, then, God imparts the name of his essence and substance to the other elements as well, so that they too are said to be, not because they are according to nature (for there was a time when all things were not, and again, if he wills, they will return into nothing), but they have it as a gift of God's goodness that they are said to be: so too he has bestowed the name of fatherhood from himself on all. That this may become clearer, I shall bring forward the testimony of the Scriptures. The Lord speaks in Exodus: I am who am (Exod. 3:14); and: Thus you shall say to the sons of Israel: He who is has sent me to you. Was God alone, and were the other things not? Surely the angels, heaven, earth or the seas, and Moses himself, to whom the Lord was speaking, and Israel, and the Egyptians, to whom and against whom he was being sent as prince and adversary, also were. And how does God claim for himself as his own a name common to substance? For the reason we have stated: because the other things received their being by the kindness of God. But God, who always is, and has no beginning from elsewhere, and is himself his own origin and the cause of his own substance, cannot be understood to have from elsewhere that by which he subsists. For in fire too, the hot is one thing and the heated another. Fire cannot be understood without heat. The other things that are heated by fire borrow its heat, and if the fire withdraws, their heat gradually lessens, they return to their own nature and are no longer called hot. In this sense it is said also in the Gospel to him who thought the Savior to be not the Son of God but a good teacher: Why do you call me good? No one is good but the one God (Luke 18:19). And certainly we read of good ground (Luke 8), and of a good man (Matt. 12), and of a good shepherd (John 10); but no one is good according to nature but God alone. The other things obtain being called good through his goodness. Just as, therefore, he who alone is good makes others good, and he who alone is immortal bestows immortality, and he who alone is true imparts the name of truth, so too he who alone is Father, because he is the Creator of all and the cause of the substance of all things, grants to the others that they be called fathers. Let us contemplate heavenly things from earthly ones. Adam, whom God first formed, and whose Creator and Father God was, surely knows that he owes to God the Father that by which he subsists. Again, those who were begotten of Adam understand him as the father from whom they sprang. Hence also in the Gospel according to Luke, when the generations had been reckoned backward step by step from Christ to David and Abraham, at the end Scripture says: sons of Seth, sons of Adam, sons of God (Luke 3:38), to show that the word fatherhood on earth first arose from God. But it is asked for what reason all fatherhood in the heavens is also named from him. Just as we, who are not of the race of Abraham, are called sons of Abraham if we have his faith, and call the patriarchs also and the prophets our fathers (provided only that our sins do not separate us from them), so I think that the angels too and the other virtues have princes of their own kind in the heavenly places, whom they rejoice to call fathers. For one can be called archangel only as archangel of angels; and dominion, principality and power are not so called unless they have inferiors subject to them. This too, therefore, can be said: since God the Father of our Lord Jesus Christ is Father according to substance, and the Only-begotten is Son not by adoption but by nature, the other creatures have merited the name of fatherhood by adoption. And whatever we say of the Father and the Son, let us know that it is said also of the Holy Spirit. For our Savior too knew himself to be a Father, saying: Son, your sins are forgiven you (Mark 2:5); and: Daughter, your faith has made you whole (Matt. 9:22); and: My little children, yet a little while I am with you (John 13:33); and through the Holy Spirit all the righteous are adopted as sons. Valentinus thinks that the emanations and marriages of his ages are confirmed above all from this passage, by no means understanding, as we said above, that fatherhoods in heaven and on earth are not made after the likeness of God the Father, but are so called.
'''
