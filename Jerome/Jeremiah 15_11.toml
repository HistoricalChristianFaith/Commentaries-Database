[[commentary]]
quote='''
The Lord says: if your remnant is not for good, if I did not meet you in the time of affliction and in the time of tribulation — and of distress — against the enemy. These words can also be taken in the person of Jeremiah, who was compelled to prophesy in a most evil time, with captivity already imminent, and to suffer hard things from an unbelieving people. To what he had said above: Woe is me, mother, why did you bear me a man who am to be judged and contended with by all the earth? and the rest, the Lord answers: 'Do not consider the present, but the future; for your remnant and your last things will be for good. Indeed even at present, when the enemies desired to crush you, I was at your side, and you were protected by my help'. This, moreover, can be referred as well to Jeremiah as, according to the dispensation of the flesh he assumed, to the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
