[[commentary]]
quote='''
(Chapter VI - Verse 2) But the sons of God saw the daughters of men, that they were fair. The Hebrew word Elohim (), is of common gender: and both God and gods are called by this name. Hence, Aquila, in the plural number, dared to call them Sons of gods, understanding them to mean the Holy Ones or Angels. For God stands in the assembly of gods: but in the midst of them He judgeth gods. (Alternate reading: judgeth). (Psalm LXXXI, 1). Therefore, Symmachus, following a similar interpretation, says: The sons of the powerful saw the daughters of men, and so on.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
We read a certain apocryphal book, that at the time when the sons of God descended to the daughters of men, they descended upon Mount Hermon, and there entered into a covenant, how they might come to the daughters of men, and join them to themselves. It is a most manifest book, and it is reckoned among the apocrypha, and the ancient interpreters have said some things about it: but we say this, not for authority, but for remembrance. Like the dew of Hermon, which runs down upon Mount Zion. I read in a certain man's book, who confirms his own heresy from this apocryphal book. For what does he say? The sons of God, he says, who were descending from the heavens, and came upon Hermon, and lusted after the daughters of men, are, he says, angels descending from the heavenly places, and souls that desired bodies: since indeed the bodies are the daughters of men. Do you see how, without your knowing it, the doctrine of the Manichees arises? For just as the Manichees say that souls desired human bodies, and were joined by the pleasure of the bodies: so these too, who say that the angels desired bodies, that is, the daughters of men, do they not seem to you to say the very thing that the Manichees also say? It is long now to speak against them: but I wished only to point out from what volume, as it were, they confirm their doctrine by occasion of this text.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_045.html'
source_title="Homily 45, on Psalm 132"
