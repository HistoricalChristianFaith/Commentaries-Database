[[commentary]]
quote='''
They, instead of a belt, are girded with ropes and haircloth; to us, with the apostles, it is said: Let your loins be girded, and burning lamps in your hands. We are girded with the truth of Christ, fulfilling what is written: Stand, having your loins girded in truth. But they, instead of truth, are girt about with the lie of the devil. Our head, of which the Savior speaks: But even the hairs of your head are numbered, has perpetual hair, and in our head, who is Christ, we possess strength to kill the lion. But they slept on the knees of the harlot synagogue, and, shaved bare as the devil sheared them, lost the power of the head, losing together with their strength their eyes, of which it is written in Ecclesiastes: The eyes of the wise man are in his head, but he who is a fool walks in darkness. Their companions pass their days in mourning; our comrades are clothed with the garment of gladness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
