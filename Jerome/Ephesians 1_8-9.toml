[[commentary]]
quote='''
In all wisdom and prudence making known to us the mystery of his will.

That wisdom (sapientia) and prudence (prudentia) are different the Stoics also hold, saying: "Wisdom is the knowledge of things divine and human; prudence, however, of mortal things only." According to this division we can take wisdom as concerning things invisible and visible, but prudence as concerning visible things only. It is asked, therefore, how God has made known to us in all wisdom and prudence the mystery of his will. And indeed it is first to be taken simply that the mystery of his will is our redemption through the blood of his Son, and the remission of sins, according to the riches of his grace, by which he abounded in us: namely, that we, believing in the Lord's passion (which is foolishness to those who do not believe), possess wisdom and prudence. Next, that through his Scriptures he has made known to us all the mysteries: how he first contrived heaven and earth, and made, ordered and distinguished all things that are within them; how man was formed, and the world was filled up to the passion of Christ; how from visible things those that are invisible are known. Lastly, that even the things that are on earth need wisdom and prudence. For how few of us know what it is that holds birds suspended in the air and fish in the waves, and moves forward the steps of men, and rouses the rage of beasts? But the diligent reader will at once object to us: If Paul knows in part and prophesies in part, and now sees through a mirror in an enigma (1 Cor. 13), how has the mystery of God been revealed either to him or to the Ephesians in all wisdom and prudence? By this necessity, therefore, we are compelled to change the order of the reading and to make it: According to the good pleasure of his will, to the praise of the glory of his grace, in which he graced us in the Beloved; in whom we have redemption through his blood, the remission of sins, according to the riches of his grace, by which he abounded in us in all wisdom and prudence, so that, when we have marked the division up to this point (so, that is, that all wisdom and prudence are joined to what precedes), we then go on: making known to us the mystery of his will according to his good pleasure. But even with this sense remaining, namely that they see in part and prophesy in part, it can be said that the mystery has now been revealed to them in all wisdom and prudence. Not that they themselves learned the mystery in all wisdom and prudence, but that God, in all his wisdom and prudence, revealed the mystery to them as far as they were able to attain it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
