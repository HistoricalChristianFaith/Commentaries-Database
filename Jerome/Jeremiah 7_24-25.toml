[[commentary]]
quote='''
And they did not hear nor incline their ear, but they went off in the wills — or desires — and the depravity of their evil heart, and they became backward and not forward, from the day on which their fathers came out of the land of Egypt until this day. 'When I said: Hear my voice and I will be your God and the rest, they did not hear nor incline their ear, but they did the desires of their own heart, and against the judgment of the Apostle, who forgot what lay behind and stretched himself toward what lay before, they did the contrary, so as to desire the past and despise the future.' And when he says: from the day on which their fathers came out of the land of Egypt until this day, he says that they spent all the time in between in offense against the Lord. Hence the grace of the Gospel was also necessary, which saved them not by their own merit but by the mercy of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
