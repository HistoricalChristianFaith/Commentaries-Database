[[commentary]]
quote='''
By Jerusalem He means not the stones and buildings, but the dwellers there, over whom He laments with the feeling of a Father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jerusalem, Jerusalem, you who kill the prophets and stone those who are sent to you, how often I wished to gather your children as a hen gathers her chicks under her wings, and you would not. Jerusalem (he means not the stones and buildings of the city but its inhabitants), which he laments with a father's affection, as we also read in another place that, seeing it, he wept. And in saying, how often I wished to gather your children, he testifies that all the prophets of the past were sent by him. The likeness of the hen gathering her chicks under her wings we read also in the song of Deuteronomy: As an eagle protects its nest and has longed over its young, spreading its wings it took them up and bore them on its pinions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
He calls them mother and sons, not because the mother is one thing and the sons another; but just as the Lord, speaking to the people of the Jews, said: Jerusalem, Jerusalem, who kill the prophets and stone those who are sent to you, how often I wished to gather your sons, as a hen gathered her chicks under her wings, and you would not? Not that Jerusalem was one thing and her people another; for he was not speaking to the rubble of the city and its timbers and stones apart from the people. So the multitude of the people and the whole crowd of the Hebrew nation to which he speaks is called mother; and the sons are either the individuals of the people, or those scattered through the towns and villages.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
