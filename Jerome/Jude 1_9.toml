[[commentary]]
quote='''
No one, too, to blaspheme, is not taken simply. For he does not say, to blaspheme no man, but absolutely, no one: not an angel, not any creature of God. For all things that were made by God are very good. "When Michael the archangel was disputing with the devil about the body of Moses, he did not dare to bring a judgment of blasphemy, but said, May God command you" (Jude 9). If, then, Michael did not dare to bring a judgment of blasphemy against the devil, who was surely most deserving of a curse, how much more ought we to be pure of every curse? The devil deserved a curse; but blasphemy ought not to come out through the archangel's mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
