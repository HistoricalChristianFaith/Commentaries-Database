[[commentary]]
quote='''
He calls the Scribes and Pharisees who are the clergy of the Jews, wolves.

Wise, that they might escape snares; simple, that they might not do evil to others. The craft of the serpent is set before them as an example, for he hides his head with all the rest of his body, that he may protect the part in which life is. So ought we to expose our whole body, that we may guard our head which is Christ; that is, that we study to keep the faith whole and uncorrupt.

The harmlessness of doves is shown by the assumption of that form by the Holy Spirit; as the Apostle speaks, In malice be ye children.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Behold, I send you as sheep in the midst of wolves. He calls the scribes and Pharisees, who are the clergy of the Jews, wolves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Be therefore prudent as serpents and simple as doves. So that through prudence they may avoid snares, and through simplicity may do no evil. The cunning of the serpent is set forth as an example because it hides its head with its whole body and protects that in which its life is. So we too, at the risk of our whole body, should guard our head, which is Christ. The simplicity of doves is shown from the appearance of the Holy Spirit. Hence the Apostle too says: In malice be little children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
The Lord commands in the Gospel that we be simple as doves and shrewd as serpents, so that, imitating the simplicity of doves and the shrewdness of the serpent, we may neither be able to harm others nor suffer snares from others; but by simplicity and prudence may show ourselves balanced men, because prudence without goodness is malice, and simplicity without reason is called folly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
