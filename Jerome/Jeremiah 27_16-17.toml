[[commentary]]
quote='''
And to the priests and to this people I spoke, saying: Thus says the Lord: Do not listen to the words of your prophets who prophesy to you, saying: Behold, the vessels of the Lord will return from Babylon now quickly; for they prophesy a lie to you. — This, which we have set down, 'now quickly', is not found in the Seventy, and likewise that which follows: — Do not listen to them, but serve the king of Babylon, that you may live! Why is this city given over to desolation? And after the nations and the king he speaks to the priests and to the people, because he had already announced destruction to the prophets above, saying: so that I may drive you out and you perish, both you and the prophets who prophesy to you. And he speaks the same things which he had spoken to the king and to the nations: that they should not hear the words of their prophets and say that the vessels which had been carried away with Jeconiah and the princes and his mother were to be brought back to the temple of the Lord right now; and he warns them to serve the king of Babylon and live, and that the city, voluntarily subjected, should by no means be handed over to burning. And in this is the clemency of the Lord: to hand them over to a lighter punishment, lest they endure a heavier one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
