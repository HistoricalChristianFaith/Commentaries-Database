[[commentary]]
quote='''
Then it proceeds to their excuse; But he said unto them, Have ye not read what David did, when he was an hungred? To refute the false accusation of the Pharisees, He calls to mind the ancient history, that David flying from Saul came to Nobba, and being entertained by Achimelech the Priest, asked for food; (1 Sam. 21.) he having no common bread, gave him the consecrated loaves, which it was not lawful for any to eat, but the Priests only and Levites; esteeming it a better action to deliver men from the danger of famine than to offer sacrifice to God; for the preservation of man is a sacrifice acceptable to God. Thus then the Lord meets their objection, saying, If David be a holy man, and if you blame not the high-priest Achimelech, but consider their excuse for their transgression of the Law to be valid, and that was hunger; how do ye not approve in the Apostles the same plea which you approve in others? Though even here there is much difference. These rub ears of corn in their hands on the sabbath, those ate the Levitical bread, and over and above the solemn sabbath it was the season of new moon, during which when sought for at the banquet he fled from the royal palace.

Observe that neither David nor his servants received the loaves of show-bread, before they had made answer that they were pure from women.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he said to them: Have you not read what David did when he was hungry, and those who were with him, how he entered the house of God and ate the loaves of the presentation, which it was not lawful for him to eat, nor for those who were with him, but for the priests alone? To refute the false charge of the Pharisees he recalls the old history, when David, fleeing Saul, came to Nob and, received by Ahimelech the priest, asked for food; and he, since he had no common loaves, gave him consecrated ones, which it was not lawful to eat except for the priests and Levites alone, and he asked only this, whether the young men were clean from women; and when David answered, since yesterday and the day before, he did not hesitate to give the loaves, judging it better (as the prophet says: I desire mercy and not sacrifice) to free men from the danger of hunger than to offer sacrifice to God. For the salvation of men is a victim pleasing to God. So the Lord sets this against them and says: If David too is holy, and Ahimelech the high priest is not blamed by you, but both transgressed the command of the law with an acceptable excuse, and hunger is the cause, why do you not approve in the apostles the same hunger that you approve in the others? Although even in this there is a great difference: these rub ears of grain in their hands on the Sabbath; those ate the levitical loaves, and the days of the new moons were added to the solemnity of the Sabbath, on which, being sought at the banquet, he fled from the royal court. Note that neither David nor his young men received the loaves of the presentation before they had answered that they were clean from women.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
