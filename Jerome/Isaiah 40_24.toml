[[commentary]]
quote='''
These princes and judges of the earth (or, as others suspect, of heaven) were neither sown nor planted nor made firm with a solid root, and suddenly, at God's command, they are carried off and perish, as stubble is snatched away by whirlwind and tempest; according to what is written: And I passed by, and he was not; and I sought him, and his place was not found (Ps 36 [37]:36).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
