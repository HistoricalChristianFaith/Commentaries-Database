[[commentary]]
quote='''
And you dwell with scorpions. Such as can strike, such as can wound both with an arched blow and with a hollow sting, so that the same stroke both opens the skin and pours in the venom. Each one receives his name according to his character: to the scribes and Pharisees it is said: Brood of vipers, and of Herod, who was a shifty turncoat: Go and tell this fox; and the false prophets in this same prophet are compared to foxes, and now, for their untamable heart, they are said to be scorpions; whence in the Gospel too we read: All who came before me were thieves and robbers, and the sheep did not hear them — and how did the lost sheep of the house of Israel hear the adversaries? —, from which it is shown that those who heard the thieves and robbers lost the name of sheep and took on other names, so that they did not perish as sheep but as vipers, foxes and scorpions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
But this too can be said: that when the Lord and Savior, after the shedding of his blood and his Church gathered from Jews as well as from Gentiles, wished to heal the sins of the people and to bring them back to repentance, suddenly Ephraim, who promise an abundance of false dogmas, and the people of Samaria, who say that they keep the commandments of God, rose up and wrought the idol of false dogmas; and through them the thief and robber, the devil, entered the Church; or else the very doctrine of the heretics entered, like a thief and a robber, of whom the Savior too says in the Gospel: All who came before me were thieves and robbers. Thieves lie in wait and deceive by hidden fraud; robbers boldly carry off what belongs to others. For those who steal, steal by night and in darkness. Hence he says pointedly that the thief entered secretly, and that the robber plunders outside. For they cannot strip those whom they have taught of the garment of Christ unless they have led them out of the Church and made them walk in the perverse way of their doctrines. By the thieves and robbers who came before the Lord we ought to understand not Moses and the prophets, who are always praised by the mouth of the Savior, but the false prophets; and afterwards the heretics, who were not sent by the Lord but came of their own will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
