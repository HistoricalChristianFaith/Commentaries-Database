[[commentary]]
quote='''
I think that it was for the pressing out of such wine and oil that Job suffered many things, and that, after he had made the wine and the oil, he heard from the Lord: Do you think that I answered you otherwise than that you might appear just? As if he were speaking to the grape and the olive: Do you suppose that I pressed and afflicted and crushed you for any other reason than to press wine and oil out of you?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
