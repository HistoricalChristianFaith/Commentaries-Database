[[commentary]]
quote='''
The lion, he says, will roar, and who will not fear? The Lord God has spoken, who will not prophesy? The word who is taken in this passage not for the impossible, but for the rare. For he will not fear, and he will not prophesy, who because of his hardness has scorned to hear the Lord. And the sense according to the history is this: If at the voice of the lion all things tremble and the whole nature of living creatures is terrified, shall we, when God commands us to speak and announce to the people the punishments to come, not prophesy? Shall we not speak? I know that a certain man has left it written in his commentaries that the roaring lion is to be understood as the devil, roaring at those who are going to perish, but that God, who speaks through the prophets, is to be referred to the Lord the Savior; so that, as they hear the lion's roaring in the bad sense and are taken captive unto death, so the saints may hear the Lord commanding in the good sense, and be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
