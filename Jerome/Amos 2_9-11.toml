[[commentary]]
quote='''
But I destroyed the Amorite from before their face, whose height was the height of the cedars, and he was strong as an oak; and I crushed his fruit above, and his roots beneath. It is I who made you go up from the land of Egypt, and I led you out in the desert forty years, that you might possess the land of the Amorite; and I raised up of your sons for prophets, and of your young men Nazirites. LXX: But I took away the Amorite from before their face, whose loftiness was as the height of the cedar, and he was strong as an oak; and I dried up his fruit above, and his roots below. I led you out of the land of Egypt, and led you around in the desert forty years, that you might possess the land of the Amorites; and I took of your sons for prophets, and of your young men for sanctification. You indeed sold the just man for silver and the poor man for sandals, striking his head, or crushing the heads of the poor in the dust, and you turned aside the way of the humble, so far that father and son went in to one girl and violated, or profaned, my holy name; and your garments, polluted by brothels and fornication, you bound with the chains of sins, so that you committed adultery in the holy place and, joining injustice to drunkenness, drank another's wine, and did this in the house of your God. But I, on the contrary, in return for your evils, which you paid back to me, bestowed good things on you: so that, as you were coming out of Egypt, I destroyed before your face Sihon king of the Amorites, who was as lofty and as strong as a cedar and an oak; and I crushed his fruit above, and his roots below. I led you out of Egypt, and through forty years I made you come to the holy land by a long circuit, that you might possess the land of the Amorite, of which we spoke above, which Moses divided to the sons of Reuben and Gad and to the half-tribe of Manasseh; and after such great benefits I added this as well, that I took prophets to myself from your sons, and from your young men, or chosen ones, made Nazirites, whom the Seventy translated as sanctified. Nor indeed, where the praises of God are spoken of, must the order of the history be kept; but it often happens that what was done first is told last, and what was done last is set at the beginning. This the seventy-seventh (78th) psalm and the hundred and fourth (105th), where the power of the signs, not their order, is described, will be able to teach us, and so will the titles of the psalms, of which let us set down only two examples, those of the third psalm and of the fifty-first (52nd), where what was done earlier is narrated last, and what we read as last is placed at the beginning. For in the volume of Kings we read that what concerns Doeg the Edomite, which is the title of the fifty-first (52nd) psalm, was written before Absalom rose against his father, which is noted at the head of the third psalm in its title. So too the Amorite was destroyed, or blotted out, last, which is now told first; and his making them go up from Egypt, and afterwards leading them out into the wilderness for forty years, we read was done at the beginning, things which are told last here, the order being changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
His roots too he cut down and broke in pieces, so that nothing of the evil tree might sprout afterwards; and the Lord himself made us go out from the world and, through forty years, a number which always belongs to affliction and fasting, to mourning and sorrow, come through tribulations and straits to the holy land, that we might first possess the land of the Amorite, and the region that was once his might become our possession; and that afterwards he might raise up prophets from our sons, all the holy men who received the prophetic spirit, of whom we read more fully in the first epistle to the Corinthians; and that from our young men, or chosen ones, he might take Nazirites and sanctified ones, who, offering their souls to God in sacrifice, do not touch wine, which can make men drunk and overturn the state of the mind, so that they may have the hair of Samson, in whose head, because the head of a man is Christ, his strength and victory resided.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
