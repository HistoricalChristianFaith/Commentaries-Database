[[commentary]]
quote='''
It should be noted also that in the Scriptures a cry is to be understood not as the emitting of a loud voice but as the greatness of knowledge and of doctrines. For in Exodus too the Lord answered Moses: "Why do you cry to me" (Exod. 14:15)? although no voice of Moses at all had gone before. But Scripture called a cry his heart, pierced with compunction and groaning tearfully for the people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
Understand my cry. A cry in the Scriptures is not of the voice, but of the heart. Thus to Moses it is said, 'Why criest thou to me?' though Moses had not cried out before. Understand my cry. And the apostle: 'Crying in our hearts, Abba, Father.' Surely he who cries out does not cry in the heart, but cries with the tongue. And how does the apostle say, Crying in our hearts? When therefore our groaning and our conscience make supplication, God understands that cry. Whence Jeremiah also says: 'Let not the pupil of my eye be silent.' See what he says, Let not the pupil of my eye be silent. And sometimes the pupil of the eye cries out to God. Surely if it cries, the tongue cries, not the pupil of the eye. But just as we cry in our hearts when we entreat the Lord with groaning, so when we pour out tears to God, at that time the pupil of our eye cries out to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_002.html'
source_title="Homily 2, on Psalm 5"

[[commentary]]
quote='''
With my hands by night: that is, I cried out, I cried out with my hands. Therefore it is also said to Moses: "Why do you cry to me?" And surely it is not written there that Moses cried to God; but because his heart cried "Abba, Father," and his heart cried out, therefore he says, Why do you cry to me?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="Homily 10, on Psalm 76"

[[commentary]]
quote='''
Moses was standing with the people, and Pharaoh was pursuing behind his back, and on every side there was distress for him. At that time he wept to God, and immediately God said to him: 'Why do you cry out to me?' While he was praying in silence, he was heard; yet Scripture does not record that he spoke, but only that he wept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
