[[commentary]]
quote='''
The voice of the cry of the shepherds and the howling of the nobles of the flock — or the jubilation of the rams —, for the Lord has laid waste their pastures. And the fields — or the beautiful things — of peace have fallen silent before the wrath of the fury of the Lord. Here too it should be noted that in the Seventy 'jubilation' is put for 'howling'. Now between the shepherds and the rams there is this difference: the shepherds are taken to be those in the Church who preside over the flock with wisdom and learning and teaching, but the rams those who seem indeed to be leaders among the people, but have in themselves nothing of teaching and wisdom, and through excessive simplicity are almost neighbors of folly. But when we have peace and do not understand either the good things or the beautiful things of peace, but give ourselves over to luxury and idleness and pleasures, then the good things of peace will grow quiet, or fall silent, and will be taken away from us because of the wrath of the Lord's fury, and that which is written will be fulfilled: when they say: peace and security, then sudden destruction will come upon them, at whose coming all things will fall silent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
