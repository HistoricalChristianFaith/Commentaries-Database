[[commentary]]
quote='''
Righteous indeed are you, O Lord, if I dispute with you — or for I will satisfy you — ; yet I will speak judgments to you: Why is it that the way of the wicked prospers, and it is well with all who transgress and act wickedly? You planted them and they have put forth root; they prosper — or they have begotten sons — and they bear fruit; you are near to their mouth and far from their reins. This disputation is indeed against all who act wickedly, and the meaning of Psalm 72 (73) is briefly summed up in it, in which the prophet says: How good is the God of Israel to those who are upright of heart! But my feet were almost moved, my steps had almost been poured out, because I was jealous of sinners, seeing the peace of sinners, and so on. But properly it is said against the heretics: though they are wicked, their way prospers, and they beget as sons those whom they have deceived in heresy, and they transgress and act wickedly, so that they despoil the Church, and, while they persist in the perversity of their opinion, they boast that they have been planted by God and have put forth root, have begotten sons and have borne fruit; and though they repeat the name of Christ again and again, they do not have God dwelling in them, according to that word of Isaiah: This people honors me with their lips, but their heart is far from me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
