[[commentary]]
quote='''
Hence in another place too the Apostle himself says that he is imperfect and again perfect, which, if it lacks interpretation, seems to be a contradiction; for he says: Not that I have already received, or am already perfect. Brethren, I do not reckon that I have laid hold; but one thing: forgetting what lies behind, stretching forward to what lies ahead, I pursue the appointed goal, toward the prize of the upward calling of God; and when we would think that by his own profession he is not perfect, and that he is seeking rather than has found what is true, he says that not only he himself but others with him are perfect: As many then as are perfect, let us be of this mind; and the sense of this place is: 'In comparison with the rest of men, who have no care for the knowledge of the Scriptures nor of the mysteries of God, I confess that I am perfect; but as regards the knowledge of the divine majesty, I now see in an enigma, and through mist and darkness, and I say with the prophet: Your knowledge has become wonderful to me; it is too strong, and I shall not be able to reach it' —.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"

[[commentary]]
quote='''
Then too, he does not seek market days or solemn feasts, nor does he observe any difference of days, because every time is a festival as well; but the people enter and go out only on market days and on solemn feasts, and not by the same way, but by one way and then another: for it is written: And when the people of the land enter in the sight of the Lord on the solemn feasts, he who enters by the gate of the north to worship, let him go out by the way of the southern gate; and he who enters by the way of the southern gate, let him go out by the way of the gate of the north: he shall not return by the way of the gate by which he entered, but shall go out opposite it — which is commanded not only to those who go out of Sodom, and to whom it is said: Do not look back, nor only to those who put their hand to the plow, that they not look back at the things that are behind their back, but those too who are set in the house of the Lord are commanded not to look behind their backs and return to the weak and beggarly elements, and, having begun in the spirit, be finished in the flesh, but to advance from spiritual things also to greater ones and to say with the Apostle: Forgetting the things past, and stretching myself out to the things before, so that they may by no means know in part and prophesy in part, but come to the perfect: yet according to that perfection which human nature can contain, so that we may understand that saying of the Gospel: And you, when you have done all things, say: We are unprofitable servants; what we ought to do, we have done; whence the Apostle too, in the same epistle, speaks of two perfections: for as one perfect he writes: Not that I have already received, and that I am already perfect; but I pursue, if I may lay hold of that in which I also have been laid hold of by Christ, and at once he speaks as one perfect: But one thing: forgetting the things behind, stretching myself out to the things that are before, I pursue according to the purpose toward the prize of the upward calling. As many therefore as are perfect, we are of this mind — for how can the statement stand, that he who had said: Not that I have already received or that I am already perfect, should dare to say: As many therefore as are perfect, we are of this mind? —, from which it is plain that every human being and the whole creation, although it has come to perfection, nevertheless needs the mercy of God and possesses full perfection from grace, not from merit —.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
