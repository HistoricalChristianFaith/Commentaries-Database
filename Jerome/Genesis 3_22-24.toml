[[commentary]]
quote='''
But if we read according to the Seventy, who rendered the sense from the Hebrew rather than the words, the days of the tree of life, we understand the tree of life which is set in paradise. Lest Adam should stretch out his hand to it and live, he was cast out of paradise (Gen 3). To guard it were set the Cherubim, that is, a multitude of knowledge, and a fiery sword, to keep the way of the tree of life, lest Adam, placed in sin and not yet acknowledging his offenses, should eat of it and die the death of impenitence, despair and pride.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
