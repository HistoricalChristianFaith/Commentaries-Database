[[commentary]]
quote='''
Read Plato; unroll the subtleties of Aristotle; look more carefully at Zeno and Carneades, and you will prove true what is said: The labor of fools will afflict them. They indeed sought the truth with all zeal; but because they did not have a leader and guide on the way, and thought that with human senses they could grasp wisdom, they by no means came to the city of which it is said in the psalm: Lord, in your city you will scatter their image. For all the shadows and the various images and masks which they put on themselves in their various doctrines, the Lord will scatter in his city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
