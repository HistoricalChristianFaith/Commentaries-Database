[[commentary]]
quote='''
Let the bishop also be chaste, whom the Greeks call σώφρονα; and the Latin translator, deceived by the ambiguity of the word, rendered "prudent" (prudentem) instead of "chaste" (pudicum). Now if laymen are commanded to abstain from intercourse with their wives for the sake of prayer, what are we to think of a bishop, who is every day to offer to God unblemished victims for his own sins and those of the people? Let us read again the books of Kings, and we shall find that the priest Abimelech was unwilling to give of the loaves of the presentation to David and his young men before he asked whether the young men were clean from a woman: not, of course, another man's, but a wife (1 Sam. 21). And had he not heard that they had kept away from the marital act yesterday and the day before, he would by no means have granted the loaves which he had at first refused. There is as great a difference between the loaves of the presentation and the body of Christ as between the shadow and the bodies, between the image and the truth, between the patterns of things to come and those very things which were prefigured through the patterns. Just as, therefore, gentleness, patience, sobriety, moderation, abstinence from gain, and also hospitality and kindness ought to be found especially in the bishop, and to stand out among all the laymen, so too a purity of his own and (so to speak) a priestly chastity, so that he abstain not only from the unclean act, but also from the glance of the eye and the straying of thought, so that the mind that is to consecrate the body of Christ may be free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
