[[commentary]]
quote='''
Alternatively: the thieves and robbers who go out by night, because they are sons of the night and of darkness, I take to be the heretics, who preach doctrines contrary to the truth, who steal what is enough for them, and every day hasten to seize from the flocks of the Church. These, entering the vineyard of our Lord, which he brought over out of the Egypt of this world, and of whose produce he promises that he will drink wine in the kingdom of the Father, desire so to plunder everything that they scarcely leave a cluster in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
