[[commentary]]
quote='''
Then fields were bought with money, that we might make for ourselves friends of the mammon of iniquity, who might receive us into the eternal tabernacles; and they were written in a book — doubtless the book of the living —, and the sign of the standard of the Lord's cross and victory was impressed, and witnesses were called, the martyrs and the whole choir of the saints. In the land of Benjamin, where the 'strength' of the Lord is; and round about Jerusalem, in which is the 'vision of peace' and eternal security; in the cities of Judah, in which is the true 'confession' of Christ; and in the cities of the hill country, one of which is that of which he says: a city set on a mountain cannot be hidden; and in the cities of the plain — which in Hebrew are called 'sephela' —, so that from the deep and low places we may advance across the level of the plains to the heights; and in the cities which are toward the south — for which the Seventy rendered 'nageb' —, where there is 'midday' and the full light of truth. And when all these things have been done, what is written will be fulfilled: I will turn their captivity, says the Lord, of whom it is written: ascending on high he led captivity captive; he received or — as the Apostle says — he gave gifts to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
