[[commentary]]
quote='''
And it shall be on that day, there shall be no light, but cold and frost. And there shall be one day, which is known to the Lord, not day nor night, and at evening time there shall be light. LXX: On that day there shall be no light, but there shall be cold and frost on one day, and that day shall be known to the Lord; and not day nor night, and toward evening there shall be light. Plainly the second coming of the Savior is foretold, of which John too speaks in his Apocalypse: Behold, he shall come with the clouds, and every eye shall see him, and those who pierced him. And the Lord declares in the Gospel that the Son of man will come on the clouds of heaven with power and great glory. He will come with the clouds, that is, with the angels, who are ministering spirits and are sent to various offices, and with the prophets and apostles, of whom it is written: Your truth reaches to the clouds. And when the day of his coming has been fulfilled, there shall be no light, but cold and frost, since the charity of all has grown cold, and, because of the multitude of evils that are to come upon them, all grow chill and lose the warmth of their former faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
