[[commentary]]
quote='''
Thus says the Lord to me: Make for yourself bonds and chains — or kloious [collars], which in Hebrew are called 'mutoth', and in common speech they call them 'boias' [neck-shackles] — and you shall put them on your neck and you shall send to the king of Edom and to the king of Moab and to the king of the sons of Ammon and to the king of Tyre and to the king of Sidon by the hand of the messengers who have come to Jerusalem to Zedekiah, king of Judah. And you shall command them to speak to their masters: Thus says the Lord of hosts, the God of Israel: Thus shall you say to your masters. The previous vision came to the prophet in the beginning of the reign of Jehoiakim, son of Josiah, king of Judah, but this one under Zedekiah, who reigned last in Jerusalem and under whom the city was taken and overthrown. And Jeremiah is commanded to put chains, or wooden forks, which, as we have said, are called 'mutoth' in Hebrew, on his neck, and to send them to the kings of Edom, Moab, the sons of Ammon, Tyre and Sidon by the envoys who had come to Zedekiah, and to command them to announce to their masters that they must serve King Nebuchadnezzar and hear the things which the prophet's following discourse goes on to set out. And lest perhaps the envoys and the kings of these nations should answer: 'Why do you not command this to your own people?', he speaks similar things to King Zedekiah too, and to the priests and prophets. This passage the ever-allegorical interpreter, who flees from the truth of history, interprets of the heavenly Jerusalem: that its inhabitants must voluntarily take on bodies and descend into 'Babylon', that is, into the 'confusion' of this world, which is set in the evil one, and serve the Babylonian king, without doubt the devil; and that, if they will not do this, they will by no means bear heavy bodies, but will perish by sword and famine and pestilence, and will by no means become men, but demons. Let this stand as what he said, lest his defenders bring a false charge against us. But as for us, let us follow the simple and true history, lest we be wrapped in certain clouds and illusions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
