[[commentary]]
quote='''
On that day of the passion of Christ, the man who is perfect in Christ, and who with the apostles ascends to the summit of the Lord's goodwill, shall call his neighbour, either the believers from among the Jews or at any rate the people of the Gentiles, under the vineyard which is called Sorek, and of which he says in the Gospel: I am the vine, and whose fruit gladdens the heart of man; and under the fig tree, the sweetest fruits of the Holy Spirit, so that they may rest in eternal peace and, the sedition of the world and the gore of warriors having been suppressed, may know that they are under a king whose name, mystically in Solomon, is that of peace. Of this same sitting under the vineyard and under the fig tree the prophet Micah also makes mention, saying: On that day each one shall call his neighbour and his brother under the fig tree and his vineyard, and there shall be none to terrify them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
