[[commentary]]
quote='''
Woe to you who are deep of heart, to hide counsel from the Lord, whose works are in darkness, and they say: Who sees us, and who knows us? This thought of yours is perverse, as if the clay should think against the potter, and the work say to its maker: You did not make me; and the thing formed say to him who formed it: You do not understand. LXX: Woe to those who make deep counsel, and their works shall be in darkness, and they say: Who sees us? who shall know us, and what we are doing? shall you not be reckoned as the potter's clay? Shall the thing made say to its maker: You did not make me wisely; or the thing formed to him who formed it: You did not make me? Against the same men of whom he had said above: I will destroy the wisdom of the wise, and the understanding of the prudent I will reject, or, as the prophet writes, hide, the word of God is now also directed: those who are wise in themselves and prudent in their own sight. Of whom that can most rightly be understood: They have failed, searching with searching (Ps 63 [64]); since it is written of the wisdom of God: For if anyone be perfect among the sons of men without your wisdom, he shall be reckoned as nothing (Wis 9). They think God does not know their counsels because their works are in darkness, and they say: Who sees us? and who knows us? And the wise of this world, and the teachers of the heretics, and the Pharisees of the Jews say this: that no one understands them; not remembering what is said to God: Darkness shall not be dark to you: and the night shall be lit up as the day (Ps 138 [139]:12). And: As is his darkness, so also is his light (Gen 3). Deceived by this error, Adam and Eve, hearing the sound of the feet of God walking in paradise, hid themselves under the tree in which was the knowledge of good and evil; and Cain too, saying: If you cast me out today from your face, I shall be hidden (Gen 4:14), with like folly thought that God did not know. And through Amos it is said of the ungodly and sinners: If they hide themselves from my eyes in the depth of the sea, there I will command the serpent, and it shall bite them (Amos 9:3). Hence, however wise someone may be and of the most ardent talent, if he does not have the wisdom and teaching of God, let us say of him: Unless the Lord builds the house, they labor in vain who build it. Unless the Lord guards the city, he who guards it watches in vain (Ps 126 [127]:1). And let us make a saying like it: Unless the Lord helps knowledge, he labors in vain who thinks himself wise. Unless the Lord keeps our heart with all watchfulness, he watches in vain who thinks it can be kept by his own diligence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
