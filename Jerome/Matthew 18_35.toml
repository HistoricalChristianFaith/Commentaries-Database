[[commentary]]
quote='''
That this may be made plainer, let us speak it in instances. If any one of you shall have committed an adultery, a homicide, or a sacrilege, these greater sins of ton thousand talents shall be remitted when you beg for it, if you also shall remit lesser offences to those that trespass against you.

Also this, from your hearts, is added to take away all feigned reconciliations. Therefore the Lord's command to Peter under this similitude of the king and his servant who owed him ten thousand talents, and was forgiven by his lord upon his entreaty, is, that he also should forgive his fellow-servants their lesser trespasses.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
So also my heavenly Father will do to you, if you do not forgive, each of you, his brother from your hearts. A fearful sentence, if the sentence of God is bent and changed according to our mind. If we do not forgive our brothers small things, great things will not be forgiven us by God. And because anyone can say: I have nothing against him, he knows his own affair, he has God for his judge, it is no concern of mine, whatever he wishes to do, I have forgiven him, he confirms his sentence and overturns every pretense of feigned peace, saying: If you do not forgive, each of you, his brother from your hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
