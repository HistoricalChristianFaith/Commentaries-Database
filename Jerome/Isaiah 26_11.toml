[[commentary]]
quote='''
To which the Prophet answered: O Lord, let your hand be exalted, and be stretched out to strike, so that the impious may not see you, and may not enjoy the light of your glory, not even for repentance. To whom the Lord answered: Let them rather see and be confounded, either the zeal of the people or those zealous for the people, and let fire devour and consume your adversaries, that is, those of the people of the saints. And it is the fire of repentance, which tortures their hearts because they have lost such a Lord. This can also be understood of the Jews, who did not know Christ, the arm of the Lord, and when they have seen and recognized him whom they had fastened to the gibbet, will be confounded. Then the untaught people, not knowing the law of God, will be roused by the goads of zeal, when it sees that the nations have succeeded to its place, and burns with the fire of regret, or with the pain of punishment, when it hears that which is written: Depart into the eternal fire, which has been prepared for the devil and his angels (Matt 25:41).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
