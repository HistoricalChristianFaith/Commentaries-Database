[[commentary]]
quote='''
What then is the meaning of what is said, "shall be built up," as if some great house or city were being built? Let us see where else something of this sort is written about building. Let us search in Genesis, what this saying means. "And God took," it says, "a rib from Adam's side, and built it into a woman." See what he said: "he built." For building, as we said above, is not usually spoken of except in the construction of a great house. Since therefore that rib of Adam was fashioned into a woman, according to the apostle's authority, it signifies Christ and the Church; therefore he said, "He built the woman from the rib." We have heard of the first Adam; let us come to the second, and let us see how the Church is built from his side. For the side of the Lord and Savior, hanging on the cross, is pierced by a lance, and from it came forth blood and water. Do you wish to know how the Church is built from water and blood? First through baptism, by water, sins are forgiven, then it is crowned in the blood of martyrdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
