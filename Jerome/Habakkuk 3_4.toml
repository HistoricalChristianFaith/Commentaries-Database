[[commentary]]
quote='''
What does the psalm have to say of the Savior? "As the beloved Son of unicorns." Our beloved Lord and Savior is the Son of the unicorns, the Son of the cross, of whom Habakkuk sings, "Rays shine forth from beside him, where his power is concealed." After this beloved Son was crucified, then, was fulfilled the prophecy of the psalm: "The voice of the Lord strikes fiery flames." For when Christ had been baptized and the entire universe had been purified in his cleansing, the fire of hell was extinguished.
'''
source_url=''
source_title="ON THE EPIPHANY AND PSALM 28, HOMILY 89"

[[commentary]]
quote='''
And when both the heavens have been covered by the power of God — that is, protected and clothed on every side —, and the whole earth has been filled with the praise of God, then his brightness will be as light. Now the Apostle is not silent that God the Savior is the image of God and the brightness of his glory. He, after he appeared to us as the brightness of the glory of God, returned to his former majesty. For even if we had known Christ according to the flesh, yet now we no longer know him according to the flesh, but according to the spirit, because: What was made, in him was life, and the life was the light of men. The Savior too shows this more manifestly in the Gospel, saying: Father, glorify me with the glory which I had with you before the world was made, so that after the ascension to the heavens the brightness may be what the light is, that is, that the Son may begin to be what the Father is. And as for what follows: Horns in his hands, it is the custom of the Scriptures always to put horns for kingdoms. For that too which Hannah says in the first book of Kingdoms (1 Samuel): He exalted the horn of his anointed, signifies the magnificence of the kingdom of the Savior. And in Daniel the ten horns show ten kingdoms. And it is now said: Horns in his hands, in the same way as we read written elsewhere: The heart of the king is in the hand of God, meaning that the mind and the ruling part of the heart of a holy man — who is going on to the kingdom of heaven, who while still placed on earth reigns over his body without sins — does not wander outside, but is set in the keeping of God. But since both in the Hebrew and in the other editions it is not written: Horns in his hands, but in his hand, which is said iado, let us understand the strong and mighty hand of God to be his Son. And let us say that in this hand are placed all the kingdoms of heaven, and of those who strive to ascend to heaven, as Isaiah too sounds, saying: A vineyard was made for the beloved on a horn, in a fertile place, meaning in a kingdom. For this reason, I think, no horned animal is placed among the unclean in Leviticus, and the unicorn in the psalms, or ῥινοκερότα (rhinoceros), signifies this same thing, and this too: In you we will toss our enemies with the horn. And as for what we read according to the LXX: And he placed a strong love of his power, this too is to be understood of Christ: that God the Father covered the heavens with his power, and filled the earth with praise, and made his brightness to be as light, and placed the kingdom in the hand of his Son, for this reason, that he might make his beloved be loved by men, and loved not lightly, but vehemently and strongly, so that no one might take out of his hand those who had loved him strongly and clung in his love. On the contrary, the devil makes us love the world, and in place of the love of virtue love vices, and not lightly, but strongly, so that it can be said of us: And the devil placed a strong love of his vices.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
