[[commentary]]
quote='''
Hear the word of the Lord, sons of Israel, for the Lord has a judgment with the inhabitants of the earth. For there is no truth, and there is no mercy, and there is no knowledge of God on the earth; cursing, and lying, and murder, and theft, and adultery have flooded in; and blood has touched blood. LXX: Hear the word of the Lord, sons of Israel, for the Lord has a judgment against the inhabitants of the earth; for there is no truth, nor mercy, nor knowledge of God upon the earth. Cursing, and lying, and murder, and theft, and adultery have been poured out upon the earth, and they have mingled blood with blood. From the beginning of the prophet up to this place, under the description of a harlot and of an adulteress, after whose most grievous punishments and very long abandonment there comes afterwards a restoration to the former, or to a better, state, the sins of the ten tribes, or of the two, and of all in common, are enumerated. Now the discourse turns again to Israel, that is, to the ten tribes, setting forth that it is not without cause that an angry God threatens and inflicts such grievous punishments; lest perhaps the sentence passed against those who had not sinned should seem to have been passed unjustly, not from the truth of judgment but from the power of God. Hear, says the prophet, the word of the Lord, O sons of Israel; for the Lord wishes to enter into judgment with his people and to set forth the causes of his indignation. There is no truth, and there is no mercy, and there is no knowledge of God on the earth. For neither can truth be sustained without mercy, and mercy without truth makes men negligent; hence the one is mingled with the other, and whoever does not have these will consequently not have the knowledge of God either. But on the contrary, in place of truth there is lying, and in place of mercy cursing, murder, theft, adultery. He did not say "are", but, to show the abundance of the offenses, he added: have overflowed; and in place of the knowledge of God, which is not on the earth, blood has touched blood, or they have mingled blood with blood, so as to add sins to sins and heap new ones upon the old. And rightly are those who are inhabitants of the earth, and not sojourners, summoned to judgment, because from the face of the north evils blaze up upon the inhabitants of the earth. And in the Apocalypse of John woe, woe, woe is pronounced upon the inhabitants of the earth. But whoever can say with the prophet: I am a stranger with you, and a pilgrim, as all my fathers were; and passes through this world as a sojourner and a pilgrim, follows truth and mercy and the knowledge of God, so as not to be overwhelmed by the flood of cursing and of lying, of murder and of theft, and of adultery and of blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
