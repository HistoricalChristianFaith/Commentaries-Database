[[commentary]]
quote='''
Finally, in Psalm 28 (29), where we read: The voice of the Lord shaking the desert (Ps 28 [29]:8), in the Hebrew it is written: The voice of the Lord making the desert bring forth (According to the Hebrew), so that the Church, formerly a desert, may bring forth, and the stags may be perfected when the woodlands are opened and crushed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
