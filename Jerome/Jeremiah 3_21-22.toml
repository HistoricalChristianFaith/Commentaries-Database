[[commentary]]
quote='''
A voice in the ways — or on the lips — was heard, the weeping and wailing of the sons of Israel, because they have made their way wicked, they have forgotten the Lord their God. Be converted, returning sons, and I will heal your aversions — or bruises — , for which Symmachus translated conversions. God gladly receives the penitent, and runs to meet the son worn out with want and squalor, and at once clothes him in his former garments and restores glory to the one returning, provided only that he returns with weeping and wailing. For by his own fault he has made his way wicked and has forgotten the Lord, his God and Father; to such the prophetic word now speaks: be converted, returning sons. 'Whom I call sons for this reason, because, having understood your sins, you return with weeping and wailing to your parent. And when you', he says, 'have returned to the Lord, he will heal all your bruises or aversions, by which you had withdrawn from the Lord, or certainly your conversions'. For although we return to the Lord by our own will, yet unless he draws us and strengthens our desire with his protection, we shall not be able to be saved. Let us understand this both of the people of the Jews returning to the Lord and of the heretics who have forsaken the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
