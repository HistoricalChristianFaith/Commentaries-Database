[[commentary]]
quote='''
And the angel who was speaking in me went out, and said to me: Lift up your eyes, and see what this is that goes forth. And I said: What is it? And he said: This is a jar going forth; and he said: This is their eye in the whole earth. And behold, a talent of lead was being carried, and behold, a woman was sitting in the midst of the jar. And he said: This is impiety, and he cast her into the midst of the jar, and put a lump of lead into its mouth. LXX: And the angel who was speaking in me went out, and said to me: Look up with your eyes and see what it is that goes forth; and I said: What is it? And he said: This is the measure that goes forth. And he said: This is their iniquity in all the earth. And behold, a talent of lead was lifted up; and behold, a woman was sitting in the midst of the measure, and he said: This is iniquity, and he cast her into the midst of the measure, and cast a stone of lead into its mouth. A jar, or a measure, was going forth and being carried in the air. And so that we should not be in doubt by what word it is properly named, the angel himself who had shown the jar, or measure, gives it a name; and he says, according to the Seventy: This is their iniquity in the whole earth; according to the Hebrews: This is the eye, that is, the showing of all sins. And behold, a woman was sitting in the midst of the jar, or measure, which among the Hebrews is called epha, and is often rendered by the LXX οἴφι; and this woman herself was called impiety. While he was seeing these things, behold, a talent of lead, that is, a lump like a stone, was being carried, either by its own impulse, or by the Lord's command, or it was carried by another whose name is passed over in silence. And this angel who was speaking in the prophet, and going out from him was showing him everything, seized the woman who was called impiety, and threw her headlong into the midst of the jar, she who before was being carried freely and, sitting upon the jar, was visible to all. And lest she should perhaps raise her head again, and rejoice in her iniquity and impiety, he puts the talent of lead, like a very heavy stone, into the mouth of the jar, to press down impiety in the midst and shut her in, so that she cannot in any way break out. These things we have drawn as certain shadows and outlines of the picture to come, so that we may fill in the rest with its proper colors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
