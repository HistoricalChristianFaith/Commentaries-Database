[[commentary]]
quote='''
And all the stumbling-blocks that could hinder the steps of believers the Lord will turn into level ground for them, and he will bring low the high places and raise up the low, that they may have a level and open road.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
