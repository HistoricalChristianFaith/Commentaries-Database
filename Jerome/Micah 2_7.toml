[[commentary]]
quote='''
Will his generous mercy and his most clement Spirit, which has risen widely and abundantly upon all, be cut short and be severe in us alone? Or are his thoughts of such a kind as we see in men, so that he holds on to an old anger and is roused to vengeance by sudden fury? To this the Lord answered: I am indeed good, and my words sound clemency, but to those who walk on the right road.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
There follows: If these are his devices: are not his words good with him, and have they walked upright? That the Jewish people stumbled, he says, so that the fullness of the Gentiles might come in, belongs to the dispensation of God, so that afterwards, when Israel believes, all might be saved, and all might stand in need of the mercy of God. Hence the Apostle too, coming to the question of this place, proclaims that the depth of the wisdom and knowledge and of the judgments of God is an unsearchable abyss. If, then, it is God's devices and thoughts that the former branches of the olive should be broken off and others from the wild olive grafted in, you ought not to insult but to fear lest you fall, nor should you suppose that you please God in this, if you read his words, that is, his scriptures. The scriptures profit the reader only if what is read is fulfilled in deed. If, speaking of the scriptures, you can say: Or do you seek a proof of him who speaks in me, Christ? The Lord indeed will give the word to those who preach the gospel with great power, and upon a high mountain has he gone up who preaches the gospel to Zion, and he lifts up his voice in strength who preaches the gospel to Jerusalem. And in this way the words of God are good, if they are with him, that is, if God does not desert the preacher whose heart and lips agree. But he who confesses with his lips while his heart is far from God, and recounts his justices and takes up his covenant in his mouth, and is defiled with the filth of sins, with him the words of God are not good. This is to be said not only of the sinner, but also of him who does not have spiritual grace, that is, the grace of prophecy and of teaching and of interpretation, and of the greater charisms. This must be said, that if a man of this kind wishes to give the causes of the elements and the reason for his faith, and to explain why God, who is good and the Creator of all, came to the Jews alone and called the nations only in the last age, he does not have the good words of God with him, but out of his own unskillfulness defiles even those words of God which are good, words which walk upright and require upright ears. And these things indeed the Lord commands the people that succeeded, and the Church gathered from the Gentiles: not to insult the former generation, and so by insulting not be free from reproaches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
