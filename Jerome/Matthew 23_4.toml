[[commentary]]
quote='''
But all these things, the shoulders, the finger, the burdens, and the bands with which they bind the burdens, have a spiritual meaning. Herein also the Lord speaks generally against all masters who enjoin high things, but do not even little things.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But they bind heavy and unbearable burdens and lay them on men's shoulders, but with their own finger they will not move them. This is said generally against all teachers who command great things and do not do even lesser ones. But it must be noted that the shoulders and the finger and the burdens and the bonds with which the burdens are bound are to be understood spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
