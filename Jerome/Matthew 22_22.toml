[[commentary]]
quote='''
They who ought to have believed did but wonder at His great wisdom, that their craft had found no means for ensnaring Him: whence it follows, When they had heard these words, they marvelled, and left Him, and went their way, carrying away their unbelief and wonder together.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And hearing it they marveled. Those who ought to have believed marveled at such great wisdom, because their cunning had found no opening for laying a snare.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And leaving him they went away, carrying back unbelief together with their wonder.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
