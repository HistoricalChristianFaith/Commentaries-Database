[[commentary]]
quote='''
To one who is in doubt and wavering among various opinions there comes to mind that passage of Paul the Apostle writing to the Romans: What if God, wishing to show his wrath and to make known his power, endured with much patience the vessels of wrath fitted for destruction, so that he might show the riches of his glory upon the vessels of mercy which he prepared for glory; us whom he also called, not only from the Jews but also from the Gentiles, as he says in Hosea: I called not my people, my people, and: Not Obtained Mercy, Obtained Mercy. And it will be in the place where it was said to them: Not my people are you, there they will be called sons of the living God. But Isaiah cries out on behalf of Israel: If the number of the sons of Israel be as the sand of the sea, a remnant will be saved. For he is completing and cutting short the word in equity, because the Lord will make a shortened word upon the earth. And as Isaiah foretold: Unless the Lord Sabaoth had left us a seed, we would have become like Sodom, and we would have been like Gomorrah. What then shall we say? That the Gentiles, who did not pursue righteousness, have laid hold of righteousness, but the righteousness that is from faith; but Israel, pursuing a law of righteousness, has not attained to the law of righteousness. Therefore the blessed Apostle, taking up the testimony of the prophet Hosea and expounding it of the calling of the Gentiles and of the faith of those of the Jews who were willing to believe, has cut away for us every difficulty of interpretation, asserting that it was fulfilled in the times of Christ; namely, that in Israel the twelve tribes are chosen, that is, the whole people of the Jews, and in Judah those of the Gentiles who confess the rule of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
