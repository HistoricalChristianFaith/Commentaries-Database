[[commentary]]
quote='''
But what other sons of the Church can we understand as named, except the apostles? Look, I pray you, at Peter and Paul and Matthew and John, and consider that what was promised to Abraham: I will magnify your name, has been accomplished in deed in them. Daily it is named in the Church, daily their name is magnified, not because it profits them to be named by us in the Church, but so that we, magnifying their name and reading over what they wrote, may obtain salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
