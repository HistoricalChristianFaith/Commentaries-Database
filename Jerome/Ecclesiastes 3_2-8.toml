[[commentary]]
quote='''
The Hebrews understand all this that is written about the contrariety of times, up to that place where he says: A time of war and a time of peace, as concerning Israel. And since there is no need to set out verse by verse what they interpret and think, I shall touch on it briefly, leaving a broader discussion of this to the reader's own talent. There was a time for begetting and planting Israel, a time for dying and being led into captivity. A time for killing them in Egypt, and a time for freeing them from Egypt. A time for destroying the temple under Nebuchadnezzar, and a time for building it under Darius. A time for mourning the overthrow of the city, and a time for laughing and dancing under Zerubbabel, Ezra and Nehemiah. A time for scattering Israel, and a time for gathering it into one. A time for the people of the Jews to be bound about God like a girdle and a belt, and a time for leading them into the Babylonian captivity, and for their rotting there beyond the Euphrates. Read Jeremiah's περίζωμα (loincloth). A time for seeking them and preserving them, a time for losing and a time for casting away. A time for rending Israel, and a time for sewing it together again. A time for the prophets to be silent, now in the Roman captivity, and a time for them to speak, then, when even in a hostile land they did not lack God's consolation and address. A time of love, with which he loved them formerly under the fathers, and a time of hatred, because they laid hands on Christ. A time of battle, now, while they do not repent, and a time of peace in the future, when, as the fullness of the Gentiles enters in, all Israel will be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
