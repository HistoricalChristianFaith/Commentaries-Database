[[commentary]]
quote='''
Because, then, he labored, he shall see the Churches rise up in the whole world, and shall be satisfied with their faith. Indeed, when, hungry and thirsty, he had sat down by the well of Jacob (John 4) at midday under the scorching sun, he would not use the food that had been bought, because he was already satisfied with the faith of the Samaritan woman and of the city of Shechem coming out to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
