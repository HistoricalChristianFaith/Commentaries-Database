[[commentary]]
quote='''
These stones the heretics do not imitate, who do everything for the sake of glory and gain, and pray at the corners of the streets, leaving the straight path. For every corner breaks a straight line; and therefore the harlot in Proverbs, however we may wish to take her, whose feet do not rest at home, but she either wanders out of doors or lies in wait at every corner of the streets, when she has seen a foolish young man — for she does not invite one whom she has perceived to be prudent and mature with age, of whom it is written: A man's grey hairs are his wisdom —, at once seizes him, and kisses and flatters him, and leads him to the brothel, and invites him to intercourse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
