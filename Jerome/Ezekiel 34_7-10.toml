[[commentary]]
quote='''
Hence the word of the Lord comes to the wicked shepherds, 'because you have done this and that', the things which I expounded above and which he enumerates a second time. 'Behold, I myself will come to the shepherds and will require my flock at their hand, for whom it is better that a donkey's millstone be tied to their neck than that they scandalize the least of my people; and this will be their punishment, even the greatest: That they no longer feed my flock, lest, under the pretext of the sheep, they feed themselves and amass wealth; and I will deliver my people from their mouth'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
