[[commentary]]
quote='''
The Hebrew turned to the powerful one and prince, from whose face ignorance seems to go forth. God, he explained, is that one, because men think that, in this inequality of things, he does not judge justly and as is fair. Others, moreover, think it should be joined with the preceding, so that the powerful one is he of whom it is said before these verses: If the spirit of him who has power rises up over you, do not give place. Let us not, then, be sad if in this world we seem to be lowly, knowing that it is from the face of the devil that both fools are raised up and the rich cast down? That slaves have the insignia of masters, and princes go about in the vileness of slaves. It should be noted, moreover, that here too the horse is taken in a good sense, as there: And your riding is salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
