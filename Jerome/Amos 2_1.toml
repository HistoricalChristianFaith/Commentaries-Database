[[commentary]]
quote='''
Now to prove that in the present place Moab is to be understood of the pride of the philosophers, of whom it is said: I will destroy the wisdom of the wise, and the understanding of the understanding I will reject, a few examples from the prophet must be unfolded: Amos says: Thus says the Lord: For three impieties of Moab and for four I will not turn away from him, because he burned the bones of the king of Edom to ashes — for truly, whatever there is in the world of perverse doctrines, whatever pertains to earthly knowledge and is thought to be robust, this is overthrown by the dialectical art and, like a fire, dissolved into ashes and embers, so that what was thought to be strongest is proved to be worth nothing —; Isaiah too rebukes the pride of Moab, saying: We have heard the insolence of Moab, he is exceedingly insolent; I have taken away his pride; Jeremiah also, prophesying against all the nations, speaks specifically to Moab: Because you trusted in your fortifications, and a little after: You had confidence in your glory, and again: How do you say: We are strong?, and then: Near is the day of Moab, that it should come, and its malice is exceedingly swift, and more plainly: Say: How has the glorious staff been broken, the rod of magnificence?, and again: The horn of Moab is broken; and these things are said so that, under the name of Moab, the foolish pride of the world that lifts itself up to heaven may be crushed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Thus says the Lord: For three crimes of Moab and for four I will not turn him back, because he burned the bones of the king of Idumea even to ashes. And I will send fire into Moab, and it shall devour the houses of Kerioth, and Moab shall die in the noise, in the blast of the trumpet, and I will destroy the judge from the midst of it, and I will slay all its princes with him, says the Lord. LXX: Thus says the Lord: For three impieties of Moab and for four I will not turn away from them, because he burned the bones of the king of Idumea into ashes; and I will send forth fire into Moab, and it shall devour the foundations of its cities, and Moab shall die in weakness with shouting, and with the voice of the trumpet; and I will destroy the judge out of it, and I will slay all its princes, says the Lord. Not only the sons of Ammon, but Moab too was begotten of the seed of Lot, who was the son of Abraham's brother. And so that God may show himself to be the Lord of all, and that all souls belong to his dominion, who is their maker, he avenges the injury done even to the king of the Idumeans, or rather the crime which was committed against him by the Moabites, in that they burned his bones even to ashes, and did not end their savagery and rage even at his death. The Hebrews relate that the bones of the king of Idumea, who was already buried, and who had gone up with Joram king of Israel and Jehoshaphat king of Judah against Moab, were afterwards torn up and burned by the Moabites in revenge for their grief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But just as one ought not to carry off the perfect captivity, or that of Solomon, and shut it up in Idumea, so as to make lowly and earthly men out of lofty and heavenly ones, which Gaza and Tyre are recorded to have done, so we ought not to burn the bones of the king of Idumea and dissolve them into ashes and embers. The Jews transfer the spiritual understanding into Idumean flesh, and the royal sense, which is engaged in the letter, and is most solid and most firm, they enervate and break down with certain genealogies and superfluous traditions, and reduce to dust; and not only do they do this, but all the heretics, who would have God, after the manner of a human likeness, sit on a high and lofty throne and set his feet upon the earth, so that, of course, they may not dangle; and have a nose with which to smell the odor of a good fragrance, eyes with which to see, hands through which to work, feet by which to walk, ears with which to hear, a mouth with which to speak, teeth with which to grind his food. Whoever reads that Judah went in to Tamar the harlot and begot two sons of her, if he follows the shamefulness of the letter and does not ascend to the beauty of the spiritual understanding, burns the bones of the king of Idumea. Whoever thinks that Hosea took a wife of fornication, and perceives nothing more in the saying than is contained in the simple words, burns the bones of the king of Idumea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
