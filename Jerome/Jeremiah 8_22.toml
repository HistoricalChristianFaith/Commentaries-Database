[[commentary]]
quote='''
Is there no resin in Gilead, or is there no physician there? Why then has the scar of the daughter of my people not closed over? Not only in the present passage, but also in many other testimonies of the Scriptures we find the resin of Gilead put for repentance and medicine; and we find that God now wonders why the wounds of Jerusalem have by no means been healed and the scars have not yet drawn over the skin, because there are no prophets or priests by whose medicine they ought to be healed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
