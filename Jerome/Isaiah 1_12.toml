[[commentary]]
quote='''
For who has required these things at your hands? Let the Ebionites hear, who think that the Law, abolished after the passion of Christ, is to be kept. Let the companions of the Ebionites hear, who decree that these things are to be observed only by the Jews and by those of the stock of the Israelite race. Victims, then, and the immolation of sacrifices were not required by God as a principal thing, but so that they should not be made to idols, and so that from carnal victims, as through a type and image, we might pass over to spiritual sacrifices. And by saying that he did not require victims, he shows that the Law is spiritual, and that all that the Jews do carnally is fulfilled by us spiritually.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
You shall no more tread my court. Observe that after the Babylonian devastation the Temple was built again by Zerubbabel, and that sacrifices were offered in the Temple through a long series of years (Ezra 5). Therefore he points to the last destruction of the Temple under Vespasian and Titus, which is to last until the consummation of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
