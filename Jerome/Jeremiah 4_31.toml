[[commentary]]
quote='''
For I have heard a voice as of a woman in labor, anguish — or groans — as of a woman in childbirth; the voice of the daughter of Zion, swooning and spreading out her hands: woe to me, for my soul has fainted because of the slain! He describes the city of Jerusalem wailing and crying out after the likeness of a woman in childbirth, that is, one who is bearing her first offspring. For as a woman giving birth, who has not yet experienced the pain of childbearing, swoons — she suffers anguish, she can scarcely breathe, and with her hands spread out she collapses —, so too the daughter of Zion, when she sees her children slain, bursts out into these words and says: woe to me, for my soul has fainted because of the slain! Two examples are compared in one passage: of a woman bearing children and of a woman mourning, so that whatever a woman suffers in childbirth or in the deaths of her children, Jerusalem may suffer in her peoples.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
