[[commentary]]
quote='''
Since, therefore, he says, when the Lord commands me to speak, you, Amaziah, say to me: You shall not prophesy over Israel, and you shall not drip upon the house of the idol, hear what the Lord threatens against you. For house of the idol, in the Hebrew is written beth isaac, that is, house of laughter, for Isaac means laughter; which the LXX translated house of Jacob, understanding one name in place of another, and not the thing. Again, where we have put: And you shall not drip, Symmachus translated: you shall not rebuke. Now that the prophets drip is an idiom of the Scriptures, because they do not bring on the whole wrath of God at once, but announce it in small drops by their threatening.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
