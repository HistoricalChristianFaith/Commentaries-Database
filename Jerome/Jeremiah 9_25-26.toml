[[commentary]]
quote='''
Behold, the days are coming, says the Lord, and I will visit upon everyone who have the foreskin circumcised, upon Egypt and upon Judah and upon Edom and upon the sons of Ammon and upon Moab and upon all who are shorn about the hair, dwelling in the desert; for all the nations have the foreskin, but all the house of Israel are uncircumcised in heart. In part, the peoples of many nations, and especially of those that border on Judea and Palestine, are circumcised to this day, and above all the Egyptians and the Edomites, the Ammonites and the Moabites, and the whole region of the Saracens, which dwells in the wilderness and of whom it is said: upon all who are shorn about the hair, dwelling in the desert. Judah, therefore, who is mingled with the nations written above, ought not to glory because he does not have the foreskin but is circumcised by the law of God, since others too do these things who do not keep the commandments of the law and do not know the God of Israel. Nor is circumcision, which was given as a sign, of any profit unless the commandments of the Lord are fulfilled; just as the long hair also signifies a nation, not strength of body and the bravery of fighters. And what follows: all the nations have the foreskin, but all the house of Israel are uncircumcised in heart, has this sense: whereas, apart from the Egyptians, Edomites, Ammonites and Moabites, and the Ishmaelites dwelling in the wilderness, of whom for the most part a portion is circumcised, all the other nations in the whole world are uncircumcised in the flesh, the whole house of Israel is uncircumcised in heart, not in flesh; and this uncircumcision leads to death, for that one is of the flesh, this of the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
