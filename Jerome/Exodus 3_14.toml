[[commentary]]
quote='''
There is one nature of God and one only; and this, and this alone, truly is. For absolute being is derived from no other source but is all its own. All things besides, that is, all things created, although they appear to be, soon are not. For there was a time when they were not, and that which once was not may again cease to be. God alone who is eternal, that is to say, who has no beginning, really deserves to be called an essence. Therefore also he says of him, "I am has sent me." As the angels, the sky, the earth, the seas all existed at the time, it must have been as the absolute being that God claimed for himself that name of essence, which apparently was common to all. But because his nature alone is perfect and because in the three persons there subsists but one Godhead, which truly is and is one nature, whoever in the name of religion declares that there are in the Godhead three elements, three hypostases, that is, or essences, is striving really to predicate three natures of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_015.html'
source_title="LETTER 15.4"

[[commentary]]
quote='''
But they devised malice against the Lord, building up most impious heresies, and returned to the state of the Gentiles, so as to be without the knowledge and the yoke of God; or they returned to nothing, not that they ceased to be, but because, in comparison with him who speaks to Moses: Go, say to the people of Israel: He who is has sent me, all who think against the Lord are said not to be. According to what we read in Esther, in the Seventy only. Do not hand over your scepter to those who are not: there is no doubt that it means idols. For if God is truth, whatever is contrary to truth is a lie, and is called nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Just as, then, God imparts the name of his essence and substance to the other elements as well, so that they too are said to be, not because they are according to nature (for there was a time when all things were not, and again, if he wills, they will return into nothing), but they have it as a gift of God's goodness that they are said to be: so too he has bestowed the name of fatherhood from himself on all. That this may become clearer, I shall bring forward the testimony of the Scriptures. The Lord speaks in Exodus: I am who am (Exod. 3:14); and: Thus you shall say to the sons of Israel: He who is has sent me to you. Was God alone, and were the other things not? Surely the angels, heaven, earth or the seas, and Moses himself, to whom the Lord was speaking, and Israel, and the Egyptians, to whom and against whom he was being sent as prince and adversary, also were. And how does God claim for himself as his own a name common to substance? For the reason we have stated: because the other things received their being by the kindness of God. But God, who always is, and has no beginning from elsewhere, and is himself his own origin and the cause of his own substance, cannot be understood to have from elsewhere that by which he subsists. For in fire too, the hot is one thing and the heated another. Fire cannot be understood without heat. The other things that are heated by fire borrow its heat, and if the fire withdraws, their heat gradually lessens, they return to their own nature and are no longer called hot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
