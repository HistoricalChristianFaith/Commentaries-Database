[[commentary]]
quote='''
For thus says the Lord of hosts, the God of Israel: Behold, I will take away from this place, before your eyes and in your days, the voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride. And when you have announced to this people all these words, and they have said to you: Why has the Lord spoken all this great evil against us? What is our iniquity, and what is our sin that we have sinned against the Lord our God?, you shall say to them: Because your fathers forsook me, says the Lord, and went after strange gods and served them and worshiped them, and forsook me and did not keep my law. But you too have done worse than your fathers. When the Church has sinned, all joy and all gladness is taken away from her, of which the Apostle says: rejoice; again I say: rejoice; the voice of the bridegroom and the voice of the bride, of whom it is written: he who has the bride is the bridegroom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
