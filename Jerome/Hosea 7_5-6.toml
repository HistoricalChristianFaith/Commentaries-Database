[[commentary]]
quote='''
Now let us pass to the spiritual understanding: Unhappy peoples who are led astray by the king, the devil, and by his princes; or who have taken up other solemn feasts from the prince of a heresy and from his leaders, leaving the Church and trampling on the truth of the faith, are accustomed to shout and say: This is the day of our king; for example, of Valentinus, of Marcion, of Arius and of Eunomius. Those set over them, hearing this, are not made drunk with wine, lest the sin be thought a light one, but they rave from the wine of which Moses writes in the song of Deuteronomy: Their wine is the fury of dragons, and the incurable fury of asps; for these eat the food of impiety and are made drunk with the wine of iniquity. Of this the Apostle also says: Do not be drunk with wine, in which is debauchery. And in Proverbs we read: Let princes not drink wine, lest they forget wisdom and be unable to judge rightly. Hence, both peoples and leaders having been deceived, the prince stretches out his hand to the mockers, or the pestilent, such as were the sons of Eli, and of whom we read in the first psalm: He has not sat in the chair of the pestilent; of whom it is said: Cast out the pestilent man from the council, and strife will go out with him; whose hearts were kindled, so that they might dash down those whom they had deceived. For this, according to the Seventy, is what cataracts signify, which do not lift up on high but dash down below. And what he says: All night Ephraim was filled with sleep, shows that the heretics, sleeping, do not see the light of the sun of justice. For those who sleep, sleep at night, because their sense is weighed down. And of these we read in the psalms: They have slept their sleep and found nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
