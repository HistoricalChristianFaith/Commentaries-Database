[[commentary]]
quote='''
Therefore thus says the Lord God of hosts, the Ruler: In all the streets there shall be wailing, and in all the places that are outside it shall be said: Woe, woe. And they shall call the farmer to mourning, and to wailing those who know how to wail. And in all the vineyards there shall be wailing, for I will pass through the midst of you, says the Lord. LXX: Therefore thus says the Lord God Almighty: In all the streets wailing, and in all the ways it shall be said: Woe, woe. The farmer shall be called to mourning, and to wailing those who know lamentation, and in all the ways wailing, for I will pass through the midst of you, says the Lord. I commanded you to seek good and not evil, that you might live, and that the Lord might be with you. And again I added, lest you should say that you had been warned only once: Hate evil and love good, and restore judgment in the gates, you who hated him who rebuked in the gate, that the Lord may have mercy on the remnant of Joseph. And because you would not do it, trampling on my commandments, and you turned a retreating shoulder to me, therefore thus says the Lord God Almighty, who is the Lord of hosts. Everywhere lamentation, everywhere sadness. The farmers shall be called to mourning, and those who know how to lead the dirge, after the custom of the province, so as to stir up tears, shall be called, so that the wailing and mourning shall be, not in all the streets, as was said above, but in the vineyards, so that where there was once the matter of gladness, there may be the source of tears. And all these things shall come to pass, because I will pass through, he says, the midst of you. The Hebrew word I will pass through, which in their language is said eebor, whenever it is placed in the holy Scriptures in the person of God, is to be taken as a punishment, meaning that he does not remain among them but passes through and leaves them. Hence also in other places, according to the translation of Aquila, when God is angry, he calls his fury and wrath ἀνυπερθεσίαν (no postponement).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
