[[commentary]]
quote='''
We have understood who the virginal bridegroom is; but because this bridegroom, or husband, not only received a virgin as his bride, but also, in Hosea, took a harlot as his wife, for this reason it is written in Deuteronomy: If you go out against your enemies, and the Lord your God delivers them into your hand, and you lead them captive, and see among the number of the captives a beautiful woman, and love her, and wish to have her as your wife; you shall bring her into your house, and she shall shave her hair and pare her nails, and put off the garment in which she was taken, and sitting in your house she shall weep for her father and her mother for one month, and afterward you shall go in to her and sleep with her, and she shall be your wife. The husband of such a woman, that is, her lord, is not a virginal one; rather, he takes as his wife a harlot from the filth of the Gentiles. This we can say also of every soul of the believers. If it has believed in the Lord from a tender age, it has the Lord as a virginal bridegroom. But if it has come to the truth of the faith from the Jews or the Gentiles, and from the most filthy dregs of the heretics, and has passed from darkness to light, it will indeed have a bridegroom, but not a virgin one; and of such people it is said: In Egypt your breasts were crushed, and there you were deflowered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
