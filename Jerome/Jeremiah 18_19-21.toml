[[commentary]]
quote='''
Attend to me, O Lord, and hear the voice of my adversaries! Is evil repaid for good, that they have dug a pit for my soul? Remember that I stood in your sight to speak good for them and to turn away your indignation from them! Therefore give their children up to famine and lead them into the hands of the sword; let their wives be childless and widows, and let their husbands be put to death, let their young men be pierced by the sword in battle, let an outcry be heard from their houses! In the type of the Savior, indeed, Jeremiah suffers all these things from the people of the Jews, who were afterwards laid waste when the Babylonian came; but they are fulfilled more fully and more perfectly in Christ. And when the city was overthrown they were slaughtered by the Roman sword, not because of idolatry, which did not exist at that time, but because of the killing of the Son of God, when the whole people together cried out: Away, away with such a man; we have no king but Caesar! And their imprecation has been fulfilled by everlasting damnation: His blood be upon us and upon our children! For they had dug a pit for Christ and had said: Let us take him away from the land of the living! — he who had such great mercy toward them, and stood in the sight of the Father to speak good for them and to turn away his indignation from them, that on the cross also he said: Father, forgive them! For they do not know what they are doing. We pass quickly over what is plain, so as to linger on the more obscure passages, by no means following the ravings of certain people who interpret this even of a captivity of the heavenly Jerusalem, but pursuing the clear history and the most manifest prophecy with all confidence in the words and the senses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
