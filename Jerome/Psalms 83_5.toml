[[commentary]]
quote='''
For they have taken counsel with one accord together. Unhappy are we, unhappy the people of God: it cannot have as great a concord in what is good as the wicked have in what is evil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_015.html'
source_title="Homily 15, on Psalm 82"

[[commentary]]
quote='''
Against your covenant they have made their arrangements. You spoke through the prophets; and they through Manichaeus, Marcion, Arius, and Valentinus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
