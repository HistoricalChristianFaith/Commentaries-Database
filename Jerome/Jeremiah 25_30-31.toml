[[commentary]]
quote='''
And you shall prophesy to them all these words and say to them: The Lord will roar from on high — or will give answer — and from his holy dwelling he will utter his voice; roaring he will roar over its beauty — or he will answer over his place —, a chant as of those who tread will be sung together against all the inhabitants of the earth. The sound — or destruction — has come to the ends — or upon a part — of the earth, for the Lord has judgment with the nations; he himself is judged with all flesh; the wicked he has given over to the sword, says the Lord. First let us say how the truth of the translation stands. 'To all the nations', he says, 'you shall prophesy and say that the Lord roars from on high, that is, gives a sign of his fury, according to what is written: the lion will roar, and who will not fear? the Lord has spoken, and who will not prophesy?' and from his holy dwelling he will utter his voice, so as to terrify all who hear. And he will roar over its beauty, that is, over the temple. And when he has roared, a chant will be sung like that of those who tread in the winepresses, and at the shedding of one another's blood a mournful song will be sung together, which Symmachus calls katalegma, Aquila iasmon; and the sound of this chant and song will reach to the ends of the earth, for the judgment of the Lord is with the nations. But if the judgment of the Lord is with the nations, the merits of the nations too are diverse. This serves to expound that passage, as some would have it: he who does not believe is already judged. He is judged indeed in that he did not believe; but those very ones who do not believe will be afflicted with punishments that differ among themselves. He himself is judged with all flesh, so that no one goes away unjudged. But the wicked — that is, those who do not believe in the Lord — he gives over to the everlasting sword. Allegorical interpreters expound this passage according to the Seventy in such a way as to refer the Lord's open threat to a good sense. 'The Lord', they say, 'will give answer from on high, namely to those whom he is going to save, and from his holy place he will utter his voice, and he will answer a word in his place. But they, like vintagers, full of the fruits of that sentence, will answer. Upon all the inhabitants of the earth destruction will come, not upon the whole earth, but upon a part of the earth, namely, of those who do not believe; for the Lord will have judgment among the nations, and he himself will be judged with all flesh, but the wicked will be given over to the sword'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
