[[commentary]]
quote='''
He also measured the measure of the threshold of the gate in breadth and found ten cubits, and in length thirteen cubits, and the ends of the cells — or, as Symmachus translated, παραστάδες — were narrowed into one cubit, and each front had one cubit; and the cells, or παραστάδες and, as the Seventy put of their own, 'theelatha' —, had six cubits each on either side.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
He also measured the breadth of the threshold of the gate, of ten cubits, which is a perfect number and is contained either in the Decalogue or in the mystery of the four Gospels, which, beginning from one, so proceeds to I.II.III.IIII that it fills up the number ten; its length had thirteen cubits; in place of which, in the Seventy, breadth is put again — which seems to me to have been corrupted by the negligence of the scribes: for Scripture would not have said in one place breadth and again breadth, of ten or of thirteen cubits —; and the gate of the threshold, in which the number of the old and the new Testament is consecrated, can be understood either as the Lord himself, who says: I am the door, or certainly as all the saints through whom we enter into the knowledge of God, of whom the apostle Paul spoke: My mouth is open to you, O Corinthians; be enlarged, you too; the thirteen cubits, after the number eight, contain the mystery of the books of Moses, which are shown both in the five loaves and in the Samaritan woman of the Gospel, who is reproved because she had had five husbands, and the sixth, whom she thought she had, she did not have; and yet the number eight and the number five are completed by one cubit, that is, the fourteenth, because in Christ all things are summed up; whence it is said: And one cubit the boundary on both sides, since one measure of Christ embraces both the old and the new testament, and one cubit encloses the height of thirty cubits of Noah's ark.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
