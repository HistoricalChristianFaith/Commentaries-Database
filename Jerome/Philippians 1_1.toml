[[commentary]]
quote='''
Should anyone think that the view that bishop and presbyter are one, and that the one (presbyter, that is, "elder") is a name of age, the other a name of office, is not that of the Scriptures but our own, let him read again the words of the Apostle to the Philippians, saying: "Paul and Timothy, servants of Jesus Christ, to all the saints in Christ Jesus who are at Philippi, with the bishops and deacons: grace to you and peace" (Phil. 1:1, 2), and the rest. Philippi is a single city of Macedonia, and certainly in one city there could not have been several bishops, as they are called. But because at that time they called the same men bishops whom they also called presbyters, for that reason he spoke of bishops indifferently as of presbyters. This may still seem doubtful to someone, unless it is proved by a second testimony.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
