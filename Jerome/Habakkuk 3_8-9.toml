[[commentary]]
quote='''
Were you angry with the rivers, O Lord, or was your fury against the rivers, or your indignation against the sea? For you will mount upon your horses, and your chariots are salvation. Rousing, you will rouse your bow, the oaths to the tribes which you have spoken. Always. LXX: Were you angry with the rivers, O Lord, or was your fury against the rivers, or your onrush against the sea? You who mount upon your horses, and your riding is salvation, bending, stretching your bow against the scepters, says the Lord. Diapsalma. Where the Seventy have diapsalma and Aquila always, the others translated likewise as above. And since my discourse hastens on to the tropological interpretation, I shall briefly take in the sense of the passage according to the letter and proceed to the rest. Just as you dried up the Jordan and the Red Sea, fighting for us — for you were not angry with the rivers and the sea, nor could senseless things incur any offense —, so now, mounting your chariots and seizing your bow, you will give salvation to your people, and the oaths which you swore to our fathers and to the tribes you will fulfill forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
