[[commentary]]
quote='''
Children, obey your parents in the Lord: for this is right. Honor your father and your mother (which is the first commandment in promise), that it may be well with you, and that you may be long-lived upon the land.

It is said ambiguously: whether children ought to obey those who are their parents in the Lord, or rather whether children should obey their parents in the Lord. Both are to be done: that we both obey those parents who begot us in the Lord, such as Paul and the apostles were, and do whatever they have commanded, and also comply in the Lord with our parents from whom we were born according to the flesh, fulfilling those things that are not contrary to the will of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
