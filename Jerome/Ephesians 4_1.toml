[[commentary]]
quote='''
I therefore, a prisoner in the Lord, beseech you to walk worthily of the calling with which you have been called.

He could be writing these things both in the chains of Christ and while placed in prison for martyrdom; but it is better if we call him the prisoner of the Lord in the love of Christ. Of this Clement too is a witness, writing to the Corinthians: Who will be able to describe the bond of the love of God (1 Cor. 13)? And in the first book of Kingdoms we read: It came to pass after these words, the soul of Jonathan was bound to the soul of David (1 Sam. 18:1). And the prophet, of the apostles: After you, he says, they shall follow with hands bound in iron (Isa. 45:14). For those who love Christ follow him bound with the bonds of love. There is also another exposition; whether it should be accepted or not will be in the reader's power: that this body is called the bond of the soul, and that, because Paul received this body for the ministry of the Gospel, he is consequently called the prisoner of Christ. That this body is called a bond, and that those who are bound in the body are called the prisoners of the earth, Jeremiah too testifies in the second alphabet, saying: To humble under his feet all the prisoners of the earth (Lam. 3:34). And elsewhere we read this very thing in the person of Christ, saying: To those who were in bonds: Come out; and to those who were in darkness: Be revealed (Isa. 49:9). Here, indeed, the prophet may be showing that the bond of sin and the darkness of ignorance were dissolved by the coming and preaching of Christ. But the former sense also has its place: that the bond is the body, and the darkness is this earthly dwelling, where the rulers of darkness are, and the dark mountains, against which we are forbidden to strike our feet. As for his saying: To walk worthily of the calling with which you have been called: he must be believed to walk worthily of his calling who goes forward through him who says, I am the way (John 14:6; and Isa. 30), and does not turn aside either to the right or to the left, turns his foot away from every evil way (Prov. 4), and in whom this is fulfilled: The steps of a man are directed by the Lord (Ps. 36:22).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
