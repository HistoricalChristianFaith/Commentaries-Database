[[commentary]]
quote='''
But what is said by Balaam, Let my soul die the death of the righteous, has this sense: that he desires to die to the world and to sin, and to live with the souls of the righteous, whose life is Christ, and who can sing, I will please the Lord in the land of the living; he is not indeed the God of the dead, but of the living; and if Balaam, translated into our language, means 'a vain people', which is most true, it is clear that the formerly vain people of the nations desired to have fellowship with the souls of the righteous Abraham, Isaac and Jacob, who are called εὐθεῖς, that is, 'upright' and 'righteous'; whence also the book of Genesis received its name from their designation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
