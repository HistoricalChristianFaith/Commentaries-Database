[[commentary]]
quote='''
But if anyone should set against us what is written to the Corinthians, that the husband should render the debt to the wife, and the wife to the husband (1 Cor. 7), let him observe that there is a great distance between the Corinthians and the Ephesians. To the former it is written as to little ones and sucklings, among whom there were dissensions and schisms, and fornication was heard of such as is not even among the Gentiles: and therefore it is granted to them that after prayer they return to the same thing, lest they be tempted by Satan; although even there, in what follows, he says that he pardons them not according to his will, but according to συγκατάβασιν (condescension). But the Ephesians, among whom he spent three years and to whom he opened all the mysteries of Christ, are taught otherwise: and each one has free power of choice, to follow either the Corinthians or the Ephesians, and to be saved either by the servitude of a Corinthian or by the freedom of an Ephesian.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
