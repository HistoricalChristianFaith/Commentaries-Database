[[commentary]]
quote='''
And also what follows, Do not stand in an evil word, and the rest, let us understand of one who has been caught beforehand in the error of heresy; or of one who, though he holds the faith of the Church, is yet so overcome by sins that he is unfaithful. Do not persist in detraction, nor in foul talk, luxury, avarice, lust. But if you persist, the devil, the king of vices and of sin, will work perdition in you and will do whatever he wishes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
