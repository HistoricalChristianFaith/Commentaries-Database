[[commentary]]
quote='''
Ask of the Lord rain in the late season, and the Lord will make snows and will give them showers of rain, to each one grass in the field. For the idols have spoken what is useless, and the diviners have seen a lie, and the dreamers have spoken in vain, they comforted vainly; therefore they have been led away like a flock, they shall be afflicted, because they have no shepherd. LXX: Ask rain of the Lord in due season, early and late. The Lord has made phantasies, and he will give them winter rain, to each one grass in the field, for those who spoke have spoken troubles; and the diviners false visions, and they have spoken false dreams, they comforted vainly; therefore they have been dried up like sheep, and they have been afflicted because there was none to heal. This happiness which was promised for the time of the Maccabees, when the holy stones were lifted up over the land and the Israelite state grew greater, so much that the peoples again fed on the grain of the law, and your virgins were made drunk with the wine of the Holy Spirit, is promised in part. But since it is now the last time of the prophets, and the world is declining toward its end, and all the things that have been foretold await their fulfilment, ask of the Lord that he give you the late rain, that the Christ who has been promised may come and grant you dews and snows, for which azizim is written in the Hebrew. And I do not know what the LXX meant in translating phantasies, unless perhaps they wished to describe the greatness of the grace and the wonder of the gifts by the name of phantasy. So the Lord, who is to make the snows and is to water the dryness of the whole earth with the rains of the Gospel preaching, will himself give showers to those who believe, and all things will be filled with abundance, so that, after the nations have believed in Christ, they may understand that the things they worshipped before are vain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
[[commentary]]
quote='''
But according to the spiritual understanding we can say that the Lord exhorts those who believe in Christ to ask for the late rain at the consummation of the world, when the fullness of grace is to be given, and grass will grow up for each one in his own field, so that they may be able to say: The Lord rules me, and I shall lack nothing; in a place of pasture, there he has set me, beside the waters of refreshment he has brought me up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
