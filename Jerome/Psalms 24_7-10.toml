[[commentary]]
quote='''
This is he whom the angelic powers, seeing him ascend bloodied to the Father, command the other angels, and hear from them: Lift up your gates, O princes, and be lifted up, O everlasting gates, and the king of glory will come in. Who is this king of glory? The Lord strong and mighty, the Lord mighty in battle (Ps 23 [24]:7, 8). And again: The Lord of hosts, he is the king of glory (ibid., 10). We have set this down beforehand to show that the present passage too agrees with the other testimonies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Nor is it a wonder that Christ is called almighty, in whose person we read in the Apocalypse of John: Thus says the faithful witness, the beginning of the creation of God, who is, and who was, and who is to come, the Lord God Almighty. That too which we read in Psalm 23 (24): Lift up your gates, O princes, and be lifted up, eternal gates, and the king of glory shall enter, and which again is said by other angels who did not know the mystery of the flesh assumed: Who is this king of glory? The Lord of powers, he is the king of glory, is referred to Christ. For where we read the Lord of powers, in the Hebrew Sabaoth is written, which is rendered almighty by the LXX translators. From this we understand that wherever the Lord of powers is said of Christ, he must be understood as almighty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
