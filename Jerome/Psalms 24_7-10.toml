[[commentary]]
quote='''
This is he whom the angelic powers, seeing him ascend bloodied to the Father, command the other angels, and hear from them: Lift up your gates, O princes, and be lifted up, O everlasting gates, and the king of glory will come in. Who is this king of glory? The Lord strong and mighty, the Lord mighty in battle (Ps 23 [24]:7, 8). And again: The Lord of hosts, he is the king of glory (ibid., 10). We have set this down beforehand to show that the present passage too agrees with the other testimonies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
