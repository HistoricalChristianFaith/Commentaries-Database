[[commentary]]
quote='''
This too which follows, Sanctification has come in here in the fifth month, as they had done now through many years, they try to expound thus: that the sanctification which came in is the vessels of the temple, which had been carried off by Nebuchadnezzar, restored at that time. As for the fast of the fifth and the seventh, they tried to refer it to the days of the week. But since the fast of the tenth follows, they were compelled to refer it to months, and as to what this fast of the fifth, seventh and tenth month itself is, they were entirely silent. Hence let us be content with the former explanation, and let us not incline to the false attempts of the commentators, which came from an error of translation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
