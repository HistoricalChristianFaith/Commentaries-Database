[[commentary]]
quote='''
Or, They slumbered, i. e. they were dead. And then follows, And slept, because they were to be afterwards wakened. While the bridegroom tarried, shows that no little time intervened between the Lord's first and second coming.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But while the bridegroom delayed, they all grew drowsy and slept. For no little time passes between the first and the second coming of the Lord. They all grew drowsy, that is, they died, because the death of the saints is called sleep. But it then says they slept, because they are afterward to be raised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
