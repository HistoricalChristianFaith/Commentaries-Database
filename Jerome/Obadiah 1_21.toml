[[commentary]]
quote='''
And when these things have been fulfilled, just as in the book of Judges the Lord would send saviors to save the people from captivity, so they shall go up and come onto Mount Zion, to judge and pass sentence on Mount Esau, that is, the Idumeans, as subject to them and serving them; and once all are subdued, the kingdom shall be the Lord's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"


[[commentary]]
quote='''
Now, where we have translated 'and saviors shall go up', and the Seventy rendered 'those who shall have been saved', in the Hebrew is written mosim; and these are to be understood not passively, as Aquila and the Seventy and Theodotion have it, σεσωσμένοι or ἀνασωζόμενοι (being saved), but, following Symmachus, σώζοντες, that is, actively, saviors. For σεσωσμένοι, that is, 'the saved', are called pheletim in the Hebrew tongue.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"


[[commentary]]
quote='''
These things having thus been done, the saviors, or those who shall have been saved from the remnant of the Jewish people, shall go up onto Mount Zion, to judge and take vengeance on Mount Esau. Just as the Lord, the Light, calls his apostles light, and says: You are the light of the world; and the Rock himself granted to Peter that he should be a rock; and the good Shepherd also bestowed on them the name of shepherds, and whatever he himself is called he granted to his servants that they too should be called; so the Savior himself willed his apostles to be saviors of the world, who went up to the watchtower of the mountain of the Church and, bringing down the pride of the Jews and of all the mountains that were raised up against the knowledge of God, prepared the kingdom for the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
