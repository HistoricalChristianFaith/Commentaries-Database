[[commentary]]
quote='''
But now, having been laid down because of transgressions, as we said above, it rather convicts as sinners those to whom, after the promise, it was given as a custody and, so to speak, as a prison, so that, since through the freedom of their will they had been unwilling to await the promise in innocence, they might be held fast by the bonds of the Law and brought into the slavery of the commandments, and so be kept against the coming of the faith that was to be in Christ, which would bring the promise to its fulfillment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
