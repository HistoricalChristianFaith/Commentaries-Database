[[commentary]]
quote='''
※ And I will be found by you, says the Lord, and I will bring back your captivity and gather you from all the nations and from all the places to which I drove you out, says the Lord, and I will make you return from the place to which I made you go into exile, because you have said: The Lord has raised up prophets for us in Babylon. For thus says the Lord to the king who sits upon the throne of David, and to all the people, the inhabitant of this city, and to your brothers who did not go out with you into exile; thus says the Lord of hosts: Behold, I will send upon them the sword, famine and plague, and I will make them like bad figs, which cannot be eaten because they are very bad. And I will pursue them with the sword, with famine and with pestilence, and I will give them over to vexation to all the kingdoms of the earth, for a curse and for astonishment and for hissing and for a reproach to all the nations to which I am casting them out, because they did not hear my words, says the Lord, which I sent to them through my servants, the prophets, rising up by night and sending; and you did not hear, says the Lord. You, therefore, hear the word of the Lord, all the exile, which I sent out from Jerusalem into Babylon! ※ Up to this point, what I have marked beforehand with asterisks is not found in the Seventy; for the rest, in which either single verses or a few words have been passed over by them, I was unwilling, overcome by weariness, to note them, lest I should cause the reader disgust. Now the Lord promises those who were in exile that after seventy years of captivity he will make them return from all the nations and from all the places to which he had driven them out, and that, the captivity being released, they would recover their former state and fatherland.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
