[[commentary]]
quote='''
In the book of Numbers, then, in which the whole land of promise is divided by four quarters in brief speech, this is the description from the north, that is, from the northern quarter: Moreover, on the northern side the boundaries will begin from the Great Sea, reaching as far as the Highest Mountain, from which you will come into Hamath, up to the borders of Sedada. And the borders will go as far as Zephrona and 'the village of Enan' (or 'Aser-Enan'). And the Hebrews say that the northern quarter begins from the Great Sea, which stretches along the shores of Palestine, of Phoenicia, and of the Syria which is called Coele, and of Cilicia, and extends through Egypt to Libya. But as to what he says: Reaching — the boundaries — as far as the Highest Mountain, the same Hebrews assert that it signifies either Mount Amanus or the Taurus — which seems truer to us —. From which, he says, you will come into 'Emath', which is now named 'Epiphania', its name having been changed by Antiochus, the cruelest of tyrants, for he had the surname Ἐπιφανής [Epiphanes, the Manifest]. Up to the borders, he says, of Sedada, which place is also set down in the present reading of Ezekiel. And the borders will go as far as Zephrona, which city they today call Zephyrium, a town of Cilicia. And what follows: And 'the village of Enan' (for which in the Hebrew is written 'Aser-Enon' or '-Enan'), the present passage also contains.
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
