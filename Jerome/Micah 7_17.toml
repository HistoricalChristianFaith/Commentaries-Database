[[commentary]]
quote='''
After such great evils it is said of them that they will lick the ground like serpents that drag the earth, walking on their belly and eating earth all the days of their life. And doing the works of the flesh, that is, earthly works, and dragging with them, up to the day of the vengeance and visitation of the Lord, not dust, not small traces of earth, but the whole ground. And when they have done this, and have come to the judgment of God, and have been shut in and troubled, they will be troubled and shut in for as long as the earth which they had dragged like serpents remains in them. But when that has failed, they will be astonished and will marvel, not at the Lord their God — for they will not yet deserve that he be called the Lord their God —, but at the Lord our God. And suddenly there is an ἀποστροφὴ (a turning of address) to Christ, and it is said to him: And they shall be in fear of you. For the beginning of wisdom is the fear of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
