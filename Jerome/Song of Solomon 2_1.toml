[[commentary]]
quote='''
[Christ] himself says in the Song of Songs, "I am the rose of Sharon, and the lily of the valley." Our rose is the destruction of death, and [that rose] died that death itself might die in his dying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_075.html'
source_title="LETTER 75.1"

[[commentary]]
quote='''
On the contrary, blessed is the land of the Church, whose king is Christ, the son of the freeborn, descending from Abraham and Isaac and Jacob, and from the stock of the prophets also and of all the saints, over whom sin did not have dominion; and therefore they were truly free. From them was born a virgin freer still, holy Mary, having no shrub, no shoot from her side; but all her fruit burst forth into a flower, which speaks in the Song of Songs: I am the flower of the field and the lily of the valleys.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
