[[commentary]]
quote='''
It is not, If thou hast ought against thy brother; but, If thy brother has ought against thee, that the necessity of reconciliation may be more imperative.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If, therefore, you are offering your gift at the altar and there remember that your brother has something against you. He did not say: if you have something against your brother, but if your brother has something against you, so that a harder necessity of reconciliation may be laid upon you. So long, then, as we cannot appease him, I do not know whether we may fittingly offer our gifts to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
[[commentary]]
quote='''
All this we do, and we do not consider that if our soul holds enmities against a brother, we pray in vain. For in the Gospel what is said? 'If you offer your gift at the altar, and there remember that your brother has something against you.' See what he says. He did not say, if you have something against your brother; but, if your brother has something against you. He seems to lay upon us something as it were unjust: for if he had said, if you have something against your brother, it would have been in our power what we had. But now what does he say? If you remember that your brother has something against you. I answer him: Lord, this is not in my power, whether my brother has something against me: I have nothing against him. If he has something against me, what does it concern me? and why do you refuse to receive my gift and say, If you offer your gift at the altar, and there remember that your brother has something against you: leave, he says, your gift, and go be reconciled to your brother, and so you shall offer your gift? Behold, I have nothing: if he has, what does it concern me? The Lord answers you, and what does he say? Wicked servant, I understand your mind: you have nothing against your brother? you have nothing? do you love him? why then do you not want him to be saved? if you love him, go, ask him not to have anything against you, so that he may be saved. But you show that you do not love him, because you do not want him to be saved. Go, ask him, cast yourself at his feet, entreat him day and night: say, I have left my gift at the altar, on your account I cannot offer the victims. He is pricked with compunction, and what does he say? If this man who asks me does not offer his gift: I who am asked, if I do not forgive, what shall I do?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"
