[[commentary]]
quote='''
Otherwise: I loved them so much, and was so merciful a shepherd, that I myself carried the sick sheep on my shoulders; but they did not know that I was healing them by my passion, and that I, who am the lover of all men, was drawing them to believe with the bonds of love, according to what is written in the Gospel: No one comes to me unless the Father who sent me draws him. And they thought my light yoke most heavy; and I inclined toward them, leaving the kingdoms of the heavens, so as to eat with them, having taken the form of a man; or I gave them my body to eat, I myself both the food and the guest at table.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
