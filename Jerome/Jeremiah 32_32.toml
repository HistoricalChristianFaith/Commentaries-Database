[[commentary]]
quote='''
Because of the wickedness, he says, of the sons of Israel and of the sons of Judah, which they did, provoking me to anger, they and their kings, their princes and their priests and their prophets, the men of Judah and the inhabitants of Jerusalem. Because he had said above: in my fury and in my indignation this city has become to me from the day on which they built it until this day, on which it is taken away from my sight, and had shown that in general no one had been without sin, he now enumerates them part by part, both their kings and princes and priests and prophets, and, embracing everything in one word: the men, he says, of Judah and the inhabitants of Jerusalem. And he rightly did not say: 'my kings and my princes and my priests and my prophets', but, because they had sinned: their kings and their princes and their priests and their prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
