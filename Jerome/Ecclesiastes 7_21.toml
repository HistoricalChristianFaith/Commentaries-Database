[[commentary]]
quote='''
And indeed do not give your heart to all the words that they will speak, for you will not hear your servant cursing you. For often your heart knows that you too have cursed others. Do what has been commanded, and, strengthened by the help of wisdom, prepare your heart either for evil things or for good, and do not care what your enemies say of you, or what opinion of you there is abroad. For as it is the part of a prudent man not to listen to a murmuring servant, nor to lend a curious ear to what he says of him in his absence, since if he does this he will always be in trouble, and at the servant's muttering he will be moved to anger; so too it is the part of a wise man to follow wisdom as she goes before him and to pay no heed to vain rumors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
