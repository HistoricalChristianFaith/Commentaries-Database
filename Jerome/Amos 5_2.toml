[[commentary]]
quote='''
If, then, the apostle, who was a chosen vessel separated unto the gospel of Christ, by reason of the pricks of the flesh and the allurements of vice keeps his body and brings it into subjection, lest when he has preached to others he may himself be a cast away; and yet, for all that, sees another law in his members warring against the law of his mind, and bringing him into captivity to the law of sin; if after nakedness, fasting, hunger, imprisonment, scourging and other torments, he turns back to himself and cries, "Oh, wretched man that I am, who shall deliver me from the body of this death?" do you fancy that you ought to lay aside apprehension? See to it that God say not some day of you, "The virgin of Israel is fallen, and there is none to raise her up." I will say it boldly: God can do all things, but the virgin who has fallen will not be raised up. He may indeed relieve one who is defiled from the penalty of her sin, but he will not give her a crown. Let us fear lest in us also prophecy be fulfilled, "Good virgins shall faint." Notice that it is good virgins who are spoken of, for there are bad ones as well. "Whoever looks on a woman," the Lord says, "to lust after her has committed adultery with her already in his heart." So that virginity may be lost even by a thought. Such are evil virgins in the flesh, not in the spirit; foolish virgins, who, having no oil, are shut out by the bridegroom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_005.html'
source_title="LETTER 5"

[[commentary]]
quote='''
But if, as we have said, the lament is over those who repent, and repentance restores health to the wound, how is it said according to the Seventy: The house of Israel has fallen, it will rise no more. The virgin Israel has strayed in her land, there is no one to raise her up? This can be resolved thus: after the house of Israel has collapsed by its own will, it will by no means recover its former dignity; after the virgin Israel has strayed in her land, she will no longer be able to find one to raise her up. And consider the proper meanings of the words. He who is a house, and is counted in the crowd, is said to fall. But he who is of the number of the virgins, if he strays, even for a light sin, will not be able to be raised up; not that he is not raised up, but the virgin Israel is by no means raised up, and the Lord of Israel will by no means rise again. For the glory is not the same of him who has always followed the Lord and of him who has wandered from the flock and afterwards been carried back on the shoulders of the good shepherd. Hence the Lord also says through another prophet: I prefer the repentance of a sinner rather than his death. Repentance becomes better not when compared with the purest holiness and the Church of Christ — which has no wrinkle nor spot —, but when compared with death and the underworld. We say these things, not in order to take away, with Novatus, the hope of repentance, but in order to make more fearful, and therefore anxious, those who, with the door of repentance open, while they hope for the future, lose the present, and who, though they could have remained without a wound, carelessly receive a wound, so as afterwards to be tormented by pain. There are many mansions with my Father, and star differs from star in brightness; so also is the resurrection of the dead, the saints shining like the sun and the moon, the evening star and the morning star. But those who have repented after sin will be made equal to other stars, according to the diversity of their merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
