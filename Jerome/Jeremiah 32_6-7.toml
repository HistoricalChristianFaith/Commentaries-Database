[[commentary]]
quote='''
And Jeremiah said: The word of the Lord came to me, saying: Behold, Hanamel, the son of Shallum — or Salom —, your cousin — which in Hebrew is called 'dodach' —, is coming to you, saying: Buy for yourself my field, which is in Anathoth; for the purchase belongs to you by kinship. That the word of God had come secretly to Jeremiah no one could know unless he himself, to whom it had come, disclosed it. And it is foretold to him that Hanamel, his cousin, will come to him and offer him the possession of the field that had been his; and that the place itself is in Anathoth, among the suburban lands which were given by the law to the priests throughout the several tribes and cities; nor was it lawful for a possession to pass from tribe to tribe, nor from one family to another family — whence also the daughters of Zelophehad receive their lot among their brothers — and especially the suburban lands of the priests could be sold to no one else until the year of release, except to him whom nearness of blood required. So his cousin comes to him and offers the purchase, which is owed to him by kinship. Hilkiah and Shallum were full brothers; Jeremiah was the son of Hilkiah, Hanamel the son of Shallum. 'Chelchias' means 'portion of the Lord', 'Hieremias' 'loftiness of the Lord'; and rightly the 'height of the Lord' is born of the 'portion of the Lord'. 'Sellum', again, is rendered into our language as 'peace' or 'peaceable', 'Anamehel' as 'gift' or 'grace of God'; nor shall we wonder that 'peace' and 'grace' are joined to each other, since this is also the opening of the apostolic letters: grace to you and peace. First, then, we merit the peace of God, and after peace grace is born for us, which lies not in the choice of the one who possesses, but of the one who gives. And 'the grace of God' offers the purchase to him who is set in 'lofty places', so that, although he seems exalted, he nevertheless needs the grace of God. That which is often sung by the bride in the Song: my cousin, that is ho adelphidos mou, is called 'dodi' in the Hebrew; therefore he should be called not 'fratruelis' [cousin through a brother] but 'patradelfus', that is 'patruelis'. That Jeremiah was the son of Hilkiah, of the priests who were in Anathoth, in the land of Benjamin, the opening of this book also testifies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
