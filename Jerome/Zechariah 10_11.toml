[[commentary]]
quote='''
For the rest, we who are reckoned by the name of Christ leave behind the letter that kills and follow the spirit that gives life, or rather, comparing spiritual things with spiritual, we look not for the Bosporus, and the drying of the sea once more, and the dry streams of the Jordan, which are like fables, but for the worthy mercy of God toward his servants, by which, as he goes before and opens the way for us, we pass through the strait of the sea, or the narrow sea, which for sinners is very broad: For broad and spacious is the way that leads to death, strait and narrow the way that leads to life. Of this sea we also read in the psalms: They who go down to the sea in ships, doing business in many waters, they have seen the works of the Lord, and his wonders in the deep. Into this sea of the world, in which the number of the saints is hemmed in and set in tribulation, the apostles went down, and first of all the Lord, that he might free us from the bitter waves. Into this sea is cast the dragnet of the gospel, which is woven of the testimonies of the Scriptures, so that it may draw out into the free air many fish overwhelmed by the whirlpools of this world, that they may be able to sing praises to God. These are they who have gone down to the sea, and in the ships of the churches do many works, and behold the wonders of God in the depth of the riches of his wisdom and knowledge, and in the Holy Spirit, who searches even the deep things of God; to whom the Lord says: Come after me, and I will make you fishers of men. Of these fishers, who go down to the sea and are in ships, Isaiah too prophesies: They shall fly in the ships of foreigners, and together they shall plunder the sea. For in the churches gathered from the number of the nations the apostles flew through the whole world, to plunder the sea and to carry off the spoils of the dragon who reigned in the sea, and of whom it is written: This sea, great and spacious in its arms; there are creeping things without number, small creatures with great. There the ships shall pass through; this dragon whom you formed to mock him. The sea is broad and spacious for the small and great living creatures that dwell with the dragon, and whose number is beyond count. But they who are upon the sea, and fly upon the sea itself in ships, shall hear, together with the Savior: You rule the power of the sea; you calm the motion of its waves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
