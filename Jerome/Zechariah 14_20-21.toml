[[commentary]]
quote='''
Let us pass on to the cauldrons, which are to be in the house of the Lord like the bowls of the altar. For every cauldron in Jerusalem and in Judah shall be sanctified to the Lord Almighty. Let them love bronze cauldrons who loved the pots of Egypt and the meat, and the melons and the garlic, and the onions and the cucumbers. Let us turn the Jewish cauldrons, in which the flesh of the victims was cooked, into bowls of spices before the altar of the Lord, of which the bride says to the bridegroom: My kinsman has gone down into my garden, to the bowls of spices, to feed in the gardens and to gather lilies. The garden and paradise into which the bridegroom goes down to the bride is the reading of the holy scriptures, from which he plucks lilies and violets and roses and various spices, to fill the bowls of believing souls and to pour out libations to the Lord from them. When cauldrons of this kind have been turned into bowls of the Lord and can say: We are the good fragrance of Christ, and, instead of the rankness of meats, have begun to bear the various flowers of the virtues, then they will be in Jerusalem and in Judah sanctified to the Lord Almighty; of which we have said quite often that Jerusalem expresses vision of peace, and Judah one who confesses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
