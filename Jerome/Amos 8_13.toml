[[commentary]]
quote='''
In that time the beautiful virgins failed, and the young men, or the chosen ones and teachers — for this is what baurim means —, failed in thirst. They interpret the beautiful virgins as the synagogues, and the chosen ones as the masters of the people. And since these have failed, they teach that the curses of Deuteronomy have been fulfilled in the Jewish people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
In that time the virgin souls will fail, which the Apostle calls uncorrupted; and he desires them to possess everlasting chastity, writing to the Corinthians: For I betrothed you to one husband, to present a chaste virgin to Christ. But I fear lest, as the serpent seduced Eve by his cunning, so your minds should be corrupted and fall away from the simplicity which is in Christ. And if all virgins were beautiful or good, he would never have said: The good virgins will fail; but he set down 'good' to distinguish them from bad virgins, the good being those who are holy in body and in spirit. The bad virgins are the five foolish ones, who did not prepare oil for their lamps. The good and comely virgins are those who had the light of the virtues and entered the bridegroom's chamber. But the virgins will fail, because they will not find the word of the Lord. From this we understand that when teaching is lacking in the churches, modesty perishes, chastity dies, all the virtues depart, because they have not eaten the word of the Lord; and whoever has eaten it, fattened with its food, will hear through Solomon: The righteous man eating satisfies his soul, but the souls of the ungodly hunger. And David, who had reached the old age of Abraham, sang freely: I have been young, and have grown old, and I have not seen the righteous forsaken, nor his seed seeking bread. How many martyrs in persecutions perished of hunger, and lacked grain and these nourishments of the body. Therefore he speaks of that bread which came down from heaven, which whoever eats will be able neither to hunger nor to thirst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
