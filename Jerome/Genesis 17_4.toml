[[commentary]]
quote='''
And he spoke to him, saying: Behold, my testament is with you, and you shall be the father of a multitude of nations, and your name shall no longer be called Abram, but your name shall be Abraham, because I have made you father of many nations. It should be noted that wherever we read testament in the Greek, there in the Hebrew speech is covenant or pact, that is, berith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
