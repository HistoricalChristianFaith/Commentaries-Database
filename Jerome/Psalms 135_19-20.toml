[[commentary]]
quote='''
A certain writer sets down as the spiritual wings of the earth, by which we fly up to heavenly things, four kinds of believers: the house of Aaron and the house of Levi and the house of Israel and those who fear the Lord — of whom the psalmist sings: House of Israel, bless the Lord; house of Aaron, bless the Lord; house of Levi, bless the Lord; you who fear the Lord, bless the Lord —, understanding by Aaron the priesthood, by Levi the temple-keepers and ministers, by Israel the whole people, by those who fear the proselytes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
