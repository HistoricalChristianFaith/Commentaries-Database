[[commentary]]
quote='''
And again those who had said above: 'Sanctify war against her and arise', now rouse themselves to battle, saying: 'Arise, and let us go up by night, so that our adversaries may know that the victory belongs not to the time of day but to strength, and let us destroy the houses, which are fenced in vain by the firmness of their walls'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
