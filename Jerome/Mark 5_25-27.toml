[[commentary]]
quote='''
Behold, a woman who had suffered a flow of blood for twelve years came up behind and touched the fringe of his garment. In the Gospel according to Luke it is written that the ruler's daughter was twelve years of age. Note, therefore, that this woman, that is, the people of the Gentiles, began to be sick at the time when the nation of the Jews believed. For a vice is not shown except by comparison with virtues. Now this woman with a flow of blood approaches the Lord not in a house, not in a city, because according to the law she was excluded from cities, but on the way, as the Lord was walking, so that while he was going to one woman, another might be healed. Whence the apostles too say: It was necessary that the word be preached to you, but since you have judged yourselves unworthy of salvation, we turn to the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
There were many who kept promising that way which would lead to the city. Socrates promised, Plato promised, Aristotle promised. The woman with the issue of blood, who flowed with blood, sought many physicians, and by none could be healed. "They did not find the way of the city of habitation." Their teaching produced hunger for the truth rather than fullness. The woman with the issue of blood spent all her substance on physicians: hungering and thirsting her soul failed within her. But because she had lost all her substance — that is, the Church gathered from the Gentiles, because her soul failed within her — she cried out to the Lord when she was in tribulation. The touch of the Lord's hem was the cry of one believing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_033.html'
source_title="Homily 33, on Psalm 106"
