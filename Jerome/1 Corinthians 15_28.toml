[[commentary]]
quote='''
God will be all things in all, so that there will not be only wisdom in Solomon, meekness of soul in David, zeal in Elias and Phineas, faith in Abraham, perfect love in Peter... zeal of preaching in the chosen vessel [Paul], and two or three virtues each in others. But God will be completely in all. The whole number of the saints will be glorified in the whole choir of virtues, and God will be all things to all.
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.18"

[[commentary]]
quote='''
The Savior too was subject to his parents (Luke 2), but when he was still twelve years old and differed in nothing from a slave, though Lord of all; for he had not yet reached the full age of a man that could take up the inheritance. But it is also written of him elsewhere: "For when all things have been subjected to him, then the Son himself will be subjected to him who subjected all things to himself, that God may be all in all" (1 Cor. 15:28). And all things will be subjected to him when he has said, "The Lord to my Lord: Sit at my right hand, until I make your enemies the footstool of your feet" (Ps. 109:1). In slaves who are subject, the Lord is subject. And just as he is said to be a curse for us, though he is not a curse but true blessing, so for us he is written either as subject or as not subject, according as we are either subject to God or not subject.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
There follows: The fullness of him who is filled all in all. This is indeed to be taken in the same way as that other saying: Then he will be subjected to him who subjected all things to himself, that God may be all in all (1 Cor. 15:28). For now God is in individuals in parts: in one as righteousness, in another as chastity, in another as temperance, in another as wisdom, in another as fortitude; and it is difficult, even in holy and perfect men, for all the virtues to be present equally. But when, at the end of things and the consummation of the world, the universe has been subjected to him, he will be filled all in all: so that, in accordance with the fact that God is full of all virtues, he may be filled all in all, and all may have all the things which before they possessed one by one, each his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Besides this, we must see what he meant by saying in the kingdom of Christ and of God (1 Cor. 10): whether the kingdom of Christ is one thing and that of God another, or whether the kingdom of the Father and of the Son is one and the same. And indeed, if he had said, "in the kingdom of the Son and of the Father," we would come through the Son to the Father; and although there would be a diversity of persons, yet there would be one majesty of those who reign. But now, since he has said in the kingdom of Christ and of God, let us understand God himself, and Christ, because even when he has delivered the kingdom to God and the Father, it will not be the Father who is all in all, but God who is all in all. But where God is, both the Father and the Son can be understood. Further, what we say of the Father and of the Son, let us hold the same also of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
