[[commentary]]
quote='''
Then Peter, coming to him, said: Lord, how often shall my brother sin against me and I forgive him? Up to seven times? and the rest. The Lord's discourse holds together and, like a threefold cord, cannot be broken. Above he had said: See that you do not despise one of these little ones; and he had added: If your brother sins against you, go and rebuke him between yourself and him; and he had promised a reward, saying: If two of you agree on earth, about anything they will obtain what they ask, and I will be in their midst. Roused by this, the apostle Peter asks how often he ought to forgive a brother who sins against him, and with his question he puts forward a verdict: up to seven times, to whom Jesus answered: Not up to seven times but seventy times seven, that is, four hundred and ninety times, so that he should forgive a brother who sins as many times in a day as the brother could not sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
[[commentary]]
quote='''
Let us entreat our brother, if he is our enemy; let us entreat him even twice, and three times, and seven times. 'Lord, if my brother sins against me, how often shall I forgive him? seven times? I say to you, not seven times, but seventy times seven' — that is, four hundred and ninety times. If we wanted to reckon it up, from morning until evening we could not commit so many sins, four hundred and ninety. Yet what does the Lord say? If he sins against you seventy times seven in a day, and turning back asks you, forgive him. But you say: He does not turn back with his whole heart, he lies. Let us leave the judgment to God: he asks me, he entreats me: he does not say this truly — God knows. I hear a voice, Christ understands the heart: I accept what I hear, let Christ accept what he knows. Then see your own reward: he lies, you accept it as true; his is the killing, yours is the salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"
