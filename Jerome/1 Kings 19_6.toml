[[commentary]]
quote='''
And that it is written, according to the Seventy, that Elijah, fleeing Jezebel, found a ὀλυρίτην [made of olyra] loaf, 'baked under the ashes', is a sign of persecution and want; hence he is also fed by ravens, and, because he had found no food in Israel, he was fed with the nourishment of the nations, which were unclean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
