[[commentary]]
quote='''
And when he says: But even the hairs of your head are all numbered, he shows the immense providence of God toward men and signifies his ineffable affection, in that nothing of ours is hidden from God, and even small and idle words do not escape his knowledge. Those who deny the resurrection of the flesh mock the Church's understanding of this place, as though we said that even the hairs that have been numbered and cut off by the barber all rise again, when the Savior did not say: But even all your hairs are to be saved, but are numbered. Where there is number, knowledge of the number is shown, not the preservation of that same number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
