[[commentary]]
quote='''
Such men the teacher of the Church, to whom the souls of the peoples have been entrusted, ought to overcome by the reasoning of the Scriptures, and impose silence on them by the weight of testimony: men who overturn not one or a few houses, but whole houses, with their masters and households, teaching about the distinctions of foods, about the long since abolished sabbath, about the injury of circumcision. And would that they did this very thing out of zeal for the faith! It could be pardoned in some measure, since the Apostle says: "I confess, they have a zeal for God, but not according to knowledge" (Rom. 10:2). But because their belly is their God, they wish for the sake of shameful gain to make disciples their own, so that, as masters, they may be fed by their followers. We can, however, also interpret otherwise what was said, for the sake of shameful gain: so as to think that the Apostle used a common word, by which all heretics, when they teach perverse things, are wont to declare themselves gainers of men, whereas it is not gain but perdition to kill the souls of those they deceive. On the contrary, whoever has reproved his erring brother according to the Gospel, if he has been converted, has gained him. For what greater gain can there be, or what more precious, than if one gains a human soul? Every teacher of the Church, therefore, who persuades to the faith of Christ by right reasoning is an honorable gainer. And every heretic, who deceives men by certain tricks and is deceived, speaks what he ought not, for the sake of shameful gain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
