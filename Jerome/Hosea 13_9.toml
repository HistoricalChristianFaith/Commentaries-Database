[[commentary]]
quote='''
You have become a surfeit to me: I will by no means forgive your sins. For which Aquila translated, I have labored in bearing; Symmachus ἐκοπώθην ἱλασκόμενος, that is, I have grown weary of showing mercy; to show that he will by no means have mercy any longer, because it is one thing to kill the servants sent to them, another to kill the Son. This sense we read also in the prophet Hosea: Your destruction, O Israel; only in me is your help (Hos 13:9). Which is understood thus: You would perish, Israel, because you are saved not by your own merit but only by my help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
