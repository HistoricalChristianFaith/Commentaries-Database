[[commentary]]
quote='''
You have become a surfeit to me: I will by no means forgive your sins. For which Aquila translated, I have labored in bearing; Symmachus ἐκοπώθην ἱλασκόμενος, that is, I have grown weary of showing mercy; to show that he will by no means have mercy any longer, because it is one thing to kill the servants sent to them, another to kill the Son. This sense we read also in the prophet Hosea: Your destruction, O Israel; only in me is your help (Hos 13:9). Which is understood thus: You would perish, Israel, because you are saved not by your own merit but only by my help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Your destruction, Israel; only in me is your help. Where is your king? Now above all they save you in all your cities; and your judges, of whom you said: Give me a king and princes; I will give you a king in my fury, and I will take him away in my indignation. LXX: Who will help your corruption, Israel? Where is this king of yours? And let him save you in all your cities; let him judge you, of whom you said: Give me a king and a prince; and I gave you a king and a prince, and I gave you a king in my anger, and I held him in my fury. Where the LXX translated I held, all the others rendered I took away. Unhappy Israel, and worthy of a perpetual curse, which has gone down into so great a depth of impiety that it is saved by the mercy of God alone! But in the Hebrew it can also be read in this sense: May you perish, Israel, because nothing is left to you except to be preserved by my clemency alone. In the LXX, however, the sense is different: Who will help your corruption, Israel? That is, which of those whom you thought your protectors will be able to bring help to your captivity and final servitude?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Every heretic is lost and given over to corruption; for whoever corrupts the temple of God, the Lord will destroy him; and he has help in nothing else but in the mercy of God alone, which he obtains by repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
