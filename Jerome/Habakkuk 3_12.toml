[[commentary]]
quote='''
LXX: In threatening you will diminish the earth, and in fury you will drag down the nations. This can be taken of the consummation of the world, when, the multitude having been slain in frequent wars, men will be found few, and those who did not wish to be of the people of God, but remained Gentiles and heathens, will be led down to Tartarus by the fury of the Lord. But it is better that we interpret the earth diminished by threatening as earthly works, and as those who, set in the Church as sinners, do not wait to be chastised by the fury of the Lord, but, hearing in the Scriptures what punishments hang over sinners, do penance, and little by little diminish their earth and advance toward heaven. If any of us dreads the threatening of the Lord, for him the earth is diminished; but he who persists in the number of the Gentiles, and does not want to be among those whose earth decreases, nor of the people of God, of whom it is said: They will see you, and the peoples will be in labor, he will be dragged down with the nations into punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
