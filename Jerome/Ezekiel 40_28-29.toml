[[commentary]]
quote='''
Nor is there only a second court at the southern gate, but a third, of which it is now said: And he brought me into the inner court at the southern gate, and he measured the gate according to the measures above, and the rest: for each court has its own measures and orders, and in the same measures there is a different grace, since we know the same things in one way at the beginning, in another in our progress, in another at the end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
