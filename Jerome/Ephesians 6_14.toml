[[commentary]]
quote='''
It would take long now to tell how the strength of the devil is above all in the loins, and how the promise is made to David: Of the fruit of your loin I will set upon your throne, and that saying of the Apostle: For he was still in the loin of his father Abraham, Levi was, when Melchizedek went to meet Abraham. And how John is girded with a leather girdle, and how the disciples are commanded by the Savior: Let your loins be girded. And the Apostle to the Ephesians: Stand therefore, having your loins girded in truth; for although ἄσκησις (ascetic discipline) and continence of life avail very much toward the mortifying of the loins, yet nothing so mortifies them as the knowledge of the truth. Hence it is said: Gird your loins in truth. For if Christ is the truth, he who has believed in Christ with his whole mind has mortified his loins in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"
