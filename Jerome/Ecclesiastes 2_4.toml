[[commentary]]
quote='''
I made my works great; I built myself houses; I planted myself vineyards. He makes his works great who is lifted up to the things above according to the image of the Creator. And he builds houses, so that the Father and the Son may come and dwell in them. And he plants vineyards, to which Jesus may tie his ass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
