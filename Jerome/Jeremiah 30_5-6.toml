[[commentary]]
quote='''
And these are the words which the Lord spoke to Israel and to Judah, for thus says the Lord: We have heard a voice of terror — or of fear —; dread, and there is no peace. Ask and see whether a male gives birth! Why then have I seen the hand of every man upon his loins, as of a woman giving birth, and all faces have been turned into jaundice? First sad things are announced, so that after the greatness of the evils glad things may follow; for health is more welcome when sickness has been driven off, and the greatness of pain is turned into a greatness of joys. What he says, then, is this: so great will be the fear and so great the dread that, peace having been put to flight, all things will be filled with wars and blood, and that a womanish terror will take hold even of the men, whose proper task is to fight against adversaries, and they will put their hands by no means to arms but to holding their kidneys, as if a woman giving birth were clutching her flanks and loins. Hence also the faces of all will be turned into jaundice, testifying by the pallor of the countenance to the terror of the heart. Some interpret this passage according to tropology in such a way that they set down that testimony: From your fear, O Lord, we have conceived and travailed and brought forth; we have made the spirit of your salvation upon the earth, and they compare to this example that saying of the Apostle in which he says: My little children, with whom I am again in travail until Christ be formed in you; which plainly pertains not to terror but to joy, whereas the present Scripture signifies the time of the devastation and ruin of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
