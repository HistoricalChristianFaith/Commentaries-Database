[[commentary]]
quote='''
And the exile of this host of the children of Israel, all the things of the Canaanites as far as Sareptha. And the exile of Jerusalem, which is in the Bosphorus, shall possess the cities of the South. And saviors shall go up onto Mount Zion, to judge Mount Esau, and the kingdom shall be the Lord's. LXX: And this is the beginning of the exile for the children of Israel, the land of the Canaanites as far as Sareptha, and the exile of Jerusalem as far as the Euphrates; they shall possess the cities of the Nageb. And those who had been saved shall go up from Mount Zion, to punish Mount Esau, and the kingdom shall be the Lord's. In this place our translation differs greatly from the common edition; hence in the exposition of the history we must follow the Hebrew truth. Those who, according to the book of Ezra and Nehemiah, had returned from Babylon into Judea will also rightly be called the children of the exile. That whole host of the children of Israel shall possess, to the south, and to the west, and to the north, the Idumeans, and the Philistines, and Mount Ephraim, and Samaria. Benjamin also, because it borders on the wilderness, shall in particular hold Gilead. Toward the east, however, they shall rule over all that belongs to the land of the Canaanites, as far as Sareptha of the Sidonians, where the widow once fed Elijah. Further, those who had been carried away from Jerusalem itself, the mother city, to Sapharad, which we have rendered 'Bosphorus', shall possess the cities of the South, which are in the tribe of Judah; for, having returned to their own city, they shall hold the places that neighbor the city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
