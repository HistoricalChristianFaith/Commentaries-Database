[[commentary]]
quote='''
And you drink wine in bowls, not to sate thirst but to overwhelm the mind. And you are anointed, not with the purest oil to soothe the labours of the body, but with the most costly ointments. And while you abound in these delights, if you see any of the people perishing, you are moved by no pity over their slaughter, but you despise them as brute animals and as beasts perishing in their own gore. This same sense the prophet Ezekiel also sets down under the example of the shepherds: Who eat the milk of the sheep, and are clothed with the wool, and devour whatever is choicest, and do not heal the wounded, do not bind up the broken, do not seek the perishing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And what follows, Who drink strained wine, can properly be referred to the heretics, who approve some Scriptures and reject others, wishing to drink strained wines, although in the holy Scriptures nothing is muddy and miry, but all is most pure, from the water above. These are anointed with the first ointments who, not having the perfumer's art, without any knowledge of the Scriptures, and of the traditions and teaching of the apostles, claim for themselves the dignity of the priesthood, and say that they are the anointed of the Lord, and contaminate the purest oil with the dregs of their own understanding. And while they do these things to the slaughter of those whom they have deceived, they are tormented by no grief, but rejoice in the deaths of others and take delight in the blood of the wretched.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
