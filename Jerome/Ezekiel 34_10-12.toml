[[commentary]]
quote='''
'I will require', he says, 'from the hand', and 'I will deliver from the mouth', by which they are devoured with greedy jaws; and when he has sought out the sheep, he visits them as sick and lean and scattered through the negligence of the shepherds; and he will deliver them from all places in the day of cloud and gloom — of which Joel too speaks: The day of the Lord is at hand, and it is near; a day of darkness and gloom, a day of cloud and mist —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
