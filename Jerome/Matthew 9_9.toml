[[commentary]]
quote='''
The other Evangelists from respect to Matthew have not called him by his common name, but say here, Levi, for he had both names. Matthew himself, according to that Solomon says. The righteous man accuses himself, (Prov. 18:17.) calls himself both Matthew and Publican, to show the readers that none need despair of salvation who turn to better things, seeing he from a Publican became an Apostle.

Porphyry and the Emperor Julian insist from this account, that either the historian is to be charged with falsehood, or those who so readily followed the Saviour with haste and temerity; as if He called any without reason. They forget also the signs and wonders which had preceded, and which no doubt the Apostles had seen before they believed. Yea the brightness of effulgence of the hidden Godhead which beamed from His human countenance might attract them at first view. For if the loadstone can, as it is said, attract iron, how much more can the Lord of all creation draw to Himself whom He will!

But they had seen the Publican turning from sins to better things, and finding place of repentance, and on this account they do not despair of salvation.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And as Jesus was passing on from there, he saw a man sitting at the tax office, Matthew by name, and he said to him: Follow me. And he rose and followed him. The other evangelists, out of modesty and regard for Matthew, did not wish to call him by his common name, but said Levi; for he had a twofold name. But Matthew himself, according to what is enjoined by Solomon: The just man is his own accuser at the beginning of his speech; and in another place: Tell your sins, that you may be justified, names himself Matthew and a tax collector, to show his readers that no one ought to despair of salvation if he has turned to better things, since he himself was suddenly changed from a tax collector into an apostle. In this place Porphyry and Julian the Augustus charge either the ignorance of a lying historian or the folly of those who at once followed the Savior, as though they had irrationally followed any man at all who called them, when so many mighty works and so many signs had gone before, which there is no doubt the apostles saw before they believed. Certainly the very brightness and majesty of the hidden divinity, which shone forth even in his human face, could draw to himself at first sight those who saw him. For if the magnet stone and amber are said to have this power, that they join rings and straw and bits of chaff to themselves, how much more could the Lord of all creatures draw to himself those whom he willed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
