[[commentary]]
quote='''
Upon this flower, then, which will suddenly rise up from the trunk and the root of Jesse through the Virgin Mary, the spirit of the Lord will rest, because in him it pleased all the fullness of the divinity to dwell bodily: not in part, as in the other saints; but, according to the Gospel written in the Hebrew tongue which the Nazarenes read: The whole fountain of the Holy Spirit shall descend upon him. Now the Lord is Spirit, and where the Spirit of the Lord is, there is liberty (2 Cor 3:17). In the same volume of Matthew we read that the words written in what follows: Behold my servant whom I have chosen: my chosen one, in whom my soul is well pleased: I will put my spirit upon him: he shall bring forth judgment to the nations (Matt 12:18), are referred to the understanding of the Savior, upon whom the Spirit of the Lord rested, that is, remained in everlasting habitation: not so as to fly away and descend upon him again; but, according to the testimony of John the Baptist, so as to remain continually; for he says: I saw the Spirit descending like a dove from heaven, and remaining on him, and I did not know him: but he who sent me to baptize in water said to me: He on whom you see the Spirit descending and remaining on him, he it is who baptizes in the Holy Spirit (John 1:32-33). Further, in the Gospel which we mentioned above, we find these things written: And it came to pass, when the Lord had come up from the water, the whole fountain of the Holy Spirit descended and rested upon him, and said to him: My Son, in all the prophets I was awaiting you, that you might come and I might rest in you. For you are my rest, you are my firstborn son, who reigns for ever. This Spirit is called the Spirit of the Lord and the Spirit of wisdom; for all things were made through him; and without him nothing was made that was made (John 1:3). And in the Psalms it is sung: How magnified are your works, O Lord! You have made all things in wisdom (Ps 103 [104]:24). And the Apostle writes: Christ the power of God and the wisdom of God (1 Cor 1). And in Proverbs it is read: God by his wisdom founded the earth, and prepared the heavens by prudence (Prov 3:19). And as the same Word of God is called light, and life, and resurrection, so he is named the spirit of wisdom and understanding, and of counsel and fortitude, and of knowledge, and of godliness, and of the fear of the Lord: not that he is different according to the differences of the names, but that he is one and the same fountain and principle of all virtues. Without Christ, therefore, no one can be wise, nor understanding, nor a counselor, nor strong, nor learned, nor godly, nor full of the fear of God. And this is to be noted, that the Spirit of the Lord, of wisdom and understanding, of counsel and fortitude, and of knowledge, and of godliness, and of the fear of the Lord, that is, the sevenfold number, which in Zechariah (ch. 3) are called seven eyes on one stone, rests upon the rod and the flower which rose up from Jesse, and so from the stock of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
