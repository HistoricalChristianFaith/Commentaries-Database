[[commentary]]
quote='''
And so great was the likeness of the four wheels following the four living creatures that they were most truly believed to be one wheel. And their work and making was as the vision of 'tharsis', which we have rendered 'sea'; Aquila put 'hyacinth', a stone which has the likeness of the sky. And their appearance was as a wheel in a wheel, not so that you would believe it one wheel, but one coupled to another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
