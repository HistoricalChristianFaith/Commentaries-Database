[[commentary]]
quote='''
Why do we sit still? Come together, and let us enter the fortified city — or the fortified cities — and let us be silent there — or let us be cast out there —, for our Lord has cast us off — or has made us silent — and has given us water of gall to drink; for we have sinned against the Lord. We waited for peace, and there was no good, for a time of healing, and behold, dread. The voice of the people is brought in, answering and confessing its vices and exhorting one another to enter the walled cities, or the one city Jerusalem; for the rest had already been taken. 'And let us be silent', he says, 'there, for our Lord has made us silent — for we have no confidence to pray —, or let us be cast away there or let us be cast out like dung. He himself has made us drink waters of gall, because we turned God, who is sweet, into bitterness. And the cause why we should drink such waters is plain: for we have sinned against the Lord and we waited for peace, we who had done no good work and thought that the time of remedy was at hand for us, when all things were filled with dread and terror'. A change of persons, especially in the prophets, makes the understanding difficult; if these are restored to their own places and causes and times, the things which seemed obscure will become plain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
