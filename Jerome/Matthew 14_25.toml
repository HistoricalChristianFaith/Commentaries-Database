[[commentary]]
quote='''
The military guards and watches are divided into portions of three hours each. When then he says that the Lord came to them in the fourth watch, this shows that they had been in danger the whole night.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But in the fourth watch of the night he came to them walking upon the sea. Military guard-posts and watches are divided into spaces of three hours each. So when he says that the Lord came to them in the fourth watch of the night, he shows that they were in danger the whole night, and that at the very end of the night and at the consummation of the world he will bring them help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
