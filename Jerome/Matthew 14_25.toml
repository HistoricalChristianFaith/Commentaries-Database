[[commentary]]
quote='''
The military guards and watches are divided into portions of three hours each. When then he says that the Lord came to them in the fourth watch, this shows that they had been in danger the whole night.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"
