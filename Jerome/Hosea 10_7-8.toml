[[commentary]]
quote='''
Samaria has made her king pass away like foam upon the face of the water, and the high places of the idol, the sin of Israel, will be destroyed. The bur and the thistle will come up upon their altars; and they will say to the mountains: Cover us; and to the hills: Fall upon us. LXX: Samaria has cast out her king like brushwood upon the face of the water, and the altars of ὦν, the sins of Israel, will be taken away. Thorns and thistles will come up upon their altars; and they will say to the mountains: Cover us; and to the hills: Fall upon us. For foam, which the LXX and Theodotion translated φρύγανον, that is, brushwood, dry grasses and withered twigs, which are got ready for the furnace and for burning, Symmachus put ἐπίζεμα, wishing to indicate the upper waters of a boiling pot, rising into foam and bubbles, which the Greeks call πομφόλυγας. As, then, the foam that is upon the water quickly dissolves, so the kingdom of the ten tribes will swiftly be ended; and the high places will perish, that is, bamoth, of which it is written: But still the people were sacrificing and burning incense on the high places. Now these high places are those of ὦν, or auen, that is, of the idol, which is interpreted useless; and this idol and useless thing is the sin of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
