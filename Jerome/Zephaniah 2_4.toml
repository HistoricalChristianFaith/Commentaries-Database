[[commentary]]
quote='''
But if he is in doubt about those who have done his judgments, saying: If somehow you may be hidden on the day of the fury of the Lord, what will become of sinners? For so great a devastation will come upon the land of Judea, and so lofty a conqueror, the Babylonian army, will come up hither, that the same captivity will seize even the most powerful cities of the Philistines, which always withstood you in equal combat. For Gaza will be destroyed, and Ashkelon will be reduced to desolation, and Ashdod they will drag into captivity not by stealth but by war, that is, in open daylight and by victory; and Ekron, which is interpreted uprooting, will undergo what its name signifies, that is, it will be uprooted. This is according to the letter and the Hebrew truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"

[[commentary]]
quote='''
For Gaza and Ashkelon and Ashdod and Ekron will undergo different punishments. For Gaza is interpreted its strength. All, therefore, who applaud themselves in strength of body and worldly power, and say with the devil, By strength I will do it, will be plundered on the day of the wrath of the Lord and brought to nothing. Ashkelon also, which is called weighed, or murderous fire, when the day of the wrath of the Lord comes, will feel the measure of its crime and will be pressed down by the same weight with which it acted. And because it burned to shed blood, and caused many souls to stumble, and in it was fulfilled: The man of blood and deceit the Lord will abhor, it will not be plundered like Gaza, but, reduced to desolation, it will be burned to dust by the fires of Gehenna. Ashdod too, which in Hebrew is called esdod and in our language means fire of generation, will be laid waste in clear light; for it burned with lust and raged in the fire of generation. And because all adulterers, their hearts are like an oven, and they have been wounded by burning arrows, not in darkness, not in a hidden judgment, but at noon, that is, when the saints will receive their full brightness, they will be cast forth into darkness, and they will not have the fellowship of the saints. But Ekron, which is interpreted barrenness, or uprooting, because it bore no fruits and by the perversity of its teaching uprooted very many, will itself also be uprooted. Understand all these varieties in the vices and sins of souls, and that on the day of judgment the fire will test of what sort each one's work is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
