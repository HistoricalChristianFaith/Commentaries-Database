[[commentary]]
quote='''
The same had been said by John the Baptist. Wherefore as of vipers are born vipers, so of your fathers who were murderers are you born murderers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252023.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Serpents, brood of vipers, how will you flee from the judgment of Gehenna? John the Baptist too had said this very thing. Just as, then, vipers are born of vipers, so you, he says, born of murderous fathers, are murderers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
