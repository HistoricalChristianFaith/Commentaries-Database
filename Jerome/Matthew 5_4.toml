[[commentary]]
quote='''
For the mourning here meant is not for the dead by common course of nature, but for the dead in sins, and vices. Thus Samuel mourned for Saul, thus the Apostle Paul mourned for those who had not performed penance after uncleanness.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are those who mourn, for they shall be comforted. The mourning set down here is not for those dead by the common law of nature, but for those dead in sins and vices. Thus Samuel also wept for Saul, because the Lord had repented that he had anointed him king over Israel; thus the apostle Paul too says that he weeps and mourns for those who after fornication and impurity have not repented.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
