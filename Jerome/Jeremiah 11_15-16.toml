[[commentary]]
quote='''
And the other half shall be split toward the west and the sea, with a very great chasm: this is the people of the circumcision, to whom God speaks through the prophet: Why has my beloved done abomination in my house? Shall vows and holy flesh take away your wickedness from you, or will you escape by these? This beloved did abomination in the house of God, so that she crucified the Son of God and heard: The Lord called your name a shady olive tree and a wooded beauty; and your branches became useless, which were broken off from the good root, so that we might be grafted in their place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
