[[commentary]]
quote='''
And the other half shall be split toward the west and the sea, with a very great chasm: this is the people of the circumcision, to whom God speaks through the prophet: Why has my beloved done abomination in my house? Shall vows and holy flesh take away your wickedness from you, or will you escape by these? This beloved did abomination in the house of God, so that she crucified the Son of God and heard: The Lord called your name a shady olive tree and a wooded beauty; and your branches became useless, which were broken off from the good root, so that we might be grafted in their place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
What is it that my beloved has done many crimes in my house? Will holy flesh take away from you your wickednesses, in which you have gloried? A rich olive, beautiful, fruitful, comely, the Lord called your name; at the sound of a great speech a fire blazed up in it, and its thickets were burned up. He calls beloved and most dear the people of Judah, which set up idols in his temple and worshiped them, and thinks that in it it appeases the wrath of God if it sacrifices many offerings, and glories in the multitude of sacrifices, which cannot take away the wickednesses of sins. He compares Jerusalem, or the whole people of the Jews, to a beautiful and fruitful olive, which, exalted through pride, by no means acted humbly nor understood its creator and ruler, but, lifted up through pride and having spoken grandly, was set on fire by the fire of the Lord, so that its branches or thickets were burned up and reduced to nothing, that is, the whole people was destroyed by the sword of the adversaries. This sense is found in another place too, where it is said to Jerusalem: I planted you a fruit-bearing vine, wholly true; how have you been turned into bitterness, O alien vine? When its walls are torn down and the boar from the forest lays it waste and all the beasts devour its fruits, let us say this passage to the princes of the churches: What is it that my beloved has done many crimes in my house? Or else to the rich, who, while they plunder what belongs to others and do not take away the wickednesses of their heart, think that they merit the clemency of God: Will holy flesh take away from you your wickednesses, in which you have gloried? But now the names of those who make offerings are recited publicly, and the redemption of sins is turned into praise, nor do they remember that widow in the Gospel who, by casting two coins into the treasury, surpassed the gifts of all the rich.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
