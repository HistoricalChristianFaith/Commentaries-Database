[[commentary]]
quote='''
The infant too, who is a little one in malice, puts his hand into the hole of the asp, and drives demons out of the possessed bodies of men. But he who has been weaned is no longer nourished on the milk of infancy, but now feeds on solid food. He puts his hand into the den of the basilisk, that is, into the dwelling of Satan himself, and drags him out from there. Hence power was given to the Apostles too to tread upon serpents and scorpions, and upon all the strength of the enemy (Luke 10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
