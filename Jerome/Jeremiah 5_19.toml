[[commentary]]
quote='''
But if you say: Why has the Lord our God done all these things to us? you shall say to them: As you have forsaken me and served a foreign god — or foreign gods — in your land, so you shall serve foreigners in a land not yours. Great is the folly of not knowing why they have suffered, when they have sinned so greatly; and brief is the answer to those who are in doubt: as you have served a foreign god — that is, Baal — or foreign gods of all the nations in the land of Judea, so you shall serve foreign gods in a land not yours, no doubt the Babylonians and Chaldea. 'For if a strange religion delights you, what need is there to take up an error from afar? Dwell with such people; nay rather, serve those whose gods you worship.' This can also be taken of heretics, of whom it is written: they went out from us, but they were not of us; for if they had been of us, they would surely have remained with us: that the Lord casts out of the Church the heretics who for a long time under his name have venerated the images of their own lies, so that they may worship outside what they formerly venerated inside, and the chaff may be separated from the wheat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
