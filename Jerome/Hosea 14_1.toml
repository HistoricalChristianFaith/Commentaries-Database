[[commentary]]
quote='''
Return, O Israel, to the Lord your God, for you have fallen in your iniquity. Take words with you, and return to the Lord; say to him: Take away all iniquity and receive the good, and we will render the calves of our lips. Assyria will not save us, we will not mount upon a horse; nor will we say any more: Our gods, the works of our hands; for you will have mercy on the orphan who is in you. LXX: Return, O Israel, to the Lord your God, for you have been weakened in your iniquities; take words with you and turn back to the Lord, say to him, so that you may not take up iniquity, but may receive good things; and we will render the fruit of our lips. Assyria will not save us, we will not mount upon a horse; by no means will we say any more: Our gods, to the works of our hands; he who is in you will have mercy on the orphan. Now that Samaria and its men are perishing, and its little ones and pregnant women have been slain, dashed down and ripped open, all Israel is called to repentance; so that he who has been weakened, or has fallen in his iniquities, may return to the physician and recover health, or that he who had fallen may begin to stand; and he is taught how he ought to repent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
