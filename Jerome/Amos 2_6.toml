[[commentary]]
quote='''
Thus says the Lord: For three crimes of Israel, and for four I will not turn him back, because he sold the righteous for silver and the poor for sandals, they who crush the heads of the poor upon the dust of the earth and turn aside the way of the humble; and a son and his father went in to the girl, to profane my holy name; and upon garments taken in pledge they reclined beside every altar, and they drank the wine of the condemned in the house of their God. LXX: Thus says the Lord: For three impieties of Israel, and for four I will not turn away from them, because he sold the righteous for silver, and the poor for the sake of sandals, which tread upon the dust of the earth; and they struck the heads of the poor with the fist, and turned aside the way of the humble, and a son and his father went in to the same girl, to defile the name of their God; and binding their garments with cords, they made awnings beside the altar, and they drank wine from false accusations in the house of their God. He puts Israel, that is, the ten tribes, last for this reason: because, as we said before, almost everything that follows was written to it, so that the prophetic discourse might keep the order of the book within one continuous text. Their first crime, then, or impiety, enumerated in three offences or four, is that for money they sold a man, and a righteous man, who is the more admirable in this, that he was not overcome even by poverty so as to do anything unjust; and if indeed, compelled by the necessity of hunger, they had sold the poor righteous man for a price, there would be some excuse for the crime; but as it is, for the cheapest of things, sandals, with which they tread dust and dung, they sold the precious soul of a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
