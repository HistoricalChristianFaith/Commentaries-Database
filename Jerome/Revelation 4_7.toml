[[commentary]]
quote='''
That these four Gospels, then, were foretold long before, the book of Ezekiel too proves, in which the first vision is woven together thus: And in the midst as it were the likeness of four living creatures, and their countenance the face of a man and the face of a lion and the face of a calf and the face of an eagle. The first, the face of a man, signifies Matthew, who began to write as if about a man: The book of the generation of Jesus Christ, the son of David, the son of Abraham; the second signifies Mark, in whom is heard the voice of a lion roaring in the desert: The voice of one crying in the desert: Prepare the way of the Lord, make his paths straight; the third, that of the calf, prefigures that the evangelist Luke took his beginning from Zechariah the priest; the fourth signifies John the evangelist, who, taking up the wings of an eagle and hastening to higher things, discourses on the Word of God. The rest that follows tends to the same sense: their legs straight, and their feet winged, and wherever the spirit went, they went and did not turn back, and their backs full of eyes, and sparks and lamps running to and fro in the midst, and a wheel within a wheel, and in each one four faces. Hence the Apocalypse of John too, after its account of the twenty-four elders, who, holding harps and bowls, worship the Lamb of God, brings in lightnings and thunders and seven spirits running to and fro and a sea of glass and four living creatures full of eyes, saying: The first living creature like a lion, and the second like a calf, and the third like a man, and the fourth like a flying eagle; and a little after: They were full, it says, of eyes, and they had no rest day and night, saying: Holy, holy, holy, Lord God almighty, who was and who is and who is to come. By all these things it is plainly shown that only four Gospels ought to be received, and that all the dirges of the apocrypha are to be sung by dead heretics rather than by living churchmen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
