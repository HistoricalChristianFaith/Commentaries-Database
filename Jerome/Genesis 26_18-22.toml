[[commentary]]
quote='''
I think this same thing is signified also by what is in Genesis, that wells are dug by the servants of Isaac which had been made by Abraham and which the Philistines had stopped up with earth. As long as Abraham lives, his wells are not closed; but when he is dead and the wells are stopped up, if servants dig, the Philistines oppose them, and there is strife. But if Isaac himself comes and digs a well and finds water, the Philistines have no power to oppose him. See Peter and Paul, and you will not doubt about the wells and rivers of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
