[[commentary]]
quote='''
I will show you, O man, what is good, and what the Lord requires of you: surely to do judgment, and to love mercy, and to walk carefully with your God. LXX: It has been declared to you, man, what is good, or what the Lord requires of you, except that you do judgment, and love mercy, and be ready to walk with your God. Since you are in doubt, O people of Israel — or rather the whole human race, for I am by no means speaking to the people of the Jews, but my speech will run out generally to every man — how you can appease God for your sins, if you do not even have victims by which your impiety may be compensated, I will answer you what God requires; indeed, I have already shown it before in the law. For it is written in Deuteronomy: And now, Israel, what does the Lord your God require of you, except that you fear the Lord your God, and walk in all his ways, and love him; and serve the Lord your God with all your heart and with all your soul, and keep the commandments of the Lord your God and his justifications, whatever I shall command you today, that it may be well with you? The Lord requires of us, and, counting our salvation necessary, asks to receive what profits the giver: that we do judgment, that is, that we do nothing without reason and counsel, so that the mind first judges what it is going to do and afterwards completes it in deed; that we love mercy, and are merciful not as if compelled or out of necessity, since God loves a cheerful giver. Nor let us say: Go today, and come back tomorrow, and I will give to you. And when we have done judgment and loved mercy, what reward shall we receive? We shall walk with the Lord God, as Enoch, according to the faith of the Hebrew scrolls, walked with God, and pleased him, and he was not found, because God translated him. For you said: With what shall I attain to the Lord, or with what shall I lay hold of him? I promise you more: do judgment, and love mercy, and you will walk with your God. Or certainly, to walk with God is not a reward but a precept. For just as we are commanded to do judgment and to love mercy, so it is enjoined that we be prepared to walk with the Lord our God; we ought to sleep at no hour, to be secure at no time, but always to expect the householder's coming and to dread the day of judgment, and in the night of this world to say: I sleep, and my heart keeps watch. The word esne, which the LXX translated 'to be ready', and we 'to walk carefully', Theodotion expressed more significantly: καὶ ἀσφαλίζου τοῦ πορεύεσθαι μετὰ Ἐλωαὶχ, that is: And take careful heed that you walk with your God, or, as the Fifth Edition translated: καὶ φροντίζειν, namely to act carefully, and to have this care, that you walk with your God. For he who says that he believes in Christ ought so to walk as he also walked. And the apostle Paul: Be imitators of me, he says, as I am of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
