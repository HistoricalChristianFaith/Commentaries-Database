[[commentary]]
quote='''
You shall say therefore to them — or to the people — this word: Thus says the Lord God of Israel: Every flask — or wineskin — shall be filled with wine. And they will say to you: Do we not know that every flask — or wineskin — is filled with wine? And you shall say to them: Thus says the Lord: Behold, I will fill all the inhabitants of this land, and the kings who sit of the stock — or the sons — of David upon his throne, and the priests and the prophets and all the inhabitants of Jerusalem with drunkenness, and I will scatter them, a man from his brother, and fathers and sons together, says the Lord; I will not spare — or I will not long for — and I will not yield nor have mercy, so as not to destroy them. The Hebrew word 'nebel' Aquila's first edition translated 'flask', the second 'nebel' itself, Symmachus 'mixing-bowl', the Seventy 'wineskin', Theodotion 'vessel'; and all this is filled not with oil, not with water, not with honey, not with milk, nor with any other matter of a liquid element, but with wine and drunkenness, showing that we are a fragile vessel, according to the Apostle, who says: But we have this treasure in earthen vessels, and that it cannot be that there should not be fulfilled in us what is written: For good does not dwell in my flesh, and again: For the good that I will, this I do not do, but the evil that I do not will, this I work, and then: Wretched man that I am, who will deliver me from the body of this death? And with this drunkenness, by which we forget the precepts of God, and with vices and sins, the whole human condition is filled, as the prophet says: No one living shall be justified in your sight — not by comparison with God, as the old and new heretics and the patrons of the heretics would have it, but with respect to his knowledge; for man sees in the face, God in the heart — and what sometimes seems clean to us is found filthy in his eyes: not only the ignoble crowd and the worthless rabble, but the kings of the churches of the stock or sons of David, who sit leaning back, with neck erect and paunch thrust out, upon his throne. The priests too themselves, the second rank in ecclesiastical honor, and the prophets, who seem to have knowledge of the Scriptures, and all the inhabitants of Jerusalem are filled according to the variety of their sins, or Judah, as the Seventy added. And when they are drunk, they are scattered from fellowship with one another, and fathers are separated from sons and sons from fathers, so that they are defiled by diverse heresies and under the name of Christ fight one another with the sword and do battle against their mother who bore them, the Church. Hence he says: 'I will not long for them, but I will hold them in everlasting hatred; I will not spare and I will not yield nor have mercy, not out of cruelty of sentence but out of the truth of judgment. For those who slaughtered my peoples will themselves perish forever'. This can also be taken simply according to the history: that the kings and the priests and the prophets and all the people of Jerusalem were to be made drunk with the Babylonian cup and overwhelmed by the evils of captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
