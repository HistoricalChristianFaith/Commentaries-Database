[[commentary]]
quote='''
And the spirit entered into me after he had spoken to me, and set me upon my feet, and I heard him speaking to me and saying. (LXX: "And the spirit came to me, and took me up, and lifted me, and set me upon my feet, and I heard him speaking to me, and he said to me.") The divine word had instructed the prophet and commanded: Stand upon your feet, but without the help of God and the coming of the Holy Spirit he could not stand; therefore the Spirit enters into him, or takes him up, and raises him, so that he may be of firm step and may be able to say: He set my feet upon a rock. And we read of no sinner standing, but to the saints it is said: Stand therefore, girded about your loins; whereas the sinner deserves to hear that word of Deuteronomy: The footstep of your foot shall not be stable.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
