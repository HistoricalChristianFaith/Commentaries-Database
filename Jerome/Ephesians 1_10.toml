[[commentary]]
quote='''
To recapitulate all things in Christ, the things in the heavens and the things on earth, in him.

For recapitulate (recapitulare) the Latin manuscripts have written restore (instaurare). And I wonder why the translators did not use the Greek word itself, since by a license of this kind the words dialectic and philosophy have been taken over just as they are found in Greek. For orators too, in their epilogues, or before the epilogues, at the end of their cases, for the sake of the memory of the judges and of those who have heard the business, are accustomed to make a recollection, that is, ἀνακεφαλαίωσιν, so that what they had earlier argued at greater length they may afterwards comprise in a brief speech, and each one may begin to recall what he has heard. The sense in the present place, then, is this: The whole dispensation which began to be both before the world and afterwards in the world, of creatures both invisible and visible, was promising the coming of the Son of God. That Adam, who was cast out of paradise, was to be called back through the Savior (Gen. 3). That in the building of the tower the unity of tongues was split (Gen. 11) foreshadowed the gifts of tongues in the Acts of the Apostles (Acts 2). That Isaac, as a type of the Lord, himself carried his own cross (Gen. 22). That Samson, nourishing his holy hair, loved the embraces of poor Delilah, and confessed all the secrets of his heart (Judg. 16), signified the mystery of the Savior and of the Church from the Gentiles, truly poor and needy (John 19). In the cross of the Lord, therefore, and in his passion all things have been recapitulated, that is, all things have been summed up in this ἀνακεφαλαιώσει. To make this clearer, let us set down an example from everyday usage. For instance: I paid out twenty denarii, then five, and another fifteen; thirty also, and three times ten, I gave at different times. If I wish to sum these up into one, the total of a hundred grows up for me, and in one number I shall have everything that I set down before. So, therefore, all the mysteries and the whole dispensation of old, not only that which was carried out on earth but also that in the heavens, is completed in the passion of Christ. For once Christ has suffered for me, and been buried, and risen again, and ascended as victor to the Father, I have no need of the old count, because I hold all things in one. Pay careful attention: not only all the histories of the Scriptures, which the Holy Spirit recounts as done on earth, but also the things in the heavenly places which are hidden from us, are held recapitulated in the passion of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
