[[commentary]]
quote='''
Now let us come to the LXX, so that, setting out each sentence, we may fit to it the allegorical interpretation. Behold, I will raise up the Chaldeans, a bitter and swift nation, which walks over the breadth of the earth, to possess tents not its own. God threatens the despisers and slanderers of his providence that he will raise up the Chaldeans, who are interpreted as it were demons; signifying either the most wicked angels, who minister to his fury and wrath and to the tribulation he brings upon sinners, or the souls of the most wicked men, through whom he torments those who deserve it. Now these Chaldeans are a bitter and swift nation, not sparing and quickly fulfilling what has been commanded them. And it walks over the breadth of the earth — for wide and spacious is the way that leads to death —, along which that rich man in the Gospel also walked, who shone in purple, and those of whom it is said: Who sleep on beds of ivory, and abound in luxuries on their couches. Who eat suckling calves from the herds, and drink refined wine, and are anointed with the finest ointments; who, because they walk on the wide way, are called the breadth of the earth, which is trodden by the footsteps of the Chaldeans. For they would not walk along the strait and narrow way that leads to life, along which Paul walked, glorying in tribulations and distresses. And the Chaldeans walk over the breadth of the earth to possess tents not their own. For every rational soul, although through its own vice and fault it has become a lodging of the Chaldeans, is nevertheless by nature a tent of God. And although in the Gospel the most wicked demon says, I will go into my house from which I came out, he is not to be believed; for no rational creature was made for this, to be a dwelling of a demon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
