[[commentary]]
quote='''
Nothing makes God as angry as when people from despair of better things cling to those that are worse. Indeed, this despair in itself is a sign of unbelief. One who despairs of salvation can have no expectation of a judgment to come. For if he dreaded such, he would by doing works prepare to meet his Judge. Let us hear what God says through Jeremiah: "Withhold your foot from a rough way and your throat from thirst," and again, "shall they fall, and not arise? Shall he turn away, and not return?"
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_122.html'
source_title="LETTER 122.1"

[[commentary]]
quote='''
Restrain your foot from nakedness and your throat from thirst. And you said: I have despaired, by no means will I do it; for I have loved strangers, and after them I will walk. LXX: turn back your foot from the rough way and your throat from thirst. She said: I will act manfully, because she loved strangers and walked after them. Those who are about to keep the Passover are commanded to have shoes on their feet. And the Apostle proclaims shod the feet of those who are prepared by the Gospel, lest, while they walk through the wilderness of this world, they lie open to venomous creatures, which ought to be trampled and crushed by the Gospel foot. We restrain the throat from thirst when we receive the precepts of the Savior, who says: Whoever thirsts, let him come to me and drink. She, out of despair of better things, denied that she would do what the Lord commanded, and set out the reason, saying: I have loved strangers, and I will follow them, thinking by a shameless confession to escape her crimes. But according to the Seventy, the way of sinners is rough, and it is turned by the Lord into a level way. Whoever follows heretics is branded by the verdict of these verses, because he has said: I have despaired — or, in an evil purpose, I will act manfully — and in my error I will be strengthened. And it is necessary that whoever follows a doctrine strange to the Church's should love strangers and follow their footsteps, either demons or the leaders of the heretics, because they are strangers to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
