[[commentary]]
quote='''
It is to be noted, that when Jesus is scourged and spit upon, He has not on His own garments, but those which He took for our sins; but when He is crucified, and the show of His mockery is completed, then He takes again His former garments, and His own dress, and immediately the elements are shaken, and the creature gives testimony to the Creator.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And after they had mocked him, they stripped him of the cloak and clothed him in his own garments, and led him away to crucify him. When Jesus is scourged and spat upon and derided, he does not have his own garments, but those which he had taken on for our sins; but when he is crucified, and the pageant of mockery and derision has passed, then he receives back his former clothes and takes up his own adornment, and at once the elements are thrown into confusion and the creature gives testimony to the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
