[[commentary]]
quote='''
Do not give what is holy to the dogs. What is holy is the children's bread. We ought not, then, to take the children's bread and give it to the dogs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Nor cast your pearls before swine. The pig, which wallows in mud-holes, does not receive adornment, and according to the proverbs of Solomon: If it has a golden ring, it is found the more foul. Some would have the dogs understood as those who after faith in Christ return to the vomit of their sins, and the swine as those who have not yet believed the Gospel and wallow in the mud of unbelief and vices. It is not fitting, therefore, to entrust the pearl of the Gospel hastily to men of this kind, lest they trample it underfoot and, turning, begin to tear you apart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But this that he says, he shall order his words in judgment, is that which is said in the Gospel, that we should not cast our pearls before swine: that is, that he may know what to bestow on each one, that each may know what he is able to receive, and what he is not able. Whence the holy man says: 'In my heart I have hidden your sayings, that I may not sin against you.' I did not give them to whomever I pleased: I did not send your holy thing to dogs, nor did I give pearls to swine. Great, therefore, is the danger for teachers, in being able to pour out the words of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_038.html'
source_title="Homily 38, on Psalm 111"
