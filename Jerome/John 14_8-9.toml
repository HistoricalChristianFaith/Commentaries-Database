[[commentary]]
quote='''
See, this very scandal the apostle Philip once bore, when he said to the Lord, "Lord, show us the Father, and it is enough for us." To whom the Lord in answer said, "Philip, so long a time I am with you, and do you not know the Father? He who sees me, sees the Father also." That the Father himself is the Son, this is impious to say. In that you see the Son, understand the Father: for he cannot be called Son, unless he has had a Father. When Father is said, it is not said unless he has had a Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_069.html'
source_title="Homily 69, on Psalm 91 (Alternate Series)"
