[[commentary]]
quote='''
For it is I who through all the prophets and various kinds of visions have been likened to men, and have called you to repentance. Is it not of human likeness when Moses, raising his hands on high, prays that Joshua may conquer Amalek, and the mysteries of the cross are shown in him? Is not God likened in the hands of the prophets when Jonah is in the deep three days and nights, that he may signify the Lord rising from the underworld on the third day? And we read of visions multiplied in all the prophets, when Ezekiel sees God sitting like a charioteer above the cherubim. And Isaiah: I saw, he says, the Lord sitting upon a throne high and lifted up, and two seraphim around him crying to one another: holy, holy, holy, Lord God Sabaoth. And Habakkuk stood on his watchtower, to see horns in the hands of the Savior, in which his strength is hidden. Hence the psalmist too cries out: I will hear what the Lord God speaks in me. And that we may know that every prophecy in the holy Scriptures is called a vision: And all the people, he says, saw the voice of the Lord; hence the prophets also were formerly called seers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
And lest they think that the heresiarchs and leaders of their error have spoken by the spirit of God: it is I, he says, who spoke to the prophets, and not to your masters; I multiplied visions, and in the hand of my prophets, who are established in the Church, I have been likened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
