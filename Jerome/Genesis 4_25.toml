[[commentary]]
quote='''
And she called his name Seth: For God has raised up for me another seed in place of Abel, whom Cain killed. Seth is properly called θέσις, that is, placing. Because, then, God placed him in place of Abel, he is therefore called Seth, that is, placing. Then Aquila: and she called he says his name Seth, saying: For the Lord has placed for me a second seed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Seth: placing, or placed, or cup, or grass, or seed, or resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
