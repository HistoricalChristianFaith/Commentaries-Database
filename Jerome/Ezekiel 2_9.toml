[[commentary]]
quote='''
If God were to stand up as the avenger of sin, the church would lose many of its saints and certainly would be deprived of the apostle Paul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_147.html'
source_title="LETTER 147.3"

[[commentary]]
quote='''
And I saw, and behold, a hand sent to me. For the hand 'sent' the Seventy translated 'stretched out'; it is sent and stretched out to those who obtain the benefits of the Lord, but is drawn back from those to whom he speaks through the prophet: Is the hand of the Lord shortened and drawn back? and in the psalm: Why have you turned away your hand, and your right hand from the midst of your bosom, to the end? Finally, in the passion he stretched out his wings, and took up the disciples and carried them on his shoulders, and said: All the day long I have spread out my hands to an unbelieving people, that he might gather the children of Jerusalem as a hen gathers her chicks under wings of her own, and that by the stretching out of his hands Israel might overcome Amalek.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
In which was a rolled-up book, and he spread it out before me, and it was written within and without; there were written in it lamentations and song and woe. For 'rolled-up book' the Seventy translated 'the heading of the book', in the hand of the Lord who sits upon the throne, the hand which was sent forth and stretched out; of this book it is also said in the Psalms: In the heading of the book it is written of me — let us understand 'heading' as the beginning —. This book, rolled up and sealed, and written within and without, or before and behind, was of such difficulty that no one could, either in heaven or on earth or under the earth, open it or read it, except only the lion of the tribe of Judah, the root of David and of Jesse; the book which John in the Revelation said he had devoured, not whole but in its heading, that is, in its beginning. For it cannot be that human nature should devour all the treasures of this book.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
