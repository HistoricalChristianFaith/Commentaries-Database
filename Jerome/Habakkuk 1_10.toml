[[commentary]]
quote='''
He too, that is, Nebuchadnezzar, will reign over the whole world, and, triumphing over kings before his chariot, he will hold them in derision and count them among his amusements; and he will be of such great power and pride that he will strive to overcome nature and to take the most strongly fortified cities by the might of his army. For he will come to Tyre, and, throwing a mound into the sea, he will make a peninsula of the island, and land will provide an entrance into the city between the waves of the sea. For this reason he will both laugh at every fortress, and heap up a mound, and take it, that is, the fortress, or Tyre; and this indeed is clearly shown in Ezekiel, where it is said: Nebuchadnezzar, king of Babylon, subjected his army to great labor against Tyre. Every head was bald, and every shoulder stripped of hair, and no wages were given to him and to his army against Tyre; and for the work in which he served against it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
And it says: He will make sport of every fortress. But what other fortress is there, except that of which the Apostle speaks: For the weapons of our warfare are not carnal, but mighty for God for the destruction of fortresses, destroying thoughts, and every height that lifts itself up against the knowledge of God. If therefore there are any fortifications, either in discourses which promise that they have a height and greatness contrary to the truth, or in all the glory and riches and strength that is praised in the world, all will be destroyed, and the word of God will make sport of every fortress. And it will cast up a mound, and will take it by the mound and the earthly things it brings forward, convicting it of fragility in those things in which it formerly seemed to itself to have some strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
