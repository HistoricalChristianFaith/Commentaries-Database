[[commentary]]
quote='''
By the two blind men are generally understood the Pharisees and Sadducees.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But there were also two blind men by the way. He calls them blind who could not yet say: In your light we shall see light; by the way, because they seemed indeed to have knowledge of the law, but did not know the way, which is Christ. Most take them to be the Pharisees and the Sadducees, but others both peoples, of the Old Testament and of the New, because the one following the written law, the other the natural law, was blind without Christ. These, because they could not see by themselves, heard the proclamations of the Savior and confessed him the son of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
