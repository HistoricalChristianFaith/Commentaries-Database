[[commentary]]
quote='''
So Jacob devised a new trick and fought with natural art against the nature of the white and the black beasts. For taking three rods, of poplar and of almond and of pomegranate (although the Seventy have rods of storax and of nut and of plane), and stripping them in part, he gave the rods a varied colour, so that wherever he had left the bark on the rod the old colour remained, but where he had taken the bark off, a white colour was laid bare. Jacob therefore kept watch, and at the time when the flocks were mounted, and after the heat of the day went eagerly to drink, he set the parti-coloured rods in the troughs, and letting in the rams and the he-goats, in that very eagerness for drinking he had the sheep and the she-goats mounted, so that from the twofold desire, while they drink eagerly and are mounted by the males, they might conceive offspring such as the shadows of the rams and he-goats mounting from above which they beheld in the mirror of the waters. For from the rods set in the troughs the colour of the images too was varied. Nor is it surprising that this is the nature of females in conceiving, that they produce such young as they have looked upon, or conceived in mind, in the final heat of pleasure as they conceive, since this very thing is said to happen also in the herds of mares among the Spaniards; and Quintilian, in that controversy in which a matron was accused of having given birth to an Ethiopian, argues in her defence that this is the nature of conceptions which we have described above. And after the spotted and parti-coloured kids and lambs had been born from the white flocks and those of one colour, Jacob separated them and had them kept far from the original flock; but if any were born of one colour, that is, white or black, he handed them over into the hands of Laban's sons: and he set the rods which he had stripped in the troughs where the waters were poured out, and they came to drink opposite the flocks, so that they might conceive at the time when they came to drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
