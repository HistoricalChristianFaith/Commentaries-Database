[[commentary]]
quote='''
By the servants who were sent the second time, we may better understand the Prophets than the Apostles; that is to say, if servant is read in the first place; but if 'servants,' then by the second servants are to be understood the Apostles;

The dinner that is prepared, the oxen and the fatlings that are killed, is either a description of regal magnificence by the way of metaphor, that by carnal things spiritual may be understood; or the greatness of the doctrines, and the manifold teaching of God in His law, may be understood.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"
