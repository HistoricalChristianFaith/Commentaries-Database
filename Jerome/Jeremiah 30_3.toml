[[commentary]]
quote='''
The length of the book of Jeremiah the prophet overcomes our purpose, so that, however briefly, we nonetheless say much. Hence the present sixth book of the commentaries on Jeremiah will also contain the mystical promises which the Jews, and our Judaizers, think are to be fulfilled at the consummation of the world; for they cannot prove that they were already fulfilled under Zerubbabel. We, however, following the authority of the apostles and evangelists, and above all of the Apostle Paul, show that whatever is promised carnally to the people of Israel has been fulfilled spiritually in us and is being fulfilled today, and that there is no other contest between Jews and Christians but this: that, while they and we both believe that Christ the Son of God has been promised, the things that are to be under Christ are said by us to have been fulfilled, by them to be yet fulfilled. We, therefore, who believe that Christ has already come, must teach that the things which are said to be going to take place under Christ have been fulfilled, and that we are the sons of Abraham, of whom it is written: God is able from these stones to raise up sons to Abraham, to whom the promise was made: and in your seed all the nations shall be blessed. Teaching that this blessing was fulfilled in Christ, the vessel of election says: he did not say, he says, in seeds, but in seed, which is Christ. Pray, therefore, brother Eusebius, to the Lord Jesus Christ, that with the same labor and grace of the Spirit with which we have interpreted the promises of the other prophets, and especially of Isaiah, we may be able to explain those of this prophet also, who, as much as he seems simple and easy in his words, is in the same measure most profound in the majesty of his meanings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
