[[commentary]]
quote='''
And to the house of the king of Judah: Hear the word of the Lord, house of David! Thus says the Lord: Judge judgment in the morning, and rescue the one oppressed by violence from the hand of the one falsely accusing, lest perhaps my indignation go forth — or so that my indignation may not go forth — like fire, and be kindled, and there be none to quench it; and what follows: because of the wickedness of your pursuits, is not found in the Seventy. Because he had said above: and to this people you shall say: thus says the Lord, he now accordingly adds: and to the house of the king of Judah, so that there is understood: 'you shall say: thus says the Lord'; for by apo koinou [in common, i.e. shared by both clauses] both what precedes and what follows are joined, so that the sense is: 'and to this people you shall say: thus says the Lord, and to the house of the king of Judah you shall say: thus says the Lord'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
