[[commentary]]
quote='''
See how great is the help of God and how frail the human condition, that this very thing, that we repent, we are not at all able to accomplish unless the Lord has first converted us. 'And after', he says, 'you showed me either repentance itself or the knowledge of you, or I knew you, I struck my thigh.' This is the sign of one grieving and lamenting and bewailing his former error: that he strikes his thigh with his hand and confesses that he was foolish before. I was confounded, he says, and blushed or from the day of confusion. For what time is not one of our confusion, if we recall our ancient sins and call to memory all the things we have done ill? And what the Seventy said: and I showed you, signifies that, after he groaned and knew his own offenses, he then came to such progress that he even showed God to others who did not know him, according to what David too says in repentance: I will teach the wicked your ways, and the ungodly shall be converted to you. Because I bore, he says, the reproach of my youth. He says that he sinned through the ignorance of his age, so that he may more easily obtain pardon, according to what David too sings: the offenses of my youth and my ignorances do not remember! Whence also in what follows the Lord calls him 'a little one' and 'abounding in delights'; and this he says on account of the greatness of its riches and the fertility of the land, in which the tribe of Ephraim luxuriates to this day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
