[[commentary]]
quote='''
Because, then, their shepherds were not sparing them, and they themselves were the first to devour my people, therefore I too will no longer spare the inhabitants of the land of Judea, says the Lord. For he speaks of this land, of which his discourse was, and not of the whole world, as the Jews, interpreting badly, wish to twist God's sentence away from themselves in another direction. For after the overthrow of the temple — which befell them for this reason, that for forty-two years after the Lord suffered, though granted a space of time, they would not repent —, I will let loose, he says, each one against his neighbor; and they will cut one another down in mutual slaughter, or else in the very siege of the temple, when the Roman army shall surround Jerusalem; for there will be such wars and discords among the Jews themselves that the people will be divided into three parts. Let us read Josephus and the seven books of the Jewish Captivity, and we shall see by the truth of history that this prophecy has been fulfilled. And they shall cut down, he says, the land: there is no doubt that the Romans destroyed all the land and all the cities of the Jews. And I will not rescue them from their hand. Hear, O Jew, you who promise yourself the vainest hopes, and do not hear the Lord saying and affirming: I will not rescue from their hands, that your captivity among the Romans is to be eternal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
