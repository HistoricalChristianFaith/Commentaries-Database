[[commentary]]
quote='''
I know what can be objected on the contrary: "Brothers, if a man has been overtaken in some fault, you who are spiritual instruct such a one in the spirit of gentleness" (below, 6:1). And in another place: "But the spiritual man judges all things, yet he himself is judged by no one" (1 Cor. 2:15): namely, that the word spiritual sounds something other than what we said above. But we call that man spiritual, in that he judges all things and is himself judged by no one, who, knowing all the mysteries of the Scriptures, understands them in a lofty way, and, seeing Christ in the divine books, admits in them nothing of Jewish tradition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
