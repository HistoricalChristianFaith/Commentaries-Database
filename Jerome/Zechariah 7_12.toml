[[commentary]]
quote='''
Moreover, what is said according to the Hebrew, And they made their heart adamant, shows hardness of heart, and a heart of stone, in that they would not receive the words of God. For adamant, a very strong stone, which in Hebrew is called samir, is so hard that it breaks all metals and is itself broken by none. Hence it is called untamable by the Greeks. With this adamant the heart of Pharaoh was hardened, so that he would not let the people of God go.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
