[[commentary]]
quote='''
Make yourself bald and be shorn over the sons of your delights; enlarge your baldness like the eagle, for they have been led captive from you. LXX: Glory of the daughter of Israel, make yourself bald and be shorn over your delicate sons; enlarge your baldness like the eagle, for they have been led captive from you. What was said by the Seventy, glory of the daughter of Israel, with their addition of the daughter, the Hebrews read at the end of the preceding section. But since you wished it so, and we have once undertaken it, the necessity lies upon us of interpreting the Scriptures as they are read in the Church, and nonetheless of not omitting the Hebrew truth. It is said, then, to Israel, for the present according to the letter, so that we take either the ten tribes in Samaria, or all Israel in common, that, since the people has been led captive and all Judea laid waste by the Assyrians and the Babylonians, they should take up mourning and weep for their sons. And as the eagle, which is the queen of birds, at a certain time loses its feathers and remains featherless, so let Israel too lay aside all its glory, with which it had formerly been surrounded, and mourn its sons, made subject to the power of enemies. That the eagle is accustomed to lose its plumage at a certain time is written both in the Psalter, Your old age will be renewed like the eagle's, and by the Comic poet in the Heautontimorumenos: She seemed, he says, truly, as the saying goes, an eagle's old age. But if we wish to take this same thing also of the present time of the Jewish overthrow, we shall see that all the grace with which they once flourished before God has completely departed from them. For where is the prophet? Where is the teacher of the law? Where the protection of angels? Where the victory hoped for by the few against the many? Jerusalem has been made bald and has lost all the hair of her former glory, and her sons, who cried out against the Lord, Crucify, crucify him, have been led into captivity. I have read in someone's commentaries that what is said, Make yourself bald and be shorn over the sons of your delights, can be taken of the human condition, so that the speech of God is directed to Adam, or to the heavenly Jerusalem: O human soul, O city once mother of the saints, you who were formerly in paradise and enjoyed the delights of diverse trees, and had most beautiful hair, now, because you have been cast down from the heights and led away into Babylon, and have come into the place of captivity, and have lost your hair, shave yourself and put on the garb of a penitent; and you who formerly flew like an eagle on high, mourn your sons, mourn your offspring, which has been led captive out of you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
