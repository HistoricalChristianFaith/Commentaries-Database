[[commentary]]
quote='''
Attend carefully to the sequence and order of the reading: for the eternal life which God, who does not lie, promised before eternal ages, is nothing other than the Word of God. For he has manifested, he says, in his own times his word: therefore the eternal life which he had promised is itself his Word, which in the beginning was with the Father: and the Word was God, and the Word was made flesh, and dwelt in us (John 1). And that the Word of God, that is, Christ himself, is life, he testifies in another place, saying: "I am the life" (John 14:6). A life, moreover, not brief, not bounded by any times, but perpetual, but eternal: which has been manifested in the last ages, in the preaching which was entrusted to Paul, the teacher and master of the Gentiles, that it might be announced in the world and become known to men, according to the command of God the Savior, who willed us to be saved, by fulfilling what he had promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
