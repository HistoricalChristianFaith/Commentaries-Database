[[commentary]]
quote='''
What we have interpreted of the person of Christ, and the calling of the nations, and the preaching of the Gospel, and the condemnation of idols, some refer to Cyrus king of the Persians: that God raised him up from the East against the Babylonians and made him obey his command, laying many nations low before him and subjecting all things to his sword and bow; and they refer what follows to his person, namely that their idols, made by human effort and called into being by the coppersmith's art, did not profit the Babylonians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
