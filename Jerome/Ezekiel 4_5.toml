[[commentary]]
quote='''
— Concerning Israel this must be said: that under King Pekah son of Remaliah, who reigned in Israel twenty years, Tiglath-pileser king of Assyria came, and took Ijon, and Abel house of Maacah, and Janoah, and Kedesh, Hazor, and Gilead, the whole land of Naphtali; and he carried them over to the Assyrians. After him Hoshea son of Elah reigned in Israel nine years, and he was taken with all Samaria by Shalmaneser king of the Assyrians, and carried over to Halah and Habor, the rivers of Gozan, in the cities of the Medes. Now Hoshea was taken in the sixth year of King Hezekiah, as the holy history of Kings relates; and from him, if we reckon in order, we shall be able to find in this way for how many years Israel was in distress and pressed by the yoke of captivity. From the sixth year to the twenty-ninth year — for that many years Hezekiah reigned — twenty-four years are reckoned. Manasseh succeeded him and reigned fifty-five years. After him Amon reigned two years. After him Josiah, thirty-two years. Jehoiakim, who was also surnamed Eliakim, succeeded him, and reigned eleven years. After him Jehoiachin, surnamed Jeconiah, who was at once led into captivity; and in his place Zedekiah reigned eleven years, under whom Jerusalem was taken and the temple destroyed. So from the first captivity of Israel, which took place under King Pekah, to the eleventh year of Zedekiah, in which the temple was laid waste, there are one hundred and sixty-four years. From the second, when Hoshea was taken and all Samaria overthrown, one hundred and thirty-five years. And there were seventy years of the temple's desolation, which, added to the first captivity, make two hundred and thirty-four years. For in the second year of Darius king of the Persians the temple was built by Zerubbabel son of Shealtiel and Jeshua son of Jozadak, while Haggai and Zechariah prophesied; Darius reigned thirty-six years, and, one being taken away, his thirty-five years are added. After him Xerxes son of Darius reigned twenty years. After him Artabanus, seven months. And Xerxes, who was surnamed Μακρόχειρ [Long-hand], forty years. After him Xerxes, two months, and Sogdianus, seven months. Darius, surnamed Nothus, succeeded him, and reigned nineteen years. After him Artaxerxes, surnamed Memor, son of Darius and Parysatis, reigned forty years; he is called Ahasuerus by the Hebrews, and under him is related the history of Mordecai and Esther, when the whole people of the Jews, freed from the danger of death, recovered its former liberty. And from the second year of Darius to the last year of Ahasuerus there are one hundred and fifty-five years and four months, which, added to the two hundred and thirty-four years above, make three hundred and eighty-nine years and four months.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
— And I greatly wonder why the common copies have 'one hundred and ninety years', and in some it is written 'one hundred and fifty', when plainly both the Hebrews and Aquila, Symmachus and Theodotion hold 'three hundred and ninety years', and among the Seventy themselves — and yet they have not been corrupted by the fault of copyists — the same number is found. A most difficult question, and, not to speak proudly, one explained by no one, we believe we have expounded not so much by our own knowledge as by the grace of the Lord, that being fulfilled which he himself promised: Seek and you will find, ask and you will receive, knock and it will be opened to you. — But whoever wishes to reckon from the first captivity, which took place under Menahem son of Gadi king of Israel, who reigned in Samaria ten years, when Pul king of the Assyrians came into the land of Israel and received a thousand talents of silver, and after him the other two years of Pekah that he reigned in Israel, will find the three hundred and ninety years completed in the twenty-eighth year of King Ahasuerus, when the history of Esther is said to have taken place; and this is also more credible, for it was not when the reign of Ahasuerus was ended, but while he was still reigning, that Israel cast off the yoke of the heaviest servitude.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
