[[commentary]]
quote='''
Wash your heart from wickedness, Jerusalem, that you may be saved; how long shall harmful thoughts linger in you? To the people saying: woe to us, we are laid waste! the prophet answers, nay rather God through the prophet: wash your heart from wickedness, Jerusalem, with that water of which Isaiah too speaks: wash yourselves, be clean, the water of saving baptism, the water of repentance. And he speaks to the metropolis of the Jews, so that by the city the peoples may be understood: 'how long do you lie subject to wicked thoughts, which proceed from your heart?' And in the holy Scriptures we should take the heart for the soul and the understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
