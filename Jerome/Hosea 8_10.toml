[[commentary]]
quote='''
And when they have given presents to the Gentiles, and have hired the nations for pay to help them, they will be gathered for battle, and, bound, will be led away together. And because they love to offer gifts to their adversaries, therefore for a little while they will obtain the favor of not paying tribute to the king and the princes, until they come to the Assyrians, where they will by no means pay taxes and tribute as free men, but will be reduced to the utmost slavery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
But if, he says, now and in the present age they repent, and I receive them, they will cease to set up over themselves the little king and his princes; so that we may understand the little king to be the devil, in distinction from the great king, who can have no fellowship with Belial, but, as soon as he has been received, drives the little king and his princes out of the heart of believers. According to the Hebrew, however, those who had before been scattered, and had hired the nations for pay, will be gathered into the Church of God, and will rest from the burden of the king, about whom the Apostle rebukes those cut off from the Church, saying: Without us you reign; and would that you did reign, and from the princes whom they have, set up in the synagogues of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
