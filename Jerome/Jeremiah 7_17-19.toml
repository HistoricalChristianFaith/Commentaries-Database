[[commentary]]
quote='''
Do you not see what these are doing in the cities of Judah and in the streets of Jerusalem? The sons gather wood and the fathers kindle the fire and the women sprinkle fat, to make cakes — or chauonas — for the queen — or the host — of heaven, and to pour libations to strange gods and to provoke me to anger. Is it me they provoke to anger? says the Lord, is it not themselves, to the confusion of their own face? 'Do you wish,' he says, 'to hear, prophet, why I said to you: do not pray for this people? They do these things that follow: both within and without and in the streets and in the outlets of Jerusalem the sons carry together wood and the fathers kindle the fire and the women sprinkle fat with flour to make chauonim' — which we have rendered 'cakes' or 'preparations', so that it shows every kind of sacrifice to the queen of heaven, whom we should take to be the moon, or at any rate to the host of heaven, so that we understand all the stars — 'and after this they pour libations to strange gods, not that these exist, but in that under their names they burn incense to demons, and they provoke me to anger by doing these things. Nor do the wretches understand that this contention does not harm me, whom anger never changes, but themselves, to the confusion of their own face and to everlasting disgrace.' Whatever, therefore, we do, we do not harm God, who can never be harmed, but we prepare destruction for ourselves, storing up wrath for the day of wrath. And he set down the different tasks of the sons and of the fathers and of the mothers, or wives, so that there may be no age that has dissented from the impiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
