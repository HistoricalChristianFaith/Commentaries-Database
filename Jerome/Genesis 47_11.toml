[[commentary]]
quote='''
And as for what follows afterwards, he gave them to possess the best land of Egypt in Ramesse, they hold that the Arsenoite district was once so called.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
