[[commentary]]
quote='''
Do not possess gold or silver or money in your belts, no bag for the road, not two tunics, no shoes, nor a staff in the hand; for the laborer is worthy of his food. Consistently he gave these commands to the preachers of the truth, to whom he had said before: Freely you have received, freely give. For if they preach in such a way that they accept no price, the possession of gold and silver and coins is superfluous. For if they had had gold and silver, they would have seemed to preach not for the sake of men's salvation but for the sake of gain. Nor bronze in purses. He who had cut off riches cuts away almost even the necessities of life, so that the apostles, teachers of the true religion, who taught that all things are governed by providence, might show that they themselves took no thought for the morrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
