[[commentary]]
quote='''
Thus He holds them in a syllogism which the Greeks call 'Aphycton,' the unavoidable; which shuts in the person questioned on both sides, and presses him with either horn. If, He saith, the Devil be evil, he cannot do good works; so that if the works you see be good, it follows that the Devil was not the agent thereof. For it cannot be that good should come of evil, or evil of good.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Either make the tree good and its fruit good, or make the tree bad and its fruit bad. For the tree is known by its fruits. He binds them with a syllogism which the Greeks call ἄφυκτον, and which we can call inescapable, which, when men are questioned, shuts them in on this side and on that and presses them with either horn. If, he says, the devil is evil, he cannot do good works; but if the things you see done are good, it follows that it is not the devil who does them. For it cannot be that good should arise from evil, or evil from good. But what follows,
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
