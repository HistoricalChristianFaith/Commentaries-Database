[[commentary]]
quote='''
Nor should you think it a feeble crowd: it is a people many and strong, and no other nation like it can be found, either in the past or in the future; whatever it touches it will consume like a ravenous flame, and will leave nothing whole behind it; like a garden and paradise of delight is all the land which it has not touched; like a solitude and a desert is whatever it has plundered, nor can anyone be found who escapes its hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
