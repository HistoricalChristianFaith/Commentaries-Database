[[commentary]]
quote='''
For as the sound of thorns burning under a pot gives off an unpleasant crackling, so too the words of a fawning master will be of no profit, whether he exhorts his hearers to the cares of the world, which the thorns are taken to mean, or prepares them for the burning to come. Symmachus, for what we have put: For as the sound of thorns under a pot, so is the laughter of the fool, interpreting the sense which we have set out above, says: For through the voice of the unskilled a man is bound with chains. That is, at the voice of such preceptors the hearer is entangled all the more, while each one is bound fast by the chains of his own sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
