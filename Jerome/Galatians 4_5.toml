[[commentary]]
quote='''
Another, however, will look more keenly at the very word might redeem, and will say that those are signified as redeemed who were first on God's side and afterwards ceased to be so, while those who had not been under the Law are not so much redeemed as bought. Hence to the Corinthians too, among whom fornication was heard of, and such fornication as is not even among the Gentiles (ibid. 5), it is written: "You have been bought at a price", not redeemed; for they had not been under the Law. We therefore receive back the adoption of the sons of God, and, redeemed by Christ, we cease to be under the slavery of the elements of the world and the power of guardians. And just as we have shown what difference there is between redeeming (redimere) and buying (emere), so let us consider what difference there is between receiving (accipere) and receiving back (recipere) the adoption of sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
