[[commentary]]
quote='''
And what follows: From him the corner, from him the peg, from him the bow of battle, from him shall go forth every exactor together, they understand μεταφορικῶς (metaphorically), so that they interpret the corner as the royal power, because it holds the walls together. And from him, he says, the peg, that is, the priesthood. Read Isaiah, in whom Eliakim is fastened in the temple of God like a peg. From him the bow of battle: men strong for war; from him also every exactor together, which in the Hebrew is written noges, and Aquila translated εἰσπράσσων (exactor), so that not only were there strong and good men, but others among them were unworthy of their lineage. For Judas Maccabeus, and all who were princes among the people from his line, were both the corner, because they held the people together with royal power, and the peg, for they themselves were priests, and the bow of battle, because they proved most valiant men, so that they not only marshalled the army and the battle line, but were the first to leap forward into battle. Concerning what follows: From him shall go forth every exactor together, for which the LXX translated: From him shall go forth everyone who leads out together, we can also say this: there will be no rank in the army that is not arranged at his discretion. And they shall be most valiant men, treading down the Macedonians like the mire of the streets in battle; and they shall be most valiant, and shall fight, because the Lord is with them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
