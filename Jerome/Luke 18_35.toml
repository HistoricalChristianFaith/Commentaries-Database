[[commentary]]
quote='''
And as they were going out from Jericho, a great crowd followed him. And behold, two blind men sitting by the way heard that Jesus was passing by, and they cried out, saying: Lord, have mercy on us, son of David. But the crowd rebuked them, that they should be silent. But they cried out the more, saying: Lord, have mercy on us, son of David. There were many robbers in Jericho who were accustomed to kill and wound those going out and going down from Jerusalem; therefore the Lord came to Jericho with his disciples, to free the wounded and to draw a great crowd along with him. And indeed, when he wished to go out from Jericho, a great crowd followed him. If he had stayed in Jerusalem and had never come down to lowly places, the crowd would to this day be sitting in darkness and in the shadow of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
