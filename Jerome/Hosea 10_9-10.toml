[[commentary]]
quote='''
From the days of Gibeah Israel has sinned; there they stood. The battle against the sons of iniquity will not overtake them in Gibeah. According to my desire I will chastise them; peoples will be gathered against them when they are chastised for their two iniquities. LXX: Since the hills have been, Israel has sinned; there they stood. War did not overtake them on the hill against the sons of iniquity; he came to chastise them, and peoples will be gathered against them when they have been chastised in their two iniquities. From the day on which Benjamin shamefully and cruelly killed the Levite's wife in the city of Gibeah, all Israel has sinned against me; not because it avenged the wrong and punished the crime with blood, but because it leapt to battle out of a husband's grief and would not avenge the sacrilege against its own God, in that it disregarded the ephod and teraphim in the house of Micah, which were worshiped as idols. Here, then, Israel stood; there it checked its step, so as to walk no further in the ways of the Lord. Therefore the battle, or captivity, will not overtake them on account of Gibeah, as they themselves suppose; for there they did well to pursue the sons of iniquity; but I will chastise them, he says, and instruct them with the whole will of my mind, and I will gather against them a multitude of peoples, because they committed two iniquities, avenging a man and neglecting the wrong done to their God. Or two iniquities, because they sinned first in the idols of Micah, second in the calves of Jeroboam. Or at least we can call the two calves of Samaria, in Dan and Bethel, the two iniquities, of which Jeremiah too speaks: My people have done two most evil things; they have forsaken the fountain of living water, and dug for themselves broken cisterns, which cannot hold water. These two iniquities broke out against two commandments of the Decalogue, in which it is said: I am the Lord your God; you shall have no other gods besides me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
