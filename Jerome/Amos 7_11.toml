[[commentary]]
quote='''
For thus, he says, says Amos. You are wrong, slanderer. For in all his words the prophet does not speak as though from himself, but always sets at the head: Thus says the Lord. Therefore he makes out that the prophet Amos said what the Lord spoke, so as to provoke the king the more to vengeance. What are the things that Amos says? Jeroboam shall die by the sword. In this too you lie: for he did not say: He shall die; for if he had said this, it would seem that he did not admit repentance; but he said that the Lord will rise up against the house of Jeroboam with the sword, threatening punishment, not inflicting it. Nor does he say: Jeroboam shall die by the sword, but: I will rise up against the house of Jeroboam with the sword. For Jeroboam did not die by the sword, but his house, that is, his son Zechariah, was destroyed when God struck him. And Israel, he says, shall go captive out of his land; add the rest too: if he does not repent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
