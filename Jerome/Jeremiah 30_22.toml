[[commentary]]
quote='''
And what he says according to the Hebrew only, but not according to the Seventy: and you shall be my people, and I will be your God, we see fulfilled in deed, in part in Israel and wholly in the multitude of the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
