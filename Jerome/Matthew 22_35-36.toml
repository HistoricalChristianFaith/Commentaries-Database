[[commentary]]
quote='''
One of the doctors of the law asks, not desiring to know but tempting, whether he, when asked, knew what he was being asked, which is the greater commandment: not asking about the commandments, but which is the first and great commandment, so that, since all that God has commanded is great, whatever he answered, the questioner might have an occasion for slander, asserting that another, out of the many, is great. Whoever, then, knows and asks, not from a wish to learn but from eagerness to find out whether the one who is to answer knows, approaches after the likeness of the Pharisees, not as a disciple but as a tempter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
