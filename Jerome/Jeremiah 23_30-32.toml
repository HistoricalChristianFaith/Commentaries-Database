[[commentary]]
quote='''
Therefore, behold, I am against the prophets, says the Lord, who steal my words each one from his neighbor; behold, I am against the prophets, says the Lord, who take up their tongues and say: He says — or they slumber a slumber — ; behold, I am against the prophets who dream a lie, says the Lord, who tell them and seduce my people in their lies and in their wonders — or astonishments and terrors — of their own, when I had not sent them nor commanded them, who have been of no profit to this people, says the Lord. Falsehood always imitates truth, and unless it has some likeness of what is right, it cannot deceive the innocent. As, then, among the former people the prophets lied and said: 'thus says the Lord' and: 'I saw the Lord' and: 'the word of the Lord which came to this man or that', so the heretics take up testimonies of the Scriptures from the Old and New Instrument and steal the words of the Savior each one from his neighbor, from prophets and apostles and evangelists, and take up their tongues, to utter with the mouth the poisons of the heart, and slumber a slumber — of whom it was truly said: they have slumbered their sleep and found nothing — or, according to the Hebrew: and they say: He says, so that 'the Lord' is understood, or certainly 'the divine word'. The Lord therefore threatens that he himself will come against masters of this kind, who seduce his people in their lies and in their astonishments and wonders. For they promise great and incredible and immense things in order to seduce the wretched; who have been of no profit to the people of God, and fulfill that apostolic word: teaching what they ought not, for the sake of base gain; who are wont to announce to the wicked prosperity, and the contrary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
