[[commentary]]
quote='''
Do not go out into the fields, and do not walk on the road, for the sword of the enemy, terror is all around! The Gospel teaches that one must not go out into the field nor come down from the height of the housetops, but must heed that word: Save yourself on the mountain, to which in Isaiah and Micah we are commanded to run and climb. According to the letter, however, it is commanded that they not go outside, that they not desert the walls, but that they protect themselves with strong fortifications.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
