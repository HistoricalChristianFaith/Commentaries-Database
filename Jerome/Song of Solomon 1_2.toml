[[commentary]]
quote='''
Or, according to the Seventy, he did not wish to save his people through angels and prophets and other holy men, but he himself came down to the lost sheep of the house of Israel, to carry back the sick sheep on his shoulders, and to find the drachma that had been lost, and to run joyfully to meet the prodigal son as he returned. For this reason the bride says in the Song of Songs: Let him kiss me with the kisses of his mouth: not through the Patriarchs, Moses and the Prophets, but let him assume my body, let him dwell in my flesh, let the Word become flesh, and so let him kiss me, dwelling in me, that he may be Emmanuel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
All this is fitted to the mystery of the Lord and Savior: this is the Son of God and of man, who is for us truth, mercy, peace, and justice, in whom the justice of the former people and the mercy of the latter are joined together into one peace. "For he himself," says the Apostle, "is our peace, who has made both one." This is the mystery which the Church desires, and cries out in the Song of Songs, saying, "Let him kiss me with the kiss of his mouth." This is the kiss of which the Apostle Paul says, "Greet one another with the kiss of peace."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_064.html'
source_title="Homily 64, on Psalm 84 (Alternate Series)"

[[commentary]]
quote='''
And what I forgot to say at the beginning, I will now say: here the person of the Lord and Savior must be established. From generation to generation I will proclaim your truth with my mouth. He who spoke earlier through the patriarchs and prophets, afterward himself speaks in person, as it is said in the Song of Songs: "Let him kiss me with the kiss of his mouth." So then what he says is this: he of whom I spoke through the prophets, from that same source I now also speak through my very self. So that he whom the world could not hear when he thundered, it might hear at least when he wailed as an infant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
