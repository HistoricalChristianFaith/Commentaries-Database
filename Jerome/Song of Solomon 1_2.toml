[[commentary]]
quote='''
Or, according to the Seventy, he did not wish to save his people through angels and prophets and other holy men, but he himself came down to the lost sheep of the house of Israel, to carry back the sick sheep on his shoulders, and to find the drachma that had been lost, and to run joyfully to meet the prodigal son as he returned. For this reason the bride says in the Song of Songs: Let him kiss me with the kisses of his mouth: not through the Patriarchs, Moses and the Prophets, but let him assume my body, let him dwell in my flesh, let the Word become flesh, and so let him kiss me, dwelling in me, that he may be Emmanuel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
