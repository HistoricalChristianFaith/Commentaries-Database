[[commentary]]
quote='''
And note that he washed the filth of the daughters of Zion by the spirit of judgment, but the blood of Jerusalem by the spirit of burning. For what is light is washed; what is heavier is burned out. Of this spirit of judgment and spirit of burning John the Baptist spoke in the Gospel: I baptize you in water, but he who comes after me will baptize you in the Holy Spirit and in fire (Matt 3:11). From which we learn that man gives only water, but God gives the Holy Spirit, by whom both filth is washed away and the sins of blood are purged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Whose shoes I am not worthy to carry. In another Gospel: Whose, he says, shoe's strap I am not worthy to loose. Here humility is shown, there a mystery: that Christ is the bridegroom and John does not deserve to loose the bridegroom's strap, lest his house be called, according to the law of Moses and the example of Ruth, the house of the unshod.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
He will baptize you in the Holy Spirit and fire. Either because the Holy Spirit is fire, as the Acts of the Apostles teach, at whose descent there sat as it were fire upon the tongues of the believers, and the word of the Lord was fulfilled who said: I came to send fire upon the earth, and how I wish that it may burn; or because in the present we are baptized with the spirit and in the future with fire, the Apostle too agreeing with this sense: The fire will test what sort each one's work is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
