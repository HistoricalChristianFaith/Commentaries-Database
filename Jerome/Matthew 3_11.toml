[[commentary]]
quote='''
And note that he washed the filth of the daughters of Zion by the spirit of judgment, but the blood of Jerusalem by the spirit of burning. For what is light is washed; what is heavier is burned out. Of this spirit of judgment and spirit of burning John the Baptist spoke in the Gospel: I baptize you in water, but he who comes after me will baptize you in the Holy Spirit and in fire (Matt 3:11). From which we learn that man gives only water, but God gives the Holy Spirit, by whom both filth is washed away and the sins of blood are purged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
