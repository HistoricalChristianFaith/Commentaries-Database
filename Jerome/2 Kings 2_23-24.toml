[[commentary]]
quote='''
So then, who is this Korah? He is the one who was going up from Jericho to Bethel. Bethel, "the house of God." Note this carefully. Whoever is in Jericho, and wishes to go to the house of God, must go up. Therefore our Korah went up from Jericho — that is, Elisha — to the house of God, Bethel; and there come out from Bethel, that is, from the house of God, that is, from the synagogue, where formerly there had been the house of God, there come out forty-two boys, and they mock Elisha, our Korah, and say, "Go up, baldhead, go up, baldhead." He comes to his own house, and is mocked by the little children of Bethel. But that most patient Elisha, who had come to Bethel for this very purpose, to save it, at length turned round upon them: he turned round, and gave orders that two bears should come out of the wood, and they killed forty-two boys. So too our Lord, that is, our Korah, when He had come to Bethel and wished to go up, mocked by the little ones, gives orders that two bears come out — that is, Vespasian and Titus — and they killed forty-two boys. Who are these forty-two boys? From the ascension of Christ up to the overthrow of Jerusalem there are forty-two years. Look carefully, and you will find it so. And so He gave them room for repentance for forty-two years, even after His resurrection, when He went up to Bethel. But because they kept mocking, "Go up, baldhead, go up, baldhead," the two bears came out and killed them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_017.html'
source_title="Homily 17, on Psalm 84"
