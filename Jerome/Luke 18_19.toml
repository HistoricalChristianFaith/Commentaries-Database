[[commentary]]
quote='''
Why do you ask me about the good? One is good, God. Because he had called him a good teacher and had not confessed him God or the Son of God, he learns that a man, however holy, is not good in comparison with God, of whom it is said: Confess to the Lord, for he is good. But lest anyone think that, in God's being called good, the Son of God is excluded from goodness, let us read in another place: The good shepherd lays down his life for his sheep; and in the prophet, a good spirit and a good land. So the Savior too did not refuse the testimony to his goodness, but excluded the error of a teacher apart from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
In this sense it is said also in the Gospel to him who thought the Savior to be not the Son of God but a good teacher: Why do you call me good? No one is good but the one God (Luke 18:19). And certainly we read of good ground (Luke 8), and of a good man (Matt. 12), and of a good shepherd (John 10); but no one is good according to nature but God alone. The other things obtain being called good through his goodness. Just as, therefore, he who alone is good makes others good, and he who alone is immortal bestows immortality, and he who alone is true imparts the name of truth, so too he who alone is Father, because he is the Creator of all and the cause of the substance of all things, grants to the others that they be called fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
