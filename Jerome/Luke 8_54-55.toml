[[commentary]]
quote='''
And he took her by the hand, and the girl arose. Unless the hands of the Jews, which are full of blood, are first cleansed, their dead synagogue does not rise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
