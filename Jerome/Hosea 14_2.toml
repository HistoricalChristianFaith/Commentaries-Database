[[commentary]]
quote='''
Take, he says, words with you, that is, prayers and the confession of sins, and return to the Lord as much by words as by works; and say to him: Take away all iniquity, leave in us nothing of our sickness and of our former ruin, lest the revived seedlings of an evil seed sprout again; and receive, he says, the good. For unless you take away our evils, we cannot have a good to offer you, according to what is written elsewhere: Turn away from evil and do good; and we will render, he says, the calves of our lips. For the calves, which in Hebrew are called pharim, the Seventy translated fruit, which is called pheri, through the likeness of a deceptive word. But the calves of the lips are praises to God and thanksgiving: For a sacrifice to God is a troubled spirit. Therefore, fleshly victims being already rejected at that time, the offering acceptable to God is pure confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
