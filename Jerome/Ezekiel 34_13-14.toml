[[commentary]]
quote='''
Then they are led out from the lands, so as to be brought into their own land, which is the land of the living, and so that he himself may feed them on the mountains of Israel — of which David speaks: I lifted up my eyes to the mountains, whence help will come to me —, and not only on the mountains, but by the streams and in all the dwelling places of the land, in the richest pastures and on the high mountain — of which Isaiah and Micah prophesy more fully —, or on the high mountains, Israel; there they will rest in green grass — and they will say: The Lord feeds me, and nothing will be lacking to me: in a place of pasture, there he has set me; beside the water of refreshment he has brought me up —, and they will feed in the fattest pastures upon the mountains of Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
