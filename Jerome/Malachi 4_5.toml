[[commentary]]
quote='''
There are those who think that John is called Elijah for this reason: that, as at the second coming of the Savior, according to Malachi, Elijah is to go before and announce the judge who is to come, so John did at the first coming, and each is a messenger, either of the first coming of the Lord or of the second.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
