[[commentary]]
quote='''
For what had before been deserted, and had fallen into solitudes and ruins, will, at the coming of the Gospel of Christ, be restored, and will have so great a multitude of inhabitants that it cannot hold them. Provided only that the persecutors be chased far away, or those of whom we spoke above: Those who destroyed you and scattered you shall go forth from you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
