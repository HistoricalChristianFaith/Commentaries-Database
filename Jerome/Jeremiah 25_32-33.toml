[[commentary]]
quote='''
Thus says the Lord of hosts: Behold, affliction — or evil — shall go forth from nation to nation, and a great whirlwind — or tempest — shall go forth from the heights — or the ends — of the earth. And the slain of the Lord — or those wounded by the Lord — shall be on that day from the height of the earth to its height; they shall not be lamented, and they shall not be gathered up nor buried; they shall lie as dung upon the face of the earth. Let them blush who try to do violence to holy Scripture by expounding in a good sense things that are full of threatening. Now of this passage I think the Lord too spoke: nation will rise against nation and kingdom against kingdom, and the rest that is contained in that same saying of the Gospel. And let us understand that these things were done according to the history, when all the nations round about were subjugated by the Babylonian king and felt his cruel rule, or according to prophecy, as things that are to come long afterward at the consummation of the world. And they are called slain by the Lord, not because the Lord himself strikes them, but in that in the destruction of the most wicked the will and command of the Lord is fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
