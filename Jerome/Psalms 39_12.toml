[[commentary]]
quote='''
For the prophet says in another place: "I am a sojourner on earth and a pilgrim, like all my fathers." And this he was saying in Judea, that is, in his own homeland: and how does he say he is a pilgrim? But it is because the saints in the present age are pilgrims on earth, desiring to possess nothing earthly, whose whole possession is in heaven, where one has dwellings, where one has "the city whose maker and founder is God." And therefore the prophet too, who is not of this world, says he is a pilgrim here, and by the will of his mind he hastens to his homeland, that is, to paradise, to the kingdoms of the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
