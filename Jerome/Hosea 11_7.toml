[[commentary]]
quote='''
But the unhappy people and the untaught crowd will sigh for their ancient homeland and will feel themselves to be captive, or will hang in suspense in their sojourning, not knowing what to do and ignorant where to turn. And God is angry over their precious things, namely the gold and silver which they had received from him, of which we have often spoken, and he will by no means set free him who has fallen by his own fault. This according to the LXX; and we will fit the same sense to the Hebrew as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
