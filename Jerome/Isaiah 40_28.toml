[[commentary]]
quote='''
To them God answered: Do you not know, and have the words of the preceding Scriptures not taught you? or, according to the Seventy, are you ignorant, because you have not heard, that the eternal God and Creator of all, the Lord, knows all things, holds all things together, and orders all things by his majesty? Nor does he ever fail or labor, so that he should not understand your judgment, and your ways should be hidden from him. Nor is there, he says, any searching out of his wisdom; from which place I think that saying of the Apostle was taken: Incomprehensible are his judgments, and unsearchable his ways (Rom 11:33); or, as the Seventy translated, he will not hunger, and he will not labor. For where there is food, there is often hunger, if you take the food away; and where there is hunger, there is also labor. But since these things are not in God, why do you attach human passions to him?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
