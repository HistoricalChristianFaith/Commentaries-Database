[[commentary]]
quote='''
The question is raised in this place, if whoever is led by the spirit is not under the Law, whether Moses and the prophets were both driven by the spirit and lived under the Law, which the Apostle denies; or, having the spirit, were not under the Law, which the Apostle here affirms; or, which is the third possibility, living under the Law, did not have the spirit, which it is impious to believe of such great men. To this we shall answer briefly: it is not the same thing to be under the Law and to be as if under the Law, just as it is not the very same thing to be in the likeness of the flesh of sin and to be in the flesh of sin. Nor does a true serpent mean the same as the likeness of a bronze serpent, which Moses hung up in the desert (Num. 21). So, therefore, the holy prophets too, and Moses, walking by the spirit and living by the spirit, lived not under the Law but as if under the Law, so that they themselves seemed indeed to be under the Law, but might gain those who were under the Law and call them forth from the lowliness of the letter to the height of the spirit. For Paul too, who became a Jew to the Jews, and all things to all, that he might gain all (1 Cor. 9), did not say "made under the Law", but "made as if under the Law", to show that he had kept not the truth of the Law but its likeness. We seem to ourselves to have solved the question proposed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
