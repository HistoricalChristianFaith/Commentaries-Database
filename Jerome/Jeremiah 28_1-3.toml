[[commentary]]
quote='''
And it came to pass in that year, in the beginning of the reign of Zedekiah, king of Judah, in the fourth year, in the fifth month, Hananiah son of Azzur, the prophet from Gibeon, said to me in the house of the Lord before the priests and all the people, saying: Thus says the Lord of hosts, the God of Israel: I have broken the yoke of the king of Babylon; yet two years of days, and I will cause all the vessels of the Lord to be brought back to this place. Those whom the Hebrew calls 'prophets', that is 'nebeim', the Seventy translated 'false prophets', in order to make the understanding plainer. Indeed, in the present passage too he is called 'prophet', that is 'nebia', and not 'false prophet'. Now the word of the Lord comes under King Zedekiah, in the fourth year of his reign and in the fifth month — while the prophet Ezekiel was not yet prophesying in Babylon to those who had gone into exile with Jeconiah — and he has the confidence to speak in the temple of the Lord against the prophet, because he promises prosperity to the people, and lies are gladly heard, especially those that promise joyful things. Jeremiah had said that the rest of the vessels too, whether of the temple or of the royal house and of the whole people, which Nebuchadnezzar had left behind, were to be carried over to Babylon; but this man, on the contrary, promises that even those which had been carried over are to be brought back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
