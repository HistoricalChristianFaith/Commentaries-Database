[[commentary]]
quote='''
And Amaziah the priest of Bethel sent to Jeroboam king of Israel, saying: Amos has rebelled against you in the midst of the house of Israel. The land will not be able to bear all his words. For thus says Amos: Jeroboam shall die by the sword, and Israel shall go captive out of his land. And Amaziah said to Amos: You who see, go, flee into the land of Judah, and eat bread there, and there you shall prophesy; and in Bethel you shall not again prophesy any more, because it is the sanctuary of the king and it is the house of the kingdom. LXX: And Amaziah sent the priests of Bethel to Jeroboam king of Israel, saying: Amos is making gatherings against you in the midst of the house of Israel; the land will not be able to bear all his words. For thus says Amos: Jeroboam shall die by the sword. But Israel shall be led captive out of his land. And Amaziah said to Amos: You who see, go out, withdraw into the land of Judah, and live there, and there you shall prophesy; but in Bethel you shall not again prophesy any more, because it is the sanctuary of the king, and the house of the kingdom. It is a proverb of Solomon, or rather a command: Do not rebuke the wicked, lest they hate you. And on the contrary he gave a precept about the good: Rebuke a wise man, and he will love you. In another place also: He who rebukes, he says, the ways of a man will have more favor than he who speaks what pleases. And so Amos too spoke to the people out of a desire for their amendment, and from the words of God threatened terrible things, so that they might repent, return to God and forsake their idols. Then the priest of Bethel, in which was the golden calf that Jeroboam the son of Nebat and the others who had succeeded him in the rule had set up, sends to Jeroboam, the grandson of Jehu, someone to report to him, saying: Amos has rebelled against you, or, is making gatherings and assemblies in the midst of your kingdom, Israel; and he says such great things that the land of your kingdom cannot bear his words. And he dares to send to the king of Israel as though he were a high priest, fearing that if the people should be converted to the worship of God, he would lose the glory of his priesthood. And though he had heard two things, the high places for idols will be demolished, or the altars of laughter, and the sanctuaries, or ceremonies, of Israel will be laid waste, and I will rise up against the house of Jeroboam with the sword, because the idols over which Amaziah the priest presided were to be utterly destroyed, and God would rise up against Jeroboam with the sword unless he repented, he sends no word about the wrong done to himself, so that he may seem to grieve only over the insult to the king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
