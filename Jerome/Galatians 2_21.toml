[[commentary]]
quote='''
I do not cast away the grace of God: for if righteousness is through the Law, then Christ died for nothing.

He casts away the grace of God, both he who after the Gospel lives in the Law and he who after baptism is defiled by sins. But he who can say, in accordance with the Apostle, "His grace in me was not void" (1 Cor. 15:10), that man also says this with confidence: I do not cast away the grace of God. And what follows is very necessary against those who think that, after faith in Christ, the precepts of the Law must be kept. For one must say to them: If righteousness is through the law, then Christ died for nothing. Or at any rate let them show how Christ did not die for nothing, if works justify. But however dull they may be, they will not dare to say that Christ died without cause. Therefore, to the part of the syllogism which is put forward here, that is, For if righteousness is through the Law, then Christ died for nothing, we must add as the assumption what follows by consequence and cannot be denied, But Christ did not die for nothing; and conclude, Therefore righteousness is not through the Law. Thus far against Peter; now he returns to the Galatians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
