[[commentary]]
quote='''
Indeed, it is written in another place: 'Come my sister, my bride.' Lest in the fact that it had said, bride, you should understand something shameful, sister is joined, so that all shameful love may be excluded. Come my sister: for the love is holy, and therefore I call you sister. And my bride: therefore I call you bride, so that I may have a wife, and from you make many sons, many sons like clusters from a vine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_042.html'
source_title="Homily 42, on Psalm 127"

[[commentary]]
quote='''
We read also in the Song of Songs: 'Come, brothers, drink and be inebriated.' And wine which gladdens the heart of man. This fleshly wine does not gladden the heart of man, but overwhelms it, and makes it mad. Indeed, it is written that those who are powerful should not drink wine. The apostle too writes that we ought not to drink wine and eat flesh. Again it is said to us: And wine gladdens the heart of man. But it speaks of a spiritual wine, which, if anyone drinks it, he is immediately inebriated. All of you, that you might let go of your possessions and your parents and your children and your kinfolk, drank wine, and being inebriated for Christ began to be mad. Does it not seem to you to be drunkenness, does it not seem to you to be spiritual madness, to despise delights, to seek out squalor, to flee the cities, to pursue the deserts, to know no affections, to ignore the nearness of the flesh, and to know Christ alone? Indeed, the apostles were inebriated with this wine, and therefore it is said of them: 'They are full of new wine.' For they had not been inebriated from the old law, but from the gospel. Noah too, I think, was inebriated in this way with this wine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_042.html'
source_title="Homily 42, on Psalm 127"
