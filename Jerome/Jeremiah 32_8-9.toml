[[commentary]]
quote='''
And I understood that it was the word of the Lord, and I bought the field from Hanamel, the son of my uncle, which is in Anathoth, and I weighed out the silver to him, seven and ten silver staters. And I wrote it in a book and sealed it and called witnesses and weighed the silver in the balance. And I took the book of possession, sealed, the stipulations and the ratifications and the seals on the outside. It was indeed hard, almost inconsistent and worthy of laughter, that he who was prophesying that Jerusalem was on the very point of being taken and that all were to be led captive or to perish by sword, famine and pestilence, should buy a field in Anathoth which he was not going to possess. 'But I understood', he says, 'that it was the word of the Lord, and that my purchase was to be fitted to the argument and prophecy of the Lord; and therefore I acquiesced in his command to buy, knowing that the word of God had not come to me in vain about a matter of this kind, and I weighed out ten and seven shekels of silver', which we have rendered as 'staters'. Now a shekel has twenty obols, as is written at the end of the book of Ezekiel. And the prophet bought it for 'ten and seven' shekels, the number in which the servant of the Lord, David, sang on the day on which the Lord delivered him from the hand of all his enemies and from the hand of Saul, and he said: I will love you, O Lord, my strength! The Lord is my firmament and my refuge and my deliverer. My God is my helper, and I will hope in him; my protector and the horn of my salvation. That 'ten' is a mystic number is shown by the decalogue, which was written on tablets of stone by the finger of God, and by the day of fasting and propitiation in the seventh month; that 'seven' too, in which the true sabbath-keeping and rest are found, is holy we prove by many testimonies of the Scriptures, of which I would have set down at least a few, were it not idle to teach what is known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
