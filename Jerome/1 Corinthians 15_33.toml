[[commentary]]
quote='''
You despise gold; someone else loves it. You spurn wealth; he eagerly pursues it. You love silence, weakness and privacy. He takes delight in talking and effrontery in the public square, and streets, and apothecary shops.… Do not remain under the same roof with him. Do not rely on your past continence. You cannot be holier than David or wiser than Solomon.… If in the course of your clerical duty you have to visit a widow or a virgin, never enter the house alone. Let your companions be persons who will not disgrace you.… You must not sit alone with a woman secretly and without witnesses. If she has anything confidential to disclose, she is sure to have some nurse or housekeeper, some virgin, some widow, some married woman. She cannot be so friendless as to have none except you to whom she can venture to confide her secrets.
'''
source_url=''
source_title="Letter 52"

[[commentary]]
quote='''
To the Corinthians too (1 Cor. 15:33), who were themselves polished with Attic eloquence and, because of the nearness of the places, seasoned with the savor of the Athenians, he took an iambic verse from a comedy of Menander: Evil conversations corrupt good morals.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
That Paul knew secular letters, though not to perfection, his own words testify: "One of them, a prophet of their own, said: Cretans are always liars, evil beasts, idle bellies" (Titus 1:12). This heroic verse is by the poet Epimenides, whom both Plato and the other ancient writers recall. Among the Athenians also, when he was making his defense in the Areopagus, he added this: "As also certain of your poets have said: For we are also his offspring" (Acts 17:28). This half-line is found in Aratus, who wrote about the heaven and the stars. And also this: "Very evil conversations corrupt good morals" (1 Cor. 15:33); it is an iambic trimeter taken from a comedy of Menander. From these and other passages it is evident that Paul was not ignorant of secular letters, and that what he here called allegory he elsewhere called spiritual understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
