[[commentary]]
quote='''
He also measured the gate which looked toward the way of the north of the outer court, as much in length as in breadth; and its cells, three on this side and three on that, and its front and its vestibule according to the measure of the former gate, its length fifty cubits, and the breadth twenty-five cubits. And its windows and its vestibule and carvings according to the measures of the gate which looked toward the east; and its ascent was of seven steps, and a vestibule before it. And the gate of the inner court opposite the gate of the north and the eastern one; and he measured from gate to gate a hundred cubits. (LXX: "And he brought me toward the north, and behold, a gate looking toward the outer court, and he measured it in length and in breadth; and its 'thee', three on this side and three on that, and the 'aeleu' and the 'aelamoth' — and what is not found in the Hebrew: — and its palms, and it was made according to the measure of the gate which looked toward the east, fifty cubits the length and the breadth twenty-five cubits. And its windows and the 'aelamoth' and its palms as in the gate which looked toward the east; and by steps they went up to it, and the 'aelamoth' within. And the gate of the inner court looking toward the gate of the north — and what is not found in the Hebrew: — as the gate which looks toward the east; and he measured the court from gate to gate, of a hundred cubits.") What the Hebrew words 'thee' and 'aeleu' and 'aelamoth' signify we have said more fully above, but in the present passage too our translation will teach it by their placing. And the man in whose hand was the cord measured the gate of the north too, of the outer court, or brought the prophet in through the gate of the north to the outer court — in which it must be considered that he is brought in first through the gate of the north, second through the gate of the south, third through the eastern gate — From the north, for, evils blaze up upon the inhabitants of the earth, and fittingly he who is an inhabitant of the earth, and not a sojourner and a stranger, lies open to the darts of him who comes from the north, whose darts are fiery, which, according to the Apostle, are quenched by the shield of faith —; and toward the north the court is called outer, but toward the midday, that is, toward the south, not outer but inner — for Scripture says: And he brought me into the inner court, to the southern gate, which is found written likewise of the eastern court too —: for the first entrance to virtue is to tread the north underfoot and, through the number fifty and twenty-five, to come to the summit of the hundred; then to be brought into the southern quarter and to drive out the cold of the north; then to come to perfect virtue, that is, to the eastern gate, in which the sun of righteousness rises and through which the high priest alone enters — and this is to be observed, that, though there are four quarters, the western gate is passed over in silence, of which it is written at the beginning of that psalm: Make a way for him who ascends over the setting: the Lord is his name, so that, after we have prepared the way for the Lord and have fulfilled what John the Baptist cries in the desert: Prepare the way of the Lord, make his paths straight, we may be able to hear what is said in the last part of the same psalm: who ascends above the heaven of heaven toward the east —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
