[[commentary]]
quote='''
The stature too and height of the wheels was so great that it caused wonder in those who saw them. And the whole body and the backs were full of light round about, so that you would see no member that did not have eyes of light — of whatever kind the fables of the poets describe Argus to have been, hundred-eyed or of many eyes, whom Juno turned into a peacock for his negligent guarding —, so that what is a marvel of God the Creator was the condemnation of an unavenged adultery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
That the whole body and the backs are full of eyes will be confirmed by anyone who sees that there is nothing in the Gospels that does not shine and illumine the world with its splendor, so that even the things thought small and lowly gleam with the majesty of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
