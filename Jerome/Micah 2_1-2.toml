[[commentary]]
quote='''
Woe to you who devise what is useless, and work evil on your beds; in the morning light they do it, for their hand is against God; and they coveted fields and took them by violence, and seized houses, and they wronged a man and his house, a man and his inheritance. Therefore thus says the Lord: Behold, I devise evil against this family, from which you shall not withdraw your necks, and you shall not walk proudly, for it is a most evil time. In that day a parable shall be taken up over you, and a song shall be sung with sweetness by those who say: We have been laid waste with devastation; the portion of my people has been changed. How will it depart from me, when he returns who divides our lands? Because of this you will have no one casting the cord of the lot in the assembly of the Lord. LXX: They have become men who devise toils and work evils on their beds, and at once in the day they will accomplish them, because they did not lift up their hands to God; and they desired fields, and plundered orphans, and oppressed houses, and seized a man and his house, a man and his inheritance. Therefore thus says the Lord: Behold, I devise evils against this tribe, from which you shall not withdraw your necks, that you may not walk upright suddenly, for it is a most evil time. In that day a parable shall be taken up over you, and a lament shall be lamented in a song of those who say: In misery we have been made miserable; the portion of my people has been measured out by the cord, and there was no one to forbid him, that he might be turned back. Our fields have been divided; because of this you will have no one casting the cord in the inheritance. What we set at the end of the section according to the Hebrew, in the assembly of the Lord, for which the Seventy translated in the Church of the Lord, is, according to the common edition, the beginning of the following section. And therefore we shall discuss it there, if the Lord commands. Woe, therefore, to you, peoples of the Jews, who both devise evil and complete it in deed. And the beds given you for rest you pollute with debaucheries, and whatever iniquity you plot at night, as if it were not permitted to put it off, you hasten to fulfill as soon as the day has dawned, not considering that your hand is strong against God. And in order that Scripture might teach what it was that they devised at night and did by day, it sets it out part by part. They coveted, he says, fields and took them by violence, and houses, it is understood, they coveted, and those which they had coveted they plundered; and not only did they wrong men and their houses, but they also laid waste with rabid mouth their descendants, who deserved mercy because of their tender age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
But this same thing can also be taken of the last captivity, that all things befell them because they crucified the Lord, yet in such a way that it is the edition of the Seventy translators that is expounded. For the glory of the daughter of Israel has been made bald and shorn over her once most delicate sons, and if any hair grew back afterwards, it was cut off in turn by another shaving and shearing. Then all their counsels were turned into toil, and what they devised, with mind and spirit asleep, brought them toils; and what they had done was thrown into confusion as soon as the light of Christ and vengeance appeared. For though they had read that Israel conquered when Moses lifted up his hands to the Lord, and was overcome by Amalek when Moses let his weary arms sink, they did not lift up their hands to the Lord, but, perpetrating every crime against the poor and the people of the Lord, they desired fields, and plundered the houses of orphans, and laid waste alike a man and his wife and his children and his substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
But if we wish to follow the third exposition, of which I spoke above, that the whole discourse is directed to the human soul, which, falling from paradise, has come into the captivity of this world, we shall see that all our thinking is toil and pain, and our beds are full of evils, and the very light that is seen is mixed with darkness, and what we plot at night we accomplish in gloom. For who of us lifts holy hands to God without anger and scheming? Who does not desire the estates of this world, forgetful of the possessions of paradise? You may see some joining field to field and boundary to boundary, and the lands of cities not sufficing for the small little body of a man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
