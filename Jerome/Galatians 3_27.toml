[[commentary]]
quote='''
For as many of you as have been baptized in Christ have put on Christ. There is neither Jew nor Greek. There is neither slave nor free. There is neither male nor female. For you are all one in Christ Jesus.

He shows how we are born sons of God through the faith which is in Christ Jesus, saying: For as many of you as have been baptized in Christ have put on Christ. That Christ is a garment, moreover, is proved not only from the present passage but also from another, where the same Paul exhorts: "Put on the Lord Jesus Christ" (Rom. 13:14). If, therefore, those who have been baptized in Christ have put on Christ, it is plain that those who have not put on Christ were not baptized in Christ. For it was to those who were thought to be believers and to have obtained the baptism of Christ that it was said: "Put on the Lord Jesus Christ". If anyone receives only the bodily washing of water, the one that is seen with the eyes of the flesh, he has not put on the Lord Jesus Christ. For Simon too, the one in the Acts of the Apostles, had received the washing of water; but because he did not have the Holy Spirit, he had not put on Christ (Acts 8). And heretics or hypocrites, and those who live sordidly, seem indeed to receive baptism, but I do not know whether they have the garment of Christ. Let us therefore take care lest perhaps someone be found among us too who, from the fact that he does not have the garment of Christ, is shown not to have been baptized in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
