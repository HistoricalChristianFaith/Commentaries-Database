[[commentary]]
quote='''
And as for what follows, He shall go up like a sapling before him, for which the Seventy translated, We announced as a little child before him: for sapling Symmachus translated branch, to show the man assumed, who came forth from the virginal womb. Of him he adds: Like a root out of a thirsty land. For thirsty Aquila translated pathless, to show the privilege of virginity: that he was created without any human seed from an earth previously untrodden. This is he of whom we read above too: A rod shall come forth from the root of Jesse, and a flower shall go up from his root (Isa 11:1), so as to signify his birth and his going up in the world. But if he had no form nor glory, but his form was ignoble and failing beyond the sons of men, or, as it stands in the Hebrew, despised and the lowest of men, how is it said in the Psalms: Gird your sword upon your thigh, O most mighty, in your beauty and comeliness (Ps 44 [45]:4)? This is easily resolved. He was despised and ignoble when he hung on the cross and, made a curse for us, bore our sins, and said to the Father: God, my God, why have you forsaken me (Matt 27:46)? But he was glorious and comely in appearance when at his passion the earth trembled, the rocks were split, and, as the sun fled, the elements feared an eternal night. Of him the bride too says in the Song of Songs: My kinsman is white and ruddy, chosen out of thousands (Song 5:10). White in the fullness and purity of his virtues, ruddy in his passion, of which we shall read later: Who is this who comes up from Edom, tawny are his garments from Bozrah; chosen out of thousands in the resurrection, so that he who was the firstborn of all creation might become the firstborn from the dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
