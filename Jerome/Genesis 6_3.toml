[[commentary]]
quote='''
[Daniel 9:2] "I, Daniel, understood by the books the number of the years concerning which the word of the Lord had come to the prophet Jeremiah, that seventy years would be accomplished for the desolation of Jerusalem." Jeremiah had predicted seventy years for the desolation of the Temple (Jeremiah 29:1-10), at the end of which the people would again return to Judaea and build the Temple and the city of Jerusalem. But this fact did not render Daniel careless, but rather encouraged him to pray that God might through his supplications fulfil that which He had graciously promised. Thus he avoided the danger that carelessness might result in pride, and pride cause offense to the Lord. Accordingly we read in Genesis that prior to the Deluge one hundred and twenty years were appointed for men to come to repentance (Genesis 6:3); and inasmuch as they refused to repent even within so long an interval of time as a hundred years, God did not wait for the remaining twenty years to be fulfilled, but brought on the punishment earlier which He had threatened for a later time. So also Jeremiah is told, on account of the hardness of the heart of the Jewish people: "Pray not for this people, for I will not hearken unto thee" (Jeremiah 7:16). Samuel also was told: "How long wilt thou mourn over Saul? I also have rejected him" (1 Samuel 16:1). And so it was with sackcloth and ashes that Daniel besought the Lord to fulfil what He had promised, not that Daniel lacked faith concerning the future, but rather he would avoid the danger that a feeling of security might produce carelessness, and carelessness produce an offense to God.
'''
source_url='https://www.ccel.org/ccel/pearse/morefathers/files/jerome_daniel_02_text.htm'
source_title="St. Jerome, Commentary on Daniel, CHAPTER NINE"


[[commentary]]
quote='''
But someone may say: How does the apostle say that "flesh and blood shall not obtain the kingdom of God"? Do you wish to know how it is written? Listen to the Lord speaking in Genesis: "My spirit shall not remain in man forever, because he is flesh." Why? For what is this? You made the flesh, and do you accuse and condemn the flesh? But what God says is this: my spirit shall not remain in these men, because they do not live according to the spirit, but according to the vices and will of the flesh. Let the apostle too give his testimony: "Whoever are in the flesh cannot please God." If all who are in the flesh cannot please God, how did Paul himself, who is speaking, please God? How did Peter or the rest of the apostles and the saints please him, whom we cannot deny to have been in the flesh? Just as the same apostle again says: "But you are not in the flesh, but in the spirit." They were in the flesh: and how does he say, You are not in the flesh? Because you do not live according to the flesh, because "our citizenship is in heaven." For we who in this age "are pilgrims away from the Lord" do indeed walk on the earth, but we hasten toward the things of heaven: because here we have no home of our own, but are strangers and pilgrims, just as all our fathers were.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_063.html'
source_title="Homily 63, on Psalm 83 (Alternate Series)"

[[commentary]]
quote='''
And the Lord God said: My spirit shall not remain in these men for ever, because they are flesh. In the Hebrew it is written my spirit shall not judge these men for evermore, since they are flesh: that is, because the condition in man is frail, I will not keep them for eternal torments, but here I will pay them back what they deserve. Therefore it bespeaks not the severity of God, as is read in our copies, but his clemency, while the sinner is visited here for his crime. Hence God also, in anger, speaks to certain people: I will not visit their daughters when they have committed fornication, nor their brides when they have committed adultery. And in another place: I will visit their iniquities with a rod and their sins with scourges; but my mercy I will not take away from them.

Furthermore, lest he should seem cruel in this, that he had not given sinners room for repentance, he added [Gen 6:3] but their days shall be a hundred and twenty years, that is, they will have a hundred and twenty years for doing repentance. So it is not human life, as many mistakenly think, that was contracted to a hundred and twenty years, but a hundred and twenty years were given to that generation for repentance; for indeed we find that after the flood Abraham lived a hundred and seventy-five years, and the others more than two hundred and three hundred years. But because they scorned to do repentance, God would not wait for the decreed time; instead, cutting off a span of twenty years, he brought on the flood in the hundredth year of the time appointed for doing repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
