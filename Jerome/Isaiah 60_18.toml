[[commentary]]
quote='''
But instead of all these, he says, salvation will occupy your walls, or the Savior, which in the Hebrew reads JESUS, which properly sounds as the name of the Lord. For he himself is the strength of the walls of the Church, which has her gates in the praise of the Lord, so that those who enter her may first learn to praise the Lord and to confess his name. But as for the Seventy having translated γλύμμα, that is, carving, instead of praise, we can say this: that the gates of the Church, through which we enter her, ought to be engraved with all the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
