[[commentary]]
quote='''
There is need, therefore, of the lifting up of the eyes and of spiritual understanding, that we may see the opposing powers which have lifted up their horn against us, and of which the Apostle speaks: Our wrestling is not against flesh and blood, but against principalities, against powers, against the rulers of this world, of this darkness, against the spiritual forces of wickedness in the heavenly places. These four adversaries, who were always fighting against the saints, Christ crushed at his coming. And of these the psalmist says over again: You shall walk upon the asp and the basilisk, and you shall trample the lion and the dragon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
For we have no wrestling against blood and flesh, but against principalities, against powers, against the world-rulers of this darkness, against the spiritual forces of wickedness in the heavenly places.

I do not think that Paul, writing to the Corinthians, could have said, You have no wrestling against flesh and blood, since to them he says: Let no temptation take hold of you but what is human. But God is faithful, who will not permit you to be tempted beyond what you are able (1 Cor. 10:13). For I consider that the contests against flesh and blood are those which are there called human temptations, when the flesh lusts against the spirit and provokes us to do its works, fornication, impurity, luxury, idolatry, enmities, contentions, emulations, angers, quarrels, dissensions, heresies, plots, drunkenness, carousings (Gal. 5), and other things like these. But it is not a human temptation, nor a fight against flesh and blood, when either Satan himself, transformed into an Angel of light, strives to persuade us to think him an Angel of light, or does something like these things, in all power, with lying signs and portents, in all deception of iniquity. For when the enemy has ensnared someone so that the man receives him and speaks in him, Thus says the Lord, it is not as flesh and blood that he deceives him, nor as a human temptation, but as principality and power, ruler of darkness and spiritual wickedness (Eph. 4). Therefore let us not give place to the devil; but even if the spirit of one who has power should rise up against us, according to what is written, let us give him no place (Eccles. 10:4). Someone may say that what he says, We have no wrestling against blood and flesh, but against principalities and powers, and the rest that follows, is said so that we may be taught that not even those vices which we think are supplied to us by the flesh belong to the flesh or the blood, but that they are suggested by certain spiritual forces of wickedness. For there are certain demons who serve loves and love songs, as the Prophet too records, saying: They have been led astray by a spirit of fornication (Hos. 4:12). For they are also said to have certain barbarous names, as those whom the common people truly call sorcerers have often confessed, and incantations, and prayers, and various colors, and different kinds either of metals or of foods, at which the demons, when invoked, are said to be present and to capture unhappy souls. Others, again, are said to stir up angers and rages and wars; others to preside over enmities and to incite hatreds among men. Because, then, they say, the Apostle wishes to teach us that these kinds of vices are not produced from the nature of the body and from the matter of flesh and blood, but at the prompting of demons, therefore he says: We have no wrestling against blood and flesh, but against principalities and powers, and the rest. Now we have brought forward into the open the examples of those unhappy men who serve the magic arts and are said to do these things, for this reason: to blunt the opinion of those who think that all vices belong to flesh and blood, and that the demons have no power to incite us to sin. We think that Jacob's wrestling too was of this kind, namely that he did not contend against flesh and blood (Gen. 32), when he remained alone, and a man wrestled with him, helping him and strengthening him against another, who was fighting with excessive sweat. And at the same time see whether those may not perhaps be ridiculous who suppose that Jacob wrestled the whole night in the manner of wrestlers. For what great thing is it if, as they say, in wrestling he either won or was beaten? But according to a struggle reasonable and fitting for the patriarch, we must believe that his wrestling was such as those have who could say: We have no wrestling against flesh and blood. There is no need now to shake out the whole mystery of that passage, since it must be discussed more fully in its own place, if I live. But we ask (see the Hebrew Questions on Genesis) where in the Old Testament Paul read these things, or by what authority he published things that are not written at all. And we conjecture that from the things written about battles and single combat (for example, David against Goliath, and the sons of Israel against foreigners and the other nations) in the Law, and in Joshua, and in the book of Judges, and of Kingdoms, and of Paralipomenon, the Apostle understood more deeply (1 Sam. 17); and that from the fleshly war, in which the combatants were defeated or prevailed, he perceived a spiritual war; and that the satraps of each place were indications of the powers above, while the kings of the individual nations were images of those who are now called rulers of the world and of darkness, and the wicked men showed forth the spiritual forces of wickedness in the heavenly places. And the Apostle seems to us to be saying this in other words: O Ephesians, what you read about the battles of Israel against the nations seems indeed to speak of flesh or blood, for example, of the Egyptians, the Edomites, the Ammonites, the Moabites and the other nations; but if you truly wish to know, recognize that all those things happened to them figuratively (1 Cor. 10). And they were written for our sake, upon whom the ends of the ages have run down, so that we may understand from them that our fight is not against flesh and blood, but against certain spiritual and invisible powers, against the rulers of that darkness which broods over this world and puts in men's way the error of unbelief, and against the spiritual forces of wickedness which dwell in the heavenly places: not that demons dwell in the heavenly places, but because the air above us has received this name. Hence the birds too which fly through the air are said to be the birds of heaven. For in another place too the Apostle says of the demons that they roam in this air: In which you once walked according to the age of this world, according to the prince of the power of the air, the spirit that now works in the sons of unbelief (Eph. 2:2). Now this is the opinion of all the teachers, that this air, which divides heaven and earth in the middle and is called the void, is full of opposing forces. After this we must consider from whom the principalities, and powers, and rulers of the darkness of the world, and spiritual forces of wickedness in the heavenly places received the power to be what they are. And indeed another may say that the apostate devil entrusted different offices to his attendants, and that God is not the author of these distributions. To him the careful reader can object this: and how is it written, For there is no power except from God (Rom. 13:1)? But if this is said of men, how much more of those who are of a subtler and better nature? Nor would one who holds this at once incur the charge of blasphemy, since each has been allotted different ministries according to his own will. For just as in cities we see those who have committed some crime either feeding wild beasts, or cutting marble, or cleaning out the filth of the sewers, or put in charge of gladiators and assigned to the shedding of the blood of the condemned; so the demons too, from the freedom of their own choice, have been allotted the province of snares, frauds, crimes and perjury, and the rest of the vices, so that they are rulers of darkness, because they did not wish to be princes of light. These rulers, then, of the world and of darkness, when, wrestling against someone, they have tripped him up and made him fall, at once bind him to their own world and to their own darkness, over which they rule. For this reason we must labor the more strongly, that we who have once heard: I have chosen you out of this world; you are no longer of this world; for if you were of the world, the world would love what was its own (John 15:19), may not return to the world nor be subjected to it; but let the world be crucified to us, and we to it, so that Jesus, the ruler of light, may join us to his own world and bring us under the Father's dominion, rescued from the power of spiritual wickedness and from their heaven, which is to pass away and cannot be called the seat of God. For it is impious that the spiritual forces of wickedness in the heavenly places should be believed to hold that heaven of which God speaks: Heaven is my throne (Isa. 66:1). Therefore he who understands how many things happen in this world, both when we are present and when we are absent, while we cannot see them, whether because of this frail and earthly body of our humility in which the soul is wrapped, or because a subtler nature is not laid open to fleshly eyes: he will see what the darkness is of which the Apostle now speaks: namely, that either this whole earthly life is called darkness (for the light shines in the darkness, and the darkness did not comprehend it (John 1:5), or that the earthly body, the body of death and of humility, overshadows, covers and blinds the light and the sense of the soul. But let us know that, except for the present passage, we have never read κοσμοκράτορας, that is, world-rulers, in either the Old or the New Testament: a name which the apostle Paul coined for this reason, because, in arguing with the Ephesians, he had to fit new names to new and invisible things. Further, on account of his saying in the heavenly places, since it seems ambiguous, it must be said that it can be understood with all of them, so that the sense is: We have no wrestling against powers in the heavenly places, and against rulers of this darkness in the heavenly places, and against spiritual forces of wickedness in the heavenly places; and not only against the spiritual forces of wickedness in the heavenly places. Especially if we understand (as has already been explained above) how the heavenly places are so named on account of the birds of heaven, and how it is said in common usage that the rain comes from heaven: not that the rain comes out of heaven. For the philosophers say that the clouds, from which the rains pour down and the shower sprinkles, are no more than two thousand paces distant from the earth. In this sense too the floodgates of heaven are said to have been opened in the flood. Yet the worse a person is, the nearer he will be to the places of the earth and to a denser substance. For both the earth and the air that surrounds us have their own density. Some say that souls too, set free from bodies, if they have been refined in the present life and worn down into a subtle body by the file, so to speak, of ἀσκήσεως (ascetic training) and of the virtues, will not dwell in the denser places, but will be near to God, who is incorporeal. But if they are such that it could be said of them: Sons of men, how long heavy, or fat of heart (Ps. 4:3), they are dragged down to the lowest places according to the weight of their grossness, and are weighed down by their density. After this, that question too must equally be discussed, whether there is some place denser than this earth and air, which most call the underworld (Infernus), in which those who are called the beings below (inferi) dwell. But who these are, and what kinship or difference they have with those who are called the spiritual forces of wickedness in the heavenly places, is not a matter to discuss at the present time. It remains that we learn more clearly, from two battle lines in the Apostle, what the difference is between the wrestling of flesh and blood and the rulers of this darkness and the spiritual forces of wickedness in the heavenly places. For when he wishes to point out human temptations, that is, the wrestling of flesh and blood, he speaks disdaining and despising them: Who will separate us from the love of God: tribulation, or distress, or persecution, or famine and nakedness, and peril, and sword? As it is written (Ps. 43:22): For your sake we are put to death all the day long, we are accounted as sheep for slaughter. But in all these things we overcome, because of him who loved us (Rom. 8:35, 36). But when he wishes to teach us about the adverse powers, and the rulers of darkness, and the spiritual forces of wickedness in the heavenly places, he makes a beginning as if from another head, and says: For I am sure that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor strength, nor height, nor depth, nor any other creature will be able to separate us from the love of God, which is in Christ Jesus our Lord. This chapter has perhaps been discussed at greater length than the reader would have wished; but I beg him to pardon the difficulty of the passage itself and the character of the Ephesians, who after their magic arts ought to have known by whom they had once been deceived.
'''
