[[commentary]]
quote='''
Behold, days are coming, says the Lord, and I will strike — or I will dispose — for the house of Israel and the house of Judah a new covenant — or testament — not according to the covenant — or testament — which I made with your fathers on the day when I took their hand to lead them out of the land of Egypt, a covenant — or testament — which they made void; and I ruled over them — or I neglected them —, says the Lord. And this will be the covenant — or testament — which I will strike with the house of Israel after those days, says the Lord: I will put my law in their inward parts — or in the mind — and in their heart I will write it, and I will be to them for God and they shall be to me for a people. And they shall no longer teach, each one his neighbor and each one his brother, saying: know the Lord, for all shall know me, from the least of them to the greatest, says the Lord, for I will be propitious to their iniquity and of their sin I will be mindful no more. The apostle Paul — or whoever else wrote the epistle — used this testimony to the Hebrews, and all churchmen after him say that all things were fulfilled at the first coming of the Savior, and that the New Testament, that is, the Gospel, succeeded to the Old Testament, and that from it the law of the letter has been exchanged for the law of the spirit, so that all the sacrifices too, and circumcision, and the sabbath, might be fulfilled spiritually. But that we put 'pactum' [covenant] for 'testamento' [testament] belongs to the Hebrew truth, although a testament too is rightly called a covenant, because in it is contained the will and the attestation of those who enter into a covenant. When Israel was led out of the land of Egypt, so great was God's familiarity with that people that he says he took it by the hand and gave a covenant, which they made void; and therefore the Lord neglected them. But now in the Gospel, after the cross, the resurrection and the ascension, he promises that he gives a covenant not on tablets of stone, but on fleshly tablets of the heart, and that, when the testament of the Lord has been written in the mind of believers, he himself is to them for God and they are to him for a people, so that they do not at all seek Jewish teachers and the traditions and commandments of men, but are taught by the Holy Spirit, if only they deserve to hear: you are the temple of God and the Spirit of God dwells in you. The Spirit, however, breathes where he wills, and has diverse graces, and the knowledge of the one God is the possession of all the virtues. 'And this', he says, 'will come about because I will be propitious to their iniquity and their sin I will remember no more.' From this it is clear that, according to the understanding of this perikopēs [passage], the foregoing is to be understood of the first coming of the Savior, when both peoples, Israel and Judah, were joined to each other. But if it raises a scruple for anyone why he said: I will dispose for the house of Israel and the house of Judah a new covenant — or testament — not according to the covenant which I made with your fathers, let him understand that the first Church of Christ was from the Jews, and that the Lord Savior came to them and said: I have not come except to the lost sheep of the house of Israel, and that the apostles confirmed this very thing: it was necessary that the word of God be spoken first to you; but since you reject it and judge yourselves unworthy of eternal life, behold, we turn to the nations. For it was not right to give the children's bread to dogs; but because the sons were unwilling to receive the father coming into his own, he gave to all the power that those who received him should become sons of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
