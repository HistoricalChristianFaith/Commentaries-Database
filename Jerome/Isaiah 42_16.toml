[[commentary]]
quote='''
And I will lead the blind by the way which before they did not know, of whom we also read above: I have given you as a covenant of the people, as a light of the nations, that you might open the eyes of the blind. These will be led by the way of which Christ speaks: I am the way, or by the way of the knowledge of God; and I will make them walk by the paths of the Prophets. Then their darkness will be changed into light, and crooked things will be turned into straight, so that they may understand what they read, and with the eyes of the heart behold the clear light of Christ in the Old Testament. And at the same time he adds: These words which I have done, or I will do for them: no longer promising things to come, but rendering what I had promised before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
