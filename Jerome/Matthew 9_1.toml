[[commentary]]
quote='''
Or; This city may be no other than Nazareth, whence He was called a Nazarene.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he came into his own city. And behold, they were bringing to him a paralytic lying on a bed. And Jesus, seeing their faith, said to the paralytic: Take heart, son, your sins are remitted to you, and the rest. Let us understand his city to be none other than Nazareth; whence he was also called a nazarene.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
