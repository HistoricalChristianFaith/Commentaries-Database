[[commentary]]
quote='''
These horns winnowed and scattered Judah almost man by man, so that none of them, pressed down by the heavy weight of evils, lifted up his head. The four smiths too, or craftsmen, whom the Greeks call τέκτονας, the prophet does not behold by himself, but the Lord shows them to him, and explains who the smiths and craftsmen are, whom we understand as angels obedient to the Lord's power, so that what the nations had destroyed, these may build. Now this, for which we translated from the Hebrew: These came to terrify them, namely the kingdoms, the Seventy translated: These came to sharpen them, in their hands. But sharpening them is to be taken for terrifying them. Or else they terrify, so that all may submit their necks under the yoke of Christ, and not, as someone has interpreted: when they have been sharpened, let them become worse. For if the angels come for this, to make the wicked worse, they are not to be called smiths, that is, destroyers of evils and builders of good things; but they too are to be taken as wicked and as destroyers. And this is to be noted, that these four horns of the nations lifted up one horn against the people of God; for they did not reign together and oppress Israel at the same time, but succeeded one another: the Medes and Persians the Babylonians, the kingdom of the Macedonians the kingdom of the Persians, the empire of the Romans the kingdom of the Macedonians. These things we have said following the order of the history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Against these, four smiths and, so to speak, physicians and good craftsmen are not seen by the prophet, for he could not yet see them by himself without God's showing them, but they are shown to him by the Lord: namely the four virtues, prudence, justice, fortitude, temperance, of which Tully disputes most fully in the books On Duties, writing also a book of its own on the four virtues. Those, then, who destroy vices and build virtues, and all the saints who, possessing these remedies, are ever restoring the Church, are to be called smiths. Hence the Apostle too said: As a wise architect I have laid the foundation. And the Lord in his anger says that he will take away from Jerusalem the architect and the wise man. And the Lord himself, the Son of God Almighty and of the Creator of all things, is called the son of a smith. We have read in someone's commentaries that the four smiths are understood as the four evangelists, who restore to its former seat the oppressed Israel, that is, the mind that sees God, and Judah, who confesses the Lord, and Jerusalem, the vision of peace; and those whom the nations of the vices had scattered from the Church, they have drawn back to salvation through the preaching of the gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
