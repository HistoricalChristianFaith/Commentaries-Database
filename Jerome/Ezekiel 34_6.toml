[[commentary]]
quote='''
And they are scattered, and they wander on all the mountains, who are lifted up against the knowledge of God, and on every high hill, who through heretical pride despise the simplicity of the Church, and they are scattered over the whole face of the earth, seeking earthly things, not heavenly: And there was none who would seek, nor who would bring back, because, occupied with their pleasures, they do not care about the losses of the Lord's flock.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
