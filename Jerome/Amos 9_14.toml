[[commentary]]
quote='''
Then, if anyone is a captive through unbelief, and has not yet believed in the name of the Lord, and is of the remnant of Israel, once his people, he will return to the faith of Christ, so that what he had heard in the prophets he may hold in the Gospel. And these mountains which will drip sweetness, and the hills which have been planted, after the Lord has turned back the captivity of his people Israel, will build cities that were before deserted, and will dwell in them, so that each city that has been built may say: I am a strong city, a city that is besieged, and the one of which the Lord speaks in the Gospel: A city set upon a mountain cannot be hidden. And in the psalms it is said: The rush of the river makes glad the city of God. They will also plant vineyards with Noah, and drink their wine, and be drunk, and they will hear from the Lord Savior: Drink, my friends, and be drunk. And they will drink the wine which he promised he would drink new with his apostles in the kingdom of the Father. This is the vineyard of Sorek, whose wine we drink daily in the mysteries: Not content with the happiness of these things, they will make gardens for their delight, and will water them, so that no kind of virtue may be lacking in them, they will eat their fruits; for he who has planted and watered will himself also eat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
