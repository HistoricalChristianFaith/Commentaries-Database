[[commentary]]
quote='''
But after he has cleansed the people of believers from among the Jews from their iniquities, and caused the cities of the Church to be inhabited, and restored the ruined places which had fallen in the synagogues, and the land of confession has been tilled with the ceremonies of God, which once seemed desolate to all the saints who pass by the works of earthly conduct, then all will say: 'How is it that the land of Judea, which had once been untilled, now has the likeness of the paradise of God, and the cities of Judea, which had been deserted and forsaken and undermined by their own unbelief, are now raised up and fortified in the confession and the name of the Lord Savior?'; so that every creature, and the multitudes of angels that encircle the land of Israel, may know that the Lord has built the scattered cities and planted the untilled regions, and has fulfilled in deed what he promised through the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
