[[commentary]]
quote='''
And since the same wound is to reach Jerusalem — for she too sinned with a like error, forsaking her God and fashioning idols —, for that reason the prophet makes as it were a προσωποποιίαν (personification) of God, and under his own person brings in the feeling of one who laments, and says: For this I will lament and howl, I will go stripped and naked; for I have lost the ten tribes, and I will make a lamentation like that of the dragons, and a mourning like that of the ostriches. For just as dragons resound with a terrible hissing, according to the accounts of those who have written on natural things, at the time when they are overcome by elephants, and as ostriches are forgetful of their eggs and, as though they had not given birth, leave their young in the sand to be trampled by the feet of beasts, of which it is written more fully in Job, so I too shall go about without children, stripped and naked. And I will do this because her wound is desperate, that is, Samaria's. And the same sin, or rather the same punishment of sin, which had overthrown Samaria, will come even to Judah and even to the gate of my city Jerusalem. For as Samaria was overthrown by the Assyrians, so Judah and Jerusalem will be overthrown by the Chaldeans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
