[[commentary]]
quote='''
If we wish to know the form of the free man in Jesus, and the face of the truth, let us go up with him onto the mountain, let us see him transfigured: where his garments too, that is, the Scriptures which announce him, are changed, and Moses also and Elijah, that is, the Law and the Prophets, are seen in glory (Matt. 17). As long as the Lord does not change the form of a slave and does not go up onto the mountain, the Law remains in filth and the Prophets in squalor. When he has climbed to the higher places, and has willed to change his garments, and the understanding, from being a slave, has become bright and free, then the faces and the garments of Moses and Elijah too are changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
