[[commentary]]
quote='''
And because you are such, therefore today you fall, that is, you are led into captivity, and you lose the kingdom of Israel. Now as for his saying: today, it either signifies the present time, or that you will be led into captivity not by fraud and ambush but in broad daylight; and so great will be your weakness that even the prophets, who used to prophesy a lie to you, will fall with you and experience captivity. Here we ought to understand by the prophets either the false prophets, or at least every prophetic grace. For as long as the ten tribes had not been taken captive, they had both the prophet Elijah and Elisha, and the other sons of the prophets, who prophesied in Samaria. Hence also the prophet Amos, who was of the tribe of Judah and of the little village of Tekoa, is compelled to return to his own country, so as not to prophesy in a foreign kingdom and in Samaria.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
