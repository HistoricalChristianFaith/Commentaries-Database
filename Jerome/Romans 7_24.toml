[[commentary]]
quote='''
Paul uses the term "the body of death" because the body is subject to vices and sickness, disorders and death until it rises in glory with Christ, and what was once fragile clay is purified in the fire of the Holy Spirit into a very solid rock, changing its glory, not its nature.
'''
source_url='https://www.newadvent.org/fathers/27101.htm'
source_title="Against Rufinus 1.25"

[[commentary]]
quote='''
But what follows: The length of the vestibule twenty cubits and the breadth eleven cubits, seems to raise a question: how the dual number, which is referred to two decades, and the eleventh, which lacks one to fill up the sacred number twelve, can be said to be in the vestibule of the temple; which most people solve thus: although the priests are holy and placed in the ministries of the temple and daily offer victims to Christ, yet, because they dwell in this mortal and frail little body — and one which is subject to sicknesses and vices —, they have the number twenty and the eleventh — whence the apostle too said: Wretched man that I am! Who will deliver me from the body of this death?, not that we should believe, according to a most savage heresy, that bodies are to be abolished, but that it is for us to be clothed over, not stripped, and for this mortal to receive immortality and for the corruptible to put on incorruption —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
