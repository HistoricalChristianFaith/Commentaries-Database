[[commentary]]
quote='''
Otherwise; To this His exhortation to the disciple to entertain his teacher, there might a secret objection arise among the faithful; then shall we have to support the false prophets, or Judas the traitor. To this end it is that the Lord instructs them in these words, that it is not the person but the office that they should look to; and that the entertainer loses not his reward, though he whom he entertains be unworthy.

Mystically; He who receives a prophet as a prophet, and understands him speaking of things to come, he shall receive reward of that prophet. The Jews therefore, who understand the prophets carnally, do not receive the prophet's reward.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Whoever receives a prophet in the name of a prophet will receive a prophet's reward, and the rest. He who receives a prophet as a prophet and understands him as speaking of things to come, he will receive a prophet's reward. Therefore the Jews, understanding the prophets carnally, will not receive the reward of the prophets. Alternatively: in every profession darnel is mixed with the wheat. He had said before: Whoever receives you receives me, and whoever receives me receives him who sent me. He had urged the disciples to receive their teachers. The believers could have an unspoken answer: then we must also receive false prophets and Judas the traitor, and supply them with sustenance. Providing against this beforehand, the Lord says that it is not persons who are to be received but names, and that those who receive do not lose the reward, even though the one who was received was unworthy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
