[[commentary]]
quote='''
And I will destroy the cities of your land: for you did not build the city which the rush of the river of God makes glad, and which is set on the mountains, and the heavenly Jerusalem, but the one which Cain had built. Hence they are called cities of the land, built with earthly works. And I will take away, he says, all your strongholds, namely riches and the pomp of the world, and the eloquence of rhetoricians and the little snares of dialecticians, in which you trusted as in strongholds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
