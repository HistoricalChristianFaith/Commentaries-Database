[[commentary]]
quote='''
Thus says the Lord God: Behold, I lift up my hand to the nations, and to the peoples I will raise up my standard: and they shall bring your sons in their arms, and carry your daughters upon their shoulders. And kings shall be your foster fathers, and queens your nurses. With face bowed to the ground they shall worship you, and lick the dust of your feet: and you shall know that I am the Lord, in whom those who wait for him shall not be confounded. LXX: Thus said the Lord God: Behold, I raise my hand over the nations, and over the islands I will lift up my standard, and they shall bring your sons in their bosom, and carry your daughters on their shoulders. And kings shall be your foster fathers: and princesses your nurses: on the face of the earth they shall worship you, and lick the dust of your feet; and you shall know that I am the Lord, and those who wait for me shall not be confounded. To what the Church had said: I was barren and captive, who has begotten these for me? I was left destitute and alone, and these, where were they? the Lord answered: Do you wonder why these things have come about? You will by no means wonder when you hear that I have lifted up my hand to the nations. Of this hand the Saint too says: You have formed me, and laid your hand upon me (Ps 138 [139]:4). And the Savior himself: No one can snatch out of my Father's hand (John 10:29). And the Apostle Peter: Humble yourselves under the mighty hand of God, that he may exalt you in the time of visitation (1 Pet 5:6). This hand lifted up to the nations is the very one of which this same Prophet speaks here: There shall be the root of Jesse, who shall rise up to be the prince of the nations: in him the nations shall hope (Isa 11:10). And not only will he lift up his hand to the nations; but he will also raise up his standard among the peoples. There is no doubt that this is the banner of the cross, so that what is written may be fulfilled: The earth is full of his praises. And again: In all the earth his name is wonderful (Ps 8:1). Then they shall bring the sons of Zion in their arms, or in their bosom, and carry her daughters upon their shoulders. Such too was Lazarus, and all the saints who rest in the bosom of Abraham (Luke 16), and the souls of believers, to whom Paul the Apostle said: I gave you milk to drink (1 Cor 3:2). And elsewhere: My little children, with whom I am again in labor until Christ be formed in you (Gal 4:19). And in another place: As a nurse cherishes her children: so, longing for you, we desire to impart to you not only the Gospel of Christ, but also our own souls (1 Thess 2:8). Otherwise it is ridiculous, in the Jewish manner, for full-grown sons and daughters to be carried in arms and on shoulders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
