[[commentary]]
quote='''
Thus says the Lord of hosts, the God of Israel: Make good — or direct — your ways and your pursuits — or your devices — and I will dwell with you in this place or I will make you dwell in this place. The most merciful physician desires to heal the wounded with every remedy. But when he says: make good or correct your ways, he shows that they are perverse and have nothing good in them. And because it is natural that each person loves his native soil and holds nothing sweeter than his fatherland, he promises rewards to the obedient. 'I will dwell,' he says, 'with you, so that I may make you secure about your dwelling, or I will found you yourselves' — according to Symmachus — 'with a firm dwelling', who says: and I will establish you in this place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
