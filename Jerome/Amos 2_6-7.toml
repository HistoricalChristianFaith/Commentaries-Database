[[commentary]]
quote='''
But we, who have shown in Hosea that under the name of Israel, and of Samaria, and of Ephraim, and of the sons of Joseph — of which tribe was Jeroboam, who separated the people from the kingdom of David and from Jerusalem and from the temple of God — the heretics are signified, let us understand now too, after Judah and Jerusalem, which is interpreted as the Church, that the prophetic discourse is directed at the heretics, who sell a holy and righteous man, and a poor one too, for money. The poor and righteous man is the churchman who does not have knowledge of the Scriptures, but, content with simplicity, does the commandments that have been enjoined, of whom it is written: The poor man does not endure threatening. And to the Galatians: Only that we should be mindful of the poor. All these things the heretics do for riches, and for sandals, with which they tread the dust of the earth; for because they cannot stand with bare feet upon the holy ground — on which Moses stood, and Joshua the son of Nun; whence the apostles too are commanded to go with bare feet, so that they may have nothing of death and of skins, which are referred to the flesh —; therefore they strike the poor on the head. And the Savior commanded his disciples that if by chance, since they were still dwelling on the earth, anything mortal had clung to their works, they should shake the dust off their feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
