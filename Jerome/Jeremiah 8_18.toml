[[commentary]]
quote='''
My pain is above pain, within me my heart is mourning. For this, as we said above, the Seventy joined what is said to the preceding sentence, so as to put: and they shall bite you, says the Lord, incurably, with the pain of your failing heart. But in the Hebrew there is not so much 'pain', which in Greek is called odynē, as meidiama, which we can translate as the 'grimace' of a mouth contracted by pain and having the likeness of a smile. And these things are to be read Emphatikōs [emphatically] as from the person of God, lamenting the overthrow of Jerusalem and not bearing her miseries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
