[[commentary]]
quote='''
Rather, he himself gives strength to the hungry and the weary, and to those who seem to be as nothing in the world he multiplies power and might; or, according to the Seventy, he gives sorrow to those who do not grieve; for there is a sadness that leads to death, and there is a sadness that leads to life. Hence to those who have an impenitent heart he gives sadness, so that they may understand their sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
