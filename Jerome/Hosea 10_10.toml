[[commentary]]
quote='''
And at the same time the Lord promises that he will chastise and instruct them, so that, when the teachers have been overcome, their own disciples, whom they had deceived before, may be gathered against them and see the chastisement on account of the two iniquities: because they both abandoned the Church, the fountain of the Lord, and dug for themselves broken cisterns, namely the caves of the heretics, which cannot hold the waters, that is, the doctrine of the Savior and the mystery of baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
