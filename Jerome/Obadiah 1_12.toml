[[commentary]]
quote='''
Alternatively: when you see your brother taken captive by various persecutions, and led away in bonds from the faith of the Church, following not his own city but whatever is foreign, you shall by no means rejoice, because you too shall suffer the like. For you rejoiced when Jacob was being captured, and over the children of Judah, whom we understand as the disciples of Christ, you exulted on the day of their destruction. And it is signified that the soul is placed midway between vices and virtues, and can be turned to either side from one hour's moment to the next. By no means, he says, shall you magnify your mouth on the day of distress. This we ought to take according to a twofold sense: of bodily distress, in persecutions and in sins; of spiritual distress, when the soul, captured by enemies and vices, has been led into Babylon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
