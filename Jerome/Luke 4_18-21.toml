[[commentary]]
quote='''
Hence the Savior too, after he was baptized in the Jordan, when he had come to Nazareth, where he had been brought up, entered their synagogue on the sabbath day, according to custom; and when he had stood up to read, the book of the prophet Isaiah was given to him, and on opening it he found written: The Spirit of the Lord is upon me, because he has anointed me; he has sent me to preach the gospel to the poor, to preach remission to the captives and sight to the blind, to set the broken at liberty, to preach the acceptable year of the Lord. Then he rolled up the book, gave it back to the attendant, and sat down; and the eyes of all who were in the synagogue were fixed on him, and he began to say to them: Today this Scripture has been fulfilled in your ears; and all bore witness to him, and marveled at the words of grace that came forth from his mouth. If, then, the prophecy was fulfilled at that time, how do some refer what is said here to the times of the consummation? Unless perhaps we can say this: that what was then fulfilled in part is to be fulfilled more fully when the whole people of God will be righteous. For now we know in part and we prophesy in part; but when that which is perfect has come, the things that are in part will be done away (1 Cor 13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
