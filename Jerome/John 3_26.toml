[[commentary]]
quote='''
That the disciples of John were proud against the Lord and had something of a biting spirit from spite and envy, the earlier question also showed, as the evangelist relates: Then the disciples of John came to him, saying: Why do we and the Pharisees fast often, but your disciples do not fast? and elsewhere: Master, he to whom you bore witness at the Jordan, behold, his disciples baptize, and more come to him, as if they said: We are deserted, here there is scarcity, to him the crowd runs together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
