[[commentary]]
quote='''
Let none think that John's narrative contradicts this place of the Evangelist. John says that the Lord went forth from the prætorium bearing His cross; Matthew tells, that they found a man of Cyrene upon whom they laid Jesus' cross. We must suppose that as Jesus went out of the prætorium, He was bearing His cross, and that afterwards they met Simon, whom they compelled to bear it.

Figuratively, the nations take up the cross, and the foreigner by obedience bears the ignominy of the Saviour.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And going out they found a man of Cyrene named Simon; him they pressed into service to carry his cross. Let no one think that the history of John the evangelist is contrary to this passage. For he says that the Lord, going out of the praetorium, carried his own cross; but Matthew reports that they found a man of Cyrene named Simon, on whom, pressing him into service, they laid the cross of Jesus. But this is to be understood: that Jesus, going out of the praetorium, carried his cross himself, and afterwards met Simon, on whom they laid the cross to be carried. According to anagogy, however, the nations take up the cross of Jesus, and the obedient stranger carries the ignominy of the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
