[[commentary]]
quote='''
Woe to him who gives drink to his friend, putting in his gall and making him drunk, that he may look upon his nakedness. He is filled with shame instead of glory; drink, you also, and fall into a stupor. The cup of the right hand of the Lord will surround you, and the vomit of shame will be upon your glory, for the iniquity of Lebanon will cover you, and the devastation of the cattle will terrify them, because of the blood of men and the iniquity of the land, and of the city and of all who dwell in it. LXX: Woe to him who offers drink to his neighbor with a turbid overturning, and makes him drunk, that he may look into their caves; a fill of shame from glory drink, you also, and be shaken. The cup of the right hand of the Lord has surrounded you, and shame has been gathered upon your glory, for the impiety of Lebanon will cover you, and the misery of the beasts will terrify you, because of the blood of men, and the impieties of the land and of the city, and of all who dwell in it. For "with a turbid overturning", Symmachus translated: Καὶ ἀφιὼν ἀκρίτως τὸν θυμὸν ἑαυτοῦ, that is: And sending forth his fury without judgment. Theodotion: Ἀπὸ χύσεώς σου, which means: From your pouring out. The Fifth Edition: Ἐξ ἀπροσδοκήτου ἀνατροπῆς τῆς ὀργῆς σου, which signifies: From the unexpected overturning of your wrath. Aquila: Ἐξ ἐπιτρίψεως χόλου σου, which we can render: From the sending forth of your fury. In another edition I found: Ὀυαὶ τῷ ποτίζοντι τὸν ἐταῖρον αὐτοῦ ἀέλλην πετομένην, which in our language sounds: Woe to him who gives drink to his friend, a flying whirlwind. But I have also read it translated elsewhere: Woe to him who gives drink to his neighbor ἔκστασιν ὀχλουμένην, that is, turbid madness. I give this so that it may be known with how great a variety the Hebrew word maspha, which the LXX translated overturning, disagrees among all the editions. Therefore the invective is still against Nebuchadnezzar, because, forgetful of his condition, and as if not knowing that he was a man, he offered gall and bitterness to drink to another man. But we can understand him either as the king of Judea, or, generally, as all men, in that he made them drunk with evils, so that he might see the nakedness of Zedekiah and of all the captives. For this Symmachus and the Fifth Edition translated: That he might see their shames.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
But let us come to the spiritual understanding. Woe to you, devil, or Antichrist, or perverse doctrine of the heretics, who with your teachings and your turbid potion make drunk the peoples of the deceived, and overturn their former faith, giving them a potion not from Siloam, not from the Jordan, not from the springs of Israel, but from the brook Kidron, and from the river of Egypt, of which Jeremiah says: What have you to do with the way of Egypt, that you should drink the water of Gihon? For this in the Hebrew is written sior, that is, turbid and muddy; for although the rivers of Egypt are believed to go out from the paradise of the Scriptures, yet because they are trampled by the feet of Pharaoh, they have lost their splendor, and, defiled by the Egyptian mud, have been turned into torrents, at having escaped which the holy one rejoices, saying: Our soul has passed through the torrent. But if anyone should object the brook Cherith, from which Elijah drank, and another torrent, from which the Lord drank on the way, for so it is written: He will drink from the torrent on the way, this must be said: that whoever is in Egypt and on the way of this age, though he be Moses and Aaron, though he be Jeremiah and Elijah, must nevertheless drink of the temptations of Egypt and of the wilderness; hence also the Word of the Lord, who had assumed flesh for this, that he might drink from the torrent, considering his majesty, said: Father, if it is possible, let this cup pass from me. Again, seeing that he was in Egypt, and that the waters could not be cleansed unless he himself had drunk, he says: Nevertheless not as I will, but as you will. All this is said because the devil, with overturning and a turbid cup and every perverse doctrine, makes his neighbors drunk, that is, the rational animal, and makes those whom he has deceived look to his caves. For the doctrines of the Church are free; they rejoice in the day and the light. But those who are drunk are drunk at night; and those who make them drunk do not lead them into the courts of the Lord, which are weighed down by no shadow of roofs, but into caves. For they have made the house of the Father, which had been a house of prayer, caves of robbers, promising certain initiations and mysteries, and hidden secrets known only to heretics, of which Isaiah too speaks: And they will hide all things made by hand, bringing them into caves and into the clefts of the rocks and the holes of the earth. Let us not, then, enter the caves of the heretics, nor hide ourselves there, where the impious Saul was accustomed to void the excrement of his doctrines, but rather let us go up to the lofty cave of Mount Sinai, where Elijah saw the Lord, and Moses before him beheld his back parts. And Isaiah, crying out concerning the Lord: This one will dwell, he says, in a lofty cave. But if anyone does not have the turbid cup and heretical doctrine, and is a teacher of the Church, and does all things for the sake of shameful gain, and sells doves in the temple, that is, the gifts of the Holy Spirit, and in the priestly chair strangles the free birds, such a one does not indeed make the house of prayer a cave of robbers, but he makes the house of the Father a house of trade.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
