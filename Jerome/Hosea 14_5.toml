[[commentary]]
quote='''
And I will be to them like the dew; so that with my dew I may quench the Babylonian furnace and the oven of the blazing fire, I who also through the patriarch Isaac spoke to my servant Jacob: Of the dew of heaven shall your dwelling be. For just as the Lord becomes to believers light, way, truth, bread, vine, fire, shepherd, lamb, door, worm, and the rest; so for us who need his mercy, and burn with the fevers of sins, he is turned into dew, he to whom Isaiah says: For the dew that is from you is their health. And in the song of Deuteronomy Moses speaks: Let my words descend like the dew. And when the Lord has sprinkled us with his dew, and has watered the dryness of our breast with his rains, we will spring up, nay, we will flower like the lily, imitating the Lord the Savior, who says in the Song of Songs: I am the flower of the field and the lily of the valleys; and he speaks to his bride, who has no wrinkle or spot: As the lily in the midst of thorns, so is my nearest one in the midst of the daughters. And when we have grown in the Lord, we will send out our roots like the trees of Lebanon, which sink their root into the depths as far as they rise with their top into the air, so that they are shaken by no storm, but stand firm in their steady bulk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
