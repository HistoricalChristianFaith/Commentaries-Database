[[commentary]]
quote='''
Something of this kind I think Solomon too says in the Proverbs: The eye that mocks its father and despises the old age of its mother, let the ravens of the valleys dig it out, and the young eagles eat it (Prov 30:17). For as soon as the mind of the heretics has mocked the Creator, the Father, and despised the old age of the Church, its mother, it is dug out by foul and unclean birds, which are referred to the opposing powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
We read in Solomon that the eye which mocks its father and the word of its mother, let the ravens dig it out of the valleys. He did not say "the young of ravens," but the ravens themselves. For he who is a raven cannot be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"
