[[commentary]]
quote='''
But when your inhabitant has been multiplied, O mountains of Israel, then your enemies will by no means say against you that you devour men and that your possession is without children; but on the contrary you will multiply men, and your posterity will bring forth a most abundant offspring. Nor will you hear,' he says, 'any more, nor will you bear, the confusion of the nations; nor yet will you lose your nation so as ever to undergo captivity, since the Lord has spoken'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Hence the prophet is commanded to speak to the land of the meek and the land of the living, or to the mountains of Israel, and to say: 'You shall no longer suffer the reproach of the persecutors, nor will they insult your slaughtered people as sheep for the slaughter; for when peace has been restored, all reproaches will cease, nor will you bear confusion and ignominy among the various nations round about, but you will have your nation and your people, because the truth of the promise has been confirmed, since the Lord has spoken'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
