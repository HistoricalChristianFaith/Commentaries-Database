[[commentary]]
quote='''
My belly, my belly, I am in pain; the senses of my heart are troubled. I will not keep silent, for my soul has heard the sound of the trumpet, the clamor of battle. Destruction upon destruction has been called, and all the land is laid waste; suddenly my tents are laid waste, in a moment my skins. Where we, following Symmachus, have put 'are troubled', and in the Hebrew is written 'homae', the Seventy and Theodotion put maimassei, a word whose meaning I do not know to this day. Aquila, however, put ochlazei, which itself also means 'tumult'. Let this be said about the word, over which I know there is a great dispute among very many. And the voice is introduced of the prophet, and through the prophet of God speaking, that he grieves over the destruction of his people and his inner bowels are torn as a man's are, just as the Savior too grieved over the death of Lazarus and lamented Jerusalem, so as not to hide his grief in silence; and every blast of the trumpet and roar of the battles disturbs his feeling, while evils are heaped upon evils and the whole land of the two tribes is laid waste. 'While I was not expecting it,' he says, 'my tents of old and my skins were ravaged by the raging Babylonian, and my former lodgings passed into the plunder of the enemies'. And God says this same thing when he sees the tumults of sedition and discords in the Church, and the partridge crying in his assemblies, and the rest of God turned into wars. Whence it follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
