[[commentary]]
quote='''
There was also a man prophesying in the name of the Lord, Uriah, son of Shemaiah of Kiriath-jearim, and he prophesied against this city and against this land according to all the words of Jeremiah. And King Jehoiakim and all his mighty men and his princes heard these words, and the king sought to kill him; and Uriah heard and was afraid and fled and entered Egypt. And what follows: and King Jehoiakim sent men into Egypt, Elnathan, son of Achbor, and men with him into Egypt, is not found in the Seventy. Then is joined: and they brought Uriah out of Egypt and led him to King Jehoiakim; and he struck him with the sword and cast his corpse into the graves of the ignoble common people. Nevertheless the hand of Ahikam, son of Shaphan, was with Jeremiah, so that he should not be delivered into the hand of the people and they kill him. It is asked why, when Uriah, son of Shemaiah, from the town of Kiriath-jearim, had prophesied the same things as Jeremiah, and, struck with fear, fled to Egypt and, dragged back from there, was killed, Jeremiah was able to escape, who certainly had not fled, but, boldly persevering in his former statement, was freed both by the judgment of the crowd and of the princes and by the counsel of the elders against the accusers, the priests and false prophets. To this one must briefly answer that the judgment of God can by no means be known, when, in the same cause and for the same statement, one is punished and another is freed; unless perhaps we can answer this, that Uriah was slaughtered to the condemnation of both the accusers and the people, while Jeremiah was preserved by the judgment of God, so that he might preach to the remnant of the unhappy people and draw them back to repentance. This indeed we also read in the Acts of the Apostles: that the apostle James at once suffered the sentence of Herod and was crowned with martyrdom, but Peter and the other apostles were preserved for the teaching of the Lord. And the prophetic steadfastness is to be noticed, in that not even when dragged back from Egypt did Uriah change his statement, but, seeing death threatened against him, nonetheless spoke what the Lord had commanded. And that he feared and fled and entered Egypt is a sign not of unbelief but of prudence, lest we offer ourselves to dangers in vain. Otherwise we read that the Lord and Savior too slipped out of the hands of his persecutors, and that he commanded the apostles: when they persecute you in this city, flee to another!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
