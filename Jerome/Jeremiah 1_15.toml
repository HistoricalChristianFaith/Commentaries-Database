[[commentary]]
quote='''
For behold, I will call together all the families of the kingdoms of the north, says the Lord, and they shall come, and each one shall set his throne at the entrance of the gates of Jerusalem, and upon all its walls round about, and upon all the cities of Judah. And I will speak my judgments with them concerning all the wickedness of those who have forsaken me and have poured libations to foreign gods and have worshiped the work of their own hands. No one doubts that many nations, and the kings of the several nations, were subject to the Babylonian king; who, when Jerusalem was besieged, set round about, and especially at the outlets of the gates, their throne and tents, so that none of those who were shut in could break out; and that not only Jerusalem but all the cities of Judea were hemmed in by a like siege.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
