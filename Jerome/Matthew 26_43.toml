[[commentary]]
quote='''
Christ singly prays for all, as He singly suffers for all. Their eyes were heavy, i. e. an oppression and stupefaction came on as their denial drew near.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he came again and found them sleeping; for their eyes were heavy. He alone prays for all, just as he alone suffers for all. But the eyes of the apostles were growing faint and weighed down, with the denial near.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
