[[commentary]]
quote='''
When Ephraim spoke, horror seized Israel, and he sinned in Baal, and died; and now they have added to sinning, and have made for themselves a molten image of their silver, as it were the likeness of idols; the whole is the work of craftsmen; to these they themselves say: Sacrifice men, adoring calves. LXX: According to the word of Ephraim he himself received justifications in Israel, and placed them for Baal, and died; and now he has added that he might sin, and they made for themselves a molten image of their silver, after the image of idols, molten works of craftsmen; to these they themselves say: Sacrifice men, for the calves have failed. Where the LXX translated: sacrifice men, for the calves have failed, and we rendered: sacrifice men, adoring calves, Symmachus translated: sacrifice; let men adore calves; so that the sense is: Sacrifice, that is, offer sacrifice to idols, and let the pause fall up to this point; then: let men, a rational animal, adore calves, dumb living creatures. When Ephraim spoke, then, that is, Jeroboam son of Nebat of the tribe of Ephraim, horror seized Israel, that is, the ten tribes. For 'horror', which in Hebrew is called rathath, and which Symmachus and Theodotion translated 'trembling', the LXX, intending I know not what, translated δικαιώματα, that is, justifications. And so great a horror seized Israel that he sinned and offended God in Baal, and died, losing him who says: I am the life. The soul, for, that has sinned, it shall die. And the Apostle: The widow, he says, who lives in pleasures is dead while she lives. And not only did he die in Baal, but he added sins to sins, so that from the silver which the Lord had given idols were fashioned, the works of men's hands. To these they themselves say, that is, the priests and princes who ought to have taught the people good things: Sacrifice men, adoring calves; which indeed is also said in the psalms: They sacrificed their sons and their daughters to demons. Where, following Symmachus and Theodotion, we rendered 'adoring', Aquila translated καταφιλοῦντες, that is, kissing. For those who adore are accustomed to kiss their own hand; which Job denies having done, saying: If I have kissed my hand, putting it to my mouth, let this too be reckoned to me as the greatest iniquity. But if, as some would have it, the demons say to the people: Sacrifice men, for the calves have failed, the gluttony of those is shown who are fed on the blood of victims and the smoke of burnt offerings; for, when the victims fail, they desire men to be sacrificed to them, in whose not only death but also gore they delight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
