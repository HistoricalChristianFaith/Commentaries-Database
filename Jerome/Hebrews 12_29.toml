[[commentary]]
quote='''
"Our Lord is a consuming fire." A consuming fire. He did not say what it consumes: he left the understanding to us. Those who have built upon the foundation of Christ wood, hay, stubble — to them the Lord is a consuming fire. Fire has a twofold nature: it both gives light and burns. If we are sinners, it burns; if we are righteous, it gives us light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
