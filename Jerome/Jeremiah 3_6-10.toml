[[commentary]]
quote='''
And the Lord said to me in the days of King Josiah: Have you seen what averse Israel has done? She went off by herself upon every high mountain and under every leafy tree, and committed fornication there. And I said, when she had done all these things: Turn to me; and she did not return. And her sister, Judah the transgressor, saw that, because averse Israel had committed adultery, I had dismissed her and given her a bill of divorce; and the transgressor Judah, her sister, did not fear, but went and committed fornication, she too, and by the facility of her fornication she defiled the land and committed adultery with stone and wood. And in all these things her sister, Judah the transgressor, did not return to me with her whole heart, but in falsehood, says the Lord. The torments of some are the remedies of others; and when a murderer is punished, he himself indeed receives what he has done, but others are deterred from the crime. Thus, when the ten tribes, which were called Israel, had been captured by the Assyrians and carried over into Media, the two tribes, Judah and Benjamin, which ought to have feared the like and to have been turned to God with their whole mind, surpassed the crimes of the ten tribes and followed idols to such a degree that they set up a statue of Baal in the temple of God, which in Ezekiel is called the idol set up to provoke the zeal and jealousy of the Lord. Now he speaks under the figure of two sisters, because they were begotten of the one stock of Abraham and Isaac and Jacob, and he calls the first the averse one, the second the transgressor. For the former became wholly averse to God at once, when the golden calves were worshipped in Dan and Bethel; but the latter, with whom were the temple and the religion of the true God, by imitating her sister gradually withdrew from the Lord, and is therefore called the transgressor. But according to anagōgēn the prophecy concerns the heretics, who, while they imagine that they are pursuing with heretical subtlety the knowledge falsely so called, climb the mountain of pride and, beguiled by the pleasures of this flesh, display their fornication under every leafy and pleasant tree. And when they are handed over to the devil for the destruction of the flesh, it often happens that the house of 'Iuda', that is, of 'confession' and of the true faith, is by no means frightened by the example, but commits far greater things, and by the facility of its fornication defiles the land of the Church and commits adultery with stone and with wood, following those doctrines which are adverse to God. But if a man of the Church wishes to correct the one who errs, and to cut away the rotten flesh, and to draw back to repentance those who had followed falsehood, and they nonetheless, under the appearance of the Church's truth, follow their old error, it can be said of them: in all these things the transgressor Judah has not returned to me with her whole heart, but in falsehood. Now this prophecy is made in the times of Josiah, a righteous king, under whom Jeremiah also began to prophesy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
