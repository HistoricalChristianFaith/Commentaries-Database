[[commentary]]
quote='''
And to this people you shall say: Thus says the Lord: Behold, I set before you the way of life and the way of death. He who dwells in this city shall die by the sword and by famine and by plague; but he who goes out and deserts to the Chaldeans, who besiege you, shall live, and his soul shall be to him as a spoil; for I have set my face against this city for evil and not for good, says the Lord; into the hand of the king of Babylon it shall be given, and he shall burn it with fire. To those who had been sent by the king and had come to beseech the prophet to inquire of the Lord for them, he had given the answer above, and what they should report to King Zedekiah; now he urges them to answer the people, and gives counsel that they desert to the Chaldeans against the royal will; and no one is unaware that this was dangerous for the prophet. Hence he even calls down death upon himself and says: cursed be the day on which I was born, and: why did I come forth from the womb, to see labor and sorrow?; not that it is a light thing to counsel those not yet captured to hand themselves over to captivity of their own accord — as if men about to suffer shipwreck were ordered, before the shipwreck and the breaking up of the ship, to seize oars and planks and commit themselves to the waves — but that it is more tolerable to live as captives in whatever way than to be consumed by the sword, famine and plague. There are those who expound this passage according to tropology thus: that it is better to give oneself to secular studies, and above all to philosophy, than to remain in that church in which there is a famine of the word of God and the whole people dies by the sword of the heretics, by the dearth of doctrine and by the heretical plague.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
