[[commentary]]
quote='''
Weeping, Jerusalem shall weep — or weeping, it shall weep — and my eye shall shed a tear, and I cannot conceal my grief in silent groans; but the whole cause of the torments is that the flock of the Lord has been taken captive. Let us say to the Jews and to our own Judaizers, who follow only the simple and killing history: Unless you hear secretly, that is, in mystery or in darkness, which God has made his hiding place, and, according to Solomon, so as to understand a parable and a dark saying, the soul will weep, the prophet's or their own, before the face of pride, while through contumacy they resist God. Hence there will also be continual weeping and perpetual tears, because the flock of the Lord has been taken captive and corrupted by the true Nebuchadnezzar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
