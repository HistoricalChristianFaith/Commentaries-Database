[[commentary]]
quote='''
There are some who think that in the books of Kingdoms, when David numbered the people of Israel, provoking the wrath of God against himself, as Scripture says: And the wrath of God was again kindled against Israel, and it incited David, saying (2 Sam. 24:1), the wrath of the Lord signifies the devil; for, according to the idiom of the Greek language, it did not say, in the feminine gender, the wrath of God λέγουσα, that is, "she who said", but the wrath of God λέγων, that is, "he who said", in the masculine gender: since indeed the Lord sends his wrath and his fury through the worst angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
