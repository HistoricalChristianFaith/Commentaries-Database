[[commentary]]
quote='''
And the Lord your God swears by his holy one against the cows that are slaves to fattening and feasts, or he swears by his holy ones, that days shall come upon them, days of judgment and of punishments; so that, carrying them in their arms, they may put them, and those who are with them, into cauldrons, or carry them; and either the cows themselves are pestilent traders, or those who come to carry them; and they are cast out naked, seeing one another, and are cast upon mount Remmam, says the Lord God. For we must speak also according to the LXX, lest we seem to have set them out in vain. When the day of judgment and of vengeance comes against the heretics, then they will be carried away in arms, that is, with their own arms, with which they had fought against the Church, or, conquered by the armour of God and overcome by his fighters, they will be put into cauldrons, so that those who were formerly pestilent traders may be burnt and boiled through; for they traded to this end, that they might hand over to death those whom they had deceived. These are they of whom it is said: The sons of Eli, sons of pestilence, who sat in the chair of the pestilent. And when they have been boiled through and burnt, they will come out naked, having none of the things which they formerly presumed for themselves. And they will see their ignominy, and will be cast upon mount Remmam, which means loftiness, so that they may be crushed in their own pride. Some interpret Remmam as the vision of someone, that is, ὅρασίν τινὸς. For they were not able to see all things, but promised themselves the knowledge of some part, so that they are cast down in that which they believed they knew. According to the letter, we can understand that, when the days of captivity come upon the cows of Samaria, the enemies overcome them in battle and crush them with their arms, and drive them, overcome in the encounter, into fortified cities, which are compared to boiling pots; so that, as Jerusalem, holding its peoples shut in and besieged, is likened to a boiling pot full of flesh, so also the cities of Samaria are compared to boiling pots, which by famine and pestilence force the peoples shut in them to go out, and to go into captivity seeing one another, and to be transferred to Armon, the mountains of Armenia, which border on the Medes and the Persians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
