[[commentary]]
quote='''
I think that Job too, when he was speaking to his wife as to one of the foolish women, spoke of bodily riches with regard to her, who thought so: "If we have received good things from the hand of the Lord" (Job 2:10); and again, of the straits and afflictions and temptation, which bring victory: "Why should we not endure evil?" Whereas, surely, evil and good are placed not in riches and afflictions, but in virtues and vices, as the righteous man says in the psalm: "Who is the man who wants life, desires to see good days? Keep your tongue from evil, and let your lips not speak deceit. Turn away from evil, and do good" (Ps. 33:13 ff., and 36:27). Properly, evil is called that which must be avoided; good, that which we ought to do.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
