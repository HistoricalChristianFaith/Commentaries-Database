[[commentary]]
quote='''
And that we may know, they say, that this is what is meant, the following verse shows it clearly: For indeed it was carried into Assyria, a gift to the avenging king. And at once there follows: Shame will seize Ephraim, and Israel will be put to shame in his own will, or in his own counsel. For the fraud of the gilded calves, once detected, is reported to the king of Israel by letter, and the very thing by which they had thought to please is that by which they are put to shame most of all; and they offend those to whom they had sent the gifts, who think that this was accomplished not by the theft of the priests but by the fraud and counsel of the kings. We read in the book of Kings that Menahem, king of Israel, sent to Pul, king of the Assyrians, a thousand talents of silver, that his hand might be with him, that is, that he might give him help; and some think that among these the golden calves too were carried off. For Jareb in the present place Symmachus translated ὑπερμαχητῆ, that is, to the protector and defender.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
[[commentary]]
quote='''
And whatever the heretics say and compose in fine language, they send as gifts to their king, the devil, referring everything to him; whence shame will seize them for ever, and they will be put to shame in their own wills. A certain man has left it written in his commentaries, both above and in the present place, that King Jareb, that is, the avenger, is to be understood as Christ. This displeases us altogether. For it is impious that what according to the history will be understood of the Assyrian king should according to tropology be referred to Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
