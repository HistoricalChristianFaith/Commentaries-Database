[[commentary]]
quote='''
Others, however, think that the parable is not about the Gentiles and the Jews but simply about sinners and the just, the Lord himself too afterward expounding his proposition: Amen I say to you that tax collectors and harlots go before you in the kingdom of God; because those who by evil works had refused to serve God afterward received the baptism of repentance from John, while the Pharisees, who displayed righteousness and boasted that they did the law of God, having despised the baptism of John, did not do the commandments of God. Hence he says: For John came to you in the way of righteousness, and you did not believe him, but the tax collectors and harlots believed. Moreover, as to what follows: Which of the two did the father's will? and they say: the last, it must be known that the true copies have not the last but the first, so that they are condemned by their own judgment. But if we choose to read the last, the interpretation is plain: we should say that the Jews indeed understand the truth but evade it and will not say what they think, just as they would not say that the baptism of John was from heaven, though they knew it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
