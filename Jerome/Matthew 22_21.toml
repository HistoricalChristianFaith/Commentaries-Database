[[commentary]]
quote='''
They say unto Him, Cæsar's; not Augustus, but Tiberius, under whom also the Lord suffered. All the Roman Emperors were called Cæsar, from Caius Cæsar who first seized the chief power. Render therefore unto Cæsar the things which are Cæsar's; i. e. the coin, tribute, or money.

That is, tithes, first-fruits, oblation, and victims; as the Lord Himself rendered to Cæsar tribute, both for Himself and for Peter; and also rendered unto God the things that are God's in doing the will of His Father.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
They say to him: Caesar's. Then he said to them: Render therefore the things that are Caesar's to Caesar, and the things that are God's to God. Let us not think that Augustus is signified by Caesar, but Tiberius, his stepson, who had succeeded to his stepfather's place, and under whom the Lord also suffered. But all the Roman kings, from the first, Gaius Caesar, who had seized the empire, were called Caesars. Moreover, as for his saying: Render the things that are Caesar's to Caesar, that is, coin, tribute and money, and the things that are God's to God, let us understand tithes, firstfruits, oblations and victims; just as he himself both renders tributes for himself and Peter, and renders to God the things that are God's, doing the will of the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
