[[commentary]]
quote='''
The Lord had above foretold His Passion, He now foretels who is to be the traitor; thus giving him place of repentance, when he should see that his thoughts and the secret designs of his heart were known.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And as they were eating he said: Amen I say to you that one of you is going to betray me. He who had foretold his passion foretells the betrayer too, giving room for repentance, so that, when he understood that his thoughts and secret counsels were known, he might repent of his deed; and yet he does not point him out specifically, lest, being openly convicted, he should become more shameless. He casts the charge among the whole number, so that the one who is conscious of it may repent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
