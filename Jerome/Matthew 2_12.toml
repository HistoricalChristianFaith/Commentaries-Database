[[commentary]]
quote='''
They had offered gifts to the Lord, and receive a warning corresponding to it. This warning (in the Greek 'having received a response') is given not by an Angel, but by the Lord Himself, to show the high privilege granted to the merit of Joseph.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And having received an answer in sleep that they should not return to Herod, they went back by another way into their own country. Those who offered gifts to the Lord accordingly receive an answer. And the answer (which in Greek is called χρηματισθέντες) is given not through an angel but through the Lord himself, so that the privilege of Joseph's merits might be shown. And they return by another way, because they were not to be mingled with the unbelief of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
