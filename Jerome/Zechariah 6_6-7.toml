
[[commentary]]
quote='''
The one in which were the black horses, he says, went out into the land of the north. How finely the first chariot, in which were the red horses, is passed over, and what the second and the third and the fourth did is described! For already at the time when the prophet was relating these things, the kingdom of Babylon had passed away, and the power of the Medes held all Asia; under their king Darius, in his second year, in the eleventh month, which is called Shebat, on the twenty-fourth day of the month, he beholds all that we have expounded above. The one, then, in which were the black horses went out into the land of the north, so that the might of the Medes might overthrow the kingdom of the Chaldeans. And this is to be noted, that the κλίματα, that is, the quarters of the globe and of the world, are named in the holy Scriptures according to the situation of Jerusalem and of the temple. The white also went out after them: the kings of the Macedonians, following the footsteps of the Medes and Persians, to subjugate the Chaldeans and Babylon to their own rule. But the fourth, that is, the starling-colored and spotted, for which in the Hebrew is read borodim, and which by another name are called amasim, that is, strong and robust, went out toward the southern quarter, and traversed the whole earth with swift onset. And the angel who spoke in the prophet cries out to the empire of the Romans: Go, walk through the earth, and go around the circle of the lands, and lay all kingdoms beneath your feet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
