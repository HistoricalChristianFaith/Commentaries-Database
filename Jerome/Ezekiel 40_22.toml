[[commentary]]
quote='''
And what is added: And the windows and the vestibules and the carvings (or, as the Seventy have handed down, the palms) were according to the measure of the gate which looked toward the east, indicates this spiritually: that whoever, placed at the entrance of the virtues, has entered the three and three cells and has recognized the front and the vestibule of the measure of the former gate, may also come to those things, and behold those, which he is going to receive most fully in the eastern gate. Further, what follows: And its ascent was of seven steps, and a vestibule before it (or within), has this sense: that through the seven steps of the week, and of the pot which is kindled from the face of the north, and of the ceremonies of the Jews, to whom God gave precepts that were not good and ordinances in which they should not live in them, we climb to higher things and to its vestibule, that is, the vestibule of the gate, in place of which the Seventy translated 'aelamoth', which vestibule is before the gate, or within.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
