[[commentary]]
quote='''
Or else God himself is the witness and performer of his own words, and so is his child and servant whom he has chosen. There is no doubt that he means Christ, to whom he says also above: It is a great thing for you to be called my child. And all these things will take place so that the truth may be preached to the world, and that those whose mind was before brutish and senseless may know and believe and understand that besides the one God there is no other God, neither before nor after. For the founder of the times never has a beginning, since this very word, ever, belongs to time. And as he has now said, I am a witness, says the Lord God, and the child whom I have chosen, the Lord saying this same thing in the Gospel: The testimony of two men is true. I am he who bears witness of myself, and the Father who sent me (John 8:17-18), so too we must think of his divinity: that there is no God but he who speaks and his child whom he has chosen. And beautifully, besides God the Father there is no other God, because Christ is the power of God and the wisdom of God (1 Cor 1), who says in the Gospel: I am in the Father, and the Father is in me (John 14:11). For as the one Lord Christ does not take from the Father his being Lord, so the one God the Father does not take from the Son his being God, he who in the beginning was the Word, and the Word was with God, and the Word was God; he was in the beginning with God (John 1:1-2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
And according to what he commands in another place: Be my witnesses, and I am a witness, says the Lord God, and the servant whom I have chosen, the Father with the Son and the Holy Spirit is a witness for us, so that in the mouth of two or three witnesses every word may stand. And it seems to me that the sentence stands rather in this way, and that the truth is confirmed under these three witnesses, rather than through the letter. For there were two witnesses against Susanna, and against the Lord Savior himself, and yet the word did not stand in their mouth. Against Naboth, too, almost the whole city bore witness, and the agreement of most wicked witnesses had not the firmness of truth but the conspiracy of a crime.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
