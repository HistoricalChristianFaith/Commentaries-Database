[[commentary]]
quote='''
The word here [communicat] 'makes a man common' is peculiar to Scripture, and is not hackneyed in common parlance. The Jewish nation, boasting themselves to be a part of God, call those meats common, of which all men partake; for example, swine's flesh, shell fish, hares, and those species of animals that do not divide the hoof, and chew the cud, and among the fish such as have not scales. Hence in the Acts of the Apostles we read, What God hath cleansed, that call not thou common. (Acts 10:15.) Common then in this sense is that which is free to the rest of mankind, and as though not in part of God, is therefore called unclean.

The thoughtful reader may here object and say, If that which entereth into the mouth defileth not a man, why do we not feed on meats offered to idols? Be it known then that meats and every creature of God is in itself clean; but the invocation of idols and dæmons makes them unclean with those at least who with conscience of the idol eat that which is offered to idols, and their conscience being weak is polluted, as the Apostle says.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Not what enters the mouth makes a man common, but what comes out of the mouth, this makes a man common. The word makes common is proper to the Scriptures and is not worn in public speech. The Jewish people, boasting that they are God's portion, call common the foods that all men use, for example pork, oysters, hares and animals of that kind that do not divide the hoof nor chew the cud, nor, among fish, have scales. Hence it is also written in the Acts of the Apostles: What God has sanctified, do not call common. Common, then, that which lies open to other men and is, as it were, not of God's portion, is used for unclean. Not what enters the mouth defiles a man, but what comes out of the mouth, this defiles a man. The prudent reader may object and say: If what enters the mouth does not defile a man, why do we not eat things sacrificed to idols? And the Apostle writes: You cannot drink the cup of the Lord and the cup of demons. It must be understood, therefore, that the foods themselves, and every creature of God, are clean in themselves, but the invocation of idols and demons makes them unclean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
