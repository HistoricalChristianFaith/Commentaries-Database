[[commentary]]
quote='''
According to the promise which is made to the holy man in Isaiah, saying: While you are still speaking, I will say, Behold, I am here, now too the Lord answered the prophet, and commanded him to write the vision and to set her out upon tablets, that is, to write more plainly. But I think the tablets are those of which the Apostle also speaks to the Corinthians: You are our letter, written in our hearts, which is known and read by all men; being made manifest that you are the letter of Christ, ministered by us, and written not with ink but with the Spirit of the living God, not on tablets of stone but on fleshly tablets of the heart. And Solomon too signifies something of the kind in Proverbs, saying: Write her upon the breadth of your heart. And he is commanded to write more plainly, so that the reader may be able to run, and his speed and his desire of reading may be held back by no hindrance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
But what he says is of this kind, provided only that we mix in the translation of the Seventy too. Write in your heart; and as little children who receive the first elements of letters train their crooked strokes and trembling hand on boxwood, and by practice grow used to writing correctly, so you too, who have spoken in the person of the doubting people, write what I say on the tablets of your heart and on the boxwood of your breast. For it is a vision which is promised and which is commanded to be set out and written more plainly, so that it may be wrapped in no cloud and obscured by no windings of riddles; let a clear hope have a clear pledge. And this, O prophet, I command, not because you do not know — for you would not be a prophet if you were ignorant —, but so that what you have written more plainly the reader may be able to read and run through without hindrance and difficulty, which the Seventy translated: Ὅπως διώκῃ ὁ ἀναγινώσκων, that is, that he who reads may pursue, according to that sense which is written to Timothy: Pursue justice, piety, faith, charity, patience, gentleness. And to the Romans: Pursuing hospitality. And to the Corinthians: Pursue charity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
