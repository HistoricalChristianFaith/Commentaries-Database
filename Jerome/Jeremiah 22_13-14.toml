[[commentary]]
quote='''
Woe to him who builds his house in unrighteousness and his upper rooms not in judgment, who oppresses his friend for nothing and does not pay him his wage; who says: I will build myself a broad house and spacious upper rooms, who opens windows for himself and makes ceilings of cedar and paints them with red ochre! Will you reign, since you compare yourself to the cedar? Did not your father eat and drink, and do judgment and righteousness then, when it was well with him? He judged the cause of the poor and needy to his own good; was it not therefore, because he knew me?, says the Lord. But your eyes and heart are for avarice, and for shedding innocent blood, and for slander, and for the course of evil work. LXX: O you who build your house not with righteousness and your upper rooms not in judgment! With him his neighbor works for nothing, and he will not pay him his wage. You have built yourself a little house, upper rooms open to the wind, set off with windows and raftered with cedar and daubed with red ochre. Will you reign, because you contend against Achaz, your father? They shall not eat and they shall not drink; it was better for you to do judgment and good righteousness. They did not know, they did not judge judgment for the lowly, nor judgment for the poor. Is not this your not knowing me?, says the Lord. Behold, your eyes are not upright nor your heart good, but they are for your avarice and for shedding innocent blood, and for iniquity and murder, to do them. I have set down both editions in full, so that both the Hebrew truth and the difficulty of the common edition may be more easily recognized. Now the word is against Jehoiakim son of Josiah, king of Judah, of whom we spoke above, whom Pharaoh Neco, king of Egypt, set up in place of Jehoahaz his brother, whom he led bound into Egypt. And we read, and the history both of Kings and of Chronicles relates, that Jehoiakim son of Josiah reigned eleven years in Jerusalem, and reigned cruelly, and proved impious, and afterwards died; and yet his burial is not related, although holy Scripture has this custom, that it reports of all the kings both that they died and that they were buried. This one, however, it properly relates to have died and not been buried; of which we shall speak later. He laments, then, the aforesaid king, because he trusts in unrighteousness and thinks his royal dignity perpetual, and makes himself upper rooms, and oppresses his friends, and does not pay those who work for him their wage, and supposes the building of his palace to be everlasting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
