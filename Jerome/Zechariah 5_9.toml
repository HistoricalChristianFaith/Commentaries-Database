[[commentary]]
quote='''
And I lifted up my eyes and saw, and behold, two women coming out, and the spirit was in their wings, and they had wings like the wings of a kite, and they lifted up the jar between earth and heaven. And I said to the angel who spoke in me: Where are these carrying the jar? And he said to me: That a house may be built for it in the land of Shinar, and that it may be established, and set there upon its base. LXX: And I lifted up my eyes and saw, and behold, two women coming out, and the spirit was in their wings, and they had wings as are the wings of a hoopoe. And they lifted up the measure between earth and heaven. And I said to the angel who spoke in me: Where are these carrying the measure? And he said to me: To build a house for it in the land of Babylon, and to prepare it, and to set it there upon its seat. The Jews take the two women coming out to be the kingdom of the Medes and that of the Macedonians, each of which afflicted the Babylonian people, and there their impiety set up its seat. But this they invent with cunning, so that what was said of themselves may not be understood of themselves. For the two women who come out, no doubt from the land of Judea, are to be understood as the ten tribes and the two, of which the one were taken captive by the Assyrians, the other by the Chaldeans. And in their wings was the spirit, that is, the power of the devil, of which it is written in Ecclesiastes: If the spirit of him who has power rises up against you, do not leave your place. And in the Gospel we read of the unclean spirit which, when it has been cast out of its house, goes about through desert and dry places and returns to its former house with seven other spirits more wicked than itself. By this spirit, then, these women were snatched along as by wind and blast and borne in swift flight, and they had wings; in the Hebrew asida, which Aquila, Symmachus and Theodotion translated heron, the LXX alone hoopoe. The Hebrews think the asida is the kite, a most rapacious bird, forever lying in wait for the birds of the farmyard; but of the heron, those who have written on the nature of birds declare that there are three kinds: one white, another starred, the third black, which is both the fiercest and bloodthirsty, and quarrelsome, and so impatient in mating that blood bursts from their eyes. The hoopoe, again, whose name we drew from the likeness of the Greek name (for they too call it epopa, because it settles on human dung), they say is a most filthy bird, forever lingering in tombs, forever in human dung; in short, it is even said to make its nest of it, and to feed its young on the little worms of rotting dung. Whichever of the three birds you choose to understand by asida, it suits these women, Judah and Israel, who because of their stinking sins were handed over to the power of demons and were led by them into captivity. And they took up the jar, or measure, in which impiety was held shut in, with a lump of lead laid on top so that it could not get out, and the most heavy weight of all sins, through the air between earth and heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
