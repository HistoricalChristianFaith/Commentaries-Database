[[commentary]]
quote='''
And so the sword has begun in his cities, or will rush in, as Aquila translated, or will wound, as Symmachus rendered. And see how great is the weight of miseries: not that fields or possessions and the countryside are laid waste, but that the enemy enters the midst of the cities and consumes his chosen ones, or his arms, as Symmachus translated, which in Hebrew is called baddau. And when the sword has consumed the chosen and the princes, or the strength of the army, and has devoured either their heads or their counsels, so that they can find no protection at all, then the wretched common people, who would not return to me, will wait for my return to them. And they will repent late, while the enemies lay everything waste. And so, because great sins must be punished with great torments, he will lay upon those of the people who are left, — their king and princes having been cut down by the Assyrian sword, — the most heavy yoke of servitude, and he will lay it on them all together, which will not be taken away according to the letter, unless it is taken away spiritually in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
