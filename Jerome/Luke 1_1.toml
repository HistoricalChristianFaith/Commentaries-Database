[[commentary]]
quote='''
That there were many who wrote gospels, the evangelist Luke testifies, saying: Since indeed many have attempted to set in order a narrative of the things that have been fulfilled among us, as those handed them down to us who from the beginning themselves saw the word and ministered to it; and the records that have lasted up to the present time declare it too, records which, published by various authors, were the beginnings of various heresies, such as the one according to the Egyptians, and those of Thomas and of Matthias and of Bartholomew, of the Twelve Apostles also, and of Basilides and of Apelles and of the rest, whom it would take very long to enumerate; since for the present it is necessary to say only this, that there have been certain men who, without the Spirit and grace of God, attempted rather to set in order a narrative than to weave together the truth of history. To them that prophetic word can rightly be fitted: Woe to those who prophesy from their own heart, who walk after their own spirit, who say: The Lord says, and the Lord did not send them; of them the Savior too speaks in the Gospel of John: All who came before me were thieves and robbers. Who came, not who were sent; for he himself says: They came, and I did not send them; in those who come there is the presumption of rashness, in those who are sent the obedience of service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
