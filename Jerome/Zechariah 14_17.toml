[[commentary]]
quote='''
And it shall be that whoever of the families of the earth does not go up to Jerusalem to worship the King, the Lord of hosts, upon them there shall be no rain. LXX: And it shall be that whoever of the families of the earth do not go up to Jerusalem to worship the King, the Lord Almighty, these also shall be added to those. Where the Seventy translated, and these also shall be added to those, in the Hebrew is written ulo alehem eie gesem, which Aquila and Symmachus and Theodotion have likewise interpreted: And upon them there shall be no rain. The Church of the Lord Jesus is called the heavenly Jerusalem, of which the Apostle writes: But the Jerusalem which is above is free, which is the mother of us all, and: You have come to Mount Zion, and to the city of the living God, the heavenly Jerusalem. And this Jerusalem is not set in low places, but on a lofty mountain, of which the Savior speaks: A city set on a mountain cannot be hidden. Hence whoever is to worship the Lord of hosts in Jerusalem must climb up to the mountain heights. But whoever is of the families and tribes of the earth, and for that reason cannot worship the Lord, upon him there shall be no early and late rain, nor shall his land be watered by the rains of heaven. Or else, as the Seventy translated: Whoever of the families of the earth do not go up to Jerusalem to worship the King, the Lord Almighty, they shall be reckoned with those who fought against Jerusalem, and whose flesh shall waste away, and whose eyes shall melt away, and whose tongue shall rot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
