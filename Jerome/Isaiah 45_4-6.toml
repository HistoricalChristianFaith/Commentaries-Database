[[commentary]]
quote='''
And these things, he says, I have granted you for the sake of Jacob my servant, and Israel my chosen, and I have called you by your name, as I called Abraham, Isaac and Jacob, and foretold you long before, as I did Isaac and Josiah: lest you should be thought to be that Christ to whom you have been likened, and whose type and image you went before. But you have not known me, that is, you have worshiped images, not God. I girded you with strength; I made you victor over many nations, and you have not known your helper. In this place I cannot sufficiently marvel at the folly of readers, that they refer these things to Christ, through whom the world was reconciled to God. I, he says, am the Lord, and there is none besides apart from me. For besides my Word and Reason, and my power and wisdom, which is in me, there is no other God. And I have done these things so that the whole world, from the East and the West, may acknowledge that there is no other God besides me. I am the Lord, and there is no other. For the Father is in the Son, and the Son in the Father, who says in the Gospel: I and the Father are one (John 10:30). And in the volume of Ezra it is set down that Cyrus wrote to all the nations that there is no God but the God of Israel alone. Or it is to be understood thus: that the release of the captives and God's clemency toward his people made God better known to all the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
