[[commentary]]
quote='''
God seems to reject us when he leaves us to temptation. Hence Job too: The visitation, he says, of the Lord has looked upon me. And not only do the just speak and say: But now you have rejected and confounded us, as is written in Psalm 43 (44), but the Lord and Savior himself, in the person of the man whom he had assumed: But you, he says, have rejected and despised, you have put off your Christ; you have overturned the covenant of your servant. That it is the person of the just in Psalm 43 (44) who say: But now you have rejected and confounded us, is proved from what follows: All these things have come upon us, yet we have not forgotten you, nor have we acted wickedly in your covenant; nor has our heart turned back.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
