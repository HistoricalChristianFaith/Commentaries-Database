[[commentary]]
quote='''
And his feet shall stand for those on whom he has had mercy, and shall by no means be moved in such a way that it could again be said of him: And the Lord shall sound the trumpet, and shall walk in the threat of his wrath. Nor shall he walk when the sun is already declining and the darkness is near, after midday, as we read that he did over Adam. And when he has stood, he will not stand in a valley and in low places but on a mountain, one that has no fruitless trees and barren forest, but where olive groves grow, by which the eternal light is fed, and infirmities are loosed, and rest is given to the weary. And this Mount of Olives, on which the feet of the Lord stand, is opposite Jerusalem and to the east, whence the sun of justice rises, and it is planted with those olive trees of which it is said: Your sons like young olive plants, round about your table. Half of it shall be split toward the east, the half in which are the trees planted from the nations, one of which says: But I, like a fruitful olive tree in the house of God, have hoped. And the other half shall be split toward the west and the sea, with a very great chasm: this is the people of the circumcision, to whom God speaks through the prophet: Why has my beloved done abomination in my house? Shall vows and holy flesh take away your wickedness from you, or will you escape by these? This beloved did abomination in the house of God, so that she crucified the Son of God and heard: The Lord called your name a shady olive tree and a wooded beauty; and your branches became useless, which were broken off from the good root, so that we might be grafted in their place. And note the mysteries of the scriptures, how the half that slopes toward the west, and is beaten by salt and bitter waves, is said to be not simply in the sea, but in the sheer abyss of the sea, an exceedingly great one, of which Micah too speaks: I will drag down its stones into the valley — Jerusalem's, no doubt —, and I will lay bare its foundations. These things we have said, as in very difficult and very obscure places, according to the slenderness of our powers. But the Jews, following the letter that kills, try to show that God stands upon the Mount of Olivet, and that the mountain itself is divided into two parts, so that the cleft has its beginning in one part toward the east, and the other part stretches its end toward the west, and in the middle, very steep, one part is divided toward the north, the other toward the south.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
