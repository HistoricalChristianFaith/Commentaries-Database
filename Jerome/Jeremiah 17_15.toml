[[commentary]]
quote='''
Behold, they say to me: where is the word of the Lord? Let it come! But I was not troubled, following you as shepherd — or I have not labored following you — and I have not desired the day of man; you know. What went out from my lips was right in your sight — or is before your face —. Do not be a terror to me, my hope in the day of affliction, or do not become a stranger to me, sparing me in the worst day! Those who do not think that what has been spoken will come say to the prophet: where is the word of the Lord? let it come!, judging the delay to be a setting aside of the sentence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
