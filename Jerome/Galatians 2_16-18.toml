[[commentary]]
quote='''
On account of which, by the works of the Law all flesh shall not be justified. But if, seeking to be justified in Christ, we ourselves also are found sinners, is Christ then the minister of sin? God forbid. For if I build up again the things which I destroyed, I make myself a transgressor.

Not justified by the works of the Law shall be that flesh of which it is written: "All flesh is grass, and all its glory as the flower of the field" (Isa. 40:6). But justified by the faith of Jesus Christ is that flesh of which it is said in the mystery of the resurrection: "All flesh shall see the salvation of God" (Luke 3:6). But also, according to a humbler understanding, formerly not all flesh was justified by the Law, but only those men who were in Palestine; now, however, all flesh is justified by the faith of Jesus Christ, while His Church is being founded in the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
