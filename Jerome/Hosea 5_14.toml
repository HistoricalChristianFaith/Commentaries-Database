[[commentary]]
quote='''
For I am like a lioness to Ephraim, and like a lion's whelp to the house of Judah. I, I will seize and go; I will carry off, and there is none who may rescue. Going, I will return to my place, until you fail and seek my face. LXX: For I am like a panther to Ephraim, and like a lion in the house of Judah. And I will snatch, and go, and carry off, and there will be none who may rescue; I will go and return to my place, until they perish and seek my face. While they go to Assyria and send to the vindicating or avenging king, who will not be able to heal them nor to loose the bond that binds them, I will show that, when I oppose, all the help of men is vain; for I will be like a lioness to Ephraim, and like a lion's whelp to the house of Judah. For lioness, which in Hebrew is called sohel, the Seventy rendered panther, which is said alike in Greek and in Latin, and can be taken both as the name of a beast and as "every beast"; so that whatever is savage in beasts you may recognize in the indignation of God. Nothing is swifter than the panther, nothing stronger than the lion; in the panther is signified the swift destruction of the kingdom of Samaria by the Assyrians; and in the lion is shown the most mighty kingdom of the Chaldeans, which some time afterwards came against Jerusalem and Judah. And because he had said that he was a lioness or a panther, and a lion, he keeps the metaphor, and says: I, I will seize and go; I will carry off, and there is none who may rescue. It is asked: if, when God seizes, carries off and holds, no one can snatch from his hands, according to what is written: No one can snatch out of the hand of my Father, how was Judas snatched from the hand of God by his betrayal? To which we will briefly answer that no one can snatch from the hand of God; but that he who is held can, by his own will, fall out of the hand of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
