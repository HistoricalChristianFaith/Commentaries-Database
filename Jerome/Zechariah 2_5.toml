[[commentary]]
quote='''
These cattle and these living creatures hear the voice of the good shepherd, and know it, and follow him, because he is both the shepherd, who also rules us, and the door, because through him we enter into the Church and to the Father, and a wall of fire round about, so that he may warm those who believe and dwell in the midst, who before had grown lukewarm from the coldness of charity, and that they may be fervent in spirit. But the wolves and the most savage beasts — of which it is written: Do not hand over to the beasts the soul that confesses you, and whose fruit is hay, wood, stubble, and they bring forth thistles and thorns —, let him consume with his fire; and he who is fire to the adversaries, let him be glory in the midst of the believers. That the Lord is the wall of Jerusalem we read in another place too: Mountains round about it, and the Lord round about his people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
