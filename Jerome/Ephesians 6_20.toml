[[commentary]]
quote='''
After this, what it means that he says: For which I perform an embassy in a chain, namely, so that I might make known the mystery of the Gospel, must be touched on briefly. And indeed one who understands it simply will say that, because of his testimony to Christ, he sent these writings from prison and from chains while placed at Rome. But another will contend that he said these things on account of the body of humiliation, and that chain with which we are encompassed, and we do not yet know as we ought to know, and we see through a mirror in an enigma; and that he will truly be able to open the mysteries in the confidence of the Gospel only when he has laid aside the chain and gone out of prison a free man: unless perhaps he too is to be reckoned without chains even in chains who has his way of life in the heavens, and of whom it can be said: But you are not in the flesh but in the spirit, if indeed the spirit of God dwells in you (Rom. 8:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
