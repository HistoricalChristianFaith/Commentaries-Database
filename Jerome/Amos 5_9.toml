[[commentary]]
quote='''
And as for what follows: Who smiles devastation upon the strong, he returns to the present time. And the order is: he who is the Creator of all things also threatens captivity upon Samaria, and brings plundering upon the mighty, since it turns judgment into wormwood and leaves righteousness on the earth. Where we have said, who smiles, Aquila translated ὁ μειδιῶν. And μειδίαμα is properly said of what we can call a smiling, when someone is angry and, with his lips parted a little, pretends to smile, so as to show the greatness of his anger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
This God also divides crushing upon strength, so as to make weak those who are wickedly strong, and so that they can imitate the Apostle, who says: When I am weak, then I am stronger. For the sons of this world are more prudent than the sons of light in their own generation. The strength of the body is the weakness of the soul, and again the strength of the soul is the weakness of the body. Therefore the Lord, who dispenses all things by reason and does all things by true judgment, divides crushing upon the strong enemy, so as to bring misery upon the fortress which raises itself up against the knowledge of God. Of which we also read in Proverbs: The wise man entered strong cities and destroyed the fortress in which the ungodly trusted. This he does indeed against all worldly strength, but properly against the heretics, who try to strengthen the falsity of their dogmas with arguments and sophisms and the dialectical art. But the wise man destroys it, and, helped by the aid of God, shows every fortress to be most vain, so as to bring misery upon it, and, when its pride has been bowed down, he can say with the Apostle: Wretched man that I am, who will deliver me from the body of this death?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
