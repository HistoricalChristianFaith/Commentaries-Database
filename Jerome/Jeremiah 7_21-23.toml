[[commentary]]
quote='''
Thus says the Lord of hosts, the God of Israel: Add your burnt offerings to your victims and eat flesh, for I did not speak with your fathers, and I did not command them on the day that I led them out of the land of Egypt, concerning the matter of burnt offerings and victims, but this word I commanded them, saying: Hear my voice, and I will be your God and you will be my people, and walk in every way that I have commanded you, that it may be well with you. Having rejected their temple, he consequently rejects their sacrifices too, and indirectly reproves them because they sacrifice victims not out of reverence for him but out of desire for feasting. But when he says: I did not speak with your fathers, and I did not command them on the day that I led them out of the land of Egypt, about the matter of the burnt offering and of victims, it is clearly understood that he first gave the Decalogue, written on tablets of stone by the finger of God, and that after the offense of idolatry and the head of the calf he afterward commanded that it be done to himself rather than to demons, taking away the pure religion of the commandments of God and granting the blood of victims and the craving for flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
