[[commentary]]
quote='''
And Amos answered, and said to Amaziah: I am not a prophet, and I am not the son of a prophet, but I am a shepherd plucking sycamores. And the Lord took me when I was following the flock, and said to me: Go, prophesy to my people Israel. And now hear the word of the Lord: You say: You shall not prophesy over Israel, and you shall not drip upon the house of the idol. Therefore thus said the Lord: Your wife shall commit fornication in the city, and your sons and your daughters shall fall by the sword, and your ground shall be measured with the line, and you shall die in a polluted land, and Israel shall go captive out of his land. LXX: And Amos answered, and said to Amaziah: I was not a prophet, nor the son of a prophet, but a herder plucking sycamines. And the Lord took me from the sheep, and the Lord said to me: Go, and prophesy over my people Israel. And now hear the word of the Lord: You say: Do not prophesy over Israel, and do not gather hearers against the house of Jacob. Therefore thus says the Lord: Your wife shall commit fornication in the city, and your sons and your daughters shall fall by the sword, and your land shall be divided with the line, and you shall die in an unclean land; but Israel shall be led captive out of his land. What Scripture records that the blessed apostles did, when the scribes and Pharisees warned them not to teach in the name of Jesus, and they answered, saying: We must obey God rather than men, we recognize that the prophet Amos also did: when the high priest of the idols ordered him not to prophesy in Bethel, he not only prophesies, and shows that he fears God who sends him more than the man who forbids him, but boldly and freely announces punishments to the very man who tried to forbid him and to hinder the word of God. Not only, he says, am I not a prophet, or, was not — of which the one belongs to humility, the other to truth — nor the son of a prophet, descended from a prophetic stock, but when I was a herdsman and was stripping blackberries from the brambles, the Lord took me as I followed the flocks. For herdsman, which in Hebrew is called boger, Aquila and Symmachus and Theodotion and the Fifth edition translated βουκόλον, one who pastures herds of cattle, not sheep. The Seventy alone said αἰπόλον, which properly means a herder of goats, ἀπὸ τοῦ αἰπολίου, which indeed means a flock that lives on the heights, to show that flocks of goats always climb rocks and rough crags and higher places. But since he adds: And the Lord took me ἐκ τῶν προβάτων, that is, from the flocks, he seems rather to mean sheep than goats, although we read at the beginning of Leviticus that both sheep and goats are designated by the name of flocks. For thus the Lord speaks: If you offer ἀπὸ τῶν προβάτων, that is, from the flocks to the Lord, a lamb or a kid, and a sheep or a goat. Moreover, what he says, plucking sycamines, which Aquila translated searching sycamores, and Symmachus having sycamores, some explain in this way, holding that sycamines is the name of a kind of tree that grows in the plains of Palestine and bears wild figs; and these, if they are not plucked, produce very bitter little figs and are spoiled by gnats. To us, however, since the wilderness in which Amos lived produces no tree of this kind, it seems rather that he means brambles, which bear blackberries and relieve the hunger and want of herders. However the reader may wish to take it, this must be said: that the Lord took up a lowly and rustic herder, and sent him to his people Israel, and commanded him to go out from his own land and proceed to Samaria, and there prophesy the things that are to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
