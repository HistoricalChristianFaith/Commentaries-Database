[[commentary]]
quote='''
Therefore at least from now on call me: My father, you are the guide of my virginity; will you be angry forever, or will you persevere to the end? Let the heretics blush, who are unwilling to be turned to better things or to go back to the Father, their creator, and let them hear: at least from now on call me: my father, you are the guide of my virginity. He himself has betrothed your soul to his embraces and teaches how it ought to pray and to do repentance. But the more merciful he is who shows the way of salvation after fornication, the more wretched is the harlot who is unwilling to receive healing after her wounds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
