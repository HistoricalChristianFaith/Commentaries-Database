[[commentary]]
quote='''
Who, he says, has helped the spirit of the Lord, or who was his counselor and showed him? etc. For which Symmachus translated: Who has prepared the spirit of the Lord, and who has shown him the man of his counsel? With whom did he take counsel, and who gave him understanding, and taught him the way of judgment, and instructed him in knowledge, and showed him the road of prudence? By this he shows more plainly that the spirit was prepared, or established, the one of whom one reads in the Apostle: Now the Lord is the Spirit. And: Upon whom the Spirit of God rested, the Spirit of wisdom and understanding, and the rest. Who says in what follows: The Spirit of the Lord is upon me: because he has anointed me (Isa 61:1). For he himself is the spirit of the Lord and the man of his counsel, in whom dwelt all the fullness of the Godhead bodily (Col 2). With him he took counsel, of whom we spoke above (cf. Isa 9:6): Wonderful, Counselor. And in Proverbs it is written: God founded the earth by wisdom, and prepared the heavens by understanding (Prov 3:19). Moreover, the Seventy, who said: Who has known the mind of the Lord, and who was his counselor? wish it to be understood that the mind and reason and sense of God, through whom all things were made and without whom nothing was made, is he of whom it is sung in the Psalms: By the word of the Lord the heavens were established, and all their power by the spirit of his mouth (Ps 32 [33]:6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
