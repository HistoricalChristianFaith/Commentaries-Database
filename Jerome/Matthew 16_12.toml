[[commentary]]
quote='''
But now, by this same saying, he teaches that the spiritual bread of the Church, which came down from heaven, ought not to be violated by a Jewish interpretation; and the Lord commanded the very same thing to the disciples, that they should beware of the leaven of the Pharisees (John 6). The evangelist, making this plainer, added: "Now he had spoken to them of the doctrine of the Pharisees" (Matt. 16:12). And what is this other doctrine of the Pharisees, if not the observance of the Law according to the flesh?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
