[[commentary]]
quote='''
And now I — but I will speak my judgments with them. Aposiōpēsis [breaking off], after that line of Vergil: whom I — but it is better to calm the troubled waves. Being about to speak of good fortune, then, he restrains himself and joins sorrows to sorrows; for these are the judgments which God speaks with his people of old, so that they may know that they justly suffer what they suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
