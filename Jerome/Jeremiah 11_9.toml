[[commentary]]
quote='''
And the Lord said to me: A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem. They have turned back to the former iniquities of their fathers, who would not hear my words; and these, therefore, have gone after foreign gods to serve them. The house of Israel and the house of Judah have made void my pact, which I made with their fathers. For 'conspiracy', which we have translated following Symmachus, Aquila and the Seventy and Theodotion translated syndesmon, which we can call 'a binding-together'. Hence also Athaliah, when she discovered that a plot was being prepared against her in the temple, spoke with the same word: Conspiracy, conspiracy. Properly, however, Scripture employs this word when one strives toward wrongdoing not by a sudden and chance sin but by prepared plots and conspiracy, and when with like mind and one zeal they act so as to despise the commandments of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
