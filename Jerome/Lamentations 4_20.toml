[[commentary]]
quote='''
Adadremmon, for which the LXX translated ῥοῶνος (of the pomegranate grove), is a city near Jezreel which was once called by this name, and today is called Maximianopolis, in the plain of Megiddo, in which Josiah, the just king, was wounded by the Pharaoh surnamed Necho; over him Jeremiah wrote Lamentations, which are read in the Church, and that he wrote them the book of Chronicles testifies. Just as, therefore, at that time, after the sinful kings, all the hope of the people was in Josiah, and when he was slain a great mourning was stirred up in the city, as we read in the Hebrew: The spirit of our mouth, Christ the Lord, was taken in our sins, to whom we said: In your shadow we shall live among the nations. Although others, according to the spiritual understanding, refer this to the Lord Jesus; so, when the Savior has been crucified, the mourning shall be renewed in Jerusalem, as once it was in the city of Adadremmon, in the plain of Megiddo.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
