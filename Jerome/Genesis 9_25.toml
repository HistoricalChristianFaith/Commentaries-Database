[[commentary]]
quote='''
Now in proof of this point, that the first impulse of thoughts, or rather the slight prompting of the mind, is by no means punished by God, but only if you complete in deed what you have conceived in the mind, that passage of Genesis must be brought forward: Ham sinned in mocking his father's nakedness, and the sentence was received not by him who laughed but by his son Canaan: Cursed, he says, be Canaan; a servant he shall be to his brothers. For what righteousness is there in this, that the father should have sinned and the sentence be pronounced against the son? Likewise what the Apostle sets down in the opposite direction, that the woman is saved if her son remains in faith and holiness and chastity, would seem not to have the righteousness of a sentence, namely that if the sons and grandsons are good, the parents are saved; for how many parents are holy and have wicked sons, and, on the contrary, how many are sinners and beget holy sons? Therefore all that we said above is to be taken according to this sense: that the sins of parents and begetters are punished in the branches, not in the root.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
