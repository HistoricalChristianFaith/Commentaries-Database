[[commentary]]
quote='''
Judas, not withheld by either the first or second warning, perseveres in his treachery; the Lord's long-suffering nourishes his audacity. Now then his punishment is foretold, that denunciations of wrath may correct where good feeling has no power.

We are not to infer from this that man has a being before birth; for it cannot be well with any man till he has a being; it simply implies that it is better not to be, than to be in evil.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Son of Man indeed goes as it is written of him; but woe to that man by whom the Son of Man will be betrayed. Reproved neither the first time nor the second, he does not draw back his foot from the betrayal; rather, he feeds his shamelessness on the patience of the Lord and stores up for himself wrath on the day of wrath. Punishment is foretold, so that the torments announced might correct one whom shame had not overcome. But as to what follows:

It would have been good for him if that man had not been born, he is not on that account to be thought to have existed before he was born, on the ground that it can be well with no one except one who has existed; it is simply said that it is much better not to exist than to exist badly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
