[[commentary]]
quote='''
Then God says that he strengthens the house of Judah and the house of Joseph, so that those who were divided while Jeroboam reigned may be united while Christ rules, and there may be one shepherd and one flock. For both Judah and Joseph, under different names, are brought together into the one understanding of the Savior, because Joseph lavished grain on the peoples hungering in Egypt, and the Lord satisfied the hunger of the world with his presence. And he will bring them back, and will have mercy on them, and so they shall be one, as they were before he cast them off. Take all these things of the persecutions, when, all hope being lost, the Lord heard his servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
