[[commentary]]
quote='''
The devil, who longs to set his nest above the stars of heaven, we very often read called an eagle: If you are exalted like an eagle, from there I will bring you down, says the Lord. The eye too that mocks its father and despises the old age of its mother will be dug out by ravens, and the young of eagles will devour it; losing the clear light of its vision through the devil and the demons. Hence it is commanded in the law that we should not eat the eagle. This eagle, then, comes upon the conventicles of the heretics, which were once the house of the Lord; and it comes because they have transgressed his covenant and abandoned the law of God; and in vain they call upon him and say: You are my God, and we know you, we who are called Israel, seeing God, and are called by the Christian name. In vain, he says, they do these things, since they have set up kings for themselves, and acted against my will, and have as princes my adversaries, whom I do not know, because they do not deserve knowledge of me. Their silver too and their gold, and whatever they could possess by nature, words and thoughts, they turned into idols which they fashioned from their own heart; and they turned them, not in order to perish; but because they turned them, therefore they perished. For they did not do it with this purpose, that they might perish; but because they did it, therefore they perished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
