[[commentary]]
quote='''
Mesopotamia: raised up by a certain calling. But it better takes its etymology from the Greek, because it is surrounded by two rivers, the Euphrates and the Tigris.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Acts of the Apostles"
