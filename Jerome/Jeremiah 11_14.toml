[[commentary]]
quote='''
You, therefore, do not pray for this people, and do not take up praise and prayer for them, for I will not hear in the time of their crying to me, in the time of their affliction! Jeremiah is commanded not to wish to entreat the Lord for those against whom the sentence has already been completed, lest his prayer should seem weak and should not be heard because of their own crimes. 'Do not', he says, 'pray for them, nor take up praise, striving, by recounting the clemency of the ancient history with which I have always had mercy on him, and by praising me, to change my sentence! For even if you do this, I will not hear those who are forced to ask me in the time of necessity'. From which we learn that it is in vain for anyone to ask on behalf of another, when the one for whom God is asked does not deserve to receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
