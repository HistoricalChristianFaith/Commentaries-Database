[[commentary]]
quote='''
And it shall be, when anyone prophesies any more, his father and his mother, who begot him, shall say to him: You shall not live, because you have spoken a lie in the name of the Lord; and his father and his mother, who begot him, shall pierce him when he prophesies. LXX: And it shall be, if a man prophesies any more, his father and his mother, who begot him, shall say to him: You shall not live, because you have spoken a lie in the name of the Lord; and his father and his mother who begot him shall fetter him when he prophesies. When the names of the idols have been taken away from the land, and the false prophets, and the unclean spirit that spoke in them, if anyone wishes to try any more and to prophesy something in the person of the Lord, at once his father and mother will forget that they are parents, so as to hold fast to the service of God, and they will pronounce the sentence of death against their son; and the minds of all will be so devout toward God that no public judgment will be awaited, but those who are such will perish by the sentence of their kinsfolk. For what we have rendered, they shall pierce him, there is in the Hebrew the same word as above, dacaru. By what reasoning, then, did the LXX translators choose to translate there κατωρχήσαντο, that is, they insulted, or they mocked, and, to render word for word, they danced against him, and here συμποδιοῦσιν, that is, they shall fetter, when Aquila and Symmachus and Theodotion rendered alike both there and here: they pierced? And rightly is he who has prophesied falsehoods called a man, as the Apostle says: For since there are among you rivalries and contentions, are you not carnal, and do you not walk according to man? And in the psalms: But you shall die like men, and fall like one of the princes. And those unworthy of the Spirit of God deserve to hear: My spirit shall not remain in these men, because they are flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
