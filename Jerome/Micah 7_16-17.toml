[[commentary]]
quote='''
And these things will happen so that the nations may see, and be confounded in all their evil strength, and put their hands upon their mouth, and grow deaf in their ears, and lick the earth like serpents that drag the ground, so that first they may be shut in, and, once shut in, be troubled, then, terrified, be astonished before the Lord God of the saints, and at last they too may fear him. This is according to the LXX. Moreover, since our edition, at least in the present passage, does not differ much from them, let us consider that what has been said on theirs has been said on this also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
