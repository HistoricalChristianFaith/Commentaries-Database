[[commentary]]
quote='''
Pass over to the islands of Kittim and see, and send to Kedar and consider earnestly, and see whether such a thing has been done: if a nation has changed gods — or its gods — ; and surely they are not gods. But my people has changed its glory into an idol or, for that from which nothing will profit it. He makes a comparison of a thing that is incomparable, and sets the true God beside lying ones. 'Go', he says, 'to the islands of Kittim', which we ought to take as those either of Italy or of the western regions, from the fact that the island of Cyprus, in which a city is called by this name, is near the land of Judea; from it too came Zeno, the chief of the Stoics. Kedar, however, is a region of the wilderness and of the Ishmaelites, whom they now call Saracens, against which a prophecy of this very prophet is woven in his final parts, and which David mentions, saying: I have dwelt with the inhabitants of Kedar; my soul has long been a sojourner. And the sense is: 'Either go to the west or send into the wilderness, and see whether any nation has done what you have done. For none of them has spurned its gods, nor, by comparison with golden ones, exchanged its wooden and stone ones; but following its ancient error it has kept what it had received from its ancestors; and this surely, although none of them is a god, but they are images fashioned by the hand of men. But my people has changed the truth for a lie and preferred to me an idol, which will not be able to profit them in the time of need'. We can say this also against those who follow vices with greater zeal than virtues, whom the Apostle admonishes, saying: I speak in human terms because of the weakness of your flesh. As you yielded your members to serve uncleanness and iniquity unto iniquity, so now yield your members to serve righteousness unto sanctification.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
