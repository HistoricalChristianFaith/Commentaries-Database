[[commentary]]
quote='''
Is the Law then against the promises of God? God forbid. For if a Law had been given which could give life, righteousness would truly be from the Law. But Scripture has shut up all things under sin, that the promise by the faith of Jesus Christ might be given to those who believe. But before faith came, we were kept under the law, shut up unto that faith which was to be revealed.

Just as the mediator of God and men stood in the middle between the one who gave the Law and the one who received it, so the Law itself, which was given after the promise, crept in as something in the middle between the promise and its fulfillment. It must not be thought to exclude the promise on the ground that, having followed afterwards, it seems to abolish that which came before; rather, from the fact that it could not give life, nor bestow what the first promise had pledged, it is manifest that it was given for the safekeeping of the promise, not for its overthrow. For if a Law had been given which could furnish life, and deliver what the promise had pledged, then truly the promise would be thought to have been excluded through the Law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
