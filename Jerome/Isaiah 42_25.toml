[[commentary]]
quote='''
Therefore the Lord poured out upon them all his anger and an indignation full of fury, so that he who before had kept silent would no longer hold his peace, and would chastise them not with words but with punishments and torments; and a most mighty war would seize them, which they could in no way escape, showing the ferocity of the Romans. And though he has been burned on every side and has no soundness in him, yet he does not understand the cause of his punishment: that he has been punished because he did not receive the Son of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
