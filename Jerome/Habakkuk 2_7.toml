[[commentary]]
quote='''
And this will come about because suddenly those will rise up who bite him: either the angels with whom the devil will be handed over to punishment, or those who had been tempted by him and afterwards do penance; and, turned to the standards of Christ, they will bite him, according to what is said elsewhere: Your men of peace have laid snares for you. Then follows: And your ambushers will awake, that is, you will lie exposed to the snares of those whom you had earlier lulled to sleep, whom you had made drunk, as they lay waste your kingdom and bring back those who were captives into the troops of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
