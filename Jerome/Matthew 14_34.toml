[[commentary]]
quote='''
If we knew what the word Gennezareth would convey in our tongue, we might understand how under the type of the Apostles and the boat, Jesus guides to shore the Church when He has delivered it from the wreck of persecution, and makes it to rest in a most tranquil harbour.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when they had crossed the water, they came into the land of Gennesaret. If we knew what Gennesaret sounds like in our language, we would understand how Jesus, through the type of the apostles and of the ship, brings the Church, delivered from the shipwreck of persecution, across to the shore, and makes it rest in a most tranquil harbor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
