[[commentary]]
quote='''
He truly bore our sicknesses and sins, and suffers pain for us, not in seeming, that is, τὸ δοκεῖν, as an old and a new heresy suppose; but he was truly crucified. He truly suffered pain, saying in the Gospel: My soul is sorrowful even unto death (Matt 26:38). And: Now my soul is troubled (John 12:27). And we thought him unclean, or in pain, as the Seventy translated; for which Aquila and Symmachus put leprous, Theodotion scourged. This, in other words, by Hebrew idiom is understood as leprosy, according to what is written in the psalm: And the scourge shall not come near your tent (Ps 90 [91]:10). And the sense is: We thought him struck by God for his own sins, he who was humbled for our sake and crucified with robbers. Where Symmachus translated Ἐν ἁφῇ ὄντα, that is, in leprosy, Aquila put ἁφημένον, that is, leprous; which many, not understanding, take to mean abandoned, and others read καθήμενον, that is, sitting.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
