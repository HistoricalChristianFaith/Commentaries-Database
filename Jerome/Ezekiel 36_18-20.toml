[[commentary]]
quote='''
On which account God pours out his indignation upon them for the blood of the prophets and the righteous which they shed upon the land — as the Savior says in the Gospel: Jerusalem, Jerusalem, you who kill the prophets and stone those who have been sent to you, and again: Amen, amen I say to you: the blood which has been shed shall be required of this generation, from the blood of Abel the righteous up to the blood of Zechariah the son of Barachiah, which they shed between the altar and the temple —; and not only did they shed blood, but they also defiled the land with their crimes; for which reason he scattered them, whether under the Babylonian captivity or under the Roman, when they truly shed the blood of Christ; and they were winnowed into the lands as chaff is winnowed, and judged according to their ways and their most evil inventions, so that among the nations too, to which they had been led captive, they defiled the holy name of God, because all the nations said in mockery: 'Behold, this is the people of God, which boasted that it properly knew the worship of God'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
