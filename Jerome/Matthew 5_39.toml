[[commentary]]
quote='''
Mystically interpreted; When we are smitten on the right cheek, He said not, offer to him thy left, but the other; for the righteous has not a left. That is, if a heretic has smitten us in disputation, and would wound us in a right hand doctrine, let him be met with another testimony from Scripture.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And there was a likeness of palms on this side and on that: elegantly, in the interior of the temple and in the Holy of Holies, he did not put 'right and left', lest he seem to say anything sinister in things that are great and secret, but 'on this side and on that' — according to what is written in the Gospel: Whoever strikes you on the right cheek, offer him the other also. Could he not have said 'and the left'? But when the right is struck, another right is offered, because in a holy man both are right, both are perfect —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
