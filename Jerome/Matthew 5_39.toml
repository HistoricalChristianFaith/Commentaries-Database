[[commentary]]
quote='''
Mystically interpreted; When we are smitten on the right cheek, He said not, offer to him thy left, but the other; for the righteous has not a left. That is, if a heretic has smitten us in disputation, and would wound us in a right hand doctrine, let him be met with another testimony from Scripture.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And there was a likeness of palms on this side and on that: elegantly, in the interior of the temple and in the Holy of Holies, he did not put 'right and left', lest he seem to say anything sinister in things that are great and secret, but 'on this side and on that' — according to what is written in the Gospel: Whoever strikes you on the right cheek, offer him the other also. Could he not have said 'and the left'? But when the right is struck, another right is offered, because in a holy man both are right, both are perfect —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
If anyone strikes you on your right cheek, offer him the other too; and to him who wishes to contend with you in judgment and take your tunic, let him have your cloak as well. The man of the Church is described, the imitator of him who says: Learn from me, for I am meek and humble of heart; and who, struck with a slap, proves his promise: If I have spoken evil, rebuke me; but if well, why do you strike me? David too said something of the kind in the psalm: If I have repaid with evils those who repaid me; and Jeremiah in the Lamentations: It is good for a man when he has sat from his youth; he will give his cheek to the one who strikes him, he will be filled with reproaches. This is against those who think there is one God of the law and another of the Gospel, since meekness is taught both there and here. According to the mystical understanding, when our right cheek is struck we are commanded to offer not the left but the other, that is, the other right one. For the just man has no left. If a heretic strikes us in disputation and wishes to wound a right doctrine, let another testimony from the Scriptures be set against him, and let us offer to the one who strikes us right cheeks succeeding one another, until the anger of the enemy grows weary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
For when the right hand is spoken of and the left is not named, in place of the left the side is named. For it could not be just that the just man should have a left hand. "Whoever," he says, "strikes you on the right cheek, offer him the other as well." He did not say, "and the left": for it is not a left cheek that is offered, but another right one. Therefore I say plainly that the just man has two right hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_020.html'
source_title="Homily 20, on Psalm 90"

[[commentary]]
quote='''
But it can also be understood otherwise: that the heretical or adverse powers, through the dogmas of the heretics, have aimed their blasphemies, and desire to deceive my just ones with varied fraud. For they are archers who, through the occasion of their darkness — which they understand as hidden mysteries — wish to strike the upright hearts of the just. Therefore I and my saints must migrate to the sublime testimonies of the Scriptures, as it is also written in the Gospel: "If he strike you on the right cheek, offer him the other also." He does not say, offer him the left, but the other — that is, the other right — because the just man has nothing left-handed in himself. If, he says, he confounds you in one testimony of the Scriptures, do you overcome him from another, and fulfill that which is written in another psalm: "Deep calls to deep at the voice of your cataracts": so that each Testament may be a defense to the other in turn, and in such a way the snare of the heretics may be broken by the opposing of the other right hand, and by migration to the mountains, and by the calling of deep to deep.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_060.html'
source_title="Homily 60, on Psalm 10 (Alternate Series)"

[[commentary]]
quote='''
A thousand shall fall at your side, and ten thousand at your right hand. "At your side" and "at your right hand." He did not say, "at your left," because the just man has no left, just as it is written in the Gospel: "Whoever shall strike you on the right cheek, offer him the other also." He did not say, "offer the left"; since indeed the lambs shall stand at the right, and the kids at the left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_068.html'
source_title="Homily 68, on Psalm 90 (Alternate Series)"
