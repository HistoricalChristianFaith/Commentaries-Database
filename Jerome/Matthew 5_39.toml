[[commentary]]
quote='''
Mystically interpreted; When we are smitten on the right cheek, He said not, offer to him thy left, but the other; for the righteous has not a left. That is, if a heretic has smitten us in disputation, and would wound us in a right hand doctrine, let him be met with another testimony from Scripture.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And there was a likeness of palms on this side and on that: elegantly, in the interior of the temple and in the Holy of Holies, he did not put 'right and left', lest he seem to say anything sinister in things that are great and secret, but 'on this side and on that' — according to what is written in the Gospel: Whoever strikes you on the right cheek, offer him the other also. Could he not have said 'and the left'? But when the right is struck, another right is offered, because in a holy man both are right, both are perfect —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
If anyone strikes you on your right cheek, offer him the other too; and to him who wishes to contend with you in judgment and take your tunic, let him have your cloak as well. The man of the Church is described, the imitator of him who says: Learn from me, for I am meek and humble of heart; and who, struck with a slap, proves his promise: If I have spoken evil, rebuke me; but if well, why do you strike me? David too said something of the kind in the psalm: If I have repaid with evils those who repaid me; and Jeremiah in the Lamentations: It is good for a man when he has sat from his youth; he will give his cheek to the one who strikes him, he will be filled with reproaches. This is against those who think there is one God of the law and another of the Gospel, since meekness is taught both there and here. According to the mystical understanding, when our right cheek is struck we are commanded to offer not the left but the other, that is, the other right one. For the just man has no left. If a heretic strikes us in disputation and wishes to wound a right doctrine, let another testimony from the Scriptures be set against him, and let us offer to the one who strikes us right cheeks succeeding one another, until the anger of the enemy grows weary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
