[[commentary]]
quote='''
If the word of God were always in the prophets and had a constant lodging in their breast, Ezekiel would never so often set down: 'And the word of the Lord came to me, saying'; but it was because, on account of human frailty and the necessities of this life, it at times withdrew from them; therefore John the Baptist says: He who sent me to baptize, he said to me: He on whom you see the Holy Spirit descending in the form of a dove and remaining in him, he it is — for what is added, And remaining in him, would never be something proper to Christ, unless it sometimes withdrew from others —; besides, God also says to Moses: I will take away from the spirit that is in you — which he certainly would not have had unless it had descended to him from the Lord —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
