[[commentary]]
quote='''
That upon you may come all the just blood that has been shed upon the earth, from the blood of Abel the just to the blood of Zechariah son of Barachiah, who was killed between the temple and the altar. Amen I say to you, all these things will come upon this generation. Concerning Abel there is no ambiguity that he is the one whom Cain his brother killed. That he was just is proved not only from the Lord's present judgment but from the testimony of Genesis, where his gifts are related as accepted by God. We ask who this Zechariah son of Barachiah is, since we read of many Zechariahs. And lest a free license for error be granted us, there is added: Whom you killed between the temple and the altar. I have read different things in different writers, and I ought to set down the opinions of each. Some say it is Zechariah son of Barachiah, who is the eleventh among the twelve prophets, and the name of the father agrees in his case; but where he was killed between the temple and the altar Scripture does not say, especially since in his times there were scarcely even ruins of the temple. Others want it understood as Zechariah the father of John, proving from certain dreams of the apocrypha that he was killed because he had preached the coming of the Savior. This, because it has no authority from the Scriptures, is despised with the same ease with which it is proved. Others will have this to be the Zechariah who was killed by Joash king of Judea between the temple and the altar, as the history of Kings relates. But it must be observed that that Zechariah is not the son of Barachiah but the son of Jehoiada the priest. Hence Scripture also relates: Joash did not remember the good things that Jehoiada his father had done for him. Since, then, we have both the Zechariah and a place of killing that agrees, we ask why he is called the son of Barachiah and not of Jehoiada. Barachiah in our language means blessed of the Lord, and the justice of the priest Jehoiada is shown by his Hebrew name. In the Gospel which the Nazarenes use we find written son of Jehoiada in place of son of Barachiah. The simpler brethren, among the ruins of the temple and of the altar, or at the exits of the gates that lead to Siloam, point out red stones and think they were stained with the blood of Zechariah. We do not condemn the error, which comes down from hatred of the Jews and from the piety of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
