[[commentary]]
quote='''
The Lord sends away the multitude, and enters the house that His disciples might come to Him and ask Him privately of those things which the people neither deserved to hear, nor were able.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then, having dismissed the crowds, he came into the house. And his disciples came to him, saying: Explain to us the parable of the darnel of the field. Jesus dismisses the crowds and returns home, so that the disciples may come to him and ask in secret what the people neither deserved to hear nor were able to. Explain to us the parable of the darnel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
