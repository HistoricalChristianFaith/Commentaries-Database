[[commentary]]
quote='''
Hence the Lord is not ignorant of the princes of perverse dogmas, nor of the people; not that they are worthy of his knowledge, but that nothing escapes him of what they do in secret, of whom some have deceived and others have been deceived. Nor will they give their thoughts to repent, they who are always advancing in perdition. For the spirit of fornication with which they played the harlot in the Church and departed from the true marriage moves in their midst; therefore they have not known the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
