[[commentary]]
quote='''
And what he says: I will strike them according to the report of their assembly, can also mean this: just as by a common counsel they all fashioned idols, so, when I am angered, they will all be laid waste together. The teachers of contrary dogmas, who have abandoned Christ, the Wisdom, and have gone out from the Church, we can rightly call a foolish and heartless dove, since, desiring earthly things, they have been handed over to the Assyrians. And when they have set out from the Church, the Lord spreads his net, woven from the testimonies of the Scriptures and the skilful discourse of wisdom, so as to bring down to low places those who lift themselves up against the knowledge of God and, like a bird, fly to the heights; and to correct them by threats and by the hearing of punishments, so that, corrected, they may not perish for ever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
