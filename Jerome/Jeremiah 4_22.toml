[[commentary]]
quote='''
And the Lord himself through the prophet: The leaders of my people have not known me; they are foolish sons, and without understanding; they are wise to do evil, but to do good they have not known. They were indeed called my leaders, he says, and leaders of my people, but because they did not know me, and destroyed the name by their deeds, therefore they are foolish sons and without understanding; they have prudence only to this end, that they may subject the simple flock to themselves and trample it under their feet; but to do good and to rule the people they have not known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
For my foolish people has not known me. They are unwise sons and senseless; they are wise to do evil, but to do good they have not known. The cause of the destruction, the devastation, the flight, the trumpet: that the people has become foolish, not by nature but by the bent of its will. And this very folly is proved from this, that they did not know God; and instead of wise sons they have become foolish sons and senseless. For what greater folly can there be than that, while the ox knows its owner and the ass its master's crib, Israel should not know the Lord and should despise him when present, whom it always desired to see? And as for what is added: they are wise to do evil, but to do good they have not known, here wisdom is to be taken for wickedness, in accordance with which the sons of this age too are wiser than the sons of light, and the steward of iniquity is said to have done certain things wisely, and the serpent in paradise is read to have been more prudent than all the beasts. That, then, is true wisdom which is joined to the fear of God; otherwise, where there are snares and evasion, it is to be called not wisdom but cunning and craftiness. For what we said: for my foolish people has not known me, the Seventy translated: for the princes of my people have not known me, so that the fault is rather the teachers' than that of the people, which does not have the knowledge of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
