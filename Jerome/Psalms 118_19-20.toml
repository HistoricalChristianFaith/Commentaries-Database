[[commentary]]
quote='''
Which are the gates that are opened by the angels, so that there may enter, not the people of the Jews, which has been cast off, but the righteous nation, which from faith has received the name of the faithful? Surely those of which the holy man speaks: Open to me the gates of righteousness; having entered them, I will confess to the Lord (Ps 117 [118]:19). But no one will be able to enter these gates except one who has been freed from the gates of death, as the Psalmist said: You who lift me up from the gates of death, that I may declare all your praises in the gates of the daughter of Zion (Ps 9:15). For when we have been snatched from the gates of death, then we shall be able to sing all the praises of the Lord in the gates of the daughter of Zion. And as I consider the gates of death to be sins, of which it is said to Peter: The gates of hell shall not prevail against you (Matt 16:18), so I consider the gates of righteousness to be all the works of the virtues; and he who has entered them will find one gate, of which it is said: This is the gate of the Lord, the righteous shall enter by it (Ps 117 [118]:20). And as through many pearls one comes to the one pearl, so through many ways and gates we come to him who says that he is the way and the gate, through which we enter to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
