[[commentary]]
quote='''
For you have heard of my conduct formerly in Judaism: that beyond measure I persecuted the Church of God, and fought against it; and I advanced in Judaism beyond many of my contemporaries in my race, being more abundantly a zealot for the traditions of my fathers.

This narrative is of very great profit to the Galatians: how Paul, once the ravager of the Church and the fiercest defender of Judaism, was suddenly converted to the faith of Christ. And this at the time when the Crucified was first being proclaimed in the world, when the new doctrine was being driven from the bounds of the whole earth by both the Gentiles and the Jews. For they could say: If he who from an early age was trained in the disciplines of the Pharisees, who surpassed all his contemporaries in the Jewish tradition, now defends the Church which he once persecuted most vehemently, and would rather have the grace and newness of Christ with the ill will of all than the oldness of the Law with the praise of many, what ought we to do, who have begun to be Christians out of heathenism?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
But to this very day those who understand the Scriptures in a Jewish sense persecute the Church of Christ and lay it waste, corrupted not by zeal for the Law of God but by the traditions of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
