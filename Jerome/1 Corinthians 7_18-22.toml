[[commentary]]
quote='''
And the blessed Apostle, disputing of virginity and continence and marriage, threw in, in the midst: Was anyone called circumcised? Let him not draw on a foreskin. Was he called in foreskin? Let him not be circumcised (1 Cor 7:18). This seems to me to say in other words: Has he been called without a wife, and believed? let him not take a wife. Or on the contrary: having a wife, has he believed in Christ? let him by no means make a divorce. And he keeps this sense not only in circumcision and foreskin, but in freedom and slavery, so as to call virgins and the continent free, and slaves those who render the debt to a wife. For it is not in our power to draw on a foreskin after circumcision, as those in the book of Maccabees are said to have made foreskins for themselves: which is said of the sons being born, and not of the fathers. Or he who has been called free is rather the slave of Christ (ibid. 7:22), since in the baptism of Christ there is no difference of Jew, pagan, Greek and Barbarian, man and woman, free and slave.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
