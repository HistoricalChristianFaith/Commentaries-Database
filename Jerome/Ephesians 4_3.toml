[[commentary]]
quote='''
Careful to keep the unity of the spirit in the bond of peace. One body and one spirit, as you also have been called in one hope of your calling.

To the Ephesians, who had already attained the unity of the Holy Spirit, it is rightly said: careful to keep the unity of the spirit in the bond of peace. For he who has something is enjoined to be careful to keep it; but he who does not have it is commanded to be zealous that he may be able to have it. This passage tells above all against the heretics, who, though the bond of peace has been torn apart and corrupted, think that they hold the unity of the spirit, whereas the unity of the spirit is preserved in the bond of peace. For when we do not all say the same thing, and one says, I am of Paul, I of Apollos, I of Cephas (1 Cor. 1:12), we divide the unity of the spirit and tear it into parts and members. Nor let anyone at once object: How then are the graces different, and the gifts various, if the unity of the spirit is to be guarded? There are indeed varieties of gifts, but in the same spirit; and different ministries, but the same Lord; and manifold operations, but the same God who works all things in all (1 Cor. 12:4 ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
