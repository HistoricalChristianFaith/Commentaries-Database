[[commentary]]
quote='''
Idolatry of this kind existed in Israel, the women especially worshipping Baal-peor for the size of his obscene member, whom we can call Priapus. Hence also King Asa took away the high places from the people, and priests of this kind, and deposed his mother from her august rule, as Scripture testifies, saying: And Asa did what was right in the sight of the Lord, as David his father, and he took away the effeminate from the land, and he purged all the filth of the idols which his fathers had made. Moreover he also removed Maacah his mother, so that she should not be chief in the rites of Priapus and in his grove which she had consecrated; and he overturned its cave, and broke the most foul image, and burned it in the brook Kidron. But the high places he did not take away; nevertheless the heart of Asa was perfect before God all his days.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
