[[commentary]]
quote='''
And if they say to you: where shall we go forth?, you will say to them: thus says the Lord: those for death, to death, and those for the sword, to the sword, and those for famine, to famine, and those for captivity, to captivity! And I will visit upon them four kinds, says the Lord: the sword for slaying, and dogs for tearing, and the birds of the sky and the beasts of the earth for devouring and scattering. The prophecy of Ezekiel also shows four plagues to which the people of the Jews was handed over: the sword, pestilence from famine, beasts, captivity. Among the beasts, moreover, understand the dogs and the birds as well, to which they were handed over for their bodies to be torn and devoured and scattered. For it could not happen that, once the Creator was neglected, the whole creation should not rise up against sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
