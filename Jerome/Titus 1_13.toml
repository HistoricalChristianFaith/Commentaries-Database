[[commentary]]
quote='''
Therefore rebuke them, he says, sharply: for they are liars, and evil beasts, and idle bellies; who persuade men of falsehoods, who after the manner of wild beasts thirst for the blood of those they deceive, and do not eat their own bread working in quietness; whose god is their belly, and their glory is in their shame; and rebuke them, that they may be sound in the faith. Of this soundness of faith he speaks also in what follows: that the old men be sober, honorable, chaste, sound in faith, and in love, and in patience; and after the likeness of faith, soundness is also ascribed to doctrine. "There will be", he says, "a time when they will not acquiesce in sound doctrine". There are also words of soundness, of which he speaks to Timothy in the first Epistle: "If anyone teaches otherwise, and does not acquiesce in the sound words of our Lord Jesus Christ, and in the doctrine which is according to piety" (1 Tim. 6:3). And in the second: "Having a pattern of sound words which you have heard from me" (2 Tim. 1:13).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
