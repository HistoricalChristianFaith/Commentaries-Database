[[commentary]]
quote='''
What is this fortified city? Hell, where they are shut in, from which it is not permitted to go out. And truly from this city no other victor came out except the Lord. And truly this city is fortified. Moses could not come out of this city. And Jacob likewise entered into this city, and did not return. Do you wish to know that he did not return? In fine, he says to his sons: "Mourning I will descend to the netherworld." But he descended to the netherworld, because paradise had not yet been opened by the thief. This city is fortified against going out, but it is open for entering in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_034.html'
source_title="Homily 34, on Psalm 107"
