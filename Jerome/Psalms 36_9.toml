[[commentary]]
quote='''
The Light of the Father is Christ. In Christ we will see the light of the Holy Spirit in the light of the Father.
'''
source_url=''
source_title="BRIEF COMMENTARY ON PSALM 36"

[[commentary]]
quote='''
Before that morning star which is seen in the world, the true light was begotten. Hence he says in another passage of the psalm: "In your light we shall see light." The speech is to the Father: O Father, in the light of the Son we shall see the light, the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_036.html'
source_title="Homily 36, on Psalm 109"
