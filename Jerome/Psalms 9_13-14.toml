[[commentary]]
quote='''
We often read in the Scriptures of double gates, of death and of life, of vices and of virtues, as in that place in the psalms: You who lift me up from the gates of death, that I may announce all your praises in the gates of the daughter of Zion. There is no doubt that he signifies the Church: the lofty Mount Zion, and the city of the living God, the heavenly Jerusalem, and the multitude of angels, and the Church of the firstborn, who are written in heaven. He who has been lifted up in the gates of Zion will not be able to fear the gates of death, of which the Lord spoke to Peter: Upon this rock I will build my Church, and the gates of hell shall not prevail against it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
