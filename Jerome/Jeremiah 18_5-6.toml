[[commentary]]
quote='''
And at once the Lord says to the prophet: 'If a potter,' he says, 'has this power, that from the same clay he makes again what had been broken, shall I not be able to do this in you, who, as far as lies in you, seem to have perished?'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
