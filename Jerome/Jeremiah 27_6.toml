[[commentary]]
quote='''
We have long felt that God is angry, yet we do not try to appease him. It is our sins that make the barbarians strong. It is our vices that vanquish Rome's soldiers. As if there were here too little material for carnage, civil wars have made almost greater havoc among us than the swords of foreign foes. Miserable must those Israelites have been compared with whom Nebuchadnezzar was called God's servant. Unhappy too are we who are so displeasing to God that he uses the fury of the barbarians to execute his wrath against us. Still, when Hezekiah repented, 185,000 Assyrians were destroyed in one night by a single angel. When Jehosaphat sang the praises of the Lord, the Lord gave his worshiper the victory. Again, when Moses fought against Amalek, it was not with the sword but with prayer that he prevailed. Therefore, if we wish to be lifted up, we must first prostrate ourselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_060.html'
source_title="LETTER 60.17"

[[commentary]]
quote='''
Now therefore I have given all these lands into the hand of Nebuchadnezzar, king of Babylon, my servant; and moreover I have also given him the beasts of the field, that they may serve him. And all the nations shall serve him and his son and his son's son. Of what great unhappiness is Israel, when in comparison with it Nebuchadnezzar is called 'servant of God'! It is written in the Gospel: the world was made through him, and the world did not know him; he came to his own, and his own did not receive him. Rightly therefore does the Creator hand over his creation to whom he will. Finally the devil too, as whose type Nebuchadnezzar went before, confesses: all these things have been handed over to me. And as for what he added: moreover I have also given him the beasts of the field, that they may serve him, either we ought simply to understand every kind of living creature — for together with man the things subject to him are also handed over — or certainly let us take the 'beasts' as the savage nations, because even those serve which before had not known how to serve.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
