[[commentary]]
quote='''
And what follows: Who are you, O great mountain, before Zerubbabel? Into a plain!; they understand it as said to the devil, who stood at the right hand of Joshua to oppose him, and lifted himself up against Zerubbabel and the people of the Jews. But he has been turned into a plain and humbled, and he lies under the feet of Israel, because God shall bring out the chief stone, Christ his Son, who was always a help to the people of Israel. And his grace, that is, the grace of the stone, toward those whom he brought back from captivity, shall make equal the grace which he always exercised toward their fathers. This we have found said by the Hebrews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
But most of our writers interpret the mountain as the devil, and the Antichrist, who dares to stand before Zerubbabel, from whom Christ was to be born, and to raise himself up, and to say in the Gospel: All these things have been delivered to me, and I will give them to you, if you will fall down and worship me. And the Lord, laying him low under his feet, and making him humble instead of proud, and cast down, says: Get behind, Satan; for it is written: You shall worship the Lord your God, and him only shall you serve. And they give as an example in the Gospel the lunatic, whom the apostles had not been able to heal; they ask why they could not heal him, and they hear: Amen I say to you, if you have faith like a grain of mustard seed, you will say to this mountain: Pass from here, and it will pass; and nothing will be impossible to you. But this kind is not cast out except by prayer and fasting. There the mountain is plainly taken to mean the devil. But others, with no small rashness, refer what is plainly said of the devil to Christ, who in the holy Scriptures is quite often called a mountain. Nor is there any need to give examples, of which there is a great abundance. They are led into this error because it is written in the Seventy: Who are you, O great mountain, before the face of Zerubbabel, that you should set right? Namely, that this mountain which is before the face of Zerubbabel, that is, which descends from the stock of Zerubbabel, would himself set the world right, and that what follows is about him: I will bring out the stone of inheritance, of which it is written: It is you who will restore my inheritance to me. And in another place: He chose for us his inheritance, the beauty of Jacob whom he loved. And again: Jacob became the portion of the Lord, Israel the cord of his inheritance. And in Psalm 2: The Lord said to me: You are my Son, today I have begotten you. Ask of me, and I will give you the nations for your inheritance. But God shall bring out the chief stone, of which we read: In the beginning was the Word, and the Word was with God, and the Word was God, and: All things were made through him, and without him nothing was made. And what he says: He shall make equal the grace of its grace, signifies this: Of his fullness we have all received, and grace for grace, that is, for the grace of the law, the grace of the Gospel, so that both those who believe from Israel and the people of the heathen may receive an equal grace and a like gift. Hence Gabriel too says to Mary: You have found grace with the Lord. And the apostle Paul writes: For by grace you have been saved; and John the evangelist: The law, he says, was given through Moses; grace and truth came through Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
