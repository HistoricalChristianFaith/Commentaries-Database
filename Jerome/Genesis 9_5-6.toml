[[commentary]]
quote='''
Therefore what is said to Noah: And the blood of your souls I will require at the hand of all the beasts, and at the hand of man, and at the hand of his brother I will require the soul of man; whoever sheds the blood of man, for his blood shall his blood be poured out, is both ridiculous to believe of the resurrection and cannot hold in this life. For how many have shed blood, and their own blood has not been poured out? And others have killed a man by poison, or by hanging, and yet, though the man is dead, has blood been poured out? How then is the Lord going to pour out their blood in retaliation, when he who killed did not pour out blood? The blood of a man, therefore, must be understood as τὸ ζωτικὸν αἶτος, that is, the vital principle, by which he is quickened and sustained and lives; and whoever has poured this out, whether by a stumbling block or by perversity of doctrine, will have it poured out from him on the day of judgment, that is, he will be forced to lose what he seemed to himself to have as his vital principle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
