[[commentary]]
quote='''
This is what is said in another place: "From my hidden faults cleanse me, and from those that are alien spare thy servant." Alien to thee, which the devil sends in. And what follows? "If they shall not have had dominion over me, then shall I be blameless." If evil thoughts do not overcome me, then shall I be clean in thy sight. And what follows immediately? "And I shall be cleansed from the greatest offense." See what he says. If the thought does not overcome me and does not carry me through to the deed, I am freed from a great sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_009.html'
source_title="Homily 9, on Psalm 75"

[[commentary]]
quote='''
And therefore I say: "From my hidden faults cleanse me, and from those of others spare your servant." From those of others. It is not mine, that which I bring to birth: I do not want to think evil things, and I think them: I do not want to think evil, and as though unwilling and captive I am dragged into an evil thought. But since it is not in my power either to think or not to think the things that are evil, therefore I say: These things indeed that come into my heart are another's: but since a kind of necessity is imposed upon me, therefore I say, From my hidden faults cleanse me. The sins indeed are another's: but because I take them up, therefore I say, In the sins of others spare me your servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_039.html'
source_title="Homily 39, on Psalm 114"
