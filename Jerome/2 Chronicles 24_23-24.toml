[[commentary]]
quote='''
In the book of Days (2 Chr 24) the history relates that when the year was completed the army of Syria went up against Joash king of Judah, and came into Jerusalem, and slew all the princes of the people, and sent all the spoil to the king of Damascus; it had come with few men, and God had delivered into their hand a very great multitude, because they had forsaken the Lord God of their fathers. This must be considered according to the anagogy and as a type of things to come, whether we may refer it to the time of the Lord's advent. For after the end of the acceptable year, in which the Gospel was preached by the Savior, the army of the nations went up from Damascus with few men against Judah and Jerusalem, who had forsaken the Lord; and they carried off all their riches of the Law and the Prophets, and sent them to the king of Damascus: namely, churchmen and men of the Gospel teaching, who, in comparison with the whole world, still unbelieving at that time, and with the Jews scattered through the whole earth, were few; and yet the Lord delivered Jerusalem into their hands, because they had forsaken the Son of God, who had been foretold beforehand through the prophets (Acts 9). Therefore I think that for this reason Saul too, who afterwards received the name of Paul from his virtue, went to Damascus because he was a zealot of the Law, and wished to fight against the believers from the nations; and that, overcome there, he followed those who lived in Damascus, so that from there he might go up again to Jerusalem to do battle with the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
