[[commentary]]
quote='''
Yet such is the order of nature. While truth is always bitter, pleasantness waits upon evildoing. Isaiah goes naked without blushing, as a type of the captivity to come. Jeremiah is sent from Jerusalem to the Euphrates (a river in Mesopotamia) and leaves his girdle to be marred in the Chaldaean camp, among the Assyrians hostile to his people. Ezekiel is told to eat bread made of mingled seeds and baked over the dung of people and cattle. He is commanded to experience the death of his wife without shedding a tear. Amos is driven from Samaria. Why is he driven from it? Surely in this case, as in the others, because he was a spiritual surgeon who cut away the parts diseased by sin and urged people to repentance. The apostle Paul says, "Am I therefore become your enemy because I tell you the truth?" And so the Savior found it, from whom many of the disciples turned back from following him because his sayings seemed hard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_040.html'
source_title="LETTER 40.1"

[[commentary]]
quote='''
Thus says the Lord to me: Go and get yourself a loincloth — or girdle — of linen, and you shall put it upon your loins, and you shall not bring it into water — or it shall not pass through water —! And I got the loincloth according to the word of the Lord and put it about my loins. And the word of the Lord came to me a second time, saying: Take the loincloth — or girdle —, which you have got, which is about your loins, and arise, go to the Euphrates and hide it there in a cleft of the rock! And I went and hid it in the Euphrates, as the Lord had commanded me. And it came to pass after very many days, the Lord said to me: Arise, go to the Euphrates and take from there the loincloth — or girdle —, which I commanded you to hide there! And I went to the Euphrates and dug and took the loincloth from the place where I had hidden it; and behold, the loincloth — or girdle — had rotted, so that it was fit for no use. And the word of the Lord came to me, saying: Thus says the Lord: So will I make the pride — or injury — of Judah rot, and the great pride of Jerusalem, and this most wicked people, who refuse to hear my words and walk in the perversity — or in the direction — of their most wicked heart, and have gone after strange gods, to serve them and to worship them; and they shall be like this loincloth, which is fit for no use. For as the loincloth clings to the loins of a man, so I glued to myself the whole house of Israel and the whole house of Judah, says the Lord, that it might be to me for a people and for a name and for praise and for glory; and they did not hear. The girdle or loincloth, which is joined to the loins of God, is the people of Israel, which, taken up from the earth in the likeness of flax and unwashed, had neither softness nor whiteness, and yet through his mercy clung to God. And when it had sinned — for linen and a loincloth of this kind is rational —, it was led across the Euphrates, that is, to the Assyrians, and there it is hidden, that is, in a manner swallowed up by the multitude of great and innumerable nations and reckoned as nothing. But after a long time the prophet himself, as a type of God, frees the people from captivity. And this people nevertheless, even after the return, did not keep the precepts of God, but, following strange gods, at the last even laid hands on the Son of God and wasted away in eternal perdition. Every holy man too is a loincloth of God, who, taken up from the earth and from the clay of the earth, is joined in fellowship with God and, in a manner, covers and girds with greater diligence the things in his Church that seem shameful, lest they lie open to the bites of the Gentiles and the heretics. This loincloth, if it touches water and crosses the streams of the Euphrates, so as to be soaked with the moisture of the Assyrian region, loses its former strength and rots and falls apart; and although it returns to the use of God, yet it cannot have its former beauty, not through the harshness of God but through its own fault, because they refuse to hear his words and walk in the perversity of their heart, or what seems right to them, this they do. But the divine word itself also explains why it set forth this likeness, saying: 'For as the loincloth clings to the loins of a human being, so I glued and made to cling to me the whole house of Israel and the whole house of Judah' — namely the ten and the two tribes —, 'that it might be to me for a people named and for praise and for glory; and for all these things they did not hear me, but followed their own vices'. Let him therefore beware who can say: But for me it is good to cling to God, lest perhaps through negligence he be separated from his loins and cross the Euphrates and be given into the power of the king of Assyria, and be lodged by no means in the most solid rock but in a cleft of a rock corrupted and vitiated, that is, in the filth and vices of the heretics, and come into such rottenness that he can no longer return to the use of the Lord and to being his girdle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
The Lord has reigned, and he has clothed himself with the patriarchs and the prophets and the believing people. He has clothed himself in beauty: the patriarchs and the prophets were as it were the garment of Christ. That is the loincloth which is written of in Jeremiah: that is the loincloth which Jeremiah had about his loins. Do you wish to know that the saints are, as it were, a loincloth, the garment of God? Afterwards God himself speaks to Jeremiah: 'Just as you,' he says, 'placed that loincloth about your loins, so I too have joined my people to myself.' As, then, a garment is about a man, so the people is about God. But because this loincloth, because this beauty with which the Lord had been clothed, was exposed across the Euphrates in a cleft of the rock, and there rotted away, and was led off into captivity by the Assyrians—what does the Lord do? He is not naked, he cannot be without a loincloth, he cannot be without a garment: the former people having been lost, he makes himself a garment out of the people of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_026.html'
source_title="Homily 26, on Psalm 98"

[[commentary]]
quote='''
Do you wish to know how we clothe the Lord? We read in Jeremiah: 'Take unto thee, he says, a girdle, and go, he says, to the Euphrates, and put it in a hole of the rock. And I did, he says, what the Lord had commanded me. And after some days I returned to the Euphrates, and behold, he says, the girdle had rotted, so that it was fit for no use. And the Lord spoke, he says, to me'. Attentively take heed. 'As, he says, thou hadst a girdle about thy loins, so also I had this people about me, saith the Lord'. Why have I said all this? To show that believers are the garment of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_045.html'
source_title="Homily 45, on Psalm 132"
