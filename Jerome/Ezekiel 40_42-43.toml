[[commentary]]
quote='''
And as for the four tables that are brought in, built of squared stones, and these too for the sacrifice of the holocaust: these are the living stones which roll upon the earth and have with them the cornerstone by which the walls of the old and the new Testament are held together; and the number four shows the mysteries of the Gospel; having in length and breadth one cubit and a half, that is, in a square, which joined together make three cubits, and these three cubits have one cubit in height, so that the measure of one cubit, that is, of the divine majesty, may preserve the mysteries of the Trinity, as the Lord says to his disciples: Go, baptize all nations in the name of the Father, and of the Son, and of the Holy Spirit: and the name of God is, as it were, the one cubit of height, which embraces three properties and always takes up the holocausts of our offerings; and upon these four tables of the holocausts, built of living stones, whose length and breadth and height have been described, are put the vessels in which is sacrificed the holocaust of the martyrs, of whom it is said: Precious in the sight of the Lord is the death of his saints, and the victims of those who by continence and holiness of body sacrifice their souls to the Lord; and I think the names of these tables are contained in the apostles Matthew and Luke and Mark and John; their rim, bent back inward from above, went round the edges round about, so as to hold the holocausts within and not allow them to flow everywhere, and to hold the flesh of the oblation; or, as the Seventy translated: And the tables themselves were covered above, because of the violence of the rains and the excessive drought of the summer sun, so that the flesh placed upon them may say with the prophet: By day the sun shall not burn us, nor the moon by night, of which the one dissolves the offerings with excessive rains and storms of tribulations, the other makes whatever has been offered dry up in the fierce heat of persecutions. Pardon, reader, the difficulty of the passages, or, if you can find something better, teach me: we gladly learn what we do not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
