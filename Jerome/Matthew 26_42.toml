[[commentary]]
quote='''
Or otherwise; He prays a second time that if Nineveh, or the Gentile world, cannot be saved unless the gourd, i. e. the Jews, be withered, His Father's will may be done, which is not contrary to the Son's will, who Himself speaks by the Prophet, I am content to do thy will, O God. (Ps. 40:8.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Again a second time he went away and prayed, saying: My Father, if this cup cannot pass unless I drink it, your will be done. A second time he prays that, if Nineveh cannot be saved otherwise than by the withering of the gourd, the will of the Father may be done, which is not contrary to the will of the Son, as he himself says through the prophet: To do your will, my God, I have willed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
