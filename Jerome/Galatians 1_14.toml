[[commentary]]
quote='''
And prudently, while narrating something else, he inserts that he had served not so much the Law of God as the ancestral traditions, that is, those of the Pharisees, who teach the doctrines and commandments of men (Matt. 15; Mark 7) and reject the Law of God in order to establish their own traditions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
And I advanced, he says, in Judaism beyond many of my contemporaries in my race, being more abundantly a zealot for the traditions of my fathers. Again he calls it an advance not in the Law of God, but in Judaism. And not beyond all, but beyond very many; and not beyond the old, but beyond his contemporaries; so as both to relate his zeal in the Law and to avoid boasting. And in mentioning the traditions of the fathers, not the commandments of the Lord, he showed both that he was a Pharisee of Pharisees, and that he had indeed had a zeal for God, but not according to knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
