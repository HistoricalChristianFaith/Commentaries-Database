[[commentary]]
quote='''
Our iniquities have turned these things aside, and our sins have withheld good from us. Therefore, if at any time the sea both oversteps its boundaries and the rain is held back, by no means has the hand of the Lord been shortened, so as not to do these things; but our sins have turned aside these things as they were coming to us, so that they went on to others who had not sinned. 'And they have withheld,' he says, 'the good that was already coming to us, according to that which is written according to the letter: I will command the clouds that they rain no rain upon it'. But we can take the early and the late rain as the law and the Gospel, and as the various callings from the first hour to the eleventh, in which one reward of eternal life is promised to the laborers of the vineyard.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
