[[commentary]]
quote='''
And these are the words of the book which Jeremiah the prophet sent from Jerusalem to the remnant of the elders of the exile, and to the priests, and to the prophets, and to all the people whom Nebuchadnezzar had carried over from Jerusalem into Babylon, after Jeconiah the king went out, and the lady — or the queen — and the eunuchs and the princes of Judah and Jerusalem — or from Jerusalem or the nobles — and the craftsmen from Jerusalem, by the hand of Elasah son of Shaphan and of Gemariah son of Hilkiah, whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon, into Babylon, saying: Thus says the Lord of hosts, the God of Israel, to all the exile which I carried over from Jerusalem into Babylon: Build houses and dwell, and plant gardens — or orchards — and eat their fruit! Take wives and beget sons and daughters; give wives to your sons and give your daughters to husbands, and let them bear sons and daughters; and multiply, and do not be few in number! And seek the peace of the city — or of the land —, to which I have carried you over, and pray for it to the Lord, for in its peace there will be peace for you! This letter, nay rather little book, of Jeremiah the prophet is sent into Babylon through Zedekiah's envoys, Elasah and Gemariah, to those who had been carried over by Nebuchadnezzar with Jeconiah and his mother, so that, taking the occasion of the royal embassy, the prophet might also accomplish his own work and admonish the exiled people of the things that had been commanded him by the Lord. And he said finely: Jeconiah the king went out, and the lady, the eunuchs and the princes of Judah and the rest, and: Thus says the Lord of hosts, the God of Israel, to all the exile which I carried over from Jerusalem into Babylon, so that they may be seen to have been carried over not by the power of the king of Babylon but by the will of the Lord. And the word of God is directed first to the elders, then to the priests, third to the prophets, fourth to all the people, so that the prophet's letter too might reach those who were being admonished according to the order of age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
