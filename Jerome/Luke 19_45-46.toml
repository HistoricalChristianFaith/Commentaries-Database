[[commentary]]
quote='''
And Jesus entered the temple of God and cast out all who sold and bought in the temple, and he overturned the tables of the money-changers and the chairs of those who sold doves, and he says to them: It is written: My house shall be called a house of prayer, but you have made it a den of robbers. Accompanied by the crowd of believers, which had spread its garments so that the colt might go with unhurt foot, Jesus enters the temple and casts out all who sold and bought in the temple, and he overturned the tables of the money-changers and scattered the chairs of those who sold doves, and he said to them, bringing forward testimony from the holy Scriptures, that his Father's house ought to be a house of prayer, not a den of robbers or a house of trade, as is written in another evangelist. And this must first be known: that, in accordance with the commands of the law, since the temple of the Lord was the most august in the whole world, and the people of the Jews flocked there from almost all regions, countless victims were sacrificed, especially on feast days, of bulls, rams and goats, while the poor, so as not to be without a sacrifice, offered young doves and turtledoves; and it often happened that those who had come from far away did not have victims. So the priests devised how they might make plunder of the people, and they sold all the animals that were needed for the sacrifices, so that they might both sell to those who did not have them and themselves receive back again what had been bought. This scheme of theirs was frequently defeated by the poverty of those who came, who lacked the means and not only had no victims but had not even the wherewithal to buy birds and cheap little gifts. So they also set up money-changers to lend money on security; but because it was commanded in the law that no one should take interest, and money lent at interest could be of no use when it brought no profit and sometimes lost the principal, they devised yet another trick: in place of money-changers to make collybists, a word whose proper sense the Latin language does not express. Among them collyba is the name for what we call sweetmeats or cheap little gifts, for example roasted chickpeas and raisins and fruits of various kinds. So, because the collybists who had lent the money could not take interest, in place of interest they took various kinds of goods, so as to exact in these things, which are bought with coins, what was not lawful in coin; as if Ezekiel had not guarded against this very thing, saying: You shall not take interest and increase. The Lord, seeing such trade, or robbery, in his Father's house, roused by the ardor of the spirit, according to what is written in Psalm 68 (69): The zeal of your house has eaten me up, made himself a whip of cords and cast so great a multitude of men out of the temple, saying: It is written: My house shall be called a house of prayer, but you have made it a den of robbers. For he is a robber, and turns the temple of God into a den of robbers, who pursues gain from religion, and whose worship is not so much the worship of God as an occasion for trade. So much according to the history. But according to the mystical senses Jesus daily enters his Father's temple and casts out all, bishops and presbyters and deacons as well as laymen and the whole crowd, from his Church, and holds those who sell and those who buy alike guilty of one crime; for it is written: Freely you have received, freely give. He also overturns the tables of the money-changers. Note that because of the avarice of the priests the altars of God are called the tables of money-changers. And he overturns the chairs of those who sell doves, who sell the grace of the Holy Spirit and do everything to devour the peoples subject to them, of whom it is said: Who devour my people like food of bread. According to the simple understanding, the doves were not on chairs but in cages, unless perhaps the dealers in doves sat on chairs, which is utterly absurd, because in chairs it is rather the dignity of teachers that is indicated, a dignity that is brought to nothing when it has been mixed with gain. What we have said of the churches, let each one understand of himself as well. For the Apostle Paul says: You are the temple of God, and the Holy Spirit dwells in you. Let there be no trade in the house of our heart, no commerce of selling and buying, no greed for gifts, lest Jesus enter angry and stern and cleanse his temple in no other way than by applying the whip, so that out of a den of robbers and a house of trade he may make a house of prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
