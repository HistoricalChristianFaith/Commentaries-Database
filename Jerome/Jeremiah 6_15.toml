[[commentary]]
quote='''
Were they confounded because they committed abomination? Nay rather, they were not confounded with confusion, and they knew not how to blush. This is to be read more closely according to the Hebrew. 'And though', he says, 'they have done such things, were they at all confounded? Did they at all blush in their crimes? Nay rather, they increased their contempt, and they knew not how to blush' — and he put 'knew not' here for 'would not' — 'or else, through excessive contempt and the vice of an ingrained evil, they could not even understand'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Therefore they will fall among those who fall; in the time of their visitation they will collapse, says the Lord. 'Since', he says, 'they knew not how to blush, and had not only not the deed but not even the knowledge and the sense of repentance, therefore those who formerly stood will fall among them; they will collapse through their own vices and, when the time of their visitation and punishment has come, they will be joined to all who fall'. And it is a great ungodliness not only not to guard against sins but not even to be willing to understand them, and to make no distinction between good and evil works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
