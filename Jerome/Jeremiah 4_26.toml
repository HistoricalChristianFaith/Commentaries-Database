[[commentary]]
quote='''
Carmel itself too, which overhangs the great sea, planted with olives and thick with shrubs and vines, will come to such desolation that it will have the waste of a wilderness; all the cities too will become deserted. And the cause of all these evils is this: that through the fault of the sinning people the wrath of the Lord has been roused. Whatever we have said according to the history of Jerusalem and Judea, let us refer to the Church of God when it has offended God and has been laid waste either by vices or by persecution, so that where once there was a choir of virtues and joy, there a multitude of sins and sorrows dwells.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
