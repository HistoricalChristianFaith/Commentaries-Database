[[commentary]]
quote='''
All the nations that did not know their Creator, or the whole race of mortals, are in comparison with God like a drop of a bucket, and like the tipping of a balance, which with a light weight inclines to one side. And just as, if a small drop flows from a bucket, it is disregarded by the one who carries it, so the whole multitude of the nations, compared with the heavenly ministries and the multitude of the Angels, is counted as nothing. The islands too are counted as spittle, or, as Symmachus and Theodotion have it, setting down the Hebrew word itself, as DOC (דק), which falls off: for which Aquila translated λεπτὸν βαλλόμενον. And the Hebrews say that this word signifies the finest dust, which, snatched up by the wind, is often thrown into the eyes and is felt rather than seen. The tiniest and almost invisible particles of dust, then, are called by this word: what perhaps Democritus with his Epicurus calls atoms. And there are many words which are read in the Greek just as they are set down in the Hebrew, because of the difficulty of translating, and because of the poverty of both the Greek and the Latin speech in comparison with the Hebrew language.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
