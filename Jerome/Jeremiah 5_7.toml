[[commentary]]
quote='''
On what ground shall I be able to be merciful to you? Your sons have forsaken me and swear by those who are not gods. I filled them, and they committed adultery, and in the house of the harlot they ran riot. They have become to me horses, lovers toward the females, and stallions; each one neighed after the wife of his neighbor. Shall I not visit for these things? says the Lord, and on such a nation shall not my soul take vengeance? A Katalogos [a catalogue] of the sins of Jerusalem, while God says that he does not know on what ground he could have mercy on her. 'The sons', he says, 'of yours have forsaken me: by no means mine, but yours, because they swear by those who are not gods. I filled them, and they committed adultery'. Let those hear this who, brooding over the riches they have received from the Lord, are slaves to luxury.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
