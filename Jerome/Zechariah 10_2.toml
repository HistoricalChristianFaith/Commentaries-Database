[[commentary]]
quote='''
Or else Israel itself, which was once deceived and held fast by the errors of idolatry, may understand that it worshipped idols in vain, and listened to the lies of diviners, and acquiesced in dreams, which Scripture commands us not to believe. And for this reason they were led like a flock into captivity, and afflicted, without God as their shepherd, because they did not have knowledge of the law. This whole place is obscure and doubtful, and the reader ought to pardon us if, in things that are ambiguous, we too walk with a hesitant step.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
[[commentary]]
quote='''
For all the idols, and the diviners and the dreamers, have spoken in vain, and comforted vainly. These things he says of the heretics, who under the Christian name understand neither what they are saying nor what they are affirming, and who give heed to erring spirits and to teachers of demons who speak lies in hypocrisy, and have their conscience seared, so that, being by no means believers, they are led away by the consolations of those who promise vain things; and for this reason they have been handed over to Satan for the destruction of the flesh, and led away into the captivity of the king of Babylon, and they shall be afflicted, because they do not have Christ as their shepherd, whom they promise themselves under a false name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
