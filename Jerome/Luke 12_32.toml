[[commentary]]
quote='''
But we do not have a multitude, but we know that saying in the Gospel: Wherever two or three are gathered together in my name, there am I in the midst. Fear not, little flock: for it has pleased God to dwell in you. Let not the monks say: Behold, such great multitudes, the cities are full, the whole world: is no one then saved, except him who is in the monastery? Behold, such great multitudes: are we then alone saved? When you have thought this, hear: Fear not, little flock, for it has pleased the Father to dwell in you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
