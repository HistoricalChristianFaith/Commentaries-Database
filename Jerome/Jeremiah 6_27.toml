[[commentary]]
quote='''
I have given you as a strong assayer among my people, and you will know and test their way. All these are princes turning aside — or disobedient —, walking deceitfully — or perversely —, bronze and iron; all of them are corrupted. The bellows has failed in the fire — which the Greeks more expressively call physētēra —, the lead is consumed, in vain has the smelter smelted — or the silversmith —; for their wickednesses have not been consumed. Call them reprobate silver, for the Lord has cast them away! The prophet is given to the unbelieving people as a 'strong' assayer, which in Hebrew is called 'mabsar', which means either 'fortified', according to Aquila, or 'shut in' and 'surrounded', according to Symmachus and the Seventy, like a most strongly fortified city, so that he may fear no ambushes of the people: 'so that, when you have tested', he says, 'and known the way of the transgressing people, you may then understand that silver mixed with bronze can by no means be purified'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
