[[commentary]]
quote='''
Nor did you incline your ears to hear, when I said: Return, each one, from his evil way and from your very wicked thoughts, and you will dwell in the land which the Lord gave to you and to your fathers from age and even unto age. So great was the hardness of the people that it would not even take on the bearing of one who listens and incline its ear, above all when the Lord was warning it that each one should turn back from his evil way and from his very wicked thoughts. And O infinite clemency: not to inflict punishment for the crime, but to call to repentance both for evil works, which the evil way signifies, and for very wicked thoughts, which even by themselves, without the deed, are reckoned as sin! And he promises a reward if they do what is commanded: that they should dwell in the land which was given to their fathers and taken away because of the vices of the sons. And his saying: from age and even unto age, or: from eternity even unto eternity, shows that God's gifts are perpetual, if those to whom they were given prove worthy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
