[[commentary]]
quote='''
Whereas He says, It is I, without saying who, either they might be able to understand Him speaking through the darkness of night; or they might know that it was He who had spoken to Moses, Say unto the children of Israel, He that is has sent me unto you. (Exod. 3:14.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And at once Jesus spoke to them, saying: Have confidence, it is I. What was at issue first, that he heals first, and to those who are afraid he gives a command, saying: Have confidence, do not be afraid. And as to what follows, it is I, he does not add who he is: either they could recognize him from a voice known to them, as he spoke through the dark shadows of the night, or they recalled that it was he himself whom they knew to have spoken to Moses: This is what you say to the sons of Israel: He who is has sent me to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
