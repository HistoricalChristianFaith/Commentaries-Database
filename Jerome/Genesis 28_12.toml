[[commentary]]
quote='''
For this reason he mounted upon the cross, that he might lift us up from earth on high. I think that this cross of the Savior is the ladder which Jacob saw. On that ladder the angels were descending and ascending; on that ladder, that is, the cross, the Jews descend, and the gentiles ascend.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_021.html'
source_title="Homily 21, on Psalm 91"
