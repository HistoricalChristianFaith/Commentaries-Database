[[commentary]]
quote='''
If, then, we take the abyss in a good sense, let us say: when the waters of the most wicked way were scattered, your wise ones saw you, and, borrowing from your countenance the height of knowledge which they had — because they saw you and the mountains were in labor —, whatever they had previously thought about you they brought forth in the praises of their voice. And he beautifully calls the opinion of phantasy height, in accordance with Jesus son of Sirach, who says: The abyss and wisdom, who will search them out? Hence also, from the little mountain, that is, the assumption of a human body, which Daniel calls a stone cut from the mountain without hands, that is, without the work of marriage, Christ the abyss calls upon the Father, the other abyss, in the voice of his cataracts, that he may give to those who preach the good news the word with great power. Or certainly the abyss, the New Testament, in testimony of the little mountain by which the prince of Tyre was wounded, calls upon the abyss of the Old Testament, so that through the cataracts of Christ, that is, the apostles, the preaching may become firmer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
