[[commentary]]
quote='''
Against you they have arranged a covenant: the tabernacles of the Edomites and the Ishmaelites. See the mysteries of the names. The tabernacles of the Edomites and the Ishmaelites, Moab and the Hagarenes, Gebal, and Ammon, and Amalek, and the foreigners with them that dwell at Tyre: for Asshur also is come with them, they are become a help to the sons of Lot. There are eleven who fight against the saints. Therefore, since they fought against the saints, they could not come to the perfect number, that is, to the twelfth. The tabernacles of the Edomites. They have no foundation at home, but tabernacles which quickly pass away. Edom is interpreted in two ways: either "bloody" or "earthly." See therefore who they are that fight against the saints: the tabernacles of the Edomites, the earthly ones. And the Ishmaelites. The Ishmaelites are interpreted as "those obedient to themselves": that is, whatever the heart and the evil thought may have conceived, they straightway do it. Therefore it is said in Ezekiel: "Son of man, speak against the prophets who follow their own heart, and whatever their thought impels them to, they do." But we ought not to follow our own thought, nor to be called Ishmaelites, that is, "obedient to themselves," but Ishmael, that is, "obedient to God." Moab, "from the father," that is, those withdrawing from God the Father. The Hagarenes, "proselytes." They who ought to be dwellers with God have been made proselytes. Gebal is interpreted "empty valley": ge means "valley," and bal is interpreted "empty." These, then, who are against the people of God, are not of the mountain, but of the empty valley. And Ammon is interpreted "turbulent people": that is, those who trust in a multitude, and not in simplicity. Amalek is interpreted "licking the earth." For whoever fights against the people of God does not eat the heavenly bread, but licks the earth like a serpent. The foreigners. Where it says "foreigners," the Hebrew has Philistines. And the Philistines are interpreted "falling by drink": that is, those who are made drunk from the cup of the devil, and being drunk have fallen. With them that dwell at Tyre. Tyre in the Hebrew tongue is called sor, which is interpreted "straitness" and "tribulation." They who ought to have been sojourners in this world have become dwellers. These, then, who assail the people of God, dwell in Sor, that is, in the straitness and tribulation of their own soul.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_015.html'
source_title="Homily 15, on Psalm 82"
