[[commentary]]
quote='''
Those who have this soundness of faith and doctrine and words will not attend to Jewish fables and the commandments of men who turn themselves away from the truth. Let us humor the Jews for a little while, and listen patiently to the absurdities of those among them who are called wise; and then we shall understand what are the Jewish fables, of men who, without the authority of Scripture, without any support of reason, invent certain fabulous animals; of whom Isaiah prophesied, saying: "This people honors me with their lips, but their heart is far from me. But they worship me in vain, teaching the doctrines and commandments of men" (Isa. 29:13). Approving this testimony in the Gospel, the Savior convicts them of having preferred the commandments of men to the Law of God. "For God says: Honor father and mother"; but they handed down: "That whoever says to father and mother, Whatever gift is from me will profit you, shall not honor his father and his mother" (Matt. 15:3 ff.). If anyone after the coming of Christ is cut, and not circumcised, he serves Jewish fables and the commandments of men who turn themselves away from the truth. For he is not a Jew who is one outwardly, but he who is one inwardly; and circumcision is of the heart, in the spirit, not in the letter. If anyone keeps the Pasch, not in the unleavened bread of sincerity and truth, so as to purge from his soul all the old leaven of malice and wickedness, he attends to fables and follows shadows, neglecting the truth. If anyone, not rising with Christ, nor seeking the things that are above but those that are below, says, "Do not touch, do not taste, do not handle the things that are in corruption", by their very use, according to the precepts and doctrines of men, he follows righteousnesses that are not good, and precepts that are not good. But where there is truth, and the spiritual law, there are good justifications, and the precepts are the best: whoever does them shall live in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
