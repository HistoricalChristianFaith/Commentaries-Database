[[commentary]]
quote='''
And as they were from the beginning, before I called them through Abraham and afterwards through Moses and Aaron, when they were without the yoke and the knowledge of the law and were mingled with all the nations, so even now they have returned to their former state, so as to be carried without yoke and bridle over precipices, and to be changed into a deceitful bow; so that the bow which God had bent against the adversaries they themselves turned against their own Lord, and shot against him the arrows of blasphemies. Hence their princes, who deceived the unhappy people, will fall by the sword because of the fury of their tongue, with which they dared to call the golden calves gods, so that they did in the land of promise what they had learned in Egypt, worshiping the Egyptian Apis and venerating all their monstrosities. For so also in the wilderness, when they had come out of Egypt, they derided the Lord, saying: These are your gods, Israel. And: Would that we were in the land of Egypt, where we sat by the pots of meat, and so on.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
