[[commentary]]
quote='''
Because of this he will give them up until the time in which she who is in labor shall bring forth, and the remnant of his brothers shall be converted to the sons of Israel. LXX: Therefore he will give them up until the time of her who brings forth: she shall bring forth, and the remnant of the brothers shall return to the sons of Israel. Because Christ, the ruler in Israel, came forth from Bethlehem which is Ephrathah, and his going forth had not been only at the time when he was seen in the flesh, but from the beginning of eternity, or from the beginning of the age. Because he himself always spoke through the prophets, and the word of God came to be in their hand, therefore he will give up the Jews and allow them to reign until the time of her who brings forth, when that saying is fulfilled: Rejoice, barren one who do not bear; break forth and cry out, you who are not in labor, for many more are the children of the desolate than of her who has a husband. For when the barren woman has borne seven, and she who had had many sons has been weakened, and through the trespass of the Jewish people the fullness of the nations has come in, then all Israel will be saved, and the remnant of his brothers will be converted to the sons of Israel; and Elijah the prophet, whose name means God the Lord, coming, will turn the heart of the fathers to the sons, and the heart of the sons to their fathers, and the last people will be joined to the ancient one, so that they may truly be called sons of Abraham, when they have believed in him whom Abraham saw and rejoiced. But what is the time in which the barren woman shall bring forth? As I suppose, that of which Isaiah speaks: In an acceptable time I have heard you, and in the day of salvation I have helped you. Paul too, understanding this as foretold of the time of Christ, says: Behold, now is the acceptable time; behold, now is the day of salvation. I think that this very thing is also shown mystically by what is written in Ecclesiastes: A time to bring forth, and a time to die; because at the time when the people of the Gentiles was born of the barren woman, the synagogue lost her children. It can, however, be understood otherwise: the Lord will give up the temple and Jerusalem and the Jews until that time when the virgin shall bring forth; and after she has brought forth, and the child that was born has taken the spoils of Samaria and the strength of Damascus, when the people of the Jews has been slain, the remnant of Israel will be saved. And the brothers of Christ, that is, the apostles, will be converted to the faith of the prophets and patriarchs, who announced that Christ would come, and the prophecy of the psalm will be fulfilled: In place of your fathers sons have been born to you, and the rest that follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
