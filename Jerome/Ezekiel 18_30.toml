[[commentary]]
quote='''
These words show us that the mind must not fail to believe in the promised blessings and give way to despair; and the soul once marked out for perdition must not refuse to apply remedies on the ground that its wounds are past curing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_122.html'
source_title="LETTER 122.1"

[[commentary]]
quote='''
Therefore I will judge each one of you according to his ways, house of Israel, says the Lord God. Whether those who are judged are from the multitude of the Gentiles or from the people of Israel, there is no respect of persons with God, but each one will be crowned by his own faith, and condemned by impiety and unbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
