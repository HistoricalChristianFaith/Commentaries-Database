[[commentary]]
quote='''
What does the graven image profit, since its maker has graven it, a molten thing and a false image? Since its maker has hoped in his own fashioning, so as to make dumb idols. LXX: What does the graven image profit, since they have graven it; they have formed it a molten thing, a false image? Since the maker trusts in his own fashioning, so as to make dumb idols. In sequence with what precedes, it is said of Nebuchadnezzar that he fashioned a statue of the idol Bel and set it up in the plain of Dura, or, as it is written in the Hebrew, Dora, about which we read more fully in Daniel. And so Scripture marvels at the madness and folly of the king, in that he himself ordered a golden statue to be made, and the maker trusts in the image that he has fashioned; and this we can indeed also take generally against all the worshipers of idols. Nor let us think that what is graven and what is molten are one and the same. For carving we can take as done in stones and in marbles, while casting is understood of those metals which can be melted and cast: for example, gold, silver, bronze, lead and tin. Let this be said so that, according to tropology, we may know what the difference is between a graven thing and a molten thing. We read in Deuteronomy: Cursed is everyone who makes a graven and a molten thing, the work of the hands of the craftsman, and sets it in a hidden place. The graven and the molten thing, I think, are perverse doctrines, which are adored by those by whom they were made. See how Arius carved for himself the idol of a creature, and adored what he carved. Behold how Eunomius cast a false image, and bows his neck to his own casting. And Scripture says pointedly: And he will set it, he says, in a hidden place. For they too have their orgies, and to certain disciples, as if to the perfect, they hand on hidden mysteries, which, if they come forth to the light, are at once convicted of being fictions. Their carving and their casting, therefore, will profit them nothing. Carving, which refers to stones, is understood of those doctrines which display their folly at first sight. Casting is found where there seems to be some reasoning of secular wisdom, and, as if with a kind of gold, so with the disciplines of the philosophers and the splendor of eloquence, the idol has been cast. The fashioned thing, then, will profit its maker nothing. And the dumb and deaf image will not be able to hear its worshiper. If ever you see someone unwilling to believe the truth, and, though the falsity of his doctrines has been shown, persevering in the pursuit he has begun, you will fittingly be able to say: He hopes in his own fashioning, and makes dumb or deaf images; for κωφά among the Greeks signifies both, although Symmachus, translating ἄλαλα, seems to have understood dumb rather than deaf. Nor let anyone be troubled by that ἰδίωμα (idiom) of the Scriptures, of which we have often spoken: Who, do you think, is the faithful and wise steward? And in another place: Who is wise, and will understand these things? In that "who" or "what" is taken for "rare", since we can also take this very expression from another place for "impossible": Who will separate us from the love of Christ: tribulation, or distress, and so on? And from the present chapter: What does the graven image profit, since its maker has graven it? For in both, impossibility is shown: that neither can any tribulation and distress separate the apostle's love from Christ, nor is there any profit in idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
