[[commentary]]
quote='''
These things the Lord God showed me, and behold, the Lord God was calling judgment to fire; and it devoured the great deep and ate up a part as well. And I said: O Lord God, be still, I beseech you; who will raise up Jacob, for he is very small? The Lord had pity over this: But this too shall not be, said the Lord God. LXX: Thus the Lord God showed me, and behold, the Lord God called judgment in fire, and it devoured the great deep, and ate up a part; and I said: O Lord God, cease; who will raise up Jacob, since he is very small? Repent, O Lord, over this; and this shall not come to be, says the Lord God. First the Lord showed the prophet the maker of the locusts at the beginning of the shoots of the late rain, and after the late rain the shearer king, or the king's shearer, and, to render word for word, the shearing of king Sennacherib, by which he sheared and laid waste everything of the ten tribes. Now the same Lord shows Nebuchadnezzar, or rather calls him and commands him to come against Judah and Jerusalem. And he calls him so that he may set the temple and Jerusalem on fire, and execute judgment in fire upon that which was once his people. And when the fire had come to judgment, to fulfil the Lord's command, it devoured the great deep, and ate up a part as well: all the cities of Judah, and the Lord's part, which was called his temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
But since, once and for all, following the prophet Hosea and the psalmist, who says: The sons of Ephraim, bending and shooting the bow, turned back in the day of battle, we have referred the ten tribes, which were called Israel, to the person of the heretics, and the two, over which Judah presided, to the Church and the sinners of the Church, who confess indeed the right faith, but because of the filth of their vices need flames to purge them; therefore the Lord now shows that he calls judgment to fire, so that the fire may prove of what sort each one's work is, and that may be fulfilled which is written: Walk in the light of your fire, and in the flame which you have kindled. Hence it is said also to Babylon: You have coals of fire, you will sit upon them, they will be a help to you. And in the psalm the deceitful tongue, full of lies, is said to need purging by the fire of coals: What shall be given you, or what shall be added to you, against a deceitful tongue? The sharp arrows of the mighty, with desolating coals. Of these coals of the altar, the desolating coal is taken up with the tongs of the two testaments, and purges the unclean lips of Isaiah, so that he can prophesy the word of the Lord. The fire, then, called to judgment, first devours the deep, that is, all kinds of sins, wood, hay, stubble, and afterwards eats up a part as well, that is, it reaches his saints, who are reckoned as the Lord's own possession and in his portion; for it is time for judgment to begin from the house of the Lord. And in Ezekiel it is commanded to those who are to inflict the punishments: Begin from my saints. And in the Apostle we read: If anyone's work burns, he will suffer loss, but he himself will be saved, yet so as through fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
