[[commentary]]
quote='''
To be members one of another points to a great mystery. He is speaking of those who are very close to us in faith. For people are not generally "members one of another." But the faithful indeed are members of the faithful. Christians are members of the body of Christ. We are members with the saints who embody purity of heart and consummate goodness.… Hence we are being instructed to speak intimately of the truth of this mystery with the neighbor—to speak of the fullness of God's truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians 4:25"

[[commentary]]
quote='''
Speak the truth with your neighbors. Let us take neighbor to mean the whole race of men, since we have been begotten of one parent; otherwise, if neighbor is taken to mean kinsman, we must lie to strangers and foreigners. The Apostle says this same thing: Putting away lying, speak the truth, each one with his neighbor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
