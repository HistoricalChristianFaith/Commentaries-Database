[[commentary]]
quote='''
Nor must we think that the end of our labour lies in this, that, rooted and grounded in love, we may be able to comprehend with all the saints what is the breadth, and length and depth, and height, unless we also desire with all zeal to know the eminent love of knowledge of Christ, so that not a simple love but a surpassing one may be known to us; nor is this the limit, to have knowledge of the surpassing love of Christ, unless we add something more, that we may attain the surpassing love of knowledge. From this it is to be observed that Christ has a great and immense love of knowledge, that is, of those who desire to know, who meditate in his law day and night, who turn words into works, and accomplish with the hand what they meditate with the mouth. But he who is such that he is worthy through his knowledge to have the surpassing love of Christ ought to think of nothing else but knowledge. And so he will be filled in all the fullness of God, not only in the present age but also in the one to come, so that he who has now begun to be full in study through reading may afterward be filled more perfectly with God, who is the fullness of all things, as he fills him with himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
