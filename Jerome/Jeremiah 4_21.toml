[[commentary]]
quote='''
How long shall I see those fleeing, shall I hear the sound of the trumpet? Either those fleeing the Babylonian king, or those fleeing me and withdrawing from my service.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
