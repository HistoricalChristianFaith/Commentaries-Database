[[commentary]]
quote='''
"Chariots and steeds lay stilled." Let us examine this verse in its tropological significance. At last Pharaoh mounted his steeds, sank into sleep and perished. The Egyptians too had steeds, but they perished. That is the reason for the prescription found in the law that no Hebrew should possess a horse. Solomon, you recall, had no horses from Jerusalem or Judea but bought some from Egypt. Horses are always for sale in Egypt. "Some are strong in chariots; some in horses; but we are strong in the name of the Lord, our God." They, in truth, who mounted horses slumbered and perished. Our Lord has horses too, and he has shining mountains besides, whereas the devil's mountains are full of darkness. Now just as there are bright mountains and dark mountains, there are good horses and again bad horses. We have made a few remarks about bad horses; let us say something about good horses. When horsemen came to Elisha to arrest him and the servant boy went out and saw an army of Assyrians round about the city, Elisha said, "Fear not: for there are more with us than with them." A little further on in Kings it says, "Lord, open the eyes of your servant that he may see." And when his eyes had been opened, he saw chariots and horses. These were helpmates. You notice that it says "chariots and horses." There were no men on the horses, only chariots and horses, in other words a multitude of angels. They were the chariots and they were the horses; the charioteer was the Lord. That is why the prophet Habakkuk sings, "Your chariots are salvation." This is said to God. O, if only we too were God's horses, and God deigned to ride us! But those other horses slept their long sleep and their charioteers with them.
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 9"

[[commentary]]
quote='''
But as for what he says: Were you angry with the rivers, O Lord, or was your fury against the rivers, or your onrush against the sea? He says it ambiguously, and with the speech of one asking rather than of one affirming. For there are both good rivers and bad ones. There is a very evil sea, and there is a very good sea. Of good rivers this is an example: The rush of the river makes glad the city of God. And that whoever drinks of the water of the Lord, from his belly will flow rivers of water springing up into eternal life. Of bad ones, that which Pharaoh says in Ezekiel: The rivers are mine, and I made them, in which the dragon dwells, and many things like these. And that the sea is taken in a good sense, Psalm 23 (24) is witness, in which it is said tropologically of the Church under οἰκουμένη, that is, the world: The earth is the Lord's and the fullness thereof, the world and all who dwell in it: he founded it upon the sea, and prepared it upon the rivers: that is, the world. And that it is founded by the Lord upon the rivers and prepared upon the sea is certainly taken in a good sense. So also what is said of the vine which was transplanted out of Egypt: You stretched out its shoots as far as the sea, and its branches as far as the rivers; as far as the sea, I think, can be taken in a good sense. And we say that the divine words which are plainer, and offer as it were drink to the thirsty, are called rivers; but those which are full of mysteries and set in the depth, of which the Apostle says: O the depth of the wisdom and knowledge of God, and the prophet agrees: Out of the depths I have cried to you, O Lord, are called the sea in the Scriptures. So much for the fact that the sea too can be understood in the better part. And that it is also taken in the contrary sense, there are many testimonies, among which is this in the psalms: This great and spacious sea; there the ships will pass through, small creatures with great. This dragon which you formed to make sport of it. And from the Gospel, when the Savior rebuked the winds and the sea and said to it: Be silent and be still. For what is rebuked is evil, according to that word of Zechariah: The Lord rebuke you, O devil. And to Timothy: Reprove, console and rebuke. So when the prophet asks: Were you angry with the rivers, O Lord, or was your fury against the rivers, or your onrush against the sea?, let us say: if they are the rivers of Egypt, and the red and bloody sea, the Lord is angry and strikes them, and is borne with all his force against the whirlpools that raise themselves against the sentence of God. Hence the sea saw and fled, not enduring to bear the presence of God. And the Jordan was turned back, yielding to the glory of the people passing over, the Jordan which is parted both by Elijah and by Elisha. But to speak more plainly, understand as the rivers with which the Lord is angry the eloquence of the heretics, which flows against the truth, even the truth of the Church. And the souls of those who are carried about by every wind of doctrine, and always toss with malice, and are overwhelmed by salt whirlpools: regard them as the sea upon which the Lord's onrush comes, so that it may feel his coming, and know by what bounds and barrier it is shut in, and hear: In you your waves will be broken. But if the rivers are good and the sea good, Jesus is washed in them, and he sets his Church upon a sea of this kind. After this follows: You who mount upon your horses, and your riding is salvation. I ask what horses the Lord mounts, and I think they are none other than the souls of the saints, upon which the divine Word mounts, to save both them and others through them. Let us set out examples of horses. The Bridegroom speaks in the Song of Songs: To my cavalry among the chariots of Pharaoh he has likened you, my near one. Not that Christ compares the Church, or the Word of God the soul which he calls his bride, to the chariots of Pharaoh, but that every soul, however holy and perfect it may be, compared with God is as it were a chariot of Pharaoh, and a beast of burden. Hence Moses too says to the Lord: But I am ἄλογος, that is, irrational. And David: I have become like a beast of burden before you. Not that he is a beast of burden absolutely, but that he is a beast of burden before God. Opposed to these horses are those which Pharaoh has, and of which it is said: Horse and rider he has cast into the sea; riding of this kind is not salvation but perdition. Let us seek other horses also, which the Lord mounts. In the fourth book of Kingdoms (2 Kings) we read that Elisha's servant rose early, and going out saw an army surrounding the walls of the city, and horses and chariots. And after his eyes were opened at the prophet's prayers: He looked, it says, and behold, the mountain was full of horses, and chariots of fire round about Elisha. Attend carefully to this: horses are seen, and chariots, and yet among so many thousands of horses and chariots there is no rider; of these horses he was the charioteer and the driver of whom the psalmist sings: You who sit upon the Cherubim, show yourself. With such horses and such a chariot Elijah too was snatched up to heaven. But if anyone wishes to learn from Zechariah which are the red horses, and which the black, and which the dappled, and which the white, coming out of the myrtle groves and from the mountains set in the depth, or, as is written in the Seventy, the mountains of bronze, we shall try to explain it in that prophet himself, if the Lord grants a span of life. John too saw white horses and their riders, of whom I think the bodies of those who rise in glory are the white horses, and the souls of the saints the riders. But if anyone is a sinner, and like me, he will sit on a black horse, and it will be said of him: All who mounted horses have slumbered. Of such horses it is written: A horse is deceitful for salvation. For the flesh lusts against the spirit, and its wisdom is hostile to God. Let this be said of those who love bodies and sit on black horses. But let us prepare our souls as horses and chariots of the Lord, who mounted in Paul, mounted in Peter, and riding in chariots of this kind, went over the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
