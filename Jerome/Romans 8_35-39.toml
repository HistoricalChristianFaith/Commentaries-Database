[[commentary]]
quote='''
It remains that we learn more clearly, from two battle lines in the Apostle, what the difference is between the wrestling of flesh and blood and the rulers of this darkness and the spiritual forces of wickedness in the heavenly places. For when he wishes to point out human temptations, that is, the wrestling of flesh and blood, he speaks disdaining and despising them: Who will separate us from the love of God: tribulation, or distress, or persecution, or famine and nakedness, and peril, and sword? As it is written (Ps. 43:22): For your sake we are put to death all the day long, we are accounted as sheep for slaughter. But in all these things we overcome, because of him who loved us (Rom. 8:35, 36). But when he wishes to teach us about the adverse powers, and the rulers of darkness, and the spiritual forces of wickedness in the heavenly places, he makes a beginning as if from another head, and says: For I am sure that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor strength, nor height, nor depth, nor any other creature will be able to separate us from the love of God, which is in Christ Jesus our Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
