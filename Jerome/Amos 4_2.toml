[[commentary]]
quote='''
And so the Lord swore by his holy one, whether by himself, or by the Son, or by the temple, or by everyone who is holy and is called the temple of God, that a day is to come not far off, nor after many ages, but already imminent: the day of captivity and distress, in which the cows are lifted up on poles, and their remnants in boiling pots, for which both in the Hebrew and in Aquila is written in cauldrons of little fish. For the poles too, which in Hebrew are called sannoth, Aquila interpreted shields, Symmachus and the LXX arms, Theodotion alone δόρατα; following him, we have interpreted poles or spears. This signifies that they are taken in battle, and carried and borne away by right of victory, while he nevertheless keeps the metaphor of the cows that he had begun, so that, as he had said that they were fat cows, he tells that their flesh is to be carried on poles or shields. And as a boiling cauldron wraps up small fish all together, so also the cows of Bashan are to be overwhelmed, without any order, by the miseries of captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
