[[commentary]]
quote='''
But I will rejoice in the Lord, and I will exult in God my Jesus. God the Lord is my strength, and he will set my feet like those of harts, and upon my high places he, the victor, will lead me singing in psalms. LXX: But I will exult in the Lord, I will rejoice in God my salvation. The Lord God is my strength, and he will set my feet unto the consummation, he will set me upon the high places, that I may conquer in his song. When the fig tree and the vineyard and the olive, as I have expounded, do not produce their fruit, and the fields of the Jews do not yield food, when the flocks too have been cut off from the fold and the herds from the stalls, after they heard from the Lord: Your house will be left to you desolate, and when the people too has been handed over to captivity and scattered over the whole world, the prophet, from the people of the Jews, whose name means embrace — because he loved the Lord, and clung to him, and joined himself to him —, speaks in the person of the apostles and of the people believing in Christ: But I will rejoice in the Lord, and I will exult in God my Jesus. For this the LXX translated τῷ Σωτῆρί μου, that is, my Savior. Gabriel too interprets the very same thing: And he will be called Jesus, for he will save his people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
