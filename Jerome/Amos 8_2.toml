[[commentary]]
quote='''
And that we may know that this is what we say, God himself explains what the vision he had shown the prophet signifies: The end has come upon my people Israel. And what follows: I will not again pass him by any more, signifies this: that he will no longer pass over the iniquities of his people, nor neglect them, nor allow their crimes to pass unpunished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
