[[commentary]]
quote='''
But when someone has once put on Christ and, cast into the flame, has glowed white with the ardor of the Holy Spirit, one cannot tell whether he is gold or silver. So long as the heat holds the mass in this way, there is a single fiery color, and every difference of race, condition and bodies is taken away by a garment of this kind. For there is neither Jew nor Greek. By "Greek" we ought to understand Gentile, because Ἕλλην signifies both a Greek and a heathen. Nor is the Jew better for being circumcised, nor the Gentile worse for being uncircumcised; rather, it is according to the quality of their faith that either the Jew or the Greek is better or worse. Slave also and free are separated not by condition but by faith, since a slave can be better than a free man, and a free man can surpass a slave in the quality of his faith. Male and female likewise are separated by the strength and weakness of their bodies. But faith is reckoned according to the devotion of the mind, and it often happens both that a woman becomes the cause of salvation for a man and that a man goes before a woman in religion. Since, then, this is how the matter stands, and every difference of race, condition and bodies is taken away by the baptism of Christ and by his garment, we are all one in Christ Jesus: so that, as the Father and the Son are one in each other, so we too may be one in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
