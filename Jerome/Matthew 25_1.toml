[[commentary]]
quote='''
But they also refer to the mystery of this number the parable of the ten virgins in the Gospel, whom we interpret of the senses of the flesh and of the spirit, if they have prepared the oil of good works for their lamps, and have doubled the number five, so as to be holy, according to the Apostle, in body and in spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
