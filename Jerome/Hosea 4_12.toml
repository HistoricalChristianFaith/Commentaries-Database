[[commentary]]
quote='''
The unclean spirit before had been in the synagogue and had led them into idolatry. Of him it is written, "The spirit of harlotry has led them astray." The spirit had gone out of a man and was roaming in the dry places in search of a resting place and could find none. He took with him seven other demons and returned to his former dwelling place. All these spirits were in the synagogue and could not bear the presence of the Savior. Indeed, "what harmony is there between Christ and Belial?" Christ and Belial could not abide in the same assembly. "Now in their synagogue there was a man with an unclean spirit, and he cried out, saying, 'What have we to do with you?' " Who is asking, "What have we to do with you?" He is only one, but he cries out the recognition of many. He is aware that in his own defeat, his devils have been vanquished with him.
'''
source_url=''
source_title="HOMILIES ON MARK 76"

[[commentary]]
quote='''
Hence the prophet too, as if astonished and full of wonder, declares: My people, which was once called by my name, has inquired of wood and of rods; a kind of divination which the Greeks call ῥαβδομαντείαν (divination by rods). Hence we also read in Ezekiel that Nebuchadnezzar mixed his rods against Ammon and Jerusalem, and the rod came out against Jerusalem; and the cause of this madness is the spirit of fornication, which deceived them, so that they played the harlot away from their God. Now fornication signifies idolatry, according to what we read in Jeremiah: And they committed adultery with wood and stone, and I said: After they have played the harlot with all these, return to me; and she did not return with her whole heart, but in falsehood. And again: You have forsaken me and said: I will go upon every high hill, and I will pour myself out in my fornication under every leafy tree. And in the psalm it is said: You have destroyed all who play the harlot away from you. For the beginning of fornication is the invention of idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
