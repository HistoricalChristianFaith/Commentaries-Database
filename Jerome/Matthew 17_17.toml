[[commentary]]
quote='''
Not that we must think that He was overcome by weariness of them, and that The meek and gentle broke out into words of wrath, but as a physician who might see the sick man acting against his injunctions, would say, How long shall I frequent your chamber? How long throw away the exercise of my skill, while I prescribe one thing, and you do another? That it is the sin, and not the man with whom He is angry, and that in the person of this one man He convicts the Jews of unbelief, is clear from what He adds, Bring him to me.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jesus answered and said: O unbelieving and perverse generation, how long shall I be with you? How long shall I bear with you? Not that he was overcome by weariness, and that he who is meek and gentle, who like a lamb before its shearer did not open his mouth, broke out into words of fury; but that, in the likeness of a physician who sees a sick man conducting himself against his orders, he might say: How long shall I come to your house, how long shall I waste the diligence of my art, when I order one thing and you do another? So little, moreover, is he angry with the man rather than with the vice, and through one man he convicts the Jews of unbelief, that he immediately added: Bring him here to me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
