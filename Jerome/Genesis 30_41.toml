[[commentary]]
quote='''
But in that place where it is written that they might conceive at the rods, and in the Hebrew it has iaeahamena, I cannot express the force of the Hebrew word except by circumlocution. For iaeahamena properly denotes the final heat in coupling, by which the whole body is shaken, and the end is near for one who is consummating pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
