[[commentary]]
quote='''
'When you have done these things', he says, 'are you not deserving of a fitting visitation?' And note that here 'visitation' is put for penalty and punishments, according to what is written: I will visit their iniquities with the rod. And on such a nation shall not my soul take vengeance? After she has been bound by sins, she is no longer called the people of God, but a nation, from which the soul of God has withdrawn, according to what is written: your new moons and sabbaths and feast days my soul hates. But what in the Old Testament is said by way of affection, in the New is written as truth, as the Savior says: I have power to lay down my soul, and I have power to take it up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
