[[commentary]]
quote='''
I have no pleasure in you, says the Lord of hosts, and I will not accept a gift from your hand.

For from the rising of the sun even to its setting my name is great among the nations, and in every place sacrifice is made, and a clean oblation is offered to my name, because my name is great among the nations, says the Lord of hosts. And you have polluted it, in that you say: The table of the Lord is defiled, and what is placed upon it is contemptible, with the fire that devours it. And you have said: Behold, from toil, and you have blown upon it, says the Lord of hosts. And you have brought in from plunder the lame and the sick, and you have brought in a gift. Shall I accept it from your hand? says the Lord. LXX: My will is not in you, says the Lord Almighty, and I will not accept sacrifice from your hands, because from the rising of the sun even to its setting my name is glorious among the nations; and in every place incense is offered to my name, and a clean sacrifice, because my name is great among the nations, says the Lord Almighty. But you have defiled it, in that you say, the table of the Lord is polluted, and its foods that are placed upon it are despised, and you have said, behold, they are from affliction, and you have blown upon them, says the Lord Almighty. And you brought in plunder, and the lame and the feeble, and you offered sacrifice: shall I accept them from your hands, says the Lord Almighty? It is a rule of the Scriptures: where a most manifest prophecy of things to come is being woven, not to weaken what is written through the uncertainties of allegory. Therefore the word of the Lord is now addressed in its proper sense to the priests of the Jews, who offer the blind and the lame and the sick for sacrifice, so that they may know that spiritual victims will succeed carnal victims; and that it is by no means the blood of bulls and goats, but incense, that is, the prayers of the saints, that is to be offered to the Lord; and that not in one province of the world, Judea, nor in one city of Judea, Jerusalem, but in every place an oblation is offered, by no means unclean, as by the people of Israel, but clean, as in the ceremonies of the Christians. For from the rising of the sun even to its setting the name of the Lord is great among the nations, as the Savior says: Father, I have manifested your name to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
