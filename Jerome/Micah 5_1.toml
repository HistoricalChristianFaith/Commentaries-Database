[[commentary]]
quote='''
Now you shall be laid waste, daughter of the robber; they have laid siege against us; with a rod they will strike the cheek of the judge of Israel. LXX: Now the daughter shall be blocked with a blockade; he has laid distress upon us; with a rod they will strike upon the cheek of the tribes of Israel. Not that one tribe strikes the cheek of another, but that others strike the tribes of Israel on the cheek. I did indeed promise you, O daughter of Zion, that a time would come when I would make your horn iron and your hoofs bronze, and when, the multitude of demons having been crushed, you would offer to the Lord of the whole earth whatever they had possessed before. But since this will come to pass then, when the fullness of the nations has come in and all Israel has been saved, now in the meantime be laid waste as your deserts require, or, as it stands in the Hebrew, be cut to pieces. For according to the Apostle you are by no means called the circumcision, but the concision; nor do I call you my daughter, but the robber's daughter, which in Hebrew is said bath gedud, that is, the daughter of the devil, who is ever girded for plunder. For you have made my house a den of robbers, you have fought against me, and your sons have laid siege against me, and against the Son, and against my Spirit. Or is it not an insult to the Trinity when, with rod and reed, at your doing, the Romans struck the head of the judge of Israel, saying: Prophesy to us, Christ, who is it that struck you? Or when one of your attendants struck him on the cheek, saying: Do you answer the high priest so? This is according to the Hebrew, and Aquila and Symmachus, and Theodotion, and the Fifth Edition agree with this interpretation. But according to the LXX the sense is much loftier, and it is understood as though from a beginning of its own. Now the synagogue is blocked with a blockade, and those who have been shut up in it will say: He has laid distress upon us; and, subject to the Roman powers, the tribes of Israel will be struck on the cheek. For the Lord has taken away from Judea and from Jerusalem the strong and the mighty, and the wise master builder, and the understanding hearer; and her ways are shut and hedged up to this day, and she cannot go out of captivity, but is pressed down by a most harsh rule. But if, following the sense above, we wish to take Now the daughter shall be blocked with a blockade as said of the Church, let us bring forward that example from Hosea, in which the adulteress speaks: I will go after my lovers, who gave me my bread, and my water, and my garments, and my linens, my oil, and all things that profit me. And afterwards God, wishing to hinder her most wicked thought, does not let her fulfill what she desires, but blocks her ways, so that she may not overtake her lovers and commit fornication further. For he says: Therefore, behold, I will block her ways with stakes, and I will hedge up her ways, and she will not find her path; and she will pursue her lovers, and will not lay hold of them, and she will seek them, and will not find them, and she will say: I will go and return to my former husband, because it was well with me. Notice that the Lord's work has succeeded: for the adulteress, not finding her way and not able to go where she wished, returns, bound by necessity, to her former husband, and confesses that it is better for her in her former husband's house than it once had been with her lovers; and Israel is schooled by tribulations and blows. Hence it is also said mystically to David, under the type of Christ: If his sons forsake my law, and do not walk in my judgments, if they profane my justices, and do not keep my commandments, I will visit their iniquities with the rod, and their sins with scourges; but my mercy I will not scatter from him. Therefore God has laid tribulation upon the daughter of Israel, and the angels who are set over the blows will strike her on the cheek. And lest perhaps you should not know who the daughter is that is blocked with a blockade and placed in distress, it is at once added and said: the tribes of Israel. But we are Israel, who discern God with the mind; to distinguish us from them the Apostle says: Behold Israel according to the flesh. For he would never call Israel fleshly unless he knew that there is also a spiritual one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
