[[commentary]]
quote='''
He set forth also this other parable, as it were a rich householder refreshing his guests with various meats, that each one according to the nature of his stomach might find some food adapted to him. He said not 'a second parable,' but another; for had He said 'a second,' we could not have looked for a third; but another prepares us for many more.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Another parable he set before them, saying: The kingdom of heaven has become like a man who sowed good seed in his field; but while men were sleeping, his enemy came and sowed darnel over it in the midst of the wheat, and the rest. This is the second parable set down with its interpretation, not immediately, but explained after other parables have been placed in between. For here it is set forth, and afterwards, the crowds having been dismissed, he comes home, and there come to him his disciples, asking: Explain to us the parable of the darnel of the field, and the rest. For we ought not, through an overhasty desire to understand, to seek the knowledge of it before it is explained by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
