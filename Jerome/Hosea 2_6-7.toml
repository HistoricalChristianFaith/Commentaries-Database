[[commentary]]
quote='''
And also in Hosea, where it is said of Jerusalem committing fornication: Behold, I will close her ways with thorns, and I will block up her paths, and she will not find her track, and she will pursue her lovers, and will not overtake them, and she will seek them, and will not find them; and she will say: I will go and return to my former husband, for it was better with me then than now. Notice that unless the ways had been closed and the paths fenced off, and unless the Lord had destroyed her ways, the fornicating soul could never have said: I will go and return to my former husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"

[[commentary]]
quote='''
But if, following the sense above, we wish to take Now the daughter shall be blocked with a blockade as said of the Church, let us bring forward that example from Hosea, in which the adulteress speaks: I will go after my lovers, who gave me my bread, and my water, and my garments, and my linens, my oil, and all things that profit me. And afterwards God, wishing to hinder her most wicked thought, does not let her fulfill what she desires, but blocks her ways, so that she may not overtake her lovers and commit fornication further. For he says: Therefore, behold, I will block her ways with stakes, and I will hedge up her ways, and she will not find her path; and she will pursue her lovers, and will not lay hold of them, and she will seek them, and will not find them, and she will say: I will go and return to my former husband, because it was well with me. Notice that the Lord's work has succeeded: for the adulteress, not finding her way and not able to go where she wished, returns, bound by necessity, to her former husband, and confesses that it is better for her in her former husband's house than it once had been with her lovers; and Israel is schooled by tribulations and blows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Because of this, behold, I will hedge up your way with thorns, and I will hedge it with a wall, and she will not find her paths, and she will follow her lovers and will not overtake them, and she will seek them and will not find them, and she will say: I will go and return to my first husband, for it was well with me then, more than now. LXX: Therefore, behold, I will hedge up her way with stakes, and I will block her ways; and she will not find her path. And she will pursue her lovers, and will not overtake them; and she will seek them and will not find them; and she will say: I will go and return to my first husband, for it was better with me then than it is now. The harlot had said: I will go after my lovers, who have supplied me with abundance of all things. The Lord answered: I will hedge up your way with thorns, or with stakes, so that you cannot go where you desire, and I will set a hedge-wall, or a wall, in the way, and you will not find your paths which you had often trodden with your foot, so that you may not overtake those whom you were following with such zeal, and, compelled by the need of things, you may return to your husband; and say that saying from the Gospel: How many hired servants in my father's house have bread in abundance, but I perish here with hunger. I will arise and go to my father and will say to him: Father, I have sinned against heaven and before you, I am no longer worthy to be called your son, make me as one of your hired servants. From this we understand that by the providence of God evils often befall us, so that we may not have the things we desire, and, oppressed by the various calamities and miseries of this world, we may be compelled to return to the service of God. And by the lovers of Jerusalem and of the Jewish nation, according to the history of that time, let us understand the Assyrians and Chaldeans and Egyptians and the other nations, with whose idols she played the harlot, and from whom, in time of war and when evils pressed upon her, she hoped for help in vain. According to the spiritual understanding, the heretics follow these lovers, and, often deserted by them, return under the weight of their evils to the bosom of mother Church. For through all scourges and torments Israel is instructed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
