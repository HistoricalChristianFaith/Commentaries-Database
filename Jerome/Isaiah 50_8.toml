[[commentary]]
quote='''
Near is he who justifies me: who gainsays me? Let us stand together. Who is my adversary? Let him come near to me. Behold, the Lord God is my helper: who is he that will condemn me? Behold, they shall all be worn away like a garment, the moth shall eat them. LXX: He who is near justifies me: who is he that is judged with me, let him resist me together? And who is he that enters into judgment against me? Let him draw near to me. Behold, the Lord is my helper, who will afflict me? Behold, all of you shall grow old like a garment, and like a moth it shall eat you. If anyone, he says, thinks that I was justly given over to the cross and had committed some sin, let him resist me. Who is he that is judged with me, so that he may be overcome not by the power of my majesty but by reason? Now a man is judged with the Lord not by the authority of one who reigns but by comparison of virtues: as the Apostles also judge the twelve tribes of Israel, and the Ninevites and the queen of Sheba judge the people of the Jews. In this sense it is said to Jerusalem: Sodom is justified by you (Ezek 16:52).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
