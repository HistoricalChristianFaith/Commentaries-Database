[[commentary]]
quote='''
Thy testimonies are made exceedingly credible. This is what is said in the seventeenth psalm: 'The testimony of the Lord is faithful, giving wisdom to little ones.' To what little ones? 'Father, I give thee thanks, because thou hast hidden these things from the wise and prudent of the world, and hast revealed them to little ones.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_070.html'
source_title="Homily 70, on Psalm 92 (Alternate Series)"
