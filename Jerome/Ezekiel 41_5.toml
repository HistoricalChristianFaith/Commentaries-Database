[[commentary]]
quote='''
And he measured the wall of the house, six cubits, and the breadth of the side, four cubits, round about the house on every side; and the sides, side to side, twice thirty-three. And there were projections which entered through the wall of the house in the sides round about, to hold and not to touch the wall of the temple. And there was a broad way going upward in a round by a spiral, and it led into the upper room of the temple by a circuit. Therefore the temple was wider in the upper parts, and so from the lower parts one went up to the upper into the middle. (But what is set down in the Seventy, and from the middle parts to the tristega — that is, 'to the third upper rooms' and 'thrael', is not found in the Hebrew; and for 'thrael' too, which I do not know what it signifies, for it is not found in the Hebrew, there is read among them 'uraithi', which both we and the others translated 'and I saw', so that the order of the testimony may follow:) And I saw in the house a height round about, the sides founded to the measure of a reed with a space of six cubits; and the breadth through the wall of the side outside of five cubits, and the inner house in the sides of the house, and between the chambers a breadth of twenty cubits round the house on every side. And the door of the side for prayer (which is not found in the Seventy), one door toward the way of the north, and one door toward the southern way; and the breadth of the place for prayer (which the Seventy likewise did not translate) of five cubits round about. And the building which was separate and turned toward the way looking to the sea, of a breadth of seventy cubits, but the wall of the building five cubits of breadth round about, and its length ninety cubits. After he came to the Holy of Holies, of which we spoke above, that venerable man measured the wall of the Holy of Holies, which, on account of the fabric of the world and all the visible creation that was founded in six days, had six cubits, and the breadth of one side, four cubits: not on one side only, but round about the house was the breadth; and the breadth held four cubits round about the house, so as to show the four elements from which all things are compacted, and especially human bodies, against which the saints, fighting and subjecting them to the power of the soul, merit to enter the inner places and to know the secrets of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
