[[commentary]]
quote='''
And he keeps up the narration he has begun, so as to say that they enter the city, run about on the walls, climb up the houses, and enter through the windows like thieves; not that those who are victors have the fear of thieves, but as thieves are wont to enter through windows and to steal in secret, so they, the doors being shut, lest there be any delay, will burst in through the windows with complete boldness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
