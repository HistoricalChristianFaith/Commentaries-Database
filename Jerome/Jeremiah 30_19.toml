[[commentary]]
quote='''
Then there went forth praise or thanksgiving — for this is what 'thoda' signifies —, so that all the apostles said: grace to you and peace, and the voice of those playing, not with that play with which the people ate and drank and rose up to play, but with that with which David played before the ark of the Lord. And they were multiplied and not diminished, so that the whole world believed in God the Savior, and they were glorified, so that what is written was fulfilled: Glorious things have been spoken of you, city of God!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
