[[commentary]]
quote='''
Something similar to this sounds in the psalm too: All have turned aside, together they have become useless: there is none who does good, there is not even one (Ps. 13:3). For if all have turned aside, then he too who speaks has turned aside. And elsewhere: I said in the ecstasy of my mind, every man is a liar (Ps. 115:2). For what he said is either true or false. If every man is a liar, then he too who speaks is a liar. But if he too who speaks is a liar, then not even this which he says is true, that every man is a liar. Further, if the statement is true, "all" must be taken, as we said above, to mean that the great part of men lie.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
