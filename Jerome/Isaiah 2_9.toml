[[commentary]]
quote='''
Do not, therefore, forgive them. For which the Seventy translated: And I will not forgive them. If God is speaking, it is to be understood thus: Because they have done such things, I will not spare them, nor will I forgive such innumerable sins. If the Prophet, it is to be taken thus: Do not, therefore, forgive those who have committed such crimes. And if we understand it of the Romans, the interpretation is truer: who, overthrowing the temple of God, did not worship him who gave them the victory, but the idols of their own hands. But if of the Jews, it is a fierce sentence of the Prophet, so that he seems to pray against his own people, to whom he had said above: House of Jacob, come, and let us walk in the light of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
