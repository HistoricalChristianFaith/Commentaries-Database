[[commentary]]
quote='''
Behold, I will raise them up from the place in which you sold them, and I will turn your recompense upon your head, and I will sell your sons and your daughters into the hands of the sons of Judah; and they will sell them to the Sabeans, a nation far off, for the Lord has spoken. LXX: Behold, I will raise them up from the place in which you sold them, and I will return your recompense upon your heads, and I will sell your sons and your daughters into the hands of the sons of Judah; and they will sell them into captivity to a nation that is far away, because the Lord has spoken. The Hebrew word Sabaim, which Aquila and Symmachus translated just as it is written, the LXX rendered as captivity, which would more properly mean captives. Now Sabaim is said to be a nation beyond India, to which also belonged the queen of Sheba, who came to hear the wisdom of Solomon, of whom Isaiah too speaks: And Sabaim, men of stature, shall pass over to you. From there also incense is said to come, as Vergil says: ..., and a hundred altars glow with Sabaean incense. Though some suppose the Sabeans to be Arabs.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
