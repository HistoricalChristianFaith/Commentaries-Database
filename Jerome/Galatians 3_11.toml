[[commentary]]
quote='''
But since in the Law no one is justified before God, it is manifest that the righteous lives by faith. But the Law is not of faith, but he who has done these things shall live in them.

The example by which it is proved that the righteous lives by faith, and not by works, he took from Habakkuk, which the Seventy translators rendered thus: "But the righteous lives by my faith" (Hab. 2:4). Aquila and Theodotion: "But the righteous lives by his faith", that is, God's. It must therefore be considered that he did not say "a human being" or "a man lives by faith", lest he should give occasion for despising the works of the virtues; but the righteous lives by faith: so that whoever was faithful and was to live through faith could not otherwise come to faith, or live in it, unless he had first been righteous, and had ascended by purity of life as by certain steps to faith. It can therefore happen that someone is righteous, and yet does not live, being without faith in Christ. If a scruple is stirred in the reader, let him take up the words of Paul, in which he says of himself: "As to the righteousness which is in the Law, without reproach" (Phil. 3:6). Paul therefore was at that time righteous in the Law, but could not yet live, because he did not have within himself Christ, who says: "I am the life" (John 11:25). Believing in him afterwards, he began also to live. Let us too make something similar to what is said, the righteous lives by faith; and let us say: the chaste lives by faith, the wise lives by faith, the brave lives by faith, and from the remaining parts of the virtues let us bring forward a like sentence against those who, not believing in Christ, think themselves brave and wise, temperate or righteous: so that they may know that no one lives without Christ, without whom every virtue is in vice. The present testimony can also be read thus: that the righteous by faith, so that there is then added, lives.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
