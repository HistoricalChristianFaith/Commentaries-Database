[[commentary]]
quote='''
But I said: how or I will set you among sons and give you a desirable land, a glorious inheritance of the hosts of the nations! And I said: You will call me father, and you will not cease to walk after me. In place of 'a glorious inheritance of the hosts of the nations', which the Seventy translated: a named inheritance of God almighty of the nations, Theodotion translated more significantly: a renowned inheritance of the strength of the mightiest one of the nations, signifying Christ, who is the leader and lord of all the nations that believe in his name and passion. He himself said to Israel: you will call me father, and: he who believes in me believes in the Father. He himself promised: 'I will set you among sons, that is, in the number of my sons who have believed in me from the people of the nations and to whom I have given a desirable land'. For as many as received him, he gave them power to become sons of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
