[[commentary]]
quote='''
Otherwise: Daily setting before myself the reckoning of each thing, I could find no thought that was not disturbed from without by some perverse thinking. But among a thousand men I found a true human being, one made according to the image of his Maker; and among a thousand not of any kind whatever, but among a thousand men, whose number a woman could not fill: among a thousand who did not approach a woman and therefore remained most pure. But all these things are to be taken figuratively. For among many studious men, sweating in daily meditation, scarcely is a thought found that is pure and worthy of the name of man. We can also take thoughts for men and women for works, and say that hardly can anyone's thinking be found pure; but works, because they are carried out through the body, are always mixed with some error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
