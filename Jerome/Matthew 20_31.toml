[[commentary]]
quote='''
But if both blind men are referred to the people of the Jews, what follows: the crowd rebuked them, is to be understood of the heathen, whom the Apostle warns not to boast and be proud against their root, but, since they themselves, through the error of the former, have been grafted from the wild olive into the good olive, they ought by no means to envy the salvation of the former.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Have mercy on us, son of David. They are rebuked by the crowds and nonetheless are not silent, but repeat the very same thing all the more often, to show a desire full of the true light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
