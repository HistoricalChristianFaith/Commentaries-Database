[[commentary]]
quote='''
At that time they will say to the mountains: Cover us; and to the hills: Fall upon us. This the Lord says is to be fulfilled in the last time of the Jewish captivity. Whatever, then, is now said against the ten tribes, or against all Israel, let us know that it can also be transferred τυπικώς (typologically) to the whole people, so that when the Romans had taken Jerusalem and overthrown the temple, or when the day of judgment comes, as others suppose, they say, fearing with great horror, to the mountains: Cover us; and to the hills: Fall upon us, preferring to die rather than to see the things that bring death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
