[[commentary]]
quote='''
This must be referred to the time when the Apostles were sent to preach, when it was said to them, Go not into the way of the Gentiles; they should not fear, but may shun persecution. This we see the believers did in the beginning, when on a persecution arising in Jerusalem they were scattered throughout all Judea, and thus the season of tribulation was made the seedtime of the Gospel.

Spiritually we may say; When they shall persecute you in one book or one passage of Scripture, let us flee to other volumes, for however contentious the adversary may be, protection will come from the Saviour before the victory is yielded to the enemy.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252010.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But when they persecute you in this city, flee into another. Amen I say to you: You will not finish the cities of Israel until the Son of Man comes. This is to be referred to that time when the apostles were being sent out to preach, to whom it was also said in particular: Do not go off into the way of the Gentiles, and do not enter into the cities of the Samaritans, that they ought not to fear persecution, and yet ought to avoid it. This indeed we see that the believers did at the beginning, when, a persecution having arisen at Jerusalem, they were scattered through all Judea, so that the occasion of tribulation became the seedbed of the Gospel. But spiritually we can say: when they have persecuted us in one city, that is, in one book or testimony of the Scriptures, let us flee to other cities, that is, to other volumes. However contentious the persecutor may be, the protection of the Savior will come before victory is granted to the adversaries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
