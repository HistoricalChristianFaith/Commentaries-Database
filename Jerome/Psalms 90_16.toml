
[[commentary]]
quote='''
And direct the sons of men. We who are crooked, may we be set straight by you. And direct the sons of men. Well did he say, direct the sons of men. Direct them for this reason, because they are sons of men. For if they were your sons, they would have been set straight. For you yourself said: "I said: you are gods, and all of you sons of the Most High. But you shall die like men, and shall fall like one of the princes." And in another place: "Sons of men, how long will you be heavy of heart?" And in another place: "My spirit shall not remain in these men, because they are flesh." Since they are men, therefore they are flesh. So because we are sons of men, and we have lost the state of being sons of God, and we have become crooked: therefore direct us, so that we may again be made your sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_019.html'
source_title="Homily 19, on Psalm 89"
