[[commentary]]
quote='''
Notice in the present passage that someone can teach after sin, provided, however, that he has washed away his former vices with worthy repentance. Hence David too, after adultery and homicide, says in the psalm: You will sprinkle me with hyssop, and I shall be cleansed; you will wash me, and I shall be made whiter than snow. Nor is he content with his own purity alone, but he adds: Restore to me the joy of your salvation, and strengthen me with a governing spirit. And when you have done this. I will teach, he says, the wicked your ways, and the impious will be turned to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
