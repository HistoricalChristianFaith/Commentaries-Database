[[commentary]]
quote='''
Until we all meet in the unity of the faith and of the knowledge of the Son of God, unto a perfect man, unto the measure of the age of the fullness of Christ. That we may no longer be children tossed to and fro, and carried about by every wind of doctrine, in the deceit of men and in craftiness, for the circumvention of error. But doing the truth in love, let us increase all things in him who is the head, Christ.

We must ask whom he means by the "all" who are to meet in the unity of the faith: all men, or all the saints, or at any rate all who are capable of reason? It seems to me, however, that he is speaking of all men, since there are many winds of doctrines; and when the waves have been stirred up by their blast, men are carried hither and thither on an uncertain course and by varied error. Hence we must labor with all zeal, first to meet in the unity of the faith, and then, in that same unity, to have the knowledge of the Son of God. When our possession of these is secure, ceasing to be children and receiving the measure of the inner man (which measure of fullness is the measure of Christ), we shall obtain the name of a perfect man: yet in such a way that the whole multitude of believers may arrive at the consummate age of the fullness of Christ, and, by no means wavering in doctrines, may not be carried like children on the uncertain flood of unbelief, while winds blowing from this side and that, namely the diverse and conflicting arguments of heretics or of the wise of this age, either bring shipwreck upon the hearers or threaten it; while some, without any will to deceive, nevertheless preach things that are false, and others, contriving the snares of error with every cunning, hasten to deceive and conquer us. But when the saints have met and arrived at the measure of the aforesaid man, then, understanding the love of Christ, they will increase in him all the seeds of truth which they had received, having the Lord Jesus as the head of the body of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
