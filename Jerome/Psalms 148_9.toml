[[commentary]]
quote='''
Mountains and all hills. Neither are mountains changed into hills, nor valleys into mountains: they keep their own nature. Fruit-bearing trees, and all cedars. You see a tree as if dry, its leaves lost: and at once, when the spring has come, it sends forth a bud for you, it brings forth fruit for you. The tree brings forth fruit for you, and you bring forth no fruit for God. And all cedars. Imitate the cedar: cedars strive toward the heights, as if they hasten to go to heaven. And you, imitate the irrational trees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
