[[commentary]]
quote='''
Wherefore be mindful that once you, Gentiles in the flesh, who were called uncircumcision by that which is called circumcision in the flesh, made by hand: that you were at that time without Christ, alienated from the way of life of Israel, and strangers to the covenants of the promise, having no hope, and without God in the world.

In calling the Ephesians Gentiles in the flesh, he shows that in the spirit they are not Gentiles: just as, on the contrary, the Jews are Gentiles in the spirit and Israelites in the flesh. Jews and Gentiles, then, are divided in four ways. Some are circumcised in the flesh and in the spirit, such as were Moses and Aaron, the Apostles and Nathanael, whose hidden Judaism the Lord beheld when he said: Behold an Israelite indeed, in whom there is no guile (John 1:47). Others are circumcised neither in the flesh nor in the spirit, such as were Nebuchadnezzar and Pharaoh, and today the multitude of the barbarian and Roman nations, which do not believe in God. Third, those who are circumcised only in the flesh and have an uncircumcised spirit, to whom the prophet says: Be circumcised to your God, and do not circumcise the flesh of your foreskin (Jer. 4:4). And elsewhere: All the nations are uncircumcised in the flesh: but the house of Israel are uncircumcised in heart (Jer. 9:26). Last, those of whom it is now said: That once you, Gentiles in the flesh, who were called uncircumcision by that which is called circumcision in the flesh, made by hand, such as is today the whole throng of believers, and the whole world is full of those from the Gentiles. To distinguish them, then, from the Jews, who are Gentiles in the spirit, the Ephesians are called Gentiles in the flesh, because according to the spirit they are Israelites. For in another place too Scripture, mentioning a fleshly Israel, says: Behold Israel according to the flesh (1 Cor. 10): because in the spirit it was not Israel. And he has also tempered his words beautifully: who were called uncircumcision. You were called uncircumcision, he says, and you were not, by that which is called circumcision in the flesh, made by hand. Not that it is circumcision, but that it takes this name to itself, and is truly a circumcision made by hand, not by the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
