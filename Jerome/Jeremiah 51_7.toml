[[commentary]]
quote='''
Further, as to what he says: The day of the Lord is near upon all the nations, let us read the same Jeremiah and we shall see the cup of the Lord passed round to all the nations. Hence it is said in the same prophet: Babylon is a golden cup in the hand of the Lord, making all the nations drunk. For the Assyrians and Babylonians held all the nations as far as the Propontis and the Scythian sea, and the Ionian or the Aegean. Let us read Herodotus and the Greek and barbarian histories, and we shall see how what is said was fulfilled under the Babylonians and Assyrians: The day of the Lord is near upon all the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"

[[commentary]]
quote='''
Let someone say: Why did they make golden calves? Our treasure is stored up in earthen vessels. For the men of the church are rustic and simple, but all the heretics are Aristotelians and Platonists. Indeed, that you may know that all worldly eloquence is called gold — that is, since their tongue, as if for its splendor, is called gold: "Babylon is a golden cup in the hand of the Lord." See what he says: "Babylon," of confusion. Therefore this world is a golden cup. From this golden cup all the nations are given drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"

[[commentary]]
quote='''
In place of what we have as "foreigners," in the Hebrew is written Philistim, which is interpreted "the cup of the draught," because they are made drunk from the cup of Babylon, as Jeremiah says: "The golden cup of Babylon, making all the earth drunk." See what he says, the golden cup of Babylon. Babylon is interpreted "confusion"; but the golden cup is the doctrines of the philosophers and the eloquence of the orators. For who has not been led astray by the philosophers? Who has not been seduced by the orators of this world? A golden cup they have — outwardly the splendor of eloquence; and inwardly poisons are stored, which could not be hidden unless they were concealed under the appearance of gold. You see indeed the honey of eloquence, and you do not suspect the deadly poisons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
