[[commentary]]
quote='''
The partridge has brooded — or has gathered —, what it did not bring forth — and, as the Seventy translated: the partridge cried out, it gathered what it did not bring forth —, he makes his riches not with judgment; in the half of his days he will leave them — or in the half of his days they will leave him — and at his end he will be a fool. The writers of natural history, of beasts and birds as well as of trees and plants, whose chief men among the Greeks are Aristotle and Theophrastus, and among us Pliny Secundus, say that this is the nature of the partridge: that it steals the eggs of another partridge, that is, eggs not its own, and sits on them and broods them, and that when the young have grown up, they fly away from it and leave their alien parent. Of this kind are the rich who plunder what belongs to others and, without reflecting on the judgment of God, make riches not with judgment, which they leave behind in the middle of their time, snatched away by sudden death, when it is said to them: fool, this night they will demand your soul from you; and the things you have prepared, whose will they be? And nothing is more foolish than not to foresee the last things and to think brief things perpetual. Others, however, both on account of the history given above and on account of another, by which they say that the partridge is most quarrelsome and unclean, so much so that it defiles the one it has vanquished, interpret the devil under its name, because he has gathered to himself riches not his own, saying to the Lord: all these things I will give you, if you will fall down and worship me. His riches, which had been wickedly gathered by him, will leave him, and through the apostles they will return to the Lord, and he who seemed to himself most prudent will be, in the judgment of all, a fool. And what is said by the Seventy, the partridge cried out, is to be referred to the person of the heretics: that this partridge, the devil, has cried out through the chiefs of the heretics and has gathered what it did not bring forth, and has gathered to itself a multitude of the deceived, which afterwards will abandon it, and it will be proved by the judgment of all to be most foolish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
