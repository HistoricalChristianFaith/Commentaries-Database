[[commentary]]
quote='''
You shall sow, therefore, O tribe, and O most wicked city, which the heretics build with fire, and iniquity, and insults, and a deceitful balance, and a fraudulent bag; you shall sow, and not reap; you shall press the olive, and not be anointed with oil; and the grapes, and not drink wine. Indeed it profits you, once your error is recognized, that you may not have disciples, that you may not anoint your head with the oil of sinners, that you may not make drunk with the wine of Sodom those who drink it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
