[[commentary]]
quote='''
These chosen ones and teachers swore by the idol of Samaria, that is, by the golden calves, and said: Your god lives, Dan, at the borders of the land of Judea, where Paneas now is, and where at that time the golden calf was worshipped, and the way of Beersheba lives, because they travelled there by a long and seldom-taken journey, on account of the kings of Judah, the righteous and the unrighteous alike. And because they did this, they will therefore fall and will not rise again any more, that is, they will not recover the state which they had had before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
