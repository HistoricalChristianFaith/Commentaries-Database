[[commentary]]
quote='''
Or otherwise; From the time of Augustus Cæsar Judæa was made tributary, and all the inhabitants were registered, as Joseph with Mary his kinswoman gave in His name at Bethlehem. Again, because the Lord was brought up at Nazareth, which is a town of Galilee subject to Capernaum, it is there that the tribute is asked of Him; but for that His miracles were so great, those who collected it did not dare to ask Himself, but make up to the disciple.

Or, They enquire with malicious purpose whether He pays tribute, or resists Caesar's will.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when they had come to Capernaum, those who collected the didrachma came to Peter and said: Does your master not pay the didrachma? He said to them: Yes. After Augustus Caesar, Judea was made tributary, and all were registered by a head tax. Hence Joseph too, with Mary his kinswoman, made his declaration in Bethlehem. Again, since he had been brought up in Nazareth, which is a town of Galilee lying near the city of Capernaum, tribute is demanded of him; and because of the greatness of his signs those who were collecting it do not dare to ask it of him himself, but approach the disciple; or else they ask maliciously whether he pays tribute or opposes the will of Caesar, according to what we also read in another place: Is it lawful to pay tribute to Caesar or not?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
