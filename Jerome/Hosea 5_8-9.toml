[[commentary]]
quote='''
Some, following the Seventy, who said house of ὢν, have interpreted Beth-aven as the city of the sun; and, calling Christ the sun of justice, they would have his city be the Church. This displeases me; for the house of the idol, which Aquila translated useless house, cannot be referred to the Church even according to tropology. But let us say this: that the heretics, who in Gibeah and Ramah promise themselves lofty knowledge, are bidden to howl in the house of the idol, and are not before the face of Benjamin, which is interpreted son of the right hand, but behind his back, where he has no eyes. For all the boasting of Ephraim, which is interpreted fruitfulness, will shortly be in desolation; and when the day of judgment, he says, and the time of rebuke has come, I will show by deeds that my words are not empty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
