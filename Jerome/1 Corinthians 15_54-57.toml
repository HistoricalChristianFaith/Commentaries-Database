[[commentary]]
quote='''
Where we have translated: I will be your death, O death; I will be your bite, O hell, the LXX rendered: Where is your cause, O death? where is your goad, O hell? In place of which the Apostle put: Death is swallowed up in strife? Where, O death, is your strife? Where, O death, is your sting? And expounding the force of the testimony he added: Now the sting of death is sin, and the power of sin is the law; but thanks be to God, who has given us the victory through our Lord Jesus Christ. Therefore what he interpreted of the resurrection of the Lord, we neither can nor dare interpret otherwise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
