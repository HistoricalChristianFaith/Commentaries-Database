[[commentary]]
quote='''
The voice of the howling of the shepherds, because their magnificence is laid waste; the voice of the roaring of lions, because the pride of the Jordan is laid waste. LXX: The voice of shepherds mourning, since their magnificence has been made wretched. The voice of lions roaring, because the roaring of the Jordan is afflicted. Part of the preceding passage is contained in these little verses too. Those whom he had called cedars, firs, pines and oaks of Bashan — and, explaining what these trees were, he had added, saying: Since the magnificent are laid waste — he now, by another μεταφορὰν (metaphor), says are shepherds, that is, princes and teachers; and those who were first among the people, he says, ought to weep and mourn, because their magnificence and beauty and glory has been laid waste and consumed, namely the temple, in which they gloried. And the voice, he says, of the roaring of lions: those whom he calls lofty trees, and again shepherds, the same he now calls lions. And because he had said lions, he keeps the metaphor, so as to add: Since the pride of the Jordan is laid waste, or the roaring and sound of the water running down, which in Hebrew is called gaon. And just as, according to the lie of the land of Judea, he compared the height of the temple to the height of Lebanon — for nothing in the land of promise is loftier than Lebanon, nor more wooded and dense —, so to the river Jordan, which is the greatest in Judea, and near which lions dwell, he joined the roaring of lions, on account of the burning of their thirst; and on account of the nearness of the desert and the breadth of the vast wilderness, and the reed-beds and sedge-beds. Hence it is also said through the prophet: The lion has come up from the Jordan, meaning to show that Nebuchadnezzar went out from his seat, like a lion from its lair, against Jerusalem. Another way: The voice of the roaring of lions, since the pride of the Jordan is laid waste. The voice, he says, of the nobles, because the temple has been destroyed, from which they always hoped for help, and which once nourished just, warlike and mighty lions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
