[[commentary]]
quote='''
And the victims, he says, you have turned aside into the depth, so that no one should repent, nor the slain lift up his head. Both the kings and the priests prevented the people from going to the temple at Jerusalem; therefore they are said to have turned aside the victims into the depth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
And I am the instructor of them all.

I know Ephraim, and Israel is not hidden from me, for now Ephraim has played the harlot, Israel is defiled; they will not give their thoughts to return to their God, for the spirit of fornications is in their midst, and they have not known the Lord. LXX: For I am your teacher. I have known Ephraim, and Israel has not departed from me, for now Ephraim has played the harlot, Israel is stained; they have not given their thoughts to return to the Lord their God, for the spirit of fornication is in them. But the Lord they have not known. O priests and kings, who have deceived my people; and you, O people, who have been deceived: you have sinned so grievously that you have not only slain the victims, but have sent them into the depth of hell. Do not think that by the greatness of your crime you have departed wholly from me. I am your teacher, or rather your instructor, who desire to amend, not to punish; and to save, not to destroy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
