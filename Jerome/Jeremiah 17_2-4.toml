[[commentary]]
quote='''
When their sons remember their altar-stones and their groves and leafy trees on the high mountains, sacrificing in the field, I will give your strength and all your treasures for plunder, your high places on account of sins in all your borders. And you shall be left alone, bereft of your inheritance, which I gave you, and I will make you serve your enemies in a land which you do not know, since you have kindled a fire in my fury; it will burn forever. These things too are not found in the Seventy, for the same reason, I think, that we stated above, namely, lest an eternal sentence should remain against them. You shall be left, he says, alone, bereft of your inheritance, which I gave you, and I will make you serve your enemies in a land which you do not know, either under the Babylonians or, as is truer, under the Romans. For they themselves kindled the fire and provoked the most merciful Lord to fury, and this fire of his fury will burn forever. I am ashamed of the contentiousness of our own people, who find fault with the Hebrew truth. The Jews read against themselves, and the Church does not know what is in her favor. Hence let us, who are the sons of the apostles, remember the iniquities of the former people, and we testify that they have suffered justly. But the 'high places', which in Hebrew are called 'bamoth', can also be taken against the heretics, who have set their mouth on high, and their tongue has passed over the earth, who have broken out into such madness that they alone have remained without the grace of the Holy Spirit and have lost the inheritance of the Lord, namely the former truth of the faith. Hence for them too an eternal burning is prepared, and servitude to the demons, who are their enemies and avengers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
