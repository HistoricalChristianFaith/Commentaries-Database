[[commentary]]
quote='''
Ariopagus [Areopagus]: a first solemnity. But this too is forced, since it is the name of the Athenian court, which received its name from Mars.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Acts of the Apostles"
