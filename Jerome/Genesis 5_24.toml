[[commentary]]
quote='''
We first read the word "transfer" in Genesis (Gen. 5), where "God transferred Enoch, and he was not found". And afterwards in the books of Kingdoms (1 Kings 21), when his wife Jezebel transferred Ahab from the worship of God to the veneration of idols, so that he did according to all that the Amorite did, whom the Lord destroyed from before the face of the children of Israel. But although each is a transfer, the one is God's, the other the devil's. He who is transferred by God is not found by his enemies, nor can the one who lies in wait creep up on him. This indeed is what I judge "and he was not found" to signify. But he who is transferred by the devil is transferred into that which seems to be, but is not.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
