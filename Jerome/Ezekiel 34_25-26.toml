[[commentary]]
quote='''
And when the beasts have been driven out and the land reduced to a solitude, they will sleep secure from animals of this sort and will say: The Lord is my light and my salvation, whom shall I fear? —; and he will set them, those who will sleep secure, round about his mountain or hill, and they will be a blessing; then he will give rain in its season, and there will be rains of blessing — which he promises in the blessings of Deuteronomy —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
