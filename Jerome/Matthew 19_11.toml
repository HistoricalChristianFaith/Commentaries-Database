[[commentary]]
quote='''
But let none think, that wherein He adds, save they to whom it is given, that either fate or fortune is implied, as though they were virgins only whom chance has led to such a fortune. For that is given to those who have sought it of God, who have longed for it, who have striven that they might obtain it.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He said: Not all accept this word, but those to whom it is given. Let no one think that by this word either fate or fortune is brought in, as if those are virgins to whom it has been given by God, or whom some chance has brought to it; rather, it is given to those who have asked, who have willed, who have labored to receive it. For to everyone who asks it will be given, and he who seeks will find, and to him who knocks it will be opened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
