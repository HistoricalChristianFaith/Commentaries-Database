[[commentary]]
quote='''
Go up upon her walls — or bulwarks — and destroy, but do not make a full end! Take away her shoots — or props —, because they are not the Lord's! For with transgression the house of Israel and the house of Judah has transgressed against me, says the Lord. He commands the nations of which he had said above: a lion from the forest struck them, a wolf laid them waste, and a leopard in their cities, to go up upon the walls of Jerusalem, or its bulwarks, and destroy it, but not to make a full end, so that the remnant may be saved and there may be one to announce the glory of God among the nations; and he mingles clemency with severity. And as for what he added: take away her shoots or props, he orders all the aids to be removed which she lost by her own fault, because the house of Israel and the house of Judah transgressed against God, signifying the ten tribes and the two. Let the Church hear this: that the walls and bulwarks of those who have no hope in the Lord and transgress against him are quickly destroyed, but that nevertheless a full end is not made, on account of the clemency of the judge and not on account of the merits of the offenders.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
