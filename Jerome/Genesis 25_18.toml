[[commentary]]
quote='''
As for what we read at the end of this passage according to the Seventy, he dwelt over against the face of all his brothers, truer is that which we have set down, he died in the presence of all his brothers. That is, he died in the hands of all his sons, his children surviving him and none snatched away by death before him. That brothers are called so in place of sons, Jacob also shows when he says to Laban, what is my sin, that you have pursued after me, and that you have searched all my vessels? what have you found of all the vessels of your house? let it be set before my brothers and your brothers, and let them judge between us. For we cannot believe, as Scripture records, that Jacob had any brothers with him apart from his children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
