[[commentary]]
quote='''
It is this God of the incarnate man who is the Father of glory, wisdom and truth, who gives the Spirit of wisdom and revelation to those who believe in his Son so that they may become wise and contemplate the glory of the Lord with unveiled face. When this wisdom and revelation have made them wise and opened to them the mysteries that were hidden, it follows at once that they have "the eyes of their heart enlightened."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians 1:15-17"

[[commentary]]
quote='''
He is the witness of all that the Father promised and bestowed on the world, whose mystery Paul gathers up in a brief word to the Ephesians: The God, he says, of our Lord Jesus Christ, the Father of glory (Eph 1:17); of whom it is written now as well: Because of the Lord your God, and the Holy One of Israel, who has glorified you, and that with the glory which He had before the world was made. Of it the Prophet also testifies: The glory of God shall appear (Heb 1), He who is the brightness of glory and the form of His substance, when every tongue shall confess that the Lord Jesus is in the glory of the Father (Phil 2). He answered the Son, when He asked for the glory which He had had before: I have both glorified it, and will glorify it. Of which the apostle John also says: We saw, he says, His glory, the glory as of the only-begotten of the Father, full of grace and truth (John 12:28; 1:14). Therefore, when he speaks of Him who in the beginning was with God, God the Word, He is called the Father of glory; but when of Him who says in the Gospel, Why do you persecute me, a man who speaks the truth to you (John 8:40)? He is called the God of our Lord Jesus Christ. Not that there is one and another (which is the very bad error of many), but because one and the same Son of God speaks now with the feelings of the glory of His divinity, now with those of our nature, which He deigned to take up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
