[[commentary]]
quote='''
(Liv. xxxix. 43.) We read in Roman history, that Flaminius, a Roman general, sitting at supper with his mistress, on her saying that she had never seen a man beheaded, gave permission that a man under sentence for a capital crime should be brought in and beheaded during the entertainment. For this he was expelled the senate by the censors, because he had mingled feasting with blood, and had employed death, though of a criminal, for the amusement of another, causing murder and enjoyment to be joined together. How much more wicked Herod, and Herodias, and the damsel who danced; she asked as her bloody reward the head of a Prophet, that she might have in her power the tongue that reproved the unlawful nuptials.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And his head was brought on a dish and given to the girl, and she brought it to her mother. We read in Roman history that Flaminius, a Roman general, was expelled from the senate by the censors because, when a little harlot reclining beside him said that she had never seen a man beheaded, he had agreed that a certain man guilty of a capital crime should be beheaded at the banquet: expelled because he had mixed feasting with blood and had offered up the death of a man, guilty though he was, for the delight of another, so that lust and murder were mingled together. How much more wicked are Herod and Herodias, and the girl who danced and asks for the head of the prophet as the price of blood, so as to have in her power the tongue that rebuked the unlawful marriage. Let this have been done according to the letter. But we see to this day, in the head of John the prophet, that the Jews have lost Christ, who is the head of the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
