[[commentary]]
quote='''
Then the prophet questions the same man and angel who was standing among the myrtle groves, and says: What are these, my lord? And the angel who was speaking in him, namely the prophetic sense, promises that he will show what he sees. And when he has promised, it is not he himself who answered, but another who was standing among the myrtle groves, and he says: These are they whom the Lord has sent to walk through the earth. For the apostles were sent by the Lord to fill the whole world with the preaching of the Gospel; and after they had fulfilled the work, they returned to the angel of great counsel who was standing among them (they who said with the Apostle: We are the good odor of Christ among those who are being saved and among those who are perishing) and among the peoples of both callings. And they said to him: We have walked through the earth, we have fulfilled the work enjoined on us, and behold, all the earth is inhabited and at rest, which before was deserted by God; now it is his dwelling, it rests from wars, from the battles of the vices and from sins, because it has received the inheritance of the Lord as he returned to the Father and said: My peace I give you, my peace I leave you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
