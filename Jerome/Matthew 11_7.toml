[[commentary]]
quote='''
Was it for this ye went out into the desert to see a man like unto a reed, and carried about by every wind, so that in lightness of mind he doubts concerning Him whom once he preached? Or it may be he is roused against Me by the sting of envy, and he seeks empty honour by his preaching, that he may thereof make gain. Why should he covet wealth? that he may have dainty fare? But his food is locusts and wild honey. That he may wear soft raiment? But his clothing is camel's hair. This is that He adds, But what went ye out for to see? A man clothed in soft raiment?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Mystically; The desert is that which is deserted of the Holy Spirit, where there is no habitation of God; in the reed is signified a man who in outward show lives a pious life, but lacks all real fruit within himself, fair outside, within hollow, moved with every breath of wind, that is, with every impulse of unclean spirits, having no firmness to remain still, devoid of the marrow of the soul.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"
