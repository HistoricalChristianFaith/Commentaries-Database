[[commentary]]
quote='''
For behold, the Lord will command, and he will strike the greater house with ruins, and the lesser house with rents. Can horses run on rocks, or can there be ploughing with wild oxen? For you have turned judgment into bitterness, and the fruit of righteousness into wormwood. You who rejoice in nothing, who say: Did we not by our own strength take horns for ourselves? For behold, I will raise up against you, house of Israel, says the Lord God of hosts, a nation; and they will crush you from the entrance of Hamath to the torrent of the desert. LXX: Therefore behold, the Lord will command, and he will strike the great house with ruins, and the small house with rents. Will horses give chase on rocks, will they keep silent toward the females? For you have turned judgment into fury, and the fruit of righteousness into bitterness. You who rejoice over no good word, who says: Did we not have horns by our own strength? For behold, I will raise up against you, house of Israel, says the Lord God of powers, a nation; and they will crush you, so that you do not enter into Hamath, and as far as the torrent of the west. Because you have leapt into such madness that even in the time of death, with evils hanging over you, you were unwilling to name the name of the Lord, therefore the Lord will command, and he will strike the greater house with ruins, and the lesser house with rents. If he commands, how does he strike? If he strikes, how does he command? But in commanding and giving orders to his ministers, he himself is seen to strike. Just as, when the Father commands and the Son performs, he who commanded himself does it, and that little verse is fulfilled: He spoke, and they were made; he commanded, and they were created. For all things indeed were made through him, and without him nothing was made that was made. And in Egypt the Lord testifies that he himself killed the firstborn, who are reported to have been slain by the destroyer. So too in the present place the Lord commands, and he himself, through his ministers, strikes the greater house with ruins, that is, the ten tribes, which were called Israel, and the lesser house with rents, the two tribes, which were ruled by the stock of the house of David. And note the particular character of each. Israel, because it had sinned more greatly, is struck with ruins and handed over to perpetual captivity. But the house of Judah, in which the temple was, and which had sinned in part, is held in a captivity of seventy years, and is not struck with ruins but with rents. For a house that is rent can be mended; ruins call not so much for restoration as for building anew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Some, according to anagogy, think that the great house and the lesser house signify the Jewish people and the Church gathered from the Gentiles. For they are called great because of the fathers, and the law, and the prophets; we lesser, because we were without the covenant and the commandments of God, of whom we also read in the Song of Songs: My sister is little, and she has no breasts. This house, great and small, gathered into the one household of God, if it does not keep discipline and does not do the commandments of God, will be struck with ruins and rents. Whenever, therefore, the house of God, which is the Church, collapses and is torn, whether in persecutions or in heresies and schisms, it shows the hand of God striking; and if we wish to escape it, let us hear and follow the example of the comparison.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
