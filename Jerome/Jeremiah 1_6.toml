[[commentary]]
quote='''
And I said: Ah, ah, ah, Lord God, behold, I do not know how to speak, for I am a boy. LXX: and I said, O Lord God, I do not know how to speak, for I am young. He shrinks from an office which, because of his age, he cannot sustain, with the same modesty with which Moses too says that he is of a thin and slender voice. But Moses is rebuked as one of great and robust age; to this one pardon is granted for his boyhood, which is adorned with modesty and shame.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
