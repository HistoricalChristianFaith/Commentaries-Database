[[commentary]]
quote='''
And it will be in that day: I will hear, says the Lord, I will hear the heavens, and they will hear the earth, and the earth will hear the wheat and the wine and the oil, and these will hear Jezreel, and I will sow her for myself in the land, and I will have mercy on her who was Without Mercy; and I will say to Not My People: You are My People; and he will say: You are my God. LXX: And it will be in that day, says the Lord: I will hear the heaven, and the heaven will hear the earth, and the earth will hear the grain, the wine, and the oil, and these will hear Jezreel, and I will sow her for myself upon the land, and I will love her who was not loved; and I will say to Not My People: You are My People; and he will say: You are the Lord my God. In that day and at that time, when I have betrothed you to me in faith, and you have known that I am the Lord, I will hear the heavens, which tell the glory of God, and the heavens will hear the earth, so as to water it with heavenly rain; and the earth, from which truth has sprung, and into whose field the householder goes out to sow his seed, will hear the wheat and the wine and the oil, of which we spoke above; and all these will hear Jezreel, that is, the seed of God, so that it may be understood that the abundance and fertility of all things are granted on account of the seed of God, who is Christ, because the seed of God is sown in the earth, to bring forth manifold fruits, a hundredfold, sixtyfold and thirtyfold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Concerning the hearing of heaven and earth, and of the grain, wine and oil, and of Jezreel, some hold this view: that after Christ has come, all things will run in their own order, and the whole creation will serve the advantage of men, as it was founded in the beginning. All these things the Jews and our Judaizers await bodily, after the Antichrist, at the end of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
