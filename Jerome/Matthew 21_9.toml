[[commentary]]
quote='''
And when all that could be done was done, they added also the tribute of the tongue, as it follows, And the multitudes that went before, and that followed, cried, saying, Hosanna to the Son of David. I shall shortly examine what is the meaning of this word Hosanna. In the hundred and seventeenth Psalm, which is clearly written of the Saviour's coming, we read this among other things; Save me now, O Lord; O Lord, send now prosperity. Blessed art thou that art to come in the name of the Lord. (Ps. 118:25.), For that which the LXX give Ω Κύριε σω̄σον δὴ, Save now, O Lord; we read in the Hebrew, 'Anna, adonai osianna,' which Symmachus renders more plainly, I pray thee, O Lord, save, I pray thee. Let none think that it is a word made up of two words, one. Greek and one Hebrew, for it is pure Hebrew.

For it signifies that the coming of Christ is the salvation of the world, whence it follows, Blessed is he that cometh in the name of the Lord. Which same thing the Saviour in the Gospel confirms, I am come in my Father's name. (John 5:43.)

Or by that which is added, Hosanna, that is, Salvation, in the highest, it is clearly shown that the coming of Christ is not the salvation of man only, but of the whole world, joining earthly things to things heavenly.

When He says, The multitudes that went before and that followed, He shows that both people, those who before the Gospel, and those who after the Gospel, believed on the Lord, praise Jesus with the harmonious voice of confession.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"
