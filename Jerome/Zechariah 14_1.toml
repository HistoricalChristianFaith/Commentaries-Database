[[commentary]]
quote='''
Behold, the days of the Lord shall come, and your spoils shall be divided in the midst of you. And I will gather all the nations to Jerusalem for battle, and the city shall be taken, and the houses shall be laid waste, and the women shall be violated, and half of the city shall go forth into captivity, and the rest of the people shall not be taken away from the city. LXX: Behold, the days of the Lord come, and your spoils shall be divided in you, and I will gather all the nations against Jerusalem, to make war; and the city shall be taken, and the houses shall be plundered and the women shall be defiled, and half of the city shall go forth into captivity; but the rest of my people shall not perish from the city. The days which the Lord threatens shall come, so that the spoils of Jerusalem are divided in the midst of it, and the other things that the prophetic word includes, are those of which we also read in Isaiah: The day of the Lord shall come, incurable, of fury and of wrath, to lay the whole world waste, and to take away the sinners from it. But how great will the distress be, that its spoils are divided in the midst of it? It often happens that what has been plundered in a city by a sudden assault is divided outside, in the field or in the wilderness, lest perhaps an enemy come upon them. But here so great a weight of evils will press down that what has been plundered is divided in the middle of the city, so secure is the victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
