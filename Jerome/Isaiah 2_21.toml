[[commentary]]
quote='''
And when these have been abandoned in the day of the Lord, those who have cast them away will enter the clefts of the rocks and the caverns of the stones, so as to dwell not in the dust of the earth and in vile mud but in firm reason, and find for themselves the various openings of the virtues, through which they may be able to come to the truth. These things, according to the anagogy, I have touched on as I could in brief words; the Hebrews refer them to Babylonian times and the overthrow of Jerusalem, when the Lord rose to strike the land of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
