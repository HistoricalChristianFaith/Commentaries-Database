[[commentary]]
quote='''
Remember these things, Jacob and Israel, for you are my servant; I have formed you, you are my servant, Israel; do not forget me. I have blotted out your iniquities like a cloud, and your sins like a mist. Return to me, for I have redeemed you. Praise, O heavens, for the Lord has done it; shout for joy, you ends of the earth; resound with praise, you mountains, you forest and every tree in it; for the Lord has redeemed Jacob, and Israel will glory. LXX: Remember these things, Jacob and Israel, for you are my child; I have formed you as my child; and you, Israel, do not forget me. For behold, I have blotted out your iniquities like a cloud, and your sins like darkness. Return to me, and I will redeem you. Rejoice, O heavens, for God has had mercy on Israel. Sound the trumpet, you foundations of the earth; cry out with gladness, you mountains, you hills and all the trees that are in them; for God has redeemed Jacob, and Israel will be glorious. Since these things are so, and you know that idols are figments of men, O Jacob, and Israel my child, do not forget your Creator, nor do yourself the injury of bowing down to the work of your own hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
