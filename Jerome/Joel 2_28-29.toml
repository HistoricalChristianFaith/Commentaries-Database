[[commentary]]
quote='''
But all flesh, upon which the Lord promises that he will pour out of his spirit, is that of which Isaiah speaks: And all flesh shall see the salvation of God. Therefore the salvation of God cannot be seen unless the Holy Spirit is poured out. And whoever says that he believes in Christ, not believing in the Holy Spirit, will not have the eyes of perfect faith. Hence also in the Acts of the Apostles, those who had been baptized with the baptism of John into him who was to come, that is, in the name of the Lord Jesus, because they answered Paul when he asked them: But we do not even know whether there is a Holy Spirit, are baptized again; or rather they receive true baptism, because without the Holy Spirit and the mystery of the Trinity, whatever is received in one or another person is imperfect. Nor indeed will everyone who has received the Holy Spirit at once have spiritual grace as well, but through the outpouring of the Holy Spirit they will obtain diverse graces. Some prophecy, like the sons and daughters, who are of greater merit; others dreams, like the old men, now of more advanced age; others visions, like the young men, who have overcome the evil one; but the servants and handmaids, who still have the spirit of fear and not of love, for perfect love casts out fear, will have no prophecy, no dreams, no visions, but, content with the outpouring of the Holy Spirit, will possess only the grace of faith and salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
The word of outpouring too, which in Hebrew is called esphoch, and which all have translated alike, shows the bounty of the gift, in that the gifts of the Holy Spirit have come down by no means upon a few prophets — as used to happen in the Old Testament —, but upon all who believe in the name of the Savior; by no means upon this one and that one, but upon all flesh. For there is no distinction of Jew and Greek, slave and free, man and woman, for we are all one in Christ. Hence also Agabus prophesied at Caesarea, and in Antioch there were very many prophets; and the Apostle commands that if, while one is prophesying, something has been revealed to another, the first should be silent. And we read that the four daughters of Philip the evangelist prophesied. Old men too saw dreams, when Paul, already an old man, heard a man of Macedonia saying to him: Come over to Macedonia and help us. And all the young men who stood out as most strong in Christ, and fought the battles of the Lord, saw visions, the Lord fulfilling his promises: I multiply visions, and in the hands of the prophets I have been likened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
