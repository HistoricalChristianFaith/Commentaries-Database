[[commentary]]
quote='''
For the sons of Israel and the sons of Judah were continually — or alone — doing evil in my eyes from their youth. The Hebrew word 'ach' Aquila translated plēn, which signifies the conjunction 'nevertheless'; the first edition of Symmachus and the Seventy and Theodotion translated 'alone'; but the second edition of Symmachus rendered diolou, which we too have followed for the present, so as to say 'continually'. Let us then speak first according to the Hebrew: the sons of Israel and the sons of Judah continually doing evil. 'Both the ten', he says, 'and the two tribes did evil without ceasing, and their perseverance in the worst works was continual'. But if it was continual and always in the whole people, where is everlasting righteousness? But according to the Seventy, who said: alone doing evil, the question arises: had the other nations not done evil at the time when Israel and Judah were sinning? It is resolved thus: he who has the knowledge of God and departs from him sins alone in the eyes of God; but those who remained unbelieving offend as though he did not see and did not care. Hence also David, a holy man, because he had fallen into sin with Bathsheba, the wife of Uriah, afterwards in repentance says: against you alone have I sinned and done evil before you, that is, 'in your sight'. Then it is added: alone doing evil in the eyes and in my sight from their youth. And what follows: the sons of Israel, who until now embitter me by the work of their hands, says the Lord, is not in the Seventy and has been added from the Hebrew. But because they offended continually from their youth up to the present day, the sentence of God is therefore just, and Scripture rightly goes on:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
