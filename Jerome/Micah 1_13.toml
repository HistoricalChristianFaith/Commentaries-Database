[[commentary]]
quote='''
Therefore, O Lachish, city given over to idols, the chariot and cavalry of the Assyrians will come to you too, because in you also were found the crimes of Israel, and you were the beginning of idolatry in Judah; for through you, as through a gate, the impiety of the ten tribes migrated into Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
After this it is written: You who dwell in Lachish: she is the chief of sin for the daughter of Zion. Lachish is interpreted πορεία ἐστὶν, that is, walking. And so these too, who went up in their chariots, and had horsemen, and only din and empty sound, to whom she who dwells well in her cities said, These in chariots and these on horses, but we will call upon the name of the Lord our God; because they moved their feet, and were carried about by every wind of false doctrine, and wished to go out from the Church, which is interpreted watchtower, that is, Zion, were the chiefs of sin for the daughter of Zion. And in her, that is, in Lachish, were found the impieties of Israel, which separated the people of God from its former kingdom. She, then, who dwells in Lachish, that is, in a most evil walking, with a step ever wavering, is the chief of sin for the daughter of Zion; and the impiety of Israel is in those who always move their feet and are said to dwell in Lachish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
