[[commentary]]
quote='''
The Pharisees ascribed the works of God to the Prince of the dæmons; and the Lord makes answer not to what they said, but to what they thought, that even thus they might be compelled to believe His power, Who saw the secrets of the heart; Jesus, knowing their thoughts, said unto them.

For as small things grow by concord, so the greatest fall to pieces through dissensions.

As much as to say, If Satan fight against himself, and dæmon be an enemy to dæmon, then must the end of the world be at hand, that these hostile powers should have no place there, whose mutual war is peace for men.

But if ye think, ye Scribes and Pharisees, that the dæmons depart out of the possessed in obedience to their Prince, that men may be imposed upon by a concerted fraud, what can ye say to the healing of diseases which the Lord also wrought? It is something more if ye assign to the dæmons even bodily infirmities, and the signs of spiritual virtues.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
If Satan casts out Satan, he is divided against himself; how then will his kingdom stand? A kingdom and a city divided against itself cannot endure; but as small things grow by concord, so the greatest fall apart by discord. If, then, Satan fights against himself, and demon is the enemy of demon, the consummation of the world ought already to have come, and the adverse powers would have no place in it, whose war among themselves is the peace of men. But if you think, O scribes and Pharisees, that the withdrawal of the demons is obedience to their prince, so that by a fraudulent pretense they may delude ignorant men, what can you say of the healings of bodies which the Lord performed? It is another matter if you ascribe to the demons the infirmities of the limbs too, and the signal marks of spiritual mighty works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
