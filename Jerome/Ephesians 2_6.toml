[[commentary]]
quote='''
And he raised us up together, and at the same time made us sit in the heavenly places in Christ Jesus.

He had said above that God raised Christ from the dead and made him sit at his right hand in the heavenly places, above every principality, and power, and virtue, and dominion, and every name that is named, not only in this age but also in that to come. But now he has added: that he has also raised us with him, and made us sit in the heavenly places at his right hand. The question is therefore asked how God, who saved us and raised us, has made us sit together with Christ. And indeed one who means to answer more simply asserts this: that, according to the foreknowledge of God, he has spoken of what is going to be as though it had already been done; and that this is the custom of the Scriptures, that future things are sometimes inflected in the past tense. For example, of the cross of the Lord: They dug my hands and feet (Ps. 21:17). And elsewhere, of his passion: He was led as a sheep to the slaughter (Isa. 53:7). And further, of the injuries of the scourges: By his bruise we have been healed (ibid., 5). And elsewhere: Because of the iniquities of my people he was led to death (ibid., 8, LXX). Now this is done so that, because future things are always uncertain, men's hope may not waver and totter: the things which God has known to be future (with whom nothing is doubtful) are related as though already done; so that, since past things, according to the philosophers too, cannot be made undone, those who hear may hold the things that are to come as though already done. Another, however, who understands the resurrection and the kingdom of Christ spiritually, has not hesitated to say that the saints already sit and reign with Christ: for just as the saint is by no means in the flesh though he lives in the flesh, and has his way of life in the heavenly places though he walks on the earth, and, ceasing to be flesh, is wholly turned into spirit: so he sits in the heavenly places with Christ; for the kingdom of God is within us (Luke 17:21), and where our treasure is, there will our heart be also (Matt. 6:21); and firm and steadfast we sit with Christ, with wisdom, the Word, righteousness, truth. But this too can be said: that, just as we have received the earnest of the Holy Spirit without yet having attained his whole fullness, so we also sit and reign with Christ without yet having obtained the perfect session in the heavenly places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
