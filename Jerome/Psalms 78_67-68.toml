[[commentary]]
quote='''
According to the ἀναγωγὴν [anagogy, the higher sense], we have discussed more fully in the prophet Hosea what Joseph, Ephraim, Samaria, Jezreel and Israel signify, and how they are opposed to the house of David and to Jerusalem, which signifies the Church — of whom Psalm 77 (78) also sounds: The sons of Ephraim, bending and shooting the bow, turned back in the day of battle, and again: He rejected the tabernacle of Joseph and chose the tribe of Judah; for the Lord chose the house of confession, the Church, and rejected the tabernacle of 'Joseph', which means 'increase'; and they, setting aside the law of God, added golden calves of their own worship —; and she is called 'Oolla', that is, 'tabernacle', not of God but of error and of demons;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
