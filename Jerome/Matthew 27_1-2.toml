[[commentary]]
quote='''
Observe the evil zeal of the Chief Priests; they watched the whole night with a view to this murder. And they gave Him up to Pilate bound, for such was their practice to send bound to the judge any whom they had sentenced to death.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When morning had come, all the chief priests and the elders of the people took counsel against Jesus, to hand him over to death; and they led him bound and handed him over to Pontius Pilate the governor. He was led not only to Pilate but also to Herod, so that both might mock the Lord. And see the zeal of the priests for evil: they kept watch the whole night in order to commit murder. And they handed him over bound to Pilate. For they had this custom, that whomever they had adjudged to death they handed over bound to the judge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
