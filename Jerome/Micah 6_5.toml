[[commentary]]
quote='''
For the torrent of cords, or of thorns, Symmachus rendered the valley of thorns. Now there is a place near Livias, beyond the Dead Sea, six miles distant from Livias, where Israel once committed fornication with the Midianites. This place the prophet Micah mentions in the person of God, saying: My people, remember, I pray, what Balak king of Moab devised, and what Balaam son of Beor answered, from Settim to Gilgal. For which there too the Seventy translated ἀπὸ τῶν σχοίνων, that is, from the cords to Gilgal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
