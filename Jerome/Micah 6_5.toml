[[commentary]]
quote='''
For the torrent of cords, or of thorns, Symmachus rendered the valley of thorns. Now there is a place near Livias, beyond the Dead Sea, six miles distant from Livias, where Israel once committed fornication with the Midianites. This place the prophet Micah mentions in the person of God, saying: My people, remember, I pray, what Balak king of Moab devised, and what Balaam son of Beor answered, from Settim to Gilgal. For which there too the Seventy translated ἀπὸ τῶν σχοίνων, that is, from the cords to Gilgal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
My people, what have I done to you, and in what have I been troublesome to you, answer me, for I brought you up out of the land of Egypt, and from the house of servants I freed you, and I sent before your face Moses, and Aaron and Miriam. My people, remember, I pray, what Balak king of Moab devised against you, and what Balaam son of Beor answered him, from Shittim to Gilgal, that you might know the justices of the Lord. LXX: My people, what have I done to you, or how have I grieved you, or in what have I been troublesome to you? Answer me: for I brought you up out of the land of Egypt, and from the house of bondage I redeemed you, and I sent before your face Moses, and Aaron and Miriam. My people, remember what Balak king of Moab devised against you, and what Balaam son of Beor answered him, from Schoenis to Gilgal, that the justice of the Lord might be known. For justices or justice Symmachus rendered mercies, and where the LXX has Schoenis, all rendered the Hebrew itself, Settim. Now it is a place in which Balak king of the Moabites gathered an army against Israel, ὁμώνυμος (of the same name) with the trees which even today grow throughout the desert of Mount Sinai. For where in the LXX the ark of the covenant, or the altar and the tabernacle, and the other things which are reported to have been made of incorruptible wood are mentioned, in the Hebrew Settim wood is set down, which has the likeness of the tree that we commonly call the white thorn. Hence I think that the LXX too rendered σχῖνον, that is, the mastic tree, but that gradually, through the error of copyists, it came about that σχοῖνοι, that is, ropes, was read instead of σχίνοις, that is, mastic trees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
But if this seems little to you, remember that time when Balak king of Moab hired Balaam the diviner for a fee against you, and see how, against his own will, the soothsayer, wishing to curse you, blessed you; from Shittim to Gilgal, surveying with his eyes the whole army of Israel and changing places, as if I could not go with him as he went and pass over with him as he passed over; and this I did so that my mercies and justices might be known to you, for I love you so much that, while I am cursed daily by the mouth of blasphemers, I did not allow you to be cursed by the enemy. The Hebrews expound this passage, in which it is said: From Shittim to Gilgal, that you might know the justices of the Lord, thus: From the time when you committed fornication in Midian until the time when Saul was anointed king at Gilgal, recall to memory what evils you have done, and how great the good things I have done for you, and you will know my mercy toward you. Let this be what God spoke to carnal Israel according to the history.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
For let us remember what he devised against us who wished to devour us and lick up our congregation: the true Balak, the devil. For Balak is interpreted ἐκλείχων, that is, licking up, king of the paternal water; since Moab, according to another etymology, is called paternal water. When, therefore, Balak was lying in wait for us, and lying in wait through his vain people, which is what Balaam is interpreted, God did not allow us to lie under his curses, but on the contrary there blessed us, compelled by the truth of the thing itself, the vain people of the nations, born of him who is in the skin — for Beor is interpreted in the skin — ever given over to the flesh and to the works of death; and the vain people, sprung from him who is wholly in the skin, answered on our behalf, always changing places, or standing upon thorns, or upon cords, so that we may follow the error of the common edition too. Now thorns, according to the Savior's words, are the cares of this world, and riches, and pleasures, in which the vain people is. And that it stands in ropes, namely in the bonds of sins — for with the ropes of his own sins each one is bound — Isaiah also is witness, saying: Woe to those who drag out their sins like a long rope, and iniquities like the strap of a heifer's yoke. If, then, it stands, it stands only on thorns and on ropes; but if it wishes to go around, it has no steady step, but, always wavering and tottering, it comes as far as Gilgal, which is interpreted κυλισμὸς, that is, rolling, or a wallowing-place. Whenever we see some rising up against us, and thirsting for our blood with greedy jaws, and, by an unforeseen dispensation of God, those who had come against us coming over to our side, let us say: Balaam came from the cords as far as Gilgal, that the justice of God may be known.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
