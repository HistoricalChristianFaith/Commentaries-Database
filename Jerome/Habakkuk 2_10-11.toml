[[commentary]]
quote='''
You have slain many peoples, and in killing others you have raged against your own soul, and you have run riot in such cruelty that, if it can be said, the stones of the city and the timbers of the walls which you have overthrown cry out your ferocity. Something of this kind the Lord too said in the Gospel against the Pharisees, who reproached him for not rebuking the children who acclaimed him: Hosanna in the highest to the son of David, blessed is he who comes in the name of the Lord; Hosanna in the highest. Have you not read, he says, that it is written: Out of the mouth of infants and sucklings you have perfected praise? And if these are silent, the stones will cry out. For although very many think it is to be understood thus, if the Jews are silent, the multitude of the nations will confess me, yet this is the more expressive and truer understanding: even if men were silent, and the envious tongue would not speak of the multitude of my signs, yet the stones themselves, and the foundations of the walls, and the structure of the walls will be able to proclaim aloud my greatness. And to make this more significant, let us set down examples from secular literature too. Crispus says in his Histories: "The Saguntines, renowned for loyalty and sufferings beyond mortals, with greater zeal than resources; for among them even then the half-ruined walls, the unroofed houses, and the scorched walls of the temples displayed the Punic hands". Something similar Tullius too says to Caesar for Marcellus: "The walls, so help me heaven — as it seems to me — of this senate house long to give you thanks, because in a short time that authority will be in these seats of its ancestors and its own". Moreover, where we have translated: And the timber that is between the joints of the buildings will answer, for which the Seventy put: And the beetle from the wood will speak these things, Symmachus, after his manner, translated more plainly, καὶ συνδεσμὸς οἰκοδομῆς ξύλινος ἀποφθέγξεται αὐτὰ, that is: And the wooden joint of the building will speak these things. Theodotion too, καὶ συνδεσμὸς ξύλου φθέγξεται αὐτά, and also the Fifth Edition, καὶ συνδεσμὸς ξύλου φθέγξεται αὐτά, and these translations also agree with that of Symmachus and with ours. For what is called chaphis in the Hebrew language signifies the timber that is set in the middle of a structure to hold the walls together, and among the Greeks it is commonly called ἱμάντωσις (a tie-beam). This, therefore, is what the prophetic discourse signifies according to the history: the stones of the walls which were destroyed by you, and their burnt timbers, will sound forth your cruelty. Besides the five editions, namely of Aquila, Symmachus, the Seventy, Theodotion, and the Fifth, I found in the twelve prophets two other editions as well, in one of which is written: For the stone will cry out from the wall like a worm speaking in the wood, and in the other: For the stone will shout from the wall, and the σκώληξ from the wood will speak these things. But Aquila too put something other than we said, καὶ μάζα, that is, and a lump from the wood will answer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
