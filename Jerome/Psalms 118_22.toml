[[commentary]]
quote='''
Now the chief cornerstone, which holds both peoples together (or, according to the second interpretation, joins heavenly and earthly things), is Christ our Lord, the stone cut from the mountain without hands, of whom the Psalmist also testifies, saying: The stone which the builders rejected, this has become the head of the corner. This has been done by the Lord (Ps. 117:22). For he was rejected by the Pharisees, who seemed to have knowledge of the Law and to be building the temple of God with the commandments of the Law; and he was taken up by God as the cornerstone, so that he himself, in the middle, might hold the two walls together, and through him both peoples might have access to God. This cornerstone is, to those who do not believe, a stone of stumbling and a rock of offence: whoever falls upon it will be shattered; but on whomever it falls, it will crush him (Luke 20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
