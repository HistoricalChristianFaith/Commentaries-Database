[[commentary]]
quote='''
Riches, then, says Ecclesiastes, are of no profit to their possessor except only this, that he sees what he possesses. For the greater his substance, the more servants he will have to devour the wealth he has gathered. He, however, may only look at what he has, and cannot take in more than one man's food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
