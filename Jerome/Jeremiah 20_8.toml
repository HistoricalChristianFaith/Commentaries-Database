[[commentary]]
quote='''
'And I cry out the Babylonian devastation and the iniquity of the enemies, by which my people is to be oppressed.' But if we follow the Seventy in what they said: for with my bitter word I shall laugh, I shall call upon transgression and misery, this is the sense: 'I know that the present sadness is to be exchanged for future joy, according to what is written: blessed are those who weep, for they shall laugh; and therefore I willingly endure misery and iniquity and affliction, so that I even desire them and call upon them, and make up for the brevity of the injury with the eternity of happiness'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
