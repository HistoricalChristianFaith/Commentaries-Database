[[commentary]]
quote='''
You have forsaken me, says the Lord; you have gone backward. The reason is given why no one should have pity on Jerusalem, or grieve for her, or entreat for her peace: that, although according to the Apostle she ought, forgetting what lies behind, to have stretched forward to what lies before, she on the contrary turned back and longed for the meats of Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And I will stretch out my hand over you and kill you; I have labored, being entreated — or entreating —, for which the Seventy translated: I will by no means forgive them any longer. An outstretched hand is the sign of one who strikes; the killing of sinners signifies wrath brought to completion. But what he added: I have labored, being entreated or entreating, has a twofold sense: that God has already grown faint from often forgiving them, and that he is weary from always calling them to salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
