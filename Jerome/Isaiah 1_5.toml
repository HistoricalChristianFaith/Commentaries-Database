[[commentary]]
quote='''
Upon what shall I strike you, you who add transgression still further? By this testimony we learn that the Lord strikes those who offend for this purpose, that he may correct them once struck, and that it may be not so much a punishment as an amendment. And the sense is: I do not find what medicine I can apply to your wounds; all your limbs are full of wounds; I find no part of the body that has not already been struck. Or certainly in this way: I find no blows with which to break your hardness. For the greater the torments are, the more impiety and iniquity grow, or, as Theodotion translated, turning aside, so that you withdraw and turn aside from the Lord. Like that saying of Jeremiah: In vain have I struck your sons; you have not received discipline (Jer 2:30). Hence he speaks in anger through Hosea: I will not punish your daughters when they commit fornication, nor your daughters-in-law when they commit adultery (Hos 4:14). And through Ezekiel: My jealousy shall depart from you, and I will be angry with you no more (Ezek 16:42). Of whom we read in the Psalms too: There is no firmness in their stroke; and they are not in the labors of men, nor shall they be scourged with men (Ps 72 [73]:4, 5).

Every head is sick, and every heart grieving. Gladness of mind sometimes eases pain of body; but if sickness of mind is added to the illness of the body, the infirmity is doubled. Among the senses themselves, too, and all the members of the body, the head holds the chief place, for in it are sight and smell, hearing and taste. When, therefore, the head is in pain, all the members are weak. And by a metaphor he teaches that from the princes down to the lowest common people, from the teachers down to the unlearned crowd, there is soundness in none, but all agree in impiety with equal ardor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
