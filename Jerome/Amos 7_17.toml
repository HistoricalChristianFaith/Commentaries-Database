[[commentary]]
quote='''
Because, therefore, you said to me: You shall not prophesy, your wife shall commit fornication in the city; which Symmachus translated better, πορνευθήσεται, not that she herself will commit fornication, but that, in the passive voice, violated by others, she will suffer fornication. And it is a great grief and an incredible disgrace when a husband, in the middle of the city, with everyone present, cannot prevent the outrage done to his wife. Your sons also, he says, and your daughters shall fall by the sword. The grief over a violated daughter is not so great as over a defiled wife, nor the grief over a slain wife so great as over slaughtered children. For a husband would more willingly have his wife killed than defiled. Nor is this enough for the outrage, unless his land too is divided with the line by the enemy, and receives new tillers. Amaziah himself also, who now glories in the power of the priesthood, will by no means die in his own land, but, led into captivity, will die in a land polluted with idols; and he will not die before he sees the people he had deceived enslaved and captive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
