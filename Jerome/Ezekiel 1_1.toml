[[commentary]]
quote='''
[Daniel 10:4] "And in the twenty-fourth day of the first month, I was beside the great river which is the Tigris." Ezekiel also had seen a great vision beside a river, the Chebar (Ezekiel 1:1). And it was by the stream of the Jordan that the heavens were opened to the gaze of our Lord and Savior and also to John the Baptist (Matthew 3:1-17). Therefore those critics should leave off their foolish objections who raise questions about the presence of shadows and symbols in a matter of historical truth and attempt to destroy the truth itself by imagining that they should employ allegorical methods to destroy the historicity of rivers and trees and of Paradise.
'''
source_url='https://www.ccel.org/ccel/pearse/morefathers/files/jerome_daniel_02_text.htm'
source_title="St. Jerome, Commentary on Daniel, CHAPTER TEN"

[[commentary]]
quote='''
The Prophet Ezekiel was led captive with Joachin king of Judah to Babylon, and he prophesied there to those who were captives with him, to those repenting that they had willingly handed over the prophecy of Jeremiah to enemies, and yet saw the city Jerusalem to stand, which he had predicted would fall. And in his thirtieth year of age, and in the fifth year of the captivity, he began to speak to his fellow captives. And at the same time, though later, this one in Chaldea and Jeremiah in Judea prophesied. His style is neither greatly eloquent nor excessively rustic, but properly proportioned between both. And he was a priest, as also was Jeremiah, the beginning and ending of the book being wrapped in great obscurities. But also the common edition of him does not differ much from the Hebrew one. Because of that I greatly wonder what was the cause, that when we have the same translators in all the books, in some they translated the same things, in others, different things. Therefore, read this also according to our translation because, by being written in words with spaces, it gives a clearer meaning to readers. And if my friends also mock this, say to them that no one restrains them from writing. But I do not respect him who follows them, which is more clearly said in Greek, as they are called insult-swallowers (φαγολοιδοροι).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FBiblical%2520Prefaces%2FEzekiel.html'
source_title="Prologue to Ezekiel"

[[commentary]]
quote='''
Having finished the eighteen volumes of explanations on Isaiah, I was eager to pass on to Ezekiel, which I had often promised to you and to your mother Paula of holy memory, O Eustochium, virgin of Christ, and to put the final hand, as the saying goes, to the prophetic work; and behold, suddenly the death of Pammachius and Marcella, the siege of the city of Rome, and the falling asleep of many brothers and sisters were announced to me. And I was so dismayed and stunned that day and night I thought of nothing else but the safety of all, and considered myself a captive in the captivity of the saints, nor could I open my mouth until I learned something more certain, while I hang anxious between hope and despair and torment myself with the misfortunes of others. But after the brightest light of all the earth was extinguished, nay rather, after the head of the Roman empire was cut off and, to speak more truly, the whole world perished in one city, I became mute and was humbled and kept silent from good things, and my sorrow was renewed; my heart grew hot within me, and in my meditation a fire will blaze up; nor did I think that saying should be neglected: Music in mourning is an untimely tale. But since you too demand this unceasingly, and a scar is gradually drawn over the great wound, and the Scorpion is pressed down beneath the soil of Trinacria between Enceladus and Porphyrion, and the Hydra of many heads has at last ceased to hiss against us, and a time has been given in which we ought to devote ourselves not to answering the snares of heretics but to the exposition of the Scriptures, I shall take up the prophet Ezekiel, whose difficulty the tradition of the Hebrews proves. For among them, unless someone has completed the age of priestly ministry, that is, the thirtieth year, he is permitted to read neither the beginnings of Genesis, nor the Song of Songs, nor the beginning and end of this volume, so that the full time of human nature may come to perfect knowledge and to mystical understandings. If by the mercy of the Lord I bring this work through to the finish, I shall pass on to Jeremiah, who in his Lamentations, under the type of Jerusalem, laments the four quarters of the world with a fourfold alphabet.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And it came to pass in the thirtieth year, in the fourth, on the fifth of the month. The thirtieth year is spoken of not, as most suppose, with reference to the age of the prophet, nor to the jubilee, which is the year of remission, but counting from the eighteenth year of Josiah king of Judah, when the book of Deuteronomy was found in the temple of God, up to the fifth year of the captivity of Jehoiachin, surnamed Jeconiah, who was led into Babylon with his mother and with Daniel and the three youths and Ezekiel — this is the first captivity of the tribe of Judah, when the wrath of God dripped down upon Jerusalem —. According to the ἀναγωγὴν [anagogy, the higher sense], however, the Lord and Savior is prefigured, who at thirty years of age came to baptism, which is the perfect age in a man. Hence also in the book of Numbers, according to the Hebrews, the priests begin to minister in the tabernacle not from the twenty-fifth year of age, as is contained in the Seventy, but from the thirtieth. As a sign of this Joseph too went before, when in Egypt he bestowed grain on the hungry people, and John the Baptist came to the streams of the Jordan and preached the baptism of repentance. In what is written, 'in the fourth', with the sentence left hanging, 'month' is understood; for at once there follows 'on the fifth of the month'. To make this plainer, the Seventy added it above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
When I was in the midst of the captives beside the river Chebar, the heavens were opened and I saw visions of God. On the fifth of the month, that is the fifth year of the exile of King Jehoiachin. That the captive people sat by the river of Babylon, David prophesies in the spirit: By the rivers of Babylon, there we sat and wept; Chebar, moreover, is either the name of a river or certainly, according to its interpretation, by which it is rendered 'heavy', it signifies the Tigris and the Euphrates and all the great and very heavy rivers which are said to be in the land of the Chaldeans; and understand the opened heavens not by a division of the firmament but by the faith of the believer, because the heavenly mysteries were unlocked to him. Hence also at the baptism of the Savior, when the Holy Spirit descended upon him in the form of a dove, we read 'the heavens opened'; and when these are unlocked, visions are laid open, not one vision but many, as the Lord says through the prophet: I will multiply visions, and in the hands of the prophets I have been likened. These are the visions which the whole prophecy of Ezekiel has woven together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
This too is to be understood: that the Lord came to baptism in the thirtieth year of his age; in the fourth month, which among us is called January and stands first at the beginning of the year, apart from Nisan, the month of new things, in which the Passover is celebrated — for among the eastern peoples, after the gathering of the crops and the winepresses, when the tithes were brought into the temple, October was the first month and January the fourth —; and he adds the fifth day of the month, and it signifies the baptism in which the heavens were opened to Christ, and the day of the Epiphany is venerable to this day — not, as some think, his birth in the flesh, for then he was hidden and did not appear. This fits that time when it was said: This is my beloved Son, in whom I am well pleased.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
