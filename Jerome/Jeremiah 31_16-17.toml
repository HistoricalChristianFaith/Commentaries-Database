[[commentary]]
quote='''
Thus says the Lord: let your voice cease from wailing and your eyes from tears, for there is a reward for your work, says the Lord, and they shall return from the land of the enemy — or of the enemies — and there shall be hope for your last end, says the Lord, and the sons shall return to their borders. This has not yet happened according to the letter — for we do not read that the ten tribes, which are in exile in the cities of the Medes and of the Persians, have returned to the land of Judea —, but according to the spirit it was fulfilled in the passion of the Lord and is being fulfilled up to now, when Israel is saved from the whole world and it is said to Rachel: let your voice cease from wailing and your eyes from tears!, and the sense is: 'cease to wail — for the Lord has looked upon your former works — and your sons shall return from the land of the enemy, and do not be held by present sorrow! for there is hope in your last end, says the Lord, and your sons shall return to their borders, which their fathers had, Abraham, Isaac and Jacob'. But we understand it better of the little ones: that they have the reward of their blood shed for Christ, and in place of the land of Herod the enemy they hold the kingdoms of heaven, and they will return to their former seat when, in place of the body of lowliness, they receive a glorious body. This is the last hope, when the righteous shall shine like the sun, and the infants, once little ones and sucklings, rise again without the increase of years and without the injuries and toil of the body. Into the perfect man, into the measure of the fullness of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
