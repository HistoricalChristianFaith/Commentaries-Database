[[commentary]]
quote='''
I am fastened to the cross with Christ. Since he had said that he had died to the law through the law, he shows how he died: I am fastened to the cross with Christ, taking up his cross and following Christ, and in the very passion beseeching: "Remember me when you come into your kingdom" (Luke 23:42, 43). And at once hearing: "Today you will be with me in paradise". If anyone, having put to death his members which are upon the earth, and being dead to the world, has been conformed to the death of Jesus Christ, he is crucified with Jesus, and fixes the trophy of his own mortification on the wood of the Lord's passion.

And I live, now not I: but Christ lives in me.

He no longer lives who once lived in the Law, he, namely, who persecuted the Church. But Christ lives in him: wisdom, strength, the Word, peace, joy and the other virtues; and whoever does not have these cannot say: But Christ lives in me. All this, however, he argues in his own person against Peter, about Peter.

And that I now live in the flesh. It is one thing to be in the flesh, and another to live in the flesh. "For those who are in the flesh cannot please God" (Rom. 8:8, 9). Hence it is said to those who live well: "But you are not in the flesh".

I live in the faith of the Son of God, who loved me and delivered himself up for me. To the Romans he speaks of God, that he did not spare his own Son, but delivered him up for us. But now he speaks of Christ, that he delivered himself up: Who loved me, he says, and delivered himself up for me. In the Gospel, moreover, where the apostles are enumerated, it is added: "And Judas Iscariot, who also delivered him up" (Luke 6:16). Again in the same: "Behold, he who will deliver me up has drawn near" (Matt. 26:46). And of the chief priests and the elders of the people, Scripture records that they condemned Jesus to death, and binding him, led him away and delivered him up to Pilate the governor (ibid. 27, and Mark 15). And next, of Pilate: "He released Barabbas to them, but Jesus, when he had been scourged, he delivered up to them, that they might crucify him" (John 19). Therefore both the Father delivered up the Son, and the Son delivered himself up, and Judas and the priests delivered him up to the rulers, and finally Pilate himself delivered up the one who had been delivered up to him. But the Father delivered him up in order to save a lost world; Jesus delivered himself up in order to do the will of the Father and his own; but Judas and the priests and the elders of the people, and Pilate, unknowingly delivered up Life to death. And since Life itself also delivered itself up for our salvation, blessed and very happy is he who, with Christ living in him, can say through each of his thoughts and works: I live in the faith of the Son of God, who loved me, and delivered himself up for me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
