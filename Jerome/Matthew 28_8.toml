[[commentary]]
quote='''
A twofold feeling possessed the minds of the women, fear and joy; fear, at the greatness of the miracle; joy, in their desire of Him that was risen; but both added speed to their women's steps, as it follows, And did run to bring his disciples word. They went to the Apostles, that through them might be spread abroad the seed of the faith.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they went out quickly from the tomb with fear and great joy, running to announce it to his disciples. A twofold feeling, of fear and of joy, held the minds of the women: the one from the greatness of the miracle, the other from longing for the one rising again; and yet both spurred on the women's step. They were going to the apostles so that through them the seed of faith might be scattered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
