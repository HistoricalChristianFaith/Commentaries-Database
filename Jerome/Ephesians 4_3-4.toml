[[commentary]]
quote='''
I am not unaware that in what I have just expounded, careful to keep the unity of the spirit in the bond of peace, the Spirit is taken by very many not as the Holy Spirit but as the disposition and judgment of the mind, according to which all believers had one soul and one heart (Acts 4). And the Apostle enjoins the virgin: That she may be holy both in body and in spirit (1 Cor. 7:34), that is, in the work of the flesh and in the disposition of the mind. But the general explanation can also be drawn to a special interpretation: that he keeps the unity of the spirit in the bond of peace who is not carried away by every wind of doctrine, nor changes like the moon after the manner of the fool (Sir. 27), now serving the devil, now God. Let him, moreover, have one body of good works, and always present his flesh to God as a temple; and one spirit, always thinking the same things; in one hope of the calling, so that, by no means doubting the promises, he may trust with a firm mind in the resurrection and restoration of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
