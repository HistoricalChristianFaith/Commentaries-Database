[[commentary]]
quote='''
For behold, I will raise up the Chaldeans, a bitter and swift nation, walking over the breadth of the earth, to possess tents not its own. It is dreadful and terrible; from itself is judgment, and its burden will go forth. Its horses are lighter than leopards, and swifter than evening wolves; and its horsemen will spread abroad; for its horsemen will come from afar, they will fly like an eagle hastening to eat. All will come for plunder; their face is a burning wind; and it will gather captivity like sand. And he will triumph over kings, and tyrants will be his laughingstock; he will laugh at every fortress, and will heap up a mound, and will take it. Then the spirit will be changed, and he will pass through and fall; this is his strength, that of his god. LXX: For behold, I will raise up the Chaldeans, a bitter and swift nation, which walks over the breadth of the earth, to possess tents not its own. It is terrible and illustrious; from itself will be its judgment, and its assumption will go forth from itself. And its horses will leap beyond leopards, and will be swifter than the wolves of Arabia, and its horsemen will ride, and will come with a rush from far away; and they will fly like an eagle ready to eat. Consummation will come upon the wicked, who resist their faces from the opposite side; and it will gather captivity like sand; and he will take delight in kings, and tyrants are his sport; and he will make sport of every fortress, and will cast up a mound, and will take it; then he will change his spirit and pass through, and will be propitiated; this is the strength of my God. What I had said to you, Look among the nations, and see, and wonder, and be astounded, for a work will be done in your days which no one will believe when it is told: this is what the following discourse describes: Behold, I will raise up Nebuchadnezzar and the Chaldeans, a most warlike and swift nation, to whose strength and boldness in making war almost all the Greeks who have written barbarian histories are witnesses. This nation is not content with its own borders, but, running to and fro, it roams over the breadth of the earth. And this is its work: not to work the land with the plowshare, but to live by plunder and the sword, and to possess cities not its own; before it lays a hand on them, before it bursts out into war, it carries terror in its countenance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
