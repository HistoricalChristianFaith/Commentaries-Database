[[commentary]]
quote='''
Therefore I say plainly that the just man has two right hands. Indeed even that Ehud, who is written of in the book of Judges, is said to have two right hands for this reason, because he was just, and he killed that very fat king.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_020.html'
source_title="Homily 20, on Psalm 90"

[[commentary]]
quote='''
Do you wish to know that the just man has no left hand? When Moses, in the type of the cross, lifted both his hands to heaven, it is not written, "Aaron was at his right and Hur at his left," but that on this side stood Aaron and on that side Hur. In the book of Judges too, that leader Ehud, whose mystery is manifold and great, who had a sword upon his thigh, and had cut off desires, and had also run through with his blade his very fat and gross adversary, is for that reason written "amphoterodexios," that is, having both hands as a right hand, whom in Latin we may call "ambidextrous."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
