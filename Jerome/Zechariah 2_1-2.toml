[[commentary]]
quote='''
And I lifted up my eyes, and saw; and behold, a man, and in his hand a measurers' cord. And I said: Where are you going? And he said to me: To measure Jerusalem, and to see how great is its breadth, and how great its length. LXX: And I lifted up my eyes, and saw; and behold, a man, and in his hand a geometer's cord. And I said to him: Where are you going? And he said to me: To measure out Jerusalem, and to see how great is its breadth, and how great its length. He who before, with eyes lifted up, had seen sad things in the four horns, now again lifts up his eyes to see the man of whom it is written: Behold a man, the Rising is his name, of whom we also read above: And behold a man mounting upon a red horse, and he was standing among the myrtles that were in the deep, or, among the shady mountains. And of whom the Father speaks: He has built my city, whose craftsman and founder is God. He is also seen by Ezekiel, holding a cord in his hand, and a reed for the measure of a man's cubit, to measure Jerusalem, whose description, that is, its breadth and length, the same prophet pursues in mystical speech. Some think this was fulfilled in part under Zerubbabel, and Joshua, and Ezra, and Nehemiah and the other leaders or kings who ruled the people of Israel up to the coming of the Lord and Savior. But others, and above all the Jews, interpret it of the kingdom of a thousand years, bodily men seeking bodily things. Most of our writers, however, refer it to the heavenly Jerusalem, and say that it is to be built up again, having been left desolate by the fall of sinful souls. Let heretics suspect this. But let us interpret Mount Zion, and the mother of the firstborn and of the saints, as the Church, which was built in the passion and resurrection of the Lord, and is built every day by him who knows the measures and the merits of each one. What we have said of the Church can also be taken of the souls of believers, which are built every day by the Lord, and behold his peace, which was left to the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
