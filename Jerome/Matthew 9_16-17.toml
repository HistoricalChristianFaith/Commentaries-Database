[[commentary]]
quote='''
Otherwise; By the old garment, and old skins, we must understand the Scribes and Pharisees; and by the piece of new cloth, and new wine, the Gospel precepts, which the Jews were not able to bear; so the rent was made worse. Something such the Galatians sought to do, to mix the precepts of the Law with the Gospel, and to put new wine into old skins. The word of the Gospel is therefore to be poured into the Apostles, rather than into the Scribes and Pharisees, who, corrupted by the traditions of the elders, were unable to preserve the purity of Christ's precepts.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But our Jerusalem, which means 'vision of peace', is torn by the heretics, when, plucking one testimony of the Scriptures or another from their proper places, they try to sew them onto places to which they cannot be fitted; to whom, as we read, it was also said above in this same prophet: Woe to those who sew pillows under every elbow of the hand, and make a covering over the head of every age, and the Lord, forbidding this to be done, says in the Gospel: No one puts a patch of rough cloth on an old garment; otherwise it takes away from its fullness, and a worse tear is made. Nor do they put new wine into old wineskins; such are the Nazarenes, who try to fit the observance of the old Law to the grace of the Gospel, and all the heretics who strive to sew a testimony that fits one sense in its own place onto another, whereas the Lord's tunic, woven from the top throughout, cannot be torn, but, woven by the Holy Spirit, admits no tearing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
