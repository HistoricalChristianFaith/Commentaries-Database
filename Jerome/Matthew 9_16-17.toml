[[commentary]]
quote='''
Otherwise; By the old garment, and old skins, we must understand the Scribes and Pharisees; and by the piece of new cloth, and new wine, the Gospel precepts, which the Jews were not able to bear; so the rent was made worse. Something such the Galatians sought to do, to mix the precepts of the Law with the Gospel, and to put new wine into old skins. The word of the Gospel is therefore to be poured into the Apostles, rather than into the Scribes and Pharisees, who, corrupted by the traditions of the elders, were unable to preserve the purity of Christ's precepts.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
But our Jerusalem, which means 'vision of peace', is torn by the heretics, when, plucking one testimony of the Scriptures or another from their proper places, they try to sew them onto places to which they cannot be fitted; to whom, as we read, it was also said above in this same prophet: Woe to those who sew pillows under every elbow of the hand, and make a covering over the head of every age, and the Lord, forbidding this to be done, says in the Gospel: No one puts a patch of rough cloth on an old garment; otherwise it takes away from its fullness, and a worse tear is made. Nor do they put new wine into old wineskins; such are the Nazarenes, who try to fit the observance of the old Law to the grace of the Gospel, and all the heretics who strive to sew a testimony that fits one sense in its own place onto another, whereas the Lord's tunic, woven from the top throughout, cannot be torn, but, woven by the Holy Spirit, admits no tearing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
No one puts a patch of unworked cloth on an old garment; for it takes its fullness away from the garment, and a worse tear is made. Nor do they put new wine into old wineskins; otherwise the wineskins will burst, and the wine will be poured out, and the wineskins will perish; but they put new wine into new wineskins, and both are preserved. What he says is this: until someone has been reborn and, having put off the old man, has put on the new man through my passion, he cannot bear the stricter fasts and the precepts of continence, lest through excessive severity he lose even the belief that he now seems to have. He set down two examples, then, of the garment and of the wineskins, old and new. By the old we ought to understand the scribes and Pharisees. By the patch of the new garment and the new wine are to be understood the precepts of the Gospel, which the Jews cannot bear, lest a greater tear be made. Some such thing the Galatians too were eager to do, to mix the precepts of the law with the Gospel and to put new wine into old wineskins. But the Apostle says to them: O foolish Galatians, who has bewitched you not to obey the truth? The word of the Gospel, therefore, is to be poured into the apostles rather than into the scribes and Pharisees, who, corrupted by the traditions of their elders, could not keep the purity of the precepts of Christ. For the purity of a virginal soul, polluted by no contagion of former vice, is one thing, and the filth of one who has lain subject to the lust of many is another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
