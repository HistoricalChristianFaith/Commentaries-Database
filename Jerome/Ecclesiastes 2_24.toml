[[commentary]]
quote='''
For what good is it, or what kind of gift of God, either to gape after one's own wealth and to snatch in advance a pleasure that is, as it were, fleeing, or to turn another's labor to one's own delights, and to think it a gift of God if we enjoy the miseries and labors of others? It is good, therefore, to take the true food and the true drink, which we find in the divine books, from the flesh and blood of the Lamb.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
