[[commentary]]
quote='''
And as for your thinking that you have offered me victims and sacrificed rams, know that they were not accepted by me, because they were shared by me and the idols. And he repeats that sense of which he had spoken above: To what purpose is the multitude of your victims to me, says the Lord? I am full of the burnt offering of rams, and of the fat of lambs, and the blood of bulls and goats I do not want. For I have not, he says, required anything precious from you, so as to make you labor in preparing it. I have not exacted offerings from you, nor sought frankincense, nor sweet cane, nor incense and spices of various kinds, with whose smoke you might make me drunk and sate me. But obedience, which is above sacrifice, and the sacrifice of which David says in the Psalms, A sacrifice to God is a troubled spirit; a contrite and humbled heart God does not despise (Ps 50 [51]:19): these I wanted, these I sought. But you have made me serve and labor in your sins, so that I was compelled to say: I have labored in bearing; and I can no longer bear you. Hence God says the same thing also through Hosea: What shall I do to you, Ephraim? Shall I protect you, Israel (Hos 11:8)? What shall I do to you? Shall I make you like Admah, and like Zeboiim? But what the Seventy set down, but in your sins I have defended you, and in your iniquities, can be joined to what precedes thus: that it is God's labor and weariness to defend sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
