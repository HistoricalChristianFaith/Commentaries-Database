[[commentary]]
quote='''
Ephraim feeds on the wind and follows the burning heat; all day long he multiplies lying and devastation, and he has entered into a covenant with the Assyrians; and he was carrying oil into Egypt. LXX: But Ephraim, a most evil spirit, has pursued the burning heat; all day long he has multiplied vain and empty things, and he has made a covenant with the Assyrians; and he was trading oil in Egypt. Sacred history relates that Menahem, king of Israel, having made peace with Assyria, asked help of the Egyptians; and this is what is now said: that Ephraim feeds on winds, that is, deceives himself with vain hope, and follows καύσωνα, that is, the burning heat, and goes to the south, and does nothing else all day long but mock himself. And while he runs about this way and that, he prepares devastation and overthrow for his own cities. Is it not devastation and lying to have made a covenant with the Assyrians, and to have carried oil into Egypt? Συνεκδοχικῶς, the whole from a part: namely, that he sent gifts to the Egyptians. Although some think that oil is by no means produced in Egypt, and that the most precious oil was sent by Ephraim, whose land, Samaria, is most fertile in oil. Moreover, according to tropology, all heretics are held fast by the most evil spirit of the demons, of which it is written also in the Apostle: Against the spiritual things of wickedness in the heavenly places. And the unclean spirit, when it has gone out of a man and has found no rest, joins to itself seven other spirits more wicked than itself, and returns to its former house. With a most evil spirit, therefore, they follow καύσωνα, that is, dryness, or the burning wind, which is hostile to flowers and destroys everything that sprouts; all day long he pursues empty and vain things, nor is he content with his own error, but he multiplies many disciples, nay rather companions of his vanity and error. He also makes a covenant with the Assyrians, whose prince is the great mind, so that whatever he has invented he may seem to have feigned wisely, with that wisdom which is destroyed by God, which the Apostle too commands us to avoid, saying: See that no one catches you through philosophy and empty seduction, according to the tradition of men, according to the elements of the world. But he also carries oil into Egypt, or buys the wisdom of Egypt, desiring to mix with the dogmas of the Church the oil of anointing with which the prophets and priests were anointed, with which kings too were anointed. This oil the saints also have, of whom it is said: Your sons like young olive shoots around your table. And the good olive tree into which our wild olive has been grafted. But although the heretics try to mix lying with the truth, oil cannot be combined with water and the other moist and liquid things. The truth is always on top, and lying below. All other kinds, that is, heresies, which do not have, as we have said, the oil of truth, can be mixed with one another, and from many be made one body. But the oil of these, which is carried down into Egypt and descends from the holy land to the realms of Pharaoh, the prophet detests, saying: Let not the oil of the sinner fatten my head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
