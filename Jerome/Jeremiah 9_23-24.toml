[[commentary]]
quote='''
Thus says the Lord: Let not the wise man glory in his wisdom, and let not the strong man glory in his strength, and let not the rich man glory in his riches; but let him who glories glory in this: to know — or to understand — and to know me, that I am the Lord, who do mercy and judgment and righteousness on the earth! For these things please me — or for in these is my will —, says the Lord. All the pride of men is taken away, while their wisdom and strength and wealth are reckoned as nothing, and this is the only glorying: that one should know and understand that he himself is the Lord, who does mercy and judgment and righteousness upon the earth; that all things are governed by the providence and righteousness of God, and that the things which seem to us to have no reason are full of righteousness and reason. For these things alone please God, and in these is his will. Where then are those who say that man is governed by his own will, and that the power of free will was so given that the mercy and righteousness of God were taken away? Hence also the Apostle, taking up this testimony, sets down the example: let him who glories, glory in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
