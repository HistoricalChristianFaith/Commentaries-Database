[[commentary]]
quote='''
There follows: 'And he brought me in there — the hand of the Lord is understood; and 'there', that is, 'as it were the building of a city' —, so that he might show me all the things that were within'. Behold, he says, a man whose appearance (or vision) was like the appearance of gleaming bronze — he, namely, of whom it is written: Behold a man, the Orient is his name —; now he had an appearance by no means of electrum, as is said at the beginning of this volume, nor was he girded with a golden belt, as is contained in the Revelation of John, but he had an appearance, according to the Hebrew, as of bronze — for this material is more resonant than all the metals and rings out far with its clang; hence also in Daniel, in the image which was put together from gold, silver, bronze and iron, the kingdom of Alexander and of the Greeks is shown in the likeness of bronze, so that the eloquence of the Greek language might be signified; by which it is plain that those who do not yet know the full mysteries of the temple that is to be built spiritually are still in need of teaching —; there was also a cord of linen, or of the masons, in his hand — of which it is also written in Zechariah that he had a surveyor's cord, to measure the breadth and the length of the city. And of the masons: either of the angels who ministered at God's command, or of Moses and of all the prophets and apostles who build the city of God and are helpers or ministers of the Lord's will; hence the apostle Paul also said: We are God's husbandry, God's building —. And what follows: And a measuring reed in his hand, designates the prophetic grace — of which it is written in Psalm 44 (45): My tongue is the reed of a scribe writing swiftly, and of John, prophet and baptist: What did you go out into the desert to see? A reed shaken by the wind?, which reed those desire to imitate who writing, write iniquity, and upon whom the prophet calls down a curse, saying: Rebuke the beasts of the reed —. And he was standing in the gate, because through him we go in to the Father, and without him we cannot enter the city of God, so that he may receive the worthy and cast out the unworthy; in the gate too there is judgment — whence the prophet also says: They hated those who reprove in the gate, and in another place: They shall not be put to shame when they speak with their enemies in the gate —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
