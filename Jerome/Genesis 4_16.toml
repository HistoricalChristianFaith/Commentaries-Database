[[commentary]]
quote='''
(Verse 16.) And he dwelt in the land of Naid. Which the Septuagint translated as Naid, but in Hebrew it is called Nod, meaning 'shaking', that is, unstable and fluctuating, with an uncertain dwelling place. Therefore, it is not the land of Naid, as our common people think, but the divine sentence is fulfilled, that he wandered and fled here and there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
In short, it is said of Cain also: "And Cain, he says, went out from the face of God, and dwelt in the land of Nod." Now Nod is interpreted "commotion." Because Cain had gone out from the face of God, rightly he did not stand still, but dwelt in the land of Nod, that is, in commotion. So then these too, since they crucified their God and Lord, are carried away wandering. For they are not in their own places, but are scattered throughout the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_035.html'
source_title="Homily 35, on Psalm 108"
