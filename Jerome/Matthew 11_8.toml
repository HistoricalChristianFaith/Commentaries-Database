[[commentary]]
quote='''
This teaches that an austere life and strict preaching ought to shun kings' courts and the palaces of the rich and luxurious.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Mystically; By the garment wherewith his body is clothed is his mind shown, that it is lost in luxury and self-indulgence. The kings are the fallen angels; they are they who are powerful in this life, and the lords of this world. Thus, They that are clothed in soft raiment are in kings' houses; that is, those whose bodies are enervated and destroyed by luxury, it is clear are possessed by dæmons.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"
