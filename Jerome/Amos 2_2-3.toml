[[commentary]]
quote='''
For this reason, therefore, they say, God declares that he will send fire into Moab, either the metropolis of the Moabites, from which the whole province was named, or the whole province, so that it might devour the houses of Kerioth, which is the name of a city; although the Seventy translated of its cities, that is, of Moab; and that it will perish in the noise and in the howling of the conquering army, of which the one is called in Hebrew saon, the other therua; and in the blast of the trumpet or horn, for this is what sophar signifies. And when Moab has perished, the counsel of its princes and judges will be vain, its cities and its leaders being overthrown alike.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And for that reason the Lord sends fire into Moab, which means from the father, because he was indeed born of God, but has abandoned him. And it will devour its cities, or towns, which is what Kerioth means. Hence also Kiriath-jearim is turned into our language as village of the forests. And Moab will die in no other way than in shouting, and noise, and howling, and the blast of the horn, so that they may be overwhelmed by the lofty senses which in the holy books are compared to the blasts of the horn. Then the divine word destroys both the judges and the princes, and all who preside over earthly works, and it commands the teachers of the Church: Go up onto a high mountain, you who bring good tidings to Zion; lift up your voice, you who preach to Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
