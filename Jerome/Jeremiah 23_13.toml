[[commentary]]
quote='''
And in the prophets of Samaria I saw folly — or iniquity —; they prophesied in Baal and deceived my people Israel. I think that by the prophets of Samaria, according to the mystical senses, the heretics are properly meant, and all who boast of a knowledge falsely so named. And as the prophets of Samaria, whatever they spoke, prophesied in Baal, namely an idol consecrated to demons, so the heretics, whatever they speak inside the Church or outside the Church, speak in demons, in order to trip up the people 'Israhel', which formerly 'saw God'; whence too he says significantly: and in the prophets of Samaria I saw folly; for they do not have him of whom it is said: 'Christ the power of God and the wisdom of God'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
