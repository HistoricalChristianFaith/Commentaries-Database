[[commentary]]
quote='''
Have you utterly cast off Judah, or has your soul abhorred Zion? Why then have you struck us, so that there is no healing? We waited for peace, and there is no good, and for a time of healing, and behold, turmoil! The prophet marvels that the Lord has so suddenly cast off Judah and Jerusalem, that is, the kingdom of the two tribes, in which were the religion of God and the ceremonies of the temple, and has struck them with so great a blow that no medicine can be applied. 'We waited', he says, 'for peace and for a time of healing, and there is no good at all, but, on the contrary, turmoil, so that where formerly there had been the worship of God and tranquility, there all things were filled with seditions and the roar of the enemy'. If ever, therefore, our Zion too and our Judah is cast off and the soul of God abhors it, let us by no means marvel, but rather let us say what follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
