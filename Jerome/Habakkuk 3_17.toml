[[commentary]]
quote='''
For the fig tree will not blossom, and there will be no bud in the vineyards; the work of the olive will lie, and the fields will not yield food; the flock will be cut off from the fold, and there will be no herd in the stalls. LXX: For the fig tree will not bear fruit, and there will be no buds in the vineyards; the work of the olive will lie, and the plains will not produce food; they have failed, because the sheep were eating, and there are no oxen in the stalls. According to the Hebrew, in which we said above: Let rottenness enter into my bones and swarm beneath me, that I may rest in the day of tribulation, that I may go up to our girded people, what preceded will be joined in this way to what follows: I wished to endure tribulation for the present, and afterward to go up to the strong people, for this reason, that the day of tribulation and necessity will come, and while the rest are set in distress, I shall rejoice in your majesty: For the fig tree will not blossom, and there will be no bud in the vineyards; the work of the olive will lie, and the fields will not yield food, and the rest. And since these words do not differ much from the LXX, let us discuss them together with their translation. When the day of tribulation has come, and I have gone up to the people which once sojourned with me, or certainly when the day of the overthrow of the Jews and of the former people has come, and the daughter of Zion has been left like a booth in a vineyard, and like a hut in a cucumber field, and like a city which is being besieged, I, who have been chosen out of a perishing people — of which it was said: Unless the Lord had left us a seed, we should have been as Sodom, and we should have been like Gomorrah —, shall join myself to the disciples of Christ, and because he teaches them on the mountain, leaving the crowds and the weak below, I shall climb up to the mountains. For the fig tree did not give fruit, the one to which the Lord came hungry in the Gospel, and he did not find fruit on it, and he cursed it, saying: You shall not bear fruit even unto the age. And consider diligently what he said: You shall not bear fruit unto the age; he does not say, unto the ages of ages, but when this age has passed away and the fullness of the Gentiles has entered, then this fig tree too will bear its fruits, and all Israel will be saved. This is the fig tree to which the householder came for the third time, and which he wishes to cut down as not producing fruit; for it the farmer, to whom it had been entrusted, pleads, that he may give it time, and he says: Lord, let it alone this year also, until I dig around it and put on manure, and if indeed it bears fruit; but if not, then you shall cut it down. That farmer is either Gabriel or Michael, to whom the people of the Jews was entrusted, who pleads with the Lord at the passion and says: Lord, give it time for repentance, and do not overthrow them, and if indeed they bear fruit; but if not, then you shall overthrow them. If they bear fruit, he says: he did not say what they would undergo; nor did he say: If they bear fruit, they will remain as they were; but, if they bear fruit: the sentence is left suspended, so that this is understood: you will transfer them into the church of the Gentiles, and transplant them into another vineyard. The Lord came for the third time and did not find fruit in them. First he gave the law through Moses, the second time he spoke through the prophets, the third time he himself came down. And after the passion, when forty-two years had been given for repentance, because they did not bear fruit, the fourth time they were overthrown. This, however, is left to our understanding. For in the parable it is not written what the householder did afterward, but only what the farmer pleaded for. From this we perceive that those of this fig tree who bore fruit were transferred to the people of the Gentiles, to which the prophet too goes up, saying: I shall rest in the day of tribulation, that I may go up to the people of my sojourning; but that those who did not bear fruit and remained in their hardness were overthrown. The voice of John in the Gospel also signifies this very thing: Behold, the axe is laid to the roots of the trees. Every tree that does not bear fruit will be cut down and cast into the fire. We have spoken of the fig tree, showing that it is the people of the Jews; let us speak also of the vineyard, which indeed anyone who has read Isaiah will easily understand: A vineyard was made for the beloved on a horn, in a fertile place, and afterward: And I waited for it to bear fruit; but it bore thorns, and not judgment, but a cry, and in Jeremiah: But I planted you a fruitful vineyard, wholly true; how have you been turned into the bitterness of a foreign vine? and more plainly in the psalms: You brought a vineyard out of Egypt, you cast out the nations, and planted it. This vineyard, then, to which the householder had often sent servants to receive from it wine, which gladdens the heart of man, because it was turned into bitterness, and at the last even dared to kill the householder's son, producing not grapes but thorns, and not judgment but a cry: Crucify, crucify him, and: We have no king but Caesar: therefore the boar from the forest has ravaged it, and the solitary wild beast has fed upon it. That the olive too is the people of the synagogue will be clearly proved by anyone who has read in the Apostle of the broken branches of the olive, and of us grafted in from the wild olive, so that in the branches we understand that the Jewish multitude was cut off, and in the roots that the election of the apostles was preserved; grafted into them we shall remain, if we bear fruit, and it will be said of us: Your sons like young shoots of olives around your table. Many think that the fig tree, the vineyard and the olive are taken as the mystery of the Trinity: that the fig tree, because of the sweetness of its fruit, is understood as the Holy Spirit; the vineyard as our Lord Jesus Christ himself, who says in the Gospel: I am the vine; and the olive as God the Father almighty, by whom all things are enlightened, and from whom light goes forth, and to whom we can say: O olive, in your light we shall see light, that is, in the Son we shall see the Holy Spirit. To these fruitful trees and to the most fertile vineyard come the unfruitful trees in the book of Judges and ask them to reign over them. But the olive, the fig tree and the vine never reign over the trees of the forests, which are destined for burning; rather the buckthorn rules over them, full of briars and like the hedgehog, which dwells in Babylon and always lives in pits. This little tree has not only thorns but fire too, wounding and burning whatever it touches. And at last fire went out and consumed the trees of the forests. But so that you may know, according to the higher understanding, in which we have taken it as said of the synagogue: The fig tree will not bear fruit, and there will be no produce in the vineyards, that this is said not of fruits but of good works, in the olive the riddle is plainly opened, and it is said: The work of the olive will lie. For the fruits which they ought to have borne are shown in works; and the work of the olive will lie, as of one who promises one thing and does another: they said to Moses: All things whatsoever the Lord shall say, we will do; and they were unwilling to believe in him who was preached by Moses. The plains also will not bear fruit. Consider that Jerusalem, which was once set on mountains, with the mountains around her, and her foundations on the holy mountains, is now called lowly and flat, a place that nourishes not only no men, that is, no rational animals, but not even flocks and oxen, of which Solomon also speaks in Proverbs: Take care of the regions that are in the plain, and cut the grass, and gather hay, that you may have sheep to eat. Oxen also will not be in the stalls, because where the stalls are full, the strength of the ox is manifest. The ox is a worker; the ox of the Lord bearing the yoke; the ox in whose track he who sows is blessed. All these things will be taken away from the people, because it acted wickedly against God its Creator. But if you wish to take the day of tribulation as the day of the consummation, you will refer everything to those who say they are of the Church and do not have the works of justice. And the fig tree, the vineyard and the olive, namely the mystery of the Trinity, will not bear their fruit in them; and they have not only no grain and food of rational beings, but not even fodder for flocks and beasts of burden in their fields, and their stalls are empty, and instead of lofty mountains they dwell in flat and lowly places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
