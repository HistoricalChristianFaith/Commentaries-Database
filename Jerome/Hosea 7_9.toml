[[commentary]]
quote='''
Demons devoured his strength, for these are the strangers and the enemies of all Christians, and he did not know it, thinking his adversaries friends, and judging those who devoured him to be his table-companions; yes, and grey hairs were spread over him, or rather they blossomed, that is, he went astray for a long time; and nonetheless he was unaware of his old age and his decrepitude, of which it is written: What grows old and ages is near to destruction. And if it is said of a just man and a churchman: A man's grey hairs are his wisdom, why should it not be said of an unjust man and a heretic: A man's grey hairs are his folly? Of this old age Daniel spoke to the elder: You who have grown old in evil days. Hence also in the book of the Shepherd — if, however, anyone cares to accept the reading of it — the Church appears to Hermas first with a grey head, then as a young girl and a bride adorned with her tresses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
