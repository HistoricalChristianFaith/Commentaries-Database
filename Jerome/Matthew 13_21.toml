[[commentary]]
quote='''
Note that which is said, is straightway offended. There is then some difference between him who, by many tribulations and torments, is driven to deny Christ, and him who at the first persecution is offended, and falls away...
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But when tribulation and persecution have come because of the word, he is at once scandalized. Pay attention to what is said: he is at once scandalized. There is therefore some difference between the one who is compelled by many tribulations and punishments to deny Christ and the one who at the first persecution is immediately scandalized and falls.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
