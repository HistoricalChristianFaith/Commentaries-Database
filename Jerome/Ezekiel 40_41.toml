[[commentary]]
quote='''
Four on this side and four on that, and behind them or at their side another eight tables, so that together they make sixteen tables; by which number the mysteries of the prophets are shown, so that whatever we offer through the condescension of the Gospel we may prove to have been foretold by their prophecies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
