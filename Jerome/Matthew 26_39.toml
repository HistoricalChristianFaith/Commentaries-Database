[[commentary]]
quote='''
(Verse 39) And going forward a little, he fell on his face, praying and saying: My Father, if it is possible, let this cup pass away from me. Nevertheless, not as I will, but as you will. Having given the apostles the command to endure and keep watch with the Lord, he advanced a little and fell on his face, showing the humility of his mind in the appearance of his flesh, and he said in a gentle way: My Father, and he asked that, if possible, the cup of suffering pass from him, about which we have spoken above. But, he does not ask to be spared out of fear, but out of mercy for the earlier people, so as not to drink from the cup that they have offered. Therefore, he specifically does not say, let this cup pass from me, but let this cup pass, that is, the cup of the Jewish people, who cannot claim ignorance as an excuse, if they kill me, having the Law and the prophets, who daily prophesy about me. Yet, turning back to himself, what he had hesitantly declined from the perspective of a human, he confirms from the perspective of God the Son. However, not as I want, but as you. No, he says, let this not be done, which I speak with human emotion; but because of what I descended to earth by your will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"


[[commentary]]
quote='''
Whence He says emphatically, This cup, that is, of this people of the Jews, who, if they shall put Me to death, can have no excuse for their ignorance, seeing they have the Law and the Prophets, who speak of Me.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And in the passion: Father, if it be possible, he says, let this cup pass from me (Matt 26:39). This place has this sense: If it can be that the multitude of the nations believe without the destruction of the Jews, I refuse the passion. But if they are to be blinded so that all nations may see, Father, let your will be done.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
But if anyone should object the brook Cherith, from which Elijah drank, and another torrent, from which the Lord drank on the way, for so it is written: He will drink from the torrent on the way, this must be said: that whoever is in Egypt and on the way of this age, though he be Moses and Aaron, though he be Jeremiah and Elijah, must nevertheless drink of the temptations of Egypt and of the wilderness; hence also the Word of the Lord, who had assumed flesh for this, that he might drink from the torrent, considering his majesty, said: Father, if it is possible, let this cup pass from me. Again, seeing that he was in Egypt, and that the waters could not be cleansed unless he himself had drunk, he says: Nevertheless not as I will, but as you will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
