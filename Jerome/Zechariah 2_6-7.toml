[[commentary]]
quote='''
O, O, flee from the land of the north, says the Lord; for I have scattered you into the four winds of heaven, says the Lord. O Zion, arise, you who dwell with the daughter of Babylon. For thus says the Lord of hosts: After glory he has sent me to the nations that despoiled you; for he who touches you touches the pupil of his eye. For behold, I lift up my hand over them, and they shall be spoil for those who served them, and you shall know that the Lord of hosts has sent me. LXX: O, O, flee from the land of the north, says the Lord, for from the four winds of heaven I will gather you, says the Lord. In Zion be saved, you who inhabit the daughter of Babylon. For thus says the Lord Almighty: After glory he has sent me to the nations that despoiled you, for he who touches you, as it were touches the pupil of his eye. Behold, I will bring my hand upon them, and they shall be spoil for those who had served them, and you shall know that the Lord Almighty has sent me. The regions of the world, which the Greeks call κλίματα, are understood according to the situation of Jerusalem and of the temple. The Assyrians, therefore, and the Babylonians, who laid waste the people of God, dwell in the land of the north. In short, in Jeremiah the pot which according to Ezekiel is full of flesh — and by it the city of Jerusalem is understood —, is kindled from the face of the north. Since, therefore, the angel who had come to meet the angel who prophesied in Zechariah had commanded him to speak to the boy — for in comparison with the dignity of angels all human nature is called boyhood, because it is not angels who advance into us, but we who advance into angels —, and to say to him: Jerusalem shall be inhabited without a wall, and the rest. Now the same word of the Lord is addressed to those who dwell in the north, that they may be gathered from the four winds into which they had been scattered over the whole world, and that those who dwelt in Babylon may return to Zion. Or else thus: You who have been scattered into the four regions of heaven, flee from the land of the north; and O Zion, you who now dwell in Babylon, flee and return to your former seat. But that O is said a third time, in the vocative case, is an exhortation to flight, so that they may know that they have been warned to flee not once, but more often. It must also be said another way: the north wind is a very harsh wind, which makes very hard the hearts of those who dwell in its land, and from which evils are kindled upon all who dwell on the earth, and toward which, according to this very prophet Zechariah, the black horses go out, to take their stand in its region. He too who in Isaiah had said in his boasting: I will ascend into heaven, above the stars of heaven I will set my throne, I will sit on a lofty mountain, above the high mountains in the north, vaunts that he holds his kingdom in the coldest place of the earth. We read also in another place: Behold, smoke comes from the north; and of those who had departed far from the holy city it is said: Behold, these come from afar, from the north and the sea. And through Jeremiah the Holy Spirit speaks, calling those who are in captivity to return to Jerusalem: Go and read these my words toward the north, and you shall say: Return to me, dwelling of Israel, says the Lord. It is commanded, therefore, to us who have dwelt in the north and have lost the warmth of the Lord's fervor, who have been scattered over the world, and of whom the Gospel proclaims that the Lord sends his angels into the four winds and gathers us, and who are caught up in the vices and confusion of this world, that we flee to Zion, the Church of the Lord, and, leaving lowly things behind, take our stand on her watchtower and on the sublimity of her doctrines.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
