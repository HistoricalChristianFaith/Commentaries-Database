[[commentary]]
quote='''
You cursed his scepters, the head of his warriors, who came like a whirlwind to scatter me. Their exultation was like that of one who devours the poor man in secret. You made a way in the sea for your horses, in the mud of many waters. I heard, and my belly was troubled; at the voice my lips trembled. Let rottenness enter into my bones, and swarm beneath me, that I may rest in the day of my tribulation, that I may go up to our girded people. And now we discuss only the Hebrew, so that we may discuss the edition of the Seventy separately: for it differs greatly from the translation of all the others. You cursed, he says, the scepters, that is, his kingdoms; no doubt those of the wicked one, of whom he had said above: You struck the head from the house of the wicked; you laid bare the foundation up to the neck. Now we understand the wicked one either as Nebuchadnezzar or as every adversary of the people of God. And not only his scepters, but also the head of the warriors whom you had struck, who came like a whirlwind to scatter me, that is, to overthrow Israel and lead it captive in different directions. But they exulted in this way, devouring the poor man, Israel made subject to them, as if they were doing it in secret and were devouring us without your knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: You divided in amazement the heads of the mighty. Just as Christ is the head of the Church and of every man, so of all the demons who rage in this world the head is Beelzebub, the prince of the demons, and each of their troops has its own heads and princes. For example, the spirits of fornications have their own commander, the spirits of avarice have their own ἄρχοντα (ruler), the spirits of vainglory, the spirits of lying, the spirits of unbelief have the presidents of their warfare. Therefore the most merciful God, who had sent death upon the heads of the wicked, who had raised up bonds up to the neck, at the end divides also the heads of the mighty in amazement, so as first to separate the princes from their subjects, and as it were to behead the body from its head, and that where there had been a most evil head, there the best head may be set in its place. Let us give an example, so that what we say may become clearer: whenever a tyrant is cut down, his images and statues are also taken down, and, only the face being changed and the head removed, the face of the one who conquered is set on top, so that, while the body remains and the heads are cut off, another head is substituted. I like to understand this of the conventicles of the heretics: that when the heads of the heresies have been separated from the rest of the peoples, Christ begins to be the head in their place. And at the same time consider the expressiveness of holy Scripture, that it did not say, you cut off, or you cut down the heads of the mighty, but you divided; for what is divided is not so much amputated and destroyed as separated into parts. So that, just as at the building of the tower the tongue which had been wrongly united was separated, and a most evil pact was cut asunder by a useful division, so also these heads, which together with their bodies seemed to have agreement among themselves — for the heads of the heretics are many, and though they have different eyes, they yet bark against the Church with one, so to speak, tongue of blasphemy —, might be divided into parts, and, separated from the deceived bodies, might make room for the good head. We can use this little verse whenever we see their kings and leaders shed Christian blood, and afterward the vengeance of the Lord follow, as we lately saw in Julian, and before him in Maximian, and earlier in Valerian, Decius, Domitian, Nero, and say to the Lord in exultation and prayer with a song: You divided in amazement the heads of the mighty, that is, in the amazement of believers, or in the amazement of all the nations, who did not think they could fall so quickly. While I was still a boy and was being trained in the school of grammar, and all the cities were polluted with the blood of victims, and suddenly, in the very heat of the persecution, the death of Julian was announced, one of the pagans said elegantly: How, he says, do the Christians say that their God is patient and ἀνεξίκακον (forbearing)? Nothing is more wrathful, nothing more prompt than this fury; he could not put off his indignation even for a short space. He may have said this in jest. But the Church of Christ sang with exultation: You divided in amazement the heads of the mighty. I too shall say something like it: Divide, O Lord, in the amazement of all, Ahab and Jezebel. I am not Elijah, but they are an Ahab and a Jezebel: they have killed Naboth, and taken his vineyard, and made it the garden of their luxury. Let some servant of yours, an Obadiah, be found to feed your poor man and beggar; let the harlot's blood be given to the dogs; let wicked and avaricious Ahab be slain by the javelin of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: They will be moved in her, they will open their bridles like a poor man eating in secret. When the heads have been divided from their bodies, and divided in no other way than in amazement, which in Greek is called ἐν ἐκστάσει, whence it is declined in agreement with her and is said ἐν αὐτῇ, that is, in her, they will also open their own bridles, or the bridles of those others — for both can be understood —, so that, relaxing that rule by which they formerly held dominion over the bodies subject to them, they may give place to a better rider and a better charioteer. And let them do this as if eating like poor men in secret, having no liberty nor any abundance of food, but scanty fare, eating which in secret they would want no one to see what they are doing. It can also be interpreted otherwise: When the heads have been divided in amazement, as if beheaded from the rest of the body, they will open their mouth, which had been bridled as it were with the bit of condemnation, and in the likeness of those who eat they will clatter with their teeth struck together, wanting to eat again, but not having the power to devour. Understand how after the coming of Christ the heads of the demons, separated from the nations which had formerly been subject to them, wish to exercise their ancient power again. But because they have been cut off from the bodies, they do not have full liberty to eat; they eat like poor men, and not only are they poor, but poor in secret. They are poor, because they have lost their former riches; they eat in secret, because they always sit in ambush, to kill the innocent in hidden places. These heads have teeth that are the very same as their arrows. And although he said before: I will ascend above the stars of heaven, I will set my nest on high, and I will hold the whole world in my hand like eggs, yet they will be dragged down from the heights, and, losing their former furniture and all the substance of their house, they will scarcely attempt, like poor men, to eat and bite in secret. I know that the Hebrew differs much from what has been said; but what can I do, I who have once resolved to translate both the Hebrew itself and the Scriptures current throughout the world?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
