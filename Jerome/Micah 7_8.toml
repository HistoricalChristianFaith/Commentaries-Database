[[commentary]]
quote='''
Now let us come to the spiritual understanding, and, with the Holy Spirit himself expounding in what sense these things were written, let us toil even in the most difficult places. It seems to me that every soul, a Jerusalem in which the temple of the Lord was built, and the vision of peace, and the knowledge of the Scriptures, and which was afterwards overcome by sins, led into captivity and handed over to torments, speaks against Babylon, that is, the confusion of this world, and against the opposing power that presides over this world: Do not insult me, my enemy, because I have fallen, and I shall rise again; The Lord indeed lifts up those who are dashed down, and he speaks through the prophet: Shall he who falls not rise again? And: I do not desire the death of the sinner, only that he turn back and live. But if you despise me for this reason, that I endure torments, learn through Ezekiel that punishments are inflicted first on the holier, and that the Lord says: Begin from my holy ones. For if I walk in darkness, the Lord is my light. For although the rulers of this darkness have deceived me, and I sit in darkness and the shadow of death, and my feet have stumbled on the dark mountains, yet to those who sit in darkness and in the shadow of death a light has risen, and the light shines in the darkness. The Lord is my illumination and my salvation; whom shall I fear; and I will speak to him and say: Your word, O Lord, is a lamp to my feet, and a light to my paths. For he himself commanded me, placed as I am in the darkness of this age: Let your loins be girded, and burning lamps in your hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
