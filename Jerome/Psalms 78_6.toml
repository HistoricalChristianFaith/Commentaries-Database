[[commentary]]
quote='''
"The sons who shall be born and shall rise up, and shall tell them to their sons." "In place of your fathers, sons have been born to you." We are their sons. They told us, and we have told our sons: we are their sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
