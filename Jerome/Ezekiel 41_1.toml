[[commentary]]
quote='''
And he brought me into the temple, and measured the fronts: six cubits of breadth on this side and six cubits of breadth on that side, the breadth of the tabernacle. And the breadth of the gate was of ten cubits, and the sides (or shoulders) of the gate of five cubits on this side and five cubits on that side; and he measured a length of forty cubits and a breadth of twenty cubits. After many mysteries and various entrances and the particular features of each place, at long last the man in whose hand were the masons' line and the measuring reed brings the prophet Ezekiel into the temple, and he measured the front of the temple — for which the Seventy translated 'aelam', and Theodotion 'aelim', and Symmachus 'round about' —, and each breadth of the tabernacle was of six cubits, containing the mystery of all creatures — for in six days the world was founded —, through the knowledge of which, and of the causes and the principle of their founding, we enter into the temple of God, and from the order and constancy of creatures we know the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
