[[commentary]]
quote='''
Who gives snow like wool, who scatters mist like ashes. He sends his crystal like morsels. See how great is the difficulty, how obscure are the things that are said. Before the face of his cold, who shall stand? Whose? Nothing is said. Then it is said:

He shall send forth his word, and shall melt them. Of that one of whom he had said, He sends forth his word to the earth: He shall send forth his word. Who shall send it forth? God the Father. And the Word was with God, and the Word was God. We have named the Father, we have named the Son: we cannot believe in a twofold number, unless the Trinity be completed. His spirit shall blow, and the waters shall flow. You see that where the Father and the Word of God are, at once the Holy Spirit is there too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_057.html'
source_title="Homily 57, on Psalm 147"
