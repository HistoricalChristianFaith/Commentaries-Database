[[commentary]]
quote='''
But what the Seventy mean, who at the beginning of this chapter translated: What better have I made than the potter's clay? Will he who ploughs plough the earth? I am not able to know: unless perhaps I follow the edition of Theodotion, who put in place of this: Woe to him who contends against his maker, ploughing those who plough the earth: namely, that he wounds the hearts of mortals unto penitence, and, after the manner of furrows, breaks them up and overturns them. But this too is a frivolous interpretation. Further, that God, our Creator and maker, is called a potter, the apostle Paul too says in the Epistle to the Romans: Does the thing formed say to him who formed it: Why have you made me thus? Has not the potter power over the clay, to make from the same lump one vessel for honor and another for dishonor (Rom 9:20)? And in Jeremiah it is written at greater length, who relates, after other things: I went down into the potter's house, and behold, he was making a work on the wheel, and the vessel that he was making was spoiled in his hands. And again he made from the same clay another vessel, as it pleased in his sight. And the word of the Lord came to me, saying: Can I not, like this potter, make you, house of Israel, says the Lord? Behold, as clay in the hand of the potter, so are you in my hands, house of Israel (Jer 18:3, 4).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
