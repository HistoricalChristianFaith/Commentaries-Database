[[commentary]]
quote='''
For thus says the Lord: Incurable is your fracture, most grievous your wound. There is none who judges your judgment for binding up; there is no benefit of healings for you. All your lovers have forgotten you, they will not seek you; for I have struck you with the blow of an enemy, with cruel chastisement — or strong —. Because of the multitude of your iniquity have become hard — or have been multiplied — your sins. Why do you cry out over your crushing? Incurable is your pain; because of the multitude of your iniquity and because of your hard sins I have done these things to you. He speaks as to a beautiful woman, to whom he had said above: I will chastise you in judgment, so that you may not seem to yourself guiltless or innoxia [guiltless, in the feminine]; and by metaphoran [metaphor] he speaks to Jerusalem, that she has been most grievously wounded by the judgment of God and can be healed by no other curing her except him who had struck her — there is none, he says, who judges your judgment — nor draw the skin of a scar over the deepest wound. 'Wherever you turn, there is no benefit for you, because you have offended him who is the true and only physician. All your lovers have forgotten you, whether the priests or the princes, or at any rate the protection of the angels by which, before you offended the Lord, you were walled about. They will not seek you, acting contrary to the Apostle, who sought the believers and not the things which were the believers'; for I have struck you with the blow of an enemy, with cruel chastisement.' A friend strikes in one way, an enemy in another; a father in one way, a foe in another. The one beats in order to correct, the other strikes in order to kill; hence the prophet too says tearfully: O Lord, do not rebuke me in your fury, nor chasten me in your wrath! But this has happened because because of the multitude of your iniquity your sins have become hard. And what follows: Why do you cry out over your crushing? Incurable is your pain because of the multitude of your iniquity, is not found in the Seventy, evidently because it is said a second time: because of the multitude of your iniquity and your hard sins, and those who copied from the beginning thought it had been added. And the sense is: 'That I struck you with the blow of an enemy, that I beat you with cruel chastisement, the multitude of your iniquity and your hard sins brought about, which could not be healed except by the most biting powder and the burning cautery and the sharpest steel, with which I might cut away the putrid and incurable flesh. And yet because of the multitude of your iniquity and your hard sins I have done this to you, not by my own will, but because the method of medicine compelled me'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
