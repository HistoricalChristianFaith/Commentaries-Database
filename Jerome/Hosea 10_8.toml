[[commentary]]
quote='''
But once the idol and its high places have been scattered: The bur and the thistle will come up upon their altars. A sign of utter desolation, so that not even walls and the last traces of buildings are left. At that time they will say to the mountains: Cover us; and to the hills: Fall upon us. This the Lord says is to be fulfilled in the last time of the Jewish captivity. Whatever, then, is now said against the ten tribes, or against all Israel, let us know that it can also be transferred τυπικώς (typologically) to the whole people, so that when the Romans had taken Jerusalem and overthrown the temple, or when the day of judgment comes, as others suppose, they say, fearing with great horror, to the mountains: Cover us; and to the hills: Fall upon us, preferring to die rather than to see the things that bring death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
[[commentary]]
quote='''
All these will pass away, and the grand words on which they labored, which is what ὦν is interpreted, will at once be scattered, the words in which Israel sinned; and so great will be the desolation of that most wicked doctrine that thorns and thistles will come up upon their altars. That thorns and thistles spring up where there is no cultivation of the fields is plain to all. These are the thorns that choke the seed and do not let it grow, which spring up in the hand of the drunkard, and which Israel produced instead of the grape. For the Lord waited for it to produce grapes, and it produced thorns, or the wild vine, which has the likeness of the grape and twists the mouths of those who eat it with its bitter taste. Therefore, when the time of judgment comes and all things have been overthrown, they will say to the mountains, which they formerly thought lofty, and to their former teachers: Cover us; and to the hills: Fall upon us. But because with the mountains he put cover, and with the hills: fall, something more sacred must be explained. To the mountains, that is, to the saints, who have a true and not a feigned height, they will say: Cover us. For blessed are those whose iniquities are covered. And to the hills, which have no natural height, which they once thought had something of loftiness, they will speak: Fall upon us; for the mountains will cover, and the hills will fall; and these things will happen out of fear and incredible dread, through which both mountains and hills will be humbled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
