[[commentary]]
quote='''
But if your right eye causes you to stumble, and the rest. Because he had spoken above of lust for a woman, he now rightly called the thought and the mind flitting in different directions the eye. And by the right hand and the other parts of the body the beginnings of will and affection are shown, so that what we conceive in the mind we may accomplish in deed. We must beware, therefore, lest what is best in us quickly slip into vice. For if the right eye and the right hand cause us to stumble, how much more the things in us that are on the left! If the soul slips, how much more the body, which is more prone to sins! Alternatively: in the right eye and the right hand is shown our affection for brothers and wife and children and kinsmen and relatives; if we see that these are a hindrance to us in contemplating the true light, we ought to cut off such portions, lest, while we wish to gain the others, we ourselves perish forever. Hence it is said also of the high priest, whose soul is dedicated to the worship of God: Over mother and father and children he shall not be defiled, that is, he shall know no affection except for him to whose worship he is dedicated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But if your hand or your foot causes you to stumble, cut it off and throw it from you, and the rest. It is indeed necessary that stumbling blocks come, yet woe to that man who, by his own fault, brings it about that what must necessarily happen in the world happens through him. Therefore every affection is cut off and all kinship is amputated, lest under the pretext of dutiful affection each of the believers lie open to stumbling blocks. If, he says, there is someone so joined to you as hand, foot, eye, and he is useful and attentive and sharp at seeing, but he makes a stumbling block for you and through the discord of his ways drags you into Gehenna, it is better for you to go without his kinship and his fleshly advantages than, while you wish to gain your relatives and close friends, to have a cause of ruin. So let not brother, not wife, not children, not friends, not any affection that can shut us out from the kingdom of heaven be preferred to the love of the Lord. Each of the believers knows what harms him, or in what his mind is solicited and often tempted. It is better to lead a solitary life than to lose eternal life for the necessities of the present life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
