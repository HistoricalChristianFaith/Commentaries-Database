[[commentary]]
quote='''
This is what the Lord says in another place, Whatsoever ye shall ask in my name believing, ye shall receive. (John 16:23.) Therefore when we receive not, it is not the weakness of Him that gives, but the fault of them that ask. Mat. 21:22.)

Some think that the faith that is compared to a grain of mustard-seed is a little faith, whereas the Apostle says, If I shall have such faith that I could remove mountains. (1 Cor. 13:2.) The faith therefore which is compared to a grain of mustard-seed is a great faith.

Or; the mountain is not said of that which we see with the eyes of the body, but signified that spirit which was removed by the Lord out of the lunatic, who is said by the Prophet to be the corrupter of the whole earth...
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they give as an example in the Gospel the lunatic, whom the apostles had not been able to heal; they ask why they could not heal him, and they hear: Amen I say to you, if you have faith like a grain of mustard seed, you will say to this mountain: Pass from here, and it will pass; and nothing will be impossible to you. But this kind is not cast out except by prayer and fasting. There the mountain is plainly taken to mean the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
