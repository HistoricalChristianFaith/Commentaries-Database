[[commentary]]
quote='''
To this sense is also fitted what follows: And has given him as head over all things to the Church, which is his body. For just as a head has very many members subjected to it, some of which are faulty and weak, so also our Lord Jesus Christ, since he is the head of the Church, has as his members all those who are gathered in the Church, namely saints as well as sinners: but the saints subjected to him by will, the sinners by necessity. And so it comes about that even enemies are subjected under his feet. Wherefore, in saying all things, he seems to raise a question. For that which was said: Sit at my right hand, until I put your enemies under your feet (Ps. 109:1), and elsewhere: For he must reign until he puts all enemies under his feet (1 Cor. 15:25), does not greatly require an interpreter, namely that the things which are hostile, once they have been overcome, are subjected under his feet and pass into the power of the victor. But why all things, that is, angels, thrones, dominions, powers and the other virtues, which were never opposed to God, should be subjected under his feet, seems obscure. It can therefore be answered that no one is without sin, and that the very stars are not clean before God, and that every creature trembles at the coming of the Creator (Job 15). Hence also the cross of the Savior is said to have cleansed not only the things that were on earth but also those that were in the heavens. Another, however, refers all things not to the whole universe, but only to those things about which the discussion was held; or in this way: "the whole city cried out", not that there was no one in the city who kept silent, but that from the greatest part even the lesser parts are named. And the apostle Paul himself says: All, he says, seek their own, not the things that are God's (Phil. 2:21); and: All have forsaken me. Not that Timothy and the other disciples who were with him at the time when the Epistles were being written had forsaken him; but because he was deserted by many, he complains that he has been deserted by all, that is, by the greatest part. Something similar to this sounds in the psalm too: All have turned aside, together they have become useless: there is none who does good, there is not even one (Ps. 13:3). For if all have turned aside, then he too who speaks has turned aside. And elsewhere: I said in the ecstasy of my mind, every man is a liar (Ps. 115:2). For what he said is either true or false. If every man is a liar, then he too who speaks is a liar. But if he too who speaks is a liar, then not even this which he says is true, that every man is a liar. Further, if the statement is true, "all" must be taken, as we said above, to mean that the great part of men lie. The Apostle also writes elsewhere: Teaching every man (Col. 3:16); and again, admonishing every man: not that he taught all men (for how many there are who to this day have heard neither the Apostle's teaching nor his name!), but that he teaches and admonishes all those who are in the Church and desire to know the things that are God's.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
But this too which he says, And has given him as head over all things to the Church, which is his body: the fullness of him who is filled all in all, can be understood of a Church not of men only, but also of angels and of all the virtues and rational creatures. Moreover this, Who is filled all in all, is by no means to be taken as it sounds; for he does not say, "Who fills all in all", but, who is filled all in all. For to fill is one thing, to be filled another; because in the one the verb belongs to the one acting, in the other to the one acted upon. Just as, then, an emperor is filled if his army is increased daily, and new provinces are made, and the multitude of his peoples grows, so also our Lord Jesus Christ, in that all things believe in him and come day by day to faith in him, is himself filled in all: yet in such a way that he is filled all in all, that is, that those who believe in him are full of all virtues, and, according to the Gospel, make him advance in age, wisdom and grace, not only with God but also with men (Luke 2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
