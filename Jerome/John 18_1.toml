[[commentary]]
quote='''
But the Lord and Savior himself also drank the cup from the torrent of Cedron. For thus the Scripture reports, when they came and seized him. "They came," it says, "and seized him at the torrent," and the rest. You see how lowly is the place of the torrent, how rugged. "Cedron" in the Hebrew tongue is interpreted "darkness." You see, then, that the torrents of this world are in darkness. The Lord, therefore, is handed over: he is not handed over up above on the Mount of Olives, he is not handed over in the temple: but he is handed over at the torrent, and the torrent of darkness, that is, Cedron. For all who hate the light love the darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_036.html'
source_title="Homily 36, on Psalm 109"
