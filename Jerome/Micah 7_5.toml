[[commentary]]
quote='''
Therefore believe none of the voices of the prophets, and do not lend your ear to the deceiving flattery of the diviners, for if among dear names and the affection of kinship faith is rare, how much more so among those who, flattering you, lie for their own booty, and, as for sick men, prescribe not what is useful, but what is delightful and pleasing. Do not believe a friend; for indeed Ahithophel rose up against David, and the true Ahithophel, Judas, against Christ. And do not trust in a leader, as the men of Shechem trusted in Abimelech. For they themselves made him king, and were oppressed by him. From her who sleeps in your bosom, guard the bars of your mouth, lest you suffer what Samson suffered from Delilah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Therefore do not believe friends, for every friend supplants with supplanting, and he who is a friend for the sake of something is not so much the friend of him whom he pretends to love, for a friend takes his name from love, as of the thing that he loves. A certain man, asked what a friend was, replied: Another self. But if the example of the Pythagoreans is set against us, who gave themselves to the tyrant as sureties for one another, we say that the sentence was pronounced by God not generally against all friends and the affections of love, nor against every time, but concerning that time of which the Apostle says: In the last days perilous times will come: for men will be lovers of themselves, covetous, disdainful, proud, blasphemers, disobedient to parents, ungrateful, wicked, without affection, not keeping covenant, informers, incontinent, harsh, without kindness, traitors, wanton, puffed up, lovers of pleasures rather than of God, and so on. For then brother will hand over brother, and father son, and mother daughter, and a man's enemies will be his own household. But even now faith is rare, when one thing is on the lips and another turns in the heart, and the honey of the tongue covers the poison of the mind. The rich have many friends, but from the poor even those who seem to be friends depart. Hence it is said: If you have a friend, possess him in temptation. I have read in someone's declamation: "A friend is long sought, scarcely found, hard to keep". Theophrastus wrote three volumes on friendship, preferring it to every other love, and yet he testified that it is rare in human affairs. There is also Cicero's book on friendship, which he entitled Laelius, in which that precept of our own writers, That a friend should be to us like old wine, and that we should drink it in sweetness, is set down in almost the same words. Friendship either finds equals or makes them; where there is inequality, the eminence of one and the subjection of the other, there is not so much friendship as flattery. Hence we also read elsewhere: "Let a friend be the same soul". And the Lyric poet, praying for a friend: Preserve, he says, the half of my soul. Do not, therefore, believe friends, that is, those men who seek gain from friendships. If you wish to delight in true friendship, be a friend of God, like Moses, who spoke to God as a friend to a friend. Be a friend, like the apostles, to whom the Savior says: No longer will I call you servants, because the servant does not know what his master does, but I will call you friends, because you have persevered with me in all my temptations. Dainty is the friendship that follows the good fortune and the riches of friends. Men of this kind seem to me to love not their friends but themselves. Let us consider more attentively the words of the Lord: But I will call you, he says, friends. And he gives the reasons why he calls them friends: Because you have persevered with me in temptation, and he did not stop there, but in all, he says, my temptations. For it sometimes happens that one who persevered with us in one temptation is overcome by others and withdraws. Secondly it is commanded: Nor hope in leaders: Cursed indeed is the man who puts his hope in man. Hope in man is vain, and true hope is in God. Hence Paul also says: And from among your own selves men will arise speaking perverse things. And the Lord himself through the prophet: The leaders of my people have not known me; they are foolish sons, and without understanding; they are wise to do evil, but to do good they have not known. They were indeed called my leaders, he says, and leaders of my people, but because they did not know me, and destroyed the name by their deeds, therefore they are foolish sons and without understanding; they have prudence only to this end, that they may subject the simple flock to themselves and trample it under their feet; but to do good and to rule the people they have not known. Do not believe in leaders: not in a bishop, not in a presbyter, not in a deacon, not in any dignity of men. Nor do I say this meaning that you ought not to be subject to ranks of this kind in the Church: Whoever indeed curses father or mother shall die the death; and the Apostle teaches that those set over us in the Church are to be obeyed; but I say it because it is one thing to honor leaders, another to have hope in leaders. Let us honor the bishop, defer to the presbyter, rise for the deacon, and yet let us not hope in them, for hope in man is vain, and sure hope is in the Lord. The third command: From her who lies with you, guard yourself, lest you believe her. Hence the apostle also calls women the weaker vessel, and commands that honor be shown them by their husbands. For man was not created for the sake of woman, but woman for the sake of man, and: The wife, he says, is to fear her husband. It belongs to the wife to fear, and to love her husband with fear. To husbands it belongs only to love, because love is of the perfect: Husbands, he says, love your wives and do not be bitter towards them, even though they provoke you to anger and do such things as to deserve to endure bitterness. For this is what παραπικραίνεσθαι means; yet do not repay them in kind with bitterness. And Solomon too, in Ecclesiastes: And one man, he says, out of a thousand I found, and a woman among all these I did not find; taught perhaps by his own example that women, through whom he had offended God, are not to be believed. And the sublime poet too — not another Homer, as Lucilius supposes of Ennius, but the first Homer among the Latins —: A varied and changeable thing ever is Woman.

The Greek and Latin histories are full of how many men were deceived by their wives and had their lives betrayed. From the Scriptures, moreover, the examples both of Delilah, whom we mentioned above, and of another woman before Delilah bear witness, who wrung from Samson his secret of seven days by her tears, and by feigned love discovered what lay hidden. Hence Samson afterwards says: If you had not tamed my heifer, you would not have found out my riddle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
