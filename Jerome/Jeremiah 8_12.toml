[[commentary]]
quote='''
Were they confounded, because they committed abomination? Nay rather, they were not confounded with confusion, and they did not know how to blush. This is to be read Erōtēmatikōs [as a question], so that the sense is: 'Did they blush in their crimes, did they understand the abominations which they wrought?' 'By no means; but they burst out into such madness that they neither desired to amend their vices through confusion nor to confess their crimes in hope of pardon'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Therefore they shall fall among those who collapse; in the time of their visitation they shall collapse, says the Lord. These are the rewards of those who did not know how to blush: that those whose dignity was loftier than the peoples should be mingled in the ruins of the people. For from the least to the greatest all are devoted to avarice, and from the prophet to the priest all practice falsehood; and the time of visitation is the approaching captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
