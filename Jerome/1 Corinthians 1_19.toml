[[commentary]]
quote='''
We read in another place: I will destroy the wisdom of the wise, and the understanding of the prudent I will reject (1 Cor 1:19). Not that true wisdom and true prudence are destroyed by the Lord, but the knowledge falsely so called: those who treasure up for themselves a lying tongue, and fail searching with searching, and find nothing, speaking iniquity on high and setting their mouth against heaven. Hence the pride of heretics is properly called insolence against the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
From this place the Apostle Paul, writing to the Corinthians, set down a testimony: I will destroy the wisdom of the wise, and the understanding of the prudent I will reject (1 Cor 1:19): setting out the same sense in other words; not that God is an enemy of wisdom, of which he is the father, and through whom all wisdom among men exists; but he set it down with an addition, as it is in the Hebrew: of the wise of the people and of its prudent, that is, of the people of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Or he is the one who trusts in his own strength and not in the mercy of God, according to what is written: I will destroy the wisdom of the wise, and the understanding of the prudent I will reject; not that true wisdom can perish and the understanding of the truth be rejected, but that the wisdom of those perishes who seem wise in their own eyes and trust in their own learning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
