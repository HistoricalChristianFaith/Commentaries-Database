[[commentary]]
quote='''
And when they are mistaken in His Father, no wonder if they are also mistaken in His brethren. Whence it is added, Is not his mother Mary, and his brethren, James, and Joseph, and Simon, and Judas? And his sisters, are they not all with us?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
This error of the Jews is our salvation, and the condemnation of the heretics, for they perceived Jesus Christ to be man so far as to think Him the son of a carpenter.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Is not this the carpenter's son? Is not his mother called Mary, and his brothers James and Joseph, Simon and Judas, and his sisters, all of them with us? The error of the Jews is our salvation and the condemnation of the heretics. For they so far saw Jesus Christ as a man that they thought him the son of a carpenter: Is not this the carpenter's son? Do you wonder that they err about the brothers when they err about the father? This passage is set out more fully in the little book Against Helvidius mentioned above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
