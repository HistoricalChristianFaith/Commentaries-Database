[[commentary]]
quote='''
There is none like you, O Lord; great are you, and great is your name in might. Who will not fear you, O king of the nations? For yours is the beauty; among all the wise of the nations and in all their kingdoms there is none like you. The wise and the foolish alike shall be proved; the teaching of their vanity is wood; silver wrapped — or drawn out — is brought from Tarshish, and gold from Uphaz, the work of the craftsman and of the hand of the coppersmith; blue and purple are their clothing; the work of craftsmen — or of the wise — are all these things. But the Lord is the true God; this is the living God and the everlasting king. At his indignation the earth will be shaken, and the nations will not endure his threatening. These words are not found in the Seventy, but in most copies they have been added from Theodotion's edition, and although according to the letter they seem clear, according to the anagōgēn [the higher, spiritual sense] they hold great difficulty. For none of those gods which are fashioned by heretical art is like the true God. All will fear him who is king of the nations; for the fear of the Lord is the beginning of wisdom, and from it we advance to love. Yours, he says, is the beauty; in truth there is comeliness, in falsehood ugliness. Although the heretics seem to themselves to be wise according to the wisdom of the world, which is destroyed, yet in all the kingdoms in which they tear the Church apart there is none like you, as the divine word says: I will destroy the wisdom of the wise, and the prudence of the prudent I will reject.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
