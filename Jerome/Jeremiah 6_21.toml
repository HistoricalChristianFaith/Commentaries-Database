[[commentary]]
quote='''
Therefore thus says the Lord: Behold, I will put ruins into this people, and they will fall in them — or weakness, and they will be weakened in it —, fathers and sons together, neighbor and kinsman, and they will perish. We see fulfilled all the things with which the Lord threatened that people; for daily they fall in their blasphemies, and they have nothing strong in them, but all is weakness among them. The sons follow the blasphemies of their fathers, and daily receive that imprecation: His blood be upon us and upon our children; and not only they themselves, but also their neighbors and kinsmen, all who follow the law and the prophets according to the letter that kills and not according to the spirit that gives life; and all alike will perish, because alike they have sinned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
