[[commentary]]
quote='''
And what follows: And you shall go out through the openings, one against another, can be explained thus: The way of captivity lies open to you, and when your cauldrons have been burnt out, you shall go out one against another; according to the idiom of the Hebrews, who, for what we say mutually or in turn, say woman and woman, that is, one against another. And you shall be cast, he says, into the places of Armenia which are called Armona. Finally Symmachus interpreted: And you shall be cast into Armenia, for which the Seventy translated mount Remmam, Aquila mount Armona, Theodotion mount Mona, the Fifth edition the lofty mount.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
