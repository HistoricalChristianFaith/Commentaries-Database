[[commentary]]
quote='''
Nevertheless hear this word which I speak in your ears and in the ears of all the people: the prophets who were before me and you from the beginning, and prophesied over many lands and over great kingdoms of battle and of affliction and of famine; the prophet who prophesied peace, when his word comes, the prophet will be known whom the Lord has sent in truth. Jeremiah could have said to Hananiah: 'You speak falsely, you deceive the people, you are not a prophet but a false prophet.' But had he said that, the false prophet too could have turned the same words back upon Jeremiah; therefore he does him no insult and speaks as though to a 'prophet'. 'Not only,' he says, 'am I a prophet, and you, but before me and you there were many others, among whom were Isaiah, Hosea, Joel and Amos and the rest. They prophesied,' he says, 'against many lands and kingdoms not small but great, announcing to them war and adversity and want of all things; and on the contrary there were others who promised peace and prosperity. The pronouncement of both was proved not by the flattery of a lie but by the outcome of events.' Under the example of others, then, he speaks of himself and of Hananiah: that when the end of events has come, then the truth of the prophets is shown. The Lord also said this same thing through Moses, that a prophet is shown by the fulfilment of his prophecy. And this must be noted, that not threateningly, not savagely, but with the confidence of truth he rebukes the liar and defers the matter to the future, so that those who hear may await the outcome of events.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
