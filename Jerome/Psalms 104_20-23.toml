[[commentary]]
quote='''
The Word of God, the true sun, has risen for us, and the beasts have gathered together, withdrawing into their dens: let us go forth as men to our work, and let us labor until the evening, as is mystically sung in the psalm: "You have set darkness, and it became night. In it the beasts of the forest will pass through, the young lions roaring to seize their prey and to seek their food from God. The sun has risen, and they have gathered together, and in their dens they have slept. Man shall go forth to his work, and to his labor until the evening" (Ps. 103:20 ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
