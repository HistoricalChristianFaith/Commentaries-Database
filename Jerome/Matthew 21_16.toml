[[commentary]]
quote='''
But the answer of Christ was cautions. He spake not what the Scribes would fain have heard, The children do well that they bear witness to me; nor on the other hand, They do what is wrong, they are but children, you ought to be indulgent to their tender years. But He brings a quotation from the eighth Psalm, that though the Lord were silent, the testimony of Scripture might defend the words of the children (Ps. 8:2) as it follows, But Jesus said unto them, Yea, have ye never read, &c.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Jesus says to them: Certainly; have you never read: Out of the mouth of infants and sucklings you have perfected praise? How moderately tempered the statement, and the reply leaning both ways and not open to slander! He did not say what the scribes wanted to hear: The children do well to bear witness to me; nor again: They are wrong, they are children, you ought to make allowance for their age; but he brings forward an example from Psalm 8, so that, while the Lord was silent, the testimony of the Scriptures might confirm the words of the children.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
