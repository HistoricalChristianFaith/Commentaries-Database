[[commentary]]
quote='''
You who show mercy to thousands and repay the iniquity of the fathers in the bosom of their sons after them. Great is the clemency of the Creator, to extend his mercy to a thousand generations and to show righteousness at once in the next generation, which itself, however, is mixed with mercy; for he does not punish the offender at once, but waits for repentance, so that, if the children have imitated the vices of their parents, the long-deferred punishment is repaid. Most mighty, great, powerful, the Lord of hosts — or of powers — is your name! These names indicate the power of the Creator; but properly the name of God is 'Father', which is revealed in the Gospel through the Lord, who says: Father, I have manifested your name to men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
