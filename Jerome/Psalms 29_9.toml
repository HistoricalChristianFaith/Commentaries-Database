[[commentary]]
quote='''
And there shall be, he says, plains, or woodlands, as folds for flocks. For plains, SARON (שרון) is put in the Hebrew. The whole region around Lydda, Joppa and Jamnia is suited to pasturing flocks. Of it it is also written in the Acts of the Apostles: But the woodlands shall be turned into sheepfolds (Acts 9), according to what is sung in the psalm: The voice of the Lord perfecting the stags, and he will lay bare the woodlands (Ps 28 [29]:9), or the thickets of the forests, so that robbers may cease to lurk there, and beasts and venomous animals, and places once of ambush and blood may pass into churches of the Lord, and flocks may be pastured there by him who laid down his life for his sheep. Of whom it is written: He will shepherd us forever (Ps 47 [48]:15). This voice of the Lord, perfecting the stags and laying bare the thickets of the forests, cries out through John in the desert: Already the axe is laid to the root of the trees. Every tree that does not bear good fruit will be cut down and cast into the fire (Matt 3:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
