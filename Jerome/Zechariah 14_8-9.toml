[[commentary]]
quote='''
And it shall be on that day, living waters shall go out from Jerusalem, half of them to the eastern sea, and half of them to the last sea; in summer and in winter they shall be. And the Lord shall be king over all the earth. LXX: On that day living water shall go forth from Jerusalem, half of it to the first sea, and half of it to the last sea; in summer and in spring it shall be so. And the Lord shall be for a king over all the earth. At that time — for this is what is meant by the day which is known to the Lord alone, in which light and darkness shall not succeed one another, but there shall be perpetual light, according to what we read in the Apocalypse: And the city shall have no need of the light of the sun, since the Lord God Almighty shall be its light, living waters shall go forth from Jerusalem, about which we argued above when we set out the testimony of Ezekiel; half of them shall go to the eastern sea, which the books of the Greeks call λίμνην ἀσφαλτῖτιν (the Asphalt Lake), and which is commonly called the Dead Sea, because nothing can live in its waters. And half to the last sea, which leads to Egypt and forms the shores of Palestine. In summer, he says, and in winter it shall be so, that these waters which shall go out from Jerusalem shall neither be bound by the frost of winter nor dried up by the excessive heat of summer; although for winter the Seventy translated springtime, which does not fit as a contrast to summer. And when the life-giving waters have entered both seas and have softened the bitter waters with their sweet stream, then the Lord shall be king over all the earth. The water which goes out from Jerusalem, that is, from the Church, signifies the teaching of the Savior: For out of Zion shall go forth the law, and the word of the Lord from Jerusalem, according to what is written elsewhere: All things are filled with the knowledge of the Lord, as much water covering the sea. Half of these waters shall go to the eastern sea, the people of the circumcision, which was chosen in the apostles and through the apostles; and half of them to the last sea, so that from the east and the west they may come who shall recline with Abraham and Isaac and Jacob. Or at any rate let us understand by the eastern sea and the last sea the Old and the New Instrument, which, unless it has been sweetened by the stream of the Savior and by his spiritual understanding, is most bitter, since the letter kills and the spirit gives life. And in what follows: In summer and in winter they shall be, 'the living waters which go out from Jerusalem' is understood, so that both in peace and in persecutions these living waters do not cease to flow. Or else, since the LXX translated: In summer and in spring it shall be so, let us say this, that at that time there will be no winter, but spring and perpetual summer, when the voice of the turtledove shall be heard in our land, and the fig trees shall bring forth their green figs, and the vines shall flower, and the winter shall pass, and the rain shall withdraw and go its way. At that time spring will be necessary for this reason, that flowers shall appear in our land so that we may celebrate the Pasch and Pentecost, in which we may pass from earthly things to heavenly ones and offer all our fruits to God. For at the Phase is the end of winter and the beginning of spring, at Pentecost the beginning of summer, when we offer to God the labors of our hands and their fruit. Of this perpetual summer and spring the just man speaks to the Lord: You made the dawn and the sun; summer and spring you fashioned. Then the Lord shall be king over all the earth, when we shall say: The Lord has reigned, let the earth rejoice, and again: Say among the nations that the Lord has reigned. For he has set right the world, which shall not be moved. And that the living water has rightly been explained by us as the teaching of the Savior, he will know who has drunk it, and who has heard the Savior preaching: If anyone drinks of the water that I shall give him, there shall be in him a fountain of water living and springing up into eternal life, and again: He who believes in me, as the scripture has said, out of his belly shall flow rivers of living water. For just as he who has drunk of his teaching shall have a living fountain in himself, so he who has believed in him, according to what is contained in the words of the scriptures, out of his belly shall flow rivers of living water. Many refer the living waters to baptism, which are to be lavished on the thirsty in spring and in summer, that is, at the Pasch and at Pentecost, when what is written shall be fulfilled: Wash yourselves, be clean.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
