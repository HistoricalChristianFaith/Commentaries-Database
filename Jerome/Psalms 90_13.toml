
[[commentary]]
quote='''
Turn back, O Lord, how long? We have sinned much, you turn away your face, our sins are not worthy to be seen by your eyes, and therefore we pray: Turn back, O Lord, how long? Behold, now so many ages have flowed by: the prophets have always proclaimed to the nations that you would come, and still you have not come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_019.html'
source_title="Homily 19, on Psalm 89"

[[commentary]]
quote='''
Turn back, Lord, how long? Turn back, Lord, and look upon your image: do not show us your back, but your face. Turn back, how long? He who says how long shows that he desires, and cannot bear the delays of his desire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_067.html'
source_title="Homily 67, on Psalm 89 (Alternate Series)"
