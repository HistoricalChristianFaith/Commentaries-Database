[[commentary]]
quote='''
And now, behold, your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine: Ephraim and Manasseh shall be to me as Reuben and as Simeon. But those whom you shall beget after these shall be yours; they shall be called by the name of their brothers. If anyone was in doubt that seventy souls of the sons of Israel entered Egypt, and that Joseph, at the time when Jacob entered, had not nine but only two sons, it is confirmed by the present passage, since Jacob himself says that he had two sons, not nine. And when he says Ephraim and Manasseh shall be to me like Reuben and Simeon, he signifies this: as Reuben and Simeon will be two tribes and will be called by their own names, so Ephraim and Manasseh will be two tribes, and will beget two peoples, and so will inherit the land of promise, just as my sons too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
