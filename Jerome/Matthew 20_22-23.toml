[[commentary]]
quote='''
I will take, then, the cup of Jesus. What is this cup of Jesus? "Father, if it is possible, let this cup pass from me," and "Are you able," he says, "to drink my cup?" And immediately there follows: "My cup indeed you shall drink." But why did I say this? So that we may understand the cup to be the sufferings of martyrdom. A great thing is martyrdom. How is it a great thing? Because he renders to the Lord what he received from the Lord. Christ suffered for him, and he suffers for his name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_040.html'
source_title="Homily 40, on Psalm 115"
