[[commentary]]
quote='''
Do not weep for the dead, nor mourn over him! Lament with weeping him who goes out, for he shall not return again, nor see the land of his birth! For thus says the Lord to Shallum son of Josiah, king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall not return here any more, but in the place to which I have carried him away, there he shall die, and he shall not see this land any more. Josiah, a righteous king, had three sons, Jehoahaz and Jehoiakim and Zedekiah. The first of them Pharaoh Neco, king of Egypt, led captive into Egypt, and there he died; and he set up in his place as king his brother Eliakim, and changed his name to Jehoiakim. When he died, his son Jeconiah reigned, who was led into captivity by Nebuchadnezzar, the Babylonian king, together with his mother and the princes; in his place his uncle Zedekiah reigned, who, when Jerusalem was taken, was led into Babylon. And so it is asked who this is who ought not to be wept for, and who is to be led into captivity and will never return, since three were taken and carried away. The Hebrews think that this fits all of them, that is, Jehoahaz and Jeconiah and Zedekiah, and that all the sons of Josiah are called 'Sellem' or 'Sellum', which means 'consummation' or 'completion', because the kingdom of Judah came to its end in them. To me, however, this seems to be said properly of Zedekiah, about whom the prophecy of both the present and the previous chapter is, in whom the kingdom of Judah truly came to its end, under whom the city also was taken, and who, it is written, was led into Babylon and died there. He is 'Sellum', that is, 'consummation' and 'completion', son of Josiah, king of Judah, who reigned in place of Josiah his father. Jeconiah, on the other hand, was not the son but the grandson of Josiah, the son of Jehoiakim, so that from the beginning of the vision, when there sent to Jeremiah King Zedekiah Pashhur son of Malchiah, and Zephaniah son of Maaseiah, the priest, down to this chapter, we are to understand that everything is said to the king and about King Zedekiah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
