[[commentary]]
quote='''
And the word of the Lord came to Zechariah, saying: Thus says the Lord of hosts, saying: Judge true judgment, and show mercy and compassion, every man with his brother. And do not wrong the widow and the orphan and the stranger and the poor; and let no man devise evil against his brother in his heart. And they would not attend, and they turned a withdrawing shoulder; and they made their ears heavy, that they might not hear; and they made their heart adamant lest they hear the law and the words which the Lord of hosts sent in his spirit by the hand of the former prophets, and great indignation came from the Lord of hosts. And it came to pass as he spoke, and they did not hear: so they shall cry, and I will not hear, says the Lord of hosts. And I scattered them through all the kingdoms which they do not know; and the land was left desolate by them, because there was none passing through and returning; and they made the desirable land into a desert. LXX: And the word of the Lord came to Zechariah, saying: Thus says the Lord Almighty, saying: Judge just judgment, and let each one show mercy and compassion toward his brother; and do not oppress the widow and the orphan and the poor; and do not, each of you, remember the malice of his brother in your hearts. And they would not attend, and they gave a scornful back; and they made their ears heavy, so as not to hear; and they made their heart disobedient, so as not to hear my law and my words, which the Lord Almighty sent in his spirit by the hands of the former prophets. And great wrath came from the Lord Almighty, and it shall be as I said, and they did not hear him. So they shall cry, and I will not hear them, says the Lord Almighty; and I will cast them out among all the nations which they did not know; and the land was made desolate after them, of anyone passing through and returning, and they made the chosen land into a wilderness. These things I wanted rather, these I sought, and because you did not do them you were handed over to captivity; not the fast of desolation and death of the fifth and the seventh month. Judge just judgment, lest you hear in the psalms: How long will you judge iniquity, and accept the persons of sinners? Judge for the orphan and the widow; justify the humble and the poor, lest Isaiah too say to you: Who justify the wicked for gifts, and take away from the just what is just; and lest, because of you, Habakkuk, in the person of those who are oppressed, cast reproach upon God: Judgment has been given against me, and the judge takes; therefore the law is scattered, and judgment does not come through to the end, because the wicked oppresses the just. And let us not think that this is a new commandment of God; long ago he had enjoined these things through Moses: So shall you judge the great as the small; you shall not accept a person, and you shall not pity the poor in judgment, since the judgment is God's. Show also mercies and compassions, every man with his brother. After truth of judgment let clemency follow toward all, and most of all toward brothers, whom we perceive to be either of the same blood as we or of one faith with us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
