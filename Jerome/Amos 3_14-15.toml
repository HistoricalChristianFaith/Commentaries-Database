[[commentary]]
quote='''
When the Lord begins to visit the transgressions of Israel, which formerly beheld God with the mind, he will visit also upon the altars of Bethel, not the one altar which the Church has, but the very many altars of the heretics. For they have as many altars as schisms. He will cut off also the horns of the altar which in their pride they boast that they possess as the one altar. And their horns, that is, their arrogance, will fall to the ground; and he will strike the winter house, those heretics who toil in continence and fasts, in dry fasts and sleeping on the ground, among whom are Tatian and Mani; and the summer house, such as the Nicolaitans and the Eunomians, and the new followers of an old heresy, who for the gluttony of the belly admit every pleasure. And the houses of ivory will perish, which are put together with an artful tooth and the splendour of rhetorical polish. And many houses will be scattered, which are dispersed through the whole world. For when the one truth rises, many lies will be destroyed. For the winter house the Seventy translated οἶκον τὸν περίπτερον, which we have interpreted winged, because it has little doors over the windows, and as it were wings for keeping off the severity of the cold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
