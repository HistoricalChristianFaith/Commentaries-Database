[[commentary]]
quote='''
And David, who had reached the old age of Abraham, sang freely: I have been young, and have grown old, and I have not seen the righteous forsaken, nor his seed seeking bread. How many martyrs in persecutions perished of hunger, and lacked grain and these nourishments of the body. Therefore he speaks of that bread which came down from heaven, which whoever eats will be able neither to hunger nor to thirst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
