[[commentary]]
quote='''
Take for me a Jew reading Leviticus, and all those sacraments that are written there, and how the leper enters into the synagogue, how a hen is taken up, and its neck is wrung; then it is told how the blood is to be sprinkled, it is told of the water, it is told also of the hyssop, it is told too how his garments are to be rent, and thus he enters into the synagogue, he who had been a leper. If we read according to the letter, what profit is it to us that we read? But if we have turned to the heart, if we have understood spiritually, we shall see that the leper cannot enter to the people of God unless his garments be rent, unless whatever had been shut up be uncovered. Then see that this leper does not enter into the synagogue except through blood and water and hyssop. Therefore you too, who up to this day have been a leper — your leprosy did not appear until you came to the priest. But because you came to the priest, the priest unstitched your garments, and that which seemed to be covered and sound, he showed to be leprous. He set all your sins and your leprosy before your eyes, and therefore he brings you back into the synagogue of God through blood and through water. Through blood, through the passion of Christ; and through water, through baptism. Therefore, after leprosy you will not be able to be healed except through the blood of Christ and through baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_017.html'
source_title="Homily 17, on Psalm 84"
