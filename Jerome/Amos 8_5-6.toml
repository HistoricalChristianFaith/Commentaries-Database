[[commentary]]
quote='''
You who wait for the Kalends, to trade and to heap interest upon interest, and for the sabbaths, to open the granaries and give out grain, meaning to receive more back, and who turn the solemn feasts of God to your own profit for the sake of shameful gain; who make the measure smaller in selling goods, and the weights greater in receiving them, and the balance unjust, so that you may possess the poor man's money, and hold men so cheap that you fulfill what I said of you above: Because you sold the righteous for silver, and the poor for shoes; you have leapt into such a frenzy for gain that you sell to the poor not grain, by eating which men's bodies are sustained, but the refuse and sweepings of the grain, mixing dust and chaff with the wheat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
