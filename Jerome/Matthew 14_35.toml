[[commentary]]
quote='''
They knew Him by fame, not by sight; although indeed by reason of the greatness of the signs which He did among the people, He was known by face to great numbers. And note how great the faith of the men of the land of Gennezareth, that they were not content with the healing of the men of that country only, but sent to all the towns round about.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when the men of that place had recognized him, they sent into all that region. They recognized him by report, not by face; or at any rate, because of the greatness of the signs that he was performing among the peoples, he was also known by face to very many. And see how great is the faith of the men of the land of Gennesaret, that they are not content with the health of those present only, but send to other cities round about, so that all may run to the physician.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
