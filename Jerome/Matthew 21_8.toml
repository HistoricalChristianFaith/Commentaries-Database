[[commentary]]
quote='''
The multitudes that came out of Jericho, and followed the Saviour, cast down their garments, and strewed the way with branches of trees; and therefore it follows, But the multitudes spread their garments in the way; that is, beneath the feet of the ass, that it should not stumble against a stone, nor tread upon a thorn, nor fall into a ditch. Others cut down branches from the trees, and strewed them in the way; from the fruit-trees, that is, with which mount Olivet was clothed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And a very great crowd spread their garments on the road. See the difference of each person. The apostles put their garments upon the ass; the crowd, which is of lower rank, spreads them beneath the ass's feet, so that it may nowhere strike against a stone, may not tread on a thorn, may not slip into a pit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And others cut branches from the trees and spread them on the road. From the fruit-bearing trees with which the Mount of Olives is planted they cut branches and spread them on the road, to make the crooked straight and to level the uneven, so that Christ, the conqueror of demons and of vices, might advance more straightly and more safely in the heart of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
