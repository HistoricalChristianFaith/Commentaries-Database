[[commentary]]
quote='''
He will also shout and cry aloud against his enemies, openly rebuking their unbelief and declaring with a loud cry: I have held my peace, I have always kept silent, I have been patient, or, as the Seventy translated: I have held my peace; shall I always hold my peace (Eccl 3:7)? So that what is said through Solomon may be fulfilled: A time to keep silence, and a time to speak. And the sense is: For a long time I have often borne you when you sinned; but because I had kept silent before, I will no longer keep silent. And as a woman giving birth pours forth the infant into the light, and makes open what was before held shut in her womb, so I will now bring forth my pain and the forbearance which I always had over your crimes, and I will scatter your counsels; and at one time I will swallow up the whole nation, and all the pride of your mountains and the swelling of your hills. And the grass, of which it was said above, Truly the people is grass, that is, princes as much as the common herd, I will reduce to a desert. This was added in the Seventy, which had passed over these words in silence, from the edition of Theodotion (see above, Isa 40:7). And when I have dried you up and destroyed you from head to foot, then I will make the rivers of my teaching run in the islands of the nations, and I will reduce your pools or marshes to dryness, so that among the nations there may be the knowledge of the Scriptures, and among you the dryness of teaching.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
