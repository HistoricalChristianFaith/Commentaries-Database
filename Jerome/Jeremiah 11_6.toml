[[commentary]]
quote='''
And the Lord said to me: Cry out — or read — all these words in the cities of Judah and outside Jerusalem, saying: Hear the words of this pact and do them! The most merciful God frequently foretells what is to come, so that the mind that is hard to believe may at last be softened. And he foretells it both in the city of Jerusalem and outside in the countryside, so that those whose peril is common may have the same penitence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
