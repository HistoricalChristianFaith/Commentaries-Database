[[commentary]]
quote='''
Is Ephraim an honorable son — or beloved — to me, is he a delicate child? for, since I spoke of him — or my words in him —, I will still remember him; therefore my bowels are troubled over him; pitying I will have pity on him, says the Lord. Since Ephraim repents and says at the beginning: you have instructed me and I was instructed like an untamed bullock, and at the end: because I bore the reproach of my youth, the Lord answers, and sustains him, turned to him with his whole mind, with such an oracle: 'Ephraim is a beloved son to me, whom I loved so much from the beginning that I preferred him to his brother Manasseh.' An honorable son, who against the order of nature received the honor of the firstborn by the condescension of the Lord; a delicate child, of whom he writes: the sons of Ephraim, bending and shooting the bow, turned back in the day of battle, against whom and to whom the whole book of the prophet Hosea is addressed, whom Jacob blesses. And let us take 'delights' in this place according to what is said in the psalm: delight in the Lord, and he will give you the petitions of your heart, for which in the Greek and in the Hebrew it has: abound in delights; whence also the paradise in Eden is called the paradise 'of delights'. 'For', he says, 'there were my words in him, with remembrance I will still be mindful of him.' Lest the blessing be thought gratuitous, and to have been conferred out of the indulgence of the giver rather than by the merit of him on whom it was bestowed, therefore he says: 'I will remember him, for my words were in him, not in his mouth, not on his lips, but in the innermost affection of the heart; for which cause also my bowels are troubled over him'. To him he speaks through Hosea too: what shall I do to you, Ephraim? what shall I do to you, Israel? shall I make you as Admah and as Zeboiim? my heart is turned within me, my bowels are troubled. I will not execute the fury of my wrath and I will not destroy Ephraim. Pitying I will have pity on him, says the Lord. 'My words indeed were in him, and he received all my commandments with an eager mind and kept them in his heart; but nevertheless pitying I will have pity on him', to show that all the righteousness of men needs the mercy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
