[[commentary]]
quote='''
If I go out into the fields, behold, those slain by the sword, and if I enter the city, behold, those wasted with famine — or the pain of famine —! The prophet also and the priest have gone off into a land which they did not know. A just cause for lamenting, that the virgin has been crushed, the daughter struck and the people destroyed. 'For if,' he says, 'I wish to go outside, I shall see the slain; if to enter the city, I shall behold those wasted and scarcely clinging to their bones through the necessity of famine'. And what wonder is it to say this of the common people and the ignoble crowd, when the prophets also and the priests, who prophesied prosperity to others and who ought to have opened the commandments of the law, themselves went into a land which they did not know and endured the evil of captivity? Let our prophets and priests hear this: that because of their negligence there is no security either within or without, since they both scandalize those who are without and allow those who are within to perish by famine, and those who were the authors of sinning become companions in the torments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
