[[commentary]]
quote='''
They do not lay it upon the forwardness of the mother who spoke the request, but upon her sons, who, not knowing their measure, burned with so immoderate desires.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the ten, hearing it, were indignant at the two brothers. The ten apostles are not indignant with the mother of the sons of Zebedee, nor do they lay the boldness of the request to the woman, but to the sons, because, ignorant of their own measure, they had blazed up with immoderate desire; to them the Lord too had said: You do not know what you are asking. But it is understood, either from the Lord's answer or from the indignation of the apostles, that the sons had sent their mother in to ask for great things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
