[[commentary]]
quote='''
Nor is it any wonder that men, holy though they are, are nobly called servants of God, since through the prophet Isaiah the Father speaks to the Son: "It is a great thing for you to be called my child (puer)" (Isa. 49:6), which in Greek is said: μέγα σοί ἐστι τοῦ κληθῆναί σε παῖδά μου. Now because "child" (puer), that is, παῖς, can according to the Greeks signify both servant (famulus) and son, we inquired in the Hebrew, and found written not "my son" but "my servant", that is, ABDI (עבדי). Hence also the prophet Obadiah (Abdias), whose name means "servant of the Lord", received his name from his service to God. If it disturbs anyone that the Lord and Savior, who is the founder of the universe, is called a servant of God, he will not be disturbed if he hears him speaking to the apostles: "Whoever wishes to be greater among you, let him be the servant of all"; and: "The Son of man came, not to be served, but to serve" (Matt. 20:27, 28); and, lest he should seem to teach this by words alone, he showed it by example. For taking a towel, he girded himself, and filling a basin with water, he washed the feet of the disciples (John 13). It is therefore not impious to believe that he who had taken the form of a servant did those things which belong to a servant, so that he may be said to have served his Father's will, since he himself served his own servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
