[[commentary]]
quote='''
This head is closely connected with the preceding. It is directed against the Pharisees, who, despising the commandments of God, set up traditions of their own, and means that their teaching the people would not avail themselves, if they destroyed the very least commandment in the Law. We may take it in another sense. The learning of the master if joined with sin however small, loses him the highest place, nor does it avail any to teach righteousness, if he destroys it in his life. Perfect bliss is for him who fulfils in deed what he teaches in word.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But you, speak the things that befit sound doctrine. It is one thing to speak sound doctrine, another to teach the things that suit sound doctrine: for in the one there is simple instruction only; in the other, together with the teaching, there is also the correction of life. "For whoever breaks one of these least commandments, and teaches men so, shall be called least in the kingdom of heaven" (Matt. 5:19): the Lord commanding the disciples that they ought not only to labor in meditation on the Scriptures, so as to go over what is written and store it up in the treasury of memory, but first to do what has been commanded. "But whoever does and teaches, he shall be called great in the kingdom of heaven." For unless our righteousness surpasses the righteousness of the scribes and of the Pharisees, we cannot enter the kingdoms of heaven (Matt. 5). They, sitting upon the chair of Moses, say and do not do, and bind unbearable burdens which they lay upon men's necks, and will not themselves touch them with their least finger. This, then, is what the Apostle now teaches Titus, his son in Christ and his disciple: to speak the things that suit sound doctrine; because doctrine has soundness then, when the teacher's doctrine and his life agree alike.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
Whoever destroys one of these least commandments and teaches men so shall be called least in the kingdom of heaven; but whoever does and teaches them shall be called great in the kingdom of heaven. This passage hangs together with the testimony above, in which he had said: One iota or one apex shall not pass from the law until all things come to pass. He therefore censures the Pharisees, who, despising the commandments of God, set up their own traditions: their teaching among the peoples does them no good if they destroy even a little of what is commanded in the law. But we can also understand it otherwise: that the learning of a master, if he is liable even to a small sin, brings him down from the highest rank, and that it does no good to teach justice which the least fault destroys, and that perfect blessedness is to fulfill in deed what you have taught in word.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
