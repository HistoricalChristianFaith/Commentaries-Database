[[commentary]]
quote='''
If we had not read above that invitation to his hearers to understand, when the Saviour said, He that hath, ears to hear let him hear, we might here suppose that the eyes and ears which are now blessed are those of the body. But I think that those eyes are blessed which can discern Christ's sacraments, and those ears of which Isaiah speaks, The Lord hath given me an ear. (Is. 50:4)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But blessed are your eyes, because they see, and your ears, because they hear. Had we not read above that the hearers were roused to understanding when the Savior said, He who has ears to hear, let him hear, we would think that the eyes and ears which now receive the beatitude are to be understood as those of the flesh. But to me those eyes seem blessed which can know the mysteries of Christ, and which Jesus commanded to be lifted up on high so that they might behold the white harvest fields; and those ears blessed of which Isaiah speaks: The Lord has given me an ear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
