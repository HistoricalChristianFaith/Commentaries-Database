[[commentary]]
quote='''
Many of our writers interpret the hands of Zerubbabel, who founded the house and himself finished it, as Christ. But if we accept this, we shall be compelled to explain who the stone of tin in the hand of Zerubbabel is. For surely another Christ is not to be shown in the hand of Christ? Although some have taken the stone of tin as the body of the Lord, which was soiled by no stains of sins, and is not called lead, but purest tin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
