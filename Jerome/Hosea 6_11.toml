[[commentary]]
quote='''
Hence the word is turned to Judah also: You too, Judah, set a harvest for yourself; and the sense is: Do not think yourself secure because Israel is led away captive; you too, prepare your crops to be reaped; for not much later you will be led captive to Babylon, and the time of your reaping will come. And when the Chaldeans have reaped you, I will turn back again the captivity of my people, and under Cyrus king of the Persians and Artaxerxes I will bring my people back. And note how pointedly the captivity of Judah and its return are prophesied together; but of Israel, that is, of the ten tribes, there is silence even now, and if ever something favorable is said, it is put off to the coming of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
