[[commentary]]
quote='''
For there are many who are also not submissive, empty talkers and deceivers of minds, especially those who are of the circumcision, on whom silence must be imposed; who overturn whole houses, teaching what they ought not, for the sake of shameful gain. Let him who is to be the leader of the Church have eloquence joined to integrity of life, so that his works may not be silent without speech, nor his words blush for lack of deeds; especially since there are not few but many, and not submissive but insolent, who do not care to say that word of the Psalmist, "Is not my soul subject to God?" (Ps. 61:1), but by empty persuasion pervert the good seed of minds, which by nature has knowledge of God. For this is what Paul seems to me to have meant when he says φρεναπάται: not, as the Latin translator simply rendered it, deceivers (deceptores), but deceivers of minds (mentium deceptores). And indeed, without the authority of the Scriptures their garrulity would win no belief, unless they seemed to strengthen their perverse doctrine with divine testimonies as well. These are the Jews of the circumcision, who at that time were striving to overturn the newborn Church of Christ and to bring in the precepts of the Law; of whom Paul treats more fully both to the Romans and to the Galatians. And we, a few months ago, dictated three volumes in the explanation of the Epistle to the Galatians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
