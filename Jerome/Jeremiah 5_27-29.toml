[[commentary]]
quote='''
Therefore they have been magnified and enriched. They have grown fat and sleek, and they have passed over my words most wickedly. They have not judged the cause, the cause — or judgment — of the orphan they have not directed, and the judgment of the poor — or of the widow — they have not judged. Shall I not visit for these things? says the Lord, or shall my soul not take vengeance on a nation such as this? If I should wish to note one by one the things that have been left out in the edition of the Seventy, it will become long. 'Those who lay snares,' he says, 'and rejoice in the nakedness of others, therefore they have been magnified and enriched.' Because they did the things above, they have grown fat and sleek, according to that which is written: He grew fat and sleek, and the beloved kicked. And they have passed over my words, because in the consciousness of their riches they said that saying from the Gospel: Soul, you have many goods laid up for very many years; rest, eat, drink, feast! Moreover, they passed over to their own harm, and, despising all men, they did not set the judgment of God before their eyes. They despised the orphan and the poor, for which the Seventy said 'widows', which is not found in the Hebrew; for 'hebionim' properly denotes 'poor', not 'widows'. But what follows, Shall I not visit for these things? says the Lord, or shall my soul not take vengeance on a nation such as this?, has already been discussed above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
