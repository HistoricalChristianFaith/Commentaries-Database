[[commentary]]
quote='''
But when the disciples asked, marveling at the severity of the saying: Who then will be saved? he tempered the severity of the sentence by his clemency, saying: What with men is impossible is possible with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
