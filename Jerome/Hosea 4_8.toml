[[commentary]]
quote='''
For indeed the priests eat the sins of my people, the priests of whom it is written: Who devour my people as a meal of bread. And they eat the sins of my people for this reason, that they consent to the crimes of those who offend; for when they have seen them sinning, they not only do not reprove them, but praise and extol them, and proclaim them blessed. Of these Isaiah too speaks: My people, those who call you blessed lead you astray, and trip up the paths of your feet. Of these the psalmist also cries out: For the sinner is praised in the desires of his soul, and the unjust man is blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
