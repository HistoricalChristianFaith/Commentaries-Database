[[commentary]]
quote='''
John, then, is called Elijah not according to the foolish philosophers and certain heretics who introduce a μετεμψύχωσιν (transmigration of souls), but because, according to another testimony of the Gospel, he came in the spirit and power of Elijah and had either the same grace or the same measure of the Holy Spirit. Moreover, the austerity of life and the rigor of mind of Elijah and John are equal. The one was in the desert, the other in the desert; the one was girded with a leather belt, and the other had a similar girdle; the one, because he rebuked King Ahab and Jezebel for impiety, was forced to flee, the other, because he rebuked the unlawful marriage of Herod and Herodias, is beheaded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
