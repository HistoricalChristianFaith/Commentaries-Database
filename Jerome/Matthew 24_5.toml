[[commentary]]
quote='''
One of them of whom The speaks was Simon of Samaria, of whom we read in the Acts of the Apostles, that he gave himself out to be the great Power, leaving these things written in his worksa among others, I am the Word of God, I am the Almighty, I am all things of God. The Apostle John also in his Epistle, Ye have heard that Antichrist shall come; even now there are many Antichrists. (1 John 2:18.) I suppose all heresiarchs to be Antichrists, and under the name of Christ to teach those things which are contrary to Christ. No wonder if we see some led away by such teachers, when the Lord has said, And shall deceive many.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For many will come in my name, saying: I am the Christ, and they will lead many astray. One of these is Simon the Samaritan, of whom we read in the Acts of the Apostles, who said that he was the great power of God, and who left behind, among other things written in his books, these words too: I am the word of God, I am the beautiful one, I the Paraclete, I the almighty, I all things of God. But John the apostle too says in his letter: You have heard that antichrist is to come, but now there are many antichrists. I think that all heresiarchs are antichrists and teach, under the name of Christ, the things that are contrary to Christ. Nor is it any wonder if we see some led astray by them, since the Lord said: and they will lead many astray.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
