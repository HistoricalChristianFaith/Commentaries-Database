[[commentary]]
quote='''
But what he commands: Say to your brothers (Matt 28:10), is not to be taken simply; otherwise many call others brothers and do not keep love in their heart, of whom the Apostle writes: They profess that they know God, but in their works they deny him (Titus 1:16). Of these the Lord too was speaking: Not everyone who says to me: Lord, Lord, shall enter the kingdom of heaven: but he who does the will of my Father who is in heaven (Matt 7:21). And so that sentence can stand: No one says, Lord Jesus, except in the Holy Spirit (1 Cor 12:3). For though the heretics say Lord Jesus, and many in the resurrection will say: Lord, did we not prophesy in your name, and do many mighty works (Matt 7:22)? the Lord will answer them: Depart from me, I do not know you, workers of iniquity. Therefore saying is proved not by speech, which is easy, but by disposition and works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
