[[commentary]]
quote='''
We are just when we acknowledge that we are sinners, and our justice depends not on our personal merit but rather on the mercy of God, as holy Scripture says: "The just is an accuser of himself in the beginning of his plea." And in another place, "State your sins, that you may be justified."
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.13"

[[commentary]]
quote='''
Put me, then, in remembrance: if you have anything righteous to answer me, I will gladly receive it, that we may be judged together, and you may convict me of not having done for you what I ought to have done. This sense we read more fully in Micah: My people, what have I done to you, and in what have I troubled you? Answer me: for I brought you up out of the land of Egypt, and freed you from the house of bondage, and sent before your face Moses and Aaron and Miriam. And in the fiftieth Psalm David says to God: That you may be justified in your words, and may prevail when you are judged (Ps 50 [51]:5). Tell, then, if you have anything, that you may be justified. And the sense is: I will not speak first against you, lest you say you have been overwhelmed by a multitude of words; but if you have anything righteous, speak for yourself, so that you may be seen to endure undeservedly the things you suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
According to the Seventy, who added on their own, Tell your iniquities first, that you may be justified, God calls them to repentance, so that they may understand their crimes and sins and obtain pardon. For it is written also in another place: The righteous man is his own accuser at the beginning of his speech (Prov 18:17).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
