[[commentary]]
quote='''
Now Paul uses this very same saying to the Corinthians as well, where he commanded that the man who had his father's wife should be taken away from their midst and handed over to penance, for the destruction and affliction of the flesh through fasts and sicknesses, so that the spirit might be saved in the day of the Lord Jesus Christ. For he says: "Your glorying is not good. Do you not know that a little leaven corrupts the whole mass" (1 Cor. 5:5, 6 ff.)? or (as we have already corrected it) leavens the whole lump? And at once he added: "Purge out the old leaven, that you may be a new lump, as you are unleavened; for Christ our pasch has been sacrificed. Therefore let us feast, not in the old leaven, nor in the leaven of malice and wickedness, but in the unleavened bread of sincerity and truth."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
