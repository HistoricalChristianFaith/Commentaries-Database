[[commentary]]
quote='''
These mockers, when their king lay in wait for them and was leading them away from their God, offered him their heart like an oven, for him to kindle them and make them burn with the flames of idolatry. For he assented to the people for this reason: because he understood that they had turned to error with their whole mind. And what follows: All night he slept baking them; in the morning he himself was kindled like a fire of flame, signifies this: after he sent fire into the oven of their heart, and saw them raging, and that there was no one to resist his will, he slept all night, that is, he was secure; he kept himself in darkness while they were being baked and were making the bread of impiety. Hence afterwards he rose in the morning, and showed the flame of his crimes in open madness, so that they passed over, no longer by stealth but shamelessly, from the worship of God to the ceremonies of idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
