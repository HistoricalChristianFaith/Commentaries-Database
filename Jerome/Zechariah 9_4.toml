[[commentary]]
quote='''
And so the Lord shall possess both Tyre and Sidon, when he has first struck their strength in the most salt and most bitter sea of this world; and, lest anything of their former wisdom remain in them, that is, of the swollen folly through which they procured for themselves feeble fortifications, and silver and gold like mud, he will smelt them with fire and cleanse them to purity; of which the Savior speaks in the Gospel: I came to cast fire upon the earth, and how I wish that it were kindled, according to what is written in Mark: Everyone shall be salted with fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
