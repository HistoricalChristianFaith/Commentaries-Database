[[commentary]]
quote='''
Those who think that souls were in the heavenly places and were cast down from a better state into a worse use this and testimonies of this kind, namely that it would have been better to dwell in the heavenly places than to dwell in the earthly ones and take on the body of humiliation, seeking certain new, nay rather already old, arguments for their heresy. We, however, reading that saying of blessed Job: cursed be the day on which I was born, and that night in which they said: behold, a male, and: cursed be the person who brought the news to my father, saying: a boy is born to you, fit them to this testimony, namely that it is better not to be than to live in torments, according to what is written: death is rest to a man for whom God has shut his way, and again: why is light given to the wretched, and life to those who are in bitterness of soul? And in the Gospel we read it said simply: it would have been better for him if he had not been born, not that one who has not been born exists, but that it is better not to be than to exist wretchedly; for it is one thing not to be at all, another, while one exists, to be tormented without any intermission, just as we prefer a quiet death to a miserable life. Hence Amos too calls the day a day of darkness, a day of affliction; and Jacob, because he lived in toil and distress, calls the days of his life few and evil; and the apostle Paul says: that he might rescue us from the present evil age, and again: redeeming the time, because the days are evil. The Hebrews reckon the fifth month, in which Jerusalem was taken and the temple overthrown, as that of Jeremiah's birth, by certain inextricable and incredible arguments. But if they were able to prove this, how they could interpret the testimony of Job I do not know; unless perhaps they claim that that day too, by a certain prefiguration and prophecy of things to come, belonged to the overthrow of the temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
