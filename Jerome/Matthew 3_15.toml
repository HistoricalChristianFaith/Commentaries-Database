[[commentary]]
quote='''
Beautifully said is that now, to show that as Christ was baptized with water by John, so John must be baptized by Christ with the Spirit. Or, suffer now that I who have taken the form of a servant should fulfil all that low estate; otherwise know that in the day of judgment thou must be baptized with my baptism. Or, the Lord says, 'Suffer this now; I have also another baptism wherewithal I must be baptized; thou baptizest Me with water, that I may baptize thee for Me with thy own blood.'

Righteousness; but he adds neither 'of the Law;' nor 'of nature,' that we may understand it of both.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Allow it now. He said now beautifully, to show that Christ was to be baptized in water, John by Christ in the Spirit; or else, otherwise, allow it now, so that I who have taken up the form of a servant may fulfill its humility too. Otherwise know that on the day of judgment you are to be baptized with my baptism. Allow it now, says the Lord; I have also another baptism with which I am to be baptized; you baptize me in water so that I may baptize you, for my sake, in your own blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
For thus it befits us to fulfill all justice. He did not add the justice of the law or of nature, so that we may understand both; and if God received baptism from a man, let no one disdain to receive it from a fellow servant.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
