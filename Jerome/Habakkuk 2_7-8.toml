[[commentary]]
quote='''
Will not the Medes and Persians suddenly rise up, who, destroying the empire of the Babylonians, will bite him first and afterwards tear him; and will not Nebuchadnezzar become a plunder for them, and the ravager of the whole world be despoiled by the remaining peoples, who were able to escape his hand and his cruelty? But this will happen to him because of the blood of man, that is, of Judah, and the iniquity of the land, namely of Israel, and of the city, doubtless Jerusalem, and of all who dwell in it, signifying the people in general.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
