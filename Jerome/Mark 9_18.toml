[[commentary]]
quote='''
But as to his saying: I brought him to your disciples, and they could not cure him, he covertly accuses the apostles, although the impossibility of curing is sometimes to be referred not to the weakness of those who cure but to the faith of those who are to be cured, as the Lord says: Be it done to you according to your faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
