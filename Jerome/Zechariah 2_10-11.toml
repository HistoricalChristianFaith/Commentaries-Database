[[commentary]]
quote='''
But who this people is that is comforted through the Apostles and churchmen, not Israel and Jacob and Judah, as Scripture records in other places, but the people of God, the prophet Zechariah testifies, saying: Rejoice and be glad, daughter of Zion: for I will come and dwell in the midst of you, says the Lord. And many nations shall flee to the Lord in that day, and shall be his people, and they shall dwell in the midst of you, and they shall know that the Lord almighty has sent me to you (Zech 2:10, 11). By this testimony it is clearly shown that very many nations are to be turned into the people of God. And these things the Lord says, sent by the Lord whose name is Almighty.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
