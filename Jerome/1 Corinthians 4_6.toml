[[commentary]]
quote='''
And he says these things, not because the prophet himself thinks so, as I have testified above, but because he expresses human impatience in his own person; just as we often see the Apostle take upon himself the various opinions of men, and now say: But I see another law in my members, fighting against the law of my mind, and taking me captive in the law of sin, which is in my members. And, as though he were a beginner: Brothers, I do not consider that I have laid hold of it, and: We know in part, and we prophesy in part. And again, as though he were perfect: As many, therefore, as are perfect, let us be of this mind, when surely it does not belong to one and the same man to say that he knows in part and that he is perfect. And lest perhaps you think that this is not the Apostle's custom but our own argument, he himself says to the Corinthians: But these things, brothers, I have transferred to myself and Apollos for your sakes, that you may learn in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
