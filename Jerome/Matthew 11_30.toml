[[commentary]]
quote='''
And how is the Gospel lighter than the Law, seeing in the Law murder and adultery, but under the Gospel anger and concupiscence also, are punished? Because by the Law many things are commanded which the Apostle fully teaches us cannot be fulfilled; by the Law works are required, by the Gospel the will is sought for, which even if it goes not into act, yet does not lose its reward. The Gospel commands what we can do, as that we lust not; this is in our own power; the Law punishes not the will but the act, as adultery. Suppose a virgin to have been violated in time of persecution; as here was not the will she is held as a virgin under the Gospel; under the Law she is cast out as defiled.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For my yoke is sweet and my burden light. How is the Gospel lighter than the law, when in the law murder, in the Gospel anger is condemned? On what reckoning is the grace of the Gospel easier, when in the law adultery, in the Gospel desire is punished? In the law there are many precepts which the Apostle teaches most fully cannot be fulfilled. In the law works are required, and whoever has done them shall live in them; in the Gospel the will is sought, which, even if it has not had its effect, still does not lose its reward. The Gospel commands what we are able to do, namely that we should not desire: this is within our choice; the law, while it does not punish the will, punishes the effect, that you should not commit adultery. Imagine some virgin prostituted in a persecution. Under the Gospel, because she does not sin in will, she is received as a virgin; in the law she is rejected as defiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
