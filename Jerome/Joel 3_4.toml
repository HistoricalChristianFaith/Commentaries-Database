[[commentary]]
quote='''
But what are you to me, Tyre and Sidon, and all the border of the Philistines? Will you render vengeance to me? And if you avenge yourselves against me, quickly, swiftly I will return your recompense upon your head. For you have taken my silver and my gold, and my desirable things, and the most beautiful you have carried into your shrines; and the sons of Judah and the sons of Jerusalem you have sold to the sons of the Greeks, that you might remove them far from their borders. LXX: What have I to do with you, Tyre and Sidon and all Galilee of the foreigners? Are you rendering me retribution, or do you keep anger in your heart against me? — for this is what μνησικακείτε means in Greek —. Swiftly and quickly I will return your retribution upon your heads, because you have taken my silver and my gold, and my choice and best things you have carried into your temples, and the sons of Judah and the sons of Jerusalem you have sold to the sons of the Greeks, that you might cast them out of their borders. And these things too the Jews think are said against Tyre and Sidon and the borders of the Philistines, or Galilee of the foreigners, because at the time of the Jewish captivity, when they were conquered by the Romans, these persecuted the people of God; nay rather, in the people of God, God himself, who was set over the people, according to what is written: He who receives you receives me. Therefore, conversely, he who persecutes the people of God persecutes God himself, whose people it is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
For Galilee, in the Hebrew is written Galiloth, which Aquila translated Θῖνας, Symmachus borders; and Θῖνας, that is, mounds of sand, let us refer to the shores of Palestine, not to a Galilee of the Philistines, which does not exist at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
