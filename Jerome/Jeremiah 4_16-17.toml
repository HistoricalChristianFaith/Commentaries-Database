[[commentary]]
quote='''
Say to the nations: behold, it has been heard in Jerusalem that guards are coming from a distant land; and they have given their voice over the cities of Judah; like guards of fields they have become over her round about, because she has provoked me to anger, says the Lord. He wants all the nations round about to know the sentence of God, and all to receive correction from the scourging of Jerusalem. 'It is told,' he says, 'by common report in Jerusalem that adversaries are coming from a distant land, and that the roar of a howling army is rising against her, who besiege the city so diligently and shut in the city with siegeworks, that you would think them not so much adversaries as guards of fields and vineyards. But all this has come about not by the strength of the enemies, but by the fault of Jerusalem, because she provoked God to anger'. For if the adverse powers have no power over swine, how much more is this true of men, and of men once of the city of God!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
