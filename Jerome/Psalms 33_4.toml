[[commentary]]
quote='''
Therefore, then, because your thoughts have been made exceedingly deep, and his works, which neither human sense nor reason can attain, in another place it is said, "All your works are in faith." See what he says, "Your works are in faith." If the creature stands firm in faith and not in reason, how much more the Creator himself and the Founder of all things? When therefore it is said, "And all your works are in faith," I too, who am speaking, am in faith — since indeed I am a part of his works. I too stand firm in faith and not in reason: for I cannot know by reason how I move my steps, how the tongue makes its sound, how thought arranges itself, the will commands, and the body serves the will, how the soul, which is immortal, is joined to this body which is mortal, how my soul runs to and fro here and there, and that vast breadth of the world does not contain a thing which is comprehended by the body.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_069.html'
source_title="Homily 69, on Psalm 91 (Alternate Series)"
