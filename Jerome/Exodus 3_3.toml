[[commentary]]
quote='''
And Moses says: 'Passing over, I will see this great vision.' Unless he passes over, that is, all the faults, he cannot see the great vision. Now the vision was great, because the bush was burning, and was not consumed: the thorns were burning, that is, the sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
