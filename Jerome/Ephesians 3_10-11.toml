[[commentary]]
quote='''
That the manifold wisdom of God might now be made known to the principalities and powers in the heavenly places through the Church, according to the purpose of the ages, which he made in Christ Jesus our Lord.

According to the gift of the grace of God which was given to the Apostle, that he should preach the unsearchable riches of Christ and teach among the Gentiles the mystery which had been unknown from the ages, for this reason that very mystery was revealed to him: that not only to the Gentiles, but also to the principalities and powers, the manifold wisdom of God might be made manifest through the Church, which, destined long ago according to the purpose of the ancient ages, is now seen to be accomplished in Christ. But if the manifold wisdom of God, which has now been revealed to them through the Church, was unknown to the principalities and powers in the heavens, which we ought to take as holy and as ministers of God (although some interpret them as the prince of this air and his angels), how much more was it unknown to the patriarchs and prophets, who, as we showed above, were not ignorant of the mystery of Christ, but did not know it as the apostles did? For the manifold (multiplex) wisdom of God, which in the Greek language is called πολυποίκιλος, and, so to speak, multifarious, has now been revealed through the Church of God to the principalities and powers as well. God had long ago decreed in his mind that it should come to be, and from what we see we recognize that it is now perfected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
