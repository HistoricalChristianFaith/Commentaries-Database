[[commentary]]
quote='''
And the word of the Lord of hosts came, saying: Thus says the Lord of hosts: I have been jealous for Zion with a great jealousy, and with great indignation I have been jealous for her. Thus says the Lord of hosts: I have returned to Zion, and I will dwell in the midst of Jerusalem; and Jerusalem shall be called the city of truth, and the mountain of the Lord of hosts, the sanctified mountain. LXX: And the word of the Lord Almighty came, saying: Thus says the Lord Almighty: I have been jealous for Jerusalem and Zion with a great jealousy, and with very great fury I have been jealous for her. Thus says the Lord Almighty: I will return to Zion, and I will dwell in the midst of Jerusalem; and Jerusalem shall be called the true city, and the mountain of the Lord Almighty, the holy mountain. That the Lord took Jerusalem, that is, the Israelite people, in the wilderness as a wife, and, as she lay in the blood of idolatry, covered her with his cloak and cherished her with a husband's love, we learn more fully in Ezekiel; and she afterward, eating fine flour and honey and oil, adorned with the most beautiful garments, and having from her husband's bounty every ornament of gems, committed fornication with the Assyrians and Chaldeans; and she heard from the Lord: As a wife despises her husband, so the house of Israel has despised me. But handed over to captivity and mocked by her lovers, and stripped of her former beauty, after she had spread her feet to every passer-by and was defiled to the crown of her head, mindful of her former happiness she says again and again: I will return to my former husband, for it was better with me then than now. And he, receiving her and having her again in marriage, he who had said to her before: I will not be angry with you, and my jealousy has departed from you, now says: I have been jealous for Zion with a great jealousy, and with great indignation I have been jealous for her. As much as I was indignant before, because she was disfigured by many lovers and stained my bed, for which reason I also handed her over to her lovers, not at all as an adulteress under a husband, but as a harlot and a vile slave, prostituted in brothels, so much the more have I now returned to her, because she has done repentance and has built my temple, in which I will dwell in the midst of her. And she shall be called the city of truth, she who before was called the city of falsehood, of which it is also written in Isaiah: Truth slept in her, but now murderers. And the mountain of the Lord Almighty shall also be called the sanctified mountain, on which, the temple being restored, victims are sacrificed and the order of the ceremonies is kept. These things according to the history. But no one doubts that Zion and Jerusalem, watchtower and vision of peace, can be taken as the souls of the faithful, whom, when they have sinned, the Lord in anger hands over to captivity, so that those who had not perceived God through good and prosperous things may perceive him through evil and adverse ones. And when they have done repentance, the Lord will return to Zion, and dwells in the midst of Jerusalem, which we understand to be one and the same city; and in those in whom the falsehoods of sins and vices formerly reigned, Christ, the truth, will afterward abide. And the mountain of the Lord of hosts shall be called the holy mountain, of which it is said: Those who trust in the Lord are like Mount Zion, and: Great is the Lord and exceedingly to be praised, in the city of our God, on his holy mountain. Of which Isaiah and Micah cry aloud: In the last of days the mountain of the house of the Lord shall be prepared on the top of the mountains and lifted high above the hills; and all peoples shall flow to it, and many nations shall prosper; and they shall say: Come, let us go up to the mountain of the Lord, and to the house of the God of Jacob. Of this mountain and of this city the apostle Paul also — if indeed, in receiving the epistle, the Latin tongue does not reject the authority of the Greeks —, discoursing in a sacred speech, says: You have come to Mount Zion and the city of the living God, the heavenly Jerusalem, and many thousands of angels, and the Church of the firstborn, who are written in the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
