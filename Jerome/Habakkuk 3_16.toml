[[commentary]]
quote='''
He who is cautious and wary can avoid sins for a while, but he who is secure in his own justice opposes God, and deprived of his help, he is subject to the snares of the enemy. "Let rottenness," says Habakkuk, "enter into my bones and swarm under me, that I may rest in the day of tribulation, that I may go up to my people that are girded." He prays earnestly for tribulations and trials and affliction of soul so that, in the next world, he may join the company of those who are already reigning with Christ. It is clear from all this that here, in this life, there is strife and contention, and, in the next world, there is victory.
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="Against the Pelagians 2.24"

[[commentary]]
quote='''
But as for what follows: I heard, and my belly was troubled; at the voice — so that 'your' is understood —, my lips trembled, let rottenness enter into my bones, and swarm beneath me, that I may rest in the day of tribulation, that I may go up to our girded people, this is the sense: Now we all gladly suffer distresses, and at your threatening we tremble with all our inward parts. Now my lips tremble, and the dread of a fearful mind is stamped upon my mouth; and not only this, but of my own accord I also seek and of my own accord I desire something more. Let rottenness enter into my bones, and swarm beneath me, that is, I gladly suffer what Job suffered: I long that not only my flesh but the marrow of my bones too should waste away, and that my bed should swarm with the rottenness of my body and with countless worms, so that after I have endured these things here for my sins, I may rest in the bitter day, in the day of tribulation, in the day of necessity and distress. And I shall go up to our girded people, that is, strong, warlike and combative. And beautifully, I shall go up: for one always goes up to a girded people. And elegantly, our: for he who has been afflicted, and has gladly endured pressures, and has set future rewards against present evils, boldly says our, so that, like Abraham, Isaac and Jacob, he too may sleep in a good old age, full of days, and be gathered to his fathers. But if anyone should say: Look, in expounding the history you have, without knowing it, been shut up in the nets of allegory, and you have mixed tropology with the history, let him hear that a metaphor in the history does not always amount to allegory, because the history itself is frequently woven metaphorically, and under the image of a woman or of one man something is proclaimed about a whole people. And now therefore we can say in the person of the people: I gladly undergo captivity, I endure distresses with an even mind, and I am pressed by the most heavy yoke of the Babylonians; and whatever belongs to the last and harsh necessity I shall suffer rejoicing, provided only that I may rest at the time when you will curse the scepters of the wicked one, and your horses will trample the mud of many waters, so that afterward, with your holy ones Zerubbabel and Joshua son of Jehozadak, and Ezra the priest, and Nehemiah, I may return to the land of promise. Up to this point, so that we might not seem to pass over the history altogether, we have in some measure done violence to the understanding, and we dragged into the captivity sentences that do not follow; now let us return to the Seventy translators and to the tropological exposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: I kept watch, and my belly was afraid at the voice of the prayer of my lips; and trembling entered into my bones, and beneath me my strength was troubled. Or, as we find written elsewhere, ἡ ἕξις μου, which we can call my condition; for differing copies are found. These things can also be said in the person of the prophet, cohering with what precedes: Because you, O Lord, sent death upon the heads of the wicked, and raised up bonds up to the neck, and divided in amazement the heads of the mighty, and brought into the sea your horses troubling many waters, therefore I have kept my heart with all watchfulness, and my inward parts trembled, and my whole strength, or condition, was troubled, lest I should suffer the like. It can also have, as it were, its own beginning, the prophet relating his fear, and how he dreaded lest he had sinned in anything, and, admonished at the voice of the prayer of his lips, feared God so much that trembling entered into his bones, and, placed under the lofty hand of the Lord, he was troubled in all the strength, or condition, of his soul. But what he says: Trembling entered into my bones, is to be taken ἐμφατικώτερον (more emphatically), so that we may see the greatness of the fear of God penetrating the whole of the soul and moving the whole man, lest he should do anything that would displease God. And since Scripture allegorically, following the members of the body, mentions members of the soul as well, let us take the fearful belly as that power of the soul which receives spiritual food, and the lips as those by which the mind speaks with itself, and the bones as the robust and solid doctrines by which the whole framework of the soul is made firm. These things have been said by me briefly. But if anyone has found things shrewder and truer than these, give your assent rather to his explanation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: I shall rest in the day of tribulation, that I may go up to the people of my sojourning. Because I have kept my heart with all watchfulness, and my belly was afraid at the voice of the prayer of my lips, and trembling entered into my bones, and beneath me my strength or condition was troubled, and through so great a watchfulness I have been made a stranger to sins, therefore I now say confidently: I shall rest in the day of tribulation, that I may go up to the people of my sojourning, that is, the people which, just as I, has sojourned as a stranger in this world. And I shall go up, placed below as I am, and, as if striving from the valley toward higher places, I shall press on with all eagerness, so that at the time when the rest are in tribulation and distress, my care may be for the ascent, how I may rest with the people of my sojourning in the higher places. Now the day of tribulation I think is the consummation of the world, of which Isaiah also says: The day of the Lord is incurable, of fury and wrath, to make the whole world a desert, and to destroy sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
