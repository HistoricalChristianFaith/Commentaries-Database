[[commentary]]
quote='''
The principle therefore of the soul is not according to Plato in the brain, but according to Christ in the heart, and by this passage we may refute those who think that evil thoughts are suggestions of the Devil, and do not spring from our proper will. The Devil may encourage and abet evil thoughts, but not originate them. And if he be able, being always on the watch, to blow into flame any small spark of thought in us, we should not thence conclude that he searches the hidden places of the heart, but that from our manner and motions he judges of what is passing within us. For instance, if he see us direct frequent looks towards a fair woman, he understands that our heart is wounded through the eye.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For out of the heart come evil thoughts, murders, adulteries, fornications, and the rest. Out of the heart, he says, come evil thoughts. Therefore the ruling part of the soul is not, as Plato holds, in the brain, but, as Christ teaches, in the heart; and this saying refutes those who think that thoughts are sent in by the devil and do not arise from one's own will. The devil can be a helper and an inciter of evil thoughts; their author he cannot be; but if, ever lying in ambush, he has fanned the slight spark of our thoughts into flame with his kindling. We ought not to suppose that he also searches out the hidden things of the heart, but rather that he judges from the bearing and gestures of the body what we are turning over within: for example, if he has seen us often looking back at a beautiful woman, he understands that the heart has been wounded by the dart of love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
