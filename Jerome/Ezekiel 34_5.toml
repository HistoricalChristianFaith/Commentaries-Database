[[commentary]]
quote='''
And the people of God was scattered, either by vices or by heretical error, because there was no good shepherd who would lay down his life for the sheep, but all were hirelings, who consider only the profits from the flocks and flee when they see the wolf; through whose negligence the Lord's flock is devoured by the beasts of the field — of which it is written: You set darkness, and night came: in it all the beasts of the field will pass through, the lions' whelps roaring, to seize and to seek their food from God —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
