[[commentary]]
quote='''
These are the windows of which Jeremiah also says: Death has entered through our windows; for the enemies desire to enter through all our senses, and to take the city of a good conscience, and to run about through our fortifications, and to destroy the houses which we have built for ourselves by good works. And they do all things entering through the windows like a thief, for they do not enter openly, that they may shoot in the dark at the upright of heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
For Jeremiah says: 'Death has entered through your windows.' Now we have five windows: that is, sight, hearing, taste, smell, and touch. If therefore I have looked at a woman to lust after her, I have already committed adultery with her in my heart; and death has entered through my window, that is, through sight. If the lyre or the organ or the reed-pipe as it were dissolves me, death has entered through my hearing. But if I touch something soft, and am unstrung by the softness of the body, death has entered through my touch, and the rest likewise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
