[[commentary]]
quote='''
Thus says the Lord: Behold, I will turn back the turning of the tents of Jacob, and on the dwellings — or captivity — of them I will have mercy, and the city shall be built on its height, and the temple shall be founded according to its order. And from them shall go forth praise and the voice of those playing, and I will multiply them and they shall not be diminished; and what follows: and I will glorify them and I will not make them few, is not found in the Seventy. And his sons, he says, shall be as from the beginning, and his assembly shall abide before me, and I will visit against all who afflict him. And his leader shall be from himself, and a prince shall be brought forth from his midst, and I will draw him close and he shall approach me; for who is this who draws his heart close so as to come near to me?, says the Lord; and again, what follows in the Hebrew is not found in the Greek: and you shall be, he says, my people, and I will be your God. A type of these things went before in Zerubbabel and Ezra, when the people returned and the city began to be built on its height and the worship of the temple to be observed, and the other things which are contained in the book of Ezra himself; but it was fulfilled more fully and more perfectly in the Lord and Savior and the apostles, when there was built the city on its height — of which it is written: a city that is set on a mountain cannot be hidden — and the temple according to its order and ceremonies was founded, so that whatever was done carnally among the former people might be fulfilled spiritually in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
