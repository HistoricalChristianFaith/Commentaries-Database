[[commentary]]
quote='''
He answered and said: He who sows the good seed is the Son of Man. He has plainly explained that the field is the world, the sower the Son of Man, the good seed the sons of the kingdom, the darnel the sons of the most wicked one, the sower of the darnel the devil, the harvest the consummation of the world, the reapers the angels; all stumbling blocks are referred to the darnel, the just are reckoned among the sons of the kingdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
