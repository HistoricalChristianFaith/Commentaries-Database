[[commentary]]
quote='''
Why do you say, Jacob, and speak, Israel: My way is hidden from the Lord, and my judgment will pass away from my God ? Do you not know, or have you not heard? The everlasting God, the Lord who created the ends of the earth, will not fail, nor will he labor, nor is there any searching out of his wisdom. He gives strength to the weary, and to those who have no might he multiplies strength. Boys will fail and will labor, and young men will fall in weakness. But those who hope in the Lord will change their strength, they will take on wings like the eagle, they will run and not labor, they will walk and not fail. LXX: For do not say, Jacob, and why have you spoken, Israel: My way is hidden from God, and my God has taken away my judgment and has departed? And now do you not know, and have you not heard? The eternal God, the God who created the ends of the earth, will not hunger, nor will he labor, nor is there any finding out of his understanding. He gives strength to the hungry, and sorrow to those who do not grieve. For young men will hunger, and youths will labor, and the chosen will be weak. But those who wait for God will change their strength. They will take on wings like eagles; they will run and not labor; they will go on and not hunger. Since the greatness of Almighty God is so great that nothing escapes him, and all things are governed by his will, why do you say, Jacob, that is, the two tribes which were called Judah, and speak, Israel, the other ten tribes in Samaria, you who have already been led captive to the Assyrians: My way is hidden from the Lord, and my judgment will pass away from my God? And the sense is: You say, earthly things do not concern God, nor does he consider what each one of us does; hence we too are unjustly oppressed by our enemies, and, according to Habakkuk, we are destroyed like beasts and fishes, without any ruler (Hab 1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
