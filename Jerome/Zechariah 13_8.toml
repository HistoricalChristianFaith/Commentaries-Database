[[commentary]]
quote='''
And two parts were made in all the land, of the Jews and of the Gentiles, who perished alike and failed. For at his passion the voice of the psalmist was fulfilled, saying: Save me, O Lord, for the holy one has failed, and: All have turned aside, together they have become useless; there is none who does good, there is not even one. As the Gentiles and the Jews were perishing, a third part in the world, that is, the third people, of Christians, suddenly sprang up. And he says beautifully: The third part shall be left in it, that is, in the land, because of the Jews and the Gentiles those alone who confessed the Lord were kept for life and for dwelling in the land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
