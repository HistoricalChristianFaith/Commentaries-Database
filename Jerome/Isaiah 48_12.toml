[[commentary]]
quote='''
Hear me, Jacob, and Israel, whom I call. I myself, I am the first, and I am the last. My hand also founded the earth, and my right hand measured the heavens: I called them, and they will stand together. Gather together, all of you, and hear: who among them has declared these things? The Lord has loved him: he will do his will in Babylon, and his arm upon the Chaldeans. I, I have spoken and called him: I have brought him, and his way is made straight. Draw near to me, and hear these things: not from the beginning have I spoken in secret: from the time before it came to be, there I was. And now the Lord God has sent me, and his spirit. LXX: Hear me, Jacob and Israel, whom I call. I am the first, and I am for ever: and my hand founded the earth, and my right hand made firm the heaven. I will call them, and they will stand together: and all will be gathered, and will hear: Who has announced these things to them? Loving you, I have done your will upon Babylon: to take away the seed of the Chaldeans. I have spoken and I have called. I have brought him and have made his way prosper. Bring them to me, and hear these things: Not from the beginning have I spoken in secret: when it was being done, there I was. And now the Lord God has sent me, and his spirit. To those to whom he had already said before: Hear these things, house of Jacob, you who are called by the name of Israel, and have come forth from the waters of Judah, he now speaks: Hear me, Jacob and Israel, whom I call. For many are called, and few chosen (Matt 22). Hence he names them not chosen, because they had not yet received the Savior; but called. I am, he says, α and ω, the first and the last, who live, and was dead (Rev 22); so that you may refer life to the first, and the last to him who died. Who emptied himself, taking the form of a servant, and became obedient to the Father; he humbled himself even to death, even the death of the cross (Phil 2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
