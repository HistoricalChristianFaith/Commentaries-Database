[[commentary]]
quote='''
Very few days have passed since, having interpreted Paul's epistle to Philemon, I had gone on to the Galatians, passing over many epistles in between, going backward; and behold, suddenly letters were brought to me from the City, announcing both that Albina, the venerable old woman, had been returned to the presence of the Lord, and that the holy Marcella, bereft of her mother's companionship, now more than ever begs for your consolation, O Paula and Eustochium. And since this cannot be done for the present, because of the great expanses of sea and land between us, I would wish at least to heal the wound so suddenly inflicted with the medicine of the Scriptures. I know, indeed, her ardor; I know her faith, what a flame she always has in her breast, how she rises above her sex, forgets the human, and, with the timbrel of the divine volumes sounding, crosses the Red Sea of this age. Certainly, when I was at Rome, she was never in such haste when she saw me that she did not ask me something about the Scriptures. Nor indeed, in the Pythagorean manner, did she think that whatever I had answered was right; nor did prejudged authority carry weight with her without reason; but she examined everything, and weighed all things with a shrewd mind, so that I felt I had not so much a disciple as a judge. Therefore, since I judge that it will be most welcome to her in her absence, and useful to you who are present, I shall undertake a work not attempted before me by the writers of our language, and taken up even by the Greeks themselves by scarcely a few, in the way the dignity of the subject demanded. Not that I am unaware that Gaius Marius Victorinus, who taught rhetoric at Rome when I was a boy, published Commentaries on the Apostle; but because he, occupied with the learning of secular letters, was wholly ignorant of the holy Scriptures; and no one, however eloquent, can discuss well what he does not know. What then, am I foolish or rash, who promise what he could not do? By no means. Rather, in this, as it seems to me, I am more cautious and more timid, in that, feeling the weakness of my powers, I have followed the Commentaries of Origen. For that man wrote five volumes properly on Paul's epistle to the Galatians, and filled the tenth book of his Stromata with a commatic discourse on its explanation; he also composed various Treatises and Excerpts, which even by themselves could suffice. I pass over Didymus, my seer, and the Laodicean (Apollinaris), who has lately gone out from the Church, and Alexander, the old heretic, and also Eusebius of Emesa and Theodore of Heraclea, who likewise left some little commentaries on this matter. If I were to pluck even a few things from these, something would result that would not be utterly despised. And so, to confess it plainly, I have read all these things, and, heaping up a great many of them in my mind, I summoned a secretary and dictated either my own thoughts or those of others, retaining a memory sometimes neither of the order, nor of the words, nor of the meanings. It now rests only with the Lord's mercy that the things others have said well should not perish through our unskillfulness, and that what pleases among its own people should not fail to please among strangers. Therefore, briefly summarizing the argument of this Epistle, I remind you by this preface, so that you may know that the subject matter of Paul's Epistle to the Galatians and of the one written to the Romans is the same. But the difference between the two is this: that in the latter he used a loftier sense and deeper arguments, while here, as though writing to those of whom he says in what follows, "O senseless Galatians", and, "So unwise are you", he tempered himself to such a style that he rebuked rather than taught, and used a style which even the foolish could understand, so as to clothe common thoughts in common speech, and so that authority might call back those whom reason could not persuade. There is indeed no discourse of the Apostle, whether by letter or in person, in which he does not labor to teach that the burdens of the ancient Law have been laid aside, and that all those things which went before in types and images, that is, the rest of the sabbath, the injury of circumcision, the recurrences of the Kalends and of the three solemn feasts in the year, the scrupulousness about foods, and the washings day after day that were to be soiled again, have ceased as the grace of the Gospel stole in, which not the blood of victims but the faith of the believing soul fulfills. But elsewhere this is discussed in part, and from the side, as this question presented itself to him while he was dealing with something else, and it is barely touched upon. In these two Epistles, however, as I have said, the cessation of the ancient law and the introduction of the new are specifically contained. But the Epistle to the Galatians has this peculiar to it, that he does not write to those who had believed in Christ from among the Jews and thought that their fathers' ceremonies ought to be observed, but to those who had received the faith of the Gospel from among the Gentiles and, having slipped back again, had been frightened off by the authority of certain men who asserted that Peter too, and James, and the whole churches of Judaea had mixed the Gospel of Christ with the old law; that Paul himself also did one thing in Judaea and preached another to the nations; and that they believed in the Crucified in vain if they thought that what the chiefs of the apostles observed should be neglected. For this reason he walks so cautiously between the two, and down the middle, that he neither betrays the grace of the Gospel, pressed by the weight and authority of his elders, nor does injury to his predecessors while he is the champion of grace; but going obliquely and as if secretly through tunnels, so as to teach that Peter did this for the sake of the people of the circumcision entrusted to him, lest, suddenly departing from their ancient way of life, they should be caused to stumble and not believe in the Cross; and that he himself, to whom the preaching to the Gentiles had been entrusted, judged it right to defend for the sake of truth what the other pretended for the sake of dispensation. Not understanding this at all, the Batanean, that wicked Porphyry, in the first book of his work against us, objected that Peter had been rebuked by Paul because he did not walk with a straight foot in preaching the gospel, wishing to brand the one with the stain of error and the other with that of insolence, and to accuse both in common of the falsehood of a fabricated doctrine, since the chiefs of the Churches disagree among themselves. These things, in what sense they were said, we touch on lightly even now at your prayers, and we will treat them more fully in their proper places. But it is now time to set down the words of the Apostle himself and to unfold each of them one by one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
Paul an apostle, not from men, nor through man, but through Jesus Christ and God the Father, who raised him from the dead.

Not out of pride, as some think, but out of necessity, he declares that he is an Apostle neither from men nor through man, but through Jesus Christ and God the Father, so that by this authority he might confound those who were bandying Paul about as being outside the twelve apostles, and were alleging that he had burst forth suddenly from I know not where, or had been ordained by those senior to him. It can also be taken as said obliquely against Peter and the rest, that the Gospel was not handed down to him by the apostles but by Jesus Christ himself, who had also chosen those apostles. All this, moreover, is prepared for this reason: that no one might be able to object to him, as he argues against the burdens of the Law on behalf of the grace of the Gospel: "But Peter said this," "But the apostles decreed this," "But your predecessors decided otherwise." This, which he now preludes as if in veiled language, he makes more plain in what follows, when he reports that nothing was conferred upon him by those who seemed to be something, and writes that he withstood Peter himself to his face, saying that he was compelled by no necessity to yield to the hypocrisy of the Jews. But if it seems rash to some that he should have spoken against the apostles, however covertly, he who went to Jerusalem for this very purpose, to confer with them about the Gospel, lest perhaps he should run or had run in vain, let us transfer the understanding to this: that to this day apostles are sent out by the patriarchs of the Jews, and by such men, I think, the Galatians were even then corrupted and began to observe the Law; or at any rate that others from among the Jews who believed in Christ went to Galatia, asserting that Peter too, the chief of the apostles, and James the brother of the Lord, kept the ceremonies of the Law. So, to distinguish between those who are sent by men and himself, who was sent by Christ, he made this his opening: Paul an apostle, not from men, nor through man. Now "apostle," that is, "sent," is properly a word of the Hebrews, and Silas also has this sound, he to whom the name "sent" was given from sending. The Hebrews say that among the prophets themselves and the holy men there are some who are both prophets and apostles, but others who are only prophets. Thus Moses, to whom it is said: "And I will send you to Pharaoh" (Exod. 3:10, 11); and who answers: "Provide another whom you may send"; and Isaiah, to whom God speaks: "Whom shall I send, and who will go to this people" (Isa. 6:8)? are both apostles and prophets. Hence we too can understand that John the Baptist also should be called both prophet and apostle, since indeed Scripture says: "There was a man sent from God, whose name was John" (John 1:6). And we can understand that in the Epistle to the Hebrews (Heb. 3) Paul, contrary to his usual custom, set at its head neither his own name nor the title of apostle for this reason, that he was going to say of Christ: "Having therefore the chief of priests and the apostle of our confession, Jesus"; and that it was not fitting that where Christ was to be called an apostle, Paul should also be set down there as an apostle. Now there are four kinds of apostles. One, which is neither from men nor through man, but through Jesus Christ and God the Father; another, which is indeed from God, but through man; a third, which is from man and not from God; a fourth, which is neither from God, nor through man, nor from man, but from oneself. Of the first kind can be Isaiah and the other prophets, and the apostle Paul himself, who was sent neither from men nor through man, but by God the Father and Christ. Of the second, Joshua the son of Nun, who was indeed appointed an apostle by God, but through a man, Moses. The third kind is when someone is ordained by the favor and zeal of men, as we now see very many put into the priesthood not by the judgment of God but by the purchased favor of the crowd. The fourth is that of the false prophets and false apostles, of whom the apostle says: "Such men", he says, "false apostles, workers of iniquity, transforming themselves into apostles of Christ, who say: Thus says the Lord; and the Lord has not sent them" (2 Cor. 11:13). But the apostle Paul is not such a one, he who was sent neither from men nor through man, but from God the Father through Jesus Christ. From this it is proved that the heresy of Ebion and Photinus is to be beaten back from this place too, because our Lord Jesus Christ is God: since the Apostle, because he was sent by Christ to preach the Gospel, denies that he was sent by a man. At this place the other heresies creep in, which, claiming for Christ a putative flesh, say that Christ is God and not man; and also the new heresy, which asserts a halved dispensation of Christ. And so the faith of the Church is set amid such great shipwrecks of false doctrines: if it confesses Christ to be man, Ebion and Photinus creep in; if it contends that he is God, Manichaeus and Marcion, the author of a novel doctrine, bubble up. Let them therefore hear in common that Christ is both God and man: not that God is one and man another, but that he who was always God deigned to become man for our salvation. It should also be known that in Marcion's Apostle the words and through God the Father are not written, since he wished to explain that Christ was raised not by God the Father but by himself, as in that saying: "Destroy this temple, and in three days I will raise it up" (John 2:19); and also elsewhere: "No one takes my soul from me; but I lay it down of myself. I have power to lay it down, and again I have power to take it up" (ibid., 10:18).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
