[[commentary]]
quote='''
If you play the harlot, Israel, let Judah at least not sin; and do not go into Gilgal; and do not go up to Beth-aven, nor swear: The Lord lives; for like a wanton cow Israel has turned aside. Now the Lord feeds them like a lamb in a broad place. LXX: But you, Israel, do not be ignorant, and Judah, do not go into Gilgal, do not go up to the house of ὢν, and do not swear: The Lord lives; for like a cow stung by the gadfly Israel has gone mad. Now the Lord feeds them like a lamb in a spacious place. For 'house of ὢν', in certain copies, and especially in Theodotion, 'house of iniquity' is read, which Aquila and Symmachus translated 'house of ἀνωφελοῦς', that is, useless, which profits nothing and by another word is called an idol. Now it is Bethel, which formerly was called house of God; after the calves were set up in it, it was called Beth-aven, that is, house of uselessness and house of the idol, which we have expressed as it is read in the Hebrew. But it seems to me that the reason why both the people of Israel in the wilderness made for themselves the head of a calf to worship, and Jeroboam son of Nebat fashioned golden calves, was this: that what they had learned in Egypt, that ἄπιν (Apis) and μνεῦιν (Mnevis), who are worshipped under the figure of oxen, are gods, they might keep in their own superstition. Let us state the sense of the section: If once, O Israel, you have been deceived by error and have mingled yourself with harlots, so that whoever filled the hand, either his own or the king's, by offering and giving him gifts, became a priest of the high places; at least you, Judah, who possess Jerusalem, and have Levites according to the law, and perform the ceremonies of the temple, ought not to follow the examples of your former sister Oholah in fornication, and worship idols along with God. Do not go into Gilgal, of which we read in this same prophet: All their wickedness is in Gilgal; in which Saul was anointed king; in which the people, coming out of the desert, first encamped and were purified by the second circumcision. From that time the error of a contrary religion grew up in a celebrated place. And do not go up to Beth-aven, that is, the place which was once called Bethel, because after golden calves were set up there by Jeroboam son of Nebat, it is called not House of God but house of the idol. For which I wonder why the Seventy translated 'house of ὢν', unless perhaps, by a common error, in place of the letter iod in the middle, which is flanked on either side by the letters aleph and nun, they supposed uau, which differs only in size. Nor swear: The Lord lives. For I do not want mention of my name to be made by your mouth, which is polluted by the remembrance of idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
