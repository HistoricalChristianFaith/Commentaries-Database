[[commentary]]
quote='''
Since, therefore, so great an abundance of all things is to come, O Ephraim, everyone who repents and who has begun to be mine, put away idols, despise images; for I am he who humbled you, and I will exalt you; or, I will hear and direct, and I will make him like a green fir tree, so that of him it may be said in the psalm, according to the Hebrews: The fir tree is its house. Or at least, I will be like a dense juniper, so that he may rest under my shade. Of ἀρκεύθοις, that is, of junipers, according to the Seventy translators, Solomon is recorded to have made the doors of the temple, because Christ, through whom we come to the Father, has this nature, that he always flowers, always bears new fruits, and never lays aside his greenness. This juniper, for those who rest under its shade, so that they may not be struck by the burning of this world and the heat may not strike their head, as it once struck Jonah's too, gives fruits, and provides not only rest to those who sleep and sit, but also fullness to those who eat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
