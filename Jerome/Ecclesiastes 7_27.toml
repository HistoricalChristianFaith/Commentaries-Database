[[commentary]]
quote='''
Behold, this I have found, says Ecclesiastes, one (feminine) to one, that I might find the number, which my soul has still sought, and I have not found. One man out of a thousand I have found, and a woman among all these I have not found. Only this have I found, that God made man upright; and they themselves have sought many thoughts. This, he says, I discovered, sifting all things diligently: that by sinning little by little, and adding one offense to another, we make for ourselves a great sum of sins. For Esebon, which all with one voice translated λογισμὸν, we can, by the ambiguity of the Hebrew speech, call number, and sum, and reckoning, and thought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"

[[commentary]]
quote='''
But for what we said above, translating the Hebrew speech: One (feminine) to one, that the number may be found, or reckoning, or thought, Symmachus rendered more plainly: To find the reckoning one to one. For what we are used to saying absolutely and in the neuter, that is, this I have sought, this I wished to find, the Hebrews pronounce in the feminine, as also in the psalm: One thing (unam) I have asked of the Lord, this I will seek after, for unum.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
