[[commentary]]
quote='''
Seek good and not evil, that you may live, and the Lord God of hosts will be with you, as you have said: Hate evil and love good, and establish judgment in the gates, if perhaps the Lord God of hosts may have mercy on the remnant of Joseph. LXX: Seek good and not evil, that you may live; and so the Lord God Almighty will be with you, as you have said: We have hated evil things and loved good things; and render judgment in the gates, that the Lord God may have mercy on those who are left of Joseph. You say that God is with you because you are sons of Abraham; hear what follows: If you are sons of Abraham, do the works of your father. What are the works of your father Abraham? Love good and not evil. It is a great sin not only to do evil but also to love it. Many sin, and when the heat of pleasure is spent they are stung by their conscience, and they repent of their sin. But he who not only does not grieve that he has done what is evil, but even glories in his crime, fulfils that which is written: The sinner, when he has come into the depth of impiety, despises. Seek therefore good and not evil. For if you seek good, in the very act of seeking good you at once repel evil. But you would never seek good unless you first repelled evil, fulfilling the words of the psalmist, who says: Turn away from evil and do good. And when you have sought good and avoided evil, then you will live in him who says: I am the life. He seeks good who believes in him who speaks in the Gospel: I am the good shepherd. He repels evil who flees from him of whom it is written: The world is set in the evil one. And in the Lord's prayer he says: Deliver us from evil. And when you have sought good, he says, and not evil, and have lived, then the Lord God of hosts will be with you, as you had said that he was with you for this reason, that you were born of Abraham.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
