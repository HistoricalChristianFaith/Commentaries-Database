[[commentary]]
quote='''
From whom the whole body, compacted and glued together through every joint of supply, according to the working in the measure of each member, makes the increase of the body unto the building up of itself in love.

At the end of things, when we have begun to see God face to face, and have arrived at the measure of the age of the fullness of Christ (of whose fullness we have now all received (John 1), so that Christ is not in us in part but wholly; and when, having left behind the beginnings of children, we have grown up into that man of whom the Prophet says: Behold a man, the Dawn is his name (Zech. 6:12). And John the Baptist mentions him (John 1:30): After me comes a man who was made before me, because he was before me), then, in the meeting of one faith and of one knowledge of the Son of God, whom we now, because of the variety of minds, do not know by one and the same faith and knowledge, the whole body, which had previously been scattered and torn in different directions, will be brought back into its own framework and joining: so that one supply and the same working, and the consummate perfection of one age, may make the whole body grow equally, and all the members may receive the increase of age according to their own measure. And this whole building up, by which the body of the Church is increased part by part, will be completed by mutual love within itself. Let us understand all rational creatures under the example of a single rational living being, and whatever we say of its members and parts, let us know that this must be referred to each rational creature. Let us suppose this living being so torn apart through its limbs, veins and flesh that neither does bone cling to bone nor sinew join to sinew: the eyes lie apart, the nostrils separately, the hands occupy one place, the feet have been flung to another, and the remaining members are in this way scattered and divided from one another. Imagine some physician of such great knowledge coming that, according to the fables of the pagans, he could imitate Aesculapius and raise Virbius into a new form and a new name: he will have to restore each member to its own place, and fit joint to joint, and, the parts being restored, make one body with a kind of glue. Thus far let one comparison carry us; now let another example be drawn into the same comparison toward what we wish to be understood. Let a little child grow and, through unnoticed time, mature to perfect age: his hands will have their own increase, his feet will feel their own growth; his belly is filled while we do not know it; his shoulders broaden while the eyes are deceived; and all the members grow part by part according to their own measure in such a way that they seem to be increased not for themselves but for the body. So therefore also in the restoration of all things, when the true physician, Christ Jesus, comes to heal the body of the whole Church, now scattered and torn, each one, according to the measure of faith and of the knowledge of the Son of God (whom one is said to recognize (agnoscere) precisely because one knew him before and afterward ceased to know him), will receive his own place and will begin to be what he had been. Yet not in such a way that, according to another heresy, all are placed in one age, that is, all are re-formed into angels; but that each member is perfected according to its own measure and office: for example, that the apostate angel begins to be what he was created, and man, who had been cast out of paradise, is restored once more to the tilling of paradise. And all these things will come about in such a way that they are joined to one another in mutual love; and while member rejoices with member, and is glad at the advancement of another, the body of Christ, the Church of the firstborn, may dwell in the heavenly Jerusalem, which in another place the Apostle calls the mother of the saints (Gal. 4). Therefore (as we said above) these things are rather obscure in our language, because they are said μεταφορικῶς (metaphorically) in the Greek. And every metaphor, if it is translated word for word from one language into another, has the sense and the shoots of its speech choked as if by certain thorns.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
