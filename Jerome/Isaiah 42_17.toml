[[commentary]]
quote='''
But while I say these things, the people of the Jews has turned back, so as not to believe him who promises, and to be confounded in its errors, and to neglect the pledge of God, having before believed in idols. Or, when the fullness of the nations has come in, then the people of Israel too will be converted (Rom 11), and will repent of its error, through which it had before served idols. Or certainly, after the calling of the nations, he returns to the beginning, so as to say that all the nations which refused to believe the Gospel are to be confounded in their idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
