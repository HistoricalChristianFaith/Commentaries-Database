[[commentary]]
quote='''
'But in hell, who shall give thanks to the Lord?' For there is no one who can do penance in hell. While you are in this world, I urge you to do penance. Give thanks, therefore, to the Lord, because it is only in this world that he is merciful. Here he can have mercy on the penitent: for there he is a judge, he is not merciful. Here he is merciful, there he is a judge. Here he stretches out his hand to the one who falls: there he sits as judge. And I have said all this against those who say that there is penance even in hell.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_032.html'
source_title="Homily 32, on Psalm 105"
