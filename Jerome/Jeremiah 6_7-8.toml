[[commentary]]
quote='''
Iniquity and devastation will be heard in her; before me continually are sickness and wound. Be instructed, Jerusalem, lest perhaps my soul depart from you, lest perhaps I make you a desert, an uninhabitable land! LXX: Ungodliness and misery will be heard in her before her face. Through every pain and scourge you will be instructed, Jerusalem, lest perhaps my soul depart from you, lest I make you a trackless land, which is not inhabited. Through these words we learn that the Lord scourges every son whom he receives; and for that reason Jerusalem is instructed by blows and torments, that she may be corrected, and that the soul of God may not depart from her and she be reduced to a wilderness. If ever, therefore, we lie under frequent distresses, let us recall for our consolation this little verse: through every pain and scourge you will be instructed, Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
