[[commentary]]
quote='''
The Savior expounded this passage in the Gospel, saying: "If Christ is the son of David," he says, "how does David in the Spirit call him Lord?" You see, then, what he is saying. If he is David's son, how do you say it — how does David in the Spirit call him Lord? Someone may say: So then he is not the son of David? He was saying this about the Pharisees, who confessed Christ to be merely the son of David. To the Jew and to Photinus I say this very thing: If he is the son of David, how does David call his own son Lord? But the one who confesses him to be Lord and God, and the Son of God — for instance the Manichaean, who denies that he is the son of David — before that man I prove that he is the son of David. To us, then, the one who is the Son of God, he himself is also the son of David: not one son here and another son there; I do not make two persons out of God and man; but the very one who is the Son of God, he himself is also the son of David.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_036.html'
source_title="Homily 36, on Psalm 109"
