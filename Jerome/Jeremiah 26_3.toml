[[commentary]]
quote='''
And you shall say to them: Thus says the Lord God; if perhaps even they will hear, and if perhaps they will be quiet. Something similar is written in Jeremiah too: If perhaps they will hear and repent, and in the Gospel: Perhaps they will respect my son. Now God speaks these words with the disposition of one who is in doubt, so that they may show the free choice of man, lest the foreknowledge of future things make immutable, whether for evil or for good, what God knew would come to be: for it is not because he knows what is to come that we must necessarily do what he foreknew; rather, what we are going to do by our own will, he, as God, knows will come to be.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Perhaps, he says, they will hear and turn. The ambiguous word 'perhaps' cannot befit the majesty of the Lord, but he speaks according to our feeling, so that free will may be preserved for man, lest by his foreknowledge man be compelled, as if by necessity, either to do something or not to do it; for it is not because God knows that something is going to be that it is therefore going to be, but because it is going to be, God knows it, as one who foreknows things to come. And yet it must be known, according to this same Jeremiah, that if the Lord has foretold evils and the people has repented, he himself too will repent over the things which he threatened to do; and if he has promised prosperity and the people has acted negligently, God changes his sentence and brings evils instead of good things. Something of this kind is also that saying in the Gospel: I will send my son; perhaps they will reverence him; which is surely said in the person of almighty God. Finally, in the present passage too he says: 'if perhaps they will hear and turn, each one from his evil way, so that, when they have turned, I too may repent of my sentence and not do what I am thinking to do to them. But I am thinking to do it because of the wickedness of their pursuits; and if these have been changed, my sentence too will be changed.' Let us read the history of Jonah and Nineveh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
