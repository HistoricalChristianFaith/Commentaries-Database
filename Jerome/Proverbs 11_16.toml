[[commentary]]
quote='''
And since it is not customary among the Greeks, except among certain learned men, to say εὐχαριστίαν as distinct from eucharistia, that is, being gracious as distinct from giving thanks, I therefore think that the Apostle, as a Hebrew of the Hebrews, used the common word, and wished to set out his meaning by the signification of another word; especially since among the Hebrews "gracious" and "giving thanks" are expressed, as they say, by one word. Hence I think that in Proverbs too it is written thus: γυνὴ εὐχάριστος ἐγείρει ἀνδρὶ δόξαν, a grateful woman raises up glory for her husband (Prov. 11:16), in the sense of "gracious". We would seem to be doing violence to Scripture, and boldly taking a thanksgiving woman for a gracious one, did not the other editions also agree with our opinion. For Aquila and Theodotion and Symmachus put it thus: γυνὴ χάριτος, that is, a gracious woman, and not εὐχάριστος, which pertains to the giving of thanks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
