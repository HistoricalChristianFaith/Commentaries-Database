[[commentary]]
quote='''
Wretched Grunnius, who opened his mouth to slander holy men and taught his tongue a lie, translated into Latin one book of Sextus the Pythagorean, a thoroughly pagan man, and divided it into two volumes, and dared to publish it under the name of the holy martyr Xystus, bishop of the city of Rome; in these volumes there is no mention of Christ, none of the Holy Spirit, none of God the Father, none of the patriarchs and prophets and apostles; and with his usual rashness and madness he named this book 'The Ring', and it is read through many provinces, and above all by those who preach apatheian [freedom from passion] and sinlessness. As, then, the Lord threatens that he will cast Jeconiah from his hand and finger like a ring, so I beseech the reader to throw away this wicked book, and, if he wishes, to read it as he reads the other books of the philosophers, not as a church volume.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
