[[commentary]]
quote='''
And when we have all been in sin, and have lain prostrate before the truth of the sentence, the Lord will have mercy on us, and because we are very small, he will raise us up at the time of the resurrection, or he will raise up through virtues us who lay in vices; the Lord promising this and saying: But this too shall not be. And he said well: But this too, because above he had already said: This shall not be. Not, indeed, to the end will he be angry, nor for ever will he threaten. He has not dealt with us according to our sins, nor repaid us according to our iniquities. As far as the east is from the west, so far has he removed our iniquities from us. As a father has pity on his sons, so the Lord has had pity on those who fear him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
