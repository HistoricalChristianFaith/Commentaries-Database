[[commentary]]
quote='''
And what is written: I gave command to all the stars, has given some an occasion to hold that the stars are rational and have soul and sense. For, they say, he would not command any but beings who understand: not remembering that it is written in Jonah: The Lord commanded the scorching wind (Jonah 4:8). And again: He commanded the morning worm (ibid., 7). And that in the Gospel the Savior rebuked the winds and the sea (Luke 8), in which it is plain that there is neither sense nor reason.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
