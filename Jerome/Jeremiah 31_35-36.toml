[[commentary]]
quote='''
Thus says the Lord, who gives the sun for the light of the day, the order of the moon and of the stars for the light of the night, who troubles the sea and its waves sound; the Lord of hosts is his name. If these laws — or these statutes — cease before me, says the Lord, then the seed of Israel too shall fail, so as not to be before me all the days. And at the beginning of Genesis we read that the sun was set in the heaven for the light of the day, and the moon too and the stars for the light of the night, and in the psalm: day to day utters the word and night to night shows knowledge, in that day and night succeed one another in turn. 'As', he says, 'the order of things, and especially of the heavenly stars, cannot be changed, and the waves of the sounding sea roll to the shores, and the terrible roar of the gulfs and of the swelling waves is heard, and it cannot advance further than has been prescribed by the command of God, according to that saying: you have set a bound which they shall not pass over, nor shall they turn back to cover the earth, so', he says, 'the seed and race of Israel will by the will of the Lord be perpetual and will never fail.' But 'laws' here are not to be understood as the Mosaic ones, but as the constitution and order of nature. Let us ask the Jews: 'if the heavens shall perish and all shall grow old like a garment, and it is said to God: but you yourself are, and your years do not fail, how can the seed of Israel be perpetual?' For either, when the heavens perish, the seed of Israel too will perish, or, if it is perpetual, then neither will the heavens perish. But if Scripture cannot lie and the heavens are going to perish, then the seed of Israel too will perish, especially since Jacob too says to his sons: come, and I will declare to you what is to come in the last days; and when it is said: in the last days, then the world will cease to be and another dispensation of things will come about. This against them. For the rest, for our own people the Gospel too shows that this world is not perpetual, saying: heaven and earth shall pass away, and: behold, I am with you all days, even to the consummation of the age. Let us also say it otherwise: that as long as this world lasts, the seed of Israel and the Jewish nation will remain, not in those who are now unbelieving, but in those who believed with the apostles and through the apostles, so that a remnant might be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
