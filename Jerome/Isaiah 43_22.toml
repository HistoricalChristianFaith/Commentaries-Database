[[commentary]]
quote='''
You have not called upon me, Jacob, nor have you labored in me, Israel. You have not offered me the ram of your burnt offering, and with your victims you have not glorified me. I have not made you serve with offering, nor have I given you labor with incense. You have not bought me sweet cane with silver, and with the fat of your victims you have not made me drunk. But you have made me serve in your sins; you have given me labor in your iniquities. LXX: Not now have I called you, Jacob, nor have I made you labor, Israel. You have not brought me the sheep of your burnt offering, nor have you magnified me with your victims; nor have I made you serve with sacrifices, nor have I given you labor with incense; nor have you bought me incense with silver, nor have I desired the fat of your sacrifices; but in your sins I have defended you, and in your iniquities. While the beasts of the field, the dragons and the ostriches, praise me, you, Jacob, in no way wished to call upon me, nor afterward to labor so as to amend your sin by repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
