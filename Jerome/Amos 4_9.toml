[[commentary]]
quote='''
I struck you with scorching wind and with mildew. The multitude of your gardens and of your vineyards, your olive groves and your fig groves, the caterpillar devoured, and you did not return to me, says the Lord. LXX: I struck you with burning heat and with mildew. You multiplied your gardens, your vineyards, and your figs, and your olive groves the caterpillar devoured, and not even so were you converted to me, says the Lord. Not only did I do the former things in order to correct you, but whatever was left over from the drought I struck with scorching wind and with mildew. For 'scorching wind' Aquila and Symmachus and Theodotion translated ἀνεμοφθορίαν; the Seventy πύρωσιν, which we can call burning. 'Mildew', moreover, all of them likewise translated ἴκτερον, except Theodotion, who alone translated ὠχρίασιν, which signifies pallor. And when, in defiance of the wrath of the Lord, they multiplied gardens and vineyards and fig groves and olive groves, the caterpillar consumed everything, of which more is said in Joel. And not even through blows and the weight of evils were they willing to come to the Lord. By this saying let the heretics be confounded, who interpret as cruelty the discipline and, so to speak, the medicine of the Creator. The Lord, moreover, strikes the heretics spiritually with that burning of which Paul the Apostle speaks: It is better, he says, to marry than to burn. And the prince of the apostles: Beloved, do not be as strangers in the burning which has come upon you for a trial. And with mildew, which, when the bile is spread abroad, changes the redness of the blood into pallor and allows nothing in the body to be sound, so much so that even the sweetest honey seems bitter. And those who once heard in the Church: Taste and see that the Lord is sweet, and themselves said: How sweet are your words to my throat, above honey to my mouth. Let them be called παραπικραίνοντες (embitterers), and let their waters and rains not drip sweetness, nor be from the land of promise, which we read is flowing with milk and honey, but let them be called mara, that is, bitterness. These have multiplied gardens for themselves, into which Naboth was willing to die rather than have his vineyard changed. He who, after all, is weak, let him eat herbs. And because the heretics, always swelling with pride and falling into the judgment of the devil, promise great things to themselves, and feign images of good things, in order to mix poisons with honey, they also boast that they have vineyards and olive groves and fig groves; but their vine is the vine of Sodom; their olive groves are not of good olives, but of wild olives, which the Apostle commands to be grafted onto the roots of good olives. Their fig groves too are such as to fill a basket with the worst figs, which Jeremiah testifies cannot be eaten for their bitterness. When the Lord comes to these, he curses them with an everlasting drought, so that they may never bear fruit, lest by the greenness of their leaves they deceive those who pass by. And so that we may understand that the gardens and vineyards and olive groves and fig groves of the heretics are to be taken in the bad sense, he added 'your' to each word, to show that they belong not to God, but to the heretics: Your gardens, your vineyards, your olive groves and your fig groves, all of which the caterpillar has laid waste, the last of all punishments; for it does not fly away like the locust, and, running here and there, leave things half-eaten, but stays on the crops that are to perish, and with slow movement and sluggish bites consumes everything. And though they suffered these things, not even so were they willing to return to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
