[[commentary]]
quote='''
So, after the wall, which the Seventy translated περίβολον, which went round the whole temple in a square round about, we read that the prophet was brought into the inner court, and then to the north and to the south and to the eastern gate and again to the north, of which we have spoken as best we could, and in whose diversities, whether of names or of measures, our past discourse has shown what seemed right to us — whose sense the testimony of the Savior briefly shows, saying: In my Father's house are many mansions —. These things completed, he enters the temple, that is, the Holy of Holies, of which it is now spoken, and within the inner gate are the chambers or exedrae of the singers — to whom that command is given: Sing to the Lord a new song, who cry aloud with the angels: Glory to God in the highest, and on earth peace among men of good will —, which inner court was situated at the side of the gate which looked toward the north, and toward the south and toward the east, so that the singers of the Lord, and those who are held in the office of the angels, may always remember by what steps they have come to the summit, and may diligently recognize the mysteries of each place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
