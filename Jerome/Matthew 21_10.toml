[[commentary]]
quote='''
When Jesus entered with the multitudes, the whole city of Jerusalem was moved, wondering at the crowds, and not knowing the power.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when he had entered Jerusalem, the whole city was stirred, saying: Who is this? As Jesus enters with the crowd, the whole city of Jerusalem is stirred, marveling at the throng, not knowing the truth, and saying: Who is this? We read this in another place too, where the angels say: Who is this king of glory? But while others are either in doubt or asking, the common little crowd confesses, beginning from lesser things so as to arrive at greater, and says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
