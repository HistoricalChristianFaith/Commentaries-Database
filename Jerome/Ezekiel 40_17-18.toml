[[commentary]]
quote='''
And those are called 'gazophylacia' [chambers, literally treasuries] which are full of spiritual riches — of which it is written: The redemption of a man's soul is his own riches, and over which the apostle Paul too congratulates his disciples, that they are full in every word and in all knowledge; and in the language of the Persians 'riches' are called 'gaza' —, or certainly cells, which in Greek are called παστοφόρια [bridal chambers]: they show rooms prepared for the coming of the bridegroom; and they were thirty in number, to show the perfect age of those who dwell in them. And the 'pavement' was laid with stone, so that the footsteps of the inhabitants might not be defiled by the mud and earth and dust of sins, but that they might walk upon the living stones with which the temple of God is built; or there were 'intercolumniations' before the doors of the cells, which sustained the building laid upon them from above — these are the columns of which the apostle Paul also writes: They gave the right hand to me and Barnabas, Peter and John, who seemed to be columns, and in another place: The column and foundation of the truth; and in the Revelation of John we read: He who conquers, I will make him a column in the temple of my God, and he shall go outside no more —; so the 'pavement' which was at the front of the gates, of which we have already spoken, or the 'porticoes' behind the back of the gates, which protected the inhabitants of the cells from the rains, was lower: for the things which are lower are always placed in the higher ones, so that we may be able to come by ascent and by steps to the things that are mystical and secret and full of spiritual riches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
