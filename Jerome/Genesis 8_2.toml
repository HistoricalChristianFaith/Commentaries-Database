[[commentary]]
quote='''
And the water rested, and the fountains of the abyss and the cataracts of heaven were uncovered. For uncovered fountains all the translators rendered closed and stopped up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
