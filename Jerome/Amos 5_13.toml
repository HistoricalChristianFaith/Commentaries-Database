[[commentary]]
quote='''
Therefore he who is poor and prudent, when he sees that the judge has been bought, shall keep silent at that time, for it is an evil time. Or certainly it is to be understood thus: What use is it now, when your captivity is near, to enumerate your sins, when there is no longer any remedy and a hostile army surrounds the walls of your cities?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
When therefore a churchman, prudent and understanding, comes to know that there are many impieties in that which is called the house of God, and not only many but also strong, and such as can oppress righteousness, and that the madness of the teachers has gone so far that they take a price in judgment and do everything for gifts, and also shun the poor in the gates and disdain to hear them, let him be silent at that time, lest he give what is holy to dogs and cast pearls before swine, who would turn and trample them; and let him imitate Jeremiah, who says: I sat alone, because I was filled with bitterness. And that in the psalms: I am alone until I pass over.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
