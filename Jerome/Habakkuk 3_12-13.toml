[[commentary]]
quote='''
When, therefore, you avenge the wrong done to your people, you will trample the earthly kingdoms and make all the nations marvel, because you went forth for the salvation of your people and came to them with your Christ; although in the Hebrew it is written: You went forth for the salvation of your people with your Jesus Christ, or with your Savior Christ. For Jesus means Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
