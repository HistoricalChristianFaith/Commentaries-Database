[[commentary]]
quote='''
And you shall be filled,' he says, 'O land of Israel, with my people, who will hold you as an inheritance, and you shall be a possession for them, and you shall not add any more to be without sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
