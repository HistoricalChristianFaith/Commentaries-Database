[[commentary]]
quote='''
All these things can also be fitted to the heretics, so that, abandoning the error which they have invented, they may return to the Church, and hate their former dogmas, and love the truth of the Lord in the Church, and exercise true judgment in the gates of vices and virtues, leaving the former and passing over to the latter; and that those who have been able to escape from the jaws of the devil may hope for mercy. But according to the LXX, with the order changed, the reading of the present section can be rendered more plainly thus: As you have said, We have hated evil things and loved good things, so seek good and not evil, that you may live; and as the Lord God Almighty is with you, so render judgment in the gates, that the Lord God Almighty may have mercy on the remnant of Joseph.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
