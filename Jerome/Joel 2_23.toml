[[commentary]]
quote='''
You too, whom after repentance I rightly call sons of Zion and of the Church, be glad and rejoice, because God the Father has given you a teacher of righteousness, or has granted you nourishment of righteousness, and has made the early and late rains come down to you. The seasonable rain is when we first receive doctrine, the late rain when we receive the fruits of our labor, and come to the perfect knowledge of the holy Scriptures. The early and the late rain can also be taken as the Old and the New Testament.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
