[[commentary]]
quote='''
What abundance is there for the one who works, in the things in which he labors? I have seen the occupation which God has given to the sons of men, to be occupied in it. He has made all things good in their time, and indeed he has given the world into their hearts, so that man may not find the work which God has made from the beginning to the end. I am not unaware of what has been said by many in this place: that God for this reason granted occupation in the present world even to the teachers of perverse doctrines, lest the mind of man should grow sluggish in idleness; and that this is the good which God has made in its time, and that they are nonetheless unable to comprehend nature and the knowledge of things. But to me it was explained thus by the Hebrew who instructed me in the Scriptures: Since all things slip away in their own time, and there is a time for destroying or building, for weeping and laughing, for being silent and speaking, and the rest that has been said about time, why do we strive and strain in vain, and suppose the labors of a brief life to be everlasting? Nor are we content, according to the Gospel, with the evil of the day, and to take no thought for tomorrow. For what more can we have in this world by laboring more, in which only this has been given to men by God: that each, by pursuing different things, should have things in which he could instruct and exercise himself?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
