[[commentary]]
quote='''
Another Evangelist (John 12:3.) instead of 'alabastrum' has 'nardum pisticam,' that is, genuine, unadulterated.

For let no one think that she who anointed His head and she who anointed His feet were one and the same; for the latter washed His feet with her tears, and wiped them with her hair, and is plainly said to have been a harlot. But of this woman nothing of this kind is recorded, and indeed a harlot could not have at once been made deserving of the Lord's head.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
A woman came to him having an alabaster of precious ointment, and she poured it over his head as he reclined. Let no one think that she who poured ointment over the head is the same as she who poured it over the feet. For the latter both washes with tears and wipes with her hair and is openly called a harlot, whereas of this one nothing of the kind is written. Nor indeed could a harlot at once become worthy of the Lord's head. Another evangelist, in place of the alabaster of precious ointment (which is a kind of marble), put pistic nard, that is, true and without guile, to show the faith of the Church and of the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
