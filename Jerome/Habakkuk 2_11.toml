[[commentary]]
quote='''
Then the stones of his church, and the κάνθαρος, that is, the beetle from the wood, will cry out against the avarice of the proud one, because he has deceived all nations by his persuasion. By the stones we can understand the dull hearts of those who believe the doctrines of the heretics, and by the beetle from the wood, all perverse masters who, taking up the preaching of the cross for the sake of shameful gain, speak from the belly. For their god is their belly, and they do all things for the sake of food, which is turned into dung — for the beetle or cantharus is a dung worm —, and they take up the cross only for this, that with viperous mouth they may teach the avarice and pride of their master the devil. If ever you see one of the heretics speaking against the Church as if of hidden and secret mysteries, and preferring the house of the devil to the house of Christ, say: The stone cries out from the wall, and the cantharus speaks from the wood. I have read in someone's volume that the cantharus is understood of the heretics for this reason, that they hold doctrines to be compared with dung. Hence the Apostle too says that he counted the error of the old teaching as scybala, that is, as dung. Not that the old law, as the Manichaeans think, is reckoned as scybala in comparison with the Gospel — which it is impious to say, since both Testaments belong to the one God —, but that the teachings of the Pharisees, and the precepts of men, and the Deuterosis of the Jews are called dung by the Apostle. I know that one of the brethren understood the stone that cried out from the wall as the Lord Savior, and the beetle speaking from the wood as the thief who blasphemed the Lord; and although this can be understood piously, yet I do not find how it can be fitted to the whole context of the prophecy. There are some who think that the cantharus speaking from the wood can also be referred to the person of the Savior, which is shown to be impious by the very order of the discourse. For the cantharus from the wood will speak these things is understood not in a good but in a bad sense, that is, it will speak of the most wicked avarice of him who multiplies against his own house, and of the confusion of the devil, and the rest that went before concerning his iniquity and crime. As for what Aquila says, and a lump from the wood will answer, we refer the lump to that sense which the Lord set down in the Gospel: Beware of the leaven of the Pharisees. And when the apostles were in doubt and could not know what it was, the evangelist interpreted it, saying: Now he had spoken to them of the teaching of the Pharisees. Rightly, therefore, does the teaching of the heretics speak from the wood; for they cannot persuade otherwise unless they hold out the glory of the wood in front of their perversity. And also concerning what we had said: For the stone will cry out from the wall like a worm speaking in the wood, or the stone will shout from the wall, and the σκώληξ from the wood will speak these things, some of our people say that the worm speaking in the wood is he who says in the psalm: But I am a worm and no man; and they refer the singing bird to the person of the same one, who says: I have become like a sparrow alone on the housetop, and other things like these.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
