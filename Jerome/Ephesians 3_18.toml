[[commentary]]
quote='''
Let us first learn breadth and length, depth and height from bodily things, so that through them we may be able to pass over to spiritual things. For example, let the breadth of this heaven and earth, that is, of the whole world, be from East to West; the length, from South to North; the depth, in the abysses and in hell; the height, what is raised above the heavenly things. But since by very many, according to Ecclesiastes (ch. 1), heaven is affirmed to be round and to revolve in the manner of a sphere; and since no roundness has breadth and length, nor height and depth either, but it is equal on all sides; we are compelled by necessity to understand by the height the angels and the upper virtues; by the depth the underworld and the things that are beneath it; and by the length and breadth the middle things which stand between those above and those below. And since it follows that each thing is near either to those above or to those below, whatever things begin to advance toward better things and to rise to the heavenly and the high, let them be called length; but to the things that are nearest to the lower part and slide down into vices, let the name of breadth be given. For broad and spacious is the way that leads to death (Matt. 7:13). All these things can also be understood in the cross of our Lord Jesus Christ. For ascending on high, he led captivity captive (Ps. 67:19), and he descended into the lower parts of the earth. And after the height and the depth, the preaching of the cross went out into all the earth. And so it holds the height, and the depth, and the length, and the breadth. Nor is it any wonder if the cross of Christ possesses all things, since even anyone who has been crucified with Christ has the same power. For he will know first the breadth, beginning from the lower things and coming to know the lesser; then the length, those who, placed on earth, hasten toward the sublime and lofty; after these the depth, the adverse and opposing powers, which wage war against us in this world; and at the last the height: because after we have knowledge of them and have made them to be under our feet, then we shall merit to climb to the high and lofty places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
