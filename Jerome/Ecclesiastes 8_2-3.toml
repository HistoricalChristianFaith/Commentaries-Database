[[commentary]]
quote='''
But since the Seventy translated otherwise, saying: And concerning the oath and the word of God do not hasten to walk from the face of God; we must know that the oath of God is written down in the divine volumes. This oath, then, sacred and secret, concerning the word of God, we ought not to tell to just anyone, nor bring it out into the open and pass hasty sentence on it. Nor, like Moses, should you hasten to see the face of God; but wait until he himself passes by, and you see only his back parts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
