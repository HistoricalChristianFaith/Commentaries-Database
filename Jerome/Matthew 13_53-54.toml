[[commentary]]
quote='''
After the parables which the Lord spake to the people, and which the Apostles only understand, He goes over into His own country that He may teach there also.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Wonderful folly of the Nazarenes! They wonder whence Wisdom itself has wisdom, whence Power has mighty works! But the source of their error is at hand, because they regard Him as the Son of a carpenter; as they say, Is not this the carpenter's son?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And it came to pass, when Jesus had finished these parables, he passed over from there, and coming into his own land he taught them in their synagogue. After the parables which he spoke to the people, and which the apostles alone understand, he passed over into his own country, so as to teach more openly there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
