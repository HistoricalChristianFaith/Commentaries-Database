[[commentary]]
quote='''
Let us not suppose that we are being taught by the Apostle to despise the judgments of men after his example, since in another place he said: "Knowing therefore the fear of the Lord, we persuade men; but to God we are manifest" (2 Cor. 5:11); and this: "Be without offense to the Jews, and to the Gentiles, and to the Church of God, just as I also please all men in all things, not seeking what is useful to me, but what is useful to many, that they may be saved" (1 Cor. 10). But if it can be that we please God and men alike, men too must be pleased. If, however, we do not please men otherwise than by displeasing God, we ought to please God rather than men. Besides, he himself also adds why he pleases all men in all things: "Not seeking", he says, "what is useful to me, but what is useful to many, that they may be saved". Now he who, out of that love which does not seek the things that are its own but the things that are another's, pleases all men that they may be saved, certainly pleases God first, to whom the salvation of men is a care.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
