[[commentary]]
quote='''
But it would have been foolish to have answered them that smote Him, and to have declared the smiter, seeing that in their madness they seem to have struck Him openly.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And others struck his face with their palms, saying: Prophesy to us, Christ, who is it that struck you? It was foolish to answer those who were beating him and to prophesy who was striking him, when the madness of the one who struck was plain to see. But just as he did not prophesy this to you, so he foretold that other thing most plainly: that Jerusalem would be surrounded by an army and that not a stone would be left upon a stone in the temple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
