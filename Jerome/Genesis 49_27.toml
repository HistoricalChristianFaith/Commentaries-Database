[[commentary]]
quote='''
Indeed, of the apostle Paul, who was of the tribe of Benjamin, it is said according to the Hebrew: Benjamin a ravening wolf: in the morning he shall eat, and at evening he shall divide the spoils (Gen 49:27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Then the wolf and the lamb fed together, Paul the persecutor and Ananias the disciple (Acts 9). He is the wolf of whom it is written: Benjamin, a ravening wolf, in the morning shall eat the prey, and at evening shall give food (Gen 49:27); or, as it is said in the Hebrew, shall divide the spoils. His teaching was the food of believers, and he triumphed over his vanquished adversaries in the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Where we translated behind your back, Benjamin, the Seventy rendered Benjamin has been moved in mind, always fitting ἔκστασιν, that is, ecstasy of mind, to Benjamin, the churchman. Hence also in the sixty-seventh (68th) psalm it is said: There is Benjamin, a youth, in ecstasy of mind. And in the blessings of Jacob, under the person of Benjamin, of which tribe the apostle Paul was, we read it written: Benjamin is a ravening wolf; in the morning he will eat the prey, and at evening he will give food. For he who in the beginning persecuted the Church afterwards bestowed the nourishment of the Gospel on believers throughout the whole world. Hence also Saul, who was of the tribe of Benjamin, prophesied in ecstasy of mind all day until evening among the band of the prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
