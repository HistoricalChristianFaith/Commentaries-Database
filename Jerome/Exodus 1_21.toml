[[commentary]]
quote='''
We ought therefore to consider our houses more carefully, lest perhaps they have collapsed in some part, and need to be built after the captivity; and we must come to their aid with all toil and skill, so that they do not utterly collapse, that there may be fulfilled in us what is written in Exodus: 'Because the midwives feared God, they built themselves houses.' See what it says: Because they feared God, they built houses. Therefore a house cannot be constructed except by the fear of God. If then those women built houses by the fear of God, who had not sinned but rather acted in accord with God's will: what ought we, who have been taken captive, to do? Listen, sinner: we ought indeed to fear God, that we may not sin; but the second plank after shipwreck is repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_072.html'
source_title="Homily 72, on Psalm 95 (Alternate Series)"
