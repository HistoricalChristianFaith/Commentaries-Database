[[commentary]]
quote='''
For he endured the cross not by necessity but by will, saying in the Gospel: The cup which the Father has given me, shall I not drink it (John 18:11)? And to Peter, who was scandalized at the name of the cross, because he did not know the mystery and trembled with human fear: Get behind me, Satan, you are a scandal to me, for you do not savor the things that are of God, but those that are of men (Matt 16:23). Otherwise, if he had not been offered by his own will, he who could point out and foretell the traitor, and said to the Apostles, All of you will be scandalized in me this night, could have avoided those who had been sent against him; but he went to meet them fearlessly, and offered himself of his own accord, saying: Whom do you seek (John 18:4, 6)? And at once they fell backward; for they could not bear the voice of God present before them. And beautifully he added: And he did not open his mouth. When Pilate said, Do you not speak to me?, he would not answer. Or according to the Seventy: Afflicted, he did not open his mouth. Or according to Symmachus and Theodotion, hearing, he did not open his mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
As a sheep he shall be led to the slaughter, and as a lamb before its shearer he shall be dumb, and he shall not open his mouth. From distress and from judgment he was taken away. Who shall declare his generation? for he was cut off from the land of the living: for the crime of my people he struck them. And he shall give the ungodly for burial, and the rich man for his death: because he did no iniquity, nor was there deceit in his mouth. And the Lord willed to bruise him in infirmity. LXX: As a sheep he was led to the sacrifice, and as a lamb dumb before its shearer, so he did not open his mouth. In humiliation his judgment was taken away. Who shall declare his generation, for his life is taken from the earth? By the iniquities of my people he was led to death; and I will give the worst men for his burial, and the rich for his death. For he did no iniquity, nor was there deceit in his mouth: and the Lord wills to cleanse him from the stroke. This testimony, when in the Acts of the Apostles the Eunuch of queen Candace was riding in his chariot (Acts 8ff.) and, reading it, did not understand it, he understood when Philip interpreted it of the passion and name of the Savior; and at once, baptized in the blood of the lamb of whom he was reading, he deserved to be called a man, and was sent as an Apostle to the nation of the Ethiopians. He, then, who was offered to Pilate because he himself willed it, and did not answer, so that, condemned, he might mount the gibbet for us, was himself led as a sheep to the slaughter, and as a lamb before its shearer he was dumb. For Christ our passover has been sacrificed (1 Cor 5), whom John the Baptist pointed out, saying: Behold the lamb of God, behold him who takes away the sins of the world (John 1:29). He too is often mentioned in the Apocalypse of John the Evangelist as the lamb that was slain (Rev 5). He speaks of himself in Jeremiah (Jer 11): But I was like an innocent lamb, led to the sacrifice, and I did not know. For though he knew no sin, he was made sin for us (2 Cor 5). And as a lamb, when it is led to the sacrifice, does not resist, so he suffered by his will, that he might destroy him who had the dominion of death (Heb 2), humbling himself unto death, even the death of the cross (Phil 2). This is the lamb in whose figure a lamb was sacrificed, whose blood, smeared on the doorposts, put to flight the destroyer of Egypt (Exod 12); who not only redeemed us with his blood, but also covered us with his wool, so that he might warm with his garment us who were freezing with unbelief, and that we might hear the Apostle saying to us: As many of you as have been baptized in Christ have put on Christ (Gal 3:27). And in another place: Put on Christ Jesus (Rom 13:14).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
