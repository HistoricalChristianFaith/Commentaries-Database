[[commentary]]
quote='''
Your ways and your thoughts have done these things to you; this is your wickedness, because it is bitter, it has touched your heart. He makes an apostrophe to the city of Jerusalem: that her ways and thoughts, by which she sinned both in deed and in word, have made all that came upon her come, and that her wickedness, which is bitter in itself, has touched her heart and pierced the inmost parts of her soul. Whatever, therefore, befalls us befalls us through our own fault, who turn the sweet God into bitterness and force him to rage against his will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
