[[commentary]]
quote='''
According to the type, we say that those who, on account of the blood of the seed of God, are called: Without Mercy, and dared to say: His blood be upon us, and upon our children, serve the Romans to this day; but that the house of Judah, namely those of the Jews who confessed the Lord, were saved not by the strength of an army but by the preaching of the Gospel. What we have interpreted of Israel and Judah, both according to the history and according to the type, let us refer to the conventicles of the heretics and to the Church of the Lord Savior: that, while they are left without mercy and lose their kingdom, the Church has prevailed by the power of her God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
For οὐκ ἠλεημένη, that is, without mercy, in some copies is found οὐκ ἠγαπημένη, that is, not beloved. But the truer copies are those which have without mercy; especially since, to distinguish it from Israel, on whom he has no mercy, God adds: But on the house of Judah I will have mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
