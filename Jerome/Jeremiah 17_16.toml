[[commentary]]
quote='''
Let us give thanks to God, and let us ask him in his good will to be our shield and crown, that we may never depart from him and that we may follow him and declare with Jeremiah, "I was not weary of following you." To him be glory forever and ever. Amen.
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 2 (PS 5)"
[[commentary]]
quote='''
But while they are saying these things, he says: 'I was not troubled, nor did I labor, following you as shepherd, or walking in your footsteps; nor was I content to stop there, but I have not desired the day of man, either a longer life or any of the prosperities of this world'. And he calls the same one as witness whom he calls as judge: you have known. There follows: what went out from my lips was right in your sight, meaning that he never lied, that he said nothing contrary to the will of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
