[[commentary]]
quote='''
Now between the cruelty of Damascus and that of the sons of Ammon there is this difference, that they crushed Gilead with iron carts, or the pregnant women of Gilead with iron saws; but these ripped up the pregnant women of Gilead, to enlarge their border. In the people of Damascus, who drink blood, are understood the heretics, who not only have broken the people of God away from the Church, but have also crushed them and ground them with iron teeth, of whom it is written: Who devour my people as a meal of bread? In the sons of Ammon, which means people of grief, or my people, we understand the schismatics, who do indeed separate a deceived multitude from the Church of God, and break off and divide untrained souls which have lately conceived the word of Christ; yet they do not do this with the cruelty with which the heretics slaughter all whom they have deceived, but, remaining in the same rule of faith, they desire to enlarge their borders and to send down to posterity a name of glory. Therefore the Lord threatens that he will set on fire the walls of Rabbah, that is, of the multitude, in the day of howling and of battle, of commotion and of whirlwind, and that their king, the author of the schism, will go captive, and that the princes will submit their necks to the yoke of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
