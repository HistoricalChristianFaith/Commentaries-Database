[[commentary]]
quote='''
'And when,' he says, 'I saw a vessel being made from clay, it was suddenly broken', God's providence bringing this about, so that the craftsman's hand, without knowing it, should by its own mistake figure forth a parable. And again that potter, who had lost the vessel of clay as the wheel was running, made another for himself, as it seemed good to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
