[[commentary]]
quote='''
The Lord from humility shunning the fame of His glorious works, gave them this charge, and they from gratitude cannot be silent respecting so great benefit.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus sternly charged them, saying: See that no one knows. But they went out and spread his fame through all that land. Both the Lord, out of humility, fleeing the glory of boasting, had given this command, and they, out of remembrance of the favor, cannot keep silent about the benefit. Note, therefore, that things that are just can be contrary to one another. These blind men are healed in the tenth place.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
