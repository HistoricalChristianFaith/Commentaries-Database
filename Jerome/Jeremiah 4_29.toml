[[commentary]]
quote='''
At the sound of the horseman and of the one shooting the arrow — or bending the bow — every city has fled — or region — ; they have gone into the heights and climbed the rocks — and what follows: and they have gone into the thickets or caves, was added by the Seventy —, all the cities are abandoned, and no man dwells in them. The divine word describes the army of the raging Babylonian: that for fear of it the whole people abandoned the city and climbed every height, and yet could not escape the wrath of the Lord. But whatever, as we said above, is understood in the history against Jerusalem, refer to the Church when it has offended God and has been handed over to adversaries, either in a time of persecution or, at any rate, through vices and sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
