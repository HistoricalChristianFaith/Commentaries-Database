[[commentary]]
quote='''
He who walks in the one royal way does not labor, the way about which God commanded through Moses: You shall walk in the royal way, and you shall not turn aside to the right or to the left (Deut 5:32). There is one way of truth, which says in the Gospel: I am the way, the truth and the life (John 14:6); and many ways of falsehood, in which Jerusalem is now accused of having walked. God, knowing the difference between these ways, speaks above to those who stray: Your ways are not as my ways (Isa 55:8); and they, confessing to the Lord, say: You have made our ways turn aside from your ways (Ps 43 [44]:19). Having come to know, then, the one royal way, let us see which are the ways to the right and to the left, by which we are forbidden to go. The royal way is the tempered one, having in itself neither more nor less. For example, the straight and royal way is prudence. We turn aside to the right if we are wiser than we ought to be wise, and love cunning instead of prudence; for the serpent was more prudent than all the beasts in paradise (Gen 3), and the sons of darkness are more prudent than the sons of light (Luke 16). And we turn off to the left when we are foolish and are less wise than is needful; of whom it is said: The fool has said in his heart, There is no God (Ps 13 [14]:1). Piety too and true religion is a royal way. He turns aside to the right who is superstitious, and deserves to hear: Be not overly righteous (Eccl 7:17); to the left, he who neglects the worship of God and is numbered among the kids and the he-goats. Liberality too and stewardship is a very great virtue, from which he turns aside to the right who is stingy and does not give what is needful, not only to others but not even to himself; to the left, he who devours his substance with harlots and says with Israel: Let us eat and drink, for tomorrow we shall die (Isa 22:13). Fortitude also and constancy is a royal way, from which he turns aside to the right who is rash and stubborn, to the left he who is fearful and timid. Hence the holy man, desiring to walk by the straight way, prays: Lead me, Lord, in the straight way (Ps 138 [139]:24). And in another place: Make known to me, Lord, the way in which I should walk, for to you I have lifted up my eyes (Ps 142 [143]:8). Of a way of this kind Scripture also speaks elsewhere: Seek the good way and walk in it, and you shall find purification for your souls (Jer 6:16).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
