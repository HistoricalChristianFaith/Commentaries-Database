[[commentary]]
quote='''
On another occasion God said to Moses, "Let me alone … that I may consume this people," showing by the words "let me alone" that he can be withheld from doing what he threatens. The prayers of his servant hindered his power. Who, think you, is there now under heaven able to stay God's wrath, to face the flame of his judgment and to say with the apostle, "I could wish that I myself were accursed for my brethren"?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_128.html'
source_title="LETTER 128.4"

[[commentary]]
quote='''
Let us speak first according to the Hebrew: the prophets of Israel are like foxes, daily committing thefts of domestic fowl, who dwell, according to Aquila and the Seventy, 'in the deserts', according to Symmachus and Theodotion 'in broken walls' and 'ruins'; who cannot go up from the opposite side, nor set up a wall for the house of Israel — we read that Aaron ran to meet the fire that was devouring the people of Israel, and stood in the midst, and set up a wall for the safety of the people; to Jeremiah also it is said that he should not run to meet the Lord, nor stand against his wrath by perseverance in prayer: for just as a wall is set against an enemy, and one is accustomed to meet an adversary from the opposite side and to confront one who is coming on, so the sentence of God is broken by the prayers of the saints; whence also it is said to Moses: Let me go, and I will blot out this people: for in the one to whom it is said: Let me go, it is shown that he has the power of holding back —. These cannot stand in battle on the day of the Lord, so as to fight for the people with prayers and to resist the sentence of God with supplications.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Wherefore in indignation I said to Moses: I will not feed you; let me alone and I will destroy them. But when, in anger, he says, let me alone, he invites entreaty, and shows that he can be held back by him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Yet with God it is not rank that is sought, but works. Finally, what Moses did, Samuel also did. Just as Moses withstood God, that he should not strike the people, when he said to him: 'Let me alone, that I may strike this people.' See the power of Moses. What does God say to him? Let me alone: you do me violence, your prayers as it were hold me fast, your prayers restrain my hand. I send the arrow, I send the darts: and your prayers protect the people. Let me alone, that I may strike this people. And at the same time consider the mercy of God. When he says, Let me alone, he shows that if Moses does not let him alone, God does not strike. If, then, you do not let me alone, I will not strike: let me alone, and I will strike. In another manner, therefore, what does he say? Do not let me alone, and I will not strike.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_026.html'
source_title="Homily 26, on Psalm 98"
