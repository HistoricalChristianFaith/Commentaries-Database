[[commentary]]
quote='''
And you gave them this land, which you swore to their fathers that you would give them, namely, to Abraham and Isaac and Jacob. So they received the land of promise not by their own merit but by the virtues of their fathers, a land flowing with milk and honey; for they could not yet take solid food, but were nourished with the honey and milk of infancy, or at any rate with honey and milk, the fruitfulness and abundance of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
