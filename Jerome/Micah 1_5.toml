[[commentary]]
quote='''
The Lord, therefore, will come, terrible for teaching, that is, for moving the mountains and for dissolving the lowness of the valleys, because Jacob committed impiety, and Israel sin. But the impiety of Jacob is the conventicles of the heretics, which are called Samaria. And the sin of Judah, that is, of him who confesses the Lord, is nothing other than Jerusalem, in which many crimes are found. That the house of Judah, moreover, is referred to Christ, whose Church it is, we have both often said, and let us set down this for the present: Judah, your brothers shall praise you; your hands shall be upon the back of your enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
