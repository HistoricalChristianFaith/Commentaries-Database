[[commentary]]
quote='''
One Lord, one faith, one baptism, one God and Father of all, who is above all, and through all, and in all.

Just as faith is something other than baptism, God and Lord, so baptism, Lord and God are each something other than the three that are named together with them. I say this, however, on account of Sabellius, who thinks that God the Father and the Son are the same, and confounds the persons, since he finds the same divinity in both. See: most manifestly the Son is called the one Lord, and the Father the one God. This is also written more fully to the Corinthians: But for us there is one God the Father, from whom are all things, and one Lord, our Jesus Christ, through whom are all things, and we through him (1 Cor. 8:6). For just as the Son does not take away from God the Father his being Lord, though he himself alone is called Lord, so too the Father does not take away from the Son his being God, because the Father alone is named God. We also read in another place: And know that the Lord himself is God (Ps. 99:2); and elsewhere: The Lord your God is one God (Deut. 6:4). For if, as the Arians think, God the Father alone is God, by the same logic Jesus Christ alone will be Lord, and neither will the Father be Lord nor the Son God. But far be it that there should not be either deity in the lordship or lordship in the deity. There is one Lord and there is one God, because the lordship of the Father and of the Son is one divinity. For this reason faith too is called one, because we believe alike in the Father, and in the Son, and in the Holy Spirit. And baptism is one, for in the same way we are baptized into the Father, and into the Son, and into the Holy Spirit. And we are immersed three times, so that the one mystery of the Trinity may appear. And we are not baptized in the names of the Father, and of the Son, and of the Holy Spirit, but in one name, which is understood to be God. And I wonder by what logic, in one name, in the same work and in the same mystery, Arius, Macedonius and Eunomius suspect a diversity of nature (their discord agreeing in impiety), and, holding to the muddy spring of a creature in the Son and in the Holy Spirit, have drawn off the various rivulets of heresy. One baptism also tells against Valentinus, who contends that there are two baptisms, and against all heretics: so that they may know that they do not have baptisms, but that the life-giving font is in the one Church of Christ. One baptism can also be said in this sense: that although we are baptized three times on account of the mystery of the Trinity, it is nevertheless reckoned one baptism. Baptism is also one in water, in spirit and in fire. And it is the one of which the Lord speaks: I have a baptism to be baptized with (Luke 12:50); and elsewhere: With my baptism you shall be baptized (Mark 10:39).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
