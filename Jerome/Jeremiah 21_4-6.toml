[[commentary]]
quote='''
And Jeremiah said to them: Thus shall you say to Zedekiah: Thus says the Lord God of Israel: Behold, I will turn back the vessels of war — or the weapons of war —, which are in your hands and with which you fight against the king of Babylon and the Chaldeans, who besiege you round about the walls, and I will gather those things — or those men — into the midst of this city, and I will vanquish you with an outstretched hand and with a strong arm — or a lofty one — and in fury and in indignation and in great wrath, and I will strike the inhabitants of this city; men and beasts shall die of a great pestilence. 'In vain', he says, 'do you wish to resist the besieging Chaldeans and prepare weapons of war, of which you will have the use only in the midst of the city, so that you may seem to be armed. For the rest, while they besiege you, I will vanquish you with an outstretched hand and with a strong arm and will strike you with my fury and indignation, so that both you and everything that breathes may die of famine and pestilence in the midst of the city.' And this indeed we read was done; for without any ring of assault or din of combatants the city was taken by siege alone, so that they had none to conquer, but only those to capture; better off, he says, were those wounded by the sword than those slain by famine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
