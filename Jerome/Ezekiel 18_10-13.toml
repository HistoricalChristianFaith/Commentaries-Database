[[commentary]]
quote='''
And let us speak first according to the history, so that you may know that the iniquities of the fathers do not overflow onto the sons. If the righteous man does what the preceding discourse wove together in order, he shall live with life; but if he begets a son who departs from the service of the Lord and exchanges his father's virtues for vices, so that he does what the father did not do and does not do what the father wrought, will he be able to live? Certainly he will not live, but will be guilty of his own blood. Further, according to the spiritual understanding, if a righteous man of the Church has preached the evangelical faith, and his son and disciple has been deceived by heretical error, the son will be called pestilent, of whom it is written also in Psalm 1, And has not sat in the chair of pestilence, and in Proverbs, The bold and insolent and proud man is called pestilent. He has shed the blood of the deceived and doubles all sins upon himself, eating on the mountains of pride and polluting his neighbor's church, grieving the needy and the poor in the knowledge of the Scriptures, oppressing and supplanting them, seizing as plunder those whom he has seduced from the Church, not returning the pledge which he had received from his teacher so as to fulfill what is written, Freely you have received, freely give, and lifting up his eyes to the idols and images which he has fashioned from his own heart, and committing all abominations, and giving money at usury, so as to increase the teacher's error by the diligence of the disciples, and demanding back from those to whom he gave more than he had given: certainly he will not be able to live, but will die in his own blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
