[[commentary]]
quote='''
Others, however, think that Isaiah offered himself for this reason, because he supposed that prosperous things were to be announced to the people: but because he heard: Go, say to this people: With your ears you shall hear and shall not understand, and seeing you shall see and shall not know (Isa 6:9), for that reason, in what follows, when the voice of the Lord says to him: Cry, he does not cry at once, but asks, what shall I cry? And Jeremiah, to whom it had been said: Take the cup, and you shall give drink to all the nations to whom I shall send you (Jer 25:15), gladly accepting the cup of punishments to pledge it to the hostile nations, that they might drink and vomit and fall, after he heard, go, and first you shall give drink to Jerusalem, answered: You have deceived me, Lord, and I have been deceived (Jer 20:7). This is an observation of the Hebrews. For our part, however, we say that it was not of rashness but of obedience that he offered himself to the Lord to be sent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
As for what is set down above, Why have you made us stray (Isa 63:17)?, in what sense it is to be taken Jeremiah teaches most fully: You have led me astray, O Lord, and I was led astray; you took hold of me, and you prevailed (Jer 20:7). For while you promise me mercy, and like a merciful father you conceal your severity, and like a skilful physician you hide the sharpest knife so as not to frighten the sick man before you heal him, you have made me careless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
You have seduced me, O Lord, and I was seduced — or you have deceived me, O Lord, and I was deceived —; you were stronger than I and you prevailed — or you held fast and you were able —; I have become a derision all the day, all mock me, for long since I speak crying out iniquity, and I keep proclaiming devastation or for with my bitter word I shall laugh, I shall call upon transgression and misery. The prophet says that he was deceived by the Lord because, hearing at the beginning: I have given you as a prophet to the nations, and again: behold, I have set you this day over nations and over kingdoms, to uproot and to destroy and to ruin and to scatter and to build and to plant, he supposed that he would say nothing against the people of the Jews, but against the various nations round about, and therefore he willingly took up prophecy; and that the contrary came about, so that, preaching the captivity of Jerusalem, he endured persecutions and straits. And as for what he added: I have become a derision all the day, all mock me: it is because they think that he lied about everything, and that all the things he foretold were to come were lies; for the prophet had thought that what the Lord threatened would come at once, and the people supposed that what had not come at once would never come at all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
