[[commentary]]
quote='''
The prophet says that he was deceived by the Lord because, when he heard the Lord say in the beginning, "I gave you as a prophet to the nations," and, again, "Behold, I establish you today over nations and over kingdoms, that you may uproot and destroy and overthrow and dissolve and build and plant," he believed that none of this was spoken against the people of Judea, but only against the various nations surrounding them, thus leading him to accept his prophetic mission willingly. To the contrary, however, as it turns out, he found himself preaching to a captive Jerusalem that suffered persecution and imprisonment. He also adds, "I have become an object of derision all the day; everyone mocks me," because they all judged him to be a liar and everything that he had prophesied to them to be a lie. For, as the prophet thought that the future that the Lord predicted was to be realized immediately, the people also expected nothing further to be coming that did not arrive at once. And he continues, in effect, "I announce destruction at the hands of Babylon and the iniquity of the army through which my people are to be oppressed." Yet, if we follow the Septuagint, which reads, "I will laugh with my bitter message, I will invoke falsehood and misery," this is the meaning: "I know that the present sorrow is to be exchanged for future joy, according to what is written, 'Blessed are those who weep now, for they will laugh.' " For this reason, I willingly endure misery and iniquity and affliction now, so that I can invoke and even desire them and the brevity of their injury in exchange for eternal happiness.
'''
source_url=''
source_title="SIX BOOKS ON JEREMIAH 4:22.2-4"

[[commentary]]
quote='''
Others, however, think that Isaiah offered himself for this reason, because he supposed that prosperous things were to be announced to the people: but because he heard: Go, say to this people: With your ears you shall hear and shall not understand, and seeing you shall see and shall not know (Isa 6:9), for that reason, in what follows, when the voice of the Lord says to him: Cry, he does not cry at once, but asks, what shall I cry? And Jeremiah, to whom it had been said: Take the cup, and you shall give drink to all the nations to whom I shall send you (Jer 25:15), gladly accepting the cup of punishments to pledge it to the hostile nations, that they might drink and vomit and fall, after he heard, go, and first you shall give drink to Jerusalem, answered: You have deceived me, Lord, and I have been deceived (Jer 20:7). This is an observation of the Hebrews. For our part, however, we say that it was not of rashness but of obedience that he offered himself to the Lord to be sent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
As for what is set down above, Why have you made us stray (Isa 63:17)?, in what sense it is to be taken Jeremiah teaches most fully: You have led me astray, O Lord, and I was led astray; you took hold of me, and you prevailed (Jer 20:7). For while you promise me mercy, and like a merciful father you conceal your severity, and like a skilful physician you hide the sharpest knife so as not to frighten the sick man before you heal him, you have made me careless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
