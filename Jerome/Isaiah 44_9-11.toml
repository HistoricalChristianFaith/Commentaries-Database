[[commentary]]
quote='''
And not only the things that are made, but those also who make them, will be held as nothing. And when the time of vengeance has come, the works of their hands will in no way be able to free them; blind and senseless, they confound their own craftsmen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
