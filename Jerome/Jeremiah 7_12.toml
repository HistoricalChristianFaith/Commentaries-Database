[[commentary]]
quote='''
Go to my place in Shiloh, where my name dwelt from the beginning, and see what I did to it because of the wickedness of my people Israel! From the past he teaches the present, and to those who say: the temple of the Lord, the temple of the Lord, the temple of the Lord and who rejoice in the gleam of a costly house he recalls the history of Shiloh, where the tabernacle of God first was, of which it is written in the psalm: and he rejected the tabernacle of Shiloh, so that, just as that place collapsed into ruins and ashes, so the temple too may fall, since it has been the dwelling of like sins. Therefore, just as Shiloh is an example for the temple, so is the temple for us, when the time of that testimony comes: Do you think the Son of Man, when he comes, will find faith on the earth?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
