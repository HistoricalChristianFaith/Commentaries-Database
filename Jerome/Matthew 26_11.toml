[[commentary]]
quote='''
Here a question arises how the Lord should have said elsewhere to His disciples, Lo, I am with you always, even to the end of the world; but here, Me ye shall not have always. (Matt. 28:20.) I suppose that in this place He speaks of His bodily presence, which shall not be with them after the resurrection in daily intercourse and friendship, as it is now.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Jesus, knowing it, said to them: Why do you trouble the woman? She has wrought a good work on me; for you always have the poor with you, but me you will not always have. Another question arises: why the Lord said to the disciples after the resurrection: Behold, I am with you even to the consummation of the world, and now says: but me you will not always have. But it seems to me that in this place he speaks of his bodily presence: that after the resurrection he would by no means be with them in such a way as he is now, in all shared life and familiarity. Mindful of this, the Apostle says: And if we had known Jesus Christ according to the flesh, yet now we know him no longer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
