[[commentary]]
quote='''
The earth, therefore, will be scattered, and all earthly works will be reduced to nothing, so that, the image of the χοϊκοῦ having been abolished, the image of the heavenly may remain. For the first man was from the earth, earthly, and the second from heaven, heavenly: as is the earthly, such also are the earthly; and as is the heavenly, such also are the heavenly; so that, as we have borne the image of the earthly, we may bear also the image of the heavenly (1 Cor 15:47-49). Hence the same Apostle says: Flesh and blood shall not possess the kingdom of God (ibid., 50). Not that, as the heretics say, the nature of bodies perishes, but that this corruptible puts on incorruption, and this mortal puts on immortality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
