[[commentary]]
quote='''
Sichar [Sychar]: enclosure, or branch. But usage has corruptly prevailed so that Sichar is read for Sichem (which is translated into shoulders).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Gospel of John"
