[[commentary]]
quote='''
The psalmist is speaking here of the frailty of the body and of human weakness, and what does he say? If you consider his flesh, what is a person? If you consider his spirit, he is noble. Let us by no means scorn the flesh, but let us reject its works. Let us not despise the body that will reign in heaven with Christ. "Flesh and blood can obtain no part in the kingdom of God"; no, not flesh and blood of themselves, but the works of the flesh. "Flesh and blood can obtain no part in the kingdom of God." How, then, are they going to reign together with Christ; how shall we be seated together in heaven in Christ?
'''
source_url=''
source_title="HOMILY ON PSALM 143"

[[commentary]]
quote='''
We can also say this: that those converted from idolatry, having deserted their ancient error, see new heavens and a new earth, by no means reckoning the elements to be gods, nor the things that are born of the earth. Now we confess that heaven and earth are the works of the hands of God: but at that time we venerated servants and the creature with the homage due to God; and David, perceiving this, sings in the psalm: I shall see the heavens, the works of your fingers (Ps 8:4): not that at that time, when he said this, he did not see the heavens; but that through the several increases of virtues, and the knowledge of things to come, he sees as new those which he already saw as old.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
