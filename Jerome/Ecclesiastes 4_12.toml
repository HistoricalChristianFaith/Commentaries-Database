[[commentary]]
quote='''
And if the Father and the Son and the Holy Spirit also come, this companionship is not quickly broken. But what is not quickly broken will nevertheless at some time be broken. For in Judas the apostle too there was this threefold cord; but because after the morsel Satan entered into him, this cord was broken apart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
