[[commentary]]
quote='''
Do not let them down, but lift them up: lift them up with Moses. If you lift up your hands, Amalek is conquered: but if you let them down, Joshua is overcome. And at the same time consider the mystery. If we lift up our hands, Jesus conquers. If we lift up our hands in good works, through our good works Christ overcomes the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_046.html'
source_title="Homily 46, on Psalm 133"

[[commentary]]
quote='''
And when Moses lifted up his hands, Jesus was winning; but when he lowered them, he was being beaten. If I understand the Scriptures according to the history and according to the letter, Moses holds his hands downward: but if spiritually, he lifts his hands on high.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
