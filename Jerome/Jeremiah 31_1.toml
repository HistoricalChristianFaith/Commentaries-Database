[[commentary]]
quote='''
At that time, says the Lord, I will be God to all the families of Israel — or to the race of Israel — and they shall be to me for a people. Unless the thought of the Lord has been fulfilled and his fury has come to rest upon the head of the ungodly, the Lord of the universe cannot be God to the families of Israel; but this he says to the remnant, which has been saved. But if what is said is set against us: I will be God to the race of Israel or to all the families of Israel, let us take up an example: 'if you were children of Abraham, you would do the works of your father'; and the Apostle writes: behold Israel according to the flesh. From this he teaches that there is another Israel according to the spirit. That one, then, is Israel who discerns God with the mind, or is the most upright one of the Lord, and an Israel of this kind will be the people of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
