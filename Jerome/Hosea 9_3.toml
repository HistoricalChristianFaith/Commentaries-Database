[[commentary]]
quote='''
They will not dwell in the land of the Lord; Ephraim has returned into Egypt, and among the Assyrians he has eaten what is polluted. They will not pour out wine to the Lord, and their sacrifices will not please him; like the bread of mourners, all who eat it will be defiled, because their bread, their own soul, will not enter into the house of the Lord. LXX: They did not dwell in the land of the Lord; Ephraim dwelt in Egypt, and among the Assyrians he ate what is unclean; they did not pour out wine to the Lord, nor did their sacrifices please him, because it is to them the bread of mourning; all who eat them will be defiled; because the loaves of their souls will not enter into the house of the Lord. Not only did the threshing floor and the winepress fail to feed them, and the wine lie in the land of Israel, when for three years and six months everything perished, but the inhabitants themselves also will depart from the land of the Lord; and they will be led into a foreign land, so that they may not dwell in the holy land which they have polluted with their fornications. Ephraim has returned, he says, into Egypt, and among the Assyrians he has eaten what is polluted. From this place some have added above: and among the Assyrians he has eaten what is polluted, which is not found in the Hebrew, and about which we have already spoken.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
