[[commentary]]
quote='''
Behold, he shall come up like a cloud, and like a tempest his chariots; his horses are swifter than eagles. Woe to us, for we are laid waste! He sees things to come as present and describes the Babylonian army, the din of whose chariots and wheels is compared to a most savage tempest, and the swiftness of whose horses is likened to eagles. When the prophet had said this and had pointed out with his finger the enemies as though they were coming, the people groans and feels these things not as future but as already done, saying: woe to us, for we are laid waste! Refer this same thing to the Church: that daily the army of the true Nebuchadnezzar assails us, and the chariots of Pharaoh and all his cavalry outstrip the onrush of eagles. If the man of the Church understands this, believing that saying: 'when you have turned and groaned, then you shall be saved', he will say: woe to us, for we are laid waste!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
