[[commentary]]
quote='''
But though we, or an angel from heaven, preach the gospel to you other than what we have preached to you, let him be anathema. As we said before, and now I say again: if anyone has preached the gospel to you other than what you have received, let him be anathema.

It can also be taken as said hyperbolically: not that either an apostle or an angel could have preached otherwise than they had once spoken, but that, even if it could come about that both apostles and angels were changed, still one must not depart from what had once been received; especially since the Apostle himself in another place shows the firmness of his faith, saying: "I know that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor strength, nor height, nor depth, nor any other creature, will be able to separate us from the love of God, which is in Christ Jesus our Lord" (Rom. 8:38). "I speak the truth, I do not lie, my conscience bearing me witness" (Rom. 9:1). These indeed are not the words of one who could at some time depart from the faith and love of Christ. But those who will not have this said καθ᾽ ὑπόθεσιν (hypothetically), but in earnest, namely that both apostles and angels can be turned to worse things, object that Paul himself also knew that he could fall if he acted too slackly, saying: "But I subdue my body and bring it into slavery, lest, while preaching to others, I myself be found reprobate" (1 Cor. 9:27); that angels too are changeable, who did not keep their principality but, leaving their own dwelling, are reserved under darkness in eternal chains for the judgment of the great day (Jude 6); that the nature of God alone is unchangeable, of whom it is written: "But you are the same" (Ps. 101:28). And he says of himself: "I am your God, and I do not change" (Mal. 3:6). That Lucifer fell, who rose in the morning, and that he who once sent to all the nations was crushed upon the earth. Elegantly, on this passage, that most learned man Tertullian, writing against Apelles and his virgin Philumene, whom a certain perverse angel of a devilish spirit had filled, writes that this is the angel on whom, long before Apelles was born, anathema was prophesied by the Apostle through the foretelling of the Holy Spirit. Moreover, ἀνάθεμα is properly a word of the Jews, and it is set down both in Joshua son of Nun (Josh. 6:17) and in Numbers (Num. 21), when the Lord commanded that all the things that were in Jericho, and those of the Midianites, be held as objects of detestation and anathema. Let us ask those who assert that Christ and the apostle Paul are respectively the son and the slave of the good God, who was unknown until that time, a God who does not know how to curse and has never learned to condemn anyone: how is it that his Apostle now uses a word of the Jews, that is, of the Creator, and wishes either an angel or an apostle to perish, when he himself is not accustomed to take vengeance?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
