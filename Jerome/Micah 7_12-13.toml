[[commentary]]
quote='''
And your cities will come into enclosure, or into division, with the Assyrians attacking you — since indeed Babylon was a city of the Chaldeans, not of the Assyrians —. And your fortified cities will be for the division of a hostile army, from Tyre as far as the river Tigris, by which you are encircled, and from the Great Sea as far as the Red Sea, which, on the flank, for those traveling to India, touches your regions. And from mountain to mountain; namely, from the mountains of Judea as far as the mountains of Media and of the Persians, all Mesopotamia and the whole region which is now held by you in the middle will be subjugated to the rule of your adversaries. And the land shall become a desolation because of the most wicked fruits of your pursuits. Where the Seventy translated from Tyre, let us know that in the Hebrew there is written masor, a word which, if it is divided into the preposition Ma and the noun Sor, is understood as from Tyre; but if it is one word, it means a fortification. In short, all rendered περιοχὴν, καὶ περίφραγμα, καὶ πολιορκίαν, not from Tyre, as the LXX did, but a fortification and the circuit of a walled city. Let this, according to the Hebrew and the hopes of carnal Israel and of the people of the concision, be what our leisurely discourse has played through as a prelude, as it were from superfluity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
