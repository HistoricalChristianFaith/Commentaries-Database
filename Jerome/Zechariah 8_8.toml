[[commentary]]
quote='''
And what follows, In truth and justice, signifies that the shadow of the old law departs and the truth of the Gospel comes, by no means in the justice of the Jews, but in Christian justice; for the Lord himself is truth and justice, of whom we read: Truth has risen from the earth, and justice has looked down from heaven. Hence in Psalm 14 (15) too justice and truth are named together: He who walks without blemish and works justice, and speaks truth in his heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
