[[commentary]]
quote='''
Who is the wise man who may understand this, and to whom the word of the mouth of the Lord may come, and who may declare it: why the land has perished and is burned up like a desert, because there is none who passes through? And the Lord said: Because they have forsaken my law, which I gave them, and have not heard my voice and have not walked in it, and have gone after the perversity of their heart and after the Baals, whom they learned from their fathers. The prophet asks whether he can find anyone of the wise in Jerusalem, and of those to whom the word of God comes and who can declare the will of the Lord and give the reasons why Judea has been reduced to a wilderness and, all having been slain, no one has remained to pass through it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
