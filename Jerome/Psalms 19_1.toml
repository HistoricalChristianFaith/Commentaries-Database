[[commentary]]
quote='''
And the heavens shall confess your wonders, O Lord. This is what is said in the eighteenth psalm: "The heavens declare the glory of God." According to the mystical understanding, he calls the apostles "heavens." For if it is said to the sinner, "Earth you are, and to earth you shall go," why should it not be said to the holy or righteous man, "Heaven you are, and to heaven you shall go"? For of the saints, according to the apostle, "the conversation is in the heavens." And when he says, The heavens shall confess your wonders, it is a sign of the repentance to be preached, which we have received, at the apostles' proclamation, in the confession of the Lord Jesus Christ; and if we follow their admonitions and examples, we too can be called heavens, when we imitate those whose conversation is in the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
