[[commentary]]
quote='''
Because you have forgotten me and trusted — or hoped — in falsehood, therefore I too have bared — or will bare and will uncover — your thighs — and hinder parts — before your face, and your ignominy will appear, your adulteries and your neighing, the wickedness — or estrangement — of your fornication. The cause of the scattering of Jerusalem is that she has forgotten God and trusted or hoped in falsehoods. He who, apart from God, trusts in the things of the world forgets God. Hence his thighs or hinder parts are uncovered, so that he may see his own ignominy, and the things that ought to be behind may come to the front, and he himself may perceive what he has done, and his ignominy may appear not only to himself but to all. Your adulteries, he says, and your neighing shows not lust alone but the madness of lust, after the manner of mares that are eager for coupling, as in that line of Vergil: hippomanes, as the shepherds call it by a true name, a sticky venom drips from the groin. Let us ask Jesus that neither in the present age nor in the future he uncover our thighs and hinder parts, but that he blot out our iniquities and not let all our crimes appear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
