[[commentary]]
quote='''
Samson and Samuel drank neither wine nor strong drink, for they were children of promise and conceived in abstinence and fasting. Aaron and the other priests when about to enter the temple refrained from all intoxicating drink for fear they should die. From this we learn that they die who minister in the church without sobriety. And hence it is a reproach against Israel: "You gave my Nazirites wine to drink."
'''
source_url='https://www.newadvent.org/fathers/30092.htm'
source_title="AGAINST JOVINIANUS 2:15"

[[commentary]]
quote='''
You who broke out into such madness that you made my Nazirites drunk with wine, though they are commanded by the law not to drink anything that can intoxicate, and charged the prophets not to prophesy in my name. This is what Amaziah the priest of Bethel also commanded the prophet Amos, whom we now have in hand; and Jeremiah was ordered by the king not to speak the words of the Lord to the people, to such a degree that the king even burned his discourses in the fire. From this passage Tatian, the chief of the Encratites, tries to build up his heresy, asserting that wine must not be drunk, since it is commanded in the law that the Nazirites should not drink wine, and now those who give the Nazirites wine to drink are accused by the prophet. If they follow the letter in all things, and thrust Jewish fables upon the churches of Christ, then they ought also to let their hair grow, and not eat grapes, dried or fresh, and not go in over a dead father and mother; and if perhaps they have done these things, and have been overcome either by human frailty or by necessity, let them shave their heads, and let all the days of their consecration and their toil be void. But if they do not do these things, and cannot, after the manner of Jewish innkeepers, mix water with wine, shadows with the truth, the constraint of the law with the grace of the Gospel, let them understand that drunkenness to be the one by which the vigour of the soul is made drunk and overwhelmed with worldly cares, and understand that it is those who charge the prophets, saying: Do not prophesy, who, overcome by envy, forbid learned men to bring forth the word of doctrine. And while the Lord says: Go and say to this people, they on the contrary command that you not speak in the name of the Lord, above all if he who teaches looks not to shameful gain, glory and boasting, but to the profit of those who read and hear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
