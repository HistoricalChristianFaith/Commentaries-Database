[[commentary]]
quote='''
But let us follow the simple and true history: that he called Jeconiah the basket of good figs, who by the counsel of Jeremiah and the command of God had handed himself over to the Babylonian king, and to whom the Lord also promises prosperity; and the basket of bad figs Zedekiah, who, contradicting the sentence of God, was captured, and with his eyes blinded was led to Babylon and died there. And to such an extent did God set his eyes upon them for good, those who acquiesced in his command, and bring them back into their land, and build them and not destroy them, and plant them and not pluck them up, and give them a heart, that they might know him, that he himself was the Lord, and that they might become his people and he himself might be their God, that even in the captivity he set his eyes upon them and permitted them to work the land, to build houses and to plant orchards in the region of Babylonia; Daniel, through miracles of signs, was suddenly made a prince from a captive; the three youths were gloriously delivered from the fire of the furnace; and when the seventy years were completed, under Zerubbabel and Jeshua the great priest, and Ezra and Nehemiah, the greatest part returned to Jerusalem, whose number is contained in the volume of that same Ezra.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
