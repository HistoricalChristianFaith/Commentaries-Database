[[commentary]]
quote='''
Their bones are buried by their kinsmen and their household, of whom it is said: Let the dead bury their own dead. And he who is outside, and does not enter the house of the dead, but rather casts the dead out, commands the one who burns the dead, and dissolves them into ashes, and crushes their bones, to be silent and not to stain the most pure name of God with a dead mouth. For God says to the sinner: Why do you declare my justices, and take up my covenant through your mouth? Hence we too must take care that we do not, being dead, bury the dead, but rather that, living, we lead forth to life those who are dead. If we do not do this, we are commanded and told, Be silent, because we are judged unworthy of the name of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
