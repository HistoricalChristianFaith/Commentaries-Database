[[commentary]]
quote='''
And it must be considered that the new heart and the new spirit are given after the pouring out and sprinkling of the water; and when the new heart and the new spirit have been given, then all the hardness which is compared to stone will be taken away from the Jewish heart, and in place of the heart of stone there comes to be a heart of flesh, soft and tender, which can receive the spirit of God into itself and be inscribed with saving letters; then they will walk in the precepts of the Lord and keep his judgments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
