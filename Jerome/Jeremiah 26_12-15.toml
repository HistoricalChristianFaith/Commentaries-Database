[[commentary]]
quote='''
And Jeremiah said to all the princes and to all the people, saying: The Lord sent me to prophesy to this house — or upon this house — and to this city — or upon this city — all the words which you have heard. Now therefore make good your ways and your pursuits, and hear the voice of the Lord your God, and the Lord will repent of the evil which he has spoken against you — or and the Lord will rest from the evils which he has spoken against you —. As for me, behold, I am in your hands; do to me as is good and right in your eyes — or as is expedient for you — ! Nevertheless, know and understand that, if you kill me, you will bring innocent blood against your very selves and against this city and its inhabitants; for in truth the Lord sent me to you, to speak in your ears all these words. When, with the people present, the princes of the city were sitting in the gate, and the priests and prophets were accusing Jeremiah the prophet and pressing a capital charge, Jeremiah speaks to the princes and to all the people, whom the faction of the priests and false prophets had stirred up, prudently and at the same time humbly and steadfastly. Prudently, in that he said he had been sent by the Lord to speak against the temple and the city, and gave the counsel that, if they were willing to hear his counsel and to repent, the Lord too would change his sentence. Humbly, in what he says: behold, I am in your hands; do to me as is good and right in your eyes! And steadfastly: in truth the Lord sent me to you, to speak in your ears all these words. And in other words he says: 'If you are angry because I have spoken against the temple and the city of the Lord, and the safety of the city and of the temple is your concern, why do you add sins to sins and make both the city and its inhabitants guilty of my blood?' If, then, at any time we too have need of humility because of the straits of necessity, let us so take it up that we do not desert truth and steadfastness; for it is one thing proudly to insult the one who judges, which is a sign of folly, another so to avoid the impending danger that you subtract nothing from the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
