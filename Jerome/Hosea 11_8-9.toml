[[commentary]]
quote='''
To the heretics also, and to the people deceived by them, the Lord says that unless they repent they will be set as Admah and Zeboiim, so as to have no hope of salvation. Again, as a most merciful father, he says that he changes his sentence and repents of having said such things, so as to call them too to conversion and to repentance. I will not act, he says, in my fury, I will not destroy Ephraim. As far, he says, as lies in me, as far as I desire, if he corrects his error by the truth, if he loves me more than the leaders of heresy; God, indeed, am I, and not man: I will stretch out my hand to the fallen, I will call the wandering to salvation. And because I am holy, for that reason I will not enter the city, that is, the conventicles and cities of the heretics. Those who go out of their cities I gladly receive; into their cities I will not enter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
