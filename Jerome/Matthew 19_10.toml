[[commentary]]
quote='''
A wife is a grievous burden, if it is not permitted to put her away except for the cause of fornication. For what if she be a drunkard, an evil temper, or of evil habits, is she to be kept? The Apostles, perceiving this burden someness, express what they feel; His disciples say unto him, If the case of the man be so with his wife, it is not good to marry.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The disciples say to him: If such is the case of a man with his wife, it is not expedient to marry. Heavy is the burden of wives, if it is not lawful to put them away except for the cause of fornication. For what if she is a drunkard, if irascible, if of bad morals, if wanton, if gluttonous, if a gadabout, if quarrelsome and abusive, must such a one be kept? Willing or unwilling, she must be borne. For when we were free, we subjected ourselves to servitude of our own will. The apostles, then, seeing the heavy yoke of wives, utter the feeling of their mind and say: If such is the case of a man with his wife, it is not expedient to marry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
