[[commentary]]
quote='''
And it shall be in that day, says the Lord: The sun shall set at midday, and I will make the earth grow dark in the day of light; and I will turn your festivals into mourning and all your songs into lamentation; and I will bring sackcloth upon every back of yours and baldness upon every head; and I will make it like the mourning for an only son, and its last end like a bitter day. LXX: And it shall be in that day, says the Lord God: The sun shall set at midday, and the light shall grow dark upon the earth in the day; and I will turn your solemnities into mourning and all your songs into lamentation; and I will bring sackcloth upon every loin and baldness upon every head; and I will make it like the mourning for a beloved one, and those who are with him like a day of grief. By that day he means the day of captivity, when both peoples will be led away to the Assyrians and the Chaldeans; for whom, from the greatness of their sorrow, the sun will set at midday, and while the light is clear for all, darkness will fill everything; when their festivals and all their songs were turned into mourning and lamentation, and upon every back, or loins, they were girded with haircloth, and, according to the custom of mourners of old, they had baldness on their heads, which we read that Job also did at the deaths of his children. And so great will be the greatness of the mourning and sorrow that it will surpass the grief for an only son, dying, and very dear to his mother, and all things will be filled with lamentation and bitterness. We can also understand this passage of the Lord's passion, when the sun at the sixth hour drew back its rays and did not dare to look upon its Lord hanging on the cross; when, as darkness filled everything, their festivals and songs, with Vespasian and Titus prevailing, were changed into mourning and lamentation; when all things were filled with tears and remorse and haircloth, and their heads had baldness, which before, adorned with the long hair of the Nazirites, had grown their locks for the Lord. Then the first-born son of God, the people of Israel, which had laid its hand upon the Only-begotten and true Son of God, was handed over to eternal mourning; and its last end, or those who were with it, were filled with bitterness. Now therefore, while they have darkness, who drove back the sun of righteousness, we who sat in darkness and in the shadow of death have seen a great light, and their whole festival has been transferred to the mysteries of the Church, so that while they weep, we sing praises together to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
