[[commentary]]
quote='''
They have all abandoned him. There is no one who speaks well and does penance for his sins. They follow their own wills like a horse ready for battle. They bend their tongue as a bow. They invent everything, and there is no truth in them.
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="Against the Pelagians 2.26"

[[commentary]]
quote='''
Why then has this people in Jerusalem turned away with a contentious turning away? They have laid hold of falsehood and they would not return? 'The more I,' he says, 'called them to repentance, the more they withdrew from me, not so much from eagerness to sin as from eagerness to overcome me. For they have laid hold firmly of falsehood, whether idols or whatever perverse things are contrary to truth and righteousness, and they would not return' — he did not say 'they could not' —, 'but with all eagerness they have pursued wicked things'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
