[[commentary]]
quote='''
There follows: Among you the doors shall be shut, namely those of the Father, and of the Son, and of the Holy Spirit. Hence the Savior says: I am the door. Or otherwise: The doors of the Scriptures will not be opened to you, nor will you be able to look into the holy of holies, nor to know the mysteries of the Lord, nor to kindle his incense at the altar, because your prayers will not reach him. And this word which is said δωρεὰν, and which we have translated gratuitously, those who follow the understanding we are now setting out turn into grace, namely that they do not have the grace of serving the altar of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
