[[commentary]]
quote='''
But then indeed, not knowing God, you served those who by nature were not gods. But now, knowing God, or rather being known by him, how is it that you turn again to the weak and needy elements, which you wish to serve once more?

He rebukes the Galatians, whom they had brought over from the worship of idols to faith in the true God: how is it that, having abandoned the idols, which by nature were not gods, and knowing God, or rather being known by him, and having also received the spirit of adoption, they are once more, as if they were little children, and desiring to be under guardians and a pedagogue, going back to the weak and poor elements, which were given in the desert to the people for this reason, because of its weak and poor understanding, since it could not receive and bear greater things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
