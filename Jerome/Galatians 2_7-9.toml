[[commentary]]
quote='''
But on the contrary, when they had seen that the Gospel of the uncircumcision was entrusted to me, as that of the circumcision to Peter. For he who worked in Peter for the apostleship of the circumcision worked also in me among the Gentiles. And when they had recognized the grace that was given to me, Peter and James and John, who seemed to be pillars, gave to me and to Barnabas the right hands of fellowship: that we should go to the Gentiles, and they themselves to the circumcision.

It is a ὑπέρβατον (hyperbaton, a transposition of word order), and once the many things inserted in the middle are removed, it can be read briefly thus: For those who seemed to be conferred nothing on me; but on the contrary they gave to me and to Barnabas the right hands of fellowship. Or certainly that hidden sense, free of any boasting of himself, is this: Those who seemed to be something conferred nothing on me; but on the contrary something was conferred on them by me, while they become firmer in the grace of the Gospel. But the whole of what he says is this: one and the same entrusted the Gospel of the uncircumcision to me, and that of the circumcision to Peter. He sent me to the Gentiles; he placed him in Judaea. For neither could the Gentiles, already of adult age, be tormented by the pain of circumcision, which would profit them nothing, and abstain from foods to which they had always been accustomed and which God had created for use; nor could those who had believed from among the Jews and were circumcised, and who, out of custom, as if it were a second nature, thought that they had something more than the other nations, easily despise the things in which they gloried. And so by the providence of God one apostle was given to the circumcised, who might seem to acquiesce in the shadows of the Law, and another to those placed in uncircumcision, who would not think the grace of the Gospel to be slavery, but free faith; lest on some pretext a hindrance to faith should arise, and on account of circumcision or uncircumcision men should not believe in Christ. Nor do we say this as though Peter, who also himself testified in the Acts of the Apostles that no man is common (Acts 10), and who was taught in that vessel which he had seen let down from heaven by its four corners that it makes no difference whether someone is a Jew or a Gentile, had, as if forgetful of his former understanding, thought the Law was to be observed over and above the grace of the Gospel; but rather that he too, pretending to keep the Law, might little by little lead the Jews away from their ancient manner of living. For they could not suddenly despise, as refuse and loss, so great a labor of observance and the most scrupulous conduct of their old life. From this we perceive that the right hands of fellowship were given to Paul and Barnabas by Peter, James and John for this reason: lest, through a differing observance, the Gospel of Christ should be thought to be diverse; but that there should be one communion both of the circumcised and of those who have the uncircumcision. And he has prepared the ground beautifully, saying: For he who worked in Peter for the apostleship of the circumcision: lest anyone should think that he was disparaging Peter; but rather so that, his praises having been set forth beforehand, it might be understood that Peter for this reason took up circumcision in some measure, that he might gain those from among the Jews who had been entrusted to him, and keep them in the faith and Gospel of Christ. He also implies that if Peter did this without fault, even by observing for a time what is not lawful, lest he lose those entrusted to him, all the more ought he himself, for the truth of the Gospel, to do what was entrusted to him in the uncircumcision, lest the Gentiles, frightened off by the burden and difficulty of the Law, should depart from the faith and belief of Christ. Here a hidden question arises: What then? If Peter had found any from among the Gentiles, did he not bring them to the faith? Or if Paul had come upon some from the circumcision, did he not call them to the baptism of Christ? It is resolved thus: we say that to each one a principal charge was given, toward the Jews and toward the Gentiles, so that those who defended the Law should have someone to follow, and those who preferred grace to the Law should not lack a teacher and guide. But they had this purpose in common, to gather a Church for Christ out of all the nations. For we read both that the Gentile Cornelius was baptized by holy Peter, and that Christ was very often preached by Paul in the synagogues of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
