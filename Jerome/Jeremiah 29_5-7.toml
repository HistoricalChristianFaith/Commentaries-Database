[[commentary]]
quote='''
But he admonishes them not with his own words but with the Lord's, that they should build houses and dwell in them, and plant gardens or orchards and eat their fruit, take wives and beget sons and daughters, and multiply in the place of exile and not be few in number, and seek the peace of the city or land to which the Lord had carried them over, and pray for it to the Lord. And giving the reasons he says: 'for in the peace of that land there will be peace for you'. To Jeremiah, because captivity was to overtake Jerusalem after a short time, it is commanded that he not take a wife, that he not beget sons. Hence to us also it is said through the Apostle: the time has been shortened; it remains that those who have wives be as though they had none. But if, because of the narrowness of the time, the use of wives is taken away from those who have them, how much more is it commanded to those who do not have them that they not take them! Now the prophet's prophecy commands all this so that they may not give in to the false prophets, who were promising them a return to Jerusalem after a short time, but that they may know that they will stay a long time in Babylon, so that they ought to take wives, plant orchards and sow gardens, build houses and beget sons. And in what he added: seek the peace of the city or of the land, and again: for in its peace there will be peace for you, that saying of the Apostle is confirmed in which he enjoins: I beseech therefore, first of all, that supplications, prayers, intercessions, thanksgivings be made for all men, for kings and all who are in high station, that we may lead a quiet and tranquil life in all piety and chastity. Further, according to the mystical senses: after we have been cast out of Jerusalem, that is, the Church, because of our sins, and handed over to Nebuchadnezzar — of whom the same Apostle says: 'I have handed over such a one to Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord' and again: whom I have handed over to Satan, that they may learn not to blaspheme —, we ought not to be secure, nor, sluggish with idleness, to despair utterly of salvation, but first to build houses — not upon sand, but upon rock — and such houses as the midwives too built in Exodus, because they feared the Lord; Then to plant gardens or orchards, such a paradise as the Lord too planted in Eden, and set in it the tree of life, of which it is written: it is a tree of life to those who lay hold of her; and he who holds her fast, blessed; third, to take wives, of whom one is wisdom, of whom Solomon writes: love her, and she will keep you; encircle her, and she will exalt you, and in another place: her I sought to take as a bride for myself, and I became a lover of her beauty. Nor does one spouse, wisdom, suffice us, unless we have the rest also: fortitude, temperance and righteousness, so that from them we may beget more sons. Let us also give our daughters to husbands, so that the truth of faith, which is understood in the sons, may be coupled with good works, which are referred to the daughters, and good works may be joined to the soundness of faith. And begetting such sons and daughters, let us be multiplied in number, so that, putting away the things of a little child and growing up to the perfect man, we may deserve to hear: I write to you, fathers, because you have known him who is from the beginning, and may say with the Apostle to our children: for in Christ Jesus through the Gospel I have begotten you. Let us also seek peace for the Church, our city and our land, so that we may deserve to return to it, from which by the Lord's judgment we have been carried over to dwell in the error of 'confusion'; for if it receives us, we shall have peace. And at the same time the clemency of the Lord is to be considered: he commands us to pray for our enemies and to do good to those who persecute us, so that we may not be content with our own salvation only, but may seek the salvation of our enemies also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
