[[commentary]]
quote='''
Having declared that of that hour knoweth no man, but the Father only, He shows that it was not expedient for the Apostles to know, that being ignorant they might live in perpetual expectation of His coming, and thus concluding the whole, He says, Watch therefore, &c. And He does not say, 'Because we know not,' but Because ye know not, showing that He Himself is not ignorant of the day of judgment.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Watch therefore, because you do not know at what hour your Lord is to come. He shows clearly why he said above: But of that day no one knows, neither the Son of Man nor the angels, but the Father alone, namely because it is not expedient for the apostles to know, so that, in the uncertainty of a suspended expectation, they may always believe that he is about to come of whom they do not know when he will come. And he did not say: because we do not know at what hour the Lord is to come, but you do not know, and having set forth the example of the householder, he teaches more plainly why he keeps silent about the day of the consummation, saying:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
