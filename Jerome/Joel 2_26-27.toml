[[commentary]]
quote='''
Then you will eat the fruits of righteousness, and be filled, and praise the name of the Lord your God, who has done wonders with you. But if after repentance God promises such plenty of all things, what will Novatus answer, who denies repentance, and that sinners can be restored to their former state, if they do works worthy of repentance? For God receives the penitent to such a degree that he calls them his people, and declares that they are by no means to be confounded, and promises that he will dwell in their midst, and that they will no longer have another God, but will trust with their whole mind in him who abides in them forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
