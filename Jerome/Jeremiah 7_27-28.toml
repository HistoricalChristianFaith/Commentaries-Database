[[commentary]]
quote='''
And you will speak to them all these words, and they will not hear you; and you will call them, and they will not answer you. And you will say to them: This is the nation that has not heard the voice of the Lord its God nor received discipline; faith has perished and has been taken away from their mouth. 'Do not doubt,' he says, 'that they have hardened their neck and wrought worse than their fathers; behold, I give room for repentance, and I do not speak in order that these things may happen, but because they are going to happen, therefore I foretell them. At least now speak to them with my words, and yet they will not hear you; and you will call them, and they will not answer you; for they will be of such pride that, when you call them to hear, no one will deign to answer. And you will say to them: This is the nation that has not heard the voice of the Lord its God nor received discipline'. Beautifully, as I have already said before, he calls them not at all his people, but a nation. And although this was in part done in the time of the prophets too, and went before in shadow and in image, yet it is more fully fulfilled in Christ, when they refused to receive discipline and despised the voice of their Lord. Hence it is fittingly added: faith has perished, which belongs properly to Christians, and has been taken away from their mouth, namely every confession of the Son of God and of the faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
