[[commentary]]
quote='''
Woe to him who gathers an evil avarice for his house, so that his nest may be on high, and who thinks he is freed from the hand of evil. You have devised confusion for your house, you have cut down many peoples, and your soul has sinned. For the stone will cry out from the wall, and the timber that is between the joints of the buildings will answer. LXX: O he who multiplies an evil avarice for his house, so as to set his nest on high, and to be rescued from the hand of evils. You have devised confusion for your house, you have consumed many peoples; and your soul has sinned, for which reason the stone will cry out from the wall, and the beetle from the wood will speak these things. The discourse is still addressed to him who heaps up evils for himself and does not understand that the multitude of his riches is the cause of the ruin of his house; and at the same time, through a metaphor, he is accused of pride, because, like the birds, he has set his nest on high, and has thought that he would be rescued from the hand of evil, that is, that he would never come into the power of his enemies; a counsel of pride and an arrogant thought which had ignominy as its end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
What their translation means we shall say in the exposition of the Seventy translators, in whom O is put for woe, and the discourse is directed either to the devil or to the Antichrist, or to the heretics, who multiply an evil avarice for themselves. Now avarice is called evil to distinguish it from good avarice, so that there is a good avarice of the churchly teacher, who is never sated with the multitude of his followers, and the more disciples he has, the more he is roused to zeal for teaching. Woe, therefore, to him who multiplies for himself a most wicked avarice, so as to gather perverse conventicles for his house, and to set his nest on high, so as to be rescued from the hand of evils. For the devil and the Antichrist and the heretics promise that those who accept their doctrine will be in the heavenly places and will possess the kingdoms of heaven, and will not feel the fires of Gehenna.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
