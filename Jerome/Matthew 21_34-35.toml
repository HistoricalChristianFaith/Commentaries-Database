[[commentary]]
quote='''
And when the time of fruits drew near, he sent his servants to the farmers to receive its fruits; and the farmers, seizing his servants, beat one, killed another, and stoned another. He had given them the law and had ordered them to work in this vineyard, so that they might show the fruit of the law in works. Afterward he sent servants to them, whom they seized and either beat, like Jeremiah, or killed, like Isaiah, or stoned, like Naboth and Zechariah, whom they slew between the temple and the altar. Let us read Paul's letter to the Hebrews, and from it we learn most fully which of the Lord's servants suffered how much.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
