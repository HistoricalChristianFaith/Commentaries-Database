[[commentary]]
quote='''
Before the sun is darkened, and the light, and the moon, and the stars, and the clouds return after the rain. If we take it of the general consummation of the world, this passage agrees with the words of the Lord, in which he says: There will be tribulation and distress such as has not been from the beginning of creation, nor will be. For the sun will be darkened and the moon will not give its light and the stars will fall from heaven, and the powers of the heavens will be moved. These are the keepers of the house: so that the house is understood as this world, while the strong men are those deceived by error, namely the opposing powers that are to be scattered. But if the particular consummation of each one is meant, it refers to the end of this life; and the sun and the moon and the stars and the clouds and the rains will cease to be for him who has died.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
