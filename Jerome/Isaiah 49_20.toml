[[commentary]]
quote='''
And the sons of your barrenness, whom you thought you had utterly lost, and by them to have been widowed, shall say in your ears: The place is too narrow for me in the synagogues, make room for me in the Churches, to dwell more widely, so that I may not be crushed by the blasphemies of the Jews, so that your breadth may hold the whole world together with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
