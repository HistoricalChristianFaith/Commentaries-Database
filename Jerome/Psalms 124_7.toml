[[commentary]]
quote='''
The fourth punishment of those in discord is that they are caught in the snare, which is set not in heaven but on the earth; the saint glories in having escaped it, and says: Our soul, like a sparrow, has been snatched from the snare of the hunters; the snare is broken, and we are set free. This is the broken snare of which the Apostle speaks to believers: God will crush Satan under your feet swiftly. And again we read in David: Beside the path they have set a stumbling block for me. For they cannot deceive any of the simple among believers unless they put forward the name of Christ, so that, while we think we are finding Christ, we go on to the Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
For he himself will free me from the snare of the hunters. "Our soul, like a sparrow, has been snatched from the snare of the hunters: the snare has been broken, and we have been set free." What is this snare that has been broken? "The Lord," he says, "will crush Satan under our feet speedily." And the apostle says: "That you may be freed from the snare of the devil." You see, therefore, that this is a hunter, who desires to hunt our souls to their destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_020.html'
source_title="Homily 20, on Psalm 90"

[[commentary]]
quote='''
I will hope in Him, for He Himself shall deliver me from the snare of the hunters. In this world there are many hunters who long to capture our souls, just as is said by the prophet: "Our soul has been snatched away like a sparrow from the snare of the hunters." Now that hunters are taken in a sinister sense in the holy Scriptures, we have already said often. For that Nimrod, the giant, always a rebel against God, was a hunter. Esau too was a hunter. For He Himself shall deliver me from the snare of the hunters. We read in Proverbs: "The eye of the harlot is the snare of the sinner." "For whoever shall look upon a woman to lust after her has already committed adultery with her in his heart." As many as are the sins, so many are the snares; as many as the snares, so many the hunters. The doctrines of the heretics are the snares of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_068.html'
source_title="Homily 68, on Psalm 90 (Alternate Series)"
