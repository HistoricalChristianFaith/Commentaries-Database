[[commentary]]
quote='''
The fourth punishment of those in discord is that they are caught in the snare, which is set not in heaven but on the earth; the saint glories in having escaped it, and says: Our soul, like a sparrow, has been snatched from the snare of the hunters; the snare is broken, and we are set free. This is the broken snare of which the Apostle speaks to believers: God will crush Satan under your feet swiftly. And again we read in David: Beside the path they have set a stumbling block for me. For they cannot deceive any of the simple among believers unless they put forward the name of Christ, so that, while we think we are finding Christ, we go on to the Antichrist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
