[[commentary]]
quote='''
And then you who now blaspheme and say: What profit is it that we have kept his commandments, and have walked sorrowful before the Lord? will recognize your own misery too from their election and blessedness, and, turned to repentance, you will see what difference there is between the just and the impious, and between him who serves God and him who does not serve him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
