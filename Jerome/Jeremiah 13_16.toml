[[commentary]]
quote='''
Give glory to the Lord our God, before it grows dark and before your feet stumble upon the misty — or dark — mountains! You will wait for light, and there will be the shadow of death, and they will be placed in darkness — or, according to the Hebrew: and he will set it in the shadow of death and in gloom —. But if you do not hear, in secret the soul will weep, mine — or yours — before the face of pride or injury. Those to whom the divine word had said: Hear and perceive with your ears and do not be lifted up, he now calls to repentance, that, before they are led to Babylon and their feet stumble upon the dark or misty mountains, they should give glory to God. Hence sinners too are often told: Give glory to God! And that Babylon and the whole region of the Chaldeans are called misty or dark mountains we read at the beginning of Isaiah, against Babylon, where it is written: Upon the misty mountain lift up a sign, which in Hebrew is called 'neseptha'. This therefore he commands: that, before they are led into captivity and feel the evils of servitude, they should do repentance, since, when they wait for light, they are to sit in darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
