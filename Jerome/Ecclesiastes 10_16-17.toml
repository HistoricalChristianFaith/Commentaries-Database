[[commentary]]
quote='''
Of these we read in Ecclesiastes too: Woe to you, O city, whose king is a youth, and your princes eat in the morning. Blessed is the land whose king is a son of the freeborn (Eccl 10:16). Such a young king was Rehoboam the son of Solomon, who followed the counsels of the young men (1 Kgs 12): not that he was young in age, but in wisdom. Otherwise, he is related to have received the kingdom at forty years and more. And on the contrary, Solomon was twelve years old when he took up the rule, and because he had wisdom, he was therefore not called a youth. For there was in him breadth of heart and amplitude of wisdom as great as the sand on the shores of the sea. Hence the Apostle too writes to Timothy: Let no one despise your youth (1 Tim 4:12). For he who is young in age is an old man in maturity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
