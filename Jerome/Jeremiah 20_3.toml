[[commentary]]
quote='''
And when it had dawned on the morrow, Pashhur brought Jeremiah out of the stocks, and Jeremiah said to him: Not Pashhur has the Lord called your name, but terror on every side. Here too all have likewise translated both the name of the high priest and the kind of torture as above. And the name of the high priest is changed so that from the name the punishment of things to come may be shown. 'By no means,' he says, 'will you have blackness of mouth and the rule of unjust power, but you will be led captive to Babylon — for this is what 'terror on every side' or 'round about' signifies —, 'so that, trembling and uncertain of your own safety, you may look around this way and that and dread the adversaries coming against you.' For 'terror', which in the Hebrew is written 'magur', the Seventy and Theodotion translated metoikon, that is 'migrant'; Aquila's second edition 'stranger', the first 'looking around'; Symmachus 'carried off' or 'gathered' and 'compelled'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
