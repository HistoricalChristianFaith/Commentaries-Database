[[commentary]]
quote='''
And he shall take away from their mouth the blood, words of blasphemy, and the abominations, the worship of idols and the eating of things sacrificed to idols, from between their teeth, so that, after these have been taken away, the Philistines themselves, that is, the foreigners, may be left to the Lord, and may be a leader in Judah, that is, among the people that confesses the Lord, so that the former people which was at the head may be turned into the tail, and the last, which was at the tail, may pass to the head; and that Ekron, once barren and for that reason uprooted, may be as Jebus, that is, as Jerusalem. For this city is called by three names, Jebus, Salem and Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
