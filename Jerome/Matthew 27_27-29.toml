[[commentary]]
quote='''
He had been styled King of the Jews, and the Scribes and Priests had brought this charge against Him, that He claimed sovereignty over the Jewish nation; hence this mockery of the soldiers, taking away His own garments, they put on Him a scarlet cloak to represent that purple fringe which kings of old used to wear, for the diadem they put on Him a crown of thorns, and for the regal sceptre give Him a reed, and perform adoration to Him as to a king.

All these things we may understand mystically. For as Caiaphas said that it is expedient that one man should die for the people, (John 11:50.) not knowing what he said, so these, in all they did, furnished sacraments to us who believe, though they did them with other intention. In the scarlet robe He bears the bloody works of the Gentiles; by the crown of thorns He takes away the ancient curse; with the reed He destroys poisonous animals; or He held the reed in His hand wherewith to write down the sacrilege of the Jews.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then the soldiers of the governor, taking Jesus into the praetorium, gathered the whole cohort to him; and stripping him, they put a scarlet cloak around him, and plaiting a crown of thorns they put it on his head, and a reed in his right hand, and bending the knee before him they mocked him, saying: Hail, king of the Jews. The soldiers indeed, because he had been called king of the Jews, and the scribes and priests had laid this charge against him, that he was usurping rule for himself among the people of Israel, do this in mockery: having stripped him of his former garments, they clothe him in a scarlet cloak in place of the red border which the ancient kings used to wear, and in place of a diadem they put on him a thorny crown, in place of a royal scepter they give him a reed, and they worship him as a king. But let us understand all these things mystically. For just as Caiaphas said: It is necessary that one man die for all, not knowing what he said, so these too, whatever they did, although they did it with another mind, were nevertheless bestowing mysteries on us who believe. In the scarlet cloak he bears up the bloody works of the Gentiles; in the crown of thorns he dissolves the ancient curse; with the reed he kills venomous animals; or else he held the reed in his hand to write down the sacrilege of the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
