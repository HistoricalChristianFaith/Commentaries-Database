[[commentary]]
quote='''
For this reason God says of Jerusalem too: Behold, I will lead her astray, and I will make her like a desert, and set her like a land without water, and I will speak to her heart; and I will give her possessions from there, and the valley of Achor to open understanding (Hos 2:14, 15). Let us consider the order of each thing: he leads her astray, and makes her deserted and without water, so that she may suffer thirst for the virtues. After she has said, My soul has thirsted for you, how many ways my flesh for you (Ps 62 [63]:2), then he will speak to her heart and console her as she mourns. And he will give her a possession from there, that is, from the repentance and sorrow which works salvation. And the humility of her troubled heart (for this is what the valley of Achor means) opens her understanding, so that she may not be ignorant of her Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Therefore, behold, I will allure her; and I will lead her into the wilderness, and I will speak to her heart. And I will give her her vinedressers from the same place, and the valley of Achor to open up hope. LXX: Therefore, behold, I will lead her astray and will make her like a desert; and I will speak to her heart and give her her possessions from there, and the valley of Achor to open up her understanding. Where we said to open up hope, and the LXX rendered to open up her understanding, Symmachus interpreted εἰς θύραν ἐλπίδος, that is, into a door of hope, Theodotion διανοῖξαι τὴν ὑπομονὴν αὐτῆς, that is, to open up her patience, or her expectation. After the disgrace of Jerusalem, or of Judea the harlot, has been uncovered in the eyes of her lovers, and every solemnity has ceased, and drought or hail has spoiled the vineyard and the fig tree, and, reduced to woods and fruitless trees, she has been devoured by beasts, and the Lord has repaid her with tortures and torments, because she had burned frankincense to the demons, the Baalim, and she thinks that she can by no means rise again any more from the ashes and embers, then, that is, at the coming of Christ his Son, he will open the hope of salvation, and give room for repentance, and will caress her; for this is what I will allure her means; so as to soften her former pains, after the greatness of her punishments, by the promise of prosperity. And I will lead her, he says, into the wilderness, that is, I will lead her out of evils, just as I had earlier led her out of Egyptian slavery; and I will speak to her heart soft words, words of comfort, so as to temper sadness with joy, according to the idiom of the Scriptures, in which words Shechem too spoke to the heart of Dinah, and Joseph in Egypt to his brothers, who were sad and afraid, so that grief might be changed into joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
These things the circumcision and our own Judaizers refer to the reign of a thousand years, things which we see fulfilled in the beginning through the apostles as vinedressers and the many thousands of believers from Israel, and being fulfilled daily in those who are willing to believe. And where we said, I will allure her, and the LXX interpreted, I will lead her astray, they refer it to the time of the Antichrist, so that those who did not receive the truth of Christ may receive that one's lie, and afterwards, when Christ comes, may be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
