[[commentary]]
quote='''
For this reason God says of Jerusalem too: Behold, I will lead her astray, and I will make her like a desert, and set her like a land without water, and I will speak to her heart; and I will give her possessions from there, and the valley of Achor to open understanding (Hos 2:14, 15). Let us consider the order of each thing: he leads her astray, and makes her deserted and without water, so that she may suffer thirst for the virtues. After she has said, My soul has thirsted for you, how many ways my flesh for you (Ps 62 [63]:2), then he will speak to her heart and console her as she mourns. And he will give her a possession from there, that is, from the repentance and sorrow which works salvation. And the humility of her troubled heart (for this is what the valley of Achor means) opens her understanding, so that she may not be ignorant of her Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
