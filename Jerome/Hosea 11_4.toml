[[commentary]]
quote='''
And I healed them because of the cords and bonds of love with which I had bound Abraham, Isaac and Jacob to myself. For in place of Adam, Aquila and Symmachus and the Seventy and Theodotion translated all men, so as to say: with the cords of men I will draw them, with the bonds of love. And what follows, I will be to them as one who lifts the yoke, for which Symmachus translated: and they thought that I was putting a yoke upon their jaw, is taken in two ways: either I took from them the yoke of all the nations round about, or they thought my law a most heavy weight of a yoke. And I gave him manna as food in the desert, for him to eat; for this is what he says: and I inclined toward him that he might eat; for which Symmachus translated: and I inclined food toward him. Not that God inclined toward him, but that he made the food of manna incline toward him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Hence, in the corruption of men, that is, of the teachers who had deceived them, I extended the warmth of faith to those contracted by the cold of faithlessness, and bound them, resisting as they were, with the bonds of my love. And because they did not run of their own accord, but were dragged along bound with ropes, I struck their jaws a little with slaps, not punishing but correcting and amending. A judge tears the flesh, tortures with cords, torments with scourges and fire. But he who is a father strikes his wanton son with the palm of the hand. And he finely did not say: I will be beating them with slaps, but: as a man striking the jaws with the hand. And God strikes his straying sons with the threat of punishments, with the reading of the Gospel and the testimonies of the prophets. And when he has so struck on the jaw as to knock the bread and doctrine of the heretics out of the polluted mouth, then he looks upon him, while the beaten son says to him: Look upon me and have mercy on me. And again: Look and hear me, O Lord my God. And when he has looked upon him, he will prevail, or it will profit them, that is, he will overcome the adversaries and make servants out of runaways. Or he will give true and sweet food to those who formerly devoured the lies and most bitter food of the heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
