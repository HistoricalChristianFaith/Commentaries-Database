[[commentary]]
quote='''
The peacemakers (pacifici) are pronounced blessed, they namely who make peace first within their own hearts, then between brethren at variance. For what avails it to make peace between others, while in your own heart are wars of rebellious vices.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are the peacemakers. Those who make peace first in their own heart, then among brothers at variance. For what does it profit that others are brought to peace through you, when in your own mind there are wars of vices?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
[[commentary]]
quote='''
Blessed are the peacemakers: not only those who make peace between quarrelers, but those who make peace within themselves. Blessed are the peacemakers. If others quarrel, and I intervene in the middle, and make peace between them, and I myself do not have peace in my mind: what does it profit me, that they have made peace? 'Blessed are the peacemakers, for they shall be called the children of God.' Blessed are the peacemakers, who indeed speak peaceable things to those who hate peace. Blessed are the peacemakers. Christ is peace. For if Solomon is interpreted in Christ, and Solomon is interpreted as peaceable: then Christ our Lord is peace. Going to heaven he left us a standard, saying: 'My peace I give to you, my peace I leave to you.' Let us keep what Christ has given, let us have peace, let us keep peace, and it keeps us in Christ Jesus: to whom is glory forever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"
