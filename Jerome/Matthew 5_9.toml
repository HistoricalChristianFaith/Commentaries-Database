[[commentary]]
quote='''
The peacemakers (pacifici) are pronounced blessed, they namely who make peace first within their own hearts, then between brethren at variance. For what avails it to make peace between others, while in your own heart are wars of rebellious vices.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Blessed are the peacemakers. Those who make peace first in their own heart, then among brothers at variance. For what does it profit that others are brought to peace through you, when in your own mind there are wars of vices?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
