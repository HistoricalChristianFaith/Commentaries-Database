[[commentary]]
quote='''
You will seek and you will find me, when you seek with your whole heart, in accordance with that saying of the Gospel: ask, and you will receive; seek, and you will find; knock, and it will be opened to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
