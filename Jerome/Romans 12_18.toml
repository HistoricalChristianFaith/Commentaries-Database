[[commentary]]
quote='''
He, then, who is not at peace with his brother, this man is not within the borders of Jerusalem. Let someone say: What am I to do? My brother does not want to be reconciled with me — am I then outside the borders of Jerusalem? As much as it lies in you, he says, having peace with all men. With those who hated peace, I was peaceable. You, keep the peace: if another is angry, he has war, and through his war peace is born for you. Do you want to know how there can be both war and peace? The wretched Judas was coming to the betrayal, and the Lord offers him peace by a kiss: he creates war out of the kiss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_057.html'
source_title="Homily 57, on Psalm 147"
