[[commentary]]
quote='''
He trusts in the Lord and will be compared to that tree of which it is sung also in the first Psalm: and he will be like a tree that has been planted beside the courses of waters, which will give its fruit in its season; and its leaf will not fall off. Upon the waters, moreover: the grace of the Holy Spirit, its diverse gifts. That sends out its roots toward moisture: that it may receive fruitfulness from the Lord; but we can also say otherwise, that we have been transplanted from the Jewish dryness into the everlasting grace of baptism. And it will not, he says, fear when the heat comes — either the time of persecution or the day of judgment — ; and its leaf will be green — or there will be twigs in leaf on it —, so that it never fears dryness, but buds with the grace of all the virtues. And when the time or the year of dryness comes, it will not be afraid, when the Lord in anger commands the clouds not to rain a shower upon Israel. And what follows, nor will it cease to bear fruit, will be able to explain that passage which is written in Mark, that the Lord came to the fig tree and did not find fruit on it, because it was not yet the time, and cursed it, that it should not bear fruit forever. For he who trusts in the Lord, and whose confidence the Lord is, will not be afraid even in the time of the Jewish dryness, but will always bear fruits, believing in him who once died for us and dies no more and says: I am the life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
