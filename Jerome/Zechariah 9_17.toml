[[commentary]]
quote='''
For what is his goodness, and what is his beauty, but the grain of the elect, and wine that makes virgins spring forth? LXX: For if there is anything best of his, and if anything good from him, grain for young men and wine of good odor for virgins. Therefore, they say, the Maccabees, fleeing hither and thither, will overcome with the Lord's help, so that, when the Macedonians have been cast out of the land of Israel, the temple may be cleansed, the precepts of the law may be kept, and the learning of the Scriptures may again make virgins spring forth, that is, peoples believing in one God, who before had been defiled by the worship of idolatry. By the grain of the elect, that is, baurim, they would have us understand not young men, as the Seventy translated, but chosen and learned men, who are found worthy to eat the grain, that is, the law of God. For wine, which in Hebrew is called thiros, Aquila translated οἰνίαν (vintage), which itself also can be referred to the abundance of the vintage. So the Jews think. But we understand the grain of the elect, or of the young men, and the wine that makes virgins spring forth, or the wine of good odor for virgins, as the Lord and Savior, who says in the Gospel: Unless a grain of wheat falling into the earth dies, it remains alone; but if it dies, it bears greater fruit. From this wheat is made that bread which came down from heaven and which strengthens the heart of man. This bread is eaten by those who are strong in Christ, and to whom John the Evangelist speaks: I write to you, young men, because the word of God abides in you, and you are strong, and you have conquered the evil one. He who is the grain of the elect, or of the young men, is himself also the wine that gladdens the heart of man, and it is drunk by those virgins who are holy both in body and in spirit, so that, made drunk and rejoicing, they may follow the Church; and that it may be said of them: Virgins shall be brought to the king after her, her companions shall be brought to you; they shall be brought with gladness and exultation. For how shall they not have gladness, who, made drunk by the cup of the Savior, are begotten into virgins, and dare to say: Bring me into the little chamber of wine, strengthen me with ointments? This wine is of good odor, whence it is said in the same song: You shall give me to drink of the perfumer's wine, of the streams of your pomegranates. With this wine are made drunk those who follow the Lamb of God wherever he goes, clothed in white garments; because they have not defiled themselves with women, for they remained virgins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
