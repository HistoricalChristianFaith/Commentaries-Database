[[commentary]]
quote='''
I have left my house, I have abandoned my inheritance, I have given my beloved soul into the hand of its enemies. My inheritance has become to me like a lion in the forest; it has given forth its voice against me, therefore I have hated it. He who said in the Gospel: Rise, let us go hence, and again: your house shall be left to you deserted, here too, in the prophet, threatens the same things, and says that he has done what he is going to do. For the inheritance of the Lord is Israel, and the cord of his inheritance. And what he says: I have given my beloved soul into the hand of its enemies, is this: I have power to lay down my soul, and I have power to take it up again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
