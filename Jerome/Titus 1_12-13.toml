[[commentary]]
quote='''
Some think the Apostle should be censured for having slipped imprudently, and that, while refuting false teachers, he approved that little verse which says that the Cretans are called deceitful for this reason, that they built an empty tomb of Jupiter. For if, they say, Epimenides or Callimachus charge the Cretans with being deceitful, evil beasts and idle bellies for this reason, that they do not perceive divine things and imagine that Jupiter, who reigns in heaven, is buried in their island; and if what they said is proved true by the Apostle's judgment, it follows that Jupiter is not dead but alive. Ignorantly, then, did Paul, the destroyer of idolatry, while dealing with perverse teachers, assert the gods whom he was attacking. To these we must reply briefly: just as in his saying, Depraved conversations corrupt good morals, and in that other, For we are also his offspring, he did not at once approve the whole comedy of Menander and the book of Aratus, but made use of the fitness of the little verse; so too in the present passage he did not, through one little verse, confirm the whole work of Callimachus or Epimenides, of whom the one sings the praises of Jupiter, the other writes about Oracles; but he only rebuked the Cretans as liars for the vice of their race: not because of that opinion for which they were charged by the poets, but because of their inborn readiness to lie, confuting them by the race's own author. But those who think that one who has used a part of a book must follow the whole book seem to me also to receive among the Scriptures of the Church the apocryphon of Enoch, from which the apostle Jude set down a testimony in his Epistle, and many other things which the apostle Paul spoke from hidden writings. For by this argument we could say that, because he said that among the Athenians he worshipped the unknown God whom they had noted on the altar, Paul ought also to follow the other things which had been written on the altar, and to do the things the Athenians did, since he had agreed in part with the Athenians in the worship of the unknown God. Far be it from me to drag an argument and scholastic elegance into calumny. No one is such an assassin, such a parricide, such a poisoner, as not to have done something good at some time. If, then, seeing one good deed of his, I approve it, will the necessity also lie on me of approving his other deeds, which were evil? If an enemy wrangles against us and shouts, will he not speak something of truth amid the words of enmity and quarrel? which is not altogether censured even by us, against whom he speaks. So too Callimachus and Epimenides did not speak truly that Jupiter is a god, and the rest that is contained in their poems, because the Cretans are deceitful; but they spoke truly only in this, that they expressed the inborn vice of lying of the Cretans, who, because they are deceitful, have not therefore never spoken the truth at some time. For Jupiter would not on that account not be a god, if the Cretans spoke truly; but yet, even if they were silent, one who was dead would not have the title of god. Finally, so that we may know that the Apostle spoke against the Cretans not by chance and casually, as one pleases (as those men think), but with consideration and circumspection, and guarding himself on every side: This testimony, he says, is true: not the whole poem from which the testimony was taken, not the entire work, but only this testimony, this little verse in which they are called liars. And surely he who agreed with only one part of a poem must be believed to have refuted the rest. But how the Cretans are marked as liars, and the Galatians as foolish, and Israel as stiff-necked, and each province by its own vice, we have discussed in the Epistle of Paul to the Galatians; and because there is nothing more that we can bring forward here, we are content with that.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
