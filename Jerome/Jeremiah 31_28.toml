[[commentary]]
quote='''
And as at the beginning of Jeremiah it was said to him: 'behold, I have set you this day over nations and over kingdoms, to pluck up and pull down and destroy and scatter and build and plant, — and I watched over them, to do what I threatened, — so', he says, 'now I will watch over them to build and to plant; God's indeed husbandry, God's building you are.' All promises of this kind are thought, according to the Jews and our Judaizers, to be fulfilled in a kingdom of a thousand years. But we, since the Apostle says: I planted, Apollos watered, but God gave the increase, and the prophet Isaiah records that the Savior is the builder of hedges and of houses, maintain that they were fulfilled spiritually at the first coming of Christ — and fulfilled in part, not in whole, because now we see in a mirror and in an enigma, and we do not know as we ought to know; but when that which is perfect has come, then that which is in part will be done away — or at any rate we believe that they are to be fulfilled at the second coming, when the Lord will appear in his majesty and the fullness of the nations has come in, so that all Israel may be saved, and not at all in part, through individuals, but that God may be all in all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
