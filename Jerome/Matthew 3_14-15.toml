[[commentary]]
quote='''
For this is also why he received baptism in the stream of the Jordan as if he were a penitent, though he was free from sins: to teach the rest that they must be cleansed through baptism and be begotten as sons by the new adoption of the Spirit. John the Baptist, by no means understanding this, tried to keep him from coming to the washing, saying: "I ought to be baptized by you" (Matt. 3:14). And at once the mystery is taught: "Permit it now; for thus it befits us to fulfill all righteousness", so that he who had come for the salvation of men should not pass over anything of the manner of life of men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
