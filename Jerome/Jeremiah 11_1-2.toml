[[commentary]]
quote='''
The word that came to Jeremiah from the Lord, saying: Hear the words of this pact — or covenant — and speak to the men of Judah and to the inhabitants of Jerusalem, and you shall say to them: Thus says the Lord, the God of Israel. It is not, indeed, set down in the heading at what time, or under which king and in which year of his, this prophecy was made; but we understand either that it is to be joined to the former prophecy and its time, or certainly that this word of the Lord came to the prophet some interval of time after the former prophecy. It is to be noted, moreover, that the word 'berith' Aquila and Symmachus always translated 'pact', the Seventy and Theodotion 'covenant'. Properly, however, the word is now directed to Jerusalem and to the men of the tribe of Judah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
