[[commentary]]
quote='''
(in Esai. c. 9. 1.) They are said at the first time to be lightened from the burden of sin, because in the country of these two tribes, the Saviour first preached the Gospel; at the last time their faith was increased, most of the Jews remaining in error. By the sea here is meant the Lake of Gennesaret, a lake formed by the waters of the Jordan, on its shores are the towns of Capernaum, Tiberias, Bethsaida, and Corozaim, in which district principally Christ preached. Or, according to the interpretation of those Hebrews who believe in Christ, the two tribes Zabulon and Naphtali were taken captive by the Assyrians, and Galilee was left desert; and the prophet therefore says that it was lightened, because it had before suffered the sins of the people; but afterwards the remaining tribes who dwelt beyond Jordan and in Samaria were led into captivity; and Scripture here means that the region which had been the first to suffer captivity, now was the first to see the light of Christ's preaching. The Nazarenes again interpret that this was the first part of the country that, on the coming of Christ, was freed from the errors of the Pharisees, and after by the Gospel of the Apostle Paul, the preaching was increased or multiplied throughout all the countries of the Gentiles.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We have set down the double edition because the testimony is well known and was used by the Evangelist Matthew: so that either the difference of the translation or the likeness may be recognized. And first it must be noted that the Evangelist Matthew set down this testimony not according to the Seventy but according to the Hebrews. For the Gospel word says: Now when Jesus heard that John had been delivered up, he withdrew into Galilee, and leaving Nazareth he came and dwelt in Capernaum, which is by the sea in the borders of Zebulun and Naphtali: that what was spoken through Isaiah the prophet might be fulfilled, saying: The land of Zebulun and the land of Naphtali, the way of the sea beyond the Jordan, Galilee of the nations: the people that sat in darkness has seen a great light; to those sitting in the region of the shadow of death, light has risen upon them. From that time Jesus began to preach and to say: The kingdom of heaven has drawn near (Matt 4:13ff.). And John the Evangelist relates that Jesus, invited with his disciples to a wedding at Cana of Galilee, did his first sign there, turning water into wine: This beginning of signs Jesus did in Cana of Galilee: and he manifested his glory: and his disciples believed in him (John 2:11). Hence too it is said in the Seventy: Drink this first, act quickly: because the land of Zebulun and the land of Naphtali first saw the miracles of Christ: so that the land which had first seen the Lord doing signs might first drink the draught of faith. And according to the Hebrew it is said to have been lightened at the first time of the burden of sins: because the Savior first preached the Gospel in the regions of the two tribes. Hence too it is said in the sixty-seventh Psalm: Bless the Lord from the fountains of Israel. There is Benjamin the younger (Ps 67 [68]:27-28; Acts 9); Paul the apostle, in ecstasy of mind, who also said elsewhere: whether we are beside ourselves, it is for God (2 Cor 5:13): The princes of Zebulun, the princes of Naphtali, their leaders; because in these tribes were the little villages from which our leaders the Apostles believed. And they believed, according to Symmachus, swiftly, so that, hearing: Come, and I will make you fishers of men (Matt 4:19), they at once left both their father and their boat. But at the last time their faith was made heavy, since very many of the Jews remained in error. And here he calls the sea the lake of Gennesaret, which is formed by the inflowing Jordan; on whose shore Capernaum and Tiberias and Bethsaida and Chorazin are situated: in which region above all the Lord stayed; so that the people which either sat or walked in darkness saw a light, by no means a small one, like that of the other prophets, but a great one, like that of him who says in the Gospel: I am the light of the world (John 8:12). And those who dwelt in the region of the shadow of death, light has risen upon them. Between death and the shadow of death I think the difference is this: that death belongs to those who have gone down to the underworld with dead works: For the soul that sins, it shall die (Ezek 18:20); but the shadow of death belongs to those who, while they sin, have not yet departed from this life: for they can, if they will, do penance. For Galilee of the nations Aquila translated θῖνας of the nations, Symmachus borders of the nations; and by θῖνας we understand mounds of sand, which are either on the shores or on the banks. The Hebrews who believe in Christ set out this place thus: At the first time these two tribes, Zebulun and Naphtali, were captured by the Assyrians and led into the enemy's land; and Galilee was deserted (2 Kgs 15), which the prophet now says was lightened, because it bore the sins of the people. But afterward not only the two tribes, but also the rest, who dwelt beyond the Jordan and in Samaria, were led into captivity (2 Kgs 17 and 18). And this, they say, is what the Scripture now says: that the region whose people was the first to be led into captivity and began to serve the Babylonians, and which before was moving in the darkness of error, itself first saw the light of Christ preaching, and from it the Gospel was sown into all the nations. The Nazaraeans, whose opinion I set down above, try to explain this place thus: When Christ came and his preaching flashed forth, the land of Zebulun and the land of Naphtali was the first to be freed from the errors of the Scribes and Pharisees, and shook off from its neck the most heavy yoke of the Jewish traditions. But afterward, through the Gospel of the Apostle Paul, who was the last of all the Apostles, the preaching was made heavy, that is, multiplied; and the Gospel of Christ shone into the borders of the nations and the way of the whole sea. Finally, the whole world, which before walked or sat in darkness and was held by the chains of idolatry and of death, beheld the clear light of the Gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
