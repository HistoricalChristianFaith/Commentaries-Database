[[commentary]]
quote='''
These rivers, before the earth was moved, lay hidden, and while they were in the veins of the earth they offered no drink to the thirsty. But after the world and all the earth were shaken at the coming of Christ, they suddenly burst forth, and then was fulfilled: He made rivers into a desert, and the outgoings of waters into thirst, a fruitful land into saltness, because of the wickedness of those who dwell in it. He made the desert into pools of water, and the land without water into springs of water, and made the hungry dwell there, and they established a city to dwell in. For after the Lord came into the world, and that was fulfilled which he said in the Gospel: For judgment I came into this world, that those who did not see might see, and those who saw might become blind, then the land of Israel, from which rivers formerly flowed and watered the whole people of Judea, dried up, and its springs were stopped. But the whole world, which was deserted and barren and did not have the waters of the Lord's preaching, was turned into pools of water, and as many teachers as it sent out, so many springs it also had. Nor is it enough for them, that is, for the springs and rivers, to water the peoples of the world; but in each province, gathering into one people those who were hungry and suffered famine of the Word of God, they built up the Church, which is called a city to dwell in, and which the rush of the river makes glad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
