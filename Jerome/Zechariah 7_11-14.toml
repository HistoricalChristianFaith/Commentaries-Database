[[commentary]]
quote='''
We can also refer these things to those who, sinning in the Church, have been cast out of the land of confession, because they would not hear the Lord, and turned a withdrawing shoulder to him, and made their ears heavy, and made their heart adamant. And the indignation of the Lord came upon them, and they were scattered through all the kingdoms of the vices, and their land was made desolate, whether soul or body, not having God as its inhabitant, nor the spirit returning into it. And the land once desirable, which was the lodging of the Trinity, was turned into a desert and a dwelling of dragons. Let us pass quickly over what is plain, so that there may be room for discussion in what is obscure; for we are not writing long and florid treatises, in which a speech that seeks applause plays, but commentaries, whose office is to pass over what is evident and to discuss what is obscure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
