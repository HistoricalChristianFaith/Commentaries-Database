[[commentary]]
quote='''
And he asks how, in the case of those who have the fruits of the spirit, and against whom the Law has ceased to be, the crucifixion of the Lord's flesh is set down as praise, when in Hebrews it is set down as reproach: "Crucifying again in themselves the Son of God, and holding him up to display" (Heb. 6:6). For "crucifying again" there is in the Greek, better, a single compound word, ἀνασταυροῦντες, which we can render "re-crucifying" (recrucifigentes). First, then, it must be noted that to crucify is one thing, to re-crucify another. Next, that to re-crucify the Son of God is not the same thing as to crucify the flesh of Christ with vices and lusts. For the flesh of Christ is not principally and properly the Son of God, but Jesus Christ, who, though he was in the beginning with the Father, God the Word, was made flesh and emptied himself, taking the form of a slave, so that he might crucify the flesh and despoil the principalities and powers, triumphing over them on the tree (Phil. 2), so that that saying of the Apostle might be fulfilled: "For in that he died, he died to sin once" (Rom. 6:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
