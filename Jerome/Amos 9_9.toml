[[commentary]]
quote='''
For behold, I will command, and I will shake the house of Israel among all the nations, as it is shaken in a sieve, and not a pebble shall fall upon the earth. All the sinners of my people shall die by the sword, who say: It will not draw near, and evil will not come upon us. LXX: For behold, I give command, and I will winnow the house of Israel among all the nations, as it is winnowed with a winnowing fan, and no crushing shall fall upon the earth. All the sinners of my people shall die by the sword, who say: It will not draw near, nor will evils come upon us. God, who has measured the waters with his hand, and the heaven with his palm, and encloses the whole earth in his fist, he himself, as befits his greatness, holding the edges of the earth with both hands, will shake it hither and thither like a sieve; so that, while the chaff and the filth of sinners fall to the earth, the pure grain may remain, to be stored in the granaries; or, as the LXX translated, he will hold the winnowing fan in his hand, and will cleanse his threshing floor, and will store the wheat in the granaries, but the chaff he will burn with unquenchable fire; of which he speaks through Jeremiah: What has the chaff to do with the grain, says the Lord? The same thing, under the figure of another parable, is shown by that net which is cast into the sea of this world and draws out fish of every kind, and, when the bad fish have been thrown away, only the good are kept.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
