[[commentary]]
quote='''
In these words the Latin language cannot follow the Greek idiom. For the Latin word 'nubere' is correctly said only of the woman. But we must take it so as to understand marry of men, to be given in marriage of women.

This that is added, But are as the Angels of God in heaven, is an assurance that our conversation in heaven shall be spiritual.

For none could say of a stone and a tree or inanimate things, that they shall not marry nor be given in marriage, but of such things only as having capacity for marriage, shall yet in a sort not marry.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For in the resurrection they will neither marry nor be married. Latin usage does not correspond to the Greek idiom. For properly it is women who are said to wed, and men to take wives. But let us understand it as said simply, so that 'marry' is written of the men and 'be married' of the wives. Thus in the resurrection they will not marry nor be married: therefore bodies will rise which are able to marry and be married. For no one says of a stone or a tree or of those things that have no genital members that they do not marry nor are married, but of those who, though they could marry, yet for another reason do not marry. But as for what is added:

But they are like the angels of God in heaven, a spiritual way of life is promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
