[[commentary]]
quote='''
And you shall swear: the Lord lives, in truth and in judgment and in righteousness, and the nations shall bless him and shall praise him. And how is it that the Gospel forbids us to swear? But here 'you shall swear' is said for confession and for the condemnation of the idols by which Israel used to swear. Accordingly the stumbling blocks are taken away and he swears by the Lord. And as for what is said: the Lord lives, in the Old Testament it is an oath for the condemnation of the dead, by whom all idolatry swears. At the same time it must be noted that an oath has these companions: truth, judgment and righteousness; if these are lacking, it will by no means be an oath, but perjury. 'And when,' he says, 'Israel has done this too, and through the apostles has become the teacher of the nations, then all the nations shall bless, or be blessed, in him, and shall praise him, because salvation has gone forth from Israel'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
