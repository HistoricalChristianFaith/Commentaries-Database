[[commentary]]
quote='''
Astonishment and wonders have come to pass in the land: the prophets prophesied a lie — or wicked things — and the priests clapped with their hands, and my people loved such things! What then will you do at the last — or after these things — ? Above he had said: I will go to the chief men and will speak to them; perhaps they have known the way of the Lord. And behold, these rather have together broken the yoke, they have burst the bonds; now he describes who the chief men are, namely the prophets and the priests, some of whom foretell things to come, while others determine from the law the things to be done. 'And behold,' he says, 'while those men prophesied a lie, the priests clapped with their hands.' And so that it may be shown that the people too is not without fault, which lets itself be led away by such men, it is written: and my people loved such things: once mine, but after it loved them, it ceased to be mine. What then will they do when the last time of judgment has come, or the necessity of captivity? Hence there are astonishment and wonders, because neither among the princes nor among the people was anyone found who thought rightly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
