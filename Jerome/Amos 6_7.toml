[[commentary]]
quote='''
Therefore now they shall migrate at the head of those who migrate, and the faction of the wanton shall be taken away. The Lord God has sworn by his soul; says the Lord God of hosts: I detest the pride of Jacob, and I hate his houses, and I will deliver up the city with its inhabitants. And if ten men remain in one house, they too shall die; and his kinsman shall take him up, and shall burn him, to carry the bones out of the house, and he shall say to the one who is in the inner rooms of the house: Is anyone still with you? And he will answer: It is the end; and he will say to him: Be silent, and do not remember the name of the Lord. LXX: Therefore now they shall be captives from the beginning of the mighty, and the neighing of horses shall be taken away from Ephraim; for the Lord has sworn by himself, says the Lord God of powers: For I will abominate all the insolence of Jacob, and I hate his regions, and I will take away the city with all its inhabitants. And it shall be, if ten men remain in one house, and they die; and his household shall take them up, and shall try to carry their bones out of the house; and they shall say to those who are over the house: Is anyone still with you? And he will say: By no means; and he will say: Be silent, do not name the name of the Lord. For the reasons above which the prophetic word describes — of those who sleep on beds of ivory, and wanton on their couches, and eat lambs from the flock and calves from the midst of the herd, and sing to the sound of the psaltery, and drink in bowls, and are anointed with the best ointment, and moreover suffer nothing over the breaking of his people, which was begotten of the stock of Joseph — the Lord now threatens and says: Because they have done this and this, now they shall migrate at the head of those who migrate. And the sense is: The punishment is by no means put off into the future, nor is it prophesied of ages long after; what now presses upon them, what is now about to come, my word foretells: that they will go at the beginning of those who migrate, namely the princes and the powerful, to whom he had said above: Hear this word, you fat cows, who are on the mountain of Samaria. And again: Woe to you who are wealthy in Zion, and trust in the mountain of Samaria; you nobles, heads of the peoples, entering with pomp the house of Israel. You who are first in riches will be the first to bear the yoke of captivity, according to what is written in Ezekiel: Begin from my sanctuary. Not from the saints, as most people think, but from the overthrow of the temple, which was holy. The mighty indeed shall suffer torments mightily, and from him to whom more is entrusted, more will be required. And there shall be taken away, he says, the faction of the wanton, who had one accord in seizing pleasures, and practised revels and shared feasts; these will be taken away together, so that those whose luxury was one may have one punishment. For this the LXX translated, the neighing of the horse shall be taken away from Ephraim, which is not found in the Hebrew, and will be discussed at length by us when we begin to weave the tropology.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
We have drawn the slender lines of the history; now let us set our hand to the allegory. The princes of the heretics, who for the sake of their delights devoured my people and suffered nothing over the breaking of Joseph, will be the first to be led to punishment, and the neighing of the horse will be taken away from Ephraim, which in the holy Scriptures is taken in two ways: either for the pride and power of those who neigh, or for the greatness of lust. For pride and the conspiracy of the wicked, as there: Some in chariots, and some in horses, and: A horse is deceitful for safety. And the kings of Israel are commanded not to multiply horses for themselves. And in the book of Job the voice of the horse is compared to the blast of the trumpet. In Zechariah too we read, what is confirmed by the testimony of the Gospel and is referred to the presence of the Savior: Rejoice greatly, daughter of Zion, proclaim, daughter of Jerusalem. Behold, your king comes to you, just and a Savior, himself meek, and mounting upon a she-ass and the foal of a she-ass; and he will destroy the four-horse chariots from Ephraim, and the horses from Jerusalem. But for the greatness of lust and the unbridled desire for intercourse, as in Jeremiah, who, describing the luxurious and the adulterers, added: Each one neighed after his neighbour's wife. Such horses the coming of Christ and the wrath of God hamstring.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
