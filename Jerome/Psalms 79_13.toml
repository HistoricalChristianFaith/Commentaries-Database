[[commentary]]
quote='''
And lest we think that the peoples are the same as the sheep, we read in another place: But we are your people, and the sheep of your pasture. "People" refers to all who are rational, but "sheep" to those who, not yet using reason, are content with simplicity alone, and are called of the inheritance of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
