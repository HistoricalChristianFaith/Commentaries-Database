[[commentary]]
quote='''
For to every matter there is a time and judgment. For the affliction of man is great upon him, because he does not know what is to come; for as it will be, who will announce it to him? Although things turn out in different ways, and the just man cannot know what is going to happen to him, nor understand the causes and reasons of each thing (for no one is aware of the things to come), still he knows that all things are done by God for the benefit of men, and are not ordered without his will. For the affliction of the human race is great, because, as the poet says: "The mind of man, ignorant of fate and of future lot". It hopes for one thing, another happens; it expects the enemy from one quarter, and is wounded by the javelin of another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
