[[commentary]]
quote='''
'If', he says, 'you do these things, O kings of Judah, you will hold your former power and will enter the gates of Jerusalem with pomp; but if you are unwilling to do them, O royal house, it will be not so much the Lord's cruelty as your own will that the whole city is reduced to desolation.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
