[[commentary]]
quote='''
The judges and princes of the house of Jacob and of the house of Israel, that is, of both the two and the ten tribes, not only did not do judgment, but abhorred it, and perverted all that is right, so that not even a little justice might remain in the city, because they built Zion with bloodshed, and Jerusalem with iniquity, with the plundering of the poor, the slaughter of the innocent, the killing of the saints.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
But if anyone transfers these things which are said of Jerusalem and of Zion to the Church (for she is the house of Jacob and the house of Israel, according to what is written in Isaiah: Jacob my servant, I will uphold him, and that word to Timothy: That you may know how you ought to conduct yourself in the house of God, which is the Church), he will see clearly that the princes of the house of Jacob, and the rest of the house of Israel, or, as is better written in the Hebrew: judges of the house of Israel, are none other than the bishops, presbyters and deacons, who, unless they have kept their heart with all watchfulness, abhor judgment and pervert all that is right; for when they judge according to the person, and in the hearing of a case it is not the merit of the cause that prevails but the power of the defendants, do they not abhor judgment and pervert all that is right? But it can also be taken in another way: that the princes of the house of Jacob and the judges of the house of Israel abhor and detest judgment, turning aside from the sentence of God the judge, and distorting every rule of the Scriptures with evil interpretations; these build Zion with bloodshed, and Jerusalem with iniquity. For whereas Scripture commands: Do not bring the ungodly man into the tabernacle of the just, and: The man of blood and deceit let the Lord abhor, these, ordaining as clergy any of their hangers-on whatever, and exposing their life as a scandal to the peoples, are guilty of the unbelief of those who are scandalized. Hence it is said that it is better for a man that a millstone turned by an ass be tied around his neck and that he be cast into the deep, than that he should scandalize one of the least of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
