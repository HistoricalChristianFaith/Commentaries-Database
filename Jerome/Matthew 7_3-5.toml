[[commentary]]
quote='''
He speaks of such as though themselves guilty of mortal sin, do not forgive a trivial fault in their brother.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25207.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But why do you see the mote in your brother's eye and do not see the beam in your own eye, and the rest. He speaks of those who, though they are themselves held liable for a mortal crime, do not pardon lesser sins in their brothers, straining out the gnat and swallowing the camel. Rightly, then, these too, as we said above, are called hypocrites for their pretense of justice, who through the beam in their own eye look at the mote in their brother's eye.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
