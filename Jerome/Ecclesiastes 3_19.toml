[[commentary]]
quote='''
As the beast dies, so dies man too, and there is one breath for all, and this air by which we are nourished. For this is what he says: And one spirit for all, and man has nothing more than the cattle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
