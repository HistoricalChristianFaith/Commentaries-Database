[[commentary]]
quote='''
Therefore all who devour you shall be devoured, and all your enemies shall be led into captivity, and those who lay you waste shall be laid waste, and all your plunderers I will give up as plunder. For I will draw a scar over you and from your wounds I will heal you, says the Lord, because they have called you cast out — or scattered —, Zion: this is she who had no one seeking her. And we know that these things were done under Zerubbabel too. When the Babylonians and Chaldeans laid waste the Assyrians, that is, Nineveh, and the Medes and Persians in turn captured the Babylonians and Chaldeans and Babylon was destroyed, then Zion began to have the Lord seeking her, and a scar was drawn over her wound and she was healed of her blows; which is fulfilled more fully and more perfectly in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
