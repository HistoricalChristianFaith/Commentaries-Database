[[commentary]]
quote='''
When the living creatures stood, their wings were let down: for they could not bear the voice of almighty God resounding in the heavens, but stood and marveled, and by their silence showed forth the power of God, who sat above the firmament; and this firmament had, for those who were below, the likeness of crystal, but to those who were above it seemed like a sapphire stone; and this likeness of sapphire was the throne of him who sat in the likeness of a man. From this we understand that the firmament and the crystal and the sapphire and the man are shown in likeness, not in reality.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
