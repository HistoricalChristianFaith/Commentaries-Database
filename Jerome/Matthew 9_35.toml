[[commentary]]
quote='''
Observe how equally in villages, cities, and towns, that is to great as well as small, He preaches the Gospel, not respecting the might of the noble, but the salvation of those that believe. It follows, Teaching in their synagogues; this was His meat, going about to do the will of His Father, and saving by His teaching such as yet believed not.

He first preached and taught, and then proceeded to heal sicknesses, that the works might convince those who would not believe the words. Hence it follows, Healing every sickness and every disease, for to Him alone nothing is impossible.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus went about all the cities and villages, teaching in their synagogues and preaching the Gospel of the kingdom and healing every sickness and every infirmity. You see that he preached the Gospel equally to country places and cities and villages, that is, both to great and to small, so that he considered not the power of the noble but the salvation of believers. He went about the cities: having this as his work, which the Father had commanded, and this as his hunger, to save the unbelieving by his teaching. And he taught the Gospel of the kingdom in synagogues and in country places, and after the preaching and the teaching he healed every sickness and every infirmity, so that those whom the word had not convinced the works might persuade. It is said properly of the Lord: healing every sickness and every infirmity; for nothing is impossible to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
