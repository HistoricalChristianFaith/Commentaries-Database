[[commentary]]
quote='''
And the flocks conceived facing Jacob's rods, the rods which he had set before the flocks in the troughs, that they might conceive at them: and among the late sheep he did not set them. And the late ones became Laban's and the early ones Jacob's. This is not found in the Seventy translators, but in place of 'late' and 'early' they translated something else, I know not what, which does not bear on the sense. But what Scripture says is this: Jacob, prudent and shrewd, kept justice and fairness even in his new art. For if the flocks had produced all the lambs and kids spotted, there was some suspicion of trickery, and the envious Laban would have openly opposed this. So he tempered everything in such a way that he himself would receive the fruit of his labour and Laban would not be stripped entirely. Whenever the sheep and goats were mounted in the first season, because the spring offspring is better, he set the rods before them, so that spotted young would be born. But whatever sheep and goats sought the male late, he did not set them before their eyes, so that beasts of one colour would be born. And whatever was born first was his, because it was parti-coloured and spotted; whatever later, Laban's. For a beast of one colour, black as well as white, sprang up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
