[[commentary]]
quote='''
And Zion said: The Lord has forsaken me, and the Lord has forgotten me. Can a woman forget her infant, so as not to have pity on the son of her womb? And if she should forget, I will not forget you. Behold, I have engraved you on my hands: your walls are always before my eyes. Your builders have come: and those who destroyed you and scattered you shall go forth from you. Lift up your eyes round about, and see, all these are gathered together, they have come to you. As I live, says the Lord, you shall be clothed with all these as with an ornament, and you shall put them about you like a bride, for your deserts and your solitudes, and the land of your ruin, shall now be too narrow for the inhabitants, and those who swallowed you up shall be chased far away. Still they shall say in your ears, the sons of your barrenness: The place is too narrow for me, make room for me to dwell. And you shall say in your heart: Who has begotten these for me? I was barren and not bearing, carried away and captive: and who has brought these up? I was left destitute and alone: and these, where were they? LXX: But Zion said: The Lord has forsaken me, and God has forgotten me. Will a woman forget her little one, so as not to have pity on the offspring of her womb? But if a woman should forget even these, yet I will not forget you, says the Lord. Behold, upon my hands I have painted your walls: and you are always before me. And quickly you shall be built by those by whom you had been destroyed: and those who scattered you shall go forth from you. Lift up your eyes round about, and see: all these are gathered together, they have come to you. As I live, says the Lord, you shall be clothed with all these as with an ornament, and you shall put them about you like a bride's necklace: for your deserts, and the places that were scattered, and those that fell down. Now you shall be straitened because of the inhabitants: and those who had humbled you shall be far from you. For your sons, whom you lost, shall say in your ears: The place is too narrow for me: make me a place to dwell. And you shall say in your heart: Who has begotten these for me? But I was childless and a widow, and who has brought these up for me? I was left alone, and these, where were they? We have often recalled that Jerusalem and Zion are to be understood in four ways in the holy Scriptures. In one way, according to the Jews, the city over which the Lord laments in the Gospel: Jerusalem, Jerusalem, you who kill the Prophets, and stone those who are sent to you (Matt 23:37). And in another place: When you see Jerusalem surrounded by an army, then know that its desolation has drawn near (Luke 21:20). Second, it is the congregation of the Saints, who, set in the peace of the Lord and on the watchtower of the virtues, are rightly called Zion, of which it is said: Its foundations are on the holy mountains: the Lord loves the gates of Zion above all the tents of Jacob (Ps 86 [87]:1). For neither were the foundations of the Jewish Zion, which we see destroyed, loved by the Lord, nor could what is loved by the Lord be destroyed. Third, the multitude of the Angels, Dominions and Powers, and all that is appointed to the ministry of God, is called Jerusalem. Of this Jerusalem the Apostle too was speaking: But the Jerusalem which is above is free, which is the mother of us all (Gal 4:26). And in another place: But you have come to Mount Zion, and to the city of the living God, the heavenly Jerusalem (Heb 12:22). Fourth, that is called Jerusalem which the Jews, and our own Judaizers, following the Apocalypse of John, which they do not understand, think is to be set down from heaven, golden and jeweled (Rev 21), whose bounds and boundless breadth they think are described also in the last part of Ezekiel. Since these things are so, we must now consider more carefully which of the four Zions has said: The Lord has forsaken me, and the Lord has forgotten me. And there is no doubt that it is the congregation of the Saints, which formerly was among the Jews and has been forsaken by the Lord, that recalls these things, and complains with a tearful voice that it has been deserted and left destitute of the Lord's help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
