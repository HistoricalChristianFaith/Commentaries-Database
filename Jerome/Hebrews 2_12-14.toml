[[commentary]]
quote='''
But the blessed Apostle, in the Epistle which is written to the Hebrews (though Latin custom does not receive it among the canonical Scriptures), teaches that this testimony ought to be understood in the person of the Lord and Savior: For which reason he is not ashamed to call them brothers, saying: I will announce your name to my brothers, in the midst of the Church I will praise you (Heb 2:12); and again: I will put my trust in him (ibid., 13); and once more: Behold, I and my children, whom God has given me. Since, then, the children have shared in flesh and blood, he himself likewise became partaker of the same sufferings (Isa 8:18). And how these children were for a sign and a portent to the wisdom of the world and to the pride of the Jews, the same Apostle teaches, who says that the Lord and Savior chose the foolish and weak things of the world, to confound the wise and the strong things (1 Cor 1). Hence the Savior too said to the Apostles: Unless you are converted as one of the children, you shall not enter into the kingdom of heaven (Matt 18:3). And the preacher of the new Gospel becomes a child, who puts off the old man, who is corrupted in the desires of seduction, and puts on the new, who is renewed unto knowledge after the image of the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
