[[commentary]]
quote='''
For as a wanton cow, casting off the yoke of the law, so Israel, that is, the ten tribes, has turned aside from the service of the Lord. For 'wanton cow' the Seventy translated παροιστρῶσαν, one stung by the oestrus and the asilus, which is commonly called the tabanus. Of this Vergil also tells in the third book of the Georgics: "whose Roman name is asilus, the Greeks turned it oestrus, so calling it; fierce, sounding harshly; terrified by it, whole herds scatter through the woods; the air, shaken, rages with bellowing, and the woods and the bank of dry Tanagrus". Since, therefore, Israel has gone mad and, struck by the spirit of fornication, has raved with incredible fury, therefore not long afterward, but while I prophesy, while breath rules these limbs, the Lord feeds them like a lamb in a broad place. Because he had taken the metaphor from the wanton cow, or from the gadfly, he keeps it in what remains, so that he calls the captivity among the Assyrians, and the dispersion of the people of Israel in the very broad land of the Medes, the pasturing of a flock and of lambs, as in a very broad plain and in a spacious land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
