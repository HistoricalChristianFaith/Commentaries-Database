[[commentary]]
quote='''
Something of the kind is written to the Romans as well: "Let every soul be subject to the higher authorities. For there is no authority except from God" (Rom. 13:1). This precept, both here and there, I think was issued for this reason: that at that time the doctrine of Judas the Galilean was still flourishing and had very many followers. Mention of him is made also in the Acts of the Apostles, where Scripture relates: "For before these days Theudas rose up, saying that he was someone great; and about three thousand men joined him" (Acts 5:36); and, "after him rose up Judas the Galilean in the days of the census". Among other things he put forward this as if it were plausible from the Law: that no one ought to be called Lord except God alone, and that those who brought tithes to the temple should not pay tribute to Caesar. This heresy had grown so much that it troubled a great part even of the Pharisees and of the people, so that this question was brought even to our Lord: "Is it lawful to give tribute to Caesar, or not" (Matt. 22:17)? Answering them prudently and cautiously, the Lord says: "Render the things that are Caesar's to Caesar, and the things that are God's to God" (ibid. 21). In agreement with this answer, the apostle Paul teaches that believers ought to be subject to principalities and authorities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
