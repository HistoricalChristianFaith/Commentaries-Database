[[commentary]]
quote='''
I sent death upon you in the way of Egypt, I struck your young men with the sword, even to the captivity of your horses. And I made the stench of your camps rise into your nostrils, and you did not return to me, says the Lord. LXX: I sent forth death upon you in the way of Egypt, and I killed your young men with the sword, together with the captivity of your horses. And I brought out your camps in fire in my wrath, and not even so did you return to me, says the Lord. Israel is instructed by every kind of scourge and torment; hence also, at the time when they were asking help from the Egyptians, death is sent upon them, and their young men are struck with the sword, and the horses which they had multiplied for themselves against the precept of God a savage captivity shuts in, so that the stench of the camps and the foulness of a dying army fill the nostrils of the living. And though he did these things too, in order to rebuke the offenders and amend the erring, not even so did they return to him, says the Lord. He sends death in the way of Egypt not only at that time, but daily, so that whoever has trodden the Egyptian path may, as he dies, hear the Apostle teaching: For in that I died, I died to sin; but in that I live, I live to God. And in another place: If we have died with Christ, we shall also live together with him. And again: I always carry about the mortification of Jesus in my body. And once more: But I live, now not I, but Christ lives in me. By this death the Lord wishes to give us life, so that, dying to sin, we may live to God. And we die to sin when we mortify our members which are upon the earth: fornication, uncleanness, wantonness, idolatry and the rest. We read in Isaiah, at least according to the Seventy translators — otherwise the Hebrew has it differently —: I sent death upon Jacob, and it came upon Israel. Jacob is the name of the body being born; Israel, a name of blessing. For because he wrestled all night and conquered in the struggle, and at the rising of the morning star could say with the Apostle: The night is far spent, the day has drawn near, for this reason he received the name Israel, of one seeing God. Death, therefore, is first sent upon Jacob, so that we may mortify our members which are upon the earth, and through the mortification of the bodily members may come to the death of Israel, so that all the incitements of the passions in us may die. God strikes whatever is strong in evil and is lifted up in a perverse youth, lest it reach old age, and he hands the horses over to captivity, lest they slip down the precipices of hell; and he makes the stench of their camps rise into their nostrils, so that they may recognize their sins and perceive that they stink, and say with David: My scars have putrefied and are corrupted because of my folly. And though he did these things with the desire of one who heals, not even so did they return to him, says the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
