[[commentary]]
quote='''
Confusion has devoured the labor of our fathers from our youth, their flocks and their herds, their sons and their daughters. All the labors of the heretics, of which it is written: they have failed, searching with searching, from the youth of those whom they had deceived, their sons and their daughters, who had advanced in heresy or were held only by luxury, our confusion has overwhelmed. Hence they add:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
