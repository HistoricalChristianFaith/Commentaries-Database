[[commentary]]
quote='''
They are vain and a work worthy of laughter. For who would not laugh when he has looked closely at the images of the heretics? For either what they say is rustic, and it is wood; or it is composed in fine speech, and it is found to be silver; or else it is feigned out of their own mind, and in vain they promise the image of gold. In the time of their visitation they will perish. Heresy prevails for a time, so that all the elect may become manifest and be proved; but when the visitation of God has come and his eye has looked upon foolish things, all things fall silent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
