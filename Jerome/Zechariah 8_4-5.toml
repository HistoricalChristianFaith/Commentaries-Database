[[commentary]]
quote='''
Thus says the Lord of hosts. Old men and old women shall yet dwell in the streets of Jerusalem, and a man's staff in his hand for the multitude of days. And the streets of the city shall be filled with infants and girls, playing in its streets. LXX: Thus says the Lord Almighty: Old men and old women shall yet sit in the streets of Jerusalem, each one holding his rod in his hand, for the multitude of days; and the streets of the city shall be filled with boys and girls, playing in its streets. So great, he says, once I have returned to Zion and am dwelling in the midst of Jerusalem, will be the prosperity of all things and the rest and tranquillity from wars, that, with no enemy remaining, old age in both sexes will reach the furthest span of life and support its trembling limbs with a guiding staff. The streets of the city too shall be filled with boys and girls playing. Now this is wont to happen when there is security and deep peace in the cities, so that playful youth celebrates the joy of the cities with games and dances.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
