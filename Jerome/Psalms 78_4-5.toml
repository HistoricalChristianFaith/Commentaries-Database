[[commentary]]
quote='''
"They were not hidden from their children unto another generation." Therefore they spoke, so that we, their children, might know. "And he established a law in Israel. How great the things he commanded our fathers." He spoke these things carnally, but we understand them spiritually. "That they might make them known to their sons": this is, to us. Therefore he spoke to them, so that they might pass them on to us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
