[[commentary]]
quote='''
To me, the least of all the saints, this grace was given: to preach among the Gentiles the unsearchable riches of Christ, and to enlighten all as to what is the dispensation of the mystery hidden from the ages in God, who created all things.

I do not think that the apostle Paul, in agreement with the secret of his own mind, truly called himself lower than all the Saints: for example, than those who were in Ephesus, in Corinth, in Thessalonica, or who had believed in the whole world. For although it is a sign of humility to call oneself lower than all the Saints, it is the guilt of a lie to keep one thing shut up in the breast and to bring forth another on the tongue. An argument must therefore be found by which Paul both truly was lower than all the saints, and yet did not fall from the apostolic dignity. The Lord speaks in the Gospel to the disciples: Whoever among you wishes to be greater, let him become the least of all, and whoever wishes to be first, let him be the last of all (Matt. 20:26, 27). This Paul fulfilled in deed, saying: For I think that God has shown us apostles as the last, as if destined to death (1 Cor. 4:9). Than all, therefore, who desired to be weak for Christ's sake, the apostle Paul was weaker, and for that reason greater. For I labored more, he says, than all of them; yet not I, but the grace of God which is with me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
