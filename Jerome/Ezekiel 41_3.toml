[[commentary]]
quote='''
And having entered within (or into the inner court) he measured in the front (or 'aelam') of the gate two cubits, and the gate of six cubits, and the breadth of the gate of seven cubits (or and the shoulders of the gate seven cubits on this side and seven cubits on that side). And he measured its length (or of the doors) of twenty cubits and the breadth of twenty cubits before the face of the temple, and he said to me: This is the Holy of Holies. However much we advance, a greater advance always opens before us. Hence, after the entrance of the temple, we again enter within, or, as the Seventy translated, the inner court, in whose 'front' or 'ael' — for which Symmachus translated 'around the gate', Theodotion 'aelam', the Hebrew 'ul', Aquila 'on this side of the door', we 'front' —, there were two cubits, so that, according to the sense given above, through the dual number we may enter that place where the Holy of Holies is; whence also the gate itself was of six cubits, through which, having entered, we possess eternal rest, which is shown in the number seven: for which the Seventy translated: And the breadth of the gate of seven cubits on this side and of seven cubits on that side, whereas in the Hebrew and the other editions the cubits in the breadth of the gate are set down only once.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
