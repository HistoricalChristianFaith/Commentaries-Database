[[commentary]]
quote='''
Then, as he had said above: What shall I do to you, Ephraim? What shall I do to you, Judah? as though hesitating and seeking with what remedy he might heal the sick man, and by what counsels he might draw the sinner back to salvation. I will write for them again, he says, the laws which I had given before through Moses. But what profit is there in writing still others, when he has despised those which he received before? Is it not contempt of God when, though I commanded that there should be one altar in Jerusalem, they fashioned idols on all the mountains and hills with which to provoke the Lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
