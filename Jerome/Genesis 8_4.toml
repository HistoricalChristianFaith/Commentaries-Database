[[commentary]]
quote='''
Ararat is a level region in Armenia, through which the Araxes flows, of incredible fertility, at the roots of mount Taurus, which extends as far as there. So the Ark too, in which Noah was delivered with his children when the Flood ceased, was carried not to the mountains of Armenia in general, which is called Ararat, but to the highest mountains of Taurus, which overhang the plains of Ararat.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
