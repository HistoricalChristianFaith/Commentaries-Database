[[commentary]]
quote='''
You came therefore to battle for your people, and, sending your chariots into the waters, that is, into many nations, you made a way for them in the mud of many waters, that is, so that you might trample them and crush them like mud with the hoof and the wheel of your horses and chariots.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
LXX: And you brought your horses over into the sea, troubling many waters. After God had sent death upon the heads of the wicked, and had cut down the heads of the mighty in amazement, and had broken them in the sea — for it is written in the psalms: You broke the heads of the dragon —, when the princes have been killed or broken, and the strong man has been conquered, one comes to his house, and all his vessels are plundered. But the vessels, and the house of the strong man, and the furniture of the prince, what else can we interpret them as, except the sea of this world, in which the dragon dwells? God therefore, an excellent rider and an outstanding charioteer, brings his horses, that is, the angels and the lofty powers, over the sea of this world, to trouble the many waters, the demons and the opposing powers. But if we wish to interpret it of the coming of Christ, according to what is written in the Apocalypse, that the Word of God sits on a white horse and the whole army follows him on white horses, we shall see how Christ mounted in his apostles, saying to them: Behold, I am with you all days, even to the consummation of the age, and: Going, go, baptize all nations, and the rest. And afterward he mounted upon one white horse, which I think is none other than the apostle Paul, riding upon whom he went round the whole world. Now the Word of God mounted his horses so that the many waters might be troubled, that is, either the many peoples who were formerly in the sea and were held subject to the dragon — For wide and spacious is the way that leads to death, and so that they might be troubled, first deserting their former error, then, being troubled, might receive the rider as he came —, or certainly, those of whom we spoke above, so that the hosts of demons would no longer rule in the sea as before, but, troubled, would give way and dread the wounds of the fighting rider. And would that the Word of God might mount in me too, and through the lance of my mouth kill him who reigns in many waters, so that at the king's death the waters which had been subject to them, being troubled, might offer their necks to my rider, and that we, brought together into one four-horse chariot, might become the Cherubim of the Lord, which means a multitude of knowledge. For never is a charioteer so well set, and never is he borne so adorned, as in those who are joined to one another by the multitude of knowledge and the reins of wisdom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
