[[commentary]]
quote='''
The lion has come up from his lair, and the plunderer of the nations has raised himself up; he has gone forth from his place to make your land a desolation; your cities will be laid waste, remaining without inhabitant. This is, as we have said, the true Nebuchadnezzar, of whom Peter also speaks: our adversary the devil goes about like a roaring lion. And he comes up, it may be, from the abysses, into which he is to be bound again, and he begs not to be sent there, and the plunderer — or the devastator — of the nations has raised himself up, of whom it was said: he shall rule over all his enemies, and who boasts in the sight of the Lord: I have gone around the whole earth and trodden it down. For who is there whom the poisons of the devil do not touch, except him alone who can say: behold, the prince of this world comes and finds nothing in me? He often makes the whole land of the Church a desolation, so that those who have gone out from the Church fight against the Church, of whom John the evangelist also speaks: they went out from us, but they were not of us; for if they had been of us, they would surely have remained with us. The cities of the land of Judea are laid waste and the conventicles of the heretics flourish; if anyone, therefore, is a supporter of the authors of perverse doctrines, of him it can be said: the lion has come up from his lair, and the plunderer of the nations has raised himself up, and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
