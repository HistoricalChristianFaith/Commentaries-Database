[[commentary]]
quote='''
The dogs of the Gentiles bark against us in their volumes, which they have left behind as a memorial of their own impiety, asserting that the apostles did not have faith because they could not move mountains. To them we shall answer that many signs were done by the Lord, according to the testimony of John the evangelist, which, if they had been written, the world could not contain; not that the world could not have contained the volumes, which, however many they may be, one little bookcase or one book-chest can contain, but that it could not bear the greatness of the signs, on account of their wonder and its own unbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
