[[commentary]]
quote='''
And when I looked at the living creatures, there appeared one wheel upon the earth beside the living creatures that had four faces. And the appearance of the wheels and their work as the vision of the sea, and one likeness of the four of them; and their appearance and works as if it were a wheel in the midst of a wheel. Going by their four sides they went, and they did not turn back when they walked. The wheels had also stature and height and a dreadful appearance, and the whole body full of eyes round about the four of them. (LXX: "And I saw, and behold, one wheel upon the earth following the four living creatures. And the appearance of the wheels and their making as the appearance of tharsis. And a likeness in the four, and their work as a wheel is wont to be in a wheel. On their four sides they walked, and did not turn back when they walked. And their backs, and they had height. And I saw them, and their backs full of eyes round about the four of them.") Thus far the picture of the four living creatures that had four faces each is described, following the spirit and the cloud which was in the midst of the spirit; now for each living creature a single wheel is set, which were not joined to the living creatures but followed them; or one wheel appeared upon the earth, which, divided into four, had as many faces as the living creatures it followed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
