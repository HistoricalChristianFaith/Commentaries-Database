[[commentary]]
quote='''
And I will scatter them with a winnowing fan in the gates of the land — or of my people —; I have killed and destroyed my people, and yet they have not turned back from their ways. 'What does it profit that I am entreated so often, when they do not turn back from their most wicked ways nor do repentance? For I scattered them as with a winnowing fan, to purge my threshing floor, and I scattered them in the gates of the land, so that in a manner they might tread the thresholds of hell, and I have killed and destroyed my people, so that, compelled by the necessity of evils, they might avoid the evils that were impending'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
