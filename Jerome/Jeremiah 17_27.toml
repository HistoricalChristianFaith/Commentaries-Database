[[commentary]]
quote='''
'But if', he says, 'you will not hear my precepts, and do the things which I commanded not to be done, I will kindle a fire in its gates' — that is, of Jerusalem: that fire of which it is said, all committing adultery, like an oven, their hearts —, 'which will devour the houses or streets of Jerusalem' — which the Seventy translated as amphoda, Aquila and Symmachus as bareis, that is, 'towered houses', and which are called in Hebrew 'armanoth' — 'and this burning will never be extinguished', as the Apostle says: the fire will test what sort each one's work is, and again: if anyone's work is burned, he will suffer loss, but he himself will be saved, yet so as through fire. But if our Judaizers reject the figurative explanation, they will be compelled either to be Jews and, with the observance of the sabbath, to circumcise their foreskins, or else to find fault with the Savior, who on the sabbath commanded the paralytic to carry his bed, as the evangelist says: for this reason the Jews sought all the more to kill him, not only because he was breaking the sabbath, but also because he said that God was his own Father, making himself equal to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
