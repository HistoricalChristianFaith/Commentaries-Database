[[commentary]]
quote='''
And the chiefs of Judah shall say in their heart: Let the inhabitants of Jerusalem be strengthened for me in the Lord of hosts, their God. LXX: And the tribunes — that is, οἱ χιλίαρχοι —, of Judah shall say in their hearts: We shall find for ourselves those who dwell in Jerusalem in the Lord Almighty, their God. When the Lord has opened his eyes upon Judah, and has struck all the horses of the nations with blindness, the chiefs of Judah, of whom it was said above: But Judah too shall be in the siege against Jerusalem, will make vows in their hearts, since they will not dare to speak freely, that Jerusalem may conquer, and that Judah, conquered along with the enemies, may conquer along with his fellow citizens. Where we said: Let them be strengthened for me, and the LXX translated εὑρήσομεν ἑαυτοῖς, that is: we shall find for ourselves, in the Hebrew is written emsa li, which Aquila translated καρτέρησόν μοι, that is, strengthen for me, so that the sense is: The chiliarchs and tribunes, and the chiefs of Judah, will wish, and will make vows in the hidden secret place of their minds, that God may strengthen the inhabitants of Jerusalem in the Lord their God, and that they may conquer their adversaries. According to tropology, the chiefs and tribunes are the apostles, and all apostolic men and teachers who have been set over the army of Christ, who would wish to find for themselves no others but those who dwell in Jerusalem, the vision of peace, and who dwell in the Lord Almighty, their God. Of these chiefs was Paul the apostle, who found Titus and Timothy, Luke and Silvanus; Peter too, who instructed Mark, the writer of the Gospel; and the rest of the apostles, who filled the whole world with their teaching and learning, so as to have as disciples inhabitants of Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
