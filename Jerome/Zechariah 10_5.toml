[[commentary]]
quote='''
And they shall tread down, he says, their adversaries, crowned in martyrdom, and they shall say: The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life, of whom shall I be afraid? While the wicked drew near against me to eat my flesh, my enemies who trouble me, they themselves were weakened and fell. Though camps should stand together against me, my heart shall not fear; though battle should rise up against me, in this will I hope. Then shall that saying be fulfilled: One of you shall pursue a thousand, and two shall put many thousands to flight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
[[commentary]]
quote='''
This can be explained according to tropology thus. When the Lord Almighty visits his flock, the house of Judah, then the riders on horses shall be confounded, of whom it is written: Let us sing to the Lord, for he has been gloriously magnified; horse and rider he has cast into the sea. Of whom it is also sung in the voice of the psalmist: At your rebuke, O God of Jacob, they who mounted horses have slumbered. And the choir of the saints redoubles it: Some in chariots, and some on horses, but we will call upon the name of our God; they have been bound and have fallen, but we have risen and stand upright. In this cavalry the king of Egypt trusted; and, hurled headlong into the sea, he sank like lead into the depths, and learned by his own example that what is written is true: A horse is a deceitful thing for safety. These chariots and four-horse teams we interpreted above as the four passions, which, unless they are governed by the reins of a good charioteer, are carried over the precipice. But there is another charioteer, of whom Elisha speaks: Father, father, the chariot of Israel and its charioteer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
