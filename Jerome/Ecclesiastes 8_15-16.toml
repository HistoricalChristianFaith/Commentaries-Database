[[commentary]]
quote='''
That these things are to be understood as we have said is shown by the following little verse, in which he says: I gave my heart to see wisdom and occupation: namely, that men are occupied upon the earth and spend days and nights in the meditation of the Scriptures, so that very often, for the investigation of the truth, sleep flees from their eyes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
