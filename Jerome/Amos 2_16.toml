[[commentary]]
quote='''
And the strong also of heart among the mighty shall flee naked. This passage can be explained in two ways: either that he can escape for this reason, that he has stripped off the old man and the skin tunics of sins, and was weighed down by no burden; or, on the contrary, that because he is naked and has lost the garment of Christ, of which it is said in the Apostle too: Put on Christ Jesus, and in another place: If indeed, being clothed, we are not found naked, his strength will profit him nothing, but in the day of battle and contest he will flee from his pursuers and, unable to resist without the armour of the Apostle, will turn his back to the enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
