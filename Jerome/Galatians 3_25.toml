[[commentary]]
quote='''
But if anyone, after the time of his age has been completed, when he is now called heir and free and son, should wish to be under a pedagogue, let him know that he cannot live by the laws of a little child. For where now can that be fulfilled: "Three times in the year all your males shall appear in the sight of the Lord your God" (Exod. 23:17), now that Jerusalem has been overthrown and the temple scattered even to ashes? Where are the peace offerings and the victims for sin? Where is the eternal fire of the burnt offerings, after the likeness of the heavenly stars, now that the altar has been utterly destroyed? And what punishment will be able to be decreed for the guilty, when Scripture says: "You shall take away the evil from the midst of you" (Deut. 13:5), while the Jews are in servitude and the Romans reign? And so it will come about that they live neither under a father nor under a pedagogue: since the Law cannot be fulfilled after faith has succeeded it, and faith, while the Law as pedagogue is sought after, is not held.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
