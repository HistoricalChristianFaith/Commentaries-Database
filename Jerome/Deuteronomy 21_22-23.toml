[[commentary]]
quote='''
Because it is written: Cursed is everyone who hangs on a tree: that the blessing of Abraham might come among the Gentiles in Christ Jesus, that we might receive the promise of the spirit through faith.

Before we discuss the sense and the words of the Apostle, it seems right to go over briefly the testimony of Deuteronomy, from which the Apostle also took these words (Deut. 21:22, 23), and to compare it with the other editions. The Seventy translators, then, rendered this passage thus: "But if there be in anyone a sin and a judgment of death, and he has died, and you hang him on a tree, his body shall not sleep upon the tree, but burying you shall bury him on that day; because cursed by God is everyone who hangs on a tree: and you shall not defile your land, which the Lord your God will give you for an inheritance". Aquila: "And when there is in a man a sin unto a judgment of death, and he has been slain, and you hang him upon a tree, his carcass shall not remain upon the tree, but burying you shall bury him on that day, because he who is hanged is the curse of God: and you shall not defile your ground, which the Lord your God will give you as an inheritance". Symmachus: "But if there be in a man a sin bringing a judgment of death, and he has been slain, and you hang him upon a tree: his corpse shall not stay the night upon the tree, but with burial you shall bury him on that same day, because he was hanged on account of blasphemy of God: and you shall not defile your land, which the Lord your God will give you for an inheritance". Theodotion: "And because there will be in a man a sin unto a judgment of death, and he will die, and you will hang him on a tree, his carcass shall not sleep upon the tree, because with burial you shall bury him on that same day, because the one hanged is the curse of God: and you shall not defile your adama, which the Lord your God shall have given you as an inheritance". Now ADAMA (אדמה) is the word in the Hebrew language for "earth" or "ground". But in the place where Aquila and Theodotion translated alike, saying: "because the one hanged is the curse of God", the Hebrew has it thus: CHI CALALATH ELOIM THALUI. These words Ebion, that heresiarch, half-Christian and half-Jew, interpreted thus: ὅτι ὕβρις Θεοῦ ὁ κρεμάμενος, that is, "because the one hanged is an insult to God". I remember that in the Dispute of Jason and Papiscus, which is written in the Greek language, I found it thus: λοιδορία Θεοῦ ὁ κρεμάμενος, that is, "a curse of God is he who is hung up". The Hebrew who instructed me in some measure in the Scriptures used to tell me that it can also be read thus: "because God was hanged shamefully". We have gathered these things together for this reason: because it is a most notorious question, and the Jews are accustomed to throw it at us as a disgrace that our Savior and Lord was under the curse of God. First, then, we must observe that not whoever has hung on a tree is cursed before God, but he who has sinned, and on account of a crime has been sentenced to death and raised up on a cross: he is cursed not because he was crucified, but because he fell into such guilt that he deserved to be crucified. Next we must set against them this point: that further on the cause of the gallows is set out more fully, Scripture relating that he was crucified on account of a curse and blasphemy of God. Symmachus translated this more plainly, saying: "because he was hanged on account of blasphemy of God". Lastly, let us ask them whether, if Ananias and Azarias and Misael, refusing to worship the idol of Nebuchadnezzar, had been hanged on a tree (Dan. 3), and Eleazar too, a man of ninety under Antiochus king of Syria, and the glorious mother with her seven sons (2 Macc. 7), they would have reckoned them cursed, or most worthy of every blessing? Surely, if Haman had not himself mounted, as he deserved, the cross that he had prepared for Mordecai (Esther 7), I think Mordecai would have ascended it not as one cursed, but as a holy man. By these and other similar examples it is proved that he is cursed who has committed a crime worthy of the gallows, not he who has been crucified through the iniquity of judges and the power of enemies, or the clamor of the mob, or envy of his virtues, or the anger of a king. Naboth too was once condemned to death by the whole city of Jezreel at the letters of Jezebel (1 Kings 21); but his blood, as a type of Christ, is avenged many ages later, the Lord saying to Hosea: "Call his name Jezreel, for yet a little while, and I will avenge the blood of Jezreel upon the house of Jehu." (Hos. 1:4). So much against the Jews. But to bring the discussion back to ourselves, I cannot know why the Apostle, in what is written: "Cursed by God is everyone who hangs on a tree" (Deut. 21:23), has either taken something away or added something. For if he was once following the authority of the Seventy translators, he ought, as it was published by them, to have added the name of God as well. But if, as a Hebrew of the Hebrews, he thought that what he had read in his own language was most true, he ought not to have taken up either "everyone" or "on a tree", which are not found in the Hebrew. From this it seems to me either that the ancient books of the Hebrews had it otherwise than they have it now; or that the Apostle (as I have already said before) set down the sense of the Scriptures, not the words; or, what is rather to be supposed, that after the passion of Christ the name of God was added by someone, both in the Hebrew codices and in ours, so as to brand with infamy us who believe in a Christ cursed by God. With a bold foot, therefore, I advance to this contest, to appeal to the books: that in no place is it written that anyone is cursed by God, and wherever a curse is set down, the name of God is never added. "Cursed are you by all the beasts" (Gen. 3:14), is said to the serpent. And to Adam: "Cursed is the ground in your works" (ibid., 17). And to Cain: "Cursed are you upon the earth" (Gen. 4:11). And elsewhere: "Cursed be Canaan the boy, he shall be a servant to his brothers" (Gen. 9:25). And also in another place: "Cursed be their fury, because it is bold, and their anger, because it is harsh" (Gen. 49:7). It would be long if I were to list all the curses that are written in Leviticus, and in Deuteronomy, and in Joshua son of Nun; and yet in none of them is the name of God added: so much so that even Satan himself, when he was promising concerning Job that, if he were pressed by great distresses, he would blaspheme, expressed this by the better word, saying: "If he does not bless you to your face" (Job 1:11). And in the books of Kingdoms Naboth is reported to have been stoned for this reason: "because he blessed God and the king" (1 Kings 21).
'''
