[[commentary]]
quote='''
Be a friend, like the apostles, to whom the Savior says: No longer will I call you servants, because the servant does not know what his master does, but I will call you friends, because you have persevered with me in all my temptations. Dainty is the friendship that follows the good fortune and the riches of friends. Men of this kind seem to me to love not their friends but themselves. Let us consider more attentively the words of the Lord: But I will call you, he says, friends. And he gives the reasons why he calls them friends: Because you have persevered with me in temptation, and he did not stop there, but in all, he says, my temptations. For it sometimes happens that one who persevered with us in one temptation is overcome by others and withdraws.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
