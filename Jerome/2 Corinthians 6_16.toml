[[commentary]]
quote='''
In this city Christ reigns, in this city the inhabitants themselves are both inhabitants and gates, they themselves are both houses and inhabitants. Do you wish to know that they are houses? Christ dwells in them, Christ walks about in them. 'I will dwell,' he says, 'in them, and I will walk about.' See how great the holy soul is: it contains Christ, whom heaven does not contain. See what he says. 'I will dwell,' he says. But it can happen that someone dwells in cramped quarters. 'I will dwell, and I will walk about in them.' Wherever he walks about, surely the house is spacious, where there is room to walk. 'You are,' he says, 'the temple of God, and the Holy Spirit dwells in you.' Let us prepare our temple, that Christ may come and dwell in us: that our soul too may be Sion, that it may be a watchtower, that it may be set upon the heights, that it may be above, not below.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_046.html'
source_title="Homily 46, on Psalm 133"
