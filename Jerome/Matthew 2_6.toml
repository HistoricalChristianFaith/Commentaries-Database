[[commentary]]
quote='''
(in Mich. v. 2.) The following is the sense of the prophecy. Thou, Bethlehem, of the land of Judah, or Ephrata, (which is added to distinguish it from another Bethlehem in Galilee,) though thou art a small village among the thousand cities of Judah, yet out of thee shall be born Christ, who shall be the Ruler of Israel, who according to the flesh is of the seed of David, but was born of Me before the worlds; and therefore it is written, His goings forth are of old. In the beginning was the Word.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25202.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
In the Gospel according to Matthew, when the Magi had come from the east and Herod asked the scribes where Christ the Lord was to be born, they are related to have answered: In Bethlehem in the land of Judah, and, adding the prophet's testimony, they said: And you, Bethlehem, land of Judah, are by no means least among the princes of Judah; for out of you shall come forth a leader who will rule my people Israel. That this testimony agrees neither with the Hebrew nor with the Seventy translators is plain even if I say nothing; and I think that Matthew, wishing to reprove the negligence of the scribes and priests in the reading of divine Scripture, set it down in this way too, just as it had been said by them. But there are some who assert that in almost all the testimonies taken from the Old Testament there is an error of this kind, that either the order is changed or the words, and sometimes even the sense itself is different, since the apostles or the evangelists did not pick the testimonies out of a book but trusted to memory, which is sometimes deceived.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
