[[commentary]]
quote='''
Then follows fire. See the concord of discord: water and fire together praise the Lord. Dragons and all deeps, fire. All things that are born from water are also born from fire, that is, from moisture and heat: neither can fire alone generate without moisture, nor moisture without fire. Nothing is so contrary as moisture to heat, and heat to moisture; yet by the will of God these things, which are diverse among themselves, come into concord in our birth. Hail, snow, ice, the spirit of storms, which do his word. There are many things that might be said, and we cannot linger over each one. Hail, snow, ice, the spirit of storms. All the things that we see in the world serve us. Serpents and deeps, fire, hail, snow, ice, the spirit of storms seem to be without reason: but they serve us. Yesterday there was a storm, it seemed to us to be against us: there was cold, there was damp, there were rains. This which for an hour seems to us to be against us, is for us: for it brings forth fruit for us. For see what he says: these things and those, which do his word. Blush, O man: serpents and deeps, snow, rains and storm do the word of God, and you do not do it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
