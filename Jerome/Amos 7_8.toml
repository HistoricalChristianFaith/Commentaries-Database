[[commentary]]
quote='''
We read in Ezekiel that the Lord threatens that, when storm and hail arise, he will by no means plaster or clothe the wall of Israel, but will let it be broken up by the rains. Hence now too he of whom it is written, He shall be called the builder of the wall, himself the cornerstone and the builder of the house, says that he will lay down the trowel in the midst of his people Israel, and make it cease and lie idle, so that he will by no means again overlay it, and clothe and protect it with his help.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
