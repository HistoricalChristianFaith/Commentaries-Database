[[commentary]]
quote='''
Or the sleep which He would have them forego is not bodily rest, for which at this critical time there was no room, but mental torpor, the sleep of unbelief.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he came to the disciples and found them sleeping, and he says to Peter: So you could not keep watch with me one hour? He who had said above: Even if all are scandalized in you, I will never be scandalized, now cannot overcome sleep for the greatness of his sadness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
