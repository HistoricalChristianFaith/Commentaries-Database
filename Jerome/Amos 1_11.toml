[[commentary]]
quote='''
Thus says the Lord: For three crimes of Edom and for four I will not turn him back; because he pursued his brother with the sword, and violated his mercy, and held his fury beyond measure, and kept his indignation to the end; I will send fire into Teman, and it shall devour the houses of Bozrah. LXX: Thus says the Lord: For three impieties of Idumea and for four I will not turn away from them, because he pursued his brother with the sword, and violated the womb upon the earth, and seized his horror for a testimony, and kept his onset for ever; and I will send forth fire into Teman, and it shall devour the foundations of its walls. Edom is the same as Esau, so called because of the cooking of the red lentil, for the food of which he lost his birthright. He is called by another name Seir, hairy and shaggy. Hence the mountains of the Idumeans are called the mountains of Seir, and from Edom, in the Greek language, it is called Idumea. He pursued his brother with the sword, namely the sons of Jacob, concerning which it is written more fully in the blessings of Isaac, with which he blesses first Jacob and afterwards Esau; so that the hatred of the brothers was preserved in their descendants, and the Idumean nation persecuted its brothers to such a degree that it did not even grant them passage into the holy land when they were coming out of Egypt; and not only did he pursue his brother with the sword, but he violated his mercy, or his womb, or, as Symmachus translated more plainly, his own bowels; so that he forgot his brotherhood, and hardened the bowels of mercy, and did not know that he was a brother, and despised the womb of Rebekah, who in one birth had brought forth twin infants. And what follows: And he held his fury beyond measure, and kept his indignation to the end, shows an ancient hatred, because they were never joined to one another in peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
