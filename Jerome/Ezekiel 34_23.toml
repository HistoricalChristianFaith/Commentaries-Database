[[commentary]]
quote='''
Then he will raise up one shepherd — who says in the Gospel: I am the good shepherd —, his servant David — inasmuch as he deigned to take on the form of a servant; and 'David' means 'strong of hand' —; he himself will feed them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
