[[commentary]]
quote='''
'I sent', he says, 'to you my servants daily and rising up by night; and if you will not hear them, I will make this house' — that is, the temple of God — 'like Shiloh', where the tabernacle was. And when the temple has been destroyed, consequently the city too will be a curse to all the nations of the earth. And just as, when the temple had been built on the threshing floor of Ornan and on Mount 'Moria', that is, 'of vision', on which Abraham is related to have offered his son Isaac, the worship of Shiloh ceased and no sacrifices were afterwards celebrated there, so, when the Church had been built and spiritual victims had been offered in it, the ceremonies of the law ceased, and the city of the Jews was made a curse to all the nations of the earth, from which the Lord has freed us, as the Apostle says: Christ has redeemed us from the curse of the law, having been made a curse for us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
