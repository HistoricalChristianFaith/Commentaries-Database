[[commentary]]
quote='''
"All are governed by their own free choice." What Christian can bear to hear this? For if not one, or a few or many, but all of us are governed by our own free choice, what becomes of the help of God? How do you explain the proverb that "A person's goings are ordered by the Lord?" Or "A person's way is not in himself"? Or "No one can receive anything, unless it be given him from above"? And elsewhere, "What do you have that you did not receive?"
'''
source_url='https://www.newadvent.org/fathers/30111.htm'
source_title="Against the Pelagians 1.27"

[[commentary]]
quote='''
I know, O Lord, that his way is not man's, nor is it a man's to walk and to direct his steps. Let the new preachers blush, who say that each one is ruled by his own will, when this prophet too says: his way is not man's, and David sings in a lyric song: By the Lord shall a man's steps be directed, and he will greatly desire his way. Or else this is the sense: 'What we suffer from the Babylonians comes not from dread of them, but from our desert and from your indignation'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
