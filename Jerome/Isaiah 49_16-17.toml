[[commentary]]
quote='''
For know, you who think yourself utterly forsaken, that you are engraved and painted on my hands, and that your walls remain continually before my eyes. From this we learn that Jerusalem is by no means to be sought in the region of Palestine, which is the worst of the whole province, and rough with rocky mountains, and suffers a dearth of water, so that it uses the rains of heaven, and consoles the scarcity of springs by the construction of cisterns; but in the hands of God, to whom it is said: Your builders have hastened. Or, according to the Seventy: Quickly you shall be built by those by whom you had been destroyed. For destroyed by the Jews, it was built by the Jews. Deserted because of the guilt of the Scribes and Pharisees, it was gathered together at the preaching of the Apostles of Christ, both from the Jews and from the nations. There follows: And those who destroyed you and scattered you shall go forth from you: the most wicked teachers; so that you may by no means follow the commandments and traditions of men (Matt 15), but the law of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
