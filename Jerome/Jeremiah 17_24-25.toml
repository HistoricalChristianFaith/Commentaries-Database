[[commentary]]
quote='''
Let us see what is the reward of those who do not carry loads on the sabbath day and who sanctify it. There will enter, he says, through the gates of this city kings, whose heart is in the hand of God and who reign over their bodies, and princes sitting upon the throne of David, so that they imitate the example of Christ, and mounting in chariots and on horses, of which it is written: the chariot of God is ten thousandfold, manifold, thousands of those who rejoice; the Lord is among them in Sinai, in the holy place, and elsewhere: your riding is salvation: every man who 'confesses' God and who dwells in Jerusalem, of which it has been said: was made in Salem, that is, in peace, his place, and his dwelling in Zion; and the Church of God will be inhabited forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
