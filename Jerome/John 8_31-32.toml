[[commentary]]
quote='''
Among the elect themselves, too, there is great diversity according to the variety of their works, minds and words. Nor does whoever is elect of God at once possess faith according to his election, or have knowledge of the truth according to his faith. Hence the Savior also spoke to the Jews who had believed in him: "If you remain in my word, you will know the truth, and the truth will set you free" (John 8:31, 32). And the evangelist testifies that he said these things to those who believed indeed, but did not know the truth, which they could attain if they remained in his word, and, being made free, would cease to be servants.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
