[[commentary]]
quote='''
Hear and perceive with your ears, do not be lifted up, for the Lord has spoken! Because he had said above: Every wineskin shall be filled with wine, so that the kings too and the priests and the prophets and every inhabitant of Jerusalem should be filled with drunkenness, therefore he joins on and says: Hear and perceive with your ears, as much outwardly as inwardly, as much with the mind as with the body, and do not be lifted up through pride, considering your frailty and that there is no one who, according to the quality of sin, is free of this drunkenness. Hence he who lifts himself up against him through pride is destroyed and corrupted and is unworthy of the mercy of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
