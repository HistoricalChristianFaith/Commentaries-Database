[[commentary]]
quote='''
But since today is the day of the dedication feast (encaenia), and the dedication feasts are always in stormy weather, in rains, in winter. Indeed it is written in the Gospel: 'And the Lord was walking,' it says, 'at the dedication feast (encaenia) in Jerusalem, in the porch of Solomon, because it was winter and rains.' See what it says. At the dedication feast he was walking in the porch, because there was storm and rains. When someone wishes to renew himself to Christ, when the house is being built after captivity, if anyone should wish to renew his house, and to renew it to Christ; if anyone should wish to forsake the world, and to join himself to Christ: at once the storm, at once the winter, at once the rain rises up. But Christ — nay, in Christ the poor little ones, seeing the dedication feast, seeing the storm, seeing the floods, seeing the winter, leave the floods and flee under the porch of Solomon, that is, they are sheltered by the peace of Christ. For Solomon is interpreted "peaceful," he who said, 'My peace I give to you, my peace I leave to you.' Let us too, then, walk in the porch of Solomon, let us be sheltered by his majesty, let us have his help, and let us say that word from the Song of Songs, that 'the winter is past, and the rain is gone, it has gone away' in Christ Jesus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_023.html'
source_title="Homily 23, on Psalm 95"
