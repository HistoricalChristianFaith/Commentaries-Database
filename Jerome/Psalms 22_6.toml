[[commentary]]
quote='''
Now the worm, which in Hebrew is called THOLATH (תולעת), is the name given, for its lowliness and contempt, to the choir of the Apostles, imitating the Savior, who speaks in the psalm: I am a worm, and no man, a reproach of men, and the outcast of the people (Ps 21 [22]:7). For as a worm penetrates the earth, so the apostolic word penetrated the cities of the nations, and entered first into the hardest hearts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
