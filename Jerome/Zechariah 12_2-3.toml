[[commentary]]
quote='''
Concerning the Church it can be interpreted thus: that all the persecutors who have fought against the house of the Lord are made drunk with that cup which Jeremiah gives to all the nations to drink, so that they drink and are drunk, and fall, and vomit, and go mad. I know that in the time of persecution many of our own were compelled to fight against the Church; but whoever wishes to lift this weight will indeed lift it, and will bear it up in his hands for the wrath of the Lord by which he chastises sinners; yet he himself will not go unpunished, since the sword of God fights against him. For the stone of burden, which we have rendered as best we could, the Seventy translated: A stone trodden down by all the nations. Everyone who treads it down — or her, that is, Jerusalem —, mocking shall mock. Its sense is plain: that in both ways Jerusalem is to be trodden down both by hostile nations and by persecutors, and is to be mocked at the pleasure of those who mock. But the former sense is better and truer. We expound each point briefly, so that we may at last come to the end, lest, if we write at greater length, the reader's mind be confused both by the obscurity of the matters and by the length of the discourse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
