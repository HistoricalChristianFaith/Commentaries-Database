[[commentary]]
quote='''
But if all the nations are in his sight as if they were not, and are counted as nothing and void (and among all the nations is Israel too), then Israel too is as if it were not, and is counted as nothing and void. This we say so that its pride may be broken, and they may know that they are like the other nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
