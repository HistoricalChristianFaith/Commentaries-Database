[[commentary]]
quote='''
Some MSS. add here, nor what ye shall drinkb. That which belongs naturally to all animals alike, to brutes and beasts of burden as well as to man, from all thought of this we are not freed. But we are bid not to be anxious what we should eat, for in the sweat of our face we earn our bread; the toil is to be undergone, the anxiety put away. This Be not careful, is to be taken of bodily food and clothing; for the food and clothing of the spirit it becomes us to be always careful.

The command is therefore, not to be anxious what we shall eat. For it is also commanded, that in the sweat of our face we must eat bread. Toil therefore is enjoined, carking forbidden,

He who has given the greater, will He not also give the less?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Do not be anxious for your soul, what you shall eat, nor for your body, what you shall put on. In some manuscripts there is added: nor what you shall drink. So from care for that which nature has granted to all, and which is common to beasts of burden and wild beasts and men, we are wholly set free. But we are commanded not to be anxious about what we shall eat, because in the sweat of our face we prepare bread for ourselves. Labor must be exercised, anxiety removed. This which is said: Do not be anxious for your soul, what you shall eat, nor for your body, what you shall put on, let us take of fleshly food and clothing. But for spiritual food and clothing we ought always to be anxious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Is not the soul more than food, and the body more than clothing? What he says is of this kind: He who has granted the greater will surely grant the lesser too.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
