[[commentary]]
quote='''
What he had said above: Of their silver and their gold they have made idols for themselves, that they might perish, he now explains more plainly: Your calf is cast off, Samaria, my fury is kindled against them; either against the calves, because they had made two; or against the inhabitants of Samaria, who worshiped them. Moreover, as for what we read in the Seventy: Cast off your calf, Samaria, he exhorts its inhabitants, not of one city but of all the ten tribes, which are called Samaria — for otherwise there were no calves in the city of Samaria, but in Dan and in Bethel — to cast off the calves against which God is angry; or ἀποτρίψεται, that is, let it rub them away; so that it may little by little rub away and cleanse those which it had worshiped for a long time. And when they do not listen, he turns to others, and speaks as though to a third person: how long will they be unable to be cleansed? What madness is this, he says, that, while I give room for repentance, they refuse to turn to health?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
