[[commentary]]
quote='''
Therefore let us say it simply: just as, in the Gospel, it is written — it is written in Matthew and John that our Lord was crucified at the sixth hour, while again it is written in Mark that he was crucified at the third hour. This seems to be a discrepancy, but it is not a discrepancy. It was an error of the copyists: in Mark too "the sixth hour" had been written, but many, in place of the Greek episēmon (the numeral sign), thought it was a gamma. For just as there it was an error of the copyists, so here too it was an error of the copyists, that in place of Asaph they wrote Isaiah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
