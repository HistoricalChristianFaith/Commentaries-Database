[[commentary]]
quote='''
It is asked why Ezekiel refused easier things, while Hosea was at once joined to a harlot and did not object, or rather reply, that he had a chaste body and ought not to be stained by union with a prostitute, as the Apostle says: He who cleaves to a prostitute becomes one body with her; from this it is shown that it was a figure of the Synagogue or of the Church, not truly carried out according to the letter, as we discussed more fully when expounding that prophet himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
