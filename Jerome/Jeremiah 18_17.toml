[[commentary]]
quote='''
Like a burning wind I will scatter them before the enemy — or the enemies —; the back and not the face will I show them in the day of their perdition. To this day the sentence of God remains upon the Jews; they have been scattered throughout the whole world before the enemy, the devil, or the enemies, the demons, and, though day and night in the synagogues of Satan they call upon the name of God, God shows them his back and not his face, so that they may understand that he is always withdrawing and never coming to them. Now the day of the perdition of the Jews is the whole time after the Savior's passion until the consummation of the age, so that, after the fullness of the nations has come in, then all Israel may be saved.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
