[[commentary]]
quote='''
And you, Bethlehem Ephrathah, are little among the thousands of Judah; out of you shall come forth for me one who is to be ruler in Israel, and his going forth is from the beginning, from the days of eternity. LXX: And you, Bethlehem, house of Ephrathah, are least, that you should be among the thousands of Judah; out of you shall come forth for me one who is to be prince of Israel, and his going forth is from the beginning, from the days of the age. In the Gospel according to Matthew, when the Magi had come from the east and Herod asked the scribes where Christ the Lord was to be born, they are related to have answered: In Bethlehem in the land of Judah, and, adding the prophet's testimony, they said: And you, Bethlehem, land of Judah, are by no means least among the princes of Judah; for out of you shall come forth a leader who will rule my people Israel. That this testimony agrees neither with the Hebrew nor with the Seventy translators is plain even if I say nothing; and I think that Matthew, wishing to reprove the negligence of the scribes and priests in the reading of divine Scripture, set it down in this way too, just as it had been said by them. But there are some who assert that in almost all the testimonies taken from the Old Testament there is an error of this kind, that either the order is changed or the words, and sometimes even the sense itself is different, since the apostles or the evangelists did not pick the testimonies out of a book but trusted to memory, which is sometimes deceived. Let us therefore expound the Hebrew: And you, Bethlehem, that is, house of bread, who are called Ephrathah, are indeed least among the cities of Judah; and, compared with so many thousands, you are scarcely a little hamlet; but out of this little hamlet Christ will come forth, who is ruler in Israel. And lest you think that he is only of the race of David, to whom I promised, saying: Of the fruit of your womb I will set upon my throne, the assumption of flesh does not hinder the divine majesty; for he was born of me before all ages, and the founder of times is not held within time. He it is to whom I also said in another psalm: Before the morning star I begot you. For in the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. And therefore his going forth is from the beginning, from the days of eternity. That Bethlehem itself is Ephrathah, the book of Genesis shows, in which Scripture records: Rachel died, and was buried on the way to Ephrathah, that is Bethlehem. And in each of the two names it signifies a mystery: for it is called house of bread because of the living bread which came down from heaven; and Ephrathah, which means he sees fury, because of the madness of Herod, who, mocked by the Magi, was exceedingly angry, and sent and killed all the infants in Bethlehem and in all its borders from two years old and under, according to the time he had inquired of the Magi; and because of the great bloodshed a voice was heard on high, the lamentation and wailing of Rachel weeping for her children. We read, according to the Seventy translators only, in Joshua son of Nun, where the cities and towns of the tribe of Judah are described, this too written among the rest: Thaeco, and Ephrathah, that is Bethlehem, and Phagor, and Aetham, and Culon, and Tami, and Soris, and Caraem, and Gallim, and Baether, and Manocho, eleven cities and their villages, which is found neither in the Hebrew nor in any other translator; and whether it was erased from the old books by the malice of the Jews, lest Christ should be seen to have sprung from the tribe of Judah, or added by the Seventy, since we by no means know it clearly, what do we know for certain? Nonetheless we can also prove this very point from the book of Judges, that Bethlehem is in the tribe of Judah; for it is written: And there was a Levite man dwelling on the sides of the house of Ephraim, and he took for himself a concubine from Bethlehem of Judah, and his concubine was angry with him, and went away to her father's house in Bethlehem of Judah. And it is fittingly said, in Bethlehem of Judah, to distinguish it from that Bethlehem which is situated in Galilee, as I have found in the same book of Joshua. Ephrathah can sound in our language καρποφόρον, rich and fruitful, and show in a mystery the very same thing as house of bread.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
