[[commentary]]
quote='''
But if we wish to understand it of the Antichrist, or of the devil who will work in the Antichrist, he too, with his cup, with which he will desire to overturn the discipline of Christ, will make very many drunk, so that, drunk, they enter his caves; but after the end has come, instead of that glory with which he had magnified himself, he will be filled with shame. And he will be filled, because he will drink the cup of punishments, and he will be shaken, in no way firm in his malice, but trembling, and repenting too late. For the cup of the right hand of the Lord will surround him, the Lord who is also the Savior, when he slays him with the spirit of his mouth and destroys him with the illumination of his coming. Then all the shame which he gathered for himself by thoughts, deeds and words will come upon his glory, so that as renowned as he was formerly thought, so full of shame he will afterward be. For he blasphemed against God, and the impiety which he exercised in Lebanon will cover him, and the fury of many men who raged against the Church of God will be imputed to him, nor will he be able to lift his neck, but he will be pressed down to the earth by terror. For he slew many men, and laid waste with his impiety the whole world, that is, the Church of Christ and its inhabitants. It must be known, therefore, that this chapter too, which we have now expounded, that is: Woe to him who gives drink to his neighbor with a turbid overturning, and the three before it, in which it was said: Woe to him who multiplies for himself what is not his, and: Woe to him who gathers evil covetousness for his house, and: Woe to him who builds a city in blood, can be taken equally both according to the history and according to anagogy, either against Nebuchadnezzar or against the devil and the Antichrist and the heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
