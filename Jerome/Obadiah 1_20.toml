[[commentary]]
quote='''
Where we have put 'Bosphorus', the Hebrew has Sapharad, and I do not know why the Seventy could have translated it 'Ephrata', since Aquila and Symmachus and Theodotion agree with the Hebrew truth. We, however, learned from the Hebrew who instructed us in the Scriptures that the Bosphorus is so called; and, speaking as a Jew, this, he said, is the region to which Hadrian transferred the captives. When, therefore, our Christ comes, then that captivity too will return into Judea. We can, however, understand any place whatever of the kingdom of Babylon, although I also think something else. For it is the custom of the prophets, when they speak against Babylon, the Ammonites, the Moabites, the Philistines and the other nations, to make use of their language in many words, and to preserve the idioms of the provinces. Since, therefore, in the language of the Assyrians a boundary, which in Hebrew is called Gebul, is called Sapharad, I conjecture this to be the sense: The exile of Jerusalem, which is divided among all boundaries and regions, shall recover the cities of the South, that is, of its own tribe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"


[[commentary]]
quote='''
Since we have interpreted according to the history as well as we could, and have steered our little boat among rugged rocks, let us spread the sails of spiritual understanding, so that, with the Lord breathing upon us and unlocking his mysteries, we may joyfully reach the harbor. At the time when Benjamin had possessed Gilead, the exile of the host of the children of Israel, or at any rate the beginning of the exile of the once fleshly Israel, shall be this: that it reaches the land of the Canaanites; and that the prophetic word, which was in danger of famine in Judea, once the fleece of Israel was dried up, passes over to the dew of the nations, and there is both fed and feeds, while it is both received by the believers and itself feeds the believers. Sareptha either is compounded of two words and means 'straitness of bread', or is a single word and is translated 'burning'. Canaan, on the other hand, is rendered σάλον, that is, 'motion', or else it is called 'merchant' and 'lowly'. Therefore the exile of the children of Israel, when they have left behind the letter that kills and have come to the Spirit that gives life, will move all the things that belong to the law. Out of many pearls it will trade for the one most precious pearl, and, having laid aside the pride of the Jews, it will pursue Christian humility; and it will come as far as the place where formerly there was tribulation of bread, and the widow woman, deserted by her maker, could barely nourish her orphaned son, and where all her sins and vices are burned up together. But the captivity or exile of Jerusalem, where once there was the vision of peace, and which is now scattered through the whole world, shall possess the cities of the south, that is, the churches of the true and perfect light, and, repenting, shall say with the bride: Where do you pasture, where do you lie down at midday? And, received with Joseph into its ancient brotherhood, it shall be made drunk with the blood of the shepherd and prince. But if, following the Seventy, we read Ephrata, no one can doubt that the faith of Christ is meant. For Ephrata means καρποφορία, that is, fruitfulness, and is δυώνυμος (having two names), and is called Bethlehem, in which the heavenly bread was born.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
