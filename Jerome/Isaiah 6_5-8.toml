[[commentary]]
quote='''
Let us give another example too. Isaiah, when he had seen the Lord sitting upon a throne high and lifted up, what does he say? 'Woe is me, wretched that I am, for I am pricked with compunction, because I have unclean lips, and I sit in the midst of a people that has unclean lips.' See what he says, Woe is me, wretched, because I have unclean lips. And afterward what does he say? Because he had unclean lips, therefore one of the seraphim is sent, and takes a coal of fire from the altar, and touches his lips and his tongue, and purges it. And what does he say? 'Behold, this has touched your lips, and has cleansed your tongue.' And at once what does he say? 'Whom shall I send to this people, and who shall go?' O the mysteries of the Scriptures! As long as he had a deceitful tongue and unclean lips, it is not said to him, Whom shall I send, and who shall go? His lips are cleansed, and at once he is sent to speak. So then he who has unclean lips cannot prophesy, cannot be sent into the service of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"
