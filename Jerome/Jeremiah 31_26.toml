[[commentary]]
quote='''
And those who had been weary and had hungered, inebriated and satisfied, give thanks, answering: 'I awoke and saw the Lord', namely raising them up and saying: arise, you who sleep, and rise from the dead, and Christ will enlighten you. 'And my sleep', he says, 'was sweet to me, so that I might imitate the words of my Lord, who says: I slept and was put to rest; and I rose up, because the Lord sustained me'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
