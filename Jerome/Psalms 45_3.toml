[[commentary]]
quote='''
But if he had no form nor glory, but his form was ignoble and failing beyond the sons of men, or, as it stands in the Hebrew, despised and the lowest of men, how is it said in the Psalms: Gird your sword upon your thigh, O most mighty, in your beauty and comeliness (Ps 44 [45]:4)? This is easily resolved. He was despised and ignoble when he hung on the cross and, made a curse for us, bore our sins, and said to the Father: God, my God, why have you forsaken me (Matt 27:46)? But he was glorious and comely in appearance when at his passion the earth trembled, the rocks were split, and, as the sun fled, the elements feared an eternal night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
