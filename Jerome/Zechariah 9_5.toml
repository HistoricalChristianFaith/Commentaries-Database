[[commentary]]
quote='''
Ashkelon shall see and fear, and Gaza, and shall grieve exceedingly; and Ekron, because her hope is confounded, and the king shall perish from Gaza, and Ashkelon shall not be inhabited. And the separator shall sit in Ashdod, and I will destroy the pride of the Philistines. And I will take away his blood from his mouth and his abominations from between his teeth, and he too shall be left to our God, and he shall be as a leader in Judah, and Ekron as the Jebusite. And I will surround my house with those who fight as soldiers for me, going and returning, and the exactor shall no more pass over them, for now I have seen with my eyes. LXX: Ashkelon shall see and fear, and Gaza, and shall grieve exceedingly; and Ekron, because she is confounded in her hope, and the king shall perish from Gaza, and Ashkelon shall not be inhabited. And foreigners shall dwell in Ashdod, and I will destroy the insolence of the foreigners, and I will take away their blood from their mouth, and their abominations from between their teeth, and these too shall remain to our God, and they shall be as a χιλίαρχος, that is, tribune, in Judah, and Ekron as the Jebusite; and I will set up a height in my house, so that no one may pass through, or return, and no driver-off and towering one shall come upon them any more, for now I have seen with my eyes. Ashkelon is interpreted ignoble fire, or weighed; Gaza, strong, or rule; Ekron, barren, or uprooted; Ashdod, which in Hebrew is called Esdod, generating fire, or fire of the paternal uncle, or fire of the breast; Jebusite sounds trodden down. We have set out the etymologies of the names in order to run briefly through the sense. Ashkelon and Gaza and Ekron, seeing that Hamath was within the borders of Damascus, and that Tyre and Sidon, after they were struck round about, and all their hay, wood and stubble burned up in the conflagration, were possessed by the Lord; they too, terrified by fear and grief and confusion, began to hope for better things. In short, Ashkelon, in which there was before the ignoble fire of the devil, and which had come to the full measure and weight of sins, trembled with dread because she ceased to have inhabitants. And Gaza grieved exceedingly, doing penance for her former crimes, she who had once been strong and hard, untamable, and had promised herself the rule over all, because her king and princes, the contrary word and the power of the enemy, had lost their rule. Ekron too, barren because without the law and the knowledge of God she had no sons, was uprooted, so that she might hear that prophetic word: Rejoice, barren one who do not bear; break forth and cry, you who are not in labor, for many more are the sons of the desolate than of her who has a husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
