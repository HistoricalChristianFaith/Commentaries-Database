[[commentary]]
quote='''
And I will bring them back, he says, from the land of Egypt, and from the Assyrians I will gather them. From the land of Egypt, in which King Pharaoh ruled, who once said boastfully: The rivers are mine, and I made them. And from the land of Asshur, which the king of Assyria held, the great mind, who himself also said: Above the stars of heaven I will set my throne, and I will be like the Most High. And when the Lord has gathered the nations from the darkness of Egypt, and from the tribulation of the world, and from the power of the Assyrian, who is interpreted 'reproving and convicting', for he is the enemy and the avenger, he will lead them into the land of Gilead and of Lebanon. Gilead, turned into our language, is 'the testimony of migration', when we pass over from carnal things to spiritual, come from the part to the whole, leave earthly things behind and migrate to the heavenly. And Lebanon is interpreted λευκασμὸς, that is, whitening. So we are led out of the darkness of Egypt so that, after we have passed over and migrated out of the world, we may be made white in the Lord, and it may be said of us: Who is this who comes up made white? Others, following an ambiguity of the Greek tongue, by which both the mountain of Phoenicia and frankincense are called Libanus, here interpret Lebanon as frankincense, and think that God is signified by the frankincense, so that, after we have passed over from earth to heaven, the Savior's prayer may be fulfilled in us: Father, grant them that they may be one in us, as I and you are one. Hence the bride too says to the bridegroom in the Song: The fragrance of your garments is like the fragrance of Lebanon. And when he has led us into the land of Gilead and of Lebanon, room shall not be found for us, so that we shall in no way be confined by the narrow bounds of the earth, but shall enjoy the breadth of the heavens.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
