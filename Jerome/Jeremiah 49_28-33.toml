[[commentary]]
quote='''
This, I think, is what the title in Jeremiah expresses: To Kedar and to the kingdoms of Hazor, which Nebuchadnezzar king of Babylon struck (Jer 49:28); and at once there follows: Thus says the Lord: Arise and go up to Kedar, and lay waste the sons of the East: they will take their tents and their flocks; they will carry off for themselves their skins and all their vessels and their camels (ibid., 29); and again: For Nebuchadnezzar king of Babylon has taken counsel against you, he has devised plans against you. Arise and go up against a nation at ease, dwelling confidently, says the Lord: no doors, no bars for them: they dwell alone. And their camels will be for plunder, and the multitude of their cattle for a prey. And I will scatter to every wind those who have the hair of their head cut round: and from all their borders I will bring destruction upon them, says the Lord: and Hazor will be a dwelling of dragons, deserted forever; no man will remain there, nor will a son of man inhabit it (ibid., 30ff.). I have set down the whole testimony of the prophecy from Jeremiah, so that you may understand without doubt what Kedar is. And consider how he has described exactly the nation of the Ishmaelites, that is, of the Saracens: because they dwell in tents; they hold whatever abodes the night drives them to; they have herds, and flocks, and droves of camels; they have neither doors nor bars, for they do not live in cities but dwell in the wilderness. These too, then, were destroyed by the Babylonians, in that they overthrew to the ground the city of Hazor, which was the metropolis of that nation in the desert; and yet, though their droves of camels and sheep were taken, and their skins and tents divided by lot, the destruction of that whole nation is not signified, because on dromedary camels they are wont to flee a hundred miles and more in a single day through the vast wilderness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
