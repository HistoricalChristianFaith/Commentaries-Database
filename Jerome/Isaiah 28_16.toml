[[commentary]]
quote='''
And immediately we encounter the gate of the corners, where the corner stone is, which the builders rejected and has become the head of the corner. This corner stone connects both walls and brings two peoples into one, about which God speaks through Isaiah: Behold, I will place in Zion a corner stone, chosen and precious in its foundation; and whoever believes in him will not be put to shame. Here the cornerstone and other cornerstones wanted to be built, so that the apostle Paul might freely say: Built upon the foundation of the apostles and prophets, Jesus Christ himself being the chief cornerstone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"


[[commentary]]
quote='''
Jesus said to them: Have you never read in the Scriptures: The stone which the builders rejected, the same has become the head of the corner? This is the Lord's doing, and it is marvelous in our eyes. Various parables and different teachings are woven into this story. For those whom he previously called workers, vine-dressers, and farmers, he now calls builders, that is, masons. Hence the Apostle says: You are God's field, you are God's building. So just as bricklayers and vine-growers take possession of a vineyard, they also took possession of a stone, which they either place in the foundations, next to the architect Paul, or in the corner, to join together two walls, that is, both peoples, who were rejected by them, became the cornerstone. And this was done by the Lord, not by human strength, but by the power of God. Peter also confidently speaks of this stone of support: This stone, which was rejected by you builders, has become the cornerstone. And Isaiah said: Behold, I will send a chosen, precious, corner stone into the foundations of Zion: and he that believeth in him, shall not be confounded.
Therefore I say to you, that the kingdom of God will be taken away from you, and it will be given to a nation producing its fruits. I have said many times that the kingdom of God is to be understood as the holy Scriptures, which the Lord took away from the Jews and gave to us, so that we may produce their fruits. This is the vineyard that is entrusted to the farmers and winegrowers, and those who do not work in it, having only the name of the Scriptures, will lose the fruits of the vineyard.
And whoever falls on this stone will be broken; but on whomever it falls, it will grind him to powder. It is one thing to offend Christ through evil works, another to deny Him. Whoever is a sinner, yet believes in Him, falls indeed on the stone and is broken, but is not utterly crushed; for he is preserved through repentance for salvation. But on whomever the stone falls, that is, on whom the stone itself will crash down, and who completely denies Christ, it will grind him to powder, so that not even a shard remains, in which a little water could be poured.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Therefore thus says the Lord God: Behold, I will lay in the foundations of Zion a tried stone, a corner stone, precious, founded with a foundation: he who believes, let him not hasten. And I will set judgment in the weight, and righteousness in the measure: and hail shall overthrow the hope of falsehood, and waters shall overflow the protection. And your covenant with death shall be blotted out, and your pact with hell shall not stand; when the overflowing scourge passes through, you shall be trodden down by it. When it passes through, it shall take you away: for in the morning, at daybreak, it shall pass through, in the day and in the night, and vexation alone shall give understanding to the hearing: For the bed is straitened, so that one must fall out, and a short cloak cannot cover both. LXX: Therefore thus says the Lord: Behold, I will put into the foundations of Zion a precious stone, chosen, a corner stone, honorable, in its foundations; and he who believes shall not be confounded. And I will set judgment in hope, and my mercy in the weight; and those who trust vainly in a lie, since the tempest shall not pass through us, and shall not take from us the testament of death, also your hope in hell shall not remain. If the coming tempest passes through, you shall be trodden down by it: when it passes through, it shall take you in the morning, in the morning it shall pass through: by day and by night there shall be a most evil hope. Learn to hear, you who are in tribulation: We cannot fight, and we ourselves are too weak to be gathered together. I had said to you, he says: Hear the word of the Lord, you scornful men, or afflicted princes of my people, and do not have a covenant with death nor a pact with hell, you who, despising my precepts, have made a lie your hope, and, boasting, or rather despairing, say: by a lie we shall be protected. Therefore the Lord, who is merciful and compassionate, patient and abounding in mercy (Ps 144 [145]), says that, against your will, he will lay in the foundations of Zion a stone chosen and tried and precious and a corner stone. Of this the Apostle too speaks: As a wise architect I have laid the foundation (1 Cor 3:10); and again: For no one can lay another foundation than that which is laid, which is Christ Jesus (ibid., 11). This stone is truly, and a second time, called a stone, just as in Leviticus man, man is said twice; and a corner stone, because it joined together the peoples of the Circumcision and of the Gentiles, of which it is said in the psalm too: The stone which the builders rejected has become the head of the corner (Ps 117 [118]:22). These are the builders and masons who are now called scornful men and princes of the people that is in Jerusalem. Of this stone we read in Daniel too, that it was cut from the mountain without hands and filled the whole world (Dan 2): because the dispensation of the divine offspring took a human body, and the fullness of the Godhead dwelt in it bodily. Upon this stone, which by another name is called the rock, Christ built the Church, and, according to the Hebrew, founded it with a firm foundation; in which whoever believes shall not be confounded, or, according to the Hebrew, let him not hasten: that is, lest the coming of Christ should seem slow to him. For if he delays, according to Habakkuk, let no one despair: because he will surely come, and will fulfill his promises (Hab 2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
