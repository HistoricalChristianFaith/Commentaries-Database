[[commentary]]
quote='''
There follows: The Lord God will not do a thing unless he has revealed his secret, or his correction, to his servants the prophets; not that God reveals to the prophets everything that he does in heaven or has already done before, but what he is going to do on earth. He revealed to Noah his servant that he was going to bring on the flood. He revealed to Abraham and Lot his servants that Sodom and Gomorrah, Admah and Zeboiim were going to burn. He revealed to Joseph the interpretation of the dream of the seven years of famine in Egypt, and to the prophet Jonah the overthrow of Nineveh, so that those who heard of the punishments to come might either repent and avoid the torments, or, if they scorned them, be punished more justly. So now too the Lord reveals through Amos his servant and prophet what he is going to do to the ten tribes, so that, if they are turned to better things and abandon their idols, they may be freed from the danger that threatens. And note that God, merciful and kind, always foretells what is to come, so that he may not be forced to inflict punishments. And what the heretics slanderously charge against the Creator, as though he were severe and savage, cruel, and nothing but a judge, because there is no evil in a city which he does not do, this we refer to the greatness of his mercy, in that he does not inflict punishments unless he has foretold them beforehand. And he who foretells does not wish to punish sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
