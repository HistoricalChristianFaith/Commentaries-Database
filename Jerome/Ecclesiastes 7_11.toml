[[commentary]]
quote='''
Some interpret this passage thus: By inheritance, they say, he meant good conduct, through which we are heirs of God and joint heirs of Christ. Ecclesiastes therefore wishes to teach how far those who merit to see the sun of justice, and have wisdom together with good conduct, differ from those who, without wisdom, have devoted their zeal only to their life and conduct. This Daniel also shows, saying: Those who understand my words will shine like the lights of heaven; or as Theodotion rendered it: Like the brightness of the firmament. And those who have done my words, like the stars of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
