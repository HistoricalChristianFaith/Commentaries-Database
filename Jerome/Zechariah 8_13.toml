[[commentary]]
quote='''
And it shall be: as you were a curse among the nations, O house of Judah and house of Israel, so I will save you and you shall be a blessing: do not fear, let your hands be strengthened. For thus says the Lord of hosts: As I purposed to afflict you, when your fathers had provoked me to anger, says the Lord, and I did not have mercy, so, having turned, I have purposed in these days to do good to Jerusalem and to the house of Judah: do not fear. LXX: And it shall be: as you were in a curse among the nations, house of Judah and house of Israel, so I will save you, and you shall be in a blessing; take courage and be strengthened in your hearts, for thus says the Lord Almighty. As I purposed to afflict you in that your fathers had provoked me to anger, says the Lord Almighty, and I did not repent, so I am ready and have purposed in these days to do good to Jerusalem and to the house of Judah: take courage. He promises these things as to come after the building of the temple: that as the house of Judah and the house of Israel, namely the two and the ten tribes, were among all the nations a curse and a hissing and an example, so, when they have been saved and have returned to Judea, they may be a blessing to all. Do not fear, he says, the adversaries who rebel; be confident that what the Lord promises through me is true, let your hands be strengthened, finish the works which you have begun.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
