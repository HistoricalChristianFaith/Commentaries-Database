[[commentary]]
quote='''
And he commands this because the vision is still far off, and set in an appointed time. And when the end of things has come, then he too will come, and the prophecy will be proved true, fulfilled in deed. But if perhaps, through your desire, O reader, and your ardor to see the vision, what has been promised should seem to you to delay a little, do not despair of its coming, but wait patiently: for you have me, who promise you and say: Coming he will come, and will not tarry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
But the vision itself, of which I said to you: Write the vision, and make it plain on boxwood, that he who reads may be able to pursue, is still set in an appointed time, of which the Savior says: In an acceptable time I have heard you, and in the day of salvation I have helped you. And it will rise at the consummation of the world, and in the last hour of the day, of which John also speaks: Little children, now it is the last hour, and it will not come in vain; for it will save many, and with the remnant of the Israelite people it will gather a multitude of the nations. But if she withdraws herself a little, and the vision begins to come more slowly than your wishes, O reader, who are commanded to read on the boxwood and on the tablets which the prophet wrote out, wait for her, for coming she will come, and will not tarry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
