[[commentary]]
quote='''
And when they have risen early to the Lord, what will they say? Come, and let us return to the Lord. They are not content with their own salvation, but urge one another on to return to the Lord whom they had left, whom they had deserted because of their sins, by whom they had been abandoned. For he has seized and he will heal us; he who had said above: I, I will seize and go, will strike and heal us. For what we have said, "he will cure", all alike translated μοτώσει (will dress with lint); now properly μότα is the name for the little linen pads that are inserted into wounds, to eat away the putrid flesh and draw out the pus; and it belongs to the art of physicians to heal great wounds over a long time and to restore health through pain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
