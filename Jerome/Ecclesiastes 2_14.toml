[[commentary]]
quote='''
[Daniel 2:28] "But there is a God in heaven who reveals mysteries." Therefore it is only in vain that thou inquirest (other MSS have: "that he inquire") of men as to something which is known only to God in heaven. Also, by indirectly drawing Nebuchadnezzar away from the worship of many gods, Daniel directs him to the knowledge of the one (true) God.

"Who hath shown thee, King Nebuchadnezzar, what is going to take place (the Vulg. reads: "the things which are going to take place") in the last times." Avoiding the blemish of adulation but cleaving to the truth, he courteously suggests that it is to the king, for it was to him that God had revealed secrets concerning what was to occur in the last times. Now either these "last days" are to be reckoned from the time when the dream was revealed to Daniel until the end of the world, or else at least this inference is to be drawn, that the over-all interpretation of the dream applies to that final end when the image and statue beheld is to be ground to powder.

"Thy dream and the visions of thy head upon thy bed were as follows." He does not say, "The visions of thine eyes," lest we should think it was something physical, but rather: "of thy head." "For the eyes of a wise man are in his head" (Ecclesiastes 2:14), that is to say in the princely organ of the heart, just as we read in the Gospel: "Blessed are the pure in heart, for they are ones who shall see God" (Matthew 5:8). Again: "What are ye meditating in your hearts?" (Matthew 9:4). To be sure, other authorities in treating of this chapter, conjecture that the authoritative part of the soul (to hegemonikon) lies not in the heart but, as Plato says, in the brain.
'''
source_url='https://www.ccel.org/ccel/pearse/morefathers/files/jerome_daniel_02_text.htm'
source_title="St. Jerome, Commentary on Daniel, CHAPTER TWO"

[[commentary]]
quote='''
And when this wisdom and revelation have made them wise and have opened to them the hidden mysteries, it follows at once that they have the eyes of the heart enlightened. From the present words it is proved that, corresponding to the members of the outer man, members of the inner man are also spoken of. For see, he has plainly named the eyes of the heart, which we cannot understand apart from the sense and the mind. With this agrees also that word of the Psalmist: Enlighten my eyes, that I may never sleep in death (Ps. 12:4). And elsewhere: The eyes of the wise man are in his head (Eccles. 2:14). For if we take them simply as the eyes of the flesh, surely the eyes not only of the wise man but also of the fool are in his head. So the head of the wise man is taken to be the sense, which by another word is called the mind (mens), and the mind (animus), and the ruling part of the heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Because of this helmet of salvation, all the senses in our head remain intact, and above all the eyes, of which Solomon says in Ecclesiastes: The eyes of the wise man are in his head (Eccles. 2:14). For he knew what the head of a man was, and what those eyes were that are placed in the head of a man. For if the head of a man is Christ, and the eyes of the wise man are in his head, it follows that all our sense, mind, thought, speech and counsel (if indeed we are wise) are in Christ; and in Christ the Word, the light, righteousness, truth and all the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
The eyes of the wise man are in his head, and the fool walks in darkness. And I came to know that one event will befall them all. He who has come to the perfect man and has deserved to have Christ as his head will always have his eyes on Christ, and, lifting them on high, will never think of lower things. Since these things are so, and there is so great a distance between the wise man and the fool that the one is compared to day and the other to darkness, the one lifts his eyes to heaven and the other bows them to the earth, this thought suddenly crept upon me: why the wise man and the fool are ended by a common death, why the same blows, the same event, the same death, equal distresses press upon both.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
