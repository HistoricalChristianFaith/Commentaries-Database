[[commentary]]
quote='''
Beautifully too he added through the Gospel, of which I was made a minister according to the gift of the grace which was given to me according to the working of his power, so as to show the grace of God, not his own merit. For he knew that he had been a persecutor and had laid waste the Church of Christ; by this humility the charge of arrogance is wholly excluded. On this point some think he should be rebuked, because he said that a mystery was revealed to him which had been unknown to the patriarchs and prophets. For a disciple of humility would never swell with words of arrogance, he who says that the Gospel of which he is a minister came not of his own merit, but of the grace of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
