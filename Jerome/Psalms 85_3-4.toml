[[commentary]]
quote='''
You have softened all Your wrath, You have turned away from the wrath of Your indignation. Turn us, O God of our salvations. See what he says. You, for Your part, have turned away from wrath on account of Your clemency. Turn us, O God. You have turned away from wrath; turn us away from sins. Turn us, O God of our salvations. Why did he not say, "of our salvation," but, "of our salvations"? If we sinned but once, we would need one salvation. We have sinned in many things, therefore we need many salvations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_017.html'
source_title="Homily 17, on Psalm 84"

[[commentary]]
quote='''
You have mitigated all your wrath, you have turned away from the wrath of your indignation. See what penance avails: it holds off the imminent wrath of God. Convert us, O God of our salvations. He did not say, "of our salvation": because we have sinned much, we have need of many salvations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_064.html'
source_title="Homily 64, on Psalm 84 (Alternate Series)"
