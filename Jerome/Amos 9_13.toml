[[commentary]]
quote='''
Behold, the days are coming, says the Lord, and the ploughman shall overtake the reaper, and the treader of the grape him who sows the seed. And the mountains shall drip sweetness and all the hills shall be tilled. And I will turn back the captivity of my people Israel, and they shall build the deserted cities, and they shall dwell in them, and they shall plant vineyards, and they shall drink their wine, and they shall make gardens, and they shall eat their fruits. And I will plant them upon their own soil, and I will not uproot them any more from their land which I have given them, says the Lord your God. LXX: Behold, the days are coming, says the Lord, and the threshing shall overtake the vintage, and the grape shall change its colour at the sowing. And the mountains shall drip sweetness, and all the hills shall be planted. And I will turn back the captivity of my people Israel, and they shall build the ruined cities, and they shall dwell in them, and they shall plant vineyards, and they shall drink their wine, and they shall make gardens, and they shall eat their fruit. And they shall be planted upon their own land, and they shall not be torn away any more from their land which I have given them, says the Lord God Almighty. When the tabernacle of David that had fallen has been raised up, and what had slipped and been overturned has been rebuilt, the abundance of all things is described: how those who before going went and wept, carrying their seeds, coming shall come with exultation, carrying their sheaves, so that the threshing of the sheaves overtakes the vintage, or the ploughman the reaper, and the grape changes its colour and takes on its hue at the time of sowing. Or, as is truer, the treader of the grape overtakes the sowing, and so all things follow one upon another, so that no day is without grain, wine and joy. In that time the grape will be trodden in full winepresses, and new wine reddened with the blood of Christ and of the martyrs will be poured out, and a treader of the grape of this kind will be the seedbed of the word of God, so that their blood cries out in the world more than the blood of righteous Abel cried out. And whoever by the merit of his virtues has climbed up to the mountain heights will sweat honey, or rather will drip the sweetness of the word of God, of which it is written: Taste and see how sweet the Lord is, and: How sweet are your words to my throat, above honey and the honeycomb to my mouth. And those who are below the mountains, or rather second to the mountains, whom the bridegroom leaps over in the Song of Songs and calls hills, will be planted and will imitate the paradise of God, so that every fruit of teachings hangs in them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
