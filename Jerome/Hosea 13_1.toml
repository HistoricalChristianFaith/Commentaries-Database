[[commentary]]
quote='''
But when the heretics speak, nay, the princes of the heretics, that is, Ephraim, horror and trembling will seize the unhappy people; and he will sin in the idols which he has fashioned from his own heart, and he dies with the people whom he has seduced.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
