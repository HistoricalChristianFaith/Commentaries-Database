[[commentary]]
quote='''
It was a mark of Divine power in Him thus to dismiss the Spirit as Himself had said, No man can take my life from me, but I lay it down and take it again. (John 10:18.) For by the ghost in this place we understand the soul; so called either because it is that which makes the body quick or spiritual, or because the substance of the soul itself is spirit, according to that which is written, Thou takest away their breath, and they die. (Ps. 104:29.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus, crying out again with a loud voice, sent forth his spirit. It is a sign of divine power to send forth the spirit, as he himself had also said: No one can take my soul from me, but I lay it down of myself, that I may take it up again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
