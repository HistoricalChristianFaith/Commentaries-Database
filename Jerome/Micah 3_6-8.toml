[[commentary]]
quote='''
Wherefore, O you heretics, who think that you have prophecy and imitate the Church of God, where you suppose there is vision, there will be night, and where you boast of prophetic utterance, there the unclean spirit will speak. For the sun of justice will set upon prophets of this kind, and they will see their own darkness and be confounded. And when they have been proved to be diviners rather than prophets, they will be laughed at over their dreams, and the peoples who had formerly been deceived by them will speak against them. Then the teachers themselves too will repent, and no one will hear them except I, whom they had offended. And because I am merciful, and do not wish the death of the sinner, but desire that he turn back and live, when I have heard them I will give them the power of my spirit, and I will fill them with my judgment and strength, so that those who formerly deceived the people with blandishments may afterwards, by declaring true things, deter them and call them back to the right way, and those who had been the cause of error may begin to heal the wounds which they had inflicted, and become an occasion of health. Notice in the present passage that someone can teach after sin, provided, however, that he has washed away his former vices with worthy repentance. Hence David too, after adultery and homicide, says in the psalm: You will sprinkle me with hyssop, and I shall be cleansed; you will wash me, and I shall be made whiter than snow. Nor is he content with his own purity alone, but he adds: Restore to me the joy of your salvation, and strengthen me with a governing spirit. And when you have done this. I will teach, he says, the wicked your ways, and the impious will be turned to you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
