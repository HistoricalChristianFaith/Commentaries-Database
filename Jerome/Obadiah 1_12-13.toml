[[commentary]]
quote='''
And you shall not look down on the day of your brother, on the day of his sojourning abroad. And you shall not rejoice over the children of Judah on the day of their destruction, and you shall not magnify your mouth on the day of distress, nor shall you enter the gate of my people on the day of their ruin. LXX: And you shall not look down on the day of your brother on the day of strangers. And you shall not rejoice over the children of Judah on the day of their destruction; and you shall not speak great things on the day of distress, nor shall you enter the gates of the peoples on the day of their labors. The same sense as above: when the man has perished from Mount Esau because of the slaughter and the impiety against his brother Jacob, and everlasting confusion has covered him, he shall by no means do what he did before against his kinsman; for he shall not look down on him and think him of little account when he sees his brother going into captivity; nor shall he rejoice over the children of Judah. For the two tribes, apart from the tribe of Levi, which reigned in Jerusalem and were called Judah, were captured by the Chaldeans. And you shall by no means speak great things, and, believing yourself to be as one of the victors, laugh at your brother's distress. Nor, on the day of the devastation and ruin of my people, shall you march boastfully through the gate of Jerusalem. And you shall therefore not do these things, because you too shall suffer the like.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
