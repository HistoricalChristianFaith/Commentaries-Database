[[commentary]]
quote='''
Jeremiah needed the help of Ahikam. How much more do we need that of God.
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="Against the Pelagians 2.27"

[[commentary]]
quote='''
But although Jeremiah was freed by the help of the Lord, yet it is reckoned as a reward to him also through whom the Lord freed his prophet, namely to Ahikam, son of Shaphan, as we shall read later, when Jeremiah is freed from the danger of death out of the cistern of mud by the counsel and protection of Ebed-melech the eunuch.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
