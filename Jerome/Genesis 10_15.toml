[[commentary]]
quote='''
And Canaan begot Sidon his first-born, and Chettaeus and Jebusaeus and Amorraeus and Gergesaeus and Evaeus and Aracaeus and Sinaeus and Aradius and Samaraeus and Amathaeus. Of Canaan the first-born was Sidon, from whom a city in Phoenicia is called Sidon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
