[[commentary]]
quote='''
But observe, that to Pilate who asked the question unwillingly He did answer somewhat; but to the Chief Priests and Priests He refused to answer, judging them unworthy of a word; And when he was accused by the Chief Priests and Elders, he answered nothing.

Thus though it is a Gentile who sentences Jesus, he lays the cause of His condemnation upon the Jews.

Or, Jesus would not make any answer, lest if He cleared Himself the governor should have let Him go, and the benefit of His cross should have been deferred.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus stood before the governor. And the governor questioned him, saying: Are you the king of the Jews? Since Pilate questions him on no other charge than whether he is king of the Jews, the Jews are convicted of impiety, because they could not find, even falsely, anything to lay against the Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
