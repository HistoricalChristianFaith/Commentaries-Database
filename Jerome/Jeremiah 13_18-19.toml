[[commentary]]
quote='''
The cities of the south are shut up, that is, the tribe of Judah and Jerusalem, which, lying next to the desert, faces toward the south, and there is none who opens them, surrounded as they are by siege. All Judea has been carried away — or all Judah — with exile complete, or 'it has received what it deserved, and it has been fulfilled in it'; for so the Seventy translated. He raves in this place who understands the king as Christ and the mighty as angels or apostles, as if they were to take on the body of humility and sit in the dust and lose — either the king or the mighty — from their head the crown and the glory of strength. He also interprets the shut cities of the south as hell, as cities opened to no one, and says that all the glory of Judah was carried away when there was fulfilled in the passion: All have turned aside, together they have become useless; there is none who does good, there is not even one. The Hebrew word 'gebira' Aquila and Symmachus translated 'mistress' and 'lady'; the Seventy thought it was 'geburoth' and said 'the mighty'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
