[[commentary]]
quote='''
As I live, says the Lord: though Jeconiah son of Jehoiakim, king of Judah, were a ring on my right hand, I will tear him — or you — from there, and I will give you into the hand of those who seek your life, and into the hand of those whose face you dread, and into the hand of Nebuchadnezzar, king of Babylon, — which is not found in the Seventy — and into the hand of the Chaldeans. And I will send you — or I will cast you — and your mother who bore you into a strange land, in which you were not born, and there you shall die; but to the land to which they lift up their soul, to return, there they shall not return. He had said above: 'To the house of the king of Judah you shall speak these things', and then: Go down into the house of the king of Judah, and again: Thus says the Lord concerning the house of the king of Judah; and in reversed order, after he has spoken about Zedekiah, who was the last of the kings in Jerusalem, he returns to Jehoiakim his brother, who reigned before him. This prophecy completed, he now speaks to the son of Jehoiakim, the grandson of Josiah, the king of Jerusalem, Jeconiah, who is also called by another name Jehoiachin, who was taken by Nebuchadnezzar and led into Chaldea with his mother and the princes and the craftsmen and many nobles, and died there. This, then, is what is said: 'If, as a ring does not leave the hand of the one who wears it and slips from the finger only with difficulty, Jeconiah were on my hand, yet I will tear him away and hand him over to the Babylonian king, and there he will die with his mother and all his companions, and he will no more see the land of Judea, which he longs for.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
