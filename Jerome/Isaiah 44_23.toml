[[commentary]]
quote='''
If you do this, know that heaven and earth rejoice in your salvation, and all the elements sing together; or the angels who dwell in heaven, and the other powers by which the foundations of the earth are borne; or certainly the Apostles and Prophets, of whom the Apostle also spoke: Built upon the foundation of the Apostles and Prophets (Eph 2:20). The mountains also and the forests, or the hills, which, according to the variety of their virtues, have held the first, the middle and the last places, are bidden to shout for joy and to sound the trumpet, knowing that the Lord has redeemed Jacob, and that he rejoices in the conversion of Israel; or that Israel himself, turned from error, becomes glorious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
