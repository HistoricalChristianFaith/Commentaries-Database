[[commentary]]
quote='''
You have made, says David, darkness, and it became night; in it all the beasts of the forest will pass through. The lions' whelps, to snatch and to seek their food from God. The lion is hard to find by day, but he always prowls in the nights, to snatch from the Church of Christ, so that, according to Habakkuk, he may be sated with choice foods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"
