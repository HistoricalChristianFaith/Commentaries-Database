[[commentary]]
quote='''
You have made, says David, darkness, and it became night; in it all the beasts of the forest will pass through. The lions' whelps, to snatch and to seek their food from God. The lion is hard to find by day, but he always prowls in the nights, to snatch from the Church of Christ, so that, according to Habakkuk, he may be sated with choice foods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"

[[commentary]]
quote='''
And not only will they lie open to the lion's bites, but the lion's whelp will seize them and lead them to his den, fleeing the light and making for the darkness. For everyone who sins loves the darkness and hates the light; of these we read in the psalm too: You have set darkness, and it became night; in it all the beasts of the forest will pass through. The lions' whelps roaring to seize their prey, and to seek their food from God. For the lion's whelp seeks not the prey which he already possesses, which is in his own power, but to snatch from the Church of Christ; of him it is written in Habakkuk: His foods are choice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
