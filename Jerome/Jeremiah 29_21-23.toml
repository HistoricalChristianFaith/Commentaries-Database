[[commentary]]
quote='''
Thus says the Lord of hosts, the God of Israel, to Ahab son of Kolaiah and to Zedekiah son of Maaseiah, who prophesy to you in my name falsely: Behold, I will deliver them into the hand of Nebuchadnezzar king of Babylon, and he will strike them before your eyes. And from them a curse will be taken up by all the exile of Judah that is in Babylon, saying: May the Lord make you like Zedekiah and like Ahab, whom the king of Babylon fried in the fire, because they did folly — or iniquity — in Israel and committed adultery with the wives of their friends — or fellow citizens — and spoke a word in my name falsely, which I did not command them; I am judge and witness, says the Lord. The Hebrews say that these are the elders who did folly in Israel and committed adultery with the wives of their fellow citizens, to one of whom Daniel says: you who have grown old in evil days and to the other: seed of Canaan and not of Judah, beauty has deceived you and lust has perverted your heart! Thus you did to the daughters of Israel, and they in fear spoke with you; but a daughter of Judah did not endure your iniquity. And what the prophet now says: and they spoke a word in my name falsely, which I did not command them, they think signifies this: that they so deceived wretched silly women, who are carried about by every wind of doctrine, as to tell them that, since they were of the tribe of Judah, Christ was to be begotten of their seed; and these women, enticed by desire, offered their bodies as if they would be the mothers of Christ. But what is said in the present passage: whom the king of Babylon fried in the fire, seems to contradict the history of Daniel. For that asserts that they were stoned by the people at Daniel's sentence; but here it is written that the king of Babylon fried them in the fire. Hence by many, indeed by almost all the Hebrews, that very story is not received, being taken as a fable, nor is it read in their synagogues. 'For how,' he says, 'could it be that captives had the power of stoning their princes and prophets?' And they affirm that this is rather the truth, which Jeremiah writes: that the elders were indeed convicted by Daniel, but that sentence was pronounced against them by the king of Babylon, who as victor and lord had authority over the captives. How many from our own flock too, like Ahab and Zedekiah, prophesy falsehood in the name of the Lord and do folly in Israel and commit adultery with the wives of their fellow citizens, who were begotten in the same city of the Church! These the true Nebuchadnezzar fries in the fire of sin, as the prophet Hosea says: all who commit adultery are like an oven kindled by the one who bakes. Happy he who takes up the yoke from his youth and sits alone, because he is filled with bitterness, and can say with David: I have not sat in the council of the malignant, and with those who do iniquity I will not go in! And what the prophet has now added: I am judge and witness, says the Lord, has this sense: 'these things which I say about the two false prophets, who speak a word in my name falsely which I did not command them, I have by no means come to know by opinion, but I myself know them to be true, I from whom no one can hide nor escape the truth of my judgment'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
