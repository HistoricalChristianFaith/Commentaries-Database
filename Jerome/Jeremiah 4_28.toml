[[commentary]]
quote='''
The heaven too will look sad above, and the earth itself will mourn, because the sentence of the Lord has come right to its end, and he has not repented of the things he purposed and spoke. But repentance is ascribed to God when a sentence foretold is withdrawn and raging wrath does not come right to its end. He threatened through Jonah, and the multitude of tears and groans overcame the impending sword.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
