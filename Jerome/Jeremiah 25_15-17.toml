[[commentary]]
quote='''
For thus says the Lord God of Israel to me: Take this cup of the wine of fury — or of pure wine — from my hand, and you shall give drink from it to all the nations to whom I shall send you; and they shall drink and be drunk — or vomit — and go mad before the sword which I shall send among them. And I took the cup from the hand of the Lord and gave drink to all the nations to whom the Lord sent me. The giving to drink of the cup, and of the cup 'of pure wine' or 'unmixed', which in Greek is called akratou, is a sign of the Lord's fury, so that all the nations which made war on the people of God drink of the cup of the Lord's fury, of which Isaiah too writes against Jerusalem: the bowl of fury, the cup of ruin you have drunk up and emptied; therefore arise! And this cup is drunk by all the nations for this reason: that they may vomit and go mad. This, indeed, a perverse interpreter takes in a good sense, as though, like a cathartic potion, it forces out whatever bile and phlegm and harmful humor there is in the breast, and restores former health. He also takes the Savior in place of Jeremiah, because he himself gave drink to all the nations, to whom he was also sent, so that, casting off idolatry, they might dedicate themselves to the worship of God. That this is contrary to holy Scripture what follows will show; for not as a remedy, as he would have it, but as a punishment are they given to drink from the undiluted cup.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
