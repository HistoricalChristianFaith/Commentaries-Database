[[commentary]]
quote='''
Someone may ask how the Prophet now says that he has seen the Lord, and not simply the Lord but the Lord Sabaoth, as he himself testifies in what follows; when the evangelist John has said: No one has ever seen God (John 1:18). And God speaks to Moses: You cannot see my face; for man shall not see my face and live (Exod 33:20). To which we shall answer that not only the divinity of the Father, but not even that of the Son and of the Holy Spirit, since in the Trinity there is one nature, can the eyes of the flesh behold; but the eyes of the mind, of which the Savior himself says: Blessed are the pure in heart, for they shall see God (Matt 5:8). We read that the Lord was seen by Abraham in the figure of a man; and that he who was God wrestled with Jacob as a man. Hence that very place was called Phanuel, that is, the face of God: For I have seen, he says, the Lord face to face, and my soul has been saved (Gen 32). Ezekiel too saw the Lord in the form of a man sitting upon the Cherubim; from his loins and downward there was as it were fire, and the upper parts had the appearance of electrum (Ezek 1). The nature of God, then, is not discerned, but he is seen by men as he wills.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
