[[commentary]]
quote='''
Even the Scribes and Pharisees reluctantly confess that He saved others. Your own judgment then condemns you, for in that He saved others, He could if He would have saved Himself.

But unworthy of credit is that promise, And we will believe him. For which is greater, to come down while yet alive from the cross, or to rise from the tomb when dead? Yet this He did, and ye believed not; therefore neither would ye have believed if He had come down from the cross. It seems to me that this was a suggestion of the dæmons. For immediately when the Lord was crucified they felt the power of the cross, and perceived that their strength was broken, and therefore contrive this to move Him to come down from the cross. But the Lord, aware of the designs of His foes, remains on the cross that He may destroy the Devil.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He saved others; himself he cannot save. Even against their will the scribes and Pharisees confess that he saved others. So your own sentence condemns you. For he who saved others could surely have saved himself too, if he had wished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Let him come down now from the cross, and we believe him. A deceitful promise! Which is greater: to come down from the cross while still alive, or to rise from the sepulcher when dead? He rose again, and you do not believe. Therefore, even if he had come down from the cross, you would likewise not believe. But it seems to me that the demons put this into them. For as soon as the Lord was crucified, they felt the power of the cross and understood that their strength was broken, and they are working for this, that he should come down from the cross. But the Lord, knowing the snares of his adversaries, remains on the gibbet in order to destroy the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
