[[commentary]]
quote='''
And lest they should perhaps say: 'it is an unjust sentence that the fathers eat the sour grape and the children's teeth are set on edge', he adds: but you too have done worse than your fathers, so that just punishments may be brought upon those who have sinned worse than their fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
