[[commentary]]
quote='''
For all that God has made is good, but good in its time. It is good to wake and to sleep; and yet it is not good always to wake or always to sleep, because each thing is good in its turn, according to God's disposition, when there is need of it. God also gave the world to men to inhabit, that they might enjoy the varieties of the seasons and not inquire into the causes of natural things, how all things were created, why from the beginning of the world to its consummation he has made this or that grow, remain, change.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
