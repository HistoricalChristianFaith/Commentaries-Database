[[commentary]]
quote='''
Therefore I bow my knees to the Father of our Lord Jesus Christ, from whom all fatherhood in the heavens and on earth is named.

Just as it was shown above that there are spiritual eyes after the likeness of the bodily lights, so now it must be understood that the knees of the outer man are one thing and those of the inner man another. For that which is said in Isaiah, Be strengthened, you slack hands and loosened knees (Isa. 35:3), and in another place by the Apostle himself, That in the name, he says, of Jesus every knee should bow, of things in heaven, of things on earth, and of things below (Phil. 2:10), pertains not to the knees of the body but to the subjection of the mind and the bowing of the soul and the obedience of the heart, which levels itself with the ground, as the Psalmist also sings, saying: My soul has cleaved to the pavement (Ps. 118:25). For how could the soul, a spiritual and incorporeal thing, cleave to the pavement, a bodily thing? Granted, indeed, that earthly beings bow the knee in the name of Jesus: can we also affirm that the angels and the other virtues, which abide in the heavenly places, have a bodily form, so that they bow the knee in his name? or that the souls in the underworld, freed from the bonds of the body, will bend a knee which they do not have? Therefore, just as whoever is subject to the Savior is said to bend the knee to him, so he who is the slave of sin, and has the spirit of slavery again in fear, is written to have bent the knee to sin. I have left for myself, says the Lord, seven thousand men who have not bowed their knees before Baal (1 Kings 19:18), that is, before an idol and before sin. He who is a fornicator, and runs about through brothels and harlots, bends his knee to lust. He who is furious worships anger with bent knee. He who looks up to mammon, and whose god is his belly, bends the knees to avarice and luxury. And what need is there for me to go through them one by one? We bend the knee to the devil as often as we sin. Yet in expounding these things spiritually we do not at once do away with the custom of praying according to the letter, by which we worship God in supplication with the knee set down, and, with the knee fixed on the ground, the more surely obtain what we ask of him. For we read both that Paul prayed thus on the shore and that kneelings in prayer are prescribed (Acts 21:5). But just as that edifies the simple, so we teach that the true kneeling is in the mind; for many who bend the bodily knee have by no means bowed the knee of the soul. And on the contrary, others, praying to God with the body upright, have bowed themselves the more in mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
