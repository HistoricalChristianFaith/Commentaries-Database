[[commentary]]
quote='''
And Dedan and Teman and Buz and all who are shorn round the hair. These nations are in the wilderness, neighboring on and intermingled with the regions of the Ishmaelites, whom they now call Saracens, and of whom it is said: who are shorn round the hair.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
