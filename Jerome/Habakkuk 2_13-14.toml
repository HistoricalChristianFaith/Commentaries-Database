[[commentary]]
quote='''
For there follows: Are not these things from the Lord Almighty? That is, such a building is not from the Lord Sabaoth, whom the LXX have here translated Almighty. For many peoples will fail, and although countless nations are led into their error, yet either they will grow weary, which ὠλιγοψύχησαν (they lost heart) rather signifies, or at any rate they will be pressed into a narrow space, and will not be able to be compared with the multitude of the Church. For while they fail in the fire, — which is understood either as their being consumed by the fire of the devil, their prince, or as their being kindled by the fire of the Lord, of which he says: I came to cast fire upon the earth, and how I wish that it may burn, and drawn back from their former course, and doing penance, and abandoning the journey they had begun, which is what ὀλιγοψυχία (faintheartedness) means —; the whole earth will be filled with the glory of the Lord, when, at the preaching of the apostles, their sound has gone out into the whole world, like waters covering the sea, that is, so that the waters of the Lord may cover all the saltness and bitterness of the world, which the earth had drunk as the devil rained it down from above, and may cause the place of the sea and of the former bitterness not to appear. Hence it is also said in the psalm: Blessed are they whose iniquities are forgiven, and whose sins are covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
Nor is its building from the Lord Sabaoth. Hence also many peoples failed in fire, and many nations grew weary at the time when it was surrounded by the armies of Vespasian and Titus, and those who came for the solemn day of the Passover were shut up in the city as in a prison, and failed through famine and want, and the siege of Hadrian brought them to the final ruins. And when the city of bloodshed and the town of iniquities had been overthrown, and the peoples consumed by fire, and the nations which had come to their help scattered this way and that and letting fall their weary hands, the whole earth was filled with the glory of Christ, and as with waters, so with his words and teaching the whole world was covered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
