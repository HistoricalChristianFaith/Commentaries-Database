[[commentary]]
quote='''
Where the Hebrew has: he wept and besought him; in Bethel he found him, and there he spoke with us, we read in the common edition: they wept and besought me, in the house of ὢν they found me, and there it was spoken to them; ὢν is interpreted sorrow. If anyone, therefore, weeps, and repents, and entreats the Lord, he will find him in the sorrow of his heart, and when he has called upon him, he will hear him answering him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
