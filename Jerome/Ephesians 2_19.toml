[[commentary]]
quote='''
Therefore you are no longer strangers and sojourners: but fellow citizens of the saints, and members of the household of God, built upon the foundation of the apostles and prophets, Christ Jesus himself being the chief cornerstone. In whom the whole building, fitted together, grows into a holy temple in the Lord. In whom you also are built together into a dwelling place of God, in the spirit.

To what he had said above: strangers to the covenants and the promise, he now responds: therefore you are no longer strangers and sojourners. And to what he had put earlier, alienated from the way of life of Israel, he now returns: You are fellow citizens of the saints, and members of the household of God. This passage tells most of all against those who strive to introduce diverse natures. For how have strangers become fellow citizens of the saints, and how have those who were once alienated from the way of life of Israel become members of the household of God, if nature cannot be changed either for the better or for the worse?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
