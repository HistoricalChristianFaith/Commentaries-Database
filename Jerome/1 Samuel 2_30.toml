[[commentary]]
quote='''
A pearl will shine in the midst of squalor, and a gem … will sparkle in the mire. This is what the Lord promised when he said, "Those who honor me I will honor." Others may understand this of the future when sorrow shall be turned into joy and when, although the world shall pass away, the saints shall receive a crown which shall never pass. But I for my part see that the promises made to the saints are fulfilled even in this present life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_066.html'
source_title="LETTER 66.7"

[[commentary]]
quote='''
Yet it must be noted that where things are seemly and honorable, and in accordance with the merit of those who undergo them, God professes that he does them himself; but where they are sad and not worthy of God, he says indeed that they happen, but not by him, as in the present passage: Therefore fathers shall eat sons in the midst of you, and sons shall eat their fathers; for he did not say: 'I will make fathers eat their sons in the midst of you, and sons eat their fathers'; but what was seemly and did not seem unworthy of the majesty of God, he says he does himself, for there follows: And I will execute judgments in you, and I will winnow all your remnants into every wind. Something of the sort we shall be able to find also in the curses of Deuteronomy, and especially in that passage: Those who glorify me I will glorify; but those who despise me shall be brought to nothing; for those who glorify him he himself glorifies, but those who despise him will not be despised or brought to nothing by the Lord — for this is what would have followed for him to say —, but they will be brought to nothing absolutely, not by God but for their own deserts and sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
