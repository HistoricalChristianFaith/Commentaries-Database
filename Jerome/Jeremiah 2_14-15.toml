[[commentary]]
quote='''
Why then has he become a prey? Lions have roared over him and given their voice; they have made his land a wilderness, and his cities have been burned, and there is none who dwells in them. The divine word asks so that it may itself reply. And by lions he means the princes of Babylon, who made his land a wilderness and destroyed his cities by fire. Or at any rate, according to anagōgēn, let us understand the lions as the adverse powers or the leaders of the heretics, who, desolating the land of the Church, have laid waste all its cities with heretical fire, and with that fire of which it is written: All committing adultery, their hearts are like an oven. For they truly give their voice, and in this same prophet, under the person of the partridge, they cry out and gather what they did not bring forth, and they make riches not with judgment. But for this reason its cities have been laid waste and destroyed, because they do not have God as their inhabitant, as Scripture says: and there is none who inhabits them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
