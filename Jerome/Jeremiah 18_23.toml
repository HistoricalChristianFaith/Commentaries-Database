[[commentary]]
quote='''
But what he adds: do not be propitious to their iniquity, and let their sin not be blotted out from before your face, is by no means contrary to the earlier sentence, in which he entreats the Father for the people; but after the time given for repentance has passed and they persevere in their crime, they are punished not so much for themselves as for others, lest a sin left unpunished should harm the rest by its example. And what he adds: let them be stumbling — or falling — in your sight, is like that saying of Isaiah and of the apostle Peter: and you shall not stumble as on a stone of offense and a rock of scandal; which the prophet also mentions in the psalms: The stone which the builders rejected, this has become the head of the corner; this was done by the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
