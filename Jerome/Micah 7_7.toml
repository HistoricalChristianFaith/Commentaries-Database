[[commentary]]
quote='''
Since, then, these things are so, do not believe, Samaria and Jerusalem, the false prophets. But I, says the prophet, will look to the Lord; I will exult in God my Savior, or my Jesus, and my God will hear me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
These things having thus been set forth, if indeed we have been able to reach the sense of the Scriptures, the holy man, understanding that love has grown cold, and that at the consummation of the world men are not lovers of God but lovers of themselves, while others believe in friends and leaders and wives, and son and daughter and daughter-in-law rise up against father and mother and mother-in-law, and a man's enemies are his own household, himself believes in the Lord, and all his contemplation is in his God; and although he is pressed by the tribulations and pressures of the world, yet, having confidence in no one except him who says: Do not fear, I have overcome the world, he waits for God his Savior, and believing in him, and ever directing his eyes towards him, he hopes that he will be heard as often as he calls upon him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
