[[commentary]]
quote='''
(Verse 28) And the Ishmaelites sold Joseph for twenty silver coins. In Hebrew, silver coins are used instead of gold coins. For the Lord should not be sold for a lesser metal than Joseph.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Who fixed for him thirty pieces of silver. Joseph was not sold, as many think, for twenty pieces of gold, according to the LXX translators, but, according to the Hebrew truth, for twenty pieces of silver. For the servant could not be more precious than the master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
