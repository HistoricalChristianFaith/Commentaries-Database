[[commentary]]
quote='''
This word, which came to Jeremiah from the Lord, saying: Thus says the Lord God of Israel, saying: Write for yourself in a book all the words which I have spoken to you! For behold, days will come, says the Lord, and I will turn back the turning of my people Israel and Judah, says the Lord, and I will turn them back — or I will make them settle — into the land which I gave to their fathers, and they shall possess it. While the false prophets in Babylon were promising that the people who had been taken captive with Jeconiah would soon return, and while Hananiah son of Azzur was preaching the same things in Jerusalem, Jeremiah the prophet both asserted that this would indeed come to pass, not within two years, as they lied, but when the seventy years were finished, and now he is ordered to write in a book and to hand down to remembrance the things which the Lord foretells are to come. From this it is plain that the time of the prophecy is by no means near, but that these things are to be fulfilled after a long time, when Israel and Judah are to return to their land, and that what Ezekiel prophesied is to be fulfilled: that the two rods are to be joined together with each other, and that David the king will rule, of whom he writes: and my servant David shall be king over them, and there shall be one shepherd of them all. Whatever, therefore, we said on that prophecy must be understood in the present passage as well, especially since Ezekiel in Babylon and Jeremiah in Jerusalem prophesied the same things, and at the same time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
