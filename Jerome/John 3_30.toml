[[commentary]]
quote='''
In short, before the Gospel of Christ shone out in the whole world, the precepts of the Law had their own brightness; but after the greater light of the grace of the Gospel shone forth, and the sun of righteousness showed itself to the whole world, the light of the stars was hidden and their rays grew dim, so that the Apostle says in another place: "For what was glorified in this respect was not glorified, because of the surpassing glory" (2 Cor. 3). This he now says in other words, meaning that the Law of Moses, which before the Gospel was rich and wealthy and splendid, after the coming of Christ, by comparison with him, as being weak and needy, has been diminished and destroyed by him who was greater than Solomon, and the temple, and Jonah. For what is written, "He must increase, but I must decrease" (John 3:30), I think was said not so much in the person of John as in the person of the Law, because lesser things always give way to greater, and perfect things are set before beginnings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
