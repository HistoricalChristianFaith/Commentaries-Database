[[commentary]]
quote='''
And the question arises how the prophecy can stand that no one was begotten of his stock who sat upon the throne of David or was prince any longer in Judah, when our Lord and Savior was born of his seed, about whose birth Gabriel speaks to Mary: Behold, you will conceive in the womb and bear a son, and you will call his name Jesus. He will be great and will be called the Son of the Most High, and the Lord God will give him the seat of David his father, and he will reign over the house of Jacob forever, and of his kingdom there will be no end. We can therefore say this: that what is lacking in the Seventy, namely in his days he shall not prosper or shall not grow, has created the problem for those who do not know. For the Seventy translated: Write this man a disowned man, for there shall not grow from his seed a man who sits upon the throne of David, a prince any longer in Judah, which in the Hebrew is put twice; and those who wrote from the beginning, thinking this had been added in the Greek books, took it away. Let us answer, then, that in the days of Jeconiah no man succeeded him who sat upon his throne, but long afterward there was born of his seed one who obtained his royal seat. It can also be resolved thus: there will indeed not sit upon the throne of David a man and a human being, but God will sit, and his kingdom will not be earthly and brief, as David's was, but perpetual and heavenly, as Scripture says: He will reign over the house of Jacob forever, and of his kingdom there will be no end. Of Jehoiakim, then, was born Jeconiah, of Jeconiah Shealtiel, of Shealtiel Zerubbabel, and so in order one comes to Christ. But in the days of Jehoiachin no king, his son, succeeded him, as he himself had succeeded his father; but he was in captivity, and neither Shealtiel nor Zerubbabel nor anyone down to Christ obtained royal power. And this is so because in the Hebrew is written: in his days, and in the very time in which he lived, not shall there be a man who sits upon the royal seat of David. For all were captives, and of the stock of David no one thereafter held rule in the land of Judea. Whence Josephus too reports that princes of the priestly race and of the tribe of Levi ruled, whom Herod, son of Antipater the proselyte, succeeded, and that afterwards, under Vespasian, the kingdom of this race, nay rather the semblance of rule, was utterly destroyed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
