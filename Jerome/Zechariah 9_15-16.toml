[[commentary]]
quote='''
And they shall devour and subdue with sling stones, and drinking they shall be made drunk as with wine, and they shall be filled like bowls, and like the horns of the altar.

And the Lord their God shall save them in that day as the flock of his people, because holy stones shall be lifted up over his land. LXX: And they shall consume them, and overwhelm them with sling stones, and they shall drink their blood like wine, and they shall fill the altar like bowls. And the Lord shall save them in that day as sheep, his people, because holy stones shall roll upon his land. For what we have rendered shall be lifted up, and what is written in the Hebrew as methnosasoth, can be interpreted as wandering, or fleeing. When the sons of Zion have been protected, and the Lord has sounded the trumpet and gone in the whirlwind against their adversaries, so great will be the ruin of the Greeks that they will be crushed, I will not say by swords, but by the casting of stones and the whirling of slings, so that they will be a prey and a meal for their enemies. Then, drinking, they shall be made drunk as with wine. It is not those who have been slain who will be drunk with their own blood, but those who have conquered will fight with desperation, as though drunk, and will please the Lord like the horns of the altar and its libation. For this is what is understood by the bowls, with which libations are poured out upon the altar. The Lord will also save them as sheep and the flock of his people; for they will not fight against the Macedonians as an armed army, trained in the art of war, but will come like a flock ready for death, and, with the Lord's help, will overcome. And the holy stones that have been oppressed — and he calls them stones because of the hardness of their tribulations and their fortitude of mind — will be lifted up from their lowliness, and will be glorious in his land. Otherwise: his holy stones, of priestly stock, fleeing in different directions, will, by his gift, obtain the victory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
