[[commentary]]
quote='''
And to all the kings of Elam and to all the kings of the Medes. From the fact that Elam and the kings of the Medes follow Zimri, we judge that Zimri too is a region of Persia, unless perhaps, from the fact that Arabia came before, these too are to be understood as kings of the desert. Now Elam is a region of Persia beyond Babylon; hence also the Elamites, and the Medes too and the Persians, by whom Babylon was captured and destroyed; and they themselves also drank the undiluted cup when Alexander, king of the Macedonians, gave it them to drink.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
