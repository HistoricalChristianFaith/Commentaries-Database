[[commentary]]
quote='''
But if, according to both interpretations, you always do good and keep an equal course at every age, you will see God the Father, the sweetest light; you will see Christ, the sun of justice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
