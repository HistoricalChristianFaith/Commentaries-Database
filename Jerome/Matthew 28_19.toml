[[commentary]]
quote='''
They first then teach all nations, and when taught dip them in water. For it may not be that the body receive the sacrament of Baptism, unless the soul first receive the truth of the Faith. In the name of the Father, the Son, and the Holy Ghost, that they whose Godhead is one should be conferred at once, to name this Trinity, being to name One God.

(Didymi Lib. ii. de Spir. Sanct.) And though some one there may be of so averse a spirit as to undertake to baptize in such sort as to omit one of these names, therein contradicting Christ Who ordained this for a law, his baptism will effect nothing; those who are baptized by him will not be at all delivered from their sins. From these words we gather how undivided is the substance of the Trinity, that the Father is verily the Father of the Son, and the Son verily the Son of the Father, and the Holy Spirit the Spirit of both the Father and the Son, and also the Spirit of wisdom and of truth, that is, of the Son of God. This then is the salvation of them that believe, and in this Trinity is wrought the perfect communication of ecclesiastical discipline.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Go therefore, teach all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit. First they teach all nations, then they dip those who have been taught in water. For it cannot be that the body receives the sacrament of baptism unless the soul has first received the truth of the faith. And they are baptized in the name of the Father and of the Son and of the Holy Spirit so that, as their divinity is one, the bestowal may be one; and the name of the Trinity is one God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Let us say something from the Scriptures, not following reason, but the authority of the Lord Savior. For what does he say, about to ascend to heaven, speaking to the apostles, to whom he preaches as master and Lord? No one knows how to speak about his own nature as does he who is himself God: let it suffice for us to know about the Trinity what the Lord has deigned to explain. For what does he say to the apostles? "Go, baptize all nations in the name of the Father and of the Son and of the Holy Spirit." I hear three names, and one is spoken: for he did not say, "in the names," but "in the name." He says three names: and how does he say one, "In the name of the Father and of the Son and of the Holy Spirit"? The name of the Father and of the Son and of the Holy Spirit is one: but it is the name of the Trinity. For what is said is, in the name of the Father who is God, in the name of the Son who is God, in the name of the Holy Spirit who is God: the Father and the Son and the Holy Spirit are one name of divinity. But you ask of me how three are called by one name? I do not know, and I freely profess that I do not know, what Christ did not wish to make known. This alone I know, that in this I am a Christian, that I confess one God in Trinity. But if I should say that there is one person of the Father and of the Son and of the Holy Spirit, I shall be called a Sabellian, and I begin to be not a Christian but a Jew: because the Jew too says there is one God, but because he does not know the Father and the Son and the Holy Spirit. Therefore he does not hold the mystery of the Trinity. Therefore if we so say "one God" that we exclude the Father and the Son and the Holy Spirit from the mystery of the Trinity, we become Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_069.html'
source_title="Homily 69, on Psalm 91 (Alternate Series)"
