[[commentary]]
quote='''
And the word of the Lord came to Jeremiah, after Hananiah the prophet had broken the chain — or fork — from the neck of Jeremiah the prophet, saying: Go, and you shall say to Hananiah: Thus says the Lord: the chain — or fork — of wood you have broken, and you will make — or I will make — in their place forks — or chains — of iron. For thus says the Lord of hosts, the God of Israel: I have put a yoke of iron upon the neck of all these nations, that they may serve Nebuchadnezzar, king of Babylon. And what follows: and they will serve him; moreover I have also given him the beasts of the earth, is not found in the Seventy. And in the present passage, according to the Seventy, Hananiah is not written 'prophet', nor in what follows, lest, that is, as I said before, they should seem to call a 'false prophet' a 'prophet'; but what is that to the Hebrew truth? After Jeremiah the prophet had gone on his way and swallowed the injury in silence, the word of the Lord came to him, so that the prophet should not speak in his own words to the false prophet glorying in his lie, but should say: thus says the Lord, although Hananiah too, in breaking the wooden fork, had spoken with the same authority in the sight of the Lord: thus says the Lord; for falsehood always imitates truth. And what he added: you have broken forks of wood and you will make — or you have made — in their place chains of iron, shows this: that by refusing a lesser penalty he became the cause of a greater punishment among the people. In this passage too the allegorical interpreter raves, calling the wooden forks and chains ethereal and aerial bodies, namely those of demons and of the hostile powers, but the iron forks or chains our grosser bodies, which are woven together of sinews and bones, flesh and veins, so that those from the heavenly Jerusalem who refused to undergo lesser torments according to the quality of their sin are condemned into the chains of our bodies, and endure the wailing of infancy, the bonds and filth of swaddling clothes, and serve the devil, the king of Babylon, that is, of this world — Scripture saying: the world is set in the evil one — together with the beasts of the earth, which are bound fast in the bodies of brute animals. That unlearned commentator and follower of the Grunnian slander has compelled me to set forth openly the vices of others, which before I used to speak of with reserve, leaving them to the reader's prudence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
