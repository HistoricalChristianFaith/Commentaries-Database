[[commentary]]
quote='''
Let us go back over the particulars, and discuss them briefly in their order in the commatic manner: I said in my heart concerning the utterance of the sons of man, that God might choose them. This alone, he says, God willed to be the difference between men and beasts: that we speak, they are dumb; we bring forth our will in speech, they are numb in silence. And though we differ from the brutes only by speech, yet it is shown to us that, as regards the frailty of the body, we are cattle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
