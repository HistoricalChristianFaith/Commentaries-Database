[[commentary]]
quote='''
Like stubble before the face of the wind. Eleven punishments he asks against them, because they have denied the mysteries of the eleven apostles. But let the prudent reader say: How will you divide one verse into two? And you do violence to the Scripture: you say eleven apostles, when we know that the Lord and Savior had twelve disciples. For this reason, then, we set down the number eleven, because Judas the traitor, who had been the twelfth, departed from the number. My God, set them like a wheel. You have one plague: count therefore more carefully the rest that follow. Like stubble before the face of the wind: behold the second. Like fire which burns a forest: behold the third. Like a flame burning the mountains: the fourth. So will you pursue them in your tempest: the fifth. And in your anger you will confound them: the sixth. Fill their faces with shame: the seventh. And let them seek your name, O Lord: the eighth. Let them be ashamed and troubled forever and ever: the ninth. And let them be confounded and perish: the tenth. And let them know that your name is Lord: the eleventh. You alone are the Most High over all the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
