[[commentary]]
quote='''
And when he has shown that he was born for this, to eat his bread in the sweat of his face, another will question him and say: What do these wounds mean, and these gashes that are in the middle of your hands? And the sense is: Why do you cling to the gibbet? Why are your hands pierced with nails? What have you committed, that you should be subjected to this penalty and torment? And he will answer and say: These gashes and these wounds I received, condemned by the judgment of my parents and of those who did not hate me but loved me. And truth will prevail so far, once falsehood has been put to flight, that even he who has been punished for his own fault confesses that he has suffered justly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
