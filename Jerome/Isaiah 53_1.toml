[[commentary]]
quote='''
May your right hand with which you fashioned the world bring light to the world. "To whom has the arm of the Lord been revealed?" May your right hand with which you formed humanity take on a human body and save human persons.
'''
source_url=''
source_title="HOMILIES ON THE PSALMS 67, ALTERNATE SERIES (PSALM 90)"

[[commentary]]
quote='''
Who has believed our report? and to whom has the arm of the Lord been revealed? And he shall go up like a sapling before him, and like a root out of a thirsty land: there is no form in him, nor comeliness: and we saw him, and there was no appearance, and we desired him. Despised and the lowest of men, a man of sorrows, and knowing infirmity; and his face was as it were hidden, and despised: whence we did not esteem him. Truly he bore our sicknesses, and our sorrows he carried: and we thought him as it were a leper, and struck by God, and humbled. LXX: Lord, who has believed our report, and to whom has the arm of the Lord been revealed? We announced as a little child before him, as a root in a thirsty land. There is no form in him nor glory, and we saw him, and he had no form nor comeliness: but his form was without honor, and failing beyond the sons of men. A man in a stroke, and knowing how to bear infirmity, for his face is turned away, despised and not esteemed. He carries our sins, and suffers pain for us, and we esteemed him to be in pain, and in stroke, and in affliction. After the words of the Father, by which he had announced to the world that his Son would come, and before the scandal of the cross, of which he was going to say, His appearance shall be without glory, and his form beyond the sons of men, he had put first the glory of the resurrection, He shall be exalted and lifted up, and shall be very high, so that the glory of the resurrection might go before the humility of the cross: now the choir of the Prophets answers that it has fulfilled its office and, as far as lay in it, has announced to all his arm and power. And in saying, Who has believed our report, and to whom has the arm of the Lord been revealed?, it signifies how rare believers from among the Jews are.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
At the beginning of the chapter, in which according to the Seventy it is said, Lord, who has believed our report, and to whom has the arm of the Lord been revealed (Rom 10), a testimony which the apostle Paul also uses to the Romans, expounding it of the Lord's passion, Lord is not found in the Hebrew, but was added to make clear the person to whom it is said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
