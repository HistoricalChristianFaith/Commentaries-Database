[[commentary]]
quote='''
Whence also we say that the holy men are just and that they are made pleasing to God after their sins not only through their merits but through the mercy of him to whom every creature is subject and stands in need of his mercy. Let heretics hear, who are lifted up by pride and say, "We have taken unto us horns by our own strength." Let them listen to what Moab heard said to him: "We have heard the pride of Moab, he is exceedingly proud. 'His haughtiness and his arrogance and his pride and the loftiness of his heart I know,' says the Lord, 'because his strength is not according to the loftiness thereof.' "
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="AGAINST THE PELAGIANS 2:29"

[[commentary]]
quote='''
You who rejoice in nothing, either in idols and golden calves, which are nothing, as Esther says to the Lord: Do not hand over your sceptre to those who are not, or in nothingness and falsehood. You who think that by your own strength you took horns, and kings and power, with which to toss your enemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Those who do this rejoice in no good word, or in vain, as Symmachus translated, that is, ἀλόγως, and, lifted up in pride, they say: Did we not have horns by our own strength? Whereas, on the contrary, the just man glories in the Lord and says: In you we will toss our enemies with the horn. And in the same place: For I will not hope in my bow, and my sword will not save me. Hence also in Exodus, according to the Hebrew and the edition of Aquila, we read: And Moses did not know that the appearance of his face was horned, he who could truly say: In you I toss my enemies with the horn. We read also in another place: And he will exalt the horn of his people, and: He has exalted the horn of his Christ, and of the horn of the altar, and of the clean and horned animals, which alone are offered to God, whose interpretation belongs not to this occasion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
