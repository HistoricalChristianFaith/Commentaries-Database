[[commentary]]
quote='''
And what he says, "in incorruption", is to be taken thus: that incorruption (incorruptio) properly means virginity. Indeed, those who are virgins are commonly called incorrupt (incorrupti), and those who have ceased to be virgins are named corrupted (corrupti); and we say: She who was once a virgin has been corrupted. Hence I think that Titus, believing the Gospel before he was taken up with the work of the flesh, received baptism and remained a virgin, and is now admonished by the Apostle to show a pattern of himself in incorruption: an incorruption which, indeed, we do not see in Timothy. For when he said to him, "Let no one despise your youth, but be a pattern of the faithful in speech, in conduct, in love, in faith, in purity" (1 Tim. 4:12), he was silent about incorruption and set down only "purity". But purity can be understood also in celibacy without virginity. Unless perhaps we take purity as in the mind, and incorruption as in the body, according to what is written elsewhere in the definition of a virgin: "That she may be holy in body and in spirit" (1 Cor. 7). And he himself has now added in sequence: "in doctrine, in incorruption, in chastity".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
Let no one despise you. Someone might think that this is the very same thing now written to Titus that was said to Timothy: "Let no one despise your youth" (1 Tim. 4:12). But we, following the distinction of the Greek language, think that περιφρονείτω, which is written here, means one thing, and καταφρονείτω, which was said to Timothy, another, and that the prepositions περὶ and κατὰ make a different sense. And that the apostle Paul uses, not by chance and at whim, different nouns and verbs, and even different prepositions, according to the variety of the matters, can be made plain from what he says: "For the woman is from the man, but the man through the woman" (1 Cor. 11:12). And elsewhere: "For from him and through him and in him are all things" (Rom. 11:36). And also this: "Paul an apostle, not from men, nor through man" (Gal. 1:1). We think, therefore, that καταφρόνησιν properly pertains to contempt, as when someone, stretched on the rack and among the hot plates, despises pain, and fears neither the threats of the judge nor the roar of the crowd standing around, but for the confession of martyrdom despises and disdains all torments. On the other hand there is also an evil contempt, of which Habakkuk too, the Holy Spirit speaking in him, testifies: "Behold, you despisers, and look, and wonder at wonders, and perish" (Hab. 1:5). According to which we have said that it was written to Timothy also: "Let no one despise your youth" (1 Tim. 4:12), that is: I do not want you to show yourself such that you could deservedly be despised by anyone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
