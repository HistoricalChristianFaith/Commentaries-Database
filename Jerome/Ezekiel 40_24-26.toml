[[commentary]]
quote='''
And he led me to the southern way, and behold, a gate which looked toward the south; and he measured its front and its vestibule according to the measures above, and its windows, and the vestibules round about it, like the other windows, in which there was a length of fifty cubits and a breadth of twenty-five. And by seven steps one went up to it, and a vestibule before its front, and there were carved palms, one on this side and another on that, on its front. And the gate of the inner court on the southern way; and he measured from gate to gate on the southern way a hundred cubits. And he brought me into the inner court at the southern gate, and he measured the gate according to the measures above, its cell and its front, and its vestibule with the same measures, and the windows of the vestibules round about: fifty cubits of length, and of breadth twenty-five cubits, and the vestibule round about, in length twenty-five cubits and in breadth five cubits, and its vestibule toward the outer court, and palms on the front, and there were eight steps by which one went up through it. (The Seventy agree in the same words, except for 'thee' and 'aeleu' and 'aelamoth' and 'aelam', in place of which in the Hebrew is put 'ulam'; and 'thee' means 'threshold' or 'front', 'aeleu' 'around it' or 'supports', 'aelamoth' 'propyla' [gateways] or 'vestibules', 'ulam tritilon' 'round about', that is, 'before the doors'. But what we have put according to the Hebrew: And the vestibule (or πρόπυλον [gateway]) round about, of a length of twenty-five cubits and of a breadth of five cubits, is not found in the Seventy. But this too is to be noted, that at the southern gate, according to the Seventy, 'way' is not said, but simply: And he led me toward the south, and behold, a gate which looked toward the south.) Through each of the entrances, then, Ezekiel, whom God strengthened — for this is what his name means —, is led, and he passes from the gate of the north to the southern gate, whose fronts and thresholds, πρόπυλα or vestibules, and windows round about had similar measures: a length of fifty cubits and a breadth of twenty-five cubits. And by seven steps one went up to it, that is, to the southern gate, and its vestibule, that is, the 'aelamoth', was before its doors; there were also two carved palms, of which we spoke at the northern quarter of the gate. And let it suffice to have advised only this, that what is set there according to a lowlier understanding, that is, according to the letter, we understand at the southern gate according to the spiritual sense: for history and tropology run along the same lines, but the former is humbler, the latter more sublime; the former clings to the earth, the latter flies up to heavenly things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
