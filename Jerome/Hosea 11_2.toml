[[commentary]]
quote='''
And because Israel is indeed spoken of in the singular but understood in the plural, as are people, Ephraim and Judah, since in the singular number there is a great number contained in this number, he recalls the old history: that he called them through Moses and Aaron, who called them to go out of Egypt; but they, called by them, withdrew from their face, turning their backs on him and showing the hardness of their mind by the gesture of their body. Nor was it enough for them to despise those who called them, unless they also sacrificed to Baal and burned incense to carved images, or idols. We read that they first worshipped Baal under Ahab king of Israel, who took as his wife Jezebel, daughter of the king of Sidon, and brought the Babylonian and Phoenician idol over into Samaria. Therefore he joins in one discourse sins distant in time: how first they were called out of Egypt and named sons, then in the wilderness withdrew from God, worshipping Baal-peor rather than God, and afterwards in the holy land served the Baalim and Ashtaroth and the other idols.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
