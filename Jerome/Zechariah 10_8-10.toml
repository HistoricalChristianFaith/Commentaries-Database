[[commentary]]
quote='''
I will whistle for them, and I will gather them, because I have redeemed them, and I will multiply them as they had been multiplied before. And I will sow them among the peoples, and from afar they shall remember me, and they shall live with their sons, and shall return. And I will bring them back from the land of Egypt, and from the Assyrians I will gather them, and I will lead them to the land of Gilead and of Lebanon, and room shall not be found for them. LXX: I will signal to them, and I will receive them, because I will redeem them, and they shall be multiplied as they were very many, and I will sow them among the peoples, and from afar they shall remember me. They shall nourish their sons and shall turn back, and I will bring them back from the land of Egypt, and from the Assyrians I will receive them, and into Galaaditis and into Lebanon I will bring them, and none of them shall be lacking. As the sign of their gathering, whether under the Macedonians or at the consummation of the world, as we said before, they shall have my whistle, he says, so that by my whistle I may gather them and show myself to be the shepherd. For I have redeemed them and freed them from captivity with an outstretched arm; and I will multiply them, I who had multiplied them before, so that the dispersion among the peoples may be seen to be not a division but the work of sowing, and, with the harvest of children and grandchildren multiplied, they may live with their sons; and they may return not only from the land of Egypt, but also from the Assyrians, and come back from both parts of the world to Judea, and to the land of Gilead and of Lebanon, which the ten tribes, called the house of Joseph and Ephraim, had possessed before; and so great shall be the number of those brought back that the land will not hold the multitude.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
