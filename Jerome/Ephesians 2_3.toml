[[commentary]]
quote='''
There follows: In which we also all once lived in the desires of our flesh, doing the wills of the flesh and of the minds. What he says, in which (in quibus), is to be referred to the trespasses. For above, since he had set down two things together, And you, when you were dead in your trespasses and sins, and had referred to the sins by saying, in which you once walked, while nothing of the kind seemed to have followed for the trespasses that could complete the sense, he now says: in which trespasses we also all lived; and at the same time, lest in having said, and your sins, in which you once walked, he should seem through pride to exempt himself from sin, he added, in which we also all lived. Now he who says that he has lived so is confessing past trespasses, not present ones. We lived once, he says, not in one desire, but in the desires of our flesh. For the flesh desires against the spirit, and the spirit against the flesh (Gal. 5:17). Doing not one will of the flesh, but many; and not only the wills of the flesh, but also of the minds (mentium), for which in the Latin manuscripts there is of the thoughts (cogitationum). Between the sin of the flesh and that of the minds I think there is this difference: that the sin of the flesh is unchastity and lust, and the things done through its service which are fulfilled in lusts. The trespass of the minds, on the other hand, pertains to dogmas contrary to the truth and to heretical depravity; so that we may say that most heretics (although this is rare) do the wills of the minds and not the wills of the flesh, and that many, on the contrary, among churchmen do the wills of the flesh and not of the minds, and that there are many who do the wills of the flesh and of the minds alike. Now we have said this, not that heretics also do not do the wills of the flesh (for there are more vices of the body among them than among our own), but so that, an example having been set down, what we wished might be more easily understood. And we were, he says, by nature sons of wrath, even as the rest. Let the heretics who contend that there are different natures answer how Paul, who without doubt is of a spiritual nature, was by nature a son of wrath, even as the rest who are still placed in error. We, however, say that all men are at first by nature sons of wrath, either because of the body of humiliation and the body of death, and because from youth the mind of men is set upon wickedness (Gen. 8) (whence Solomon also says: There is no righteous man on earth who does good and does not sin (Eccles. 7:21)); or because from the time when we are able to have knowledge of God and come to puberty, we all sin either in deed, or in tongue, or in thought. We were therefore by nature sons of wrath, even as the rest, and all the Saints, who have been redeemed from wrath by the blood of Christ. For if Paul, who according to the righteousness which was in the Law lived blamelessly, says that he was by nature a son of wrath, why should we fear to testify that holy men of former times also were sons of wrath? Of all of whom it can truly be said: But when the commandment came, sin revived, and they died. Now son of wrath is to be taken in the same way as son of perdition, son of iniquity, son of death. Not that some wrath, death, iniquity and perdition subsists in its own nature, so as to have sons; but that they are called sons of that thing which works in each of them: just as those are called sons of Gehenna who are to be consumed by the fires of Gehenna. Another thinks that they are called sons of wrath as being sons of the devil. For the devil is perdition, and wrath, and death. Death, growing strong, has devoured (Isa. 25:8, LXX). And: Last (1 Cor. 15) the enemy, death, shall be destroyed (1 Cor. 15:26); and to the devil himself: You have become perdition (Ezek. 28, LXX). Become, he says, by his own will, not created so from the beginning. As, then, he is called death, from the fact that by the envy of the devil death entered into the world (Wisd. 2), and through him those died who before were living; and perdition, because he destroys whomever he has deceived: so too he is called wrath on account of the savagery which he exercises against man. There are some who think that in the books of Kingdoms, when David numbered the people of Israel, provoking the wrath of God against himself, as Scripture says: And the wrath of God was again kindled against Israel, and it incited David, saying (2 Sam. 24:1), the wrath of the Lord signifies the devil; for, according to the idiom of the Greek language, it did not say, in the feminine gender, the wrath of God λέγουσα, that is, "she who said", but the wrath of God λέγων, that is, "he who said", in the masculine gender: since indeed the Lord sends his wrath and his fury through the worst angels.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Some, in place of what we have now expounded, And we were by nature sons of wrath, have translated, in place of by nature, "utterly" or "altogether", since the word φύσει is ambiguous. And even if it sounds so, it must be expounded according to what we have said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
