[[commentary]]
quote='''
I marvel that you are so quickly transferred from him who called you into the grace of Christ Jesus, to another Gospel which is not another, unless there are some who trouble you and wish to overturn the Gospel of Christ.

We first read the word "transfer" in Genesis (Gen. 5), where "God transferred Enoch, and he was not found". And afterwards in the books of Kingdoms (1 Kings 21), when his wife Jezebel transferred Ahab from the worship of God to the veneration of idols, so that he did according to all that the Amorite did, whom the Lord destroyed from before the face of the children of Israel. But although each is a transfer, the one is God's, the other the devil's. He who is transferred by God is not found by his enemies, nor can the one who lies in wait creep up on him. This indeed is what I judge "and he was not found" to signify. But he who is transferred by the devil is transferred into that which seems to be, but is not. The wise men of the age, too, call those who are transferred from one doctrine to another "transferred": thus that Dionysius (whose opinion had formerly been that pain is not an evil, but who, after he was overwhelmed by calamities and tormented by pain, began to affirm that pain was the greatest of all evils) was called by them the Transposed (Transpositus), or the Transferred (Translatus), because, namely, departing from his former tenet, he had fallen back into its contrary. Paul therefore marvels: first, that they have been transferred from the freedom of the Gospel into the slavery of legal works; next, that they were transferred so quickly, since it is not the same guilt to be transferred by someone with difficulty and to be transferred quickly; just as in martyrdom he who without struggle and torments leapt forward at once to deny is not punished with the same penalty as he who, twisted amid the rack, the cords and the fires, was compelled to deny what he believed. The preaching of the Gospel was still recent; no great time lay in between since the Apostle had brought the Galatians over from idols to Christ. He marvels therefore how they had so quickly departed from him in whose name they had lately been made Christians. The passage itself also has a ὑπέρβατον (hyperbaton, a transposition of word order), which can be read in its proper order thus: I marvel that you are so quickly transferred from Christ Jesus, who called you into grace, saying: "I came not to call the righteous, but sinners" to repentance (Mark 2:17). For by grace we have been saved, and not through the law (Eph. 2:8).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
And this too is fitting, that the word "transfer" has been fitted to the Galatians: for Galatia in our language means "transfer".
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
