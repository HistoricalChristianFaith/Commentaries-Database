[[commentary]]
quote='''
The Greek word here which we render 'supersubstantialis,' is ἐπιούσιος. The LXX often make use of the word περιούσιος, by which we find, on reference to the Hebrew, they always render the word sogolac. Symmachus translates it ἐξαίρετος, that is, 'chief,' or 'excellent,' though in one place he has interpreted 'peculiar.' When then we pray God to give us our 'peculiar' or 'chief' bread, we mean Him who says in the Gospel, I am the living bread which came down from heaven. (John 6:51.)

We may also interpret the word 'supersubstantialis' otherwise, as that which is above all other substances, and more excellent than all creatures, to wit, the body of the Lord.

Others understand it literally according to that saying of the Apostle, Having food and raiment, let us therewith be content, that the saints should have care only of present food; as it follows, Take no thought for the morrow.

In the Gospel, entitled The Gospel according to the Hebrews, 'supersubstantialis' is rendered 'mohar,' that is 'to-morrow's;' so that the sense would be, Give us today to-morrow's bread; i. e. for the time to come.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25206.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Symmachus, then, for what is περιούσιον in the Greek, SGOLLA (סגלה) in the Hebrew, expressed ἐξαίρετον, that is, "choice" (egregium), or "special" (præcipuum); for which word, using the Latin language in another volume, he rendered "peculiar" (peculiarem). Rightly, then, did Christ Jesus, our great God and Savior, redeem us with his blood, to make the Christian people peculiar to himself, a people that could then be peculiar if it proved an emulator of good works. Hence also what is written in the Gospel according to the Latin translators, "Give us this day our daily (quotidianum) bread" (Matt. 6:11), is better rendered in the Greek "our bread ἐπιούσιον", that is, "special", "choice", "peculiar": namely him who, coming down from heaven, says, "I am the bread that came down from heaven" (John 6:51). Far be it, indeed, that we, who are forbidden to take thought for the morrow, should be commanded in the Lord's prayer to ask for that bread which in a little while is to be digested and cast out into the drain. Nor is there much difference between ἐπιούσιον and περιούσιον: for only the preposition has been changed, not the word. Some think that the bread in the Lord's prayer is called ἐπιούσιον because it is above all οὐσίας, that is, above all substances. If this is accepted, it does not differ much from the sense we have set out. For whatever is choice and special is outside all things and above all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"


[[commentary]]
quote='''
But it is better for us to understand that the bread of righteousness is he who said, I am the bread who came down from heaven, and whom we pray in prayer to be granted to us: Our substantial bread (or that is to come) give us, so that him whom we shall afterwards receive always, we may deserve to receive daily in the present age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
