[[commentary]]
quote='''
And I will no longer spare those who dwell on the land, says the Lord. Behold, I will deliver men, each one into the hand of his neighbor, and into the hand of his king; and they shall cut down the land, and I will not rescue from their hand; and I will feed the cattle of slaughter for this, O poor of the flock. LXX: Therefore I will no longer spare the inhabitants of the land, says the Lord. And behold, I will deliver men, each one into the hands of his neighbor, and into the hand of his kings; and they shall cut down the land, and I will not rescue from their hand, and I will feed the sheep of slaughter in Canaanitis. What the LXX translated at the end of the passage: And I will feed the sheep of slaughter in the land of Canaan, is not in the Hebrew, and is translated by none of the other translators.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
And I will feed the cattle of slaughter, so that the Jews may always be nourished for death; because this is the sentence of God: O you who are the poor of the flock, that is, the just of Israel, who have believed in the Lord Jesus and received the Son of God, hear what is said, and learn the mysteries of the following passage. But what we read according to the Seventy: And I will feed the sheep of slaughter in the land of Canaan, we can understand thus: that the Lord feeds the people of the Jews, which is destined for death and scattered through the whole world — that is, in the land of Canaan and of the Gentiles —, and nourishes it for sacrifice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
The Creator and shepherd, whose sheep know his voice and follow him, took for himself two staffs, or two σκυτάλας, that is, sticks, which in Hebrew are called macaloth, to show the bearing of a shepherd. One staff he called Beauty: that is, under Noah he protected the whole human race with his blessing, when, the world being restored, sins had not yet made it foul. And therefore the calling of all the nations is called beautiful and fair, because nothing is more just than that the parent of the universe should call all equally, whom he begot in equal condition. And the other he called Cords; for when the Most High was dividing the nations and scattering the sons of Adam, he set the bounds of the nations according to the number of the angels of the Lord. And his people Jacob became the portion of the Lord; Israel the cord of his inheritance. And I fed, he says, the flock: either Israel itself, or, together with Israel, the whole human race.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Some have understood the two callings as those of the Jews and of the Gentiles: by the first name Israel, and by the last the Christians. But how the Christian calling was cast away first, and the Jews remained and were fed by God, they did not sufficiently consider.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
