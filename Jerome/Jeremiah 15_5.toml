[[commentary]]
quote='''
For who will have pity on you, Jerusalem? or who will grieve for you? or who will go to ask for your peace? For when God has been offended no one can intercede for the outrages of sinners, because a creature cannot be as merciful as the Maker, nor can a stranger spare outsiders as the Lord spares his own.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
