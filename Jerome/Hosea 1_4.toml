[[commentary]]
quote='''
Therefore Israel too, consummated and perfected in fornication, a daughter of pleasure, which seems sweet and pleasant to those who enjoy it, is taken as wife by Hosea as a type of the Lord Savior; and from her a son of God is first begotten, that is, Jezreel; and this is the metropolis of the ten tribes, in which Naboth was killed, on account of whose blood Jehu is raised up, who destroyed the house of Ahab and Jezebel. But because Jehu himself too, the avenger of just blood, walked in the ways of Jeroboam son of Nebat, who made Israel commit fornication and set up golden calves in Dan and Bethel, his kingdom too is said to be overturned; under his great-grandson Jeroboam Hosea began to prophesy; when he died, his son Zechariah succeeded to the kingdom; and in the sixth month of his rule Shallum, born of another stock, killed him. For this reason it is now said: Yet a little while and I will visit the blood of Jezreel, that is, the slaughter of my people, upon the royal house of Jehu, which at that time ruled over Israel. Nor is it surprising if the house of Jehu is overturned, since even the kingdom of the house of Israel, that is, of the ten tribes, was to be utterly destroyed after not many years. For from Zechariah son of Jeroboam, whose ancestor was Jehu, to the ninth year of Hoshea, under whom the ten tribes were led into captivity, forty-nine years are counted. And once Zechariah, who was the last of the stock of Jehu, was killed, the kings of Assyria at once took Reuben and Gad and the half tribe of Manasseh, which were beyond the Jordan; and then many cities of Samaria, and then all Naphtali, and at the last all the remaining tribes. In place of Jehu, in the common edition Judah is read; but this seems to me to have grown up not through the fault of the Seventy translators but through the ignorance of the copyists, who, not knowing Jehu, wrote Judah, which was more familiar. The type of the seed of God, and the vengeance for his blood, is referred to the Lord's passion, on account of which both the house of Judah and the kingdom of all Israel are said to be overturned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
