[[commentary]]
quote='''
He it is who establishes the thunder, or makes firm the mountains, at whose voice the hinges of the heavens and the foundations of the earth are shaken. He it is who creates the spirit, which in this place we understand not as the Holy Spirit, as the heretics suppose, but as the wind, or the spirit of man, because no one knows what is in a man except the spirit which is in him; and the Spirit himself intercedes for us with unspeakable groanings. Or certainly by 'spirit' we ought to understand the soul, according to that which is written: You will take away their spirit, and they will fail, and they will return to their dust. And: Father, into your hands I commend my spirit, and saying this he breathed his last. And when he has created the spirit, he announces to men his own speech, or announces to man that man's speech, he who knows the secrets of the thoughts, and understands what the hidden mind ponders in silent thought, according to what we read in Jeremiah according to the Hebrew: The heart of all is perverse and unsearchable; who shall know it? I the Lord search the heart and test the reins. Which Scripture also attests in the hundred and thirty-eighth (139th) psalm: Your eyes saw my imperfect being. And the sense is: Before I was made, before I was shaped into limbs, while I was still contained in the seed, your eyes saw me. And Jeremiah hears from the Lord: Before I formed you in the womb, I knew you; and before you came forth from the womb, I sanctified you, and I set you as a prophet among the nations. And the evangelist: But Jesus, seeing their thoughts. But if we read: Announcing to man his speech, it is to be taken according to what was said above, where he says: The Lord God will not do a thing unless he has revealed his secret to his servants the prophets. And he who announces the thoughts of man and his speech, or his own, is the one who makes the dawn and the daybreak, and fills all things with clouds, and treads upon the heights of the lands, whose name is the Lord God Almighty. In place of this one reads in the Seventy: And announcing to men his Christ; on this pretext the heretics want the Holy Spirit to be created, from the order that follows: Creating the spirit, and announcing to men his Christ, so that the one is created and the other is announced among the peoples. To them we shall reply according to their own sense and the common edition: He who is the creator of all things, and establishes the thunder, or fashions the mountains, consequently brings the winds out of his treasuries, and, as the founder of the universe, promises his Son Christ to men. But after Christ has been announced, then the light of truth is opened to us, not to perfection, because now we see in part and know in part, and contemplate the things that are to come through a mirror and an image. Hence there follows: Making the morning and the mist, and ascending upon the heights of the earth. For the Lord is high in the high places, and he who is high does not dwell in low things; but the creator of the mountains ascends upon the mountains, in those who have their citizenship in the heavens, and, walking in the flesh, do not live according to the flesh but according to the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
