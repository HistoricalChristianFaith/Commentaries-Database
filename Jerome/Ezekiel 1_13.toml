[[commentary]]
quote='''
The coals of burning fire, however, and the lamps running about in the midst of the living creatures are to be interpreted from that passage in Isaiah: And the fire devoured the matter like hay, and he will sanctify them in burning fire; of which it is also written elsewhere: Coals of fire will fall upon them; and against deceitful lips it is said in another psalm: What shall be given to you, or what shall be added to you, against the deceitful tongue? Sharp arrows of the mighty, with desolating coals; and in another place: You have coals of fire, you will sit upon them; these will be a help to you. Whatever creature we look at flashes forth the knowledge of God, since from the creatures the Creator is recognized; and from the midst of the living creatures the brightness of fire and lightning goes forth: for if the Gospels have struck against one another, in the midst of the letter and of the lowly history you will find the mysteries of the Holy Spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
