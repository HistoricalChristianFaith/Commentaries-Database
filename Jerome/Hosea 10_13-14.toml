[[commentary]]
quote='''
We have escaped, after a fashion, from the rugged places; now, spreading our sails for the deep, let us cross the sea of allegory. Because you have trusted, O Ephraim, in the ways, or in the chariots, of yours, of which it is written: Some in chariots and some in horses; but we will be magnified in the name of the Lord our God; and you have trusted in the multitude of your mighty men, whom you have strengthened for yourself by false knowledge; therefore a tumult and noise will rise up among your people. For whatever the heretics say has no voice that unfolds meanings, but only tumult, clamor and noise. And all your fortresses, or the things that are walled, will be laid waste —, for they have been fortified and built not with the testimonies of the Scriptures, but with the art of dialectic and the arguments of the philosophers —; as Salmana was once laid waste by Gideon, the mother being killed upon her sons. This history the eighty-second (83rd) psalm also recalls, where it records that among the other leaders of Midian there was also Salmana, saying: Do to them, O Lord, — no doubt meaning those who have entered into a pact or covenant against God —, as to Midian and to Sisera. And after the rest: Make, he says, their princes like Oreb and Zeeb, and Zebah and Salmana, all their princes who said: Let us possess the sanctuary of God by inheritance. For in this psalm too the leaders of the heretics are described, who have tried to claim the altar of God for themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
