[[commentary]]
quote='''
And consequently he sets forth what Ephraim, who is now deserted, once was: so beautiful, he says, was he, and so walled about with the help of God, as Tyre is girded by the sea, or at least like a very hard crag which, fixed in the earth, scorns all storms and does not care about whirlwinds and winds. But he himself, that is, Ephraim, or Tyre, which was founded in the fullness of the sea, will lead out his sons to captivity. Many refer this section to the times of Hazael, who besieged Samaria and afflicted it with famine for a long time, so that the besieged thought it lighter to perish by the sword than by starvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
