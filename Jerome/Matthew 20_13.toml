[[commentary]]
quote='''
A denarius bears the figure of the king. You have therefore received the reward which I promised you, that is, my image and likeness; what desirest thou more?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Friend, I do you no wrong. I have read in someone's book that this friend who is rebuked by the householder, the labourer of the first hour, is to be understood as the first-formed man and those who believed in that time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Did you not agree with me for a denarius? The denarius bears the figure of the king. So you have received the wage that I had promised you, that is, my image and likeness; what more do you seek? And you desire not so much to receive more yourself as that another should receive nothing, as though the merit of the reward were lessened by being shared with another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
