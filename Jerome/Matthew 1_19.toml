[[commentary]]
quote='''
But how is Joseph thus called just, when he is ready to hide his wife's sin? For the Law enacts, that not only the doers of evil, but they who are privy to any evil done, shall be held to be guilty.

Or this may be considered a testimony to Mary, that Joseph, confident in her purity, and wondering at what had happened, covered in silence that mystery which he could not explain.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Joseph her husband, since he was just and did not wish to expose her, wished to put her away secretly. If anyone is joined to a harlot, he becomes one body. And it is commanded in the law that not only the guilty but also those privy to crimes are liable for the sin. How is Joseph, when he conceals the crime of his wife, described as just? But this is a testimony for Mary: that Joseph, knowing her chastity and wondering at what had happened, hides in silence the thing whose mystery he did not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
