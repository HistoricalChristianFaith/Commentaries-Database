[[commentary]]
quote='''
A confused noise and uncertain sound is the mark of great fear. But if, according to Marcion and Manichæus, our Lord was not born of a virgin, but was seen in a phantasm, how is it that the Apostles now fear that they have seen a phantasm (or vision)?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And seeing him walking upon the sea, they were troubled, saying: It is a phantom. If, according to Marcion and Mani, our Lord was not born of a virgin but was seen as a phantom, how is it that the apostles now fear that they are seeing a phantom?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
And for fear they cried out. A confused cry and an uncertain voice are the mark of great fear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
