[[commentary]]
quote='''
and the place of the Lord is every one in whom he finds lodging, or certainly the Son is the place of the Father, just as the Father too is the place of the Son, as the Lord Savior says: I in the Father, and the Father in me; Micah too signifies this same thing: Behold, the Lord will go forth from his place, and will come down upon the high places of the earth; and the mountains will be shaken beneath him, and the valleys will melt like wax before the fire, and like water that is carried down a steep place: for when the Lord Savior came down and set out from the Father, the high places of the earth and the mountains were shaken, and the lower parts of the valleys were melted;
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Tropologically, however, the Lord will go forth from his place, by which we can understand either the Son or all the saints. For the Son himself says: I am in the Father, and the Father in me, and of the saints: I will dwell and walk among them, and I will be their God, and they shall be my people. From these, then, he will go forth, not that he abandons them; for the word of the Lord also went forth from the apostles to those who heard, and yet it did not leave them; and places of this kind, that is, those which deserve to have God as their guest, rising as it were with Christ and sitting with him in the heavenly places, are set on high. Hence too he is said to come down to those who cannot hear his teaching on the mountain. And when he has come down, he will not go up upon the lowly and upon those who are placed below, but upon those who are called the high places of the earth, and who, understanding the majesty of the Lord as he comes, will be shaken. And although they are mountains, yet they will tremble at the presence of such a charioteer or rider. But the valleys, that is, souls set into χοϊκοῖς (earthy) bodies and not rising with the heavenly man, will not be able to bear his presence, but whatever is hard in them will be dissolved, and so they will flow, as if waters had no level ground and were borne headlong into the depth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
