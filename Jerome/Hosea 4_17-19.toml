[[commentary]]
quote='''
Ephraim is a partaker of idols; let him go; their banquet is set apart; in fornication they have played the harlot; his protectors loved to bring disgrace; the spirit has bound him in its wings; and they will be put to shame by their sacrifices. LXX: Ephraim, a partaker of idols, has set stumbling blocks for himself, he has provoked the Canaanites; playing the harlot they have played the harlot, they have loved disgrace from their roaring; you are a whirlwind of the spirit in its wings, and they will be put to shame by their altars. Ephraim, the tribe from which came Jeroboam son of Nebat, who first set up the golden calves in Bethel and Dan, is king of the ten tribes. O Judah, then, to whom I said above: If Israel plays the harlot, let Judah at least not sin, hear my counsel, do not spurn the words of the prophet: since Ephraim is once for all a friend and partaker of idols, let him go, lest you follow his impiety, whose worship and religion and food are set apart from your banquet. For they serve idols once for all, and sacrifice to demons, and play the harlot daily; and they love their fornication; indeed, its princes and protectors, that is, the kings, loved to bring disgrace upon the people, that is: by the vice of the princes the unhappy people took up the worship of idols, whose unclean spirit has bound Israel in its wings and does not allow him to fly about freely. They will therefore be put to shame in their sacrifices, and in their confusion they will take on the disgrace of the princes. Symmachus, for what we have translated: the spirit has bound him in its wings, rendered it into Greek in this way: as if someone were to bind the wind in the wings of the wind; that is, so as to assert that both the princes and the people, or rather both the demons and Israel, are joined together, the vain with the vain and the empty with the empty. For wind and spirit among the Hebrews are called by one word, rua.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
This same thing can also be referred to the heretics, and it is said to Judah, that is, to the churchman: since Ephraim, which is interpreted καρποφόρος (fruit-bearing), promises himself a false richness of doctrine and fruitful dogmas, and is once for all a friend of demons, let him go and despise him, especially since their sacrifices are set apart from your sacrifices. For this is what he says: their banquet is set apart; they have played the harlot once for all, and their princes have deceived the unhappy people; and in place of the worship of God they have steeped them in the disgrace of idols, and the spirit of the devil has bound them in its wings, they who are carried about by every wind of doctrine and cannot remain with a steady foot in the Church. They truly will be put to shame in their sacrifices, because their bread is the bread of mourning. And what is said, he has provoked the Canaanites, can in the same sense be referred to the heretics as well: that most of the heretics have invented things so foul and unspeakable, and have such unclean sacrifices, that idolatry is inferior to them. Or at least, because Canaanite is interpreted merchant or μετάβολος, that is, one who transfers, all who make the house of the Father a house of trade, and seek gains from the peoples, and transfer the truth of the Church into a lie, are to be called Canaanites.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
