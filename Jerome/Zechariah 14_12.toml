[[commentary]]
quote='''
And this shall be the plague with which the Lord shall strike all the nations that have fought against Jerusalem. The flesh of each one shall waste away as he stands upon his feet, and his eyes shall waste away in their sockets, and their tongue shall waste away in their mouth. LXX: And this shall be the ruin with which the Lord shall strike all the peoples who have made war against Jerusalem. Their flesh shall waste away as they stand upon their feet, and their eyes shall flow out of their sockets, and their tongue shall waste away in their mouth. What the nations that shall fight against the city of the Lord are to suffer, the present scripture testifies. They shall stand, he says, upon their feet, and their flesh shall waste away and flow off, and their eyes shall rot and fall out of their sockets; the boastful tongue, which used to blaspheme the people of God, shall be dissolved into corruption and rot within the rampart of the teeth. That the Romans who overthrew Jerusalem did not suffer these things is plain to all, unless perhaps the Jews will assert that those nations shall suffer them which are to fight against the golden and jewelled Jerusalem. But we shall say that all the persecutors who afflicted the Church of the Lord, to say nothing of the torments to come, have received even in the present age what they did. Let us read the ecclesiastical histories, what Valerian, what Decius, what Diocletian, what Maximian, what Maximin, the most savage of all, and lately Julian suffered, and then we shall prove by the facts that the truth of the prophecy was fulfilled even according to the letter: that their flesh rotted, and their eyes wasted away, and their tongue was dissolved into stench and corruption. Moreover, if the heretics think that the cruelty of God is shown by this saying, let them hear that all these things happen so that, as evils fail, good things may grow up in their place. For whoever stands in the Lord and with the Lord, his carnal parts shall flow away so that spiritual ones may arise, and the eyes which saw ill shall fall out of their sockets so that others may be put in their place, which can receive the Lord, with the prophet who says: To you I have lifted up my eyes, you who dwell in the heavens. And the blaspheming tongue shall rot for this reason, that another tongue may be born, which may glorify God and be able to say: My tongue shall meditate on your justice, your praise all the day. Hence Simeon too, taking the infant in his arms and foretelling things to come, says: Behold, this one is set for the ruin and the resurrection of many, so that evil things may fall and the best things be raised up. Hence the Lord too: For judgment, he says, I have come into this world, so that those who do not see may see, and those who see may become blind. The people of the Gentiles did not see, and after faith in Christ began to behold the light of the truth, which speaks through the prophet: The Spirit of the Lord is upon me, because he has anointed me; he has sent me to preach the gospel to the poor, to proclaim release to the captives and to the blind that they may see, and be enlightened with wisdom, of which it is written: A man's wisdom enlightens his face, and in the psalms we read: The Lord enlightens the blind, or makes them wise. For that is rather what σοφοῖ signifies. The Jews saw, and because they would not receive the light, they were covered with eternal blindness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
