[[commentary]]
quote='''
Is Israel a slave, or one born in the house? I think it was from this passage that the Jews, puffed up with pride, said to the Savior: We are the seed of Abraham and have never been slaves to anyone; how do you say: You shall be free?, not knowing that everyone who commits sin is the slave of sin, and that each one serves him by whom he is overcome. Born, then, of Abraham, the friend of God, by their own vice they became as it were sons of Ham, to whom it was said: Cursed be Canaan; he shall be a slave to his brothers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
