[[commentary]]
quote='''
The prophet, understanding this, does not ask who these women are, for that was plain to the prophetic spirit, nor what they carry, about which he had been instructed above, but where they carry it. In short, there follows: I said to the angel who spoke in me: Where are these carrying the jar? He answered: That a house may be built for it in the land of Shinar. For which the Seventy translated, in the land of Babylon. For Shinar is a plain of the Chaldeans, in which those who had moved their feet from the east, and could not stand in the service of God, built the tower of pride; whence the city itself also was called Babylon, that is, confusion, because there the tongues of all were confounded and mingled. Impiety, therefore, is carried by these women into Babylon, so that there its house may be built, and it may be established, and set upon its base, and rest in an everlasting abode. For truly in Babylon is the seat of impiety, both according to the history and according to the mystical senses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
