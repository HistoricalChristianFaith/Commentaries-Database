[[commentary]]
quote='''
And in the Apocalypse of John the souls of the righteous beneath the altar were saying to the Lord: 'How long, O Lord, will you not vindicate us?' And at the same time let us consider that the souls of the righteous are an altar to the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_051.html'
source_title="Homily 51, on Psalm 140"
