
[[commentary]]
quote='''
According to allegory, let us take in the present place too whatever we said about the four horns and the four smiths. I have read in a certain person's volume that the four chariots, in which are red, and black, and white, and spotted and strong horses, are to be understood as the four Gospels, and the horses as the apostles, possessing different graces through the diversity of the colors: of whom some are red with martyrdom, others dark and black, knowing the mysteries of Christ, of whom it is said in the psalm: Darkness was under his feet, and: He made darkness his hiding place. Others white, with the grace of virginity; others spotted and strong, having the grace of healings and of various powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
