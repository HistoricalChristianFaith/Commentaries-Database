[[commentary]]
quote='''
Look at this instance from Zechariah where the Evangelist John quotes from the Hebrew, "They shall look on him whom they pierced." We read in the Septuagint, "And they shall look on me because they have mocked me." In the Latin version, we read, "And they shall look on me for the things that they have mocked or insulted." Here the Evangelist, the Septuagint and our own version all differ. And yet, the divergence of language is atoned for by oneness of spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_057.html'
source_title="LETTER 57.7"

[[commentary]]
quote='''
(Pref. ad Pentet.) This testimony is taken from Zacharias.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520John%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
The Hebrew letters daleth and res, that is, d and r, are alike and are distinguished only by a small stroke. From this it comes about that those who read the same word differently translate it now one way, now another. For the sake of understanding let us give one example: And Samuel, it says, was clothed in an ephod bad, that is, in a linen garment; for linen is called bad; hence also linens are called baddim. In place of this Hebrew and Latin expression some wrongly read ephod bar; for bar means either a son, or a sheaf of grain, or chosen, or οὖλος, that is, curly. What happened there by an error of interpretation we detect has happened here too. For if dacaru is read, it is taken as ἐξεκέντησαν, that is, they pricked or they pierced; but if, in the reverse order, with the letters exchanged, racadu, it is understood as ὠρχήσαντο, that is, they danced. And the error was born from the likeness of the letters. But John the evangelist, who drew wisdom from the breast of the Lord, a Hebrew of the Hebrews whom the Savior loved most, did not greatly care what the Greek letters contained, but rendered word from word, as he had read it in the Hebrew, and said that it was fulfilled at the time of the Lord's passion. But if anyone does not accept this, let him bring evidence from what passage of the holy Scriptures John brought forth these words, and when he has not found it, he will be forced against his will to accept the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
