[[commentary]]
quote='''
But fornication and all impurity, or covetousness, let it not even be named among you, as befits saints; and obscenity, and foolish talk, or scurrility, which are not to the purpose; but rather thanksgiving.

Had there not arisen among the philosophers a certain Cynic who taught that every titillation of the flesh, and the flow of seed coming from any rubbing and touching whatever, was not to be avoided in its season, and had not some of the wise of this age assented to this shameful and blush-worthy heresy, the holy Apostle, writing to the Ephesians, would never have coupled all impurity as well to fornication, and joined covetousness to impurity: not that covetousness by which we desire to amass money, but the one of which we spoke above: that he not overreach, and as a covetous man defraud his brother in the matter. That is, because, insatiable and never filled, he runs about through every kind of obscenity and wantonness. As befits, he says, saints. From this it follows that no one can be called a saint who, apart from fornication, is found in any impurity and covetousness of the pleasures that have delighted him. But if anyone thinks that covetousness is not to be taken in the sense we have given, let him render the reasons why, among fornication and impurity and obscenity and foolish talk and scurrility, he set covetousness in the middle, out of the regular order.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
