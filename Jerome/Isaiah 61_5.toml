[[commentary]]
quote='''
They will have not only the skill of building and restoring cities, but they will also be the best of shepherds, so that, the old shepherds being driven away, to whom God had said through Ezekiel, O shepherds of Israel, do shepherds feed themselves, and not rather the sheep (Ezek 34:2)?, they may hear with the apostle Peter: Feed my sheep (John 21:17). And in a wonderful manner they will pass from masons and shepherds to farmers, that is, to ploughmen and vinedressers, so that they may say with the Apostle: We are God's building, God's husbandry (1 Cor 3:9). Thus the Savior asks the scribes and Pharisees, the vinedressers and farmers of the Jews, what he will do to the wicked vinedressers and farmers; and when they answered, He will destroy the wicked wickedly, and give the vineyard to other farmers (Matt 21:41), he went on: The kingdom of God will be taken from you and given to a nation producing its fruits (ibid., 43). The matter needs no interpretation. For how few of the princes of the churches are from the Jews, and not from foreigners and men of outside nations! Formerly serving idols, and strangers to the testament of God and aliens from his promises, having no hope and without God in the world, they now preside over the churches, and with the plough of faith they tame the hard and formerly untamed hearts of the Gentiles to bear fruit, so that they may multiply the seed of the Lord's doctrine with an abundance of good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
