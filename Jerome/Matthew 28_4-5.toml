[[commentary]]
quote='''
The guards lay like dead men in a trance of terror, but the Angel speaks comfort not to them, but to the women, saying, Fear not ye; as much as to say, Let them fear with whom unbelief abides; but do ye who seek the crucified Jesus hear that He has risen again, and has accomplished what He promised.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252028.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But for fear of him the guards were terrified and became like dead men; and the angel answered and said to the women: You, do not be afraid; for I know that you are seeking Jesus who was crucified. The guards, terrified with fear, lie stunned like dead men, and yet the angel consoles not them but the women. You, do not be afraid. Let them, he says, be afraid; let dread persist in those in whom unbelief remains; but you, because you are seeking Jesus crucified, hear that he has risen and has fulfilled what he promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
