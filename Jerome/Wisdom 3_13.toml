[[commentary]]
quote='''
That this can also be understood of the teachers of contrary dogmas is evident, who glory in the multitude of their peoples, and in those children whom they have reared for destruction, in order to lead them out of the Church and lead them in to the murderer. For the devil slaughters as many as the sons the heretics have begotten in error. Of a soul of this kind it is said: Blessed is the barren woman who is undefiled, who has not known the bed in sin. For blessed is the churchman who, in comparison with the heretic, has not begotten children in error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
