[[commentary]]
quote='''
Asia: elevation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Apocalypse of John"

[[commentary]]
quote='''
Efesus [Ephesus]: will, or my counsel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Apocalypse of John"

[[commentary]]
quote='''
Laodicia [Laodicea]: beloved tribe of the Lord, or they were in vomit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On the Apocalypse of John"
