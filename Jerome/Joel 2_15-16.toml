[[commentary]]
quote='''
Blow the trumpet in Zion, sanctify a fast, call an assembly, gather the people, sanctify the Church, assemble the old men, gather the little ones and those that suck the breasts. Let the bridegroom go forth from his bed and the bride from her bridal chamber. Between the vestibule and the altar the priests, the ministers of the Lord, shall weep, and shall say: Spare, O Lord, your people, and do not give your inheritance to reproach, that the nations should rule over them. Why do they say among the peoples: Where is their God? LXX: Sound the trumpet in Zion, sanctify a fast, proclaim a healing, gather the people, sanctify the Church, choose the old men; gather the little ones and those that suck the breasts, let the bridegroom go forth from his bed, and the bride from her bridal chamber. Between the base and the altar the priests, the ministers of the Lord, shall weep, and shall say: Spare, O Lord, your people, and do not give your inheritance to reproach, that the Gentiles should rule over them, lest they say among the nations: Where is their God? He still exhorts them to repentance, before the hostile army comes. Above, he says, I had said: Blow the trumpet in Zion, wail on my holy mountain, and the rest, for the day of the Lord comes, for the day of darkness and gloom is near, a day of cloud and whirlwind, announcing to you that a people many and strong would come, to overturn your possessions and cities. Now, because I am kind and merciful, patient and great in mercy, again I command and say: Sound the trumpet in Zion, and proclaim repentance among the peoples; sanctify a fast, proclaim a healing, or an assembly, of which we have already spoken before: gather the people, so that the people that sinned when scattered may cease to sin when gathered. Sanctify the Church, so that there may be no one in the Church who is not holy, lest perhaps your prayers be hindered, and a little leaven corrupt the whole lump. Assemble, or choose the old men, so that not age but holiness may be chosen in them. Gather also the little ones and those that suck the breasts, so that there may be no age which does not turn to the Lord. Little ones and sucklings, of whom we read in the psalms and in the Gospel: Out of the mouth of infants and sucklings you have perfected praise. Whom Peter says are nourished with rational milk, without guile; to whom Paul speaks: I gave you milk to drink, not solid food; and whom the Savior too remembers: Do not despise one of these least ones. Let also the bridegroom go forth from his bed, and the bride from her bridal chamber, so that in the time of fasting, of calling and assembly, of the sanctification of the Church, of the choosing of the old men, of the gathering of the little ones and those that suck the breasts, bridegroom and bride may not serve the work of marriage; to whom it is also permitted by the law not to go forth to war. Hence the Apostle too commands withdrawing for a little while from intercourse, so that we may be free for prayer. Therefore he who says that he does penance by chastening his diet, and by fasting and almsgiving, promises this in vain with his words, unless he goes forth from his bed and fulfills a holy and pure fast with a chaste repentance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
