[[commentary]]
quote='''
According to tropology, Amaziah the priest means strong and rigid, because, rebellious and fierce, he forbids the churchman and true prophet to bring forth the words and the teaching of God, and prohibits him from correcting the erring people. His wife, the false Church, will lie open to the fornication of all, and his sons and daughters, whom he wickedly begot in error, will be struck by the Lord's sword; his ground too and all his possession will be the portion of demons, and he himself will die in a polluted land, which does not have God as its inhabitant but is contaminated by the many errors of a depraved religion; and all the people who take to themselves the false name of Israel will go captive out of their land, so as not to serve God, but to submit their necks to the yoke of heretics and demons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
