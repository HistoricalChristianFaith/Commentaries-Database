[[commentary]]
quote='''
And when God had commanded these things, they did not incline their ear — that of the mind, surely, not of the flesh —, but they hardened their neck, rejecting the yoke of the law and, by metaphoran [metaphor], bearing the likeness of untamed animals.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
