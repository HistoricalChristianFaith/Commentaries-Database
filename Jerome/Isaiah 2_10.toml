[[commentary]]
quote='''
Enter into the rock, hide yourself in the dug-out ground from the face of the fear of the Lord and from the glory of his majesty. I indeed exhorted the people, saying, House of Jacob, come, and let us walk in the light of the Lord. But because the Lord has cast off the people of Jacob, and has cast them off because they either did or suffered the things which we have expounded above, therefore I foretell to you the evils that are to come, and I exhort you to enter the rocks and hide in the caves from the face of the Babylonian or the Roman army, when all things will be laid waste, according to what we read in the Gospel: Then they will say to the mountains, Fall upon us; and to the rocks, Hide us (Luke 23:30). But according to the anagogy we are commanded, before the face of the Lord's majesty, to take on the strength of the rock, of which it is said: The rock is a refuge for the hares (Ps 103 [104]:18); and, On a rock you have exalted me (Ps 26 [27]:6). Moses too is set in a cleft of the rock to see the back parts of God (Exod 33). And, The people drank from the spiritual rock that followed them (1 Cor 10:4). And he hides himself in the rock who enters his chamber and, having shut the door, adores the Father, so that, though placed in an earthly body, he does not feel the passing storm of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
