[[commentary]]
quote='''
Your hands are full of blood. He makes plain the reason why God turns his eyes away from them and does not hear their multiplied prayer: because they have shed the blood of the righteous one, and the wicked husbandmen have killed the heir sent to them. Hence the Savior too says to them: Fill up, then, the measure of your fathers (Matt 23:31). For they killed the Prophets sent to them; you, slay the Son of the householder. This testimony is to be used also against those who, while their hands are full of blood from their daily deeds, join day to night in prayer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
