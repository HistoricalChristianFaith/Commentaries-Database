[[commentary]]
quote='''
Here they reveal the cavil which they had prepared; albeit the Lord had not given sentence of Himself, but had recalled to their minds ancient history, and the commands of God.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
They say to him: Why then did Moses command to give a bill of divorce and to put her away? They lay open the false charge they had prepared. And yet the Lord had not put forward an opinion of his own, but had recalled the ancient history and the commandments of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
