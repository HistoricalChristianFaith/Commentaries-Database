[[commentary]]
quote='''
The Lord himself consecrated his baptism by a forty days' fast, and taught us that the more violent devils cannot be overcome except by prayer and fasting.
'''
source_url='https://www.newadvent.org/fathers/30092.htm'
source_title="Against Jovinianus 2.15"

[[commentary]]
quote='''
But this kind is not cast out except through prayer and fasting. While he teaches how a most wicked demon can be expelled, he instructs all for life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
