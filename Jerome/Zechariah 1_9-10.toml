[[commentary]]
quote='''
So when the prophet saw a man mounting a red horse, and behind him red, dappled and white horses, and did not know what he had seen, and desired to know the meaning of his vision, and said: What are these, my lord? the angel who was speaking in him promises that he will tell; and while he keeps silent, the man who was standing among the myrtle groves relates it. These are the kingdoms which the Lord commanded to walk through the earth and to subject it to their power.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
