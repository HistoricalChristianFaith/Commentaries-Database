[[commentary]]
quote='''
I do not excuse Herod that he committed this murder against his will by reason of his oath, for perhaps he took the oath for the very purpose of bringing about the murder. But if he says that he did it for his oath's sake, had she asked the death of her mother, or her father, would he have granted it or not? What then he would have refused in his own person, he ought to have rejected in that of the Prophet.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
With an oath he promised to give her whatever she should ask of him. I do not excuse Herod on the ground that he committed murder against his will and unwillingly because of the oath; he perhaps swore for this very purpose, to prepare his engines for an occasion to come. Otherwise, if he says that he did it because of the oath, had she asked for the death of his father, or of his mother, would he have done it or not? What, therefore, he would have refused in his own case, he ought to have disregarded in the case of the prophet as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
