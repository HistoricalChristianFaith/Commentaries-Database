[[commentary]]
quote='''
And he will be like a tamarisk — which in Hebrew is called 'aroher', or, as Symmachus translated, an unfruitful tree — in the wilderness, and he will not see when good things come, which the multitude of the nations is to see, but he will dwell in dryness in the desert. This is said of the people of the Jews, who dwell in the desert and bear no fruits and are in a land of saltness, which bears no fruits, and uninhabitable, which has neither God as its guest, nor the protection of angels, nor the grace of the Holy Spirit, nor the knowledge of teachers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
