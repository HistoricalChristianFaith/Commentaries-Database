[[commentary]]
quote='''
For whoever are of the works of the Law are under the curse. For it is written: Cursed is everyone who does not continue in all the things that are written in the book of the Law, that he may do them.

I have this custom: whenever something is taken by the apostles from the Old Instrument, I go back to the original books and examine carefully how it is written in its own place. And so I found this very passage set down in Deuteronomy by the Seventy translators thus: "Cursed is every man who does not continue in all the words of this Law, that he may do them: and all the people shall say, So be it" (Deut. 27:26). In Aquila, however, thus: "Cursed is he who does not establish the words of this Law, that he may do them: and all the people shall say, Truly". Symmachus: "Cursed is he who does not make firm the words of that Law, that he may do them, and all the people shall say, Amen". Theodotion, moreover, translated it thus: "Cursed is he who does not raise up the words of this Law, to do them, and all the people shall say, Amen". From this we understand that the Apostle, as in other places, set down the sense of the testimony rather than the words; and we hold it uncertain whether the Seventy Translators added "every man" (omnis homo) and "in all" (in omnibus), or whether it was so in the old Hebrew and was afterwards deleted by the Jews. Now what spurs me to this suspicion is this: the word "every" (omnis) and "in all" (in omnibus), as though necessary to his sense for proving that whoever are of the works of the Law are under the curse, the Apostle, a man of Hebrew learning and most learned in the Law, would never have brought forward unless it were found in the Hebrew volumes. For this reason, reading through the Hebrew volumes of the Samaritans, I found that CHOL, which means "every" or "all", is written there and agrees with the Seventy translators. In vain, therefore, did the Jews remove it, so as not to seem to be under the curse if they could not fulfill all the things that are written, since the more ancient letters of another nation too testify that it was set down.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
