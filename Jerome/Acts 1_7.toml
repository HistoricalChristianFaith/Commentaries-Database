[[commentary]]
quote='''
The Apostle writes concerning the Savior: In whom are hidden all the treasures of wisdom and knowledge. So all the treasures of wisdom and knowledge are in Christ, but they are hidden. Why hidden? After the resurrection, when asked by the apostles about the day, he answered more plainly: It is not yours to know the times and the moments which the Father has set in his own power. When he says: It is not yours to know, he shows that he himself knows, but that it is not expedient for the apostles to know, so that, always uncertain about the coming of the judge, they may live each day as though they were to be judged on the next.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
