[[commentary]]
quote='''
Seeing and reading these things, such great mysteries, let us cry out with the Apostle and say: O the depth of the riches of the wisdom and knowledge of God, how inscrutable are your judgments, and your ways unsearchable. The prophet, too, perceiving this and turning it over within himself, conjectures concerning the judgments of God: In the night I was exercised with my heart, and I swept my spirit, and I was saying: Will God cast off for ever, or will he not add to have mercy any more, or will he hold back his mercies in his wrath? And I said: Now I have begun; this is the change of the right hand of the Most High. And the sense is: This, that I thought the Lord was abandoning sinners for ever and, with wrath taking its place, restraining his mercies, I understood to have been done for this reason, that by the change of his right hand, which is the right hand of the Most High, he might change all things and have mercy on those whom he had previously cast away.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
