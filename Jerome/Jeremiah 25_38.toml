[[commentary]]
quote='''
He has forsaken, like a lion, the shade — or the lair — that is his — and, as is more correct, the tabernacle; for this is what the Hebrew 'soccho' means —, for their land has become a desolation — or trackless — before the wrath of the dove — or before the great sword — and before the wrath of the fury of the Lord. The Lord, of whom he had said above: from on high he will roar, and from his holy dwelling he will utter his voice; roaring he will roar over its beauty, will himself forsake his tabernacle, of which it is written: his place has been made in peace — or in Salem — and his dwelling in Zion; he himself will desert his seat and will fulfill what he spoke through this same prophet: I have left my house, I have forsaken my inheritance. And he has left, like a lion, his lair, so that all the beasts have power to lay waste his land. For while the lion is its guardian and protector, no one dares to approach it. Their land, he says, has become — without doubt either that of the people of the Jews, or else that of all the nations — a desolation and trackless before the wrath of the dove. He who has read above that Nebuchadnezzar is called the Lord's 'servant' will not be surprised that he is understood as the Lord's 'dove' — for which the Seventy translated 'great sword' —, although we can also take the 'dove' in the person of Jerusalem, because she is angry and sad that she has lost the guardianship of her lion and that her land has come into desolation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
