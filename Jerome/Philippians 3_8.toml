[[commentary]]
quote='''
I have read in someone's volume that the cantharus is understood of the heretics for this reason, that they hold doctrines to be compared with dung. Hence the Apostle too says that he counted the error of the old teaching as scybala, that is, as dung. Not that the old law, as the Manichaeans think, is reckoned as scybala in comparison with the Gospel — which it is impious to say, since both Testaments belong to the one God —, but that the teachings of the Pharisees, and the precepts of men, and the Deuterosis of the Jews are called dung by the Apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
