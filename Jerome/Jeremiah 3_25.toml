[[commentary]]
quote='''
We will sleep in our confusion, and our shame will cover us, because we have sinned against our God, we and our fathers, from our youth up to this day, and we have not heard the voice of the Lord our God. Let Israel say this, who did not hear his Lord; let every heretic say this who repents; and yet it is a part of salvation to confess and to know one's sins. 'Tell,' he says, 'your iniquities first, that you may be justified'. For truly Israel forsook Christ, the Lord his God, and sinned against him not only at the time when he was seen in the flesh, but also before his coming. Hence they say: 'we and our fathers, from our youth up to this day, and we have not heard the voice of our God, who spoke to our fathers: if you believed Moses, you would believe me also; for he wrote of me'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
