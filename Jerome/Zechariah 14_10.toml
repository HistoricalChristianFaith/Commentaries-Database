[[commentary]]
quote='''
Then all the land in which the Jews dwelt shall be turned back as far as the desert, that is, as far as the people of the Gentiles, which was formerly deserted and had no knowledge of the law; from Geba as far as Rimmon, that is, from the hill as far as the height, because from the earth and from the desert we rise to the hills, and from the hills to the mountains. Hence too the bridegroom in the Song of Songs leaps over the hills, which are lower, and springs upon the high mountains, of which it is written: The high mountains are for the harts. But if we wish to take Rimmon as pomegranate, for among the Hebrews it is interpreted both ways, let us say this, that the boundaries of the Church begin from the hills, so that the whole ecclesiastical order may be built up, of which we spoke above when we interpreted the mourning for the only-begotten and the mourning like that of Hadadrimmon. Nor is the Church content with this boundary, but it shall reach as far as the south, in the fullest light, on which we commented some time ago, and so we are silent about it now, lest by inculcating the same things too often we become tiresome to the reader. And the Church shall be exalted, which began from the hills and reaches to the south; and it shall dwell in its place, of which it is written: In a place of pasture, there he has set me. From the gate of Benjamin, which is interpreted son of the right hand and not son of days, as some wrongly suppose. For it is one thing if it ends in the letter nun, another if in mem. And it shall reach as far as the place of the eastern and former gate, as far as the gate of the corners. We begin from virtue, for that is what the right hand signifies, and we reach as far as the former gate, so that through it we may enter the others; and at once the gate of the corners meets us, where the cornerstone is: Which the builders rejected, and it has become the head of the corner. This cornerstone joins both walls and brings the two peoples into one, of which God also speaks through Isaiah: Behold, I will lay in Zion a cornerstone, chosen and precious, in its foundations; and he who believes in it shall not be confounded. This cornerstone willed that other cornerstones too should be built up upon it, so that the apostle Paul could freely say: Built upon the foundation of the apostles and prophets, Christ Jesus himself being the chief cornerstone. These stones the heretics do not imitate, who do everything for the sake of glory and gain, and pray at the corners of the streets, leaving the straight path. For every corner breaks a straight line; and therefore the harlot in Proverbs, however we may wish to take her, whose feet do not rest at home, but she either wanders out of doors or lies in wait at every corner of the streets, when she has seen a foolish young man — for she does not invite one whom she has perceived to be prudent and mature with age, of whom it is written: A man's grey hairs are his wisdom —, at once seizes him, and kisses and flatters him, and leads him to the brothel, and invites him to intercourse. Let us therefore leave the feigned corners, and pass over to the firm and strong corners of Christ; and when we have reached them, at once the tower of Ananeel meets us, which is interpreted most pleasing of God. For what is more pleasing than the tower of Solomon? Of which it is said to the bride: Your neck is like the tower of David, which is built in Thalphioth; a thousand shields hang upon it, all the darts of the mighty. This tower the Lord in the Gospel wishes to be built, once the expenses have first been reckoned and the costs counted; and of it it is said to Jerusalem: Let peace be in your strength, and abundance in your towers; of it also the holy man speaks to God: You have led me, for you have become my hope; a tower of strength from the face of the enemy. From the tower of Ananeel we come to the king's winepresses, for which three psalms also have their title, and the Lord says in Isaiah: I have trodden the winepress alone, so that our vintage may abound in them, and we may press out the clusters, and tread the new wine reddening in the blood of Christ, so that we may drink the wine which gladdens the heart of man, and which the bride desires, speaking to the bridegroom's companions: Bring me into the wine cellar, set charity upon me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
