[[commentary]]
quote='''
God the Lord is my strength: for I shall have no other power except in Christ, and I shall count all the righteousnesses of the law as refuse. And he will set my feet like those of harts, that I may tread upon the asp and the basilisk; and like a little child I shall put my hand into the hole, and draw out the serpent, and play with the snake: For my kinsman is like a roe, or a young hart. And because he himself is the hart, he has granted to me too that I should be a hart, lofty in horns, cleaving the hoof, chewing the cud, and putting serpents to flight by my scent, of which it is said in Psalm 17 (18): Who made my feet perfect like those of harts, and will set me upon the high places. And in Psalm 28 (29): The voice of the Lord perfecting the harts. He will therefore set my feet among his other harts, and lead me to heavenly places, that among the angels I may sing the glory of the Lord, and announce upon earth peace to men of good will. And I shall sing his victory and triumph and the trophy of the cross. This is according to the Hebrew and the Fifth Edition, so that we may refer everything to the time of the overthrow of the Jews and to the coming of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
