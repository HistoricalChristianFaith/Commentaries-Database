[[commentary]]
quote='''
Over the breaking of the daughter of my people I am broken and saddened, astonishment has taken hold of me. God answers that in the affliction of Jerusalem he himself appears afflicted, and, after the likeness of a man, he is broken by astonishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
