[[commentary]]
quote='''
And she took a theristrum and covered herself. A theristrum is what is called a mantle, a kind of garment Arabian even now, with which the women of that province are veiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
