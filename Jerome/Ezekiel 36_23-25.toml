[[commentary]]
quote='''
'But if they repent and I am sanctified in their midst, then the whole crowd of the nations will know that I will take them from the lands into which they had been scattered, and lead them back into the land of the Church; and I will pour out upon them not the waters of saving baptism but the waters of the teaching and the word of God, and I will cleanse them from all their defilements and from all the idols and errors which they have feigned in their heart.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
