[[commentary]]
quote='''
And when these have been consumed, and the captivity snatched from their hands, then the divine word will gather like sand the captivity of the Chaldeans, and will take delight in kings, and tyrants will be its sport, seeing that the devil, once most powerful, and his kingdoms — showing which to the Savior also, he says, All these I will give you, if you fall down and worship me —, have been destroyed by his coming; for it is the delight of prudence and the pleasure of wisdom when folly is destroyed, and the once great power of tyrants, overcome and cast down, is turned into derision. For not the dragon alone, who is the beginning of the Lord's creation, made a sport for the angels, was formed to be held in sport by the Lord; nor will God give him alone, like a sparrow to a little child; but if anyone else also is cruel and of a tyrannical mind, he will be handed over to the word of God for derision.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
