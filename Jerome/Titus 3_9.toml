[[commentary]]
quote='''
But avoid foolish questions, and genealogies, and contentions, and fights that come from the Law: for they are useless and vain. Because questions are manifold and diverse, Solomon therefore spoke about those who seek God, saying: "But those who seek him rightly have found peace" (Prov. 16:8). Those, then, who do not seek God rightly cannot find peace. There are very many examples of those who seek God not rightly. The Jews seek God perversely, hoping that they can find him without Christ. The heretics, clattering with an empty din of words, seek one whom they cannot find. Philosophers too, and barbarians, holding various views about God, have sought God. But because they did not seek rightly, their questions were foolish, since they thought that God could be comprehended by human senses. From these questions, then, Paul calls us back. But to wise questions, and to those propped up by the authority of the Scriptures, he rather exhorts and summons us, not unaware of the precepts of the Savior, in which he says: "Seek and you will find, knock and it will be opened to you, ask and it will be given to you. For everyone who seeks finds, and who asks receives, and to him who knocks it will be opened" (Luke 11); only let our body not be subject to sins, and wisdom will enter into us. Let the understanding be exercised, let the mind be fed daily with divine reading, and our questions will not be foolish questions. And what he says, "Avoid genealogies and contentions and quarrels that come from the Law", strikes properly at the Jews, who boast in this and think they have knowledge of the Law if they hold the names of individuals: names which, because they are barbarous and we do not know their etymologies, are generally pronounced corruptly by us. And if perhaps we have erred in accent, in the length and shortness of a syllable, either lengthening short ones or shortening long ones, they are wont to laugh at us for our lack of skill, especially in the aspirates and in pronouncing certain letters with a scraping of the throat. This has come about because the Seventy translators, through whom the divine Law was translated into the Greek tongue, expressed in particular the letter HETH, and AIN, and others of this kind (because they could not carry them over into the Greek language with a double aspiration), by adding other letters. For example, so that for Rahel they said Rachel, and for Jeriho, Jericho, and for Hebron, Chebron, and for Seor, Segor; but in other cases this attempt fails them. For we and the Greeks have only one letter s, but they have three, SAMECH, SADE and SIN, which have different sounds. Isaac and Sion are written with SADE; Israel with SIN, and yet it does not sound as it is written. Seon, king of the Amorites, is both pronounced and written with the letter SAMECH. If, then, these idioms of the names and of the language, being of course barbarous, have not been expressed by us as they are expressed by the Hebrews, they are wont to raise a guffaw and to swear that they have no idea at all what we are saying. Hence it has also been our care to correct, from the originals themselves, all the books of the old Law which the learned man Adamantius had arranged in the Hexapla, copied from the library of Caesarea; in these both the Hebrew words themselves are written out in their own characters and they are expressed in Greek letters in the adjoining column. Aquila also and Symmachus, the Seventy too and Theodotion keep their own order. Some books, however, and especially those which among the Hebrews are composed in verse, have three other editions added, which they call the fifth, sixth and seventh translation, editions that have gained authority without the names of their translators. That immortal genius bestowed these things on us by his own labor, so that we need not greatly fear the haughtiness of the Jews, who delight in loosened lips, a twisted tongue, hissing saliva and a scraped throat. They have also another occasion for pride: just as we who are Latins more easily commit to memory Latin names having their origins from our own tongue, so they from an early age, with their innermost senses, have drunk in the native words of their speech, and from the beginning, Adam, to the last, Zerubbabel, they run through the generations of all so readily and swiftly from memory that you would think they were reciting their own name. We, who either learned other letters, or certainly believed in Christ late, or, even if we were given over to the Church as infants, pursue the sense of the Scriptures rather than the words: if perhaps we do not know this so well, they think themselves more learned in reciting names, in reckoning years, and in grandsons and great-great-grandsons, grandfathers, great-grandfathers and great-great-great-grandfathers. I heard a certain one of the Hebrews, who pretended at Rome to have believed in Christ, raise a question about the genealogies of our Lord Jesus Christ written in Matthew and Luke: namely, that from Solomon to Joseph they agree with each other neither in number nor in the correspondence of the names. When he had perverted the hearts of the simple, he would bring forth, as if from the inner sanctuary and an oracle, certain solutions, as they seemed to him, when he ought rather to have sought righteousness and mercy and the love of God, and after those things, if it happened to come up, to dispute about names and numbers. Perhaps we have said enough, and more than was necessary, about the haughtiness of the Hebrews; but an occasion was given us to discourse on the genealogies and contention and quarrels that come from the Law. The dialecticians, whose chief is Aristotle, are wont to spread nets of argumentation and to shut up the roving freedom of rhetoric within the thorn-thickets of syllogisms. These men, then, who wear away whole days and nights in asking or answering, in giving a proposition or accepting it, in assuming, confirming and concluding, call certain people contentious, those who dispute as they please, not by reason but with the temper of litigants. If, then, those whose art is properly contention do this, what ought the Christian to do but flee contention altogether? Quarrels about the Law, too, are to be utterly rejected and left to the folly of the Jews. For they are useless and vain, having only the appearance of knowledge; but they profit neither those who speak nor those who hear. For what does it profit me to know how many years Methuselah lived, or in what year of his age Solomon took a wife, lest perhaps Rehoboam be believed to have been born in the eleventh year of Solomon's age? and many things of this kind, which are either hard to find because of the variety of the books and the errors that have grown in (while uncorrected copies are gradually written from uncorrected copies), or, even if we should find them with great zeal and labor, we know will profit nothing. It often happens that we have fights over the Law, not from a desire for truth but from boasting of glory, while we wish to be thought learned among those who hear; or at any rate we pursue shameful gain from this petty bit of fame. For what does it profit to chatter with foaming lips and with the barking of dogs, when a simple and moderate answer can either appease you, if it is true, or, if false, be corrected gently and peaceably?
'''
