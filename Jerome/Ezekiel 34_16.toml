[[commentary]]
quote='''
Then what had perished among the peoples of the nations will be sought, and what had strayed through the persuasion of heretics will be brought back, and what had been broken will be bound up, and what is crushed and weak will be made firm — that what is written may be fulfilled: Who heals their infirmities, and binds up their bruises. A heart, indeed, crushed and humbled, God does not spurn; whence the holy man too says: Heal me, for my bones are troubled, and in Psalm 37 (38), repenting: There is no peace, he says, for my bones before the face of my sins —. And what will be fat, he says, and strong I will guard, lest it be devoured by beasts; and he will feed his sheep in judgment, knowing what pastures are owed to which sheep — for Diverse indeed are the dwellings with the Father. And the Father judges no one, but has given all judgment to the Son —. These things, then, he spoke against the shepherds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
