[[commentary]]
quote='''
But if the dead shall bury the dead, we ought not to be careful for the dead but for the living, lest while we are anxious for the dead, we ourselves should be counted dead.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jesus said to him: Follow me, and leave the dead to bury their own dead. Whoever does not believe is dead. But if the dead buries the dead, we ought to have care not for the dead but for the living, lest, while we are anxious about the dead, we too be called dead.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
