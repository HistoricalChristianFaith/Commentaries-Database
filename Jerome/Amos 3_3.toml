[[commentary]]
quote='''
There are some who think that the first example contains a teaching: that two cannot walk together unless they have first agreed with each other in him who made both one, and the middle wall of the partition destroyed, and fashioned the two into one new man; and he made peace between them, and joined them with the bond of love, so that, when two are together, they may ask of the Father and obtain whatever they have asked. These are the two rods which are joined to each other in Ezekiel, and the two peoples, of the circumcision and of the Gentiles, of which the Lord speaks to Elijah: I have left for myself seven thousand men who have not bent the knee before Baal. And in another place God: I was found, he says, by those who did not seek me; I appeared to those who did not ask for me. But when the two have been brought together into one, they will cleave to the Lord, and one spirit will come to be: For he who cleaves to the Lord is one spirit. These two, then, who agree with each other and walk together in the way of Christ, can fear the assault of none of their adversaries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
