[[commentary]]
quote='''
For I have come to separate a man against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law; and a man's enemies are those of his household. This passage is written in nearly the same words in the prophet Micah. And note, wherever a testimony is set down from the Old Testament, whether the sense alone agrees or the wording as well.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
For the son does insult to the father; Absalom, namely, to David: he defiled not only the kingdom but also the concubines of his father by incestuous intercourse. The daughter rises up against her mother: although for the present we find no testimony of this in the holy Scriptures, there are so many examples of it in daily life that we ought rather to mourn that they are so many than to search for them. The daughter-in-law against her mother-in-law, as the wife of Esau rose up against Rebekah. A man's enemies are the men of his own household. Here I do not seek examples, since there are too many of them for us to need testimonies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
For the son who was born of God, neglecting his Creator, blasphemes him by whom he was made, as Scripture says: Has not one God created you? Is not one the father of all of you? And the soul despises the heavenly Jerusalem, and scorns her mother the Church, and whoever despises her shall die the death. And the daughter-in-law rises up against her mother-in-law: this seems difficult to understand according to tropology; but whoever has read the Song of Songs, and has understood the bridegroom of the soul to be the word of God, and has believed the Gospel according to the Hebrews, which was published and which we lately translated, in which it is said in the person of the Savior: Just now my mother, the Holy Spirit, took me by one of my hairs, will not hesitate to say that the word of God arose from the Spirit, and that the soul, which is the bride of the word, has as her mother-in-law the Holy Spirit, who among the Hebrews is called by a word of feminine gender, rua. Heretics, therefore, although they formerly believed in the Scriptures, which were written and published by the Holy Spirit, transfer themselves to new doctrines, and to the leaven of the Pharisees, and to the commandments of men, and while they despise the word of God, they do injury to their mother-in-law. And lest perhaps you doubt that the Word and Son of God is born of the Holy Spirit, consider the words of Gabriel to Mary: The Holy Spirit, he says, will come upon you, and the power of the Most High will overshadow you; therefore the holy thing that will be born of you will be called the Son of God. After this there follows: A man's enemies are the men of his own household. This it seems to us should be expounded thus according to tropology: The head of every man is Christ; and Christ is the head of the Church; his enemies are often those who are thought to be in his house, that is, in the Church, and they do not indeed withdraw from the head, but they think against their own head: those who, without a teacher and the grace of the Lord, promising knowledge of the Scriptures by their own judgment, are puffed up and know nothing; and they languish over questions and contentions and battles of words: those who, though they truly stand within the house, are enemies of the truth. We ought to know, moreover, that in the Gospel there are nearly the same words that we now read in the prophet, and that according to the context of that place they have another sense; whether they were taken from the prophet or commanded on his own authority, it belongs to the Lord to know, who spoke both in the prophets and in the Gospels. Now there the Lord says: I came to divide a man against his father, and a daughter against her mother, and a daughter-in-law against her mother-in-law, and a man's enemies are his own household.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
