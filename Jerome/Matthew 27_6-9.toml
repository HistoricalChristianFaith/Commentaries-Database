[[commentary]]
quote='''
Let us say something similar, and in another place in the Gospel according to Matthew — when Judas brought back the thirty pieces of silver, and the priests were unwilling to accept it or to put it into the corban, since it was the price of blood; and from it they bought the potter's field for the burial of strangers. The price of Christ is our burial; and that field is called Akeldama, which is "the field of blood." It is the field of blood of the Jews, but it is our burial. For we were strangers and sojourners, we had nowhere to rest. He was crucified and died, and we were buried together with him. "That there might be fulfilled," it says, "that which is written in Jeremiah the prophet. He brought back," it says, "the thirty pieces of silver, the price that was written," and so on. "As it is written," it says, "in Jeremiah the prophet." This is written in Matthew. We searched in Jeremiah, we could not find this at all; but we found it in Zechariah. You see, therefore, that here too there was an error, just as there.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
