[[commentary]]
quote='''
As Christ was made for us a curse of the cross, so for the salvation of all He is crucified as guilty among the guilty.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then two robbers were crucified with him, one on the right and one on the left. If Golgotha is the tomb of Adam and not the place of the condemned, and the Lord is crucified there in order to raise up Adam, why are two robbers crucified in the same place?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
