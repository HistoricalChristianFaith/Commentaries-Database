[[commentary]]
quote='''
And she did not know this, that I gave her grain and wine and oil, and multiplied silver for her, and gold, which they made into Baal. LXX: And she did not know that I gave her grain and wine and oil, and multiplied silver for her; but these she made into things of silver and gold for Baal. He is answering what came before, for she had said: I will go after my lovers, who give me my bread and my water, wool and flax, and my oil and my drink; all of which she had received so that she might turn them to the worship of God. But she, the bread that strengthens and the wine that gladdens the heart of man, and the oil that enlightens every man coming into this world, and the silver of which we have often said: The words of the Lord, chaste words, silver tested by fire, proved for the earth, purified sevenfold; and the gold of which we read: If you sleep in the midst of the lots, the wings of a dove covered with silver, and the hinder parts of her back in the greenness of gold, she turned into idols, and made Baal, which is interpreted 'higher' and 'devouring', while she either thinks that she has greater dogmas than those of the Church, or is devoured in the very knowledge of false opinion. But that, according to the letter, Jerusalem abounded in gold and silver and all riches, and made idols to Baal, the demon of the Sidonians, or, as some more rightly judge, the Babylonian one, from whom he is also called Bel, Ezekiel sets out more fully in his volume, and the whole choir of the prophets relates.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
