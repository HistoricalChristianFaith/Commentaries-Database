[[commentary]]
quote='''
And they will dwell in the land of confession, which he had given to their fathers Abraham, Isaac and Jacob and to all the saints and prophets, and they will be for a people of God and the Lord will be to them for a God, which is borne out at the present time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And let them dwell in the land which I had given to their fathers, namely the masters and teachers, and let them again be the people of God, and let the Lord, whom they had formerly offended, become God to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
