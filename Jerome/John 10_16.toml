[[commentary]]
quote='''
After this it is written: And he brought me out into the outer court and led me around through the four corners of the court, and behold, there was a little court in a corner of the court, a little court in each corner of the court; in the four little courts of the corner, little courts laid out; that man whom he often mentions brought him out of the place of the priests which sloped toward the north, or which was separated, where the priests cook for trespass and for sin or ignorance; and he brought him out into the outer court: from which we understand that the court from which he went out was the inner one, and that there are many courts in the holy Scriptures — of which we read: You who stand in the house of the Lord, in the courts of the house of our God, and in John: And other sheep I have, which are not 'of this court'; and them too I must bring: and they will hear my voice, and there will be one 'court' and one shepherd — for this is what the Greek αὐλή means, which Latin simplicity translated as 'fold' —: for when he says 'of this court', he shows that there is another as well, which is pointed out either in the throng of the nations, as distinct from Israel, or in the heavens, as separate from the earthly court, and that to each office a court has been assigned according to the quality of merits, a subject that was argued more fully earlier —;
'''
source_url = "https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html"
source_title = "Commentary on Ezekiel"
