[[commentary]]
quote='''
We have heard the report of it; our hands have grown feeble; tribulation has seized us, pains as of a woman in labor. The people answers, whom the prophet, nay rather the Lord through the prophet, has threatened with the Babylonians: that before they come they have been overcome by fear, and cannot lift up their hands, and anguish has seized them as pain seizes a woman in labor; than which pain those women who have felt it affirm that nothing is more grievous.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
