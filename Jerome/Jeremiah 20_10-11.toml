[[commentary]]
quote='''
All the men who were peaceable toward me and guarding my side: if somehow he may be deceived, and we may prevail against him and take our revenge on him! But the Lord is with me as a mighty warrior. When adversaries have risen up, and those who were once friends and peaceable have turned to war and have wished to lay snares for us, let us not be greatly concerned, but let us choose to say this, which the prophet too speaks: But the Lord is with me as a mighty warrior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
