[[commentary]]
quote='''
Go about the ways of Jerusalem, and look, and consider, and seek in its squares, whether you may find a man who does judgment and seeks faith, and I will be merciful to it. But if they even say: The Lord lives, this too they will swear falsely. Great is the love of righteousness: not that God should deliver the city for ten righteous men, as in Abraham's question and God's answer, but that if he finds a single one in Jerusalem, now on the very point of perishing, who does judgment and seeks faith — or, as Symmachus translated, truth —, God would nonetheless have mercy on Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
