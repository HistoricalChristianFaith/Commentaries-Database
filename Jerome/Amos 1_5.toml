[[commentary]]
quote='''
And I will break, he says, the bars of Damascus, and I will destroy the inhabitant from the plain of the idol: that is, all the strength of the Syrians, who, as with a kind of cart and with bars, kept off the onsets of their adversaries. But the plain of the idol, which in Hebrew is called auen, and which both the Seventy and Theodotion rendered ὢν, Symmachus and the Fifth edition translated iniquity; Aquila ἀνωφελοῦς, that is, useless, to show the vain help of idols, since the people of Damascus is taken captive when the Assyrian comes. For we read that Tiglath-pileser king of Assyria, after killing Rezin king of Damascus, of whom Isaiah also speaks, carried away the whole people of Syria, which was called Aram, to Cyrene, and for this reason it is now said:

And him who holds the sceptre from the house of pleasure and luxury, and the people of Syria will be carried away to Cyrene, says the Lord. LXX: And I will cut down the tribe from the men of Charran, and the people of Syria, the named one, will be led captive, says the Lord. So that we understand: I will break and I will destroy; and the people of Syria, last of all, will be carried away into the borders of Egypt.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
And by the bars of Damascus, as it were very strong and very firm bolts, let those be understood who are equipped with the art of dialectic and with the arguments of the philosophers. For example: he is called the door who conceived and brought forth a false dogma, like Arius in Alexandria; its bars and its very firm bolts are Euticius and Eunomius, who try to strengthen it with syllogisms and enthymemes, or rather with sophisms and pseudomena and sorites, which were wickedly invented by others. And when the bars of Damascus have been crushed and broken, he will also destroy the inhabitants from the plain of ὢν, which is interpreted labour or pain. For all the heretics have tried with excessive labour and with the pain of seeking to find some order and consistency for their heresy. And I will cut down the tribe from the men of Charran, which in our tongue is rendered holes. For they have no windows through which the light of truth may enter in to them, but certain holes and hidden passages through which harmful and unclean animals come in. And Aram will be led captive, a people lofty and exalted, which has been lifted up into pride and promises itself heavenly things, so that it may be taken captive for its own salvation and, according to the Hebrew, be carried away to Cyrene, where the calling of God is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
