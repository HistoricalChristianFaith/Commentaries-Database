[[commentary]]
quote='''
The same thing is heard also in the third book of Kingdoms (1 Kings): that the wife of Jeroboam, when her son was sick, goes to Ahijah the man of God and brings him loaves and raisins and a little jar of honey. For it is told what she brought with her, and yet it is not written that the prophet accepted it, since indeed he both rebuked her and foretold the mourning to come; although it may be that those who had been accustomed to go to soothsayers (for there were many diviners and soothsayers in Israel) thought, by a bad custom, the same thing also of the prophets, and wished to offer to holy men what they had been accustomed to offer to diviners, and that Scripture only related what they wished; yet it did not add either that they dared to offer it or that the prophets accepted it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
