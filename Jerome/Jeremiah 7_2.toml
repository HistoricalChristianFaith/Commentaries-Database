[[commentary]]
quote='''
The word that came to Jeremiah from the Lord, saying: Stand in the gate of the house of the Lord and proclaim — or read — there this word, and say: Hear the word of the Lord, all Judah, you who enter by these gates to worship the Lord! This is not found in the edition of the Seventy, but has been added from Theodotion out of the Hebrew. Now the prophet is commanded to stand in the gate of the Lord, through which the multitude of the people enters to pray to the Lord, so that on this occasion they may be able to hear what the Lord commands. By this we understand the hardness of the people of the Jews, in that they held the prophets as liars and madmen, since it is through the occasion and the throng of the place that they are compelled to hear the words of the Lord, and not because they are the words of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
