[[commentary]]
quote='''
The man, then, whose name is Orient, goes in by the eastern gate, to enlighten those whom he found at the first front of the vestibule, or at the very entrance of the gate: not by one step but by several, whose number is passed over in silence so that the difficulty of the ascent may appear, and so that, however many steps you propose to yourself, you may know that it is less than what is left in doubt — I think this is the gate of which it is also sung in the Psalms: This is the gate of the Lord; the righteous shall enter by it —; and he measured the threshold of the gate, so that we may be able to know that all things lie open to the knowledge of God; this threshold is said to be of one reed in breadth, and nothing is said of its height and length: for it is a way and an entrance, and through it one must proceed to the inner parts — although in this place the Seventy superfluously said 'length' or, as is contained in most manuscripts, 'height' —; and the rooms, that is, the cells and παραστάδες, have one reed each, as much in length as in breadth, but between cell and cell there are only six cubits, so that the inner parts of the rooms may have the full measure of the reed, that is, of six cubits and a handbreadth, while works and reason agree alike, but those things which are outside, that is, between cell and cell, five cubits; for they have not yet penetrated the secrets of Christ, nor can they say: The king has brought me into his room, and elsewhere: All the glory of the king's daughter is within, but, while the disciples stay at home with Christ, they cannot hear his mysteries, and they desire the word of God to come out to them outside; and therefore the measure of five cubits is set in them, so that they may be taught to refer all things to the five senses; the threshold of the other gate too, or, as is contained in the Seventy, of the second and the third vestibule, is of the same measure of one reed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
