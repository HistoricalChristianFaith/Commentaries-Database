[[commentary]]
quote='''
For the voice of one declaring from Dan, and of one making known an idol — or pain — from mount Ephraim. The divine word now speaks according to the lie of the land of Judea. For the tribe of Dan, near Mount Lebanon and the city which is now called Paneas, faces the north, from which Nebuchadnezzar is to come. And he describes an idol, whether Bel, or pain, or iniquity, as coming from mount Ephraim. For after the tribe of Dan comes the land of Ephraim, through which one comes to Jerusalem. 'Dan' means 'judgment', 'Ephraim' 'abundance'. The judgment of the Lord, therefore, will come upon the land that sins against the Lord, with all the abundance of punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
