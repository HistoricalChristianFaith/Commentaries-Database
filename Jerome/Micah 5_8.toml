[[commentary]]
quote='''
And the remnant of Jacob shall be in the midst of the nations like a lion among the beasts in the forest, and like a lion's whelp among the flocks of sheep. For it is the Lord Jesus of whom it is prophesied in Genesis: A lion's whelp is Judah; from the shoot, my son, you have gone up; lying down you slept like a lion and like a lion's whelp. And in another place: Lying down he rested like a lion, and like a lion's whelp; who shall rouse him? He gave this also to his apostles, to whom he had said: Go, baptize all nations in the name of the Father and of the Son and of the Holy Spirit, so that, just as no one can resist a lion among the beasts, or a lion's whelp among the sheep, so they, delivered from the hand of the Assyrian and from the hand of the devil, might seize beasts and cattle; for the Lord will save men and beasts. And they would seize, not to kill, but to divide, that is, to separate them from the unbelievers, and there would be none to resist them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
