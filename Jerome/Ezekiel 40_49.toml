[[commentary]]
quote='''
But what follows: The length of the vestibule twenty cubits and the breadth eleven cubits, seems to raise a question: how the dual number, which is referred to two decades, and the eleventh, which lacks one to fill up the sacred number twelve, can be said to be in the vestibule of the temple; which most people solve thus: although the priests are holy and placed in the ministries of the temple and daily offer victims to Christ, yet, because they dwell in this mortal and frail little body — and one which is subject to sicknesses and vices —, they have the number twenty and the eleventh — whence the apostle too said: Wretched man that I am! Who will deliver me from the body of this death?, not that we should believe, according to a most savage heresy, that bodies are to be abolished, but that it is for us to be clothed over, not stripped, and for this mortal to receive immortality and for the corruptible to put on incorruption —. But what follows: And by eight steps one went up to it, that is, to the inner gate, is a great difficulty for those who know the Hebrew language: in fact Symmachus, whom we have followed in this place, put 'by eight steps', the Seventy 'ten', Theodotion and the second edition of Aquila 'eleven', but the first put no number, but says absolutely: And by steps by which one went up to it, so that we should understand either, according to the custom of the earlier gates, 'eight' 'steps', as Symmachus also understood, or certainly those steps which the inner gate had, whose number Scripture did not state: because in the Hebrew there is set 'urob' — that is, 'and the breadth' — 'ast-hesre' — which, if it is read so, signifies 'eleven', but if instead of 'hesre', that is, 'ten', we read 'heser', it does not signify 'ten' but a pronoun —; which may seem ravings to those who have no experience of the Hebrew language. But now we are not writing disputations or orations, in which one is accustomed to play with the arrangement of words, but explanations and commentaries on the Hebrew volumes; but let us return to our undertaking. By eight or ten steps, which is a perfect number, or eleven, of which we have already spoken, one went up to the gate of the holy places, on whose fronts were columns, one on this side and another on that: he did not say 'two', lest he should run into the dual number, but 'one and one', which is a perfect number and is taken from the oneness of God — and these were its columns, of which it is also said in the Revelation: He who conquers, I will make him a column in the temple of my God, and he shall not go outside; and Peter and John are called columns of the Church, through whom we enter into the Holy of Holies, and by whose teaching is our entrance to Christ —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
