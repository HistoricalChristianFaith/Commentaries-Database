[[commentary]]
quote='''
They pierced my hands and my feet; (Ps. 22:16.) and in another place, He is led as a sheep to the slaughter; (Is. 53:7, 8.) and, By the iniquities of my people was He led to death.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But all this was done that the Scriptures of the prophets might be fulfilled. What are the Scriptures of the prophets? They pierced my hands and feet; and elsewhere: He was led like a sheep to the sacrifice; and in another place: By the iniquities of my people he was led to death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
