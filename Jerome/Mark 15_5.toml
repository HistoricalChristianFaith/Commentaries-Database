[[commentary]]
quote='''
Do you not hear how many testimonies they speak against you? But Jesus would answer nothing, lest by refuting the charge he should be released by the governor and the benefit of the cross be put off.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
