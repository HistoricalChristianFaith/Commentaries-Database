[[commentary]]
quote='''
And to all the kings of Arabia. This is not found in the Seventy. After Dedan, then, and Teman and Buz and the Ishmaelites, the order of the regions follows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
