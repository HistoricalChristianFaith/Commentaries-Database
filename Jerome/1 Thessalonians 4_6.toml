[[commentary]]
quote='''
We said above that the working of all impurity in covetousness pertains not to covetousness, as it sounds at first hearing, but to lust and luxury. We ought to confirm this sense by the testimony of another passage. In the First Epistle to the Thessalonians it is written: For this is the will of God, your sanctification, that you abstain from fornication: that each one of you know how to possess his own vessel in sanctification and honor, not in the lust of desire, like the Gentiles also who do not know God: that no one overstep and circumvent his brother in business, because the Lord is the avenger in all these things, as we also told you beforehand and testified. For God has not called us in impurity, but in sanctification (1 Thess. 4:3 ff.). Observe carefully that, in calling us to chastity and wishing us to be content with our wives alone, he said: That no one overstep and circumvent his brother in business, that is, that no one, deserting his own wife, seek to defile the wife of another. Where we have and circumvent his brother in business, in the Greek is read καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ. And Πλεονεξία is called covetousness, which we, carrying over the force of the word, may express thus in the present passage: that no one overstep and, being covetous, defraud his brother in business. For what sequence is there, whether in that passage which we have now called in as an example, or in this one which we are principally trying to expound to the Ephesians, that between unchastity and impurity, and also chastity and conjugal affection, covetousness should suddenly and out of order be named?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
