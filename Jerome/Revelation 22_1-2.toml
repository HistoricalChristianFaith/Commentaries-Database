[[commentary]]
quote='''
We read in the Apocalypse of John (that the book is not received in these provinces, yet we ought to know that in all the West, and in the other Phoenician provinces, and in Egypt, the book is received, and is ecclesiastical: for the ancient ecclesiastical men also, among whom are Irenaeus, and Polycarp, and Dionysius, and the other Roman interpreters, among whom is also holy Cyprian, receive the book and interpret it) — we read there, then: 'And behold,' he says, 'I saw a throne set, and one lamb, and a tree,' he says, 'beside the river, and on each part of the bank the tree itself': that is, it was on this part, and it was on that part. 'And it had,' he says, 'fruits, that tree, and in the year, in each single month, it brought forth fruit twelve times. And it had,' he says, 'leaves, and its leaves were for the healing of the nations.' I saw, he says, one throne set. For although we believe in the Father and the Son and the Holy Spirit, and there is a Trinity, nevertheless the kingdom is one. I saw, he says, one throne set. And I saw, he says, in the sight of the throne one lamb standing. It is said of the Savior's assumption of a body. 'Behold the Lamb of God, behold him who takes away the sins of the world.' And there went forth, he says, a fountain from beneath the midst of the throne. You see, then, that from the midst of the throne goes forth a fountain of graces. Nevertheless that fountain does not go forth from the throne, unless the lamb has stood over against it: for unless we believe the incorporation of Christ, we do not receive these graces. And a tree, he says, one lofty tree was set. He did not say trees, but one tree. If it is one tree, how is it on this part of the bank, and on that part of the bank? For if he had said, I saw trees, it could be that some were on one part, and others on another. But now one tree is said to be on each part. One river goes forth from the throne of God, that is the grace of the Holy Spirit; and this grace of the Holy Spirit is in the holy Scriptures, that is, in that river of the Scriptures. Nevertheless that river has two banks, both the old and the new testament; and on each part the planted tree is Christ. This tree, then, in the year, that is, in each single month, brought forth fruit twelve times. For we cannot receive fruits from that tree, except through the apostles. If anyone, then, comes to the tree through the apostles, he must needs receive fruits, reap fruit from the holy Scriptures, that is, the divine meaning dwelling in the letter. If anyone, then, comes to that tree through the apostles, as we have said, he takes its fruit; but if anyone has not been able to, he is still weaker, and is not yet a disciple, but is of the crowd, but is from outside, is of the nations. This man, because he cannot take the fruit, let him take the words, that is, the leaves for the healing of the nations; for it is written, And its leaves for the healing of the nations. If anyone is still of the nations, if anyone is not a disciple, and is still of the crowd, let this man receive its leaves, that is, let him receive the simple words as a medicine. Indeed it is written, And its leaves for the healing of the nations, that is, for medicine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_001.html'
source_title="Homily 1, on Psalm 1"
