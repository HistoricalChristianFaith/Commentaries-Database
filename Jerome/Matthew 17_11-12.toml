[[commentary]]
quote='''
He then who at the Saviour's second coming should come in the truth of His body, come now in John in power and spirit. It follows, And they knew him not, but did unto him whatsoever they would, that is, despised and beheaded him.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he answered and said to them: Elijah indeed is to come and will restore all things; but I say to you that Elijah has already come, and the rest. He who is to come at the second coming of the Savior in the truth of the body now comes through John in power and spirit; but they did not know him and did to him whatever they wished, that is, they despised and beheaded him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
