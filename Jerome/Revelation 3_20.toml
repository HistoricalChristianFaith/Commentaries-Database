[[commentary]]
quote='''
Let our soul rule, let the body serve: and at once Christ will come, and will dwell in us. Indeed, what does he himself say in the Gospel? "I will come," he says, "and will stand before the door, and will knock: and if anyone shall open to me, I will come in," he says, "and will sup with him." Every day Christ stands before the door of our breast, he desires to enter. Let us open, he enters into us, and he is our guest and our fellow-diner: that is, he both dwells in us and eats with us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_009.html'
source_title="Homily 9, on Psalm 75"
