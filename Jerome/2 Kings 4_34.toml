[[commentary]]
quote='''
Do you want to know that he has done marvelous things? The widow's son lay in the upper room: Elisha came and drew himself together, and placed mouth to mouth, and hands to hands, and feet to feet. For if he had stretched himself out, the widow's son would not have come back to life: therefore he drew himself together, that he might give life. Since he was in the form of God, therefore he took the form of a man, therefore he drew himself together, that he might make us higher.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_025.html'
source_title="Homily 25, on Psalm 97"
