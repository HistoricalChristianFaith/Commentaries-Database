[[commentary]]
quote='''
We read in Genesis, at the time when Adam transgressed, at the time when he listened more to the serpent than to God, when he hid himself from the face of God, God came after the meal into paradise, and was walking about. See what is said. God seeks Adam, not at midday, but toward evening; for now Adam had lost the sun, because he had no midday. Toward evening, that is δείλινον, evening (deilinon), and he was walking. For God does not stand still for the sinner, but walks. For he knew that he was in paradise, and he was not ignorant of what had been done; but because Adam had sinned, God does not know him. And God said: Adam, where are you?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_001.html'
source_title="Homily 1, on Psalm 1"

[[commentary]]
quote='''
But if we were holy first, and afterwards sinners, God no longer stands for us, but walks: that is, he who before had stood for us moves from his place. After we have been moved, he too is moved together with us. Finally, Adam too, as long as he was in paradise and kept the law, God stood for him. But after he transgressed, he heard the voice of God walking in paradise. Do you want to know that God was walking for him? What did he say to him? 'Adam, where are you?' He who had not fled from God while he stood, afterwards fled from him as he walked.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_014.html'
source_title="Homily 14, on Psalm 81"
