[[commentary]]
quote='''
And the middle of the mountain shall be divided toward the north, and its middle toward the south.

And you shall flee to the valley of their mountains, for the valley of the mountains shall be joined as far as the nearest; and you shall flee as you fled from the face of the earthquake in the days of Uzziah king of Judah, and the Lord my God shall come, and all the saints with him. LXX: And half of the mountain shall lean toward the north and half of it toward the south. And the valley of my mountains shall be stopped up, and the valley of the mountains shall be joined as far as Asael; and it shall be filled as it was filled from the face of the earthquake in the days of Uzziah king of Judah, and the Lord my God shall be present, and all the saints with him. For what we have said, you shall flee, the LXX and the other translators translated ἐμφραχθήσεται, that is, shall be stopped up, or shall be filled. And for what we have put: For the valley of the mountains shall be joined as far as the nearest, for nearest the LXX translated Asael, Aquila put the Hebrew word itself, asel, with a short e (ἀζὲλ), Theodotion with a long one (ἀζὴλ); Symmachus alone interpreted it as nearest, and we too have followed him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
