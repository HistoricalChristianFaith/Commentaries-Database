[[commentary]]
quote='''
A throne of glory of the height from the beginning, the place of our sanctification, the expectation of Israel, O Lord, all who leave you will be confounded! Let those who depart be written in the earth, since they have forsaken the vein — or fountain — of living waters, the Lord. The partridge being forsaken for its folly, the expectation of Israel, that is, of the people of God and of the one who believes in the Lord, is he himself who made all things, whose throne is glorious and exalted from the beginning, and who is the place of sanctification of all believers; so that the Lord is not in a place, but wherever he is, that place is sanctified. On the contrary, those who forsake the Lord will be confounded with perpetual confusion, and departing or turning aside from him they will be written in the earth, blotted out from the book of the living. For just as he who can say with the Apostle, but our citizenship is in heaven, is written in the heavenly places, so he who leaves the Lord or turns aside from him will be written in the earth with those who mind earthly things. And the cause is plain why they are written in the earth: because they have left the fountain of life, the Lord, or the fountain of living waters, the Lord, who speaks in the Gospel: if anyone thirsts, let him come to me and drink! He who believes in me, as the scripture says, rivers of living water will flow from his belly. Now this he said of the Spirit, which those who believed were to receive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
