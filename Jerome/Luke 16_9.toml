[[commentary]]
quote='''
How beloved are your tabernacles, O Lord of hosts. What are these tabernacles? Let us look at the Gospel, whether it may offer us some meaning. The Lord speaks, and says: "Make yourselves friends of the unjust mammon, that when it fails, they may receive you into the eternal tabernacles." What is it that fails? This, that is, the unjust mammon. May they receive you into the eternal tabernacles. You see, therefore, that the unjust mammon fails in this world. Yet consider that this unjust thing prepares righteousness. In the Hebrew tongue riches are called "mammon": not gold, as some suppose. Of the unjust mammon. There is also a certain saying of the philosopher that is true: "Every rich man is either unjust, or the heir of an unjust man." For this reason the Lord and Savior says that the rich enter with difficulty into the kingdom of heaven. Someone may say: How did Zacchaeus enter into the kingdom of heaven, who was rich? But he gave away his riches, and at once he exchanged his riches for the kingdom of heaven. He did not say, Whoever are rich shall not enter into the kingdom of heaven: but he said, that the rich enter with difficulty into the kingdom of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_016.html'
source_title="Homily 16, on Psalm 83"
