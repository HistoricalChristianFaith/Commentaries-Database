[[commentary]]
quote='''
Then after fourteen years I went up again to Jerusalem with Barnabas, taking Titus along also. And I went up according to revelation; and I conferred with them the Gospel which I preach among the Gentiles, but privately with those who seemed, lest perhaps I should run, or had run, in vain.

What the Latin translator had rendered above as "I acquiesced" (acquievi), in the place where it is written: "Immediately I did not acquiesce to flesh and blood", he has in the present place translated I conferred (contuli) rather than "I acquiesced" (acquievi). And to speak more truly, the Greek word ἀνεθέμην means something other than is understood among us: namely, when we confer with a friend the things we know, and as it were lay them up in his bosom and his conscience, so that by a shared counsel the things we know may be either approved or disapproved. He went up, therefore, to Jerusalem after fourteen years; and he who earlier had gone only to see Peter, and had stayed with him fifteen days, now says that he went for this reason, that he might confer the Gospel with the apostles, taking along Barnabas, who was circumcised, and Titus, from the Gentiles, who had a foreskin: so that at the mouth of two and three witnesses every word might stand (Deut. 19:15). But it is one thing to confer, another to learn. Among those who confer there is equality; between one who teaches and one who learns, the one who learns is the lesser. At the beginning of his faith he saw the apostles in passing. After (as he himself says) seventeen years, he speaks with them fully, and humbles himself, and inquires whether perhaps he might be running or might have run in vain. This was for a twofold reason: so that both the humility of Paul might be shown, who, though already the teacher of the Gentiles in the whole world, had run to the apostles who preceded him; and so that the Galatians might learn that even those who presided over the churches in Judaea had not rejected his Gospel. At the same time he also teaches this: that for the faith of Christ and the freedom of the Gospel he dared to bring Titus, an uncircumcised man, before the very men who had come to know many things about him, namely that he was breaking the Law, destroying Moses and doing away with circumcision entirely. And amid so great a multitude of Jews and of his own enemies, who, as if out of zeal for the Law, longed to drain his blood, neither he himself nor Titus was overcome by any terror into yielding to necessity. Such a yielding could have had pardon, whether on account of the place, or of the authority of the elders, or of the number of the churches which, from among the Jews, believed in Christ, or on account of the time, lest they should bear so great an ill will all at once. Some say that he went up to Jerusalem after fourteen years at the time when, as the Acts of the Apostles relate, a dissension arose among the believers at Antioch over questions of keeping or setting aside the Law, and it was decided to go to Jerusalem and await the judgment of the elders, when Paul himself too and Barnabas were sent; and that this is what is read in the Latin codices: "To whom we yielded in subjection for an hour, that the truth of the Gospel might continue with you." That is to say, for this reason Paul and Barnabas, about a clear matter as though it were doubtful, allowed themselves to be sent to Jerusalem: so that the grace of the Gospel, confirmed also by the judgment of the elders, might be proved to the believers, and that no doubt about the abandonment of circumcision might remain any longer, since it had been commanded by the letter of the apostles that the yoke of the Law was to be removed from those of the Gentiles who had believed in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
