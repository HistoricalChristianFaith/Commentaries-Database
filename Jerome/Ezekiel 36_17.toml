[[commentary]]
quote='''
The house of Israel, that is, the people of the Jews, once dwelt in its own land, that is, in the land of Judea, when it was led out of Egypt; but they defiled it in their ways and in their pursuits, or idols; and they became so polluted that they were compared to the uncleanness of a menstruous woman.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
