[[commentary]]
quote='''
After, then, the Savior destroyed in his own flesh the wisdom of the flesh, which is hostile to God (Rom. 8), and exchanged the precepts of the Law for the decrees of the Gospel, so as to make of Jew and Gentile one Christian people, preaching peace and concord to us who were far off and to the remnant of the Jews who believed from Israel through the apostles: then we drew near through him to God, and came to know that we have one Father in the spirit; and that was fulfilled which the Lord spoke in the Gospel, saying: And there shall be one shepherd and one flock (John 10:16); and again: And other sheep I have which are not of this fold, meaning us, who were to be gathered from the Gentiles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
