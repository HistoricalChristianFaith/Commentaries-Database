[[commentary]]
quote='''
The inhabitants of Samaria worshiped the cows of Beth-aven, for its people mourned over it; and its temple-keepers exulted over it in its glory, because it departed from it. For indeed it too was carried into Assyria, a gift to the avenging king; shame will seize Ephraim; Israel will be put to shame in his own will. LXX: With the calf of the house of ὢν those who dwell in Samaria will sojourn, for its people mourned over it. And as they provoked him, they will rejoice over its glory, because it was carried away from it; and binding it for the Assyrians, they bore gifts to King Jareb in the house. Ephraim will receive shame, Israel will be put to shame in his own counsel. What Beth-aven is, for which the LXX translated house of ὢν, and who King Jareb is, which is interpreted avenger, we have discussed more fully above. In Beth-aven, then, that is, Bethel, the inhabitants of Samaria worshiped the golden cows; and he called them in mockery not calves of the male sex but cows, that is, females, so that, plainly, Israel worshiped not only calf gods but cow goddesses. And to show that by the cows of Beth-aven the one calf in Bethel is to be understood, he did not add, the people mourned over them, but over it, that is, over the golden calf. But if the people mourned, why did its temple-keepers exult over it? The Hebrews relate that the golden calves were taken away by the priests by theft, and that bronze gilded ones were put back in their place. When, therefore, the people mourned in the time of need and distress that the golden calves too, among the other gifts, had been sent by the king of Israel to the Assyrian kings, and above all to King Sennacherib, the temple-keepers exulted, because their fraud could in no way be proved or detected. And this is what he says: its temple-keepers, that is, the calf's, exulted over it in the glory of the people, that is, in the calf, which they held as their glory; because it had departed from it, that is, from the people, and had been carried over to the Assyrians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
[[commentary]]
quote='''
According to the spiritual understanding we must labor at how we may fit everything to the heretics. The cows of Beth-aven, or of the house of ὢν, which is interpreted toil, were worshiped by the heretics, who boasted that they dwelt in the keeping of the commandments of God, that is, in Samaria; and on the day of judgment, when judgment will spring up like bitterness upon the furrows of the field, the people will mourn over it, that is, over the calf, and over the perverse dogma which it thought to be God. But of the temple-keepers too he did not say, will exult, but, exulted, referring it to past time, over their glory, with which they had once fabricated their glorious things, because the people had departed from God, or because the very glory of God had departed from the people, by whom it had been abandoned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
