[[commentary]]
quote='''
According to this, no rich man can be saved. But if we read Isaiah, how the camels of Midian and Ephah came to Jerusalem with gifts and presents, and they who once were crooked and bowed down by the weight of their sins, enter the gates of Jerusalem, we shall see how these camels, to which the rich are likened when they have laid aside the heavy load of sins, and the distortion of their whole bodies, may then enter by that narrow and strait way that leads to life.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
That rich man in the Gospel who, like a camel, carried the burdens of riches, and was a camel, would not listen to the Lord's counsels nor be unloaded, so that, the pack cast off, he might fly to heaven on the wings of a dove; therefore he went away sad. And of a camel of this kind the Savior speaks: It is easier for a camel to pass through the eye of a needle than for a rich man into the kingdom of heaven (Matt 19:24). He set forth the difficulty of the thing, not its impossibility. Indeed your mother Paula, of holy memory, and your brother Pammachius passed through the eye of a needle, that is, through the strait and narrow way that leads to life, into the kingdom of heaven, leaving behind with its burdens the broad way that leads to Tartarus. Nay, whatever they had they carried into the gifts of the Lord, fulfilling what is written: The ransom of a man's soul is his own riches (Prov 13:8). For the things that are impossible with men are possible with God (Matt 19).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
