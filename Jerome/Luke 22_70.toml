[[commentary]]
quote='''
Jesus says to him: You have said it. Both to Pilate and to Caiaphas the reply is alike, so that they may be condemned by their own sentence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
