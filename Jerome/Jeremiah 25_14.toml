[[commentary]]
quote='''
Because they served them, though they were many nations and great kings; and I will repay them according to their works and according to the deeds of their hands. This is not found in the Seventy. And it signifies that Jeremiah prophesied not only against Babylon but also against the other nations which were in the Babylonian army and fought against the people of the Lord. Indeed, in what follows words are spoken against Egypt and the Philistines and Moab and Ammon and Idumea and Damascus and Kedar and the kingdoms of Hazor and Elam, and at the last against Babylon and the land of Chaldea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
