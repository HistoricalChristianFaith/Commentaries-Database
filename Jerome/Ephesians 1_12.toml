[[commentary]]
quote='''
That we may be to the praise of his glory, we who hoped beforehand in Christ.

If he had said only we hoped, in Christ, and had not put first we hoped beforehand, which in Greek is called προηλπικότες, the sense would be plainer: that those who hoped in Christ were called by lot and predestined according to the purpose of him who works all things according to the counsel of his will. But as it is, the addition of the preposition draws us to that understanding which we discussed above, in expounding what is written: Who blessed us with every spiritual blessing in the heavenly places in Christ, as he chose us in him before the foundation of the world, that we should be holy and spotless before him: namely, that just as he has already blessed us with every spiritual blessing in the heavenly places, and chose us before the foundation of the world, so also we may now be said to have hoped beforehand in Christ, from that time when we were chosen and predestined and blessed in the heavenly places. But another, who does not hold this doctrine, that we existed and hoped in Christ before we lived in this body, will transfer the understanding to that other sense, so as to say: At the coming of the Lord and Savior, when in his name every knee shall bow, of things in heaven, on earth and under the earth, and every tongue shall confess that the Lord Jesus Christ is in the glory of God the Father (Phil. 2), when all things have been subjected to him, some to be subjected by will, others by necessity, then those who hoped in him before the presence of his majesty will be to the praise of his glory and will be called προηλπικότας, "those who hoped beforehand"; but those who are found believing by necessity, at that time when not even the devil and his angels will be able to deny him as he reigns, will be hoping, but not to the praise of his glory. And indeed we see this partly fulfilled even now, in that the reward of him who follows God by will is one thing, and that of him who follows by necessity another. Nevertheless, whether in pretense or in truth, only let Christ be proclaimed, provided that both the one who hopes and the one who hopes beforehand know that, according to the difference of their hope, they will receive different rewards.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
