[[commentary]]
quote='''
Then what never was done will be done: all the beasts and dragons and ostriches that dwelt in the wilderness of the nations, and were like beasts in the blood of idolatry and the savagery of their manners, will glorify me and praise me together. For dragons, which Theodotion alone, as it is written in the Hebrew, called THANNIM (תנים), the others translated Sirens: monstrous creatures which by their sweet and deadly song cast sailors headlong to be torn apart by Scylla's dogs. And this signifies that those who were formerly given over to pleasure and luxury are turned to the service of the Lord; although it is better to understand dragons, since ostriches are joined to them, so that, since he was speaking once of the beasts of the wilderness, he set down these animals, which are at home in the desert. They will praise me, he says, and will glorify me, the beasts of the field, and the dragons, and the ostriches, because I have given waters in the desert of the nations, and rivers in the dryness of the peoples, so that my people might drink, which I have chosen for myself, or my chosen race, and the people which I have acquired with my blood, that it might tell my praises and my powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
