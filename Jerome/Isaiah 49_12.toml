[[commentary]]
quote='''
And who these are for whom the way is prepared, he sets out more plainly: Behold, these shall come from afar: and behold, those from the North and the sea, and these from the land of the South. Showing the four regions of the world, East and North, West and South, he put afar for the East: for the southern region, in the Hebrew is read SINIM (סינים), which the Seventy translated of the Persians. The rest expressed it as it is read in the Hebrew, sinim, which we have translated from the South: suspecting this, that Mount Sinai is situated in the southern part, according to the Prophet Habakkuk: God will come from the South, and the holy one from Mount Paran, shady and thick (Hab 3). But if by sinim, as the Seventy translated, we understand the Persians, who are situated toward the East, we shall be able to refer what is said above, Behold, these shall come from afar, to the South.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
