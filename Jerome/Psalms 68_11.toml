[[commentary]]
quote='''
The Hebrews assert, and there is no doubt about this matter among them, that the Holy Spirit is called in their tongue by the feminine gender, that is, RUA CODSA (רוח קדשה). And what is said in Psalm 67 (68): The Lord will give the word to those who bring good tidings with great power, they understand thus: The Lord will give the word to those women who bring good tidings with great power (Ps 122 [123]:3): namely, to those souls which have obtained the Holy Spirit. And also the verse: As the eyes of a maidservant are on the hands of her mistress: they interpret the soul as the maidservant and the Holy Spirit as the mistress. But also in the Gospel written according to the Hebrews, which the Nazarenes read, the Lord says: just now my mother, the Holy Spirit, took me. No one ought to be scandalized in this matter, that spirit is said among the Hebrews in the feminine gender, while in our language it is called in the masculine gender, and in the Greek speech in the neuter. For in the Godhead there is no sex. And therefore in the three principal languages in which the title of the Lord's passion was written, it is called by three genders, so that we may know that what is diverse is of no gender.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
