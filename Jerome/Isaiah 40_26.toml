[[commentary]]
quote='''
If you do not believe words, at least believe your eyes; and from the service of the heavens and of all the elements consider the power of the Lord. Who brings out their host by number, that is, of the heavens; and calls them all by name: understand, the stars. Of which it is also sung in the Psalms: Who numbers the multitude of the stars, and calls them all by name (Ps 146 [147]:4). Or let us interpret the host of heaven as the Angels and all the armies of the heavens, of whom Daniel also speaks: Thousands of thousands ministered to him, and ten times a hundred thousand stood before him (Dan 7:10). Hence he is also called the Lord Sabaoth, which in our language is said the Lord of the army and of hosts, or of powers. And he brings out the host of the heavens by number, so that the sun and the moon and the other stars, which Abraham could not number, are numbered by him and serve in the office assigned them (Gen 15): while the sun completes the same course of heaven in one year, Lucifer and Vesper in two years, the moon in each month, and all the stars accomplish it in fixed times; and some of them are called wandering, and we perceive their unequal motions with the eyes, not the mind, and we do not so much understand as wonder. For the greatness of God's might makes all things serve in their order. Or, according to the Seventy, because of the multitude of his glory and the power of his strength, nothing can be hidden from him: but by the majesty of the Creator he knows the ways and reasons and courses of all things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
