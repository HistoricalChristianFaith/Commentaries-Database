[[commentary]]
quote='''
Woe is me, my mother, why did you bear me a man of strife — or of judgment —, a man of discord — or who am to be judged — in the whole earth? This can be understood synekdochikōs [by synecdoche] of Jeremiah, since he was judged not in the whole world but in the land of Judea. But it truly befits the Lord, the Savior, who says in the Gospel: For judgment I came into this world, that those who do not see may see, and those who see may become blind, of whom it is written: Behold, this one is set for the fall and the rising of many in Israel, and for a sign that will be contradicted. For which of the philosophers, which of the Gentiles, which of the heretics does not judge Christ, laying down laws for him concerning his birth and passion and resurrection and substance? Nor is it a wonder that Christ, according to the reality of the body he assumed, says: Woe is me, my mother, since in another place too what is said plainly suits his person: Woe is me, for I have become like one who gathers stubble at harvest, and like a cluster at the vintage, not having an ear of grain to eat the first-fruits! And lest we think that the lowliness of these groans is referred to the Word of God, who it is that laments follows at once: Woe is me, soul, for the reverent one has perished from the earth! — not that we divide the persons, as the impious do, but that one and the same Son of God speaks now according to the flesh, now according to the Word of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
I have not lent at interest, nor has anyone lent at interest to me; all curse me, for which LXX: I have not profited, nor has anyone profited me, Theodotion: I have not owed, nor has anyone owed me. The sense of all of these, in the person of Christ, is this: 'No one has offered himself who would worthily receive my money, nor has anyone lent at interest to me by making me his debtor in cherishing the saints and the poor. Or I have not profited, nor has anyone profited me; for no one has been willing to receive as much as I desired to bestow. Nor has anyone profited me; for the salvation of the creature is the gain of the Creator. Or certainly I have not owed, nor has anyone owed me; no one has given me as much as I desired to receive, nor has he made me his debtor in anything'. And what he adds: nor has anyone owed me, has this sense: 'For how could he owe me interest, who did not deign to accept a loan?' All, he says, curse me; for which of the heretics and of those who err does not curse Christ, by believing perverse things and blaspheming things more perverse?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
