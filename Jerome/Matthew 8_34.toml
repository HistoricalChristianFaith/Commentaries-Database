[[commentary]]
quote='''
Otherwise; This request may have proceeded from humility as well as pride; like Peter, they may have held themselves unworthy of the Lord's presence, Depart from me, for I am a sinful man, O Lord. (Luke 5:8.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And behold, the whole city went out to meet Jesus, and when they saw him they asked him to pass from their borders. Those who ask him to pass beyond their borders do this not from pride (as some suppose) but from humility, by which they judged themselves unworthy of the Lord's presence, just as Peter too, at the catch of fish, falling at the Savior's knees, says: Go out from me, Lord, for I am a sinful man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
