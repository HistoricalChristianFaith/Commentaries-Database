[[commentary]]
quote='''
And they built the high places — or altars — of Baal, which are in the valley of the son of Hinnom, to initiate their sons and their daughters to Moloch. For 'initiate' in the Hebrew is written 'ebir', which Aquila and Symmachus translated 'lead across', the Seventy and Theodotion 'offer'. Of the 'valley of the sons of Hinnom', which in Hebrew is called 'Gehenna', we have spoken more fully above: that it lies below the springs of Siloam and, by its pleasantness, because it is a well-watered place, provoked the people to luxury, which the worship of idols follows. And it is to be noted that 'altars' and 'high places' are called 'bamoth' in the Hebrew language; this for the sake of those who are in doubt what this word means in the book of Samuel and of Kings. Moloch is the idol of the Ammonites, whose name is rendered as 'king'; and divine Scripture signifies that in that very place the people served not only the idol Baal but also Moab and all the demons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Which I did not command them, nor did it come up into my heart, that they should do this abomination and lead Judah into sin. Properly, the tribes of Judah and Benjamin worshiped the images of the demons in the shrine of Baal and of Moloch; but it is evident that the ten tribes, which were called Samaria, Joseph and Ephraim, worshiped the golden calves in Bethel and Dan. And so great was the evil that was done by the people that God testifies that he never thought, nor did it come up into his heart, what they were going to do. But all these things are said anthrōpopathōs [in human terms].
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
