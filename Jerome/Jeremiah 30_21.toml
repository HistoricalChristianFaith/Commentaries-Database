[[commentary]]
quote='''
And there was his leader from himself — no doubt the Lord and Savior, according to the flesh from the race of Israel — and a prince from his midst was brought forth. The Father drew him close to himself, and he approached him, so that the Son might say: I in the Father and the Father in me, because no one can so draw his heart close to the Lord, nor be joined to him as the Son is to the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
