[[commentary]]
quote='''
And as he prayed and poured out the tears of the inner man, the Lord had pity over this and answered: I will not destroy the whole race of Israel; a remnant will be saved. Or certainly it is to be taken thus: he beheld two things to come together, first the locust, then the cankerworm. For both he entreated the Lord, and he is heard in one only, so that the cankerworm should not lay everything waste to utter destruction; but the locust, flying about, devours some things and leaves others untouched.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
Repent, O Lord, over this which you threatened that you would do to your people. But the repenting of God in the Scriptures we ought to understand in the same way as his sleep and his anger: not that God repents or changes his sentence, he who speaks through the prophet: I am God, and I do not change, and to whom we say: But you are the selfsame, and your years will not fail; but that, when we are converted to better things, he too repents of his sentence, so that he neither pays the just man the rewards he promised, if he turns aside to iniquity, nor the sinner the punishments he threatened, if he is converted to salvation. It is said to him who is about to repent: Give no sleep to your eyes, nor slumber to your eyelids, that you may be freed like a little doe from the nets, and like a bird from the snares. If such a one has at first despised the commandments of the Lord, and afterwards, set in straits, begins to wake up, he rouses the Lord, who for him is sleeping, and says: Arise, why do you sleep, O Lord? On the other hand, those who have stored up wrath for themselves in the day of wrath will feel God angry. But if they choose repentance, the wrath will be turned into mercy, and according to our disturbances and our virtues the Lord will change in either direction, toward punishment or toward clemency.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
