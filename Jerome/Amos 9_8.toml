[[commentary]]
quote='''
For the eyes of the Lord are upon all the sinning kingdoms, which the devil showed to the Lord, and of which the Apostle says: Let not sin reign in your mortal body, so that you obey its desires. Nevertheless, although he visits sinners with the rod, and crushes and strikes those who have remained in sin, he does not allow to perish for ever those souls which are called the house of Jacob, and supplant sin, and overcome in the contest, and seize the heel of the bloodstained brother.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
