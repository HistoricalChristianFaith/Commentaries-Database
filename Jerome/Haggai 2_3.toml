[[commentary]]
quote='''
Let us therefore hear what he said. There was once in Israel a house of God, which is now so deserted that it is not even believed to have existed, since she who had been beloved became not beloved, and they who were not the people of God began to be the people of God. And that house, once glorious, is now in the sight of Zerubbabel and Joshua and the remnant of the people as if it were not. And we ought to take this not only of the buildings of the temple, which we see have collapsed, but of all the things which the Jews once had as glorious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Haggai.html'
source_title="Commentary on Haggai"
