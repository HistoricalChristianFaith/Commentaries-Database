[[commentary]]
quote='''
Then Jeremiah came from Topheth, where the Lord had sent him to prophesy, and he stood in the court of the house of the Lord and said to all the people: Thus says the Lord of hosts, the God of Israel: Behold, I will bring upon this city and upon all its towns all the evils which I have spoken against it, because they have hardened their neck so as not to hear my words. After Jeremiah, in Topheth, in the presence of the elders of the people whom he had brought with him, broke the flask, or jar, and prophesied with the words of the Lord the breaking of the people and of the city of Jerusalem, he returns and stands in the court of the house of the Lord and speaks to the whole multitude, which had refused to go to the place Topheth, that the Lord is about to bring upon the city of Jerusalem and upon all its towns the evils which he has spoken against it. And lest we think the sentence cruel, he gives the reasons why he is about to bring evils: 'because,' he says, 'they have hardened their neck so as not to hear my words, not willing to repent even after many impieties.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
