[[commentary]]
quote='''
And he who has been fed and nourished in such ways and paths shall neither hunger nor thirst, nor feel the heat of the sun: and in him what is written will be fulfilled: The sun shall not burn you by day, nor the moon by night (Ps 120 [121]:6). So that he feels neither the adversities nor the prosperities of this world. Since the Lord is merciful and compassionate, he himself will comfort them and rule them, and lead them to the springs of waters. Or, he will give them drink at the springs, of which it is written: Bless the Lord from the springs of Israel (Ps 67 [68]:27). And in another place: Draw waters from the springs of the Savior (Isa 12:3). These springs are in the Old Testament and the New.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
