[[commentary]]
quote='''
And now says the Lord, who formed me from the womb to be his servant, that I might bring Jacob back to him, and Israel will not be gathered: and I am glorified in the eyes of the Lord, and my God has become my strength. And he said: It is a small thing that you should be my servant to raise up the tribes of Jacob, and to turn back the dregs of Israel. I have given you as a light of the nations; that you may be my salvation to the end of the earth. LXX: And now thus says the Lord, who formed me from the womb to be his servant, that I might gather Jacob to him, and Israel: I shall be gathered and glorified before the Lord, and my God shall be my strength. And he said to me: It is a great thing for you to be called my child, and to raise up the tribes of Jacob, and to turn back the dispersion of Israel. Behold, I have set you for a covenant of the race, for a light of the nations, that you may be salvation to the end of the earth. When I said, I have labored in vain, without cause and vainly I have spent my strength, because the Jews would not believe, and my judgment is with the Lord, and my work, which with his help I have fulfilled, is with the Lord: the Lord, who formed me from the womb to be his servant, answered me. By this he shows that he is called servant who was formed from the womb. He also says in the psalm: From the belly of my mother you are my God (Ps 21 [22]:11). What, then, does the Lord say to him? That he should bring back to him Jacob, who had wandered off, who, having forsaken his Creator, was serving idols. Hence he himself says to the disciples: Do not go into the way of the Gentiles, and do not enter the cities of the Samaritans; but go rather to the lost sheep of the house of Israel (Matt 10:5); and in another place: I came only to the lost sheep of the house of Israel (Matt 15:24). This, then, was the will of the Father: that the wicked vinedressers should receive the Son who was sent, and render the fruits of the vineyard; but they killed him, saying: Come, let us kill him, and the inheritance will be ours (Matt 21:38); and this is what he now says: And Israel will not be gathered, that is, will not return to the Lord. And I greatly wonder how the common edition has overturned, by a different interpretation, a very strong testimony against the faithlessness of the Jews, saying: I shall be gathered and glorified before the Lord: since Theodotion and Symmachus agree with our interpretation. About Aquila, however, I do not wonder, that a man most learned in the Hebrew language, and rendering word for word, has in this place either feigned ignorance or been deceived by the perverse exposition of the Pharisees, since he chose to translate, and Israel will be gathered to him, that is, to God. For the Hebrew word LO in this place is not written with LAMED and VAV (לו), which, if it were, would signify to him or to that one, but with LAMED and ALEPH (לא), which properly sounds not. Since, then, Jacob was not brought back to God, nor Israel gathered, therefore, since they did not believe, the Son says: I am glorified in the eyes of the Lord. For in me the whole world has believed: and my God has become my strength, who also comforted me in my sadness over the casting off of my people; and said to me: It is a small thing if you serve me to raise up the tribes of Jacob, which fell through their own fault; and to turn back the dregs, or remnant, of Israel. For this is what the Hebrew word NESURE (נצורי) sounds. For in their place I have given you as a light of all the nations, to illumine the whole world, and to make my salvation, through which all are saved, reach to the ends of the earth. And what is read in the Seventy, I shall be gathered, and glorified before the Lord, can be understood thus: that the Lord has been gathered together with the believers. And as for what follows: He said to me: It is a great thing for you to be called my child, let us refer 'great' to the man and to the child, who is small in comparison with God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
