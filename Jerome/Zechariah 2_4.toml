[[commentary]]
quote='''
And Jerusalem, he says, shall be inhabited without a wall because of the multitude of men and cattle, or, with an abundance of all fruits. Some interpret men and cattle as two peoples, of the Jews and of the Gentiles: that those who were versed in the law and came to the faith of Christ are called men, while we, who after idolatry were as it were in the desert of the law and the solitude of the prophets, and have received his passion, ought to be called cattle. But others want all rational men, learned in the knowledge of the Scriptures, to be understood as men, and as cattle all the simple among the believers, and that of these it is said: Men and cattle you will save, O Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
