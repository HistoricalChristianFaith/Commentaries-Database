[[commentary]]
quote='''
And it is to be noted, that as in the bad ground there were three degrees of difference, to wit, that by the way side, the stony and the thorny ground; so in the good soil there is a three-fold difference, the hundred-fold, the sixty-fold, and the thirty-fold. And in this as in that, not the substance but the will is changed, and the hearts as well of the unbelieving as the believing receive seed; as in the first case He said, Then cometh the wicked one, and carrieth off that which is sown in the heart; and in the second and third case of the bad soil He said, This is he that heareth the word. So also in the exposition of the good soil, This is he that heareth the word. Therefore we ought first to hear, then to understand, and after understanding to bring forth the fruits of teaching, either an hundred-fold, or sixty, or thirty.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(vid. Cyp. Tr. iv. 12.) Or, The hundred-fold fruit is to be ascribed to virgins, the sixty-fold to widows and continent persons, the thirty-fold to chaste wedlock.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
(Ep. 48. 2.) For the joining together of the hands, as it were in the soft embrace of a kiss, represents husband and wife. The sixty-fold refers to widows, who as being set in narrow circumstances and affliction are denoted by the depression of the finger; for by how much greater is the difficulty of abstaining from the allurements of pleasure once known, so much greater is the reward. The hundredth number passes from the left to the right, and by its turning round with the same fingers, not on the same hand, it expresses the crown of virginitya.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he who was sown in good ground, this is he who hears the word and understands and bears fruit. Just as in the bad ground there were three different kinds, the wayside and the rocky and the thorny places, so in the good ground there is a threefold diversity: of the hundredfold, the sixtyfold and the thirtyfold fruit. And in the one as in the other it is not the substance that is changed but the will, and it is the hearts of unbelievers as well as of believers that receive the seed. The evil one comes, he says, and snatches what has been sown in his heart, and in the second and third place: this is he, he says, who hears the word. In the exposition of the good ground too, this is he who hears the word. First, therefore, we must hear, then understand, and after understanding render the fruits of the teachings and produce either the hundredfold fruit or the sixtyfold and thirtyfold; of these we spoke more fully in the book Against Jovinian, and now we touch on them briefly, assigning the hundredfold fruit to virgins, the sixtyfold to widows and the continent, the thirtyfold to holy matrimony. Honorable indeed is marriage, and the bed undefiled. Some of our writers refer the hundredfold fruit to the martyrs; but if that is so, the holy partnerships of marriage are shut out from the good fruit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
