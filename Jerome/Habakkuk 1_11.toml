[[commentary]]
quote='''
And when he has heaped up a mound, and nothing has stood in the way of his strength, then his spirit will be changed into pride, and, believing himself to be God, he will set up a golden image in Babylon, which he will compel all the nations to worship. When he has done this, he will pass into the form of a beast, and afterwards will fall; for which Aquila and Symmachus translated καὶ πλημμελήσει, that is, and he will offend; holy Scripture having this custom, that it puts uasam, that is, he will offend, for what means: he will cease to be what he had been. We also have something of this kind in the idiom of our own language, when we say: The army has been beaten, for what means: it has been killed and cut down; and: The vineyard and the field have sinned, for what means: the vintage and the crops have had no yield. But what is said at the end of the chapter, This is his strength, that of his god, is to be read εἰρωνικῶς (ironically), so that the sense is: This is his strength, which Bel his god gave him. To his worship he compelled all nations, even by written decree and the threat of death, with a most savage command. These things according to the Hebrew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
And when this has been fulfilled, then the spirit will be turned, and will by no means punish as it had punished before, but, passing through the sinners, it will pray for them and reconcile them to their former Lord; in all of which is shown the strength of our God, which has accomplished such great things. You see how rugged the places are, and opposed to the truth of the history; and how the things we interpreted according to the letter concerning the Chaldeans now seem, according to tropology, to sound the clemency and liberty of those who have escaped from the hands of the Chaldeans. The history is strict and has no freedom to wander. Tropology is free, and bounded only by these laws: that it follow the piety of understanding and the context of the discourse, and not be violent in joining things that are greatly contrary to one another.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
