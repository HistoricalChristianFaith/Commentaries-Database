[[commentary]]
quote='''
Atticus: I grant you that they are just men, but I cannot agree with you at all that they are without sin. For I say that humanity can be without fault, which in Greek is called kakia ["wickedness"], but I deny that it is anamartētos ["faultless"], that is to say sine peccato ["without sin"]. For this is a virtue that befits God alone; and every creature is subject to sin and stands in need of the mercy of God, as Scripture says: "The earth is full of the mercy of the Lord." And lest I seem to be discussing certain little faults, so to speak, of the saints, into which they slipped through error, I shall produce a few testimonies that refer not to individuals but rather to all people in general. In the thirty-first psalm, it is written, "I said I will confess against myself my injustice to the Lord, and you have forgiven the wickedness of my heart." And it continues immediately, "For this" (that is to say, for this impiety or iniquity, for both words can be understood in this passage) "shall everyone that is holy pray to you in a seasonable time." If one is holy, what is his reason for praying for forgiveness of his iniquity? If one has iniquity, in what sense is he called holy? In the sense, to be sure, that it is also written in another place: "A just person shall fall seven times and shall rise again." And, "The just is accuser of himself in the beginning of his speech." And in another place: "The wicked are alienated from the womb, they have gone astray from the womb, they have spoken false things." They became sinful at the very moment they were born in the likeness of Adam's sin, who was a figure of the one who was to come, or at the moment when Christ was born of a virgin. It has been written about him: "Every one who opens the womb shall be called holy to the Lord."
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="Against the Pelagians 2.4"

[[commentary]]
quote='''
On the other hand, David sings of sinners: "For behold, I was conceived in iniquities, and in sins my mother conceived me" (Ps. 50:7). And in another place: "Sinners are estranged from the womb" (Ps. 57:4). And in both directions, before the little ones were born: "God loved Jacob, but Esau he held in hatred" (Mal. 1:1, 2). Here the heretics find an opening, who claim that there are diverse natures, namely the spiritual and the animal and the χοϊκὴν (earthy), and that one is saved, another perishes, and another stands between the two; for, they say, neither would the righteous man ever be chosen before he had done anything good, nor the sinner be hated before his sin, unless the nature of those who perish and of those who are to be saved were different. To this it can be answered simply that this comes about from the foreknowledge of God: that the one whom he knows will be righteous he loves before he comes forth from the womb, and the one whom he knows will be a sinner he hates before he sins; not that there is injustice in God, either in his love or in his hatred, but that he ought not to regard them otherwise, because he knows that they will be either sinners or righteous; we, as men, judge only of present things, whereas he, for whom future things are already done, passes sentence on the end of things, not on their beginnings. And these things indeed have been said rather simply, and without a loftier discussion they can in some measure satisfy the reader. But those who strive to assert that God is unjust, after the words we set down a little earlier, "sinners are estranged from the womb", also bring in the rest that follows: "They have gone astray from the womb, they have spoken falsehoods". And they say: how did sinners go astray straight from the womb and speak falsehoods, when they could have neither speech nor understanding? Or what is this righteousness of the foreknowledge of God, to love and guard one before he is born, and to detest another? And they refer the causes of this to a former life, holding that each one, according to his merit, is assigned from his very first birth to good or to evil angels. And that whole passage about Jacob and Esau, which we have just mentioned, as it is written to the Romans (Rom. 9), they toss about in such a way that they cannot be answered without sweat, and even the hellebore of Chrysippus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
