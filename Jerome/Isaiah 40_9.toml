[[commentary]]
quote='''
At the same time this too must be considered, that today also, so long as we explain the Scriptures according to the letter to little ones and sucklings, and to those in whose hearts Christ never grows up nor advances in age and wisdom and grace with God and men, we are praised, looked up to, held in admiration. But when we have begun a little to call them on to pass over to greater things, from being our heralds they become enemies, and they would rather follow the Jews than the apostles, who, withdrawing from the teaching and traditions of the Pharisees, entered into Christ himself, the propitiatory, and the perfection of the Law; nor do they deign to accept the divine word, which bids the teachers of the Church to climb to loftier doctrines, to raise the voice with all their strength, and not to fear the clamor of the little ones barking around them, saying: "Go up on a lofty mountain, you who bring good tidings to Sion. Lift up your voice in strength, you who bring good tidings to Jerusalem. Lift it up, do not fear" (Isa. 40:9).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
Go up on a high mountain, O woman who brings good tidings to Zion: lift up your voice with strength, O woman who brings good tidings to Jerusalem: lift it up, do not fear; say to the cities of Judah: Behold your God: behold, the Lord God will come in strength, and his arm shall rule. Behold, his reward is with him, and his work before him. Like a shepherd he will feed his flock: in his arm he will gather the lambs, and in his bosom he will lift them up: he himself will carry the ewes with young. LXX: Go up on a high mountain, you who bring good tidings to Zion: lift up your voice with strength, you who bring good tidings to Jerusalem: lift it up, do not fear: say to the cities of Judah: Behold your God, behold the Lord God will come with power, and his arm with dominion: behold, his reward is with him, and his work in his sight. Like a shepherd he will feed his people, and in his arm he will gather the lambs: and he will comfort those that are with young. The choir of the Apostles is commanded to climb the heights for the preaching to all flesh which is to see the salvation of God, and, being about to speak of great things, to abide on the heights. Moreover, the Hebrew and the other translators put it in the feminine gender, so as to say: O woman who brings good tidings to Zion, and O woman who brings good tidings to Jerusalem. In the Greek this word is ambiguous, so that we can take it either of her who announces or of her to whom it is announced. Whether, then, Zion and Jerusalem announce the word of God and the salvation of the Lord, For out of Zion has gone forth the law, and the word of the Lord from Jerusalem (Isa 2:3), or it is announced to them through the Apostles, they must climb the heights and pass over to the mountains. And in a wonderful way, although Zion itself is a mountain, as Scripture says, Mount Zion, in which you have dwelt (Ps 73 [74]:2), she is commanded to ascend another, higher mountain, by which the prince of Tyre was wounded. And because there were to be many things opposed to the teaching of the Apostles, and they were to be led and set before governors and tribunals, there is joined: lift it up, do not fear: say to the cities of Judah, that is, to the Synagogues and peoples of the Jews, of whom the Lord said: I have not come except to the lost sheep of the house of Israel (Matt 15:24). And the apostle Paul: To you, he says, the word of God had to be announced first (Acts 13:46). And what is it that they are commanded to say? Behold your God, whom you were always expecting:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
The Hebrews assert, and there is no doubt about this matter among them, that the Holy Spirit is called in their tongue by the feminine gender, that is, RUA CODSA (רוח קדשה). And what is said in Psalm 67 (68): The Lord will give the word to those who bring good tidings with great power, they understand thus: The Lord will give the word to those women who bring good tidings with great power (Ps 122 [123]:3): namely, to those souls which have obtained the Holy Spirit. And also the verse: As the eyes of a maidservant are on the hands of her mistress: they interpret the soul as the maidservant and the Holy Spirit as the mistress. But also in the Gospel written according to the Hebrews, which the Nazarenes read, the Lord says: just now my mother, the Holy Spirit, took me. No one ought to be scandalized in this matter, that spirit is said among the Hebrews in the feminine gender, while in our language it is called in the masculine gender, and in the Greek speech in the neuter. For in the Godhead there is no sex. And therefore in the three principal languages in which the title of the Lord's passion was written, it is called by three genders, so that we may know that what is diverse is of no gender.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
