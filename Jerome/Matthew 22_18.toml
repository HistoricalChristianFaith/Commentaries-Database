[[commentary]]
quote='''
This is the first excellence of the answerer, that He discerns the thoughts of His examiners, and calls them not disciples but tempters. A hypocrite is he who is one thing, and feigns himself another.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Jesus, knowing their wickedness, said: Why do you tempt me, hypocrites? The first virtue of one who answers is to know the mind of those who question him, and to call them not disciples but tempters. A hypocrite, then, is the name for one who is one thing and pretends another, that is, does one thing in deed and puts forward another with his voice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
