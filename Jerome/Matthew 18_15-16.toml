[[commentary]]
quote='''
But if your brother sins against you, go and rebuke him between yourself and him, and the rest. If our brother sins against us and has injured us in any matter, we have the power to forgive, nay rather the necessity, since we are commanded to forgive our debtors their debts; but if anyone sins against God, it is not within our discretion. For the divine Scripture says: If a man sins against a man, the priest will pray for him; but if he sins against God, who will pray for him? We, on the contrary, are kindly when the injury is done to God, and over insults to ourselves we give rein to hatreds. A brother is to be rebuked privately, lest, if he has once lost his shame and modesty, he remain in sin; and if indeed he listens, we gain his soul, and through the salvation of another, salvation is gained for us too; but if he will not listen, let a brother be brought in; and if he does not listen to him either, let a third be brought in as well, either with the aim of correcting him or of summoning him before witnesses.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
