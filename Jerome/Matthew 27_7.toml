[[commentary]]
quote='''
Also we, who were strangers to the Law and the Prophets, have profited by the perverse temper of the Jews to obtain salvation for ourselves.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And having taken counsel, they bought with them the potter's field, as a burial place for strangers. They indeed did it with another intention, to leave from the purchase of the field an everlasting monument of their impiety. But we, who were strangers to the Law and the Prophets, have taken up their perverse endeavors for our salvation, and we rest in the price of his blood. And it is called the potter's field because our potter is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
