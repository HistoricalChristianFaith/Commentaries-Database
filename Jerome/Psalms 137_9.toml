[[commentary]]
quote='''
Blessed is he who shall take hold of and dash your little ones against the rock. The "little ones" are said to be thoughts. For example: I have seen a woman, I have desired her: at once, if I do not cut off that desire, and, as it were, take it by the foot and dash it against the rock while the desire is small, it cannot afterwards be cut off when it has grown. Blessed, then, is he who cuts it off at once, and dashes it against the rock. And the Rock is Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_048.html'
source_title="Homily 48, on Psalm 136"

[[commentary]]
quote='''
And would that we too might be stirred up by the Lord, and that this power might be given to us, that we should desire neither the silver nor the gold of worldly eloquence and wisdom, but should kill the sons of the heretics, and of all who have been deceived, with spiritual arrows, that is, with the testimonies of the Scriptures: and that those who are nourished with the milk of error may be slaughtered without any mercy, so that they may perish by a merciful cruelty, and that we may have pity on no infancy, and may be worthy of that beatitude: Blessed is he who will take hold of his little ones and dash them against the rock!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
