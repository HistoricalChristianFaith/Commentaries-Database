[[commentary]]
quote='''
"How great the things we have heard and known." These little verses, from "Attend, my people, to my law" up to this verse, "I will utter propositions from the beginning," are spoken from the person of Christ; the Savior himself speaks. Now the remaining verses, up to the end of the psalm, we must take as from the person of the apostles. When, then, the Lord says, "Incline your ear to the words of my mouth" — O apostles, what you have heard in secret, he says, proclaim upon the rooftops — what do the apostles say? "How great the things we have heard and known, and our fathers have told us." These things, O Lord, which you speak to us, our fathers the patriarchs and the prophets have also spoken to us. "And our fathers have told us."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
