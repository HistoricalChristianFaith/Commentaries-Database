[[commentary]]
quote='''
And in the prophets of Jerusalem I saw a likeness — or horrible things —, adultery and the path of falsehood; and they strengthened the hands of the most wicked, so that no one turned back from his wickedness — or from his most wicked way —; they have all become to me as Sodom, and its inhabitants as Gomorrah. 'Not only', he says, 'have these things been found in the conventicles of the heretics, but in the prophets of Jerusalem too, that is, in the teachers of the Church, I have seen like things, or horrible things: men adulterating the word of God and walking along the way of falsehood, so that they acquiesced in the deceits of the heretics and strengthened the hands of the most wicked and joined their evils to their own crimes, and led to destruction those whom they ought to have corrected. Let those who have done this not think themselves unpunished! For both they themselves and those whom they favor will be as Sodom, and all who dwell with them and do not withdraw from such men, as Gomorrah'. Let the most wicked doctrine exult, then, as much as it will, and let the prophets of Jerusalem glory that they have prevailed through falsehood and strengthened the hands of the most wicked: their end will be as Sodom and Gomorrah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
