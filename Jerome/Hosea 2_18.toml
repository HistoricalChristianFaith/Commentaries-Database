[[commentary]]
quote='''
And I will strike a covenant for them in that day with the beast of the field, and with the bird of the sky, and with the creeping thing of the earth; and the bow, and the sword, and war I will crush out of the land; and I will make them sleep confidently. LXX: And I will arrange a covenant for them in that day with the beasts of the field, and with the flying things of the sky, and with the creeping things of the earth; and the bow, and the sword, and war I will crush out of the land; and I will make them dwell in hope. When all the names of the hostile religion have been taken away from the people that confesses the Lord, and she calls me, he says, My husband, and by no means Baali, that is, my idol, then I will strike a covenant and concord for them with the beasts of the field, and the birds of the sky, and the creeping things of the earth. Of this time Isaiah also speaks: The wolf will dwell with the lamb; and the leopard will lie down with the kid. The calf, and the lion, and the sheep will abide together, and a little child will drive them. The calf and the bear will feed, and their young will rest together; and the lion will eat straw like the ox, by no means desiring flesh and blood, but feeding on clean and simple foods. When it was revealed to Peter, that he might receive Cornelius from the nations, and he was commanded to eat all the beasts and to know that nothing is unclean which is received with thanksgiving, concerning which he afterwards hears: What God has cleansed, do not call common. Therefore at the coming of the Lord the Savior, after the triumphs of his resurrection and his ascent to the Father, the two walls were joined by the cornerstone, by him who made both one. And he called her who was called Without Mercy, Obtained Mercy; and him who was called Not My People, his own people; and when all things have been made peaceful, the bow and the sword will be crushed, and war. For the instruments of fighters will not be necessary when those who would fight are lacking. Israel will be joined to the nations, and that saying of Deuteronomy will be fulfilled: Rejoice, you nations, with his people. Known for in Judea is God, in Israel his name is great. And: His place has been made in peace, and his dwelling in Zion, that is, in the Church, in which he broke the powers, the bow, the shield, the sword and war; and when these have been broken and crushed, the believers will sleep confidently and will rest under one shepherd. Or: they will hope in those things which eye has not seen, and ear has not heard, and which have not entered into the heart of man, which God has prepared for those who love him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
