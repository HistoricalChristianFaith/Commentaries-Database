[[commentary]]
quote='''
They ruminated on wheat and wine, they withdrew from me.

And I taught them and strengthened their arms; and they devised malice against me; they returned so as to be without a yoke; they have become like a deceitful bow; their princes will fall by the sword, from the fury of their tongue; this is their derision in the land of Egypt. LXX: On wheat and wine they were cutting themselves; they were taught in me, and I strengthened their arms, and they devised evils against me; they turned to nothing, they became like a bent bow; their princes will fall by the sword because of the unskilfulness of their tongue; such is their derision in the land of Egypt. Because of the abundance of all things, he says, they fell. Ezekiel too records that this happened in Sodom and Gomorrah, so that they ruminated on nothing but food and luxury; for which the Seventy translated: On grain and wine they were cutting themselves, after the example of the prophets of Baal, who, in the presence of Elijah, prayed for rain by gashing their limbs. And at the same time, to show that they were like beasts of burden, he did not say: they were eating, but: they were ruminating; and therefore they withdrew from the Lord, who says: I taught them, I gave them strength, and they raised their necks against me; not that they could do anything and harm their Creator, but, what alone they were able to do, they devised evils against me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
On wheat and wine, and the false mysteries of the body and blood of Christ, who says in the Gospel: Unless a grain of wheat falls into the earth and dies, it remains alone. And in another place: I am the true vine. And: Unless you drink my blood. Over this wheat and wine, then, the heretics are cut asunder, and build diverse tabernacles for themselves; or they are cut off from the body of the Church, and pretend to meditate on the law of God and to ruminate on it. But in doing this they withdraw from the Lord, who taught them in the Church and gave them strength with which to fight against the adversaries.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
