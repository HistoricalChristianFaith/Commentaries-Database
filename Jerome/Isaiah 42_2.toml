[[commentary]]
quote='''
He will not cry out: for he will be gentle and meek; and he will not accept a person in judgment, or he will not lift up (it is understood) his voice on high. Or, according to Symmachus, he will not be deceived, understanding all the snares of the devil; or, according to the Seventy, he will not let go, namely the people of the Jews, calling them to repentance. Nor will his voice be heard outside: for he did not preach the Gospel outside Galilee and Judea among the other nations. And if we read that he was in the borders of Tyre and Sidon (Matt 15), or in the region of Caesarea Philippi, which is now called Paneas, still it must be known that it is not written that he entered those cities themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Nor will anyone hear his voice in the streets. Wide indeed and spacious is the way that leads to perdition, and many enter by it. Who are the many? Those who do not hear the voice of the Savior, because they are not on the narrow way but on the spacious one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
