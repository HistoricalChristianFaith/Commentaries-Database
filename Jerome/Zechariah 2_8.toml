[[commentary]]
quote='''
But what follows: Thus says the Lord of hosts, after glory he has sent me, and the rest, introduces the voice of the Savior speaking, who, being almighty God, says that he was sent by the almighty Father, not according to that by which he is almighty, but according to that by which he was sent after glory. Who, though he was in the form of God, did not think it robbery to be equal with God, but emptied himself, taking the form of a servant, and became obedient to the Father unto death, the death of the cross. Nor is it a wonder that Christ is called almighty, in whose person we read in the Apocalypse of John: Thus says the faithful witness, the beginning of the creation of God, who is, and who was, and who is to come, the Lord God Almighty. That too which we read in Psalm 23 (24): Lift up your gates, O princes, and be lifted up, eternal gates, and the king of glory shall enter, and which again is said by other angels who did not know the mystery of the flesh assumed: Who is this king of glory? The Lord of powers, he is the king of glory, is referred to Christ. For where we read the Lord of powers, in the Hebrew Sabaoth is written, which is rendered almighty by the LXX translators. From this we understand that wherever the Lord of powers is said of Christ, he must be understood as almighty. Nor is it a wonder if Christ is called almighty: To whom has been given all power in heaven and on earth, and who says: All things that are the Father's are mine. But if all things, that is, God from God, Lord from Lord, light from light, then also almighty from almighty; for it cannot be that those whose nature is one should have a different glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
But as for what he says: He who touches you touches the pupil of his eye, take the touching as harassment and injury, according to what we read: Do not touch my anointed ones, and do no evil to my prophets. For whoever touches the saints of the Lord is as one who desires to harm the pupil of his eye, and strives to deprive him of the clear light, of which he speaks in the Gospel: You are the light of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
