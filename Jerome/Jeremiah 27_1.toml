[[commentary]]
quote='''
In the beginning of the reign of Jehoiakim, son of Josiah, king of Judah, this word came to Jeremiah from the Lord, saying. This is not found in the edition of the Seventy, and many think it is the beginning of the following chapter, which is by no means so; rather, it is to be joined to the preceding one, so that whatever is reported as said and done we should believe to have been done in the beginning of the reign of Jehoiakim; whence too he had the power of sending into Egypt, as to a friendly king. But the Seventy seem to me to have passed over this title in silence for this reason, lest they should seem to say it a second time; for they had already set down at the beginning: in the beginning of King Jehoiakim, son of Josiah, king of Judah, this word came from the Lord, saying.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
