[[commentary]]
quote='''
Behold, I will bring upon you a nation from afar, O house of Israel, says the Lord, a strong nation, an ancient nation, a nation whose language you will not know, nor will you understand what it says. Its quiver is like an open sepulchre; all are mighty. And it will eat your crops and your bread, it will devour your sons and your daughters, it will eat your flock and your herds, it will eat your vine and your fig tree, and it will crush with the sword your fortified cities, in which you have confidence. Nevertheless in those days, he says, I will not make you into utter destruction. 'Not after a long time, nor, as you falsely believe, will the prophets speak to you into the wind; but even now I will bring upon you a nation of the Babylonians, which will come from afar, a strong nation' — for which in the Hebrew is written 'etham' —, 'an ancient nation' — over which Nimrod the giant once held dominion —, 'whose language you will not know or' — as is written in the Hebrew — 'nor will you understand what it says; for it is a solace in misfortunes if you have such enemies as you can entreat and as understand your prayers'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
