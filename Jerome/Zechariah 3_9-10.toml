[[commentary]]
quote='''
As for what is written according to the Seventy: Behold, I will dig a pit, we can understand the ditch or pit in place of the carving of the stone: for everything that is carved is also dug. Yet if someone, more contentiously, will not refer this to the stone, but would have it hold, as it were, its own beginning and its own meaning, let us say that the Lord Almighty, on the day of his Son's passion, or else — as the Jews think, at the final end of the world, when he comes to judge — digs out and brings into the open the works of each person, and handles the whole earth on the day of judgment; for this is the one day, and on that day each of the saints calls his companions and friends, who are themselves also saints, to rest, and rejoices in the virtue of his works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
