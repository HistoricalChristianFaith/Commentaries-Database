[[commentary]]
quote='''
They hang up the bronze serpent in the desert. Let the anchorites hear, let those who dwell in the wilderness hear. But we, what have we done? We too have hung up the true and ancient serpent in the wilderness. Although the apostle does not interpret this of the Lord in the way we suppose. But what does he say? On the cross of the Lord the devil was hung up and fastened. The Lord indeed was crucified, but the devil died. This one fulfilled the mystery, and appeared as victor: but the other did not appear, but was spiritually slain, just as the apostle also signifies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_032.html'
source_title="Homily 32, on Psalm 105"
