[[commentary]]
quote='''
Since, then, so great is the power and majesty of the Creator, to what likeness do you compare God? And do you not rather understand the maker from the greatness of his creatures?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
