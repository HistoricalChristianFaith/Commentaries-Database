[[commentary]]
quote='''
Hence also in the same Ezekiel it is written: I will raise up over them one shepherd, and he shall feed them, my servant David; and he shall be their shepherd, and I the Lord will be their God, and David a prince in their midst. I the Lord have spoken, and I will make with David a covenant of peace (Ezek 34:23-25). In this it is to be considered that, long after the time of David, the gluttonous shepherds being rejected, he says he will raise up our Lord, who is of the stock of David, to gather the lambs and cherish them in his bosom, and himself to carry on his shoulder the young of the sheep, or the ewes with young; as we read in the Gospel that he carried back to the fold on his shoulders the sheep that had strayed and stayed behind from its accustomed flock (Luke 15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
