[[commentary]]
quote='''
(Verses 23-24) And I will raise up over them (here and elsewhere) (or over them) one shepherd who will feed them (or him), my servant David: he will feed them (or him): and he will be their shepherd. But I, the Lord, will be their God, and my servant David will be prince among them. I, the Lord, have spoken. Then He will raise up one shepherd, who says in the Gospel: I am the good shepherd (John 10:11); His servant David according to what form of a servant He deigned to assume (Philippians 2); who is interpreted as 'mighty by hand'. He Himself will pasture them, and the Lord will be their God, either the Son and the Father, or certainly the shepherd according to assumed flesh: But the Lord, and God, according to the Word which was in the beginning with God. That David, as the rational animal advances in the flock, will by no means be called a shepherd, but rather a prince among them, about whom it is written: But there is one among you whom you do not know (John 1:26).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Hence also in the same Ezekiel it is written: I will raise up over them one shepherd, and he shall feed them, my servant David; and he shall be their shepherd, and I the Lord will be their God, and David a prince in their midst. I the Lord have spoken, and I will make with David a covenant of peace (Ezek 34:23-25). In this it is to be considered that, long after the time of David, the gluttonous shepherds being rejected, he says he will raise up our Lord, who is of the stock of David, to gather the lambs and cherish them in his bosom, and himself to carry on his shoulder the young of the sheep, or the ewes with young; as we read in the Gospel that he carried back to the fold on his shoulders the sheep that had strayed and stayed behind from its accustomed flock (Luke 15).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
