[[commentary]]
quote='''
According to anagōgēn [the higher, spiritual sense], we dwell in the 'confusion' of this world for as long as it takes until we deserve to receive the 'rest' of the number seven, and, repentance having been received, God fulfills what he promised, and we are brought back to our place, the Church; for this is why the Lord seemed to strike, that he might heal, and he will give us an end of our labor and of our patience. And we shall call upon him and shall return to the Church and shall pray, and we shall be heard. We shall seek and shall find him, when we have sought him with our whole heart, and then he will appear to us. A certain one interprets the 'seventy years' according to that which is written: the days of our years, in them seventy years; and when these have been completed, then we may return to the Lord with our whole heart and be heard, and there may be an end of our labor and patience; for now we possess all things in shadow and image.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
