[[commentary]]
quote='''
Therefore thus says the Lord to Jehoiakim son of Josiah, king of Judah: They shall not lament for him: Woe, brother, and woe, sister! They shall not cry out together for him: Woe, lord, and woe, renowned one! But with the burial of an ass he shall be buried, rotted and cast out beyond the gates of Jerusalem. This, which we have set down from the Hebrew: They shall not lament for him: Woe, brother, and woe, sister, is not found in the Seventy. And it is said properly against Jehoiakim, king of Judah, and the riddle which before seemed hidden is opened, and the ambiguity among the three brothers is resolved, so that the word is not about Jehoahaz nor about Zedekiah, but properly about Jehoiakim, who, the Hebrew history relates, was killed by raiding bands of the Chaldeans, of Syria, of the Ammonites and of the Moabites; whence also in Malachim [Kings] it is written that he died, and his burial is passed over in silence. In the book of Days we read that he was bound with chains and led into Babylon, and nothing further is reported of him. And finely he says that he is to be buried with 'the burial of an ass', so as to signify in other words that he would be unburied, that is, torn apart by beasts and birds. For this is the burial of an ass.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
