[[commentary]]
quote='''
Now the enmity which was destroyed in the Savior's flesh was also slain through the cross. For it is written: that he might reconcile both in one body to God through the cross, slaying the enmity in it. Not, as is found in the Latin manuscripts, in himself: on account of the ambiguity of the Greek pronoun; for ἐν αὐτῷ can be understood both as in himself and as in it, that is, in the cross, because the cross, that is, σταυρὸς, is of the masculine gender among the Greeks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
