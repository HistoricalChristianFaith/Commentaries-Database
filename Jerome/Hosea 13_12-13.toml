[[commentary]]
quote='''
The iniquity of Ephraim is bound up; his sin is hidden; the pains of a woman in labor will come upon him; he is an unwise son; for now he will not stand in the crushing of the children. LXX: A gathering of iniquity is Ephraim; his sin is hidden; pains as of a woman in labor will come upon him; this is your wise son, because now he will not hold out in the crushing of the children. Just as, if something is bound up in a bag, it is kept, and is not lost to him for whom it was tied up, so every iniquity by which Ephraim has sinned against God is bound up for him, and is reserved, hidden as in a purse. Finally, when the day of vengeance has come, and the final captivity, pains as of a woman in labor will come upon him, or will seize him. A woman in labor knows long before she gives birth, from the time she conceived, that she is going to give birth, and daily awaits the extreme torments and agonies that are to come. So too Ephraim, the unwise son, of whom he had said above: Ephraim is a foolish dove, not having a heart in the crushing of his children and his people. When the day of labor and of captivity has come, he will be able neither to stand nor to endure. Instead of the unwise son, in the LXX one reads by irony: This wise son, that is: the one you thought wise, so that by contrast he may be understood as unwise. But for all the heretics their iniquity is bound up, which they have spoken on high; and their sin is hidden, while they think they hide the poisons of their heart and hold secrets, which, when the day of labor has come, will be laid open with pain and wailing. This Ephraim is an unwise son, because he has abandoned the wisdom of God, of whom it is also written in Jeremiah: His end will be foolish; and in the crushing of his children, whom he has killed, whom he has slaughtered, he will not be able to endure the wrath of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
