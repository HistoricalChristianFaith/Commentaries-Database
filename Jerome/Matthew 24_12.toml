[[commentary]]
quote='''
Observe, He says, the love of many, (Rom. 8:35.) not 'of all,' for in the Apostles, and those like them, love would continue, as Paul speaks, Who shall separate us from the love of Christ?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And because iniquity has abounded, the love of many will grow cold. It is not of all that he denied the faith, but of many. For many are called, but few chosen. For in the apostles and those like them the love will endure of which it is written: Much water will not be able to quench love; and Paul himself: Who will separate us from the love of Christ? tribulation or distress and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
