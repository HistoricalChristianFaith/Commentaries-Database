[[commentary]]
quote='''
For behold, each one walks after the depravity of his evil heart, so as not to hear me. And I will cast you out of this land into a land which you do not know, you and your fathers, and there you shall serve strange gods day and night, who will not give you rest. Once forsaken by the Lord, they do the things that are not fitting, so as to go after the desires of their evil heart, out of which come the worst thoughts; and for this reason they are separated from the Church, so as to go into a far country, which neither they nor their fathers had known before they sinned, so that there they may serve strange gods, who are not gods, but are thought to be so by the error of those who worship them. But in adding 'day and night', he shows the perpetual perseverance of sinners in wickedness, since both in the days they serve shameful deeds and in the nights lust. Who will not give, he says, you rest; there is no doubt that he means the false gods, of whom he said: and there you shall serve strange gods. Whatever, therefore, we sin, whatever we do by day and night and whatever evil works we commit, is the dominion of demons, who never give us rest and always drive us to add offenses to offenses and to make a heap of sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
