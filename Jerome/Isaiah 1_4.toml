[[commentary]]
quote='''
Woe to the sinful nation, to a people heavy with iniquity, to a wicked seed, to criminal sons: they have forsaken the Lord, they have blasphemed the Holy One of Israel, they are estranged backward. What I have put last, they are estranged backward, the Seventy Translators do not have; and for they have blasphemed there is written in them, they have provoked to anger; and for a wicked seed, a most evil seed. Following which the others translated the Hebrew MEREIM (מרעים) as of the most evil, so that the fault would lie not so much in the seed (lest the nature of good and evil be thought to be different) as in the malice of those who forsook the Lord by their own will.

At the beginning of the volume is the title, recording the person, the subject and the time; in the second verse he makes the hearers attentive; in the third he relates what the Lord has spoken; in the fourth, as if in an outburst, he rebukes the sinful nation and the people full of, or heavy with, iniquity. Not that the nation is one thing and the people another, as some think; but Israel itself is called both nation and people, and criminal or wicked sons: so that those who were first by kindness called sons of the Lord were afterwards, by their own fault, called sons of iniquity; or, as the rest have rendered with one voice, corrupting sons, that is, υἱοὶ διαφθείροντες, who by their own fault destroyed the good of their nature. And what is joined to it, They have blasphemed the Holy One of Israel, is said properly of the Jews crying out: We have no king but Caesar (John 19:15); and: Is not this the carpenter's son? (Matt 13:55); and, He has a demon, and is a Samaritan (John 8:48). Because, then, they forsook Christ and blasphemed the Holy One of Israel, therefore they are estranged backward, so that those who were called the portion and the sons of God were afterwards spoken of thus: Strange sons have lied to me (Ps 17 [18]:46). The Savior commanded that, having taken hold of the plough, we should not look behind our back (Luke 9:62), lest we imitate Lot's wife. Hence the Apostle too, stretching forward to what lies before, forgets what lies behind (Phil 3:13). And as for what he said according to the Seventy, to a people full of sins (Zech 5:7), it shows that there was no kind of sin that was not in the people of Israel. But if we read, as it is in the Hebrew, To a people heavy with iniquity, let us remember that testimony, that iniquity sits upon a talent of lead, and that it is said in the person of the sinner in Psalm 37 (38): My iniquities have gone up over my head; like a heavy burden they have weighed heavy upon me (Ps 37 [38]:5). We pass quickly over what is plain, so as to dwell on the more obscure things and on those that need explanation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
