[[commentary]]
quote='''
The burden of the word of the Lord upon Israel. The Lord said, stretching out the heaven and founding the earth and forming the spirit of man within him: Behold, I will make Jerusalem a lintel of drunkenness for all the peoples round about; but Judah too shall be in the siege against Jerusalem. And it shall be: on that day: I will make Jerusalem a stone of burden for all the peoples; all who have lifted it shall be torn with gashing, and all the nations of the earth shall be gathered against her. LXX: The taking up of the word of the Lord upon Israel. The Lord says, stretching out the heaven and founding the earth, and forming the spirit of man within him: Behold, I will make Jerusalem like lintels that are shaken for all the peoples round about, and in Judea. And there shall be a siege around Jerusalem, and it shall be on that day, I will make Jerusalem a stone that is trodden down by all the nations; everyone who treads her down, mocking shall mock, and I will gather against her all the nations of the earth. There is a threefold interpretation from the place in which we read: Behold, I will make Jerusalem a lintel of drunkenness for all the peoples round about, as far as the place where it is written: Sword, awake against my shepherd, and against the man who is my companion, says the Lord of hosts. Strike the shepherd and the sheep shall be scattered. For some of the Jews think that these things have already been partly fulfilled, from Zerubbabel down to Gaius Pompey, who was the first of the Romans to take Judea and the temple, a history which Josephus writes. Others, however, think that they are to be fulfilled at the end of the world, when Jerusalem shall have been restored, which the wretched Jewish nation promises itself with its ἠλειμμένῳ (anointed one), whom we read of above as the foolish shepherd. But others, that is, we who are reckoned by the name of Christ, declare that they are daily being fulfilled, and are to be fulfilled, in the Church until the end of the world. And so as not to stretch the measure of the volume by going through every point, setting it out thus: Those men say this, others suppose so, we think thus, we have set down three opinions, so that from the variety of interpretation the prudent reader may understand what is to be fitted to what. The Lord, then, who stretched out the heaven like a skin, and made the earth firm with a lofty mass, and formed the spirit of man within him, is likewise the Creator of all souls, so that out of the two substances of soul and body he might put together one living being. For spirit is frequently taken for soul, as there: Father, into your hands I commend my spirit, and: You will take away their spirit and they will fail, and they will return to their dust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
