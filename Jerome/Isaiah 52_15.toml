[[commentary]]
quote='''
He shall sprinkle many nations, cleansing them with his blood and consecrating them in baptism to the service of God. Over him kings shall shut their mouth, and the princes of the world, all of whose wisdom has been overthrown by the preaching of the cross; and those who had not had the Law and the Prophets, and to whom nothing had been announced of him, they themselves shall see and understand. Of them the Savior also speaks: Blessed are those who have not seen and have believed (John 20:29). In comparison with them the hardness of the Jews is reproved, who, seeing and hearing, fulfilled in themselves the prophecy of Isaiah, who says: Hearing you shall hear, and shall not understand: and seeing you shall look, and shall not see. For the heart of this people has been made fat, and with their ears they have heard heavily (Isa 6:9, 10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
