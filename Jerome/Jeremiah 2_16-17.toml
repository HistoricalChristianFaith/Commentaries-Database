[[commentary]]
quote='''
The sons also of Memphis and Tahpanhes have debauched you even to the crown of the head. Has not this been done to you because you forsook the Lord your God at the time when he was leading you along the way? This, which we said: at the time when he was leading you along the way, is not found in the Seventy. Now he names two very great cities of Egypt, Memphis and Tahpanhes, and says that their sons debauched Israel even to the crown of the head, in that sense in which Isaiah set it down: From the sole of the foot even to the crown of the head there is no soundness in him. And so great was the lust of the Egyptians, who are great of flesh, that they spared no member but debauched everything. According to the letter, refer it to the idols of the Egyptians; according to the spiritual understanding, to the teachers of perverse doctrine, who pollute the purity of the Church with their own filthiness. And these things will befall him for this reason, because he forsook the Lord his God, and that above all at the time when he ought to have followed him as his guide.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
