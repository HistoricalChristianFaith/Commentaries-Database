[[commentary]]
quote='''
If heaven and earth must pass away, obviously all things that are earthly must also pass away. Therefore the spots that witnessed the crucifixion and the resurrection profit those only who bear their several crosses, who day by day rise again with Christ and who thus show themselves worthy of an abode so holy. Those who say, "the temple of the Lord, the temple of the Lord," should give ear to the words of the apostle: "you are the temple of the Lord," and the Holy Spirit "dwells in you." Access to the courts of heaven is as easy from Britain as it is from Jerusalem, for "the kingdom of God is within you."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_058.html'
source_title="LETTER 58.3"

[[commentary]]
quote='''
Do not trust in lying words, saying: The temple of the Lord, the temple of the Lord, the temple of the Lord it is! For if you direct well — or direct — your ways and your pursuits, if you execute judgment between a man and his neighbor, if you do not practice false accusation against the stranger and the orphan and the widow — or do not oppress them — and do not shed innocent blood in this place, and do not walk after strange gods to your own harm, I will dwell with you — or I will make you dwell — in this place, in the land which I gave to your fathers from age to age. This, which the Seventy added at the beginning of this chapter: in words of falsehood, which will not profit you at all, is not found in the Hebrew. He commands both the people of the Jews then and us today, who seem to be established in the Church, not to have confidence in the splendor of buildings and in gilded ceilings and in walls clad with veneers of marble, and say: the temple of the Lord, the temple of the Lord, the temple of the Lord it is. For that is the temple of the Lord in which true faith dwells, holy conduct, and the choir of all the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
