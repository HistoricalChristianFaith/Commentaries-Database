[[commentary]]
quote='''
And the land is filled with silver and gold, and there is no end of its treasures. Among the other vices of the land of the house of Jacob is numbered also the abundance of gold and silver. Among omens and soothsayers, horses and chariots, which God forbade the kings of Israel to multiply, among idols, which are the works of men's hands, avarice is condemned. Hence the Lord commanded in the Gospel that we should not lay up for ourselves treasures on earth, and that we should not make treasures from which a thief can snatch, adding at the last: You cannot serve God and mammon (Matt 6:24). And finely has the Prophet expressed in other words that phrase of the little verse, The greedy man is ever in want, saying: And there is no end of its treasures; not that treasures have no end, but that the mind of those who possess them is not filled. And by these words both nations, the Jews and the Romans, are branded for avarice. Which the histories too, Greek as well as Latin, relate: that nothing is more avaricious than the nation of the Jews and of the Romans. Hence too the law on extortion was established, and daily we see that word of the Apostle fulfilled: You who preach that one must not steal, do you steal? (Rom 2:21). A more thievish judge hears and condemns a thief, pronouncing in another's case a sentence upon himself.

And its land is filled with horses, and its chariots are innumerable. For what is possessed against God's command is not worthy of number. Hence it is said in the Psalms: The horse is deceptive for safety (Ps 32 [33]:17). And in Exodus: The horse and the rider he has thrown into the sea (Exod 15:1). And in another psalm: Some in chariots and some in horses, but we will call upon the name of the Lord our God (Ps 19 [20]:8). Both can be understood: that the people of the Jews multiplied horses and chariots for themselves against God's precept, and that the land of Judea was filled with the horses and chariots of the conquerors.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
