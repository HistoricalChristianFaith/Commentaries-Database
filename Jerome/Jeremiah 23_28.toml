[[commentary]]
quote='''
Let the prophet who has a dream tell the dream, and let him who has my word speak my word truly! what has chaff to do with wheat?, says the Lord; are not my words like fire, says the Lord, and like a hammer — or an axe — breaking the rock? It belongs to those to expound a dream who merit to have the word of God and to say: 'thus says the Lord', to whom the Lord has spoken, in whom there is truth and not fraudulent falsehood. What has the chaff of the heretics to do with the wheat of the Church? Of this John the Baptist speaks more fully: that Christ will purge his threshing floor and with the winnowing fan leave the chaff to be scattered by the blasts of the winds and burned with fire, but will store the wheat in the barns, that it may become heavenly bread and each of the believers may say: taste and see that the Lord is sweet! And beautifully is perverse doctrine compared to chaff, which has no marrow and cannot nourish the peoples of believers, but is threshed out of empty stalks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
