[[commentary]]
quote='''
Let us see, then, what the judgment between cattle and cattle is, and with what judgment the good and true shepherd judges them, he who received all judgment from the Father: Behold, he says, I myself judge between fat cattle and lean (or between strong and weak): for the strong thrust with their sides and shoulders and dash against the weak cattle and toss them with their horns, not knowing that in the law the goring bull must be punished; and they thrust with their sides and tossed with their horns until they scattered the sheep and drove them out: for through the pride of the greater and the iniquity of those set over them, they are frequently driven from the church, so that those whom the Lord himself saved are scattered away from him; but the Lord will no longer abandon them to be a prey, and he will judge between cattle and cattle: not between the names of dignities with which those set over others swell, but between man and man, according as each is a servant of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
