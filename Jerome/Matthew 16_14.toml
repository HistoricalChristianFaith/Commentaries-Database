[[commentary]]
quote='''
It was as easy for the multitudes to be wrong in supposing Him to be Elias and Jeremias, as Herod in supposing Him to be John the Baptist; whence I wonder that some interpreters should have sought for the causes of these several errors.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252016.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they said: Some John the Baptist, others Elijah, but others Jeremiah or one of the prophets. I wonder at certain interpreters who inquire into the causes of each one's errors and weave a very long discussion of why some thought our Lord Jesus Christ to be John, others Elijah, but others Jeremiah or one of the prophets, when they could have erred thus about Elijah and Jeremiah in the same way that Herod erred about John, saying: John, whom I beheaded, has himself risen from the dead, and mighty works are at work in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
