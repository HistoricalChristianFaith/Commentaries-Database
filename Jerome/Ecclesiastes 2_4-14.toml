[[commentary]]
quote='''
I made my works great; I built myself houses; I planted myself vineyards, and so on, down to the place where he says: The eyes of the wise man are in his head, and the fool walks in darkness. Before I discuss each point, it seems useful to me to take everything together in a brief discourse and to gather the sense, as it were, into one body, so that what is said may be understood more easily. All the things that are thought good in the world I had, as a king and a mighty man. I built myself palaces on high; I planted hills and mountains with vines. And so that nothing should be lacking for luxury, I planted myself gardens and orchards, setting out diverse trees, which waters gathered into pools might irrigate from above, so that their greenness might be nourished by unfailing moisture for a longer time. I also had a countless multitude of servants, both bought and home-born, and many flocks of four-footed beasts, of oxen, that is, and of sheep, as many as no king before me had in Jerusalem. And treasures of silver and gold beyond counting were laid up, which the gifts of various kings and the tributes of nations had brought me. Hence it also came about that by excessive wealth I was provoked to greater delights, and choirs of the musical arts sang in concert for me with pipe, lyre and voice, and both sexes waited on me at banquets; but the more these things grew, the more wisdom was lacking. For into whatever pleasure desire had drawn me, I was carried along unbridled and headlong, and I thought this was the fruit of my labors, if I myself were consumed in lust and luxury. At last, coming back to myself and as if waking from a heavy sleep, I looked at my hands, and I saw that my works were full of vanity, full of filth, full of the spirit of error. For nothing that was thought good in the world could I find to be good. Reckoning, therefore, what the goods of wisdom were and what the evils of folly, I accordingly broke out in praise of that man who, reining himself in after his vices, can be a follower of the virtues. For there is a great distance between wisdom and folly, and as far as day is distant from night, so far are virtues separated from vices. And so it seems to me that he who follows wisdom always lifts his eyes to heaven and has his face raised up on high, and contemplates the things that are above his head; but he who is given over to folly and vices moves about in darkness and wallows in ignorance of things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
