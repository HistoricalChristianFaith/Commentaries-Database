[[commentary]]
quote='''
The Church, then, is commanded not to have sadness and anxiety over the affairs of the world and the losses that are wont to happen in this world, and it is said to her inhabitants: O you who are in the Church of the Lord, rejoice always, and whatever befalls you from the judgments of God, give thanks for it. Nor do I say this because you ought not to weep — for Blessed indeed are those who weep, for they shall laugh —, but I warn you of this, that you do not lament over the things that are of the world. If one of your kin has died, if the treasury has seized your property, if gout or any other disease whatever has oppressed your body, do not weep, do not shed tears, and do not consider the present but the future, and be weighed down rather because you dwell longer in this tabernacle of death. Rather beware of this, that you do not insult those who fall, and think another's ruin your own edification; let each one measure himself by his own strength, not by the weakness of another. Otherwise what justice is this, for the branches of the wild olive to insult the branches of the olive, which were broken off because of their unbelief, and to say: The house of Jacob provoked the Spirit of the Lord to anger, killing the prophets, worshipping idols, crucifying the Son of God? He who does this will not be free from reproach, and with the measure with which he judged he will himself be judged, and just as he speaks of the sins of the one who falls, so another will insult his ruin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
