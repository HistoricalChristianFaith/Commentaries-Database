[[commentary]]
quote='''
And the word of the Lord came to me, saying: Son of man, the house of Israel have dwelt (or has dwelt) in their land, and they defiled it in their ways and in their pursuits (or idols); like the uncleanness of a menstruous woman their way has become before me. And I poured out my indignation (or my fury) upon them, for the blood which they shed upon the land; with their idols they defiled it. And I scattered them among the nations, and they were winnowed (or I winnowed them) into the lands (or into the regions); according to their ways and their devices (or sins) I judged them. And they went in to the nations to which they entered, and they defiled my holy name, when it was said of them: This is the people of the Lord, and they have gone out of his land. And I spared my holy name (or I spared them for the sake of my holy name), which the house of Israel had defiled among the nations to which they went in. Therefore you shall say to the house of Israel: Thus says the Lord God: Not for your sake will I act, house of Israel, but for the sake of my holy name, which you defiled among the nations to which you entered; and I will sanctify my great name, which has been defiled among the nations, which you defiled in the midst of them, so that they may know that I am the Lord, says the Lord of hosts, when I shall have been sanctified in you before them. For I will take you from the nations, and gather you from all the lands, and bring you into your own land; and I will pour out (or sprinkle) clean water upon you, and you shall be cleansed from all your defilements, and from all your idols I will cleanse you. And I will give you a new heart, and a new spirit I will put in your midst (or I will give you), and I will take away the heart of stone out of your flesh, and give you a heart of flesh; and my spirit I will put in your midst (or I will give you), and I will cause you to walk in my precepts (or in my justifications), and to keep my judgments and to work (or do) them. And you shall dwell in the land which I gave to your fathers, and you shall be to me for a people and I will be to you for a God. And I will save you from all your defilements (or uncleannesses), and I will call the fruit and multiply it, and I will not lay (or give) famine upon you. And I will multiply the fruit of the tree and the produce of the field, so that you may no longer bear the reproach of famine among the nations. And you shall remember your most evil ways, and your pursuits that were not good, and your iniquities and your crimes shall displease you. Not for your sake will I act, says the Lord God; let it be known to you: be confounded and blush for your ways, house of Israel. Thus says the Lord God: On the day when I shall have cleansed you from all your iniquities, and caused the cities to be inhabited and restored the ruined places, and the deserted land shall have been tilled which once was desolate in the eyes of every traveler, they will say: That untilled land (or deserted) has become like a garden of pleasure, and the cities deserted and forsaken and undermined have sat fortified. And the nations which shall have been left round about you will know that I the Lord have built what was scattered and planted what was untilled; that I the Lord have spoken and have done it. Thus says the Lord God: Yet in this will the house of Israel find me (or I will be sought by the house of Israel), that I may do it for them: I will multiply them like a flock of men (or like sheep, men), like a holy flock (or like holy sheep), like the flock (or sheep) of Jerusalem in her solemn feasts: so shall the deserted cities also be full of flocks (or sheep) of men, and they shall know that I am the Lord. What is said is clear, and the whole sense concerning the mountains of Israel, which had formerly been deserted and were afterwards restored, is now set out more plainly; and God gives the reasons why he handed the people of Israel over to captivity, and on account of his clemency promises that he will lead them back into the land of Judea, and bestow far more than he had taken away — which some of the Jews refer to the times of Zerubbabel, when, as Cyrus king of the Persians relaxed their captivity, very many from the tribe of Judah and Benjamin were brought back into Judea; but others refer it to the reign of a thousand years, when under the Christ, who they think is yet to come, both the city of Jerusalem is to be built up and the temple to be built, of which we shall speak in the last part of this prophecy —. And meanwhile, to leave behind Jewish fables and endless genealogies, let us, according to our custom, briefly run through the περικοπὴν [section] of this chapter, and set out what seems right to us according to the ecclesiastical understanding.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
