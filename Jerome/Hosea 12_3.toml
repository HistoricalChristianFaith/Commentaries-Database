[[commentary]]
quote='''
Moreover he sets forth how great benefits Judah, that is, Jacob, received, and the son is named in the father, and he recalls the ancient history, so that both the mercy of God toward Jacob and his hardness against God may be known. While he was still in Rebekah's womb, he supplanted his brother Esau, not indeed by his own strength, since he could not perceive it, but by the mercy of God, who knows and loves those whom he has predestined. And not only did he supplant his brother in the womb, but in his strength also he was directed with the angel, when at the torrent Jacob fought against the angel all night long. And because he was directed with the angel, he therefore received the name εὐθυτάτου, which in Hebrew is called isar, that is, of one directing, or directed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
