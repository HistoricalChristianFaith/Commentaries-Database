[[commentary]]
quote='''
The ten tribes too played the harlot with the idols of Jeroboam son of Nebat; and they forsook their God, not keeping what he had commanded when he said: You shall worship the Lord your God and serve him alone, but this is to be read ἐμφατικῶς (emphatically): Fornication and wine and drunkenness take away the heart. For just as wine and drunkenness make him who has drunk no longer master of his mind, so fornication and pleasure pervert the sense and weaken the spirit, and make of a rational man a brute animal, so that he pursues eating-houses and brothels and the dens of lusts. And when the heart has thus been moved from its place, it thinks wood and stones are gods and worships the works of its own hands.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
