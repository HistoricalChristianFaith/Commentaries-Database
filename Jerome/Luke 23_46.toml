[[commentary]]
quote='''
Let us say this too, lest we seem to have hidden from the reader what we know: that spirit and wind are called among the Hebrews by the same word, that is, rua, and that according to the sense of the passage it is customarily taken either as spirit or as wind. Therefore in this place too we can take spirit either for wind, in that nothing breathes in idols, or for the soul, in that the images are animated. And that spirit is taken for the soul the Savior's prayer clearly signifies: Father, into your hands I commend my spirit. For Jesus could not commend to the Father either a perverse spirit, which it is impious even to think, or the Holy Spirit, who is himself also God, rather than his own soul, of which he had said: My soul is sorrowful even to death, and: No one can take my soul from me, but by my will I lay down my soul, and of my own accord I take it up again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
