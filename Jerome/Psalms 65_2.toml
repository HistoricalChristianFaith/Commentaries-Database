[[commentary]]
quote='''
But that all flesh is to be taken not absolutely, of men and of beasts and of birds and of fish, but specifically of men, is shown by that scripture: Hear my prayer; to you all flesh shall come. For it is not all the flesh of irrational living creatures that is to come to the Lord, but that flesh which is to receive the gift of the Holy Spirit, and of which it is said: I will pour out of my spirit upon all flesh, and your sons and your daughters shall prophesy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
