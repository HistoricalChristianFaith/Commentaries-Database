[[commentary]]
quote='''
But all these things are full of mysteries; the Lord does these things not in the morning, nor at noon, but in the evening, when the Sun of righteousness was set.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But when evening had come, his disciples came to him, saying, and the rest. All things are full of mysteries. He withdraws from Judea, he comes into a desert place, the crowds follow him, having left their cities, Jesus comes out to them, he has pity on the crowd, he heals their sick; and he does this not in the morning, not as the day grows, not at midday, but in the evening, when the sun of justice had set.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
