[[commentary]]
quote='''
Therefore I will still contend with you in judgment, says the Lord, and with your sons I will dispute. Lest he seem to strike through power, he contends by reason as with equals, according to that which David sings and the Apostle adopts: that you may be justified in your words and may prevail when you are judged. And in setting down 'still', he testifies that he has often done so; and in adding 'with your sons', he shows a like obstinacy also in the sons of the wicked. And covertly he signifies that their sons too, at the coming of the Lord, followed the ancient denial of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
