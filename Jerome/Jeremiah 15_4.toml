[[commentary]]
quote='''
And I will give them over to ferment — or commotion and distresses — to all the kingdoms of the earth because of Manasseh, son of Hezekiah, king of Judah, for all that he did in Jerusalem. We read in the book of Chronicles that Manasseh, after his captivity and repentance, returned to Jerusalem and reigned; but just as the merits of the saints descend to their posterity, as in the case of David and the rest, so the outrages of sinners reach their posterity, if their children and grandchildren have done similar things. But what he says: 'I will give them over to ferment or commotion and distresses of the whole earth', was both fulfilled in part under the Babylonians and is now being fulfilled in full, since the impious people imitated a most wicked king, one who filled Jerusalem from gate to gate with the blood of the righteous. From this we learn that peoples are very often destroyed by the crime of kings and princes and of those set over them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
