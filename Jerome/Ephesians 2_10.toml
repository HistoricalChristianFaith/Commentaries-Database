[[commentary]]
quote='''
For we are his workmanship, created in Christ Jesus in good works, which God has prepared, that we should walk in them.

He has given the reasons why we have been saved by grace through faith, and this very thing not of ourselves but of the gift of God, saying: For we are his workmanship; that is, that we live, that we breathe, that we understand and are able to believe, is his, because he himself is our Creator. And observe carefully that he did not say, we are his shaping (figuratio) and moulding (plasmatio): but, we are his workmanship (factura). For moulding draws its origin from the mud of the earth, while workmanship took its beginning according to the likeness and image of God. And these, set down together in the hundred and eighteenth psalm as well, signify different things: Your hands made me and moulded me (Ps. 118:73). Workmanship holds the first place; then moulding. And since the name of creation and of founding is always wont to be joined to great works (for example: that city was founded, and the world was created from the beginning; and each one of the saints, through various doctrines and virtues, is a whole world in himself), therefore we are now said to be created in Christ, and created in good works, whether those which we ourselves have done or are going to do, or in other creatures, to which our way of life is to be transferred, so that we may walk in the things which God has prepared; great hope having already been given us, while we are going to walk in those things which God has prepared so greatly. And since we have once come to the name of creature, and Wisdom in the Proverbs of Solomon says that she was created the beginning of the ways of God (Prov. 8), and many, for fear lest they be compelled to call Christ a creature, deny the whole mystery of Christ, so as to say that it is not Christ who is signified in this wisdom but the wisdom of the world: we freely proclaim that there is no danger in calling him a creature whom, with the whole confidence of our hope, we profess to be a worm, and a man, and crucified, and a curse; especially since, two little verses before, Wisdom herself promises that she will speak of the things which are after the ages (Prov. 8:21). But since Christ made the ages, and what she says next are the things which he promised he would speak of after the ages, the things that follow are to be referred to the mystery of the incarnation, not to the nature of God; although in the Hebrew manuscripts it does not read: The Lord created me the beginning of his ways, but, The Lord possessed me. Now between possession and creation there is a great difference: because he who is possessed certainly exists and subsists, and he who is possessed is one's own. But he is created who did not exist before he came to be; or certainly he is transferred from what he was into something else, just as we too are now said to be created in Christ Jesus. Created, certainly, not because we did not exist before, but created in good works. This David too prays for in the fiftieth psalm, saying: Create a clean heart in me, O God (Ps. 50:11). And certainly he had had a clean heart before his sin, when the Lord said of him: I have found David the son of Jesse after my own heart (Acts 13:22); but as there creation means renewal, so also in us and in Christ, through individual works and advances, creation and founding can be understood: so that daily in believers (who, variously according to their different merits, are called mountains, and valleys, and hills, and plains) Christ is created, born and founded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
