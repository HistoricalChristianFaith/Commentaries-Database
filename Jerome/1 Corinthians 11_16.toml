[[commentary]]
quote='''
He may also be forestalling the contentiousness of those, if any should wish to contradict him hereafter, as he also did to the Corinthians concerning the veiling of a woman's head and the man's not veiling, when after much argument he concluded, saying: "But if anyone seems to be contentious: we have no such custom, nor has the Church of God" (1 Cor. 11:16); that is, we have said what seemed to us honorable and just; but if anyone, unwilling to acquiesce in the truth, seeks what to answer, and on what grounds they may strive against it, let him know that he is not worthy of a response, since he is more ready to contend than to be taught.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
