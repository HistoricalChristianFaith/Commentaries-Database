[[commentary]]
quote='''
And as for what follows: Put a clean tiara upon his head, for tiara we read in the Hebrew Saniph, which most people call a mitre; and by this they want the dignity of the priesthood to be understood, because, once the filth of his sins had been taken away, he held a clean priesthood. This is what the Jews say.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
