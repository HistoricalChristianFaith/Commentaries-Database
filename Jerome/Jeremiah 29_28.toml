[[commentary]]
quote='''
He sent, he says, to us in Babylon, saying: It is far off. This is all that grieves him: that against his lie Jeremiah wrote the truth, that the return was far off and that they would return to Jerusalem after seventy years; and that therefore they ought to build houses, plant orchards and eat their fruit, take wives and beget sons, as the preceding discourse related.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
