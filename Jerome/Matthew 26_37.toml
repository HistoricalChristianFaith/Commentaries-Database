[[commentary]]
quote='''
(non. occ.) But we say that passible man was so taken by God the Son, that His Deity remained impassible. Indeed the Son of God suffered, not by imputation but actually, all that Scripture testifies, in respect of that part of Him which could suffer, viz. in respect of the substance that He had taken on Him.

The Lord therefore sorrowed not from fear of suffering, for for this cause He had come that He should suffer, and had rebuked Peter for his fearfulness; (Matt. 14:31.) but for the wretched Judas, for the offence of the rest of the Apostles, for the rejection and reprobation of the Jewish nation, and the overthrow of unhappy Jerusalem.

Our Lord therefore sorrowed to prove the reality of the Man which He had taken upon Him; but that passion might bear no sway in His mind, He began to be sorrowful by pro-passion; for it is one thing to be sorrowful, and another to be very sorrowful.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And taking Peter and the two sons of Zebedee, he began to be saddened and to be sorrowful. What we said above about passion and propassion is shown also in the present passage: that the Lord, in order to prove the reality of the man he had assumed, was indeed truly saddened, but, lest passion should rule in his soul, began to be saddened by way of propassion. For it is one thing to be saddened and another to begin to be saddened. Yet he was saddened not by fear of suffering, he who had come for this very purpose, that he might suffer, and who had rebuked Peter for timidity, but on account of the most unhappy Judas, and the stumbling block of all the apostles, and the rejection of the people of the Jews, and the overthrow of wretched Jerusalem. Hence Jonah too is saddened over the withering of the gourd or ivy, not wishing his former shelter to perish. But if the heretics interpret the sadness of soul not as the Savior's affection toward those who would perish but as passion, let them answer how they expound what is said in the person of God through Ezekiel: And in all these things you saddened me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
