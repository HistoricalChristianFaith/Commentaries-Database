[[commentary]]
quote='''
It is not doubtful to any what these great signs signify according to the letter, namely, that heaven and earth and all things should bear witness to their crucified Lord.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the veil of the temple was torn in two, from the top to the bottom. The veil of the temple was torn, and all the mysteries of the law, which were previously covered, were laid open and passed over to the people of the Gentiles. In the Gospel of which we often make mention, we read that the lintel of the temple, of immense size, was broken and split apart. Josephus also reports that the angelic powers, once the guardians of the temple, then cried out together: Let us depart from these abodes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
The earth too trembled, the rocks are split, all creation is troubled, because its Creator is slain. The veil of the temple is torn, because what had been shut in Judea is opened among all nations; the veil is torn, and the mysteries of the law are shown to the faithful: for to the unbelieving they are covered to this day. For when Moses is read, and the Old Testament is recited by the Jews every Sabbath, according to the apostle "a veil is placed over their heart." For they read the law, but do not understand, because their eyes are darkened that they should not see.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
