[[commentary]]
quote='''
And that you may know that I have mercy on you not for your merit but for my own clemency, I will go back to your fathers and forebears, so that you may understand that you were begotten of sinners: Your first father sinned in the wilderness, namely the whole people of Israel. Or else the author of your race, Abraham, is convicted of having sinned when, as the Lord promised the land of promise to his seed, he answered: Whereby shall I know that I shall possess it? And your interpreters, he says, have transgressed against me (Gen 15:8): Aaron and Moses at the water of contradiction, who spoke as mediators between me and you (Exod 17). And that we may understand that this is not a forced exposition, there follows: And I have defiled the holy princes, of whom it is also sung in the psalm: Their judges have been swallowed up beside the rock (Ps 140 [141]:6). These he says he has defiled for this reason, that they did not enter the land of promise. And I have given Jacob to slaughter, and Israel to blasphemy, so that none of those who had come out of Egypt, except two, entered Judea, but their carcasses lay in the wilderness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
And their princes and fathers are said to have violated the holy things of the Lord, not serving the Law of God, but seeking the traditions and commandments of men; on account of whom Jacob perished, and Israel was given to reproach, cast out of his own province, an exile and a stranger throughout the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
