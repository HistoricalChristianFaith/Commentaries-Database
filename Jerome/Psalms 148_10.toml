[[commentary]]
quote='''
Beasts, and all cattle. They change nothing of their nature: all stand in their own order, except man alone, to whom all things are made subject. Serpents, and feathered fowl. Neither do those things which are of the earth go to heaven, nor do those things which are in heaven come to earth: they serve you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
