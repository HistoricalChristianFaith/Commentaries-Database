[[commentary]]
quote='''
Ennom [Hinnom]: behold these, or they are.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Jeremiah"

[[commentary]]
quote='''
Thof [Topheth]: Gehenna, or covering of the mouth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Jeremiah"
