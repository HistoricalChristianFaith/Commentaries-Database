[[commentary]]
quote='''
And I answered, and said to him: What are these two olive trees on the right of the lampstand, and on its left? And I answered a second time, and said to him: What are the two ears of the olive trees, which are upon the two golden beaks, in which are the pourers of gold? And he said to me, saying: Do you not know what these are? And I said: No, lord. And he said: These are the two sons of oil, who stand by the Ruler of the whole earth. LXX: And I answered, and said to him: What are these two olive trees on the right of the lampstand, and on the left? And I asked a second time, and said to him: What are the two branches of the olive trees, which are in the hands of the two golden nostrils, which pour in and draw back the golden pourers. And he said to me: Do you not know what these are? And I said: By no means, lord. And he said to me: These are the two sons of fatness, who stand by the Lord of the whole earth. When the prophet asked what the two olive trees signified, one of which stood on the right of the lampstand, the other on the left, the Lord, or the angel of the Lord, would not answer. The prophet, understanding this, inquires a second time, and said: What are the two ears of the olive trees, or the two branches? He asks about lesser things, since he did not deserve to hear the greater. Now these two branches are in the hand of the two nostrils, or upon the two golden beaks, which in Hebrew are called sinthoroth, in Greek μυξωτῆρες; and these two μυξωτῆρες themselves, upon which are the two ears, or the two branches of the olive trees, are of purest gold. And when the prophet asked also about the two branches, and was asked again by the angel whether he knew what the two branches signified, and he had said: No, lord, the angel of the Lord answered: These are the two sons of oil, as Symmachus would have it, or of στιλπνότητος, as Aquila translated, that is, of splendor; or of πιότητος, that is, of fatness, as the Seventy rendered; or of λαμπρότητος, that is, of brightness, as Theodotion translated, who stand by the Ruler of the whole earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
Some of our writers interpret the two olive trees as the Son and the Holy Spirit, and the lamp in the middle as God the Father. But I do not know how, without blasphemy, they can take one as on the right and the other as on the left. The branches, too, or ears of the olive trees, they explain as the incarnation of the Savior and the likeness of a dove of the Holy Spirit, because we cannot see the olive trees whole, but a certain part, and, so to speak, the little branches of the incarnation of Christ and of the manifestation of the Holy Spirit have been shown to us. Others understand the two testaments, the Gospel on the right, the law on the left, because in the one there is the spiritual sense, in the other the bodily; and because we can explain neither the whole Gospel nor the whole law: And now we know in part, and we prophesy in part, and we cannot yet understand what is perfect. There are some who interpret the two branches of the olive trees, or the two ears, and the sons of fatness or of splendor, as the priesthood and the law, which afford joy to the whole earth. Others take them as Enoch and Elijah, of whom one pleased God in uncircumcision, the other in circumcision, and was caught up into heaven with his body. For splendor and oil, and fatness and brightness, we read in the Hebrew Isaar, according to what is written in the psalms of the joy and happiness of the saints: They shall be inebriated with the plenty, or with the fatness of your house: for πιότης means fatness rather than plenty. These things we have spoken as best we could, and as far as the powers of our small talent could bear, touching briefly on the various opinions both of the Hebrews and of our writers; if anyone says something better, or rather truer, we too gladly yield to what is better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
