[[commentary]]
quote='''
According to tropology it seems that it should be explained by us thus: Gaza, which in Hebrew is called Aza, means strength or dominion; Solomon, peaceful; the Idumean, bloodthirsty and earthly; Azotus, that is, Esdod, fire of the breast, or of the paternal uncle, although some, wrongly reading dor for dod, think it means fire of generation; Ashkelon is interpreted murderous fire, or hung up and weighed; Ekron, στείρωσις, that is, barrenness, and ἐκρίζωσις, which is interpreted uprooting. Gaza, therefore, which promises itself the strength and dominion of its own knowledge, is accused of having shut up in Idumea captives from the household of Solomon. These I take to be the teachers of the Jews, and all who follow the letter that kills and will not receive the spirit that gives life, but want whatever they interpret and understand to be earthly, and do not hear, with the disciples, the Lord expounding parables and saying to them: Those who have ears to hear, let them hear, especially since the Apostle understands a plain history as referring to the two testaments: one upon Mount Sinai, which is Hagar, and is in slavery with her children; the other upon Jerusalem the free, which is our mother. He says, then, that he will send fire upon the walls of Gaza and upon all its arguments, with which it strives to surround and defend its lies. And when he has sent fire upon the walls, its houses, or foundations, will be devoured, whatever it could have that was firm and built by the art of dialectic. From Azotus also, which itself too belongs to the foreigners, he will take away the inhabitant, whose breasts, because he follows the letter, are full not of milk but of fire, and who falsely claims to have the fire of the paternal uncle, or whose whole generation is to be consigned to the fires. And he will take away the sceptre, or the tribe, from Ashkelon, where the murderous fire is. For just as the fire of the Lord will save those whose hearts it has penetrated, so that fire which fell from heaven like lightning, which kindles the arrows of the devil, will kill whomever it breathes upon. He will move his hand also upon Ekron, where there is barrenness and uprooting. For whoever does not receive the spiritual understanding will hear through Hosea: Give them, Lord. What will you give them? Give them a barren womb and dry breasts. And so as to take in everything at once in a single word, he says that he will destroy all the remnant of the Philistines, either the city of Gath, in which is the winepress of the devil, or all the remaining Philistines, who are called falling by the cup. For when they have become drunk, they will fall down and wallow in their own vomit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
