
[[commentary]]
quote='''
And beneath him shall rise the multitude of believers, and he shall build the house of the Lord, the Church, and he himself shall receive the power and beauty and progress and glory of each one, and shall sit and rule on his throne, on the throne of David, of which it is also written in the Gospel: And there shall be a priest at his right hand, or, according to the Hebrew, upon his throne, because he himself is both king and high priest, and shall sit on the royal as well as on the priestly throne, and there shall be a peaceful counsel between the two, so that neither shall the royal eminence depress the priestly dignity, nor the dignity of the priesthood the royal eminence, but both shall agree in the glory of the one Lord Jesus. I have read in a certain person's book that what is said: And a peaceful counsel shall be between the two, refers to the Father and to the Son, because he came to do not his own will but the Father's, and the Father is in the Son, and the Son in the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
