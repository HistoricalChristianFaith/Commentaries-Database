[[commentary]]
quote='''
If you return, Israel, says the Lord, to me, turn back, for which the Seventy translated: if Israel is turned, says the Lord, to me, he shall be turned. And the sense is: 'if he has returned to me, he will return from captivity', or otherwise: 'when he has offered what he has'. For to him who has, it shall be given; but from him who has not, even that which he seems to have shall be taken away. But according to the Hebrew the sense is this: 'if you return to me, Israel, and once for all desire salvation, and say that you have sinned and have not listened to the voice of your Lord, turn back fully; believe in him whom you denied, and then there will be full conversion'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
If you take away your stumbling blocks from before my face, you shall not be moved. When, therefore, we are moved and say: but my feet were almost moved, we do not suffer this through the weakness of nature, but because we set up stumbling blocks and our idols against the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
