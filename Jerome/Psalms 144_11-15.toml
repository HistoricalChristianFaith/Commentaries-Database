[[commentary]]
quote='''
Rescue me and free me from the hand of the sons of strangers. The little verses which were spoken above are repeated again. Whose mouth has spoken vanity, and their right hand is the right hand of iniquity. Whose sons are like new plantings established in their youth. From the hand of the sons of strangers. Let us see what sort the sons of the heretics are. Whose sons are like a new planting in their youth. From the hand of the sons of strangers. Attend diligently to what is said about the heretics.

Their daughters are adorned, decked round about like the likeness of a temple. Their storehouses are full, belching forth from this into that. Their sheep are fruitful, abounding in their goings-out: their oxen are fat. There is no ruin of the wall, nor passage, nor outcry in their streets. They called blessed the people who have these things. This they said. What do I say? Blessed the people whose God is their Lord. We shall therefore expound each point briefly for your prayers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
