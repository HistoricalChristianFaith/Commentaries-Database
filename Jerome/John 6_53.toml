[[commentary]]
quote='''
We read the holy Scriptures. I hold the Gospel to be the body of Jesus; the holy Scriptures I hold to be his teaching. And when he says, He who has not eaten my flesh and drunk my blood — although it can also be understood in the mystery, yet truly the body of Christ and his blood is the word of the Scriptures, is the divine teaching. If ever we go to the mystery — he who is faithful understands — if a little crumb falls, we are in peril. If ever we hear the word of God, and the word of God and the flesh of Christ and his blood is poured into our ears, and we are thinking of something else, into how great a peril do we run?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_057.html'
source_title="Homily 57, on Psalm 147"
