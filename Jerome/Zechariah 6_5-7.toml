
[[commentary]]
quote='''
These chariots, four in number, or cars, were sent into the four winds of heaven, that is, to the hinges of the world, and the whole circle of the lands, to fulfil the will of the Lord; to whom it is afterward said by the angel: Go, and walk through the earth, and sow the Gospel in all the ends of the earth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
