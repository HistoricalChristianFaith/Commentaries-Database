[[commentary]]
quote='''
But Tyre and Sidon — of which the one is interpreted συνοχὴ, that is, distress, the other θήρευμα, that is, hunting —, took to themselves wisdom to such a degree that, with its sophisms and the nets of dialectic and the webs of the sophists, which Scripture calls fortifications, Tyre put riddles to Solomon, that is, to the peaceful king; and gathered its silver, namely the brilliance of eloquence, and its gold, the cunning of its thoughts, like the dust and mud that lie in the streets and roads, so as to possess the kingdom of idolatry that it had fortified. But against these fortifications the Apostle speaks: For the weapons of our warfare are not carnal, but mighty to God for the destruction of fortifications, destroying reasonings and every height that exalts itself against the knowledge of God. And under the figure of Nineveh, which is interpreted adorned, or beautiful, for nothing is more adorned than the world, the word of God is directed through the prophet against the men of the world: And you shall be made drunk, and shall be despised, and you shall seek help from the enemy; all your fortifications are like a fig tree with its early figs: if they are shaken, they shall fall into the mouth of the eater.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
