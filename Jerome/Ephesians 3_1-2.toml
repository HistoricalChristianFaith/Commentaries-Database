[[commentary]]
quote='''
For the sake of this thing, I Paul, the prisoner of Jesus Christ for you Gentiles: if indeed you have heard of the dispensation of the grace of God which was given to me in you. For according to revelation the mystery was made known to me, as I wrote before in brief; as you are able, reading, to understand my sense in the mystery of Christ.

As far as the sequence of the discourse and the texture of the language are concerned, though we searched most diligently, we have been able to find nothing that he gave in answer to what he put first: For the sake of this thing, I Paul, the prisoner of Jesus Christ for you Gentiles. For he did not say: for the sake of this thing I Paul did this or that, or taught this and that; but, leaving the sentence hanging, he passed on to other things. Unless perhaps, pardoning him for what he himself also confessed, saying: Even if unskilled in speech, yet not in knowledge (2 Cor. 11:6), we should look in him for the order of the meanings rather than of the words. It can be supplied thus: for the sake of this thing, I Paul, the prisoner of Christ Jesus, and a prisoner for you who are from the Gentiles, came to know the mystery, so that I might hand it on to you as well, as I said a little before in this same Epistle. And you ought to hear of the dispensation of the grace of God which was given to me in you who are from the Gentiles, for whom I am also the prisoner of Jesus Christ. That Paul is the prisoner of Jesus Christ for the Gentiles can also be understood of martyrdom: that, cast into chains at Rome, he sent this Epistle at the time when, as we have shown in another place, the Epistles to Philemon, to the Colossians and to the Philippians were written. Or surely, because we have read in many places that this body is called the bond of the soul, by which it is held as though shut up in a prison, we say that Paul is held in by the ties of the body, and does not return and be with Christ, for this reason: that the preaching to the Gentiles may be fully completed through him. Some, however, introduce another sense into this: that Paul, predestined and sanctified from his mother's womb for the preaching to the Gentiles before he was born, afterward received the bonds of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
