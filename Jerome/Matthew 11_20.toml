[[commentary]]
quote='''
His upbraiding of the towns of Corozaim, Bethsaida, and Capharnaum, is set forth in this chapter, because He therefore upbraided them, because after He had such mighty works and wonders in them they had not done penitence. Whence He adds, Wo for thee, Corozaim! wo for thee, Bethsaida!
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252011.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then he began to reproach the cities in which very many of his mighty works had been done, because they had not repented. The reproach of the cities of Chorazin and Bethsaida and Capernaum is set out by the title of this chapter: namely, that he reproached them for this reason, because after very many mighty works and signs had been done they did not repent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
