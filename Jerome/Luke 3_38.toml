[[commentary]]
quote='''
Let us contemplate heavenly things from earthly ones. Adam, whom God first formed, and whose Creator and Father God was, surely knows that he owes to God the Father that by which he subsists. Again, those who were begotten of Adam understand him as the father from whom they sprang. Hence also in the Gospel according to Luke, when the generations had been reckoned backward step by step from Christ to David and Abraham, at the end Scripture says: sons of Seth, sons of Adam, sons of God (Luke 3:38), to show that the word fatherhood on earth first arose from God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
