[[commentary]]
quote='''
For before those days there was no wage for men, nor was there a wage for beasts, nor was there peace for him who came in and went out, because of the tribulation; and I let loose all men, each one against his neighbor. LXX: For before those days the wage of men shall not be for gain, and the wage of beasts shall not stand, and for him who goes out and him who comes in there shall be no peace because of the tribulation; and I will send forth all men, each one to his neighbor. The Seventy referred everything to future time, but it is better referred to the past, as it stands in the Hebrew, and the truth of the exposition will bear this out. Before the house of the Lord was founded and the temple of the Lord was built, all your labor was in vain. And men as well as beasts, in farming, in trading and in various works, were frustrated in empty efforts; enemies abroad and sedition at home disturbed the peace, and everywhere there was a standstill of public business because of the frequency of wars and the plots at home, while brother keeps no faith with brother, and all kinship is hostile. Haggai the prophet, embracing this sense in other words, says: And now set your hearts from this day and upward, before stone was laid upon stone in the temple of the Lord. When you came to a heap of twenty measures, and they became ten; and you went in to the winepress to press out fifty flagons, and they became twenty. I struck you with a burning wind and with blight, and with hail all the works of your hands, and there was none among you who would return to me, says the Lord; and this we can take both of the Church and of each one of the believers. For before the foundations of the house of God are laid in us, and we are built up as a temple for God, and hear from the Apostle: You are the temple of God, and the Holy Spirit dwells in you; whatever good work we seemed to have, whether as rational beings, who are called men, or as simple ones, who are called beasts — For men and beasts, he says, you will save, O Lord — has no wage with God; and there are wars and discords in us, and tribulation everywhere, and we are without the peace of Christ, which, as he went to the Father, he left to the apostles; and the Lord's saying is fulfilled in us: A man's enemies are those of his own household. For every brother supplants with supplanting; and every friend walks deceitfully, and a man mocks his brother and does not speak the truth; their tongue has learned to speak a lie. But if we turn to Christ and are made his temple, at once we shall hear the Apostle proclaiming: Each one shall receive his own wage according to his work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
