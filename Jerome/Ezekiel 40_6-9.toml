[[commentary]]
quote='''
The threshold of the gate, then — or 'thee', or rather 'seph', which Symmachus translated οὐδὸν [threshold], Aquila and Theodotion πρόθυρον [front doorway] —, had one reed, that is, six cubits and a handbreadth, in breadth; further, meaning I know not what, the Seventy added of their own 'six on this side and six on that'; and after the threshold of the gate, according to the Hebrew, he measured the cell — or room, and, as Symmachus translated, παραστάδας, that is, 'posts' — on either side, at one reed, as much in length as in breadth — which the Seventy also translated 'aelam', and which in what follows Symmachus translated 'fore-threshold' —; and between the two cells — or rooms and παραστάδας — there were five cubits, and another near-threshold of the gate beside the vestibule within, of one reed; a third, the vestibule of the gate, also had eight cubits, and in its front, or in its margins, two cubits; and lest anyone think this vestibule to be the same as the one above, he added: the vestibule of the inner gate; in place of which the Seventy translated a first and a second and a third vestibule.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
