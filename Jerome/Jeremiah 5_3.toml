[[commentary]]
quote='''
Lord, your eyes look upon faith. You struck them, and they did not grieve; you crushed them, and they refused to receive discipline; they hardened their faces beyond rock, and they would not return. After the words of the Lord, by which he had given command, saying: Go about the ways of Jerusalem and the rest, the prophet speaks to the Lord: Lord, your eyes look upon faith, which in Hebrew is called 'emuna': not the works of the Jews, in which they exulted according to the ceremonies of the law, but the faith of Christians, through which we have been saved by grace. From this passage we learn that punishments are inflicted for this reason: that vices may be corrected. Accordingly he says: You struck them, and they did not grieve; you crushed them, and they refused to receive discipline. For Jerusalem is corrected through every torment and scourge; and over and above all these they did not even feel shame for their own vices, but, hardening the impudence of their brow like a rock, they would not be converted to better things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
