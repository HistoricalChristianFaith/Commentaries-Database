[[commentary]]
quote='''
The Synagogue is both of these, and if she persists in fornication and adultery, God will take away from her the garments and ornaments which he had given. Of these Ezekiel writes: On the day when you were born, they did not bind your breasts, and you were not salted with salt: and I passed by you, and found you naked, and disfigured, and spattered with blood. And a little after: I clothed you with fine linen and delicate stuffs, and placed ornaments about you, and gave bracelets about your hands, a necklace about your neck. These things her most generous husband gave her then, when he found her in Egypt, defiled by the lust of idolatry and spreading her feet for all. And now he threatens that, if she will not return to her husband, she will be without God and husband, just as she had been before in Egypt. Lest we always stretch out our volumes with a threefold explanation, let it suffice to have pointed this out now and then: that what has been said fits both the Jews who deny Christ and the heretics who abandon the faith of the Lord, whose fornication is properly between the breasts; and it dwells in the heart, in the craft of idols and of various dogmas; they will return to the day of their birth, so that, if they do not repent, they will be compared to the heathen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
