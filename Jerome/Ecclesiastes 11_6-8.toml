[[commentary]]
quote='''
Otherwise: In another place of Scripture God promises, saying: I will give you the early and the late rain, that is, the Old Testament and the New, and I will water you with both showers. Hence we too are now admonished to read the old law in such a way as not to despise the Gospel, and to seek the spiritual understanding in the Old Testament in such a way as not to think that in the evangelists and in the apostles nothing sounds but what is read. For we do not know in which of the two knowledge and grace are granted to us more by God; and happy is he who has joined both together in common and made them as it were one body. Whoever has attained this will see the light, will see Christ, the sun of justice. And if he lives many years, he will dwell in the highest joy and delight, possessing the knowledge of the Scriptures, and he will be driven the more to this labor by the remembrance of the judgment to come; because an everlasting time of darkness will come, and eternal punishments will be prepared for those who did not sow in the morning and toward evening and in no way joined the two together, and who saw neither the light nor the sun, from which light itself goes forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
