[[commentary]]
quote='''
From my youth up until now I have spent many years in writing various works and have always tried to teach my hearers the doctrine that I have been taught publicly in church. I have not followed the philosophers in their discussions but have preferred to acquiesce in the plain words of the apostles. For I have known that it is written, "I will destroy the wisdom of the wise and will bring to nothing the understanding of the prudent," and "the foolishness of God is wiser than men." This being the case, I challenge my opponents thoroughly to sift all my past writings and, if they can find anything that is faulty in them, to bring it to light. One of two things must happen. Either my works will be found edifying and I shall confute the false charges brought against me; or they will be found blameworthy and I shall confess my error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_133.html'
source_title="LETTER 133.12"

[[commentary]]
quote='''
Therefore he threatens, according to the Seventy, that he will proceed, not to remove them to the Assyrians and Babylonians, but to scatter them through the whole world. According to the Hebrew, he says that he will cause great wonder and an astounding marvel to the people of the Jews, so as to destroy the wisdom of those who did not receive the power of God and the wisdom of God, and to hide and conceal the understanding of the prudent: that is, lest they find him who is contained in the letter. From this place the Apostle Paul, writing to the Corinthians, set down a testimony: I will destroy the wisdom of the wise, and the understanding of the prudent I will reject (1 Cor 1:19): setting out the same sense in other words; not that God is an enemy of wisdom, of which he is the father, and through whom all wisdom among men exists; but he set it down with an addition, as it is in the Hebrew: of the wise of the people and of its prudent, that is, of the people of the Jews. And truly God worked a great marvel in the people after the coming of the Lord the Savior, so that at one and the same time Jerusalem burned, and the temple fell, and all the knowledge of the teachers was taken away; fulfilling what was said above (cf. Isa 3:1ff.): Behold, the Ruler, the Lord Sabaoth, shall take away from Jerusalem and from Judah the strong man and the strong woman: all the strength of bread and all the strength of water; the giant and the man of war, and the judge, and the prophet, and the diviner, and the elder, and the captain of fifty, and the wonderful counselor, and the wise architect, and the prudent hearer, and the rest that the prophetic word wove together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
