[[commentary]]
quote='''
Nevertheless let you also, each one individually, love his own wife as himself.

Someone might suppose that the Apostle enjoins the same love between husband and wife as is commanded toward the neighbor: for so it is written: You shall love your neighbor as yourself (Lev. 19:18), and now it is said: Let each one love his own wife as himself. Therefore the love toward the neighbor and toward the wife will be the same. But if, according to the Savior's interpretation, every man is a neighbor to every man, then there will be no difference of love between a wife and the love of any men whatever, which is very absurd to say. For in the case of the neighbor a likeness is set down, that you should love him just as yourself and desire him to be saved. But in the case of the wife the adverb of comparison, as (sicut), sounds, with a certain weight, not likeness but approval and confirmation. As we say of a man: he acted as a man (quasi vir); and of the Savior it is written: We saw his glory, glory as (quasi) of the only-begotten (John 1:14). Not that the Savior himself had glory by comparison with another only-begotten: for he himself is the Only-begotten. And if there were also another only-begotten, he could not be called only-begotten. Hence he had no need of the example of another only-begotten, but he possessed glory as the Only-begotten, that is, as it befitted him himself to have it. The opening of the seventy-second psalm, though according to the Greeks, sounds this same thing: ὥς ἀγαθὸς ὁ Θεὸς τῷ Ἰσραὴλ τοῖς εὐθέσι τῇ καρδίᾳ, which has been translated by our people: How good is the God of Israel to the upright of heart (Ps. 72:1)! Otherwise, according to the Greeks, ὥς, that is, as (sicut), seems to signify a likeness rather than the firmness of what is said, if you hear it not as a confirmation but as an example. At the same time this too must be noted, that the husband is commanded to love his wife, but the woman to fear her husband. For love befits a husband, fear a woman; but to a slave not only dread but also trembling is joined. Hence in what follows he also says: Slaves, obey carnal masters with fear and trembling.

And let the woman fear her husband. If dread toward God, because of fear of punishment, does not allow him who dreads to be perfect, how much more imperfect will a woman be who dreads not only God but also her husband? For this reason it must be asked whether the wife, and the wife's fear, are to be understood carnally, since wives are frequently found to be much better than their husbands, and to command them, and to govern the house, and to bring up the children, and to keep the household in discipline, while the husbands live in luxury and run after harlots. Whether these women ought to rule their husbands or to fear them, I leave to the reader's judgment. But if, according to allegory, as we said above, the wife is taken as the body and the husband as the mind, there is nothing unfitting in her fearing her husband as a handmaid, set in the second rank and in a baser substance. For, as Crispus (Sallust) says, we use rather the command of the mind and the service of the body. But he who follows the simple understanding of the woman and the husband will show that there are two meanings in the word "fear." And he will say: one is that of which John says: He who fears has punishment, and he who fears is not perfect (1 John 4:18). According to it, slaves too have the spirit of slavery in fear, which is required of them by the Lord, who says to them: And if I am a father, where is my glory? And if I am a lord, where is my fear (Mal. 1:6)? The other is that which among the philosophers is named εὐλάβεια, and among us, though it does not render it fully, can be called reverence (reverentia). The prophet too knows a fear of the perfect, and whoever fears with this fear is perfect, when he says in the thirty-third psalm: There is no want to those who fear him (Ps. 33:9). So here dread can be enjoined on the wife, simply understood, that she fear, that is, revere her husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
