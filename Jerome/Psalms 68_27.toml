[[commentary]]
quote='''
Hence too it is said in the sixty-seventh Psalm: Bless the Lord from the fountains of Israel. There is Benjamin the younger (Ps 67 [68]:27-28; Acts 9); Paul the apostle, in ecstasy of mind, who also said elsewhere: whether we are beside ourselves, it is for God (2 Cor 5:13): The princes of Zebulun, the princes of Naphtali, their leaders; because in these tribes were the little villages from which our leaders the Apostles believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
