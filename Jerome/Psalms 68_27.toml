[[commentary]]
quote='''
There is Benjamin the young lad in ecstasy of mind. He means holy Paul: "there," in the church: "the young lad," the last of all the apostles, of the tribe of Benjamin.

The princes of Judah their leaders. The apostles are the princes of Judah, that is, of the Lord, just as Jacob says: "Judah, may your brothers praise you." The princes of Zabulon, the princes of Nephthalim. Zabulon is interpreted "flowing of the night," Nephthalim "breadth": when we have been freed from the passion of lust, that is, from that flowing, then we begin the broad spaces of the virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_007.html'
source_title="Homily 7, on Psalm 67"

[[commentary]]
quote='''
Hence too it is said in the sixty-seventh Psalm: Bless the Lord from the fountains of Israel. There is Benjamin the younger (Ps 67 [68]:27-28; Acts 9); Paul the apostle, in ecstasy of mind, who also said elsewhere: whether we are beside ourselves, it is for God (2 Cor 5:13): The princes of Zebulun, the princes of Naphtali, their leaders; because in these tribes were the little villages from which our leaders the Apostles believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
