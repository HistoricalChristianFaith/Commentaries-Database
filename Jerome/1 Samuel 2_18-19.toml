[[commentary]]
quote='''
Many err, and think that blessed Samuel was a priest. He was not a priest, he was a Levite. Finally, even his garment was not made as for a priest, but as for a Levite. For it is written: 'And his mother made for him,' it says, 'an ephod bad garment.' Ephod means garment, but bad means linen. Now, none had the linen garment except the Levites. But the priests of God had it of five kinds, that is, of gold, of hyacinth, of fine linen, of purple, of scarlet. Whoever, then, were of the priestly line had these garments. But the Levites had the ephod bad, that is, the linen garment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_026.html'
source_title="Homily 26, on Psalm 98"
