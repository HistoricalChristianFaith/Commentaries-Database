[[commentary]]
quote='''
And he himself gave some apostles, and some prophets, and others evangelists, and others pastors and teachers, for the instruction of the saints, for the work of the ministry, for the building up of the body of Christ.

And from this passage too the one divinity of the Father and the Son is most manifestly proved. For what Christ is now described as having bestowed, God the Father is related in the first epistle to the Corinthians to have given: For some, he says, God has placed in the Church: first apostles, second prophets, third teachers; then powers, and gifts of healings, helps, governments, kinds of tongues (1 Cor. 12:28). Sabellius, not understanding this, confounds the Father and the Son, since he does not think that the same operation can belong to different persons. And at the same time it must be noted that here Christ is recorded to have given apostles, prophets, evangelists, pastors and teachers, but there the Father to have placed the same. So the Father and the Son placed, or gave, first apostles, second prophets: not those who foretell things to come, such as we read of in the Old Testament, but those who convict and judge the unbelieving and the unlearned. For such, he lays down in another epistle, are the prophets of the New Testament (1 Cor. 14:24). Third evangelists, whose feet are beautiful for announcing peace (Rom. 10). Nor indeed must we think that, just as in the three above he said that some are apostles, others prophets, others evangelists, so too in the case of pastors and teachers he set down different offices. For he does not say, "and others pastors, and others teachers," but "others pastors and teachers," so that he who is a pastor ought also to be a teacher, and that no one in the Churches, however holy he may be, should take to himself the name of pastor unless he can teach those whom he feeds. Or indeed it may be taken otherwise: that one and the same president of the Church is pastor and teacher, pastor of the sheep, teacher of men. For men and beasts you will save, O Lord (Ps. 35:7). I think that today too in the Churches, just as a prophet and an evangelist, and also a pastor and teacher, are found, so an apostle too can be found, in whom the signs and marks of apostleship are fulfilled; and that, on the other side, there are very many, outside as well as inside, in heresies as well as in the Church, who are pseudo-apostles, and pseudo-prophets, and pseudo-evangelists, and pseudo-pastors, and pseudo-teachers. And as for the heresies, indeed, there is no doubt that, in keeping with their false faith, everything they possess is false. But in the Churches, do they not seem to you to be false pastors who do not feed the sheep with discipline, but like hirelings give no thought at all to the safety of the flock, not turning back what has strayed and not seeking what has perished, but only grasping at milk and wool from the sheep, that is, at food and clothing?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
