[[commentary]]
quote='''
He rebuked him, that is, not the sufferer, but the dæmons.

Or, His reproof was to the child, because for his sins he had been seized on by the dæmons.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus rebuked him, and the demon went out of him. Not he who was suffering but the demon ought to have been rebuked. Or else he rebuked the boy, and the demon went out of him, because he had been oppressed by the demon on account of his own sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
