[[commentary]]
quote='''
Let us speak also according to anagogy, or rather let us explain a prophecy wrapped in many obscurities. The sons of Zion, protected by their Lord, will devour their adversaries, whom we understand as the sons of Greece. And they will subdue them with sling stones, with the threatenings of the Scriptures, making their adversaries subject and humble; for nothing strikes so hard as an example from the holy Scriptures, and a testimony sent forth by the whirl of the mouth. But what is said in the LXX: And they shall drink their blood like wine, we do not read so in the Hebrew, but: Drinking they shall be made drunk as with wine, so that they may hear that word of the Song of Songs: Drink, friends, and be drunk. And so their drunkenness will please like the sacrifice of the altar, and like the horns, or corners, of the altar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
