[[commentary]]
quote='''
Hear the word of the Lord, you princes of Sodom; give ear to the law of our God, you people of Gomorrah. Once the remnant of the people of Israel had been saved through the Apostles, the prophetic word turns to the Scribes and Pharisees and the people shouting: Crucify, crucify such a man (John 19:6), and calls them princes of Sodom and people of Gomorrah, according to what we read in what follows: They have proclaimed and displayed their iniquity like Sodom. Woe to their soul, for they have devised a most evil counsel against themselves, saying: Let us bind the righteous man, for he is unprofitable to us (below, Isa 3). Therefore they are called princes of Sodom and people of Gomorrah for this reason, that they devised a most evil counsel and bound the righteous one, and said, We have no king but Caesar (John 19:15). And again: We know that God spoke to Moses; but as for this man, we do not know who he is (John 9:29). And at the same time, glorying in the Gospel, We are the seed of Abraham, and have never been slaves to anyone (John 8:33), they hear from the Lord Savior: If you were sons of Abraham, you would surely do the works of Abraham; and again: You are born of the devil as your father, and you wish to do the works of your father (ibid., 39, 44). Ezekiel too says something of the kind to Jerusalem: Your father was an Amorite, and your mother a Hittite (Ezek 16:45). The Hebrews say that Isaiah was put to death for two reasons: because he called them princes of Sodom and people of Gomorrah, and because, though the Lord said to Moses, You cannot see my face (Exod 33:20), he dared to say, I saw the Lord sitting upon a throne high and lifted up (below, Isa 6:1); not considering that the Seraphim covered the face and feet of God, or their own, for in the Hebrew it reads ambiguously, and that Isaiah writes that he saw only his middle parts. Man, then, cannot see the face of God. But the Angels even of the least in the Church always see the face of God (Matt 18:10). And, Now we see in a mirror and in a riddle, but then face to face (1 Cor 13:12): when we have advanced from men to Angels and can say with the Apostle: But we all, with unveiled face beholding the glory of the Lord, are transformed into the same image from glory to glory, as by the Spirit of the Lord (2 Cor 3:18). And yet no creature sees the face of God according to the proper character of his nature; and he is then discerned by the mind when he is believed to be invisible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
