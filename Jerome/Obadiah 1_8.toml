[[commentary]]
quote='''
Alternatively: after those who had formerly been deceived have been converted to the Church, then, with the Lord himself doing battle, the wise of Idumea will perish, who were wise in carnal and earthly things, and prudence will be taken away from Mount Esau, the prudence which was lifted up against the knowledge of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
