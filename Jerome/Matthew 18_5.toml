[[commentary]]
quote='''
For whoever is such that he imitates Christ's humility and innocence, Christ is received by him; and by way of caution, that the Apostles should not think, when such are come to them, that it is to themselves that the honour is paid, He adds, that they are to be received not for their own desert, but in honour of their Master.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252018.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And whoever receives one such little child in my name receives me. Whoever is such that he imitates the humility and innocence of Christ, in him Christ is received. And prudently, lest the apostles, when honor has been paid to them, should think themselves the ones honored, he added that they are to be received not for their own merit but in honor of their master.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
