[[commentary]]
quote='''
Moreover, what follows, For those who are left of his inheritance, he did not hold his anger as a testimony, has this sense: if he spared the nations, which would not believe his law, and would not impute their iniquities to those who were left over and left remaining of the people, nor brought his anger as a testimony of their just punishment, what will he do with his own flock, which feeds in the midst of Carmel, and in Bashan, and in Gilead? For he is one who wills mercy, and returning he will have mercy on us; and our heavy sins, and the iniquities that sit upon the talent of lead, he himself will carry, and will sink in the sea, and will not let them appear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
