[[commentary]]
quote='''
At the same time this too should be noted, that he has attached different things to the obedience of children and of slaves. For to the children he says: Obey your parents in the Lord; but to the slaves: Obey your fleshly masters with fear and trembling. So that, just as fear makes a difference between the slave and the wife, so obedience too should differ between children and slaves. And beautifully, when commanding slaves to obey their masters, he added, as to Christ; and again, as slaves of Christ, doing the will of God: namely, so that the slave should not listen to his fleshly master if he wishes to command things contrary to the precepts of God. And just as he had written back to the Corinthians in keeping with the time (1 Cor. 7), so that divorces should not occur between husbands and wives on the occasion of faith in Christ, if one of the two had wished to believe; so to the Ephesians and to the Colossians, because very many at the beginnings of the faith thought that Gentile masters were to be despised, he now lays down precepts for these conditions with moderation: so that he does not seem to stir up the slaves against their masters, and on the other hand by no means teaches that masters are to be listened to if they command vicious and abominable things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
