[[commentary]]
quote='''
Those to whom he had said above: House of Israel, pass over, all of you, and see, from what sort of vices they are bidden to pass over to better things, the following words describe: Who come to the evil day, preparing for themselves by their own vice an evil day; not that any day is evil, but that each one prepares evil for himself, according to what we read in Ecclesiastes: Do not say, The former days were better for me than these, for you do not ask about this in wisdom; for it is foolish to lay it on the times, since it is in our power to make for ourselves either a good day or an evil one. These draw near to and touch false sabbaths. For just as there is what is called circumcision of the flesh and circumcision of the heart, and there are Jews openly and in secret, of whom the one kind is rejected and the other approved, so there are sabbaths of the Lord that are holy and rest upon truth, and others that are not holy and are false, which follow the idleness of the letter that kills.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
