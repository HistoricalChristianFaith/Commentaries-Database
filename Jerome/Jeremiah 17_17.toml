[[commentary]]
quote='''
Do not, he says, be a terror to me, my hope in the day of affliction! This is clear according to the Hebrew; but according to what the Seventy translated, saying, do not become to me as a stranger, sparing me in the evil day, the sense is: 'do not spare me in the present world, which is evil, but render to me according to my sins, so that I may have everlasting rest! for I know that it is written: whom the Lord loves, he reproves; and he scourges every son whom he receives'. But the evil day is either the whole world or the day of judgment for those who are tormented on account of their sins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
