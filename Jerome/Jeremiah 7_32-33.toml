[[commentary]]
quote='''
Therefore, behold, the days will come, says the Lord, and it will no longer be called Topheth and the valley of the son of Hinnom, but the valley of killing, and they will bury in Topheth because there is no room. And the carcasses of this people will be food for the birds of heaven and the beasts of the earth, and there will be none to drive them away. He signifies the time of the siege, which they endured from the ninth year of King Zedekiah to the eleventh year, and that the valley itself will by no means be called 'gehennom', that is, 'valley of hennom', or 'of the sons of Hinnom', but, on account of the killing of very many, 'valley of slaughter'. And so great will the slaughter be that in the place formerly of worship there will be innumerable tombs, and those whom they cannot bury will be torn by birds and devoured by beasts, and there will be no one to drive them away, since he fears the like and is overcome by the duties of burying. We pass quickly over what is plain, so that, wherever there is occasion, we may linger over what is obscure. For the very size of the book can cause weariness to readers; how much more if it were discussed by us at greater length!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
