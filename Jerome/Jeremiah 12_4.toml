[[commentary]]
quote='''
How long will the land mourn, and the grass of every region wither, because of the wickedness of those who dwell in it? Beast and bird are consumed, because they said: He will not see our last end or God will not see our ways. Whatever happens in the world, whether of good or of evil, does not happen without providence and by fortuitous chance, but by the judgment of God. The land is now barren, the grass withers: do you wish to know the reason? The wickednesses of its inhabitants bring this about, so that both the animals upon the earth and the birds of the sky are consumed, since all these things were created for the uses of men. They rose up to such blasphemy as to say that God is ignorant of their ways and does not know what each one is going to suffer. And when he says 'how long', he signifies that the wrath of God remains, because the mind of those who sin is not changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
