[[commentary]]
quote='''
Thus says the Lord: Go down into the house of the king of Judah, and there you shall speak this word and say: Hear the word of the Lord, O king of Judah, who sit upon the royal seat of David, you and your servants and your people, who enter through these gates! Thus says the Lord: Do judgment and righteousness, and deliver him who is oppressed by force from the hand of the slanderer, and do not grieve the stranger and the orphan and the widow, nor oppress them unjustly — or impiously — and do not shed innocent blood in this place! For if you indeed do this word, there shall enter through the gates of this house kings of the race of David sitting upon his throne, and mounting chariots and horses, they and their servants and their people. But if you do not hear these words, by my own self I have sworn, says the Lord, that this house shall become a desolation. This vision, nay rather this word of the Lord, comes to the prophet either before Zedekiah sent messengers to him, or certainly after he had instructed the messengers what they should report to the king; Jeremiah is commanded not to speak to the king through messengers at all, but to go himself to the palace and speak to him there. And at the same time let us note the divine wisdom, in that through the messengers he orders sad tidings to be announced, mixed with prosperous ones too, should the king be willing to do repentance. Here, however, because he himself is commanded to go, he does not announce sad tidings and a captivity now on the very point of coming, but he advises what the king ought to do in order to escape the impending sentence of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
