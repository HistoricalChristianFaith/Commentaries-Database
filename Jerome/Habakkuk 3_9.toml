[[commentary]]
quote='''
Bending also his bow or his arrows, he uprooted, destroyed and laid waste the scepters, that is, the kingdoms against which Jeremiah was sent, and brought it about that sin should not reign in our mortal body. And by the scepters, that is, the kingdoms of the devil, which he showed even to the Lord, understand the various sins: avarice, luxury, anger, detraction, thefts, perjuries, against which the Word of God, sitting on his horses and in his chariots, aims the brandished darts of his lightning, and meanwhile does not let them fly, so that whoever has been terrified at the bent bow may not feel the shooting of the arrows. And this he does always, which Aquila translated in place of diapsalma. For he always sits in his saints, he is always armed. And preparing sharp arrows on their tongues he rides, and runs to and fro for the salvation of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"

[[commentary]]
quote='''
You will split the rivers of the earth. LXX: The earth will be split by rivers. Since the Lord has roused his bow to render to the tribes the oaths which he spoke, it is said consequently: You will split the rivers of the earth, that is, the kings of the earth fighting against your people you will divide and scatter. But according to the Seventy, who said: The earth will be split by rivers, let us first set out an example, so that by this as by a step we may come to higher things. We read in those who have composed volumes on marvels, and who have carried the Olympiads of Greece down to our own memory, setting out what new thing happened in the world in each year, that among other things rivers burst forth through an earthquake which had not existed before, and again others were swallowed up and went to the bottom; namely, that all the veins of the earth, as the human body has blood, so have within them hidden waters, which are broken open by the shaking of the earth and burst out into rivers. If we have understood this, let us see that the human soul naturally has waters and rivers within it, and that through our sloth they are hidden and do not flow. But when it has been shaken by the preaching of the Word of God and moved from its former state, then what lay hidden bursts forth and flows for the refreshment of those who drink. I think this same thing is signified also by what is in Genesis, that wells are dug by the servants of Isaac which had been made by Abraham and which the Philistines had stopped up with earth. As long as Abraham lives, his wells are not closed; but when he is dead and the wells are stopped up, if servants dig, the Philistines oppose them, and there is strife. But if Isaac himself comes and digs a well and finds water, the Philistines have no power to oppose him. See Peter and Paul, and you will not doubt about the wells and rivers of Christ. Look at all the apostles, and you will understand that not four rivers now, but twelve rivers go out of the paradise of the Scriptures. These rivers, before the earth was moved, lay hidden, and while they were in the veins of the earth they offered no drink to the thirsty. But after the world and all the earth were shaken at the coming of Christ, they suddenly burst forth, and then was fulfilled: He made rivers into a desert, and the outgoings of waters into thirst, a fruitful land into saltness, because of the wickedness of those who dwell in it. He made the desert into pools of water, and the land without water into springs of water, and made the hungry dwell there, and they established a city to dwell in. For after the Lord came into the world, and that was fulfilled which he said in the Gospel: For judgment I came into this world, that those who did not see might see, and those who saw might become blind, then the land of Israel, from which rivers formerly flowed and watered the whole people of Judea, dried up, and its springs were stopped. But the whole world, which was deserted and barren and did not have the waters of the Lord's preaching, was turned into pools of water, and as many teachers as it sent out, so many springs it also had. Nor is it enough for them, that is, for the springs and rivers, to water the peoples of the world; but in each province, gathering into one people those who were hungry and suffered famine of the Word of God, they built up the Church, which is called a city to dwell in, and which the rush of the river makes glad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
