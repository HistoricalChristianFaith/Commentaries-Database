[[commentary]]
quote='''
And these are the names of the sons of Ishmael in their names and in their generations. The firstborn of Ishmael, Nabaioth, and Cedar and the rest, up to the place where it says, and they dwelt from Evila as far as Sur, which is over against the face of Egypt for those going toward the Assyrians; in the sight of all his brothers he fell. Twelve sons are born to Ishmael, of whom the firstborn was Nabaioth, after whom the whole region from the Euphrates as far as the Red Sea is called Nabathena to this day; it is a part of Arabia. For their families too, and their towns and villages and small forts and tribes, are known by the name of each one of them: of these, Cedar is in the desert, and Duma is another region, and Theman toward the south, and Cedema is called the tract toward the east.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
