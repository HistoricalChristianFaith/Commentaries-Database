[[commentary]]
quote='''
How do you say: I am not defiled, I have not gone after the Baals? See your ways in the vale or valley, which in Hebrew is called 'ge' and by the Seventy is translated polyandrion, which in our language can be called 'the tomb of a multitude'. 'In vain', he says, 'are you unwilling to confess your crimes, and do you boast of cleanness, you who are polluted with the filth of idolatry, and shamelessly deny that you worshiped the idol of the Baals. Look back at the vale of the sons of Hinnom, which is watered by the springs of Siloam, and there you will see the shrine of Baal, whom you venerated, having forsaken God'. And what is added: know what you have done, opens the closed eyes of her who denies, so that she may see what she blushes to look upon. According to tropology, let us refute by their works the shameless brow of those who will not confess their vices. For men of this kind do not walk in the strait and narrow way that leads to life, but in the broad and spacious one, by which very many enter, which leads to death. Hence too it was significantly named polyandrion, or else according to the history, because there a multitude of the people was slain and perished through the evil of idolatry.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
