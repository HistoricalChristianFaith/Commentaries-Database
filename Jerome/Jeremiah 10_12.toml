[[commentary]]
quote='''
The Lord, who makes — or made — the earth by his might, prepares the world by his wisdom, and by his prudence stretches out the heavens. At his voice he gives a multitude of waters in the heaven, and lifts up — or brings out — the mists from the ends of the earth; he has made lightnings into rain, and brings out the wind — or the winds — from his treasuries. Every man has become foolish from knowledge; every craftsman is confounded in his carved image, for what he has cast is false, and there is no spirit in them. They are vain and works worthy of laughter; in the time of their visitation they will perish. Not like these is the portion of Jacob; for he who formed all things, he it is, and Israel is the rod of his inheritance; the Lord of hosts is his name. He who makes the earth by his might is God the Father. And he makes it by his might, that is, by the Lord the Savior; for Christ is the power of God and the wisdom of God. He himself is also the prudence in which he stretches out the heaven. For he himself spoke, and they were made; he commanded, and they were created, saying to the Son: Let us make man after our image and likeness!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
