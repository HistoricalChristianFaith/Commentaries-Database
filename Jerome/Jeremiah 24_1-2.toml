[[commentary]]
quote='''
The fifth book of the commentaries on Jeremiah, brother Eusebius, will take its beginning from two baskets, of which the one will show the sweetness of the right faith, the other the bitterness of the faithlessness of the heretics. Although Hananiah son of Azzur resists Jeremiah, and Shemaiah the Nehelamite desires that the prophet be sent into prison, and Zephaniah the priest swears himself to the words of the false prophets, yet truth can be shut up and bound, but it cannot be conquered; it is content with the fewness of its own and is not terrified by the multitude of its enemies. Therefore raise your hands to heaven with Moses and hang up the ancient serpent in the desert, and at once Amalek will be destroyed and the poisoned bites will not prevail, and the people of the Lord, secure, will cross the streams of the Jordan with Jesus [Joshua], and after the vast wilderness will eat the bread that was born in our little village of Bethlehem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
The Lord showed me, and behold, two baskets — or, according to Symmachus, hampers — full of figs, placed before the temple of the Lord, after Nebuchadnezzar, king of Babylon, had carried away Jeconiah, son of Jehoiakim, king of Judah, and his princes and the smith and the setter from Jerusalem, and had brought them to Babylon. One basket had very good figs, as figs of the first season usually are, and one basket had very bad figs, which could not be eaten because they were bad. And the Lord said to me: What do you see, Jeremiah? And I said: Figs, good ones, very good, and bad ones, very bad, which cannot be eaten because they are bad. And the word of the Lord came to me, saying: Thus says the Lord God of Israel: As these figs are good, so will I know the exile of Judah, which I have sent out from this place into the land of the Chaldeans, for good. And I will set my eyes upon them for good, and I will bring them back into this land, and I will build them and not destroy them, and I will plant them and not pluck them up. And I will give them a heart, that they may know me, that I am the Lord, and they shall be to me for a people, and I will be to them for a God, because they will return to me with their whole heart. For as the very bad figs, which cannot be eaten because they are bad, thus says the Lord, so will I give — or hand over — Zedekiah, king of Judah, and his princes and the rest of Jerusalem, who have remained in this city and who dwell in the land of Egypt. And I will give them to vexation and affliction — or dispersion — to all the kingdoms of the earth, for a reproach and for a parable and for a proverb and for a curse in all the places to which I have cast them out. And I will send among them the sword and famine and pestilence, until they are consumed from the land which I gave to them and to their fathers. Some interpret the two hampers or baskets of good and bad figs as the law and the Gospel, the synagogue and the Church, the people of the Jews and that of the Christians, Gehenna and the kingdom of heaven, of which the one pertains to the punishment of sinners, the other to the dwelling-place of the saints. But we, knowing according to the Apostle Paul that the law is good and holy and the commandment good and holy, and that there is one God of both Testaments, should rather refer them to those who at the coming of the Lord the Savior believed and did not believe: so that those who, stirred up by the scribes and priests, cried out, saying: Crucify, crucify such a one, are the basket of bad figs; while those of the people who believed after his ascension are referred to the good figs and to the best basket and hamper.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
