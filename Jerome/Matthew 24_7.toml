[[commentary]]
quote='''
Figuratively; Kingdom rising against kingdom and pestilence of that discourse which spreadeth as a plague-spot, and hunger of hearing the word of God, and commotion throughout the earth, and separation from the true faith, my be rather understood of the heretics, who fighting among themselves give the victory to the Church.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
For nation will rise against nation and kingdom against kingdom, and there will be pestilences and famines and earthquakes in various places; all these are the beginnings of sorrows. I do not doubt that these things too which are written will come to pass according to the letter; but it seems to me that kingdom against kingdom, and the pestilences of those whose speech creeps like a cancer, and the famine of hearing the word of God, and the shaking of the whole earth and the separation from the true faith, are rather to be understood of the heretics, who, fighting against one another, bring about a victory for the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
