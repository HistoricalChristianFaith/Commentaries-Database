[[commentary]]
quote='''
And in other generations it was not made known to the sons of men, as it has now been revealed to his holy apostles and prophets in the Spirit: that the Gentiles are fellow heirs, and fellow members of the body, and fellow partakers of the promise in Christ through the Gospel, of which I was made a minister according to the gift of the grace of God, which was given to me according to the working of his power.

The mystery of Christ, which the Apostle set out in part above, how it was unknown to other generations, seems to call for fuller treatment: whether Abraham, Jacob and Moses, Isaiah and the other prophets were ignorant of it, or not. For Scripture records that the coming of Christ and the calling of the Gentiles were foretold by them. Abraham indeed saw his day, and was glad (John 8:56), and it is said to him: In your seed shall all nations be blessed (Gen. 22:18). And Jacob speaks prophetically of him who was to spring from Judah: And he shall be the expectation of the nations (ibid., 49:10). Moses too esteemed the reproach of Christ greater riches than the treasures of Egypt. And Isaiah: Behold, he says, a virgin shall conceive in the womb, and shall bear (Isa. 7:14). And elsewhere: There shall be the rod of Jesse, and he who shall rise to reign over the nations: in him shall the nations hope (ibid., 11:10). And, not to be long, let it suffice to have cited a few things from the Psalms: And all the families of the nations shall worship in his sight (Ps. 21:28). And again: All nations shall serve him (Ps. 71:11). And still more plainly, concerning the people of Israel and concerning the Lord the Savior: Visit this vine, and perfect that which your right hand has planted, and upon the son whom you have strengthened for yourself (Ps. 79:15, 16). The dispensation of his body, too, is indicated in what follows: Let your hand be upon the man of your right hand, and upon the son of man whom you have strengthened for yourself (ibid., 18). Either, then, we must take it, with Montanus, that the patriarchs and prophets spoke in ecstasy and did not know what they said; or, if this is impious (for the spirit of the prophets is subject to the prophets), they certainly understood what they spoke. And if they understood, the question is how Paul now says that what was not made known to other generations has been revealed to the apostles of Christ. Either, then, we must answer that Paul cautiously and pointedly testified that the mystery was unknown to the sons of men, not to the sons of God, to whom he says: I said: You are gods, and all sons of the Most High (Ps. 81:6); namely, that those who had received the spirit of adoption, of whom the patriarchs and prophets were, knew the mystery of God. Or, if this is not accepted, and seems too violent and forced, the argument will pass over to this, that it says Paul did not state definitely and generally that the mystery of the Lord was altogether unknown to other generations, but that the patriarchs of old and the prophets did not know it in the way in which it has now been revealed to his saints and apostles. For it is one thing to know in the spirit the things to come, another to see them accomplished in deed. Hence John too is said to be greater than all the prophets (Luke 7) for this reason: because he himself beheld the one whom the others prophesied, and pointed him out with his finger, saying: Behold the Lamb of God: behold him who takes away the sins of the world (John 1:29). In accordance with this sense that saying too can be explained: Many prophets and righteous men desired to see what you see, and did not see it, and to hear what you hear, and did not hear it (Luke 10:24). They certainly desired to see and hear these things, which they had known were to come. But if they did not know the things to come, how could they desire what they were wholly ignorant of? We read in the books of Kings that the Lord, in a dream, made a promise to Solomon, saying: Because you have asked this thing of me, and have not asked for yourself many days, nor requested riches, nor the lives of your enemies, but have asked that you might understand and hear judgment: behold, I have done your word, and have given you a prudent and wise heart, so that one like you has not been before you, and after you there shall not arise one like you (1 Kings 3:11, 12). And how do some think that a mystery was revealed to the apostles of Christ which was unknown to Solomon, when the divine voice promised that Solomon was wiser than all the apostles and than the patriarchs before him? He also speaks confidently of himself: God has taught me wisdom, and I have known the understanding of the saints (Prov. 30:3). David too glories in the knowledge of the hidden mystery, saying: The uncertain and hidden things of your wisdom you have made manifest to me (Ps. 50:8). And to him who applauded himself for his wisdom God speaks through the prophet: Are you wiser than Daniel (Ezek. 28:3)? Either, then, the sense which we have already discussed above must be held: that the patriarchs and prophets were ignorant of the mystery of Christ in the way in which it has now been revealed to the apostles, because it is one thing to hold something in one's hands, another to foresee in the spirit what is to come. Or it must be said that, as faces are not like faces, so neither are hearts like hearts; and that, according to the Apostle, the gifts of grace are diverse: one has prophecy, another kinds of tongues, another gifts of healings, another helps and governments; this one is wise, that one faithful, another strong in the knowledge of secrets, that one content with simple faith alone (1 Cor. 12). For not all have spoken alike, after the example of Solomon, of the natures of beasts and birds and plants, so as to discourse from the cedar of Lebanon to the hyssop that comes out through the wall. On the other hand Solomon perhaps did not see, as Moses did, all the kinds of victims and of the worship of God; nor did the Lord speak with him face to face; nor did he either possess or understand so great an array of vessels, whose pattern the Lord showed to Moses on the mountain (1 Kings 4; Exod. 33, 25). And as the patriarchs and prophets had some things which we must believe the apostles did not have, so, on the other hand, in keeping with the fitness of the time and for the preaching of the Gospel, the apostles had the mystery of Christ better known. The holy men of old indeed knew it too, but not as the apostles did, on whom the necessity of preaching lay.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Those who hold that the prophets did not understand what they said, and spoke as if in ecstasy, along with the present testimony also drag in, to confirm their dogma, the passage found in many manuscripts of the Epistle to the Romans, reading: Now to him who is able to strengthen you according to my Gospel and the preaching of Jesus Christ, according to the revelation of the mystery kept silent in eternal times, but now made manifest through the prophetic Scriptures and the coming of our Lord Jesus Christ, and the rest. To them we must answer briefly that in past times the mystery of Christ was kept silent, not among those who promised that it would come, but among all the nations, to which it was afterwards made manifest. And we must likewise note that the mystery of our faith cannot be revealed except through the prophetic Scriptures and the coming of Christ. Let those, then, who do not understand the prophets and do not wish to know them, claiming that they are content with the Gospel alone, know that they are ignorant of the mystery of Christ, which in eternal times was unknown to all the nations.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
