[[commentary]]
quote='''
You know, Lord: remember me and visit me, and deliver me from those who persecute me! Do not take me up in your patience; know that I have borne reproach for you! Your words were found, and I ate them — or by those who reject your words; consume them — and your word became to me — or will be to me — a joy and the gladness of my heart, because your name has been called upon me, O Lord God of hosts! What we said: 'You know', is not found in the Seventy. Happy, moreover, is that conscience which bears reproach for God. Hence he says: 'Your words were found, which you were speaking by my mouth, and I ate them, that is: they were turned into food for me'; or, according to Symmachus: 'I received them, so that they were turned into gladness for me, though formerly they had been a reproach'. Hence the Babylonians too confess that what Jeremiah had foretold as future has been fulfilled. Or the sense is this: 'I felt distresses, I endured the miseries inflicted by a persecuting people, but nevertheless I rejoiced that I had obeyed your precepts, and for your name's sake I suffered hard things'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
