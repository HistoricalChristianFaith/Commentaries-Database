[[commentary]]
quote='''
Your new moons, and sabbaths, and other festivals I will not bear: your assemblies are wicked. Every gathering that does not offer spiritual sacrifices, nor hears what is sung in Psalm 50 (51), A sacrifice to God is a troubled spirit; a contrite and humbled heart God does not despise, is abominable to God. And therefore he adds and says: Your calends and your solemnities, so as to call them not his own festivals but those of the people who abuse them wickedly. And as for what the Seventy translated, fasting and idleness, we can say that that fast is accepted by God which has no idleness from good works. My soul hates. Ἀνθρωποπάθως: not that God has a soul, but he speaks in terms of our feelings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
