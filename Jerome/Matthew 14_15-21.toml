[[commentary]]
quote='''
The baskets of Egypt are one thing, and the baskets of Jesus another. Jesus too has his own baskets, and our Savior filled twelve baskets from the fragments. O wondrous thing, signifying immense mysteries! Five thousand of the people were dwelling in the wilderness, apart from the little ones and the women; in a deserted place there are found only as many as five loaves; for the place was a desert. I ask you, you who follow only the letter: in a deserted place there are found only five loaves — and how are twelve baskets found? If the place was a desert, surely it could not have twelve baskets. But all this is signified: that the Lord led his people out of Egypt into the desert of this world; he fed them with his loaves, and whatever was left over he stored up in twelve baskets — that is, in the twelve apostles; so that what had perished in the twelve tribes might be saved in the twelve apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_013.html'
source_title="Homily 13, on Psalm 80"
