[[commentary]]
quote='''
So then, these so many nations that fight against the saints — let us see whom they have as their prince, the Savior or the devil. What follows? For Asshur also is come with them. Asshur, Nebuchadnezzar, the adversary of God, who led the people of God into captivity. Although the nations may seem to have very many fighting on their behalf, yet they have Asshur, that is, the devil, as their prince, who are become a help to the sons of Lot. Lot is interpreted "declining." The demons were formerly angels, and afterward fell with the devil, and became his satellites, as it is written in the Apocalypse of John, that the dragon fell, and drew with him the third part of the stars. So then, what does he say? These, who came with so many nations, and assailed your people, and Asshur came with them, and they have the devil as their prince, are become a help to the sons of Lot — that is, to the demons who declined from you: they do the same work that the demons also do.

You see that these are most difficult passages, you see that they are obscure, and that in each single phrase there are great mysteries, and we are compelled by necessity to dwell rather long on the Hebrew words that are full of mysteries. For we are not now airing out some rhetorical commonplace: but we are striving to interpret that which was spoken by the Holy Spirit. For unless we interpret it as we have said, what does it profit the churches of Christ to read "the tabernacles of the Edomites, and the Ishmaelites," and the other names?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_015.html'
source_title="Homily 15, on Psalm 82"

[[commentary]]
quote='''
For Assur also came with them. They went before, and he follows. Let us see who this is that follows. Assur indeed is interpreted "the devil": truly so, because he is both the enemy and the avenger, as is written in the eighth psalm, "That you may destroy the enemy and the defender." He himself makes us sin, and he himself accuses us for punishment. For Assur came together with them. They have the devil as their prince, they have him as their emperor: not Josiah the righteous king rules over them, but the Assyrian. They became a help to the sons of Lot. Lot is interpreted "turning aside," which is understood, from God, like the Jewish people: because all the heretics agree with the Jews in blasphemies.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
