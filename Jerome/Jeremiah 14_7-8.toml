[[commentary]]
quote='''
If our iniquities have answered — or have withstood — us, O Lord, act for your name's sake, for many are our turnings away — or our sins —. Against you we have sinned, O expectation of Israel, his Savior in the time of tribulation. If we are in doubt why the rains do not come down upon the land, why all things wither with dryness, let us hear: our iniquities have withstood us; 'therefore, O Lord, not according to our works but according to your holy name, overcome our many turnings away. For against you we have sinned, whom the secrets of the heart do not deceive, and we wait for you, who are the true hope and expectation of Israel and save him in the time of tribulation, according to that which is written: To the Lord I cried when I was in tribulation, and he heard me'. Let us too say, in the time of drought and dearth of waters: 'Against you we have sinned and have done evil before you; we wait for your coming, you who save Israel not by its own merit but by your clemency.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
