[[commentary]]
quote='''
That this may be understood, let us set down examples from our own condition: when an infant has grown into a boy, and a boy into a youth, and a youth into a man, and a man into an old man, he by no means perishes through the several ages. For he is the same who was before; but he is changed little by little, and is said to have perished to his former age. Understanding this, the apostle Paul too said: For the fashion of this world passes away (1 Cor 7:31). Let us consider what he said: the fashion passes away, not the substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
