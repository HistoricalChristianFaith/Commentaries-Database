[[commentary]]
quote='''
And when, rooted and grounded in love (Eph. 3), we know with the full confidence of the mind that Christ dwells in the inner man, then we shall begin, with the other saints, to stretch ourselves toward those things too, so that we may comprehend with a keen mind what is the breadth, and length, depth and height; and not only this, but we shall also desire to know the surpassing love of knowledge of Christ; so that after all these things have been fulfilled in us in order and reason, then we may be filled in all things with the fullness of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
