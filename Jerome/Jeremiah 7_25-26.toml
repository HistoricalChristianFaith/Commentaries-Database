[[commentary]]
quote='''
And I sent to you my servants, the prophets, by day, rising at daybreak and sending; and they did not hear me nor incline their ear, but they hardened their neck and wrought worse than their fathers. Just, therefore, is the wrath of the Lord, which has been kindled and has dripped upon a contemptuous and stiff-necked people that refuses to hear the words of God. But how God sends the prophets either by night or at daybreak and by day, we have said above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
