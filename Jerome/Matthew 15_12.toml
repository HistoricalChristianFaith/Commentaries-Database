[[commentary]]
quote='''
In one of the Lord's discourses the whole superstition of Jewish observances had been cut down. They placed their whole religion in using or abstaining from certain meats.

As this word 'scandalum' (offence or stumblingblock) is of such frequent use in ecclesiastical writings, we will shortly explain it. We might render it in Latin, 'offendiculum,' or 'ruina,' or 'impactio;' and so when we read, Whosoever shall scandalize, we understand, Whoso by word or deed has given an occasion of falling to any.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then his disciples came and said to him: Do you know that the Pharisees were scandalized when they heard this word? By a single saying the whole superstition of the Jewish observances had been struck down, for they think their religion lies in the eating and abhorring of foods. And since the word scandalum is often used in the writings of the Church, we must say briefly what it signifies. Scolon and scandalum we can call an obstacle, or a fall and a striking of the foot. So when we read: Whoever causes any one of these least ones to stumble, we understand this: he who by word or deed has given anyone an occasion of falling.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
