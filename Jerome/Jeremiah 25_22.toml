[[commentary]]
quote='''
And to the kings of the islands which are beyond the sea. He passes over to Cyprus and Rhodes and the islands which are called Kyklades [the Cyclades]; for these too were occupied by the Babylonians.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
