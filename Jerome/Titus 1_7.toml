[[commentary]]
quote='''
That a priest must avoid covetousness even Samuel teaches when he proves before all the people that he has taken nothing from anyone. And the same lesson is taught by the poverty of the apostles who used to receive sustenance and refreshment from their brothers and to boast that they neither had nor wished to have anything besides food and clothing. What the epistle to Timothy calls covetousness Titus openly censures as the desire for filthy lucre.
'''
source_url='https://www.newadvent.org/fathers/1102069.htm'
source_title="LETTERS 69.9"

[[commentary]]
quote='''
For a bishop must be without crime, as the steward of God: not insolent, not irascible, not given to wine, not a striker, not a seeker of shameful gain. It is required, then, among stewards that one be found faithful, and not, eating and drinking with drunkards, strike the menservants and maidservants; but let him await the uncertain coming of God, and give his fellow servants their food in due season. Now between the steward (of the estate) and the household there is this sole difference: that a fellow servant has been set over his fellow servants. Let the bishop and the presbyter know, then, that the people are his fellow servants, not his servants. The other things that follow are set within our power: Not insolent, that is, not swelling and pleased with himself because he is a bishop, but, like a good steward, seeking what benefits the greater number. Not irascible. He is irascible who is always angry, and is stirred by the slight breeze of a reply or of an offense, like a leaf by the wind. And truly nothing is more foul than a raging teacher, who, though he ought to be gentle (and according to what is written (2 Tim. 2): "But the servant of the Lord must not quarrel, but be humble toward all, a teacher, patient, instructing in gentleness those who oppose"), on the contrary, with grim look, trembling lips, wrinkled brow, unbridled abuse, a face changing between pallor and redness, roars with shouting, and does not so much draw back the erring to the good as hurl them headlong into evil by his savagery. Hence it is that Solomon also says: "Anger destroys even the wise" (Prov. 15); and: "The anger of man does not work the righteousness of God" (Jas. 1:20). Nor yet is he who is sometimes angry irascible; but he is called irascible who is frequently overcome by this passion. He also forbids the bishop to be given to wine, as is written to Timothy: "Not given to much wine" (1 Tim. 3:8). But what a thing it is to see a bishop given to wine, so that, his senses seized, he either raises a laugh against the seemliness of gravity and guffaws with slack lips, or, if he has a little sadly remembered something, bursts out among the cups into sobs and tears. It would be long to go through each point and unfold the madnesses that drunkenness prompts. You may see some turning their cups into weapons, throwing a goblet in the face of a fellow guest; others, with torn clothes, rushing to wound others; some shouting; some dozing; he who has drunk more is counted the braver; it is a ground for accusation, when adjured by the king's name, not to have drunk the more often. They vomit in order to drink, they drink in order to vomit. The digestion of the belly and the throat are taken up with one office. Let it suffice to have said this now: that according to the Apostle, in wine there is licentiousness. And wherever fullness and drunkenness have been, there lust holds sway. Look at the belly and the genitals: the order of the members follows the character of the vices. I shall never think a drunk man pure; for even if, put to sleep by wine, he has slept, he could still have sinned through wine. Yet we marvel that the Apostle condemned fondness for wine in bishops or presbyters, when in the old Law too it was commanded that the priests, when they enter the temple to minister to God, should drink no wine at all (Lev. 10); and that the Nazirite, as long as he grows his holy hair and looks on nothing defiled, nothing dead, should abstain both from wine and from raisins and from the weaker drink that is usually made from grape skins, and from all strong drink, which turns the mind away from its whole soundness (Num. 6). Let each say what he will: I speak my own conscience: I know that abstinence, when interrupted, has harmed me, and when resumed has helped me. After fondness for wine he commands this, "that he be not a striker": which, even understood simply, edifies the hearer, that he should not readily stretch out his hand to strike, nor burst out like a madman to beat another's face. But it is better that we call him not a striker who, gentle and patient, knows in due time what is to be said or what kept silent, and does not strike the conscience of the weak with useless speech. For the Apostle, in forming the leader of the church, does not forbid him to be a boxer and a pancratiast [παγκρατιαστὴν, that is, an athlete] (which is censured even in a common man and in any Gentile whatever, if it is found in him), but this, as I said: that he should not, being insulting and garrulous, destroy one whom he could have corrected by modesty and mildness. A craving for shameful gain also ought to be foreign to one who is to be a bishop. For there are many teaching what they ought not, for the sake of shameful gain, who overturn whole houses and think piety to be a source of profit. "But better is", according to Solomon, "a modest receiving with righteousness than many fruits with iniquity" (Prov. 16:8); and a good name in poverty is rather to be chosen than a very bad name in riches. A bishop who desires to be an imitator of the Apostle, having food and clothing, ought to be content with these alone (1 Tim. 6). Those who serve the altar should live from the altar (1 Cor. 9). Let them live, he says, not grow rich. Hence also the copper is shaken out of our belt, and we are clothed in a single tunic only (Matt. 10 and Mark 6), and we take no thought for the morrow. It is a craving for shameful gain to take thought for more than the present. Up to this point it has been commanded by the Apostle's word what a bishop or presbyter ought not to have; now, on the contrary, what he ought to have is set out.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
