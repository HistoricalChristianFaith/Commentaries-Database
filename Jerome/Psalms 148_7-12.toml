[[commentary]]
quote='''
Let someone say: You speak according to the literal sense, you do not speak allegorically: if you speak according to the literal sense, why do first the deeps, and snow, and hail, then the fruit-bearing trees, and the other irrational things praise the Lord, and last of all man? Let us read Genesis, and according to the order of the birth and the creatures, so shall we also see all things praise. For there it is written that first those living creatures were made which are in the water: then were made those which are on the earth: then the flying things were made: and afterward he made man alone. Therefore, as each was first made, so let it praise the Lord. But there is another sense. O man, all these things which I have named, for whose sake were they made? Beasts, serpents, fruit-bearing trees, feathered fowl: all these praise God in this, that they do not change their nature. For he set a decree, and it shall not pass away. Imitate therefore the things that serve you. They were made, that they might serve you: you were made, that you might serve God. They serve you: imitate the things that serve you, and serve God, just as they too serve you, and through God serve. To whom is glory for ever and ever. Amen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
