[[commentary]]
quote='''
The floods have lifted up, O Lord, they have lifted up their voices; from the voices of many waters, wonderful are the surgings of the sea. As many words, so many meanings: as many little verses, so many sacraments. The floods have lifted up their voices. This is what is said in another place: 'The rush of the river maketh glad the city of God.' And in another place: 'The rivers shall clap their hands together.' The floods seem to me to be those which water the whole world, the apostolic and prophetic dignities. The floods have lifted up their voices. Proclaiming the praise and glory of the Lord, announcing his judgments through the whole world. 'Their sound went out into all the earth, and their words unto the ends of the round world.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_070.html'
source_title="Homily 70, on Psalm 92 (Alternate Series)"
