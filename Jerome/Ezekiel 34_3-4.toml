[[commentary]]
quote='''
As for what follows: You ate the milk and covered yourselves with the wool, it is by a μεταφορὰν [metaphor] of shepherds that he speaks to the princes — of whom it is also written in another place: Who devour my people like a meal of bread —; in the milk understand all wealth, in the wool the manifold variety of garments. And what is said: And what was fat you slaughtered, speaks of the rich of the people, whom the wicked princes in the churches are said to slaughter, in that they praise them and dare not rebuke their vices — of whom the prophet also says: My people, those who call you blessed lead you astray, and trip up the path of your feet; of whom James too speaks, saying that when they have come in to them, clothed in costly garments and with a gold ring, they are honored by them, and to the holy poor it is said: But you, sit on the footstool, or on the ground, or stand there — what is weak they do not strengthen or make firm — whence Paul says: Receive the weak, and: Take up the one weak in faith, and: Many weak among you and sick, to whom is sent the divine word of which it is written in the Psalms: He sent his word and healed them, and rescued them from their corruptions —; 'and what is broken', he says, 'they do not bind up', by no means taking account of the mortal wounds among the peoples, such as the adulterer, the murderer, the sacrilegious man; 'and what is cast off, or what they see straying, they do not bring back', allowing them to be deceived by heretics; 'and what has perished they do not seek', desiring not so much to save the lost as to devour those who are in the churches, but ruling over them with harshness and with power — which properly pertains to the haughtiness of bishops, namely of those who disgrace the dignity of their name by their works and take up pride in place of humility, so that they think they have attained an honor, not a burden, and whomever they see in the church taking the lead and possessing the word of God, they strive to oppress; whence according to the Seventy it is written: And what was strong you afflicted with toil —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
