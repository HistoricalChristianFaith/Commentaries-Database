[[commentary]]
quote='''
And in saying: 'I spoke to you' — that is, God himself through the prophets — or: 'They spoke to you' — so that 'my prophets' is understood — 'and you in your abundance said: I will not hear', he convicts her of pride, and of having abused the greatness of her riches to despise God, and he relates that not only at this time but from the beginning, when she was led out of Egypt, she did not hear the voice of God; whence all her shepherds and princes too have been scattered hither and thither and have bowed their necks to the Babylonian captivity. And in adding: You who sit in Lebanon and nest in the cedars, he taunts her arrogance, which had grown out of the abundance of all things, and says that like a woman in childbirth sudden pain and an unexpected captivity will come upon her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
