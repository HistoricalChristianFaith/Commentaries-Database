[[commentary]]
quote='''
Would that I were not a man who has the spirit, and that I rather spoke a lie. I will drip for you into wine and into drunkenness, and this people will be the one upon whom it drips. Gathering I will gather Jacob, all of you; I will bring together into one the remnant of Israel alike. I will set him like a flock in the sheepfold, like cattle in the midst of the folds. They will be in tumult from the multitude of men; for he will go up opening the way before them; they will divide and pass through the gate and go out by it; and their king will pass on before them, and the Lord at their head. In this section too the Seventy translators differ much from the Hebrew. Therefore let us first expound according to what has been handed down to us by the Hebrews, and afterwards, if God wills, we shall treat of their translation. O Jewish people, to whom belong the promises, and whose are the covenants and the law, and from whom is Christ according to the flesh, to whom, when the Babylonians or the Romans were threatening, I said: Arise and go into captivity, since there is no rest for you in this land, which because of its uncleanness will be corrupted by a final devastation, do not think that I speak willingly and proclaim with joy what I see coming; I would wish myself to be anathema for my brothers, who are Israelites. Would that I spoke from my own mind and did not have the Holy Spirit; and that, counted rather among the false prophets, I alone might perish, and the things I say might not be true; and that so great a multitude might believe in the Son of God, and not be handed over to perpetual captivity. But since I am a prophet, and speak by the Spirit of God, and, sent by the Godhead, proclaim the truth, for this reason I will drip my word for you into undiluted wine, which will make you drunk and cause you to fall. And while I drip, and sing of the evil of the captivity to come, this people will receive my rains, that is, willing or not, it must endure what I say.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
