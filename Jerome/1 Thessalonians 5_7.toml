[[commentary]]
quote='''
Let each one call his conscience to mind and recall the works of darkness in darkness, and let him know that it is written: Everyone who does evil hates the light, lest he be reproved by the light, and he will understand that this has been fulfilled in himself: He who is drunken is drunken by night, which cannot stand according to the letter: for how many are drunken at luncheons and banquets by day?; but because the drunkenness of the heart, which offends God, belongs to darkness and not to light, therefore: Whoever is drunken is drunken in the night.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
