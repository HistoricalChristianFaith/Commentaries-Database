[[commentary]]
quote='''
And outside the inner gate the chambers of the singers in the inner court, which was at the side of the gate looking toward the north, and their faces toward the southern way, one at the side of the gate which looked toward the way of the north. And he said to me: This is the chamber which looks toward the way of midday, for the priests who keep watch in the charges of the temple. Further, the chamber which looks toward the way of the north shall be for the priests who keep watch for the ministry of the altar: these are the sons of Zadok, who from the sons of Levi come near to the Lord to minister to him. And he measured the court, in length a hundred cubits and in breadth a hundred cubits, in a square, and the altar before the face of the temple. And he brought me into the vestibule of the temple; and he measured the vestibule, five cubits on this side and five cubits on that, and the breadth of the gate, three cubits on this side and three cubits on that; and the length of the vestibule twenty cubits and the breadth eleven cubits, and by eight steps one went up to it, and their columns on the fronts, one on this side and another on that. In place of 'chambers' the Seventy translated 'exedrae'; and what we said, exedrae or chambers 'of the singers', was passed over by them; and again, after the measure of the vestibule of five cubits on this side and five cubits on that, they added of their own: And the breadth of the gate of fourteen cubits, whereas in the Hebrew there is set only: And the breadth of the gate of three cubits on this side and three cubits on that. I have advised the reader of these things so that he may not be disturbed by the diversity of the translations, but that, in the present place and especially in the measures of the temple, he may be content with the Hebrew truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
