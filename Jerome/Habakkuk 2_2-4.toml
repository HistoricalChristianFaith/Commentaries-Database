[[commentary]]
quote='''
And the Lord answered me, and said: Write the vision, and make him plain upon tablets, that he who reads him may run through; for the vision is still far off, and he will appear at the end, and will not lie; if he delays, wait for him, for coming he will come, and will not tarry. Behold, he who is unbelieving, his soul will not be upright in himself. But the just shall live in his faith. LXX: And the Lord answered to me, and said: Write the vision, and plainly on boxwood, that he who reads may pursue these things; for the vision is still for a time, and will rise at the end, and not in vain. If he fails, wait for him, for coming he will come and will not tarry; if he draws himself back, it will not please my soul in him. But the just shall live by my faith. For tablets and boxwood, which in Hebrew is called alluoth, Symmachus translated pages. And where the Seventy put: But the just shall live by my faith, all alike translated, shall live by his faith. Indeed Symmachus, translating more expressively, says: But the just shall live through his own proper faith, which in Greek is said ὁ δίκαιος τῇ ἑαυτοῦ πίστει ζήσει; for baemunatho, which means in his faith, if it had the letter iod and not uau at the end, as the Seventy thought, and were read Baemunathi, they would rightly have translated in my faith. But as it is, the likeness of the letters uau and iod, which differ from one another only in size, was the cause of the error. Why this was said, the following discussion takes in.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
Moreover, as to what we translated for vision: For the vision is still far off, and if he delays, wait for him, that is, the vision (uisum), let no one, deceived by error, think that I put uisus, which is masculine and less usual in Latin, for uisio, which is feminine. For hazon, which Aquila translates ὁραματισμὸν (vision), is called among the Hebrews uisus, in the masculine gender, and to the end, under the same gender of the vision, that is, of uisus, the masculine inflection is kept. But the Seventy, saying: Write the vision, and afterwards: If he fails, wait for him; for coming he will come, and will not tarry; if he withdraws himself, it will not please my soul in him, first translated uisio in the feminine gender, which among the Hebrews, as we have said, is masculine. Then, following the Hebrew gender, where it is inflected in the masculine, wait for him, and it will not please my soul in him, they too inflected it in the masculine gender. Whereas surely they ought, in keeping with their first translating uisio, to have put the feminine gender of the vision in the rest also, so as to say: Wait for her for coming she will come; but if she withdraws herself, it will not please my soul in her, that is, in the vision. This for this reason, that we might not seem to keep silent about what we knew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
