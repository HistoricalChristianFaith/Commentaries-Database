[[commentary]]
quote='''
The disciples of contrary dogmas too, when their lies have been crushed and their altars and groves overthrown, will say too late: We do not have the kings who formerly ruled over us, by whose deceptions we did not fear the Lord; for what did it profit us to follow those whose help we do not feel in our need? They will say these things seeking some excuse, so that they may seem to have erred not through themselves but through very bad teachers. Hence also the LXX translated their words as false excuses, which the prophet shuns, saying: Do not incline my heart to words of malice, to make excuses in sins. We gladly applaud our own vices, and, overcome by pleasures, we plead the weakness of the flesh or the harsh commands of our elders; hence the words and visions of the heretics will be useless. And they will strike a covenant, not at all with God, but with bitterness, which, when the day of judgment has come, will spring up over the furrows of their field; so that those who sowed in joy may reap in tears; those who laughed may weep; those who had consolation may mourn.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
