[[commentary]]
quote='''
Since, therefore, God called them, rising by night, so that he might free them too from darkness, he threatens them that he will do to the temple in Jerusalem things like those he did to the place Shiloh, where the tabernacle first was, so that like sins may be struck by an equal sentence. And just as the Lord cast out the seed of Ephraim, that is, the ten tribes, which were called Israel and had princes on account of Jeroboam son of Nebat, of the tribe of Ephraim, which was likewise called the tribe of Joseph, so he testifies that he will also cast away Jerusalem and the tribe of Judah with Benjamin. He cast away Shiloh, therefore, and he will cast away the temple too; he cast away the ten tribes, and he will cast away the two as well. Whatever is said to that people, let us understand it of ourselves too, if we do like things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
