[[commentary]]
quote='''
The watchman of Ephraim with my God, the prophet, has become a snare of ruin over all his ways; madness in the house of his God; they have sinned deeply, as in the days of Gibeah; he will remember their iniquity and will visit their sins. LXX: The watchman of Ephraim with God, a prophet; a crooked snare over all his ways; they contrived madness in the house of God; they have been corrupted according to the days of the hill; he will remember their iniquities; he will take vengeance upon their sins. God gave princes for this purpose, that they might correct the people when it transgressed, and draw it back to the right road. Whence he also says to Ezekiel: I have made you a watchman for the house of Israel. Therefore Jeroboam was given among the people as a watchman, and as a prophet with my God, that is, with God, who speaks these things to Hosea. But he, according to what is written above: You have become a snare to the watch and a net spread out over Tabor; and you have turned aside victims into the depth, is even now called a snare of the people of Israel, because all fall in his snare, especially since he has set up, or contrived, madness in the house of God, that is, made the golden calf in Bethel, for this is interpreted house of God; and has sinned so deeply in wickedness, and has thus been sunk in the abyss of impiety, that he surpasses the crime which was once committed in Gibeah, when they killed the wife of the Levite returning from Bethlehem by unlawful intercourse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
Searching the ancient histories, I cannot find that any have rent the Church and led peoples astray from the house of the Lord, except those who had been appointed by God as priests and prophets, that is, watchmen. These, then, are turned into a crooked snare, placing a stumbling block in all places, so that whoever enters by their ways falls, and cannot stand in Christ, and is drawn away by various errors and carried by crooked paths to the precipice. These are the watchmen of Ephraim, who have contrived madness in the house of the Lord, that is, in the Church, or in the holy Scriptures, interpreting them perversely, or at least in each one of the believers, who is most rightly named the house of God. Therefore they have been corrupted and have perished according to the days of the hill, when they spoke iniquity against the heights and went up on vain roofs. God will remember their iniquity, by which they acted wickedly against their neighbor, leading him out of the Church, and he will visit their sins, by which they have sinned against their own souls. This is what we read in the psalm: Beside the path they have set a stumbling block for me. For unless one has seen the path of God, that is, has heard the name of Christ, he will not enter upon it. Therefore the heretics too, under the name of Christ, have set snares beside the path, so that he who believes that he walks in Christ, of whom we read that he himself is the way, may tread also in the snares of those who have contrived madness in the house of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
