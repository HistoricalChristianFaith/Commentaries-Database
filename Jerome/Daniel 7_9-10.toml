[[commentary]]
quote='''
Whenever God is introduced as sitting, he is introduced in two ways: either as a king, or as a judge. If as a king, one sees him as Isaiah did: 'I saw the Lord sitting upon a throne high and lifted up.' There he is introduced as a king reigning. But when he is introduced as a judge: 'The thrones were set, and the books were opened.' It is written in Daniel. What is said? The thrones were set, and the books were opened: that is, the Lord about to sit as a judge, and about to read over the works of all. The books which are now folded up shall then be opened. Everything that we do, that we speak, that we think — even for an idle word we are going to render an account: it is written in the books of God. Someone thinks there are books in heaven, where our sins are written. I think the books are our consciences, which shall then be opened, and each one shall see what he has done. 'Nothing is hidden, that shall not be revealed.' Therefore the thrones were set, and the books were opened. How many things are written in my book, and I dare not confess even to my brother nor to my friend. The angels know what I have done, the thrones know, the seraphim know: the Father and the Son and the Holy Spirit know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_014.html'
source_title="Homily 14, on Psalm 81"
