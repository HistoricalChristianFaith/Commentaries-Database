[[commentary]]
quote='''
But the just man has no left hand, and wherever he turns, "the angel of the Lord encamps round about those who fear him, and will deliver them." Do you wish to know that the just man has no left hand? When Moses, in the type of the cross, lifted both his hands to heaven, it is not written, "Aaron was at his right and Hur at his left," but that on this side stood Aaron and on that side Hur.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
