[[commentary]]
quote='''
That there might be fulfilled what was spoken through the prophet, saying: I will open my mouth in parables; I will pour forth things hidden from the foundation of the world. This testimony is taken from Psalm 77 (78). I have read in some codices, and the studious reader may perhaps find the same thing, that in the place where we have set down, and where the common edition has, That there might be fulfilled what was spoken through the prophet, saying, there is written: through Isaiah the prophet, saying. Because this was nowhere found in Isaiah, I think it was afterwards removed by prudent men. But it seems to me that originally it was published thus, namely that it was written: through Asaph the prophet, saying (for Psalm 77 (78), from which this testimony is taken, is inscribed with the title of Asaph the prophet), and that the first copyist did not understand Asaph, thought it a copyist's fault, and corrected it to the name of Isaiah, whose name was better known. It should be known, therefore, that in the psalms and hymns and songs of God not only David but also the others whose names stand at their head are to be called prophets, namely Asaph and Jeduthun and Heman the Ezrahite and Ethan and the sons of Korah and the rest whom Scripture mentions. And as for what is said in the person of the Lord, I will open my mouth in parables; I will pour forth things hidden from the foundation of the world, one must consider it more attentively, and it will be found that the going out of Israel from Egypt is described there, and all the signs are narrated that are contained in the history of Exodus. From this we understand that all those things that are written are to be taken parabolically, and that it is not so great a letter that sounds out plainly, but hidden mysteries too. For this is what the Savior promises he will speak, opening his mouth in parables and pouring forth things hidden from the foundation of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
Let someone say to me: You do violence to Scripture; for since the title has "The understanding of Asaph," you interpret this saying for me from the person of Christ. If we are Christians (and we are Christians, we who have received the baptism of Christ, and not only confess but also profess it) — because we are Christians, we ought to believe the evangelists. It is written in the Gospel according to Matthew: "When," it says, "our Lord and Savior had spoken in parables, and those men did not understand," and the rest of what is written in the Gospel. And afterward what did the evangelist add? "All these things," he says, "were done, that there might be fulfilled that which is written: I will open my mouth in parables, I will utter propositions from the beginning." You see, therefore, that the evangelist Matthew understands this from the person of Christ. For when he had introduced the Lord speaking in parables, and those men did not understand: "This," he says, "was done, that there might be fulfilled that which is written, I will open my mouth in parables, I will utter propositions from the beginning."

It seems to us that no question has remained, but attend carefully: for it is my concern not to declaim in the manner of a rhetorician, but to grasp the sense of the Scriptures. Indeed, what did the Lord and Savior himself say? "Search the Scriptures, and there you will find how it is written concerning me." And he said another thing to the Jews: "You err, not knowing the Scriptures nor the power of God." See what he says. "You err." Why? "Not knowing the Scriptures." But since you do not know the Scriptures, therefore you do not know Christ, who is the power of God and the wisdom of God. It is said, then, in Matthew: "These things," it says, "were done, that there might be fulfilled that which is written in Asaph the prophet." Thus it is found in all the old codices, but ignorant men removed it.

Indeed, many gospels to this day have it thus: "That there might be fulfilled that which is written through Isaiah the prophet: I will open my mouth in a parable, I will utter propositions from the beginning." This is not spoken by Isaiah, but by Asaph. Indeed, that impious Porphyry too puts forward this very thing against us, and says: "Your evangelist Matthew was so unskilled that he said, that which is written in Isaiah the prophet, I will open my mouth in a parable, I will utter propositions from the beginning." Therefore let us say it simply: just as, in the Gospel, it is written — it is written in Matthew and John that our Lord was crucified at the sixth hour, while again it is written in Mark that he was crucified at the third hour. This seems to be a discrepancy, but it is not a discrepancy. It was an error of the copyists: in Mark too "the sixth hour" had been written, but many, in place of the Greek episēmon (the numeral sign), thought it was a gamma. For just as there it was an error of the copyists, so here too it was an error of the copyists, that in place of Asaph they wrote Isaiah. For not knowing (since the early church was gathered from unskilled Gentiles) — therefore, when they read in the Gospel "That there might be fulfilled that which is written in Asaph the prophet," the one who first was copying the Gospel began to say: Who is this Asaph the prophet? He was not known among the people. And what did he do? So that while he corrected the error, he made an error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
