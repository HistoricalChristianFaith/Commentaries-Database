[[commentary]]
quote='''
For this gird yourselves with sackcloth, lament and howl, for the wrath of the fury of the Lord has not turned away from us or, as the Seventy translated, from you. In no other way can we escape the lion and most savage beast unless we do repentance and turn to the Lord, not only in mind but also in deed. For as long as he lays waste the Church and the land of Judah, and ravages Jerusalem as well, the wrath of God is manifest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
