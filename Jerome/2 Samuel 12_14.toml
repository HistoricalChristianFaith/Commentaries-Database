[[commentary]]
quote='''
And what follows: And his reproach the Lord will restore to him, agrees with that sense which Nathan speaks to David: You who have made the enemies blaspheme the name of the Lord, on account of this thing, that is, on account of this sin by which you killed Uriah, that very blasphemy and reproach, by which the Lord was blasphemed through you, will be turned upon your head.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
