[[commentary]]
quote='''
But that we may know that waters and cups signify teaching, the Lord speaks to the Samaritan woman: Everyone who drinks of this water will thirst again; but whoever drinks of the water that I shall give him will not thirst for ever. Therefore whoever drinks of the waters of the Samaritan woman, that is, of the heretics, will always thirst and will not be able to cool the burning of a parched throat, as Isaiah cries aloud about this very thing: As one who is thirsty dreams that he drinks, and when he has risen he still thirsts, and his soul has hoped in vain; so shall all the nations be that fight against Jerusalem. For truly whoever drinks of the waters of the heretics, and fights against Jerusalem, the Church of God, drinks in his sleep, and his soul is mocked by empty images. And when he thinks himself satisfied, then he will have the beginning of thirst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
