[[commentary]]
quote='''
Concerning the heretics the understanding is ready at hand, to whom, or of whom, it is said: If once you play the harlot, heretic, at least you, churchman, do not sin, nor go into Gilgal, the conventicles of the heretics, where the sins of all are revealed, and like swine they wallow in the mire. Nor think that you are going up to the proud and arrogant fictions of false dogmas. For there is not the house of God, but the house of the idol. Nor swear by the name of Christ, whose majesty you have polluted by mingling it with idols. For like a cow stung by the gadfly, the heretics have been struck by the burning arrows of the devil and have abandoned the knowledge of the law; therefore they will be pastured on the broad and spacious way that leads to death, and the patience of the Lord, the good shepherd, will nourish them for destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
