[[commentary]]
quote='''
At that time the sons of Judah and Jerusalem — by no means Israel and the ten tribes, which to this day dwell in the cities and mountains of the Medes —, were sold to the sons of the Greeks, to be banished from their borders, and the whole world was filled with the Jewish captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
