[[commentary]]
quote='''
Nevertheless let no one judge, and let no man be reproved; for your people are like those who contradict the priest; and you will fall today, and the prophet too will fall with you. LXX: So that no one is either judged, or anyone reproved; but my people are like a priest who will be contradicted, and he will be weakened by day, and the prophet too will be weakened with you. According to the Seventy translators, this which we have set down, so that no one is either judged, or anyone reproved, must be fitted to the preceding section. But let us follow the Hebrews. The sons of Israel who dwelt in the land, having been summoned to the judgment of God to hear the causes of the Lord's indignation and to recognize the past sins for which they were to be handed over to their enemies, now, because they persevere in their crimes and despise God with a shameless brow, hear: There is no need for you to come to judgment, to be reproved for your outrages; for you are of such shamelessness that not even when convicted do you have shame and modesty; but you contradict me, as if, like a disciple against his master, the common rabble, which does not have the dignity of the priesthood, were contradicting the priest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
