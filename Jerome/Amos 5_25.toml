[[commentary]]
quote='''
We ask how they offered victims and sacrifice in the desert not to God but to their king, whom they call Lucifer? From the time when they transformed the gold into the head of a calf, saying: These are your gods, Israel, who brought you out of the land of Egypt, everything they did is shown to have been done not for God but for idols. And as for our reading that afterwards they offered certain things to the Lord, they did it not willingly but out of fear of punishment, and because of the slaughter of those who fell on account of the idols; but the Lord regards not the things that are offered but the will of those who offer. Finally, whenever there was occasion, they always returned in heart to Egypt, longing for the garlic and onions and cucumbers and the flesh of Egypt, and despising the manna that was given from heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
