[[commentary]]
quote='''
Let us understand this according to the letter of Moses and Aaron. Moses indeed was led out, and Aaron, but not led into the land of promise. Jesus succeeded him. See what is written. Moses died in the desert, Aaron died, Miriam died; and this is what is written in the prophet: "And I will strike," it says, "three shepherds in one month." They died: for they could not enter into the land of promise. They only saw over against the land of promise, and could not enter. The Jews saw the land of promise, and could not enter. For they died in the desert, and their corpses are in the wilderness, of those who died in the desert. We, the sons, under Jesus as leader, came to the Jordan, and entered into the land of promise, and came to Gilgal, and were a second time circumcised with a spiritual circumcision, and the reproach of Egypt was taken away from us. Then Jesus himself our leader holds the sword, and always goes before us, and fights for us, and conquers our adversaries, and for seven days we go around Jericho, that is, this world. We sing with the priestly trumpets, and we go around Jericho, that is, this world, and its walls fall, and we enter in, and we are the victors. Then we conquer the city of Ai: afterward we come to Jebus, we come to Hazor, we come to other cities; we conquer the adversaries whom under Moses we could not conquer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="HOMILIES ON THE PSALMS 10"

[[commentary]]
quote='''
And I cut off, he says, three shepherds in one month. I have read in the commentaries of a certain writer that the shepherds cut off by the Lord's indignation are to be understood as the priests and false prophets and kings of the Jews; because after the passion of Christ all were cut off at one time, those of whom Jeremiah speaks: The priests did not say: Where is the Lord? Those who held my law did not know me. And the shepherds transgressed against me, and the prophets prophesied by Baal, and followed idols. Not content with this explanation, he wants the three shepherds cut off in one month to be taken as those who have sinned against the Father and the Son and the Holy Spirit; for all heretics sin either against one, or against two, or against three persons at once. Let him have said what he wished, for one must not detract from another's sense. To us the three shepherds who were cut off in one month seem to be Moses, and Aaron, and Miriam; of whom Miriam died in the first month, which is called Nisan, in the desert of Zin, and in the same place, on account of the water of contradiction, and in the same month, Moses and Aaron were condemned not to enter the land of promise. And so it came about that of the three shepherds, one was cut off by present death, the others by the sentence of a death to come. And my soul, he says, was straitened over them, namely over the three shepherds whom I had set over my flock. Because their soul also varied against me; for they did not glorify me at the water of contradiction. But if we refer it to the people, that the soul of the people varied against God, it must be explained thus: I was indignant with them for this reason, that they too, wavering between me and idols, fought against me in various ways.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
