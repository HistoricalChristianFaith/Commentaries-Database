[[commentary]]
quote='''
I will heal their breaches, I will love them freely, for my fury is turned away from him; I will be like the dew. Israel will spring up like the lily, and his root will break forth like that of Lebanon; his branches will spread, and his glory will be like the olive, and his fragrance like that of Lebanon. Those who sit in his shade will be converted, they will live on wheat and will spring up like the vine. His memorial like the wine of Lebanon. Ephraim, what more have I to do with idols? I will hear him and direct him; I, like a green fir tree; from me your fruit has been found. LXX: I will heal their dwellings; I will love them openly, for my anger is turned away from them; I will be like the dew. Israel will flower like the lily and will send out his roots like Lebanon; his branches will spread, and he will be like a fruitful olive, and his fragrance like that of Lebanon; they will turn back and sit under his shade; they will drink and be inebriated with grain, and his memorial will blossom like the vine, like the wine of Lebanon, Ephraim. What more has he to do with idols? I have humbled him and I will strengthen him, I am like a dense juniper; from me your fruit has been found. To those who have turned to repentance and, like an orphan, acknowledge the father whom they had left, God answered: I will heal the breaches, or their dwellings, in which they had been wounded, or broken, or in which they had dwelt badly: I will love them freely; which the LXX translated ὁμολόγως, plainly and openly or without any doubt. Now the Lord loves those who love him, of whom he also says in another place: I love those who love me. For I, who before was angry with them because of the sins they had committed, will now have mercy because of my clemency.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
