[[commentary]]
quote='''
For as to what is said according to the Seventy, The day of the daubing of brick, your blotting out, let us understand that it is said not to Jerusalem, as we expounded according to the Hebrew, but still to Babylon: that she too is to be blotted out, and trodden down like brick. And that day will thrust back the ordinances: not the ordinances of God, but those ordinances which, O Babylon, you had commanded to be observed against the law of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
