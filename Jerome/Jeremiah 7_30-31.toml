[[commentary]]
quote='''
For the sons of Judah have done evil in my sight, says the Lord; they have set their stumbling blocks in the house in which my name has been called upon, to pollute it, and they have built the high places — or the altar — of Topheth, which is in the valley of the son of Hinnom, to burn their sons and their daughters with fire, which I did not command nor think of in my heart. That the sons of Judah set up a statue of Baal in the temple of God we learn at the beginning of Ezekiel. Now 'high places', which in Hebrew are called 'bamath', or 'altar' of Topheth, which is in the valley of the sons of Hinnom, signifies that place which is watered by the springs of Siloam, and is pleasant and wooded, and to this day offers the delights of gardens. And this error of paganism took hold of all the provinces, so that they sacrificed victims at the heads of springs and in the loveliest groves, and the observance of every depraved superstition was kept. 'Tofeth' in the Hebrew tongue means 'breadth', and it is said to be written in the book of Joshua son of Nun about this place, which is in the valley of the sons of Hinnom and in Hebrew is called 'gehennom'; for 'ge' signifies pharanga, that is, 'valley', and 'hennom' signifies either a man's name or 'grace'. And the Hebrews hand down that 'gehennam' was named from this place, because, namely, the whole people of the Jews perished there by offending God, in which place they also consecrated their sons in fire to idols or offered them as a burnt offering, which he had not commanded them nor ordered by any sanction of the law. But if Jephthah offered his virgin daughter to God, it is not the sacrifice that pleases, but the mind of the one offering; for if a dog or an ass or any unclean animal whatever had first met the father as he returned from the slaughter of the enemy, he ought not to have offered it to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
