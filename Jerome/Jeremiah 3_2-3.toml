[[commentary]]
quote='''
And you have polluted — or killed — the land with your fornications and in your evils. Therefore the drops of the rains have been withheld, and there was no late rain or and you had many shepherds for your stumbling. The land was killed or polluted on account of the killing of those who perished by the fornication of idolatry; hence the blessing of all things was taken away, so that they suffered a drought of the word of God. Or she had shepherds through whom she offended God, so that those who ought to have been teachers, to keep others from error, became the authors of impiety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
