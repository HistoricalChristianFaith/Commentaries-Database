[[commentary]]
quote='''
These things the Lord God showed me: and behold, the maker of the locust at the beginning of the shoots of the late rain, and behold, the late one, afterwards the king's shearer. And it came to pass, when it had finished eating the grass of the land, I said: O Lord God, be merciful, I beseech you; who will raise up Jacob, for he is very small? The Lord had pity over this: It shall not be, said the Lord. LXX: Thus the Lord showed me: And behold, a brood of locusts was coming in the morning; and behold, one cankerworm, Gog the king. And it will be, if it has finished devouring the hay of the land, and I said: O Lord God, be merciful; who will raise up Jacob, since he is small? Repent, O Lord, over this; and this shall not be, says the Lord. The prophetic word foretells not only the things which are to come many ages later, but also things near at hand, which follow immediately upon the prophecy. For we men are accustomed to think much more about ourselves than about posterity, as Hezekiah says: Let there be peace in my days. This is so that those who see fulfilled in fact what was announced beforehand may be converted to the worship of God, in whose prophets is the truth of divination. The Lord therefore shows that Sennacherib king of the Assyrians, with a boundless multitude of his army, like a locust shearing everything, would come at the beginning of the late rain, when Israel was in need of the utmost mercy of God Almighty; and the maker and creator of this locust is the Lord. This locust comes at the beginning of the late rain, when all things are green and every field is in labour, and the blossoms of the various trees burst out into fruits of their own kind. And to show in one word what I mean, the blossoms of the trees and the blades of the crops promise an abundance of all things. These locusts, which were flying in early spring, were followed by a countless cankerworm, which came after the late rain and was called the shearer, or the shearing, of the king, because it laid everything waste and left nothing at all of green grass on the earth. This shearer, or shearing, Isaiah calls a sharp razor, which shaved off all the hairs and locks of the body of Israel. And when, he says, I was in doubt what this razor might be, he at once added: the king of the Assyrians. The razor, therefore, and the king's shearer is the army of the Chaldeans, which like the cankerworm ravaged everything, and consumed not only the crops but the trees, the hay and the stubble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"

[[commentary]]
quote='''
The LXX translators seem to me to have understood the Hebrew word gozi, which means shearer or shearing, as Gog, taking the letter zai for uau, and to have compared the countless multitude of the cankerworm to Gog, a most savage nation, which is described as about to lay waste the land of Judea. But what Aquila meant to say with Behold, the late one after the king of Gaza, since Gaza is called Aza in the Hebrew word, I do not well understand, unless perhaps he set down the very word gozi, and it was gradually corrupted by error into Gaza. Let us speak also spiritually: those who after works of righteousness — of which it is said in the prophet: Sow for yourselves in righteousness, and break up fresh ground for yourselves; and do not sow upon thorns — have committed grave sins, upon them is brought the brood, or generation, of locusts coming in the morning, when, as the darkness of night passes, they begin to recognize their own sins; and because they have not repented, the cankerworm is brought on, which is called Gog, the king; and Gog is rendered in our language roof, a certain proud and arrogant strength.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
