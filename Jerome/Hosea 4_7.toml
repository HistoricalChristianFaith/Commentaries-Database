[[commentary]]
quote='''
According to their multitude, so have they sinned against me; I will change their glory into disgrace, and they will eat the sins of my people, and will lift up their souls to their iniquities; and it will be, as the people, so the priest; and I will visit upon him his ways, and I will repay him his thoughts. LXX: According to their multitude, so have they sinned against me; I will turn their glory into disgrace; they will eat the sins of my people, and in their iniquities they will take their souls, and it will be, as the people, so also the priest; and I will avenge upon him his ways, and I will repay him his thoughts. As many men as Israel had, so many altars did it build to demons, in whose victims it sinned against me. Therefore their glory, in which they gloried for themselves and preferred idols to God, I will change into disgrace, so that both priests and peoples are taken captive.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
