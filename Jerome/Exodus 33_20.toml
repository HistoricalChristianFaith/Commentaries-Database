[[commentary]]
quote='''
The Hebrews say that Isaiah was put to death for two reasons: because he called them princes of Sodom and people of Gomorrah, and because, though the Lord said to Moses, You cannot see my face (Exod 33:20), he dared to say, I saw the Lord sitting upon a throne high and lifted up (below, Isa 6:1); not considering that the Seraphim covered the face and feet of God, or their own, for in the Hebrew it reads ambiguously, and that Isaiah writes that he saw only his middle parts. Man, then, cannot see the face of God. But the Angels even of the least in the Church always see the face of God (Matt 18:10). And, Now we see in a mirror and in a riddle, but then face to face (1 Cor 13:12): when we have advanced from men to Angels and can say with the Apostle: But we all, with unveiled face beholding the glory of the Lord, are transformed into the same image from glory to glory, as by the Spirit of the Lord (2 Cor 3:18). And yet no creature sees the face of God according to the proper character of his nature; and he is then discerned by the mind when he is believed to be invisible.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
