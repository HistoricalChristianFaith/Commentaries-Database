[[commentary]]
quote='''
However prudent and learned, then, the man may be who cuts down this wood with the sword of his speech, he will be endangered by it unless he takes careful heed; above all if what follows befalls him: If the iron is blunted and has troubled its face, that is, if his argument has been found weaker, and has not had the edge with which to cut down every contrary thing, but the ruling part of his heart is dulled; he will pass over to the opposite side, and a perverse strength will confirm him. For this is what the Seventy translators rendered: And with strength he will be strengthened; and superfluous wisdom of the strong man he will begin, he says; he will begin to have strength, a wisdom which is superfluous and does not help its possessor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
