[[commentary]]
quote='''
And the word of the Lord came to me, saying: Son of man, when a land sins against me so as to transgress, transgressing, I will stretch out my hand upon it, and I will break the staff of its bread, and I will send famine into it and kill from it man and beasts; and if these three men are in its midst, Noah and Daniel and Job, they by their righteousness shall deliver their own souls, says the Lord of hosts. But if I also bring most evil beasts upon the land to lay it waste, and it becomes impassable because there is no one passing through on account of the beasts, if these three men are in it, as I live, says the Lord, they shall deliver neither sons nor daughters, but they alone shall be delivered, and the land shall be made desolate. Or if I bring a sword upon that land, and say to the sword: Pass through the land, and I kill from it man and beast, and these three men are in its midst, as I live, says the Lord God, they shall not deliver sons or daughters, but they alone shall be delivered. But if I also send pestilence upon that land, and pour out my indignation upon it in blood, to take away from it man and beast, and Noah and Daniel and Job are in its midst, as I live, says the Lord God, they shall not deliver son and daughter, but they by their righteousness shall deliver their own souls. For thus says the Lord God: But if I also send my four most evil judgments, sword and famine and evil beasts and pestilence, against Jerusalem, to kill from it man and cattle, yet there shall be left in it a deliverance of those who bring out sons and daughters: behold, they shall come out to you, and you shall see their way and their inventions, and you shall be consoled over the evil which I brought upon Jerusalem, in all that I have brought in upon it. And they shall console you, when you see their way and their inventions, and you shall know that not in vain have I done all that I did in it, says the Lord God. Four plagues are brought upon the 'transgressing' land — or, as the Seventy translated, the 'sinning' land —: famine, beasts, sword, pestilence; and if these are brought one at a time, piece by piece, upon individual regions, and these three men, Noah and Daniel and Job, whose righteousness is proclaimed by the voices of the Scriptures, pray for the sinning land, not only will they be unable to preserve it, but not even their own sons and daughters, if these have committed the works of the sinning land; they will be able to deliver themselves alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
