[[commentary]]
quote='''
He, then, whose praises are so great, spoke these things to him whose law the islands and the nations await: I the Lord have called you in righteousness: of whom he himself speaks in the Gospel: Righteous Father, the world does not know you (John 17:25); so that he might be the God not only of the Jews but also of the nations. And I have taken hold of your hand, because whatever the Son works, the Father works. And I have kept you, you who yourself preserve all things. And I have given you as a covenant of the people of Israel, to whom I had promised beforehand that you would come. And as a light of the nations, which sat in darkness and in the shadow of death, that you might open the eyes of the blind, who before did not see God. And bring the bound out of confinement (Prov 5); for each one is bound fast by the cords of his own sins. And in the Gospel the Lord loosed him whom Satan had bound (Matt 8). Out of the prison house those who sit in darkness, those who were living in the night and gloom of error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
