[[commentary]]
quote='''
To whom then have you likened God, or what image will you set up for him? Has the smith cast a graven image, or has the goldsmith shaped it with gold, and the silversmith with plates of silver? The wise craftsman has chosen strong and incorruptible wood: and he will seek how to set up an idol that will not be moved. Having described the greatness of God and shown his power in part, the nations and islands being counted as a drop of a bucket and the tipping of a balance, and as dust, and the ceremonies of victims being rejected, he teaches in what follows why all the nations are as nothing in his sight and are counted as void: To whom have you likened God, or what image will you set up for him, who is spirit, and is in all things, and runs everywhere, and holds the earth as in his fist?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
