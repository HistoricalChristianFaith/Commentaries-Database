[[commentary]]
quote='''
He who loves silver will not be filled with silver, and he who loves riches will not enjoy them. But this too is vanity. For in the multitude of goods there are many who eat them; and what strength is there for the one who has them, except to see them with his eyes? Wherever we put silver (argentum), it can also be translated money (pecunia), according to the ambiguity of the Greek language: for ἀργύριον signifies both. Moreover Tully relates that men of money (pecuniosi) were first so called because they had many herds (peculia), that is, cattle (pecora). For that is what they called them in ancient times. But little by little, through misuse, the name passed over to something else. The miser, then, is described, because he is never filled with wealth, and the more he has, the more he desires. The judgment of Flaccus also agrees on this, who says: "The miser is always in want", and that of the noble historian, that avarice is lessened neither by plenty nor by want.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
