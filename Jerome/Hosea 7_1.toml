[[commentary]]
quote='''
When I wished to heal Israel, the iniquity of Ephraim was uncovered, and the malice of Samaria, because they have wrought a lie; and the thief has entered, the robber plundering outside. LXX: likewise. Israel often received many wounds of idolatry, and above all that one when in the desert they cast the head of a calf and said: These are your gods, Israel, who brought you out of the land of Egypt. Hence I, who prefer the repentance of the sinner to his death, and who afterwards say in the Gospel: The healthy have no need of a physician, but those who are sick, have tried to heal the wounds of my people. And while I was treating these with every art, so that the wretched people might be cured, suddenly Jeroboam of the tribe of Ephraim arose, to make the golden calves, and the malice of Samaria, which followed the impious king, was uncovered; for both king and people wrought a lie, that is, an idol. For just as an image is contrary to God, so a lie is contrary to the truth. And the king himself entered like a thief to the people of Israel, and like a robber plundered the unhappy people of God of their help. And the sense is: When I wished to blot out the old sins of my people on account of their ancient idolatry, Ephraim and Samaria found new idols. But this too can be said: that when the Lord and Savior, after the shedding of his blood and his Church gathered from Jews as well as from Gentiles, wished to heal the sins of the people and to bring them back to repentance, suddenly Ephraim, who promise an abundance of false dogmas, and the people of Samaria, who say that they keep the commandments of God, rose up and wrought the idol of false dogmas; and through them the thief and robber, the devil, entered the Church; or else the very doctrine of the heretics entered, like a thief and a robber, of whom the Savior too says in the Gospel: All who came before me were thieves and robbers. Thieves lie in wait and deceive by hidden fraud; robbers boldly carry off what belongs to others. For those who steal, steal by night and in darkness. Hence he says pointedly that the thief entered secretly, and that the robber plunders outside. For they cannot strip those whom they have taught of the garment of Christ unless they have led them out of the Church and made them walk in the perverse way of their doctrines. By the thieves and robbers who came before the Lord we ought to understand not Moses and the prophets, who are always praised by the mouth of the Savior, but the false prophets; and afterwards the heretics, who were not sent by the Lord but came of their own will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
