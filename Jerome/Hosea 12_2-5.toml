[[commentary]]
quote='''
We can understand Judah as the churchman, who is rebuked by the Lord because he is not mindful of his former benefits toward him, but daily joins sins to sins; and he sets forth what those benefits are. When the Church, he says, was bringing you to birth in faith, you supplanted your brother, the Jew or the Gentile, and received his birthright; and in your strength you were directed with the angel, either overcoming the adverse powers, or strengthened by the blessings of the angel, who is himself God; and you prevailed in figure against the angel, so that you might prevail against men, and you were strengthened. And when you had won the victory, you wept and besought the angel of the Lord, and, remembering your old sins, you found him in Bethel, that is, in the house of God, which is the Church, or in the house of ὢν, of sorrow and tears and repentance. And that we might know who this Judah was, there, he says, he spoke with us, that is, with us Christians; and from that time to the present day we are reckoned by the name of Christ, and with him directing us we are corrected.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
