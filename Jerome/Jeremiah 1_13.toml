[[commentary]]
quote='''
And the word of the Lord came to me a second time, saying: What do you see? And I said: I see a pot set on fire, and its face is from the face of the north. And the Lord said to me: From the north evils shall be opened — or shall blaze up — upon all the inhabitants of the earth. By certain degrees torments are assigned to sinners, so that they may come little by little to salvation: those who will not be amended when the rod strikes are sent into the bronze pot set on fire, of which Ezekiel writes more fully, which is kindled from the face of the north, signifying the Babylonian king and the city of Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
