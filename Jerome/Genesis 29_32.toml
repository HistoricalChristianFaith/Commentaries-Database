[[commentary]]
quote='''
And she conceived and bore a son and called his name Reuben. For brevity of reading I wish to give the etymologies of the names of all the patriarchs together. And she called he says his name Reuben, saying, Because the Lord has seen my humiliation. Reuben means 'son of vision'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Ruben [Reuben]: seeing son, or seeing in the midst.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
