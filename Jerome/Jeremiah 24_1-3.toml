[[commentary]]
quote='''
It must also be noted that this vision came to the prophet in the times of Zedekiah, after Jeconiah had been led into 'exile'; for he did not say 'captivity', because Jeconiah had handed himself over of his own accord. And by the smiths and setters we ought to understand either interpreters and teachers of the law, or craftsmen and enclosers of gold and gems, an art that is most precious among the barbarian nations. For 'setters' the Seventy translated 'bound men', to signify the evil of captivity, and of their own they added 'rich men', which is not found in the Hebrew. And he compares the basket that had good figs, and very good ones, to the figs of the first season — which in Greek are called proima —, namely to Abraham and Isaac and Jacob and Moses and Aaron and Job and the other holy men, of whom one of the twelve prophets speaks: Like a grape in the desert I found Israel, and like figs on the fig tree I found their fathers; whence we too are called sons of Abraham, and on the contrary it is said to the Jews: If Abraham were your father, you would do his works. But these baskets, which had good and bad figs, were not outside and beyond the Church, but before the temple of the Lord, because all things lie open to his knowledge. Nor do these figs that are outside have as great a bitterness as those that after the confession of faith have been changed by transgression; nor do the good figs that are not in sight of the temple of God — such as were the philosophers of the world, who, by natural goodness and by the understanding of the Creator, seemed not so much to follow the virtues as to praise them — have as great a sweetness as the figs have that are in the temple of God, among which were the prophets and apostles, of whom one fig said: I gave you milk, not solid food, and: My little children, with whom I am in labor again until Christ is formed in you. Hence it is said that in sight of the temple of God the good figs were very good and the bad figs were very bad.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
