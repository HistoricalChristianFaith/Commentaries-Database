[[commentary]]
quote='''
Indeed, you are just, O Lord, if I argue with you; however, I will speak to you about judgments. What is it that the way of the wicked prospers? It is well for all who break the law and act unjustly. You have planted them and they have taken root, they grow and bear fruit. You are near their mouths, but far from their hearts. Truly, this is a discussion of all those who act unjustly, and the meaning is summarised in the 72nd Psalm, in which the Prophet says: How good is the God of Israel to those who are upright in heart! But my feet were almost moved; my steps had well nigh slipped. For I was envious of the wicked, seeing the prosperity of sinners, etc. However, this is especially said against heretics, who, though they are impious, prosper in their ways; and they beget children whom they have deceived in their heresy, and they act deceitfully and unjustly, so as to rob the Church. And while they persist in their wickedness of opinion, they boast that they are planted by God, and that they have sent forth roots, and have begotten children and brought forth fruit. But although they often repeat the name of Christ, they do not have God as their dweller, according to that of Isaiah: This people honors me with their lips: but their heart is far from me.
And you, Lord, you know me: you have seen me, and you have tested my heart with you. Gather them together like a flock for the sacrifice, and sanctify them on the day of slaughter. There is no scandal, it is said, that the wicked, or all heretics, flourish for a time: For you, Lord, know me, and you have seen me, and you have tested my heart with you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Let us humor the Jews for a little while, and listen patiently to the absurdities of those among them who are called wise; and then we shall understand what are the Jewish fables, of men who, without the authority of Scripture, without any support of reason, invent certain fabulous animals; of whom Isaiah prophesied, saying: "This people honors me with their lips, but their heart is far from me. But they worship me in vain, teaching the doctrines and commandments of men" (Isa. 29:13). Approving this testimony in the Gospel, the Savior convicts them of having preferred the commandments of men to the Law of God. "For God says: Honor father and mother"; but they handed down: "That whoever says to father and mother, Whatever gift is from me will profit you, shall not honor his father and his mother" (Matt. 15:3 ff.).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"

[[commentary]]
quote='''
And the Lord said: Because this people draws near with its mouth, and glorifies me with its lips, but its heart is far from me, and they have feared me by the commandment of men and by doctrines; therefore, behold, I will proceed to cause wonder in this people by a great and astounding marvel: for wisdom shall perish from its wise men, and the understanding of its prudent men shall be hidden. LXX: And the Lord says: This people draws near to me with its mouth, and honors me with its lips, but its heart is far from me: in vain do they worship me, teaching the precepts and doctrines of men. Therefore, behold, I will proceed to remove this people: for I will remove them, and I will destroy the wisdom of the wise, and hide the understanding of the prudent. The Lord used this testimony against the Pharisees in the Gospel of Matthew, saying: Why do you also transgress the commandment of God for the sake of your traditions (Matt 15:3). And again: Hypocrites, well did Isaiah prophesy of you, saying: This people honors me with its lips, but its heart is far from me. And in vain do they worship me, teaching the doctrines and precepts of men (ibid., 6-9). In this we ought to note what we have often pointed out: that the Evangelists and Apostles did not translate word for word, nor follow the authority of the Seventy translators, whose edition was already being read at that time, but, as Hebrews and men instructed in the Law, used their own words without loss to the sense. The people of the Jews draws near to God with its mouth and lips, because it boasts that it holds to the worship of the one God and rejects idols; but its heart is far from him, because it does not receive the Lord Jesus Christ. For he who does not receive the Son does not receive the Father. And at the same time let us learn how a person draws near to God, or becomes far from him. He speaks through Jeremiah too: I am a God who draws near, and not from afar, says the Lord (Jer 23:23 LXX). We draw near to God with the mind, not with the body; as we read of Moses too: Moses alone drew near to God; but the others did not draw near (Exod 24:2). For he prayed to God in spirit and in truth, and approached him with understanding and spirit. But these, of whom it is written that they are taken from the womb and instructed from boyhood to old age, and meditate day and night on the Law of God, do not draw near to God, because they accept the traditions of the Pharisees and scribes, which make them far from God; and they are whitened sepulchres, which outwardly appear beautiful but within are full of dead men's bones: they chose Barabbas and rejected the Lord (Matt 23:27).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
