[[commentary]]
quote='''
And this man, who brought Ezekiel into the outer court and, so to speak, to the Holy of Holies, measured the court itself, in which were the two exedrae or chambers assigned as dwellings for the guardians of the temple or of the altar, and found a hundred cubits each of length and of breadth, in a square, so that the priests serving in the ministry of the Lord, who had entered by the strait and narrow way, may have very broad walks and may abide in the perfect and complete number of the virtues; and in the court itself was the altar before the face of the temple, so that the prayer of the saints to the Lord may never cease.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
