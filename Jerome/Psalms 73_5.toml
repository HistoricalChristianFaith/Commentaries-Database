[[commentary]]
quote='''
When you see a sinner abounding in riches, boasting of his power, rejoicing in health, delighting in his wife, surrounded by a crown of children, and that which is written being fulfilled: They are not in the labor of men, and with men they will not be scourged, say that in him the prophet's threat has been fulfilled: I will not visit upon your daughters when they have played the harlot and upon your brides when they have committed adultery.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
