[[commentary]]
quote='''
And you shall be confounded by Egypt, as you were confounded by Assyria; for from this one too you shall go out, and your hands shall be upon your head, since the Lord has crushed your confidence — or hope — and you shall have nothing prosperous in it. To avoid the onset of the Egyptians they fled for refuge to the Assyrians, whose protection was vain; for we read that they were conquered by the Egyptians. Again, to escape the wrath of the Assyrian they relied on the help of the Egyptians, who, as history relates, were overcome by the Assyrians. They are rebuked, therefore, because, abandoning hope in God, they rely on the help of men, which has all been crushed and so overthrown that they can find nothing of use in it. Hence he says: and from this one you shall go out, that is, from Egypt, as you went out from the Assyrians, and your hands shall be upon your head, and you will mourn that you vainly expected protection from the Egyptians. Let us recall the history, when Tamar, corrupted and violated by Amnon, her most wicked brother, placed her hands upon her head sprinkled with ash and so returned to her house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
