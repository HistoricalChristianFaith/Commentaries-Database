[[commentary]]
quote='''
Some of the Hebrews think it is said of Abraham, who was called righteous from the East, that is, from the Chaldeans, because he alone was found righteous; and he followed him, going out of his native land into a land he did not know; and God delivered into his hand the kings who had come against Sodom and Gomorrah, and before his sword and bow made them like stubble and dust; and he pursued them and returned in peace, and did not feel the course of the long journey; and this he did not by his own strength but by the mercy of the Lord, who from the beginning knew that these things would come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
