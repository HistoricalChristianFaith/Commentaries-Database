[[commentary]]
quote='''
Let us set out examples of horses. The Bridegroom speaks in the Song of Songs: To my cavalry among the chariots of Pharaoh he has likened you, my near one. Not that Christ compares the Church, or the Word of God the soul which he calls his bride, to the chariots of Pharaoh, but that every soul, however holy and perfect it may be, compared with God is as it were a chariot of Pharaoh, and a beast of burden. Hence Moses too says to the Lord: But I am ἄλογος, that is, irrational. And David: I have become like a beast of burden before you. Not that he is a beast of burden absolutely, but that he is a beast of burden before God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
