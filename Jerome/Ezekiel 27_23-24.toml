[[commentary]]
quote='''
Aran and Chenne and Eden were traders, Saba, Assur, Chelmad your sellers. They were your traders in many ways, in wrappings of hyacinth and of many-threaded cloths and of precious treasures, which were wrapped and bound with ropes. (LXX: "Charran and Channa and Edne, these were traders, Saba, Assur and Chalmad your dealers, bringing trade ※ in Machalim and in Galima ⁚ hyacinth, and ※ polymita ⁚ choice treasures bound with ropes.") These too are nations containing the names of various places. What was added in the Seventy from Theodotion: In Machalim and in Galima, Symmachus translated: In precious wrappings; 'polymita' too, for which Theodotion translated 'varied', we added from Aquila and Symmachus — the garments of the traders were so precious that they were carried in wrappings and bound with ropes of hyacinth —; 'Aran', or, as the Seventy said, 'Charran', sounds in our language 'holes'; 'Chenne', 'preparation'; 'Eden', 'delights', for which among the Seventy is 'Edne', which is not found in the Hebrew; what it sounds we do not know, and we ought not to seek the ἐτυμολογιὰν of a fictitious name. In the trade of Tyre, then, through the fleshly senses, which are indicated in the holes, is the whole preparation of the men of the world, who think it the only delights if they increase the commerce of the Tyrian city. Of 'Saba' we have spoken above; 'Assur' means 'directing'; 'Chelmad', or, as is contained in some copies, 'Cherma', is rendered 'vineyards'; no doubt those of the Sodomites, who come into the market of Tyre so that they may direct crooked things, or rather may rebuke with punishments and correct what had been perverted, according to that which is said in the Psalms: That you may destroy the enemy and the avenger.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
