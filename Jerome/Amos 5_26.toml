[[commentary]]
quote='''
But whatever is said according to the letter against the people of the Jews, refer all of it to those who worship idols under the name of Christ, and who, inventing perverse dogmas for themselves, carry the tabernacle of their king the devil, and the image of their statues and idols. For they do not worship one idol, but according to the variety of their doctrine they adore different gods, and the star of their god. Since he is an angel of Satan, he transforms himself into an angel of light, and falls from heaven like lightning, and the antichrist imitates Christ. And he fittingly added: Which you made for yourselves. For they did not receive these things from God, but fashioned them out of their own mind.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
