[[commentary]]
quote='''
For truly that which is written, To offer excuses excusing sins (Ps. 141:4.) happened to this servant, so that to slothfulness and idleness was added also the sin of pride. For he who ought to have honestly acknowledged his fault, and to have entreated the Master of the household, on the contrary cavils against him, and avers that he did it with provident design, lest while he sought to make profit he should hazard the capital.

Also, by this which this servant dared to say, Thou, reapest where thou sowedst not, we understand that the Lord accepts the good life of the Gentiles and of the Philosophers.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And he too who had received one talent came forward and said: Lord, I know that you are a hard man; you reap where you did not sow and gather where you did not scatter; and being afraid I went off and hid your talent in the earth; here you have what is yours. Truly, what is written: To make excuses in sins, befell this servant also, so that to sloth and negligence the charge of pride was added as well. For he who ought simply to have confessed his idleness and entreated the householder, on the contrary slanders him and says that he acted on prudent counsel, lest while he sought profit on the money he should put even the principal at risk.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
