[[commentary]]
quote='''
But now in Christ Jesus you who once were far off have been made near in the blood of Christ; for he is our peace.

God is everywhere, and is everywhere whole: from whom can anyone be separated, since all things are in him, and he himself says through the prophet: I am a God drawing near, and not from afar (Jer. 23:23)? And the Psalmist testifies: If I ascend into heaven, you are there: if I descend into hell, you are present (Ps. 138:8). Although, then, all things are in him, yet he is said to be far from the wicked, according to that saying: The Lord is far from the wicked (Prov. 15:29). He from whom the wicked are far is near to the saints. Accordingly, though he was far from the Ephesians too, in the blood of Jesus he was made near to them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
