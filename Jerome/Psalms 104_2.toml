
[[commentary]]
quote='''
For this is what follows: Clothed with light as with a garment. Now this is said in a special way of the Lord, that all things belonging to him are in the light, just as in Ezekiel the Cherubim are written to be "full of eyes." For example: I look at the sky and the earth, and I understand the creator. I see the trees in their season putting forth leaves, sending out blossoms, bearing fruit, and I understand the creator. I see the ant, and every tiny creature, and I understand the creator. Therefore the whole creation of God has eyes, and is full of understanding.

Stretching out the heaven like a skin. This means that from the beginning God stretched out the heaven, just as when someone opens a scroll and again rolls it back up, as is written elsewhere: "And the heaven shall be rolled up like a scroll."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_030.html'
source_title="Homily 30, on Psalm 103"
