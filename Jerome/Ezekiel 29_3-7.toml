[[commentary]]
quote='''
Behold, I am against you, Pharaoh king of Egypt, great dragon who lie (or sit) in the midst of your rivers and say: The river is mine, and I made myself (or them). And I will put a bridle (or a snare) in your jaws, and I will make the fish of your rivers stick to your scales (or wings), and I will draw you out of the midst of your rivers, and all your fish shall cling to your scales. And I will cast (or set down) you swiftly (or into the desert), and all the fish of your river upon the face of the earth (or of your field); falling, you shall not be gathered up nor brought together; to the beasts of the earth and the birds of heaven I have given you to be devoured. And all the inhabitants of Egypt shall know that I am the Lord, because you have become (or have been) a staff (or a reed rod) to the house of Israel, when they took hold (or it took hold) of you with their hand and you were broken, and you tore all their shoulder, and when they leaned upon you, you were shattered, and you loosened (or broke) all their reins. For the sake of brevity we mix both editions where they do not differ much from each other; otherwise, where there is great diversity, we set out both. Now he speaks against Pharaoh, the prince of Egypt, and, under his figure, addresses a great power to which Egypt was handed over to be ruled and which nonetheless grew proud against its Creator, claiming for itself dominion over the land and offering itself to the Egyptian peoples to be worshiped; and he speaks, in keeping with the situation of the province, as to a king: that he trusts in the flooding of the Nile and does not greatly desire rains from heaven, and thinks himself his own author, or boasts that the rivers, that is, the διωρυγάς [canals], and the streams of the Nile were made by himself: 'I will not,' he says, 'send an angel, but, O great dragon who lie and settle in the midst of your rivers, I myself will come to you to punish you; for you dared to say: The river Nile is mine and I am my own founder, or: I myself made the river by which all Egypt is watered. And when I come, I will put a bridle in your jaws, or bind with snares your mouth with which you spoke so grandly, and all your allies and leaders, whom they call fish, I will make cling to your wings or scales, so that, drawn out of the river, you may be cast out or set down: for you had lifted yourself up too high, in the desert; and you will fall upon the face of the field, or of your land, because Egypt is a province of plains, and your carcass will not be gathered up nor will you be brought together, that is: you will by no means be buried, but I will give you to the beasts and the birds of heaven to be devoured, so that, when they have seen these things accomplished in you by my judgment, the inhabitants of Egypt may know that I myself am the Lord; and these things will befall you because you deceived my people Israel with your help, so that they trusted not at all in God their creator but in you: you were to them a reed staff — according to Isaiah —, or a hollow rod and a most fragile reed, leaning on which they found their protection worthless, so that, as they rested their weight on you, you were broken and tore the shoulder and the hand by which you were held, and, while they felt secure in you, all their loins were shattered as they fell to the ground and received wounds instead of help'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
