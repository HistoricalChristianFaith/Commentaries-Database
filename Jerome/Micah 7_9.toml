[[commentary]]
quote='''
There follows: I will endure the wrath of the Lord, because I have sinned against him, until he justifies my cause, and executes judgment for me, and brings me out into the light; and I shall see his justice. All correction for the present seems to be a matter not of joy but of sorrow, but afterwards it will yield the peaceful fruit of justice to those who have been trained by it. The soul, therefore, perceiving that it has sinned, and has the wounds of sins, and lives in dead flesh, and needs cautery, says steadfastly to the physician: Burn my flesh, cut away the wounds, bind up all the humors and the noxious ῥεῦμα (flux) with a harsh draught of hellebore. It was my fault that I was wounded; let it be my pain that I endure so many torments, and afterwards receive health. And the true physician shows the soul, now safe and secure, the reason for the remedy, and teaches that he rightly did what he did. In short, after tortures and punishments, the soul, brought out of the outer darkness, and having paid the last farthing, says: I shall see his justice, and I will say: Your judgments are justified, O God. But if Christ has been made for us by God wisdom, and justice, and sanctification, and redemption, he who says that he sees justice after the wrath of God promises himself the sight of Christ. And this holds only of penitents. But it is much better not to have wounds, and not to need a physician. Healing is not the blessedness of those who are healed, but a solace after pain. Therefore let him who has been healed beware lest he sin again, and something worse befall him once more. We read in Leviticus, if indeed we read with open eyes, and the veil that is placed upon the law does not shut out the gaze of the inner eye, that leprosy is wont to arise in the weal and scar of a burn, and to change the color of the hair, and that a new foulness is added to the former disfigurement of the scar. This is so for this reason: that no one, secure about repentance because after sin he can say: I will endure the wrath of the Lord, because I have sinned against him, until he justifies my cause, should sin and need cautery, and, once healed, be wounded again.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
