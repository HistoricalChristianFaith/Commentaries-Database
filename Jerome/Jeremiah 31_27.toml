[[commentary]]
quote='''
Behold, days are coming, says the Lord, and I will sow the house of Israel and the house of Judah with the seed of men and the seed of beasts. And as I watched over them to pluck up and to demolish and to scatter and to destroy and to afflict, so I will watch over them to build and to plant, says the Lord. In those days they shall no longer say: the fathers have eaten a sour grape and the teeth of the sons are set on edge; but each one shall die in his own iniquity; every man who eats the sour grape, his teeth shall be set on edge. 'House' and 'house', that is, the house of Israel and the house of Judah, is not in the Seventy, but only: Israel and Judah, so that it reads: and I will sow Israel and Judah. And what he added: with the seed of men and the seed of beasts, we ought to refer to the rational and the simple.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
