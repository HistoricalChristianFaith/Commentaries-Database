[[commentary]]
quote='''
And I said: Ah, ah, ah, Lord God — or you who are, Lord God —, the prophets say to them: You shall not see the sword, and famine shall not be among you, but he will give you true peace in this place. And the Lord said to me: The prophets prophesy falsely in my name. I did not send them, and I did not command them, nor did I speak to them; a lying vision and deceitful divination and the seduction of their own heart they prophesy to you. Let the teachers hear this who promise prosperity to those who sin and persist in their vices, who say to the rich: 'You shall not see the sword of God's torments, and famine shall not be among you. For you will be filled with the words of God, and the Lord will give you most true peace in the place of the Church, or of Jerusalem'. But that, according to the Hebrew, he said three times: Ah, ah, ah, answers to what came before, where the Lord had threatened, saying: by the sword and by famine and by pestilence I will consume them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
