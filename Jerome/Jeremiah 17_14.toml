[[commentary]]
quote='''
He says to him who alone is the true physician, "Heal me, O Lord, and I shall be healed. Save me, and I shall be saved. You are my praise and my hope."
'''
source_url='https://www.newadvent.org/fathers/30112.htm'
source_title="Against the Pelagians 2.27"
[[commentary]]
quote='''
Heal me, O Lord, and I shall be healed; save me, and I shall be saved, since you are my praise! Many physicians in the Gospel had treated the woman with the issue of blood, who had spent all her substance on them, and yet she could be cured by none except by him who is the true physician and in whose wings is healing. Hence now too the prophet, having suffered reproaches from the people and having been often beset by plots, desires to be healed and to be saved by him who is his true praise and his true medicine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
