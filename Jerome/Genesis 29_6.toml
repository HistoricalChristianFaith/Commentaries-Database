[[commentary]]
quote='''
Rachel: sheep, or seeing the beginning, or vision of wickedness, or seeing God. This, however, comes about according to the diversity of accents and letters, so that names are changed even into contrary meanings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
