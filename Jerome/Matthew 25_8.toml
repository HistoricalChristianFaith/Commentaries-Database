[[commentary]]
quote='''
Or, These virgins who complain that their lamps are gone out, show that they are partially alight, yet have they not an unfailing light, nor enduring works. Whoso then has a virgin soul, and is a lover of chastity, ought not to rest content with such virtues as quickly fade, and are withered away when the heat comes upon them, but should follow after perfect virtues, that he may have an enduring light.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the foolish said to the wise: Give us some of your oil, because our lamps are going out. Those who complain that their lamps are going out show that they are partly shining, and yet they do not have an unfailing light nor lasting works. If anyone, therefore, has a virginal soul and is a lover of chastity, he must not be content with middling virtues, which quickly fade and wither when the heat comes up, but let him pursue perfect virtues, so that he may have everlasting light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
