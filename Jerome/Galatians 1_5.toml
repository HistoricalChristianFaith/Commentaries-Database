[[commentary]]
quote='''
We must also inquire what difference there is between "age" and "age of the age," or "ages of ages," and where it is used for a short span of time, and where for eternity: for in Hebrew "age," that is, OLAM (עלם), when it has the letter VAV placed in it, signifies eternity, but when it is written without VAV, the fiftieth year, which they call the Jubilee. For this reason too that Hebrew who, because of his wife and children, loving his master, is subjected to servitude with his ear pierced, is ordered to serve "for ever" (in sæculum) (Exod. 21), that is, up to the fiftieth year. And the Moabites and Ammonites (Deut. 23) do not enter the church of the Lord up to the fifteenth generation, and "for ever": because every hard condition was dissolved at the coming of the Jubilee. Some say that there is the same sense in "ages of ages" as in "holy of holies," in "heavens of heavens," in "works of works," in "Song of Songs": and that the difference the heavens have with respect to those whose heavens they are, and the holy things which, in comparison with holy things, are holier, and the works which, preferred above works, are better, and the Songs which excel among all songs, the age too has the same difference with respect to those which, in comparison with ages, are ages. Accordingly they explain the present age by saying that it is to be counted from the time when heaven and earth were founded, and that it runs up to the consummation of the world, when Christ is to judge all things. They also go back beyond this and advance their step into earlier things, disputing about past and future ages, whether they were or will be good or evil: and they fall into such deep questions that they have even composed books and endless volumes on this discussion. As for the fact that Paul's prologue concludes with AMEN, a word of the Hebrew tongue: AMEN (אמן) the Seventy translated γένοιτο, that is, "let it be"; Aquila πεπιστωμένος, "truly" or "faithfully." This the Savior too always uses in the Gospel, confirming his own words by AMEN.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
