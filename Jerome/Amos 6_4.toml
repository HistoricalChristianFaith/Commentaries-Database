[[commentary]]
quote='''
And what follows, You who sleep upon beds of ivory, we can interpret thus: he who is an athlete of the Lord, and is trained for wrestling, and prepares himself against the adverse powers, sleeps on the bare ground, imitating Jacob; and he puts at his head the stone which the builders rejected, and which has become the head of the corner. But those who give themselves to delights and luxury, and do everything for the sake of the belly, sleep on beds made of the ivory of a dead animal, and cling to unclean bones; and because vices seem beautiful and delight with their present sheen, they rest on their couches and are weighed down by the heaviest sleep. These do not eat solid and athletic food, by which the strength of wrestlers is reinforced, but soft and tender food, and of the left-hand side, such as are kids from the flocks and fattened calves, very tender, indeed still fed on milk, for this is what μοσχάρια γαλαθηνὰ means.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
