[[commentary]]
quote='''
So the first work of the flesh is fornication. He put the manifest ones at the beginning, so that we should not be in doubt about those in the middle. For whatever a man does is outside the body, but he who commits fornication sins against his own body. And we are not our own: for we have been bought with a price; let us glorify and carry God in our body. In this the fornicator is of greater guilt: because he takes the members of Christ and makes them the members of a harlot. For the two shall be in one flesh. He who is not a believer and does not believe in Christ makes his own members the members of a harlot; he who believes and commits fornication makes the members of Christ the members of a harlot. On the other hand, whether the unbeliever in his fornication violates a temple or builds a temple to an idol, I do not know. For demons are worshiped above all through vices. This one thing I know: that he who commits fornication after faith in Christ violates the temple of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
