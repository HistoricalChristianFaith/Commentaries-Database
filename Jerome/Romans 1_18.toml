[[commentary]]
quote='''
And at the same time observe the clemency of God: he did not say: When you inflict punishments, you will remember mercy, but: When you are angry. Now he who is angry sometimes does not strike, but only threatens. The Apostle too, perceiving this, says: For the wrath of God is revealed from heaven against all ungodliness and iniquity of men. But where it is revealed, it is not inflicted, it does not strike, but it is revealed to terrify, and so that it may not be inflicted on those who are terrified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
