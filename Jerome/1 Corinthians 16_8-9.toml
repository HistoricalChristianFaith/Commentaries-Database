[[commentary]]
quote='''
And in another place: But I will remain at Ephesus until Pentecost. For a great and effective door has been opened to me, but there are many adversaries (1 Cor. 16:8, 9). Now he remained at Ephesus until Pentecost, a time of gladness and victory, in which we do not bend the knee or bow down to the ground, but rising with the Lord are lifted up to the heights of heaven. And he remained because a door was open to him, and not a small door but a great one, so that, having bound and overcome the strong man, he might invade his house, plunder it, overturn it, and lead captivity captive (Matt. 12); and that strong man, gathering the columns of his henchmen, fought against the Apostle with his whole battle line, and was conquered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
