[[commentary]]
quote='''
Now the whole vision is this: the spirit lifting up, and the great cloud, and the four living creatures, and as many wheels following the living creatures and the spirit, which were deemed worthy to be under the firmament of God; and these, after they had been lifted up and had heard a voice as of many waters and as of the word of the sublime God, and the sound of a camp and of an army, let down their wings and showed their amazement by silence; and there appeared, seated upon the likeness of sapphire, as it were the likeness of a man, who from the loins upward had the appearance of electrum and from the loins downward the appearance of fire round about; after which a surer sign of mercy is given, like the look of the bow when it is in the cloud on the day of rain. We have spoken at greater length about this vision because it is both obscure and expounded in various ways by many. In what remains, so far as can be done without loss to the sense, we shall strive for brevity because of the size of the volume.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
