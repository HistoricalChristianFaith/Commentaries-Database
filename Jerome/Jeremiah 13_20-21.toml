[[commentary]]
quote='''
Lift up your eyes and see those who are coming — or you who are coming — from the north! Where is the flock that was given to you, your glorious herd? What will you say when he visits you? For you teach them against yourself and instruct them to your own head. The inhabitants of Jerusalem are commanded to lift up their eyes and see the Chaldeans coming from the region of the north; and the city herself is questioned, and it is said to her: 'Where is the flock that was given to you, your glorious herd? Where is your people, which you had received from God? Where is that multitude, so great and glorious that you would have believed the crowd of a whole province gathered into one place? What will you say when he visits you, the Lord, with his rod, and hands you over to the Babylonian enemies, whom you yourself taught against you, either to your own head or from the beginning, so that you fled to their help and followed their idols — they who, under the pretext of your friendship, learned by what road they should come to you?' Let the negligent Church hear this, that she herself teaches her adversaries how they can seize her in a spiritual captivity and tear her herd with the cruelty of beasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
