[[commentary]]
quote='''
And on the contrary the Lord is said to be in his holy temple; not in a temple made by hands, but either in the heavens, or in each of the saints, according to the Apostle, who says: Do you not know that you are the temple of God, and the spirit of God dwells in you? And elsewhere: Your bodies are the temple of God; or in the Son, as he himself says: The Father who abides in me, he does the works. Or certainly according to that saying, that the heavens and the lands, the seas and the whole world:

A spirit within sustains them, and mind, poured through all the limbs,

moves the whole mass, and mingles itself with the great body.

The whole world, which consists of heaven and earth and is enclosed by the circles of the heavens, is said to be the house of God. Hence the Apostle too says confidently: For in him, he says, we live, and move, and are.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
