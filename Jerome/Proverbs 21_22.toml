[[commentary]]
quote='''
Therefore the Lord, who dispenses all things by reason and does all things by true judgment, divides crushing upon the strong enemy, so as to bring misery upon the fortress which raises itself up against the knowledge of God. Of which we also read in Proverbs: The wise man entered strong cities and destroyed the fortress in which the ungodly trusted. This he does indeed against all worldly strength, but properly against the heretics, who try to strengthen the falsity of their dogmas with arguments and sophisms and the dialectical art. But the wise man destroys it, and, helped by the aid of God, shows every fortress to be most vain, so as to bring misery upon it, and, when its pride has been bowed down, he can say with the Apostle: Wretched man that I am, who will deliver me from the body of this death?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
