[[commentary]]
quote='''
And what follows: Built upon the foundation of the apostles and prophets, fits the first interpretation, the one in which we said above that before the passion of Christ Israel was near, and the Gentiles were far off, better than the second. We can use this testimony also against Marcion and the other ancient heretics who preach one God of the Law and another of the Gospel. For if those who are no longer strangers and sojourners, but fellow citizens of the saints and members of the household of God, have been built upon the foundation of the apostles and prophets, Christ Jesus himself being the chief cornerstone, in whom the whole building, fitted together, grows into a holy temple in the Lord, in whom the Ephesians too are built together into a tabernacle of God in the spirit, then there is one God, of one building and temple, which has been built upon the foundation of the apostles and prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Now the chief cornerstone, which holds both peoples together (or, according to the second interpretation, joins heavenly and earthly things), is Christ our Lord, the stone cut from the mountain without hands, of whom the Psalmist also testifies, saying: The stone which the builders rejected, this has become the head of the corner. This has been done by the Lord (Ps. 117:22). For he was rejected by the Pharisees, who seemed to have knowledge of the Law and to be building the temple of God with the commandments of the Law; and he was taken up by God as the cornerstone, so that he himself, in the middle, might hold the two walls together, and through him both peoples might have access to God. This cornerstone is, to those who do not believe, a stone of stumbling and a rock of offence: whoever falls upon it will be shattered; but on whomever it falls, it will crush him (Luke 20).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
