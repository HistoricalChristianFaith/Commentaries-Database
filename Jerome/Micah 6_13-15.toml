[[commentary]]
quote='''
When your princes were doing this, I did not wish to overthrow you at once, but little by little I began to strike you and to warn you with various blows. I sent famine upon you, I sent thirst, I sent diseases, and devastation by the enemy round about; the crop did not bring forth grain, the pressed olive did not yield oil, barren vintages denied the wine. Against the iniquities, and the deceitful measures, and the fraudulent weights, I brought these punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
