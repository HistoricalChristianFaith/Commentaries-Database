[[commentary]]
quote='''
Behold, he says, when misery and devastation pressed upon them, and the Assyrian and the Chaldean were eager to bind them as captives, they fled to Egypt. There Memphis will bury them, which at that time was the metropolis of Egypt, before Alexandria, which was formerly called No, received both the greatness of a city and its name from Alexander of Macedon. But what is said in the Seventy: Michmash will bury them, is not found in the Hebrew; but rather mamad, which is called desirable. From which it is clear that they were deceived by the similarity of the letters daleth and chaph, and in place of mamad, which all have translated desirable, they thought it was Michmash, a city of Egypt. We can also take what is said: For behold, they have set out from the devastation; Egypt will gather them, Memphis will bury them, of the tribe of Judah; when, after Gedaliah, whom Nebuchadnezzar had set over the land, was killed by Ishmael, the remnant of the people fled over to Egypt with Jeremiah the prophet, and there, when the Chaldeans afterwards pursued them, they were either taken captive or buried. And by the desirable things of their silver, which the nettle possesses, we shall understand country houses and all the adornments of country houses, which are bought at the price of silver. And what follows, the bur will be in their tents, signifies a long devastation, so that where once there were houses, there burs and nettles and thorns spring up.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
