[[commentary]]
quote='''
And when the prophet had seen this, he said to the Lord, not as above: Be merciful, I beseech you, but: Be still, or cease, so that by his prayers he might obtain that he whom he had already seen begin should cease, especially since there is no other who can raise up Jacob, fallen and very small and humbled, except the Lord, who is able to bring back into the land of Judah those taken captive and carried off into Chaldea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
