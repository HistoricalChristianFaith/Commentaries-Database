[[commentary]]
quote='''
And I will make to cease from the cities of Judah and from the streets of Jerusalem the voice of joy and the voice of gladness, and the voice of the bridegroom and the voice of the bride; for the land will be in desolation. When the place of idolatry has been turned into tombs, so that where they had offended God, there their corpses lie unburied, all gladness will be taken away from the city of Jerusalem that once was and from the other cities that were under its dominion, and all things will be filled with sorrow and groaning and desolation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
