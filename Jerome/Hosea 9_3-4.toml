[[commentary]]
quote='''
They will not dwell in the land of the Lord who have departed from the Church, and have returned in mind into Egypt, and eat the sacrifices of the Assyrians, that is, of demons; nor do they pour out to the Lord the wine with which they have been made drunk unto luxury, and neither the things they offer nor they themselves who offer please him. The sacrifices of the heretics are the bread of mourning and of tears; for all that they do will be turned into weeping. Nor will they be able to hear: Blessed are those who mourn, for they shall be comforted; but on the contrary they will hear: Woe to those who laugh, for they shall mourn. Whatever they offer, they offer not to God but to the dead, namely to those who have contrived wicked heresies; and whoever eats of their victims will be defiled. The blind will be led into the pit by the blind. Whatever they do, they do for the sake of delights, to deceive the people, to devour the houses of widows. We can call the bread of mourning the deadly words with which they speak iniquity against the Lord; and this bread does not enter into the house of God; for the conventicles of the heretics are called not the house of God, but dens of robbers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
