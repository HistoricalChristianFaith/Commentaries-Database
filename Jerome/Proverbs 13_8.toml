[[commentary]]
quote='''
The Lord yearns for believers' souls more than for their riches. We read in the Proverbs, "The ransom of a man's soul are his own riches." We may, indeed, take a person's own riches to be those which do not come from someone else or from plunder; according to the precept, "honor God with your just labors." But the sense is better if we understand a person's "own riches" to be those hidden treasures which no thief can steal and no robber wrest from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_071.html'
source_title="LETTER 71.4"

[[commentary]]
quote='''
And also those poor of whom it is written in Solomon: "The ransom of a man's soul is his own riches" (Prov. 13:8). But the poor man does not bear the threat. For he cannot hear the future terror of punishments, poor in faith, poor in grace, not having spiritual riches, nor the knowledge of the Scriptures, which are compared to gold and silver and precious stone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
