[[commentary]]
quote='''
Therefore thus says the Lord God: Behold, my fury and my indignation is kindled — or has dripped — upon this place, upon men and upon beasts and upon the trees of the region and upon the fruits of the earth, and it will be set alight and will not be quenched. He who had said above: Is it me they provoke to anger?, how does he now say: Behold, my fury and my indignation has dripped upon this place? And the sense is: 'I indeed am not angered by nature, but they act in such a way as to provoke me to anger, so that I seem to change my nature. Let them, therefore, feel me angry, which, so far as in them lies, they are trying to bring about.' And beautifully he does not say: 'has been poured out' my fury upon this place, but: has dripped, so as to signify a moderate punishment. But if in a drop of fury there is such harshness, what will happen if the whole downpour is poured out? But 'kindling' too can be understood thus: that what he long did not wish to do, he is compelled to do by the multitude of sins. And when God is angry, both men and the things that are men's will feel a like destruction. 'And it will be set alight', he says — no doubt the fury of the Lord — 'and will not be quenched, because the people do not do the things through which it could be quenched.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
