[[commentary]]
quote='''
And Almighty God says that he will do these things, at whose touch and nod the foundations of the earth are shaken, or melt, and every inhabitant of it is taken up with lamentation and mourning. He says these things to show the greatness of the divine power, lest perhaps he should indeed wish to do what he threatens, but his strength should not fulfil his will. But if the earth melts, or is shaken, and even insensible nature feels its Creator, how much more man, a fragile creature, the treasure of whose soul is shut up in earthen and bodily vessels? And as the river of Egypt runs down into the sea and is swallowed up, so also the land of Israel, of which he had said above: Who touches the earth and it melts, will go into captivity and will be devoured by the enemies; μετωνυμικῶς (by metonymy), the divine word signifying by that which holds, that which is held.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
