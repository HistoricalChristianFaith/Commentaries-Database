[[commentary]]
quote='''
Christ himself is a virgin. His mother is also a virgin. In fact, although she is his mother, she is still a virgin. For Jesus has entered in through the closed doors, and in his sepulcher—a new one hewn out of the hardest rock—no one is laid either before him or after him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_048.html'
source_title="LETTER 48.21"

[[commentary]]
quote='''
And he laid it in his own new tomb, which he had hewn in the rock, and he rolled a great stone to the door of the tomb and went away. He is laid in a new tomb, lest after the resurrection, while the other bodies remained, it should be pretended that another had risen. But the new sepulcher can also signify the virginal womb of Mary; and the stone set against the door, and a great stone at that, can show that the sepulcher could not have been opened without the help of many.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
