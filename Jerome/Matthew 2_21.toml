[[commentary]]
quote='''
He, rising, took the child and his mother. He did not say: he took his son and his wife, but the child and his mother, as a foster father, not a husband.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
