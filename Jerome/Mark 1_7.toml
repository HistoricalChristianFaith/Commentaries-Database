[[commentary]]
quote='''
As he himself bodily preceded Christ as his forerunner, so also his baptism was the prologue to the Lord's baptism.
'''
source_url='https://www.newadvent.org/fathers/3005.htm'
source_title="THE DIALOGUE AGAINST THE LUCIFERIANS 7"

[[commentary]]
quote='''
"One mightier than I is coming after me, the thong of whose sandals I am not worthy to stoop down and untie." The meaning of the words: "He must increase, I must decrease," is that the gospel must increase, but I, the law, must decrease. John, that is, the law in John, was clothed, therefore, in the hair of a camel, for he could not wear a tunic of the lamb of whom it is said: "Behold the lamb of God who takes away the sin of the world;" and again: "He is led like a lamb to the slaughter." In the law, we cannot wear a tunic from that Lamb.
'''
source_url=''
source_title="HOMILY 75"

[[commentary]]
quote='''
Whose shoes I am not worthy to carry. In another Gospel: Whose, he says, shoe's strap I am not worthy to loose. Here humility is shown, there a mystery: that Christ is the bridegroom and John does not deserve to loose the bridegroom's strap, lest his house be called, according to the law of Moses and the example of Ruth, the house of the unshod.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
