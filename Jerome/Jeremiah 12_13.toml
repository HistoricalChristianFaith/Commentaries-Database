[[commentary]]
quote='''
I beg you, therefore, and admonish you again and again: do not look to your military experience for a standard of clerical obligation. Under Christ's banner, do not seek worldly gain, lest having more than when you first became a clergyman, you hear people say, to your shame, "Their portion shall not profit them." Welcome poor people and strangers to your homely table, that with them Christ may be your guest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_052.html'
source_title="LETTER 52.5"

[[commentary]]
quote='''
They have sown wheat and reaped thorns; they have received an inheritance, and it will not profit them. LXX: You have sown wheat and reaped thorns; their clergy will not profit them. 'They expected better things', he says, 'and the worst came; they hoped for prosperity and suffered adversity; they received from the Lord an abundance of all things, which will not profit them'. According to the Seventy, however, all the heretics sow as it were wheat and reap thorns, while the Lord waited for them to bear fruit; and they did not do judgment, but a cry. This is said also to churchmen, who ruin the words of the Lord and his teaching by their evil manner of life, concerning whom it is added: their clergy will not profit them; for what can the name of bishop and of presbyter, or the rest of the ecclesiastical order, help them, when they are rather weighed down by their dignities, and the mighty suffer torments mightily, and the more has been entrusted to them, the more is required of them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Be confounded at the fruits — or at your boasting — because of the wrath of the fury of the Lord — or at the reproach in the sight of the Lord —. Thus says the Lord against all my most wicked neighbors, who touch the inheritance which I distributed to my people Israel: Behold, I will pluck them up from their land, and I will pluck up — or cast out — the house of Judah from the midst of them. And when I have plucked them up, I will turn — or return — and have mercy on them and bring them back — or make them dwell —, each man in his inheritance and each man in his land. It is said to those whom their clergy and the ecclesiastical order will not profit, that they should be confounded at their boasting and at the reproach before the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
