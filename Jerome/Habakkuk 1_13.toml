[[commentary]]
quote='''
But if we wish to understand it generally, of providence, the prophet asking: Why does the devil have so much power in the world, and, while God rules, another exercises tyranny? — the sense will be of this kind, and this exposition will be joined to what goes before: I know, O Lord my God, my Holy One, that because you provide and defend, we do not die, and I know that you have set the adversary for this reason, that through him, as through an executioner, you might chastise sinners and not slay them. I know that nothing unjust pleases you, and that your eyes are pure from all iniquity, and that you cannot look upon the sorrows of those who have been subjected to injustice. Yet I cannot find the cause why the unjust Cain kills the just Abel, and you are silent. Why, while the whale rages and devours everything, not only the smaller fish but also your own Jonah himself is devoured? Why does the wicked conquer, and the just is conquered? Nor do I say this as though I knew of anyone being justified in your sight and being without sin, or as though I were ignorant of human frailty; but just as Sodom and Gomorrah are just in comparison with Jerusalem, and the publican in the Gospel becomes more just by comparison with the Pharisee, so too this one who is oppressed by the devil is indeed a sinner, but he is more just than the one who oppresses him. Why, then, is there no measure, nor weight, so that, if once the just is oppressed and subjected, he may be subjected not to the wicked but to one more just than himself? Shall I say that anything happens without you, and that against your will the wicked can do so much? To think this is blasphemous. Since, therefore, you are the ruler and Lord of the universe, it must be you who do what cannot happen without you. And he says these things, not because the prophet himself thinks so, as I have testified above, but because he expresses human impatience in his own person; just as we often see the Apostle take upon himself the various opinions of men, and now say: But I see another law in my members, fighting against the law of my mind, and taking me captive in the law of sin, which is in my members. And, as though he were a beginner: Brothers, I do not consider that I have laid hold of it, and: We know in part, and we prophesy in part. And again, as though he were perfect: As many, therefore, as are perfect, let us be of this mind, when surely it does not belong to one and the same man to say that he knows in part and that he is perfect. And lest perhaps you think that this is not the Apostle's custom but our own argument, he himself says to the Corinthians: But these things, brothers, I have transferred to myself and Apollos for your sakes, that you may learn in us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
