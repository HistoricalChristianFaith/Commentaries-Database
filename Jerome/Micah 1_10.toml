[[commentary]]
quote='''
In Gath do not announce it, do not weep with tears; in the house of dust sprinkle yourselves with dust; pass over for yourselves, dwelling of Shaphir, confounded with shame; she who dwells in Zaanan has not gone out. The house of Ezel will receive mourning from you, the house that stood by itself, for she who dwells in Maroth has grown weak unto good; for evil has come down from the Lord to the gate of Jerusalem. The tumult of the chariot of astonishment for the one dwelling in Lachish is the beginning of sin for the daughter of Zion, for in you were found the crimes of Israel. Therefore he will give emissaries upon the inheritance of Gath; the house of lying, for a deception to the kings of Israel. Still I will bring an heir to you who dwell in Mareshah; the glory of Israel will come as far as Adullam. LXX: You who are in Gath, do not be magnified; you who are in Bachim, do not build out of a house of mockeries; sprinkle earth on your derision, you who inhabit its cities well; the inhabitress of Zaanan has not gone out. Mourn for the house next to her; she will receive from you a blow of pain, who began unto good, she who dwells in pains? For evils have come down from the Lord upon the gates of Jerusalem. The sound of chariots and horsemen, the dwelling of Lachish, is the chief of sin to the daughter of Zion, for in you were found the iniquities of Israel. Therefore he will give emissaries as far as the inheritance of Gath; vain houses, they were in vain to the kings of Israel, until I bring heirs to you, you who dwell in Lachish; the inheritance will come as far as Adullam. The Hebrew disagrees greatly with the translation of the LXX, and both my translation and theirs are wrapped in such great difficulties that, if ever we have needed the Spirit of God, and indeed in expounding his holy Scriptures we always need his coming, now most of all we long for him to be present, and to unfold what he spoke in the prophets, so that what he himself deigns to promise elsewhere may be understood of us too: Open your mouth, and I will fill it. Gath, as the history of Kingdoms also testifies, is one of the five cities of Philistia, near the border of Judea, and for those going from Eleutheropolis to Gaza it is even now a very large village; from there too came that Goliath of Gath whom David killed in battle. Since, therefore, the prophet, or rather the Lord through the prophet, had said: I will mourn and howl, I will go despoiled and naked; I will make a lamentation like that of dragons, and mourning like that of ostriches, for the wound of Samaria is desperate and incurable, and it has come even to Judah and has touched the gate of my people, Jerusalem, for this reason I still command with the voice of one weeping: Do not announce it in Gath, lest the enemies hear and rejoice; do not weep with tears, that is, let not even your grief burst out into sobs; hide your weeping, lest your adversaries exult; let your faces have no tears, though your breast have grief; do not go outside, but in the house of dust sprinkle yourselves with the crumbling ash of the ruins.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Gath means winepress; those, therefore, who are in Gath, that is, in the winepress, thinking that they have gathered the vintage of the fruit of life and trodden the cluster from the vine of Sorek, are lifted up into pride, not knowing that the cluster of the land of Judea is not found in the territories of the Philistines. Do not, he says, be lifted up, you who are in the winepresses. For your vine is of the vine of Sodom, and your shoot of Gomorrah, and your grape is of bitterness, and you have a cluster of gall, and the fury of dragons is your wine, the incurable fury of asps. For even if you should bear fruit — since your vintage is not only of Sodom and Gomorrah, but also of Egypt and the other hostile nations —, the Lord will give your fruit to the blight, and your labors to the locust, and will kill your vineyards with hail, and your mulberry trees with frost. Let not the likeness of wine deceive you, and do not call the bitter sweet; taste your wine more carefully, and you will find, in place of the wine of Sorek, the fury of dragons and the venom of asps. Therefore do not be proud, but rather humble yourselves under the mighty hand of the Lord, and pass over to that winepress of which he who comes up from Edom, and ruddy from Bozrah, speaks in Isaiah the prophet: I have trodden the winepress alone, and of the nations there is no man with me. Again, since there are others too of foreign race, for the province of the Philistines has many regions and cities, who through evil works and thoughts contrary to God say: We have been destroyed, but let us return and build up what has been destroyed. Hence they are also called the borders of impiety, and the people with whom the Lord is angry. To them it is said: You who are in Bachim, do not build from a house of mockeries. Bachim in our language signifies mourning and weeping. In short, except for the Seventy, all translated κλαυθμὸν, that is, weeping. You, therefore, who are engaged in works and opinions of this kind, which are worthy of weeping, do not renew a most wicked building; and do not suppose your own understanding to be God's edifice, nor build upon sand, lest, when the storm comes and your house falls, the empty labor offer laughter to those who see it. Rather, understanding that your building is worthy of derision, sprinkle your heads with its ruins and dust, and repent, because you wished without counsel to build a house that would fall.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
