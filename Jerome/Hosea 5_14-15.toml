[[commentary]]
quote='''
To the heretics too, and to a negligent Church, God is turned into a panther and a lion; and he will take from them the prey which they formerly snatched from the Church, so that those who had perished while free may be saved by being captured; and he will by no means dwell in the conventicles of the perverse, but will return to his place, of which he says: I am in the Father and the Father in me, and he will spurn and despise them, until they fail in their impiety and seek through repentance him by whom they had been abandoned. Others think that the place of God is heaven, to which God, offended by those who dwell on earth, returns, and will make them perish who, by the greatness of their sins, have turned the most merciful Lord into the rage of wild beasts against themselves.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
