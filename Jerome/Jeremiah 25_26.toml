[[commentary]]
quote='''
And to all the kings of the north, near and far. Because he had enumerated the regions of Persia and Babylon, of Elam and of the Medes, he now sets down in general all the kings of the north, who are near and far. For 'north', which in Hebrew is called 'safun', the Seventy translated aphēliōtēn, which we can call 'the east wind'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Each one against his brother, and to all the kingdoms of the earth which are upon its face. So that it should not become lengthy to enumerate one by one all the regions of the eastern province, he set down in general all the kingdoms of the earth which dwell on the earth. And as for his saying: against his brother, there is understood 'I gave the undiluted drink', so that all should rage, vomit, go mad and fight one another in mutual battles. And what he added:

King Sheshach shall drink after them, and is not found in the Seventy, has this sense: 'All the nations round about', he says, 'will be subject to the Babylonian empire, and he will subject all things to his power, so that all the nations which the preceding discourse has recounted serve him and drink of his cup'; hence also in the vision against Babylon it is written: Babylon is a golden cup that makes all the earth drunk. But last of all the king of Babylon will drink this potion, given him to drink by the rider of the chariot, of the camel and of the ass, Cyrus, king of the Medes and Persians. But how Babylon, which in Hebrew is called 'Babel', is to be understood as 'Sesach' will not greatly trouble anyone who has even a little knowledge of the Hebrew language. Just as among us the Greek alphabet is read in order up to the last letter, that is, 'alpha, beta' and so on up to 'omega', and again, for the sake of children's memory, we are accustomed to reverse the order of reading and mix the last letters with the first, so that we say 'alpha omega, beta psi', so too among the Hebrews the first letter is 'aleph', the second 'beth', the third 'gimel', up to the twenty-second and last letter 'thau', of which the next-to-last is 'sin'. And so we read 'aleph thau, beth sin', and when we come to the middle, the letter 'lamed' meets 'chaph'; and just as, if it is read straight, we read 'Babel', so with the order reversed we read 'Sesach'. But the vowel letters between 'beth and beth and lamed' and 'sin and sin and chaph' are not set down in this name, according to the idiōma [idiom] of the Hebrew language; and I think it was prudently concealed by the holy prophet, so that he should not openly stir up against himself the madness of those who were besieging Jerusalem and were on the very point of taking it. We read that the Apostle too did this with regard to the Roman Empire, when he wrote of Antichrist: do you not remember that, when I was still with you, I used to tell you these things? And now you know what restrains, that he may be revealed in his own time, Antichrist being understood. For the mystery of iniquity is already at work; only he who holds now, until he be taken out of the midst. And then the wicked one will be revealed, whom the Lord Jesus will slay with the spirit of his mouth and destroy with the illumination of his coming. By 'he who holds' he indicates the Roman Empire; for unless it has been destroyed and taken out of the midst, according to the prophecy of Daniel, Antichrist will not come before. If he had chosen to say this openly, he would foolishly have stirred up the rage of persecution against the Christians and the Church then coming to birth. We have spoken of this passage at greater length than the brevity of commentaries allows, which the Greeks and Latins will perhaps disdain, because it is not found in their codices. But what will that profit them, when in what follows this same prophet says: how Sheshach has been taken, and the renowned one of the whole earth seized; how Babylon has become an astonishment among the nations? Allegorical interpreters refer this whole passage to all the nations which the devil has made drunk with the most undiluted cup of sins; for he himself too, they say, will at the last drink punishments and torments, he of whom the Apostle writes: whom the Lord Jesus will slay with the spirit of his mouth, whence also in another place he says: but the last enemy will be destroyed, death. It requires great powers to be able to carry the names of different nations over into their etymologiais [etymologies] and to fit individual vices to individual names.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
