[[commentary]]
quote='''
Leaving the Scribes and Pharisees and those cavillers, He passes into the parts of Tyre and Sidon; that He may heal the Tyrians and Sidonians; And Jesus went thence, and departed into the coasts of Tyre and Sidon.

And the daughter of this Chananæan I suppose to be the souls of believers, who were sorely vexed by a dæmon, not knowing their Creator, and bowing down to stones.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus went out from there and withdrew into the parts of Tyre and Sidon. Leaving behind the scribes and Pharisees, his slanderers, he passes over into the parts of Tyre and Sidon in order to heal the Tyrians and Sidonians. And the Canaanite woman goes out from her former territory in order to obtain, by crying out, healing for her daughter. Note that it is in the fifteenth place that the Canaanite daughter is healed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
