[[commentary]]
quote='''
For already captivity is near, already I see you led in chains to the Assyrians and the Babylonians; I have hewn you by the prophets and threatened you with terrible words, I have brought out the scalpel, fire and cautery; so that you who despised me when I was merciful might fear me when offended; and I have slain the negligent by the words of my mouth, so that I might punish sinners by the terror of words before captivity was at hand. And all these things I have done so that the truth of the judgment with which I am about to judge you might appear, and no one might doubt that you have justly suffered what you suffer. For what is I have hewn them by the prophets, the Seventy translated: I have cut down your prophets, understanding the false prophets themselves to have been slain by the Lord; so that those who had been the cause of error, by promising prosperity, might, when slain, be turned into an occasion of salvation. And the sense is: Lest you should say: We believed the prophets; I have slain even them, so that every occasion of sinning might be taken away from you. We read in the book of Kings that three hundred prophets of the Baalim were slain under Elijah, and another countless multitude under Jehu, who overthrew the house of Ahab.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
