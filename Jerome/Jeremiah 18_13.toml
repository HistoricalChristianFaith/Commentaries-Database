[[commentary]]
quote='''
Therefore he adds, saying: 'Ask among the nations and all the peoples round about, who has done, who has heard, while serving idols, what the virgin of Israel has done exceedingly.' And he calls her a virgin because she had served the one God, as the prophet says: God is known in Judea, his name is great in Israel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
