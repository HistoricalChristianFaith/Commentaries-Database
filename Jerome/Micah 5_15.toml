[[commentary]]
quote='''
And after he has done this for the remnant of Jacob, then they will turn to the nations which the apostles grazed down like lambs grazing the grass. And because they were unwilling to receive the dew of speech, I will execute, he says, vengeance in anger and in fury on the nations, because they were unwilling to hear. Hence the prophet also says: O Lord, do not rebuke me in your fury, nor chasten me in your anger. Let this be what we have discussed according to the Seventy translators, since it is the spiritual understanding, and we had to join the sense to the earlier sections.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
