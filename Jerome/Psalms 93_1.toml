[[commentary]]
quote='''
The Lord has reigned, let the peoples be angry. Three psalms have the same beginning: the ninety-second, the ninety-sixth, and the ninety-eighth. But although they have the same beginning in the opening verse, at the end they are different. For how does it read in the ninety-second? 'The Lord has reigned, he has clothed himself in beauty.' But in the ninety-sixth: 'The Lord has reigned, let the earth rejoice'; and in the ninety-eighth: 'The Lord has reigned, let the peoples be angry.' The sequence seems as it were to be contrary to itself. For it ought first to have said 'The Lord has reigned, let the peoples be angry,' and afterwards to say 'The Lord has reigned, let the earth rejoice,' and last of all 'The Lord has reigned, he has clothed himself in beauty.' But the different order gives us some hint toward understanding. 'The Lord has reigned, he has clothed himself in beauty.' The Lord has reigned, and he has clothed himself with the patriarchs and the prophets and the believing people. He has clothed himself in beauty: the patriarchs and the prophets were as it were the garment of Christ. That is the loincloth which is written of in Jeremiah: that is the loincloth which Jeremiah had about his loins. Do you wish to know that the saints are, as it were, a loincloth, the garment of God? Afterwards God himself speaks to Jeremiah: 'Just as you,' he says, 'placed that loincloth about your loins, so I too have joined my people to myself.' As, then, a garment is about a man, so the people is about God. But because this loincloth, because this beauty with which the Lord had been clothed, was exposed across the Euphrates in a cleft of the rock, and there rotted away, and was led off into captivity by the Assyrians—what does the Lord do? He is not naked, he cannot be without a loincloth, he cannot be without a garment: the former people having been lost, he makes himself a garment out of the people of the Gentiles. And what is said? The Lord has reigned, let the earth rejoice. Let the earth rejoice, the whole earth, that is, the entire people of believers. Then, do you wish to know that the second loincloth is spoken of concerning the people of the Gentiles? The Lord, he says, has reigned, let the earth rejoice: let the many islands be glad. Not one island, Judaea, but many islands, that is, the whole world. Let someone say to me: Give me an example from the Scriptures where Judaea alone is called one island. Everything we say we ought to affirm from the holy Scriptures. 'For in the mouth of two or three witnesses shall every word stand.' The word of the one speaking does not have as much authority as the Lord's command. We read in the prophet Ezekiel: 'And you,' he says, 'son of man, speak to the inhabitants of this island'—that is, of Judaea. Since, therefore, one island has been forsaken, now it is said: Let the many islands be glad. Therefore concerning the loincloth it is said of the former people: The Lord has reigned, he has clothed himself in beauty. Of the second people, gathered from the Gentiles: The Lord has reigned, let the earth rejoice, let the many islands be glad. Now in the third it is said: The Lord has reigned, let the peoples be angry. Whether they be of the Jews, or of the Gentiles, whoever do not believe, let them be angry. 'Why have the nations raged, and the peoples devised vain things?'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_026.html'
source_title="Homily 26, on Psalm 98"

[[commentary]]
quote='''
The title of the present psalm is this: A psalm of praise of David, on the day of the sabbath, when the earth was inhabited. On the sabbath day is our rest, and the inhabiting of the earth is ours. 'And the Word was made flesh, and dwelt among us.' Our earth, therefore, has been inhabited. Let us see, then, what this dwelling accomplishes, and with what praises it is extolled.

The Lord hath reigned, he is clothed with beauty: the Lord is clothed with strength, and hath girded himself. For he hath established the round world, which shall not be moved. These three little verses are spoken by the prophet concerning the Lord and Savior; but the rest that follow are directed to the Lord himself. The Lord hath reigned, he is clothed with beauty. The Lord hath reigned, he who before had served. He is clothed with beauty. What does Isaiah say? 'We saw him, and he had no comeliness of his own: a man laid under a stroke, and knowing how to bear infirmity.' The Lord hath reigned, he is clothed with beauty. What he says is this: He who before had been an object of horror in the lowliness of the flesh, now shines resplendent in the majesty of the Godhead. For whatever in him is unshapely, let it be reckoned to our condition; but whatever there is of beauty will be fittingly applied to his own majesty. And he hath girded himself. This that he says, he hath girded himself, must signify some mystery. When we are ungirt, our tunic is let down all the way to the feet: unless it has been drawn up by a belt, the whole garment hangs down. So then, we too, because we could not bear the full strength of the Lord, he girded his majesty with flesh. This is what is said in another place: 'Thou shalt not be able to see my face; thou shalt see my back parts.' It is also said of Elijah in the book of Kings that he stood on Mount Sinai in a cleft, and thus saw the Lord passing by. See how, set in the cleft, he is said to have seen the back parts of the Lord and Savior. If the Lord and Savior is interpreted as the rock... 'And Christ,' says the apostle, 'was the rock.' For when we are set in the cleft of the rock, we behold God through the flesh. Why have I said all this? Because we embrace the following verse also with the same exposition: he is clothed with beauty, and hath girded himself. Just as the Lord and Savior is seen through the cleft of the rock, so too through the girdle his majesty is beheld.

For he hath established the round world, which shall not be moved. If we understand this world to have been so established by God that it is disturbed by no commotion ever, how is it said elsewhere, 'Heaven and earth shall pass away'? But if heaven and earth shall pass away, how is it said here, He hath established the round world, which shall not be moved? The οἰκουμένη (oikoumenē) in this place, which in our tongue is rendered 'the inhabited world,' seems to me to be the Church, of which it is said in the Gospel: 'I and my Father will come, and will make our abode with him.' Rightly, therefore, is it called a habitation, which has as its inhabitant the Father and the Son and the Holy Spirit. What, then, we have understood concerning the inhabited world—that is, concerning the round earth established forever—let us understand also concerning our soul. For if we have as our inhabitant the Father and the Son and the Holy Spirit, our earth shall not be moved forever.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_070.html'
source_title="Homily 70, on Psalm 92 (Alternate Series)"
