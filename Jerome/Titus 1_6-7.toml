[[commentary]]
quote='''
But if he commanded this to the Ephesian laymen, most of whom, as usually happens among the people, were occupied with the business of this life, that they should bring up their sons in all discipline and admonition of the Lord, what must we think of the priests, about whose order he writes to Timothy, saying: Having his children in submission, with all propriety (1 Tim. 3:4)? And he presses and repeats the same thing to Titus: Having faithful children, not under accusation of riotous living, or unsubmissive (Titus 1:6, 7); and, as though the vices of the children were imputed to the parents, inserting a causal conjunction, he says: For a bishop must be without crime, as the steward of God (Titus 1:7). That bishop, therefore, is not without crime whose son has not been submissive and is under accusation of riotous living.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
