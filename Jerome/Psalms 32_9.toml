[[commentary]]
quote='''
But if we wish to take the bridle, as the LXX translated, as the word of God, let us understand by the bridle him who reins in from vices horses raging with lust, and mules barren and wanton, and restrains them, and does not allow them to rush headlong; of whom it is said: Do not become like the horse and the mule, which have no understanding. With bridle and bit you will bind fast the jaws of those who do not draw near to you. Of this bridle James also speaks: We put bridles into the mouths of horses, and we turn about their whole body, so, that is, that they may walk on a straight road and be able to offer the Lord backs gentle for sitting. Such a bridle and such a word, wrought with a variety of gold and silver, prepares wild horses for the Savior to sit upon, and makes them holy and properly consecrated to his worship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
