[[commentary]]
quote='''
But let us say according to tropology that Ephraim, that is, the heretics, has departed from the Church like a bird, and has all his glory in birth and in the womb and in conception, if they have begotten many sons, whom the Lord threatens, even if they have been reared, to be punished as well, and not by any other whatever, but by the Lord himself, since they have begotten sons of fornication; and a true woe will be upon them when God has departed from them. And at the same time he unfolds what Ephraim was: when he was in the Church, he says, he was beaten by the temptations of this world as Tyre is by the waves of the sea, and yet he could suffer nothing adverse, because he had the foundation of Christ, upon which a house that is built cannot be overthrown. But now he leads out his sons to the slayer, that is, to the devil. And he said finely: he leads out, that is, he makes them go outside from the Church. We can call the sons of Ephraim the worst thoughts and the dogmas contrary to the truth, which the Lord slays with the spirit of his mouth, and he does not suffer them to have such children, and he abandons them to eternal destruction. But what we read in the Seventy: My flesh is from them, Ephraim, as I saw, has offered his sons for a hunt, we understand thus: If Christ is the head of the body, that is, of the Church, we are all members of Christ and of the Church. He, then, who departs from the Church tears the body of Christ; therefore Ephraim was the flesh and a member of the Lord the Savior. But he offered his sons for a hunt, and for the hunt of those of whom it is written: Our soul has been snatched like a sparrow from the snare of the hunters. And he led out his children from the Church to slaughter, or to be wounded, so that they are wounded by those who shoot burning arrows, so as to strike and burn at the same time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
