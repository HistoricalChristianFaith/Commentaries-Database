[[commentary]]
quote='''
Like a ravaging lion is your generation. LXX: like a ravaging lion, and you did not fear. 'The sword', he says, 'which devoured your prophets' — there is no doubt that he means the soothsayers of Baal and of the idols —, 'has laid everything waste like a lion, and yet your generation, which ought to have been amended by the slaying of a few, has persevered entire in crime'. But according to the Seventy this is the sense: 'Thus the sword of the Lord, which has displayed the sword of the adversaries, has devoured and torn your false prophets like a lion, which most greedily tears the prey it has found, and yet not even by the punishment of your prophets could you be turned to better things.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
