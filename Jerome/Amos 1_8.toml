[[commentary]]
quote='''
And because we read of five cities of the Philistines, which were struck with plagues on account of the wrong done to the ark, after Gaza he passes to Azotus, which is called Esdod, and again to Ashkelon, and with a terrible voice he threatens that he will destroy the inhabitants of Azotus, and him who holds the sceptre from Ashkelon, that is, the royal power, or the tribe of Ashkelon, so that no one may remain there, not even men of the last age, who support their trembling limbs with a guiding staff. And again he moves his hand to strike Ekron. And having enumerated four cities, he takes in the remaining cities of the Philistines in a single word: And the remnant of the Philistines will perish, by whom we must understand either the city of Gath, or all the villages which lie under the aforesaid cities.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
