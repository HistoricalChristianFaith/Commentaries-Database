[[commentary]]
quote='''
And what he adds, I am the Lord, that is my name; my glory I will not give to another, does not exclude the Son; for when he says in the Gospel, Father, glorify me with the glory which I had with you before the world was (John 17:5), the Father himself answered: I have both glorified it, and will glorify it. For he did not say: My glory I will give to no one, for if he had said that, he would have excluded the Son too; but my glory I will not give to another, besides you, to whom I have given it, to whom I will give it. Hence I greatly admire the propriety of holy Scripture, in that all the translators, who are accustomed to disagree in many other places, translated the word AHER (אחר) with one voice another. And that we may know that by this sentence not the Son but the idols are excluded, the following words bear witness: Nor my praise to graven images. For which the Seventy have: nor my powers to images. For since Christ is the power of God and the wisdom of God, he contains in himself all the powers of the Father.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
