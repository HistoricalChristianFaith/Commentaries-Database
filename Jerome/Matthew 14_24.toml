[[commentary]]
quote='''
Rightly had the Apostles departed from the Lord as unwilling, and slow to leave Him, lest they should suffer shipwreck whilst He was not with them. For it follows, Now when it was evening he was there alone; that is, in the mountain; but the boat was in the middle of the sea tossed with the waves; for the wind was contrary.

While the Lord tarries in the top of the mountain, straightway a wind arises contrary to them, and stirs up the sea, and the disciples are in imminent peril of shipwreck, which continues till Jesus comes.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252014.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But the boat in the middle of the sea was tossed by the waves. Rightly had the apostles withdrawn from the Lord as though unwilling and reluctant, lest in his absence they should suffer shipwreck. In short, while the Lord was lingering on the summit of the mountain, at once a contrary wind arises and troubles the sea, and the apostles are in danger, and the impending shipwreck lasts until Jesus comes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
