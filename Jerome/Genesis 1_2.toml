[[commentary]]
quote='''
(Verse 2.) And the spirit of God was moving over the waters. Because in our books it is written 'was moving', in Hebrew it has 'Merefeth', which we can call 'hovering' or 'brooding', in the likeness of a bird, warming the eggs with the heat of life. From which we understand that it is not said to be the spirit of the world, as some suppose, but the Holy Spirit, who is also said to be the giver of life to all things from the beginning. And if a giver of life, then also a creator. But if You are the creator and God. For, He says, send forth Your Spirit, and they shall be created (Psalm 103, 30).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
And the depths were troubled. Let us say something according to the spiritual understanding. In the beginning of Genesis it is written: "And over the waters," it says, "the Spirit was borne." And then it is written: "Over the depths," it says, "darkness was borne." See, then, what is said in the beginning of Genesis. This according to the spiritual understanding. Over the waters, it says, the Spirit was borne. Already at that time baptism was signified. For there could be no baptism without the Spirit. But over the depths, darkness. This is the abyss into which the demons beg not to be sent by Jesus. Over the depths, then, darkness. In the waters was cleanness, in the depths darkness. What the depths are, you understand while I am silent: since the demons dread to go into the abyss.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="Homily 10, on Psalm 76"
