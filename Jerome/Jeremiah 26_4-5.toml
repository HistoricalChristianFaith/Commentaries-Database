[[commentary]]
quote='''
And you shall say to them: Thus says the Lord: If you will not hear me, to walk in my law which I gave you, to hear the words of my servants, the prophets, whom I sent to you, rising up by night and sending, and you did not hear, I will make this house like Shiloh, and this city I will make a curse to all the nations of the earth. It is therefore placed in our power either to do something or not to do it, only in such a way that whatever good work we will, seek and accomplish, we refer to the grace of God, who, according to the Apostle, has given us both to will and to accomplish. But if it suffices to walk once in the law which was given to us through Moses, as the foolish heresy supposes, how is it that he added: to hear the words of my servants, the prophets? who surely were sent after the law, and not once but frequently, nor idly and as from one at ease, but always and as from one who is anxious.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
