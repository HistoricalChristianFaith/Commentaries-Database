[[commentary]]
quote='''
All these things can be referred to the heretics, so that, because they would not do this and that which is just, there may be wailing in all their streets. Wide indeed and spacious is the way that leads to death, and each of the heretics and of the gentiles has his streets in their fables and fictions; to which it is fittingly added: And in all the places that are outside it shall be said: Woe, woe. For those who are in the Church will not hear woe, which is the last of punishments; but if perhaps they have sinned, a lamentation will be taken up over them. And it shall be said outside, or in all the ways: Woe, woe, for this reason, that they do not have the one way that leads to life, which is the king's way, but crooked and perverse ways, turning aside to the right and to the left, since they do not hear the Lord saying: Do not be overmuch just, and: Perverse are the ways which are on the left. And they fall into a double woe, of the flesh and of the spirit, of the present age and of the age to come; whereas, on the contrary, the churchmen hear: Rejoice, again I say, rejoice. But the farmer too is called to mourning — for the heretics have their own farmers, in whose fields thistles and thorns spring up —, and to wailing are called those who know how to wail, whether for their own sins or for those of others; although we can also take this in a good sense, that a churchman who is able to call others to repentance should imitate his Lord, who says: We have lamented, and you have not wailed; and that he should wail for the heretics, as Samuel once wailed for Saul, king of Israel. And the Apostle says that he mourns over those who have not repented.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
