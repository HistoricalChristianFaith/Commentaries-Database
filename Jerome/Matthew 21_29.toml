[[commentary]]
quote='''
He answers haughtily, I will not.

But when, at the coming of the Saviour, the Gentile people, having done penitence, laboured in God's vineyard, and atoned by their labour for the obstinacy of their refusal, this is what is said, But afterward he repented, and went.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"
