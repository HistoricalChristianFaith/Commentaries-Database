[[commentary]]
quote='''
Hence the Apostle too, in whom Christ was speaking, said: I can do all things in him who strengthens me; and not only shall they be strengthened in the Lord, but they shall also glory in him and say: But far be it from me to glory, except in the cross of our Lord Jesus Christ, through whom the world is crucified to me, and I to the world, and: He who glories, let him glory in the Lord, and in another place: Let not the wise man glory in his wisdom, nor the strong man in his strength, nor the rich man in his riches; but let him who glories glory in this: to understand and know the Lord, and to do mercy and judgment in the midst of the earth. But since in the Hebrew it is written: And in his name they shall walk, it is to be understood thus: that Christians walk in the name of Christ, and a new name is written on their pebbles, and under the dignity of so great a name they walk with the Lord, as Enoch walked, and pleased God, and was translated.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
