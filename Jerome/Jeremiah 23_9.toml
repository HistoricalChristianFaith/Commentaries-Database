[[commentary]]
quote='''
To the prophets or in the prophets or against the prophets. This title, as we said above, has been placed in the edition of the Seventy as the end of the preceding chapter, where we read it written: and this is the name which the Lord shall call him, Iosedec, in the prophets. Not knowing this, very many invent various ravings of explanation; and it would have been much better simply to confess ignorance than to make others heirs of their own unskilfulness. The discourse, moreover, is against the prophets, nay rather the false prophets of Jerusalem and Samaria, whom he now calls by the common and popular name 'prophets', of whom it is written in what follows: and in the prophets of Samaria I saw iniquity and immediately: and in the prophets of Jerusalem I saw horrible things. But when he puts the conjunction 'and', he shows that the things above were said of the prophets of the Lord, who themselves too proved like the false prophets.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
My heart is broken in the midst of me — or in me —, all my bones have trembled — or have been shaken —; I have become like a drunken man and like a man soaked — or overcome — with wine before the face of the Lord and before the face of his holy words or and before the face of the comeliness of his glory. Having considered the countenance of almighty God, that is, of the Father, and having considered the countenance of the Son, who according to the Apostle is called the 'radiance of his glory' and the 'form of the substance of God', the prophet shudders in both mind and body and understands that he is nothing, according to what is said in another place too: I have become like a beast of burden before you; or else he offers to God the victim of his conscience and humility, according to that which is written in the psalms: a sacrifice to God is a troubled spirit; a contrite and humbled heart God does not despise. But the bones which trembled or were shaken, let us understand to be those of which the same David sings: all my bones shall say: Lord, who is like you? He became as one drunk and like a man soaked — or overcome — with wine, having no understanding and no wisdom; for the Lord knows the thoughts of men, that they are vain. But if this is so, where are those who preach perfect righteousness in man? And if they answer that they say this of the saints, not of themselves, certainly I think no one is holier than Jeremiah, who, a virgin, a prophet, and sanctified in the womb, by his very name prefigures the Lord Savior. For Jeremiah means 'the exalted one of the Lord'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
