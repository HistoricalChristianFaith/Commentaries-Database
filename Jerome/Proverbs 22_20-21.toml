[[commentary]]
quote='''
We read in Proverbs: But you, describe them threefold, that you may answer words of truth which are proposed to you, and we are commanded to understand the utterances of truth, that is, the holy Scriptures, threefold: first, according to the letter; second, in a middle way, through tropology; third, more loftily, so that we may know all mystical things. According to the letter is this: Neither let us commit fornication, as some of them committed fornication, and twenty-three thousand fell in one day, and: Do not murmur, as some of them murmured, and perished by the destroyer; in the middle way and according to tropology, when we withdraw from the letter and climb a little to higher things, as the Apostle says: It is written: You shall not muzzle the mouth of the ox that treads out the grain, and immediately there follows: Is it for oxen that God cares? Or did he speak surely for our sake?; but the last, that is, the third, sublime and sacred understanding, according to that word of the same Apostle: For this reason a man shall leave father and mother and shall cleave to his wife. This mystery is great; but I speak in Christ and in the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
