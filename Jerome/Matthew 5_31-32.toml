[[commentary]]
quote='''
For touching Moses's allowance of divorce, the Lord and Saviour more fully explains in conclusion, that it was because of the hardness of the hearts of the husbands, not so much sanctioning discord, as checking bloodshed.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
It was said: Whoever puts away his wife, let him give her a bill of divorce; but I say to you that everyone who puts away his wife, and the rest. In a later part the Savior explains this passage more fully: that Moses ordered a bill of divorce to be given on account of the hardness of heart of the husbands, not granting separation but taking away murder. For it is much better that discord, however grievous, should come about than that blood should be shed through hatred.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
