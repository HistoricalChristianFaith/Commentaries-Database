[[commentary]]
quote='''
Put on the whole armour of God, that you may be able to stand against the wiles of the devil.

From what we read below, and from what is said in all the Scriptures about the Lord Savior, it is most clearly proved that by the whole armour of God which we are now commanded to put on, the Savior is understood; so that it is one and the same to have said, Put on the whole armour of God, as if he had said, Put on the Lord Jesus Christ. For if the belt is truth, and the breastplate is righteousness, and the Savior is named both truth and righteousness, no one doubts that he himself is both the belt and the breastplate. Accordingly, he himself will also be the preparation of the Gospel of peace, and the shield of faith, and the helmet of salvation, and the sword of the spirit, which is the word of God, the living and effective word, sharper than every sword sharpened on both sides. But what other armour of God can we suppose, with which he must be clothed who has to fight against the wiles of the devil, except the power which is Christ? For whoever has put him on according to all the things that are understood concerning him will be able to fight against all the snares of the devil; and in so far as he is girded about with truth, he will not easily be led away into the dogmas of falsehood. And in so far as he has put on the breastplate of righteousness, he cannot be pierced by the darts of iniquity. Moreover, when he has been shod with most beautiful shoes in the preparation of the Gospel of peace, as one who has prepared his works at the end, and has therefore become a man of peace, he does nothing warlike or tumultuous, nor will he be condemned with those who are unprepared. Unbelief too, which is the enemy of faith, will avail nothing where the shield of faith is. The head also, and the ruling part of the heart and soul, in which all the senses are located, encircled with the helmet of salvation, will not be shaken. Finally, as a warrior and a brave man, he will cut down, kill and slaughter all the sects contrary to the truth, holding in his hand the sword of the spirit, that is, the word of God. Wishing, then, to show the manifold devices of the devil by which he strives to take us, through those places in which we do not keep our heart with all watchfulness, the apostle named them his μεθοδείας, that is, inventions or wiles. For if we abstain from the pleasure of bodies, he catches us, being insufficiently careful, in covetousness. And if we despise covetousness together with pleasure, he creeps in through luxury, and makes our belly our god, and through it he storms even those things which seemed strong. And just as wise commanders of armies are wont to attack above all those parts of cities which are poorly fortified, so that, once they have broken in through them, the fortified parts may easily be taken; so the devil too seeks to break in through the places he sees lying open, or at any rate not firmly shut, and to reach the very citadel of the heart and soul. And what need is there for me to speak of his many snares, when from these the other kinds of his wiles may be known? Now diabolus is a Greek name, which is interpreted "accuser". But according to the idiom of the Hebrew language, since the tribe of Zabulon too has some likeness to this word, he can be called καταρύων, that is, "flowing down", because, namely, he flowed down little by little from virtue to vice, and fell from heavenly things to earthly.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
