[[commentary]]
quote='''
Now to him who is able to do above all things more abundantly than we ask or understand, according to the power that works in us, to him be glory in the Church and in Christ Jesus, in all generations of the age of ages. Amen.

To what he had said above, Therefore I bow my knees to the Father, from whom all fatherhood in the heavens and on earth is named, that he may grant you according to his riches to be strengthened with power, and the rest, he now adds: Now to him who is able to do above all things more abundantly than we ask or understand, showing that he himself had asked, according to the weakness of man, for the things that seemed advantageous to them; but that, as far as the truth of the matter itself is concerned, God is able to grant more than he is asked, and our hopes are surpassed by what is accomplished: because we do not know what we ought to pray for, and we often ask for things against ourselves, thinking them to be for us. For how much better would it have been for the fornicator to fall sick and be tormented with infirmity than to make the temple of Christ the members of a harlot? God, then, is able to grant not only beyond what we ask but also beyond what we understand. It happens at times that we do not express our thought in speech, and words do not unfold the mind, and in silent thought, with unutterable groanings, as the Apostle himself says, we pray for something or other which we cannot say. He will therefore bestow beyond what we ask or understand, according to that power which works in us: so that, just as he now gives us, not according to our merit but beyond our prayers, certain things which we neither dared to ask for nor, had we asked, thought that we deserved, so he may also grant the rest, which neither the mind can conceive nor the tongue utter.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
