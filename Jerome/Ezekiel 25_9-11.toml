[[commentary]]
quote='''
Therefore, not a long time afterward but at the present moment, the Lord threatens that he will loosen, or open, the shoulder of Moab — that is, its strength and might — from its cities, so that the Babylonian conqueror may enter in to them too, and the cities in Moab may cease to be, and in its borders and boundaries the glorious cities may be destroyed whose names he sets down: 'Bethiesimoth and Beelmeon and Cariathaim', for which the Seventy, intending I know not what, translated 'the house of Bethiesimuth', although this word signifies 'a deserted village', while 'Beelmeon' too is to this day a very large village in Moab, which they rendered 'above the spring', and 'Cariathaim' 'a maritime city'; and it too is handed over, together with the Ammonites, to the sons of the east, namely the Babylonians, according to the sense which we have expounded against the Ammonites. 'And I will give,' he says, 'Moab as an inheritance, so that, as there is no more remembrance of the Ammonites among the nations, so also upon Moab I will execute vengeances and judgments, and they may know that I am the Lord, who handed Judah over for sin and stand forth as avenger against the Ammonites and against Moab'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
Hence the Lord threatens that he will open, or loosen, all the strength of the Moabites, so that they may cease to have cities and may no longer trust in the dialectical art, but that all its boundaries, which he calls promontories because of the dashing of the waves, may be destroyed, and that the glorious and chosen lands — 'Bethiesimoth', which means 'house of solitude' and 'deserted', and 'Beelmeon', which is likewise rendered 'having a spring' or 'above the spring', and 'Cariathaim', which the Seventy translated 'a maritime city' — may perish; for although they have the strength of fighters, and the glorious go forth to battle with the art of fighting, and advance hedged about and fortified on every side, yet their glorious land is not a house of habitation but a house of solitude; and though they think that they have a spring of knowledge and a maritime city that can withstand all the storms of the world, promising themselves endurance and strength, yet they will be turned to this end, that they too may be handed over to the sons of the east of the true light in Christ, just as the Ammonites were handed over, who trusted in their heretical multitude. And let us consider the benefit, and the clemency of God in the very threat: that they are handed over together with the Ammonites to the sons of the east as an inheritance, and that no heresy at all may be named among the nations, but that, judgments and vengeances having been executed upon Moab for its arrogance, they may know by the outcome of things that it is the Lord who orders all things. Now to prove that in the present place Moab is to be understood of the pride of the philosophers, of whom it is said: I will destroy the wisdom of the wise, and the understanding of the understanding I will reject, a few examples from the prophet must be unfolded: Amos says: Thus says the Lord: For three impieties of Moab and for four I will not turn away from him, because he burned the bones of the king of Edom to ashes — for truly, whatever there is in the world of perverse doctrines, whatever pertains to earthly knowledge and is thought to be robust, this is overthrown by the dialectical art and, like a fire, dissolved into ashes and embers, so that what was thought to be strongest is proved to be worth nothing —; Isaiah too rebukes the pride of Moab, saying: We have heard the insolence of Moab, he is exceedingly insolent; I have taken away his pride; Jeremiah also, prophesying against all the nations, speaks specifically to Moab: Because you trusted in your fortifications, and a little after: You had confidence in your glory, and again: How do you say: We are strong?, and then: Near is the day of Moab, that it should come, and its malice is exceedingly swift, and more plainly: Say: How has the glorious staff been broken, the rod of magnificence?, and again: The horn of Moab is broken; and these things are said so that, under the name of Moab, the foolish pride of the world that lifts itself up to heaven may be crushed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
