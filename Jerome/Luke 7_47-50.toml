[[commentary]]
quote='''
Let that harlot from the Gospel supply an example of the faith which works through love: when, in the house of the Pharisee, she had washed with her tears the feet of the Lord as he reclined at table, wiped them with her hair, and anointed them with ointment, and the Lord had put to the murmuring Pharisee the parable of the debtors of fifty and five hundred denarii, he added: "Wherefore I say to you: Her many sins are forgiven her, because she loved much" (Luke 7:47 and 50). And turning to the woman herself, he said: "Your faith has made you safe: go in peace". For in this place it is openly shown that this woman had faith working through love, which availed much in Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
