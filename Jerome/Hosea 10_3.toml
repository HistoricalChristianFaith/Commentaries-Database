[[commentary]]
quote='''
For now they will say: We have no king; for we do not fear the Lord, and what will a king do for us? Speak words of a useless vision, and you will strike a covenant, and judgment will spring up like bitterness over the furrows of the field. LXX: Therefore now they will say: We have no king, because we did not fear the Lord, but what will a king do for us? Speaking words, lying pretexts; he will draw up a testament, judgment will spring up like grass upon the wilderness of the field. After God has broken the images of Israel, and laid waste their altars or statues, and the final captivity has come, they will say: We have no king. And lest they think that the sentence is put off for a long time, he added: Now they will say, when they are laid waste, when they perceive that Hoshea, their last king, has been taken from them; but the king has been taken from us for this reason, because we did not fear the Lord, the true king; for what could a man as king profit us?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
