[[commentary]]
quote='''
And what is brought in: in those days they shall no longer say: the fathers have eaten a sour grape and the teeth of the sons are set on edge, and the rest, we discussed more fully in the explanations of Ezekiel, when we interpreted that place: son of man, what is this parable to you among the sons of Israel, who say: the fathers have eaten a sour grape and the teeth of the sons are set on edge? As I live, says the Lord, if this parable shall be any longer in Israel! for all souls are mine; as the soul of the father, so also the soul of the son; the soul that sins, it shall die. By this we learn that it is not the Lord who makes death, but sin; for the soul that sins, it shall die. And this is said in the present place: that Israel will not at all stumble forever because of the sins of the fathers, but will be saved by its own merits and by faith in Christ after many ages. And it is to be observed that vices and sins are called 'a sour grape', so that the teeth of those who eat are set on edge and cannot perceive the sweetness of him of whom it is said: taste and see that the Lord is sweet! Whoever does not understand the Scriptures as the truth of the matter holds eats a sour grape; whence also all heretics, believing perverse things, cannot eat the bread that comes down from heaven, but their teeth are set on edge, not by the harshness of the foods, but by the fault of the teeth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
