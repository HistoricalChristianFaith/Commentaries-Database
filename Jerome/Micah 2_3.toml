[[commentary]]
quote='''
Since, therefore, you have done these things and devised what is useless, I too, the Lord, will devise evil against this family; not that what I devise is evil, but that what I inflict seems evil to those who suffer it; and it will so press upon you that you cannot lift your necks, nor walk proudly, you, namely, whom the time of captivity had oppressed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Therefore the Lord devised evils against that tribe, by no means against the twelve tribes, but against the tribe of malice, befouled in crime, from which they could not lift their neck, nor walk upright. In short, to the present day they are subject to the Roman Empire, and are pressed down by the yoke of captivity, and do not lift their necks. As for what follows, ἐξαίφνης, that is, suddenly, it is not found in the Hebrew scrolls, and yet it can fit the present passage, so that we say: Therefore thus says the Lord: Behold, I devise evils against this tribe suddenly, from which they cannot lift their necks, and for this reason they will not be able to lift them, because the time is evil. For just as they worked evils against the Lord Jesus, so they will endure the evils of perpetual captivity, and will come into such great distress that all their songs and psalms will be turned into mourning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
Therefore the Lord devises evils against us, from which we cannot lift our necks, nor walk upright, for it is a most evil time, according to the words of John, who says: The world is set in wickedness. The same thing is signified also by that daughter of Abraham in the Gospel, a noble soul, whom Satan had bound and bent over, and who could not be raised up on high before the coming of the Lord, nor look up at her Creator. Hence the Savior says: This woman, he says, a daughter of Abraham, whom Satan had bound, ought she not to have been loosed from this bond on the sabbath day?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
