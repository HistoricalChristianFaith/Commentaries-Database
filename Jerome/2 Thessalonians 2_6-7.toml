[[commentary]]
quote='''
We read that the Apostle too did this with regard to the Roman Empire, when he wrote of Antichrist: do you not remember that, when I was still with you, I used to tell you these things? And now you know what restrains, that he may be revealed in his own time, Antichrist being understood. For the mystery of iniquity is already at work; only he who holds now, until he be taken out of the midst. And then the wicked one will be revealed, whom the Lord Jesus will slay with the spirit of his mouth and destroy with the illumination of his coming. By 'he who holds' he indicates the Roman Empire; for unless it has been destroyed and taken out of the midst, according to the prophecy of Daniel, Antichrist will not come before. If he had chosen to say this openly, he would foolishly have stirred up the rage of persecution against the Christians and the Church then coming to birth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
