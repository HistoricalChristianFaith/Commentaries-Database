[[commentary]]
quote='''
Emissaries too will be given as far as the inheritance of Gath: Gath most wicked, and a winepress of poisons, which is built against the house of God, where there are vain houses, which were built for derision. And these vain houses were made in vain for the kings of Israel: as far as the history is concerned, for those kings whose sins are written in the books of Kingdoms and of Chronicles; but as far as anagogy is concerned, for the chiefs of the heretics and the leaders of perverse doctrines; for to them the houses are vain and built in vain. And they last only so long, until the heirs who are to be brought in by the Lord hold them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
