[[commentary]]
quote='''
Has this house — or my house —, in which my name has been called upon, become a den of robbers in your eyes? I, I am, I have seen, says the Lord. From this passage, I think, was taken what is in the Gospel: It is written: My Father's house shall be called a house of prayer; but you have made it a den of robbers, or, as is written in another Gospel, a house of trade. The Church of God is turned into a den of robbers when theft, murder, adultery, perjury, sacrilege, the invention of heresy and every crime are at home in it, when princes burn with the torches of avarice and a cheap, or at any rate not cheap, little cloak possesses what were once the riches of kings. Hence he adds: 'I, I am, I have seen, says the Lord; my eyes have beheld what you think hidden; the darkness of your treasuries does not escape my knowledge'. He who, though he was rich, became poor for our sake, now blushes at our riches and says: Woe to you rich, who have your consolation!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
