[[commentary]]
quote='''
But if Noah and Daniel and Job, gathered together and placed in one place, cannot withdraw the sinning land, that is, those who dwell in the land, from the wrath of God, what is to be said of those who think that sinful sons can be delivered from the fires of Gehenna by the merit and virtues of their parents? Hence neither will a martyr father be able to deliver a transgressing son, nor will a mother of holy life give the rewards of chastity to an unchaste daughter; and on the contrary the vices of parents will not harm their children, but: The soul that sins, it shall die. Lot, dwelling in Sodom but a stranger both in spirit and in flesh, did not deliver his wife, who had looked back behind her, but only his daughters, who perhaps had not sinned; and Josiah, a holy man, not only did not save a sinful people by his virtues, but he himself also died in its sins. But if at times the Lord promises his mercy to their posterity on account of Abraham and David, it must be noted that he does not spare those who persevere in crimes, but those who do penance, so that the conduct of the sons assists the merits of the fathers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
