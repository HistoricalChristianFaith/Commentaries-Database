[[commentary]]
quote='''
Or, because by the Apostles the whole human race is seasoned.

That is, if the doctor have erred, by what other doctor shall he be corrected?

The illustration is taken from husbandry. Salt, though it be necessary for seasoning of meats and preserving flesh, has no further use. Indeed we read in Scripture of vanquished cities sown with salt by the victors, that nothing should thenceforth grow there.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
You are the salt of the earth. The apostles are called salt because through them the whole race of men is seasoned.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But if the salt has vanished, with what will it be salted? If the teacher has gone astray, by what other teacher will he be corrected?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
It is good for nothing any more except to be cast out and trodden underfoot by men. The example is taken from agriculture. For salt, as it is necessary for seasoning foods and for drying meats, so it has no other use. Indeed, we read in the Scriptures that certain cities were sown with salt by the anger of their conquerors, so that no shoot might spring up in them. Let teachers and bishops therefore beware, and see that the mighty mightily endure torments and that there is no remedy, but that the falls of the greater lead down to Tartarus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
