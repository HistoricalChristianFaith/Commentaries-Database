[[commentary]]
quote='''
To this day the damsel lays dead in the ruler's house; and they that seem to be teachers are but minstrels singing funeral dirges. The Jews also are not the crowd of believers, but of people making a noise. But when the fulness of the Gentiles shall come in, then all Israel shall be saved.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25209.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And when Jesus had come into the ruler's house and had seen the flute players and the crowd in an uproar. To this day the girl lies dead in the ruler's house, and those who seem to be teachers are flute players singing a mournful song. The crowd of the Jews, too, is not a crowd of believers but a crowd of people in an uproar.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
