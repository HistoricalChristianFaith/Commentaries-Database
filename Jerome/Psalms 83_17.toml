[[commentary]]
quote='''
Finally, in what follows also, see what he says. Let them be ashamed and troubled for ever and ever, and let them be confounded and perish. Let them perish according to that which is evil in them, and let that which is good be saved. Finally, see that "perdition" here does not signify abolition, but salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_015.html'
source_title="Homily 15, on Psalm 82"

[[commentary]]
quote='''
Let them be confounded and perish. He who blushes for his sins is next to being without sin: behold the eighth. Let the prudent reader say: This is contrary to the interpretation you have given. And let them perish. For those who are confounded to this end, that they may be saved — how shall they perish? Let them perish, let them perish, he says, the heretics, and let the men of the Church be saved. It is as if you were to say, Let this adulterer perish — not that you wish the adulterer to perish, but that the adultery may perish in him; nor, when the adulterer is saved, is the adulterer saved, but the righteous and chaste man. That you may know this to be the meaning we have stated, the Holy Spirit himself speaks thus: Let them be confounded and perish. How let them perish? That they may know that your name is Lord. Let them perish in error, let them be saved in the truth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
