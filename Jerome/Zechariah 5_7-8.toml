[[commentary]]
quote='''
And upon this measure and jar of all offences sat impiety in the midst, which by another name we can call idolatry, and the denial of God. Hence it is said by the Savior to the Jews: Fill up the measure of your fathers. This impiety, which sat upon the sins of Israel and gloried in its wickedness, is afterwards sent into the midst of Babylon, and is crushed by the evil of captivity. Or, according to Theodotion, she casts herself and hides in the midst of the jar, and draws over herself the very heavy weight of lead, so that she has her mouth stopped and can no longer boast herself. Or else she is crushed by the angel of God, so that she who before rejoiced in wickedness may fall silent in eternal silence. But whither, and by whom, she is carried shut in, the following reading teaches.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
