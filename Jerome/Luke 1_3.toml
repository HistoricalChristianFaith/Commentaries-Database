[[commentary]]
quote='''
If, then, anyone is excellent and strong, he is of the Lord's inheritance. Hence that Theophilus, "friend" or "lover of God," because he was such as to request that a Gospel be written to him, is called "kratistos," that is, excellent, strong: which was more simply translated by the Latins as "most excellent Theophilus."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="Homily 61, on Psalm 15 (Alternate Series)"
