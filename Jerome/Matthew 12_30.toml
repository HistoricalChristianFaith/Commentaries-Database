[[commentary]]
quote='''
But let none think that this is said of heretics and schismatics; though we may apply it besides to such; but it is shown by the context to refer to the Devil; in that the works of the Saviour cannot be compared with the works of Beelzebub. He seeks to hold men's souls in captivity, the Lord to set them free; he preaches idols, the Lord the knowledge of the true God; he draws men to sin, the Lord calls them back to virtues. How then can these have agreement together, whose works are so opposite?
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
He who is not with me is against me, and he who does not gather with me scatters. Let no one think that this was said of heretics and schismatics, although it can also be understood so, as something over and above; but from what follows and from the texture of the discourse it is referred to the devil, in that the works of the Savior cannot be compared with the works of Beelzebub: he desires to hold the souls of men captive, the Lord to set them free; he preaches idols, this one the knowledge of the one God; he draws men to vices, this one calls them back to virtues. How then can those whose works are opposite have concord between them?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
