[[commentary]]
quote='''
And the Lord said to me: Go again, love a woman loved by a friend and an adulteress, as the Lord loves the sons of Israel; and they look to other gods, and love the husks of grapes. LXX: And the Lord said to me: Go again and love a woman who loves evil things and an adulteress, as the Lord loves the sons of Israel; and they look to other gods, and love cooked cakes with grape-husks. To the former woman the prophet is joined as a type of the ten tribes, or of the whole Jewish people playing the harlot, and at length he received back into salvation the children who had been cast off and tormented; here he is ordered to love an adulterous woman again. When it is said: again, does it show that he had loved a fornicatress before, who as an adulteress either loves those evil things or is loved by a friend and neighbor? For the Hebrew word Re is read either as evil or as friend. And lest we should think that the prophet's love for the adulteress signifies anything other than God's love for the sons of Israel, he added: as the Lord loves the sons of Israel. Therefore the fact that the prophet loves the adulteress, and yet is not joined to her in marriage nor united with her in fornication, but only loves the woman who does wrong, is a type of God, who loves the most wicked sons of Israel; and they, though they are loved by the Lord, look to other gods and idols, and love the husks of grapes, which have no wine; and they have lost their former grace, like the demons, who, having fallen from their own dignity and possessing nothing of their ancient grace, are dry and withering in an old dryness. Hence for husks, which in Hebrew is called asise, Aquila translated παλαιὰ, that is, old things; Symmachus ἀκάρπους, that is, barren; and they are not only husks, but old husks, so that they bear witness to ancient offenses. And it is to be noted that this adulteress signifies the present time of the Jews, who, without God and the knowledge of the Scriptures and the grace of the Holy Spirit, are loved by the Lord, who awaits the salvation of all and opens the door to those who repent; and nevertheless they love useless things, loving the traditions of men and the dreams of the δευτερωσέων (of the 'secondary teachings', the Jewish traditions), and by no means have grapes and wine and winepresses full of must, but old husks which have been thrown away. For the pemmata, which the LXX translated, and which are eaten with raisins or grape-husks, we can say in Latin flat-cakes, or pastries, which are offered to idols and are called in Greek πόπανα (cakes). But the sons of Israel in the present passage are called the twelve tribes; above, however, the ten which were in Samaria and possessed the metropolis, Jezreel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
