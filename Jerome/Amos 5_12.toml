[[commentary]]
quote='''
Here knowledge is not to be understood according to what we read elsewhere: The Lord knew those who are his, but in the sense that nothing is hidden from God, and that he knows all the secrets of sinners. I have known, he says, many impieties, which are not only many but also strong and oppressing, or trampling on righteousness itself, or on him who is just. And you receive, he says, exchange, for which all likewise translated ἐξίλασμα, that is, propitiation, and we said gift; but ἄλλαγμα, according to the idiom of the Scriptures, means a price, as we also read in the Gospel: Or what exchange shall a man give for his soul? They also turned aside the poor in the gates, or, as Symmachus translated, oppressed them, so as to sell a sentence for a price against the truth of judgment, falling into that which is written: Gifts blind the eyes even of the wise. These the heretics receive, so as to turn the severity of the Scriptures, which announce torments to sinners, into blessedness; and while they promise every prosperity to the rich, toward the poor alone they are fierce and severe.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
