[[commentary]]
quote='''
And as for his imprecating the likeness of the overthrown cities, I think it is said of Sodom and Gomorrah; and all time in mourning, so that in the morning there should be a cry and at noon wailing. And as for what he adds: who did not kill me in the womb, they think that God is meant. 'That there might be for me,' he says, 'an everlasting conception'; all of which is said hyperbolically. Finally he sets out the reasons why he prefers death to life, and not being at all to existing wretchedly, adding: why did I come forth from the womb, to see labor and sorrow, and that my days should be consumed in confusion?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
