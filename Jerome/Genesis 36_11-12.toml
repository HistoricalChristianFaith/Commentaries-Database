[[commentary]]
quote='''
And as for what is said, Theman and Cenez and Amalek and the rest, let us understand that names were afterwards given from these men to the regions of the Idumaeans.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
