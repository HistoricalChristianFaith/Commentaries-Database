[[commentary]]
quote='''
That too which is read in the same book about Tamar and her two little ones (Gen. 38), namely that the first, who is called Zerah, put out his hand, and the midwife tied a scarlet thread on it, and then, as he drew his hand back inside, the later one, who is called Perez, stretched out his hand, fits the present place: that Israel showed its hand in the work of the Law, and drew it back defiled with the blood of the prophets and of the Savior himself. But afterward the people of the Gentiles broke forth, on whose account it is said to have been destroyed many times, and the middle wall which had stood between the Jews and the Gentiles to have been broken down, so that there might be one flock and one shepherd, and glory and honor and peace to everyone who works good, to the Jew first and to the Greek.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"

[[commentary]]
quote='''
This indeed will become clearer if we take an example from Genesis, where twins are born of Tamar, with whom the patriarch Judah lay: It came to pass, it says, when she was giving birth, and had twins in her womb; in the very birth one put forth his hand, and the midwife tied scarlet on his hand, saying: This one will come out first. But when he had drawn back his hand, at once his brother came out, and she said: Why has the wall been divided for your sake? And she called his name Perez, which is interpreted division. And after this his brother came out, on whose hand was the scarlet, and she called his name Zerah, which in our language means seed, or rising. The elder people, then, in whom was the rising and the seed before the Church was born from the Gentiles, showed its hand in works, and afterwards drew it back, hearing through Isaiah: For your hands are full of blood. And when he had drawn back his hand and ceased from the works of justice, his brother, the people of the Gentiles, came out. And for his sake the hedge was divided, and the Lord and Savior destroyed, so that he might be able to advance, the partition which was in the middle and the wall separating the two peoples; and he made one flock, and created the two in himself into one new man, making peace. Hence too the midwife, speaking prophetically, says to Perez, the younger people: Why has the wall been divided for your sake? If you have understood the example from Genesis, go up, you who desire to be saved, by no means through the old people, which has its hand drawn back, but through the new, in which Christ is the way, in whom Jesus is the gate, through whom we advance to the Father; for he himself dissolved the middle partition and wall, that is, the obscurity of the ancient prophets, and opened all the mysteries of the old law, and, having scattered the difficulty of advancing, revealed the way to the eyes of all, so that whoever wishes to go on may be hindered by no obstacle nor be frightened by the fog of obscurity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
