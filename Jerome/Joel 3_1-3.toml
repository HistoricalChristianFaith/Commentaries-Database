[[commentary]]
quote='''
All of which the Jews recall to have been fulfilled according to the letter in the times of Vespasian and Titus, and above all of Hadrian. But if we wish to refer what is written to the day of judgment, we say that everyone who is saved is saved in the Church, or in the heavenly Jerusalem. And after the captivity of Judah and Jerusalem has been turned back, then all are to be gathered and brought down into the valley of Jehoshaphat; and there the Lord will plead with those who have persecuted his people, and have divided among themselves the inheritance of the Lord, and have scattered them among the nations, and have cast the lot over his land. And these things we ought to take not only of the heretics, who have divided the people of God among themselves and make them Gentiles, but also of every harsh and proud teacher, who under the name of teaching and of the priesthood lord it over those allotted to them and oppress those who are subject to them. And when they have been negligent, and have caused one of the least to stumble, they even put boys into the brothel, or hand them over to harlots; and, for the sake of their own pleasure, whose God is the belly, and their glory is in their confusion, they sell girls that they may drink wine. And they hand over young men to harlots and sell girls to luxury who, for the sake of shameful gain, do not rebuke those who sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
