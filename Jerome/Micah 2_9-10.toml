[[commentary]]
quote='''
In the Lord I trust; how do you say to my soul: Flee away to the mountains like a sparrow? The crafty adversary both tempted the Lord and Savior in the wilderness, and wishes all the saints to depart from the land of Judah and to dwell in the desert of the virtues, that there he may more easily strike them down. But even his very counsel is deceitful: for he does not exhort that one take the wings of the dove — a bird gentle, simple, and domestic, said to lack gall, and which is offered for the Lord in the temple — but the wings of a sparrow, a bird chattering and roving, which after the rearing of its young knows nothing of the fidelity of wedlock; although Aquila and Symmachus rendered "bird" generally in place of "sparrow." By the mountains, however, we can understand those of which it is said in another place, "Draw near to the eternal mountains," and in the second psalm of the steps, "I have lifted up my eyes to the mountains from whence help shall come to me": and to which, after the abomination of desolation shall stand in the holy place, we ought to migrate.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_060.html'
source_title="Homily 60, on Psalm 10 (Alternate Series)"
