[[commentary]]
quote='''
There follows in the prophet Obadiah: Behold, I have given you small among the nations; you are exceedingly contemptible. The pride of your heart has lifted you up, dwelling in the clefts of the rock, exalting your throne, who say in your heart: Who will drag me down to the earth? If you are exalted like the eagle, and if you set your nest among the stars, from there I will drag you down, says the Lord. LXX: Behold, I have given you least among the nations; you are exceedingly without honor. The pride of your heart has raised you up, dwelling in the holes of the rocks, exalting your dwelling-place and saying in your heart: Who will bring me down to the earth? If you are exalted like the eagle, and if you set your nest in the midst of the stars, from there I will drag you down, says the Lord. Jeremiah, of whom we made mention above, agrees in almost the same words, saying: Behold, I have given you small among the nations: contemptible among men; your arrogance has deceived you, and the pride of your heart, you who dwell in the caverns of the rock and strive to lay hold of the height of the hill; when you have exalted your nest like the eagle, from there I will drag you down, says the Lord. In prophetic interpretation we ought to follow our custom, so as first to lay the foundations of history, then, if we can, to raise up lofty towers and the tops of roofs. O Edom, he says, though you are the least among all the nations round about, and small in number in comparison with the other peoples, you are lifted up by pride beyond your strength. And though you dwell in grottoes, nay rather in the caverns of the rocks, lowly and poor, and not possessing the lofty roofs of buildings, you are borne up on high like an eagle, and you swell so much in thought that you believe you dwell among the stars; even if, beyond nature, you could penetrate the heights of heaven, from there I would drag you down and bring you down to the earth, says the Lord God. But that which is added in Jeremiah, And you strive to lay hold of the height of the hill, has opened the riddle, signifying by the hill Mount Zion; and by this he means to be understood either the city of Jerusalem itself or the temple which was founded in it. That the eagle flies higher than all birds, even those who discuss the nature of birds have handed down to memory; and it is said to be of such keen sight that, when it is borne over the seas on motionless wing and is not visible to human eyes, from so great a height it sees little fish swimming, and when they have come near the shore, it descends like a missile from an engine and drags the prey it has seized to the shore with its wings.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"


[[commentary]]
quote='''
I said above that this very thing can also be understood against the flesh: that its powers are left without defense at the coming of Christ, and that it is contemptible and subject to the rule of the soul, and is lifted up in vain, since it dwells in the caverns of the rock, whether in the senses or in the thoughts; and it wishes to lord it over the soul, exalting its throne, and not believing that its works can be overcome. To it it is said that, however much it lifts itself up and imitates the heights of the eagle and has deceived many of the saints, yet it has been overcome and cast down by the Lord. What we have understood of the heretics and of the flesh can also be understood against the Jews.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
