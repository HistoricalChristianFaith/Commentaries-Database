[[commentary]]
quote='''
Nor shall you enter the gate of my people on the day of their ruin; for when either denial or pleasure has overwhelmed us, and an unhappy conscience has not kept its former strictness, then we easily slip into contrary doctrines that flatter our error, and do not cure the wound but stroke it. It is a solace in misery for one, however lost, to have something to hope for.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"

[[commentary]]
quote='''
Which of the heretics does not look down on the churchmen? Which does not exult in their misfortunes, if ever, because of the sins of the people, they have been handed over to persecution, and many, either of weak faith or sown upon stony ground, have fallen into denial: you may see them exult, rejoice, think our ruin their own victory, so much so that they join themselves to the nations, and the persecution becomes more savage, whether from the Jews or from those who pretend to be our brothers and are reckoned under the same name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
