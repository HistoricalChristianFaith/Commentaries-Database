[[commentary]]
quote='''
In my fury and in my indignation this city has become to me from the day on which they built it until this day, on which it is taken away from my sight. If from the time when the foundations of the city were laid until this day, when it was taken and set on fire and removed from the sight of the Lord, it was always in vice and provoked the indignation of the Lord against itself, where is — as we have often said already — the respite from sins?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
