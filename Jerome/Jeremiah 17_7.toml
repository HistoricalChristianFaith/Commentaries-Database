[[commentary]]
quote='''
Blessed is the man who trusts in the Lord, and the Lord will be his confidence — or hope — ; and he will be like a tree that has been transplanted — or fruitful — upon the waters, that sends out its roots toward moisture; and it will not fear when the heat comes, and its leaf will be green — or its twigs in leaf — and in the time — or year — of dryness it will not be anxious — or will not fear — nor will it ever cease to bear fruit. Let that be said of the Jews and of the heretics, who have hope in man, namely in their Christ, whom they think will come not as the Son of God but as a mere man. On the contrary, the man of the Church, who trusts in the Lord, hears this: and know that the Lord himself is God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
