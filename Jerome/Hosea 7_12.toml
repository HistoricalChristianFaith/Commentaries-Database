[[commentary]]
quote='''
And so that God might show that by changing places we cannot escape his eyes, and that we are always ruled by the power of God: When, he says, they have set out into the Assyrians, even there I will spread my net, and if they have been lifted up like birds, I will bring them down from there. But I will bring them down, not to destruction, but to strike them as sons; and I will strike them not with the greatness of punishments, but with fear, so that, hearing of the punishments of old, they may be corrected by terrors alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
