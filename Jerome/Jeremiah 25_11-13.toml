[[commentary]]
quote='''
And all these nations shall serve the king of Babylon seventy years. And when the seventy years are fulfilled, I will visit upon the king of Babylon and upon that nation, says the Lord, their iniquities, and upon the land of the Chaldeans, and I will make it everlasting desolations. And I will bring upon that land all my words which I have spoken against it, all that is written in this book, whatever Jeremiah prophesied against all the nations. Just as Jerusalem after seventy years receives back its former inhabitants and, its punishments completed, because it obeyed the sentence of God, enjoys its former happiness, so the king of Babylon, because he was lifted up into pride and judged that his reigning over the nations was the work of his own strength and not of the Lord's will, will be destroyed when the Medes and Persians come. Indeed, to this day only the remains of the city of Babylon survive, and the Lord has made it an everlasting desolation and has fulfilled all the words that are contained in the book of this very prophet. For in what follows the discourse of Jeremiah describes what evils Babylon is to suffer.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
