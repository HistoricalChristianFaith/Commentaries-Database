[[commentary]]
quote='''
And Ephraim has become like a dove led astray, without heart. They called upon Egypt, they went off to the Assyrians; and when they have set out, I will spread my net over them, I will bring them down like a bird of the sky, I will strike them according to the report of their assembly. LXX: And Ephraim was like a foolish dove without heart. He called upon Egypt, and they went off into the Assyrians as they will go. I will cast my net over them, I will bring them down like the birds of the sky; I will correct them in the hearing of their tribulation. The Lord commands in the Gospel that we be simple as doves and shrewd as serpents, so that, imitating the simplicity of doves and the shrewdness of the serpent, we may neither be able to harm others nor suffer snares from others; but by simplicity and prudence may show ourselves balanced men, because prudence without goodness is malice, and simplicity without reason is called folly. Ephraim therefore has become like a dove led astray, in Hebrew photha; by Aquila and Symmachus it is called θελγομένη or ἀπατωμένη, that is, enticed or deceived; and by the Seventy foolish or senseless; for ἄνους can express both. And he is fittingly called a dove led astray, or foolish, because there is also a dove that is wise, which says in the psalms: Who will give me wings like a dove, and I will fly and be at rest? Whose wings are silvered, and the hinder parts of whose back are in the greenness of gold. But Ephraim, a foolish dove and without heart, is shown to be of so brutish a mind that, calling upon Egypt, he went on to the Assyrians. For he who begged the help of the Egyptians is led away captive by the Assyrians. Egypt is a staff of reed: whoever leans on it, it will at once crush him, and, broken and shattered, it pierces the hand of the one who rests upon it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
The question is asked why Ephraim is compared not to other birds but to the dove. The other birds hasten to protect their young even at the peril of their own life; and when they see a hawk, a snake, a raven or a crow approaching their nest, they fly about hither and thither, and hurl themselves at the attacker with their bites, and tear it with their claws, and testify to a parent's grief with plaintive cries; the dove alone does not grieve for its young when they are taken away, and does not look for them; and to it Ephraim is rightly compared, because he does not perceive that his people is being laid waste piece by piece, but is careless of his own safety.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
