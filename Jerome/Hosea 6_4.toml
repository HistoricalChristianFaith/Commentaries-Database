[[commentary]]
quote='''
What shall I do to you, Ephraim? What shall I do to you, Judah? Your mercy is like a morning cloud, and like the dew passing away in the morning; for this reason I have hewn them by the prophets, I have slain them by the words of my mouth, and your judgments will go forth like the light. LXX: What shall I do to you, Ephraim? What shall I do to you, Judah? But your mercy is like a morning cloud, and like the dew passing away in the morning; therefore I have cut down your prophets, I have slain them by the words of my mouth, and your judgment will go forth like the light. When he says: What shall I do to you, Ephraim? What shall I do to you, Judah? he shows the affection of a parent toward lost sons. According to what we read in Isaiah: What is there that I ought to have done further for my vineyard, and have not done for it? And in Micah: My people, what have I done to you, and in what have I been troublesome to you? Answer me, for I brought you out of the land of Egypt, I freed you from the house of servants, and I sent before your face Moses, and Aaron, and Miriam. What then shall I do to you, Ephraim, what shall I do to you, Judah? Your mercy, with which I have always had mercy on you, has passed away like a morning cloud, and like the dew rising in the morning, which is dried up when the sun has risen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
