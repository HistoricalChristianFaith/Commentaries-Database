[[commentary]]
quote='''
And they will by no means be a prey any longer to the demonic nations, nor will the beasts of the earth, of which we have spoken, devour them, but they will dwell confidently without any terror, according to the exposition above.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
