[[commentary]]
quote='''
And what follows: His dominion shall be multiplied, and of peace there shall be no end, in place of which the Seventy translated: Great is his government: we ought to know that the Hebrew word MESRA (משרה), both here and above, the Seventy interpreted ἀρχὴν, that is, government. In place of which we rendered government above, here dominion. But Aquila, deceived by the ambiguity of the word, interpreted μέτρον, that is, measure, which is called by the same name in Hebrew and in Latin. Nor can anyone doubt about the manifold dominion of the Savior and his peace, which has no end, who has read in the Psalms: Ask of me, and I will give you the nations for your inheritance, and the ends of the earth for your possession (Ps 2:8); and again: And abundance of peace, until the moon be taken away (Ps 71 [72]:7), that is, until the consummation of the age. And his government and dominion will be upon the throne and kingdom of David, which after the Babylonian captivity had been broken up, to establish it and strengthen it, and to teach that it is perpetual (lest the promise of God should seem empty), from the time of the Incarnation and for ever. And the zeal, that is, the jealousy, of the Lord of hosts did this for this reason, because they provoked him to jealousy with those who were not gods, and he provoked them to jealousy with a nation that was not a nation (Deut 32). The prophecy of Emmanuel and of the child to be born of a Virgin, begun at the place where it is said to Ahaz: Ask for yourself a sign from the Lord your God, is ended with this little verse, in which is added: The zeal of the Lord of hosts will do this (Isa 7:11). Now let us pass on to the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
