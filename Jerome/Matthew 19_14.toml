[[commentary]]
quote='''
And He said distinctly, Of such is the kingdom of heaven, not Of these, to show that it was not years, but disposition that determined His judgment, and that the reward was promised to such as had like innocence and simplicity.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Let the little children be, and do not forbid them to come to me; for of such is the kingdom of heaven. He said significantly of such, not of these, to show that it is not age that reigns but character, and that the reward is promised to those who have a like innocence and simplicity, the Apostle too agreeing with the same sentence: Brothers, do not become children in your understanding, but be little children in malice; but in understanding, be perfect.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
