[[commentary]]
quote='''
Behold, the whirlwind — or tempest and commotion — of the Lord's indignation goes forth, and a tempest bursting forth shall come upon the head of the ungodly, and the fury of the Lord shall not turn back until he does and until he fulfills the thought of his heart; in the last days you shall understand his counsel. He who had said above: 'It has been spoken to us by the Lord: peace shall be to you', and had rebuked them because they could not know the things to come nor know the sentence of God, now shows by contraries that they know nothing at all: for instead of peace and security a Babylonian tempest is coming, and coming not upon just anyone, but upon the heads of the ungodly, whether of the whole people or of those who announced false things to the people. Nor is the wrath and fury of God to be appeased as in times past, but what he foretold and very often threatened is to be fulfilled in deed, and his thought and sentence are to be proved by the punishments of the ungodly. 'When', he says, 'the last time of the captivity has come, and the exulting victor has taken hold of you and bound your hands with the grating of chains, then you shall understand his counsel, which you now vainly boast that you know'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
