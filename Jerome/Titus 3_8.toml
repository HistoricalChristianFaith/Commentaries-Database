[[commentary]]
quote='''
A faithful word, and concerning these things I want you to confirm, that those who believe in the Lord may take care to be foremost in good works. These things are good and useful to men. What he says, a faithful word, is to be joined to what precedes, where he had set down first, "that, justified by his grace, we may become heirs according to the hope of eternal life". For the word about the inheritance of God and about the hope of eternal life is worthy of faith. Hence one ought, not doubting, not fearing, both to believe these things oneself and to confirm them so that others may believe; and not only this, but this too is to be confirmed, together with these others who wish to believe: wherefore he says, and concerning these things I want you to confirm. And those who have believed that these things are truly so must take care of good works, through which the inheritance of God and the hope of eternal life are prepared. And beautifully, to produce greater faith, he did not say, who believe men, but who believe God. For it is necessary that they take care of good works, which, when fulfilled and carried out with all zeal, are good and useful to believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
