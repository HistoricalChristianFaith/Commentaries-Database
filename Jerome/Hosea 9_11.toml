[[commentary]]
quote='''
Ephraim, that is, the ten tribes, has flown away like a bird into captivity and has departed from its place. And he called it a bird to show its swift passage into Babylon. But if we read, like a bird their glory has flown away, we say this, that the help of God has departed from them and flown away. And what follows, from birth and from the womb and from conception, can be understood in two ways: that the glory which has flown away from Ephraim departs also from their birth and from their womb and from their conception, that is, it deserts their sons and abandons their descendants. Or at least we say that Israel had all his glory in his multitude, and in this he thought himself greater than Judah his brother, because he was set over ten tribes, the other over two.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
