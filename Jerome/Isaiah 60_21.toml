[[commentary]]
quote='''
And your people will all be righteous; they will inherit the land for ever, the shoot of my planting, the work of my hand, for glorifying. The least will become a thousand, and the little one a very mighty nation. I the Lord will do this suddenly in its time. LXX: Your people, all righteous, will possess the land for ever, keeping the planting, the works of their hands, for glory. He who is small will become thousands, and he who is least a great nation. I the Lord will gather them in time. When the days of mourning are finished and completed, when sorrow will be turned into joy, the people of Zion will be all righteous, not for a short time but for ever; and because it is righteous, it will possess the land of the gentle. Nor is it to be wondered at if, to receive the good things of the promise, it holds the land of the meek and of the living, for which the Prophet sighs, saying: I believe that I shall see the good things of the Lord in the land of the living (Ps 26 [27]:13), since it is the shoot of the Lord's planting and the work of his hands for glorifying God. For every planting, he says, which my heavenly Father has not planted will be rooted up (Matt 15). Or, according to the Seventy, the people that keeps the planting of God and the works of the Lord's hands will be preserved in the glory of the Creator. Of the good planting God speaks through Jeremiah: I planted you a good vine, wholly true, which in Isaiah is called the vine of Sorek (Isa 5). And because Paul, conscious of the virtues of Christ speaking in him, could say, Be imitators of me, as I also am of Christ (1 Cor 11:1), he therefore said to the Corinthians: I planted, Apollos watered, but the Lord gave the increase (1 Cor 3:6). For those planted in the house of the Lord will flourish in his courts (Ps 91 [92]).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
