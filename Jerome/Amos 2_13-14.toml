[[commentary]]
quote='''
And the cart that is rolled is the one of which we read in Isaiah: The land of Moab shall be trampled down, as a threshing floor is trampled with carts. And in another place: I will make you, he says, like the new wheels of a cart with the teeth of saws, and you shall crush the mountains and grind the hills to pieces, so that, after you have crushed the mountains and hills, flight may perish from the swift, as Paul says: Do you not know that those who run in the stadium all run indeed, but one receives the prize. And in another place: You were running well; who hindered you, so that you should not obey the truth? Hence, fearing for himself as well, he says: Not that I have already received, or am perfect; but I run, if I may lay hold of that in which I also have been laid hold of by Christ. All these things he did, lest flight perish from the swift; and for this reason, when he had now reached the finishing mark and received the prize of victory, he said in security: I have fought the good fight, I have finished the course, I have kept the faith; for the rest, there is laid up for me the crown of righteousness, which the Lord, the just judge, will render to me on that day; and not to me only, but also to all who love his coming. If we flee with a quick step, sin will not be able to catch us; but if malice binds our feet, we shall speak with the prophet to God: Where shall I go from your spirit, and where shall I flee from your face? Of bad runners the Apostle speaks: It is not of him who wills, nor of him who runs, but of God who has mercy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
