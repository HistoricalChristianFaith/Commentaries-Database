[[commentary]]
quote='''
Should the entreaties of your brethren induce you to take orders, I shall rejoice that you are lifted up and fear lest you may be cast down. You will say, "if a man desire the office of a bishop, he desires a good work." I know that; but you should add what follows: such a one "must be blameless, the husband of one wife, sober, chaste, prudent, well-prepared, given to hospitality, apt to teach, not given to wine, no striker but patient." … Woe to the man who goes in to the supper without a wedding garment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_014.html'
source_title="LETTERS 14.8"

[[commentary]]
quote='''
For it is not rank and the names of rank, but the work of the rank, that is accustomed to save princes, and judges, and prophets, and priests: He who desires the episcopate, he says, desires a good work. See what he said: He desires a good work, not a rank. But if, despising the work, one looks only at the rank, swiftly the tower in Siloam falls, and the heights of the cedar are struck by lightning, and the upraised neck is broken, and the swan, with neck outstretched and straining aloft, is reckoned among the unclean birds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
