[[commentary]]
quote='''
Before the face of this people, which is strong and many, there will be a devouring, or consuming, fire, to consume all the hay, wood and stubble in us. Whence it is also said of God: God is a consuming fire, and behind him a burning flame; so that he leaves nothing without punishment. Whomever this people has not touched, and in whom it has not found material for burning, will be likened to the garden of God and to the paradise of delight, which in Hebrew is called Eden. But if it burns anyone, it will reduce him like a solitude to ashes and embers, nor is there anyone who can escape its fury; its cruel appearance will have the likeness of snorting horses; and so they will run about to torment those whom they have received into their power, like horsemen flying hither and thither; terrible will be their sound, like that of four-horse chariots running down a slope; and they will leap upon the tops of the mountains, desiring to torment all the lofty and those set on the summit of the Church. And because before their face is a devouring and consuming fire, they will lay waste all things as a flame consumes stubble; so will they come to punish, so ready and prepared will they be, like a strong people for battle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
