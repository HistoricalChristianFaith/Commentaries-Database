[[commentary]]
quote='''
Escaboth [Ichabod]: glory has fallen, or woe of glory. And what our view is on this has been discussed more fully in the books of Hebrew Questions.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, Interpretations from the First Book of Kings (1 Samuel)"
