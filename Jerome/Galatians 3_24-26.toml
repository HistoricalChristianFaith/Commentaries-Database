[[commentary]]
quote='''
And so the law of Moses too was set over a wanton people after the likeness of a rather severe pedagogue, to guard them and to prepare them for the faith to come; and after this came, and we believed in Christ, we are no longer under a pedagogue, the guardian and the trustee depart from us, and, entering upon the lawful time of our age, we are called true sons of God, to whom not the Law, now abolished, but mother Faith, which is in Christ Jesus, begets us.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
