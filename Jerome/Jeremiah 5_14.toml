[[commentary]]
quote='''
Thus says the Lord God of hosts: Because you have spoken this word, behold, I give my words in your mouth into fire, and this people into wood, and it will devour them. 'You said: The prophets have come to wind, and the things they threaten will not come; therefore, O prophet, I give my words in your mouth, which are to have the power of fire, and which are to turn this people into wood, so that the unbelieving may be burned up together by your discourse and prophecy.' So God is called a consuming fire, that he may consume in us whatever, upon the foundation of Christ, we have built of hay, wood, stubble.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
