[[commentary]]
quote='''
And he kept him, or formed him, when death had been overcome, and gave him as a covenant of the people of the Jews, that is, of those among them who were willing to believe: that he might raise up the land, which lay in the errors of idolatry, and possess the scattered, or deserted, inheritances, which did not have God as their inhabitant, and might say to those who were in bonds, Go forth, those who were held fast by the bonds of sins, since each one is bound fast with the cords of his own sins (Prov 5); and to those who were in darkness, Be revealed: those who sat in darkness and in the shadow of death, and could not see the light. And after they have been converted, and have beheld the clear light of Christ, they shall feed in the ways and in the paths of the holy Scriptures, and shall say: The Lord feeds me, and I shall lack nothing; in a place of pasture there he has set me: he has brought me up beside the waters of refreshment (Ps 22 [23]:2).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
