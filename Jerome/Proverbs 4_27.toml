[[commentary]]
quote='''
Our Firmianus too, in the excellent work of his Institutes, makes mention of the letter, and has discussed most fully the right and the left, that is, the virtues and the vices. Nor let us think that this little sentence is contradicted by the one in which it is said: Do not turn aside to the right, nor to the left. For here the right side is taken for good; but there it is not so much the right that is accused as the turning aside of the right: that we should not be wise more than we need to be wise, because the virtues are in the middle and every excess is in vice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
