[[commentary]]
quote='''
From all of which neither the teaching of spiritual parents — whom we understand to be teachers — nor princes will be able to deliver us, unless the sons give their assent and assist the parents' entreaties by their own efforts; for the righteousness of the righteous shall be upon him, and the iniquity of the wicked shall abide in him: Each shall die for his own sin, and shall be saved by his own righteousness; and in vain do the Jews say: Abraham is our father, since they do not have the works of Abraham; but if there is confidence in anyone, let us trust in the Lord alone: Cursed, for, is every man who puts his hope in man, however holy they may be, however much they may be prophets; we read: Do not trust in men, and again: It is good to trust in the Lord rather than to trust in princes, not in the princes of the world only but in the princes of the churches, who will deliver only their own souls, if they are righteous, but the sons and daughters whom they have begotten in the Church they will not be able to save, if these are negligent; and yet the Apostle says: If anyone's work is burned up, he himself will be saved, yet so as through fire.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
