[[commentary]]
quote='''
Also that by being Himself baptized, He might sanction the baptism of John.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then Jesus came from Galilee to the Jordan to John, to be baptized by him. For a threefold reason the Savior received baptism from John: first, so that, since he had been born a man, he might fulfill all the justice and humility of the law; second, so that by his own baptism he might approve the baptism of John; third, so that, sanctifying the waters of the Jordan by the descent of the dove, he might show the coming of the Holy Spirit in the washing of believers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
