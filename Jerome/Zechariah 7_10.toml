[[commentary]]
quote='''
The widow too, and the orphan, concerning whom we have been commanded: Be a father to orphans, and in place of a husband to their mother; judging the orphan and justifying the widow. And do not wrong the stranger and the poor, because sojourning abroad makes the one lowly, and need the other. And let no man devise evil against his brother in his heart, or, as it is said by the Seventy: And let each one not remember the malice of his brother in their hearts. By brother and neighbor we ought to understand either the whole race of men, because we are begotten of one parent, or those who are of the household of the faith, according to the parable of the Gospel, which wants the neighbor to be understood not as a blood relative but as all men. And that anger ought to be ended before the sun goes down, and the memory of all the evils we have suffered from others be blotted out, we read both in many places and most of all in Jeremiah, who speaks in the person of God: And do not, each one, remember in your hearts the malice of his neighbor.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
