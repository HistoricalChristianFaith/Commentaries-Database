[[commentary]]
quote='''
The same thing is said in other words: "What you do not wish to be done to you, do not do to others; and whatever you wish that men should do to you, do you also likewise the same to them" (ibid. 7:12). I do not wish my wife to be defiled by adultery, I do not wish my property to be plundered, I do not wish to be crushed by false testimony, and, to comprise everything in a brief word, I take it ill that anything unjust should be done to me. If, through love working in me, I either do or wish these same things for another, the whole law is fulfilled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
