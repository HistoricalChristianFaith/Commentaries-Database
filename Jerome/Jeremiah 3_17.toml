[[commentary]]
quote='''
At that time they will call Jerusalem the throne of the Lord, and all the nations will be gathered to it in the name of the Lord in Jerusalem, and they will not walk after the depravity of their most wicked heart. The Lord will by no means sit upon the ark of the testament and the cherubim, to whom that people formerly used to say: you who sit upon the cherubim, show yourself, but all who believe with a perfect mind will be the throne of God. Or certainly the whole is better understood of the Church, when all the nations are gathered in the name of the Lord into 'Hierusalem', in which is the 'vision of peace', and by no means walk after the depravity of their most wicked heart, so as to do what they desire, nor follow their own errors, but say with the prophet: my soul has clung after you, your right hand has upheld me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
