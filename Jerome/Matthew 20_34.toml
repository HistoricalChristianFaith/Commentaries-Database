[[commentary]]
quote='''
The Creator bestows what nature had not given; or at least mercy accords what weakness had withheld.

They then who had sat shut up in Jericho, and knew only to cry with their voice, afterwards follow Jesus, not so much with their feet as in their virtues.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252020.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus, having pity on them, touched their eyes, and at once they saw and followed him. He touches their eyes, and the craftsman supplies what nature had not given, or at any rate what infirmity had taken away; mercy bestows it, and at once they saw and followed him. Those who before sat huddled in Jericho and knew only how to cry out afterward follow Jesus not so much with their feet as with their virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
