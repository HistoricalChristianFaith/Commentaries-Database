[[commentary]]
quote='''
But because the season for buying was now past, and the day of judgment was coming on, so that there was no room for penitence, they must not now lay up new works, but give an account of the old.

After the day of judgment, there is no more opportunity for good works, or for righteousness, and therefore it follows, And the door was shut.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252025.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But while they were going to buy, the bridegroom came. They give advice indeed, as prudent ones, that they ought not to go to meet the bridegroom without oil for their lamps. But because the time for buying had already gone by, and with the day of judgment arriving there was no place for repentance, as the psalmist says: But in hell who will give thanks to you, they are compelled not to accomplish new works but to render an account of past ones.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
The bridegroom came, and those who were ready went in with him to the wedding, and the door was shut. After the day of judgment no opportunity for good works and justice will be left.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
