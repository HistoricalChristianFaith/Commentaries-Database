[[commentary]]
quote='''
At his voice he gives a multitude of waters in the heaven. For all the teaching of the Lord flows from heavenly things, as David says: A willing rain you will set apart, O God, for your inheritance, and it was weakened; but you have perfected it. And he lifts up — or brings out — the mists from the ends of the earth. The mists or clouds, which the Lord commanded not to rain a shower upon Israel, are brought out from the extremities of the earth; one of these mists said: For I think that God has displayed us apostles as last, as men destined to death, because we have been made a spectacle to this world, both to angels and to men. He has made lightnings into rain. For when the shower of teachings has come from heaven and has sated the parched hearts of men, then you will find flashes and the bright lightnings of wisdom. And he brings out the winds from his treasuries, in which are hidden all the treasures of wisdom and knowledge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
