[[commentary]]
quote='''
Where the authority of the apostles goes before, above all of Peter and James, whom the vessel of election calls pillars of the Church, there every suspicion of a differing explanation must be removed, and what is expounded by such great men, that must be followed. In the Acts of the Apostles, when a question had been raised among the apostles as to why Paul and Barnabas had received men from the Gentiles without circumcision and the observance of the sabbath, Peter answered as he ought; and James, approving his judgment, spoke thus: Men, brothers, hear me: Simon has related how God first visited to take from the Gentiles a people, for his name, and with this the words of the prophets agree; as it is written: After these things I will return, and I will build the tabernacle of David that has fallen, and its ruins I will rebuild, and I will set it up; that the rest of men may seek the Lord, and all the Gentiles upon whom my name has been invoked, says the Lord who does these things; known to the Lord from eternity is his work.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
