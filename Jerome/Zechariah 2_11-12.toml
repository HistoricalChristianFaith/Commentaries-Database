[[commentary]]
quote='''
Some of the Jews think that these things were in part fulfilled under Zerubbabel and Joshua, Ezra and Nehemiah, especially since Jerusalem is chosen and Judah is possessed; that is to say, the two tribes which returned from the Babylonian captivity and were called Judah, and not Israel, which lives among the Medes to this day. Others, however, defer them to the future: that then the nations are to believe in him who is sent by the Lord, and Jerusalem is to be chosen; although surely all the nations have already believed in the Lord Savior, and a city that has been utterly destroyed cannot be chosen.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
