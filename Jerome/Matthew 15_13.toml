[[commentary]]
quote='''
Shall that plant also be rooted up of which the Apostle says, I planted, Apollos watered? (1 Cor. 3:6.) The question is answered by what follows, but God gave the increase. He says also, Ye are God's husbandry, a building of God; and in another place, We are workers together of God. And if when Paul plants, and Apollos waters, they are in so doing workers together with God, then God plants and waters together with them. This passage is abused by some who apply it at once to two different kinds of men; they say, 'If every plant, which the Father hath not planted shall be rooted up, then that which He has planted cannot be rooted up.' But let them hear these words of Jeremiah, I had planted thee a true vine, wholly a right seed, how then art thou turned into the bitterness of a strange vine? (Jer. 2:21.) God indeed has planted it, and none may root up His planting. But since that planting was through the disposition of the will of him which was planted, none other can root it up unless its own will consents thereto.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But he answered and said: Every planting that my heavenly Father has not planted will be uprooted. Even the things that seem plain in the Scriptures are full of questions. Every planting, he says, that my heavenly Father has not planted will be uprooted. Then that planting too will be uprooted of which the Apostle says: I planted, Apollos watered. But the question is solved by what follows: But God gave the increase. He himself also says: You are God's tillage, God's building; and in another place: We are God's fellow workers. But if fellow workers, then, when Paul plants and Apollos waters, God plants and waters together with his workers. Those who bring in different natures misuse this passage, saying: If the planting that the Father has not planted will be uprooted, then the one he has planted cannot be uprooted. But let them hear that word of Jeremiah: I planted you a true vine; how you have turned into the bitterness of a strange vine. God did indeed plant, and no one can uproot his planting. But since this planting rests in the will of its own free choice, no one else will be able to uproot it unless it gives its own assent.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
