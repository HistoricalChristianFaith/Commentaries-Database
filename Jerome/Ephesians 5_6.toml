[[commentary]]
quote='''
Let no one deceive you with empty words: for because of these things the wrath of God comes on the sons of unbelief.

Words that deceive and trip us up are empty and void; but those that build up the hearers are full, heaped up, packed tight. Since, then, there are very many who say that there will be no punishments for sins, nor torments applied from outside, but that sin itself and the consciousness of the offence serve as the penalty, while the worm does not die in the heart and a fire is kindled in the mind, after the likeness of a fever, which does not torment the sick man from outside, but, seizing the bodies themselves, punishes what it possesses without the application of tortures from outside: these persuasions, then, and fraudulent snares he has called empty and void words, which seem to have a certain flower of speech and to flatter sinners; but while they grant confidence, they rather carry them off to eternal punishments. For at nothing is God so angered as when a sinner is proud and, upright and stiff, is not bent to weeping, nor asks mercy for his offence. For because of these things the wrath of God comes upon the sons of unbelief, or, of unpersuadability: for ἀπηθεία (disobedience) can be understood as the contrary of persuasion rather than of trust. The sons of unpersuadability, or of unbelief, are so called in the way that there are sons of perdition, and sons of fornication, and sons of death, and sons of gehenna, and other things like these, which it is very easy to find in various places of the Scriptures.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
