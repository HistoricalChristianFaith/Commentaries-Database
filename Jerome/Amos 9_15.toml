[[commentary]]
quote='''
And when the mountains and hills have done all these things, dripping sweetness, and building cities, and dwelling in them, planting vineyards, and drinking their wine, making gardens, and eating their fruits, then the Lord will plant the planters themselves upon their own land, of which it is said: I believe that I shall see the good things of the Lord in the land of the living, and in the Gospel: Blessed are the meek, for they shall possess the land. And after he has planted them, and made them firm with a root driven deep, he will not uproot them any more from the land which he had given them. From this we understand that the Church, until the end of the world, is indeed shaken by persecutions, but can by no means be overthrown; tempted, not overcome. And this will come about because the Lord God Almighty, or the Lord her God, that is, the Church's, has promised that he will do it, he whose promise is a law of nature.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
