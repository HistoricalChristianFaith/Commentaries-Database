[[commentary]]
quote='''
But also their love, and hatred, and rivalry, and all that they could have in the world, is ended by the coming of death; nor can they any longer do anything justly, nor sin, nor add virtues, nor vices. Some, however, contradict this exposition, asserting that even after death we can both grow and diminish; and what he now says: And they will have no portion any longer in the world, in all that has been done under the sun, they understand in such a way as to say that they have no communion in this world and under this sun which we see, but that they do have it under another world, of which the Savior says: I am not of this world, and under the sun of justice; and that the opinion is not excluded which contends that, after we have departed from this world, rational creatures can both offend and earn merit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
