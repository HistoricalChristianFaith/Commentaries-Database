[[commentary]]
quote='''
And that harlot who had been joined to God, and had borne three children, two males and one female, the first Jezreel, the second Without Mercy, the third Not My People, may see that because of the seed of God the names of things have been changed, and that in the faith of Christ she who was Without Mercy has obtained mercy, and he who was formerly called Not a People has been called the people of God. From this we perceive that everything that has been said can be referred both to the ten tribes, which are called Israel, and which under the name of the harlot bore three children, and to the whole race of the Jewish name.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
