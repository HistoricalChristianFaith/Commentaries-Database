[[commentary]]
quote='''
To the praise of the glory of his grace, in which he graced us in the Beloved.

What praise of the glory of God's grace is it, they say, to grace some in Christ and to prepare others for eternal punishments: to love Jacob before he comes forth from the womb, and to hate Esau before he had committed anything worthy of hatred, unless causes have gone before which prove the righteousness of God? Every grace, therefore, that we obtain is fulfilled unto the glory and praise of him who justified us in the Beloved, that is, in our Lord and Savior: because without wisdom, truth, righteousness, peace, redemption and the other virtues no good can be understood. Nor must we suppose that what is found in the Latin manuscripts, in his beloved Son, is what was written, but simply in the Beloved; and if indeed there had been added the beloved of God, or the beloved of the Father, the meaning would be simple and common to everyone's opinion, namely that our Lord Jesus Christ was loved by the Father; but we would grant nothing great to what is proper to the Son, since the Son would be loved in the same way as everything else. For it is said to God: You love all things, and cast away none of the things that you have made: for you did not create anything while holding it in hatred (Wisd. 11:23). Or if there had been set beside it, in which he graced us in the one beloved above all, every scruple would have been removed, since we know that the patriarchs and prophets and all holy men were loved by God. But now, since he has spoken absolutely, saying in the Beloved, it seems to me that it must be understood with by all supplied. For if Christ, as we have often said already, is wisdom, righteousness, peace, joy, continence and the rest, even those who cannot follow these names of virtues love them, and no one is of such avowed wickedness as not to say that he loves wisdom and righteousness. Just as the opinion of all men agrees concerning the substance of God, that it is divine and is not easily comprehended by anyone's mind, and yet each one errs when he thinks it to be of this kind or of that: so also all love Christ insofar as he denotes the various virtues, although most cannot prove by their deeds what they love. This is the Beloved whom I think is signified in Isaiah too: I will sing to the beloved a song of the beloved of my vineyard (Isa. 5:1); and: A vineyard was made for the beloved; and in the twenty-eighth psalm: The Lord shall crush the cedars of Lebanon, and break them in pieces like the calf of Lebanon, and the beloved is like the son of unicorns (Ps. 28:6).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
