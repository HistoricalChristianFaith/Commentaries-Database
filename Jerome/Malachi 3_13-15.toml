[[commentary]]
quote='''
Your words have grown strong against me, says the Lord, and you have said: What have we spoken against you? You have said: Vain is he who serves God, and what profit is it that we have kept his commandments, and that we have walked sorrowful before the Lord of hosts? So now we call the arrogant blessed, since those who work impiety have been built up, and they have tempted God, and have been saved. LXX: You have made your words heavy against me, says the Lord. And you have said: In what have we spoken against you? And you have said: Vain is he who serves God; and what more. Because we have kept his commands, and because we have walked as suppliants before the face of the Lord Almighty? And now we call strangers blessed, and all who work iniquity are built up, and they have resisted God, and have been saved. He had said earlier: You have made the Lord labour with your words, and you have said, in what have we made him labour? In this, when you said: Everyone who does evil is good in the sight of the Lord, and such men please him; or else, where is the God of judgement? Now he repeats the same thing more fully. For the people that had returned from Babylon seemed to have knowledge of God, and to observe the law, and to understand its sin, and to offer victims for sin, to render tithes, to observe the sabbath, and the other things that are commanded by the law of God; seeing all the nations round about abounding in all things, while itself was placed in want and famine and misery, it was scandalized at each thing, and said: What does it profit me that I worship the one and true God, abhor idols, and, pricked by the consciousness of my offences, walk sorrowful before God? This passage, as we said above, Psalm 72 (73) pursues more fully and at greater length.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
