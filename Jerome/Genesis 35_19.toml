[[commentary]]
quote='''
Let someone say concerning Ephrata: here he said Bethlehem. For we read in Genesis: "He came into Bethlehem, this is Ephrata." This is said of Jacob, when his wife Rachel died, that is, in Ephrata. But let us see why Ephrata received its name. For it is written in Chronicles that Miriam, the sister of Moses and Aaron, had for her husband Hur — not Ur, but Hur. And afterward the lineage is described, and it is said: "Miriam, the sister of Moses and Aaron, this is Ephrata." This is written in the books of Chronicles: seek and you will find. And so this Ephrata too received its name from that Ephrata. Perhaps it seems to someone not to be true, because it is new: but I refer him to the authority of the book.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_044.html'
source_title="Homily 44, on Psalm 131"
