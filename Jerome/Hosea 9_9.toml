[[commentary]]
quote='''
We can also take the days of Gibeah as that time when, in place of God, they chose for themselves a king from the city of Gibeah, that is, Saul. And he says that they have now sinned much more greatly by choosing Jeroboam and worshiping idols than at the time when they chose Saul; for here idolatry too was joined to schism, but there the worship of God remained among the people. Therefore he will remember their iniquity, he who is now thought, because of his patience, to have forgotten, and he will visit their sins, and the wounds which have long festered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
