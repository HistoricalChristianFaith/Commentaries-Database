[[commentary]]
quote='''
What follows, however: And he measured its length of twenty cubits (or, as is contained in the Seventy, forty), the breadth also of twenty cubits before the face of the temple, signifies this: that before the face of the temple and at its entrance the measure of past labor and contest always meets us; for the same meaning that the double number holds among the single numbers, the two decades have. And this must be considered: that, having entered within through the gate of two cubits in front, which has six cubits and seven in breadth on either side and twenty cubits in length and as many in the very doors of the temple, the prophet is taught what that place is, or by what name it is called: for he said, he says, to me: This is the Holy of Holies. But if before the temple, or, as Scripture names it, before the face of the temple, there is the Holy of Holies, how great a blessedness ought we to reckon there is in the innermost recesses of the temple and in its interior — of which the prophet speaks: This is labor in my sight, until I enter into the sanctuary of God; I shall understand in their last things —! But this too must be noted, that in the description of the tabernacle Sancta sanctorum [holies of holies] is said in the plural number, but here Sanctum sanctorum [holy of holies] in the singular number, so that after the holy things we may come to the Holy — just as after many songs we arrive at the Song of Songs, which is the song of all songs and singing which we are joined in the embraces of the Bridegroom —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
