[[commentary]]
quote='''
By these names there seem to me to be signified either various punishments or the devil himself, who is rightly called both lion and bear and snake. And when we think that we hear Isaiah saying: Go, my people, into your chambers; shut the door, hide yourself for a little while until the wrath of the Lord passes, and that we are as it were in our own house, as it were resting in hell, then the snake will bite us, which in the present place is called Nahas, and in Job is called Leviathan, about whose nature and manifold terror we learn more fully in that book itself. But in the gloom and darkness, which are the opposites of brightness and light, the diversity of torments is set forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
