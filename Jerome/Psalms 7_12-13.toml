[[commentary]]
quote='''
For all the sinners of the people shall perish by the sword, not, surely, by a bodily sword — since there are many and various ways to death besides the sword —, but by a spiritual sword, with which those are to be struck who have not repented, and whom the psalmist threatens, crying out: Unless you are converted, he will brandish his sword; he has bent his bow and made it ready, and in it he has prepared the vessels of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
