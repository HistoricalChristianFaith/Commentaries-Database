[[commentary]]
quote='''
And because they had, nay rather made, their heart adamant, esteeming hardness of heart by their own will, so as not to hear the words of the Lord which he sent in his spirit, that is, in the Holy Spirit, by the hand of the former prophets, Isaiah, Hosea and the rest, who had clean hands, and who, it is plain, were before the captivity: therefore, for great sins, great indignation came about, and the words of the Lord were fulfilled, who repays like for like, so that, as they walked perversely toward him, he too should go perversely against them, and not hear the words of those crying out, because they too had despised the words of the Lord with a deaf ear.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
