[[commentary]]
quote='''
For it must be considered, that the multitude could not enter into the house to Jesus, nor be there where the Apostles heard mysteries; therefore the Lord in mercy to them departed out of the house, and sat near the sea of this world, that great numbers might be gathered to Him, and that they might hear on the sea shore what they were not worthy to hear within; And great multitudes were gathered unto him, so that he went into a ship, and sat down, and all the people stood on the shore.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252013.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
On that day Jesus, going out of the house, sat beside the sea, and great crowds were gathered to him. The people could not enter the house of Jesus, nor be where the apostles were hearing the mysteries; therefore the compassionate and merciful Lord goes out of his house and sat beside the sea of this world, so that the crowds might be gathered to him and hear on the shore what they did not deserve to hear within.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
