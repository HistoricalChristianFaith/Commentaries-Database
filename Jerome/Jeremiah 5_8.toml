[[commentary]]
quote='''
They have become horses, lovers toward the females. For 'stallions' in the Hebrew is written 'mosechim', which all with one accord translated helkontes, that is, 'drawing', so that the size of the genitals may be shown, according to that saying of Ezekiel: like the flesh of asses is their flesh. This is what is written in another place: they were likened to senseless beasts and became like them. And at the same time he shows so great a madness of lust that he calls it not the appetite of pleasure but chremetismon, that is, 'neighing', and keeps the metaphoran [metaphor] of horses raging for lust.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
