[[commentary]]
quote='''
I, then, who gave you strength, and am the only God, myself make things contrary to one another, light and darkness, that is, day and night; peace and evil, that is, leisure and war; by which he signifies both that he was angry with his people, when it endured the darkness of captivity and the evils of bondage, and again that he had mercy on it, when, sent back to their homeland, they received peace and joy. For as darkness is contrary to light, so war is contrary to peace. Hence let the heresy be confounded which thinks God the founder of evils; since here evil is set not as the contrary of good, but for affliction and war, according to what is written in the Gospel: Sufficient for the day is its own evil (Matt 6:34).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
But the evil which the Lord does in the city is not the contrary of virtue, but affliction and torment, of which we read: Sufficient to the day is its own evil, that is, tribulation and distress. And in the prophet we read: I am God, who made light and darkness, who make peace and create evils. For just as darkness is contrary to light and day, so war too is contrary to peace; it is not evil in itself, but seems to be evil to those who endure it. And that we may know that in the holy Scriptures evil is sometimes taken not as the contrary of virtue but as affliction, punishments and distress, let us take one more example, from Jonah: And God saw their works, that they had turned from their most wicked ways, and he repented over the evil which he had spoken of doing to them. The evil there is surely the overthrow of the Ninevites, which God had threatened through the prophet, and not the evil contrary to virtue, which belongs to sin, on account of which he was threatening torments to sinners.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
