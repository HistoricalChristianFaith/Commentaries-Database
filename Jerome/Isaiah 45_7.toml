[[commentary]]
quote='''
I, then, who gave you strength, and am the only God, myself make things contrary to one another, light and darkness, that is, day and night; peace and evil, that is, leisure and war; by which he signifies both that he was angry with his people, when it endured the darkness of captivity and the evils of bondage, and again that he had mercy on it, when, sent back to their homeland, they received peace and joy. For as darkness is contrary to light, so war is contrary to peace. Hence let the heresy be confounded which thinks God the founder of evils; since here evil is set not as the contrary of good, but for affliction and war, according to what is written in the Gospel: Sufficient for the day is its own evil (Matt 6:34).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
