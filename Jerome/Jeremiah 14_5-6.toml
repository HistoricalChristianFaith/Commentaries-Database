[[commentary]]
quote='''
For the hind also — or the hinds — gave birth in the field — or they gave birth — and forsook — or they forsook —, because there was no grass. And the wild asses stood on the crags, they drew in the wind like dragons; their eyes failed, because there was no grass or hay. Great is the barrenness when even the hinds give birth in the field and forsake their young because there is no grass or hay, so that they, which by the scent of their nostrils draw serpents out of their holes and kill venomous creatures, do not enjoy the food of grace; and when the wild asses also, of which it is written: Who has sent out the wild ass free into the wilderness?, leaving the plains and the open country, stand on the crags and cannot run, and draw in the wind after the likeness of dragons, and their eyes fail and cannot see the clear light, since rational food has been withdrawn. This drought often happens in the churches, when both stags and wild asses are found among the peoples and waste away through a dearth of teachers: there are those who could learn, and there are none who could teach.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
