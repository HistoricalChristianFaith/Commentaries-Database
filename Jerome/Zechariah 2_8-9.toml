[[commentary]]
quote='''
He was sent, therefore, after the glory of the divine majesty, to the nations that despoiled the people of God, so that those who had formerly plundered them might be spoil for those who served them, and the whole crowd of those who once served might know that the Lord Almighty has sent him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
