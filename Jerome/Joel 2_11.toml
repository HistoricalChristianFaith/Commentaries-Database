[[commentary]]
quote='''
The Lord also will give his voice before the face of so powerful an army, for his camps are many, and the greatness of his power is shown even in small creatures. And these many and innumerable camps are exceedingly strong, and doing his word. By this saying it is shown that the Babylonians will come by the will of God, and will obey his command. Great is, he says, the day of the Lord, in which Jerusalem is to be taken, and very terrible; and no one will be able to endure it, and to escape the necessity of captivity or of death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
In all these things the Lord will give his voice before the face of his army. For as the Babylonians, punishing Jerusalem, are called the army of God, so the most wicked angels, of whom it is written: Fury and wrath and distress, a sending by most wicked angels, are called the army of God and are named his camps, while they do the will of the Lord. Great is the day of the Lord and terrible, of which it is written elsewhere: Why do you desire the day of the Lord? And this is darkness, and not light; and very terrible; and hardly anyone, or no one, will be able to endure it without offering in himself material for its raging.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
