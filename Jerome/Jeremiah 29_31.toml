[[commentary]]
quote='''
And the word of the Lord came to Jeremiah, saying: Send to all the exile, saying: Thus says the Lord to Shemaiah the Nehelamite: Because Shemaiah has prophesied to you and I did not send him, and he has made you trust in a lie, therefore thus says the Lord: Behold, I will visit upon Shemaiah the Nehelamite and upon his seed; there shall not be a man sitting in the midst of this people, and he shall not see the good which I will do to my people, says the Lord, because he has spoken transgression against the Lord. The false prophet Shemaiah, truly a 'Nehellamites', who had taken up foreign and troubled waters from the 'torrent', is angry that Jeremiah has written true things against his lie, and he sends letters to Zephaniah the priest, asking why the prophet dared to write the truth, and he desires that he be shut up in prison so that he may not speak. Zephaniah too secretly accuses the prophet, while he reads the letter of the liar and boasts that he holds his accusation. How much more guilty of crime are those who defend false prophets and cherish liars and make the evil inventions of others their own sins!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
