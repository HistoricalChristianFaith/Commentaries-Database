[[commentary]]
quote='''
And she is told to lift up her eyes round about, and see the sons who had been gathered to her. Of whom the Lord too spoke: Lift up your eyes, and see that the fields are already white for harvest (John 4:35). And to make us secure: As I live, says the Lord (which, according to the Old Testament, is said by the custom of swearing), you shall be clothed with all these as with an ornament, and you shall put them about you, as a bride puts a necklace about herself. Happy is he who is of such merit and such virtue that he is called an ornament of the Church. I think, moreover, that these signify the various spiritual graces by which the bride's array is adorned. Of her too it is sung in Psalm 44 (45): The queen stood at your right hand in gilded clothing, surrounded with variety (Ps 44 [45]:10).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
