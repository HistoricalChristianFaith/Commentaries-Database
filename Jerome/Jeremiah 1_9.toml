[[commentary]]
quote='''
And the Lord put forth his hand and touched my mouth, and the Lord said to me: Behold, I have given my words in your mouth. It is to be noted that here the hand of God is put forth to touch the mouth of the prophet, and it is said to him: behold, I have given my words in your mouth, whereas in Isaiah it is written: and one of the seraphim was sent to me, and in his hand he had a coal which he had taken with tongs from the altar, and he touched my mouth and said: behold, this has touched your lips, and it will take away your iniquities and cleanse your sins. For there, because he was of firm and mature age, and he himself simply confesses that he has unclean lips and dwells in the midst of a people having unclean lips, one of the seraphim is sent, to touch his mouth not with a hand but with tongs and a coal, and to take away his iniquities and cleanse his sins. But here the hand of God himself is put forth, through which he has wrought all things, and which in another place is called the arm, not to take away sins, which on account of his boyhood he had not committed in great number, but to bestow the grace of speaking. Further, Ezekiel devours a book written within and without, containing both divine mysteries and the simple history. Jeremiah's mouth is touched and the words of the Lord are bestowed, that he may receive confidence in preaching. And beautifully, according to the letter, a hand is put forth, so that, seeing the likeness of human limbs, he may not dread the touch of the hand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
