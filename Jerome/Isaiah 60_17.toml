[[commentary]]
quote='''
For bronze I will bring gold, for iron I will bring silver, and for wood bronze, and for stones iron; and I will make your visitation peace, and your overseers righteousness. Iniquity will no more be heard in your land, devastation and destruction in your borders; and salvation will occupy your walls, and praise your gates. LXX: For bronze I will bring you gold, and for iron I will give you silver, and for wood I will grant you bronze, and for stones iron. And I will give your princes in peace, and your bishops in righteousness; and iniquity will no more be heard in your land, nor destruction and misery in your borders; but your walls will be called salvation, and your gates carving. The same thing, according to the nature of its position, is a genus to one, a species to another. And so as not to seem to say anything about the arts of rhetoric and dialectic, I shall give common examples which can instruct the simple reader. My son, who in relation to me is a species and has me as his genus, is a genus to his own son. I shall give another: what is greater to one is smaller to another. A centurion is greater than a common soldier, smaller than a tribune. Five are few compared with ten, many compared with one. So in the restoration of the spiritual Jerusalem, wood will be turned into bronze, and stones will be changed into iron; that is, men once brutish and senseless will be changed into those materials which provide some use to the city. And the bronze and iron themselves, through the increase of virtues, will be changed into gold and silver, so that they have not merely the appearance of usefulness but value as well and beauty. What gold and silver signify in the holy Scriptures we have often said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
