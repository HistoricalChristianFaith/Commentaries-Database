[[commentary]]
quote='''
God has joined by making man and woman one flesh; this then man may not put asunder, but God only. Man puts asunder, when from desire of a second wife the first is put away; God puts asunder, who also had joined, when by consent for the service of God we so have our wives as though we had them not. (1 Cor. 7:29.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
What therefore God has joined, let man not separate. God has joined them by making one flesh of man and woman; this man cannot separate, unless perhaps God alone. Man separates when, out of desire for a second wife, we put away the first; God, who also had joined, separates when by consent, for the service of God, because the time is short, we so have wives as though we did not have them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
