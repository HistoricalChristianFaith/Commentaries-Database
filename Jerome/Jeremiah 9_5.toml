[[commentary]]
quote='''
And what he adds: they have taught their tongue to speak falsehood or their tongue has learned to speak falsehood, shows that the habit of lying is in a manner turned into nature, and that they act with zeal so as to do wicked things.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
