[[commentary]]
quote='''
Is this man Coniah an earthen vessel, and broken? Is he a vessel without any pleasure — or usefulness —? Why are he and his seed cast away and cast forth into a land which they did not know? For what we said: Is he an earthen vessel, and broken, Symmachus translated: Is he refuse or worthless sweepings, and cast away?; in place of which there is nothing in the Seventy, but they translated only this: Jeconiah has been dishonored like a vessel in which there is no usefulness. And when this is said of Jeconiah, son of Jehoiakim, does anyone dare to refer it to the type of Christ, and, from the fact that the Apostle says that the Lord Savior is the image of the invisible God, the firstborn of all creation, that is, wisdom, word, truth, life and righteousness, to say that he is called the ring which is cast off or torn away from the hand of the Lord and handed over to King Nebuchadnezzar? They are cast away, he says, he and his seed, and cast forth into a land which they did not know, which no one doubts happened to Jeconiah. 'Iechonias' means 'the preparation of the Lord'; in the present passage the first syllable, that is, the name of the Lord, is taken away from him, and he is called 'Chonias', so that 'prepared for perdition and destruction' is understood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
