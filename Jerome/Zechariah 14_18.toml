[[commentary]]
quote='''
And if the families of Egypt do not go up and do not come, neither shall it be upon them; but there shall be the ruin with which the Lord will strike all the nations that do not go up to celebrate the solemnity of tabernacles. This shall be the sin of Egypt, and this the sin of all the nations that do not go up to celebrate the festival of tabernacles. LXX: But if the tribe of Egypt does not go up, nor come there, upon them also shall be the ruin with which the Lord will strike all the nations that did not go up to keep the solemnity of the scenopegia. This shall be the sin of Egypt, and the sin of all the nations that do not go up to celebrate the solemnity of the scenopegia. Whoever is an Egyptian, or of the other nations, as long as he remains an Egyptian and a heathen, will not go up into Jerusalem; and because he cannot go up, nor lift his step to the heights, therefore upon him there shall be no rain of the Lord's blessing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
