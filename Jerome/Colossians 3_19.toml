[[commentary]]
quote='''
To husbands it belongs only to love, because love is of the perfect: Husbands, he says, love your wives and do not be bitter towards them, even though they provoke you to anger and do such things as to deserve to endure bitterness. For this is what παραπικραίνεσθαι means; yet do not repay them in kind with bitterness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
