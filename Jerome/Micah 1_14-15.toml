[[commentary]]
quote='''
And not only upon Lachish will the tumult and the chariots come, but also upon Gath, the chief city of Philistia, of which I had said above: In Gath do not announce it; for the Assyrian will send his brigands, whom he calls emissaries, and will possess the house of idolatry and the city of lying, which was a stumbling to the kings of Israel. As for what follows: Still I will bring an heir to you who dwell in Mareshah, he has alluded beautifully to the name; for since Mareshah means inheritance, he called the coming of the enemies into her heirs; and Mareshah, that is, the inheritance, will come as far as Adullam, a city of Judah, which Adullam is glorious among the cities of Israel. In short, Symmachus too translated thus: Ἔτι κληρονόμον ἄξω καί σοι κατοικία Μαρέσα, ἕως Ὀδολλὰμ ἥξει τῆς δόξης Ισραὴλ, that is: Still I will bring an heir to you too, dwelling of Mareshah; as far as Adullam will come of the glory of Israel; that is, you who are glorious among the cities of Israel. And where gloriae is said, let it be the genitive case of the singular number, huius gloriae, of this glory, and not the nominative plural, hae gloriae, these glories. Or certainly let us understand it thus: The captivity of Israel which came to Lachish, and Gath, and Mareshah, will come as far as Adullam too. And of the glory of Israel should be read more pointedly, so that κατὰ ἀντίφρασιν (by antiphrasis) ignominy or devastation is meant. Moreover, as to our having interpreted above the city of the prophet, Moresheth, as inheritance, let the reader know that in the same little verse which we set down, Therefore he will give emissaries upon the inheritance of Gath, in the Hebrew, maraseth Geth is written for the inheritance of Gath. Thus far, according to the Hebrew, as best we could and as it seemed to us, certainly as we heard it from the Hebrews, we have steered our little boat as though among rocks and very sharp crags; whether it has entered port or still tosses on the open sea, it will be for the reader's prudence to judge. Now, by your prayers, let us go on to other waves, and, with shipwreck of the exposition threatening on this side and on that, let us escape if we can.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
