[[commentary]]
quote='''
The lamp they too understand as Christ himself, because he shines in the Church, he who said of himself: No one lights a lamp and puts it under a bushel, that is, under the measure of the law, but upon a lampstand, that is, the freedom of the Gospel, so that it may give light to all who are in the house.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
