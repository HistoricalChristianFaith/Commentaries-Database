[[commentary]]
quote='''
You have been anointed with the oil of gladness above your fellow people, above your apostles. You possess the font of unction; they, the drops.
'''
source_url=''
source_title="HOMILY ON PSALM 132[133]"

[[commentary]]
quote='''
To him the Psalmist had already said: You have loved righteousness and hated iniquity; therefore God, your God, has anointed you with the oil of exultation above your fellows (Ps 44 [45]:8). For when fellows are named, understand the nature of the flesh, since God has no fellows of his substance. And because the anointing was spiritual, and by no means of a human body, as it was among the priests of the Jews, he is therefore said to have been anointed above his fellows, that is, the other saints. His anointing was fulfilled at the time when he was baptized in the Jordan, and the Holy Spirit came down upon him in the form of a dove and remained on him (John 1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
