[[commentary]]
quote='''
You have been anointed with the oil of gladness above your fellow people, above your apostles. You possess the font of unction; they, the drops.
'''
source_url=''
source_title="HOMILY ON PSALM 132[133]"

[[commentary]]
quote='''
To him the Psalmist had already said: You have loved righteousness and hated iniquity; therefore God, your God, has anointed you with the oil of exultation above your fellows (Ps 44 [45]:8). For when fellows are named, understand the nature of the flesh, since God has no fellows of his substance. And because the anointing was spiritual, and by no means of a human body, as it was among the priests of the Jews, he is therefore said to have been anointed above his fellows, that is, the other saints. His anointing was fulfilled at the time when he was baptized in the Jordan, and the Holy Spirit came down upon him in the form of a dove and remained on him (John 1).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
And when he has washed, and cleansed her of the blood — the blood from which, by the touch of his fringe, he also healed the αἱμορροοῦσαν [woman with a flow of blood] who for twelve years had been running with gore —, it is not enough to wash with water and cleanse from blood, unless he also anoints with oil, according to which the Samaritan, which means 'guardian', first soothed the wounds of the half-dead man by pouring in oil, then checked them with the sharpness of wine; but our Lord was anointed with another oil, which would not soothe the pain of wounds but grant gladness, as the Holy Spirit says to him: Therefore God, your God, has anointed you with the oil of exultation above your fellows.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And above all kinds of ointments there is a spiritual ointment, which is called the oil of exultation, with which the Savior is anointed, and it is said to him: Therefore God, your God, has anointed you with the oil of exultation above your fellows. And I think his fellows are those to whom John too speaks: And you have an ointment from the Holy One. And a little after: These things I have written to you concerning those who lead you astray; and the chrism which you received from him, let it abide in you; and you have no need that anyone teach you, but the chrism itself will teach you about all things, and it is true and is not a lie, and as it has taught you, abide in it. And lest perhaps those who have lost the chrism of baptism should despair of the chrism being restored, it is written in Leviticus that when the leper cast outside the camp has come to the priest, and his leprosy has been cleansed, the priest shall pour oil into his own left hand, and, having dipped his finger, sprinkle the oil seven times before the Lord, and touch with the same oil the ear of him who had been a leper, and his right hand, and his right foot, and whatever remains of the ointment he shall put entirely on his head. And when he has duly completed all these things, then he shall offer a holocaust for him, and the man himself shall be called the anointed of God. I wish to say something, but I fear lest I give the careless an occasion of ruin: that in the holy Scriptures the same man is often found anointed. Indeed, David was anointed three times; which let us not understand of one who has sinned and is anointed again — for it suffices for the leper that, after the first ointment has been lost, he be anointed a second time —; but of one who advances day by day, and whose anointing is ever increased; and he passes from the oil of the leper to the oil of the people and of the saints, and from the oil of the people he arrives at the oil of the priests, and from the priests he rises to the chrism of the high priest, from the high priest also to the king, from the king to the patriarchs, and from the patriarchs he proceeds to Christ; and he is anointed with the oil of exultation, and whoever has been smeared with it is made one spirit with God, and where the Father and the Son are, there he too will be. But this is rare, and these are the prayers of believers. Besides, I do not know whether the effect follows. For it is said: God, your God, has anointed you with the oil of gladness above your fellows, that is, with that oil which those who are your fellows will be able to find either rarely or never.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
