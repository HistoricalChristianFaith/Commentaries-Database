[[commentary]]
quote='''
In that day I will raise up the tabernacle of David that has fallen, and I will rebuild the openings of its walls, and what had collapsed I will restore, and I will rebuild it as in the days of old, that they may possess the remnant of Idumea, and all the nations, because my name has been invoked upon them, says the Lord who does these things. LXX: In that day I will raise up the tabernacle of David that had fallen, and I will rebuild what had collapsed, and what has been undermined I will raise up, and I will restore them as the days of old, that the rest of men may seek me, and all the Gentiles upon whom my name has been invoked, says the Lord who does all these things. Where the authority of the apostles goes before, above all of Peter and James, whom the vessel of election calls pillars of the Church, there every suspicion of a differing explanation must be removed, and what is expounded by such great men, that must be followed. In the Acts of the Apostles, when a question had been raised among the apostles as to why Paul and Barnabas had received men from the Gentiles without circumcision and the observance of the sabbath, Peter answered as he ought; and James, approving his judgment, spoke thus: Men, brothers, hear me: Simon has related how God first visited to take from the Gentiles a people, for his name, and with this the words of the prophets agree; as it is written: After these things I will return, and I will build the tabernacle of David that has fallen, and its ruins I will rebuild, and I will set it up; that the rest of men may seek the Lord, and all the Gentiles upon whom my name has been invoked, says the Lord who does these things; known to the Lord from eternity is his work. This tabernacle of David, then, which had fallen — and it had fallen in those who say: It will not draw near, and evil will not come upon us, whom the Lord had shaken in his sieve and tested, and whose threshing floor he had cleansed with the winnowing fan of his majesty, and whoever had been sinners he killed with the sword —, he now says, according to the custom of the Scriptures, promising prosperous and joyful things after torments, after punishments, that he will raise up, and that in the resurrection of the Lord he will restore all things, so that what had fallen in the synagogues may rise in the churches, and believers may possess the remnant of Idumea, and all the nations; so that whatever is left of the bloodthirsty and earthly kingdom may be changed into heavenly kingdoms, and all the Gentiles who have forgotten the Lord may be converted and return to him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
