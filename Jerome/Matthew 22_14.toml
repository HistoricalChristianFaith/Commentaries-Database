[[commentary]]
quote='''
And because in the marriage and supper the chief thing is the end and not the beginning, therefore He adds, For many are called, but few chosen.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252022.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Many, however, are called, but few chosen. In a brief little sentence he sums up all the parables: that in the work of the vineyard, and in the building of the house, and in the wedding banquet, it is not the beginning but the end that is sought.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
