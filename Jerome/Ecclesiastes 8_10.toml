[[commentary]]
quote='''
So while I was directing my mind to look upon these things, I saw the impious dead with such a reputation, and so buried, that they were reckoned holy on earth; men who even while they lived were thought worthy of the Church and of the temple of God, and who moreover, walking puffed up, were praised in their evils. For the sinner is praised in the desires of his soul, and he who does iniquity is blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
