[[commentary]]
quote='''
And as to what follows: Between the vestibule and the altar the priests shall weep, for vestibule the LXX translated base; Symmachus προπύλον (gateway); Aquila πρόδομον (front hall); Theodotion put the Hebrew word itself, ulam, which we can call the space before the doors of the temple, and the portico. And note what he commands the priests who are ministers of the Lord: that they weep between the temple and the altar, and say with the Apostle: Who is weak, and I am not weak? Who is made to stumble, and I do not burn? and: To weep with those who weep. And the place fit for repentance and confession is the temple and the altar; and he teaches what the priests ought to say, or rather how they ought to entreat the Lord: Spare, O Lord, your people, which, when it sinned, was called not your people; now, after it has withdrawn from its vices, is called your people. And do not give your inheritance to reproach, that the nations should rule over them. The riddle that lay hidden is laid open. For that people many and strong, which above was described under the name of the caterpillar, and the locust, and the cankerworm, and the blight, is now shown more plainly who it is: That the nations, he says, should rule over them. And the inheritance of the Lord is given to reproach when they have served enemies, and the nations have said: Where is their God, whom they boasted to be their protector, their defender? We can also interpret the nations as the adverse powers, which, so long as we do not do penance, rule over us, and taunt us and say: Where is their God? The Jews refer this passage to Gog and Magog, most savage nations which they say will come against Israel in the last time, of which it is written more fully in Ezekiel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
