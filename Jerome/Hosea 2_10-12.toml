[[commentary]]
quote='''
These things, both according to the history and according to tropology, unhappy Judea has suffered: all her shame has been uncovered in the eyes of the Gentiles, and no one could rescue her from the hands of God. All the ceremonies have ceased, the festivity has been turned into mourning; all that she thought was given her by the demons, she now knows has been taken away because she offended God. First the Assyrians and the Chaldeans devoured her, the Medes and the Persians and the Macedonians; at the last the most savage beast tore her apart, the empire of the Romans, whose name is passed over in silence in Daniel, so that the dread of those who are to be devoured may be made greater. What we have said of Judea, refer to the heretics, who, promising doctrine and knowledge at first sight, having gone out from the Church, are deserted by God; and all their disgrace is set in the sight of their lovers, whom they had deceived before; and, handed over to the beasts which the prophet shuns when he says, Do not hand over to the beasts the soul that confesses you, they will be left to their bites.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
