[[commentary]]
quote='''
As for what it says, and the sons of Dadan were Asurim and Latusim and Laomim: they think Asurim is rendered 'merchants', Latusim 'those who hammer out the metals of bronze and iron', and Laomim φυλάρχους, that is, princes of many tribes and peoples. Others contend that the Syrians were called after this Asurim, and that the regions of India were occupied by many of the sons of Abraham by Keturah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
