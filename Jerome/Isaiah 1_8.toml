[[commentary]]
quote='''
The daughter of Zion shall be left like a shelter in a vineyard, and like a hut in a cucumber field. That all Israel is called a vineyard the same Prophet testifies in what follows, saying: For the vineyard of the Lord Sabaoth is the house of Israel, and the man of Judah his young and beloved planting (below, Isa 5:7); and in the Psalm: You have brought a vine out of Egypt; you have cast out the nations and planted it (Ps 79 [80]:9). As long as this vineyard bore the richest fruit, it had God as its keeper, of whom it is written: He who keeps Israel will neither slumber nor sleep (Ps 120 [121]:4). But after all who passed along the way had stripped it of its grapes, and the boar out of the wood had laid it waste, the Lord left his temple and, rising up in anger, said: Arise, let us go hence; and: Your house shall be left to you desolate (Matt 23:38). And through Jeremiah: I have left my house, I have abandoned my inheritance. My inheritance has become to me like a lion in the forest; it has given forth its voice against me, therefore I have hated it (Jer 12:7). The likeness of the devastation of the Temple and of Jerusalem is taken from farmers, who, as long as the vineyard is full of grapes, place keepers in shelters. In a cucumber field too, which the Seventy call a watch-place for fruit, little huts are made to keep off the heat and the rays of the sun; and from there they drive away either men or the small beasts that are wont to lie in wait for the growing crops. But when such produce has been carried away, the withered shelters of branches and the huts remain, the keeper departing, because he no longer has anything to guard. So too almighty God has forsaken the Temple and made the city desolate: which there is no need to prove with words, especially to us, who see Zion desolate and Jerusalem overthrown and the Temple razed to the ground. And in calling her the daughter of Zion he shows the affection of a most merciful parent. Nor is it surprising that Zion should be called a daughter, since even Babylon is very often named daughter. For we are all by nature sons of God, but by our own fault we become strangers. According to the anagogy, our soul can be called the vineyard of God and the orchard of fruit: if the mind, that is, νοῦς, presides over it, it has God as the keeper of the mind; but if vices, like certain beasts, have plundered us, we are left by God our keeper, and all our things will be reduced to desolation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
