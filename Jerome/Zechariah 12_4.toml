[[commentary]]
quote='''
On that day, says the Lord, I will strike every horse with astonishment, and its rider with madness; and upon the house of Judah I will open my eyes, and every horse of the peoples I will strike with blindness. LXX: On that day, says the Lord Almighty, I will strike every horse with astonishment, and its rider with madness; but upon the house of Judah I will open my eyes, and all the horses of the peoples I will strike with blindness. At that time — for this is what 'day' signifies —, when Jerusalem shall have been besieged, so that Judah too is compelled to besiege her, the Lord will strike, both carnally and spiritually, all the horses of the adversaries with astonishment, so that all who see that they have been struck are astonished, and their riders, under the pressure of the greatness of their ills, will be turned to madness; and upon the house of Judah, who were being compelled to do something against their mother city, the Lord will open his eyes, to have mercy on them, and to make them worthy of his gaze, and to illumine them with the light of his eyes; but all the horses of the peoples he will strike with eternal blindness. What horses are to be understood spiritually we have said above: A horse is deceptive for safety, and: These in chariots, and those in horses, and other things like these. Their riders too we said were either demons or false teachers, who will all be turned to astonishment and madness, so that they are convicted of knowing nothing, but darkness that can be felt overwhelms them, such as there was when the firstborn of the Egyptians were struck. But upon the house of Judah, that is, the people that confesses God and that, broken by the straits of persecution and terrified by fear, seems to be in the number of the persecutors, the Lord will open his eyes, so as to look back upon many who say to him: Look upon me, and have mercy on me; and they may deserve to hear: And the Lord shall be to you an everlasting light. This is the tearing by the very heavy stone, which the Lord threatens against his adversaries, who tried to lift and harass Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
