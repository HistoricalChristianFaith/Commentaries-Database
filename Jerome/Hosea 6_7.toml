[[commentary]]
quote='''
But they have imitated Adam, so that what he had done in paradise, passing over my covenant and law, these did on earth. And there, that is, in paradise, all have dealt treacherously against me, in the likeness of the transgression of Adam. For it is no wonder if what went before in the parent is condemned in the children also.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
