[[commentary]]
quote='''
O blessed change! Once the body wept, but now laughs forevermore. Once it desired the broken cisterns of which the prophet speaks, but now it has been satisfied in the Lord, the fountain of life.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_108.html'
source_title="LETTER 108.22"

[[commentary]]
quote='''
Let him "possess his vessel in sanctification and honor," let him drink of his own wells, not out of the dissolute cisterns of the harlots that cannot hold within them the pure waters of chastity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_128.html'
source_title="LETTER 128.3"

[[commentary]]
quote='''
Between a well and a pit, that is, a cistern, there is this difference: a well has perpetual waters, flowing from a living spring; a cistern, which keeps water cool, holds waters that are external and brought in from outside. Hence God speaks through the prophet Jeremiah: They have forsaken me, the fountain of living water, and dug for themselves cisterns which cannot hold water.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
