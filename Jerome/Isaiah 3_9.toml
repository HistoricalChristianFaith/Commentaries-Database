[[commentary]]
quote='''
The recognition of their countenance will answer them: that is, they have received back their own sins; or, as the Seventy translated, the confusion of their countenance has stood against them: that is, they have always had their own offenses before their eyes. And just as the Sodomites, sinning with all license and having not even any shame in their crime, said to Lot, Bring the men out, that we may lie with them (Gen 19:5): so these too, crying out publicly, proclaimed their sin and had no modesty in blaspheming. For to hide one's impiety is the second plank after shipwreck and a consolation of miseries. Hence they are also called princes of Sodom, because they had the sins of Sodom.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
