[[commentary]]
quote='''
After this, for its vestibule, that is, for the threshold of the gate, the entrance, eight cubits are set, so that the inner parts of the vestibule may hold not the number seven, and six cubits and one handbreadth, but the number eight, which pertain to the mystery of the resurrection and of the Lord's day. 'And on the front', he says, 'of the same vestibule there were two cubits', which pertain either to both Testaments, or to the letter and the spirit, or to the mystery of the tongs with which, in Isaiah, the coal is taken from the altar and carried to cleanse the prophet's lips; and so that we may know what this vestibule is which is bounded by eight and two cubits, he puts it more plainly: And the vestibule of the gate was within, through which we come to the temple of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
