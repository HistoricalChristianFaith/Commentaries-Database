[[commentary]]
quote='''
These things the Lord God showed me: And behold, a hook for fruit, and he said: What do you see, Amos? And I said: A hook for fruit. And the Lord said to me: The end has come upon my people Israel; I will not again pass him by any more, and the hinges of the temple shall creak in that day, says the Lord God; many shall die, in every place silence shall be cast. LXX: Thus the Lord God showed me: And behold, a fowler's vessel. And he said: What do you see, Amos? And I said: A fowler's vessel. And the Lord said to me: The end has come upon my people Israel; I will not again pass him by any more; and the ceilings of the temple shall howl in that day, says the Lord God. Many will be falling: in every place I will cast silence. What Jeremiah sees under the figure of the rod of watchings, or of the nut, because God kept watch over the sins of his people, lest, as though with eyes shut and blinking, he should not see their offenses, this Amos now beholds against Judah and Israel alike under the appearance of a hook, which in Hebrew is called chelub and is turned by the LXX into a fowler's vessel; whereas a fowler is properly called moces, as we read above in this same prophet: If a bird will fall upon the earth without a fowler. And the sense is: As the branches of trees are drawn down with a hook to pick the fruit, so I have drawn near the time of captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
