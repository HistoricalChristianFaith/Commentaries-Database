[[commentary]]
quote='''
Nor are the heretics, of whom and to whom this is said, content with this limit of impiety, but they read the law of God outside, withdrawing from the Church, and tried to join confessions and testimonies to each of their dogmas, which they feigned with a perverse heart; or they sacrificed from what is leavened, concerning which it is said in the Gospel: Beware of the leaven, that is, the teaching of the Pharisees. And they did these things not by error, but by design; not by a chance will, but with the fullest affection for their forebears.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
