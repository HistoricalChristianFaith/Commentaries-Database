[[commentary]]
quote='''
Now the particulars must be interpreted as though he were speaking not in another's person but in his own: Go, eat your bread in gladness, and drink wine with a good heart; for your works have well pleased God. Since you have learned that all things are ended by death, and that in hell there is no repentance, nor any return to the virtues, while you are in this world, hasten, strive, repent while you have time, labor. For God gladly receives the penitent. Otherwise: taken simply, too, it is profitable, according to that saying: Whether you eat, or drink, or whatever you do, do all things in the name of the Lord. And in another place: Drink wine with counsel. For he who abuses created things beyond measure does not have true gladness and a good heart. But it is better to think thus: he whose works have well pleased before God will never be able to lack the true bread, and the wine that has been trodden out from the vine of Sorek. So a precept has been given us which says: You have desired wisdom: keep the commandments, and the Lord will supply it to you. Let us keep the commandments, and we shall be able to find the spiritual bread and wine. But to him who does not keep the commandments, and boasts in the abundance of bread and of wine, it is said through Isaiah: Do not say also: I know it; you have neither known, nor do you know, nor from the beginning did I open your ears. For I know that, despising, you despise. Further, what is said in the Seventy translators: Come, eat your bread in gladness, is the voice of that Ecclesiastes who also speaks in the Gospel: Whoever thirsts, let him come to me and drink. And in Proverbs: Come, eat my loaves and drink my wine.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
