[[commentary]]
quote='''
Nor indeed should it be supposed that Scripture is the author of sin because it is said to have shut up all things under sin, since the commandment which is enjoined by right rather shows and convicts sin than is the cause of sin. So too a judge is not the author of a crime by binding wicked men: rather he shuts them up and, by the authority of his sentence, pronounces them guilty, so that afterwards, if he so wills, the sovereign may by his indulgence absolve those who are liable to punishment.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
