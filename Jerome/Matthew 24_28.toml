[[commentary]]
quote='''
By an instance from nature, which we daily see, we are instructed in a sacrament of Christ. Eagles and vultures are said to scent dead bodies even beyond sea, and to flock to feed upon them. If then birds, not having the gift of reason, by instinct alone find out where lays a dead body, separated by so great space of country, how much more ought the whole multitude of believers to hasten to Christ, whose lightning goeth forth out of the east, and shines even to the west? We may understand by the carcase here, or corpse, which in the Latin is more expressively 'cadaver,' an allusion to the passion of Christ's death.

They are called eagles whose youth is renewed as the eagle's, and who take to themselves wings that they may come to Christ's passion. (Ps. 103:5. Is. 40:31.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
We are invited to flock to Christ's passion wheresoever in Scripture it is read of, that through it we may be able to come to God's word.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252024.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Wherever the body is, there the eagles will be gathered together. By a natural example which we see daily we are instructed in the mystery of Christ. Eagles and vultures are said to perceive corpses even across the seas and to gather to food of this kind. If, then, irrational birds, by a natural sense, though separated by such great spaces of land and by the waves of the sea, perceive where a small corpse lies, how much more ought we and the whole multitude of believers to hasten to him whose lightning goes out from the east and appears even to the west! But by the body, that is, πτῶμα, which is more expressively called in Latin a cadaver, from the fact that it falls through death, we can understand the passion of Christ, to which we are summoned, so that wherever it is read in the Scriptures we may gather together; and through it we can come to the word of God, as in that saying: They have dug my hands and feet; and in Isaiah: As a sheep led to the slaughter, and other things like these. And the saints are called eagles, whose youth is renewed like the eagle's, and who, according to Isaiah, grow feathers and take on wings so as to come to the passion of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
