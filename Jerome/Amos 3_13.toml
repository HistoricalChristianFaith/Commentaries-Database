[[commentary]]
quote='''
Hear and testify in the house of Jacob, says the Lord God of hosts, that in the day when I begin to visit the transgressions of Israel upon him, I will visit also upon the altars of Bethel; and the horns of the altar shall be cut off and shall fall to the ground; and I will strike the winter house with the summer house; and the houses of ivory shall perish; and many houses shall be scattered, says the Lord. LXX: Priests, hear: testify to the house of Jacob, says the Lord God Almighty, that in the day when I avenge the iniquities of Israel upon him, I will avenge also upon the altars of Bethel; and the horns of the altar shall be undermined and shall fall upon the ground. I will confound and strike the winged house upon the summer house, and the houses of ivory shall perish; and many other houses shall be added, says the Lord. What is put at the beginning of the section according to the Seventy, priests, is not found in the Hebrew, but in place of this word is read ares, which Aquila interpreted as pallet; and I think that the Seventy put the Hebrew word itself, which some, not understanding it, read in place of ares as ἱερεῖς, that is, priests. Now the prophetic word commands that they first hear, and then testify in the house of Jacob, that is, among the ten tribes, what the Lord has said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
