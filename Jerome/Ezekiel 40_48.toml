[[commentary]]
quote='''
The aforesaid man also brought Ezekiel into the vestibule, or πρόπυλον, of the temple, which he measured at five cubits on this side and five on that, since he who was brought in had been instructed in the divine senses, and knew neither the right hand nor the left, but walked by the royal road; and the breadth of the gate itself, through which was the entrance to the vestibule of the temple, had three cubits 'on this side and on that' — in which the elegance of holy Scripture is to be observed, that it did not say 'on the right and on the left', lest it should seem to name anything sinister in the Holy of Holies, but 'on this side and on that', that is, on either side —, and at once the prudent reader understands that the number three pertains to the mystery of the Trinity, which is the gate of those who enter to God, since the Father is in the Son and the Son in the Father, and the Holy Spirit in both; and this threefold number is the one gate of those who, after the baptism of the Trinity, come to salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
