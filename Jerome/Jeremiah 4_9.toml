[[commentary]]
quote='''
And it shall be in that day, says the Lord: the heart of the king shall perish, and the heart of the princes, and the priests shall be astounded, and the prophets shall be dismayed. While the plunderer lays waste the Church of the Lord and the wrath of the Lord remains against us, all help will be useless. The heart of the king shall perish, whose heart ought to be in the hand of God, and the heart of the princes, who were thought to be wise; for God has made foolish the wisdom of the world, because through it they did not know God. The priests themselves too, who ought to teach the law of the Lord and to defend the peoples subject to them from the fury of the lion, made senseless by a kind of stupor, shall be turned to madness — for so the Seventy translated, expressing 'ecstasy of mind' for 'stupor' — and the prophets shall be dismayed, or, as Aquila translated the Hebrew word 'iethmau', they shall be out of their minds. For who would not go mad, who would not lose heart, when he sees the princes and kings and priests and prophets that were once his own under the lion?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
