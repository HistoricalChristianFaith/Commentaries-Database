[[commentary]]
quote='''
Some, not understanding this place, refer Lebanon and the fir trees and pines and the oaks of Bashan, and the wooded or fortified forest, to the opposing powers, of which it is also said in Ezekiel, under the name of Asshur and of Pharaoh: Behold, Asshur was a cypress on Lebanon, fair in its branches, and thick with shade, and lofty in its height, and its top was among the clouds; water nourished it, the abyss raised it on high, and the rest, which are said both of Asshur and of Pharaoh, and they think these are said either of the opposing powers, or of all the proud and the princes, of whom we also read in the psalm: The voice of the Lord breaking the cedars, and the Lord will break the cedars of Lebanon, and in another place: The day of the Lord Sabaoth upon everyone who is insolent and proud, and upon everyone who is lofty and exalted, and a little after: And upon every cedar of Lebanon that is lofty, and upon every oak tree of Bashan. And of this Lebanon, they assert, it is prophesied: Lebanon shall fall with its lofty ones. But let us follow the former interpretation, especially since what follows also agrees with this sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
