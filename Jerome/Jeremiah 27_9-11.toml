[[commentary]]
quote='''
You therefore, do not listen to your prophets and diviners and dreamers and augurs and sorcerers, who say to you: You shall not serve the king of Babylon; for they prophesy a lie to you, to remove you far from your land and to drive you out, and you perish. But the nation that puts its neck under the yoke of the king of Babylon and serves him, I will leave it in its own land, says the Lord, and it shall till it and dwell in it. In this place too the allegorical interpreter raves, and exhorts those set in the heavenly Jerusalem not to hear their prophets and diviners, dreamers and augurs and sorcerers, but rather to serve Nebuchadnezzar and take on the body of humility, infancy, the wailing and the cradles of little ones; for if they do this, when their servitude and the condition of human mortality have been fulfilled, they will return to their land and dwell in it and work the works which they worked before. And he says that he suspects that those who have despised the commands of God to be weighed down with human bodies will become demons and unclean spirits and will by no means regain their former seat. But let us expound simply: that there are among the nations prophets, who pretend that they foretell things to come by a divine spirit; and diviners, of whom there is also the common proverb: 'the wise, they say, divine'; and dreamers, who imitate Joseph and Daniel; and augurs, who by the flight of birds and the voices of omen-birds announce what is to be done or not to be done; and sorcerers, whom we can call either poisoners or those who serve the phantasms of demons, who in Hebrew are called 'chassane'. 'All these', he says, 'deceive you and trip you up, so that you may not serve the king of Babylon'. For it is much better to take up servitude voluntarily and to have as a friend the one you serve, and to till your native land, than to serve as captives by force and necessity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
