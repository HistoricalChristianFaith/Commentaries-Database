[[commentary]]
quote='''
When I begin, he says, to visit the transgressions, or impieties, of the house of Israel, and to render to them what they deserve, and the time of captivity has come, then the altars of Bethel shall be destroyed, where the golden calves were, and the horns of the altar shall be cut off, the altar which was split apart when Jeroboam too stretched out his hand, and they shall crash to the ground, broken, as the Assyrian lays waste.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
