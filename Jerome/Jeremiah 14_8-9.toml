[[commentary]]
quote='''
Why will you be like a settler in the land and like a traveler turning aside to lodge? Why will you be like a wandering man or a mighty one who cannot save? LXX: why have you become like a stranger in the land and like a native turning aside to lodge? Will you be like a man asleep and like a man who cannot save? The Jews understand this passage thus: 'Why do you separate yourself from your people and, like a traveler, for the refreshment of a single hour not care what lodging you use, but, being about to pass on to other places, not save your people and forsake the temple once renowned?' Our people, however, think that it is said of the future dispensation of Christ: that he was to be a pilgrim in the land and to use the hospitality of the earth for a short time, and, like a man passing through and strong, having left Israel, to make for the multitude of the Gentiles, so as to pass from place to place, from people to people, from the temple to the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
