[[commentary]]
quote='''
They are at once wise and foolish; their teaching, according to the quality of their talent, is either cheap and is compared to wood, or is like silver because of the charm of its eloquence; it is brought from Tarshish — either it is a region of India, as Josephus would have it, or else the whole sea is called Tarshish and has a likeness to the sky — and yet it is wrapped in the artifice of words; for if it were laid open, it could not deceive. And gold from Uphaz. Gold is called by seven names among the Hebrews, of which one is called 'ophaz', which we can call 'obryzum' [refined gold], so that it may gleam on the surface of the idols, which within is wood and of cheap material. They are covered with blue and purple, so that by their surface they may deceive the eyes, while they promise themselves the color of the heavens and the heavenly kingdoms; and yet all these things are works of the wise, who are thought wise in the world, but before God are foolish.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
