[[commentary]]
quote='''
And when the virgins fail, the young men too will fail, who had previously conquered the world; and they will fail for this reason, because they swear by the idol of Samaria, which we always take as standing for the heretics, as this same prophet says: Woe to those who despise Zion, and trust in the mountain of Samaria. For the heretics despise the Church of the Lord and trust in the falsity of their own dogmas, raising themselves up against the knowledge of God, having split his people, and saying: We have no portion in David, nor inheritance in the son of Jesse. If anyone, therefore, swears by the sin of Samaria and says: Your god lives, Dan, and the way of Beersheba lives, he will fall and will not be able to rise again any longer. The tribe of Dan could not find a possession in the farthest borders of the Jews, as is written in the book of Judges, and Dan is interpreted 'judgment'. Beersheba, according to the variety of accents, is rendered into our language 'well of the oath', or 'well of plenty', and 'of the seventh'. Therefore the heretics too will thirst at the farthest borders of the holy Scriptures, despising the judgment of God and desiring the way of Beersheba, which was in the tribe of Judah; and, desiring to imitate many mysteries of the Church, they say that they are sated and filled. These the apostle Paul reproaches: Already you are sated, already you have become rich; and they swear in the name of the Lord; and, once fallen, since they consider the gods of the idols to be their god, they will not rise again any more. But those who are willing to repent, and do not say: Your god lives, Dan, and the way of Beersheba lives, will hear through Jeremiah: Shall he who falls not rise again, or he who has turned away not return.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
