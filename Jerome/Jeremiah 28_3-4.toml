[[commentary]]
quote='''
Which Nebuchadnezzar, king of Babylon, took from this place and carried over into Babylon. Jeconiah, son of Jehoiakim, king of Judah, and all the exile of Judah, who went into Babylon, I will bring back to this place, says the Lord; for I will break the yoke of the king of Babylon. For which the Seventy translated: Jeconiah and the exile of Judah, because I will break the yoke of the king of Babylon, briefly setting down the sense of the Hebrew truth rather than its words. Now Hananiah the 'prophet' — as he then seemed to the people — promises that not only the vessels but also King Jeconiah is to be brought back to Jerusalem, and that the yoke of the Babylonian king is to be broken, that is, his empire destroyed, and that this would come about before two years were yet completed, so that the nearness of the time of the promise might increase the greatness of the joy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
