[[commentary]]
quote='''
The sin of Judah is written with an iron stylus, with an adamantine nail, engraved upon the breadth of their heart — or on the breast of their heart — and on the horns of the altars — or altar-stones — of them. Concerning the nations which had been converted to the Lord, it was said above: behold, I will show them at this turn, I will show them my hand and my power; now he speaks of Israel, which has been cast off: the sin of Judah is written with an iron stylus, with an adamantine nail, and so on. Why this was passed over by the Seventy I do not know, unless perhaps they spared their own people, as it is evident that they did also in Isaiah: cease therefore from man, whose breath is in his nostrils, because he himself has been reckoned exalted; and many things of this kind, for which, if I wished to set them all out, there would be need, I will not say of a book, but of books. The sins of the nations have been blotted out, because, converted to the Lord from the ends of the earth, they have heard this: praise the Lord, all you nations, praise him, all you peoples, because his mercy has been confirmed upon us, and the truth of the Lord remains forever; and they are those concerning whom he had said to Moses: let me alone, that I may kill this people, and I will make you into a great nation. But the sin of Judah, indelible and, so to speak, to be abolished by no means, is written with an iron stylus, with an adamantine nail, which in Hebrew is called 'samir': not that there is any nail which is called 'samir', but because the adamant stone, which received this name from the fact that it is untamed and unbreakable, has such polish and smoothness that one can write on it with an iron stylus without any hindrance, so that the hard substance of iron writes on a harder tablet of adamant, and what is written lasts forever. For they themselves said: his blood be upon us and upon our children. Hence it is also engraved or carved on the horns of the altars — or altar-stones — of them, so that the works of sacrilege may endure in eternal memory. But if this is so, where is that which the doting old woman invents, that a man can be without sin if he wishes, and that the commandments of God are easy?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
