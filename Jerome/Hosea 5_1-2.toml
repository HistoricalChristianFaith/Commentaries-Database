[[commentary]]
quote='''
According to tropology, the people is accused so that it may not think itself free of the crime if it was led astray by kings and priests, whom we understand as the princes of the heretics. The princes themselves are also accused, because like a snare they caught the people and, though set as watchmen in the Church, led them into error. And on Mount Tabor, lofty and most beautiful, which is interpreted coming light, they laid ambushes, so as to drag all whom they had deceived down into the depth and sacrifice them to demons, and turn aside the victims into the abyss, lest they should ever come to their senses, lest they should look up to the Church, the house of God. Some think that Tabor is interpreted pit, that is, cistern; and that it fits the present sense that the heretics have dug a pit and fallen into the ditch which they made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
