[[commentary]]
quote='''
Let them rejoice in their beds. "I will wash my bed every night; with my tears I will drench my couch." That belongs to the sinner, that belongs to the penitent; but this which is said, They shall rejoice in their beds, pertains to the saints, pertains to the just. Which of us rejoices in his bed? Who does not fight with his own flesh? When I have lain awake on my little bed, I do not rejoice, but I fight: I do not sigh for the kingdom of heaven, but I fight with the flesh. The burning of the flesh I drench with tears, and I quench it. For this reason it is said, I will wash my bed every night; with my tears I will drench my couch. My little bed, which burns with lust, is quenched with tears. Happy are those of whom it is said, They shall rejoice in their beds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_059.html'
source_title="Homily 59, on Psalm 149"
