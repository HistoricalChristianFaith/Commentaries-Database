[[commentary]]
quote='''
The heretics suppose that they appease God by a multitude of sacrifices; and churchmen, that by alms they redeem the sins in which they persist; whereas every sacrifice blots out past crimes, not present ones; therefore they do not find the Lord, who is taken away from such men and withdraws far off. These, indeed, have transgressed against God, and have begotten strange sons not to Christ but to the devil; therefore at all times their works are accursed, and all that they do the rust of bloody color lays waste, because they are next to blood and slaughter. Now rust is properly said to come down in the night dew and to stain the grain, still milky in the ear, with the color of vermilion or of red ochre; and fittingly, according to the ἀναγωγήν (anagogy), it lays waste the lots of the heretics, of whom it is said: Their lots will not profit them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
