[[commentary]]
quote='''
And I dug her for myself for fifteen pieces of silver, and a cor of barley, and half a cor of barley, and I said to her: Many days you will wait for me; you will not play the harlot, and you will not be for a man; but I also will wait for you. LXX: And I hired her for myself for fifteen pieces of silver, and a gomor of barley, and a nebel of wine, and I said to her: Many days you will sit for me; and you will not play the harlot, nor will you be for another man, and I for you. For gomor, in the Hebrew is written omer, which all the translators, except the LXX, have rendered cor, a word Greek and especially Palestinian, which holds thirty modii. And for nebel of wine, in the Hebrew is read lethech seorim, which the other translators rendered ἡμίκορον of barley, that is, half a cor, which makes fifteen modii. And what is added in the common edition: Nor will you be for another man; another is not found in the Hebrew, but simply you will not be for a man. For if another is put, it is understood that she is had by her own husband. But when it is said absolutely you will not be for a man, we understand that she is joined to no one at all, and is without marital intercourse. Now the measure of the cor we read in Ezekiel, and in the Gospel. So he dug her for himself, that is, the adulteress, or hired her for fifteen pieces of silver. When he says: I dug, he points to the vineyard which was planted by the Lord and is set down in many places of the Scriptures, signifying the people of the Jews. But if we read: I hired, it is the price of an adulteress, not so that she may sleep with the prophet, but so that, content with her wage, she may cease committing adultery and not be joined here and there to others. She is also dug, or hired, for a cor of barley and half a cor of barley, that is, for forty-five modii; and having received this wage, she heard from the Lord: Many days you will wait for me, or you will sit for me; you will not play the harlot nor be for a man. That is: neither will you shamefully prostitute yourself to other lovers, nor will you be lawfully joined to me, the man by whom you were hired. And lest you think a wrong has been done to you because I said: you will wait for me, I will repay like for like: and I also will wait for you. As the fifteenth day of the month Nisan was dawning, the firstborn of the Egyptians were struck, and the people of Israel was led out of Egypt and hired for a wage into the service of God. Finally, for the firstborn of Israel, which did not feel the common plague, take five shekels of silver each, which are contributed to the gifts of the temple. Most of our writers refer the fifteen to the hebdomad of the law and the ogdoad of the Gospel, that is, the Sabbath and the day of the resurrection, on which spiritual circumcision is practiced. But how an adulterous woman who is fed on barley and is estranged from her husband should receive both testaments as her wage, they cannot explain. On the forty-fifth day the people came to Mount Sinai, and at once on the next day they were commanded to sanctify themselves from intercourse with women for three days, and to prepare themselves to receive the law of God. When the three days had passed, on the fiftieth day Moses went up the mountain and received the Decalogue. So the people of the Jews, which was once hired for fifteen pieces of silver and forty-five modii of barley, has sat since the coming of the Lord the Savior, and awaits the coming of its husband. And when he says: You will not play the harlot, and you will not be for a man, he shows this: that in the meantime she does not now serve idols, and yet does not have God, but has been stripped both of her lovers and of her husband. And because she has no husband, she does not eat the food of men, grain and pulse, but the barley of irrational beasts of burden, chewing over the cheapness of the letter which kills, and not having the spirit which gives life. Hence also in the law, the woman who is accused of adultery by her husband, in the drink of ἐλεγμοῦ, that is, of conviction, when she is proved guilty of sin, receives barley meal; for she who has imitated horses and mules, which have no understanding, is sustained on the food of horses and mules. For half a cor of barley the Seventy translated a nebel of wine, which is not found in the Hebrew at all. And we can say: that in the nebel of wine, that is, a full and finished measure, the adulteress was made drunk and afflicted with full punishments. Hence Jeremiah too gives the cup of unmixed wine to drink to the nations and to Jerusalem. The husband also sits, or rather waits for the repentance of the adulteress, so that after the fullness of the Gentiles has come in, and Israel has believed last, so that what had been the head is turned into the tail, and the tail is turned into the head, then there may be one flock and one shepherd.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
