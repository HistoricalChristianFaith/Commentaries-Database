[[commentary]]
quote='''
And the hand is stretched out over the transgressing land so that the staff, or strength, of bread may be broken; and that hand, stretched out, threatens plagues, since he who stretches it out and lifts it up does not wish to strike sinners, but by its stretching out to terrify them and to preserve them once terrified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
