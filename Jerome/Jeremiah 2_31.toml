[[commentary]]
quote='''
See the word of the Lord: Have I become a wilderness to Israel, or a late-yielding land? Why then has my people said: We have withdrawn, we will come to you no more? LXX: hear the word of the Lord: thus says the Lord: Have I become a wilderness to Israel, or a land full of thorns, because my people said: We will not serve, nor will we come to you? Moses too saw the voice of God, and John the apostle says that he saw and handled the word of God. And he marvels how the people of Israel held God as a wilderness, while it followed idols as though they were the throng of cities. A late-yielding land is one that does not receive the rains of doctrines nor the discipline of the Gospel; and full of thorns, because it had not been cultivated. The people, then, that was once God's is the more wicked in this, that it withdrew from the Lord and is unwilling to return again to its God. It is a great offense to be unwilling to appease him whom you have offended.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
