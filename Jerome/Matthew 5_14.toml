[[commentary]]
quote='''
He instructs them what should be the boldness of their preaching, that as Apostles they should not be hidden through fear, like lamps under a corn-measure, but should stand forth with all confidence, and what they have heard in the secret chambers, that declare upon the house tops.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25205.html'
source_title="Catena Aurea by Aquinas"


[[commentary]]
quote='''
Just as the Lord, the Light, calls his apostles light, and says: You are the light of the world; and the Rock himself granted to Peter that he should be a rock; and the good Shepherd also bestowed on them the name of shepherds, and whatever he himself is called he granted to his servants that they too should be called; so the Savior himself willed his apostles to be saviors of the world, who went up to the watchtower of the mountain of the Church and, bringing down the pride of the Jews and of all the mountains that were raised up against the knowledge of God, prepared the kingdom for the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
