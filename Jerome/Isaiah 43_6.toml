[[commentary]]
quote='''
The same thing is signified also by that which is written: I will say to the north wind: Bring; and to the south-west wind: Do not hold back. For the south wind and the east wind are never commanded to bring, because those who are afterwards to be led to the east and the south must be in other regions. The north wind, therefore, brings its inhabitants to the south, and the south-west wind brings its own to the east. For they cannot make progress if they remain in their former seats.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
