[[commentary]]
quote='''
It appears that Matthew the Evangelist did not by preferring the authority of the old interpretation ignore the truth of the Hebrew text. Rather, as a Hebrew among Hebrews and deeply taught in the law of the Lord, Matthew distributed his Hebrew learning to the nations. For if the Septuagint translators are accepted when they write, "Jacob my son, I will lift him up; Israel my chosen, my soul has lifted him up," then how can we understand the text fulfilled in Jesus, since it was obviously written about Jacob and Israel? We read that the blessed Matthew, not only in this verse but in another, has done this: "Out of Egypt I have called my son," while the Septuagint translated, "Out of Egypt he has called his sons.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_121.html'
source_title="LETTER 121.2"

[[commentary]]
quote='''
For after the coming of the Lord and Savior, who gave the spirit of the gospel interpretation, [Christ] rested in the death of the Jewish letter, with which all works are bruised. Christ did not snuff out the smoking wick, reducing it to ashes. Instead, he ignited a great flame from this little spark, a spark that had almost gone out. The result is that the whole earth was ablaze with the fire of the Lord and Savior.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_121.html'
source_title="LETTER 121.2"

[[commentary]]
quote='''
A bruised reed, or a broken one, he will not break. For he will be easy to appease toward all, and will give pardon to sinners, saying to the woman: Take heart, daughter, your sins are forgiven you (Luke 7:48). And smoking flax, or, as the others translated, dim and dark, he will not quench: those who were near to being quenched were preserved by the clemency of the Lord (which we have discussed in the works mentioned above concerning the Jews and the nations); but he will judge all things with truth, in no way fearing the scribes and Pharisees, whom he boldly called hypocrites (Matt 7, 15, 22, 23 throughout, and Luke 6, 12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
A battered reed he will not break, and smoldering flax he will not put out. He who does not hold out a hand to a sinner and does not carry the burden of his brother, he breaks the battered reed. And he who despises the small spark of faith in little ones, he puts out the smoldering flax. Christ did neither of these things; for he had come for this, to save what had perished.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
