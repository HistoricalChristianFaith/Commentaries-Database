[[commentary]]
quote='''
And the prophetic discourse on the mockery of idols is woven more fully, but these things are easy to understand and do not call for a long-winded, nay, a superfluous exposition. On this Flaccus too writes in a Satire, deriding the images of the nations (Satires, book 1, 8): Once I was a fig-tree trunk, a useless log, when the craftsman, uncertain whether to make a stool or a Priapus, preferred that I be a god: thence I am a god, of thieves and birds the greatest terror. . . . . . . . . . . . . And whatever has been said of idols can be referred also to the chiefs of the heresies, who with a crafty heart put together the images of their doctrines and lies, and venerate what they know to have been feigned by themselves. Nor is their own error enough for them, unless they have deceived all the simple into worshiping them. They think gain to be godliness, and devour the houses of widows (1 Tim 6), and, abusing the ignorance of the common people, with the art of dialectic, as with adze and auger, file and plane, they form their god, and forge it with the hammer, and gild it with the charm of rhetorical speech: whose god is the belly, and whose glory is in their shame (Phil 3).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
