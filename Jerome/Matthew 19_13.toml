[[commentary]]
quote='''
Not because they liked not that they should have benediction of the Saviour's hand and mouth; but forasmuch as their faith was not yet perfect, they thought that He like other men would be wearied by the applications of those that brought them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252019.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then little children were brought to him, that he might lay his hands on them and pray; but the disciples rebuked them. Not that they were unwilling for them to be blessed by both the hand and the voice of the Savior, but because, not yet having the fullest faith, they thought that he, after the manner of men, was being wearied by the importunity of those who brought them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
