[[commentary]]
quote='''
For you will bring a robber upon them suddenly, because they have dug a pit to catch me and have hidden snares for my feet. But you, O Lord, know all their counsel against me unto death; do not be propitious to their iniquity, and let their sin not be blotted out from before your face; let them be falling — or stumbling — in your sight; in the time of your fury consume them or deal with them! If we understand it of Jeremiah, let us refer the sudden robber to Nebuchadnezzar; if of the Savior, which is truer and better, to the Roman army. And lest the sentence of God should seem unjust, he sets out what they did against Christ, the Son of God, and what they suffered.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
