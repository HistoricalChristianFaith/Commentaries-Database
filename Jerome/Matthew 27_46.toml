[[commentary]]
quote='''
He employed the beginning of the twenty-first Psalm. (Ps. 22:1. Vulg.) That clause in the middle of the verse, Look upon me, is superfluous; for the Hebrew has only 'Eli, Eli, lama sabachthani,' that is, My God, my God, why hast thou forsaken me? It is impiety therefore to think that this Psalm was spoken in the character of David or Esther or Mardocheus, when passages taken out of it by the Evangelist are understood of the Saviour; as, They parted my garments among them, and, They pierced my hands.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And about the ninth hour Jesus cried out with a loud voice, saying: Heli Heli lema sabacthani, that is: My God, my God, why have you forsaken me? He made use of the beginning of Psalm 21 (22); and what is read in the middle of the little verse: Look upon me, is superfluous. For in the Hebrew it is read: My God, my God, why have you forsaken me? Therefore they are impious who think that the psalm was spoken in the person of David, or of Esther and Mordecai, since even the evangelists understand testimonies taken from it as concerning the Savior, such as this: They divided my garments among themselves, and upon my vesture they cast lots; and another: They dug through my hands and my feet. Nor should you wonder at the lowliness of the words and the complaints of one forsaken, since, knowing the form of a servant, you see the stumbling block of the cross.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
