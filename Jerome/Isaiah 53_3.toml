[[commentary]]
quote='''
And what he adds, A man in pain, and knowing how to bear infirmity, or a man of sorrows, and knowing infirmity, shows the true body of a man and a true soul, he who, knowing how to bear infirmities, overcame them all by his divinity. And his face was hidden and despised, so that the divine power was concealed by the human body; of whom it was said above: You are a hidden God, and we did not know.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
