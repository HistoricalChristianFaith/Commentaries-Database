[[commentary]]
quote='''
For thus says the Lord: exult with gladness, Jacob, and neigh against the head of the nations; sound aloud, sing and say: save, O Lord, your people, the remnant of Israel! Significantly, not the whole of Israel is saved, but the remnant of Israel, the Lord commanding and saying: 'exult with gladness, you who are of Jacob, and neigh toward the head of the nations, referring all things to it, because the tail was once turned into the head; sound aloud and sing and say!' What is it that they are bidden to say? Save, O Lord, your people. Which people? Surely the remnant of Israel, which has been saved according to election, of whom Paul too speaks, taking up the testimony of Isaiah: unless the Lord of Sabaoth had left us seed, we should have become as Sodom and we should have been made like Gomorrah.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
