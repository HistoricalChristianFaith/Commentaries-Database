[[commentary]]
quote='''
For I am calling a sword upon all the inhabitants of the earth, says the Lord of hosts. This is the most undiluted drink, this the cup of the Lord's fury, which is called not upon Jerusalem alone but upon the whole earth and all the nations round about; of which he had said above: 'and I will send to Nebuchadnezzar, king of Babylon, my servant, and I will bring them upon this land and upon its inhabitants and upon all the nations that are round about it.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
