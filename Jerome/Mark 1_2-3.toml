[[commentary]]
quote='''
(ad Pammach. Epist. 57) But this is not written in Isaiah, but in Malachi, the last of the twelve prophets.

By Malachi, therefore, the voice Πνεύμκτος Ἅγιου of the Holy Spirit resounds to the Father concerning the Son, who is the countenance of the Father by which He has been known.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Mark%2FChapter%25201.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Mark the evangelist also, weaving together two testimonies, of Malachi and of Isaiah, under the utterance of one prophet, began thus: The beginning of the Gospel of Jesus Christ, as it is written in Isaiah the prophet: Behold, I send my angel before your face, who will prepare your way. This, though in other words, we read in Malachi. But what follows, The voice of one crying in the desert, prepare the way of the Lord, make his paths straight, is said by Isaiah the prophet; and at once, explaining of whom both testimonies are said: There was, he says, John in the desert, baptizing and preaching the baptism of repentance, for the remission of sins. But the evangelists too interpreted the prophecy of the prophets concerning John, and while they agree in sense, they differ in words. For whereas the LXX rendered: Make the paths of our God straight, Mark and Luke said: Make his paths straight. But John: Make straight, he says, the way of the Lord. From which it is clear that the apostles and evangelists, and the Lord Savior himself, do not follow the authority of the LXX translators, which, having knowledge of the Hebrew tongue, they do not need, but translate from the Hebrew what they had read, not caring about the syllables and points of the words, provided that the truth of the sense is carried over. That they did this in many places we have indeed shown, and especially in that book which we entitled 'On the Best Kind of Translating' it has been proved by many testimonies together.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
