[[commentary]]
quote='''
But they devised malice against the Lord, building up most impious heresies, and returned to the state of the Gentiles, so as to be without the knowledge and the yoke of God; or they returned to nothing, not that they ceased to be, but because, in comparison with him who speaks to Moses: Go, say to the people of Israel: He who is has sent me, all who think against the Lord are said not to be. According to what we read in Esther, in the Seventy only. Do not hand over your scepter to those who are not: there is no doubt that it means idols. For if God is truth, whatever is contrary to truth is a lie, and is called nothing. This fits the heretics, who, instructed from the holy Scriptures, turn the words of the law and the prophets and the Gospel against the Lord; and they are like a deceitful or perverse bow. A deceitful and perverse bow is one that strikes the one who aims it, and wounds its own master. Or they have become like a bent bow, always ready for battle and contentions, to the subversion of their hearers. Hence their princes, that is, the heresiarchs, are struck by the Lord's sword because of the madness of their tongue, with which they blasphemed the Lord; doing in a Church falsely so called the same thing they did at the time when they dwelt in the Egypt of the world, that is, when they were Gentiles. For all the questions of the heretics and of the Gentiles are the same, because they follow not the authority of the Scriptures but the sense of human reason.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
