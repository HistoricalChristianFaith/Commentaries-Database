[[commentary]]
quote='''
And in truth what need was there that he should proclaim with his mouth what was evidently showed in his body?

He sends him to the Priests, first, because of His humility that He may seem to defer to the Priests; secondly, that when they saw the leper cleansed they might be saved, if they would believe on the Saviour, or if not that they might be without excuse; and, lastly, that He might not seem, as He was often charged, to be infringing the Law.

It was ordained in the Law, that those that had been cleansed of a leprosy should offer gifts to the Priests; as it follows, And offer thy gift as Moses commanded for a testimony to them.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25208.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And Jesus said to him: See that you tell no one. And truly, what need was there for him to boast in words of what he displayed in his body?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
But go, show yourself to the priest and offer the gift that Moses commanded, as a testimony to them. He sends him to the priest for various reasons. First, for humility's sake, that he may be seen to defer to the priests. For it was commanded in the law that those who had been cleansed of leprosy should offer gifts to the priests. Next, so that, seeing the leper cleansed, they might either believe the Savior or not believe; if they believed, they would be saved; if they did not believe, they would be made inexcusable; and at the same time, so that he might not seem — a thing they very often charged against him — to break the law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
