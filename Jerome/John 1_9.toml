[[commentary]]
quote='''
But to reveal his Son in me is not the same as if he were to say to reveal his Son to me. For to whom something is revealed, to him that can be revealed which was not in him before. But in whom something is revealed, that is revealed which was in him before and afterwards has been revealed. Similar is that saying in the Gospel: "He stands in the midst of you, whom you do not know" (John 1:26). And elsewhere: "That was the true light, which enlightens every man coming into the world" (ibid., 9). From this it becomes clear that the knowledge of God is present in all by nature, and that no one is born without Christ and without having in himself the seeds of wisdom and of righteousness and of the other virtues. Hence many, without faith and the Gospel of Christ, do some things either wisely or in a holy manner, such as obeying their parents, stretching out a hand to the needy, not oppressing their neighbors, not plundering what belongs to others; and they become all the more liable to the judgment of God, because, having in themselves the beginnings of the virtues and the seeds of God, they do not believe in him without whom they cannot exist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
