[[commentary]]
quote='''
The house of God has been made a den of thieves! This is the house of which Jeremiah says, "Has not my house become for me the den of a hyena?" Here we have "you have made it a den of thieves," in Jeremiah, "the den of a hyena." We have to know the nature of this animal. Then from that, we shall be able to learn why the prophet called God's house a hyena's den. The hyena is never seen in the daytime but always at night. Never is it seen in the light but always in the darkness.
'''
source_url=''
source_title="HOMILIES ON MARK 83:11.15-17"

[[commentary]]
quote='''
Is my inheritance to me a bird of many colors? Is it a bird dyed all over? Come, gather together, all you beasts of the earth, hasten to devour! LXX: Is my inheritance to me a hyena's cave? Or a cave round about it, upon it? Go, gather all the beasts of the field, and let them come to eat it! By the bird of many colors and dyed all over he means, according to the letter, the peacock. 'Such beauty', he says, 'did Israel have, and with such virtues was Jerusalem adorned, that there was nothing good that was not seen in her. Because, therefore, what was once my inheritance, that is, the people of Israel, has become to me like a lion in the forest and has given forth its voice against me, and I have detested it with all hatred, therefore come and gather together against it, all you beasts of the earth, the multitude of diverse nations, and devour her who has not known her Lord!' But if, as the Seventy and the other interpreters translated, it is read: Is my inheritance to me a hyena's cave?, let us refer it to the uncleanness of that nocturnal beast, which lives on the corpses of the dead and is wont to dig bodies out of tombs, and there is no uncleanness on which it does not feed. Such is Israel, offending its Lord and handed over to the bites of all the beasts.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
