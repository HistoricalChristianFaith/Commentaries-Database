[[commentary]]
quote='''
Upon the mountains I will take up — or take up — weeping and lamentation, and over the beautiful places — or the paths — of the desert a wailing, because they are burned up — or they have failed — because there is no man — or human being — passing through. And they have not heard the voice of the possessor — or of substance —; from the bird of the heaven to the beasts they have migrated and withdrawn. When the Babylonian comes upon them and lays everything waste, the desolation of the province is prophesied: that there is wailing on the mountains, weeping in the desert or in the paths of the wilderness, that all things have failed and been burned up, and there is no one to walk through the land, all having been slain, and nothing has remained that can breathe and live. Hence for 'possessor' the Seventy translated 'of substance', which in Hebrew is called 'macne'; and 'substance' here is not taken for ousia, that is, 'essence', but for 'wealth' and 'riches'. And what he adds: from the bird of the heaven to the beast they have withdrawn and departed, shows this, as we have often said: that all things feel the wrath of God, and not only the birds of the air but also the fish of the water fail. According to tropology, weeping is taken up upon the mountains and lamentation over the beautiful places of the desert when the princes of the Church sin and nothing of the substance of God is found in her, nor is the voice of the Lord who possesses the Church heard through holy and apostolic men, and from the bird of the heaven to the beasts, that is, from those who can ascend on high down to the irrational and all the simpler ones, they have withdrawn from the assembly of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
