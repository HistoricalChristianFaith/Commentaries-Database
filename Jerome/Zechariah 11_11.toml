[[commentary]]
quote='''
And it was made void, he says, my covenant which I had entered into with all the nations. And the poor of the flock understood, that is, the people Israel which keeps my commands, that it is the word of the Lord, that is, that it is the Lord's will to cast off the nations that deny, and in Abraham to take up Israel that confesses. For what we have translated: And thus the poor of the flock knew, the Seventy translated: And the Canaanites shall know, the sheep that are kept for me, which some expound thus: The people of the Jews shall know, to whom it was said: Seed of Canaan, and not of Judah, which is now kept by my ceremonies; or else, because Canaanites is interpreted 'ready for humiliation', those shall know who were once made ready to be humbled by the Lord and to be abandoned. But why, for what we have translated: Thus the poor, they said: Canaanites, the cause is manifest; for among the Hebrews 'thus' is called chen, 'poor' anie; they, joining the two words into one, for what is: Thus the poor, that is, chen anie, translated the name of the Canaanite nation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
