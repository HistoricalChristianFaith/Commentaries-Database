[[commentary]]
quote='''
And it shall be, if, being instructed, they learn the ways of my people, so as to swear in my name: The Lord lives, as they taught my people to swear by Baal, they shall be built up in the midst of my people; but if they do not hear, I will pluck up that nation with plucking up and destruction, says the Lord. If those brought over from heresy into the Church learn the ways of the people of God and swear in the name of the Lord, and not in the name of the idols which they fashioned out of their own heart, they will be built up by the Lord and will be part of his people. But if, having been brought over into the Church, they keep remnants of perverse dogmas and do not hear the words of the Lord, that nation will be plucked up from the midst of the people of God with a perpetual plucking up and destruction, so that no place of repentance whatever is left to them. These things we see daily and prove by the facts themselves: that the heretics feign the truth of the faith for this reason, that they may deceive all the simple, not that they themselves may be converted to the faith, but that they may draw the faithful into unbelief.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
