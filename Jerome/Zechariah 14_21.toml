[[commentary]]
quote='''
And all these shall come sacrificing, and taking from them, and they shall cook in them; and there shall no longer be a merchant in the house of the Lord of hosts on that day. LXX: And all who sacrifice shall come and shall take from them, and they shall cook in them; and there shall no longer be a Canaanite in the house of the Lord Almighty on that day. In place of Canaanite, Aquila translated merchant, and we too have followed him in this place. When the cauldrons have been turned into bowls, all the nations round about, or those who are left of all the nations, will come sacrificing, and will take the cauldrons and cook in them the flesh of the victims, so that they may not eat the flesh of the lamb raw, but, all the juice of the meat having been boiled away, what has been prepared by fire may remain for eating. What the bowls before the altar of the Lord are, into which the Israelite cauldrons are turned, we have both said above and shall now say in part. In the Song of Songs the bride praises her bridegroom: His cheeks are like bowls of spices. By the cheeks is understood speech, which, uttered by the Lord, brings forth various ointments; and so great will be the fragrance of its good odor that the Lord makes himself a scourge woven from the testimonies of the scriptures, and casts out of the temple those who sell and buy, and says to them: It is written, My Father's house shall be called a house of prayer for all nations; but you have made it a house of trade. Some fit to this place what is written in Daniel, although it is not read in the Hebrew: Seed of Canaan, and not of Judah, and what is said by the prophet Hosea of Ephraim: Ephraim is a partaker of idols; he has set stumbling blocks for himself, he has provoked the Canaanites; committing fornication, they have committed fornication; and they would have every fornicator called a Canaanite and a foreigner, who, they assert, must be removed from the house of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
