[[commentary]]
quote='''
All these things I saw, and I gave my heart to every work that has been done under the sun, and man has lorded it over man to afflict him. And then I saw the impious buried, and they came, and they went forth from the holy place, and they were praised in the city, because they had done so; but this too is vanity. For because there is no contradiction quickly for those who do evil, therefore the heart of the sons of man is filled in them, to do evil. I gave my heart, he says, to look upon all that is done under the sun, and this above all: that man has received power over man, to afflict and condemn whomever he wishes.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
