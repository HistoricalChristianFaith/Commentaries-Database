[[commentary]]
quote='''
Then that man, in whose hand were the cord and the reed, brings the prophet into the inner court which looked toward the way of midday, and spoke these words: This is the chamber (or exedra, and, as Theodotion put it, cell) which has been set apart for the dwelling of the priests who keep watch in the vigils of the temple. Further, the chamber which looks toward the way of the north shall be for the priests who keep watch for the ministry of the altar. In which it is to be noted that the priests to whom the guarding of the temple has been delegated dwell in the chamber which looked toward the way of midday, in which the light is fullest, but those who keep watch for the ministry of the altar, on which the victims for sin are offered, are in the chamber which looks toward the way of the north, desiring to receive and save those who come from the north and offer victims for sin: and both of these, serving the Lord according to their offices, are called sons of 'Sadoc' [Zadok], which means 'righteous' or 'justifying', namely the almighty God — of whom it is written: The Lord is righteous and has loved righteous deeds; his countenance has beheld equity —; and these sons of Zadok are from the sons of 'Leui' [Levi], which means 'taken up', and they too are taken up by the Lord, so that they may come near to him — and it is by no means said of Moses alone: Moses came near to the Lord, while the others did not come near, but all who serve him and minister to him are said to draw near to the Lord —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
