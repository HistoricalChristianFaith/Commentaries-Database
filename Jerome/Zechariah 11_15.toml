[[commentary]]
quote='''
And the Lord said to me: Take for yourself yet again the instruments of a foolish shepherd. For behold, I will raise up a shepherd in the land, who will not visit what is forsaken, will not seek what is scattered, and will not heal what is broken, and will not nourish what stands, and he will eat the flesh of the fat ones and break apart their hooves. O shepherd and idol, forsaking the flock, a sword upon his arm and upon his right eye; his arm shall be dried up with withering, and his right eye, growing dark, shall be darkened. LXX: And the Lord said to me: Take for yourself yet again the shepherd's instruments of an unskilled shepherd. For behold, I will raise up a shepherd upon the land, who shall not visit what is forsaken and shall not seek out what is scattered, and shall not heal what is broken, and shall not guide what is whole, and shall devour the flesh of the choice ones, and twist their ankles. O you who pasture vain things, and who have forsaken the sheep, a sword upon his arm, and upon his right eye; his arm shall be dried up with withering, and his right eye shall be darkened with blindness. When he says: Take for yourself yet again the instruments of a foolish shepherd, he means this: that above he had taken to himself two staffs, one Beauty and the other Cord. And because through their own vice and sin he cast them away, and, the brotherhood between Judah and Israel being dissolved, we have been grafted into the root of the good olive, and blindness has come in part upon the house of Israel until the fullness of the Gentiles should come in, now the prophet is told to take up the most grievous prophecy of the foolish, or unskilled, shepherd. The foolish and unskilled shepherd is without any doubt the Antichrist, who is said to be coming at the consummation of the world, and what sort he will be is indicated. By the instruments of the shepherd we ought to understand his insignia and his garb: the wallet, the staff, the pipe and the whistle. And just as Isaiah, to show the captivity of the people, walks about naked, and Jeremiah goes to the potter's house, so that from the shattering of the vessel which was turning on the wheel and being shaped by the craftsman's hand he might show both the destruction of Israel and the power of God, and Ezekiel, to show the overthrow of Jerusalem and the flight of Zedekiah and the burdens of the captives not only by his voice but also by his garb, digs through the wall and is carried out upon his shoulders, so Zechariah takes on the garb of a foolish and unskilled shepherd, to announce him who is to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
