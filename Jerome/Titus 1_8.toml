[[commentary]]
quote='''
But hospitable, a lover of good things, pure, just, holy, self-controlled, or abstinent, holding fast the faithful word which is according to doctrine, that he may be able to comfort in sound doctrine, and to refute those who contradict. Before all things hospitality is enjoined on the future bishop. For if all desire to hear that word of the Gospel, "I was a stranger, and you took me in" (Matt. 25:35), how much more the bishop, whose house ought to be the common lodging of all! For a layman, receiving one or two or a few, will fulfill the duty of hospitality; a bishop, unless he receives all, is inhuman. But I fear that, just as the queen of the South, who came from the ends of the earth to hear the wisdom of Solomon (Matt. 12), will judge the men of her time, and the men of Nineveh, who did penance at the preaching of Jonah, will condemn those who scorned to hear the Savior, greater than Jonah, so very many among the peoples may judge the bishops, withdrawing themselves from the ecclesiastical rank and practicing what does not befit a bishop. Of these I think John too writes to Gaius: "Dearest, you act faithfully in whatever you do for the brethren, and that for strangers, who have borne witness to your love before the Church: you will do very well if you send them on their way worthily of God: for they went out for the name of the Lord, accepting nothing from the Gentiles" (3 John 5 ff.). And truly, the Holy Spirit speaking in him, he even then rebuked what was to come in the churches, saying: "I wrote also to the Church: but Diotrephes, who loves to hold the first place among them, does not receive us. Therefore, when I come, I will call to mind his works which he does, slandering us with evil words; and it is not enough for him that he does not himself receive the brethren, but he also forbids those who wish to, and casts them out of the Church." Truly one can now see what was foretold: in very many cities, bishops, or presbyters, if they see laymen hospitable, lovers of good things, envy them, rage, excommunicate them, expel them from the Church, as though it were not lawful to do what the bishop does not do, and as though for laymen to be such were a condemnation of the priests. So they find them burdensome, and as though set upon their own necks, and harass them with various persecutions in order to draw them away from good work. Let the bishop also be chaste, whom the Greeks call σώφρονα; and the Latin translator, deceived by the ambiguity of the word, rendered "prudent" (prudentem) instead of "chaste" (pudicum). Now if laymen are commanded to abstain from intercourse with their wives for the sake of prayer, what are we to think of a bishop, who is every day to offer to God unblemished victims for his own sins and those of the people? Let us read again the books of Kings, and we shall find that the priest Abimelech was unwilling to give of the loaves of the presentation to David and his young men before he asked whether the young men were clean from a woman: not, of course, another man's, but a wife (1 Sam. 21). And had he not heard that they had kept away from the marital act yesterday and the day before, he would by no means have granted the loaves which he had at first refused. There is as great a difference between the loaves of the presentation and the body of Christ as between the shadow and the bodies, between the image and the truth, between the patterns of things to come and those very things which were prefigured through the patterns. Just as, therefore, gentleness, patience, sobriety, moderation, abstinence from gain, and also hospitality and kindness ought to be found especially in the bishop, and to stand out among all the laymen, so too a purity of his own and (so to speak) a priestly chastity, so that he abstain not only from the unclean act, but also from the glance of the eye and the straying of thought, so that the mind that is to consecrate the body of Christ may be free. The bishop ought also to be just and holy, so as to exercise justice among the peoples over whom he presides, rendering to each what he deserves, and not to respect persons in judgment. Now between the justice of a layman and of a bishop there is this difference: that a layman can appear just in a few things, but a bishop can exercise justice in as many as he has subjects. Now holy, which in Greek is said ὅσιος, signifies rather this: when holiness itself is mixed with piety and is referred to God. For whom we call holy (sanctus), the Greeks call ἅγιον; but whom they call ὅσιον, we can call devout toward God (pium in Deum). Let the bishop also be abstinent: not only (as some think) from lust and from his wife's embrace, but from all the disturbances of the soul: that he not be roused to irascibility, that sadness not cast him down, that fear not agitate him, that immoderate joy not lift him up. Now abstinence is numbered by the Apostle among the fruits of the spirit. And if it is required of all, how much more of a bishop, who, patient and gentle, ought to bear the vices of those who sin, comfort the fainthearted, support the weak, render to no one evil for evil, but overcome evil with good.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
