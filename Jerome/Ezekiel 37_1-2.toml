[[commentary]]
quote='''
The hand of the Lord came upon me, and he led me out in the spirit of the Lord, and set me down in the midst of a plain which was full of bones; and he led me around through them in a circle: and they were very many upon the face of the plain, and exceedingly dry. And he said to me: Son of man, do you think these bones will live? And I said: Lord God, you know. And he said to me: Prophesy concerning these bones, and you shall say to them: Dry bones, hear the word of the Lord; thus says the Lord God to these bones: Behold, I will send spirit into you and you shall live, and I will put sinews upon you and make flesh grow up upon you, and I will stretch skin over you, and I will give you spirit, and you shall live, and you shall know that I am the Lord. And I prophesied as he had commanded me. And there was a sound, as I prophesied, and behold, a commotion; and the bones drew near, bones to bones, each one to its joint. And I looked, and behold, sinews and flesh came up upon them, and skin was stretched over them from above, and they did not have spirit. And he said to me: Prophesy to the spirit; prophesy, son of man, and you shall say to the spirit: Thus says the Lord God: Come from the four winds, O spirit, and breathe upon these slain, and let them come to life again. And I prophesied as he had commanded me, and the spirit entered into them; and they lived, and they stood upon their feet, an army great beyond measure, exceedingly. And he said to me: Son of man, these bones are the whole house of Israel; they say: Our bones have dried up and our hope has perished, and we are cut off. Therefore prophesy and you shall say to them: Thus says the Lord God: Behold, I will open your tombs, and I will lead you out of your graves, my people, and I will bring you into the land of Israel; and you shall know that I am the Lord, when I have opened your graves and have led you out of your tombs, my people, and have put my spirit in you and you have lived, and I will make you rest upon your own soil, and you shall know that I am the Lord: I have spoken and I have done it, says the Lord God. (LXX: "And the hand of the Lord came upon me, and he led me out in the spirit of the Lord, and placed me in the midst of a plain, and this was full of the bones of men; and he led me around over them by a circuit round about: and behold, very many upon the face of the plain, and dry exceedingly. And he said to me: Son of man, will these bones live? And I said: Lord, Lord, you know these things. And he said to me: Son of man, prophesy over these bones, and you shall say to them: Dry bones, hear the word of the Lord; thus says the Lord God to these bones: Behold, I will bring upon you the spirit of life, and I will put sinews upon you and bring flesh upon you, and I will stretch hide over you, and I will give you my spirit, and you shall live, and you shall know that I am the Lord. And I prophesied as he commanded me. And there was a voice, when I was prophesying, and behold, a commotion; and the bones were drawing near, bones to bones, to its joint. And I looked, and behold, sinews and flesh were springing up upon them, and hides were coming up over them from above, and there was no spirit in them. And he said to me: Prophesy over the spirit, prophesy, son of man, and say to the spirit: Thus says the Lord, the Lord: Come from the four spirits, O spirit, and breathe upon these dead, and let them live. And I prophesied as he had commanded me, and the spirit entered into them; and they lived, and stood on their feet, a congregation large, exceedingly, beyond measure. And the Lord spoke to me, saying: Son of man, these bones are all the house of Israel; they say: Our bones have become dry, our hope has perished, we have despaired. Therefore prophesy, and say to them: Thus says the Lord, the Lord: Behold, I will open your memorials, and I will bring you back from your graves, my people, and I will bring you into the land of Israel; and you shall know that I am the Lord, when I have opened your graves so as to lead you out of your graves, my people, and I will give my spirit in you and you shall live, and I will place you upon your own land, and you shall know that I am the Lord: I have spoken and I will do it, says the Lord, the Lord.") The vision is a famous one, and celebrated in the reading of all the churches of Christ; and for this reason above all I have set down both editions in full, so that no calumny might be raised against us by the Hebrews if they differed even in some words — for they are accustomed to laugh at us and to raise their eyebrows, and with puffed-out cheeks to belch forth their knowledge of the Scriptures, if they have been able to point out in our codices, I will not say a discrepancy of sense — which, if there were one, is rightly censured — but a dissonance of words —. Those, then, who think that the word of God is about the resurrection — which is believed by all, both Jews and Christians — are accustomed to say this: The hand of the Lord came upon the prophet, that is, the Lord and Savior, through whom the Father wrought all things — All things indeed were made by him, and without him nothing was made that was made —. And he led me out, he says, in the spirit of the Lord: the hand of the Lord is understood; and he led him out in the spirit: not in the body but outside the body, and placed him, or set him down, in the midst of a plain which was full of human bones; nor did it allow him to rest, but made him go around all the bones, which were not covered with earth but lying upon the plain: and not only many, but very many and, because of the length of time, dry and exceedingly parched and having no moisture in them.
'''
