[[commentary]]
quote='''
Now all this was done that what was spoken by the Lord through the prophet might be fulfilled, saying: Behold, a virgin shall have in the womb and shall bear. Where the evangelist Matthew says: shall have in the womb, in the prophet it is written: shall receive in the womb. But the prophet, because he foretells things to come, signifies what is to be and writes shall receive; the evangelist, because he narrates history not of the future but of the past, changed shall receive and put shall have. For one who has is by no means going to receive. Something of the kind we read in the psalms too: Ascending on high he led captivity captive, he received gifts among men. The Apostle, setting down this testimony, did not say received, but gave, because there it was signified of the future that he would receive, here it is told of him who had already given what he had received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
You have ascended on high, you have taken captivity captive. You have ascended into the heavens: you have taken us captive, we who were held captive by the devil. You have received gifts among men. He said it well, "you have received." From the Father he received: he receives as man, he gives as God; and what he received, he received for men, that he might give. For he himself is full, and lacks nothing. For indeed those who do not believe that the Lord dwells. And these too you have saved, who did not believe that it is possible for God to dwell in a man, that is, for the Savior to take flesh. The Lord God blessed. These who before did not believe that it is possible for God to dwell in a man, they themselves, believing, say: The Lord God be blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_007.html'
source_title="Homily 7, on Psalm 67"

[[commentary]]
quote='''
The word of inheritance and of lot (sortis), through which we have come into the portion of Christ, shows that we have passed over from one power to another: and, according to what is written in Deuteronomy: When the Most High divided the nations, when he scattered the sons of Adam (Deut. 32:8), that we have been transferred from the dominion of the angels to the portion of the Lord. And they indeed held what belonged to another, either entrusted to them or usurped. But he received back his own: and ascending on high he led captivity captive (Ps. 67), that is, those who had previously been taken captive for perdition he himself took captive for life, to bring them back on high: and in a certain way captivity is taken captive, while through a second captivity those who had earlier been taken captive are set free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Therefore he says: Ascending on high, he led captivity captive, he gave gifts among men.

Because he had said above, But to each one of us grace has been given according to the measure of the gift of Christ, in order to confirm that these very gifts, which he also enumerates a little later, saying, And he gave some apostles, and some prophets, others evangelists, others pastors and teachers, and the rest, were bestowed by the Savior, he took up a testimony from the sixty-seventh psalm, so that we may know that these are the spoils distributed to men which Christ the victor won. For ascending on high, he led captivity captive. We who now believe in Christ, gathered from the Gentiles, though we were the creation of God, were taken captive by the devil and distributed among his attendants. Therefore our Lord Jesus Christ came, according to Ezekiel (chs. 9 and 12), carrying with him the vessels of captivity, and with his head covered, so that he might not be recognized by his adversaries, he preached release to those who had been taken captive, and loosing to those who were held in chains, and he freed us from the chains and from the fetters of the enemies, like that woman in the Gospel of whom he himself makes mention: But this daughter of Abraham, whom Satan has bound now eighteen years, ought she not to have been loosed from this bond on the sabbath day (Luke 13:16)? And having freed us, and rescued us through a new captivity from the old captivity, he led us with him into heaven; and on these very ones whom as victor he snatched from the hand of their enemies he bestowed diverse gifts of graces. And he has put it elegantly here, he gave gifts among men, whereas in the Psalter it is written: he received gifts among men (Ps. 67:19). But there, because it had not yet been done but was promised as future, he is for that reason said to have received. Here, however, when the Apostle writes, because he had already given, and Churches had been founded throughout the whole world, it is therefore written not that he received, but that he gave. Others expound this passage thus: that our Lord Jesus Christ ascended as victor to the heavens so that from there he might send angels and the other virtues to guard his Churches. And since this earthly place is unworthy to have the presence of the sublime powers, those powers have in a certain way endured captivity. For this is why (they say) he ascended on high: so that, taking captivity captive, he might bestow gifts on men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
