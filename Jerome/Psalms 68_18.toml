[[commentary]]
quote='''
You have ascended on high, you have taken captivity captive. You have ascended into the heavens: you have taken us captive, we who were held captive by the devil. You have received gifts among men. He said it well, "you have received." From the Father he received: he receives as man, he gives as God; and what he received, he received for men, that he might give. For he himself is full, and lacks nothing. For indeed those who do not believe that the Lord dwells. And these too you have saved, who did not believe that it is possible for God to dwell in a man, that is, for the Savior to take flesh. The Lord God blessed. These who before did not believe that it is possible for God to dwell in a man, they themselves, believing, say: The Lord God be blessed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_007.html'
source_title="Homily 7, on Psalm 67"

[[commentary]]
quote='''
Now all this was done that what was spoken by the Lord through the prophet might be fulfilled, saying: Behold, a virgin shall have in the womb and shall bear. Where the evangelist Matthew says: shall have in the womb, in the prophet it is written: shall receive in the womb. But the prophet, because he foretells things to come, signifies what is to be and writes shall receive; the evangelist, because he narrates history not of the future but of the past, changed shall receive and put shall have. For one who has is by no means going to receive. Something of the kind we read in the psalms too: Ascending on high he led captivity captive, he received gifts among men. The Apostle, setting down this testimony, did not say received, but gave, because there it was signified of the future that he would receive, here it is told of him who had already given what he had received.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
