[[commentary]]
quote='''
Who gave himself for our sins, to deliver us from the present evil age, according to the will of God and our Father, to whom is glory unto the ages of ages. Amen.

Neither did the Son give himself for our sins without the will of the Father, nor did the Father hand over the Son without the Son's will; rather, this is the will of the Son: to fulfill the will of the Father, as he himself says in the psalm: "That I might do your will, my God, I have willed" (Ps. 39:9). Now the Son gave himself in order that he, Righteousness, might overthrow the unrighteousness that was in us. Wisdom handed itself over to conquer foolishness. Holiness and strength offered itself to blot out filth and weakness. And so he has delivered us not only in the age to come, according to the promised hope by which we believe, but also here, from the present age: while, having died together with Christ, we are transfigured into newness of mind, and are not of this world, by which, deservedly, we are not loved either. It is asked how the present age has been called evil. For heretics are accustomed to seize occasions from this passage to assert that there is one creator of light and of the age to come, and another of darkness and of the present age. We, however, say that it is not so much the age itself, which runs on by day and night, by years and months, that is called evil, as, homonymously (ὁμωνύμως), the things that are done in the age: just as the day is said to have enough of its own evil (Matt. 6), and the days of Jacob are written to be few and very evil (Gen. 47). Not that the span of time in which Jacob lived was evil, but that the things he endured exercised him through various trials. Indeed, at the very time when he was serving for his wives and was struggling with many hardships (Gen. 29), Esau was at rest; and so the same span of time was good for one and evil for the other. Nor would it have been written in Ecclesiastes: "Do not say that my former days were good beyond these" (Eccles. 7:11), except with a view to the difference of evils. Hence John says: "The whole world is set in the wicked one" (1 John 5:19). Not that the world itself is evil, but that evils are done in the world by men who say, "Let us eat and drink", "for tomorrow we shall die" (Isa. 22:13). And the Apostle himself: "Redeeming", he says, "the time, because the days are evil" (Eph. 5:16). Woodlands too are given a bad name when they are full of robberies, not because the earth and the forests sin, but because the places too have drawn upon themselves the infamy of murder. We also detest the sword by which human blood has been shed, and the cup in which poison has been mixed, not for any sin of the sword or of the cup, but because those who have used them ill deserve hatred. So also the age, which is a span of times, is not in itself either good or evil, but is called good or evil through those who are in it. For this reason the ravings and fables of Valentinus are to be despised, who fabricated his thirty aeons (αἰῶνας) from the fact that "ages" are read of in the Scriptures, saying that they are living beings, and that by tetrads and ogdoads, and also decads and dodecads, they produced as many numbers of ages as the young that the sow of Aeneas brought forth.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
