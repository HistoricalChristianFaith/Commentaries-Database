[[commentary]]
quote='''
Let us attend more carefully, and we shall find in the present passage the Trinity most manifest. For the benignity and clemency of our Savior God, of none other than God the Father, through the washing of regeneration and the renewal of the Holy Spirit, whom he poured out upon us abundantly through Jesus Christ our Savior, justified us unto eternal life. The salvation of believers is the mystery of the Trinity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Titus.html'
source_title="Commentary on Titus"
