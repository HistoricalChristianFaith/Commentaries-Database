[[commentary]]
quote='''
But in place of what the Seventy translators and Theodotion said: For the knowledge of man is great upon him; the Hebrew has malice (malitia), not knowledge (scientia); but because the Hebrew letters res and daleth are alike, except for a small stroke, they read dath for raath, that is, knowledge for malice. He who has a knowledge of that language will know this better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
