[[commentary]]
quote='''
But on Mount Zion there shall be salvation, and there shall be a Holy One, and the house of Jacob shall possess those who had possessed them. And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau stubble, and they shall be kindled among them, and shall devour them, and there shall be no remnant of the house of Esau, for the Lord has spoken. LXX: Upon Mount Zion there shall be salvation, and it shall be holy, and the house of Jacob shall possess those who had possessed them. And the house of Jacob shall be a fire, and the house of Joseph a flame, but the house of Esau stubble, and they shall be kindled against them, and shall devour them, and there shall be no grain-carrier for the house of Esau, for the Lord has spoken. When Idumea has been overthrown and devoured by the hostile nations with which it had earlier made a pact against Jacob, on Mount Zion there shall be a remnant, and there shall be salvation, and there shall be a Holy One; that is, either the Lord himself shall return to the temple which he had abandoned because of their sins, or there shall be, absolutely, what is holy, that is, the holy of holies. And the house of Jacob, under Zerubbabel and Ezra and Nehemiah, shall possess those who had possessed them as an inheritance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"


[[commentary]]
quote='''
And the house of Jacob the supplanter shall possess those who had possessed them as an inheritance, making Christians of persecutors, and receiving the Idumeans themselves into the faith of the Church: but the house of Esau shall be turned into stubble. And as straw cannot bear the nearness of fire, so the house of Esau shall not be able to bear the disputation of Jacob, which is set on fire by the word of the Lord: For the words of the Lord are tried by fire, nor the flame of Joseph, whose name means increase, and who, sold by his brothers, fed the people in Egypt; but at the first encounter their sophisms shall be turned to nothing. And they shall be devoured unto their own salvation, according to what is said in Isaac's blessing to Esau: But I have made him your lord; and I have subjected all your brothers to him as servants, and you shall serve your brother. And there shall be no remnant of the house of Esau when all things in heaven and on earth and under the earth bend the knee to Christ, and all things are subjected to him, that God may be all in all. But because Esau, through his own fault, had built upon the foundation of Christ hay, wood and stubble, therefore the house of Jacob and of Joseph shall be turned into fire and flame, imitating its God, who says: I am God, a consuming fire, so that, when the chaff of sins has been devoured, the pure grain may be gathered into the barns. All that we have said, and all that we are going to say, the Jews promise to themselves for a time to come, when in place of Christ they will receive the Antichrist; and so the prophecy of the Lord and Savior is fulfilled: I came in the name of the Father and you did not receive me; if another comes in his own name, him you will receive. And whatever we have interpreted against Idumea, they dream of as being against the Roman empire; which we say has either already been done according to the history, under Zerubbabel, or at any rate, according to prophecy and the mystical senses, is done daily in the Church, and is fulfilled in each person, in the kingdom of the soul against the flesh. As for the grain-carrier, according to tropology we say that he ceases to exist among the heretics when there is no one among them who boasts that he has the grain of wheat that died in the earth, and the bread from heaven. There are some who think that the Seventy translated not πυροφόρον, that is, grain-carrier, but πυρφόρον, that is, one who can carry a little fire. Accepting, therefore, the different interpretations, we shall say according to tropology that not only the grain-carrier will cease among the heretics, but also the one who pretends to have the light of Christ. And indeed Satan himself is transformed into an angel of light.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
