[[commentary]]
quote='''
What is written in the Seventy, Sharezer and Arabesser the king sent from Bethel, none of our writers has been able to expound; for what has been badly translated from the Hebrew cannot be explained by any reasoning. For who is this Sharezer, or Arabesser the king? Or king of what province? Or into which Bethel, or from which, did he send? Or of what Bethel could Arabesser be king, a place that had long before been left desolate together with Judea, and at that time was by no means called Bethel, that is, house of God, but Beth-aven, that is, house of an idol?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
