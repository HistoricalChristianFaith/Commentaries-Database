[[commentary]]
quote='''
However the proper sense of the names stands, this is to be said: that evil things are turned into good, and virtues spring up in place of vices, that is, righteousness in place of iniquity, fortitude in place of rashness, temperance in place of luxury, prudence in place of folly. Let us give examples of our forebears: Matthew and Zacchaeus and the publicans were saliunca, and στοιβή, and useless stalks, and κονύζη of bitter taste and most loathsome smell, saying: My scars have rotted and are corrupted, because of my folly (Ps 37 [38]:6). These, suddenly changed into Apostles, became cypress and fir and myrtle, of the best fragrance and needful for various works. Paul too, the persecutor of the Church, when he heard from the Lord, Saul, Saul, why do you persecute me? It is hard to kick against the goad (Acts 9:4, 5), was a nettle, having the stings of persecution. But when he preached the Gospel in the whole world and could say, We are the good odor of Christ (2 Cor 2:15), he is rightly called a cypress and a myrtle. Harlots and publicans go before the Pharisees into the kingdom of God, and the thief passes from the cross into paradise (Matt 21). Therefore what is said in the Gospel, A good tree cannot bear evil fruits (Luke 6:43; Matt 7:18), by no means refers to a property of nature, as the heretics would have it, but to the choice of the mind. Finally it is added: Either make the tree good, and its fruits good. From this it is clear that each one by his own will makes his soul a good or an evil tree, whose fruits vary.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
