[[commentary]]
quote='''
For thus says the Lord: When seventy years begin to be fulfilled in Babylon, I will visit you, and I will raise up over you my good word, to bring you back to this place. For I know the thoughts which I think over you, says the Lord, thoughts of peace and not of affliction, to give you an end and patience — or hope —. And you will call upon me and you will go — or, according to Symmachus, you will find — and you will pray to me, and I will hear you. You will seek me and you will find, when you seek me with your whole heart, and I will be found by you or I will appear to you. 'Do not,' he says, 'believe your false prophets, diviners and dreamers, who promise you a near return to Jerusalem! For unless the seventy years have been completed — Cyrus, king of the Persians, releasing the captives —, you will by no means return to your fatherland; and then I will fulfill my promises, to bring you back to this place; for I know the thoughts which I think over you, says the Lord'. He says that he knows what he thinks, but that they, with their prophets, diviners and dreamers, do not know; the knowledge of things to come therefore belongs to God alone. 'To give you,' he says, 'an end and patience: an end of the captivity and patience in the present labors, or hope of things to come. Then you will call upon me and you will go to Jerusalem and you will pray, and I will hear you.' Certainly the Lord could have fulfilled what he had promised without the invocation and prayer of the captives, but he exhorts them to prayers, so that they may deserve to receive what has been promised.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
