[[commentary]]
quote='''
And it will be on that day, says the Lord, she will call me My husband, and will no longer call me Baalim; and I will take away the names of the Baalim from her mouth, and she will no longer remember their name. LXX: likewise. That Ninus, the son of Belus, was the first to reign over all Asia, all histories, both Greek and barbarian, relate; he founded among the Assyrians the city of Ninus, named after himself, which the Hebrews call Nineveh. His wife Semiramis, of whom many marvelous things are told, built the walls of Babylon. Of her the famous poet bears witness, saying: "Where Semiramis is said once to have girded the city with walls of baked brick." He fought in a strong contest against the great Zoroaster, king of the Bactrians, and came to such glory that he enrolled his father Belus as a god; he is called Bel in Hebrew, and in many prophets, and above all in Daniel according to Theodotion, he is called by this name as the idol of Babylon. The Sidonians and Phoenicians call him Baal; for between the consonant letters beth and lamed the same vowel letter ain is placed, which, according to the peculiar character of that language, is read now Beel, now Baal. Hence Dido too, the Sidonian of royal race, when she had received Aeneas as a guest, pours a libation of wine to Jupiter from that bowl which Belus and all those descended from Belus were accustomed to use. We have learned the origin of the demon, or rather of a man consecrated into a demon; for all idols have grown out of the error concerning the dead. Let us hear the rest: in the Hebrew and Syrian tongue Baal is interpreted ἔχων, that is, 'having'. If we wish to say 'having me', let us say Baali; and among both nations wives call their husbands Baali, that is, 'my husband', which is understood as 'having me'; and the sense is: he who has me in marriage. In the same language of the Hebrews a man is called is, whence the wife too, who was taken from the man, is called Issa in Genesis, as virago, as it were, from vir, man.

What God says, then, is this: since with both words, that is, Issi and Baali, 'my husband', or 'my spouse', is named, I so hate the names of idols that even what can rightly be said I would by no means wish to be said, because of the ambiguity and the likeness of the word, but wish to be called Issi rather than Baali, lest while she says one thing she should remember another, and, naming her husband, think of an idol. Forgive the obscurity, which arises in three ways: either from the difficulty of the matters, or from the inexperience of the teacher, or from the excessive slowness of the learner. For in expounding a Hebrew prophet I ought not to play with little oratorical declamations, and to sing in narrations and epilogues in the Asiatic manner, but, with the help of your prayers and with an incredible zeal for learning, to open what is closed. Finally Aquila, a diligent and painstaking translator: She will call, he says, me My husband, and will no longer call me Having me, that is, Baal.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
