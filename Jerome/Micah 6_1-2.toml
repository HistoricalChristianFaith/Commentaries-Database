[[commentary]]
quote='''
Hear what the Lord says: Arise, contend in judgment against the mountains, and let the hills hear your voice. Hear, O mountains, the judgment of the Lord, and you strong foundations of the earth, for the judgment of the Lord will be decided with his people, and with Israel: LXX. Hear what the Lord has spoken: Arise, be judged before the mountains, and let the hills hear your voice. Hear, O mountains, the judgment of the Lord, and you valleys, foundations of the earth, for the judgment of the Lord is against his people, and with Israel it will be judged. For 'strong foundations of the earth', which the LXX rendered 'and valleys, foundations of the earth', Symmachus and Theodotion translated 'and ancient foundations of the earth'; but the Fifth Edition set down the Hebrew itself, ethanim, foundations of the earth. The first utterance, then, is the prophet's: Hear what the Lord says. Then God speaks to the prophet: Arise, contend in judgment against the mountains, and let the hills hear your voice. Again the prophet, as he had been commanded, speaks to the mountains, and not only to the mountains but also to the strong foundations of the earth, and says: Hear, O mountains, the judgment of the Lord, and you strong foundations of the earth. And he gives the reason why he urges them to hear: because the judgment of the Lord will be decided with his people, and with Israel. For the mountains to which the prophet speaks, and for the strong foundations of the earth, the LXX translated hills and valleys, understanding, as it seems to me, that the people had done nothing worthy of the hearing of mountains, but only of hills, which are lower than the loftiness of the mountains, or of valleys sunk into the depths. Arise, he says, contend in judgment before the mountains, and let the hills hear your voice. He is commanded to arise who either sits, or lies, or sleeps, or is dead, according to what the Apostle says: Rise, you who sleep, and arise from the dead, and Christ will enlighten you. Arise from the dead, so that you may walk in newness of life, so that, leaving the earth, you may strive toward higher things. And contend in judgment against the mountains, by which I think nothing else is signified than the angels, to whom the care of human affairs has been entrusted, the Song in Deuteronomy agreeing on this very point: When the Most High divided the nations, when he scattered the sons of Adam, he set the bounds of the earth according to the number of the angels of God. These are ministering spirits, sent for service on account of those who are to possess the inheritance of salvation. And contend in judgment, so that, whether the mountains or the hills are found not to have cared for the peoples worthily, either it may be seen to be my fault, since I set such ones over them, or the blame may be taken from the people and referred to the princes. Let us read the Apocalypse of John the apostle, in which the angels of the churches are praised and accused for the virtues and vices of those over whom they are said to preside. For just as sometimes it is the bishop's fault, sometimes the people's, and often the teacher is answerable for the sin, often the pupil, and now it is the father's failing, now the son's, according as they are taught well or badly, so in the judgment of God the charge will be referred either to the angels, if they have not done all that belonged to their office, or to the people, if, while the angels did everything, they themselves scorned to hear. There are some who interpret the mountains and hills and strong foundations of the earth as Abraham, Isaac and Jacob and the rest of the patriarchs, before whom, as hearers called together to the judgment, the case of the people of Israel is to be argued. Others think the mountains, hills and valleys are angels, as we said above, who either serve God in the heavenly places, or preside over men upon this earth, or, being set in the underworld, are called the foundations of those who through their own fault became earthly; of these foundations of the earth we find it written elsewhere too: A fire is kindled from my fury, it will burn down to the underworld below; it will devour the earth and its foundations. The strong and ancient foundations of the earth — on account of which the earth has not passed away until now, and, hanging over the void, stands balanced — are the merits of the just, of whom the Apostle speaks: Built upon the foundations of the apostles and prophets. Just as, then, the apostles and the prophets and the whole choir of martyrs are the strong foundations of the earth, so, according to the LXX, the valleys and precipices, which in Greek are more expressively called φάραγγες, are the foundations of those who have received the image of the χοϊκοῦ (of the earthy one). The judgment of the Lord, therefore, will be decided with his people, and with Israel. He who, as God, could inflict punishments for the crimes of a sinful people does not wish to appear powerful, but just, and he summons the sinners to judgment, according to that prophetic word: Come, and let us judge, says the Lord; even now he presses the people of Israel, in the presence of the angels and of all creation, to answer if it has anything to answer, so that God may be justified in his words and may prevail when he is judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
