[[commentary]]
quote='''
The heavenly things have praised, the invisible things have praised, the visible things have praised: now he descends to earthly things, and to the praise of God first the dragons and the deeps are stirred up. Where sin abounded, grace has superabounded. You who were first a dragon, who had the venom of the serpent: O you who were first a deep, and darkness was borne over the deep. See what he says. Where dragons are, there is venom: where the deep is, there is darkness. Do not despair therefore, O you who were a dragon, who were full of darkness, and did not dare to praise God; do penance, and at once you will be converted. Although in the Hebrew it does not have "dragons," but has THANNINIM, which is rendered "sea-monsters." Now the sea-monster (cetus) is said to be of boundless size. Indeed the sea-monster itself is said to be in the deeps. Let us then speak first according to the letter. See what he says. Praise, you things that are in the sea, and praise, you things that are outside the sea: dragons and all deeps. The whole from a part, by way of synecdoche (synekdochikōs).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_058.html'
source_title="Homily 58, on Psalm 148"
