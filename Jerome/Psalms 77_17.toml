[[commentary]]
quote='''
The clouds gave forth their voice. The clouds are the prophets: who kept silence to the Jews, but spoke to us. The clouds gave forth their voice. For your arrows have passed through. The preaching of the word of Christ has run into the whole world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_010.html'
source_title="Homily 10, on Psalm 76"
