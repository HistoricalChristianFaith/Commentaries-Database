[[commentary]]
quote='''
If therefore this people or a prophet or a priest asks you, saying: What is the burden of the Lord — or what is the taking up of the Lord — ?, you shall say to them: You are the burden — or the taking up — ; for I will cast you away — or I will dash you down, — says the Lord. And the prophet and the priest and the people who says: The burden — or the taking up — of the Lord, I will visit — or I will avenge — upon that man and upon his house. These things you shall say each one to his friend and to his brother: What has the Lord answered and what has the Lord spoken? and the burden — or the taking up — of the Lord shall be remembered no more, for the burden — or the taking up — shall be to each one his own word. The Hebrew word 'massa' Aquila translates arma, that is, 'burden' and 'weight'; Symmachus, the Seventy and Theodotion 'taking up'. Wherever, then, what the Lord threatens is heavy and full of weight and toil and unbearable, in the title too it is called arma, that is, 'weight'; but wherever the Lord promises prosperity, or after a threat promises better things, there it is called 'vision' or certainly 'word of the Lord'; and it was clear from the very title of the prophecy, 'of weight' or 'of vision' and 'of the word of God', what kind of prophecy would follow. Since, therefore, the prophets were wont to announce sad things to the sinful people and to threaten punishments, in order to draw them back to repentance, while the Lord, merciful and compassionate, long deferred the sentence, the people, deceived and seduced by the fraud of the false prophets, thought that the things the Lord threatened would not come, and they had turned a serious matter into sport and jest, and when the prophets prophesied they would say as if mocking: 'Here again he sees a weight and burden of the Lord'. And so it came about that it was no longer called 'vision', but in jest and derision 'burden' and 'weight'. The Lord therefore commands that, whether the people or a prophet or a priest should ask Jeremiah what the weight or what the taking up of the Lord is, he should answer them and say: 'You are the burden and you the taking up; for I will take you up and cast you away and dash you down and make you perish. But if anyone hereafter, whether of the prophets or of the priests or of the people, dares to name the burden and weight of the Lord, I will visit', he says, 'upon that man and upon his house, and I will blot him out forever'. Let each one therefore say to his neighbor and friend by no means: What is the burden of the Lord?, but: 'What has the Lord answered and what has the Lord spoken? Forget the old word; let burden and weight or taking up no longer sound in your mouth, for to each man his own word and his own work will be reckoned as a burden and weight, according to that which is written: by your mouth you shall be justified and by your mouth you shall be condemned'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
