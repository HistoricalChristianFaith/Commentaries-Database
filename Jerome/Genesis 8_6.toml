[[commentary]]
quote='''
After forty days Noah opened the door of the ark which he had made, and sent out the raven, and having gone out it did not return to him until the water was dried from the earth. For door, window is written in the Hebrew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
