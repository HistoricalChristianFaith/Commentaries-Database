[[commentary]]
quote='''
And he says that he found woman to be the head of all evils, because through her too death entered into the world, and she captures the precious souls of men. For all who commit adultery have hearts like an oven; it is she who makes the hearts of young men fly away. And when she has fallen upon the mind of a wretched lover, she drags him headlong and does not let him look before his feet, but like a snare and a net she entangles the young man's heart. For her hands are bonds. For this Aquila rendered: Her hands are bound, which in the Hebrew language is called assurim. For she can persuade, she cannot use force, nor drag the unwilling to herself. He who is just and good before God will be rescued from her; but the sinner, caught, will be led away to death. Let us not think that Solomon pronounced this sentence on the female sex rashly; he speaks what he has experienced. For he offended God precisely because he was captured by women. So much according to the letter. But according to the spiritual understanding, either we name every sin in general, and iniquity, woman, the iniquity which in Zechariah sits in the form of a woman upon the talent of lead; or we take the devil τροπικῶς (figuratively) as woman, because of his effeminate powers; or surely idolatry; and, to come nearer, the Church of the heretics, which calls to herself the man lacking sense, so that, enticed, he may receive stolen bread and stolen water, that is, a false mystery and a polluted baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
