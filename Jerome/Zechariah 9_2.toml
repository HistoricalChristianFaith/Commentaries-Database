[[commentary]]
quote='''
Hamath also on its borders, and Tyre and Sidon, for they have taken to themselves exceeding wisdom. And Tyre built her fortification, and heaped up silver like dust, and gold like the mud of the streets. Behold, the Lord shall possess her, and shall strike her strength in the sea, and she shall be devoured by fire. LXX: And Hamath on its borders, Tyre and Sidon, since they were exceedingly wise, and Tyre built her fortification, and gathered silver like dust, and gold like the mud of the roads. Therefore the Lord shall possess her, and shall strike her strength in the sea, and she shall be burned up in fire. Hamath, which is interpreted χόλος, that is, wrath, is the same city that received the name Epiphania from Antiochus Ἐπιφανεῖ (Epiphanes), and is now a city of Coele Syria. This one, therefore, and Tyre and Sidon shall be within the borders of Damascus, or within the borders of the land of Hadrach, so as to believe in the Lord and Savior, to whom it was said by the Father: Ask of me, and I will give you the nations for your inheritance, and the ends of the earth for your possession. The daughters of this Tyre, that is, the souls that believe in Christ, shall bring gifts to the king, that what is written may be fulfilled: The daughters of Tyre shall worship him with gifts. And when the city of God, the Church, has been built, of which the psalmist sings: Glorious things are spoken of you, city of God, at once the rest will follow: Behold the foreigners, and Tyre, and the people of the Ethiopians, these were born there. Of the foreigners it is said in two psalms: Foreigners serve me, or are subject. Of the Ethiopians we read in the prophet Zephaniah: From beyond the rivers of Ethiopia they shall bring gifts to me, and in the psalm: Ethiopia shall stretch out her hands first to God. And of Tyre the Gospel speaks: Woe to you, Chorazin, woe to you, Bethsaida; for if the mighty works that were done in you had been done in Tyre and Sidon, perhaps they would long ago have repented in sackcloth and ashes. From the borders of Tyre and Sidon that Canaanite woman, the Syrophoenician, whose daughter was badly afflicted by a demon, came to meet the Lord and Savior; and she dedicated the first fruits of the faith of the Tyrians and Sidonians, so that those who had not believed in the time of Christ, because they had not yet seen the signs and mighty works, should afterwards see them through the apostles and believe, and should share in that blessedness which the Lord promises, saying: More blessed are those who have not seen and have believed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
