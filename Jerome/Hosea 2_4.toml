[[commentary]]
quote='''
And on her children I will have no mercy, since they are children of fornications, for their mother has played the harlot. She who conceived them is confounded, for she said: I will go after my lovers, who give me bread and my waters, my wool and my flax, my oil and my drink. LXX: And on her children I will have no mercy, since they are children of fornication, for their mother has played the harlot. She who bore them is confounded; for she said: I will go after my lovers, who give me my bread and my water, and my garments and my linens, and my oil and all things that are necessary to me. This I will do besides to her to whom I said: not my wife, and I am not your husband, and I will make her like a wilderness, and make her like a pathless land. For when I led her out of Egypt, the parents were slain and their sons entered the land of promise. But now the children of the fornicating mother will perish with their harlot mother, since they are children of fornication, and evil ones begotten of evil ones. To them it is said in the Gospel: Brood of vipers, a brood which came to such shamelessness that it heard through Jeremiah: You have got the face of a harlot; you are shameless.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
