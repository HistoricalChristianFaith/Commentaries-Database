[[commentary]]
quote='''
Let, he says, the desert and its cities lift up their voice, of which we have also spoken above. Or let the desert rejoice, and its villages, and Kedar, which was once an uninhabitable region beyond Arabia, of the Saracens; and the inhabitants of Petra, which itself is also a city of Palestine. And this signifies that the people of the nations, formerly a desert as regards the knowledge of God and bound by the errors of idolatry, is turned to the praises of the Lord. Or, because Kedar means darkness, and, according to the Apostle (1 Cor 10), the rock is Christ, all believers are commanded that those who were before in darkness, and now believe in the Lord the Savior, should cry aloud from the top of the mountains and openly preach Christ, those to whom it was said also above (cf. Isa 40:9): Go up on a high mountain, you who bring good tidings to Zion; lift up your voice with strength, you who bring good tidings to Jerusalem. And I will set his glory in the islands, of which we spoke before.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
