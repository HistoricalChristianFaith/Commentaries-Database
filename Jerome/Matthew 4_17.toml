[[commentary]]
quote='''
Shewing also thereby that He was Son of that same God whose prophet John was; and therefore He says, Repent ye.

Mystically interpreted, Christ begins to preach as soon as John was delivered to prison, because when the Law ceased, the Gospel commenced.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
From then on Jesus began to preach and to say: Repent, for the kingdom of heaven will draw near. With John handed over, he himself rightly begins to preach. As the law ceases, the Gospel accordingly arises. And if the Savior preaches the same things that John the Baptist had said before, he shows that he is the Son of the same God whose prophet the latter is.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
