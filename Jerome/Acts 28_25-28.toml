[[commentary]]
quote='''
The Seventy translated this place as the evangelist Luke set it down in the Acts of the Apostles: And when they did not agree among themselves, without doubt the Jews, they departed, Paul having said one word: Well did the Holy Spirit speak through Isaiah the prophet to our fathers, saying: go to this people and say: With the ear you shall hear and shall not understand, and seeing you shall see and shall not perceive; for the heart of this people has been made gross, and with their ears they have heard heavily, and they have shut their eyes, lest perhaps they should see with their eyes, and hear with their ears, and understand with their heart, and turn, and I should heal them (Acts 28:25ff.). And at what time this prophecy was fulfilled, the Apostle Paul himself says in what follows: Let it be known to you, therefore, that this salvation of God has been sent to the nations, and they will hear (Acts 28:28). Hence too we read in the same Acts of the Apostles that Paul and Barnabas, when the Jews would not believe, said: It was necessary that the word of God be spoken first to you; but since you have thrust it away and judged yourselves unworthy of eternal life, behold, we turn to the Gentiles (Acts 13:46-47). For thus the Lord has commanded us: I have set you for a light to the nations, that you may be for salvation to the end of the earth (Isa 49:6). So according to the Seventy the interpretation is easy: that Isaiah the prophet, at the Lord's command, foretells what the people is going to do. In the Hebrew there is a difficulty: how God himself commands the people to hear with hearing and not understand, and seeing to see and not recognize, and afterward the prophet is introduced speaking, and he entreats the Lord and says: Blind the heart of this people, and make its ears heavy, and shut its eyes, lest perhaps it see with its eyes, and hear with its ears, and understand with its heart, and be converted, and be healed (Isa 6:10). And first we must resolve the question that can be put to us: why did the apostle Paul, disputing with Hebrews, speak not according to the Hebrew, which he knew to be correct, but according to the Seventy? The ancient expositors of the Church relate that the evangelist Luke was most learned in the art of medicine, and knew Greek letters better than Hebrew. Hence his speech too, both in the Gospel and in the Acts of the Apostles, that is, in both volumes, is more polished and has the scent of secular eloquence, and he uses Greek testimonies more than Hebrew. But Matthew and John, of whom the one wove his Gospel in the Hebrew tongue, the other in Greek, bring forward testimonies from the Hebrew, such as this: Out of Egypt I have called my son (Hos 11:1). And: For he shall be called a Nazarene (Matt 2:23). And: Rivers of living water shall flow from his belly (John 7:38). And: They shall look on him whom they pierced (Zech 12:10; John 19:37), and other things like these. The Epistle of Paul to the Hebrews too is gainsaid for this reason, that in writing to Hebrews he uses testimonies that are not found in the Hebrew volumes. But if anyone should say that the Hebrew books were afterward falsified by the Jews, let him hear what Origen answers to this little question in the eighth volume of his Explanations of Isaiah: that the Lord and the Apostles, who rebuke the other crimes in the Scribes and Pharisees, would never have kept silent about this crime, which was the greatest. But if they should say that the Hebrew books were falsified after the coming of the Lord and Savior and the preaching of the Apostles, I shall not be able to hold back my laughter, that the Savior and the Evangelists and the Apostles should have brought forward testimonies in such a way as the Jews were afterward going to falsify them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
