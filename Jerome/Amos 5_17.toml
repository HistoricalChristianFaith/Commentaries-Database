[[commentary]]
quote='''
And in all the vineyards there shall be wailing, for their vineyards are the vineyards of Sodom. And instead of the wine of gladness, which gladdens the heart of man, they have brought forth the wine of dragons and the incurable fury of asps. And they will suffer all these things, because the Lord will pass through their midst, so as not to dwell among them, nor to say: I will dwell in them, and walk among them, and: Behold, I am with you all days, even to the consummation of the age.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
