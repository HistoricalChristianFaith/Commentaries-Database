[[commentary]]
quote='''
Between receiving and learning, moreover, there is this difference: he receives the Gospel to whom it is first instilled and who is led to faith in it, so that he believes that the things written are yours. But he learns who comes to know, explained and set out in discourse, the things which are figured in it through enigmas and parables; and he comes to know them not by a man revealing them, but by Christ, who revealed them to Paul, or through Paul, in whom Christ speaks. The very word ἀποκαλύψεως, that is, of revelation, also belongs properly to the Scriptures, and was used by none of the wise men of the world among the Greeks. Hence it seems to me that, as with other words which the Seventy translators carried over from Hebrew into Greek, so with this one too they took great pains to express the proper character of a foreign tongue, fashioning new words for new things; and that it signifies when something covered and veiled, its covering taken off from above, is shown and brought forth into the light. That this may become plainer, take an example. Moses used to speak with God with face revealed and open (Exod. 33, 34), that is, without a veil; but when speaking to the people, because they were not able to look upon his face, he put a veil on his face (Num. 4). Before the Ark of the Testament, too, a veil had been spread: and when it had been drawn back, the things which before had been hidden were brought forth, and, to use the very word, were revealed. If, therefore, those who are accustomed to read the eloquent writers of the world begin to mock us for the novelty and meanness of our language, let us send them to the books of Cicero which are entitled On Questions of Philosophy, and let them see by how great a necessity he was compelled there to bring forth such monstrous words as the ear of a Latin man never heard; and this when he was translating into our tongue from Greek, which is a neighboring language. What do they endure who try to express the proper sense of Hebrew difficulties? And yet in such great volumes of the Scriptures there are far fewer things that have a ring of novelty than those which he gathered together in one small work. It can also be taken, as we said at the beginning when we were expounding "Paul an apostle, not from men, nor through man", so in the present passage too, as aimed obliquely at Peter and the others who preceded him: that he who has Christ alone as the teacher of the Gospel is moved by no one as by Law and authority. Moreover, he means that revelation when, going to Damascus, he was found worthy to hear the voice of Christ on the way, and with his eyes blinded beheld the true light of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
