[[commentary]]
quote='''
Wonderful are shown the faith, patience, and humility of this woman; faith, that she believed that her daughter could be healed; patience, that so many times overlooked, she yet perseveres in her prayers; humility, that she compares herself not to the dogs, but to the whelps. I know, she says, that I do not deserve the children's bread, and that I cannot have whole meat, nor sit at the table with the master of the house, but I am content with that which is left for the whelps, that through humble fragments I may come to the amplitude of the perfect bread.

Wonderful change of things! Once Israel the son, and we the dogs; the change in faith has led to a change in the order of our names. Concerning them is that said, Many dogs hare come about me; while to us is said, as to this woman, Thy faith hath made thee whole. (Ps. 22:16.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252015.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But she said: Yes, Lord, for even the little dogs eat of the crumbs that fall from their masters' table. I know, she says, that I do not deserve the children's bread, and that I cannot take whole food or sit at table with the father; but I am content with the whelps' leavings, so that through the humility of crumbs I may come to the greatness of the whole loaf. O wonderful reversal of things! Israel once a son, we dogs. As faith differs, the order of the names is changed. Of them it is later said: Many dogs have surrounded me; and: Look at the dogs, look at the evil workers, look at the concision. We hear, with the Syrophoenician woman and with the woman who had suffered a flow of blood: Great is your faith, let it be done according to your faith; and: Daughter, your faith has made you whole.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
