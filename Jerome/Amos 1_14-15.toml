[[commentary]]
quote='''
Hence he threatens that he will kindle fire on the walls of Rabbah, which was the metropolis of the Ammonites, so that its houses may be devoured amid the shouting and howling of the conquering army; in the day of commotion and of whirlwind, when, Nebuchadnezzar conquering, its captives will be led away, and the idol of the Ammonites, which is called Melchom, that is, their king, will be carried off to the Assyrians; and its princes, that is, its priests, will be led away together. Priests is not in the Hebrew, but princes. So the Seventy added priests, so that, if you wish to know who these princes are, you may hear: priests.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
