[[commentary]]
quote='''
In this number, then, the possession is bought by the prophet and priest, and it is written in a book and sealed, and witnesses are called and the silver is carefully weighed, so that all the rights of sale and purchase may be preserved and the possession may be certain, strengthened by stipulations and responses. Let them at least hear this who try to claim for themselves, by calling witnesses, wills that are false and sometimes not even wills at all!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
