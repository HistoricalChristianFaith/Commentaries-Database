[[commentary]]
quote='''
And I am the Lord your God from the land of Egypt; I will yet make you sit in tabernacles as in the days of festivity; and I have spoken upon the prophets, and I have multiplied visions, and in the hand of the prophets I have been likened. LXX: But I am the Lord your God, I brought you out of the land of Egypt; I will yet make you dwell in tabernacles, as in the days of solemnity, and I will speak to the prophets, and I have multiplied visions, and in the hands of the prophets I have been likened. You indeed have sinned so greatly that you rejoiced in crime, and thought the multitude of your sins to be riches, and said: I have become rich, I have found an idol for myself; all my labors will not be able to find my sins. But I, the Lord your God, who brought you out of the land of Egypt when you were serving Pharaoh and building cities of mud and straw, still grant you room for repentance, and by the greatness of my promises I exhort you to return to me; for I will yet make you sit in tabernacles as in the days of festivity. He calls the day of festivity Tabernacles, in the seventh month, on the fifteenth day of the month, when the sons of Israel went out of Egypt. Just as, he says, at that time I set you free from Egypt, and you dwelt in tabernacles, hastening to the holy land and to the place of the temple, so now also I will bring you out of tribulation and distresses and the impending captivity, if only you do what I have commanded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
To those also who have been led astray by the heretics it is said that they should return to the Lord, who prefers the repentance of the sinner to his death; for he is the one who brought them out of the land of Egypt, that is, out of the darkness and error of the Gentiles. And lest perhaps, remembering their sin, they should return too slowly: I will yet, he says, make you sit in tabernacles, as in the days of festivity; so that what baptism does, repentance may do, and they may dwell in the tabernacles of the Savior, that is, in the Churches, of which it is said: Planted in the house of the Lord, they will flourish in the courts of the house of our God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
