[[commentary]]
quote='''
And I will strike, he says, the winter house with the summer house, which we can take simply according to the letter: that they were of such great wealth that they had double houses, winter ones and summer ones, of which some faced the north and others the south, so that according to the variety of the seasons they might secure a temperate measure of cold and heat and of the sky. We can call the winter house the kingdom of Israel, in which there was coldness of religion and of the worship of God, and various whirlwinds of the winds, and savage storm; and the summer house, Judah and Jerusalem, in which was the temple, and burnt offerings were offered morning and evening, and the warmth of religion flourished. And the houses of ivory, he says, shall perish, which can also stand according to the history. For we read that Ahab king of Israel abounded in such great luxuries that he made himself a house of ivory. For 'of ivory' we find in the Hebrew houses of tooth, that is, of elephant. Of these it is also written in the forty-fourth (45th) psalm: From the houses of ivory, out of which the daughters of kings have delighted you in your honour.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
