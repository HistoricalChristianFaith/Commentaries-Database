[[commentary]]
quote='''
To be angry is human; to put an end to one's anger is Christian.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_130.html'
source_title="LETTER 130.13"

[[commentary]]
quote='''
Some think that this is to be taken simply, in the same way as that verse of the fourth psalm, from which this very thing seems to have been taken: What you say in your hearts, be pricked with compunction for it on your beds as well (Ps. 4:5), that is: whatever sins you commit in the day, whether in deed, or word, or thought, purge them through the night by repentance coming after: and let anger be brief, and not be put off to the following day.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
