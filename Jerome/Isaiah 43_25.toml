[[commentary]]
quote='''
I am, I am he who blots out your iniquities for my own sake, and I will not remember your sins. Put me in remembrance, that we may be judged together; tell, if you have anything, that you may be justified. Your first father sinned, and your interpreters have transgressed against me. And I have defiled the holy princes; I have given Jacob to slaughter, and Israel to blasphemy. LXX: I am, I am he who blots out your iniquities, and I will not remember them. But you, remember, and let us be judged. Tell your iniquities first, that you may be justified. Your fathers sinned, and your princes have acted unjustly against me, and the princes have defiled my holy things. And I have given Jacob up to destruction, and Israel to reproach. You, he says, Jacob and Israel, have made me labor in your sins, and I could scarcely carry the burdens of your iniquities; you whom I in no way call my servants or my children, but address by the bare names of Jacob and Israel, so as to expose and reprove you as sinners. But I, for my own sake, because I am merciful and patient and of many mercies, will blot out all your iniquities in the sprinkling and the blood of the new Testament; I will blot out the old bond that was written against you; and I will no longer remember your sins, which, if you are willing to believe, I am going to forgive you in baptism.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
