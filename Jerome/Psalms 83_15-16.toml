[[commentary]]
quote='''
So shall you pursue them in your tempest, and in your wrath... What? will you kill them? No: you will trouble them, that they may be saved. Fill their faces with shame, that they may be confounded. Why this? And they shall seek your name, O Lord. You see, then, that he prays not against them, but for their salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_015.html'
source_title="Homily 15, on Psalm 82"

[[commentary]]
quote='''
Thus far it is wrath: what follows is now mercy. And in your anger you will trouble them. He did not say, kill, but, trouble them, that they may return to you: behold the sixth. Fill their faces with shame: not with punishment, lest, shut out by death, they be unable to return to the Lord. Fill their faces with shame, not with punishment. Why then do you not kill them? The divine word explains: That they may seek your name, O Lord. For if they seek, they will also find. Those who have been led astray by the heretics will be turned back to the Lord: behold the seventh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_062.html'
source_title="Homily 62, on Psalm 82 (Alternate Series)"
