[[commentary]]
quote='''
Lord, what is man, that you have made yourself known to him? or the son of man, that you take account of him? This very thing is said also in the eighth psalm. 'What is man, that you are mindful of him? or the son of man, that you visit him?' Lord, what is man, that you have made yourself known to him? He speaks of the frailty of the body and of the human condition: and what does he say? If you look at the flesh, what is man? If at the spirit, man is a great thing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_054.html'
source_title="Homily 54, on Psalm 143"
