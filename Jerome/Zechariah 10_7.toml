[[commentary]]
quote='''
And they shall be like the mighty men of Ephraim, who, at first weak and infirm, shall afterwards be mighty and worthy of their name. For Ephraim is interpreted fruitfulness. And their heart shall rejoice when they have drunk the wine that was pressed from the vine of Sorek. Their sons also, to whom the apostle Paul speaks: My little sons, with whom I am again in labor until Christ be formed in you. And Peter, the prince of the apostles: As sons, he says, of obedience, not conformed according to your former manner of life. And in the psalm we read: Come, sons, hear me; I will teach you the fear of the Lord. These sons, therefore, shall exult and rejoice, and their heart shall be glad in the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
