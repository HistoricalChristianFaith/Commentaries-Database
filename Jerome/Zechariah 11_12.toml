[[commentary]]
quote='''
And I said to them: If it is good in your eyes, bring my wage, and if not, be still; and they weighed out my wage, thirty pieces of silver. And the Lord said to me: Cast them to the statuary, the fine price at which I was priced by them; and I took the thirty pieces of silver, and cast them into the house of the Lord to the statuary. LXX: And I will say to them: If it is good in your sight, give, setting my wage, or refuse. And they set my wage, thirty pieces of silver. And the Lord said to me: Put them down into the furnace, and consider whether it is tested, as I was tested for them. And I took the thirty pieces of silver, and put them into the house of the Lord into the furnace. Since the poor of the Israelite flock, who keep my commands, knew that what I spoke was the word of the Lord, and that what I said was true — what I said, that is, to the poor of the flock: If it pleases you; for you are men, and once for all I created you with free will, you to whom I also spoke in the desert: If you hear me, you shall eat the good things of the land; in return for this taking up, by which I cast off the whole human race and chose you for myself as a flock of my own, and, the Creator of all, willed to have a small cord, give me back my wage, that is, keep my precepts. But if you do not wish to pay the wage, and it does not please you in your eyes to be reckoned by my name, refuse openly, and do what you will. And they then indeed answered Moses: All things whatsoever the Lord says, we will do. But at the end of the times, in return for my having chosen them from the midst of the nations, and freed them from the iron furnace of Egypt, they weighed out my wage, thirty pieces of silver, giving them to Judas the traitor for my blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
