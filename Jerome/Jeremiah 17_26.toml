[[commentary]]
quote='''
And they will come from the cities of Judah and from round about Jerusalem, of which we have already spoken, and from the land of Benjamin, who is the 'son' 'of power' and 'of the right hand', and from the plains, which in Hebrew is called 'sefela' and signifies the plain understanding of the history, and from the hill country, namely the lofty doctrines, and from the south, of which it is written, God will come from the south, whence comes heat and full light, and where all cold is driven out. Bringing, he says, burnt offerings — consecrating themselves to God — and a victim or incense, so that they may say: a sacrifice to the Lord is a troubled spirit, and: we are the good odor of Christ in every place, and elsewhere: let my prayer be directed as incense in your sight; and sacrifice, for which the Seventy put the Hebrew word itself, 'manaa', which by a very bad custom, nay rather by the carelessness of scribes, is read in our books as 'manna'; and frankincense, of which it has been said, to what purpose do you bring me frankincense from Sheba?; and they will bring in an offering, which in Hebrew is called 'thoda' and can be rendered as 'thanksgiving', and which the Seventy translated as 'praise'. Into the house of David: no doubt, into the Church. These are the rewards of those who sanctify the sabbath and are weighed down by no weight.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
