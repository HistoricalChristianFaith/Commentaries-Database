
[[commentary]]
quote='''
And turning to the prophet he testifies with a clear voice: Behold, those who go out into the land of the north have made my spirit rest in the land to which they set out. In a passage that is indeed most difficult, it was handed down to me by the Hebrews that Alexander and all the Macedonians, that is, the white horses which went out after the Medes and Persians, who had themselves also gone into the land of the north, made the prophetic spirit rest in the land of the north, because against the Medes they fulfilled the will of God, and in a short time the empire of the Medes and Persians was destroyed by the Macedonians. For great is the consolation of those who are oppressed, if they know that their enemies will soon perish. These things, as we were able, or rather as we received them, we have handed on to those devoted to our language, following the truth of the history; not hunting out with tenacious memory, after the fashion of the Egyptian exposition, the chariots of Pharaoh and the Babylonian cars; for what must be considered is not where something is written, but for what reason it is written.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
This too, which follows: Behold, those who go out into the land of the north have made my spirit rest in the land of the north, he explained in such a way as to say that the spirit of the Lord, or of the angel, rested when, in the land of the north, the most harsh kingdoms of the devil were overthrown by the apostolic preaching; and that these are the kingdoms which the devil, showing them to the Lord and Savior on a high mountain, boasted had been handed over to himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
