[[commentary]]
quote='''
And we shall raise up against him seven shepherds, and eight principal men. And they shall feed the land of Asshur with the sword, and the land of Nimrod with its lances; and he shall deliver from Asshur when he comes into our land, and when he treads within our borders. LXX: And seven shepherds shall rise up against him, and eight bites of men; and they shall feed Asshur with the sword, into the land of Nimrod in its pit; and he shall deliver from Asshur, when he comes upon your land, and when he goes up upon your borders. Where we have put principal men, and in the Hebrew is written nesiche adam, Symmachus rendered christs (anointed ones) of men; Theodotion and the Fifth Edition, princes of men; Aquila, weighty, or established men, that is, καθεσταμένους. Again, where Aquila and I translated with its lances, so that of the land of Nimrod is understood, Symmachus turned it ἐντὸς πυλῶν αὐτῆς, that is, within its gates; Theodotion, in their gates; the Fifth Edition, ἐν παραξίφεσιν αὐτῶν, which we can render, with their daggers; but in the Hebrew is set baphethee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
