[[commentary]]
quote='''
Calling, therefore, upon the Lord Savior, who has the key of David, who opens, and no one shuts, and who shuts, and no one opens, who also opened the sealed book of Isaiah and of all the prophets, and whom the twenty-four elders holding harps adored, because he alone could unlock the divine mysteries, let us approach the building of the city to which the prophetic word is directed: glorious things are spoken of you, city of God, and: the rush of the river gladdens the city of God. The Church, then, is built from the tower 'of obedience' or 'of grace' and 'of the gifts of God' — for this is what Ananehel means — to the gate of the corner; which, though it seems to have a lofty beginning, yet as long as we abide in this flesh we cannot possess the straight line of truth, but we stand in the corner and in broken lines; and the line of measure goes out further, over against it, that is, against the gate of the corner, upon the hill Gareb, which in our language is rendered either 'sojourning' or 'scab', so that they may teach us that we are strangers and pilgrims, and itching in our ears, and readily giving consent to the novelty of the worst doctrines. And it shall go round, he says, Goah, for which the Seventy translated: round about with chosen stones, which are rolled upon the face of the earth and are bound together by the corner stone, as the apostle Peter says: and you yourselves, as living stones, be built up, a spiritual house, a holy priesthood, offering spiritual sacrifices acceptable to God through Jesus Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
