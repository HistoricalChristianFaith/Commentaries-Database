[[commentary]]
quote='''
Your calf is cast off, Samaria. My fury is kindled against them. How long will they be unable to be cleansed? For it too is from Israel; a craftsman made it, and it is not God, for the calf of Samaria will become spiders' webs. LXX: Cast off your calf, Samaria; my fury is roused against them. How long will they be unable to be cleansed in Israel? And this a craftsman made, and it is not God, because your calf, Samaria, was leading astray. In the place where we have put spiders' webs, in the Hebrew is written sababim, with the letter iod as the penultimate; not, as some falsely think, sababum, that is, with uau, which the Seventy and Theodotion translated πλανῶν, that is, leading astray and deceiving; Aquila, wandering or turned about; Symmachus, inconstant or unstable, that is, ἀκαταστατῶν; the Fifth edition, ῥεμβεύων, roving and fluctuating. We have learned from a Hebrew that sababim properly denotes the threads of spiders flying through the air, which perish even while they are seen, and are dissolved into atoms and into nothing. And to these the calf of Samaria is rightly compared, which at that time the people worshiped because of the greatness of its value, since it was of gold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
And because he had said: Cast off your calf, Samaria, he explains who this calf is: for it too is from Israel; not from others, he says, from the nations, have you received the calf, as Baal and Ashtaroth from the Sidonians, as Chemosh from the Moabites and Moloch from the Ammonites; but you yourselves, and your king Jeroboam, made in Israel what you had learned in Egypt. Or what sort of god is that which is formed by the hand of a craftsman? Finally, as the threads of spiders dissolve into the wind, so the calf of Samaria will be reduced to nothing.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
