[[commentary]]
quote='''
But I said: Perhaps they are poor and foolish — or they could not — not knowing the way of the Lord, the judgment of their God. I will go therefore to the nobles and will speak to them; for they have known the way of the Lord, the judgment of their God. He speaks here of the poor and the nobles not in terms of want and riches; rather, he compares the people with the princes. And the sense is: 'Seeing the obstinacy of the unbelieving people, and that with hardened face it would not receive discipline, I was reasoning this out with myself: perhaps the ignoble common crowd cannot know the teaching of God and is therefore excusable, because through inexperience it is not able to know the commandments of God. I will go therefore to the priests and to those who preside over the people, and will speak to them; for they have known the will of the Lord and know the judgment of their God'. He says this in the language of one who doubts, according to that saying of the Gospel: I will send my son; perhaps they will reverence him, so that from the ambiguity of the statement and the suspense of the words the free will of man may be shown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
