[[commentary]]
quote='''
And the Lord willed to cleanse him from the stroke which he had received when pierced by the soldier's lance. Or to bruise him in infirmity and wound; of which he himself also said: For they persecuted him whom you struck (Ps 68 [69]:27). And through Zechariah God says: I will strike the shepherd, and the sheep shall be scattered (Zech 13:7). Therefore his suffering was not of necessity, but of the will of the Father and of his own, he who said to him: O God, to do your will, I have willed it (Ps 39 [40]:9). Of which we also read above: He was offered because he himself willed it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
If he lays down his soul for sin, he shall see a long-lived seed, and the will of the Lord shall be directed in his hand. Because there has labored his soul, he shall see, and be satisfied: by his knowledge he himself, the righteous one, shall justify my servants who are many, and he himself shall bear their iniquities. LXX: If you give an offering for sin, your soul shall see a long-lived seed: and the Lord wills to take away his soul from pain, to show him light, and to form understanding; to justify the righteous one who serves many well: and he himself shall bear their sins. According to the Hebrew this is the sense: If he whom the Lord willed to bruise, or to cleanse, lays down his soul for sin, he shall see a long-lived seed, which he sowed in good ground. Of which it is written in the Gospel: The sower went out to sow; and again: The kingdom of heaven is like a man who sowed good seed in his field (Matt 13:3). And the will of the Lord shall be directed in his hand, so that whatever the Father willed may be fulfilled by his powers, as he says to the Father: I have kept in your name those whom you gave me. I have guarded them, and none of them has perished except the son of perdition (John 17:12).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
According to the Seventy this is said: O you for whose sins the Son of God was led to death, you who, the worst men and rich in evil, were given for his burial and death: if you are willing to do penance, and to offer for your sins a sacrifice pleasing to God, a contrite spirit, your soul shall see a seed of long time, the Lord the Savior himself. Of whom it is sung in Psalm 88 (89): His seed endures for ever, and his throne like the sun in my sight. And again: I will establish his seed for ever and ever, and his throne like the days of heaven. Which in other words Gabriel says to the Virgin: Behold, you shall conceive in your womb and bear a son, who shall be called the Son of the Most High. And the Lord shall give him the throne of David his father, and he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end (Luke 1:31, 32). For the Lord wills to take away from pain the soul of him who had said, My soul is sorrowful even unto death (Matt 26:38), so that the shame of the cross may be tempered by the glory of the resurrection.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
