[[commentary]]
quote='''
Things that have no sense of hearing hear me and perceive me; and the people once mine, made foolish by its own fault, not only despises but even provokes its sweet God. They have withdrawn,' he says, 'from me, and turned their backs on me, and gone away with hurried step, nor did a silent conscience draw them back, so that they should say in their hearts: Let us fear him who gives us the early and the late rain! — through all of which I have shown good things, the fullness of the yearly harvest', for which Aquila's first edition and Symmachus translated 'weeks'; for in the Hebrew is written 'sabaoth', which, owing to the ambiguity of the word, signifies both 'weeks' and 'fullness'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
