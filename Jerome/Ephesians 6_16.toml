[[commentary]]
quote='''
Above all taking up the shield of faith, with which you may be able to quench all the fiery darts of the wicked one.

As if he had said: In every work carry the shield of faith, so that, covered and protected, you may be able to receive the arrows as they come, and with the art of war turn them aside this way and that. This is the faith upon which even Abraham, after many works and virtues, was barely able to merit that Scripture should say of him: And Abraham believed God, and it was reckoned to him for righteousness (Gen. 15:6). Plain to see, moreover, are the darts of the wicked one, which he wishes to send into our hearts through most evil thoughts; of these he cast one into the heart of Judas, that he should betray the Savior. And so the enemy will not be able even to make a beginning of wounding the soul, if we hold the shield of faith, in which not only are the weapons that come broken, but even the very fire of the weapons is quenched, over which the prophet also laments, saying: All adulterers, their hearts are like an oven (Hos. 7:4). He who holds this boss of faith with a strong hand, and, trusting in the Lord, knows that he is safe from the darts that come, will speak fearlessly: In the Lord I trust: how do you say to my soul: Move to the mountain like a sparrow? For behold, sinners have bent the bow, they have prepared their arrows in their quivers, to shoot in the dark at the upright in heart (Ps. 10:1, 2). Since, then, he says, I trust in the Lord, on what reasoning do you give me counsel not to stand against the onsets of enemies, and against the darts which they have prepared against me in their quivers, wishing to strike not only me but also all the upright in heart? Behold, I stand upon the rock, and do not move to the dark mountains; and all the weapons of the enemies, driven back, are turned upon those very ones who aim them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
