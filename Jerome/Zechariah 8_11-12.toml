[[commentary]]
quote='''
But now I will not deal with the remnant of this people as in the former days, says the Lord of hosts, but there shall be a seed of peace. The vine shall give its fruit and the earth shall give its shoot; and the heavens shall give their dew, and I will cause the remnant of this people to possess all these things. LXX: And now I will not deal with the remnant of this people as in the former days, says the Lord Almighty, but I will show peace. The vine shall give its fruit and the earth shall give its shoots; and heaven shall give its dew, and I will cause the remnant of my people to possess all these things. Before the foundations of the house of God were laid and the temple was built, there was no wage for men, nor a wage for beasts, nor, because of tribulation and distress, peace for those who came in and went out, and all men were at variance among themselves with hostile hatred. But now, since the foundations of the house of the Lord have already been laid and the temple has been built, I will by no means do as I had done before to those who have returned from the Babylonian captivity; but there shall be peace and joy everywhere, and the abundance to come will make up for the drought and famine of the former time. For the vine shall give its fruit, and all the winepresses shall be filled, the earth shall be clothed with glad crops, and with the rains and the night dew watering it, all things shall sprout; all that I have said, I will cause the remnant of my people to possess; the foundations of the house of the Lord have been laid, and the temple has been raised. The prophet Haggai too speaks these same things at the same time, who had said above: I struck you with a burning wind and with blight and with hail all the works of your hands. After the foundations of the temple were laid: Set, he says, in your hearts from this day and into the future, from the twenty-fourth day of the ninth month, from the day on which the foundations of the temple were laid, set it upon your heart. Is the seed already in the shoot, and has the vine and the fig and the pomegranate and the olive tree yet flowered? From this day I will bless, and again I will move heaven and earth alike. Let us also say it another way, following the explanation begun concerning the Church. Before anyone receives the faith of Christ, and the foundations of the Holy Spirit are laid in him, no one will be able to hear: There is a wage for your work. Whether he be a Jew, or a heretic, or a Gentile, whatever good work he has done, unless he has done it in the name of Christ, he will not have the wage of his good work. We see the virgins of the heretics, the rigor of the philosophers, the observance of the Jews in the variety of foods, and yet we say, according to Haggai, that they eat and are not satisfied; they drink and are not made drunk; they are covered and are not warmed; and he who gathers wages puts them into a bag with holes. But after they have received the faith of Christ, both those and these who had been sinners in the Church, and for the greatness of their offenses had been handed over to the captivity of this world and burned by the Babylonian fire, and have heard the Lord preaching: The Spirit of the Lord is upon me, because he has anointed me; he has sent me to preach the gospel to the poor, to proclaim release to the captives, and sight to the blind, to heal those who are of a contrite heart, and when that which is said through Amos has been fulfilled in them: I will turn back the captivity of my people Israel, and they shall build the ruined cities, and I will plant them, then in those days justice shall rise, and abundance of peace.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
