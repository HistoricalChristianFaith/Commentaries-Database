[[commentary]]
quote='''
How has the faithful city become a harlot, full of judgment! Righteousness rested in it, but now murderers. The Hebrew word JALIN (ילין), for which the Seventy translated slept, means both rested and will rest, that is, it signifies both the past and the future tense. Hence Aquila and Theodotion too speak as of the future. And he marvels in the prophetic spirit that the city which was once faithful, or the dwelling of the faithful, has suddenly become a harlot. This can indeed be understood also of the times of Isaiah, but it is referred more fully to the passion of Christ, when all turned aside and together became unprofitable (Ps 13 [14]:3). And although Zion is not found in the Hebrew, the Seventy nevertheless added it to make the sense plainer. Now Zion is the mountain on which the city of Jerusalem was founded; after it was taken by David it was called the city of David. Nor do I doubt that there were holy men in it when it had the tabernacle of God, and afterwards when the Temple was built; when Nathan and Gad prophesied, and Asaph and Jeduthun and Heman and the sons of Korah were set over the choirs (which are described more fully in the book of Days), so that religion might pass little by little from the sacrifices of victims to the praises of the Lord (1 Chr 25). The city of the faithful, then, which before was full of judgment, and righteousness rested in it, is now full of murderers, who killed the prophets and the Lord Savior himself. And the fornication of Jerusalem, how she spread her legs to everyone who passed by, Ezekiel sets out under the name of Oholibah, which means my tabernacle in her; which is now said in other words, righteousness rested in it. For righteousness, in the Hebrew is written SEDEC (צדק), which sounds rather like the righteous one than righteousness, so that we may understand that the Lord formerly dwelt in it, of whom it is said elsewhere: But what has the righteous one done? The Lord is in his holy temple; the Lord, his seat is in heaven (Ps 10 [11]:5). All of which we can refer, according to the anagogy, to the soul of a man once holy, in which the righteousness of God formerly dwelt, if afterwards he has sinned, and in place of God as guest murderous demons have dwelt in it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
