[[commentary]]
quote='''
And the sons of Lotan were Borri and Omman, and the sister of Lotan was Themna. This is the Themna of whom it was said above, and Themna was the concubine of Eliphaz, the firstborn son of Esau, and of her Amalek was born. And he made mention of the Horites for this reason: because the firstborn of Esau's sons had taken a concubine from among their daughters.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
