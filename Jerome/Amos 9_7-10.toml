[[commentary]]
quote='''
The whole understanding of this passage which I have set forth, and of everything contained in this section, I will sum up in a brief discourse, up to the place where it is written: Who say, Evil will not draw near, and will not come upon us, so that we may be able to know what is said: I, the Lord God Almighty, from whom nothing can be hidden, who touch the earth and it shall be moved; who build my ascent in heaven; who call the waters of the sea and pour them out upon the face of the earth; whose name is the Lord; I who am the creator of all, formed all the nations from the same clay and begot them with an equal lot. In short, I have joined together the Ethiopians, the Philistines, the Syrians and the Jews, far apart as they are in places and in bodies, by the law of mortality, and at my will I move my servants hither and thither, and transfer them into all the provinces. Do not be lifted up into pride because I brought you out of Egypt and, as my peculiar people, did not allow you to serve Pharaoh; this same thing I did also for the Philistines, whom the Seventy translated 'foreigners', who in Hebrew are called caphthorim: I transferred them from Cappadocia and settled them in the regions of Palestine; the Syrians also, that is, Aram, I transferred from Cyrene; and so those who were made in an equal condition will be punished by an equal sentence of my judgment, and I will overturn all impious kingdoms, without respect of persons. But you, O sons of Israel, of whom I said: Israel is my firstborn son, and: Out of Egypt I called my son: I will strike you with the rod and will visit your sins; but I will not crush you for ever, and I will not take my mercy away from you; and, as though you were shaken and tossed in a sieve, I will cleanse and choose you, so that whoever is a little stone, and strengthened through repentance, may not fall out of my sieve, but whoever falls to the ground like dust may be struck with the sword; and the sinners of my people shall die, not because they sinned before, but because they persevered in their sins until death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
