[[commentary]]
quote='''
Their cause of terror is threefold. Because they knew that they had done amiss; or because the bright cloud had covered them; or because they had heard the voice of God the Father speaking; for human frailty cannot endure to look upon so great glory, and falls to the earth trembling through both soul and body. And by how much higher any one has aimed, by so much lower will be his fall, if he shall be ignorant of his own measure.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the disciples, hearing it, fell on their face and were exceedingly afraid. They are struck with dread for a threefold cause: either because they had recognized that they had erred, or because the bright cloud had covered them, or because they had heard the voice of God the Father speaking; human frailty does not endure to bear the sight of a greater glory, and, trembling in its whole soul and body, it falls to the earth. The more anyone seeks greater things, the more he collapses to the lower, if he is ignorant of his own measure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
