[[commentary]]
quote='''
Now "apostle," that is, "sent," is properly a word of the Hebrews, and Silas also has this sound, he to whom the name "sent" was given from sending. The Hebrews say that among the prophets themselves and the holy men there are some who are both prophets and apostles, but others who are only prophets. Thus Moses, to whom it is said: "And I will send you to Pharaoh" (Exod. 3:10, 11); and who answers: "Provide another whom you may send"; and Isaiah, to whom God speaks: "Whom shall I send, and who will go to this people" (Isa. 6:8)? are both apostles and prophets. Hence we too can understand that John the Baptist also should be called both prophet and apostle, since indeed Scripture says: "There was a man sent from God, whose name was John" (John 1:6). And we can understand that in the Epistle to the Hebrews (Heb. 3) Paul, contrary to his usual custom, set at its head neither his own name nor the title of apostle for this reason, that he was going to say of Christ: "Having therefore the chief of priests and the apostle of our confession, Jesus"; and that it was not fitting that where Christ was to be called an apostle, Paul should also be set down there as an apostle.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
