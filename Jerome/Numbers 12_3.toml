[[commentary]]
quote='''
Through this Moses, the servant of God, deserved to receive the testimony of Scripture, which says: "Moses was gentle, beyond all men upon the earth" (Num. 12:3). Upon the earth, he says. For he could not be beyond those who saw God face to face, because we are often compelled to do many things through the weakness of the flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
