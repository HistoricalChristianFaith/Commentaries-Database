[[commentary]]
quote='''
As, therefore, Salmana was laid waste by Jerubbaal, whom some wrongly think to be Jeroboam son of Nebat, who ruled over the ten tribes, and was laid waste, as is contained in the Hebrew, by Arbel, which signifies the very same thing as Jerubbaal, but in a shorter and more eloquent expression; so has Bethel done to you, O Israel, from the face of your wickednesses, Bethel, where you set up the golden calf and worshipped the gods of Egypt. For Bethel, which is interpreted house of God, the LXX translated house of Israel, which is not found at all in the Hebrew.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
