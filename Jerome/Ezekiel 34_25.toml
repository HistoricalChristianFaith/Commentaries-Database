[[commentary]]
quote='''
Then he will make with them a covenant of peace — by no means of wars and discord, for: His place was made in peace, but of the peace of Christ: Which surpasses all understanding —, who says: My peace I give to you, my peace I leave to you; and he will make the most evil beasts cease from the land — more mildly: either the passions by which human souls are troubled, or the adverse powers by which they are assailed —, and those who dwell in the desert will sleep secure in the woods — for the Lord will lay bare the thickets of the forests, and in his temple all will speak glory.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
