[[commentary]]
quote='''
But now in the Gospel, after the cross, the resurrection and the ascension, he promises that he gives a covenant not on tablets of stone, but on fleshly tablets of the heart, and that, when the testament of the Lord has been written in the mind of believers, he himself is to them for God and they are to him for a people, so that they do not at all seek Jewish teachers and the traditions and commandments of men, but are taught by the Holy Spirit, if only they deserve to hear: you are the temple of God and the Spirit of God dwells in you. The Spirit, however, breathes where he wills, and has diverse graces, and the knowledge of the one God is the possession of all the virtues. 'And this', he says, 'will come about because I will be propitious to their iniquity and their sin I will remember no more.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
