
[[commentary]]
quote='''
And the word of the Lord came to me, saying: Take from the exiles, from Heldai and from Tobijah, and from Jedaiah, and you shall come on that day, and enter the house of Josiah son of Zephaniah, who came from Babylon. And you shall take silver and gold, and make crowns, and set them on the head of Joshua son of Jehozadak, the high priest, and you shall speak to him, saying: Thus says the Lord of hosts, saying: Behold a man, the Rising is his name, and beneath him it shall rise, and he shall build a temple to the Lord. And he himself shall raise a temple to the Lord, and he himself shall bear glory, and shall sit and rule upon his throne, and he shall be a priest upon his throne, and the counsel of peace shall be between the two of them. And the crowns shall be for Helem and for Tobijah and for Jedaiah and for Hen son of Zephaniah, a memorial in the temple of the Lord. And those who are far off shall come and build in the temple of the Lord, and you shall know that the Lord of hosts has sent me to you. And this shall be, if with hearing you hear the voice of the Lord your God. LXX: And the word of the Lord came to me, saying: Take the things that are from the captivity, from the rulers, and from its useful men, and from those who have known it; and you shall go in on that day into the house of Josiah son of Zephaniah, who came from Babylon, and you shall take silver and gold, and make crowns, and place them upon the head of Joshua son of Jehozadak, the high priest, and you shall say to him: Thus says the Lord Almighty: Behold a man, the Rising is his name, and beneath him it shall rise, and he shall build the house of the Lord, and he himself shall receive power and shall sit, and shall rule upon his throne. And there shall be a priest at his right hand, and the counsel of peace shall be between the two; but the crown shall be for those who wait, and for its useful men, and for those who have known it, and for the favor of the son of Zephaniah, and for a psalm in the house of the Lord; and those who are far from them shall come and build in the house of the Lord. And you shall know that the Lord Almighty has sent me to you, and it shall be, if with hearing you hear the voice of the Lord your God. I resolved once for all to bring forth to Latin ears the secrets of Hebrew learning and the hidden teaching of the masters of the synagogue, only so much of it, at any rate, as agrees with the holy Scriptures. For this reason I must, in the most obscure places, draw the lines of the history, and so set forth openly what I have received from churchmen, leaving it to the reader's judgment which he ought rather to follow. And first the order of the reading must be rendered, so that what is said may become clear according to the letter. Take, he says, from Heldai and from Tobijah, and from Jedaiah, who came from the Babylonian captivity, and you shall take from them the gifts that are offered, silver and gold, and you shall enter the house of Josiah son of Zephaniah; and there you shall make crowns, set off by the variety of gold and silver, not one crown but two or more; for ataroth, that is, στέμματα, signifies not the singular but either the dual or the plural number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
But upon us lies the necessity of saying, according to the LXX translators, what our forefathers said. Take from the captivity, and from the rulers, and from its useful men, and from those who have known it, gold and silver, and having gone into the house of Josiah son of Zephaniah, who himself too came from Babylon, make in it crowns of gold and of silver, which you shall place upon the head of Joshua son of Jehozadak, the high priest. The captivity of the Jews, that is, of the people that confesses the Lord, is vices and sins, which he who has begun to do repentance and to long for the former Jerusalem, that is, the Church of Christ, abandons and leaves behind in Babylon; and it is offered by the rulers of the captives, and by its useful men, that is, of the captivity, who themselves too were handed over for their own profit to an angel of Satan for the destruction of the flesh, that the spirit might be saved; and by those who know that it, namely the captivity, is to be turned to good account after the punishments. And the gold and silver is offered by those who confess the Lord both in understanding and in speech, and from it, that is, from the gold and silver, crowns are made in the house of Josiah, who is interpreted saved, and is the son of the visitation of the Lord, that is, ἐπισκοπῆς κυρίου. For he is visited by the Lord who before had been grievously sick. And rightly is he called Josiah, saved, because he too returned from Babylon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
