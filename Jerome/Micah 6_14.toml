[[commentary]]
quote='''
There follows: You shall eat, and not be satisfied. For they read and do not understand; and feeding on the words of the Scriptures, they suffer a want of truth. And I will cast out, he says, you; and you shall lay hold, and shall not save; and whoever shall be saved shall be handed over to the sword. I will abandon you, he says, to your own judgment; and after you have sought many things and found nothing, understanding your error, you will see that you cannot be saved by all your doctrines. But whoever think themselves satisfied, and have not been cast out from themselves, nor have grasped the truth, will be handed over to the sword, and will be instructed by punishments.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
