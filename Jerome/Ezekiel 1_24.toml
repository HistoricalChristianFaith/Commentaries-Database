[[commentary]]
quote='''
And the voice of the flying wings is heard, as the voice of many waters, which according to the Revelation of John signify peoples; and, advancing little by little, it is said to be as the voice of a camp and as the voice of the sublime God, which in Hebrew is called 'saddai', and according to the Seventy 'voice of the word', so that we may believe that all that is preached in the world is the voice of the Son of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
