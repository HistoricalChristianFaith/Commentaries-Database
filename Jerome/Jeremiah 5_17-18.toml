[[commentary]]
quote='''
And at the same time he describes the devastation of the land of Judea and the slaughter of many, the driving off of cattle, the overthrow of cities and of walls: that all things are taken by the hostile sword, and that yet amid such great evils he does not destroy them to extermination, but keeps a remnant safe, either of those who were led into Babylon and released for the cultivation of the fields of the land of Judea, or of those who, after the heat of persecution, kept the faith of the Lord either by flight or by confession.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
