[[commentary]]
quote='''
Plainly the second coming of the Savior is foretold, of which John too speaks in his Apocalypse: Behold, he shall come with the clouds, and every eye shall see him, and those who pierced him. And the Lord declares in the Gospel that the Son of man will come on the clouds of heaven with power and great glory. He will come with the clouds, that is, with the angels, who are ministering spirits and are sent to various offices, and with the prophets and apostles, of whom it is written: Your truth reaches to the clouds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
