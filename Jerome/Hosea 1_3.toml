[[commentary]]
quote='''
Gomer is interpreted τετελεσμένην, that is, consummated and perfected; others think that θώρακας, that is, breastplates, is signified. There are some who suppose it means measure, or bitterness, which they would say rightly if it did not have the letter gimel. Diblaim means παλάτας (cakes of pressed figs), of which there is a very great abundance in Palestine, and which the prophet Isaiah is commanded to apply to the ulcer of king Hezekiah. It is a mass of rich dried figs, which they shape after the manner of bricks, tread and press together, so that they may remain long unspoiled.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
