[[commentary]]
quote='''
But since according to tropology we had said that husbands are souls and wives bodies, let the soul so love the flesh, as Christ loved the Church, so as to give itself up for its salvation, and to sanctify it by the word of doctrine, so as to present it to itself not having spot or any wrinkle of oldness: especially since it knows that it is to be saved in the resurrection and to see the salvation of God. Such a husband has Christ as his head: and when, humbling himself for the salvation of the flesh, he has become one flesh with his wife, he draws her back to the spirit, and, joined to the Lord, ceases to be flesh.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
