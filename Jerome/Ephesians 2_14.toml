[[commentary]]
quote='''
And it must be observed more carefully that without the blood of the Lord Jesus no one draws near to God, because he is our peace, saying: My peace I give to you: my peace I leave to you (John 14:27). For just as wisdom makes men wise, and righteousness righteous, and sanctification holy, and life living, so he too, who is peace, makes us peaceable, so that we may say: With those who hated peace I was peaceable (Ps. 119:7). But if Christ is the peace of believers, whoever is without peace consequently does not have Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
Who made both one, and, breaking down the middle wall of the partition, the enmity in his flesh, making void the law of commandments in decrees: that he might create the two in himself into one new man, making peace, that he might reconcile both in one body to God through the cross, slaying the enmity in it; and coming, he preached peace to you who were far off, and peace to those who were near; for through him we both have access in one spirit to the Father.

This is the middle wall and partition which divided each people from the other. Of it the midwife also speaks in Genesis at the birth of the twins: Why has the hedge been broken through on your account? (Gen. 38:29).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
