
[[commentary]]
quote='''
In the first chariot were red horses, bloody and bloodthirsty, and terrible with the cruelty of Babylon. In the second chariot, black horses, the kingdom of the Medes and Persians, which, seated in a two-horse chariot and going out through the edict of King Ahasuerus, bore before it, with sad tidings, the death of all the Jews. In the third chariot, white horses, the Macedonians, under whose king Antiochus we read of the victory of the Maccabees. In the fourth chariot, spotted, strong horses. For we know that of the kings of the Romans some were merciful toward the Jewish nation, such as Gaius Caesar, Augustus and Claudius; others persecutors and terrible, such as Gaius Caligula, Nero, Vespasian and Hadrian. For strong, which Aquila translated κρατεροὺς (strong), the Seventy ψαροὺς (dappled), in the Hebrew is written amasim. And certain copies wrongly have πυῤῥοὺς, confusing the differences of the colors and of the kingdoms, since πυῤῥοὶ, that is, red, are called not amasim but adamim.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
