[[commentary]]
quote='''
This man spoke to the prophet, he in whose hand was the cord, and whose appearance was as of bronze, and who held the reed in his hand: the true architect spoke to Ezekiel — he whom the apostle Paul imitated, saying: As a wise architect I have laid the foundation; and he calls the architect wise to distinguish him from the one who is foolish and in Zechariah is called the foolish shepherd —; and he spoke the words that follow: Son of man, see with your eyes, and hear with your ears, not with the eyes of the flesh but of the spirit, nor with the ears of the body but of the soul —. Lift up, he says, your eyes and see, for the harvests are already white for reaping, and: He who has ears to hear, let him hear —; and the building of the city is seen, and the order of the ceremonies and of the priests and the description of the land are heard; nor was it enough to have commanded him to see with his eyes and hear with his ears, but he added: And set your heart upon all (or and set in your heart all) that I shall show you; for it profits nothing to have seen and to have heard, unless you have laid up in the treasury of memory the things you have seen and heard; and when he says: All that I shall show you, he makes him an attentive hearer, makes him ready too with the eyes of the heart, so that he may hold in memory the things that are to be shown to him: For you have been brought here that all things may be shown to you — by which saying he shows in a special way that nothing is sweeter than contemplation and knowledge, which the prophet desires, saying: One thing I have asked of the Lord, this will I seek: that I may dwell in the house of the Lord all the days of my life, that I may see the will of the Lord and visit his temple; whence he adds and says: Lord, I have loved the beauty of your house, and the place of the dwelling of your glory —. 'Declare', he says, 'all that you see to the house of Israel, so that those who cannot see by themselves may learn through you the things that are shown to you by the Lord'; and to the house of Israel: to those who behold God with the mind — among whom was Nathanael too, who sought Christ most zealously and was found worthy to hear: Behold a true Israelite, in whom there is no guile —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
