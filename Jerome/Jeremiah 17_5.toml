[[commentary]]
quote='''
Thus says the Lord: cursed is the man who trusts — or has hope — in man and makes flesh his arm, and whose heart departs from the Lord. For he will be like a tamarisk in the desert, and he will not see when good comes, but he will dwell in dryness in the desert, in a land of saltness and uninhabitable. If every man who trusts in man is cursed, and Paul of Samosata and Photinus, although they proclaim the Savior holy and exalted above all in virtues, nevertheless confess him to be a man, then they will be cursed, having hope in a man. But if it is objected to us that we too believe in him who says: but now you seek to kill me, a man who has spoken the truth to you, which I heard from God; this Abraham did not do. You do the works of your father, we shall answer with that saying of the Apostle: even if we once knew Christ according to the flesh, yet now we no longer know him. Then the same Apostle, at the beginning of his epistle, writes to the Galatians: Paul an apostle, not from men nor through man, but through Jesus Christ and God the Father, who raised him from the dead, and all the brethren who are with me. For if death has been swallowed up in victory, why should not the lowliness of the flesh, which was assumed for the sake of human salvation, have passed into the majesty of the divinity, so that he has made both one, and we do not adore a creature but the Creator, who is blessed forever? Cursed, therefore, is not only he who has hope in man, but he who makes flesh his arm, that is, his strength, and who thinks that whatever he has done belongs not to the mercy of the Lord but to his own power. For he who does this, his heart departs from the Lord, since he asserts that he can do what he cannot.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"


[[commentary]]
quote='''
"For vain is the salvation of man." "Cursed is the man who has his hope in man." There is no need to interpret this: this saying is plain to all. Someone hoped in an emperor, hoped in a prince, in a father, or a mother: in the course of some affair the spirit of the one in whom he hoped was suddenly taken away, and his salvation vanished. He did not say, "vain is the salvation of that man in whom he hopes," but "the salvation of him who hopes in man."
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_034.html'
source_title="Homily 34, on Psalm 107"
