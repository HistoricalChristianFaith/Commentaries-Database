[[commentary]]
quote='''
And writing to the Corinthians he says: Be imitators of me, as I also am of Christ (1 Cor. 11:1). For they could not at once become imitators of Christ; but it was a great thing for them if they could become imitators of an imitator. To the Ephesians, however, as to those whom he had already taught such great mysteries, he does not say, Be imitators of me, nor, imitators of Christ, but, imitators of God. Not that it is a lesser thing to be an imitator of Christ than of God (for Christ is indeed God), but that it is one thing to imitate according to man, another according to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
