[[commentary]]
quote='''
And likewise, because he had said above, kind and merciful, patient and great in mercy, and placable, or repenting over evils, lest perhaps the greatness of his clemency should make us careless, he adds in the person of the prophet and says: Who knows if he will turn and pardon, and leave behind him a blessing? I, he says, exhort to repentance, which is my part, and I know that God is ineffably merciful, as David says: Have mercy on me, O God, according to your great mercy, and according to the multitude of your compassions blot out my iniquity. But because we cannot know the depth of the riches and of the wisdom and knowledge of God, I temper my statement, and I wish rather than presume, saying: Who knows if he will turn and pardon? When he says who, it is to be understood as either impossible or difficult: Sacrifice and libation to the Lord our God; so that after he has given the blessing and has forgiven us our sins, we may be able to offer victims to God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
