[[commentary]]
quote='''
And David sings in the psalm: In the beginning, O Lord, you founded the earth, and the heavens are the works of your hands. They shall perish, but you remain; and they shall all grow old like a garment; and like a cloak you shall roll them up, and they shall be changed (Ps 101 [102]:26). From this it is shown that the perishing of the heavens signifies not destruction but a change for the better. Of these it is said: There shall be a new heaven and a new earth, which I will make to remain in my sight (Rev 21:2). For if it is written of the saints, We shall all indeed sleep, but we shall not all be changed (1 Cor 15:51), and in the titles of four psalms we read, For those who shall be changed: how much more is this to be believed of heaven and of the sun and the stars, when the moon shall receive the light of the sun, and the sun shall glow with sevenfold brightness? Hence the whole creation too groans and travails, awaiting the revelation of the sons of God, that it may be changed for the better (Rom 8). And not only the souls of men, which are immortal, but their bodies too are to be changed into a glorified substance. For this corruptible must put on incorruption, and this mortal put on immortality (1 Cor 15:53). And since heaven and earth grow old, it follows that the things contained within the circle of heaven, and men, who are the inhabitants of the earth, also die like these: not unto their destruction, but unto the abolishing of their old baseness and the renewal of the glory to come; when the righteous shall shine like the sun (Matt 13:43), and, the past and old things departing, all things shall have been made new.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
But those who consider newness to be a change for the better, and not the destruction of the elements, use this example: In the beginning, O Lord, you founded the earth, and the heavens are the works of your hands. They shall perish, but you remain, and they shall all grow old like a garment, and like a cloak you shall roll them up, and they shall be changed (Ps 101 [102]:26, 27). In this it is clearly shown that perdition and destruction mean not an abolition into nothing, but a change for the better.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
