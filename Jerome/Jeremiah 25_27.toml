[[commentary]]
quote='''
And when he says that he gave it to drink to the other nations and to Jerusalem and the cities of Judea, he adds: Thus says the Lord Almighty, the God of Israel: Drink and be drunk, and vomit, and fall before the face of the sword which I shall send among you (Jer 25:27). And it is to be noted that this cup of the Lord's fury is his sword, which is sent into the midst of sinners. Here a question arises: how, after the drinking, the drunkenness and vomiting and the fall, it is said in Jeremiah that Jerusalem cannot arise, and now he speaks to her through Isaiah: Lift yourself up, lift yourself up, arise, Jerusalem. It is resolved thus: as long as someone drinks the cup, and is drunk, and raves, and vomits, and falls, he cannot arise; for he has not yet drained the cup of the Lord, nor come to the dregs, so as to have drunk it to the bottom. But now he speaks to Jerusalem in the past tense: who have drunk from the hand of the Lord the cup of his fury, and not, who are drinking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
And you shall say to them: Thus says the Lord of hosts, the God of Israel: Drink and be drunk and vomit and fall and do not rise, before the sword which I will send upon you! 'After', he says, 'you have given drink to all the nations and fulfilled the command of the Lord, you will again command these things with the words of the Lord and say: Drink and be drunk and vomit and fall and do not rise!' If 'to drink, to be drunk, to vomit and to fall' is a sign of salvation, so that, like a cathartic potion, everything harmful is expelled, how does there follow: and do not rise? And what the drink is that makes them fall forever he sets down more plainly, that is: before the sword which I will send among you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
