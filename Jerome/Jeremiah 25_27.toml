[[commentary]]
quote='''
(Verse 27.) And you shall say to them, thus says the Lord of hosts, the God of Israel: Drink and be drunk, and vomit, and fall, and do not rise up (according to the Vulgate, do not rise up) before the sword that I am sending among you. Once you have made all the nations drink, and filled them with the command of the Lord, you shall again give this command in the words of the Lord, and you shall say: Drink and be drunk, and vomit, and fall, and do not rise up. If to drink and become drunk, to vomit, and to fall are signs of health, so that all noxious things are expelled like a cathartic potion: how then does it follow, 'do not rise'? Moreover, what is the potion that causes them to fall forever, he explains more clearly, that is, the face of the sword which I will send among you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
And when he says that he gave it to drink to the other nations and to Jerusalem and the cities of Judea, he adds: Thus says the Lord Almighty, the God of Israel: Drink and be drunk, and vomit, and fall before the face of the sword which I shall send among you (Jer 25:27). And it is to be noted that this cup of the Lord's fury is his sword, which is sent into the midst of sinners. Here a question arises: how, after the drinking, the drunkenness and vomiting and the fall, it is said in Jeremiah that Jerusalem cannot arise, and now he speaks to her through Isaiah: Lift yourself up, lift yourself up, arise, Jerusalem. It is resolved thus: as long as someone drinks the cup, and is drunk, and raves, and vomits, and falls, he cannot arise; for he has not yet drained the cup of the Lord, nor come to the dregs, so as to have drunk it to the bottom. But now he speaks to Jerusalem in the past tense: who have drunk from the hand of the Lord the cup of his fury, and not, who are drinking.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
