[[commentary]]
quote='''
But when they are in Chaldea without a temple and without an altar, they will not pour out wine to the Lord, but to demons; and they will not please him, those who pour out to foreign gods, and who are held in captivity and among the Assyrians eat things sacrificed to idols, and are like the bread of mourners. For it is not lawful to eat of the sacrifices of mourners, and if anyone eats, what was offered becomes unclean. The Greeks call the suppers of mourners περίδειπνα; we can call them parentalia, from the fact that they are offered for dead parents. And not only he who has offered, but also he who has eaten of food of this kind will be unclean; for their bread, that is, the food which they offer, will not enter into the house of the Lord, which has been destroyed, which has been burned with Babylonian fire; but it will be for their own soul. And the sense is: they provide for their own gullet and their own pleasure; but polluted things do not please me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
