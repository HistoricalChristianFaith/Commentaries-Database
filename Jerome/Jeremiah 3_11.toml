[[commentary]]
quote='''
And the Lord said to me: Averse Israel has justified her soul in comparison with the transgressor Judah. 'More righteous,' he says, 'is Israel in comparison with Judah, because the former perished at once, at the beginning, while the latter could have been corrected by the torments of the former'. Let the new heresy sprung from the old take note that Israel is said to be justified in comparison with a worse one. Nor is this surprising of sisters of one nation, since Sodom too, in comparison with Jerusalem, receives the name of righteousness, as the Lord says through Ezekiel: 'Sodom has been justified by you', and the publican becomes righteous in comparison with the Pharisee.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
