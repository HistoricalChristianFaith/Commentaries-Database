[[commentary]]
quote='''
Thus says the Lord to this people: because it has loved — or they have loved — to move its feet and has not rested — or they have not spared — and it has not pleased the Lord — or and God was not well pleased in them —, now he will remember their iniquities and will visit their sins. When the people says: 'Why have you become like a stranger and a traveler and a wanderer, so as to forsake your dwelling?', the Lord answers the people that was once his own: 'Do you wish to know the reason? Listen to what is said: because the people has loved to move its feet and has not withdrawn them from the fetter of sins, or has not rested and could not stand, therefore I too have forsaken it, and I have no good pleasure in it'. He, then, who long delayed and through patience was unwilling to punish sinners, since they persisted in wickedness, will remember their iniquities and will visit the sins of those who are, as it were, sick and do not perceive God, so that they may cease to sin any more. But it should be noted in the holy Scriptures that it is always the feet of sinners that are moved, while to the saints it is said, with Moses: But you, stand here with me, and elsewhere it is written: Praise the Lord, you servants, who stand in the house of the Lord, in the courts of the house of our God!
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
