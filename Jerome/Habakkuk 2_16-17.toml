[[commentary]]
quote='''
Moreover, because you offered drink to your neighbor with a turbid overturning, shame will be gathered upon you, and upon your glory, which you at first believed you had; and this you will suffer because the impiety of Lebanon will cover you, according to what is said: And let his prayer become sin. For Lebanon, in the Greek language, is ὀμώνυμος (of the same name) with frankincense; and frankincense is a σύμβολον (a symbol) of the spiritual incense, which is the worship of God. Therefore the perverse prayer of the heretics, not directed by the simplicity of the Gospel, will be turned for them into sin, and the impiety of their worship of God will cover them. Hence there follows: And the misery of the beasts will terrify you because of the blood of men, and the impieties of the land, and of the city and of all who dwell in it. And the sense is: When you see those whom you deceived by your frauds, and from sheep of Christ made into your beasts, in misery and enduring punishments for their error, then you will be terrified, then you will lie prostrate. And lest you think, because I have named Lebanon and its beasts, that I am speaking of brute animals and not of men, I tell you more plainly: You will endure these things because you shed the blood of many men, whom you caused to perish to God. And you exercised impiety in the land of the living, in the land of the meek, and your impiety raged also in the city of the Lord, that is, in his Church, and you made many who dwelt in it partakers of your impiety. Let this be said in the person of the heretics.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
