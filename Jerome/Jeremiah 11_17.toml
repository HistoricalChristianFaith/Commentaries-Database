[[commentary]]
quote='''
And the Lord of hosts, who planted you, has spoken evil against you for the evils of the house of Israel and of the house of Judah, which they did to themselves to provoke me, pouring libations to the Baals. 'A rich olive,' he says, 'beautiful, fruitful, your Lord called you, and he planted you; but because at the sound of the great speech of God a flame came down upon you and consumed all your branches, therefore he who had planted you has now spoken evil against you, not out of the injustice of his sentence nor out of a sudden perversity of speech, but for the evils which the house of Israel and the house of Judah did to themselves and zealously carried out, pouring libations to the Baals, so as to provoke me to anger'. And although God can do what he wills, he gives his reasons, lest he should seem to act unjustly, according to that which is written: that you may be justified in your words and may overcome when you are judged.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
