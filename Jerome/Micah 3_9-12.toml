[[commentary]]
quote='''
Hear these things, O princes of the house of Jacob, and judges of the house of Israel, you who abhor judgment and pervert all that is right, who build Zion with bloodshed, and Jerusalem with iniquity. Her princes judged for gifts, and her priests taught for hire, and her prophets divined for money; and they leaned upon the Lord, saying: Is not the Lord in our midst? No evils will come upon us. Therefore, because of you, Zion will be plowed like a field, and Jerusalem will be like a heap of stones, and the mountain of the temple like the high places of the forests. LXX: Hear these things, O judges of the house of Jacob and the rest of the house of Israel, you who abhor judgment and pervert all that is right; who build Zion with bloodshed, and Jerusalem with iniquities. Her leaders judged for gifts, and her priests gave answers for hire, and her prophets divined for money; and they leaned upon the Lord, saying: Is not the Lord among us? No evils will come upon us. Therefore, on account of you, Zion will be plowed like a field, and Jerusalem will be like a watch-hut for fruit, and the mountain of the Lord like a grove of the forest. No one doubts that Jerusalem was overthrown on account of the crimes which are described in this section; and since earlier the threat had gone before against either the judges or the false prophets: Hear, O princes of the house of Jacob, and leaders of the house of Israel. And after a few little verses: Thus says the Lord concerning the prophets who lead my people astray, and the rest; now the prophetic word is woven generally, both against the judges and against the false prophets, and against the priests, and against those who promised themselves the knowledge of God, and it rebukes them because on account of their crimes Zion is to be plowed like a field, and Jerusalem is to collapse like a heap of stones, and the mountain of the temple is to become like the high places of the forests. We see fulfilled the things that were said; the eyes prove the utterance of the mouth; the sight is the witness of the prophecy. This very testimony is written also in the scroll of Jeremiah, where mention is made of the prophet Micah, and the devastation of Jerusalem is foretold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
