[[commentary]]
quote='''
And they shall be buried — or they shall bury — in Topheth, because there is no other place for burying. So will I do to this place, says the Lord, and to its inhabitants, that I will make this city like Topheth — or like ruin —. And the houses of Jerusalem and the houses of the kings of Judah shall be like the place Topheth or of ruin. But what is added in the Seventy: all the houses of the kings of Judah like the place Topheth, is not found in the Hebrew. And there follows:

Unclean are all the houses on whose housetops — or roofs — they have sacrificed to all the host of heaven and have poured out libations to strange gods. What he had said above: this place shall no longer be called Topheth and the valley of the son of Hinnom, but the valley of slaughter, he now sets out more plainly: that so great a slaughter will take place in that very place that the people will be buried there in heaps and the place once of religion will become a tomb of the dead; that the city itself too, which overhangs this place, will become like Topheth — for which the Seventy translated 'ruin' —; and that the houses of Jerusalem also and the palaces of the kings will be turned into similar ruins. And the reason is given: because they were unclean and polluted by the crime of idolatry, in that on their housetops and roofs they sacrificed to the sun and the moon and the stars of heaven and burned incense, and were not content with this error, but sacrificed to demons and poured out libations to strange gods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
