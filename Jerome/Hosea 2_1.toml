[[commentary]]
quote='''
Say to your brothers: My People, and to your sister: Obtained Mercy. LXX: Say to your brother: My People, and to your sister: Obtained Mercy. Since great is the day of Jezreel, in which Judah and Israel had one prince, and it will by no means be said to Israel: Not My People; but on the contrary they will be called sons of the living God. Therefore, O men of the tribe of Judah, do not despair of the salvation of the ten tribes, but daily, by word and by prayer and by letters, call them to repentance, because he is called your brother and your sister: brother from the fact that he is called My People; sister from the fact that he is named Obtained Mercy. Otherwise: you who believe in Christ, and are as much from the Jews as from the Gentiles, say to the broken branches, and to the former people which was cast off: My People, because he is your brother; and Obtained Mercy, because she is your sister. For when the fullness of the Gentiles has come in, then all Israel will be saved. This same thing is commanded us, that we should not utterly despair of the heretics, but call them to repentance, and desire their salvation with the affection of kinship.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
