[[commentary]]
quote='''
How do you say: We are wise, and the law of the Lord is with us? Truly the lying pen of the scribes has wrought falsehood. He speaks to the scribes and Pharisees, who boast of their knowledge of the law and, writing, write iniquity. And as for what he says:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
