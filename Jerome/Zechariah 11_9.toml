[[commentary]]
quote='''
Wherefore in indignation I said to Moses: I will not feed you; let me alone and I will destroy them. But when, in anger, he says, let me alone, he invites entreaty, and shows that he can be held back by him. What dies, he says, let it die, and what is cut off, let it be cut off; let the bodies of all fall in the wilderness, and, turned to sedition, let them be torn by one another's bites like beasts, and let none enter the land of promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
