[[commentary]]
quote='''
You who set signs and portents in the land of Egypt even to this day, and in Israel and among men — or the earthborn — and made for yourself a name as this day. And you brought your people Israel out of the land of Egypt with signs and with portents and with a strong hand and with an outstretched arm and with great terror. And you gave them this land, which you swore to their fathers that you would give them, a land flowing with milk and honey. And they entered and possessed it; and they did not obey your voice and did not walk in your law. All that you commanded them to do they did not do; and all these evils befell them. From the general he passes to the particular and runs through in brief speech what he had bestowed specially on Israel. You who set, he says, signs and portents in the land of Egypt, by which Egypt was afflicted, even to this day, and in Israel and among men or the earthborn. This which is said, 'even to this day', must be joined to what follows, so that we read: 'both in Israel and among all mortals your signs are accomplished daily'; or otherwise: 'you performed signs and portents not only in Egypt, but even to this day the same strength of your mercy has saved your people, and you succor the whole human race with the power of the Creator'. And this is to be noted, that he separates 'Israel' from 'men' and 'the earthborn', according to that saying: Israel is my firstborn son. And made for yourself a name as this day: 'your praises', he says, 'are celebrated in the speech of the whole world.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
