[[commentary]]
quote='''
And he makes an apostrophe to Jerusalem herself: that this is her lot and this the portion which she herself has chosen, a measure heaped up and full and running over, or the portion of her disobedience, by which she would not acquiesce to the Lord; for with what measure she has measured, it will be measured back to her.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
