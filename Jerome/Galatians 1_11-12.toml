[[commentary]]
quote='''
For I make known to you, brothers, the Gospel which was preached by me: that it is not according to man; for neither did I receive it from man, nor did I learn it, but through the revelation of Jesus Christ.

By this passage the doctrine of Ebion and Photinus is crushed, in that Christ is God, and not only a man. For if the Gospel of Paul is not according to man, and he neither received it from man nor learned it, but through the revelation of Jesus Christ, then Jesus Christ, who revealed the Gospel to Paul, is certainly not a man. And if he is not a man, it follows that he is God. Not that we deny that a man was assumed, but that we reject that he is only a man. It is asked whether the Churches of the whole world have received the Gospel of God, or that of man: for how few of us have learned through the revelation of Christ, and have not come to know it through a man preaching? To this we shall answer that those who can say: "Do you seek a proof of him who speaks in me, Christ" (2 Cor. 13:3)? and: "But I live, now not I, but Christ lives in me" (Gal. 2:20), are not so much themselves the ones teaching as God in them, who says to the saints: "I have said, You are gods, and all of you sons of the Most High" (Ps. 81:6); and at once, of sinners: "But you shall die like men, and shall fall like one of the princes". Since, then, Paul speaks, and Peter, who do not die like men nor fall like one of the princes, it is manifest that they are gods. And those who are gods hand on the Gospel of God, and not of man. Marcion and Basilides and the other plagues of the heretics do not have the Gospel of God, because they do not have the Holy Spirit, without whom the Gospel that is taught becomes human. Nor let us think that the Gospel lies in the words of the Scriptures, but in the sense; not on the surface, but in the marrow; not in the leaves of the words, but in the root of the meaning. It is said in the prophet concerning God: "His words are good with him" (Mic. 2:7). Scripture is profitable to those who hear it only when it is not spoken without Christ, when it is not brought forward without the Father, when he who preaches does not instill it without the Spirit. Otherwise both the devil, who speaks from the Scriptures, and all the heresies, according to Ezekiel (ch. 13), sew for themselves from them pillows to place under the elbow of every age. I too, who am speaking, if I have Christ in me, do not have the Gospel of man; but if I am a sinner, it is said to me: "To the sinner God said: Why do you declare my righteous deeds, and take my Testament upon your lips? But you have hated discipline, and have cast my words behind you" (Ps. 49:16, 17), and the rest that follows. It is a great danger to speak in the Church, lest by a perverse interpretation the Gospel of Christ should become the gospel of man, or, what is worse, of the devil.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
