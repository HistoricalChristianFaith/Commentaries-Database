[[commentary]]
quote='''
This is that wine with which, when youths and maidens are intoxicated, they at once thirst for virginity. They are filled with the spirit of chastity, and the prophecy of Zechariah comes to pass, at least if we follow the Hebrew literally, for he prophesied concerning virgins: "And the streets of the city shall be full of boys and girls playing in the streets thereof. For what is his goodness, and what is his beauty, but the corn of the elect, and wine that gives birth to virgins?" They are virgins of whom it is written in the forty-fifth psalm: "She is led to the king, with her virgin companions, her escort, in her train. With joy and gladness they are led along as they enter the palace of the king."
'''
source_url='https://www.newadvent.org/fathers/30091.htm'
source_title="Against Jovinianus 1.30"

[[commentary]]
quote='''
Old men and old women of this sort shall sit in the streets of Jerusalem, and shall hold staffs in their hands, and the streets of the city shall be filled with boys and girls playing. These are the boys and girls, the old men and the young, whom the psalmist exhorts to sing to the Lord, saying: Young men and maidens, old men with the younger, let them praise the name of the Lord. And John, the evangelist and apostle: I write, he says, to you, children, because your sins are forgiven you for the name of the Savior. I write to you, fathers, because you have known him who is from the beginning. And of these Solomon speaks in Proverbs: To give shrewdness to the innocent; and to the younger boy sense and understanding. And again: Hear, children, the instruction of a father, and attend, that you may know understanding. Of these boys, little maidens and girls, Psalm 44 (45) also speaks: There shall be brought, he says, to the king virgins after her, according to what is written: The daughters of Judah exulted and rejoiced in all your judgments, O Lord. And when they hear from the Apostle: Rejoice, again I say rejoice, they will show the gladness of the mind by the gesture of the body, and, leaping in the dance, they will say with David: I will dance and play in the sight of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
