[[commentary]]
quote='''
But that the valley of Achor, in which Achan was killed for the theft of the things that had been consecrated to God, is interpreted 'confusion' and 'tumult', and not, as some think, διαστροφὴ, that is, perversity, Joshua himself interprets when he speaks to Achan: Because you have troubled us, may the Lord trouble you on this day. Hence that place was called Emec Achor, that is, the valley of confusion.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
