[[commentary]]
quote='''
And lest we be thought to be setting down our own sense, Scripture itself lays itself open. As these figs, it says, are good, so will I know the exile of Judah, which I have sent out from this place into the land of the Chaldeans, for good, signifying Jeconiah and the princes who were captured with him. And on the contrary, of the basket that had bad figs: And as the very bad figs, he says, which cannot be eaten because they are bad, so will I give Zedekiah, king of Judah, and his princes and those who fled over into Egypt and who remained in this city, to vexation and affliction to all the kingdoms of the earth, when they were captured in Egypt too, and Nebuchadnezzar set his throne in Tahpanhes, and the Lord sent upon them the sword, famine and pestilence, until they were consumed from the land which he gave to their fathers. But what he said of the good figs: I will give them a heart, that they may know me, that I am the Lord, is like the apostolic saying: It is God who works in you both to will and to accomplish, in that not only our works but our will too rests on the help of God. In this place the ever-allegorical interpreter raves, and, wishing to do violence to the truth of the history, relates that some were captured from the heavenly Jerusalem and carried over into the land of the Chaldeans and will return again to their former place, such as Jeremiah and the other holy prophets, while others, who were sinners, will die in this land and in the valley of tears. I have set out the whole perikopēn [passage] of this vision together, so as not to divide the sense in the exposition.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
