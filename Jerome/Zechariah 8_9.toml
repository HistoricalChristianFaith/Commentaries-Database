[[commentary]]
quote='''
Thus says the Lord of hosts: Let your hands be strengthened, you who hear in these days these words through the mouth of the prophets, on the day on which the house of the Lord of hosts was founded, that the temple might be built. The Seventy translated "the Lord Almighty" for "the Lord of hosts", the rest likewise. The temple having been built under Zerubbabel and Joshua (for it was in the fourth year of King Darius, on the fourth day of the ninth month, which is called Chislev), all these things are said when the temple had already been raised; the same prophets, Haggai and Zechariah, who had exhorted both the leaders and the people that it might be built, now exhort them, so that from the truth of the earlier things they may lend faith to those which are promised for the future; and that they may strengthen their hands, in no way fearing the onset of the Medes and the plots of the surrounding nations who desire to hinder them; and that they may be strengthened through the mouth of the prophets, from the day on which the foundations of the temple were laid until the day on which the temple was built up on them, and may hear what follows. We explain the history briefly, referring spiritually to the Church whatever is said of Jerusalem and of the temple: in the Church hands are strengthened through good works, and houses are founded when the foundations of faith are laid, and the temple is raised when the multitude of believers is made firm, and lives in such a way that it deserves to be the temple of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
