[[commentary]]
quote='''
And in another place it is said: How great is the multitude of your sweetness, O Lord, which you have hidden for those who fear you! Therefore the great mercy of God is hidden from those who are still set in fear and do not have the perfect love of God, so that, while they hear of the day of the Lord as cruel and incurable and full of indignation and fury, they may cease to sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
