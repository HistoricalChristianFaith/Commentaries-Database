[[commentary]]
quote='''
'But they, on the contrary,' he says, 'said: We will be strong' — in their evil works, that is, or, according to Aquila, we have despaired, and according to Symmachus, we have failed, both of which offend God, that one should either think that he can by no means be saved, or should have failed in spirit for appeasing God — 'and after our own thoughts,' he says, 'we will walk.' Where, then, is the power of free will and the judgment of one's own will apart from the grace of God, when it is a grave offense against God to follow one's own thoughts and to do the will of a depraved heart?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
