[[commentary]]
quote='''
And the king of Bale, this is Segor. All these came together at the salt valley, that is, the sea of salt. Bale in the Hebrew language is called κατάποσις, that is, a swallowing up. The Hebrews therefore relate that this same city is named Salissa in another place of the Scriptures, and again is called μοσχάδα τρισσεύουσαν, that is, a three-year-old heifer, because, of course, it was swallowed up by a third earthquake; and that from the time when Sodom and Gomorrah, Adama and Seboim were overthrown by the divine fire, it has been called the little one: since Segor means little, which in the Syrian language is called Zoara.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"
