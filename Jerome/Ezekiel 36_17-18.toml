[[commentary]]
quote='''
Whoever is of the house of Israel and sees the peace of Christ, which surpasses all understanding, dwells in his own land, the Church, or in the lodging of the flesh which has been handed over to him by God; but if he defiles either land in his most evil ways and is compared to the uncleanness of a menstruous woman, God pours out his indignation upon him, for the blood, whether his own or that of those whom he has scandalized and has shed upon the land, and for the perverse thoughts with which he defiled it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
