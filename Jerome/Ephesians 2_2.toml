[[commentary]]
quote='''
We also ask what is meant by in which you once walked according to the age of this world: whether there is also another age, which does not belong to this world but to other worlds, of which Clement too writes in his Epistle: "Ocean, and the worlds which are beyond it"? Or whether this is the one world, which rolls on from the beginning of the age in which Adam was made until its end, and passes away; or whether, surely, the prince of this air, who now works in the sons of unbelief, is called by the other name "world"? It is also written to the Galatians: That he might deliver us from the present evil age (Gal. 1:4). And in this same Epistle: Redeeming the time, because the days are evil (below, 5:16). And the days of Jacob are called few and evil (Gen. 47), whether because the time of this life, through which we are held shut in the age, is heavy and laborious, or because Satan himself, as we said above, is called by the name of this world and of the age. Of whom he says immediately in what follows: According to the prince, he says, of the power of the air, the spirit that now works in the sons of unbelief. For by the prince of the air, and the spirit of the power which is in this air, the devil is understood, who now works in the sons of unbelief. For in those who believe the Lord he cannot work. Of him he also says below: We do not wrestle against flesh and blood, but against principalities and powers, against the rulers of this darkness, against the spiritual forces of wickedness in the heavenly places. Not that the devil and his attendants, who, wandering through this world, insinuate sins into men, are able to dwell in heaven, from which they fell for their deserts; but this air which is above us is called heaven, according to the Savior's saying: Consider the birds of heaven (Matt. 6:26), and the rest. For it is plain that birds do not fly through heaven, but through the air.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
