[[commentary]]
quote='''
But you, laid waste, what will you do? For 'laid waste', which in Hebrew is said 'sadud', which Aquila alone translated so, the others translated 'wretched' and 'pitiable', through her own fault, because she has offended the merciful God. Accordingly it follows:

When you clothe yourself in scarlet and are adorned with a golden necklace and paint your eyes with antimony, in vain will you adorn yourself; your lovers have despised you, they will seek your soul. He speaks under the figure of an adulterous woman: 'once you have offended God and, as it were, left your husband, the Creator, in vain do you seek out ornaments; the demons, your lovers, have despised you, and they will seek not at all the uncleanness of debauchery, but the destruction of your soul'. This same thing is to be understood spiritually against those who have lost conjugal affection and the chastity of the true faith. 'If,' he says, 'you clothe yourself in scarlet — take up faith in the blood of Christ —, if you adorn yourself with a golden necklace — have meditation of the sense and of spiritual understanding — and paint your eyes with antimony — have zeal for the mysteries and for knowing the secrets of God —, in vain will you adorn yourself. For these things you had prepared for your lovers too, and therefore the narrow bed cannot hold both, nor does God accept the ornaments with which you formerly pleased your lovers'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
