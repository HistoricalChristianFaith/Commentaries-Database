[[commentary]]
quote='''
Though he returned the price to the priests of the Jews, yet they condemn him, since they refuse to receive the price of blood. See the disagreement of the Pharisees and the misfortune of Judas. If you bought the blood of Jesus rightly, why did you not take back your money? But if you refuse to take it because it is the price of blood, you show that you yourselves have shed the blood unjustly and wickedly. But see what they do. That very money, he says, they do not put into the corban, but they buy a field with it, and they call it Aceldama, which is interpreted "the price of blood." Why do they buy it? For the burial of strangers. Blessed are we, for whom a field is bought from the price of the Lord's blood.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_035.html'
source_title="Homily 35, on Psalm 108"
