[[commentary]]
quote='''
And the word of the Lord came to me, saying: Before I formed you in the womb, I knew you; and before you came forth from the womb, I sanctified you, I gave you as a prophet to the nations. Not that Jeremiah existed before his conception, as heresy surmises, but that the Lord foreknew that he would be, the Lord to whom things not yet made are already made, according to that which the Apostle says: who called the things which were not as if they were. And that he is sanctified in the womb we must take according to that saying of the Apostle: but when it pleased him, who set me apart from my mother's womb and called me through his grace, to reveal his Son in me, that I might preach him among the nations. John the Baptist too is sanctified in the womb, and receives the Holy Spirit, and is moved in the womb, and speaks through his mother's mouth. And as for his saying: I gave you as a prophet to the nations, he wishes this to be understood, which we shall read later in the prophet himself, that he prophesied not only to Jerusalem but also to many nations round about. Some understand this place of the Savior, who was properly the prophet of the nations and through the apostles called all the nations. For he truly, before he was formed in the virginal womb and before he came forth from his mother's womb, was sanctified in the womb and known to the Father, inasmuch as he is always in the Father, and the Father always in him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
