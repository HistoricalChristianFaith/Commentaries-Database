[[commentary]]
quote='''
Even as he chose us in him before the foundation of the world, that we might be holy and spotless before him.

For "foundation of the world" (constitutio mundi) the Greek has written πρὸ καταβολῆς κόσμου; but καταβολὴ does not mean the same thing that constitutio means. Hence we too, because of the poverty of our language and the novelty of the subject, and because, as someone says, the Greeks have both a broader speech and a happier tongue, shall try not so much to translate word for word, which is impossible, as to unfold the force of the word by a kind of circumlocution. Καταβολὴ is properly said when something is thrown down and sent from on high into a lower place, or when some thing takes its beginning. Hence those too who lay the first foundations of buildings that are to be are said καταβεβληκέναι, that is, to have thrown down the beginnings of the foundations. So Paul, wishing to show that God contrived all things out of nothing, referred to him not a founding, not a creation and a making, but καταβολὴν, that is, the beginning of a foundation: so that it is not, as Manichaeus and the other heresies hold (which posit a maker and matter), that something out of which the creatures were made preceded the creatures, but all things came to subsist out of nothing. And that he testified that we were chosen before the fabric of the world, that we might be holy and spotless before him, that is, before God, belongs to the foreknowledge of God, to whom all future things are already done, and all things are known before they come to be. Just as Paul himself, too, is predestined in his mother's womb, and Jeremiah is sanctified in the womb (Jer. 1), is chosen, strengthened, and sent as a prophet to the nations in the type of Christ. But another, who tries to show that God is just, in that he chooses each one not from the prejudgment of his own knowledge but from the merit of the chosen, says that before the visible creatures, heaven, earth, the seas and all things that are within them, there were other, invisible creatures, among them also souls, which for certain causes known to God alone were cast down into this valley of tears, into the place of our affliction and pilgrimage; set in this place, the saint prayed that he might return to his former seat, saying: Woe is me, that my sojourning has been prolonged! I have dwelt with the inhabitants of Kedar; my soul has long been a pilgrim (Ps. 119:5). And in another place: Wretched man that I am: who will free me from the body of this death? And: It is better to return and to be with Christ. And elsewhere: Before I was humbled, I sinned (Ps. 118:67), and other things like these. So, they say, before the souls were cast headlong into the world, and the world came to be out of souls together with its inhabitants, itself cast down to the lowest place, God chose Paul and those like him, who were holy and spotless, before himself. But no one is chosen except out of many; and where there are some of lesser worth, there a choice is made. And just as in the Babylonian captivity, when the people was carried off by Nebuchadnezzar into Chaldea, the prophets Ezekiel, Daniel, the three youths, Haggai and Zechariah were sent, not that they too had deserved captivity, but to be a solace to the captives; so too, in that casting down of the world, those who had been chosen by God before the world came to be were sent for the instruction and teaching of sinful souls, so that at their preaching these might return to the place from which they had fallen; and this, they say, is what is said by Moses in the eighty-ninth psalm: Lord, you have become our refuge in generation and generation: before the mountains were made firm, and the earth and the world came to be (Ps. 89:1). That is, before the world came to be and the whole of generation took its beginning, God was a refuge for his saints. But as for his saying that we might be holy and spotless before him, between holy and spotless there is this difference: one who is holy can also be understood to be spotless, but one who is spotless is not at once holy as well. For little children are spotless, because with their body intact they have committed no sin; and yet they are not holy, because holiness is acquired by will and effort. Also, he can be called spotless who has not committed sins, but holy he who is full of virtues, according to what is written in a certain psalm: He who walks without spot and works righteousness (Ps. 14:2). And in the Song of Songs: You are all beautiful, my neighbor, and there is no spot in you (Song 4:7). The question is how anyone can be holy and spotless before God, when the prophet testifies, saying: Every one living shall not be justified in your sight. For either the Ephesians are holy and spotless before God, and what is said is false: Every one living shall not be justified in your sight. Or, if no one is justified in the sight of God, what went before is false, that they are holy and spotless in the sight of God. To this a twofold answer must be given. For Paul does not say: He chose us before the foundation of the world when we were holy and spotless; but: he chose us that we might be holy and spotless, that is, that we who were not holy and spotless before might be so afterwards. This can also be said of sinners converted to better things, and that sentence will stand: Every one living shall not be justified in your sight, that is, in his whole life, in all the time that he has lived in this world. Understood this way, it also tells against him who says that the souls were chosen before the world came to be because of their holiness and their having no fault of sins. For, as we have already said above, Paul and those who are like him are not chosen because they were holy and spotless; but they are chosen and predestined so that in their subsequent life, through works and virtues, they may become holy and spotless. Then it must also be understood in this way: that he did not say: Any one living shall not be justified in your sight; but every one living, that is, not all will be justified, but some will be justified.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
