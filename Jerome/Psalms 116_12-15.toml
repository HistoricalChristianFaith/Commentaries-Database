[[commentary]]
quote='''
For the sin of the soul blood alone is worthily offered, and the blood that is worthily offered is not that of calves, not of rams, not of he-goats, but one's own, as the prophet says and asks: What shall I render to the Lord for all that he has rendered to me? And afterwards answers: I will take the cup of salvation, and I will call upon the name of the Lord. Precious in the sight of the Lord is the death of his saints. Yet even this very blood we do not give, but give back. And what is there alike? When the Just One has died for sinners, the Son of God for men, shall we, sinners and men, die for the confession of his name?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
