[[commentary]]
quote='''
But to the house of Judah he promises mercy, and says that he saves them in the Lord their God, either in himself who speaks; or the Father saves in the Son, according to what is written: The Lord rained from the Lord. For when Israel was handed over to the Assyrians, he saved them from the hand of Sennacherib, not by bow and sword and war and by a multitude of horsemen, but by his own strength, when he sent an angel and struck down from the army of Sennacherib king of the Assyrians in one night one hundred and eighty-five thousand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
