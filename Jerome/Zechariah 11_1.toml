[[commentary]]
quote='''
Open your gates, O Lebanon, and let fire devour your cedars. Howl, O fir tree, for the cedar has fallen, because the magnificent have been laid waste. Howl, O oaks of Bashan, because the fortified forest has been cut down. LXX: Open your gates, O Lebanon, and let fire devour your cedars. Let the pine howl, for the cedar has fallen, for the nobles have been crushed. Howl, O oaks of Bashanitis, because the wooded forest has been brought down. Plainly Lebanon, to which the prophetic word turns, saying: Open your gates, O Lebanon, is understood as the temple of the Jews, which, restored, or rather built, by Zerubbabel, is sung as destined to be overthrown again by Vespasian and Titus. And because he had called the temple Lebanon μεταφορικῶς (metaphorically), he keeps the figure in the rest as well, so that by the cedars and fir trees and oaks of Bashan and the wooded forest he signifies the princes and priests and people of the Jews. And Lebanon opens its gates so that the Roman army may enter, and fire devours its cedars, so that either all things are laid waste by burning, or the leaders and princes are consumed by the onslaught of the enemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
