[[commentary]]
quote='''
Shall I not in that day, says the Lord, destroy the wise from Idumea, and prudence from Mount Esau? And your mighty ones shall fear from the South, so that the man may perish from Mount Esau. LXX: In that day, says the Lord, I will destroy the wise from Idumea, and understanding from Mount Esau. And your fighters from Theman shall tremble, so that man may be taken away from Mount Esau. When the enemy has possessed your borders, and all the men of your covenant have mocked you and prevailed against you, then wisdom will perish from Idumea, and its cunning will be shown to be folly. The Lord himself will also take away prudence from Mount Esau, that is, from the mountains of Seir, either because the city of Idumea is situated on a mountain, or because that whole region which slopes toward the south and borders on the desert is raised high with steep mountains. Hence it is also said: Your fighters from Theman shall tremble, which we have translated "south". Now, just as I had said above that Esau was called by three names, so also the tract of his kingdom which slopes toward the south is called by three terms: Darom, Themam, Nageb, all of which, according to Ezekiel, signify the south, the southwest and the noonday. But after the mighty ones of his kingdom, who dwelt in the south, have feared, then the man from Mount Esau will perish, who was accustomed both to fight for the city and to give counsel prudently.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Obadiah.html'
source_title="Commentary on Obadiah"
