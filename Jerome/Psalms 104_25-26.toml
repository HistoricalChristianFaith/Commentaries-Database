[[commentary]]
quote='''
But to me, as I read that passage in the psalms: This great and wide sea, there are creeping things without number, small animals with great. There the ships pass, that dragon which you formed to mock him, it seems worthy of the goodness and clemency of God to destroy by his threat all the bitterness and saltiness of the sea, and to humble the dragon that reigns in the waters, and to dry up the whirlpools of malice in which the small creeping things swim, of which there is no number; for the things that dwell with the dragon are not worthy of number.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Nahum.html'
source_title="Commentary on Nahum"
[[commentary]]
quote='''
Of these fishers, who go down to the sea and are in ships, Isaiah too prophesies: They shall fly in the ships of foreigners, and together they shall plunder the sea. For in the churches gathered from the number of the nations the apostles flew through the whole world, to plunder the sea and to carry off the spoils of the dragon who reigned in the sea, and of whom it is written: This sea, great and spacious in its arms; there are creeping things without number, small creatures with great. There the ships shall pass through; this dragon whom you formed to mock him. The sea is broad and spacious for the small and great living creatures that dwell with the dragon, and whose number is beyond count.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
