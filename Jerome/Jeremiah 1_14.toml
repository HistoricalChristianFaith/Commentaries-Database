[[commentary]]
quote='''
And beautifully it is added: from the north evils shall blaze up upon all the inhabitants of the earth — either of the land of Judea or surely of the whole earth —, of whom it is written in Revelation too: woe upon all the inhabitants of the earth. For the saints are not inhabitants of the earth but strangers and sojourners, of whom one says: I am a stranger upon the earth and a sojourner, as all my fathers were, and another: few and very evil are my days, in which I sojourn on the earth. Hence Peter too writes his catholic epistle to the strangers and sojourners of Pontus, Galatia and Cappadocia. And according to the mystical senses Solomon says: the north wind is a harsh wind, but by name it is called right-handed, that is, by those who have grown stiff with its cold and have lost the warmth of faith.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
