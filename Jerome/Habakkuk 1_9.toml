[[commentary]]
quote='''
And just as at the blast of a burning wind all green things wither, so at the sight of them all things will be laid waste; and so great will be the number of captives and of plunder that, by ὑπερβολὴν (hyperbole), it could even be made equal to the sand.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
