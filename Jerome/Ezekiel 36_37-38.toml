[[commentary]]
quote='''
Nor will he be content with this gift of his liberality toward the people he has saved, but he will bestow far greater things: for he will be found by the house of Israel, he who had been sought for a long time and not found; and, after it has found him, he will multiply them like sheep, not sheep of brute animals but sheep of men — who are full of reason and confession —, like holy sheep and the flock of Jerusalem — in which properly is the worship of God and the vision of peace —, in her solemn feasts — when we eat the unleavened bread of sincerity and truth, and feed on the flesh of the Lamb and are given his blood to drink, and in the seven weeks and in the tabernacles of this age, of the Lord, of the Lord, celebrate the feasts —, so that the cities, once deserted, may become full of flocks of men, and by this means they may know that he is the Lord who has bestowed all things. Let it suffice to have said these things briefly according to the truth of the history, or rather according to the faith of the prophecy: how the people of Israel is restored to its unimpaired state, and the remnant of the people of the Jews, as the Apostle Paul teaches, is saved in the apostles and in all who from the Jews believed in the beginning and to this day return to the Church; now the sense of the tropology must be opened with the same brevity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"

[[commentary]]
quote='''
And again the prophetic word exhorts the penitent that, even when they have returned into the churches, they should always seek the Lord and find him, so that the flocks of the Lord may be multiplied by the crowds of those returning, not flocks of beasts and brute animals, but flocks of men who are full of faith and reason, holy flocks, flocks of the city of Jerusalem, in all the solemn feasts which they have received by the clemency of God, so that, after a multitude of such flocks has filled the cities of the Lord, then all may know that he is the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
