[[commentary]]
quote='''
The priests did not say: Where is the Lord? And those who held the law did not know me, and the shepherds transgressed against me, and the prophets prophesied by Baal and followed idols. After such great benefits they turned the privileges of their dignity into contempt, so that the priests did not seek the Lord, the teachers of the law, who ought to have taught others, did not know him, and the shepherds became transgressors through negligence, and the prophets, who discourse among the peoples, speak not for God but for an idol, and venerate their own fabrications. These words must be used against the teachers of our own order, who devour the people of God like bread for food and by their evil works do not call upon the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
