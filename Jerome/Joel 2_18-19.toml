[[commentary]]
quote='''
The Lord was jealous for his land, and spared his people; and the Lord answered and said to his people: Behold, I will send you grain and wine and oil, and you shall be filled with it, and I will no longer make you a reproach among the nations; and him who is from the north I will put far from you, and I will drive him into a land pathless and desert; his face toward the eastern sea, and his hinder part toward the last sea, and his stench shall go up, and his rottenness shall go up, because he has acted proudly. LXX: And the Lord was jealous for his land, and spared his people, and the Lord answered, and said to his people: Behold, I will send you grain and wine and oil, and you shall be filled with them, and I will no longer make you a reproach among the nations, and him who is from the north I will drive back from you, and I will lead him out into a land which is without water, and I will destroy his face into the first sea, and his hinder parts into the last sea; and his stench shall go up, and his rottenness shall go up, because his works have been magnified. The priests prayed for the people and said: Spare, O Lord, your people, and do not give your inheritance to reproach, and the people did what was commanded, sanctifying a fast, proclaiming a healing, gathering the multitude, sanctifying the Church, choosing the old men, gathering the little ones and those that suck the breasts, and the bridegroom went forth from his bed, and the bride from her bridal chamber, and they served by no means the flesh and pleasure, but the soul and weeping. After this, the Lord was jealous for his land, which he had before despised as if it were another's, and had allowed to be ravaged by the devastating locust; and he spared the penitent to such a degree as to make them worthy of his answer, and to say: Since the locust, the cankerworm and the blight have laid waste all your crops, therefore I will give you grain, and the rest which the prophet describes, and I will no longer hand you over to captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"

[[commentary]]
quote='''
But according to tropology, every soul is the land of the Lord, in which the householder sows his seed; and when it has produced tares instead of wheat, that is, wild oats and darnel, and has offended its Lord, and afterwards has done penance, and has said in mourning: Spare, O Lord, your people, the Lord is jealous for his land, and will spare it, which he had long despised, and deigns to address it and says: I will send you grain, of which it is written: Amen, amen, I say to you, unless a grain of wheat, falling into the earth, dies, it remains alone; but if it dies, it bears many fruits and wine which gladdens the heart of man, and oil which makes the face cheerful, so that the old sadness of sins may be tempered by the gladness of grain and wine and oil, that is, of the virtues; and they will have such an abundance of all good things that they will be filled and sated with them. And when they have obtained this, they will by no means be given over to reproach among the nations, of which the Apostle speaks: We have no wrestling against flesh and blood, but against principalities and powers, against the rulers of the world of this darkness, against the spiritual forces of wickedness in the heavenly places.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
