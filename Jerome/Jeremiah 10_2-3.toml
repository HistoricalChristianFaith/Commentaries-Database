[[commentary]]
quote='''
Hear the word which the Lord has spoken concerning you, house of Israel! Thus says the Lord: Do not learn according to the ways of the nations, and do not be afraid of the signs of heaven, which the nations fear, for the laws of the peoples are vain! He speaks properly against those who venerate the heavenly bodies and suppose that the human race is ruled by those which have been set as signs of years, seasons, months and days, and that earthly things are governed by the causes of heavenly ones. And in saying: the laws or the statutes of the peoples are vain, he shows that all human wisdom is futile and has no usefulness in itself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
