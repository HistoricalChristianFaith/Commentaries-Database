[[commentary]]
quote='''
In those days the house of Judah will go to the house of Israel, and they will come together from the land of the north to the land which I gave to your fathers. This is properly fulfilled at the coming of Christ, when out of the twelve tribes together they believed the Gospel, and, leaving the land of the north and of the harshest cold and withdrawing from the dominion of the devil, then received the land of promise which he had promised to their fathers, Abraham, Isaac and Jacob. I recently published a small book on the land of promise.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
