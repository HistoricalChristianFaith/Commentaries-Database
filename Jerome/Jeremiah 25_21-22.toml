[[commentary]]
quote='''
To Idumea and Moab and the sons of Ammon and to all the kings of Tyre and to all the kings of Sidon. Idumea is the land in which are the mountains of Seir, and which in Hebrew is called Edom; Moab and Ammon are themselves the sons of Lot, neighbors of the Dead Sea. Tyre and Sidon are the chief cities on the coast of Phoenicia, which themselves too were overcome when the Babylonian came; Carthage is their colony, whence also the Poeni are so called, by a corruption of the word, as though Phoeni, and their language is to a great extent akin to the Hebrew language.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
