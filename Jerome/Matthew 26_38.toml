[[commentary]]
quote='''
He is sorrowful not because of death, but unto death, until He has set the Apostles free by His Passion. Let those who imagine Jesus to have taken an irrational soul, say how it is that He is thus sorrowful, and knows the season of His sorrow, for though the brute animals have sorrow, yet they know neither the causes of it, nor the time for which it must endure.

Or the sleep which He would have them forego is not bodily rest, for which at this critical time there was no room, but mental torpor, the sleep of unbelief.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252026.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Then he said to them: My soul is sad even to death; stay here and keep watch with me. What is saddened is the soul; and it is saddened not on account of death but even to death, until he should free the apostles by his passion. But as to his command: stay here and keep watch with me, he does not forbid them sleep, for which it was not the time with the danger at hand, but the sleep of unbelief and the torpor of the mind. Let those who suspect that Jesus took on an irrational soul tell us how he is saddened and knows the time of sadness. For although brute animals too grieve, yet they know neither the causes nor the time up to which they ought to be saddened.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
