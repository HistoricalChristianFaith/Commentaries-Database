[[commentary]]
quote='''
Let him call the things that are not as though they were, and set out the order of my creation, I who have balanced all things by reason, since I made man upon the earth. Nor do I want this only, but I also ask for knowledge of things to come.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
