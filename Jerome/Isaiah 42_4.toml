[[commentary]]
quote='''
But what follows, He will shine and will not be broken, until he sets judgment upon the earth, the Evangelist Matthew did not set down (Matt 12); or else the words in the middle, between judgment and judgment, were removed by a scribe's error. And it signifies that, rising from the dead, he enlightened all, and was not broken by death, until he set judgment upon the earth, he who said in the Gospel: For judgment I came into this world, that those who do not see may see, and those who see may become blind (John 9:39). For this we translated: He will not be sad, nor troubled, but he will keep an evenness of countenance at all times: what the philosophers falsely boast of Socrates, that he was never sadder or happier than usual. For this Aquila and Theodotion translated: He will not darken, and he will not run, until he sets judgment in the earth. And the sense is: he will deter no one by sadness of countenance, nor will he hasten to punishment, he who has reserved the truth of judgment for the last time. And what follows, and the islands will wait for his law, the Seventy set down more plainly: in his name the nations will hope; these are called islands in the Scriptures because they lie open on every side to the inroads of persecutors. And by his law let us understand not that which was given through Moses, but the Gospel: For out of Zion shall go forth the law, and the word of the Lord from Jerusalem (above, Isa 2). Of this law Jeremiah too prophesies: Behold, the days are coming, says the Lord, and I will make a new covenant, not according to the covenant which I once made with their fathers (Jer 31:31-32).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
