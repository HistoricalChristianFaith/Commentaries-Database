[[commentary]]
quote='''
This Creator, then, and Lord of the universe testifies that he will make Jerusalem a lintel of drunkenness for all the peoples round about, so that whoever touches its threshold may be made drunk and fall, or else the lintel itself may fall upon the one by whom it is touched. But Judah too, when Jerusalem is besieged, is captured by the nations, and passing into their fellowship he will be compelled to besiege his own mother city.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
