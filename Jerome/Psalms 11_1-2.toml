[[commentary]]
quote='''
He who holds this boss of faith with a strong hand, and, trusting in the Lord, knows that he is safe from the darts that come, will speak fearlessly: In the Lord I trust: how do you say to my soul: Move to the mountain like a sparrow? For behold, sinners have bent the bow, they have prepared their arrows in their quivers, to shoot in the dark at the upright in heart (Ps. 10:1, 2). Since, then, he says, I trust in the Lord, on what reasoning do you give me counsel not to stand against the onsets of enemies, and against the darts which they have prepared against me in their quivers, wishing to strike not only me but also all the upright in heart? Behold, I stand upon the rock, and do not move to the dark mountains; and all the weapons of the enemies, driven back, are turned upon those very ones who aim them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
