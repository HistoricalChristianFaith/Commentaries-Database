[[commentary]]
quote='''
Here, therefore, a holy love is to be understood, the love with which Isaac too loved his wife Rebekah (Gen. 24), whose name is interpreted "patience": and from the land of Mesopotamia, which is girded on every side by the waves of this age, he brought her into the land of promise, that he might be comforted for the death of his mother. For he tempered the death of the Synagogue by union with the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
