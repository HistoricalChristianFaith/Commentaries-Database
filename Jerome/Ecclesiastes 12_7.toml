[[commentary]]
quote='''
And as follows more plainly: The dust will return into its earth, from which it was taken, and the spirit will be turned to God, who gave it. From this those are quite laughable who think that souls are sown with bodies and are begotten not by God but by the parent of the bodies. For since the flesh returns into the earth, and the spirit goes back to God, who gave it, it is manifest that God is the parent of souls, not men.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
