[[commentary]]
quote='''
Thus says the Lord of hosts: Behold, I will save my people from the land of the east and from the land of the setting of the sun. And I will bring them, and they shall dwell in the midst of Jerusalem; and they shall be my people, and I will be their God, in truth and in justice. LXX: likewise. Some of the Jews say that these things were fulfilled after Zerubbabel and Nehemiah, when the temple had been built, the walls of the city raised and the Jewish state restored, by the Maccabees and the various princes who ruled Judea down to Herod. Others relate that they are to be fulfilled at the consummation of the world under the Christ, for whom they wait in vain. But we say that they were both partly fulfilled at that time, that is, after Zerubbabel and Nehemiah, and went before as it were in types and images, when the people was brought back from captivity and dwelt in Jerusalem and was called the people of God, and the Lord was again called their God, by no means in falsehood and iniquity but in truth and justice; and that now, most fully, under the Lord and Savior in the Church, that is, in the true Jerusalem, the promise is fulfilled in deed, especially because it is said: Behold, I will save my people from the land of the east and from the land of the west; of whom the Lord also spoke in the Gospel: Many shall come from the east and the west, and shall recline in the kingdom of heaven with Abraham, Isaac and Jacob. And long before, the psalmist had promised, saying: The God of gods, the Lord, has spoken, and has called the earth from the rising of the sun to its setting. Out of Zion the loveliness of his beauty. For there shall come out of Zion one to rescue and to overturn iniquities from Jacob, when from the east and the west incense is offered to the name of the Lord in every place, and a pure sacrifice, by no means in the victims of the Old Testament, but in the holiness of evangelical purity; of which incense we read elsewhere too: Let my prayer be directed as incense in your sight. And what this incense is, the words that follow show: The lifting up of my hands an evening sacrifice. For after there sprang up from the rod of Jesse one who should rule the nations, and in him the nations hoped, and from the east and from the west both the first people and the last believed in the Lord, and there was made one flock, then all the nations were called to gladness and stirred to joy, as the prophet says: Rejoice, you nations, with his people. According to what is written elsewhere: All the ends of the earth shall remember and turn to the Lord, and all the families of the nations shall worship before him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
