[[commentary]]
quote='''
Not really smitten by the moon, but who were believed to be so through the subtlety of the dæmons, who by observing the seasons of the moon, sought to bring an evil report against the creature, that it might redound to the blasphemy of the Creator.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the lunatics and the paralytics, and he cured them. Not truly lunatics, but those who were thought to be lunatics because of the deceit of demons, who, observing the lunar seasons, wished to defame the creature so that blasphemies might overflow onto the Creator.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
