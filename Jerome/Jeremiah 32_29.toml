[[commentary]]
quote='''
And the Chaldeans, he says, shall come, fighting against this city. Aquila did better, who for what is written, 'shall come', translated eiseleusontai, that is, 'shall enter' the city; for they were not absent, so as to 'come', since they had surrounded Jerusalem, as Scripture testifies: then the army of the king of Babylon was besieging Jerusalem, and then: behold, siegeworks have been built against the city, that it may be taken, and the city has been given into the hands of the Chaldeans. How then shall they 'come' who were present? 'But those who were besieging the city shall enter', he says, 'and shall take it and set it on fire and burn it to the ground' — for the Hebrew word 'bau', by its ambiguity, means both 'shall come' and 'shall enter' — 'and the houses on whose roofs they sacrificed to Baal, the idol of the Sidonians, and poured out libations to strange gods to provoke me, so that they seemed to be heaping insults on the Creator, not through an error of religion but out of a kind of contentiousness'. And just as the world is written to be destined to perish, according to what is written: heaven and earth shall pass away, because it is set in the evil one, so too the very houses and places in which crimes were committed lie subject to the wrath of God. There are those who contentiously refer to the places themselves what is written: 'the place in which the Lord and Savior was crucified is spiritually called Gomorrah and Egypt'. But others think that the whole world is signified under the name of Egypt and Gomorrah; for as Gomorrah was destroyed by divine fire, so the world too is to be burned up by the judgment of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
