[[commentary]]
quote='''
But if anyone thinks it blasphemous that we have called the Son the way, and that through the way we go as it were to God, let us see what this very way says. "No one comes to me, unless my Father draws him to me." So, just as the Son leads to the Father, so also the Father leads to the Son. These are human words. But both the Son leads to the Father, and the Father leads to the Son: and there is one nature, one substance.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_006.html'
source_title="Homily 6, on Psalm 66"
