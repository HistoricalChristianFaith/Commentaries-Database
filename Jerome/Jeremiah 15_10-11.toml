[[commentary]]
quote='''
In place of what we translated according to the Hebrew: all curse me, up to the place where it is written: in the time of tribulation against the enemy, I have found it written thus in the common edition: My strength has failed in those who curse me. So be it, Lord, with them being directed, if I did not stand by you in the time of their affliction and in the time of their tribulation for good against the enemy! And the sense is: 'My strength has failed in those who curse me; for they do not understand my power, which is made perfect in weakness, and the more they curse me, the more my strength fails in them'. And either the prophet or the Lord joins to this and says: So be it, Lord, with them being directed! That is: 'Let the curses which the enemies speak come upon me, and let them be directed into good, if in the time of their tribulation and distress, when the enemy was laying them waste and hastening to capture them, I did not stand in your sight and entreat you for them and say: Father, forgive them; for what they do, they do not know'. But we also often find Jeremiah in this book entreating for the people.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
