[[commentary]]
quote='''
This thought of yours, he says, is perverse: that you should think the maker does not know what he has made, and the Creator is ignorant of his creature; as if the clay and the work should say to the potter and its maker: You did not make me, or you did not make me well, nor do you understand your handiwork. The Apostle uses this testimony in other words in writing to the Romans, where he discusses the deep knowledge of God and seeks to refute the false charge of men: O man, who are you to answer back to God? Does the thing formed say to him who formed it: Why have you made me thus? Or has not the potter power over the same clay to make one vessel unto honor and another unto dishonor (Rom 9:20-21). In all these that rule must always be observed: the Evangelists and Apostles translated from the Hebrew into Greek as seemed good to them, without loss to the sense.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
