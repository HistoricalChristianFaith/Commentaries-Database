[[commentary]]
quote='''
Further, the name Jerusalem and of the nations, which the Seventy set down here, is not found in the Hebrew, and must be marked beforehand with an obelus, against those who assert that everything said here is said to Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
