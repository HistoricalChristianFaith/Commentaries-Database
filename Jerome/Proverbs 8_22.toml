[[commentary]]
quote='''
According to the Seventy, those who said, Lord God, possess us, pray for this, that after peace has been restored to them they may become the possession of God. This indeed we read also of Wisdom, which according to the Hebrew speaks in Proverbs: God possessed me, the beginning of his ways (Prov 8:22), although some copies wrongly have creature for possession. Then it follows: But before all the hills he begot me. For how can begetting be fitted to a creature, when it rather suits possession?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Now there came to this tower the first power, or the first principality, he who had said: I am alpha and Ω, the beginning and the end, the first and the last. And he who, in the person of the man he had assumed, says in Proverbs: The Lord created me in the beginning of his ways for his works, or, as it is written in the Hebrew: The Lord possessed me: for canani means not he created me, but he possessed me and held me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And since we have once come to the name of creature, and Wisdom in the Proverbs of Solomon says that she was created the beginning of the ways of God (Prov. 8), and many, for fear lest they be compelled to call Christ a creature, deny the whole mystery of Christ, so as to say that it is not Christ who is signified in this wisdom but the wisdom of the world: we freely proclaim that there is no danger in calling him a creature whom, with the whole confidence of our hope, we profess to be a worm, and a man, and crucified, and a curse; especially since, two little verses before, Wisdom herself promises that she will speak of the things which are after the ages (Prov. 8:21). But since Christ made the ages, and what she says next are the things which he promised he would speak of after the ages, the things that follow are to be referred to the mystery of the incarnation, not to the nature of God; although in the Hebrew manuscripts it does not read: The Lord created me the beginning of his ways, but, The Lord possessed me. Now between possession and creation there is a great difference: because he who is possessed certainly exists and subsists, and he who is possessed is one's own. But he is created who did not exist before he came to be; or certainly he is transferred from what he was into something else, just as we too are now said to be created in Christ Jesus. Created, certainly, not because we did not exist before, but created in good works. This David too prays for in the fiftieth psalm, saying: Create a clean heart in me, O God (Ps. 50:11). And certainly he had had a clean heart before his sin, when the Lord said of him: I have found David the son of Jesse after my own heart (Acts 13:22); but as there creation means renewal, so also in us and in Christ, through individual works and advances, creation and founding can be understood: so that daily in believers (who, variously according to their different merits, are called mountains, and valleys, and hills, and plains) Christ is created, born and founded.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
But if, according to the mystical understandings, wisdom is said to have been made in Christ (Sir. 24), let the Arians understand that they boast in vain of that testimony in which Wisdom says that she was created and begotten and founded at the beginning of the ways of God. And certainly, according to them, she was created; she could not have been born. But if she was born, how is she said to have been both founded and created?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"

[[commentary]]
quote='''
But what he says, Who was created according to God, does not sound the same in the Latin tongue as in the Greek. For with us, "creation" (creatio) is used of generation or birth; but among the Greeks, under the name of creation, the word for making and founding is understood. And what among us is "founding" (conditio), this among the Greeks sounds as "creation." Hence also the heresy that slanders the nativity of Christ wrests to its use the example of Solomon: The Lord created me the beginning of his ways (Prov. 8:22). It must be considered, therefore, that "creation" and "founding" are never named except in the case of great works. For example, the world was created; a city was founded; but a house, however great it may be, is rather said to have been built than founded or created. For in great works and makings the word "creation" is taken up. From this it is to be noted that this new man, who was created according to God in Christ, is a great work of God and stands out beyond the other creatures: since he is said to have been founded in such a way as the world was, and to have been created as the beginning of the ways of God and at the outset of all the elements.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
