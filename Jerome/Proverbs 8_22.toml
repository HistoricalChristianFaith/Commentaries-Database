[[commentary]]
quote='''
According to the Seventy, those who said, Lord God, possess us, pray for this, that after peace has been restored to them they may become the possession of God. This indeed we read also of Wisdom, which according to the Hebrew speaks in Proverbs: God possessed me, the beginning of his ways (Prov 8:22), although some copies wrongly have creature for possession. Then it follows: But before all the hills he begot me. For how can begetting be fitted to a creature, when it rather suits possession?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
Now there came to this tower the first power, or the first principality, he who had said: I am alpha and Ω, the beginning and the end, the first and the last. And he who, in the person of the man he had assumed, says in Proverbs: The Lord created me in the beginning of his ways for his works, or, as it is written in the Hebrew: The Lord possessed me: for canani means not he created me, but he possessed me and held me.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
