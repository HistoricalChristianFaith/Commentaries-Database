[[commentary]]
quote='''
Let us pass to the order of the spiritual understanding: Do not fear, O land, nay rather take courage and be glad, you who before had lost the Lord's seed by your dryness, because the Lord has magnified himself so as to show mercy to you, to such a degree that even the cattle of the region and of the desert solitude were filled with glad fallow lands, and the tree of the cross bore its fruit, and the most sweet gifts of the Holy Spirit bestowed their bounty on all.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
