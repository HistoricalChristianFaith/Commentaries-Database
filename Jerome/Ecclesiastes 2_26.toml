[[commentary]]
quote='''
And beautifully does God give to the good man wisdom and knowledge and joy: for unless he has been good and has first corrected his ways by his own free choice, he does not deserve wisdom and knowledge and joy, according to what is said elsewhere: Sow for yourselves in righteousness, gather the vintage in the fruit of life, light for yourselves the light of knowledge. For righteousness must first be sown, and the fruit of life reaped, and afterwards the light of knowledge will be able to appear. As, then, God gave to the man who is good before him wisdom and the rest, so, leaving the sinner to his own free choice, he made him gather riches and stitch together, from this side and that, pillows of perverse doctrines. And when the holy man, pleasing to God, sees these, he understands that they are vain and put together by presumption of spirit. Nor should we wonder that he said: To the sinner he has given anxiety, and so on. For this must be referred to the sense of which I have often treated: that anxiety, or distraction, was given to him because he was a sinner, and that the cause of the distraction is not in God, but in him who first sinned of his own will.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
