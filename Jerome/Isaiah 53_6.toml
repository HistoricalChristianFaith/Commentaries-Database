[[commentary]]
quote='''
All, he says, like sheep have gone astray, and we have needed the mercy of God, saying in the psalm: I have gone astray like a lost sheep (Ps 118 [119]:176); the sheep which in the parable of the Gospel was carried back on the shoulders of the good and careful Shepherd (Matt 18). And who these sheep are, the following verse shows: Man has gone astray in his own way; or each one has turned aside in his own way, to follow his own error, and, forsaking the right way, to hold differing opinions about the Crucified. The Lord, however, has laid on him the iniquity of us all, or handed him over for our sins, so that what we could not bear through the weakness of our strength, he might carry for us, he who was offered because he himself willed it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
