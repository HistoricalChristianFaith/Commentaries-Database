[[commentary]]
quote='''
From this it is clear that, according to the understanding of this perikopēs [passage], the foregoing is to be understood of the first coming of the Savior, when both peoples, Israel and Judah, were joined to each other. But if it raises a scruple for anyone why he said: I will dispose for the house of Israel and the house of Judah a new covenant — or testament — not according to the covenant which I made with your fathers, let him understand that the first Church of Christ was from the Jews, and that the Lord Savior came to them and said: I have not come except to the lost sheep of the house of Israel, and that the apostles confirmed this very thing: it was necessary that the word of God be spoken first to you; but since you reject it and judge yourselves unworthy of eternal life, behold, we turn to the nations. For it was not right to give the children's bread to dogs; but because the sons were unwilling to receive the father coming into his own, he gave to all the power that those who received him should become sons of God.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
