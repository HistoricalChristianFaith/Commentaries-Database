[[commentary]]
quote='''
But not to be long (for it is a commentary, not a dialogue, that is being written), I shall show briefly from the fiftieth psalm that three spirits are named, the prophet saying: "Create a clean heart in me, O God, and renew a right spirit in my inward parts. Do not cast me away from your face, and do not take your Holy Spirit from me. Restore to me the joy of your salvation, and strengthen me with a princely spirit". By the princely spirit he means the Father, because the Son is from the Father, and not the Father from the Son. But by the right spirit, the spirit of truth and righteousness, he signifies Christ the Lord: "For the Father has given all judgment to the Son" (John 5:22), as David says: "O God, give your judgment to the king, and your power to the king's son" (Ps. 71:1). Further, he calls the Holy Spirit by his open name. And though these differ in names and persons, they are joined in substance and nature; and, because of the fellowship of nature, the same Spirit is said without distinction to be now of the Father, now of the Son.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
