[[commentary]]
quote='''
The islands saw, that is, the nations, or the Churches gathered from the nations, which endure the storms of this world; and they feared the Lord: For the fear of the Lord is the beginning of wisdom (Prov 9:10). All the ends of the lands trembled at the words of the Apostles, drawing near and coming together to the Gospel of Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
