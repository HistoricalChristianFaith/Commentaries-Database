[[commentary]]
quote='''
But perhaps an inquisitive reader will object this too: how we can assert that God stands at the right of the just man, and the devil at the left of the sinner, when concerning our Lord it is read in Zechariah, "And the devil was standing at his right hand to oppose him." Let him, then, who objects this read also what follows: that when the devil was standing at his right hand, Jesus had filthy garments. Rightly did he who had taken up our sins and was bearing our offenses have the devil at his right hand, not so much for himself as for the filthy garments. And at the same time let him consider that it is not said, "The devil was standing as victor and triumphing," but as still set in the contest and in the battle-line and in doubt—indeed, when he had not yet begun to fight. For it follows, "That he might oppose him." But the devil was opposing him, as we said, because he had filthy garments from our sins. But after he heard, "May the Lord who chose Jerusalem rebuke you," he did not stand at the right, but went behind his back and under his feet, and at once Jesus the great priest receives the ankle-length robe (poderis), and is clothed in white vesture, and, royal dignity being joined to him—that is, Zerubbabel being coupled with him—builds the Church, and constructs the spiritual Jerusalem.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_061.html'
source_title="HOMILIES ON THE PSALMS, ALTERNATE SERIES 61"

[[commentary]]
quote='''
And the Lord said to Satan, to the accuser and his adversary, for he is the enemy and avenger, the accuser of his brothers: The Lord rebuke you, Satan, as the Lord rained from the Lord, and the Lord rebuke you, he who has chosen Jerusalem. Since, then, out of all the cities of Judah Jerusalem has now been chosen, the Lord in no way imputing to her the sins she committed, why do you try to overwhelm Joshua like a brand, which is commonly called a firebrand, Joshua who escaped as it were half-burnt from the Babylonian captivity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
As for what follows: The Lord rebuke you, Satan, and the Lord rebuke you, he who has chosen Jerusalem, they explain it thus: that the Father and the Son is Lord, and in Psalm 109 (110) we read: The Lord said to my Lord: Sit at my right hand; he speaks of the other Lord, not because the Lord himself who speaks cannot rebuke, but because, from the unity of their nature, when the other has rebuked, he himself who speaks rebukes: For he who sees the Son sees the Father, and he it is who has chosen Jerusalem, the Church, which contemplates the peace of the Lord. Now the brand plucked out of the fire can most rightly be understood as him who, though he was in Babylon, was not consumed by the Babylonian fire, nor touched by the flame of this world. Hence Moses too, in the wilderness, sees a great vision, in which the bush was burning and was not consumed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
