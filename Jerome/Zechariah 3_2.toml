[[commentary]]
quote='''
And the Lord said to Satan, to the accuser and his adversary, for he is the enemy and avenger, the accuser of his brothers: The Lord rebuke you, Satan, as the Lord rained from the Lord, and the Lord rebuke you, he who has chosen Jerusalem. Since, then, out of all the cities of Judah Jerusalem has now been chosen, the Lord in no way imputing to her the sins she committed, why do you try to overwhelm Joshua like a brand, which is commonly called a firebrand, Joshua who escaped as it were half-burnt from the Babylonian captivity?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
As for what follows: The Lord rebuke you, Satan, and the Lord rebuke you, he who has chosen Jerusalem, they explain it thus: that the Father and the Son is Lord, and in Psalm 109 (110) we read: The Lord said to my Lord: Sit at my right hand; he speaks of the other Lord, not because the Lord himself who speaks cannot rebuke, but because, from the unity of their nature, when the other has rebuked, he himself who speaks rebukes: For he who sees the Son sees the Father, and he it is who has chosen Jerusalem, the Church, which contemplates the peace of the Lord. Now the brand plucked out of the fire can most rightly be understood as him who, though he was in Babylon, was not consumed by the Babylonian fire, nor touched by the flame of this world. Hence Moses too, in the wilderness, sees a great vision, in which the bush was burning and was not consumed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
