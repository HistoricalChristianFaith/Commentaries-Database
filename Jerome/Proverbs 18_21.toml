[[commentary]]
quote='''
See what Solomon says: 'In the hand of the tongue are death and life.' See what he says, in the hand of the tongue. Do you see how great an evil the tongue is? and it has a hand too. For what does he say? In the hand of the tongue. It is a great vice to slander the brethren, to be unable to keep silent, to go round the cells, to slander others.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_041.html'
source_title="Homily 41, on Psalm 119"

[[commentary]]
quote='''
And hands are interpreted as works. Whence it is written: 'The word of the Lord came by the hand of Haggai,' 'The word which came by the hand of Jeremiah the prophet.' Surely the word of the Lord does not come by the hand, but comes in the mouth. But see the mysteries of Scripture. God does not come to speech, except to good works. For a murderer too confesses Christ, and yet the Lord does not come to him, because his hands do not deserve the Lord's coming. Whence it is written in another place: 'In the hand of the tongue are death and life.' Does the tongue then have a hand? Tell me, why is it said, 'In the hand of the tongue are death and life'? See what he means. God does not hear the tongue, not words, but works: so that whoever says something may also do it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_046.html'
source_title="Homily 46, on Psalm 133"

[[commentary]]
quote='''
But because in God there are no members, therefore he speaks in such a way that we, as often as we read such things about God as are frequently found in the Scriptures, may understand that an operation is signified, not members. In Solomon we read: "In the hand of the tongue are death and life." Does the tongue then have a hand? But in order that we may come more easily to the understanding of the sense above, we have brought forward this testimony: for by the same reasoning by which you would give the tongue a hand, by that same reasoning you are going to give God all members.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_071.html'
source_title="Homily 71, on Psalm 93 (Alternate Series)"
