[[commentary]]
quote='''
Therefore thus says the Lord of hosts: Because you have not listened to my words, behold, I will send and take all the families of the north, says the Lord, and Nebuchadnezzar, king of Babylon, my servant. 'Because you have provoked me to anger and done evil to your own destruction, and have trampled with a proud foot him who called you to repentance, I will send', he says, 'to all the families, or nations, of the north, and I will bring their prince Nebuchadnezzar, king of Babylon, my servant'. Now the Lord sends either angels to stir up the nations, or else he moves thoughts of such a kind that they do the will of the Lord. And as for his calling Nebuchadnezzar 'his servant', he is not called 'servant' in the way the prophets and all the saints are, who truly serve the Lord, but in that in the overthrow of Jerusalem he serves the will of the Lord, in accordance with what the Apostle too says: whom I have delivered to Satan, that they may learn not to blaspheme. And that the Chaldeans lie in the northern quarter with respect to the position of Jerusalem is doubtful to no one.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
