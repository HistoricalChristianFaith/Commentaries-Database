[[commentary]]
quote='''
Daily God calls to repentance both those who are outside the Church and those who sin while dwelling in the Church, and says to them: I desire mercy and not sacrifice, and the knowledge of God more than burnt offerings. But they offer sacrilegious bread, and give alms, and appear to pursue humility; these, then, if they are truly done, I interpret as burnt offerings. But since they have abandoned the knowledge of God, in vain, with the head of faith cut off, do they boast that they have the other members; for they have transgressed the covenant of God in the Church, just as Adam transgressed in paradise; and they show themselves imitators of their ancient parent, so that, as he was cast out of paradise, so these too may be cast out of the Church.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
