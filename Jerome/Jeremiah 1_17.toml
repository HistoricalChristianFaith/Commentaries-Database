[[commentary]]
quote='''
You therefore gird up your loins, and arise, and speak to them all things which I command you. Job too is commanded to gird up his loins, and the apostles, with loins girded — which Elijah and John the Baptist mortified with girdles of skin —, to hold lamps in their hands, namely those of the preaching of the Gospel. Whoever therefore is to speak the words of God ought to gird up his loins, knowing that all the strength of the devil is in the loins, and that the righteous man says in the psalms: my loins are filled with illusions. And when he has girded his loins, let him hear that which is written: arise, you who sleep, and be lifted up, and Christ will enlighten you, so that, always watching and rising up from sleep, he may speak the things which God has commanded him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Do not be afraid of their face; for I will not make you fear their countenance, or, as the Seventy and the other translators have: lest perhaps I make you fear. And the sense according to our translation is: 'do not be afraid of their face; for with me as your helper you will not be able to fear them'; according to the Seventy: 'do not be afraid of their face, have confidence in my command; for if you do not offer what you have, so as to cease to fear, I will forsake you and hand you over to fear, and I shall in a manner seem to make you fear, while I leave you to dread'. And this signifies that truth is always bitter, and that the multitude of men is not to be feared, who, when rebuked, do not bear correction but lay snares for him by whom they are corrected. And what follows according to the Seventy: for I am with you to deliver you, says the Lord, is not found in the Hebrew. And the sense is: 'I will rescue you, not in this, that no one lies in wait for you, but in this, that by enduring snares you do not transgress'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
