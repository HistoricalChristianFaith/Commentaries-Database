[[commentary]]
quote='''
It is also asked how Jehoiakim, king of Judah, a king of small dominion, weakened, and about to perish at any moment, had the power of sending into Egypt and of bringing Uriah out from there. This is easily solved if we consider that he had been appointed prince by Neco, king of Egypt, and that this prophecy was made in the beginning of his reign.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
