[[commentary]]
quote='''
And since trespasses (delicta), which in Greek are called παραπτώματα, is properly, according to the etymology of that same language, a word of the Scriptures (although delicta would more correctly be translated πλημμέλιαι, "offences"), we ask what they signify, and in what they differ from sins, that is, what difference there is between παραπτώματα and ἁμαρτίας. For they say that παραπτώματα are, as it were, the beginnings of sins, when a thought creeps in silently and, though we connive in some measure, has not yet driven us to ruin. Hence also in the eighteenth psalm (v. 13) it is written: Trespasses, that is, παραπτώματα, who understands?, namely because it is difficult to understand the roots and beginnings of sins. But sin, they say, is when something, completed in deed, has come to its end.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
