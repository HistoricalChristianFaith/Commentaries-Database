[[commentary]]
quote='''
Yet art thou wrong, Peter, and as another Evangelist says, knowest not what thou sayest. (Luke 9:33.) Think not. of three tabernacles, when there is but one tabernacle of the Gospel in which both Law and Prophets are to be repeated. But if thou wilt have three tabernacles, set not the servants equal with their Lord, but make three tabernacles, yea make one for the Father, Son, and Holy Spirit, that They whose divinity is one, may have but one tabernacle, in thy bosom.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252017.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
But Peter answered and said to Jesus: Lord, it is good for us to be here. Because he had climbed up to the mountains, he does not want to go down to earthly things, but to remain always on the heights.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"

[[commentary]]
quote='''
If you wish, I will make here three tabernacles, one for you, and one for Moses, and one for Elijah. You err, Peter, as another evangelist also testifies: you do not know what you are saying. Do not seek three tabernacles, when there is one tabernacle of the Gospel, in which the Law and the Prophets are to be summed up. But if you seek three tabernacles, by no means compare the servants with the Lord. Rather, make three tabernacles, or rather one, for the Father and the Son and the Holy Spirit, so that those whose divinity is one may also have one tabernacle in your breast.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
