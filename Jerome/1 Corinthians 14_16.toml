[[commentary]]
quote='''
And that Amen signifies the assent of the hearer and is a seal of truth, the first Epistle to the Corinthians also teaches us, in which Paul says: "But if you bless with the spirit, who fills the place of the unlearned? How will he say amen over your blessing, since indeed he does not know what you are saying" (1 Cor. 14:16)? From which he shows that the unlearned man cannot answer that what is said is true unless he has understood what is being taught.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
