[[commentary]]
quote='''
Declare this to the house of Jacob and make it heard in Judah, saying: Hear, O foolish people, who have no heart, who having eyes do not see, and ears and do not hear! In many ways he draws sinners back to salvation, and he calls foolish the people that has abandoned the author of wisdom, and he compares them to the images of which it is written: They have eyes and do not see; they have ears and do not hear. Let those who make them become like them, and all who trust in them. Properly, however, he speaks to Judah and to the house of Jacob — for Israel had already for a long time been in exile among the Assyrians — and at the same time he gives us to understand that even without a precept we ought to understand by natural sense the things that are right.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
