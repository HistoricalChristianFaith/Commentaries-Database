[[commentary]]
quote='''
The raven is sent out from the ark, and does not return. In the flood it is with the rest: after the flood it is cast out in the time of prosperity—that is, at that time when there is calm, it cannot be in the ark of God. If ever there is a storm, if ever a flood, the raven is in the midst: calm returns, and the raven flees.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"
