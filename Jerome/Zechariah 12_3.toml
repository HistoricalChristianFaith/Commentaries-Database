[[commentary]]
quote='''
And not only will the Lord make Jerusalem like a lintel of drunkenness for all the peoples; he will also make her like a stone of burden for all the peoples, and whoever tries to lift it will be torn with gashing. For all the kingdoms of the earth will be gathered against Jerusalem. It is the custom in the cities of Palestine, and to this day the old practice is kept throughout all Judea, that in villages, towns and forts round stones of very great weight are set, on which young men are accustomed to exercise themselves; and they lift them according to the variety of their strength, some up to the knees, some up to the navel, others to the shoulders and the head, some above the crown of the head, with arms held straight and hands joined, raising the weight and showing the greatness of their strength. On the citadel of the Athenians, beside the statue of Minerva, I saw a bronze sphere of very great weight, which I, because of the weakness of my poor body, could scarcely move. And when I asked what it meant, the answer was given by the inhabitants of that city that the strength of athletes was proved by that mass, and that no one went down to a contest until it was known, from his lifting of the weight, with whom he ought to be matched. So the sense is this: I will make Jerusalem for all the nations like a very heavy stone to be lifted. They will indeed lift her, and lay her waste according to the variety of their strength; but it must be that, while she is being lifted, in the very straining and raising of the weight, the very heavy stone leaves some gash or scrape on the bodies of those who lift it.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
