[[commentary]]
quote='''
Who brings forth hay on the mountains. If he were speaking of hay alone, surely hay is born more in the valleys than on the mountainous places: for wherever the rain is more abundant, there hay is born more. From the mountains the waters flow down into the valleys, and grass is born more abundantly.

And who gives to the beasts their food. This Scripture which we read, which we handle, which we have in our hands, is called the mountains; in the Scriptures Abraham is called a mountain, Isaac is called a mountain, Jeremiah a mountain, the holy prophets are mountains. These mountains have both grain and hay. If you are a man, you receive grain from them: if you are cattle, you receive hay. Men and beasts you will save, O Lord. If you are a beast, you receive hay; if you are a man, you receive grain: according to your faith you are saved. Who brings forth hay on the mountains, and gives to the beasts their food. If you are a man, in the holy Scriptures you receive spiritual understanding: if you are a beast, you receive it according to the letter, in the Jewish manner.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_056.html'
source_title="Homily 56, on Psalm 146"
