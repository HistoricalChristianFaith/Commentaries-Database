[[commentary]]
quote='''
I will give him, he says, the key of the house of David, he who opens and no one shuts, who shuts and no one opens (Rev 3). And this very key shall be upon his shoulder, that is, in his passion, according to what is written in another place: Whose government is upon his shoulder (Isa 9:6). For what he has unlocked by his passion cannot be shut; and what he has shut in the ceremonies of the Jews shall be opened by no one else.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"

[[commentary]]
quote='''
This is what is said in the Apocalypse of John: "He who has the key of David, who shuts and no one opens, opens and no one shuts." This key the scribes and Pharisees held in the law, to whom the Lord says in the Gospel: "Woe to you scribes, who hold the key of the kingdom of heaven," and the rest. O Pharisees, who hold the keys of the kingdom, and yet do not believe in Christ, who is the door and gate of the kingdom: to you indeed it is promised, but to us it is delivered: you have the flesh, but we have the spirit: nay rather, because you denied the spirit, you have lost the flesh too along with the spirit.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_066.html'
source_title="Homily 66, on Psalm 88 (Alternate Series)"
