[[commentary]]
quote='''
And as wine deceives the one who drinks it, so will the proud man be, and he will not be adorned; who has enlarged his soul like hell, and he himself is like death, and is not filled. And he will gather to himself all nations, and will heap up to himself all peoples. Will not all these take up a parable against him, and the speech of his riddles, and it will be said: Woe to him who multiplies what is not his own, how long does he also weigh down thick clay against himself? Will not those suddenly rise up who bite you, and those who tear you be stirred up, and you will be for a plunder to them? Because you have despoiled many nations, all who are left of the peoples will despoil you, because of the blood of man, and the iniquity of the land, of the city and of all who dwell in it. LXX: But he who is arrogant and a despiser, a proud man, brings nothing to completion; who has enlarged his soul like hell, and he is like death, he is not filled. And he will gather to himself all nations, and will receive to himself all peoples; will not all these take up a parable against him, and a proposition for his narration, and they will say: Woe to him who multiplies for himself the things that are not his own, how long does he weigh down his collar heavily, for suddenly those biting him will rise up, and your ambushers will keep watch, and you will be for a plunder to them? Because you have despoiled many nations, all the remaining peoples will despoil you, because of the blood of men and the impieties of the land, and of the city, and of all its inhabitants. Since these things have been promised concerning the coming of Christ, or, as some prefer, concerning the end of the vision and the fulfillment of God's help, which whoever believes is to come will live by his faith; but whoever is unbelieving will displease the soul of the Lord: Nebuchadnezzar, the Babylonian king, will be deceived by his pride. And as wine works against the one who drinks it, and after he has risen neither foot nor mind keeps its proper office, and all gladness and cheerfulness of mind is turned into ruin, so the proud man will not be adorned, nor will he bring his will to completion, and, according to Symmachus, οὐκ εὐπορήσει, that is, he will be in want of all things. He, like death and hell, is not sated with the slain, and, subjugating all nations and all peoples to his rule, conceived no end to his avarice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
Let us examine the Seventy as well. All that we have said of Babylon and Nebuchadnezzar can be referred to this world and to the devil, who, truly arrogant and proud, and believing himself to be something, will bring nothing to completion. For indeed his endeavor and all his labor will come to destruction, he who, in the likeness of hell and of death, is not sated with the slain, and rejoices in the deception of all nations, and gathers peoples to himself.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
[[commentary]]
quote='''
This same thing can also be interpreted of the Antichrist, who will be so arrogant and proud that he will sit in the temple of God, making himself God. And like hell and death he will slay so many, and gather so many to himself, that, if it were possible, he would deceive even the elect of God. He will also gather to himself all nations, so as to lead all peoples into his error.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Habakkuk.html'
source_title="Commentary on Habakkuk"
