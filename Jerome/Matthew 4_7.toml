[[commentary]]
quote='''
The false Scripture darts of the Devil He brands with the true shield of Scripture.

It should be noted, that the required texts are taken from the book of Deuteronomy only, that He might show the sacraments of the second Law.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25204.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
Jesus said to him: Again it is written: You shall not tempt the Lord your God. The false arrows of the devil, drawn from the Scriptures, he breaks with the true shields of the Scriptures. And it should be noted that he brought forward the necessary testimonies from Deuteronomy only, to show the mysteries of the second law.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
