[[commentary]]
quote='''
But what he says: "I conferred with them the Gospel which I preach among the Gentiles, but privately with those who seemed, lest perhaps I should run, or had run, in vain", can also be understood thus: that he conferred secretly with the apostles on the grace of evangelical freedom and the oldness of the abolished Law, on account of the multitude of believing Jews, who could not yet bear to hear that Christ is the fulfillment and end of the Law, and who, even in Paul's absence, had loudly declared at Jerusalem that he was running, or had run, in vain, since he thought that the old Law was not to be followed. Not that Paul feared that for seventeen years he had preached a false Gospel among the Gentiles, but so that he might show his predecessors that he was not running, nor had run, in vain, as they in their ignorance had supposed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
