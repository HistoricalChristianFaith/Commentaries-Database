[[commentary]]
quote='''
Nor is it surprising if you have despised the twofold way of salvation, when you have spurned fasting and fullness alike. If fasting pleases you, why did John displease you? If fullness, why the Son of Man? Of these you called the one a man with a demon, the other a glutton and a drunkard. Therefore, because you would not receive either discipline, wisdom has been justified by her children, that is, the dispensation and the doctrine of God; and I, who am the power of God and the wisdom of God, have been proved by my apostles, my children, to have acted justly, to whom the Father has revealed what he had hidden from the wise and from those who are prudent in their own eyes. In certain Gospels it reads: Wisdom has been justified by her works. For wisdom does not seek the testimony of the voice but of works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
