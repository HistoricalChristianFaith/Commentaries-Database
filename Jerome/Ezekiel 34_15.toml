[[commentary]]
quote='''
And it is an infinite promise and a hope of blessedness, when the Lord himself promises, saying: 'I will feed my sheep, and I will by no means entrust them to wicked shepherds, and I will make them lie down, says the Lord God, so that they may rest in the bosom of Abraham, Isaac and Jacob'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
