[[commentary]]
quote='''
And this shall be the greatest sin for the Egyptian, the Assyrian, the Chaldean, the Syrian, the Moabite and the Ammonite, if they are unwilling to go out from their lands and go up to Jerusalem, so that through the tabernacles they may pass into Jerusalem and find an eternal house, and cease to be men of other nations, and become Israelites in whom there is no guile. All these things, which we touch on in brief speech, the Jews and our judaizers, or rather not ours, since they are judaizers, hope will come to pass bodily, promising themselves, of course, both circumcision and marriages in the reign of a thousand years, so that the curse which is written may not be fulfilled in them: Cursed is the barren woman who does not bear seed in Israel, and: Blessed is he who has seed in Zion and household members in Jerusalem. If this is true, all the virgins whom the kingdom of a thousand years finds will lie under the curse and perpetual barrenness, or else they will marry so as to escape the curse.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
