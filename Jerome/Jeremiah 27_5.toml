[[commentary]]
quote='''
I made the earth and man and the beasts that are upon the face of the earth, by my great strength and by my outstretched arm, and I gave it to him who pleased in my eyes. Although this scripture speaks anthrōpopathōs [in human terms], in the way that we men can speak and understand, yet the 'strength' of God and his 'arm' is he of whom the Apostle also speaks: 'Christ the power of God and the wisdom of God', and Isaiah: Lord, who has believed our hearing, and to whom has the arm of the Lord been revealed? John the evangelist also writes: all things were made through him, and without him nothing was made. David too speaks in his song: by the word of the Lord the heavens were established, and all their power by the spirit of his mouth. And as for his saying: I gave it to him who pleased in my eyes, this signifies that all things have been granted to the human race through the grace of God. I, he says, made the earth and man and the beasts. The order is reversed; for in Genesis the living creatures are made first and man last, but here he names man first and afterwards the things that are subject to man.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
