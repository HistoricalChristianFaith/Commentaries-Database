[[commentary]]
quote='''
He speaks also especially to the sons of Zion, that they should exult and rejoice, not in any trifling thing, but in the Lord their God, who has given them the nourishment of righteousness, and, as the Seventy translated, and the early and the late rain, so that they may eat and be glad, and praise the name of the Lord their God, who has done wonders with them, and may by no means be confounded; and may know that the Lord God of Israel dwells in their midst, and besides him there is no other, because the Father is in the Son, and the Son in the Father, and his people will not be confounded forever. These things, according to the letter, since they were promised by the Lord, we believe to have come to pass, and the past barrenness to have been made up by new crops, so that whatever the locust, the cankerworm, and the blight, and the caterpillar had consumed, τροπικῶς (figuratively), was replenished in the following years.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
