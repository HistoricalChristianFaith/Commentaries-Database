[[commentary]]
quote='''
Therefore those who persecute me shall fall and shall be weak — or therefore they persecuted and could not understand —, they shall be greatly confounded, because they did not understand the reproach or the everlasting ignominy, which will never be blotted out. Because they persecuted, therefore they could not understand the prophetic word, and vehement confusion followed upon their ignorance; nor did they understand the everlasting ignominy which will hold them fast and will be blotted out by no forgetting. Let them say, then, what they will, the men once peaceable and those who guarded my side, and let them desire to deceive, provided that so great a vindication and such great rewards attend the righteous man and teacher of the Church after persecution.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
