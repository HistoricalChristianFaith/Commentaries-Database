[[commentary]]
quote='''
But I am the Lord your God from the land of Egypt. In place of which one reads in the LXX: But I am the Lord your God ÷ who make firm the heaven and create the earth, whose hand created all the host of heaven, and I did not show them to you, that you might walk after them. : And I brought you out of the land of Egypt. Since these words are not found in the Hebrew, and are rendered by none of the translators, and are not read in the ancient edition of the LXX either, they must be marked beforehand with an obelus; especially since their sense is plain. Let us therefore pass on to the rest, joining the preceding section to what follows:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
But I am the Lord your God from the land of Egypt, and you shall know no God besides me, and there is no savior but me.

I knew you in the wilderness, in the land of solitude, according to their pastures; and they were filled and were satisfied; they lifted up their heart and forgot me. LXX: But I am the Lord your God, and I brought you out of the land of Egypt; and you shall know no God but me, and there is no savior besides me. I was pasturing you in the desert, in an uninhabitable land, according to their pastures; and they were filled to satiety, and their hearts were lifted up; therefore they forgot me. He who had said above: Jacob fled into the region of Syria, and Israel served for a wife, and for a wife he kept watch; but by a prophet the Lord brought Israel out of Egypt, and by a prophet he was kept, now also recounts what he provided for them: I am the Lord your God, who brought you out of the land of Egypt, who commanded you through Moses: take heed lest perhaps you eat and be satisfied, and forget your God, who brought you out of the land of Egypt; for there is no other God besides me, and there is no other who is able to save.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
The heretics too the Lord brought out of the land of Egypt, out of the house of bondage, and out of the iron furnace, who at first served King Pharaoh and his captains; and he commanded them in the Church to know no other God except him who is the creator of all things and knows how to save those whom he made.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
