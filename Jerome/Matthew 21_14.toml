[[commentary]]
quote='''
For had He not overthrown the tables of the money-changers and the seats of them that sold doves, the blind and the lame would not have deserved that their wonted sight and power of motion should be restored to them in the temple.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And the blind and the lame came to him in the temple, and he healed them. Had he not overturned the tables of the money-changers and the chairs of those who sold doves, the blind and the lame would not have deserved to receive back their former light and their quick step.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
