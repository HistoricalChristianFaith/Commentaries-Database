[[commentary]]
quote='''
But when I have spoken to you, I will open your mouth, and you shall say to them: Thus says the Lord God: He who hears, let him hear, and he who refrains, let him refrain, because it is a provoking house. What we read in Ecclesiastes: A time to keep silent and a time to speak, is borne out in the prophetic word as well: that it belongs to the same wisdom both to keep silent and to speak according to the time, and to give fellow servants their rations in due season; whence Isaiah too says to the unbelieving people: 'I have kept silent; shall I keep silent forever? says the Lord'. He, therefore, who on account of the multitude of sins long kept his mouth shut, because he saw that some could be converted, of whom it is said: He who hears, let him hear, and he who from evil refrains, let him refrain and cease, for this reason, with his mouth opened, and not by his own will but by the Lord's command, speaks to the people. Now that which we have set down: He who hears, let him hear, and he who refrains, let him refrain, for which the Seventy translated: He who hears, let him hear, and he who is unbelieving, let him be unbelieving, the second edition of Aquila translated thus: He who hears shall be heard, and he who leaves shall be left; and the sense is: He who has, to him it shall be given; but he who has not, even what he seems to have shall be taken away from him.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
