[[commentary]]
quote='''
The apostle Paul, sifting this passage in a mystical disputation, writes to the Romans, joining together two testimonies, from Genesis and from Malachi: But Rebekah too, having conceived by one act of intercourse with Isaac our father. For when they were not yet born, nor had done anything good or evil, so that the purpose of God according to election might stand, not from works but from him who calls, it was said to her: The elder shall serve the younger; as it is written: Jacob I have loved, but Esau I have hated. For what is said: As it is written, refers both to the book of Genesis and to the prophet Malachi.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Malachi.html'
source_title="Commentary on Malachi"
