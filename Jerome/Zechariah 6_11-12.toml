
[[commentary]]
quote='''
And when you have made the crowns, you shall set one of them on the head of Joshua (Iesus, the same name as Jesus) son of Jehozadak, the high priest, and you shall speak to him: Thus says the Lord Almighty: Behold a man whose name is the Rising, which in Hebrew is called sema, written not with the letter sin but with sade. He is called the Rising, that is, ἀνατολὴ, or ἀναφύη, or βλάστημα, that is, shoot, for this reason: because he shall suddenly spring up of himself, and shall sprout from his own root in the likeness of a shoot; and this man shall build the temple of the Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
