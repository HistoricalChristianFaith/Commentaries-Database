[[commentary]]
quote='''
But as if a woman should despise her lover, so has the house of Israel despised me, says the Lord. It is the voice of Christ toward the people of the Jews, to whom he had said: I will set you among sons and give you a desirable land, and you will call me father and will not cease to walk after me. 'As,' he says, 'a woman despises not a husband but a lover, once she has been joined with him, when she sees him serving her lust and the law of nature reversed in her regard, by which she had once been subject to a husband, as the Lord says: and toward you shall be her turning, so the house of Israel, that is, the people of the Jews, has despised the Lord, the Savior, to its own ruin.'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
