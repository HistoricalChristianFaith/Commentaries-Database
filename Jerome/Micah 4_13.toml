[[commentary]]
quote='''
Now, as to what he signifies by saying: And you shall break in pieces many peoples, and you shall consecrate to the Lord their multitude, and their might to the Lord of the whole earth. Let us read Numbers, and Joshua son of Nun, and the first book of Kingdoms (1 Samuel), and we shall see how, from the subjugated nations, when all had perished by the edge of the sword, gold and silver, and a fixed number of the spoil, of men as well as of beasts, was consecrated to the Lord. In short, Achar too, who stole something from the accursed thing of Jericho, troubled the people, and from his sin a name was given to the valley, emec achor, that is, the valley of tumult, or of disturbances. And that you may know that, according to the LXX translators, who said: You shall consecrate to the Lord their multitude, and their might to the Lord of the whole earth, the consecration ought to be taken in a good sense: Theodotion rendered gifts for multitude; the Fifth Edition, profit, that is, ὠφέλειαν; Symmachus, gain, that is, τὸ κέρδος αὐτῶν.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
