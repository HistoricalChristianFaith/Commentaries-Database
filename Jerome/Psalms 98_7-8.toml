[[commentary]]
quote='''
The mountains shall exult in the sight of the Lord. What likeness is there between rivers and mountains? But since he speaks of the perfect saints, he did not say, 'the little streams shall clap their hands together,' but, 'The rivers shall clap their hands together.' See the order. Let the sea be moved, and the whole world: the rivers clap their hands together, his saints: the mountains no less, who have attained to the highest righteousness. Let us say it also in another way. Let the sea be moved, which before had been unmoved — let it be moved at the coming of Christ. Let the sea be moved: we have already said, this is the law of Moses. The rivers clap their hands together: this is the prophets. The mountains shall exult before the sight of the Lord: this is the apostles.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_025.html'
source_title="Homily 25, on Psalm 97"
