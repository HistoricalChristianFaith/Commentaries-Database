[[commentary]]
quote='''
But those who have been converted to the Lord will receive the reward of their conversion, that they may sit in his shade and say: Under his shade I rested and sat, and his fruit is sweet in my mouth. And when they have sat in his shade, those who before had been dead will live; or, according to the Seventy, they will drink and be inebriated with wheat, that is, with an abundance of all things. That inebriation here signifies not the overturning of the mind but a plenty of all things, that little verse declares, saying: You have visited the earth and inebriated it. And the banquet of Joseph, at which he is said to have inebriated his brothers. And the Lord, speaking to the apostles: Eat, friends, and drink, and be inebriated, brothers. Or, because the Lord himself is the grain and the vine, whoever believes in him is said to be inebriated. Finally there follows: And it will flower like the vine, his memorial like the wine of Lebanon. Now we can call wine of Lebanon wine mixed and seasoned with incense, so that it has a most sweet fragrance; or the wine of Lebanon is the wine poured out to the Lord in the temple, of which we read in Zechariah under the name of Lebanon: Open your gates, O Lebanon.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
