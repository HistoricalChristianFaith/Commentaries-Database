[[commentary]]
quote='''
A light runner unfolding her ways, a wild ass accustomed to the wilderness, in the desire of her soul has drawn in the wind of her love; none shall turn her away. All who seek her shall not fail; in her monthly courses they shall find her. LXX: toward evening her voice howled, she widened her ways over the waters of the wilderness, in the desire of her soul she was borne by the spirit, she was handed over. Who will turn her back? All who seek her shall not toil; in her humiliation they will find her. In this passage the Seventy's edition disagrees greatly with the Hebrew truth; yet each has its own sense. Because above she said: I am not defiled, and he was speaking as if to a woman who had behaved shamefully, he describes her fornication. 'As', he says, 'a light roe' — which we called 'runner' in the common gender, and which Aquila, Symmachus and Theodotion translated more expressively dromas kouphē [a light runner, in the feminine] — 'unfolds her ways and is carried swiftly to the pastures, and as a wild ass accustomed to the wilderness draws in, in the desire of her soul, the wind or spirit of her love' — for among the Hebrews both 'wind' and 'spirit' are called by one name, 'ruha' —, 'so too Israel, or Jerusalem, was borne with all her impetus toward the desire of lust and burned with every love of idols, and there is no one who can turn her from this impetus by his warnings, not that the inability of the prophets brought this about, but the perverse malice of her who desires'. Whoever, he says, seek her will not toil greatly; in her monthly courses and in her uncleanness they will find her, for which Aquila translated neomēnian, that is, 'the Kalends', Symmachus 'month', the Seventy and Theodotion 'humiliation'. But according to the Seventy this is the sense: the harlot Jerusalem, like that woman who is described in Proverbs, toward evening howled with her voice and provoked lovers to lust, opened the ways of her shamefulness, and spread her feet for every passer-by. And there was a place having the pleasantness of flowing waters, which becomes more delightful when there is solitude all around, so that no one sees her fornicating. In the desire, he says, of her soul epneumatophoreito [she was borne along by a spirit], or by a perverse spirit she was led, or she drew the refreshment of love, or at any rate she sang the songs of her shamefulness. She was handed over, he says, to her vices and to lust; no one will be able to turn her back. All who wish to find her will find her in the humiliation of her shamefulness, so that she can never be sated with the love of pleasure.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
