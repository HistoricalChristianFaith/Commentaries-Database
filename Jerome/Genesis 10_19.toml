[[commentary]]
quote='''
And the boundary of the Canaanites was from Sidon until you come to Gerar, as far as Gaza, for those going to Sodom and Gomorrah and Adama and Seboim, as far as Lecem. Since the other cities, namely Sidon and Gerar and Sodom and Gomorrah and Adama and Seboim, are known to all, this alone seems worth noting: that Lece is the very place which is now called Callirhoe, where hot waters burst forth and flow down into the Dead Sea.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHebrew%2520Questions%2520on%2520Genesis.html'
source_title="Hebrew Questions on Genesis"

[[commentary]]
quote='''
Gerara [Gerar]: he saw rumination, or wall. But it must be known that gerara is interpreted sojourning, while gedera is wall, or hedge.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FOn%2520Hebrew%2520Names.html'
source_title="On Hebrew Names, On Genesis"
