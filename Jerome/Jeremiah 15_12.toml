[[commentary]]
quote='''
Shall iron be leagued with iron from the north, and bronze? Symmachus: Shall iron harm iron from the north, and bronze? LXX and Theodotion: If iron will know, and a covering of bronze? The cause of the variety is clear; for the word 'iare', which is written in the present place, owing to the ambiguity of its pronunciation means both 'friendship' and 'malice'; and if, in place of the letter 'res', which is similar to the letter 'daleth', 'daleth' is read, it signifies 'knowledge and understanding'. What is said is to be understood thus: 'Do not grieve that the people is your enemy; for when you announce hard things, one who is hard cannot love you': either the Babylonians, who come from the north and are the hardest iron, will not be able to be joined in friendship with this people, which is harder and untamed after the likeness of bronze; or the hardest iron, that is, the people of Israel, is unworthy of the knowledge of God, since it has come to such malice that it is encased in a harder metal, bronze.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
