[[commentary]]
quote='''
And he brought me to the gate which looked toward the north, and he measured according to the measures above its cell, its front and its vestibule and its windows round about, in length fifty cubits, in breadth twenty-five cubits. Its vestibule looked into the outer court, and a carving of palms on its front on this side and on that; its ascent was by eight steps. And by each chamber a door at the entrances of the gates; there they washed the holocaust. And in the vestibule of the gate two tables on this side and two tables on that, that the holocaust may be sacrificed upon them, and for sin and for trespass. And at the outer side which goes up to the door of the gate that leads toward the north, two tables; and at the other side, before the vestibule of the gate, two tables. Four tables on this side and four tables on that: along the sides of the gate there were eight tables, upon which they sacrificed. And four tables for the holocaust, built of squared stones, of a length of one cubit and a half, and a breadth of one cubit and a half, and a height of one cubit, upon which they are to put the vessels in which the holocaust and the victims are sacrificed; and their lips of one handbreadth, bent back inward round about, and upon the tables the flesh of the oblation. In this testimony the Hebrew truth disagrees greatly with the edition of the Seventy translators: for what we have said: There they washed the holocaust. And in the vestibule of the gate two tables on this side, and again: That the holocaust may be sacrificed upon them, and for sin, is not found in the Seventy, but in most manuscripts it has been added from Theodotion; again, where we said: And their lips of one handbreadth, bent back inward round about, the Seventy translated: And having a 'gisum' of a handbreadth, hewn inward round about — which word, whether it is Hebrew or Greek, we cannot know, except only this, that in place of 'gisum' Symmachus and Theodotion translated 'lips', the first edition of Aquila ἐπιστάσεις [ledges] in the plural number, the second 'lips', in place of which in the Hebrew there is 'asaphanaim' —; and where we said: And upon the tables the flesh of the oblation, the Seventy put of their own: And on the tables, coverings above, that they might be covered from rain and from drought; and as for what they rendered with Hebrew names, 'thee' and 'aeleu' and 'aelamoth' and 'aelam', what it signifies we have both advised above, and our translation, set over against it, can show, nor is there any need to advise the reader often about this and to distrust his prudence and diligence.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
