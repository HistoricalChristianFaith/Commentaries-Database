[[commentary]]
quote='''
In the morning sow your seed, and toward evening do not slacken your hand: for you do not know which may please, this or that. And if both, it is good as though one; and the light is sweet, and it is good for the eyes to see the sun; for if a man lives many years, let him rejoice in all of them, and let him remember the days of darkness, for they will be very many. All that is to come is vanity. Do not choose to whom you should do good; but also, when you have done good, never cease from good work. Let the evening find your morning justice, and let the rising sun heap up more upon your evening mercy. For it is uncertain which work pleases God more, and from which the fruit of justice is being prepared for you. And it can happen that not one but both please God. Otherwise: In youth and in old age alike let your labor be equal. And do not say: While I could, I labored; in old age I ought to rest. For you do not know whether you please God in young manhood or in advanced age. Nor does frugality in youth profit, if old age is passed in luxury. For on whatever day the just man goes astray, his old acts of justice will not be able to free him from death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ecclesiastes.html'
source_title="Commentary on Ecclesiastes"
