[[commentary]]
quote='''
Now therefore says the Lord: Turn to me with your whole heart, in fasting, and in weeping and in mourning; and rend your hearts, and not your garments, and turn to the Lord your God, for he is kind and merciful, patient and of much mercy, and placable over evil; who knows if he will turn and pardon, and leave behind him a blessing, sacrifice and libation to the Lord our God? LXX: And now says the Lord our God: Turn to me from your whole heart, in fasting, and in weeping and in mourning; and rend your hearts, and not your garments; and turn to the Lord your God, for he is merciful and compassionate, patient and of much mercy, and repenting over evils; who knows if he will return and repent, and leave behind him a blessing, sacrifice and libation to the Lord our God? The preceding section, from the place where it is written: Blow the trumpet in Zion, wail on my holy mountain; let all the inhabitants of the land be troubled, up to the place where we read: Great is the day of the Lord and very terrible, who shall endure it? announces, by the figure of locusts, the coming of the Chaldeans, and what evils are to come upon the people. Now he calls them to repentance, and exhorts them to turn to the Lord, so that, corrected with their whole mind, they may not suffer what the Lord threatens; and the sense is: All that is contained in the preceding discourse I spoke for this reason, to terrify you with my threat. Therefore turn to me with your whole heart, and show the repentance of your mind by fasting and weeping and mourning; so that, fasting now, you may afterwards be filled, weeping now, you may afterwards laugh, mourning now, you may afterwards be comforted.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Joel.html'
source_title="Commentary on Joel"
