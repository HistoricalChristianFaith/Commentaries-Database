[[commentary]]
quote='''
That we may understand it so, Stephen, the first martyr of the Gospel, worthy of his name, relates in the history of the apostles: And they made a calf in those days, and offered a victim to the image, and rejoiced in the works of their hands. But God turned, and gave them up to serve the host of heaven, as it is written in the book of the prophets: Did you offer sacrificial beasts or victims to me for forty years in the desert, house of Israel? And you took up the tabernacle of Moloch, and the star of your god Rhepham, the figures which you made to worship them, and I will carry you over beyond Babylon. Nor must the first martyr be thought to have erred because, where it is written in the prophet, Beyond Damascus, he said, Beyond Babylon. For he set down the sense rather than the word, since they were led beyond Damascus into Babylon, or beyond Babylon. But in the place where Luke put Μολὸχ and where in the Hebrew is written Melchechem, Aquila and the LXX translated Μελχὸμ, Symmachus and Theodotion, of your king. Likewise, where Repham is read in the Seventy, Aquila and Symmachus, transferring the Hebrew word itself, put Chion, Theodotion ἀμαύρωσιν, that is, obscurity. Again, for Sochoth Aquila translated συσκιασμοὺς, that is, tabernacles, Symmachus and the Seventy, tabernacle, Theodotion, vision. And this is to be observed in all the holy Scriptures: that the apostles and apostolic men, in setting down testimonies from the Old Testament, consider not the words but the sense, and do not tread in the same footprints of the expressions, provided they do not depart from the meaning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
