[[commentary]]
quote='''
So that their land should become a desolation and an everlasting hissing; everyone who passes by it shall be astonished and shall shake his head. 'And because they have forsaken,' he says, 'the worship of God and have followed the depraved paths of idolatry, therefore their land has been reduced to a wilderness and to a wonder and a hissing to all, so that those who saw the land and city, once most flourishing, collapsed into a desert and ashes should marvel and be astonished and show the confusion of their soul by the gesture of their body'; for this is what it is to shake the head and to show the astonishment of the mind by hissing. And this we understand to have been fulfilled more fully and more correctly after the coming of the Lord, when none of the Jews is permitted by law to enter the land and the once holy city; but when they come to mourn, they marvel at and weep over the prophecies of the prophets fulfilled in deed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
