[[commentary]]
quote='''
According to tropology we can say these things also of the churchman, to whom God has given speech and wisdom, so that by his disputation he may overturn all the sects contrary to the truth, as holy Scripture records of Stephen too (Acts 6), that no one could resist his wisdom; and so that he may subject kings, that is, the patriarchs of the several heresies, to his power, and may open and break what before seemed shut fast by the art of dialectic, and may bring into the open the secrets of the heretics, overcoming and refuting them, so that they may come to know the secrets of Christ, in whom are hidden all the treasures of wisdom and knowledge (Col 2). Such a man God calls by his own name, because he is the defender of his child Jacob and of his chosen Israel. Him he takes up and likens to his own word; and he must beware lest he think that what he speaks is his own, but must refer all to the glory of the giver, lest he too deserve to hear: I girded you, and you have not known me. For when, equipped with the armor of the Apostle, he has taught all that there is no other God but one, who is the God of Jacob and Israel, Marcion will be confounded, who understands two gods, one good and the other just, one the founder of things invisible, the other of things visible; of whom the former makes light, the latter darkness, the one peace, the other evil: whereas the one and the same God has founded both according to the diversity of merits.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
