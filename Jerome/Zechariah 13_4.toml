[[commentary]]
quote='''
And it shall be on that day, the prophets shall be confounded, each one by his vision when he has prophesied, nor shall they be covered with a cloak of sackcloth in order to lie. But he shall say: I am not a prophet, I am a man, a tiller of the ground, for Adam has been my example from my youth. And it shall be said to him: What are these wounds in the middle of your hands? And he shall say: With these I was wounded in the house of those who loved me. LXX: And it shall be on that day, the prophets shall be confounded, each one by his vision when he has prophesied, and they shall put on a skin of haircloth because they have lied; and he shall say: I am not a prophet, for a man begot me from my youth. And I will say to him: What are these wounds in the middle of your hands? And he shall say: Those with which I was struck in the house of the one who loved me. Whoever has attempted to prophesy, and has been condemned by the judgment of his parents, and whose prophecy has been proved false by the contrary outcome of events, shall be confounded by his vision, and shall no longer be covered with haircloth in order to lie. For this was the habit of the prophets: that when they were calling the people to repentance, they put on haircloth. Hence Isaiah too is commanded to take the sackcloth from his loins and to walk naked; for it was by no means a time of repentance, but of impending captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
What is written, Nor shall they be covered with a cloak of sackcloth in order to lie, the Hebrews expound thus: and they shall not be filled with the demonic spirit, those whom we read of in Isaiah as τριχιῶντας, that is, hairy ones, lest on this occasion of a feigned habit they belie the utterances of God within them, or deny God. For Chaesu can be interpreted both 'they shall lie' and 'they shall deny'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
