[[commentary]]
quote='''
Hence it is to be understood that the Lord was in so great poverty, and so far from having courted any one, that He had found in all that city neither entertainer, nor abode, but He made His home in a little village, in the house of Lazarus and his sisters; for their village was Bethany; and it follows, and He lodged there.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252021.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And leaving them, he went out outside the city to Bethany and stayed there. He left the unbelieving and, going out of the city of those who contradicted him, went to Bethany, which is interpreted house of obedience, already then prefiguring the calling of the Gentiles; and he stayed there because he could not remain in Israel. This too must be understood: that he was of such poverty and flattered no one to such a degree that in the greatest city he found no host, no lodging, but lived in a tiny field with Lazarus and his sisters; for Bethany is their village.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
