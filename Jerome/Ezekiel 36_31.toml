[[commentary]]
quote='''
That penitents may have their due it is enough for them to feel shame instead of all other punishment.
'''
source_url='https://www.newadvent.org/fathers/30092.htm'
source_title="Against Jovinianus 2.31"

[[commentary]]
quote='''
And they will remember their most evil ways and their pursuits that were not good, by which they had offended God, and their iniquities and their crimes, by which they had formerly gone astray, will displease them.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
