[[commentary]]
quote='''
And as the lion and the lion's whelp thus range among the beasts and among the sheep, the hand of God is exalted over those who before afflicted either God or the remnant of Israel. And all his enemies will be destroyed, not that the enemies perish and cease to exist, but that they perish in that they are enemies. As it is written to the Thessalonians: Whom the Lord Jesus will kill with the spirit of his mouth. This killing signifies not abolition but the cessation of the most wicked life by which they had lived badly before. In short, he adds: And he will destroy him by the brightness of his coming. But he would never destroy him if killing meant abolition, since he would already have ceased to exist; so here too the consuming of the enemies is to be understood according to the Proverbs of Solomon, in which it is written: Destruction will lodge with the ungodly: it will not be perpetual, it will not reduce them to nothing, but it will lodge with them as long as it takes for the ungodliness that is in them to be consumed. For God created man that he should not perish, and he did not make death.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
