[[commentary]]
quote='''
And lest we should think that some other Canaan is to be understood, he states more plainly who this Canaan is. Ephraim said: Yet I have become rich; and the sense is: it makes no difference whence I possess it, so long as I possess it. Very many suffer from this disease, of whom it is written: Riches gathered unjustly will be vomited up. For the ransom of a man's soul is his own riches. Hence we are commanded to make ourselves friends of the unrighteous mammon, who can receive us into the eternal tabernacles. But Ephraim, who glories and says: Yet I have become rich, I have found an idol for myself, or ἀνωφελὲς, that is, auen, which does not profit its possessor, has sweated with vain labor. Just as the belly is god to the glutton and the luxurious, so the avaricious man too worships the idol of gold, and says in his heart: I have found what I was seeking; but he will hear: Fool, this night your soul will be snatched from you; and the things you have prepared, whose will they be? And when once, I will not say the glitter, but the blindness of riches has seized his eyes, he says: all my labors will not find my iniquity, in which I have sinned. And the sense is: whatever I sin, if I have riches, it cannot be imputed to me by those who need my help, according to what is written: And he who does iniquitous things is blessed. For the rich have many friends.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"

[[commentary]]
quote='''
The poor churchman is oppressed by the wordiness and the subtleties of the heretics, who, after they have deceived some, are accustomed to say: we have become rich, we have a very great multitude; a crowd of disciples follows us; we have found an idol, or refreshment, for ourselves. For heresies are put together chiefly for this reason, that they may devour the houses of widows, who are always learning and never arrive at the knowledge of the truth. And beautifully: I have found, he says, an idol for myself. For all the fictions of the heretics are idols and images of the Gentiles; nor do they differ much in impiety, though they seem to differ in name. And they are accustomed to say: whatever I do, whatever I perform, cannot be imputed to me; for I have my riches, the arguments of the philosophers; I have a multitude of people, and whoever beholds it will not think that I sin.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
