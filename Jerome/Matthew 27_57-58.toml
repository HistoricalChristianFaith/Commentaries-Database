[[commentary]]
quote='''
He is described as rich, not out of any ambition on the part of the writer to represent so noble and rich a man as Jesus' disciple, but to show how he was able to obtain the body of Jesus from Pilate. For poor and unknown individuals would not have dared to approach Pilate, the representative of Roman power, and ask the body of a crucified malefactor. In another Gospel this Joseph is called a counsellor; and it is supposed that the first Psalm has reference to him, Blessed is the man that walketh not in the counsel of the ungodly. (Ps. 1:1.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
When it was evening, there came a certain rich man from Arimathea named Joseph, who himself also was a disciple of Jesus. He is said to be rich, not out of the boastfulness of the writer, as if to report that a noble and very wealthy man was a disciple of Jesus, but to show the reason why he was able to obtain the body of Jesus from Pilate. For it was not for a poor and unknown man to approach Pilate, the governor of the Roman power, and obtain the body of one crucified. In another evangelist this Joseph is called βουλευτής, that is, counselor, and some think that the first psalm was composed about him: Blessed is the man who has not walked in the counsel of the impious, and the rest.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
