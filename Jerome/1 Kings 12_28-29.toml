[[commentary]]
quote='''
Look at all the heretics: who have forsaken Jerusalem, who have forsaken the temple of God, who dwell in Samaria — where did they make the golden calves? In Bethel and in Dan. And see what he says: they made golden calves in Bethel, in the house of God. In the house of God they became idolaters. And they made that thing in Dan, that is, unto their own judgment and unto their condemnation. They forsook the house of the Lord, and they think of nothing else but gold.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_011.html'
source_title="Homily 11, on Psalm 77"
