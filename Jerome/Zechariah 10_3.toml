[[commentary]]
quote='''
My fury is angered against the shepherds, and I will visit upon the he-goats; for the Lord of hosts has visited his flock, the house of Judah, and has made them like the horse of his glory in war. From him the corner, from him the peg, from him the bow of battle, from him shall go forth every exactor together; and they shall be like mighty men treading down the mire of the streets in battle, and they shall fight, because the Lord is with them. LXX: My fury is stirred up against the shepherds, and I will visit upon the lambs; and the Lord God Almighty will visit his flock, the house of Judah, and will make them like his comely horse in battle; and from him he looked, and from him he set, and from him the bow in fury, there shall go forth everyone who goes forth together, and they shall be like warriors treading down the mire of the streets in battle, and they shall be made ready, because the Lord is with them. In this place too the Jews have a twofold exposition. For some think that all of it is to be fulfilled at the coming of the Christ; others, that it has already been fulfilled under the Maccabees. And this is their explanation of the things the Lord promises: the Lord was angered against the shepherds, both the princes and the priests, and he visited upon the he-goats, that is, the people, according to that which is written: My people has become a lost flock, the shepherds have cast them out, so that the disciples were punished for the fault of their masters; not by the injustice of a judge who repays the sins of the fathers upon the sons, but because, when those men sinned, the people applauded along with them. And then indeed the Lord visited his he-goats, or his fattest lambs, and, according to the Seventy, caused them to be dried up with drought. But afterwards the Lord Almighty visited his flock, the house of Judah; for he raised up Judas Maccabeus, and the others descended from him, against the generals of Antiochus, and made them like the horse of his glory in battle, that is, those who were begotten of his stock; for they oppressed the Macedonians for a long time.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
[[commentary]]
quote='''
Our writers, however, refer these things to the times of persecution, because for the fault of the priests the people too is often handed over to its adversaries; and yet the Lord Almighty afterwards visits his flock, the house of Judah, which confesses God both in word and in mind, and makes them like the horse of his glory in war, of which the saints say: Mount upon your horses, and your riding is salvation.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
