[[commentary]]
quote='''
And when they refuse to take the cup from the hand, to drink, you shall say to them: Thus says the Lord of hosts: Drinking you shall drink; for behold, in the city in which my name has been invoked, I am beginning to afflict; and will you, as though innocent, be exempt — or and will you be clean with cleanness — ? you shall not be exempt, or you shall not be clean. He covertly shows that those who have refused to do the command of God willingly will undergo it by necessity, and will hear: drinking you shall drink. 'Whether you will it', he says, 'or not, the sentence of God must be fulfilled. For if the city of Jerusalem, in which the name of God was known, as the prophet says: God is known in Judea; his name is great in Israel, drank the undiluted cup, the cup of fury, how much more will you not be clean, who worship idols in place of the name of God!'
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
