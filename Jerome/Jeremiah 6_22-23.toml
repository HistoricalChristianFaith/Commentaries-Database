[[commentary]]
quote='''
Thus says the Lord: Behold, a people comes from the land of the north, and a great nation will rise from the ends of the earth. It will seize arrow and shield — or zibynnam [spear] —; it is cruel — or shameless — and will not have mercy; its voice will sound like the sea, and they will mount upon horses, prepared like a man for battle against you, daughter of Zion. This is properly prophesied of the Babylonians, who are to come against the people of Jerusalem; and the whole array of their armor and the onset of the combatants is described, so that, shaken by the terror of the voice, they may do repentance and appease a most merciful God. Finally, he gives occasion for entreaty when he says: against you, daughter of Zion. We may apply this testimony, in a transferred sense, to a time of persecution, when the whole rage of the devil is stirred up against us, and there is no mercy, and like the waves of a most violent sea they overwhelm those who resist.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
