[[commentary]]
quote='''
As we read in another Evangelist, they had no opportunity of taking food because of the thronging of the multitude, and therefore they hungred as men. That they rub the ears of corn in their hands, and with them satisfy themselves, is a proof of an austere life, and of men who needed not prepared meats, but sought only simple food.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252012.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
At that time Jesus went through the sown fields on the Sabbath, and his disciples, being hungry, began to pluck ears of grain and to eat. As we read also in another evangelist, because of the excessive importunity they did not even have room to eat, and so, being men, they were hungry. But that they rub the ears of the crops in their hands and so relieve their want of food is a sign of a more austere life, of men who seek not prepared banquets but simple foods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
