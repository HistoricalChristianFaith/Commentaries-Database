[[commentary]]
quote='''
All that we have said according to the truth of the history, let us now transfer, according to the LXX translators, to the cloud of allegory. House of Israel, you who have withdrawn from me, who trust in the mountain of Samaria, who have gathered the vintage of the firstfruits of the nations, pass over and see, and go on to the very many walls, for this is what Hamath Rabba means; and from there go gently down into the winepress of those who fall while drinking: for this is what Gath and the Philistines signify. And contemplate everything, and especially the best kingdoms, or the best cities out of all the kingdoms; and consider whether their borders are more than yours. For if we wish to treat it in the mind and to examine the philosophy of all the nations, of the Egyptians, the Indians and the Persians, we shall find their borders narrower than the borders of the holy Scriptures: Into all indeed the earth their sound has gone out, and their words to the ends of the world.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
