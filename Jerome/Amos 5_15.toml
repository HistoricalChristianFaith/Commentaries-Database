[[commentary]]
quote='''
Nor is it enough to seek good and not to seek evil, unless you have ἐπιείκησιν (equity) in both, so that first you hate evil and then love good. He hates evil who is not only not overcome by pleasure, but hates the works of pleasure; and he loves good who does what is good not unwillingly, nor from necessity or fear of the laws, but because it is good, so that he has as the reward of his good work his own conscience and the love which he bears toward the good. Hence the Apostle too says: God loves, he says, a cheerful giver. For not every almsgiving pleases God, but only that which is offered with cheerfulness. And when you have hated evil and loved good, establish judgment in the gates, of which it was spoken above, so that, iniquity being driven out, truth may return. And if you do this, perhaps the Lord God Almighty will have mercy on the remnant of Joseph, those of the tribe of Ephraim and of the ten tribes who were able to escape captivity.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
