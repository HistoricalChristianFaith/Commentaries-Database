[[commentary]]
quote='''
Do not fear, then, Jacob and Israel, because I will pour out waters upon the thirsty and the dry ground, of which it has often been said: And I will pour out, or I will put my spirit upon your seed, and my blessing upon your offspring, which will be born again of water and the Holy Spirit in baptism. This the Savior also promised in the Gospel, saying: If anyone thirsts, let him come to me and drink. And at once it is added: But this he said of the Holy Spirit, whom those who believed were to receive (John 7).
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
