[[commentary]]
quote='''
But since our hope is certain and the vows of the Jews are empty, let us now weave the present and last chapter according to the former understanding, and bring forward a testimony from Jesus son of Sirach: He who throws a stone on high throws it upon his own head. For since Zion and Jerusalem are set on high, whoever disparages Zion and Jerusalem and throws at her the stones of insults hurls them upon his own head, and his reproach will return upon his own head: And his pain and his iniquity will come down upon his crown.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zephaniah.html'
source_title="Commentary on Zephaniah"
