[[commentary]]
quote='''
He intimates God's great power, who, as he made all things out of nothing, can make men out of the hardest stone.

These stones signify the Gentiles because of their hardness of heart. See Ezekiel, I will take away from you the heart of stone, and give you the heart of flesh. Stone is emblematic of hardness, flesh of softness.

Or, the preaching of the Gospel is meant, as the Prophet Jeremiah also compares the Word of the Lord to an axe cleaving the rock. (Jer. 23:29.)
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%25203.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
God is able from these stones to raise up sons to Abraham. He calls the heathen stones because of the hardness of their heart. Read Ezekiel: I will take away, he says, from you the heart of stone, and I will give a heart of flesh. In stone hardness is shown, in flesh softness; or else he simply indicates the power of God, that he who made all things out of nothing can also bring forth a people from the hardest rocks.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
