[[commentary]]
quote='''
And I will bring them upon this land and upon its inhabitants and upon all the nations that are round about it, and I will slay them and make them an astonishment and a hissing and everlasting desolations. These are the rewards of those who despise the words of God and refuse to hear them; whatever evil, therefore, is brought upon us, our sins have brought about. And just as all the nations were then brought against Jerusalem, so today they are brought against the negligent Church, that he may slay them and make them an astonishment and a hissing and everlasting desolations, so that they may be an example and a marvel to all. Now hissing is a sign of marvel and astonishment, and everlasting desolation is found in those who do not have God as their protector.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
