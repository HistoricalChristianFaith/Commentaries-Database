
[[commentary]]
quote='''
And the prophet is commanded, after he has placed the crown, or the crowns, upon the head of Joshua son of Jehozadak, the high priest, to speak to him and say: Thus says the Lord: Behold a man, the Rising is his name, and beneath him it shall rise, and the rest. We do not divide Jesus, nor can we make two persons in one person, but he who is called Jesus because he saved the world is himself also called the Rising, because in his days justice has risen. And it is sung in the psalm: Truth has risen from the earth, because, begotten from a virgin's womb at the consummation of the ages, he said: I am the truth, and he came at the last hour, according to the epistle of John, who says: Little children, it is now the last hour, in which he hired for a denarius the people of the nations, who were standing and doing nothing, and sent them to the vineyard. Otherwise, if he becomes different according to the diversity of names, the shepherd will be one, the ram another, the lamb another, the door another, the stone of stumbling and the rock of offense another. He, therefore, who has been crowned with our virtues shall rise and shall be called the Rising. To him the Father said: You are my Son, today I have begotten you.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
