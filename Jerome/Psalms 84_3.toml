[[commentary]]
quote='''
For indeed the sparrow has found itself a home, and the turtledove a nest for itself where it may place its young. For the moment let us interpret it simply. See what he says. I desire, O Lord, your eternal tabernacles: my soul longs and faints for the courts of the Lord: I desire to have some seat and little nest for my soul and my body. The birds which wander freely here and there, yet after they have flown, have a place and little nests where they may rest: how much more ought my soul and my flesh to prepare for themselves a place, where they may be able to rest? Now let us ascend to something higher. "In the Lord I trust: how do you say to my soul, Migrate to the mountains like a sparrow?" See therefore, that no one migrates to the mountains, except him who is a sparrow. And the turtledove a nest for itself. This is the turtledove, of which he says in the Song of Songs: "The voice of the turtledove has been heard in our land." The turtledove a nest for itself. The turtledove is an animal of chastity, the turtledove does not dwell in low places, but always makes its nests for itself in the lofty trees. As therefore the sparrow and the turtledove, most chaste birds, make their nests for themselves in the higher places, so therefore the tabernacles and the courts and the house are not on this low earth, but on high, that is, in the kingdoms of heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_016.html'
source_title="Homily 16, on Psalm 83"

[[commentary]]
quote='''
For indeed the sparrow has found itself a house, and the turtledove a nest where she may lay her young. This is what the Lord says in the Gospel: "The foxes have holes, and the birds of the air have nests." For indeed the sparrow has found itself a house. He gave a comparison from an everyday example. Because he had said, How beloved are your tabernacles, which my soul longs for, and my flesh desires the kingdom of heaven; he gives a comparison, and says: The birds are free, and although they wander through the air, yet they remember their nests, and return to them. If, then, sparrows seek out their nests, why should the human soul not seek the dwellings prepared for it by the Lord?

Your altars, O Lord of hosts. What is to be understood by, For indeed the sparrow has found itself a house, and the turtledove a nest where she may lay her young: your altars, O Lord of hosts? What is the connection? It hangs upon what came before. My soul longs and faints for the courts of the Lord: your altars, O Lord of hosts. John in the Apocalypse saw the altar of the Lord, beneath which were the souls of the righteous. For he says thus: "I saw beneath the altar of the Lord the souls of those slain for the word of the Lord and the testimony of Jesus." They were beneath the altar of God, because they had been offered up in martyrdom for Christ; for the victim of the Lord and Savior deserved to be beneath the altar in heaven.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_063.html'
source_title="Homily 63, on Psalm 83 (Alternate Series)"
