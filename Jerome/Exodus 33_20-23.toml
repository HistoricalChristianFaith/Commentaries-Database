[[commentary]]
quote='''
This that he says, he hath girded himself, must signify some mystery. When we are ungirt, our tunic is let down all the way to the feet: unless it has been drawn up by a belt, the whole garment hangs down. So then, we too, because we could not bear the full strength of the Lord, he girded his majesty with flesh. This is what is said in another place: 'Thou shalt not be able to see my face; thou shalt see my back parts.' It is also said of Elijah in the book of Kings that he stood on Mount Sinai in a cleft, and thus saw the Lord passing by. See how, set in the cleft, he is said to have seen the back parts of the Lord and Savior. If the Lord and Savior is interpreted as the rock... 'And Christ,' says the apostle, 'was the rock.' For when we are set in the cleft of the rock, we behold God through the flesh. Why have I said all this? Because we embrace the following verse also with the same exposition: he is clothed with beauty, and hath girded himself. Just as the Lord and Savior is seen through the cleft of the rock, so too through the girdle his majesty is beheld.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_070.html'
source_title="Homily 70, on Psalm 92 (Alternate Series)"
