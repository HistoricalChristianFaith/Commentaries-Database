[[commentary]]
quote='''
God therefore, who is rich in mercy, and rich because of his love with which he loved the human race (and a love not simple but great), when we were dead because of our trespasses, made us alive; and not only made us alive (for this was too little for his goodness and greatness), but made us alive with Christ Jesus, granting us to have one and the same life with Christ.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
