[[commentary]]
quote='''
Having described the worst shepherd, foolish and unskilled, the prophetic discourse turns to the shepherd himself: O shepherd and idol. So wicked is the shepherd that he is called not a worshiper of idols but himself an idol, since he calls himself God and wishes to be adored by all. He forsook the flock to be devoured by beasts, the flock which the Lord had guarded for so long a time. A sword upon his arm, and his strength, and upon his right eye, by which he boasted that he keenly discerned the mysteries of God and saw more than all the prophets before him had seen, so much so that he called himself the Son of God. And that sword is the one of which we both learn above and shall now speak in part, the one of which Isaiah too speaks: My sword has been made drunk in heaven. And it is for this reason that the sword of the Lord will be upon his arm and upon his right eye, that his strength and all the boasting of his might may be dried up with withering, and the knowledge which he promised himself under a false name may be darkened with eternal darkness.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
