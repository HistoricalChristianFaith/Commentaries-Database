[[commentary]]
quote='''
And his sons, that is, the apostles, were as Abraham, Isaac and Jacob, the princes of the race of Israel, were from the beginning. Then the Lord visited against all who afflicted the people of God, namely the adverse powers.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
