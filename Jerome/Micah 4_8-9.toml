[[commentary]]
quote='''
Some think that the squalid or dark tower, and the daughter of Jerusalem, are to be understood of the heavenly Jerusalem, which is the mother of the saints, of which the Apostle also says: You have come to Mount Zion, and to the city of the living God, the heavenly Jerusalem, which remains squalid so long as her sons are not brought back to her, and king and counselor are not in her, and pains lay hold of her as of a woman in labor, because she has given birth in vain, seeing so many sons slain.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
