[[commentary]]
quote='''
For although, following the order and connection of the sentence, many could understand that the Church was made, and also the πρόθεσις, that is, the propositio (proposition), which in the Latin language we have expressed in the neuter gender as propositum (purpose), nevertheless "wisdom made in Christ" can ring truer than the rest. For the foolishness of God is wiser than men (1 Cor. 1:25). But if, according to the mystical understandings, wisdom is said to have been made in Christ (Sir. 24), let the Arians understand that they boast in vain of that testimony in which Wisdom says that she was created and begotten and founded at the beginning of the ways of God. And certainly, according to them, she was created; she could not have been born. But if she was born, how is she said to have been both founded and created?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
