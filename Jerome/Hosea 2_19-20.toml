[[commentary]]
quote='''
And I will betroth you to me for ever; and I will betroth you to me in justice and judgment, and in mercy and in compassions; and I will betroth you to me in faith, and you will know that I am the Lord. LXX: likewise. O how great is the clemency of God! The harlot who has played the harlot with many lovers, and for her crime was handed over to the beasts, after she returns to her husband, is by no means said to be reconciled to him, but to be betrothed. And see what difference there is between the union of God and that of men: a man, when he has taken a wife, makes a woman out of a virgin, that is, not a virgin; God, even when joined to harlots, changes them into virgins, according to that which is said to the adulteress through Jeremiah: You have not called upon me as lord, or father, or prince of your virginity. Hence the Apostle too speaks to the Corinthians who believed after fornication and the worship of idols: For I have betrothed you to one husband, to present you as a chaste virgin to Christ. We ask why he repeated the word betrothal a third time. For first he says: I will betroth you to me for ever. Second: I will betroth you to me in justice and judgment, and in mercy and in compassions. And not content with this end, he adds a third as well: I will betroth you to me in faith, and you will know that I am the Lord. First he betrothed her in Abraham, or in Egypt, so that he might have an everlasting wife. Second on Mount Sinai, giving her in the betrothal gifts the justice and judgment of the law, and mercy joined to the law, so that when she sinned she would be handed over to captivity, and when she repented she would be called back to her homeland and obtain mercy. Of these betrothal gifts the psalmist sings in various places: Mercy and judgment I will sing to you, O Lord. And: Mercy and truth have met each other, and justice and peace have kissed each other. These two cups we read of in the seventy-fourth (75th) psalm: A cup in the hand of the Lord, full of unmixed wine, mixed, and he has tilted it from this into that; from the cup of justice into the cup of mercy, and again from the cup of mercy into the cup of justice. If you mark iniquities, he says, O Lord, Lord, who will endure? For with you there is propitiation. This harlot, then, who first had been joined by the vow of the bridegroom in everlasting embraces, so that she should never withdraw from the marriage bond, because she withdrew and played the harlot in Egypt, is taken again through the lawful rites; and because she transgressed this, and the prophets, the friends, as it were, of the bridegroom, who had been sent to her, were killed, last of all came the Son of God, the Lord Jesus; and when he had been crucified and had risen from the dead, she is betrothed by no means in the justice of the law, but in faith and the grace of the Gospel, so that when she has known the Only-begotten, she may know the Father also. For he himself says to Philip: Have I been with you so long a time, and you have not known me? Philip, he who has seen me has seen my Father also; how do you say: Show us the Father? Do you not believe that I am in the Father, and the Father is in me? Whoever has been betrothed in faith and has believed the Gospel will at once know that he himself is God, believing in him whom he had formerly denied.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Hosea.html'
source_title="Commentary on Hosea"
