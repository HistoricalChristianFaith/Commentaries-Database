[[commentary]]
quote='''
You have blessed, O Lord, Your land. This is spoken of the coming of the Savior. This properly according to the history; but according to the tropology, after we have spoken of the history, we shall discourse afterwards. You have blessed, O Lord, Your land. This we have said of the coming of the Savior. The land which had offended You, which had been defiled with idolatries, was saved when You came. You have blessed, O Lord, Your land. Let the sinner speak, and then, having obtained pardon: You have blessed, O Lord, Your land. Although it brought forth thistles and thorns, yet it is Your creation, and therefore it was saved. You have turned away the captivity of Jacob: of those who have believed in Christ. You have turned away the captivity of Jacob. Whoever is in sins is held captive. You have remitted the iniquity of Your people. Not on account of their works, but on account of Your mercy, You have saved Your people. You have covered all their sins, and right up to the end the psalm is about the coming of the Savior, as I said.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_017.html'
source_title="Homily 17, on Psalm 84"
