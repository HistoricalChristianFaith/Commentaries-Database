[[commentary]]
quote='''
Now Abraham believed God when he went out from his homeland into a land he did not know (Gen. 12 ff.); when he trusted that Sarah, ninety years old and barren, would give birth; and when, having heard God's promise that in Isaac his seed would be called, he offered that very Isaac as a victim, and yet did not doubt the Lord's promise. Rightly is faith reckoned as righteousness to such a man, who, having gone beyond the works of the Law, won the favor of God not by fear but by love.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Galatians.html'
source_title="Commentary on Galatians"
