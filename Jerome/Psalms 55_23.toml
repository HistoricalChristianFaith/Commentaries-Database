[[commentary]]
quote='''
The saints fill up their days, as Abraham did, who died full of days in a good old age (Gen 25). But sinners and the impious die in the half of their days, of whom the Psalmist also speaks: Men of blood and deceitful men shall not live out half their days (Ps 54 [55]:25). For they do not fulfill the works of virtue, nor are they eager to amend their faults by penance. Hence in the middle of life's course and in the darkness of their errors they will be led to Tartarus.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
