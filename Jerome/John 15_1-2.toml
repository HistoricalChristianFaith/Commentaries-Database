[[commentary]]
quote='''
The Lord too says something of the kind in the Gospel according to John: I am the true vine, and my Father is the husbandman. Every branch that abides in me and does not bear fruit, the Father will take it away; and every one that bears fruit he will cleanse, that it may bear more fruit; but if the Savior is the vine and we the branches and God the Father the husbandman, as long as we keep God's commandments we are continually cultivated, and our cultivation is a cleansing: for it is not of him who wills, nor of him who runs, but of God who shows mercy; and if, bearing fruit, we are cleansed by the Father so that we may bear more abundant fruit, it is shown that all our effort, by God's help, reaches its end and yields the fruit of fullness; but the branch that has not borne fruit will be taken away by the Father, and once it has been taken away, what the Father does with it Scripture does not say, unless perhaps separation from the body of Christ is everlasting punishment and destruction.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
