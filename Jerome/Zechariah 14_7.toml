[[commentary]]
quote='''
But after their cold and frost has gripped all sinners, there will be one day, and a perpetual one; light and darkness, day and night, by no means succeeding one another, but the Lord himself will be the light of all; of whom Isaiah says more fully: You shall have no sun, he says, for the light of the day, nor shall the rising of the moon give you light by night, but the Lord shall be your eternal light, and your God your glory. He also cries out to Jerusalem in another place: Be enlightened, be enlightened, O Jerusalem; for your light has come upon you, and the glory of your God has risen upon you. For behold, darkness and gloom shall cover the earth over the nations, but over you the Lord shall appear, and the glory of your God has risen upon you. And kings shall walk in your light, and the nations in your splendor. If gloom and darkness shall cover the earth over the nations, how in turn shall the nations walk in the splendor of the Lord? But those nations will be in darkness which the cold and frost have gripped; and those will walk in the light of the Lord which have followed the kings, the apostles and prophets, of whom it is written: The heart of the king is in the hand of the Lord. In short, at evening time, that is, the time of the darkness and sorrow of all sinners, there will be light for the saints, and one eternal day; and if it shall be known to the Lord — for he will not be able to be ignorant of the day he has created —, we must consider how he says in the Gospel that neither the angels nor the Son know that day, but the Father alone.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
