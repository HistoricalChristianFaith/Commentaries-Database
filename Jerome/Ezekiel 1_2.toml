[[commentary]]
quote='''
And more meaningfully, according to the Hebrews and the other translators, Jehoiachin's is called an 'exile', and not a 'captivity', as the Seventy translated; for he was not captured when the city was overcome, but, surrendering himself of his own will, was led to Babylon: therefore let that of Jehoiachin, that is, of Jeconiah, be called the first 'exile', and that of Zedekiah the second or final 'captivity'.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
