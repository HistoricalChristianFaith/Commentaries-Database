[[commentary]]
quote='''
Hear this, you who crush the poor and make the needy of the land fail, saying: When will the month pass, and we shall sell our wares, and the sabbath, and we shall open the grain, that we may diminish the measure and increase the shekel; and put in deceitful balances, that we may possess the needy for silver, and the poor for shoes, and sell the refuse of the grain. LXX: Hear these things, you who crush the poor in the morning, and oppress the needy from the land, who say: When will the month pass by, and we shall trade; and the sabbaths, and we shall open the granary, to make the measure smaller and the weight greater; and let us make an unjust balance, that we may possess the poor for money, and the needy for shoes, and trade in every sale. Lest the hook for fruit and the fowler's vessel should seem to have been shown in vain, and the captivity to threaten as near through these signs, the causes of God's offense are briefly described. O you, Judah, O you, Israel, hear what crimes you have committed: rising by night, instead of prayer and hymns to God, you have a zeal for oppressing, or crushing, the poor, so that, worn out with hunger and want, they may be removed from the land.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Amos.html'
source_title="Commentary on Amos"
