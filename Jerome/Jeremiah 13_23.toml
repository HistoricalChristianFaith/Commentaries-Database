[[commentary]]
quote='''
By the reading of the prophet the eunuch of Candace, the queen of Ethiopia, is made ready for the baptism of Christ. Though it is against nature, the Ethiopian does change his skin, and the leopard his spots.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_069.html'
source_title="LETTER 69.6"

[[commentary]]
quote='''
Then immediately quickening her pace, she began to move along the old road that leads to Gaza, that is, to the "power" or "wealth" of God, silently meditating on that type of the Gentiles, the Ethiopian eunuch, who, in spite of the prophet, changed his skin and, while he read the Old Testament, found the fountain of the gospel.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome/Letters/letter_108.html'
source_title="LETTER 108.11"

[[commentary]]
quote='''
If the Ethiopian can change his skin or the leopard its spots, you too will be able to do good, when you have learned evil. This testimony is used against the Church by those who desire to assert diverse natures, and they say that the blackness or the variegation of sins is so great that they cannot pass into whiteness and the beauty of a single color, not attending to what follows: and you will be able to do good, when you have learned evil. For whatever is learned is not of nature but of effort and of one's own will, which through excessive habit and love of sinning is in a manner turned into nature. But this, which is impossible for men, is possible for God: so that it is by no means the Ethiopian and the leopard who are seen to change their nature, but he who works in the Ethiopian and the leopard, as the Apostle says: I can do all things in him who strengthens me, Christ. Hence also in another place: I labored, he says, more than all of them; yet not I, but the grace of God which is in me, and: I live, now not I, but Christ lives in me. And again we read it written: What do you have that you did not receive? But if you received it, why do you glory as if you had not received it? For these reasons let not the wise man glory in his wisdom, nor the strong man in his strength, nor the rich man in his riches, nor the chaste man in his chastity, knowing that in all these things it is the power of Christ, not of those who glory in their virtues.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"

[[commentary]]
quote='''
Chus in the Hebrew tongue is interpreted 'Ethiopian,' that is, black and dark, who has such a soul as he has a body, of whom Jeremiah says: 'If the Ethiopian will change his skin, or the leopard his spots.' So this Chusi signifies his black and Ethiopian enemy, Saul. And he says this: As the Ethiopian cannot change his skin, so this man too cannot change his character. Twice he came into my hands, I could have killed him. Whose blood I could have shed, I wished rather to overcome him by kindness; but his malice cannot be conquered. For just as the Ethiopian's skin cannot be changed, so too his malice cannot be changed.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FHomilies%2520on%2520Psalms%2Fhomily_003.html'
source_title="Homily 3, on Psalm 7"
