[[commentary]]
quote='''
And Jerusalem, he says, shall be inhabited without a wall because of the multitude of men and cattle, or, with an abundance of all fruits. Some interpret men and cattle as two peoples, of the Jews and of the Gentiles: that those who were versed in the law and came to the faith of Christ are called men, while we, who after idolatry were as it were in the desert of the law and the solitude of the prophets, and have received his passion, ought to be called cattle. But others want all rational men, learned in the knowledge of the Scriptures, to be understood as men, and as cattle all the simple among the believers, and that of these it is said: Men and cattle you will save, O Lord.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"

[[commentary]]
quote='''
For before the foundations of the house of God are laid in us, and we are built up as a temple for God, and hear from the Apostle: You are the temple of God, and the Holy Spirit dwells in you; whatever good work we seemed to have, whether as rational beings, who are called men, or as simple ones, who are called beasts — For men and beasts, he says, you will save, O Lord — has no wage with God; and there are wars and discords in us, and tribulation everywhere, and we are without the peace of Christ, which, as he went to the Father, he left to the apostles; and the Lord's saying is fulfilled in us: A man's enemies are those of his own household. For every brother supplants with supplanting; and every friend walks deceitfully, and a man mocks his brother and does not speak the truth; their tongue has learned to speak a lie.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
