[[commentary]]
quote='''
The apostle Paul, wishing the Ephesians to know the more sacred things, prays for them 'that they may be filled with the wisdom and love of the Lord, and, being rooted, may be able to know and comprehend what is the breadth and length and height and depth of his riches'; and to the same he says: So then you are by no means strangers and sojourners, but fellow citizens of the saints and members of the household of God, built upon the foundation of the apostles and prophets, Jesus Christ himself being the cornerstone; in whom the whole building, fitted together, grows into a holy temple for the Lord, in whom you too are built up into a dwelling place of God in the Holy Spirit. Peter too, in almost the same words, because with the same spirit, says in his epistle: If indeed you have believed that the Lord is good. Coming to him, a living stone, rejected indeed by men, but chosen and honored by God, you yourselves too, as living stones, are built up as a spiritual house, into a holy priesthood, offering spiritual victims acceptable to God through Jesus Christ. From this it is clear that the Lord Savior, who is the true architect, tests the stones: which can be called together into the foundation of the temple, which into the middle, which into the higher places, and which, being of lesser measure or of not so solid firmness, into the wall and outside the temple, into the περιβολῇ round about — for it is a thing of no small strength nor of the least firmness to bear the stones laid on from above; whence the apostle writes to believers: Bearing one another's burdens, and in another place it is written that we ought not to take up a weight which we cannot carry —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
