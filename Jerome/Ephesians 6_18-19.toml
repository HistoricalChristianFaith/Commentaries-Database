[[commentary]]
quote='''
And at the same time the humility of the Apostle is to be admired, who asks the Ephesians to make supplications for him. For he says: With all insistence, and entreaty for all the saints and for me, so as to make mention of the saints separately, and of himself separately.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
