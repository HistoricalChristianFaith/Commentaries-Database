[[commentary]]
quote='''
And he has subjected all things under his feet, and has given him as head over all things to the Church, which is his body: the fullness of him who is filled all in all.

This seems to be contradicted by what is written elsewhere: For we do not yet see all things subjected to him. And also by this: For he must reign until he puts all enemies under his feet (1 Cor. 15:25). For if all things are not yet subjected to him, and he must reign until all things are subjected to him, how has God now subjected the universe under his feet? Especially since Paul himself also testifies in another place: But when all things have been subjected to him, then the Son himself also will be subjected to him who subjected all things to himself, that God may be all in all (1 Cor. 15:28)? Therefore either, according to foreknowledge, he mentions what is going to be as though it had already been done, in the sense we expounded above, where he says: He has blessed us with every spiritual blessing in the heavenly places in Christ. Or certainly, if it is to be understood of the past, we ought to take it thus: that even those things which are not subject to him by will serve him by the condition of their nature, for example, demons, Jews and Gentiles. For they do not serve Christ, nor are they subjected under his feet; and yet, because they were created by him for good, they are subject to his power against their will, even though they resist him by the will of free choice.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
