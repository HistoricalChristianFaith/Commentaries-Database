[[commentary]]
quote='''
Sing to the Lord, praise the Lord, for he has delivered the soul of the poor man from the hand of the most wicked! He who is poor in spirit and has not the riches which have received their consolation in this world, and of which Paul speaks: only that we should be mindful of the poor, when he has obtained vengeance from the Lord, praises the Lord in spirit and glories that he has been rescued from the hand of the most wicked. Yet all this comes about not by our merit, but by the grace of him who delivered the poor man; and he has not the riches of a pride that falls to ruin, but the humility of a poor man set free.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
