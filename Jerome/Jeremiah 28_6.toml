[[commentary]]
quote='''
And Jeremiah the prophet said to Hananiah the prophet in the eyes of the priests and in the eyes of all the people who stood in the house of the Lord, and Jeremiah the prophet said: Amen, so may the Lord do; may the Lord raise up your words which you have prophesied, that the vessels may be brought back from the house of the Lord, and all the exile of Babylon, to this place! He wishes 'to be done' what the false prophet lyingly tells — for this is what 'amen' means, a word the Lord often uses in the Gospel: amen, amen I say to you —, and for the sake of the prosperity of affairs he desires that the other rather than himself be speaking the truth. Hence another prophet too testifies, saying: would that I were not a man having the spirit, and spoke a lie rather! Jonah, on the contrary, is grieved that he has lied, and is rebuked by the Lord, being shown that a lie on the prophet's part is more useful than the ruin of so great a multitude. And lest he should seem to approve the false prophet's prophecy, he adds the truth under the example of others, without insulting the liar:
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
