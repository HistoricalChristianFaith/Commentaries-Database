[[commentary]]
quote='''
When Jerusalem was born of an Amorite father and a Hittite mother and poured forth from the womb, her navel was not cut, the navel by which fetuses are nourished in the belly, like trees and shrubs which are nourished through their roots by the hidden moisture of the earth — and just as the seed-bed of men is signified in the loins, so the genitals of women, by a decent expression, according to the custom of the Scriptures, are called the navel, on the testimony of Job who, under the figure of the dragon, speaks of the devil: His strength is in his loins, and his might in the navel of his belly; for this dragon, the ancient serpent who is called the devil and Satan and deceived the whole world, has his strength against men in the loins, against women in the navel —, and this signifies of Jerusalem that she did not at once receive the Law, nor were the beginnings of her shameful birth cut away from her, but she first lived a Gentile life; for which the Seventy translated: On the day on which you were born, they did not bind your breasts, since Holy Scripture has this custom, that for the heart it names the little breast, or the breast, and the breasts, as it sees fit for each place — the priests, in whom there ought to be doctrine, and from whose mouth they seek the Law, receive the little breast; John reclines upon the breast of the Lord, to draw the streams of wisdom from the richest fountain; the virgin's two breasts in the Song of Songs are like two fawns, twins of a gazelle, which feed among the lilies, until the day breathes and the shadows are removed; a careful mother, as soon as her baby girl is born, binds her breasts, so that they may refrain from tender swelling and keep their virginal beauty, but when she has come to the age of puberty, it is said of her: Will a bride forget her adornment, or a virgin her breast-band? —.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
