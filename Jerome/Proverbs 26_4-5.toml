[[commentary]]
quote='''
We, however, say this: that, just as in Proverbs it is written in the same place: Do not answer a fool according to his folly, lest you become like him, and again there is set down what seems to us to be contrary: Answer a fool according to his folly, lest he seem wise to himself, and both agree according to the difference of times and persons, since the fool is both despised because he does not receive wisdom, and foolish pride is knocked down by another folly, according to what the Apostle also says: I have become foolish; you compelled me, so in this place too we ought to ask why above it was said twice: The living creatures did not turn back when they advanced, and now once: The living creatures ran and returned; and there would be a problem were it not followed by: In the likeness of flashing lightning, which in the Hebrew tongue is called 'bezec', and which Symmachus translated: As the appearance of a ray of lightning.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ezekiel.html'
source_title="Commentary on Ezekiel"
