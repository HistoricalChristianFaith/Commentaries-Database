[[commentary]]
quote='''
But those who have their trust not in their own strength but in God, and always await his mercy, change their strength and go from strength to strength, and take on wings like the eagle, and hear: Your youth will be renewed like the eagle's (Ps 102 [103]:5); they run to the Lord and do not labor in their desire for him; they walk and never fail. We have often said that the old age of eagles grows green again by the changing of their feathers, and that they alone can look at the radiance of the sun and gaze with flashing eyes upon the splendor of its rays, and that by this test they prove their young, whether they are true-born. So too the saints grow young again, and, having put on an immortal body, do not feel the labor of mortals, but are caught up in the clouds to meet Christ, and, according to the Seventy, never hunger, because they have the Lord present as their food.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
