[[commentary]]
quote='''
But he who, I do not say long ago, but yesterday, worshipped idols in insult to me, and, as far as lay in him, seized tyrannical arms against me; who stripped the unhappy people of God's help, and took away the cloak as if from over the tunic; who turned against me in war all the simple among the believers and those who rest in the authority of their elders, will not the Lord drip upon him, and will not confusion seize him? But as for what we have translated, And on the contrary my people has risen up as an adversary, since the word mul signifies both the contrary and yesterday, Symmachus rendered it more plainly, so as to say: One day before, my people stood out as an enemy, in order to resolve the question, namely that God was imputing to the people not past vices but recent ones, and such as seemed to have been committed as if yesterday.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"

[[commentary]]
quote='''
And he himself, who is the true judge and speaks without perturbation, relates how in his passion Israel was contrary to him, and did this not because it could harm its Creator, but because it perpetrated everything against its own peace. Hence too the word to Jerusalem: If you knew the things that are for your peace. And with their peace lost, they flayed off their own skin, that is, they took away from themselves the help of God by which they were protected, and left their flesh as it were bare, without skin and covering, so that whatever seemed beautiful while the mercy of God covered it from above, this, when that mercy withdrew, displayed ugliness to those who saw it. And when peace and the help of God withdrew, because they had resisted the Lord, of whom it is said, The Lord who crushes wars, the Lord is his name, they could not resist their adversaries, but were defeated in every contest, nor was there anyone to crush the wars springing up against them, in respect of both persons of the enemies, either the men who led them captive, or the strength of the adversaries who daily slaughtered their souls by blasphemy.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Micah.html'
source_title="Commentary on Micah"
