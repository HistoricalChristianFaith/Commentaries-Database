[[commentary]]
quote='''
And they set up over his head his accusation written, This is Jesus, the King of the Jews. I cannot sufficiently wonder at the enormity of the thing, that having purchased false witnesses, and having stirred up the unhappy people to riot and uproar, they found no other plea for putting Him to death, than that He was King of the Jews; and this perhaps they set up in mockery.
'''
append_to_author_name=' (as quoted by Aquinas, AD 1274)'
source_url='https://historicalchristian.faith/by_father.php?file=Thomas%2520Aquinas%2FCatena%2520Aurea%2FCommentary%2520on%2520Matthew%2FChapter%252027.html'
source_title="Catena Aurea by Aquinas"

[[commentary]]
quote='''
And they set above his head the charge against him, written: This is Jesus the king of the Jews. I cannot sufficiently wonder, as the greatness of the matter deserves, that after false witnesses had been bought and the unhappy people had been stirred up to sedition and clamor, he found no other cause for putting him to death than that he was king of the Jews. And they perhaps did this mocking and laughing. But Pilate answered them, even against their will: What I have written, I have written. Whether you will or not, O Jews, the whole crowd of the Gentiles has answered you: Jesus is king of the Jews, that is, the commander of those who believe and confess.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Matthew.html'
source_title="Commentary on Matthew"
