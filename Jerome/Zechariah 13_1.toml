[[commentary]]
quote='''
On that day there shall be a fountain open to the house of David and to the inhabitants of Jerusalem, for the washing of the sinner and of the menstruous woman. LXX: On that day every place shall be opened in the house of David and to the inhabitants of Jerusalem, both for transformation and for sprinkling. Of this fountain, which goes forth from the house of David, it is written also in the prophet Ezekiel that a fountain bursts forth in the house of the Lord and grows into a river, which is called the water of remission and pardon, and goes on to the wilderness and to the sea which is now called the Dead Sea, and gives life to all the fish, and on either bank of the river trees of various kinds rise up, always abounding with new fruits month by month. And so that we may know that the house, that is, the temple of God, is itself the house of David, which in Ezekiel is called the house of God and in Zechariah the house of David, this fountain going forth from the house of God is referred to the Church and to the knowledge of the Scriptures, so that we may all be reborn in Christ and our sins may be forgiven us in the water of baptism. Nothing is more unclean than a menstruous woman, who makes unclean whatever she touches, and yet her filth shall be washed away by the baptism of Christ. For the washing of sins and of the menstruous woman the LXX translated transformation and sprinkling, because we pass over from the law to the Gospel, from the letter to the spirit, from the shadow to the truth, and things future and eternal succeed in place of things brief and present. And the sprinkling signifies the blood of the Lord, of which the apostle Peter also speaks: Grace to you, and peace be multiplied, unto obedience and the sprinkling of the blood of Jesus Christ, and again: Knowing that you were redeemed not with corruptible things, silver and gold, but with the precious blood as of a lamb unspotted and most pure; whoever has been sprinkled and redeemed with it will be able to say with the prophet: You shall sprinkle me, O Lord, with hyssop, and I shall be cleansed; you shall wash me, and I shall be made whiter than snow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
