[[commentary]]
quote='''
God promises also to set in it the judgment of the weight: For the Father judges no one, but has given all judgment to the Son (John 5:22). And righteousness, or mercy, in the measure, so that he may render to each according to his works, and temper righteousness and mercy each by the other, according to what we read in the psalms too: Mercy and truth have met each other: righteousness and peace have kissed (Ps 84 [85]:11). Your hope also, he says, and your lie, that is, the devil, the father of every lie, the hail of my punishments shall overthrow.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Isaiah.html'
source_title="Commentary on Isaiah"
