[[commentary]]
quote='''
Woe to the shepherds who destroy and tear the flock of my pasture — or O shepherds, who destroy and scatter the sheep of my pasture —, says the Lord. Therefore thus says the Lord, the God of Israel, to the shepherds who feed my people: You have scattered my flock, you have driven them out and have not visited them; behold, I will visit upon you the wickedness of your pursuits, says the Lord. And I will gather the remnant of my flock from all the lands to which I shall have driven them out there, and I will bring them back to their fields — or I will restore them to their pastures — and they shall grow and be multiplied. And I will raise up shepherds over them and they shall feed them; they shall fear no more and shall not be dismayed, and none shall be sought from the number, says the Lord. The prophetic discourse is addressed to the shepherds, or concerns the shepherds; and since we read it written of Jeconiah, the next-to-last king of Judea, who was of the stock of David: O land, land, land, hear the words of the Lord! Write this man down as rejected — or barren — and there shall not be of his seed a man who shall sit upon the throne of David, and all hope of the Jewish kingdom had been cut off, the discourse passes over to the princes of the Church, and, the synagogue with its shepherds being abandoned and condemned, it is addressed to the apostles, of whom it is said: and I will raise up shepherds over them and they shall feed them; they shall fear no more and shall not be dismayed, and none shall be sought from the number, says the Lord. For the apostles will feed the flock of the Church confidently and without any fear, and the remnant of the people of Israel will be saved from all the lands and will be brought back to their fields or to their pastures, and they will grow and be multiplied. But upon the evil shepherds, the scribes and Pharisees, the Lord will visit because of the wickedness of their pursuits. We can also understand this according to tropology of the princes of the Church who nevertheless do not rule the sheep of the Lord worthily: that, these being cast off and condemned, the people may be saved, handed over to others who have proved worthy, and the remnant may be saved. Those shepherds destroy the sheep who teach heresy; those tear and scatter them who make schisms; those drive them out who separate them from the Church against righteousness; those do not visit them who withhold their hand from the penitent. On all these the Lord will have mercy, restoring to them their former pastures and taking away the evil shepherds.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
