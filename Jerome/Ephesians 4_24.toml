[[commentary]]
quote='''
But when we have been renewed in the spirit, which is the spirit of our mind, then we shall put on the new man, who was created according to God. And this, I think, is in other words the very same thing that is said in another place: Put on Christ Jesus (Rom. 13:14). For this is the new man, with whom all of us who believe ought to be clothed and arrayed. For what in the man who was assumed by our Savior was not new? His conception, his nativity, his birth, his infancy, his teaching, his life, his mighty works: and at the last, the cross and the passion, in which he despoiled the principalities and made a show of the opposing powers: and the resurrection too, and the ascent into heaven. This man, then, was truly created in righteousness and holiness of truth: because he was true God, the Son of the true God, and in him all religion and righteousness was fulfilled by the truth of God. Whoever, therefore, is able to imitate his way of life and to express in himself all the virtues, and is meek, as he was meek and humble of heart, and lays down his life for his friends, as he laid down his for his sheep; who, when beaten, does not answer back, when cursed, does not curse in return, but overcomes pride by humility: this man has put on the new man, and can say with the Apostle: But I live, now not I, but Christ lives in me (Gal. 2:20). And: Be imitators of me, as I also am of Christ (1 Cor. 11:1). He can also take up the words of John: He who says that he believes in Christ ought himself also to walk just as he walked (1 John 2:6). But what he says, Who was created according to God, does not sound the same in the Latin tongue as in the Greek. For with us, "creation" (creatio) is used of generation or birth; but among the Greeks, under the name of creation, the word for making and founding is understood. And what among us is "founding" (conditio), this among the Greeks sounds as "creation." Hence also the heresy that slanders the nativity of Christ wrests to its use the example of Solomon: The Lord created me the beginning of his ways (Prov. 8:22). It must be considered, therefore, that "creation" and "founding" are never named except in the case of great works. For example, the world was created; a city was founded; but a house, however great it may be, is rather said to have been built than founded or created. For in great works and makings the word "creation" is taken up. From this it is to be noted that this new man, who was created according to God in Christ, is a great work of God and stands out beyond the other creatures: since he is said to have been founded in such a way as the world was, and to have been created as the beginning of the ways of God and at the outset of all the elements.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
