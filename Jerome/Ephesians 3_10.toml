[[commentary]]
quote='''
The cross of Christ, therefore, has profited not only us, but also the angels and all the virtues in heaven, and has opened a mystery which they did not know before. Accordingly they marvel at God returning to heaven with his body, and say: Who is this who comes up from Edom, his garments tawny from Bozrah, so beautiful in a white robe (Isa. 63:1). And in another place: Who is this king of glory? The Lord of virtues, he is the king of glory (Ps. 23:10). Let us not think, then, that in the Church there is a simple faith, but that the wisdom is manifold and multifarious, so that it is not only varied, but marked out by much variety. You look upon the cradle of Christ: look at the heaven as well. You behold an infant crying in the manger: but listen at the same time to the angels praising. Herod persecutes, but the Magi worship (Matt. 2). The Pharisees do not know him, but the star points him out. He is baptized by a servant: but the voice of God thundering from above is heard (Matt. 3). He is plunged in the waters: but the dove descends, or rather the Spirit in the dove (ibid., 16). He comes to his passion, and fears to suffer; he wishes the cup to pass, and he rebukes Peter because he feared the cup. What is more prudent than this foolishness, more distinct than this variety, more obscure than this wisdom, which God made in Christ Jesus our Lord?
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Ephesians.html'
source_title="Commentary on Ephesians"
