
[[commentary]]
quote='''
And those who said in Babylon: By the rivers of Babylon, there we sat and wept, when we remembered Zion; on the willows in the midst of it we hung up our instruments, once they have returned to Jerusalem, let them take up psalm and timbrel, and sing in the Church of the Lord; and let those who through greater sins had been far from Judea come, with a most true confession too, and through each of their advances build the house of the Lord; and then let all with one mind know that the Lord Almighty has sent the prophet to them. And all that has been promised shall come to pass, if they are willing to hear the Lord, and, having done repentance, remain in good works.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Zechariah.html'
source_title="Commentary on Zechariah"
