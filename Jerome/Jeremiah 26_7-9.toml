[[commentary]]
quote='''
And the priests and the prophets — or false prophets — and all the people heard Jeremiah speaking these words in the house of the Lord. And when Jeremiah had finished speaking all that the Lord had commanded him to speak to all the people, the priests and the prophets — or false prophets — and all the people seized him, saying: Let him die the death, because he has prophesied in the name of the Lord, saying: This house shall be like Shiloh, and this city shall be made desolate, so that there is no inhabitant. The priests and the prophets, whom the Seventy more plainly translated as 'false prophets', are angry with Jeremiah because he preaches true things, and because, with the temple overthrown and the city deserted, their religion would perish, and the profits coming from religion; therefore they seize him and, with the people consenting with them, destine him for death, because he had said in the name of the Lord: This house shall be like Shiloh, and the city shall be made desolate, so that there is no inhabitant. If, then, at any time, because of the commandments of the Lord and the truth of the faith, either priests or false prophets or a deceived people are angry with us, let us not greatly care, but let us carry out the sentence of God, pondering in our mind by no means present evils, but future goods.
'''
source_url='https://historicalchristian.faith/by_father.php?file=Jerome%2FCommentary%2520on%2520Jeremiah.html'
source_title="Commentary on Jeremiah"
